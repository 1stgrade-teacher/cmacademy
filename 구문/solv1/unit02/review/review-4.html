큰 도움이 될 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01토파즈의 정의와 점성술적 배경</div><ul><li>토파즈는 11월의 탄생석이며, 과거에는 행성의 영향을 받는다고 믿어졌다.</li><li>11월 탄생석(birthstone)으로서의 상징</li><li>토성(Saturn)과 화성(Mars) 행성의 영향 아래 있다고 믿음</li><li>핵심 키워드: 탄생석(birthstone), 행성(planets)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02중세 시대의 주술적 효능</div><ul><li>12세기 사람들은 토파즈가 악령을 퇴치하는 강력한 힘을 지녔다고 믿었다.</li><li>악령(evil spirits)을 막는 부적(charm)으로 사용</li><li>목에 걸면 악한 힘(evil powers)을 몰아낼 수 있다고 주장함</li><li>핵심 키워드: 악령(evil spirits), 부적(charm)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03문화권별 신념과 특수 능력</div><ul><li>힌두교, 기독교, 그리고 로마인들은 각기 다른 방식으로 토파즈의 능력을 해석했다.</li><li>힌두교: 차가운 성질의 돌이 갈증(thirst)을 예방함</li><li>기독교: 명예(honor)를 상징하는 보석으로 간주</li><li>15세기 로마인: 바람을 잠재우고 악령을 파괴함</li><li>핵심 키워드: 힌두교 전통(Hindu tradition), 명예(honor)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">under the influence of</td><td class=\"m\">~의 영향을 받는, ~의 지배하에 있는</td></tr><tr><td class=\"w\">charm</td><td class=\"m\">부적, 매력</td></tr><tr><td class=\"w\">evil</td><td class=\"m\">사악한, 해로운</td></tr><tr><td class=\"w\">drive out</td><td class=\"m\">~을 내쫓다, ~을 몰아내다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">according to</td><td class=\"m\">~에 따르면, ~에 의하여</td></tr><tr><td class=\"w\">keep away</td><td class=\"m\">~을 물리치다, ~을 가까이 못 하게 하다</td></tr><tr><td class=\"w\">view</td><td class=\"m\">여기다, 간주하다</td></tr><tr><td class=\"w\">calm</td><td class=\"m\">진정시키다, 가라앉히다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">토파즈는, 노란 보석인,</span><span class=\"en\"><b>The topaz, a yellow gemstone,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">탄생석이다</span><span class=\"en\"><b>is the birthstone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">11월에 태어난 사람들의</span><span class=\"en\"><b>of <span class=\"grammar-hl\">those born in November</span>.</b></span></div></div><div class=\"lec-sent-ko\">토파즈는 노란색의 보석 원석으로 11월에 태어난 사람들의 탄생석이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 토파즈라는 소재를 처음 제시하며, 이것이 어떤 보석인지 정보를 제공하여 독자의 이해를 돕는 도입부 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">those born in November (과거분사): born이 those를 수식(= 11월에 태어난 사람들). 명사(those) + p.p.(born) 형태로 축약된 관계절 구조임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 믿었다</span><span class=\"en\"><b>People <span class=\"grammar-hl\">believed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 돌이 영향을 받는다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> the stone was under the influence</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행성 토성과 화성의</span><span class=\"en\"><b>of the planets Saturn and Mars.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 그 돌이 토성과 화성의 영향을 받는다고 믿었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 소개한 토파즈에 대해 과거 사람들이 가졌던 신비로운 관점을 구체적으로 서술하며 글의 전반적인 주제인 &#39;토파즈의 영적인 의미&#39;를 본격적으로 풀어냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">believed that 명사절 접속사 that: believe의 목적어 역할을 하는 명사절을 이끄는 접속사.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">under the influence of</td><td class=\"m\">~의 영향을 받는, ~의 지배하에 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">12세기에,</span><span class=\"en\"><b>In the 12th century,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">토파즈는 사용되었다</span><span class=\"en\"><b>topaz <span class=\"grammar-hl\">was used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부적으로서</span><span class=\"en\"><b>as a charm</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">악령에 대항하는,</span><span class=\"en\"><b>against evil spirits,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 주장되었다</span><span class=\"en\"><b>and it <span class=\"grammar-hl\">was claimed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">악한 힘들이 쫓겨날 수 있다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> evil powers <span class=\"grammar-hl\">could be driven out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">토파즈를 걺으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">by hanging</span> a topaz</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람의 목 주변에</span><span class=\"en\"><b>around a person’s neck.</b></span></div></div><div class=\"lec-sent-ko\">12세기에, 토파즈는 악령을 물리치는 부적으로 사용되었고, 그것을 목에 걸면 악한 힘을 쫓아버릴 수 있다고들 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2문장에서 언급된 일반적인 믿음을 12세기라는 특정 시기로 좁혀 구체적인 활용 사례를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was used (수동태): be동사(was)+p.p.(used) 구조. use는 타동사인데 목적어가 없어서 수동구조 was used 형태로 쓴다. 기본구조: use + O (사용하다).</div><div class=\"lec-gr-item\">was claimed that (수동태): be동사(was)+p.p.(claimed) 구조. claim은 타동사인데 목적어가 없어서 수동구조 was claimed 형태로 쓴다. 기본구조: claim + that절 (주장하다).</div><div class=\"lec-gr-item\">could be driven out (수동태): be동사(be)+p.p.(driven) 구조. drive는 타동사인데 목적어가 없어서 수동구조 be driven 형태로 쓴다. 기본구조: drive + O + out (내쫓다).</div><div class=\"lec-gr-item\">by hanging (동명사): 전치사 by의 목적어로 쓰인 명사적 기능의 -ing.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">charm</td><td class=\"m\">부적, 매력</td></tr><tr><td class=\"w\">evil</td><td class=\"m\">사악한, 해로운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한,</span><span class=\"en\"><b>Also,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">힌두교 전통에 따르면,</span><span class=\"en\"><b><span class=\"grammar-hl\">according to</span> Hindu tradition,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 돌의 중심부는</span><span class=\"en\"><b>the stone’s core</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">차갑다</span><span class=\"en\"><b>is cold.</b></span></div></div><div class=\"lec-sent-ko\">또한, 힌두교 전통에 따르면, 그 돌의 중심은 차갑다고 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 미신적인 효능에 이어, 다른 문화권에서 토파즈를 바라보는 또 다른 물리적 특성 및 관점을 추가로 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">according to (관용표현): ~에 따르면이라는 의미의 전치사구.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">according to</td><td class=\"m\">~에 따르면, ~에 의하여</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 그것이 착용된다면</span><span class=\"en\"><b><span class=\"grammar-hl\">If it is worn</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심장 위쪽으로,</span><span class=\"en\"><b>above the heart,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 막아준다</span><span class=\"en\"><b>it keeps away</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갈증을</span><span class=\"en\"><b>thirst.</b></span></div></div><div class=\"lec-sent-ko\">그것을 심장 위쪽으로 걸면, 갈증을 막아준다고 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4문장에서 언급한 힌두교의 믿음이 구체적으로 어떤 효과를 기대하게 하는지 그 결과를 덧붙여 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If it is worn (수동태): be동사(is)+p.p.(worn) 구조. wear는 타동사인데 목적어가 없어서 수동구조 is worn 형태로 쓴다. 기본구조: wear + O (착용하다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기독교 전통은 토파즈를 여겼다</span><span class=\"en\"><b>Christian tradition viewed the topaz</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상징으로</span><span class=\"en\"><b>as a symbol</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">명예의,</span><span class=\"en\"><b>of honor,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반면 15세기 로마인들은 생각했다</span><span class=\"en\"><b>while the <span class=\"grammar-hl\">15th-century</span> Romans thought</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 돌이 바람을 잠재우고</span><span class=\"en\"><b>that the stone could calm the winds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">악령들을 없앨 수 있다고</span><span class=\"en\"><b>and destroy evil spirits.</b></span></div></div><div class=\"lec-sent-ko\">기독교 전통은 토파즈를 명예의 상징으로 여겼으며, 한편, 15세기 로마인들은 그 돌이 바람을 잠재우고 악령을 없애줄 수 있다고 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다양한 문화권과 시대에 따른 토파즈의 상징성을 나열하며, 앞서 언급한 내용들을 종합하여 토파즈가 인류 역사에서 얼마나 다채로운 의미로 소비되었는지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">15th-century (관용표현): 형용사처럼 명사를 수식하는 복합어 구조.</div><div class=\"lec-gr-item\">thought the stone could calm 5형식(SVOC) 구조: 주어(the Romans) + 동사(thought) + 목적어(the stone) + 목적보어(could calm). 목적어의 동작을 설명하는 절 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evil</td><td class=\"m\">사악한, 해로운</td></tr><tr><td class=\"w\">view</td><td class=\"m\">여기다, 간주하다</td></tr><tr><td class=\"w\">calm</td><td class=\"m\">진정시키다, 가라앉히다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>토파즈는 11월의 탄생석으로, 예로부터 여러 문화권에서 신비로운 힘을 가진 보석으로 여겨졌다.</li><li>과거 사람들은 토파즈가 행성의 영향을 받으며 악령을 쫓거나 갈증을 해소한다고 믿었다.</li><li>문화와 시대에 따라 토파즈는 명예의 상징이기도 했고, 자연을 조절하거나 악을 물리치는 부적으로도 사용되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Topaz has been historically valued for its perceived power to ward off evil spirits, and it has served as a diverse symbol of honor or physical well-being across various cultures.</div>\n              <div class=\"lec-final-sum-ko\">토파즈는 악령을 물리치는 힘이 있다고 믿어져 역사적으로 귀하게 여겨졌으며, 여러 문화권에서 명예나 신체적 안녕을 상징하는 다양한 용도로 사용되었다.</div></div></div>"],"segs":[[{"audio":"./review-4_audio/1.mp3","hl":null}],[{"audio":"./review-4_audio/2.mp3","hl":null}],[{"audio":"./review-4_audio/3.mp3","hl":null},{"audio":"./review-4_audio/4.mp3","hl":"stage-0"},{"audio":"./review-4_audio/5.mp3","hl":"stage-1"},{"audio":"./review-4_audio/6.mp3","hl":"stage-2"}],[{"audio":"./review-4_audio/7.mp3","hl":null}],[{"audio":"./review-4_audio/8.mp3","hl":"main"},{"audio":"./review-4_audio/9.mp3","hl":"meaning"},{"audio":"./review-4_audio/10.mp3","hl":"grammar"}],[{"audio":"./review-4_audio/11.mp3","hl":"main"},{"audio":"./review-4_audio/12.mp3","hl":"meaning"},{"audio":"./review-4_audio/13.mp3","hl":"grammar"}],[{"audi
