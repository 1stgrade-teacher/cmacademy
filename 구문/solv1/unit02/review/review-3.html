U5/Kjn9f1P/6qjDnAO9ec919snO4A5yAeeOhxxlrMckZHPDDgk8AYzu4JBXg7cA/e65aV7arXb71svn+Yfp8v68yQuq8HOO4H8yeBxjIz0Jxz1NZpM7iOcDr/AE6LjAHXoOvHSgEZ4I6DjOfYd8f55qJlwHY/MM/3lztA4Gcc5wDjkDgggEldoJRaaet1r81b9PUfS6TbXTdNXitb9ddNddb9D//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Legal Challenges of Coexisting with Protected Wildlife at Home<small>보호받는 야생동물과 가정 내 공존이 겪는 법적 난관</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적인 내용에 앞서, 우리와 공존하는 동물을 보호하기 위한 야생동물 보호법(Wildlife Protection Act)에 대해 알면 도움이 돼요. 스코틀랜드와 같은 지역에서는 생태계의 균형을 유지하고 멸종 위기종을 지키기 위해 특정 동물을 법적으로 엄격히 보호하는데, 지문에 등장하는 박쥐처럼 번식기(Breeding Season)에는 이동이나 제거를 법으로 금지하기도 합니다. 마치 우리가 아기 새가 둥지를 떠날 때까지 조심스레 지켜봐 주는 것과 비슷한 원리인데, 이는 새끼들이 스스로 생존할 수 없는 시기에 어미와 떨어지면 죽을 확률이 매우 높기 때문이죠. 이처럼 인간의 주거 편의와 생태계 보호(Ecosystem Conservation)가 충돌할 때, 법은 종종 동물의 생존권에 우선순위를 두기도 합니다. 그래서 사람과 동물이 같은 공간을 공유하며 생기는 갈등을 이해할 때, 이러한 법적 보호 장치와 생태적 배려가 어떤 배경에서 존재하는지 먼저 생각해보면 지문의 상황을 훨씬 더 깊이 있게 공감하며 읽으실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 발생</div><ul><li>스코틀랜드의 한 가정집에 약 300마리의 박쥐 떼가 무단으로 침입하여 거주하고 있다.</li><li>300마리에 달하는 박쥐 가족의 점거 (a family of nearly 300 bats)</li><li>거주자들의 공포감과 수면 부족 (terrified, hardly sleep)</li><li>핵심 키워드: 야생동물 규제(wildlife regulations)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02법적 제약</div><ul><li>법적인 보호 조치로 인해 거주자들은 즉각적으로 박쥐를 제거할 수 없는 상황이다.</li><li>스코틀랜드 법에 의한 박쥐 보호 (protected by law)</li><li>새끼 박쥐들의 생존을 위한 이전 금지 (young would die)</li><li>핵심 키워드: 가을(autumn)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03거주자의 피해</div><ul><li>박쥐들이 실내를 자유롭게 날아다니면서 거주자들은 일상생활에서 큰 위협을 겪고 있다.</li><li>박쥐와의 직접적인 충돌 위험 (flew into my face)</li><li>예기치 못한 사고 발생 (fell down in the shower)</li><li>밤마다 발생하는 소음으로 인한 불면 (noise of them flying around)</li><li>핵심 키워드: 공포 영화(horror movie)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">move into</td><td class=\"m\">~으로 이사 오다, ~에 자리를 잡다</td></tr><tr><td class=\"w\">be allowed to</td><td class=\"m\">~하는 것이 허용되다, ~해도 좋다</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~으로 인한</td></tr><tr><td class=\"w\">wildlife</td><td class=\"m\">야생 동물</td></tr><tr><td class=\"w\">regulation</td><td class=\"m\">규정, 규제</td></tr><tr><td class=\"w\">be terrified</td><td class=\"m\">겁에 질리다, 공포에 떨다</td></tr><tr><td class=\"w\">hardly</td><td class=\"m\">거의 ~아니다, 간신히</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get ~ out of</td><td class=\"m\">~를 ~에서 꺼내다, ~를 ~에서 내쫓다</td></tr><tr><td class=\"w\">protected</td><td class=\"m\">보호받는, 지켜지는</td></tr><tr><td class=\"w\">fly into</td><td class=\"m\">~로 날아 들어오다, ~와 세게 충돌하다</td></tr><tr><td class=\"w\">straight</td><td class=\"m\">곧바로, 똑바로</td></tr><tr><td class=\"w\">fall down</td><td class=\"m\">넘어지다, 쓰러지다</td></tr><tr><td class=\"w\">fly past</td><td class=\"m\">~를 스쳐 지나가다, ~ 옆으로 날아가다</td></tr><tr><td class=\"w\">be kept awake</td><td class=\"m\">잠을 자지 못하게 되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">300마리에 가까운 박쥐 떼가</span><span class=\"en\"><b>A family of nearly 300 bats</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스코틀랜드의 한 집으로 옮겨왔는데,</span><span class=\"en\"><b>has moved into a Scottish home,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 집에 사는 사람들은</span><span class=\"en\"><b>but <span class=\"grammar-hl\">the people who live there</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 박쥐들을 없앨 수가 없다</span><span class=\"en\"><b><span class=\"grammar-hl\">are not allowed to remove</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가을까지는</span><span class=\"en\"><b>until autumn,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야생동물 보호 규정 때문에</span><span class=\"en\"><b>due to wildlife regulations.</b></span></div></div><div class=\"lec-sent-ko\">300마리에 가까운 박쥐 떼가 스코틀랜드의 한 집으로 옮겨왔는데, 그 집에 사는 사람들은 야생동물 보호 규정 때문에 가을까지는 그 박쥐들을 없앨 수가 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로서 박쥐가 가정집에 침입했다는 사건과, 법적 규제로 인해 즉시 해결할 수 없다는 갈등 상황을 동시에 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the people who live there (관계대명사): 주격 관계대명사 who가 이끄는 절이 앞의 선행사 the people을 수식하며, 절 내부에서 who는 주어 역할을 한다.</div><div class=\"lec-gr-item\">are not allowed to remove (수동태): be동사(are)+p.p.(allowed) 구조. allow는 타동사로 allow+O+toV(5형식) 구조인데 목적어가 주어로 올라가 수동구조 are allowed가 되고, toV는 그대로 남는다. allow는 타동사인데 목적어가 없어서 수동구조로 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~으로 인한</td></tr><tr><td class=\"w\">wildlife</td><td class=\"m\">야생 동물</td></tr><tr><td class=\"w\">regulation</td><td class=\"m\">규정, 규제</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Bill과 Carina Doherty 부부는 말한다</span><span class=\"en\"><b>Bill and Carina Doherty say</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 공포에 질렸다고,</span><span class=\"en\"><b>they are terrified,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특히 밤에는</span><span class=\"en\"><b>especially <span class=\"grammar-hl\">at night</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">박쥐들이 그들의 침실로 날아드는.</span><span class=\"en\"><b><span class=\"grammar-hl\">when the bats fly into their bedroom</span>.</b></span></div></div><div class=\"lec-sent-ko\">Bill Doherty와 Carina Doherty 부부는 무섭다고 말한다. 특히 박쥐들이 자신의 침실로 날아드는 밤에는.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 일반적인 사실을 바탕으로, 실제 거주자가 겪고 있는 구체적인 공포감과 피해 상황을 상세히 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">at night when the bats fly into their bedroom (관계부사): 관계부사 when이 이끄는 절이 앞의 선행사 night를 수식하며, when 뒤에는 주어(the bats)+동사(fly)가 갖춰진 완전한 절이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fly into</td><td class=\"m\">~로 날아 들어오다, ~와 세게 충돌하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 거의 잠을 잘 수 없어서</span><span class=\"en\"><b>They can hardly sleep at all,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">박쥐를 집에서 몰아내고 싶어 한다.</span><span class=\"en\"><b>and they want to <span class=\"grammar-hl\">get the bats out of their home</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 거의 잠을 잘 수 없어서 박쥐를 집에서 몰아내고 싶어 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 박쥐와의 동거로 인해 일상생활이 파괴된 거주자들의 절박한 심정과 그들이 원하는 해결책을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">get the bats out of their home 5형식(SVOC) 구조: get(사역/이동 동사) + the bats(목적어) + out of their home(부사구/보어) 구조로, 목적어가 ~하게 만들다/이동시키다라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hardly</td><td class=\"m\">거의 ~아니다, 간신히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 박쥐들은 스코틀랜드에서 법으로 보호받는다,</span><span class=\"en\"><b>But the bats <span class=\"grammar-hl\">are protected by law</span> in Scotland,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것들은 아직 옮겨질 수 없다</span><span class=\"en\"><b>and they <span class=\"grammar-hl\">cannot be moved</span> yet</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새끼들이 죽을 것이기 때문에.</span><span class=\"en\"><b>because their young would die.</b></span></div></div><div class=\"lec-sent-ko\">하지만 박쥐는 스코틀랜드에서 법으로 보호되며, 새끼가 죽기 때문에 아직 다른 곳으로 옮겨질 수가 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 거주자의 요구를 거부해야만 하는 법적·생태적 근거를 설명하며, 왜 인간의 불편함보다 박쥐의 생존이 우선시되는지 이유를 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are protected by law (수동태): be동사(are)+p.p.(protected) 구조. protect는 타동사인데 목적어가 없어서 수동구조 are protected 형태로 쓴다. 기본구조: protect A(O) (A를 보호하다)</div><div class=\"lec-gr-item\">cannot be moved (수동태): be동사(be)+p.p.(moved) 구조. move는 타동사인데 목적어가 없어서 수동구조 be moved 형태로 쓴다. 기본구조: move A(O) (A를 이동시키다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">protected</td><td class=\"m\">보호받는, 지켜지는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Doherty 부인은 기자들에게 말했다,</span><span class=\"en\"><b>Mrs. Doherty told reporters,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“집에서의 우리의 삶은</span><span class=\"en\"><b>“Our life in the house</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공포영화처럼 되어버렸다.</span><span class=\"en\"><b><span class=\"grammar-hl\">has become</span> like a horror movie.</b></span></div></div><div class=\"lec-sent-ko\">Doherty 부인은 기자들에게 “집에서 사는 게 공포영화처럼 되어버렸어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 피해 사례를 직접적인 인용구를 통해 전달함으로써, 부부가 겪는 고통이 단순히 불편한 수준을 넘어 심리적인 공포의 단계임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has become (현재완료): 조동사 has + p.p.(become)를 사용하여 과거의 상태가 현재까지 이어짐을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 어젯밤 거실 문을 열었다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">opened</span> the living room door last night</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것들 중 한 마리가</span><span class=\"en\"><b>and one of them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">곧장 내 얼굴로 날아들었다.</span><span class=\"en\"><b>flew straight into my face.</b></span></div></div><div class=\"lec-sent-ko\">어젯밤에 거실 문을 열었는데 박쥐 한 마리가 곧장 내 얼굴로 날아들었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;공포 영화&#39;라는 표현이 과장이 아님을 입증하는 구체적인 일화를 제시하여 사건의 심각성을 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">opened (과거시제): 과거의 특정 시점에 발생한 동작을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">straight</td><td class=\"m\">곧바로, 똑바로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내 남편은 샤워 중에 넘어졌다</span><span class=\"en\"><b>My husband fell down in the shower</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 마리가 그의 머리 근처를 지나 날아갔을 때.</span><span class=\"en\"><b>when one <span class=\"grammar-hl\">flew past</span> his head.</b></span></div></div><div class=\"lec-sent-ko\">남편은 샤워하다가 박쥐가 머리를 지나 날아가는 바람에 넘어졌고요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 박쥐로 인해 물리적인 안전까지 위협받고 있는 상황을 추가 사례로 들어 인간 거주자의 피해를 더욱 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">flew past (관용표현): fly past는 ~를 지나쳐 날아가다라는 의미의 숙어로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">게다가,</span><span class=\"en\"><b>Plus,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 밤에 잠을 자지 못한다</span><span class=\"en\"><b>we <span class=\"grammar-hl\">are kept awake</span> at night</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 날아다니는 소리 때문에.”</span><span class=\"en\"><b>by the noise of them <span class=\"grammar-hl\">flying around</span>.”</b></span></div></div><div class=\"lec-sent-ko\">게다가, 박쥐들이 날아다니는 소리 때문에 밤에 잠도 못자요.”하고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 신체적인 충돌 외에도 박쥐들이 지속적으로 발생시키는 소음이 거주자의 일상을 어떻게 방해하고 있는지 나열하며 결론을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are kept awake (수동태): be동사(are)+p.p.(kept) 구조. keep은 타동사로 keep+O+C(5형식) 구조인데 목적어가 주어로 올라가 수동구조 are kept가 되고, 목적보어(awake)는 그대로 남는다. keep은 타동사인데 목적어가 없어서 수동구조로 쓴다.</div><div class=\"lec-gr-item\">flying around (현재분사): the noise를 수식하며, 박쥐들이 주변을 날아다니는 동작 상태를 설명하는 형용사적 기능을 한다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>스코틀랜드의 한 가정집에 박쥐 300마리가 들어와 주민들이 큰 고통을 겪고 있다.</li><li>주민들은 즉시 박쥐를 쫓아내길 원하지만, 야생동물 보호법에 따라 가을까지 기다려야 한다.</li><li>주민들은 박쥐와의 예기치 못한 동거로 인해 불면과 공포, 신체적 위협을 호소하고 있다.</li><li>법적 보호와 인간의 거주권 사이에서 발생하는 갈등 상황을 보여주는 사례이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Protected by law, a colony of bats has caused significant distress to residents, yet the family must endure the situation until autumn due to wildlife regulations.</div>\n              <div class=\"lec-final-sum-ko\">법의 보호를 받는 박쥐 군집으로 인해 거주자들이 큰 고통을 겪고 있지만, 야생동물 규정으로 인해 그 가족은 가을까지 상황을 감수해야 한다.</div></div></div>"],"segs":[[{"audio":"./review-3_audio/1.mp3","hl":null}],[{"audio":"./review-3_audio/2.mp3","hl":null}],[{"audio":"./review-3_audio/3.mp3","hl":null},{"audio":"./review-3_audio/4.mp3","hl":"stage-0"},{"audio":"./review-3_audio/5.mp3","hl":"stage-1"},{"audio":"./review-3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./review-3_audio/7.mp3","hl":null}],[{"audio":"./review-3_audio/8.mp3","hl":"main"},{"audio":"./review-3_audio/9.mp3","hl":"meaning"},{"audio":"./review-3_audio/10.mp3","hl":"grammar"}],[{"audio":"./review-3_audio/11.mp3","hl":"main"},{"audio":"./review-3_audio/12.mp3","hl":"meaning"},{"audio":"./review-3_audio/13.mp3","hl":"grammar"}],[{"audio":"./review-3_audio/14.mp3","hl":"main"},{"audio":"./review-3_audio/15.mp3","hl":"meaning"},{"audio":"./review-3_audio/16.mp3","hl":"grammar"}],[{"audio":"./review-3_audio/17.mp3","hl":"main"},{"audio":"./review-3_audio/18.mp3","hl":"meaning"},{"audio":"./review-3_audio/19.mp3","hl":"grammar"}],[{"audio":"./review-3_audio/20.mp3","hl":"main"},{"audio":"./review-3_audio/21.mp3","hl":"meaning"},{"audio":"./review-3_audio/22.mp3","hl":"grammar"}],[{"audio":"./review-3_audio/23.mp3","hl":"main"},{"audio":"./review-3_audio/24.mp3","hl":"meaning"},{"audio":"./review-3_audio/25.mp3","hl":"grammar"}],[{"audio":"./review-3_audio/26.mp3","hl":"main"},{"audio":"./review-3_audio/27.mp3","hl":"meaning"},{"audio":"./review-3_audio/28.mp3","hl":"grammar"}],[{"audio":"./review-3_audio/29.mp3","hl":"main"},{"audio":"./review-3_audio/30.mp3","hl":"meaning"},{"audio":"./review-3_audio/31.mp3","hl":"grammar
