\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01성년의 기준</div><ul><li>문화권마다 성인이 되는 기준과 시기가 서로 다르게 정의된다.</li><li>한국: 21세가 되는 해 5월 셋째 월요일(third Monday in May)</li><li>서구권: 부모로부터 독립(move out)하는 시기</li><li>핵심 키워드: 성인(adults), 성년(adulthood)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02펜테코스트 섬의 성인식</div><ul><li>위험한 도전을 통해 남성성을 증명하는 의식이 존재한다.</li><li>25미터 탑에서 덩굴(vine)을 발목에 묶고 뛰어내림</li><li>생존 시 성인으로 인정받음</li><li>핵심 키워드: 통과의례(rite of passage)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03뉴기니의 성인식</div><ul><li>신체적 고통을 인내하는 과정을 통해 용기를 입증한다.</li><li>치아를 뽑고 코를 뚫는 신체적 고통 수반</li><li>가슴에 상처(scars)를 내고 진흙을 바르는 과정</li><li>상처가 많을수록 더 용감한 것으로 간주함</li><li>핵심 키워드: 용기(bravery), 흉터(scars)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consider</td><td class=\"m\">여기다, 간주하다</td></tr><tr><td class=\"w\">move out</td><td class=\"m\">이사 나가다, 집을 떠나다</td></tr><tr><td class=\"w\">go through</td><td class=\"m\">~을 겪다, ~을 거치다</td></tr><tr><td class=\"w\">rite of passage</td><td class=\"m\">통과 의례</td></tr><tr><td class=\"w\">cut down</td><td class=\"m\">베어 넘기다, 쓰러뜨리다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take place</td><td class=\"m\">일어나다, 개최되다</td></tr><tr><td class=\"w\">pull out</td><td class=\"m\">뽑다, 빼내다</td></tr><tr><td class=\"w\">pierce</td><td class=\"m\">뚫다, 구멍을 내다</td></tr><tr><td class=\"w\">rub</td><td class=\"m\">문지르다, 비비다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한국에서는</span><span class=\"en\"><b>In Korea,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">남자아이들과 여자아이들은</span><span class=\"en\"><b>boys and girls</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어른으로 간주된다</span><span class=\"en\"><b><span class=\"grammar-hl\">are considered</span> adults</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">5월의 세 번째 월요일에</span><span class=\"en\"><b>on the third Monday in May</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 21살이 되는 해의</span><span class=\"en\"><b>of their 21st year.</b></span></div></div><div class=\"lec-sent-ko\">한국에서는 21살이 되는 해의 5월 세 번째 월요일에 어른이 되는 것으로 간주된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한국 사회가 성년을 공식적으로 인정하는 특정 시점을 제시하며, 이 글이 문화권별로 성인이 되는 기준이 다름을 보여주는 서론임을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are considered (수동태): be동사(are)+p.p.(considered) 구조. consider는 타동사인데 목적어가 없어서 수동구조 are considered 형태로 쓴다. 기본구조: consider + O + (as) C (O를 C라고 여기다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consider</td><td class=\"m\">여기다, 간주하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">서구 사회에서는</span><span class=\"en\"><b>In Western society,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">십 대들이</span><span class=\"en\"><b>teenagers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어른처럼 대우받는다</span><span class=\"en\"><b><span class=\"grammar-hl\">are treated</span> like grown-ups</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 이사 나갈 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when they move out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부모님의 집에서</span><span class=\"en\"><b>of their parents’ house.</b></span></div></div><div class=\"lec-sent-ko\">서구 사회에서는, 청소년들이 부모님의 집에서 나갈 때 어른이 되는 것으로 여겨진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 한국 사례에 이어 서구권의 성인 기준을 대조적으로 제시하여, 성인식의 정의가 문화마다 유연하게 적용된다는 점을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are treated (수동태): be동사(are)+p.p.(treated) 구조. treat는 타동사인데 목적어가 없어서 수동구조 are treated 형태로 쓴다. 기본구조: treat + O + like/as C (O를 C처럼 대우하다)</div><div class=\"lec-gr-item\">when they move out (관계부사): 문맥상 시간을 나타내는 when이 절을 이끌어 부사절 역할을 함. when + 주어 + 동사 구조로 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">move out</td><td class=\"m\">이사 나가다, 집을 떠나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 어떤 곳들에서는</span><span class=\"en\"><b>But in some places,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">십 대들이</span><span class=\"en\"><b>teenagers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">통과의례를 겪어야 한다</span><span class=\"en\"><b>must go through a rite of passage</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어른이 되기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to become</span> adults.</b></span></div></div><div class=\"lec-sent-ko\">하지만 어떤 곳에서는, 청소년들이 성인으로 받아들여지기 전에 통과의례를 치러야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;하지만&#39;을 통해 앞서 언급한 제도적인 기준이나 독립과는 달리, 고통이나 위험을 수반하는 신체적·의례적 성인식으로 논의의 초점을 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to become (to부정사): 부사적 용법의 목적(~하기 위해서)으로 쓰여, 앞에 나온 동사 go through의 목적을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">go through</td><td class=\"m\">~을 겪다, ~을 거치다</td></tr><tr><td class=\"w\">rite of passage</td><td class=\"m\">통과 의례</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">펜테코스트 섬에서는</span><span class=\"en\"><b>On Pentecost Island,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소년이</span><span class=\"en\"><b>a boy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">숲속으로 들어가야 한다</span><span class=\"en\"><b>must go into the jungle</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 긴 덩굴을 잘라야 한다</span><span class=\"en\"><b>and cut down a long vine.</b></span></div></div><div class=\"lec-sent-ko\">펜테코스트라는 작은 섬의 남자아이는 숲으로 가서 긴 덩굴을 잘라야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에서 언급한 &#39;통과 의례&#39;의 구체적인 첫 번째 사례를 도입하여, 성인이 되기 위해 수행해야 할 생존 기술을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to become (to부정사): 부사적 용법의 목적(~하기 위해서)으로 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cut down</td><td class=\"m\">베어 넘기다, 쓰러뜨리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그런 다음 그는</span><span class=\"en\"><b>Then he</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">25미터 높이의 탑 꼭대기로 올라가야 한다</span><span class=\"en\"><b>has <span class=\"grammar-hl\">to climb</span> to the top of a 25-meter tower,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">덩굴을 자신의 발목에 묶고</span><span class=\"en\"><b>tie the vine to his ankle,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 뛰어내려야 한다</span><span class=\"en\"><b>and jump.</b></span></div></div><div class=\"lec-sent-ko\">그런 다음 그 아이는 25미터 높이의 탑 꼭대기에 올라가, 덩굴을 발목에 묶고 뛰어내려야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 위험한 성인식의 과정을 상세히 묘사하며, 소년이 목숨을 걸고 자신의 용기를 증명해야 하는 긴박한 상황을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to climb (to부정사): have to(의무 조동사 구문) 뒤에 이어지는 본동사</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 덩굴이 너무 길거나</span><span class=\"en\"><b>If the vine is <span class=\"grammar-hl\">too long</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 그것이 끊어지면</span><span class=\"en\"><b>or if it breaks,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 죽을 수도 있다</span><span class=\"en\"><b>he could die.</b></span></div></div><div class=\"lec-sent-ko\">만약 덩굴이 너무 길거나 끊어지면, 아이는 죽을 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 성인식의 위험성을 직접적으로 언급하여, 이 의식이 단순한 절차가 아니라 죽음의 문턱을 넘는 결단임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">too long (관용표현): too + 형용사(부사) 구조로 &#39;~하기에 너무 ~한&#39;이라는 부정적 결과를 암시하는 표현</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 그가 살아남으면</span><span class=\"en\"><b>But if he survives,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>he</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">남자로 여겨진다</span><span class=\"en\"><b><span class=\"grammar-hl\">is considered</span> a man.</b></span></div></div><div class=\"lec-sent-ko\">하지만 살아남으면, 그는 어른으로 여겨진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 죽음의 위험을 극복한 결과로 공동체의 일원이 되는 성인식의 핵심 목적을 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is considered (수동태): be동사(is)+p.p.(considered) 구조. consider는 타동사인데 목적어가 없어서 수동구조 is considered 형태로 쓴다. 기본구조: consider + O + C (O를 C라고 생각하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consider</td><td class=\"m\">여기다, 간주하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다른 통과의례가 있다</span><span class=\"en\"><b>There is a different rite of passage</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뉴기니에서 일어나는</span><span class=\"en\"><b><span class=\"grammar-hl\">that takes place</span> in New Guinea.</b></span></div></div><div class=\"lec-sent-ko\">뉴기니에서는 다른 의식이 치러진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 펜테코스트 섬의 사례를 마치고, 다른 지역의 사례를 추가로 제시하여 통과 의례의 다양성을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that takes place (관계대명사): 주격 관계대명사 that이 선행사 a rite of passage를 수식함. 관계대명사 that이 절 내에서 주어 역할을 하므로 뒤에 동사가 바로 나옴</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rite of passage</td><td class=\"m\">통과 의례</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소년이</span><span class=\"en\"><b>Before a boy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">남자가 될 수 있기 전에는</span><span class=\"en\"><b><span class=\"grammar-hl\">can become</span> a man,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 치아 몇 개가</span><span class=\"en\"><b>several of his teeth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뽑혀야 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">must be pulled out</span>.</b></span></div></div><div class=\"lec-sent-ko\">아이가 어른이 되기 전, 이가 몇 개 뽑혀져야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 뉴기니의 성인식 과정을 구체적으로 나열하며, 신체적 고통을 인내하는 것이 남성성 확인의 조건임을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can become (to부정사): 조동사 can 뒤에 원형동사 become이 온 구조</div><div class=\"lec-gr-item\">must be pulled out (수동태): be동사(be)+p.p.(pulled) 구조. pull out은 타동사인데 목적어가 없어서 수동구조 be pulled out 형태로 쓴다. 기본구조: pull out + O (O를 뽑아내다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그다음</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 코는 뚫리고</span><span class=\"en\"><b>his nose <span class=\"grammar-hl\">is pierced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 상처들이 만들어진다</span><span class=\"en\"><b>and small cuts <span class=\"grammar-hl\">are made</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 가슴에</span><span class=\"en\"><b>in his chest.</b></span></div></div><div class=\"lec-sent-ko\">다음, 코에 구멍이 뚫리고, 가슴에 작은 상처들을 낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 치아 발치에 이어지는 신체 훼손 과정을 추가하며, 의례가 더욱 고통스러운 방식으로 진행되고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is pierced (수동태): be동사(is)+p.p.(pierced) 구조. pierce는 타동사인데 목적어가 없어서 수동구조 is pierced 형태로 쓴다. 기본구조: pierce + O (O를 뚫다)</div><div class=\"lec-gr-item\">are made (수동태): be동사(are)+p.p.(made) 구조. make는 타동사인데 목적어가 없어서 수동구조 are made 형태로 쓴다. 기본구조: make + O (O를 만들다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pierce</td><td class=\"m\">뚫다, 구멍을 내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마지막으로</span><span class=\"en\"><b>Finally,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진흙이 그 상처들에 문질러진다</span><span class=\"en\"><b>mud <span class=\"grammar-hl\">is rubbed</span> into the cuts,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고통스러운 과정인</span><span class=\"en\"><b>a painful process</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흉터를 유발하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that causes scars</span>.</b></span></div></div><div class=\"lec-sent-ko\">마지막으로, 진흙이 상처에 문질러진다. 이것은 상처 자국을 만드는 매우 고통스러운 과정이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 의례의 마지막 단계와 그로 인해 남는 흉터가 의도된 결과임을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is rubbed (수동태): be동사(is)+p.p.(rubbed) 구조. rub는 타동사인데 목적어가 없어서 수동구조 is rubbed 형태로 쓴다. 기본구조: rub + O + into + B (O를 B에 문질러 바르다)</div><div class=\"lec-gr-item\">that causes scars (관계대명사): 주격 관계대명사 that이 선행사 a painful process를 수식하며 절 내에서 주어 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rub</td><td class=\"m\">문지르다, 비비다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그가 더 많은 흉터를 가질수록</span><span class=\"en\"><b><span class=\"grammar-hl\">The more scars he has,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 용감한 것으로</span><span class=\"en\"><b><span class=\"grammar-hl\">the braver</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 여겨진다</span><span class=\"en\"><b><span class=\"grammar-hl\">he is considered</span>.</b></span></div></div><div class=\"lec-sent-ko\">아이에게 상처 자국이 많을수록 아이는 더 용감한 것으로 여겨진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 남겨진 흉터가 과거의 고통을 증명하는 훈장이자, 그가 공동체에서 인정받는 용기의 척도임을 나타내며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The more scars he has, the braver he is considered (도치/관용표현): &#39;The 비교급 + S + V, the 비교급 + S + V&#39; 구문으로, 뒤쪽 주절(he is considered)에서 is considered 수동태 구조가 사용됨</div><div class=\"lec-gr-item\">is considered (수동태): be동사(is)+p.p.(considered) 구조. consider는 타동사인데 목적어가 없어서 수동구조 is considered 형태로 쓴다. 기본구조: consider + O + C (O를 C라고 여기다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consider</td><td class=\"m\">여기다, 간주하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>성인이 되는 기준은 한국의 법적 나이, 서구의 독립 등 문화마다 다르게 설정되어 있다.</li><li>일부 문화권에서는 성인이 되기 위해 위험하거나 고통스러운 통과 의례를 거쳐야 한다.</li><li>펜테코스트 섬에서는 높은 곳에서 뛰어내리는 의식을 통해 생존과 용기를 증명한다.</li><li>뉴기니에서는 몸에 흉터를 남기는 과정을 통해 자신의 인내심과 용기를 확인받는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">While adulthood is defined by age or independence in some societies, other cultures require dangerous or painful physical challenges to prove one&#39;s maturity.</div>\n              <div class=\"lec-final-sum-ko\">어떤 사회에서는 성인기가 나이나 독립에 의해 정의되지만, 다른 문화권에서는 성숙함을 증명하기 위해 위험하거나 고통스러운 신체적 도전을 요구한다.</div></div></div>"],"segs":[[{"audio":"./review-1_audio/1.mp3","hl":null}],[{"audio":"./review-1_audio/2.mp3","hl":null}],[{"aud
