+vvAUn8fT68jr09vb8aWkyPUcZ7+nX64zz6fWkDKc8jg46+3p+P8AX0oC67jqKbuUHGR0J6/3ev5d+449aNy+o/8Ar/jijcB1FN3L6jrjqOo6/l39uaCy9CRz9Pb8Mc5/lmj9NPyYf1/X3X/4AvUHt9f84P8AKj2H+QMfU/56jINGRnqO/f068e3f9aMjOARn/OR9cf5PNAC/5/l+P+fpR0/z/n/CmhlzgEd/bp1/+vj8aXI9R09R+P8An2oAX1z/AJ/z/j0o/wA/560mQcDIySeMjqp6fUdwM470bl9R19R7e/8A9f8ASgLruLRSbhnGR37+nUfhn+ecUbl9Rx7j8fy7/wCNH9f10AMf1/X/ACPwFBIzyPb8OM/UcgY9e3FHfORjt+h659unfvRlfUfmKPX+u4C//W9O3+f8KKaGDA4I7578A9/Tj16ZoLADqPzHP+f89qAHUf56f/r/ADpOOPzHv/j/AJNLnr7daACjH+fof8+/vxRR/T/P4/57igA/z/n8qaxwrEdgT+XJ6Anp6ClJHQkc5wPp1/LnNI3CkjjAJ6Z4A9P/AKx+hoA//9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Do Dogs Possess an Inherent Sense of Fairness?<small>개들은 타고난 공정성에 대한 인식을 가지고 있는가?</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">동물들도 우리처럼 공정함에 대한 감각을 가지고 있는지 이해하려면, 먼저 불평등 혐오(Inequity Aversion)라는 개념을 알아두면 좋아요. 이는 자신과 똑같은 과업을 수행했는데도 타인이 더 좋은 보상을 받을 때, 그 상황을 불공정하다고 느끼며 거부하는 심리적 반응을 말합니다. 마치 맛있는 간식을 나만 못 받았을 때 친구를 보며 괜히 심통이 나는 상황과 비슷하죠. 이와 관련해 유명한 연구로는 영장류 학자 프란스 드 발(Frans de Waal)이 진행한 카푸친 원숭이 실험(Capuchin Monkey Experiment)이 있는데, 여기서 원숭이들은 불평등한 대우를 받자 보상으로 받은 오이를 던져버리는 등 강한 불만을 드러냈어요. 이런 사회적 비교(Social Comparison) 능력은 인간뿐만 아니라 무리 지어 사는 동물들 사이에서 협력적 관계를 유지하기 위한 진화적 기제로 작용한다고 볼 수 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01실험의 목적과 기초 설정</div><ul><li>개들이 공정성을 인지하는지 확인하기 위해 보상 유무에 따른 행동 변화를 관찰했다.</li><li>&#39;발 주기(giving their paw)&#39; 동작 반복 수행</li><li>보상 없는 상태에서의 기본 수행 빈도 측정(baseline level)</li><li>핵심 키워드: 공정성(fairness), 기초 수준(baseline)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02불평등한 보상 상황 조성</div><ul><li>두 마리의 개를 나란히 앉힌 뒤, 동일한 노동에 대해 서로 다른 보상을 제공했다.</li><li>두 마리 개를 동시에 실험에 참여시킴</li><li>한 마리에게만 더 좋은 보상을 제공하는 차등 대우</li><li>핵심 키워드: 보상(reward), 불평등(inequality)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실험 결과와 관찰된 반응</div><ul><li>상대적으로 적은 보상을 받은 개는 동작 수행을 거부하는 행동을 보였다.</li><li>보상이 적은 개는 동작을 마지못해 수행함</li><li>동작 중단 속도가 이전보다 훨씬 빨라짐</li><li>핵심 키워드: 마지못해(reluctantly), 거부(stopped)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 시사점</div><ul><li>이번 실험 결과는 개들에게도 공정성에 대한 감각이나 불평등에 대한 반감이 존재할 가능성을 제시한다.</li><li>단순 보상을 넘어선 비교와 판단 능력 확인</li><li>동물들의 기본적인 공정성 인지 가능성 시사</li><li>핵심 키워드: 공정성 감각(sense of fairness), 불평등에 대한 혐오(hatred of inequality)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sense</td><td class=\"m\">감각, 의식</td></tr><tr><td class=\"w\">fairness</td><td class=\"m\">공정함, 타당성</td></tr><tr><td class=\"w\">repeatedly</td><td class=\"m\">되풀이하여, 자꾸</td></tr><tr><td class=\"w\">baseline</td><td class=\"m\">기준점, 기준선</td></tr><tr><td class=\"w\">establish</td><td class=\"m\">확립하다, 규명하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in turn</td><td class=\"m\">차례대로, 번갈아</td></tr><tr><td class=\"w\">reluctantly</td><td class=\"m\">마지못해, 꺼려하며</td></tr><tr><td class=\"w\">finding</td><td class=\"m\">연구 결과, 발견물</td></tr><tr><td class=\"w\">inequality</td><td class=\"m\">불평등, 불균형</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">동물들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Do animals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공평함에 대한 개념을 가지고 있는가?</span><span class=\"en\"><b><span class=\"grammar-hl\">have</span> a sense of fairness?</b></span></div></div><div class=\"lec-sent-ko\">동물들은 공평함에 대한 개념이 있을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 서두에서 독자들에게 질문을 던짐으로써, 앞으로 전개될 실험의 주제가 ‘동물의 공정성 인지 여부’임을 밝히고 흥미를 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do animals have 일반동사 의문문: 주어(animals)가 일반동사(have)를 사용하는 의문문 구조로, 조동사 do를 문장 맨 앞에 배치함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sense</td><td class=\"m\">감각, 의식</td></tr><tr><td class=\"w\">fairness</td><td class=\"m\">공정함, 타당성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">연구자들은</span><span class=\"en\"><b>Researchers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것을 실험하기로 결정했다</span><span class=\"en\"><b><span class=\"grammar-hl\">decided to test</span> this</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개들에게 보상을 줌으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">paying</span> dogs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“발을 내미는 것”에 대해</span><span class=\"en\"><b>for “<span class=\"grammar-hl\">giving their paw</span>.”</b></span></div></div><div class=\"lec-sent-ko\">연구자들은 ‘발을 내미는 것’에 대해 개들에게 보상을 주는 것으로 이것을 실험해 보기로 결정했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 던진 질문을 해결하기 위해 연구자들이 설계한 구체적인 실험 방법을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">decided to test (to부정사): decide(결정하다)의 목적어로 사용된 명사적 용법의 to부정사(to test)</div><div class=\"lec-gr-item\">paying (동명사): 전치사(by)의 목적어 자리에 쓰인 동명사(paying)</div><div class=\"lec-gr-item\">giving their paw (동명사): 전치사(for)의 목적어 자리에 쓰인 동명사(giving)</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">개들은</span><span class=\"en\"><b>Dogs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반복적으로 요구받았다</span><span class=\"en\"><b><span class=\"grammar-hl\">were asked</span> repeatedly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발을 내밀라고</span><span class=\"en\"><b><span class=\"grammar-hl\">to give their paw</span>.</b></span></div></div><div class=\"lec-sent-ko\">개들은 자신의 발을 내밀도록 반복적으로 요구받았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 기초가 되는 행동 유도 과정을 설명하며, 이후 보상 유무에 따른 반응을 관찰하기 위한 전제 조건을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were asked (수동태): be동사(were)+p.p.(asked) 구조. ask는 5형식(ask+O+toV)으로 주로 쓰이는 타동사인데 목적어가 없으므로 수동태가 됨. 기본구조: ask + O + to V(O에게 toV하라고 요청하다)</div><div class=\"lec-gr-item\">to give their paw (to부정사): 5형식 문장이 수동태로 전환되면서 목적보어 자리에 있던 to부정사가 그대로 남은 형태</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">repeatedly</td><td class=\"m\">되풀이하여, 자꾸</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">연구자들은</span><span class=\"en\"><b>Researchers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">측정했다</span><span class=\"en\"><b>measured</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개들이 얼마나 빠르게 그리고 얼마나 많이 발을 내밀지를</span><span class=\"en\"><b><span class=\"grammar-hl\">how fast and how many times</span> dogs would give their paw</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 그들이 보상을 받지 않는다면</span><span class=\"en\"><b>if they <span class=\"grammar-hl\">were not rewarded</span>.</b></span></div></div><div class=\"lec-sent-ko\">연구자들은 개들이 보상을 받지 않을 때 발을 얼마나 빠르게, 얼마나 많이 내미는지를 측정했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 기준점(baseline)을 잡는 단계로, 보상이 없는 상황에서의 자연스러운 행동 수치를 먼저 파악하려는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how fast and how many times (간접의문문): 의문사구(how fast/how many times) + S(dogs) + V(would give) 구조로, measured의 목적어 절 역할을 함</div><div class=\"lec-gr-item\">were not rewarded (수동태): be동사(were)+p.p.(rewarded) 구조. reward는 타동사인데 목적어가 없어 수동태가 됨. 기본구조: reward + O(O에게 보상하다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이런 발 내밀기의 기준치가 설정되자,</span><span class=\"en\"><b><span class=\"grammar-hl\">Once this baseline level of paw giving was established</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연구자들은</span><span class=\"en\"><b>the researchers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 마리 개를 나란히 앉혔다</span><span class=\"en\"><b><span class=\"grammar-hl\">had two dogs sit</span> next to each other</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 각각의 개에게 번갈아 요구했다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">asked each dog</span> in turn</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발을 내밀라고</span><span class=\"en\"><b>to give a paw.</b></span></div></div><div class=\"lec-sent-ko\">이러한 발 내밀기의 기준치가 되는 수준이 설정된 다음, 연구자들은 두 마리의 개들을 나란히 앉히고 각각의 개에게 번갈아 발을 내밀게 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 보상이 없는 상태의 기준치를 확인한 후, 본격적으로 ‘비교’ 상황을 연출하기 위해 두 개체를 함께 실험군에 배치하는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Once this baseline level of paw giving was established (분사구문): 접속사(Once) + 주어(this baseline level...) + be동사(was) + p.p.(established)의 구조로, 부사적 기능을 함. 원형 절 변환: Once it was established</div><div class=\"lec-gr-item\">was established (수동태): be동사(was)+p.p.(established) 구조. establish는 타동사인데 목적어가 없어 수동태가 됨. 기본구조: establish + O(O를 확립하다)</div><div class=\"lec-gr-item\">paw giving (동명사(명사적)): &#39;앞발 내밀기&#39;라는 행위/용도를 나타내며 baseline level을 보충 설명함</div><div class=\"lec-gr-item\">had two dogs sit 5형식(SVOC) 구조: 사역동사 have + 목적어(two dogs) + 목적보어(동사원형 sit)로, 목적어가 동작을 수행함을 나타냄</div><div class=\"lec-gr-item\">asked each dog 5형식(SVOC) 구조: ask + 목적어(each dog) + 목적보어(to give) 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">baseline</td><td class=\"m\">기준점, 기준선</td></tr><tr><td class=\"w\">establish</td><td class=\"m\">확립하다, 규명하다</td></tr><tr><td class=\"w\">in turn</td><td class=\"m\">차례대로, 번갈아</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러고 나서</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개들 중 한 마리는</span><span class=\"en\"><b>one of the dogs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 나은 보상을 받았다</span><span class=\"en\"><b><span class=\"grammar-hl\">was given</span> a better reward</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 개보다</span><span class=\"en\"><b>than the other.</b></span></div></div><div class=\"lec-sent-ko\">그러고 나서 두 마리의 개들 중 한 마리는 다른 개보다 더 나은 보상을 받았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 개체 간의 보상 차이를 둠으로써, 동물이 타인(다른 개)과 자신의 처우를 비교하고 있는지 확인하는 결정적인 환경을 조성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was given (수동태): be동사(was)+p.p.(given) 구조. give는 4형식(give+IO+DO) 동사인데 목적어가 주어로 나가 수동태가 됨. 기본구조: give + IO + DO(IO에게 DO를 주다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 반응으로,</span><span class=\"en\"><b>In response,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘보상’을 더 적게 받고 있던 그 개는</span><span class=\"en\"><b><span class=\"grammar-hl\">the dog that was being “paid” less</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같은 일에 대해</span><span class=\"en\"><b>for the same work</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 마지못해 발을 내밀기 시작했다</span><span class=\"en\"><b>began giving its paw more reluctantly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 더 빨리 발 내밀기를 멈췄다</span><span class=\"en\"><b>and stopped giving its paw sooner.</b></span></div></div><div class=\"lec-sent-ko\">이에 대한 반응으로 동일한 일에 대해 ‘보상’을 덜 받고 있던 개는 발을 더 마지못해 내밀기 시작하였고 발 내밀기를 멈추었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 결과로, 보상의 불평등을 인지한 개가 자신의 행동을 수정했다는 사실을 통해 공정성에 대한 민감함이 있음을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the dog that was being “paid” less (관계대명사): that은 the dog를 선행사로 하는 주격 관계대명사이며 뒤에 동사(was being paid)가 옴</div><div class=\"lec-gr-item\">was being “paid” (수동태(과거진행수동)): be동사(was) + 진행형(being) + p.p.(paid) 구조. pay는 타동사인데 목적어가 없어 수동태가 됨. 기본구조: pay + O(O에게 지불하다/보상하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reluctantly</td><td class=\"m\">마지못해, 꺼려하며</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 결과는</span><span class=\"en\"><b>This finding</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 흥미로운 가능성을 제기한다</span><span class=\"en\"><b>raises <span class=\"grammar-hl\">the very interesting possibility</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개들이 공평함에 대한 기초적인 개념을 가지고 있을지도 모른다는,</span><span class=\"en\"><b><span class=\"grammar-hl\">that dogs may have</span> a basic sense of fairness,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 적어도 불평등함에 대한 증오심을</span><span class=\"en\"><b>or at least a hatred of inequality.</b></span></div></div><div class=\"lec-sent-ko\">이러한 결과는 개들이 공평함에 대한 기초적인 개념 또는 최소한 불평등함에 대한 증오심을 가지고 있을 수 있다는 매우 흥미로운 가능성을 제기한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전체 실험 결과를 종합하여, 동물의 인지 능력에 관한 학술적 가설을 제시하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the very interesting possibility that dogs may have 동격의 that: 명사(possibility) + that절 구조로, 뒤의 that절이 가능성의 내용을 구체적으로 설명함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sense</td><td class=\"m\">감각, 의식</td></tr><tr><td class=\"w\">fairness</td><td class=\"m\">공정함, 타당성</td></tr><tr><td class=\"w\">finding</td><td class=\"m\">연구 결과, 발견물</td></tr><tr><td class=\"w\">inequality</td><td class=\"m\">불평등, 불균형</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>연구진은 개들이 공정함을 느끼는지 알아보기 위해 &#39;보상 차등 지급&#39; 실험을 진행했다.</li><li>개들은 보상이 없는 상태의 행동 기준을 가지고 있었다.</li><li>옆의 개보다 적은 보상을 받게 되자, 개들은 일을 더 주저하거나 빨리 그만두는 반응을 보였다.</li><li>이를 통해 개들에게도 불평등을 싫어하는 기본적인 공정성 감각이 있을 가능성이 확인되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Dogs performed tasks with less enthusiasm when receiving unfair rewards compared to others, indicating that they may possess a basic sense of fairness or a dislike for inequality.</div>\n              <div class=\"lec-final-sum-ko\">개들은 다른 개들에 비해 불공평한 보상을 받을 때 과업 수행을 주저했으며, 이는 그들이 기본적인 공정성을 인지하거나 불평등을 싫어할 가능성을 시사한다.</div></div></div>"],"segs":[[{"audio":"./review-2_audio/1.mp3","hl":null}],[{"audio":"./review-2_audio/2.mp3","hl":null}],[{"audio":"./review-2_audio/3.mp3","hl":null},{"audio":"./review-2_audio/4.mp3","hl":"stage-0"},{"audio":"./review-2_audio/5.mp3","hl":"stage-1"},{"audio":"./review-2_audio/6.mp3","hl":"stage-2"},{"audio":"./review-2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./review-2_audio/8.mp3","hl":null}],[{"audio":"./review-2_audio/9.mp3","hl":"main"},{"audio":"./review-2_audio/10.mp3","hl":"meaning"},{"audio":"./review-2_audio/11.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/12.mp3","hl":"main"},{"audio":"./review-2_audio/13.mp3","hl":"meaning"},{"audio":"./review-2_audio/14.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/15.mp3","hl":"main"},{"audio":"./review-2_audio/16.mp3","hl":"meaning"},{"audio":"./review-2_audio/17.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/18.mp3","hl":"main"},{"audio":"./review-2_audio/19.mp3","hl":"meaning"},{"audio":"./review-2_audio/20.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/21.mp3","hl":"main"},{"audio":"./review-2_audio/22.mp3","hl":"meaning"},{"audio":"./review-2_audio/23.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/24.mp3","hl":"main"},{"audio":"./review-2_audio/25.mp3","hl":"meaning"},{"audio":"./review-2_audio/26.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/27.mp3","hl":"main"},{"audio":"./review-2_audio/28.mp3","hl":"meaning"},{"audio":"./review-2_audio/29.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/30.mp3","hl":"main"},{"audio":"./review-2_audio/31.mp3","hl":"meaning"},{"audio":"./review-2_audio/32.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/33.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length
