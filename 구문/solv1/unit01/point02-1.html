돌아오는 현상을 말하는데요. 마치 맛있는 음식을 매일 먹으면 처음의 감동이 사라지는 것과 비슷하죠. 또한, 돈이 많아져도 오히려 고립감을 느끼는 현상은 사회적 자본(Social capital)이 무너질 때 주로 나타납니다. 즉, 부를 얻는 과정에서 기존의 인간관계가 단절되거나 타인과 진실하게 소통할 기회를 잃으면, 외로움(Loneliness)이라는 정서적 결핍을 겪게 되는 것이죠. 결국 행복이란 단순히 통장 잔고의 문제가 아니라, 우리 곁에 있는 사람들과 질적인 관계(Quality relationships)를 어떻게 유지하느냐에 달려 있다는 점을 이 글을 읽기 전에 꼭 기억해 주세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01일반적인 통념</div><ul><li>많은 사람이 부와 행복이 비례한다고 생각하지만 실제 경험은 그렇지 않음을 시사한다.</li><li>돈이 행복의 핵심(key to happiness)이라는 대중적 믿음</li><li>현실 경험을 통한 통념의 반증</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02급격한 부의 변화</div><ul><li>복권 당첨과 같이 갑작스럽게 부자가 된 사람들은 일상에 큰 변화를 겪는다.</li><li>직장을 그만두고 더 좋은 동네로 이사함(move to a bigger house)</li><li>변화 후 남는 시간을 주체하지 못함(free time)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03인간관계의 단절</div><ul><li>부를 얻은 후 오히려 이전의 소중한 관계들이 멀어지며 고립을 경험하게 된다.</li><li>기존 친구들과의 관계 소원해짐(grow distant)</li><li>새로운 환경에서의 대인관계 형성 어려움(difficult to make friends)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04역설적인 결론</div><ul><li>부자가 되는 것이 행운이라고 생각했으나 실제로는 더 큰 외로움을 초래할 수 있다.</li><li>예상치 못한 외로움(lonelier)의 심화</li><li>긍정적이라 믿었던 행운(wonderful luck)의 역설적 결과</li><li>핵심 키워드: 행복(happiness), 외로움(loneliness)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">believe</td><td class=\"m\">믿다, 생각하다</td></tr><tr><td class=\"w\">the key to</td><td class=\"m\">~의 핵심, ~의 비결</td></tr><tr><td class=\"w\">experience</td><td class=\"m\">경험, 체험</td></tr><tr><td class=\"w\">turn out</td><td class=\"m\">~임이 판명되다, ~으로 드러나다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">distant</td><td class=\"m\">멀어진, 소원한</td></tr><tr><td class=\"w\">come over</td><td class=\"m\">(집 등으로) 들르다, 찾아오다</td></tr><tr><td class=\"w\">the opposite</td><td class=\"m\">정반대의 것, 반대되는 상황</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들은 믿는다</span><span class=\"en\"><b>Many people believe</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈이 열쇠라는 것을</span><span class=\"en\"><b>that money is <span class=\"grammar-hl\">the key</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행복으로 가는</span><span class=\"en\"><b><span class=\"grammar-hl\">to happiness</span>.</b></span></div></div><div class=\"lec-sent-ko\">많은 사람들이 돈이 행복의 열쇠라고 믿는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 서두에서 행복에 관한 일반적인 통념을 제시하며, 이후 이어지는 글에서 이를 반박할 것임을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the key to happiness (관용표현): to는 전치사로 쓰여 &#39;~에 대한 열쇠(해결책)&#39;라는 의미를 나타내는 관용구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">believe</td><td class=\"m\">믿다, 생각하다</td></tr><tr><td class=\"w\">the key to</td><td class=\"m\">~의 핵심, ~의 비결</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 경험은 보여준다</span><span class=\"en\"><b>But <span class=\"grammar-hl\">experience shows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것이 단순히 진실이 아니라는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> this simply is not true.</b></span></div></div><div class=\"lec-sent-ko\">그러나 경험은 이것이 진실이 아님을 보여준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 대중의 믿음이 현실과는 거리가 있음을 지적하며, 논의의 방향을 반전시키는 전환점 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">experience shows that (명사절): that절이 타동사 shows의 목적어 역할을 하는 명사절 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experience</td><td class=\"m\">경험, 체험</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">갑자기 부자가 된 사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">People who suddenly become very rich</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">복권 당첨자처럼</span><span class=\"en\"><b>such as lottery winners,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 직업을 그만두고</span><span class=\"en\"><b>often quit their jobs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이사한다</span><span class=\"en\"><b>and move</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 큰 집으로</span><span class=\"en\"><b>to a bigger house</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 좋은 동네의</span><span class=\"en\"><b>in a nicer neighborhood.</b></span></div></div><div class=\"lec-sent-ko\">복권 당첨자처럼 갑자기 부자가 된 사람들은 종종 직업을 그만두고 더 좋은 동네의 더 큰 집으로 이사한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 행복의 조건이라 여겨지는 &#39;부&#39;를 획득한 사람들이 취하는 전형적인 행동을 예시로 들어, 그들이 어떤 변화를 겪는지 구체적으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">People who suddenly become very rich (관계대명사): who는 주격 관계대명사로, 선행사 People을 수식하며 절 내부에서 주어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그렇게 한 후에, 그러나</span><span class=\"en\"><b><span class=\"grammar-hl\">After doing so</span>, however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 보통 모른다</span><span class=\"en\"><b>they usually don’t know</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇을 해야 할지를</span><span class=\"en\"><b><span class=\"grammar-hl\">what to do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 모든 여가 시간을 가지고</span><span class=\"en\"><b>with all of their free time.</b></span></div></div><div class=\"lec-sent-ko\">그러나 이렇게 한 후에 그들은 대체로 그 모든 여가 시간을 가지고 뭘 할지 모르곤 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 부자가 된 뒤 맞이한 변화가 오히려 일상적인 삶의 목적과 균형을 잃게 만드는 예상치 못한 문제임을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">After doing so (동명사): 전치사 After의 목적어로 쓰인 명사적 역할의 동명사입니다.</div><div class=\"lec-gr-item\">what to do (to부정사): 의문사 + to부정사 구조로, 명사구로서 타동사 know의 목적어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">더 나쁜 것은,</span><span class=\"en\"><b>Even worse,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 발견할지도 모른다</span><span class=\"en\"><b>they may <span class=\"grammar-hl\">find</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 가장 친한 친구들이 멀어지는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that their best friends grow distant</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 오는 것을 멈추는 것을</span><span class=\"en\"><b>and <span class=\"grammar-hl\">stop coming over</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방문하러</span><span class=\"en\"><b>to visit.</b></span></div></div><div class=\"lec-sent-ko\">더 나쁜 것은, 그들의 친한 친구들이 점점 멀어지고 더 이상 찾아오지 않을 수 있다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 금전적 풍요가 인간관계의 단절이라는 부정적인 결과로 이어지고 있음을 강조하며 상황이 더욱 악화됨을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">find that their best friends grow distant (명사절): that절이 타동사 find의 목적어 역할을 하며, 그 내부에서 grow는 2형식 동사로 쓰였습니다.</div><div class=\"lec-gr-item\">stop coming over (동명사): 타동사 stop의 목적어로 쓰인 동명사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">distant</td><td class=\"m\">멀어진, 소원한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 매우 어려울 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">It can be very difficult</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갑자기 친구를 사귀는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">to suddenly make friends</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 동네에서,</span><span class=\"en\"><b>in a new neighborhood,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그들은 종종 더 외로움을 느낀다</span><span class=\"en\"><b>so they often feel lonelier</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 그랬던 것보다</span><span class=\"en\"><b>than they ever did</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 부자가 되기 전의 어느 때보다</span><span class=\"en\"><b>before they got rich.</b></span></div></div><div class=\"lec-sent-ko\">새로운 동네에서 갑자기 친구를 사귄다는 것은 매우 어려울 수 있다. 그래서 그들은 종종 더 부자가 되기 전의 그 어느 때보다 더 외로움을 느낀다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 환경의 변화가 대인관계 형성의 어려움을 가중시켜 결국 고립감을 느끼게 된다는 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It can be very difficult to suddenly make friends (가주어): 진주어: It은 가주어, to부정사구(to suddenly make friends)가 진주어인 5형식 구조의 확장 형태입니다.</div><div class=\"lec-gr-item\">make friends (관용표현): &#39;친구를 사귀다&#39;라는 의미의 관용적 동사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">멋진 행운처럼 보였던 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">What seemed like wonderful luck</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">판명된다</span><span class=\"en\"><b>turns out</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정반대로</span><span class=\"en\"><b>the opposite.</b></span></div></div><div class=\"lec-sent-ko\">멋진 행운으로 보였던 일이 정반대가 되어 버린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 내용을 요약하며, 돈이 행복을 가져다줄 것이라는 처음의 통념이 현실에서는 오히려 불행으로 변질되었음을 결론짓습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What seemed like wonderful luck (관계대명사): What은 &#39;~하는 것&#39;이라는 의미의 선행사를 포함하는 관계대명사로, 문장 전체의 주어 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">the opposite</td><td class=\"m\">정반대의 것, 반대되는 상황</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>많은 사람이 돈이 행복의 핵심이라 믿지만, 실제 경험은 그렇지 않다는 것을 보여준다.</li><li>갑작스러운 부는 기존의 직업과 인간관계를 잃게 만들며, 새로운 환경 적응 또한 쉽지 않다.</li><li>결국 부자가 되는 것은 행운으로 시작했지만, 결과적으로 더 큰 외로움과 불행을 초래한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Sudden wealth often disrupts a person&#39;s established lifestyle and social connections, eventually leading to increased loneliness instead of the expected happiness.</div>\n              <div class=\"lec-final-sum-ko\">갑작스러운 부는 개인의 기존 생활 방식과 사회적 관계를 붕괴시켜, 결국 기대했던 행복 대신 증가하는 외로움으로 이어진다.</div></div></div>"],"segs":[[{"audio":"./point02-1_audio/1.mp3","hl":null}],[{"audio":"./point02-1_audio/2.mp3","hl":null}],[{"audio":"./point02-1_audio/3.mp3","hl":null},{"audio":"./point02-1_audio/4.mp3","hl":"stage-0"},{"audio":"./point02-1_audio/5.mp3","hl":"stage-1"},{"audio":"./point02-1_audio/6.mp3","hl":"stage-2"},{"audio":"./point02-1_audio/7.mp3","hl":"stage-3"}],[{"audio":"./point02-1_audio/8.mp3","hl":null}],[{"audio":"./point02-1_audio/9.mp3","hl":"main"},{"audio":"./point02-1_audio/10.mp3","hl":"meaning"},{"audio":"./point02-1_audio/11.mp3","hl":"grammar"}],[{"audio":"./point02-1_audio/12.mp3","hl":"main"},{"audio":"./point02-1_audio/13.mp3","hl":"meaning"},{"audio":"./point02-1_audio/14.mp3","hl":"grammar"}],[{"audio":"./point02-1_audio/15.mp3","hl":"main"},{"audio":"./point02-1_audio/16.mp3","hl":"meaning"},{"audio":"./point02-1_audio/17.mp3","hl":"grammar"}],[{"audio":"./point02-1_audio/18.mp3","hl":"main"},{"audio":"./point02-1_audio/19.mp3","hl":"meaning"},{"audio":"./point02-1_audio/20.mp3","hl":"grammar"}],[{"audio":"./point02-1_audio/21.mp3","hl":"main"},{"audio":"./point02-1_audio/22.mp3","hl":"meaning"},{"audio":"./point02-1_audio/23.mp3","hl":"grammar"}],[{"audio":"./point02-1_audio/24.mp3","hl":"main"},{"audio":"./point02-1_audio/25.mp3","hl":"meaning"},{"audio":"./point02-1_audio/26.mp3","hl":"grammar"}],[{"audio":"./point02-1_audio/27.mp3","hl":"main"},{"audio":"./point02-1_audio/28.mp3","hl":"meaning"},{"audio":"./point02-1_audio/29.mp3","hl":"grammar"}],[{"audio":"./point02-1_audio/30.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll("
