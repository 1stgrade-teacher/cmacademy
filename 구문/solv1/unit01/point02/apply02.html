">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01거짓말에 대한 일반적 인식</div><ul><li>사람들은 일반적으로 타인이 자신에게 거짓말하는 것을 매우 싫어한다.</li><li>거짓말(lies)에 대한 부정적 반응</li><li>타인의 기만 행위에 대한 혐오(hate)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02일상적인 사소한 거짓말</div><ul><li>현실에서 우리는 매일 서로에게 사소한 거짓말을 하며 살아간다.</li><li>매우 흔하게(common) 발생하는 현상</li><li>진실을 알아도 크게 화가 나지 않음(not upset)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03배려를 위한 사례</div><ul><li>상대방에게 상처를 주지 않기 위해 사실과 다르게 말하는 구체적 상황이다.</li><li>어머니의 헤어스타일(hairstyle)에 대한 칭찬 사례</li><li>상대방을 아끼고 배려하는 마음(love)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04선의의 거짓말의 정의</div><ul><li>좋은 의도를 가지고 하는 거짓말을 별도의 개념으로 정의한다.</li><li>핵심 개념: 하얀 거짓말(white lies)</li><li>정당하고 좋은 이유(good reason)를 위한 거짓말</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lie to</td><td class=\"m\">~에게 거짓말하다</td></tr><tr><td class=\"w\">likely</td><td class=\"m\">아마도, ~할 것 같은</td></tr><tr><td class=\"w\">in fact</td><td class=\"m\">사실은, 실제로</td></tr><tr><td class=\"w\">one another</td><td class=\"m\">서로</td></tr><tr><td class=\"w\">common</td><td class=\"m\">흔한, 보통의</td></tr><tr><td class=\"w\">upset</td><td class=\"m\">속상한, 마음이 상한</td></tr><tr><td class=\"w\">find out</td><td class=\"m\">~을 알아내다, 발견하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">for example</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">hairstyle</td><td class=\"m\">헤어스타일, 머리 모양</td></tr><tr><td class=\"w\">even if</td><td class=\"m\">비록 ~일지라도, ~에도 불구하고</td></tr><tr><td class=\"w\">consider</td><td class=\"m\">여기다, 생각하다</td></tr><tr><td class=\"w\">terorable</td><td class=\"m\">끔찍한, 형편없는</td></tr><tr><td class=\"w\">white lie</td><td class=\"m\">하얀 거짓말, 선의의 거짓말</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들에게 물어보라</span><span class=\"en\"><b>Ask people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 어떻게 느끼는지</span><span class=\"en\"><b><span class=\"grammar-hl\">how they feel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가 그들에게 거짓말을 할 때</span><span class=\"en\"><b>when someone lies to them,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면 그들은 아마 말할 것이다</span><span class=\"en\"><b>and they will likely say</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 정말 싫어한다고</span><span class=\"en\"><b>that they hate it.</b></span></div></div><div class=\"lec-sent-ko\">사람들에게 누군가 그들에게 거짓말을 한다면 기분이 어떨지 물어보라, 그러면 아마도 그건 정말 싫다고 대답할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 거짓말에 대한 사람들의 일반적인 부정적 인식을 보여줍니다. how they feel when someone lies는 타인이 나를 속였을 때 느끼는 불쾌감이나 배신감을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how they feel (간접의문문): 의문사(how) + 주어(they) + 동사(feel) 어순으로 쓰여 Ask의 목적어 역할을 하는 명사절이다.</div><div class=\"lec-gr-item\">Ask ..., and (관용표현): &#39;명령문 + and&#39; 구조로, &#39;...해라, 그러면 ~할 것이다&#39;라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">likely</td><td class=\"m\">아마도, ~할 것 같은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러 가지 다른 종류의 거짓말들이 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">there are</span> many different kinds of lies.</b></span></div></div><div class=\"lec-sent-ko\">그러나 거짓말에는 종류가 많다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> However를 사용하여 앞 문장의 내용과 반대되는 새로운 관점을 제시합니다. 모든 거짓말이 다 나쁜 것은 아니며, 상황에 따라 성격이 다를 수 있다는 점을 암시하며 독자의 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there are (관용표현): &#39;There + be동사 + 주어&#39; 구조로 &#39;~들이 있다&#39;라는 의미이며, 주어인 many different kinds에 맞춰 복수형 be동사(are)가 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실</span><span class=\"en\"><b>In fact,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 모두는 작은 거짓말을 한다</span><span class=\"en\"><b>we all tell small lies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로에게</span><span class=\"en\"><b>to <span class=\"grammar-hl\">one another</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b>every day.</b></span></div></div><div class=\"lec-sent-ko\">사실, 우리 모두는 서로에게 매일 작은 거짓말들을 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 주장을 구체화하여 거짓말이 우리 일상에 깊숙이 자리 잡고 있음을 강조합니다. tell small lies to one another는 악의 없이 주고받는 가벼운 속임수들을 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">one another (관용표현): &#39;서로&#39;라는 뜻의 대명사로, 주로 셋 이상의 대상 사이에서 쓰인다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in fact</td><td class=\"m\">사실은, 실제로</td></tr><tr><td class=\"w\">one another</td><td class=\"m\">서로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 매우 흔할 뿐만 아니라</span><span class=\"en\"><b><span class=\"grammar-hl\">Not only is this</span> very common,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 우리를 정말 화나게 하지 않는다</span><span class=\"en\"><b>it doesn’t really <span class=\"grammar-hl\">make us upset</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(그것이 거짓말임을) 알게 되었을 때</span><span class=\"en\"><b>when we <span class=\"grammar-hl\">find out</span>.</b></span></div></div><div class=\"lec-sent-ko\">이건 매우 흔한 일일뿐 아니라 (거짓말임이) 밝혀진 후에라도 우리를 정말 화나게 하진 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일상적인 작은 거짓말의 특징을 설명합니다. doesn’t really make us upset은 상대가 나를 속였다는 사실을 나중에 눈치채더라도 기분이 나쁘거나 인간관계에 금이 가지 않는다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Not only is this (도치): 부정어구(Not only)가 문장 맨 앞에 강조를 위해 위치하면서, 주어(this)와 be동사(is)의 순서가 바뀐 도치 구조다.</div><div class=\"lec-gr-item\">make us upset 5형식(SVOC) 구조: 타동사(make) + 목적어(us) + 목적보어(upset) 구조로, 목적보어 자리에 형용사가 와서 &#39;우리를 화나게 만들다&#39;라는 의미를 형성한다.</div><div class=\"lec-gr-item\">find out (관용표현): &#39;(정보 등을) 알아내다, 발견하다&#39;라는 의미의 구동사다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">common</td><td class=\"m\">흔한, 보통의</td></tr><tr><td class=\"w\">upset</td><td class=\"m\">속상한, 마음이 상한</td></tr><tr><td class=\"w\">find out</td><td class=\"m\">~을 알아내다, 발견하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상상해 보라</span><span class=\"en\"><b>imagine</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 어머니가 그녀의 헤어스타일을 바꾸고</span><span class=\"en\"><b>your mother changed her hairstyle</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에게 물었다고</span><span class=\"en\"><b>and asked you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀가 어떻게 보이는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">how she looks</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들면, 당신의 어머니가 헤어스타일을 바꾸고는 어떠냐고 물어오셨을 때를 상상해보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 설명을 독자가 쉽게 이해할 수 있도록 일상적인 상황을 예로 듭니다. imagine your mother changed her hairstyle은 정직함과 배려 사이에서 고민하게 되는 전형적인 상황을 설정한 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how she looks (간접의문문): 의문사(how) + 주어(she) + 동사(looks) 어순의 명사절로, asked의 직접목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">for example</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">hairstyle</td><td class=\"m\">헤어스타일, 머리 모양</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 당신이 그 스타일이 정말 별로라고 생각할지라도</span><span class=\"en\"><b>Even if you <span class=\"grammar-hl\">consider the style terrible</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 아마 그녀에게 말할 것이다</span><span class=\"en\"><b>you will probably tell her</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아주 좋아 보인다고</span><span class=\"en\"><b>that she looks great.</b></span></div></div><div class=\"lec-sent-ko\">비록 그 스타일이 정말 별로라고 생각할지라도, 아마도 아주 좋아 보인다고 말해 줄 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 예시 상황에서 우리가 실제로 어떤 선택을 하는지 보여줍니다. tell her that she looks great은 진실을 말하기보다 상대방의 기분을 맞춰주기 위해 하는 예의 바른 빈말을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">consider the style terrible 5형식(SVOC) 구조: 동사(consider) + 목적어(the style) + 목적보어(terrible) 구조로, 목적보어 자리에 형용사가 쓰여 &#39;그 스타일을 끔찍하다고 여기다&#39;라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">even if</td><td class=\"m\">비록 ~일지라도, ~에도 불구하고</td></tr><tr><td class=\"w\">consider</td><td class=\"m\">여기다, 생각하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 이것이 거짓말일지라도</span><span class=\"en\"><b>Although this is a lie,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 그것을 말하는 이유는</span><span class=\"en\"><b><span class=\"grammar-hl\">the reason you tell it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 어머니를 사랑하기 때문이고</span><span class=\"en\"><b>is because you love your mother</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀를 기분 나쁘게 하고 싶지 않기 때문이다</span><span class=\"en\"><b>and don’t want <span class=\"grammar-hl\">to hurt</span> her.</b></span></div></div><div class=\"lec-sent-ko\">비록 이것이 거짓말일지라도 당신이 그렇게 말한 이유는 엄마를 사랑하기에 그녀를 기분 나쁘게 하고 싶지 않기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이런 종류의 거짓말을 하는 근본적인 동기를 분석합니다. don’t want to hurt her는 진실을 그대로 전달했을 때 발생할 수 있는 상대방의 상심이나 실망감을 막으려는 의도를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the reason you tell it (관계부사): 선행사(the reason) 뒤에 관계부사 why가 생략된 구조이며, 뒤에는 &#39;주어(you)+동사(tell)+목적어(it)&#39;를 갖춘 완전한 절이 이어진다.</div><div class=\"lec-gr-item\">to hurt (to부정사): want의 목적어 역할을 하는 명사적 용법으로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 이것을 하얀 거짓말이라고 부른다.</span><span class=\"en\"><b>We <span class=\"grammar-hl\">call these white lies</span>.</b></span></div></div><div class=\"lec-sent-ko\">이런 것을 하얀 거짓말(선의의 거짓말)이라 부른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지 설명한 &#39;남을 배려하는 거짓말&#39;을 학술적 혹은 사회적 용어로 정의합니다. call these white lies는 도덕적으로 비난받는 일반적 거짓말과 구분되는 특별한 범주를 설정하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">call these white lies 5형식(SVOC) 구조: 동사(call) + 목적어(these) + 목적보어(white lies) 구조로, 목적보어 자리에 명사구가 와서 &#39;이것들을 선의의 거짓말이라 부르다&#39;라는 의미가 된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">white lie</td><td class=\"m\">하얀 거짓말, 선의의 거짓말</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 거짓말일지 모르지만</span><span class=\"en\"><b>They may be lies,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 그것들을 말한다</span><span class=\"en\"><b>but we tell them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선한 목적으로</span><span class=\"en\"><b><span class=\"grammar-hl\">for a good reason</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 거짓말일지 모르지만 우리는 선한 목적으로 그런 거짓말을 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 결론으로, 선의의 거짓말이 가진 정당성을 다시 한번 강조하며 마무리합니다. tell them for a good reason은 타인과의 원만한 관계 유지와 상대에 대한 존중이 거짓말이라는 형식보다 더 가치 있을 수 있다는 글쓴이의 시각을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">for a good reason (관용표현): &#39;충분한 이유가 있어서&#39; 혹은 &#39;좋은 의도로&#39;라는 의미를 가진 전치사구 표현이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들은 일반적으로 거짓말을 싫어하지만, 사실 거짓말에는 다양한 종류가 있다.</li><li>우리는 일상 속에서 타인에게 화를 일으키지 않는 사소한 거짓말을 자주 하며 살아간다.</li><li>가족의 외모를 칭찬하는 것처럼, 상대방에게 상처를 주지 않으려는 사랑의 마음에서 비롯된 거짓말이 있다.</li><li>이러한 거짓말을 &#39;하얀 거짓말(선의의 거짓말)&#39;이라 부르며, 이는 좋은 의도를 가진 긍정적인 행위로 간주된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Although people generally despise lying, they frequently employ white lies to avoid hurting the feelings of those they care about.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 일반적으로 거짓말하는 것을 혐오하지만, 소중한 사람들의 감정을 상하게 하지 않기 위해 하얀 거짓말을 빈번하게 사용한다.</div></div></div>"],"segs":[[{"audio":"./apply02_audio/1.mp3","hl":null}],[{"audio":"./apply02_audio/2.mp3","hl":null}],[{"audio":"./apply02_audio/3.mp3","hl":null},{"audio":"./apply02_audio/4.mp3","hl":"stage-0"},{"audio":"./apply02_audio/5.mp3","hl":"stage-1"},{"audio":"./apply02_audio/6.mp3","hl":"stage-2"},{"audio":"./apply02_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply02_audio/8.mp3","hl":null}],[{"audio":"./apply02_audio/9.mp3","hl":"main"},{"audio":"./apply02_audio/10.mp3","hl":"meaning"},{"audio":"./apply02_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/12.mp3","hl":"main"},{"audio":"./apply02_audio/13.mp3","hl":"meaning"},{"audio":"./apply02_audio/14.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/15.mp3","hl":"main"},{"audio":"./apply02_audio/16.mp3","hl":"meaning"},{"audio":"./apply02_audio/17.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/18.mp3","hl":"main"},{"audio":"./apply02_audio/19.mp3","hl":"meaning"},{"audio":"./apply02_audio/20.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/21.mp3","hl":"main"},{"audio":"./apply02_audio/22.mp3","hl":"meaning"},{"audio":"./apply02_audio/23.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/24.mp3","hl":"main"},{"audio":"./apply02_audio/25.mp3","hl":"meaning"},{"audio":"./apply02_audio/26.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/27.mp3","hl":"main"},{"audio":"./apply02_audio/28.mp3","hl":"meaning"},{"audio":"./apply02_audio/29.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/30.mp3","hl":"main"},{"audio":"./apply02_audio/31.mp3","hl":"meaning"},{"audio":"./apply02_audio/32.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/33.mp3","hl":"main"},{"audio":"./apply02_audio/34.mp3","hl":"meaning"},{"audio":"./apply02_audio/35.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/36.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
