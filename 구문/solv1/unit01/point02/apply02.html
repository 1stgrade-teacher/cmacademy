\">01거짓말에 대한 인식</div><ul><li>사람들은 일반적으로 누군가 자신에게 거짓말을 하는 것을 싫어한다고 답한다.</li><li>거짓말(lie)에 대한 부정적인 일반적 인식</li><li>사람들의 본능적인 거부감 확인</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02일상 속의 작은 거짓말</div><ul><li>우리는 일상생활에서 타인과 다양한 종류의 거짓말을 주고받으며 살아간다.</li><li>일상 속에서 흔히 발생하는 작은 거짓말(small lies)</li><li>거짓말을 발견해도 크게 화를 내지 않는 상황</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03하얀 거짓말의 예시</div><ul><li>상대방을 배려하기 위해 하는 거짓말은 상황에 따라 자연스럽게 받아들여진다.</li><li>어머니의 헤어스타일 예시</li><li>상대의 기분을 배려하기 위한 선의의 거짓말</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04하얀 거짓말의 정의</div><ul><li>선의를 목적으로 하는 거짓말을 하얀 거짓말이라 부르며, 이는 정당한 이유가 있다.</li><li>하얀 거짓말(white lies)의 개념</li><li>상대방에게 상처를 주지 않으려는 배려(care)</li><li>핵심 키워드: 하얀 거짓말(white lies)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be likely to</td><td class=\"m\">~할 가능성이 있다, ~할 것 같다</td></tr><tr><td class=\"w\">in fact</td><td class=\"m\">사실, 사실은</td></tr><tr><td class=\"w\">tell a lie</td><td class=\"m\">거짓말을 하다</td></tr><tr><td class=\"w\">find out</td><td class=\"m\">알게 되다, 밝혀내다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upset</td><td class=\"m\">속상한, 마음이 상한</td></tr><tr><td class=\"w\">consider</td><td class=\"m\">~라고 여기다, 숙고하다</td></tr><tr><td class=\"w\">white lie</td><td class=\"m\">선의의 거짓말</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들에게 물어보라</span><span class=\"en\"><b><span class=\"grammar-hl\">Ask people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 어떻게 느끼는지</span><span class=\"en\"><b><span class=\"grammar-hl\">how they feel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가 그들에게 거짓말을 할 때</span><span class=\"en\"><b>when someone lies to them,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면 그들은 아마 말할 것이다</span><span class=\"en\"><b>and they will likely say</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 싫어한다고</span><span class=\"en\"><b>that they hate it.</b></span></div></div><div class=\"lec-sent-ko\">사람들에게 누군가 그들에게 거짓말을 한다면 기분이 어떨지 물어보라, 그러면 아마도 그건 정말 싫다고 대답할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Ask people...로 시작하는 이 문장은 거짓말에 대한 일반적인 사람들의 부정적 인식을 제시하며 글의 도입부 역할을 합니다. 사람들이 거짓말을 본능적으로 거부한다는 점을 전제로 깔아두고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Ask people how they feel (5형식(SVOC)): &#39;Ask&#39;는 타동사로 &#39;Ask + O + to V&#39; 구조를 취할 수 있으나, 여기서는 &#39;Ask + O(people) + 의문사절(how...)&#39; 구조로 쓰여 &#39;~에게 ~를 묻다&#39;라는 의미를 형성함</div><div class=\"lec-gr-item\">how they feel (간접의문문): &#39;의문사(how) + 주어(they) + 동사(feel)&#39;의 어순으로 구성되어 &#39;Ask&#39;의 목적어 역할을 하는 명사절</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b><span class=\"grammar-hl\">there are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 다른 종류의 거짓말들이</span><span class=\"en\"><b>many different kinds of lies.</b></span></div></div><div class=\"lec-sent-ko\">그러나 거짓말에는 종류가 많다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 일반적인 견해를 However로 뒤집으며, 거짓말을 단순히 나쁜 것으로만 볼 수 없다는 글의 핵심 주제로 논의를 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there are (도치): 유도부사 &#39;there&#39;가 문두에 올 때 &#39;There + V + S&#39; 순서로 도치가 발생함. 여기서는 &#39;many different kinds of lies&#39;가 주어(S)이므로 복수 동사 &#39;are&#39;를 사용함</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실</span><span class=\"en\"><b>In fact,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 모두는 작은 거짓말들을 한다</span><span class=\"en\"><b>we all <span class=\"grammar-hl\">tell</span> small lies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로에게</span><span class=\"en\"><b>to one another</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b>every day.</b></span></div></div><div class=\"lec-sent-ko\">사실, 우리 모두는 서로에게 매일 작은 거짓말들을 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 거짓말이 특별하거나 악의적인 상황에서만 발생하는 것이 아니라, 일상적인 대인관계 속에 흔히 녹아있음을 구체적인 사례를 들기 전 단계에서 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tell (관용표현): &#39;tell a lie(거짓말을 하다)&#39;는 자주 쓰이는 콜로케이션으로, 여기서는 복수형인 &#39;tell small lies&#39;로 사용됨</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in fact</td><td class=\"m\">사실, 사실은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 매우 흔할 뿐만 아니라</span><span class=\"en\"><b><span class=\"grammar-hl\">Not only is this very common</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 우리를 정말로 화나게 만들지 않는다</span><span class=\"en\"><b>it doesn’t really make us upset</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 알게 되었을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when we find out</span>.</b></span></div></div><div class=\"lec-sent-ko\">이건 매우 흔한 일일뿐 아니라 (거짓말임이) 밝혀진 후에라도 우리를 정말 화나게 하진 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;작은 거짓말&#39;이 가진 성격을 설명합니다. 사람들이 이런 거짓말을 대할 때 크게 감정적으로 동요하지 않는다는 점을 지적하며, 이것이 사회적으로 용인되는 범위임을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Not only is this very common (도치): 부정어 &#39;Not only&#39;가 문두로 나가면서 주어와 be동사의 위치가 바뀌는 도치가 발생함. 원래 구조는 &#39;This is not only very common&#39;임</div><div class=\"lec-gr-item\">when we find out (관용표현): &#39;find out&#39;은 &#39;알아내다, 밝혀내다&#39;라는 의미의 구동사(Phrasal verb)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">find out</td><td class=\"m\">알게 되다, 밝혀내다</td></tr><tr><td class=\"w\">upset</td><td class=\"m\">속상한, 마음이 상한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상상해보라</span><span class=\"en\"><b>imagine</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 어머니가 헤어스타일을 바꾸고</span><span class=\"en\"><b>your mother changed her hairstyle</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에게 물어보았을 때를</span><span class=\"en\"><b>and <span class=\"grammar-hl\">asked you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀가 어떻게 보이는지</span><span class=\"en\"><b><span class=\"grammar-hl\">how she looks</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들면, 당신의 어머니가 헤어스타일을 바꾸고는 어떠냐고 물어오셨을 때를 상상해보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;작은 거짓말&#39;이 발생하는 구체적인 상황을 독자가 쉽게 공감할 수 있는 가족 관계를 통해 예시로 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asked you how she looks (간접의문문): &#39;의문사(how) + 주어(she) + 동사(looks)&#39; 순서로 &#39;ask&#39;의 목적어 역할을 하는 명사절</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 당신이 그 스타일을 끔찍하다고 생각할지라도</span><span class=\"en\"><b>Even if you <span class=\"grammar-hl\">consider</span> the style terrible,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 아마 그녀에게 말할 것이다</span><span class=\"en\"><b>you will probably <span class=\"grammar-hl\">tell her</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀가 아주 좋아 보인다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that she looks great</span>.</b></span></div></div><div class=\"lec-sent-ko\">비록 그 스타일이 정말 별로라고 생각할지라도, 아마도 아주 좋아 보인다고 말해 줄 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상대방의 기분을 고려하여 진실을 감추는 상황을 묘사합니다. 이는 거짓말의 내용보다 그것을 행하는 사람의 의도가 더 중요하다는 점을 강조하는 대목입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">consider (5형식(SVOC)): &#39;consider + O + C&#39; 구조에서 목적어(the style)와 보어(terrible)를 결합하여 &#39;O를 C라고 여기다&#39;라는 의미를 나타냄</div><div class=\"lec-gr-item\">tell her that she looks great (4형식(SVOO)): &#39;tell(수여동사) + 간접목적어(her) + 직접목적어(that절)&#39; 구조로 &#39;~에게 ~라는 것을 말하다&#39;라는 의미를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consider</td><td class=\"m\">~라고 여기다, 숙고하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 이것이 거짓말일지라도</span><span class=\"en\"><b>Although this is a lie,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 그것을 말하는 이유는</span><span class=\"en\"><b><span class=\"grammar-hl\">the reason you tell it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 어머니를 사랑하기 때문이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is because</span> you love your mother</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그녀를 상처 주고 싶지 않기 때문이다</span><span class=\"en\"><b>and don’t want <span class=\"grammar-hl\">to hurt</span> her.</b></span></div></div><div class=\"lec-sent-ko\">비록 이것이 거짓말일지라도 당신이 그렇게 말한 이유는 엄마를 사랑하기에 그녀를 기분 나쁘게 하고 싶지 않기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 상황에 대한 분석입니다. the reason you tell it은 거짓말을 도덕적 결함이 아닌, 타인에 대한 애정과 배려의 표현으로 해석해야 한다는 점을 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the reason you tell it is because (관계부사): &#39;the reason&#39; 뒤에 관계부사 &#39;why&#39;가 생략된 구조이며, 뒤에 오는 &#39;you tell it&#39;이 앞의 명사를 수식하는 관계부사절</div><div class=\"lec-gr-item\">to hurt (to부정사): &#39;don&#39;t want&#39;의 목적어 역할을 하는 명사적 용법의 to부정사</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 이것들을 부른다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">call</span> these</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하얀 거짓말이라고</span><span class=\"en\"><b>white lies.</b></span></div></div><div class=\"lec-sent-ko\">이런 것을 하얀 거짓말(선의의 거짓말)이라 부른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 예시를 아우르는 용어인 white lies를 도입하여 개념을 정립합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">call (5형식(SVOC)): &#39;call + O + C&#39; 구조로 &#39;O를 C라고 부르다&#39;라는 의미를 가짐. 여기서는 &#39;these&#39;가 목적어, &#39;white lies&#39;가 목적보어임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">white lie</td><td class=\"m\">선의의 거짓말</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 거짓말일지 모른다</span><span class=\"en\"><b>They may be lies,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 우리는 그것들을 말한다</span><span class=\"en\"><b>but we tell them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 이유 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">for a good reason</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 거짓말일지 모르지만 우리는 선한 목적으로 그런 거짓말을 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론으로, 거짓말이라는 행위 자체보다 그 이면에 담긴 &#39;좋은 의도&#39;에 초점을 맞추어야 한다는 필자의 생각을 요약합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">for a good reason (관용표현): &#39;for a ~ reason&#39;은 &#39;어떤 이유로&#39;라는 의미의 전치사구 관용구</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들은 흔히 거짓말을 싫어한다고 말하지만, 일상 속에는 나쁜 의도가 없는 작은 거짓말이 존재한다.</li><li>상대방을 배려하거나 상처 주지 않기 위해 하는 이런 거짓말을 &#39;선의의 거짓말&#39;이라 한다.</li><li>결국 거짓말의 가치는 결과보다 그것을 하게 된 동기와 이유에 의해 결정된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People generally despise lying, yet they tell white lies to prevent hurting others while maintaining positive relationships.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 대체로 거짓말을 혐오하지만, 타인의 상처를 방지하고 긍정적인 관계를 유지하기 위해 선의의 거짓말을 한다.</div></div></div>"],"segs":[[{"audio":"./point02-2_audio/1.mp3","hl":null}],[{"audio":"./point02-2_audio/2.mp3",
