이 됩니다. 실제로 심리학자 브릭먼(Brickman)의 연구에 따르면, 복권 당첨자들이 일반인보다 일상에서 느끼는 즐거움이 오히려 낮아질 수 있다는 점은 행복에 있어 돈보다 정서적 유대감과 소속감이 얼마나 중요한지를 잘 보여주는 사례라고 할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01통념과 실제의 차이</div><ul><li>많은 사람이 돈을 행복의 열쇠라 믿지만 실제 경험은 이와 다르다.</li><li>돈이 행복을 보장한다는 일반적 믿음 (belief)</li><li>실제로는 그렇지 않다는 현실 (not true)</li><li>핵심 키워드: 행복(happiness)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02갑작스러운 환경의 변화</div><ul><li>복권 당첨자처럼 큰 부를 얻으면 직업과 주거지 등 삶의 기반이 바뀐다.</li><li>직장을 그만둠 (quit their jobs)</li><li>더 크고 좋은 동네로 이사함 (bigger house)</li><li>핵심 키워드: 복권 당첨자(lottery winners)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03여가 시간의 관리 문제</div><ul><li>생활 환경을 바꾼 후 넘쳐나는 자유 시간을 어떻게 보낼지 몰라 방황한다.</li><li>갑자기 늘어난 자유 시간 (free time)</li><li>시간 활용 방법을 찾지 못하는 혼란</li><li>핵심 키워드: 자유 시간(free time)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04사회적 관계의 단절</div><ul><li>부유해지면서 기존 친구들과 멀어지고 새로운 관계 형성에도 어려움을 겪는다.</li><li>친구들이 거리를 두거나 방문을 중단함 (grow distant)</li><li>새로운 동네에서 친구를 사귀기 힘듦</li><li>핵심 키워드: 인간관계(friends)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05행운의 역설적 결말</div><ul><li>행운이라 믿었던 부유함이 결과적으로 이전보다 더 큰 외로움을 초래한다.</li><li>부자가 되기 전보다 더 심한 고독감을 느낌 (lonelier)</li><li>행운(luck)이 정반대의 불운으로 변함 (opposite)</li><li>핵심 키워드: 외로움(lonelier)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">key</td><td class=\"m\">비결, 핵심, 실마리</td></tr><tr><td class=\"w\">simply</td><td class=\"m\">그저, 단순히, 정말로</td></tr><tr><td class=\"w\">lottery</td><td class=\"m\">복권, 추첨, 운</td></tr><tr><td class=\"w\">quit</td><td class=\"m\">그만두다, 사직하다, 중단하다</td></tr><tr><td class=\"w\">neighborhood</td><td class=\"m\">이웃, 인근, 지역</td></tr><tr><td class=\"w\">even worse</td><td class=\"m\">설상가상으로, 더욱 나쁜 것은</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">distant</td><td class=\"m\">(사이가) 소원한, 먼, 거리를 두는</td></tr><tr><td class=\"w\">come over</td><td class=\"m\">(누구의 집에) 들르다, 놀러 오다</td></tr><tr><td class=\"w\">make friends</td><td class=\"m\">친구를 사귀다</td></tr><tr><td class=\"w\">lonely</td><td class=\"m\">외로운, 쓸쓸한</td></tr><tr><td class=\"w\">turn out</td><td class=\"m\">결국 ~임이 밝혀지다, ~로 판명되다</td></tr><tr><td class=\"w\">opposite</td><td class=\"m\">정반대, 상반되는 것</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들은 믿는다</span><span class=\"en\"><b>Many people <span class=\"grammar-hl\">believe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈이 행복의 열쇠라고.</span><span class=\"en\"><b><span class=\"grammar-hl\">that money is</span> the key to happiness.</b></span></div></div><div class=\"lec-sent-ko\">많은 사람들이 돈이 행복의 열쇠라고 믿는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로, 우리 사회에 널리 퍼져 있는 일반적인 통념을 제시합니다. money is the key to happiness라는 표현을 통해 사람들이 물질적 풍요를 행복의 절대적인 조건으로 여기고 있음을 보여주며 앞으로 전개될 비판적 논의의 배경을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">believe that money is 명사절 접속사: 동사 believe의 목적어 역할을 하는 명사절을 이끄는 접속사 that으로, 뒤에는 주어(money)와 동사(is)를 갖춘 완전한 절이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">key</td><td class=\"m\">비결, 핵심, 실마리</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 경험은 보여준다</span><span class=\"en\"><b>But experience <span class=\"grammar-hl\">shows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것이 그야말로 진실이 아님을.</span><span class=\"en\"><b><span class=\"grammar-hl\">that this simply is not true</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 경험은 이것이 진실이 아님을 보여준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 통념을 But이라는 접속사를 사용하여 즉각적으로 반박합니다. experience shows는 이론적인 추측이 아니라 실제 세상에서 벌어지는 구체적인 사례들을 근거로 들어 필자의 주장을 강화하겠다는 의도를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shows that this simply is not true 명사절 접속사: 동사 show의 목적어 역할을 하는 명사절을 이끄는 접속사 that으로, 뒤에는 완전한 구조의 문장이 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">simply</td><td class=\"m\">그저, 단순히, 정말로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">People</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갑자기 매우 부자가 된</span><span class=\"en\"><b><span class=\"grammar-hl\">who suddenly become</span> very rich</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">복권 당첨자처럼</span><span class=\"en\"><b><span class=\"grammar-hl\">such as</span> lottery winners</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 그들의 직업을 그만두고</span><span class=\"en\"><b>often quit their jobs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 큰 집으로 이사한다</span><span class=\"en\"><b>and move to a bigger house</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 좋은 동네의.</span><span class=\"en\"><b>in a nicer neighborhood.</b></span></div></div><div class=\"lec-sent-ko\">복권 당첨자처럼 갑자기 부자가 된 사람들은 종종 직업을 그만두고 더 좋은 동네의 더 큰 집으로 이사한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;경험&#39;에 대한 구체적인 예시를 시작합니다. lottery winners를 통해 돈이 행복을 줄 것이라 믿고 행동에 옮기는 전형적인 방식, 즉 생업을 포기하고 거주 환경을 바꾸는 선택을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">People who suddenly become (관계대명사): 주격 관계대명사 who가 선행사인 People을 수식하며, 관계대명사절 내부에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">such as (관용표현): &#39;~와 같은&#39;이라는 뜻으로, 앞의 일반적인 명사(lottery winners)에 대한 구체적인 예시를 들 때 사용하는 숙어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lottery</td><td class=\"m\">복권, 추첨, 운</td></tr><tr><td class=\"w\">quit</td><td class=\"m\">그만두다, 사직하다, 중단하다</td></tr><tr><td class=\"w\">neighborhood</td><td class=\"m\">이웃, 인근, 지역</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그렇게 한 후에, 하지만,</span><span class=\"en\"><b>After <span class=\"grammar-hl\">doing</span> so, however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 대체로 알지 못한다</span><span class=\"en\"><b>they usually don’t know</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇을 할지</span><span class=\"en\"><b><span class=\"grammar-hl\">what to do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 모든 그들의 여가 시간을 가지고.</span><span class=\"en\"><b>with all of their free time.</b></span></div></div><div class=\"lec-sent-ko\">그러나 이렇게 한 후에 그들은 대체로 그 모든 여가 시간을 가지고 뭘 할지 모르곤 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 부자가 된 후의 선택이 가져온 첫 번째 부작용을 설명합니다. don’t know what to do는 규칙적인 일과가 사라지면서 삶의 목적의식과 방향을 잃고 방황하게 되는 심리적 상태를 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">doing (동명사): 전치사 After의 목적어 역할을 하는 명사적 성격의 어구로, &#39;그렇게 하는 것&#39;이라는 구체적 행위를 나타낸다.</div><div class=\"lec-gr-item\">what to do (to부정사): &#39;의문사 + to부정사&#39; 구조로 쓰여 know의 목적어 역할을 하는 명사구이다. 간접의문문: &#39;무엇을 할지&#39;라는 의미를 나타내며, 문맥상 &#39;what they should do&#39;와 같은 절 형태로 전환할 수 있다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 나쁜 것은,</span><span class=\"en\"><b>Even worse,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 발견할지도 모른다</span><span class=\"en\"><b>they may find</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 친한 친구들이 멀어지고</span><span class=\"en\"><b>that their best friends grow distant</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찾아오는 것을 멈추는 것을</span><span class=\"en\"><b>and stop <span class=\"grammar-hl\">coming</span> over</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방문하기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to visit</span>.</b></span></div></div><div class=\"lec-sent-ko\">더 나쁜 것은, 그들의 친한 친구들이 점점 멀어지고 더 이상 찾아오지 않을 수 있다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Even worse를 사용하여 문제가 개인적 차원을 넘어 사회적 차원으로 악화됨을 보여줍니다. 경제적 수준의 급격한 변화가 기존 인간관계의 균열과 단절을 초래하는 비극적인 상황을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">coming (동명사): stop의 목적어 역할을 하는 명사적 성격의 어구이다. 관용표현: &#39;stop + 동명사&#39; 구조로 쓰여 &#39;~하던 일을 멈추다&#39;라는 의미를 전달한다.</div><div class=\"lec-gr-item\">to visit (to부정사): 부사적 용법(목적)으로 쓰여 &#39;~하기 위해서&#39;라고 해석하며, 앞의 동작(coming over)의 목적을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">even worse</td><td class=\"m\">설상가상으로, 더욱 나쁜 것은</td></tr><tr><td class=\"w\">distant</td><td class=\"m\">(사이가) 소원한, 먼, 거리를 두는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">매우 어려울 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">It can be very difficult</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갑자기 친구를 사귀는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to suddenly make friends</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 동네에서,</span><span class=\"en\"><b>in a new neighborhood,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그들은 종종 더 외로움을 느낀다</span><span class=\"en\"><b>so they often feel lonelier</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 이전에 느꼈던 것보다</span><span class=\"en\"><b>than they ever <span class=\"grammar-hl\">did</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 부자가 되기 전에.</span><span class=\"en\"><b>before they got rich.</b></span></div></div><div class=\"lec-sent-ko\">새로운 동네에서 갑자기 친구를 사귄다는 것은 매우 어려울 수 있다. 그래서 그들은 종종 더 부자가 되기 전의 그 어느 때보다 더 외로움을 느낀다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이전 문장에서 발생한 관계의 결손을 새로운 환경에서도 메우지 못하는 상황을 설명합니다. feel lonelier than they ever did는 물질적 풍요가 오히려 정서적 고립을 심화시켜 과거보다 못한 삶을 살게 된다는 역설적인 결론을 도출합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It can be very difficult to suddenly make friends (가주어): 진주어: 주어 자리에 형식적인 가주어 It을 두고, 실제 주어인 to부정사구(to suddenly make friends)를 문장 뒤로 보낸 구조이다. to부정사: 명사적 용법으로 쓰여 문장의 진짜 주어 역할을 한다.</div><div class=\"lec-gr-item\">did (대동사): 앞 문장의 일반동사 feel이 나타내는 과거 상태를 반복하지 않기 위해 대신 사용되었다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">neighborhood</td><td class=\"m\">이웃, 인근, 지역</td></tr><tr><td class=\"w\">make friends</td><td class=\"m\">친구를 사귀다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">멋진 행운처럼 보였던 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">What seemed like wonderful luck</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정반대가 되어 버린다.</span><span class=\"en\"><b><span class=\"grammar-hl\">turns out</span> the opposite.</b></span></div></div><div class=\"lec-sent-ko\">멋진 행운으로 보였던 일이 정반대가 되어 버린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체를 아우르는 최종 결론입니다. turns out the opposite은 처음에 &#39;행운(돈)&#39;이라고 믿었던 것이 결국 &#39;불행(고립과 공허)&#39;이라는 예상치 못한 결말로 이어졌음을 강조하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What seemed like wonderful luck (관계대명사): 선행사를 포함하는 관계대명사 what이 이끄는 명사절로, 문장 전체의 주어 역할을 수행하며 &#39;~하는 것&#39;으로 해석한다.</div><div class=\"lec-gr-item\">turns out (관용표현): &#39;~인 것으로 판명되다&#39; 또는 &#39;~임이 밝혀지다&#39;라는 의미를 가진 구동사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opposite</td><td class=\"m\">정반대, 상반되는 것</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>많은 이들이 돈이 행복의 필수 요소라 믿지만, 실제 사례들은 그렇지 않음을 보여준다.</li><li>갑자기 큰 부를 얻으면 직장을 그만두고 이사를 하는 등 환경을 바꾸지만, 이는 곧 시간 활용의 어려움과 목적 상실로 이어진다.</li><li>또한 경제적 격차로 인해 예전 친구들과 멀어지며, 새로운 환경에서도 진정한 관계를 맺지 못해 더 큰 외로움을 겪는다.</li><li>결국 행운이라 믿었던 막대한 부가 오히려 삶을 불행하게 만드는 역설적인 결과를 낳는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Great wealth may appear to be a stroke of good luck, yet it often results in profound loneliness by distancing individuals from their social circles.</div>\n              <div class=\"lec-final-sum-ko\">막대한 부는 행운처럼 보일 수 있지만, 개인을 사회적 관계로부터 멀어지게 함으로써 흔히 깊은 외로움을 결과로 낳는다.</div></div></div>"],"segs":[[{"audio":"./apply01_audio/1.mp3","hl":null}],[{"audio":"./apply01_audio/2.mp3","hl":null}],[{"audio":"./apply01_audio/3.mp3","hl":null},{"audio":"./apply01_audio/4.mp3","hl":"stage-0"},{"audio":"./apply01_audio/5.mp3","hl":"stage-1"},{"audio":"./apply01_audio/6.mp3","hl":"stage-2"},{"audio":"./apply01_audio/7.mp3","hl":"stage-3"},{"audio":"./apply01_audio/8.mp3","hl":"stage-4"}],[{"audio":"./apply01_audio/9.mp3","hl":null}],[{"audio":"./apply01_audio/10.mp3","hl":"main"},{"audio":"./apply01_audio/11.mp3","hl":"meaning"},{"audio":"./apply01_audio/12.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/13.mp3","hl":"main"},{"audio":"./apply01_audio/14.mp3","hl":"meaning"},{"audio":"./apply01_audio/15.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/16.mp3","hl":"main"},{"audio":"./apply01_audio/17.mp3","hl":"meaning"},{"audio":"./apply01_audio/18.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/19.mp3","hl":"main"},{"audio":"./apply01_audio/20.mp3","hl":"meaning"},{"audio":"./apply01_audio/21.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/22.mp3","hl":"main"},{"audio":"./apply01_audio/23.mp3","hl":"meaning"},{"audio":"./apply01_audio/24.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/25.mp3","hl":"main"},{"audio":"./apply01_audio/26.mp3","hl":"meaning"},{"audio":"./apply01_audio/27.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/28.mp3","hl":"main"},{"audio":"./apply01_audio/29.mp3","hl":"meaning"},{"audio":"./apply01_audio/30.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/31.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clea
