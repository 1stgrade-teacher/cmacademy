지대(comfort zone)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02도전 기회의 거절 사례</div><ul><li>불안감이나 자기 인식의 부족으로 인해 성장할 수 있는 구체적인 기회들을 스스로 포기한다.</li><li>긴장감 때문에 대중 발표(public presentation)를 회피함</li><li>자신을 모험적이지 않다고 여겨 유학(study abroad) 기회를 거절함</li><li>핵심 키워드: 모험심(adventurous)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03스스로 설정한 한계의 심리</div><ul><li>사람들은 자신이 설정한 한계라는 관념 속에 갇혀 그 이상의 변화를 요구받을 때 방어적인 태도를 보인다.</li><li>자신의 한계에 대한 관념(conception of limits)에 갇힘</li><li>한계를 넘어서라는(step beyond) 요구를 받을 때 화를 냄</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04변화와 도전의 수용</div><ul><li>한계를 두는 태도는 큰 실수이므로 매 순간 긍정적인 태도로 새로운 도전을 받아들여야 한다.</li><li>한계를 설정하는 태도는 거대한 실수(huge mistake)임</li><li>가능한 자주 &#39;예&#39;라고 답하며 새로운 도전(new challenges)을 환영함</li><li>핵심 키워드: 도전(challenges)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">limit</td><td class=\"m\">제한하다, 한정하다</td></tr><tr><td class=\"w\">narrow</td><td class=\"m\">좁은, 한정된</td></tr><tr><td class=\"w\">comfort zone</td><td class=\"m\">안주 구역, 편안함을 느끼는 범주</td></tr><tr><td class=\"w\">opportunity</td><td class=\"m\">기회</td></tr><tr><td class=\"w\">make a presentation</td><td class=\"m\">발표하다</td></tr><tr><td class=\"w\">reject</td><td class=\"m\">거절하다, 거부하다</td></tr><tr><td class=\"w\">study abroad</td><td class=\"m\">유학하다, 해외에서 공부하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">adventurous</td><td class=\"m\">모험적인, 모험을 즐기는</td></tr><tr><td class=\"w\">be stuck in</td><td class=\"m\">~에 갇히다, ~에 빠져 움직이지 못하다</td></tr><tr><td class=\"w\">conception</td><td class=\"m\">개념, 생각</td></tr><tr><td class=\"w\">step beyond</td><td class=\"m\">~을 넘어서다, ~의 밖으로 나가다</td></tr><tr><td class=\"w\">attitude</td><td class=\"m\">태도, 사고방식</td></tr><tr><td class=\"w\">at every turn</td><td class=\"m\">늘, 매번, 도처에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리 모두는 사람들을 만난 적이 있다</span><span class=\"en\"><b>We’ve all met people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 삶을 한정시키는</span><span class=\"en\"><b><span class=\"grammar-hl\">who limit their lives</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능한 한 가장 좁은 범위에서</span><span class=\"en\"><b>in the narrowest possible terms.</b></span></div></div><div class=\"lec-sent-ko\">우리 모두는 가능한 한 좁은 한계 안에서 자신의 삶을 한정시키는 사람들을 만난 적이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 도입부로, 스스로를 가두고 사는 사람들의 보편적인 특징을 제시하며 논의를 시작합니다. limit their lives in the narrowest possible terms는 자신이 할 수 있는 일과 없는 일을 아주 엄격하고 좁게 규정하여, 새로운 가능성을 원천 봉쇄하며 살아간다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who limit their lives (관계대명사): 주격 관계대명사 who가 선행사인 people을 수식하며, 관계대명사절 내에서 주어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">limit</td><td class=\"m\">제한하다, 한정하다</td></tr><tr><td class=\"w\">narrow</td><td class=\"m\">좁은, 한정된</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 머물러 있다</span><span class=\"en\"><b>They stay</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제한되고 편안한 구역에</span><span class=\"en\"><b>in a <span class=\"grammar-hl\">limited comfort zone</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 제한되고 편안한 환경에 머물러 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;삶을 제한하는 방식&#39;이 구체적으로 어떤 모습인지 설명합니다. stay in a limited comfort zone은 낯설거나 위협적인 상황을 피하고, 오직 자신에게 익숙하고 심리적으로 안전하다고 느끼는 영역 안에서만 활동하려 한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">limited comfort zone (과거분사(형용사)): limited가 comfort zone을 수식하며 &#39;제한된 안락 지대&#39;라는 의미를 나타낸다. (p.p. + N 구조)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">limit</td><td class=\"m\">제한하다, 한정하다</td></tr><tr><td class=\"w\">comfort zone</td><td class=\"m\">안주 구역, 편안함을 느끼는 범주</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들은 기회를 피한다</span><span class=\"en\"><b>Some people avoid the <span class=\"grammar-hl\">opportunity</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대중 앞에서 발표를 하는</span><span class=\"en\"><b><span class=\"grammar-hl\">to make</span> a public presentation</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 그들을 긴장시키기 때문에</span><span class=\"en\"><b>because it <span class=\"grammar-hl\">makes them nervous</span>.</b></span></div></div><div class=\"lec-sent-ko\">어떤 사람들은 그들을 긴장시킨다는 이유로 대중 앞에서 발표할 기회를 피한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 편안한 구역에만 머물려는 태도의 첫 번째 구체적인 사례입니다. avoid the opportunity는 발표를 통해 얻을 수 있는 성장이나 성취보다, 당장 느끼는 심리적 불안감을 해소하는 것을 더 우선시하여 발전의 기회를 스스로 발로 차버린다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">opportunity to make (to부정사): 형용사적 용법으로 명사 opportunity를 수식하여 &#39;~할 기회&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">makes them nervous 5형식(SVOC) 구조: 동사 make + 목적어(them) + 목적격 보어(형용사 nervous) 구조로, 목적어를 보어한 상태로 만든다는 의미다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opportunity</td><td class=\"m\">기회</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또 다른 사람들은 유학할 기회를 거부한다</span><span class=\"en\"><b>Others reject a <span class=\"grammar-hl\">chance to study</span> abroad</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신을 도전적이라고 생각하지 않기 때문에</span><span class=\"en\"><b>because they don’t <span class=\"grammar-hl\">consider themselves adventurous</span>.</b></span></div></div><div class=\"lec-sent-ko\">또 다른 사람들은 자신을 도전적인 유형의 사람이 아니라고 생각하여 유학의 기회를 거부한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 이어지는 두 번째 사례로, 자아상에 갇힌 모습을 보여줍니다. don’t consider themselves adventurous는 본인의 성격을 &#39;모험심 없는 사람&#39;으로 미리 단정 짓고, 그 틀에 맞춰 해외 유학처럼 환경을 크게 바꾸는 경험을 거부하며 변화를 거부한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">chance to study (to부정사): 형용사적 용법으로 명사 chance를 수식하여 &#39;~할 기회&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">consider themselves adventurous 5형식(SVOC) 구조: 동사 consider + 목적어(themselves) + 목적격 보어(형용사 adventurous) 구조로, 목적어를 보어라고 여기다라는 의미다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reject</td><td class=\"m\">거절하다, 거부하다</td></tr><tr><td class=\"w\">study abroad</td><td class=\"m\">유학하다, 해외에서 공부하다</td></tr><tr><td class=\"w\">adventurous</td><td class=\"m\">모험적인, 모험을 즐기는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 갇히게 된다</span><span class=\"en\"><b>People become stuck</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 자신만의 한계에 대한 관념에</span><span class=\"en\"><b>in their own conception of their limits,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그들은 분노하게 된다</span><span class=\"en\"><b>so they become angry</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 한계를 넘어서도록 요청받을 때</span><span class=\"en\"><b>when they <span class=\"grammar-hl\">are asked to step</span> beyond them.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 그들 자신만의 한계에 갇혀서, 그 한계를 넘어서도록 요청받을 때 분노하게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시한 사례들의 심리적 기저와 그로 인한 부작용을 설명합니다. become stuck in their own conception은 스스로 정한 한계를 절대적인 진리로 믿게 된다는 뜻이며, become angry는 타인의 조언이나 변화의 요구를 자신의 안전한 세계를 파괴하려는 공격으로 받아들여 방어적인 태도를 보인다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are asked to step (수동태): are asked to step. ask는 타동사(목적어를 취하는 동사)인데 뒤에 목적어가 없어서 수동구조 be동사(are)+p.p.(asked) 형태로 쓴다. 본래 ask + O + toV(5형식) 구조에서 목적어가 주어로 나가고 목적격 보어인 to step이 그대로 남은 형태다. 기본구조: ask + O + toV</div><div class=\"lec-gr-item\">to step (to부정사): 5형식 수동태(are asked) 뒤에 남은 목적격 보어로, &#39;~하도록&#39;이라는 행위의 내용을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">limit</td><td class=\"m\">제한하다, 한정하다</td></tr><tr><td class=\"w\">conception</td><td class=\"m\">개념, 생각</td></tr><tr><td class=\"w\">step beyond</td><td class=\"m\">~을 넘어서다, ~의 밖으로 나가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">삶에 대한 이러한 태도는</span><span class=\"en\"><b><span class=\"grammar-hl\">This attitude toward life</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 실수이다</span><span class=\"en\"><b>is a huge mistake.</b></span></div></div><div class=\"lec-sent-ko\">그러나 삶에 대한 이러한 태도는 큰 실수이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> however를 기점으로 글의 분위기를 반전시키며 필자의 주장을 드러냅니다. is a huge mistake는 한계 안에 머무는 것이 안전해 보일지 몰라도, 장기적으로는 인생의 귀중한 가치와 성장을 모두 잃게 만드는 치명적인 선택임을 강조하는 표현입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This attitude toward life (주어부): 명사 This attitude가 주어이며, 전치사구인 toward life가 이를 수식하는 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">attitude</td><td class=\"m\">태도, 사고방식</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">새로운 도전을 환영하라</span><span class=\"en\"><b>Welcome new challenges</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매 순간</span><span class=\"en\"><b><span class=\"grammar-hl\">at every turn</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;예&quot;라고 말하면서</span><span class=\"en\"><b><span class=\"grammar-hl\">saying yes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능한 한 자주</span><span class=\"en\"><b>as often as possible.</b></span></div></div><div class=\"lec-sent-ko\">항상 새로운 도전을 환영해라 그리고 가능한 한 자주 그 도전을 받아들여라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 결론이자 독자에게 주는 지침입니다. saying yes as often as possible은 두려움 때문에 본능적으로 거절하려 할 때, 의도적으로 그 벽을 깨고 새로운 제안이나 기회를 수용하여 삶의 영역을 확장해 나가라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">saying yes (분사구문): 현재분사 saying이 이끄는 분사구문으로, 주절의 동작과 동시에 일어나는 상황을 설명한다. 원래 절인 while you say yes로 변환할 수 있다.</div><div class=\"lec-gr-item\">at every turn (관용표현): &#39;매번&#39;, &#39;늘&#39;, &#39;곳곳에서&#39;라는 의미를 가진 숙어 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at every turn</td><td class=\"m\">늘, 매번, 도처에</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>많은 사람들이 스스로 정한 좁은 한계와 편안한 구역(Comfort Zone) 안에만 머물려 한다.</li><li>발표를 피하거나 유학 기회를 거절하는 등, 두려움과 자아상에 갇혀 성장의 기회를 놓친다.</li><li>이러한 한계 속에 갇히면 타인의 조언에도 방어적이고 화를 내는 태도를 보이게 된다.</li><li>필자는 이런 태도가 큰 실수임을 지적하며, 매 순간 도전을 받아들이고 &quot;예&quot;라고 대답하는 적극적인 삶을 권장한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People often limit their potential by staying within a narrow comfort zone, whereas welcoming new challenges is essential for living a more expansive life.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 종종 좁은 편안한 구역 안에 머물며 자신의 잠재력을 제한하는 반면, 더 확장된 삶을 살기 위해서는 새로운 도전을 받아들이는 것이 필수적이다.</div></div></div>"],"segs":[[{"audio":"./apply03_audio/1.mp3","hl":null}],[{"audio":"./apply03_audio/2.mp3","hl":null}],[{"audio":"./apply03_audio/3.mp3","hl":null},{"audio":"./apply03_audio/4.mp3","hl":"stage-0"},{"audio":"./apply03_audio/5.mp3","hl":"stage-1"},{"audio":"./apply03_audio/6.mp3","hl":"stage-2"},{"audio":"./apply03_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply03_audio/8.mp3","hl":null}],[{"audio":"./apply03_audio/9.mp3","hl":"main"},{"audio":"./apply03_audio/10.mp3","hl":"meaning"},{"audio":"./apply03_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/12.mp3","hl":"main"},{"audio":"./apply03_audio/13.mp3","hl":"meaning"},{"audio":"./apply03_audio/14.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/15.mp3","hl":"main"},{"audio":"./apply03_audio/16.mp3","hl":"meaning"},{"audio":"./apply03_audio/17.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/18.mp3","hl":"main"},{"audio":"./apply03_audio/19.mp3","hl":"meaning"},{"audio":"./apply03_audio/20.mp3","hl" if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
