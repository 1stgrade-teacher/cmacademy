R9c+lAYEZyMZPfPQ/5+lDt1/H7/APggOo6fT/8AXn/P+SgYHHI5z3Hbr+Xf0paP61AKQnAJ6YB6+1GR6j8x/nsT+dIx2qx9FJ/IZo3A/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Fragrant Productivity: How Scents Shape Employee Moods at Work<small>향기로운 생산성: 향기가 직장에서 직원의 기분을 형성하는 방식</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리 코로 들어오는 향기는 뇌의 감정과 기억을 담당하는 대뇌 변연계(Limbic System)에 직접 전달되어 즉각적인 심리 변화를 일으키는데, 이를 활용한 치료나 보조 수단을 향기 요법(Aromatherapy)이라고 부릅니다. 환경 심리학(Environmental Psychology) 연구들에 따르면 레몬처럼 상큼한 향은 뇌를 깨워 주의력(Attention)을 높여주고, 장미 향은 긴장을 완화해 정서적 안정감을 주는 등 향기마다 고유한 기능이 있다고 해요. 마치 아침에 맡는 고소한 커피 향이 기분을 좋게 만드는 것처럼, 숲속의 상쾌한 느낌을 주는 피톤치드(Phytoncide) 효과를 실내에 재현하면 스트레스를 줄이고 심리적 회복을 도울 수 있습니다. 이처럼 특정 향기를 업무 공간에 배치하는 것은 단순한 취향의 문제를 넘어 구성원의 생산성(Productivity)과 심리적 웰빙을 전략적으로 관리하려는 과학적인 시도라고 이해할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01연구 배경 및 기업의 도입</div><ul><li>향기가 근로자의 태도에 영향을 준다는 연구를 바탕으로 공장에 시스템을 구축했다.</li><li>연구 결과: 향기가 직원들의 태도(attitudes)에 미치는 영향 확인</li><li>사례: 일본 기업의 공장 내 향기 분사 파이프(pipes)망 설치</li><li>핵심 키워드: 향기(smell), 근로자(workers)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02시간대별 맞춤형 향기 제공</div><ul><li>근무 시간의 흐름에 맞추어 세 가지 다른 향기를 순차적으로 살포한다.</li><li>일과 시작: 활기찬 레몬(lemons) 향 분사</li><li>점심시간: 달콤한 장미(roses) 향으로 교체</li><li>일과 후반: 숲속 느낌을 주는 나무(trees) 향기 제공</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03향기가 가져오는 심리적 효과</div><ul><li>각각의 향기는 시간대에 적합한 구체적인 정서적 이점을 제공한다.</li><li>레몬: 업무 시작 시 행복한(happy) 기분 조성</li><li>장미: 바쁜 오전 이후의 진정(calm) 및 휴식 제공</li><li>나무: 야외(outdoors)에 있는 듯한 상쾌하고 즐거운 느낌 유발</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reveal</td><td class=\"m\">드러내다, 밝히다</td></tr><tr><td class=\"w\">influence</td><td class=\"m\">영향을 미치다, 작용하다</td></tr><tr><td class=\"w\">attitude</td><td class=\"m\">태도, 사고방식</td></tr><tr><td class=\"w\">with this in mind</td><td class=\"m\">이것을 염두에 두고, 이러한 이유로</td></tr><tr><td class=\"w\">equip</td><td class=\"m\">갖추다, 설비하다</td></tr><tr><td class=\"w\">network</td><td class=\"m\">망, 체계</td></tr><tr><td class=\"w\">release</td><td class=\"m\">방출하다, 발산하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">specific</td><td class=\"m\">특정한, 구체적인</td></tr><tr><td class=\"w\">scent</td><td class=\"m\">향기, 냄새</td></tr><tr><td class=\"w\">pump</td><td class=\"m\">주입하다, 퍼 올리다</td></tr><tr><td class=\"w\">replace</td><td class=\"m\">대체하다, 바꾸다</td></tr><tr><td class=\"w\">calm down</td><td class=\"m\">~을 진정시키다, 평온해지다</td></tr><tr><td class=\"w\">relaxed</td><td class=\"m\">편안한, 느긋한</td></tr><tr><td class=\"w\">outdoors</td><td class=\"m\">야외, 옥외</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">연구들은 밝혀냈다</span><span class=\"en\"><b>Studies have revealed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">냄새가 근무자들의 태도에 영향을 준다는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">that smell influences the attitudes of workers</span>.</b></span></div></div><div class=\"lec-sent-ko\">연구들은 냄새가 근무자들의 태도에 영향을 준다는 것을 밝혀냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 주제를 제시하는 도입부입니다. smell influences the attitudes는 특정한 향기가 사람의 기분이나 업무를 대하는 마음가짐을 긍정적으로 혹은 부정적으로 변화시킬 수 있다는 과학적 근거를 바탕으로 한 전제입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that smell influences the attitudes of workers 명사절 접속사: 타동사 reveal의 목적어 역할을 하는 that절로, 뒤에 주어(smell)와 동사(influences)를 갖춘 완전한 문장이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reveal</td><td class=\"m\">드러내다, 밝히다</td></tr><tr><td class=\"w\">influence</td><td class=\"m\">영향을 미치다, 작용하다</td></tr><tr><td class=\"w\">attitude</td><td class=\"m\">태도, 사고방식</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것을 염두에 두고,</span><span class=\"en\"><b><span class=\"grammar-hl\">With this in mind</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 일본 회사가 설치했다</span><span class=\"en\"><b>a Japanese company has <span class=\"grammar-hl\">equipped</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공장들 중 한 곳에</span><span class=\"en\"><b><span class=\"grammar-hl\">one of its factories</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">파이프 연결망을</span><span class=\"en\"><b><span class=\"grammar-hl\">with a network of pipes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 냄새를 실어 나르고 방출하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that carry and release specific smells</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">근무일의 여러 시간대에.</span><span class=\"en\"><b>at different times of the work day.</b></span></div></div><div class=\"lec-sent-ko\">이것을 염두에 두고, 한 일본 회사가 공장들 중 한 곳에 특별한 냄새를 근무일의 여러 시간대에 퍼뜨리는 파이프 연결망을 설치했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 &#39;연구 결과&#39;를 실제 기업 경영에 적용한 사례를 소개합니다. equipped one of its factories with a network of pipes는 단순히 향기를 피우는 수준을 넘어, 공장 전체에 향기를 골고루 퍼뜨리기 위해 전문적인 설비를 갖추었다는 구체적인 실행 방식을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">With this in mind (관용표현): &#39;이것을 염두에 두고&#39;라는 의미의 숙어다.</div><div class=\"lec-gr-item\">equipped one of its factories with a network of pipes (관용표현): equip A with B (A에게 B를 갖추게 하다) 구조가 사용되었다.</div><div class=\"lec-gr-item\">that carry and release specific smells (관계대명사): 선행사 pipes를 수식하는 주격 관계대명사절이다. that 뒤에 주어가 없는 불완전한 절이 이어지며 선행사를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">with this in mind</td><td class=\"m\">이것을 염두에 두고, 이러한 이유로</td></tr><tr><td class=\"w\">equip</td><td class=\"m\">갖추다, 설비하다</td></tr><tr><td class=\"w\">network</td><td class=\"m\">망, 체계</td></tr><tr><td class=\"w\">release</td><td class=\"m\">방출하다, 발산하다</td></tr><tr><td class=\"w\">specific</td><td class=\"m\">특정한, 구체적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하루의 시작에는,</span><span class=\"en\"><b>At the start of the day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">레몬 향기가</span><span class=\"en\"><b>the scent of lemons</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뿜어진다</span><span class=\"en\"><b><span class=\"grammar-hl\">is pumped</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건물 안으로.</span><span class=\"en\"><b>into the building.</b></span></div></div><div class=\"lec-sent-ko\">하루의 시작에는 레몬 향기가 건물 안으로 뿜어졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;시간대별 특정 냄새&#39;의 첫 번째 예시입니다. the scent of lemons is pumped는 활기차게 일을 시작해야 하는 아침 시간에 맞춰 상큼한 향기를 의도적으로 제공하고 있음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is pumped (수동태): be동사(is)+p.p.(pumped) 구조. pump는 타동사인데 뒤에 목적어가 없어서 수동구조 is pumped 형태로 쓴다. 기본구조: V + O + into B (A를 B로 퍼 올리다/보내다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scent</td><td class=\"m\">향기, 냄새</td></tr><tr><td class=\"w\">pump</td><td class=\"m\">주입하다, 퍼 올리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 교체된다</span><span class=\"en\"><b>This <span class=\"grammar-hl\">is replaced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달콤한 장미향으로</span><span class=\"en\"><b><span class=\"grammar-hl\">by</span> the sweet smell of roses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점심때.</span><span class=\"en\"><b>at lunchtime.</b></span></div></div><div class=\"lec-sent-ko\">이것은 점심때면 달콤한 장미향으로 교체되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간의 흐름에 따른 향기의 변화를 설명하며 앞 문장과 대조를 이룹니다. replaced by the sweet smell of roses는 아침의 활력보다는 휴식과 여유가 필요한 점심시간의 특성에 맞춰 향기의 종류를 전략적으로 전환했다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is replaced by (수동태): be동사(is)+p.p.(replaced) 구조. replace는 타동사인데 뒤에 목적어가 없어서 수동구조 is replaced 형태로 쓴다. 기본구조: V + O + with/by B (A를 B로 교체하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">replace</td><td class=\"m\">대체하다, 바꾸다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오후에,</span><span class=\"en\"><b>Later in the day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직원들은 나무 향기를 맡을 수 있다.</span><span class=\"en\"><b>workers <span class=\"grammar-hl\">can smell</span> the scent of trees.</b></span></div></div><div class=\"lec-sent-ko\">오후에 직원들은 나무 향기를 맡을 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 하루가 마무리되어 가는 시점의 향기를 언급합니다. the scent of trees는 숲속에 있는 듯한 자연스러운 느낌을 주어, 업무 끝 무렵에 쌓인 정신적 피로를 덜어주려는 의도가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can smell (조동사): 능력이나 가능성을 나타내는 조동사 can 뒤에 동사원형 smell이 위치한 기본 서술어 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scent</td><td class=\"m\">향기, 냄새</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 회사에 따르면,</span><span class=\"en\"><b><span class=\"grammar-hl\">According to</span> the company,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">레몬 향은</span><span class=\"en\"><b>the lemon smell</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 이들을 기분 좋게 해준다</span><span class=\"en\"><b><span class=\"grammar-hl\">makes everyone happy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 처음 일하기 시작할 때.</span><span class=\"en\"><b>when they first start <span class=\"grammar-hl\">to work</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 회사에 따르면, 레몬 향은 처음 일하기 시작할 때 모든 이들을 기분 좋게 해준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에서 언급한 레몬 향의 구체적인 효과를 설명합니다. makes everyone happy는 출근 직후의 무거운 기분을 상쾌하게 반전시켜 업무에 몰입할 수 있는 최적의 심리 상태를 유도한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">According to (관용표현): &#39;~에 따르면&#39;이라는 의미로 뒤에 명사(the company)가 오는 전치사구 역할을 한다.</div><div class=\"lec-gr-item\">makes everyone happy 5형식(SVOC) 구조: 동사(make) + 목적어(everyone) + 목적격보어(happy) 구조다. 목적격보어 자리에 형용사가 와서 목적어의 상태를 설명한다.</div><div class=\"lec-gr-item\">to work (to부정사): 동사 start의 목적어 역할을 하는 명사적 용법으로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">장미향은</span><span class=\"en\"><b>The rose smell</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 진정시켜주고 편안하게 유지시켜 준다</span><span class=\"en\"><b><span class=\"grammar-hl\">calms them down</span> and <span class=\"grammar-hl\">keeps them relaxed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바쁜 아침 뒤에.</span><span class=\"en\"><b>after a busy morning.</b></span></div></div><div class=\"lec-sent-ko\">장미향은 바쁜 아침의 일 후에 그들을 진정시켜주고 편안하게 유지시켜 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장의 장미 향이 왜 선택되었는지 그 이유를 뒷받침합니다. calms them down and keeps them relaxed는 고도의 집중력을 발휘했던 오전 업무의 긴장을 풀고 충분한 재충전을 돕는다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">calms them down (관용표현): calm down(진정시키다)은 이어동사(구동사)로, 목적어가 대명사(them)일 때는 반드시 동사와 부사 사이에 위치해야 한다.</div><div class=\"lec-gr-item\">keeps them relaxed 5형식(SVOC) 구조: 동사(keep) + 목적어(them) + 목적격보어(relaxed) 구조다. 목적어인 &#39;그들&#39;이 편안해진 상태를 유지하는 것이므로 목적격보어 자리에 과거분사(p.p.)가 쓰였다.</div><div class=\"lec-gr-item\">relaxed (과거분사(형용사)): relaxed가 목적어인 them의 상태를 수식하는 보어로 쓰였으며, 수동적 의미(~하게 된)를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relaxed</td><td class=\"m\">편안한, 느긋한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 나무 향은</span><span class=\"en\"><b>And the smell of trees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모두에게 선사한다</span><span class=\"en\"><b><span class=\"grammar-hl\">gives everyone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야외에 있는 듯한 즐거운 느낌을.</span><span class=\"en\"><b><span class=\"grammar-hl\">the enjoyable feeling</span> <span class=\"grammar-hl\">of being outdoors</span>.</b></span></div></div><div class=\"lec-sent-ko\">그리고 나무 향은 모두에게 야외에 있는 듯한 즐거운 느낌을 선사한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막으로 5번 문장의 나무 향이 주는 심리적 보상을 설명하며 글을 마무리합니다. the enjoyable feeling of being outdoors는 폐쇄된 공장 안에서 하루 종일 일하는 노동자들에게 개방감과 쾌적함을 주어 퇴근 전까지 긍정적인 기분을 유지하게 한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">gives everyone the enjoyable feeling 4형식(SVOO) 구조: 동사(give) + 간접목적어(everyone) + 직접목적어(the enjoyable feeling) 구조로 &#39;~에게 ...을 주다&#39;는 의미다.</div><div class=\"lec-gr-item\">of being outdoors (동명사): 전치사 of의 목적어로 쓰였으며, &#39;~인 것&#39;이라는 의미의 명사적 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">outdoors</td><td class=\"m\">야외, 옥외</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>향기가 노동자의 기분과 태도에 영향을 미친다는 연구 결과가 있다.</li><li>한 일본 기업은 이를 활용해 공장에 시간대별로 다른 향기를 내뿜는 설비를 설치했다.</li><li>아침에는 레몬 향(활력), 점심에는 장미 향(안정), 오후에는 나무 향(상쾌함)을 제공한다.</li><li>각 향기는 노동자의 심리를 조절하여 업무 효율과 복지를 높이는 역할을 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Specific scents are strategically released in workplaces to manage employee attitudes by providing various emotional benefits throughout the workday.</div>\n              <div class=\"lec-final-sum-ko\">직원들의 태도를 관리하기 위해 근무 시간 내내 다양한 정서적 이점을 제공함으로써 특정 향기가 작업장에 전략적으로 배포된다.</div></div></div>"],"segs":[[{"audio":"./review2_audio/1.mp3","hl":null}],[{"audio":"./review2_audio/2.mp3","hl":null}],[{"audio":"./review2_audio/3.mp3","hl":null},{"audio":"./review2_audio/4.mp3","hl":"stage-0"},{"audio":"./review2_audio/5.mp3","hl":"stage-1"},{"audio":"./review2_audio/6.mp3","hl":"st
