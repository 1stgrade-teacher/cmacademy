래 입는다고 정말 세균이 더 많이 번식할까?</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에, 미생물 군집(Microbiome)과 옷감의 관계에 대해 미리 알면 아주 흥미로울 거예요. 우리 주변이나 옷 위에는 눈에 보이지 않는 다양한 세균들이 살고 있는데, 이런 미생물은 특정 수치에 도달하면 더 이상 급격하게 늘어나지 않고 상태를 유지하려는 성질(Homeostasis)을 가지고 있답니다. 마치 좁은 방에 더 이상 사람이 들어갈 자리가 없으면 인구 밀도가 일정하게 유지되는 것과 같은 원리죠. 이번 지문에서는 섬유 과학(Textile Science)적 관점에서 청바지의 박테리아 상태를 분석한 실험을 다루고 있는데, 우리가 흔히 생각하는 &#39;빨래의 정의&#39;가 실제 과학적으로는 어떤 의미를 갖는지 생각하며 읽어보세요. 특히 의류를 자주 세탁하지 않아도 세균 수치가 크게 달라지지 않는다는 점은 위생에 대한 우리의 고정관념을 다시금 생각하게 하는 재미있는 관점을 제공해 줄 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01실험의 시작</div><ul><li>청바지를 장기간 세탁하지 않았을 때 세균이 얼마나 번식하는지 확인하기 위한 실험이 진행되었다.</li><li>실험 대상: 15개월 동안 세탁하지 않은 청바지</li><li>연구자: 섬유 과학자 맥퀸 박사(Dr. McQueen)</li><li>핵심 키워드: 세균(bacteria), 청바지(jeans)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02실험 과정 및 비교</div><ul><li>장기간 착용한 청바지와 단기간 착용한 청바지의 세균 수치를 비교 분석하였다.</li><li>비교군: 15개월 착용 청바지 vs 2주 착용 청바지</li><li>분석 방식: 청바지 표면의 세균 샘플링(sampling)</li><li>핵심 키워드: 세균 번식(bacteria growth)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실험 결과</div><ul><li>놀랍게도 청바지 착용 기간에 따른 세균 번식 정도에는 유의미한 차이가 없었다.</li><li>결과: 착용 기간과 무관하게 세균 수준은 동일(about the same)</li><li>시사점: 세탁 횟수가 세균 증식에 큰 영향을 미치지 않음</li><li>핵심 키워드: 동일한 결과(the same results)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04위생 및 실용적 관점</div><ul><li>청바지의 위생 상태와 더불어 일상적인 착용 가능성에 대해 확인하였다.</li><li>악취 관리: 일주일에 3번 정도 통풍(air out) 시킴</li><li>사회적 영향: 세탁하지 않아도 주변 관계에 문제가 없음</li><li>핵심 키워드: 통풍(air out), 위생(hygiene)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">depending on</td><td class=\"m\">~에 달려 있는, ~에 따라</td></tr><tr><td class=\"w\">textile</td><td class=\"m\">섬유, 직물</td></tr><tr><td class=\"w\">sample</td><td class=\"m\">샘플을 채취하다, 시험하다</td></tr><tr><td class=\"w\">bacteria</td><td class=\"m\">박테리아, 세균</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pass</td><td class=\"m\">(시간이) 흐르다, 지나다</td></tr><tr><td class=\"w\">air out</td><td class=\"m\">바람을 쐬다, 환기하다</td></tr><tr><td class=\"w\">reportedly</td><td class=\"m\">전하는 바에 의하면, 소문에 의하면</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 너무 바쁘다면</span><span class=\"en\"><b>If you’re <span class=\"grammar-hl\">too busy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세탁을 하기에</span><span class=\"en\"><b><span class=\"grammar-hl\">to do</span> laundry,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">걱정하지 마라</span><span class=\"en\"><b>don’t worry</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것에 대해</span><span class=\"en\"><b>about it.</b></span></div></div><div class=\"lec-sent-ko\">너무 바빠 세탁을 할 수 없다 하더라도 걱정하지 마라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 일상적인 고민을 언급하며, 세탁에 대한 부담감을 덜어주는 글의 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">too busy to do (to부정사): &#39;too + 형용사 + to부정사&#39; 구조로 &#39;~하기에는 너무 ~한&#39;이라는 의미를 가짐. to부정사가 형용사(busy)의 정도를 보충함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">최소한 당신의 청바지는 깨끗한 상태를 유지할 것이다</span><span class=\"en\"><b>At least your jeans will stay clean,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 정의에 따라</span><span class=\"en\"><b><span class=\"grammar-hl\">depending on</span> your definition</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“깨끗한”이라는</span><span class=\"en\"><b>of “clean.”</b></span></div></div><div class=\"lec-sent-ko\">“깨끗한” 상태에 대한 여러분의 정의에 따라 여러분의 바지는 최소한 깨끗함을 유지할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 조언에 대한 근거를 제시하기 시작합니다. &#39;청결&#39;을 바라보는 기준에 따라 위생 상태가 달라질 수 있다는 역설적인 상황을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">depending on (현재분사): 문장 전체를 수식하는 분사구문으로, &#39;~에 따라서&#39;라는 의미를 가짐. 원래 절로 바꾸면 &#39;as it depends on&#39; 형태임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">depending on</td><td class=\"m\">~에 달려 있는, ~에 따라</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">세탁하지 않은 청바지 한 벌을 입고 난 후에</span><span class=\"en\"><b>After <span class=\"grammar-hl\">wearing</span> a pair of <span class=\"grammar-hl\">unwashed</span> jeans</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">15개월 동안</span><span class=\"en\"><b>for fifteen months,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Josh Le는</span><span class=\"en\"><b>Josh Le,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Alberta 대학의 학생인</span><span class=\"en\"><b>a student at the University of Alberta,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 건네주었다</span><span class=\"en\"><b>handed them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">McQueen 박사에게</span><span class=\"en\"><b>to Dr. McQueen,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직물 연구학자인</span><span class=\"en\"><b>a textile scientist.</b></span></div></div><div class=\"lec-sent-ko\">Alberta 대학의 학생인 Josh Le는 바지 한 벌을 15개월 동안 세탁하지 않고 입고 다닌 후 그 바지를 직물연구학자인 McQueen 박사에게 건네주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일반적인 위생 통념을 검증하기 위해 학생이 직접 수행한 실험 과정을 소개하는 예시의 시작입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wearing (동명사): 전치사 &#39;After&#39;의 목적어로 쓰인 동명사 구조임</div><div class=\"lec-gr-item\">unwashed (과거분사): &#39;씻겨지지 않은&#39;이라는 의미로 뒤의 명사(jeans)를 수식하는 형용사 역할. 과거분사가 명사를 수식할 때는 &#39;과거분사된 N&#39; 또는 &#39;N that is/was p.p.&#39;의 의미를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">textile</td><td class=\"m\">섬유, 직물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 박테리아를 표본 조사했다</span><span class=\"en\"><b>She sampled the bacteria</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 청바지에 살고 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">living</span> on the jeans.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 그 바지에 기생하고 있는 박테리아를 표본으로 조사했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 전달된 청바지의 미생물 상태를 확인하려는 구체적인 연구 행동을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">living (현재분사): 앞의 명사(bacteria)를 수식함. 명사 기준에서 &#39;~하는/…인&#39; 상태를 나타내며 &#39;bacteria that is living&#39;과 같은 관계대명사절로 볼 수 있음</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sample</td><td class=\"m\">샘플을 채취하다, 시험하다</td></tr><tr><td class=\"w\">bacteria</td><td class=\"m\">박테리아, 세균</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음으로</span><span class=\"en\"><b><span class=\"grammar-hl\">Next,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Le는 그 청바지를 세탁했다</span><span class=\"en\"><b><span class=\"grammar-hl\">Le washed the jeans.</span></b></span></div></div><div class=\"lec-sent-ko\">다음에 Le는 그 바지를 세탁했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 변수를 통제하기 위해 세탁이라는 조건을 추가하여 이전 상태와 비교하려는 흐름입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Next, Le washed the jeans. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 그 청바지를 입었다</span><span class=\"en\"><b><span class=\"grammar-hl\">He wore the jeans</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이번에는 단지 2주 동안</span><span class=\"en\"><b><span class=\"grammar-hl\">for only</span> two weeks this time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 McQueen 박사가 표본을 채취했다</span><span class=\"en\"><b>and Dr. McQueen took a sample</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다시</span><span class=\"en\"><b>again.</b></span></div></div><div class=\"lec-sent-ko\">이번에 그는 그 바지를 2주 동안만 입고 다녔고 McQueen 박사가 표본을 다시 추출했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 15개월 입은 상태와 2주 입은 상태를 비교하여 세탁의 효과를 과학적으로 입증하려는 절차입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">He wore the jeans for only 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sample</td><td class=\"m\">샘플을 채취하다, 시험하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 결과는?</span><span class=\"en\"><b><span class=\"grammar-hl\">The results?</span></b></span></div></div><div class=\"lec-sent-ko\">그 결과는?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 호기심을 유발하며, 세탁 전후의 차이가 크지 않았을 것이라는 반전 결과를 발표하기 전 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The results? 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">15개월이 지났든 2주가 지났든</span><span class=\"en\"><b>Whether fifteen months or two weeks <span class=\"grammar-hl\">had passed</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">박테리아 증식은 거의 같았다</span><span class=\"en\"><b>the bacteria growth was about the same.</b></span></div></div><div class=\"lec-sent-ko\">15개월이든 2주든 박테리아 증식은 거의 같았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 세탁이 박테리아 수치를 유의미하게 변화시키지 않았음을 밝히며, 위생에 대한 기존의 고정관념이 사실과 다를 수 있음을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had passed (과거완료): 기준 시점(과거)보다 더 이전의 사건을 나타내는 시제 구조임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bacteria</td><td class=\"m\">박테리아, 세균</td></tr><tr><td class=\"w\">pass</td><td class=\"m\">(시간이) 흐르다, 지나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제</span><span class=\"en\"><b><span class=\"grammar-hl\">Now</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 냄새는 어떤가?</span><span class=\"en\"><b><span class=\"grammar-hl\">what about the smell?</span></b></span></div></div><div class=\"lec-sent-ko\">그러면 그 냄새는 어떨까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 박테리아 수치뿐만 아니라, 의류를 입을 때 가장 신경 쓰이는 또 다른 요소인 &#39;악취&#39; 문제를 추가로 다룹니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Now what about the smell? 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Le는 그의 청바지에 바람을 쐬어 주었다</span><span class=\"en\"><b>Le <span class=\"grammar-hl\">did air out</span> his jeans</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일주일에 세 번</span><span class=\"en\"><b>three times a week,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그는 전해지는 바에 따르면 여전히 가지고 있었다</span><span class=\"en\"><b>and he reportedly still had</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 친구들을</span><span class=\"en\"><b>lots of friends.</b></span></div></div><div class=\"lec-sent-ko\">Le는 일주일에 세 번 그의 바지에 바람을 쐬었고 들리는 바에 의하면 그는 여전히 친구가 많았다고 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 악취 관리를 위한 최소한의 노력과 사회적 관계에 문제가 없었음을 언급하며, 세탁하지 않은 청바지가 일상생활에 지장을 주지 않는다는 결론을 내립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did air out (대동사): &#39;did&#39;는 강조를 위해 사용되었으며, 뒤의 동사원형(air out)과 함께 일반동사(air out)의 의미를 강조함. 앞의 동사가 일반동사이면 do/does/did를 쓴다</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">air out</td><td class=\"m\">바람을 쐬다, 환기하다</td></tr><tr><td class=\"w\">reportedly</td><td class=\"m\">전하는 바에 의하면, 소문에 의하면</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>빨래할 시간이 없어도 청바지 위생에 대해 지나치게 걱정할 필요는 없다.</li><li>한 학생이 15개월 동안 빨지 않은 청바지와 2주 동안 입은 청바지의 박테리아를 비교했다.</li><li>과학적 분석 결과, 세탁 여부와 상관없이 박테리아 증식 정도는 비슷했다.</li><li>주기적으로 통풍만 해준다면, 세탁하지 않은 청바지를 입어도 일상적인 대인 관계에는 문제가 없다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Scientific analysis reveals that bacterial levels on jeans do not increase significantly over time, yet airing them out can help manage odors effectively.</div>\n              <div class=\"lec-final-sum-ko\">과학적 분석에 따르면 청바지의 세균 수치는 시간이 지나도 크게 증가하지 않지만, 통풍을 시키는 것은 냄새를 관리하는 데 효과적이다.</div></div></div>"],"segs":[[{"audio":"./review-4_audio/1.mp3","hl":null}],[{"audio":"./review-4_audio/2.mp3","hl":null}],[{"audio":"./review-4_audio/3.mp3","hl":null},{"audio":"./review-4_audio/4.mp3","hl":"stage-0"},{"audio":"./review-4_audio/5.mp3","hl":"stage-1"},{"audio":"./review-4_audio/6.mp3","hl":"stage-2"},{"audio":"./review-4_audio/7.mp3","hl":"stage-3"}],[{"audio":"./review-4_audio/8.mp3","hl":null}],[{"audio":"./review-4_audio/9.mp3","hl":"main"},{"audio":"./review-4_audio/10.mp3","hl":"meaning"},{"audio":"./review-4_audio/11.mp3","hl":"grammar"}],[{"audio":"./review-4_audio/12.mp3","hl":"main"},{"audio":"./review-4_audio/13.mp3","hl":"meaning"},{"audio":"./review-4_audio/14.mp3","hl":"grammar"}],[{"audio":"./review-4_audio/15.mp3","hl":"main"},{"audio":"./review-4_audio/16.mp3","hl":"meaning"},{"audio":"./review-4_audio/17.mp3","hl":"grammar"}],[{"audio":"./review-4_audio/18.mp3","hl":"main"},{"audio":"./review-4_audio/19.mp3","hl":"meaning"},{"audio":"./review-4_audio/20.mp3","hl":"grammar"}],[{"audio":"./review-4_audio/21.mp3","hl":"main"},{"audio":"./review-4_audio/22.mp3","hl":"meaning"},{"audio":"./review-4_audio/23.mp3","hl":"grammar"}],[{"
