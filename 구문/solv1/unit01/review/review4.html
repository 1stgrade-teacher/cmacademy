ria) 샘플 분석 의뢰</li><li>핵심 키워드: 실험(experiment)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02비교 분석을 위한 대조 실험</div><ul><li>비교를 위해 청바지를 세탁한 후, 이번에는 단 2주 동안만 입고 다시 측정했다.</li><li>청바지를 깨끗이 세탁(wash)한 후 재착용</li><li>2주라는 짧은 시간(two weeks) 동안의 착용 기간 설정</li><li>이전과 동일한 방식으로 세균 샘플 채취</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실험 결과의 발표</div><ul><li>15개월과 2주라는 시간 차이에도 불구하고 세균 수치는 거의 차이가 없었다.</li><li>세균 증식(bacteria growth) 수준이 두 경우 모두 거의 동일함</li><li>기간의 경과가 세균의 양에 큰 영향을 주지 않음</li><li>핵심 키워드: 결과(results)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04냄새 관리와 사회적 수용도</div><ul><li>세균 수치 외에 우려되는 냄새 문제는 주기적인 관리로 해결이 가능했다.</li><li>일주일에 세 번 청바지를 환기(air out)시켜 냄새를 관리함</li><li>실험 기간 중에도 여전히 많은 친구(friends) 관계를 유지함</li><li>핵심 키워드: 청결의 정의(definition of clean)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">do laundry</td><td class=\"m\">세탁하다, 빨래를 하다</td></tr><tr><td class=\"w\">worry about</td><td class=\"m\">~에 대해 걱정하다, 염려하다</td></tr><tr><td class=\"w\">at least</td><td class=\"m\">적어도, 최소한</td></tr><tr><td class=\"w\">depending on</td><td class=\"m\">~에 따라, ~에 의존하여</td></tr><tr><td class=\"w\">definition</td><td class=\"m\">정의, 의미</td></tr><tr><td class=\"w\">textile</td><td class=\"m\">직물, 옷감</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sample</td><td class=\"m\">(검사 등을 위해) 표본을 추출하다, 시식하다</td></tr><tr><td class=\"w\">bacterium</td><td class=\"m\">박테리아, 세균</td></tr><tr><td class=\"w\">growth</td><td class=\"m\">증식, 성장, 발달</td></tr><tr><td class=\"w\">air out</td><td class=\"m\">환기시키다, (통풍을 위해) 밖에 내놓다</td></tr><tr><td class=\"w\">reportedly</td><td class=\"m\">전하는 바에 따르면, 소문에 의하면</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 여러분이 너무 바쁘다면</span><span class=\"en\"><b>If you’re <span class=\"grammar-hl\">too busy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세탁을 하기에는</span><span class=\"en\"><b><span class=\"grammar-hl\">to do</span> laundry</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것에 대해 걱정하지 마라.</span><span class=\"en\"><b>don’t <span class=\"grammar-hl\">worry about</span> it.</b></span></div></div><div class=\"lec-sent-ko\">너무 바빠 세탁을 할 수 없다 하더라도 걱정하지 마라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> don’t worry about it은 세탁을 제때 하지 못해 옷이 더러워질까 봐 걱정하는 사람들에게 안심해도 좋다는 메시지를 던지며 가벼운 분위기로 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">too busy to do (관용표현): too + 형용사 + to부정사 구조로 &#39;너무 ~해서 ...할 수 없다&#39;는 부정적인 의미를 나타낸다.</div><div class=\"lec-gr-item\">to do (to부정사): 부사적 용법(형용사 수식)으로 앞의 형용사 busy를 수식하여 어떤 행동을 하기에 바쁜지를 설명한다.</div><div class=\"lec-gr-item\">worry about (관용표현): worry about + 명사/대명사 구조로 &#39;~에 대해 걱정하다&#39;라는 의미를 가진 구동사다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">do laundry</td><td class=\"m\">세탁하다, 빨래를 하다</td></tr><tr><td class=\"w\">worry about</td><td class=\"m\">~에 대해 걱정하다, 염려하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">최소한 여러분의 청바지는 깨끗함을 유지할 것이다</span><span class=\"en\"><b>At least your jeans will <span class=\"grammar-hl\">stay clean</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“깨끗한” 상태에 대한 여러분의 정의에 따라.</span><span class=\"en\"><b><span class=\"grammar-hl\">depending on</span> your definition of “clean.”</b></span></div></div><div class=\"lec-sent-ko\">“깨끗한” 상태에 대한 여러분의 정의에 따라 여러분의 바지는 최소한 깨끗함을 유지할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> depending on your definition of “clean”은 우리가 흔히 생각하는 &#39;세제로 빤 상쾌한 상태&#39;는 아닐지 몰라도, 위생이나 세균 수치라는 관점에서는 깨끗할 수 있다는 역설적인 가능성을 제시하며 독자의 호기심을 자극합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stay clean 2형식(SVC) 구조: stay는 상태 유지 동사로 뒤에 형용사 보어(clean)를 취하여 &#39;깨끗한 상태를 유지하다&#39;라는 의미를 만든다.</div><div class=\"lec-gr-item\">depending on (관용표현): depending on (~에 따라) 형태의 전치사구로 문장 전체 혹은 앞의 절을 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at least</td><td class=\"m\">적어도, 최소한</td></tr><tr><td class=\"w\">depending on</td><td class=\"m\">~에 따라, ~에 의존하여</td></tr><tr><td class=\"w\">definition</td><td class=\"m\">정의, 의미</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">세탁하지 않은 청바지 한 벌을 입고 다닌 후</span><span class=\"en\"><b>After <span class=\"grammar-hl\">wearing</span> a pair of <span class=\"grammar-hl\">unwashed</span> jeans</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">15개월 동안</span><span class=\"en\"><b>for fifteen months</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Alberta 대학의 학생인 Josh Le는</span><span class=\"en\"><b>Josh Le, a student at the University of Alberta</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 건네주었다</span><span class=\"en\"><b><span class=\"grammar-hl\">handed them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직물연구학자인 McQueen 박사에게.</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> Dr. McQueen, a textile scientist.</b></span></div></div><div class=\"lec-sent-ko\">Alberta 대학의 학생인 Josh Le는 바지 한 벌을 15개월 동안 세탁하지 않고 입고 다닌 후 그 바지를 직물연구학자인 McQueen 박사에게 건네주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> handed them to는 추측이 아닌 과학적 검증을 위해 실제 15개월간 입은 청바지를 실험 자료로 전문가에게 제출했다는 의미로, 앞 문장의 주장을 뒷받침하기 위한 구체적인 사례를 도입합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wearing (동명사): 전치사 After의 목적어 역할을 하며 &#39;입는 것&#39;이라는 행위 개념을 나타낸다.</div><div class=\"lec-gr-item\">unwashed (과거분사(형용사)): unwashed가 뒤의 명사 jeans를 수식(= &#39;세탁하지 않은 청바지&#39;)하며, jeans that were unwashed의 축약 구조로 볼 수 있다.</div><div class=\"lec-gr-item\">handed them to (관용표현): hand A to B (A를 B에게 건네주다) 구조로, 3형식 문장에서 목적어 them 뒤에 전치사구 to Dr. McQueen이 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">textile</td><td class=\"m\">직물, 옷감</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 표본으로 조사했다</span><span class=\"en\"><b>She sampled</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 바지에 기생하고 있는 박테리아를.</span><span class=\"en\"><b>the bacteria <span class=\"grammar-hl\">living on the jeans</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 그 바지에 기생하고 있는 박테리아를 표본으로 조사했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> sampled the bacteria는 눈에 보이지 않는 오염 정도를 측정하기 위해 섬유 조직 속에 번식한 세균들을 추출하여 분석하기 시작했다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">living on the jeans (현재분사(형용사)): living이 이끄는 분사구가 앞의 명사 bacteria를 수식(= &#39;청바지에 살고 있는 박테리아&#39;)하며, bacteria that were living...의 축약 구조로 볼 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sample</td><td class=\"m\">(검사 등을 위해) 표본을 추출하다, 시식하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음에</span><span class=\"en\"><b>Next</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Le는 그 바지를 세탁했다.</span><span class=\"en\"><b>Le <span class=\"grammar-hl\">washed the jeans</span>.</b></span></div></div><div class=\"lec-sent-ko\">다음에 Le는 그 바지를 세탁했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 15개월 된 상태의 데이터와 비교할 새로운 대조군을 만들기 위해 청바지를 깨끗이 빤 상태로 되돌렸음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">washed the jeans 3형식(SVO) 구조: 주어(Le) + 동사(washed) + 목적어(the jeans)로 이루어진 완전한 문장 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 그 바지를 입고 다녔다</span><span class=\"en\"><b>He wore the jeans</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단 2주 동안만</span><span class=\"en\"><b>for only two weeks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이번에</span><span class=\"en\"><b>this time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 McQueen 박사는 표본을 추출했다</span><span class=\"en\"><b>and Dr. McQueen took a sample</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다시.</span><span class=\"en\"><b>again.</b></span></div></div><div class=\"lec-sent-ko\">이번에 그는 그 바지를 2주 동안만 입고 다녔고 McQueen 박사가 표본을 다시 추출했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> only two weeks는 앞서 언급한 15개월이라는 극단적인 기간과 대비되는 짧은 기간을 설정하여, 착용 기간이 길어질수록 세균도 계속 늘어나는지를 확인하려는 실험 과정을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wore the jeans ... took a sample 병렬 구조: 등위접속사 and를 중심으로 두 개의 독립된 3형식(SVO) 절이 연결되어 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sample</td><td class=\"m\">(검사 등을 위해) 표본을 추출하다, 시식하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 결과는?</span><span class=\"en\"><b><span class=\"grammar-hl\">The results?</span></b></span></div></div><div class=\"lec-sent-ko\">그 결과는?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 관심을 집중시키며, 상식과는 다른 놀라운 실험 결과가 나올 것임을 암시하는 징검다리 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The results? 생략 구문: &#39;What were the results?&#39; 또는 &#39;These are the results.&#39;에서 반복되거나 뻔한 주어와 동사를 생략하고 핵심 명사구만 남긴 형태다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">15개월이든 2주든 시간이 흘렀을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">Whether fifteen months or two weeks had passed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">박테리아 증식은 거의 같았다.</span><span class=\"en\"><b>the bacteria growth was about <span class=\"grammar-hl\">the same</span>.</b></span></div></div><div class=\"lec-sent-ko\">15개월이든 2주든 박테리아 증식은 거의 같았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> the bacteria growth was about the same은 이 글의 핵심 결론으로, 청바지는 일정 기간이 지나면 세균 번식이 정점에 도달하여 더 이상 늘어나지 않으므로 오래 입어도 위생 수치는 비슷하다는 사실을 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Whether fifteen months or two weeks had passed (부사절): Whether A or B 구조가 양보의 의미(~이든 아니든)를 나타내는 부사절로 쓰여 문장 전체를 수식한다.</div><div class=\"lec-gr-item\">had passed (과거완료): 과거의 특정 시점(실험 결과 확인 시점)보다 이전에 일어난 일이나 상태의 지속을 표현하기 위해 had + p.p. 형태를 썼다.</div><div class=\"lec-gr-item\">the same (관용표현): be동사(was) 뒤에서 &#39;똑같은, 동일한&#39;이라는 뜻의 보어로 쓰이며 관사 the와 함께 쓰이는 것이 특징이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">growth</td><td class=\"m\">증식, 성장, 발달</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자, 이제 그 냄새는 어떨까?</span><span class=\"en\"><b>Now <span class=\"grammar-hl\">what about</span> the smell?</b></span></div></div><div class=\"lec-sent-ko\">그러면 그 냄새는 어떨까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 세균이라는 수치적 위생 문제에서 나아가, 사람들이 실제로 가장 걱정할 만한 감각적인 문제인 악취에 대해 화제를 전환하여 논의를 이어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what about (관용표현): What about + 명사? 구조로 &#39;~은 어떠한가?&#39;라고 화제를 전환하거나 질문할 때 사용한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Le는 그의 바지에 바람을 쐬었다</span><span class=\"en\"><b>Le <span class=\"grammar-hl\">did air out</span> his jeans</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일주일에 세 번</span><span class=\"en\"><b>three times a week</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 들리는 바에 의하면 그는 여전히 가지고 있었다</span><span class=\"en\"><b>and he reportedly still had</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 친구들을.</span><span class=\"en\"><b><span class=\"grammar-hl\">lots of</span> friends.</b></span></div></div><div class=\"lec-sent-ko\">Le는 일주일에 세 번 그의 바지에 바람을 쐬었고 들리는 바에 의하면 그는 여전히 친구가 많았다고 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> still had lots of friends는 청바지에서 주변 사람들이 기겁할 만큼 심한 냄새가 나지 않았음을 재치 있게 표현한 것입니다. 즉, 환기만 잘해주면 오랜 기간 세탁하지 않아도 사회생활에 전혀 문제가 없다는 결론을 내립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did air out (강조구문): 일반동사 air out을 강조하기 위해 조동사 do(과거형 did)를 동사원형 앞에 위치시켰으며 &#39;정말로 ~했다&#39;는 의미를 전달한다.</div><div class=\"lec-gr-item\">air out (관용표현): air out (환기시키다/바람을 쐬다)이라는 의미를 가진 구동사(동사+부사)다.</div><div class=\"lec-gr-item\">lots of (관용표현): lots of (많은)는 셀 수 있는 명사의 복수형(friends)을 수식하는 형용사구다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">air out</td><td class=\"m\">환기시키다, (통풍을 위해) 밖에 내놓다</td></tr><tr><td class=\"w\">reportedly</td><td class=\"m\">전하는 바에 따르면, 소문에 의하면</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>청바지를 오래 세탁하지 않아도 위생적으로 큰 문제가 없다는 것을 실험을 통해 증명함.</li><li>15개월 동안 입은 청바지와 2주 동안 입은 청바지의 세균 수치는 놀랍게도 비슷했음.</li><li>냄새 문제는 주기적인 환기만으로도 충분히 해결 가능함.</li><li>결국 청바지는 자주 빨지 않아도 위생적, 사회적으로 괜찮다는 통념을 깨는 결과를 제시함.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Bacterial growth on jeans remains similar regardless of the wearing duration because the levels of microorganisms do not significantly change after an initial period.</div>\n              <div class=\"lec-final-sum-ko\">청바지의 박테리아 증식은 착용 기간에 관계없이 유사하게 유지되는데, 이는 초기 기간 이후 미생물 수치가 유의미하게 변하지 않기 때문이다.</div></div></div>"],"segs":[[{"audio":"./review4_audio/1.mp3","hl":null}],[{"audio":"./review4_audio/2.mp3","hl":null}],[{"audio":"./review4_audio/3.mp3","hl":null},{"audio":"./review4_audio/4.mp3","hl":"stage-0"},{"audio":"./review4_audio/5.mp3","hl":"stage-1"},{"audio":"./review4_audio/6.mp3","hl":"stage-2"},{"audio":"./review4_aud
