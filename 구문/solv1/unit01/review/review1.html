ZznPzHcRnPrgZzjrhwjcA4jc84xsbB7enIzg5z+fZ53nordD1U9ffoP/wBf4VfLdW5Wru92mrXUetndfe+X5NNSb3Ul/l6v+uxDgLu4B3DAJHc5zjB5wceuTySe64wCBwcjr265+p788568VIUkIwFfcMEZB5Hc5xwOOp4A9xywKw42tx1+U9+OeOp9PypXfRb2s7Xtay0fm9/kribkkkk/Xrf5X/Hf8QOTkjA6duB/L/H6800nGPcgfn79vrz9Kn28H5XwTk/KxBOen3euSB8oUk8eopSh4ysnJyCVcZznrkE5JJ79ypBpaa26JP8AK97+fkTyP8vx3vr0+dyDGeQD6cg9BnnvgcHPQZI9ci/pyE6jp+Dj/iYWODj/AKeoc8A5yOePWoVRiMhGweR8rZ55J7e3GcdOo6XtLjd9U0xQjFjqNiFIB4b7XDnJxgcH1HOPSl/X9IrlS83deXX+rrX1XX//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">How Napping Boosts Your Brain Power<small>낮잠이 두뇌 능력을 향상시키는 방법</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리의 뇌는 끊임없이 정보를 처리하는 기계와 같아서, 인지 기능(Cognitive Function)을 최상으로 유지하기 위해서는 적절한 휴식이 필수적입니다. 특히 짧은 낮잠(Power Nap)은 뇌의 과부하를 막고 학습한 내용을 뇌에 저장하는 기억 공고화(Memory Consolidation) 과정을 도와 업무나 학습 효율을 비약적으로 높여준다는 연구가 많습니다. 하지만 잠이 너무 길어져 서파 수면(Slow-wave Sleep)이라고 불리는 깊은 단계에 진입하면, 잠에서 깨어날 때 오히려 몸이 무겁고 정신이 흐릿한 수면 관성(Sleep Inertia)을 겪을 수 있습니다. 마치 컴퓨터를 가볍게 재부팅(Rebooting)하듯 뇌를 리프레시하기 위해서는, 깊은 잠에 빠지기 전인 45분 이내로 수면 주기(Sleep Cycle)를 조절하는 것이 가장 지능적이고 효율적인 휴식 전략입니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01통념과 실제</div><ul><li>피곤함을 참고 공부하는 것보다 수면을 취하는 것이 지능 향상에 도움이 된다.</li><li>학생들은 흔히 졸음을 참고 숙제를 끝내려 함</li><li>연구에 따르면 이는 좋지 않은 생각(not a good idea)임</li><li>핵심 키워드: 수면(sleeping), 똑똑해짐(smarter)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02낮잠의 긍정적 효과</div><ul><li>낮잠은 뇌를 더 효율적으로 만들어 업무 수행 능력을 크게 높여준다.</li><li>뇌를 더 효율적으로(efficient) 만듦</li><li>업무 효율성(work efficiency) 30% 이상 증가</li><li>올바른 결정 능력(ability to make correct decisions) 약 50% 향상</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03올바른 낮잠 방법</div><ul><li>낮잠의 효과를 제대로 보려면 수면 시간을 적절히 제한해야 한다.</li><li>낮잠 시간은 45분으로 제한(limit)할 것</li><li>너무 길면 깊은 잠(deep sleep)에 빠질 수 있음</li><li>잠에서 깨기 힘든 상황(hard time waking up)을 방지해야 함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stay awake</td><td class=\"m\">깨어 있다</td></tr><tr><td class=\"w\">even though</td><td class=\"m\">~에도 불구하고, 비록 ~일지라도</td></tr><tr><td class=\"w\">a number of</td><td class=\"m\">다수의, 얼마간의</td></tr><tr><td class=\"w\">suggest</td><td class=\"m\">암시하다, 시사하다, 제안하다</td></tr><tr><td class=\"w\">fall asleep</td><td class=\"m\">잠들다</td></tr><tr><td class=\"w\">according to</td><td class=\"m\">~에 따르면</td></tr><tr><td class=\"w\">efficient</td><td class=\"m\">효율적인, 능률적인</td></tr><tr><td class=\"w\">efficiency</td><td class=\"m\">효율성, 능률</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">raise</td><td class=\"m\">높이다, 올리다, 증대시키다</td></tr><tr><td class=\"w\">make a decision</td><td class=\"m\">결정을 내리다</td></tr><tr><td class=\"w\">limit</td><td class=\"m\">제한하다, 한정하다</td></tr><tr><td class=\"w\">be likely to</td><td class=\"m\">~할 가능성이 있다, ~하기 쉽다</td></tr><tr><td class=\"w\">fall into</td><td class=\"m\">(어떤 상태에) 빠지다</td></tr><tr><td class=\"w\">have a hard time</td><td class=\"m\">~하는 데 어려움을 겪다</td></tr><tr><td class=\"w\">wake back up</td><td class=\"m\">다시 깨어나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이상하게 들릴지 모르지만,</span><span class=\"en\"><b>It may sound strange,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수면은</span><span class=\"en\"><b>but <span class=\"grammar-hl\">sleeping</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로 당신을 더 똑똑하게 만들 수 있다.</span><span class=\"en\"><b>can actually <span class=\"grammar-hl\">make you smarter</span>.</b></span></div></div><div class=\"lec-sent-ko\">이상하게 들릴지 모르지만, 수면은 실제로 당신을 더 똑똑하게 만들 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글 전체의 주제를 제시하며 독자의 흥미를 유발합니다. make you smarter는 잠이 단순한 휴식의 수단이 아니라 뇌의 인지 기능과 학습 능력을 강화하는 실질적인 도구가 될 수 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sleeping (동명사): -ing가 명사 역할을 하여 두 번째 절의 주어로 쓰임.</div><div class=\"lec-gr-item\">make you smarter 5형식(SVOC) 구조: 사역동사(make) + 목적어(you) + 목적격 보어(smarter) 구조이며, 보어 자리에 형용사의 비교급이 쓰임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 학생들이 깨어 있는 상태로 버틴다</span><span class=\"en\"><b>Many students stay awake</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">숙제가 끝날 때까지</span><span class=\"en\"><b>until their homework <span class=\"grammar-hl\">is finished</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 매우 피곤함에도 불구하고.</span><span class=\"en\"><b>even though they are very tired.</b></span></div></div><div class=\"lec-sent-ko\">많은 학생들이 그들이 매우 피곤함에도 불구하고 숙제가 끝날 때까지는 잠자지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시한 &#39;잠의 중요성&#39;과 대비되는 학생들의 일반적인 현실을 보여줍니다. stay awake는 피로를 억지로 참아가며 공부 시간을 확보하려는 학생들의 고군분투하는 모습을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is finished (수동태): be동사(is)+p.p.(finished) 구조. finish는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is finished 형태로 쓴다. 기본구조: finish + O(목적어)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stay awake</td><td class=\"m\">깨어 있다</td></tr><tr><td class=\"w\">even though</td><td class=\"m\">~에도 불구하고, 비록 ~일지라도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 많은 연구들은</span><span class=\"en\"><b>But <span class=\"grammar-hl\">a number of</span> studies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시사해 왔다</span><span class=\"en\"><b>have suggested</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것이 좋은 생각이 아니라는 것을.</span><span class=\"en\"><b>that this is not a good idea.</b></span></div></div><div class=\"lec-sent-ko\">그러나 많은 연구들은 이것이 좋은 생각이 아니라는 것을 시사한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 학생들의 습관에 대해 반박하며 전문가들의 견해를 도입합니다. not a good idea는 졸음을 참고 밤을 새우는 행위가 학습 효율이나 두뇌 회전에 오히려 부정적인 영향을 준다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a number of (관용표현): &#39;많은&#39;이라는 뜻으로 뒤에 복수 명사(studies)가 오며 복수 취급함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">a number of</td><td class=\"m\">다수의, 얼마간의</td></tr><tr><td class=\"w\">suggest</td><td class=\"m\">암시하다, 시사하다, 제안하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오히려,</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들은 잠에 들어야 한다</span><span class=\"en\"><b>students should <span class=\"grammar-hl\">fall asleep</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 피곤할 때마다,</span><span class=\"en\"><b><span class=\"grammar-hl\">whenever</span> they are tired,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 낮 동안에도.</span><span class=\"en\"><b>even during the day.</b></span></div></div><div class=\"lec-sent-ko\">오히려 학생들은 피곤을 느낄 때마다, 심지어 낮에도 자야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 비판에 대한 구체적인 해결책을 제시합니다. even during the day는 잠을 반드시 밤에만 자야 한다는 고정관념을 깨고, 낮에도 뇌에 휴식을 주는 것이 필요함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">whenever (관계부사): 복합관계부사로 &#39;~할 때마다&#39;라는 의미의 부사절을 이끎.</div><div class=\"lec-gr-item\">fall asleep (관용표현): &#39;잠이 들다&#39;라는 의미의 동사구.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fall asleep</td><td class=\"m\">잠들다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">연구들에 따르면,</span><span class=\"en\"><b>According to the studies,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">낮잠을 자는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">taking</span> a nap</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 두뇌를 더욱 효율적으로 만든다.</span><span class=\"en\"><b><span class=\"grammar-hl\">makes your brain more efficient</span>.</b></span></div></div><div class=\"lec-sent-ko\">연구들에 따르면 낮잠을 자는 것은 당신의 두뇌를 더욱 효율적으로 만들어 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 낮잠을 추천하는 과학적 근거를 설명하기 시작합니다. makes your brain more efficient는 잠을 자는 동안 뇌가 정보를 정리하고 과부하를 해소하여, 깨어났을 때 훨씬 빠르고 정확하게 일할 수 있는 상태가 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taking (동명사): -ing가 명사 역할을 하여 문장의 주어로 쓰임.</div><div class=\"lec-gr-item\">makes your brain more efficient 5형식(SVOC) 구조: 동사(makes) + 목적어(your brain) + 목적격 보어(more efficient) 구조로 목적어의 상태를 보충 설명함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">according to</td><td class=\"m\">~에 따르면</td></tr><tr><td class=\"w\">efficient</td><td class=\"m\">효율적인, 능률적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">낮잠은 당신의 업무 효율성을 높여준다</span><span class=\"en\"><b><span class=\"grammar-hl\">Napping</span> increases your work efficiency</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">30% 이상</span><span class=\"en\"><b>by more than 30%</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 옳은 결정을 내리는 능력을 증진시킨다</span><span class=\"en\"><b>and raises your ability <span class=\"grammar-hl\">to make</span> correct decisions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">50% 정도나.</span><span class=\"en\"><b>by about 50%.</b></span></div></div><div class=\"lec-sent-ko\">낮잠은 당신의 업무 효율성을 30% 이상 높여주고 옳은 결정을 내릴 수 있는 능력을 50% 정도나 증진시켜 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;효율성&#39;의 정도를 구체적인 수치로 뒷받침합니다. raises your ability to make correct decisions는 뇌의 피로가 풀리면서 판단력이 예리해져 실수를 줄이고 최선의 선택을 할 수 있게 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Napping (동명사): -ing가 명사 역할을 하여 문장의 주어로 쓰임.</div><div class=\"lec-gr-item\">to make (to부정사): 형용사적 용법으로 앞의 명사 ability를 수식함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">efficiency</td><td class=\"m\">효율성, 능률</td></tr><tr><td class=\"w\">raise</td><td class=\"m\">높이다, 올리다, 증대시키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 당신의 낮잠을 제한해야 한다</span><span class=\"en\"><b>you should <span class=\"grammar-hl\">limit your naps</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">45분으로.</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> 45 minutes.</b></span></div></div><div class=\"lec-sent-ko\">하지만 당신은 낮잠을 45분으로 제한해야만 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 낮잠의 장점을 나열하다가, 효과를 극대화하기 위한 중요한 단서나 조건을 추가합니다. limit your naps는 낮잠이 과할 경우 발생할 수 있는 부작용을 막기 위한 시간 관리의 필요성을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">limit your naps to (관용표현): limit A to B 구조로 &#39;A를 B로 제한하다&#39;라는 의미를 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">limit</td><td class=\"m\">제한하다, 한정하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만일 당신이 낮잠을 잔다면</span><span class=\"en\"><b>If you nap</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그보다 더 오래</span><span class=\"en\"><b>for longer than that,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 깊은 잠에 빠질 가능성이 크다</span><span class=\"en\"><b>you <span class=\"grammar-hl\">are likely to</span> <span class=\"grammar-hl\">fall into</span> a deep sleep</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 힘든 시간을 보낼 것이다</span><span class=\"en\"><b>and have a hard time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다시 깨어나는 데.</span><span class=\"en\"><b><span class=\"grammar-hl\">waking</span> back up.</b></span></div></div><div class=\"lec-sent-ko\">만일 그보다 더 오래 자면, 아마도 깊은 잠에 빠져, 깨어나는 데 어려움을 겪게 될 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장으로서 45분이라는 시간 제한을 둔 이유를 설명합니다. fall into a deep sleep은 수면 단계가 깊어져서 잠에서 깼을 때 정신을 차리기 힘들고 오히려 더 나른해지는 상태(수면 관성)가 될 수 있음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are likely to (관용표현): &#39;be likely to + 동사원형&#39; 구조로 &#39;~할 가능성이 높다&#39; 또는 &#39;~하기 쉽다&#39;라는 의미를 나타냄.</div><div class=\"lec-gr-item\">fall into (관용표현): &#39;(특정 상태)에 빠지다&#39;라는 의미의 동사구.</div><div class=\"lec-gr-item\">waking (동명사): 관용구 &#39;have a hard time (in) -ing&#39;에서 전치사(in)의 목적어 역할로 쓰인 형태임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fall into</td><td class=\"m\">(어떤 상태에) 빠지다</td></tr><tr><td class=\"w\">have a hard time</td><td class=\"m\">~하는 데 어려움을 겪다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>잠, 특히 낮잠은 뇌 효율을 높여 지능 향상에 도움을 준다.</li><li>졸음을 참고 숙제하는 것은 연구 결과 효과적이지 않은 공부 방식이다.</li><li>낮잠은 효율을 30%, 판단력을 50%가량 높이는 실질적인 데이터가 존재한다.</li><li>다만, 깊은 잠에 빠져 깨기 힘들어지는 것을 막기 위해 45분 이내로 자는 것이 좋다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Although napping improves work efficiency and decision-making, it should be limited to 45 minutes so that individuals can avoid falling into a deep sleep.</div>\n              <div class=\"lec-final-sum-ko\">낮잠은 업무 효율과 의사결정 능력을 향상하지만, 깊은 잠에 빠지는 것을 피하기 위해 45분 이내로 제한되어야 한다.</div></div></div>"],"segs":[[{"audio":"./review1_audio/1.mp3","hl":null}],[{"audio":"./review1_audio/2.mp3","hl":null}],[{"audio":"./review1_audio/3.mp3","hl":null},{"audio":"./review1_audio/4.mp3","hl":"stage-0"},{"audio":"./review1_audio/5.mp3","hl":"stage-1"},{"audio":"./review1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./review1_audio/7.mp3","hl":null}],[{"audio":"./review1_audio/8.mp3","hl":"main"},{"audio":"./review1_audio/9.mp3","hl":"meaning"},{"audio":"./review1_audio/10.mp3","hl":"grammar"}],[{"audio":"./review1_audio/11.mp3","hl":"main"},{"audio":"./review1_audio/12.mp3","hl"
