안해지는 것과 같은 원리로, 지문은 이러한 인간의 본능적인 선택 기준과 심리 변화를 설명하고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01대기에 대한 거부감</div><ul><li>사람들은 은행이나 영화관 등에서 줄을 서서 기다리는 것을 매우 싫어한다.</li><li>긴 대기 시간은 사람들을 화나게 함 (drive them crazy)</li><li>본질적으로 누구도 기다리는 것(wait)을 좋아하지 않음</li><li>핵심 키워드: 대기(waiting)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">023분의 시간 제한 발견</div><ul><li>최근 과학적 연구를 통해 사람들이 기다릴 수 있는 심리적 한계 시간이 밝혀졌다.</li><li>대기 시간의 한계(time limit): 3분</li><li>처음 3분 이내에 떠날 것인지 남을 것인지(walk away or stay)를 결정함</li><li>핵심 키워드: 시간 제한(time limit)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결정 이후의 심리적 수용</div><ul><li>일단 남기로 결정하면 기다리는 과정에 대한 심리적 태도가 변화한다.</li><li>기다리기로 선택(choose the latter)하면 짜증이 현저히 줄어듦 (less annoying)</li><li>상황을 수용(accepted)한 후에는 마음을 편하게 가짐 (take it easy)</li><li>중도에 포기(give up)할 가능성이 낮아짐</li><li>핵심 키워드: 수용(acceptance)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be forced to</td><td class=\"m\">~하도록 강요받다, 어쩔 수 없이 ~하다</td></tr><tr><td class=\"w\">stand in line</td><td class=\"m\">줄을 서다</td></tr><tr><td class=\"w\">drive someone crazy</td><td class=\"m\">~를 미치게 하다, ~를 몹시 화나게 하다</td></tr><tr><td class=\"w\">time limit</td><td class=\"m\">시간 제한, 기한</td></tr><tr><td class=\"w\">walk away</td><td class=\"m\">그냥 가버리다, 떠나다, 회피하다</td></tr><tr><td class=\"w\">latter</td><td class=\"m\">(둘 중에서) 후자</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">significantly</td><td class=\"m\">상당히, 크게, 유의미하게</td></tr><tr><td class=\"w\">annoying</td><td class=\"m\">짜증스러운, 귀찮은</td></tr><tr><td class=\"w\">accept</td><td class=\"m\">받아들이다, 수용하다</td></tr><tr><td class=\"w\">take it easy</td><td class=\"m\">마음을 편히 먹다, 진정하다, 쉬엄쉬엄 하다</td></tr><tr><td class=\"w\">be likely to</td><td class=\"m\">~할 가능성이 있다, ~할 것 같다</td></tr><tr><td class=\"w\">give up</td><td class=\"m\">포기하다, 그만두다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들이 줄을 서야만 할 때</span><span class=\"en\"><b>When people <span class=\"grammar-hl\">are forced to stand</span> in line</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오랜 시간 동안</span><span class=\"en\"><b>for a long time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">은행이나 영화관에서</span><span class=\"en\"><b>at a bank or a movie theater,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 그들을 짜증나게 한다.</span><span class=\"en\"><b>it <span class=\"grammar-hl\">drives them crazy</span>.</b></span></div></div><div class=\"lec-sent-ko\">은행이나 영화관에서 오래 줄을 서야만 하는 것은 (할 때) 사람들을 짜증나게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로 우리가 일상에서 흔히 겪는 불편한 상황을 제시하며 독자의 공감을 유도합니다. drives them crazy는 줄을 서서 기다리는 행위가 단순한 지루함을 넘어 사람들에게 상당한 심리적 고통과 스트레스를 준다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are forced to stand (수동태): be동사(are)+p.p.(forced) 구조. force는 타동사로 force+O+toV(5형식) 구조인데 목적어가 주어로 올라가 수동구조 are forced가 되고, 목적격 보어인 to부정사(to stand)는 구조가 남는다. 기본구조: force + O + toV</div><div class=\"lec-gr-item\">to stand (to부정사): 5형식 동사 force가 수동태가 되면서 남겨진 목적격 보어 구조로, 여기서는 &#39;서 있도록&#39;이라는 의미로 쓰였다.</div><div class=\"lec-gr-item\">drives them crazy 5형식(SVOC) 구조: 동사(drives) + 목적어(them) + 목적격 보어(crazy)의 구조로 목적어의 상태를 형용사 보어(crazy)가 설명한다. 기본구조: drive + O + C</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stand in line</td><td class=\"m\">줄을 서다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 놀라운 일이 아니다</span><span class=\"en\"><b>This is not <span class=\"grammar-hl\">surprising</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아무도 기다리는 것을 좋아하지 않기 때문에.</span><span class=\"en\"><b>since nobody likes <span class=\"grammar-hl\">to wait</span>.</b></span></div></div><div class=\"lec-sent-ko\">아무도 기다리는 것을 좋아하지 않기 때문에 이것은 놀라운 일이 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 사람들의 격한 반응이 지극히 정상적이고 보편적인 현상임을 뒷받침합니다. not surprising은 기다림에 대한 거부감이 특정 개인의 성격 결함이 아니라 인간이라면 누구나 느끼는 본능적인 감정이라는 점을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">surprising (현재분사(형용사)): surprising이 주어인 This의 성질을 설명하는 주격 보어 역할을 하며, 감정을 유발하는 대상(상황)을 설명하므로 능동 형태를 쓴다.</div><div class=\"lec-gr-item\">to wait (to부정사): 타동사 like의 목적어로 쓰인 명사적 용법이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최근의 한 과학 연구는 보여주었다</span><span class=\"en\"><b>a recent scientific study has shown</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 사람들이 기다리는 데 한계 시간을 갖고 있다는 것을</span><span class=\"en\"><b>that most people have a time limit for <span class=\"grammar-hl\">waiting</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">3분이라는.</span><span class=\"en\"><b>three minutes.</b></span></div></div><div class=\"lec-sent-ko\">그러나 최근의 한 과학 연구는 대부분의 사람들이 기다리는 데 한계 시간을 갖고 있다는 것을 보여주었다. 3분.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> However를 기점으로 일반적인 통념에서 구체적인 과학적 사실로 화제를 전환합니다. 사람들이 무한정 짜증을 내는 것이 아니라, three minutes라는 구체적인 심리적 마지노선을 기준으로 인내심이 작동한다는 새로운 정보를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">waiting (동명사): 전치사 for의 목적어 역할을 하며, &#39;기다리는 행위&#39;라는 명사적 개념으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">time limit</td><td class=\"m\">시간 제한, 기한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">첫 3분 안에</span><span class=\"en\"><b>Within the first three minutes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리들 대부분은</span><span class=\"en\"><b>most of us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가 버리거나 아니면 머무르기로 결정한다.</span><span class=\"en\"><b>will either walk away or decide <span class=\"grammar-hl\">to stay</span>.</b></span></div></div><div class=\"lec-sent-ko\">첫 3분 안에 우리들 대부분은 가 버리거나 아니면 머무르기로 결정한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;3분&#39;이라는 시간이 실제 행동으로 어떻게 나타나는지 설명합니다. either walk away or decide to stay는 사람들이 줄에 들어선 순간부터 본능적으로 계산을 시작하며, 3분이 되기 전에 계속 기다릴 가치가 있는지를 판가름하여 행동에 옮긴다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to stay (to부정사): 타동사 decide의 목적어로 쓰인 명사적 용법이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">walk away</td><td class=\"m\">그냥 가버리다, 떠나다, 회피하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 그들이 후자를 선택하면</span><span class=\"en\"><b>If they choose the latter,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 생각한다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">find</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">줄을 서서 기다리는 경험을</span><span class=\"en\"><b><span class=\"grammar-hl\">the experience of waiting in line</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 덜 짜증스럽다고.</span><span class=\"en\"><b><span class=\"grammar-hl\">significantly less annoying</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들이 후자를 선택하면 그들은 줄서서 기다린다는 경험을 훨씬 덜 짜증스럽게 생각한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 줄에 남기로 결정한 사람들에게 일어나는 심리적 반전을 설명합니다. significantly less annoying은 일단 본인이 기다리겠다고 마음을 먹는 순간, 그전까지 느꼈던 줄 서기에 대한 거부감이나 불쾌한 감정이 눈에 띄게 줄어든다는 상태 변화를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">waiting (동명사): 전치사 of의 목적어 역할을 하며, 앞의 명사 experience와 의미상 연결되어 &#39;기다리는 경험&#39;이라는 명사적 개념을 나타낸다.</div><div class=\"lec-gr-item\">find the experience of waiting in line significantly less annoying 5형식(SVOC) 구조: 동사(find) + 목적어(the experience of waiting in line) + 목적격 보어(annoying)의 구조이다. 목적어의 성질이 어떠한지(덜 짜증스러운지)를 설명한다. 기본구조: find + O + C</div><div class=\"lec-gr-item\">annoying (현재분사(형용사)): 목적격 보어 자리에 쓰여 목적어인 the experience의 성질을 설명하며, 짜증을 유발하는 성질이므로 능동 형태(-ing)를 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">latter</td><td class=\"m\">(둘 중에서) 후자</td></tr><tr><td class=\"w\">significantly</td><td class=\"m\">상당히, 크게, 유의미하게</td></tr><tr><td class=\"w\">annoying</td><td class=\"m\">짜증스러운, 귀찮은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일단 그들이 상황을 받아들이면</span><span class=\"en\"><b>Once they have accepted the situation,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 맘 편히 생각한다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">take it easy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 포기를 덜 하게 된다.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">are less likely to give up</span>.</b></span></div></div><div class=\"lec-sent-ko\">일단 그들이 상황을 받아들이면 그들은 맘 편히 생각하고 포기를 덜 하게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론으로, 마음가짐의 변화가 끈기 있는 행동으로 이어진다는 점을 보여줍니다. accepted the situation은 기다림을 피할 수 없는 현실로 인정하고 순응했다는 의미이며, 그 결과 조바심이 사라져 결국 목적을 달성할 때까지 자리를 지키게 된다는 인과관계를 완성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">take it easy (관용표현): &#39;마음을 편히 갖다&#39;, &#39;서두르지 않다&#39;라는 의미의 숙어이다.</div><div class=\"lec-gr-item\">are less likely to give up (관용표현): &#39;be likely to + 동사원형&#39;(~할 가능성이 있다) 구조이며, less와 결합하여 가능성이 더 낮음을 나타낸다.</div><div class=\"lec-gr-item\">give up (관용표현): &#39;포기하다&#39;라는 의미의 구동사(숙어)이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">accept</td><td class=\"m\">받아들이다, 수용하다</td></tr><tr><td class=\"w\">take it easy</td><td class=\"m\">마음을 편히 먹다, 진정하다, 쉬엄쉬엄 하다</td></tr><tr><td class=\"w\">give up</td><td class=\"m\">포기하다, 그만두다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들은 줄을 서서 기다리는 것을 매우 힘들어하며 이는 보편적인 본능이다.</li><li>연구 결과, 인간이 기다림을 참아내는 심리적 한계 시간은 3분으로 나타났다.</li><li>사람들은 줄을 선 지 3분 이내에 포기하고 떠날지, 끝까지 남을지를 결정한다.</li><li>일단 3분을 넘겨 기다리기로 마음먹으면 짜증이 줄어들고 심리적 안정감을 찾아 끝까지 인내하게 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People determine whether to continue waiting within a three-minute threshold, because accepting the situation reduces their psychological frustration.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 3분이라는 임계치 내에서 대기 지속 여부를 결정하는데, 이는 상황을 수용하는 것이 심리적 짜증을 완화해주기 때문이다.</div></div></div>"],"segs":[[{"audio":"./review3_audio/1.mp3","hl":null}],[{"audio":"./review3_audio/2.mp3","hl":null}],[{"audio":"./review3_audio/3.mp3","hl":null},{"audio":"./review3_audio/4.mp3","hl":"stage-0"},{"audio":"./review3_audio/5.mp3","hl":"stage-1"},{"audio":"./review3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./review3_audio/7.mp3","hl":null}],[{"audio":"./review3_audio/8.mp3","hl":"main"},{"audio":"./review3_audio/9.mp3","hl":"meaning"},{"audio":"./review3_audio/10.mp3","hl":"grammar"}],[{"audio":"./review3_audio/11.mp3","hl":"main"},{"audio":"./review3_audio/12.mp3","hl":"meaning"},{"audio":"./review3_audio/13.mp3","hl":"grammar"}],[{"audio":"./review3_audio/14.mp3","hl":"main"},{"audio":"./review3_audio/15.mp3","hl":"meaning"},{"audio":"./review3_audio/16.mp3","hl":"grammar"}],[{"audio":"./review3_audio/17.mp3","hl":"main"},{"audio":"./review3_audio/18.mp3","hl":"meaning"},{"audio":"./review3_audio/19.mp3","hl":"grammar"}],[{"audio":"./review3_audio/20.mp3","hl":"main"},{"audio":"./review3_audio/21.mp3","hl":"meaning"},{"audio":"./review3_audio/22.mp3","hl":"grammar"}],[{"audio":"./review3_audio/23.mp3","hl":"main"},{"audio":"./review3_audio/24.mp3","hl":"meaning"},{"audio":"./review3_audio/25.mp3","hl":"grammar"}],[{"audio":"./review3_audio/26.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)b
