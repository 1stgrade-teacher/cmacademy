9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Enhancing Workplace Efficiency Through Strategic Scents<small>전략적 향기를 통한 직장 내 효율성 증진</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">후각은 인간의 오감 중에서도 뇌의 감정 및 기억을 담당하는 변연계(Limbic system)와 가장 직접적으로 연결되어 있어, 우리의 기분이나 심리 상태에 즉각적인 영향을 미치는데, 이를 향기 마케팅(Scent marketing) 또는 아로마테라피(Aromatherapy)의 원리라고 합니다. 흔히 우리가 특정 향기를 맡았을 때 과거의 기억이 떠오르거나 마음이 편안해지는 현상처럼, 후각은 뇌의 시상하부를 자극해 신경전달물질의 분비를 조절함으로써 업무 효율과 정서적 안정감을 높이는 데 효과적인 도구가 됩니다. 예를 들어 레몬 향이 상쾌한 각성 효과를 주어 활력을 불어넣는다면, 꽃 향기는 스트레스를 완화해 주는 일종의 심리적 환기 역할을 수행하는 것이죠. 이처럼 사무 환경에 의도적으로 향기를 도입하는 시도는 단순한 공기 정화를 넘어, 직원들의 심리적 안녕감(Well-being)을 최적화하여 생산성을 높이려는 혁신적인 경영 전략의 일환으로 이해할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01연구 배경</div><ul><li>후각이 작업자의 태도와 감정에 영향을 미친다는 사실이 입증되었다.</li><li>후각과 작업 태도(attitudes of workers)의 연관성 발견</li><li>향기를 활용한 일본 공장의 근무 환경 개선 사례</li><li>핵심 키워드: 후각(smell), 태도(attitudes)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02시스템 구축</div><ul><li>공장 내 파이프 네트워크를 통해 시간대별로 특정 향기를 분사한다.</li><li>파이프 네트워크(network of pipes)를 통한 향기 배출</li><li>근무 시간의 흐름에 따른 향기 전환</li><li>핵심 키워드: 향기 분사(release specific smells)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03시간대별 향기 적용</div><ul><li>오전, 점심, 오후 등 시간대별로 작업자에게 최적화된 향기를 제공한다.</li><li>업무 시작 시: 활력을 주는 레몬 향(scent of lemons)</li><li>점심 시간: 긴장을 완화하는 장미 향(sweet smell of roses)</li><li>오후 시간: 야외에 있는 듯한 나무 향(scent of trees)</li><li>핵심 키워드: 시간대별 효과(different times of the day)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04기대 효과</div><ul><li>각각의 향기는 작업자들에게 긍정적인 심리 변화를 유도한다.</li><li>레몬 향을 통한 활기찬 시작(happy)</li><li>장미 향을 통한 안정과 휴식(relaxed)</li><li>나무 향을 통한 야외 활동의 즐거움(enjoyable feeling)</li><li>핵심 키워드: 정서적 영향(emotional impact)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reveal</td><td class=\"m\">밝히다, 드러내다</td></tr><tr><td class=\"w\">influence</td><td class=\"m\">영향을 주다, 영향을 미치다</td></tr><tr><td class=\"w\">with this in mind</td><td class=\"m\">이를 염두에 두고, 이 점을 고려하여</td></tr><tr><td class=\"w\">equip</td><td class=\"m\">갖추게 하다, 장비를 설치하다</td></tr><tr><td class=\"w\">release</td><td class=\"m\">방출하다, 내뿜다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scent</td><td class=\"m\">향기, 냄새</td></tr><tr><td class=\"w\">pump</td><td class=\"m\">펌프로 밀어 넣다, 주입하다</td></tr><tr><td class=\"w\">replace</td><td class=\"m\">교체하다, 대신하다</td></tr><tr><td class=\"w\">calm down</td><td class=\"m\">진정시키다, 차분하게 만들다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">연구들은</span><span class=\"en\"><b>Studies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밝혀냈다</span><span class=\"en\"><b>have revealed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">냄새가 근무자들의 태도에 영향을 준다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that smell influences the attitudes of workers</span>.</b></span></div></div><div class=\"lec-sent-ko\">연구들은 냄새가 근무자들의 태도에 영향을 준다는 것을 밝혀냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞으로 다가올 구체적인 기업 사례를 제시하기 위한 이론적 배경을 설명합니다. 특정 향기가 사람의 심리나 업무 태도를 바꿀 수 있다는 핵심 원리를 미리 제시하여 글의 신뢰도를 높이는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that smell influences the attitudes of workers 동격의 that: 명사(revealed의 목적어절)와 동격 관계가 아니라 타동사 reveal의 목적어 역할을 하는 명사절을 이끄는 접속사 that이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reveal</td><td class=\"m\">밝히다, 드러내다</td></tr><tr><td class=\"w\">influence</td><td class=\"m\">영향을 주다, 영향을 미치다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것을 염두에 두고,</span><span class=\"en\"><b>With this in mind,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 일본 회사가</span><span class=\"en\"><b>a Japanese company</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공장들 중 한 곳에 설치했는데</span><span class=\"en\"><b><span class=\"grammar-hl\">has equipped one of its factories</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">파이프 연결망을</span><span class=\"en\"><b><span class=\"grammar-hl\">with a network of pipes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 냄새를 퍼뜨리는</span><span class=\"en\"><b><span class=\"grammar-hl\">that carry and release</span> specific smells</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">근무일의 여러 시간대에</span><span class=\"en\"><b>at different times of the work day.</b></span></div></div><div class=\"lec-sent-ko\">이것을 염두에 두고, 한 일본 회사가 공장들 중 한 곳에 특별한 냄새를 근무일의 여러 시간대에 퍼뜨리는 파이프 연결망을 설치했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 연구 결과를 바탕으로 실제 산업 현장에서 향기를 어떻게 활용하는지 구체적인 실행 방안을 보여줍니다. 공장이라는 삭막한 환경을 향기를 통해 업무 효율을 높일 수 있는 공간으로 바꾸려는 기업의 전략적 조치를 다룹니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has equipped one of its factories with a network of pipes (관용표현): equip A with B(A에 B를 갖추다/설비하다) 구조로, factories에 network of pipes를 설치했다는 의미이다.</div><div class=\"lec-gr-item\">that carry and release (관계대명사): that은 선행사 a network of pipes를 수식하며, 뒤에 동사 carry와 release가 이어지는 주격 관계대명사절이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">with this in mind</td><td class=\"m\">이를 염두에 두고, 이 점을 고려하여</td></tr><tr><td class=\"w\">equip</td><td class=\"m\">갖추게 하다, 장비를 설치하다</td></tr><tr><td class=\"w\">release</td><td class=\"m\">방출하다, 내뿜다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하루의 시작에는,</span><span class=\"en\"><b>At the start of the day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">레몬 향기가</span><span class=\"en\"><b>the scent of lemons</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뿜어졌다</span><span class=\"en\"><b><span class=\"grammar-hl\">is pumped</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건물 안으로</span><span class=\"en\"><b>into the building.</b></span></div></div><div class=\"lec-sent-ko\">하루의 시작에는 레몬 향기가 건물 안으로 뿜어졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간 흐름에 따른 첫 번째 향기 활용 예시입니다. 업무를 막 시작하는 노동자들의 상태를 고려하여 각 시간대마다 목적이 뚜렷한 향기를 배치했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is pumped (수동태): be동사(is)+p.p.(pumped) 구조. pump는 타동사인데 목적어가 없어서 수동구조 is pumped 형태로 쓴다. 기본구조: pump + O(목적어)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scent</td><td class=\"m\">향기, 냄새</td></tr><tr><td class=\"w\">pump</td><td class=\"m\">펌프로 밀어 넣다, 주입하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b>This</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교체되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">is replaced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달콤한 장미향으로</span><span class=\"en\"><b><span class=\"grammar-hl\">by</span> the sweet smell of roses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점심때면</span><span class=\"en\"><b>at lunchtime.</b></span></div></div><div class=\"lec-sent-ko\">이것은 점심때면 달콤한 장미향으로 교체되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 오전 업무 이후 찾아오는 점심시간이라는 맥락에 맞춰 향기가 바뀝니다. 앞 문장의 시간 흐름을 이어받아 공정 운영 방식을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is replaced by (수동태): be동사(is)+p.p.(replaced) 구조. replace는 타동사인데 목적어가 없어서 수동구조 is replaced 형태로 쓴다. 기본구조: replace + A + with/by + B (A를 B로 대체하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">replace</td><td class=\"m\">교체하다, 대신하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하루의 나중 시간에,</span><span class=\"en\"><b><span class=\"grammar-hl\">Later in the day,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직원들은</span><span class=\"en\"><b><span class=\"grammar-hl\">workers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맡을 수 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">can</span> smell</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나무 향기를</span><span class=\"en\"><b>the scent of trees.</b></span></div></div><div class=\"lec-sent-ko\">오후에 직원들은 나무 향기를 맡을 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일과 마무리 단계에 맞춰 향기가 변화한다는 점을 덧붙여, 향기 조절 시스템이 하루 종일 체계적으로 운영되고 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Later in the day, workers can 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scent</td><td class=\"m\">향기, 냄새</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 회사에 따르면,</span><span class=\"en\"><b>According to the company,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">레몬 향은</span><span class=\"en\"><b>the lemon smell</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 이들을 기분 좋게 해준다</span><span class=\"en\"><b><span class=\"grammar-hl\">makes everyone happy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음 일하기 시작할 때.</span><span class=\"en\"><b><span class=\"grammar-hl\">when they first start to work</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 회사에 따르면, 레몬 향은 처음 일하기 시작할 때 모든 이들을 기분 좋게 해준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설치한 시스템이 구체적으로 노동자들에게 어떤 정서적 효과를 주는지 밝히는 대목입니다. 레몬 향이 가진 상쾌함이 업무 몰입을 돕는 심리적 장치로 기능함을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes everyone happy 5형식(SVOC) 구조: make(사역동사) + O(everyone) + C(happy/형용사) 형태로, 목적어가 행복한 상태가 되게 한다는 의미이다.</div><div class=\"lec-gr-item\">when they first start to work (to부정사): 동사 start의 목적어 역할을 하는 명사적 용법의 to부정사(to work)이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">장미향은</span><span class=\"en\"><b>The rose smell</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 진정시켜 준다</span><span class=\"en\"><b><span class=\"grammar-hl\">calms them down</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 유지시켜 준다 그들을 편안하게</span><span class=\"en\"><b>and <span class=\"grammar-hl\">keeps them relaxed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바쁜 아침 이후에</span><span class=\"en\"><b>after a busy morning.</b></span></div></div><div class=\"lec-sent-ko\">장미향은 바쁜 아침의 일 후에 그들을 진정시켜주고 편안하게 유지시켜 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 분주한 오전의 피로감을 해소하려는 기업의 의도를 설명합니다. 향기를 단순한 냄새가 아니라, 노동자들의 감정 상태를 조절하는 도구로 활용하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">calms them down (관용표현): calm down(진정시키다)이라는 구동사로, 대명사 them이 목적어 자리에 위치한다.</div><div class=\"lec-gr-item\">keeps them relaxed 5형식(SVOC) 구조: keep + O(them) + C(relaxed/과거분사) 형태로, 목적어가 ~한 상태를 유지하게 한다는 의미이다.</div><div class=\"lec-gr-item\">relaxed (과거분사(보어)): 5형식 구조에서 목적어(them)의 상태를 설명하는 형용사적 보어로, 긴장이 풀린 상태를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 나무 향은</span><span class=\"en\"><b>And the smell of trees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모두에게 선사한다</span><span class=\"en\"><b><span class=\"grammar-hl\">gives everyone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즐거운 느낌을</span><span class=\"en\"><b><span class=\"grammar-hl\">the enjoyable feeling</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야외에 있는 듯한.</span><span class=\"en\"><b><span class=\"grammar-hl\">of being outdoors</span>.</b></span></div></div><div class=\"lec-sent-ko\">그리고 나무 향은 모두에게 야외에 있는 듯한 즐거운 느낌을 선사한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 폐쇄적인 공장 내부라는 공간적 한계를 후각적 자극을 통해 극복하려는 시도입니다. 향기를 통해 실내 근무자들에게 자연과 연결된 듯한 정서적 안정을 제공하려는 목적을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">gives everyone the enjoyable feeling 4형식 구조: give + IO(everyone) + DO(the enjoyable feeling) 형태로, 모두에게 즐거운 기분을 준다는 의미이다.</div><div class=\"lec-gr-item\">of being outdoors (동명사): 전치사 of의 목적어 역할을 하는 동명사(being)로, ‘~인 상태’라는 의미를 나타낸다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>후각이 노동자의 태도에 영향을 준다는 연구에 착안하여 한 일본 공장이 향기 도입 시스템을 구축함.</li><li>시간대별로 레몬, 장미, 나무 향을 방출하여 업무 집중도와 정서적 안정을 유도함.</li><li>이를 통해 노동자들의 행복감을 높이고 실내 환경을 자연친화적으로 개선하는 효과를 거둠.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">A Japanese company distributes different scents during the workday to boost morale, because specific smells effectively regulate workers&#39; emotions.</div>\n              <div class=\"lec-final-sum-ko\">일본의 한 기업은 근로자들의 사기를 진작시키기 위해 근무 시간 동안 다양한 향기를 살포하며, 이는 특정 향기가 근로자의 감정을 효과적으로 조절하기 때문이다.</div></div></div>"],"segs":[[{"audio":"./review-2_audio/1.mp3","hl":null}],[{"audio":"./review-2_audio/2.mp3","hl":null}],[{"audio":"./review-2_audio/3.mp3","hl":null},{"audio":"./review-2_audio/4.mp3","hl":"stage-0"},{"audio":"./review-2_audio/5.mp3","hl":"stage-1"},{"audio":"./review-2_audio/6.mp3","hl":"stage-2"},{"audio":"./review-2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./review-2_audio/8.mp3","hl":null}],[{"audio":"./review-2_audio/9.mp3","hl":"main"},{"audio":"./review-2_audio/10.mp3","hl":"meaning"},{"audio":"./review-2_audio/11.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/12.mp3","hl":"main"},{"audio":"./review-2_audio/13.mp3","hl":"meaning"},{"audio":"./review-2_audio/14.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/15.mp3","hl":"main"},{"audio":"./review-2_audio/16.mp3","hl":"meaning"},{"audio":"./review-2_audio/17.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/18.mp3","hl":"main"},{"audio":"./review-2_audio/19.mp3","hl":"meaning"},{"audio":"./review-2_audio/20.mp3","hl":"grammar"}],[{"au
