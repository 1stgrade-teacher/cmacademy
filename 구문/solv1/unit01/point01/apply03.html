류의 생명 보호와 직결된 중요한 문제입니다. 비록 당장의 구입 비용은 조금 비쌀 수 있지만, 장기적으로는 엔진의 부식이나 마모를 줄여 유지비를 절감해 주는 생애 주기 비용(Life Cycle Cost) 측면에서 훨씬 경제적인 선택이 될 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입</div><ul><li>기존 화석 연료 대신 대체 연료를 사용할 때 얻을 수 있는 장점들을 소개한다.</li><li>대체 연료(alternative fuels)의 다양한 이점</li><li>주요 장점: 화석 연료(fossil fuels) 사용량 감소</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02화석 연료의 위험성</div><ul><li>우리가 사용하는 화석 연료가 인체와 환경에 미치는 부정적인 영향을 설명한다.</li><li>가솔린 연소 시 발생하는 배기가스(exhaust gas)</li><li>신체에 가해지는 심각한 손상(serious damage) 및 생명 위협</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가솔린 엔진의 제한적 사용</div><ul><li>배기가스의 유해성 때문에 가솔린 엔진 사용에는 장소적 제약이 따른다는 것을 강조한다.</li><li>실내(indoors)에서 가솔린 엔진을 사용하지 않는 이유</li><li>유해 가스로부터 생명(lives)을 보호해야 할 필요성</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04경제적 이점</div><ul><li>대체 연료는 초기 비용은 높을 수 있으나 장기적으로는 훨씬 유리한 선택이다.</li><li>장기적인 관점에서의 경제성(economical)</li><li>자동차 엔진(engine)의 수명을 훨씬 길게 연장함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05결론</div><ul><li>대체 연료 사용은 개인의 자산과 생명을 동시에 보호하는 최선의 방법이다.</li><li>금전적인 절약(save money) 효과</li><li>인간의 생명을 구함(save our lives) 인사이트 제시</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">alternative</td><td class=\"m\">대안의, 대신하는</td></tr><tr><td class=\"w\">advantage</td><td class=\"m\">장점, 이점</td></tr><tr><td class=\"w\">reduce</td><td class=\"m\">줄이다, 낮추다</td></tr><tr><td class=\"w\">fossil fuel</td><td class=\"m\">화석 연료</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exhaust gas</td><td class=\"m\">배기가스</td></tr><tr><td class=\"w\">cost one&#39;s life</td><td class=\"m\">목숨을 앗아가다</td></tr><tr><td class=\"w\">economical</td><td class=\"m\">경제적인, 실속 있는</td></tr><tr><td class=\"w\">in the long term</td><td class=\"m\">장기적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 대체 연료를 사용할 때,</span><span class=\"en\"><b>When we use <span class=\"grammar-hl\">alternative fuels</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 우리에게 많은 이점을 가져다준다.</span><span class=\"en\"><b>it <span class=\"grammar-hl\">brings us many advantages</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리가 대체 연료를 사용할 때, 그것은 우리에게 많은 이점을 가져다준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로, &#39;대체 에너지&#39;라는 소재를 제시하며 그것이 우리에게 긍정적인 영향을 미친다는 전체적인 주제를 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">alternative fuels (관용표현): &#39;대체 연료&#39;라는 뜻으로 사용되는 복합 명사구입니다.</div><div class=\"lec-gr-item\">brings us many advantages 4형식(SVOO) 구조: bring + 간접목적어(us) + 직접목적어(many advantages) 구조로 &#39;~에게 ~를 가져다주다&#39;라는 의미를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">alternative</td><td class=\"m\">대안의, 대신하는</td></tr><tr><td class=\"w\">advantage</td><td class=\"m\">장점, 이점</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 중요한 것은,</span><span class=\"en\"><b>Most importantly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 우리로 하여금 ~하게 한다</span><span class=\"en\"><b>it <span class=\"grammar-hl\">allows us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 사용하는 화석 연료의 양을 줄일 수 있게.</span><span class=\"en\"><b><span class=\"grammar-hl\">to reduce</span> the amount of fossil fuels <span class=\"grammar-hl\">that we use</span>.</b></span></div></div><div class=\"lec-sent-ko\">가장 중요한 것은, 대체 연료는 우리가 사용하는 화석 연료의 양을 줄일 수 있게 해준다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 여러 장점 중 첫 번째이자 가장 핵심적인 이점을 구체적으로 밝히고 있습니다. allows us to reduce는 대체 에너지를 쓰는 행위가 결과적으로 기존 화석 연료에 대한 의존도를 낮추는 직접적인 계기가 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">allows us to reduce 5형식(SVOC) 구조: allow + 목적어(us) + 목적격보어(to reduce) 구조로 목적어가 ~하는 것을 가능하게 한다는 의미입니다.</div><div class=\"lec-gr-item\">to reduce (to부정사): 5형식 동사 allow의 목적격보어 역할을 하는 명사적 용법의 부정사입니다.</div><div class=\"lec-gr-item\">that we use (관계대명사): 목적격 관계대명사 that이 이끄는 절로, 선행사인 fossil fuels를 수식하며 use의 목적어가 비어 있는 불완전한 절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reduce</td><td class=\"m\">줄이다, 낮추다</td></tr><tr><td class=\"w\">fossil fuel</td><td class=\"m\">화석 연료</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 화석 연료는 위험할 수 있다.</span><span class=\"en\"><b>These <span class=\"grammar-hl\">fossil fuels</span> can be dangerous.</b></span></div></div><div class=\"lec-sent-ko\">화석 연료는 위험할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화석 연료 사용을 줄여야 하는 근거를 제시하기 시작합니다. 앞 문장의 &#39;화석 연료&#39;를 These fossil fuels로 받아 문장을 긴밀하게 연결하며, 화석 연료가 인간에게 해롭다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">fossil fuels (관용표현): &#39;화석 연료&#39;라는 뜻으로 고정되어 쓰이는 명사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fossil fuel</td><td class=\"m\">화석 연료</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들면,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수백만 대의 차들이 가솔린을 태울 때,</span><span class=\"en\"><b>when millions of cars burn gasoline,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은 공기를 채운다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">fill the air</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배기가스로.</span><span class=\"en\"><b><span class=\"grammar-hl\">with exhaust gas</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들면 수백만 대의 차들이 가솔린을 태울(사용할) 때, 차들은 공기를 배기가스로 채운다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화석 연료가 왜 위험한지에 대한 구체적인 사례를 듭니다. fill the air with exhaust gas는 우리 주변의 숨 쉬는 공기가 오염물질로 뒤덮여 피할 곳이 없게 된다는 상황을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">fill the air with exhaust gas (관용표현): fill A with B (A를 B로 채우다) 구조로, 타동사 fill이 목적어 the air와 전치사구(with exhaust gas)를 동반하여 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exhaust gas</td><td class=\"m\">배기가스</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 가스는 우리 몸에 심각한 해로움을 끼칠 수 있다</span><span class=\"en\"><b>This gas can <span class=\"grammar-hl\">cause our bodies serious damage</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 심지어 우리의 목숨을 앗아갈 수도 있다.</span><span class=\"en\"><b>or even <span class=\"grammar-hl\">cost us our lives</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 가스는 우리 몸에 심각한 해로움을 끼치거나 심지어는 목숨을 앗아갈 수도있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 오염된 공기가 인간에게 미치는 치명적인 결과를 설명합니다. cost us our lives는 단순히 몸이 아픈 수준을 넘어 죽음에 이르게 할 정도로 배기가스의 독성이 강력하다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cause our bodies serious damage 4형식(SVOO) 구조: cause + 간접목적어(our bodies) + 직접목적어(serious damage) 구조로 &#39;~에게 ~를 초래하다&#39;라는 의미입니다.</div><div class=\"lec-gr-item\">cost us our lives 4형식(SVOO) 구조: cost + 간접목적어(us) + 직접목적어(our lives) 구조로 &#39;~에게서 ~(생명 등)를 앗아가다&#39;라는 의미로 쓰인 수여동사 구문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것이 ~한 이유이다</span><span class=\"en\"><b><span class=\"grammar-hl\">That’s why</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 가솔린 엔진을 사용하지 않는</span><span class=\"en\"><b>we don’t use gasoline engines</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실내에서.</span><span class=\"en\"><b>indoors.</b></span></div></div><div class=\"lec-sent-ko\">그것이 우리가 가솔린 엔진을 실내에서는 사용하지 않는 이유이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 가스의 위험성을 독자들이 일상에서 체감할 수 있는 상식적인 상황과 연결합니다. 환기가 되지 않는 곳에서 화석 연료를 태우는 것이 곧 자살 행위나 다름없다는 점을 상기시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">That’s why (관계부사): 선행사 the reason이 생략된 형태의 관계부사 why가 이끄는 절로, &#39;그것이 ~한 이유이다&#39;라고 해석되며 앞 문장의 내용을 원인으로 하여 결과를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대체 연료의 또 다른 이점은</span><span class=\"en\"><b>Another advantage of alternative fuels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 경제적이라는 것이다</span><span class=\"en\"><b>is that they are economical</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장기적으로 볼 때.</span><span class=\"en\"><b><span class=\"grammar-hl\">in the long term</span>.</b></span></div></div><div class=\"lec-sent-ko\">대체 연료의 또 다른 이점은 장기적으로 볼 때 경제적이라는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화석 연료의 위험성(건강)에 대한 논의를 마무리하고, 경제성(비용)이라는 새로운 측면의 장점으로 화제를 전환합니다. in the long term은 당장 눈앞의 비용이 아닌, 시간이 흐른 뒤의 전체적인 비용을 따져봐야 한다는 관점을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in the long term (관용표현): &#39;장기적으로는&#39;이라는 의미를 가진 부사구 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">alternative</td><td class=\"m\">대안의, 대신하는</td></tr><tr><td class=\"w\">advantage</td><td class=\"m\">장점, 이점</td></tr><tr><td class=\"w\">economical</td><td class=\"m\">경제적인, 실속 있는</td></tr><tr><td class=\"w\">in the long term</td><td class=\"m\">장기적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 비용이 조금 더 들 수도 있다</span><span class=\"en\"><b>They may cost a bit more</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금은,</span><span class=\"en\"><b>now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것들은 당신의 자동차 엔진에 준다</span><span class=\"en\"><b>but they <span class=\"grammar-hl\">give your car’s engine</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 긴 수명을.</span><span class=\"en\"><b><span class=\"grammar-hl\">a much longer life</span>.</b></span></div></div><div class=\"lec-sent-ko\">대체 연료가 지금 조금 더 비싸기는 하지만 자동차 엔진에 더 긴 내구성(수명)을 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대체 에너지가 왜 경제적인지를 보충 설명합니다. give your car’s engine a much longer life는 초기 구입 비용은 비싸더라도 엔진 교체나 수리 주기를 늦춰주기 때문에 결국 돈을 버는 셈이라는 논리입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">give your car’s engine a much longer life 4형식(SVOO) 구조: give + 간접목적어(your car’s engine) + 직접목적어(a much longer life) 구조로 &#39;~에게 ~를 부여하다/주다&#39;라는 의미입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러므로 대체 연료는 우리에게 돈을 아껴준다</span><span class=\"en\"><b>So alternative fuels <span class=\"grammar-hl\">save us money</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리의 목숨을 구해줄 수도 있다.</span><span class=\"en\"><b>and could save our lives.</b></span></div></div><div class=\"lec-sent-ko\">그러므로 대체 연료는 우리로 하여금 돈을 절약하게 해주고 우리의 목숨도 구해줄 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론입니다. save us money는 경제적 이점을, save our lives는 건강상의 이점을 각각 요약하여 대체 에너지 사용의 당위성을 한 번 더 강조하며 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">save us money 4형식(SVOO) 구조: save + 간접목적어(us) + 직접목적어(money) 구조로 &#39;~의 돈을 절약해주다&#39;라는 의미를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">alternative</td><td class=\"m\">대안의, 대신하는</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>대체 에너지는 화석 연료 사용을 줄여주는 큰 장점이 있다.</li><li>화석 연료는 배기가스를 배출해 인체에 치명적인 해를 끼친다.</li><li>대체 에너지는 초기 비용은 높지만 엔진 수명을 늘려 장기적으로 경제적이다.</li><li>결론적으로 대체 에너지는 생명과 재산을 모두 보호하는 합리적인 선택이다.</li></ul></div><div class=\"lec-fi
