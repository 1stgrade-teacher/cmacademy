니다. 태양 에너지가 엔진 역할을 하여 액체인 물이 기체로 변하는 증발(Evaporation) 현상을 일으키고, 이렇게 올라간 수증기가 높은 하늘에서 차가워져 다시 액체가 되는 응결(Condensation) 과정을 거쳐 구름이 만들어집니다. 차가운 컵 표면에 물방울이 맺히는 것과 같은 원리로 생성된 구름은 비나 눈이 되어 내리는 강수(Precipitation)를 통해 다시 땅으로 돌아오게 됩니다. 이러한 순환은 수십억 년 동안 반복되며 지구의 온도를 조절하고 생명체가 살아갈 수 있는 에너지와 자원의 균형을 유지해 주는 아주 중요한 자연 현상입니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01가열과 증발</div><ul><li>지표면의 물이 태양열을 받아 수증기로 변하는 단계이다.</li><li>강, 호수, 바다에 존재하는 물(water)</li><li>태양(sun)이 물을 가열함</li><li>핵심 키워드: 증발(evaporate), 수증기(vapor)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02수증기 상승과 구름 형성</div><ul><li>증발한 수증기가 공중으로 올라가 구름을 만든다.</li><li>수증기가 공기 중으로 상승함</li><li>하늘에서 구름(clouds)을 형성함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03구름 이동과 응결</div><ul><li>구름이 바람을 타고 이동하며 다시 물방울로 변하기 시작한다.</li><li>바람(wind)이 구름을 육지 위로 이동시킴</li><li>기온(temperature) 하강으로 수증기가 물방울로 변함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04강수와 순환의 완성</div><ul><li>물이 다시 지표면으로 떨어져 바다로 돌아가며 순환이 반복된다.</li><li>물방울이 지면으로 떨어짐(falls)</li><li>물이 육지를 지나 바다(sea)로 유입됨</li><li>핵심 개념: 물의 순환(water cycle)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evaporate</td><td class=\"m\">증발하다, 사라지다</td></tr><tr><td class=\"w\">turn into</td><td class=\"m\">~로 변하다, ~이 되다</td></tr><tr><td class=\"w\">vapor</td><td class=\"m\">증기, 수증기</td></tr><tr><td class=\"w\">rise up</td><td class=\"m\">오르다, 올라가다</td></tr><tr><td class=\"w\">form</td><td class=\"m\">형성하다, 만들다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">temperature</td><td class=\"m\">온도, 기온</td></tr><tr><td class=\"w\">turn back into</td><td class=\"m\">~로 다시 변하다, 되돌아가다</td></tr><tr><td class=\"w\">flow</td><td class=\"m\">흐르다, 유입되다</td></tr><tr><td class=\"w\">be(v) known as</td><td class=\"m\">~로 알려져 있다, ~라고 불리다</td></tr><tr><td class=\"w\">water cycle</td><td class=\"m\">물의 순환</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지구의 물 대부분은</span><span class=\"en\"><b><span class=\"grammar-hl\">Most of the Earth’s water</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">땅 위에.</span><span class=\"en\"><b>on the ground.</b></span></div></div><div class=\"lec-sent-ko\">지구의 물 대부분은 땅 위에 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Most of the Earth’s water는 바다나 강처럼 우리 눈에 보이는 지표면의 물을 가리키며, 물의 순환이 시작되는 공간적 배경을 먼저 제시하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Most of the Earth’s water is (수일치): Most of 뒤에 불가산명사(water)가 오면 단수 취급하므로 단수 동사 is를 사용한 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 그것을 볼 수 있다</span><span class=\"en\"><b>You <span class=\"grammar-hl\">can find</span> it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강이나, 호수, 바다에서.</span><span class=\"en\"><b>in rivers, lakes, and oceans.</b></span></div></div><div class=\"lec-sent-ko\">우리는 물을 강이나, 호수, 바다에서 볼 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> You can find it은 앞 문장에서 언급한 &#39;지면의 물&#39;이 구체적으로 어떤 형태로 존재하는지 독자가 쉽게 떠올릴 수 있도록 예를 들어 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can find (조동사): 조동사 can 뒤에 동사원형 find가 결합하여 가능성을 나타내는 서술부를 형성한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">태양이 비출 때면,</span><span class=\"en\"><b><span class=\"grammar-hl\">When the sun shines</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 물을 덥힌다.</span><span class=\"en\"><b>it heats the water.</b></span></div></div><div class=\"lec-sent-ko\">태양이 비출 때면 그것이 물을 덥힌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> it heats the water는 가만히 멈춰 있던 물에 태양이라는 강력한 에너지원이 개입하여 상태 변화를 일으키는 첫 번째 동력이 발생했음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When the sun shines (부사절): 접속사 when이 이끄는 시간의 부사절로, 주어(the sun)와 자동사(shines)가 결합된 완전한 구조를 갖추고 있다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">물의 일부는</span><span class=\"en\"><b>Some of the water</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">증발되는데,</span><span class=\"en\"><b>evaporates,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이는 곧 수증기로 변한다는 것을 뜻한다.</span><span class=\"en\"><b><span class=\"grammar-hl\">which means</span> it <span class=\"grammar-hl\">turns into</span> vapor.</b></span></div></div><div class=\"lec-sent-ko\">물의 일부는 증발되는데, 이는 곧 수증기로 변한다는 것을 뜻한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> turns into vapor는 액체였던 물이 열을 받아 눈에 보이지 않는 기체로 성질이 완전히 바뀌어 공기 중으로 섞여 들어가는 과정을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">which means (관계대명사): 주격 관계대명사 which의 계속적 용법으로, 앞 문장의 내용 전체를 선행사로 받아 부연 설명을 이어가는 구조이다.</div><div class=\"lec-gr-item\">turns into (관용표현): turn into는 &#39;~으로 변하다&#39;라는 의미로 상태의 변화를 나타내는 숙어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evaporate</td><td class=\"m\">증발하다, 사라지다</td></tr><tr><td class=\"w\">vapor</td><td class=\"m\">증기, 수증기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 수증기는</span><span class=\"en\"><b>This water vapor</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">올라가서</span><span class=\"en\"><b>rises up</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공중으로</span><span class=\"en\"><b>into the air</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구름을 형성한다.</span><span class=\"en\"><b>and forms clouds.</b></span></div></div><div class=\"lec-sent-ko\">이 수증기는 공중으로 올라가서 구름을 형성한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> forms clouds는 흩어져 있던 기체 상태의 수증기가 하늘 높이 올라가 다시 한데 모이면서 구름이라는 가시적인 형태를 갖추게 되었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">rises up ... and forms (병렬구조): 등위접속사 and가 주어 This water vapor에 연결되는 두 개의 단수 동사 rises와 forms를 대등하게 연결하고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">vapor</td><td class=\"m\">증기, 수증기</td></tr><tr><td class=\"w\">form</td><td class=\"m\">형성하다, 만들다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">바람은 구름을 불어 날린다</span><span class=\"en\"><b>The wind blows the clouds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하늘을 가로질러,</span><span class=\"en\"><b>through the sky,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 육지 위로 올 때까지.</span><span class=\"en\"><b><span class=\"grammar-hl\">until they are</span> over the land.</b></span></div></div><div class=\"lec-sent-ko\">바람은 구름을 불어 날려 육지로 오게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> until they are over the land는 바다 위에서 만들어진 구름이 수평적으로 이동하여 비를 내릴 수 있는 육지 상공까지 도달했음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">until they are (부사절): 접속사 until이 &#39;~할 때까지&#39;라는 의미로 절을 이끌어 주절의 동작이 지속되는 시점을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기온이 떨어지면,</span><span class=\"en\"><b>The air temperature falls,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수증기는 다시 변하기 시작한다</span><span class=\"en\"><b>and the vapor <span class=\"grammar-hl\">starts to turn</span> back</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물방울로.</span><span class=\"en\"><b>into drops of water.</b></span></div></div><div class=\"lec-sent-ko\">기온이 떨어지면 수증기는 다시 물방울로 변하기 시작한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> turn back into drops of water는 높은 곳의 차가운 공기 때문에 기체가 다시 액체로 응결되면서 하늘에 머물 수 없을 만큼 무거워지는 과정을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">starts to turn (to부정사): to부정사(to turn)가 동사 starts의 목적어로 쓰인 명사적 용법이다.</div><div class=\"lec-gr-item\">turn back into (관용표현): turn back into는 &#39;다시 ~으로 변하다/돌아가다&#39;라는 의미의 숙어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">vapor</td><td class=\"m\">증기, 수증기</td></tr><tr><td class=\"w\">temperature</td><td class=\"m\">온도, 기온</td></tr><tr><td class=\"w\">turn back into</td><td class=\"m\">~로 다시 변하다, 되돌아가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러면</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 물은 떨어진다</span><span class=\"en\"><b>this water <span class=\"grammar-hl\">falls</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">땅 위로.</span><span class=\"en\"><b><span class=\"grammar-hl\">to the ground</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러면 이 물은 땅위로 떨어진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> falls to the ground는 하늘에 머물던 물이 중력에 의해 비나 눈의 형태로 다시 땅으로 내려오는 하강 단계를 묘사하며 수직적인 이동을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">falls to the ground (자동사): fall은 목적어가 필요 없는 완전자동사로 쓰였으며, 뒤에 장소를 나타내는 전치사구 to the ground가 이어지는 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 중 일부는 흐른다</span><span class=\"en\"><b>Some of it flows</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">땅 위를 가로질러</span><span class=\"en\"><b><span class=\"grammar-hl\">across the land</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 바다 속으로.</span><span class=\"en\"><b><span class=\"grammar-hl\">and into the sea</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 중 일부는 땅 위를 흘러 바다로 들어간다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> flows across the land는 땅에 내려온 물이 지형을 따라 낮은 곳으로 흐르며 결국 원래의 출발지였던 거대한 물줄기로 합쳐지는 과정을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">across the land and into the sea (병렬구조): 등위접속사 and가 전치사구 across the land와 into the sea를 대등하게 연결하여 동사 flows를 수식하는 부사구 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flow</td><td class=\"m\">흐르다, 유입되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그렇게 된 후에는,</span><span class=\"en\"><b>After <span class=\"grammar-hl\">it does</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 것이 시작된다</span><span class=\"en\"><b>everything begins</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다시 한번 더.</span><span class=\"en\"><b>once again.</b></span></div></div><div class=\"lec-sent-ko\">그 후에는 모든 것이 다시 시작된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> everything begins once again은 지금까지의 모든 과정이 일회성 사건이 아니라, 끝과 시작이 연결된 톱니바퀴처럼 멈추지 않고 계속 돌아간다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it does (대동사): 앞 문장의 일반동사구(flows across...)를 대신하여 반복을 피하기 위해 쓰였다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be(v) known as</td><td class=\"m\">~로 알려져 있다, ~라고 불리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 알려져 있다</span><span class=\"en\"><b>This <span class=\"grammar-hl\">is known</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물의 순환으로.</span><span class=\"en\"><b><span class=\"grammar-hl\">as</span> the water cycle.</b></span></div></div><div class=\"lec-sent-ko\">이것이 물의 순환이라고 알려져 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> the water cycle은 앞에서 설명한 가열, 증발, 이동, 강수, 유출의 전 과정을 하나의 과학적 원리로 정의하며 글의 주제를 명확히 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is known as (수동태): be동사(is)+p.p.(known) 구조. know는 타동사인데 뒤에 목적어가 없어서 수동구조 is known 형태로 쓴다. 기본구조: know A as B (A를 B로 알다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">water cycle</td><td class=\"m\">물의 순환</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>지구의 물은 대부분 강과 바다 등 지표면에 존재한다.</li><li>태양열이 물을 가열하면 수증기가 되어 하늘로 올라가 구름이 된다.</li><li>바람을 타고 이동한 구름은 온도가 낮아지면 다시 물방울이 되어 땅으로 떨어진다.</li><li>땅에 떨어진 물이 다시 바다로 흘러가며 이 과정이 무한히 반복되는데, 이를 &#39;물의 순환&#39;이라 부른다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Water evaporates from the Earth’s surface to form clouds before falling back to the ground as rain to repeat the cycle indefinitely.</div>\n              <div class=\"lec-final-sum-ko\">물은 순환을 무한히 반복하기 위해 지면으로 다시 비가 되어 떨어지기 전 지표면에서 증발하여 구름을 형성한다.</div></div></div>"],"segs":[[{"audio":"./apply01_audio/1.mp3","hl":null}],[{"audio":"./apply01_audio/2.mp3","hl":null}],[{"audio":"./apply01_audio/3.mp3","hl":null},{"audio":"./apply01_audio/4.mp3","hl":"stage-0"},{"audio":"./apply01_audio/5.mp3","hl":"stage-1"},{"audio":"./apply01_audio/6.mp3","hl":"stage-2"},{"audio":"./apply01_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply01_audio/8.mp3","hl":null}],[{"audio":"./apply01_audio/9.mp3","hl":"main"},{"audio":"./apply01_audio/10.mp3","hl":"meaning"},{"audio":"./apply01_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/12.mp3","hl":"main"},{"audio":"./apply01_audio/13.mp3","hl":"meaning"},{"audio":
