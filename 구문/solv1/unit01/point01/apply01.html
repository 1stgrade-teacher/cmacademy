></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02구름의 이동</div><ul><li>형성된 구름은 바람을 타고 육지 쪽으로 이동하게 됩니다.</li><li>바람(wind)의 영향으로 구름이 하늘을 이동</li><li>구름이 육지(land) 위쪽으로 도달</li><li>이동 과정에서의 구름 상태 변화</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03응결과 강수</div><ul><li>공기의 온도가 낮아지면서 수증기가 다시 물방울로 변해 지상으로 떨어집니다.</li><li>공기 온도(air temperature) 하강으로 인한 변화</li><li>수증기가 물방울(drops of water)로 응결</li><li>비의 형태로 지표면에 물이 도달</li><li>핵심 키워드: 강수(precipitation)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04물의 흐름과 순환의 지속</div><ul><li>지상에 떨어진 물은 다시 바다로 흘러가며 이 과정이 계속해서 반복됩니다.</li><li>물이 지표면을 따라 바다(sea)로 흐름</li><li>자연적인 물의 순환(water cycle) 체계 확립</li><li>모든 과정이 다시 시작되는 지속성</li><li>핵심 키워드: 순환(cycle)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evaporate</td><td class=\"m\">증발하다, 사라지다</td></tr><tr><td class=\"w\">turn into</td><td class=\"m\">~로 변하다, ~이 되다</td></tr><tr><td class=\"w\">water vapor</td><td class=\"m\">수증기</td></tr><tr><td class=\"w\">rise up</td><td class=\"m\">떠오르다, 솟아오르다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">form</td><td class=\"m\">형성하다, 구성하다</td></tr><tr><td class=\"w\">flow</td><td class=\"m\">흐르다, 넘쳐흐르다</td></tr><tr><td class=\"w\">be known as</td><td class=\"m\">~로 알려지다, ~라 불리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지구의 물 대부분은</span><span class=\"en\"><b><span class=\"grammar-hl\">Most of the Earth’s water</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있으며</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">땅 위에 있다.</span><span class=\"en\"><b>on the ground.</b></span></div></div><div class=\"lec-sent-ko\">지구의 물 대부분은 땅 위에 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 도입부로서, 물이 지구 어디에 존재하는지 그 시작점을 제시하며 물의 순환 과정에 대한 논의를 엽니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Most of the Earth’s water 명사구 구조: &#39;most of + 한정사(the) + 명사&#39; 형태를 사용하여 전체의 일부분을 나타내는 주어 구성.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 그것을 찾을 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">You can find it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강, 호수, 그리고 바다에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in rivers, lakes, and oceans</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 물을 강이나, 호수, 바다에서 볼 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 지표면의 물이 구체적으로 어떤 형태와 장소에 머물러 있는지를 예시를 들어 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">You can find it in rivers, lakes, and oceans 3형식 구조: 주어(You) + 동사(can find) + 목적어(it) + 전치사구(in ...)가 결합된 형태.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">태양이 비출 때면,</span><span class=\"en\"><b><span class=\"grammar-hl\">When the sun shines</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 물을 덥힌다</span><span class=\"en\"><b>it heats the water.</b></span></div></div><div class=\"lec-sent-ko\">태양이 비출 때면 그것이 물을 덥힌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물이 지표면에 머물러 있는 상태에서 다음 단계인 증발 과정으로 넘어가기 위한 물리적인 원인을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When the sun shines 관계부사(접속사) when: 시간을 나타내는 부사절로, &#39;주어(the sun) + 동사(shines)&#39;가 결합된 형태.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">물의 일부는 증발한다,</span><span class=\"en\"><b>Some of the water evaporates,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(그리고) 그것은 의미한다</span><span class=\"en\"><b><span class=\"grammar-hl\">which means</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 증기로 변한다는 것을</span><span class=\"en\"><b>it turns into vapor.</b></span></div></div><div class=\"lec-sent-ko\">물의 일부는 증발되는데, 이는 곧 수증기로 변한다는 것을 뜻한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 열기에 의해 물이 어떻게 상태 변화를 일으키는지 그 구체적인 현상을 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">which means 관계대명사(계속적 용법): 앞 문장 전체의 내용을 선행사로 받으며, 주격 관계대명사 which 뒤에 동사 means가 바로 이어지는 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evaporate</td><td class=\"m\">증발하다, 사라지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 수증기는</span><span class=\"en\"><b>This water vapor</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">올라간다</span><span class=\"en\"><b><span class=\"grammar-hl\">rises up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공중으로</span><span class=\"en\"><b>into the air</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 구름을 형성한다</span><span class=\"en\"><b>and forms clouds.</b></span></div></div><div class=\"lec-sent-ko\">이 수증기는 공중으로 올라가서 구름을 형성한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 증발한 수증기가 고도가 높아지면서 응결되어 구름이라는 형태로 모이게 되는 과정을 시간 순서대로 잇습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">rises up (자동사구): 주어의 동작을 나타내며 목적어 없이 주어 스스로 행하는 상태를 설명함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">water vapor</td><td class=\"m\">수증기</td></tr><tr><td class=\"w\">form</td><td class=\"m\">형성하다, 구성하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">바람은 구름을 불어 보낸다</span><span class=\"en\"><b>The wind blows the clouds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하늘을 가로질러,</span><span class=\"en\"><b>through the sky,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 육지 위로 올 때까지</span><span class=\"en\"><b><span class=\"grammar-hl\">until they are over the land</span>.</b></span></div></div><div class=\"lec-sent-ko\">바람은 구름을 불어 날려 육지로 오게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 하늘에 떠 있는 구름이 외부 요인인 바람을 통해 이동하여, 다시 지상으로 물을 전달할 위치를 잡는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">until they are over the land 접속사 until: &#39;주어(they) + be동사(are) + 보어(over the land)&#39; 구조를 취하며, 특정한 때까지의 시간적 경계를 나타내는 부사절.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기온이 떨어진다,</span><span class=\"en\"><b>The air temperature falls,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 수증기는 다시 변하기 시작한다</span><span class=\"en\"><b>and the vapor <span class=\"grammar-hl\">starts to turn</span> back</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물방울로</span><span class=\"en\"><b>into drops of water.</b></span></div></div><div class=\"lec-sent-ko\">기온이 떨어지면 수증기는 다시 물방울로 변하기 시작한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대기 중의 환경 변화가 수증기의 상태를 다시 액체인 물로 되돌리는 결정적인 기점이 됨을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">starts to turn (to부정사): 동사 start의 목적어 역할을 하며, &#39;to + 동사원형&#39; 형태가 명사적 기능으로 쓰임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러면 이 물은 떨어진다</span><span class=\"en\"><b>Then this water <span class=\"grammar-hl\">falls</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">땅 위로</span><span class=\"en\"><b><span class=\"grammar-hl\">to the ground</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러면 이 물은 땅위로 떨어진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 응결된 물방울들이 중력에 의해 지표면으로 돌아오는 강수 현상을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">falls to the ground 기본 문장 구조: 주어(this water) + 자동사(falls) + 부사구(to the ground)로 구성된 1형식 문장.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것의 일부는 흐른다</span><span class=\"en\"><b>Some of it <span class=\"grammar-hl\">flows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">땅을 가로질러</span><span class=\"en\"><b><span class=\"grammar-hl\">across the land</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 바다 안으로</span><span class=\"en\"><b><span class=\"grammar-hl\">and into the sea</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 중 일부는 땅 위를 흘러 바다로 들어간다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지상으로 떨어진 물이 고여 있다가 다시 낮은 곳인 바다로 이동하며 순환의 경로를 완성해가는 모습입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">flows across the land and into the sea 병렬 구조: 전치사구 &#39;across the land&#39;와 &#39;into the sea&#39;가 등위접속사 and로 연결되어 동사 flows의 동작 방향을 구체화함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flow</td><td class=\"m\">흐르다, 넘쳐흐르다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것이 행해진 후에,</span><span class=\"en\"><b><span class=\"grammar-hl\">After it does</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 것이 시작된다</span><span class=\"en\"><b>everything begins</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다시 한번</span><span class=\"en\"><b>once again.</b></span></div></div><div class=\"lec-sent-ko\">그 후에는 모든 것이 다시 시작된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞에서 설명한 일련의 과정이 일회성 사건이 아니라 끊임없이 반복되는 자연의 흐름임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">After it does (대동사(do)): 앞 문장의 &#39;flows across...&#39;라는 일반동사구 반복을 피하기 위해 쓰인 대동사. 앞의 동사가 일반동사이면 do를 쓴다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 알려져 있다</span><span class=\"en\"><b>This <span class=\"grammar-hl\">is known</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물의 순환으로</span><span class=\"en\"><b><span class=\"grammar-hl\">as</span> the water cycle.</b></span></div></div><div class=\"lec-sent-ko\">이것이 물의 순환이라고 알려져 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 기술한 전체 과정을 &#39;물의 순환&#39;이라는 개념으로 요약하여 이 글의 주제를 명확히 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is known as (수동태): be동사(is) + p.p.(known) 구조. know은 타동사인데 목적어가 없어서 수동구조 is known 형태로 쓴다. 기본구조: know A as B(A를 B라고 알다).</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>지구의 물은 지표면 강과 바다에 존재한다.</li><li>태양열로 증발한 수증기는 하늘로 올라가 구름이 된다.</li><li>바람을 타고 이동한 구름은 기온이 낮아지면 다시 비가 되어 땅으로 내린다.</li><li>이 물은 바다로 흘러가 다시 순환하며, 이를 물의 순환이라 부른다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Water evaporates into the air to form clouds and falls back to the ground as precipitation, then it flows into the sea to restart the cycle.</div>\n              <div class=\"lec-final-sum-ko\">물은 증발하여 구름이 되고 강수 형태로 지표면에 다시 내려오며, 다시 바다로 흘러가 순환을 시작한다.</div></div></div>"],"segs":[[{"audio":"./point01-1_audio/1.mp3","hl":null}],[{"audio":"./point01-1_audio/2.mp3","hl":null}],[{"audio":"./point01-1_audio/3.mp3","hl":null},{"audio":"./point01-1_audio/4.mp3","hl":"stage-0"},{"audio":"./point01-1_audio/5.mp3","hl":"stage-1"},{"audio":"./point01-1_audio/6.mp3","hl":"stage-2"},{"audio":"./point01-1_audio/7.mp3","hl":"stage-3"}],[{"audio":"./point01-1_audio/8.mp3","hl":null}],[{"audio":"./point01-1_audio/9.mp3","hl":"main"},{"audio":"./point01-1_audio/10.mp3","hl":"meaning"},{"audio":"./point01-1_audio/11.mp3","hl":"grammar"}],[{"audio":"./point01-1_audio/12.mp3","hl":"main"},{"audio":"./point01-1_audio/13.mp3","hl":"meaning"},{
