BTt4AwHQkdgRjnIzjdjgnHIOM9cg0bgS+/fGP8/Xv9OlMZscDr1P+QQe2O3rk4wU3jGdy59Ny++MnJ6446d+ajJA/jU/8DzjjoMnPTmgXVr9f06ITILEgEDJH4AnH/wBfHf8ARGJAOOuCR+H+PajcO5HJ45zx19OvXjOPfsAngkHI2nnkjse5IyAe5GcYyARTjunvqn3T1/KxLbenK9Nut9t3tbTXXtruf//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Is the Wild Always Better? The Dangers of Releasing Zoo Animals<small>야생이 항상 더 나은가? 동물원 동물 방생의 위험성</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">야생 동물을 원래 서식지로 돌려보내는 과정을 야생 방사(Reintroduction)라고 부르는데, 이는 단순히 문을 열어주는 것 이상의 아주 복잡하고 정교한 노력이 필요합니다. 동물원 같은 사육(Captivity) 환경에서 오래 지낸 동물들은 먹이를 구하거나 천적을 피하는 등의 필수적인 야생 생존 기술(Survival Skills)을 학습할 기회를 잃어버려, 자연으로 돌아갔을 때 스스로 살아남기 매우 어렵기 때문입니다. 마치 평생 마트에서 음식을 사 먹던 사람이 갑자기 아무 도구 없이 무인도에 홀로 남겨지는 것과 비슷해서, 준비 없는 방사는 오히려 동물의 생명을 위태롭게 만드는 부적절한 개입이 될 수 있습니다. 그래서 전문가들은 방사 전후로 동물이 자연에 점진적으로 익숙해지도록 돕는 적응 훈련(Acclimatization) 과정을 거치며, 해당 동물이 야생에서 자생할 수 있는 상태인지를 엄격하게 평가하곤 합니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01일반적인 주장</div><ul><li>일부 사람들은 동물원 유지를 반대하며 동물을 자연으로 돌려보내야 한다고 믿는다.</li><li>야생 복귀 주장: 동물들을 야생으로 돌려보내야 함 (return to the wild)</li><li>동물원 반대: 동물원 유지에 대한 부정적 견해 (oppose)</li><li>핵심 키워드: 야생 동물(wild animals)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02현실적인 제약</div><ul><li>동물원에서 오래 생활한 동물들은 야생에서 살아남을 능력을 갖추지 못하고 있다.</li><li>생존 기술의 부재: 야생 생존에 필요한 기술과 능력 상실 (skills and abilities)</li><li>환경적 요인: 일평생을 동물원에서 보낸 경우도 있음 (spent their whole lives)</li><li>핵심 키워드: 생존(survive)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03야생에서의 위기</div><ul><li>야생으로 돌아간 동물들은 생존이 걸린 위기 상황을 극복하기 어렵다.</li><li>생사의 갈림길: 야생의 가혹한 도전 과제에 직면 (life-or-death challenges)</li><li>극복의 불가능성: 위기를 이겨낼 가능성이 낮음 (unlikely to overcome)</li><li>핵심 키워드: 위기 극복(overcome)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04최종 결론</div><ul><li>방생은 동물의 삶을 개선하기보다 오히려 악화시키므로 현재 장소에 두는 것이 낫다.</li><li>부정적 판단: 야생 방생은 잘못된 생각임 (bad idea)</li><li>최선의 선택: 현재의 동물원에 그대로 머무는 것이 유리함 (better off remaining)</li><li>핵심 키워드: 삶의 개선(improvement in the lives)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">oppose</td><td class=\"m\">반대하다, 대항하다</td></tr><tr><td class=\"w\">wild</td><td class=\"m\">야생, 자연 상태</td></tr><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다, 실현하다</td></tr><tr><td class=\"w\">necessarily</td><td class=\"m\">필연적으로, 반드시</td></tr><tr><td class=\"w\">improvement</td><td class=\"m\">개선, 향상</td></tr><tr><td class=\"w\">spend</td><td class=\"m\">(시간을) 보내다, (돈을) 쓰다</td></tr><tr><td class=\"w\">no longer</td><td class=\"m\">더 이상 ~않다</td></tr><tr><td class=\"w\">ability</td><td class=\"m\">능력, 역량</td></tr><tr><td class=\"w\">necessary</td><td class=\"m\">필요한, 필수적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">survive</td><td class=\"m\">살아남다, 견뎌내다</td></tr><tr><td class=\"w\">face</td><td class=\"m\">직면하다, 마주하다</td></tr><tr><td class=\"w\">life-or-death</td><td class=\"m\">생사가 걸린, 매우 중대한</td></tr><tr><td class=\"w\">challenge</td><td class=\"m\">도전, 난제</td></tr><tr><td class=\"w\">be unlikely to</td><td class=\"m\">~할 것 같지 않다</td></tr><tr><td class=\"w\">overcome</td><td class=\"m\">극복하다, 이겨내다</td></tr><tr><td class=\"w\">be better off</td><td class=\"m\">형편이 더 낫다, 더 좋은 상태이다</td></tr><tr><td class=\"w\">remain</td><td class=\"m\">남다, 머무르다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들이 있다</span><span class=\"en\"><b>There are some people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야생동물을 기른다는 생각에 반대하는</span><span class=\"en\"><b><span class=\"grammar-hl\">who</span> oppose the idea of <span class=\"grammar-hl\">keeping</span> wild animals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물원에서.</span><span class=\"en\"><b>in zoos.</b></span></div></div><div class=\"lec-sent-ko\">야생동물들을 동물원에서 기른다는 생각에 반대하는 사람들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 주제인 &#39;동물원 동물의 야생 복귀&#39;에 대한 논의를 시작하며, 현재 이 문제에 대해 비판적인 입장을 가진 집단이 있음을 소개합니다. oppose the idea는 동물을 우리에 가두는 행위 자체가 비인도적이라고 생각하는 시각을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who (관계대명사): 주격 관계대명사로 선행사 some people을 수식하는 형용사절을 이끌며, 뒤에 주어가 없는 불완전한 문장 구조가 온다.</div><div class=\"lec-gr-item\">keeping (동명사): 전치사 of의 목적어 역할을 하는 명사적 성분으로, 동사 keep의 성질을 유지하여 뒤에 목적어 wild animals를 수반한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">oppose</td><td class=\"m\">반대하다, 대항하다</td></tr><tr><td class=\"w\">wild</td><td class=\"m\">야생, 자연 상태</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 사람들은 믿는다</span><span class=\"en\"><b>These people believe</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 동물원 동물들을 돌려보내야 한다고</span><span class=\"en\"><b>that we should <span class=\"grammar-hl\">return zoo animals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야생으로.</span><span class=\"en\"><b><span class=\"grammar-hl\">to the wild</span>.</b></span></div></div><div class=\"lec-sent-ko\">이들은 우리가 동물원의 동물들을 야생으로 돌려보내야 한다고 믿는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 반대론자들이 주장하는 구체적인 해결책을 제시합니다. return zoo animals to the wild는 동물의 권리를 회복해 주기 위해 자연으로 다시 보내주는 것이 도덕적으로 옳다는 그들의 신념을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">return zoo animals to the wild (관용표현): &#39;return A to B&#39; 구조로 &#39;A를 B로 돌려보내다/반환하다&#39;라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wild</td><td class=\"m\">야생, 자연 상태</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 그들이 깨닫지 못하는 것은 ~이다</span><span class=\"en\"><b>But <span class=\"grammar-hl\">what they don’t realize</span> is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것이 반드시 향상을 약속하는 것은 아니라는 점</span><span class=\"en\"><b>that this doesn’t necessarily promise an improvement</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 동물들의 삶에서.</span><span class=\"en\"><b>in the lives of these animals.</b></span></div></div><div class=\"lec-sent-ko\">그러나 그들이 깨닫지 못하고 있는 것은 이것이 이 동물들의 삶에 향상을 반드시 약속하는 것은 아니라는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시된 일반적인 통념의 허점을 지적하며 글쓴이의 반대 의견을 본격적으로 드러내는 반전의 문장입니다. doesn’t necessarily promise an improvement는 야생으로 가는 것이 동물을 행복하게 만들기보다 오히려 더 고통스럽게 만들 수도 있다는 경고를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what they don’t realize (관계대명사): 선행사를 포함하는 관계대명사 what이 이끄는 명사절로, 문장 전체에서 주어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다, 실현하다</td></tr><tr><td class=\"w\">necessarily</td><td class=\"m\">필연적으로, 반드시</td></tr><tr><td class=\"w\">improvement</td><td class=\"m\">개선, 향상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들이 수년 혹은 때로는 전 생애를 보냈기에</span><span class=\"en\"><b>As they have <span class=\"grammar-hl\">spent</span> years, and sometimes their whole lives,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물원에서</span><span class=\"en\"><b>in zoos,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 더 이상 살아남는 데 필요한 기술과 능력을 갖고 있지 않다</span><span class=\"en\"><b>they no longer have the skills and abilities necessary <span class=\"grammar-hl\">to survive</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야생에서.</span><span class=\"en\"><b>in the wild.</b></span></div></div><div class=\"lec-sent-ko\">동물원의 동물들은 여러 해를 혹은 전 생애를 동물원에서 보냈기에 그들은 더 이상 야생에서 살아남는 데 필요한 기술과 능력을 갖고 있지 못하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 야생 복귀가 왜 위험한지 그 근거를 구체적으로 뒷받침합니다. no longer have the skills and abilities는 오랜 시간 인간의 보살핌에 익숙해진 탓에 먹이 사냥이나 포식자로부터의 방어 같은 생존 본능이 사라졌음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">spent (과거분사): 조동사 have와 결합하여 현재완료(have + p.p.) 시제를 형성하며, 과거부터 지금까지의 지속적인 상태나 경험을 나타낸다.</div><div class=\"lec-gr-item\">to survive (to부정사): 형용사적 용법으로 앞에 위치한 명사 abilities(또는 necessary가 포함된 명사구)를 수식하여 &#39;~하기 위해 필요한&#39;이라는 의미를 더한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wild</td><td class=\"m\">야생, 자연 상태</td></tr><tr><td class=\"w\">no longer</td><td class=\"m\">더 이상 ~않다</td></tr><tr><td class=\"w\">necessary</td><td class=\"m\">필요한, 필수적인</td></tr><tr><td class=\"w\">survive</td><td class=\"m\">살아남다, 견뎌내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서 이 동물들이 사느냐 죽느냐의 도전에 직면할 때</span><span class=\"en\"><b>So, when these animals face life-or-death challenges</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야생에서</span><span class=\"en\"><b>in the wild,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 그것들을 극복할 가능성이 별로 없다.</span><span class=\"en\"><b>they <span class=\"grammar-hl\">are unlikely to overcome</span> them.</b></span></div></div><div class=\"lec-sent-ko\">그래서 이 동물들이 야생에서 사느냐 죽느냐의 도전에 직면하게 되면 그들은 그 도전을 극복할 가능성이 별로 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 생존 기술이 없는 동물이 야생으로 나갔을 때 겪게 될 비극적인 결과를 예측합니다. unlikely to overcome them은 야생의 가혹한 환경을 이겨내지 못하고 결국 죽음에 이르게 될 확률이 높다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are unlikely to overcome (관용표현): &#39;be unlikely to + 동사원형&#39; 구조를 사용하여 &#39;~할 가능성이 낮다&#39; 또는 &#39;~할 것 같지 않다&#39;는 의미의 추측을 나타낸다.</div><div class=\"lec-gr-item\">to overcome (to부정사): be unlikely to 구문의 일부로 쓰였으며, to 뒤에 동사원형 overcome이 위치하여 주어 they의 동작을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wild</td><td class=\"m\">야생, 자연 상태</td></tr><tr><td class=\"w\">face</td><td class=\"m\">직면하다, 마주하다</td></tr><tr><td class=\"w\">life-or-death</td><td class=\"m\">생사가 걸린, 매우 중대한</td></tr><tr><td class=\"w\">challenge</td><td class=\"m\">도전, 난제</td></tr><tr><td class=\"w\">overcome</td><td class=\"m\">극복하다, 이겨내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 이유로</span><span class=\"en\"><b>For this reason,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물원 동물들을 야생으로 다시 보내는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">sending</span> zoo animals back into the wild</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그야말로 터무니없는 생각이다.</span><span class=\"en\"><b>is simply a bad idea.</b></span></div></div><div class=\"lec-sent-ko\">이러한 이유로 동물원 동물들을 야생에 돌려보내는 것은 그야말로 터무니 없는 생각이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 근거들을 바탕으로 야생 복귀 주장의 부당함을 결론짓습니다. simply a bad idea — 글쓴이는 여기서 힘주어 말합니다. 동물을 위한다는 명분으로 야생에 보내는 행위가 실상은 동물을 죽음으로 몰아넣는 잘못된 선택이라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sending (동명사): 문장의 주어 역할을 하는 명사적 성분으로 쓰였으며, 동명사구가 주어일 경우 단수 취급하므로 동사로 is를 사용한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wild</td><td class=\"m\">야생, 자연 상태</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 남는 편이 더 낫다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">are better off remaining</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바로 그들이 있는 곳에.</span><span class=\"en\"><b>exactly <span class=\"grammar-hl\">where they are</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 지금 그들이 있는 바로 그곳에 남는 편이 낫다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장으로, 현실적인 대안을 제시하며 글을 마무리합니다. better off는 생존 능력이 없는 동물들에게는 위험한 야생보다는 안전과 먹이가 보장된 동물원이 더 이롭다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are better off remaining (관용표현): &#39;be better off -ing&#39; 구조로 &#39;~하는 편이 (처지나 상황이) 더 낫다&#39;는 의미를 나타낸다.</div><div class=\"lec-gr-item\">remaining (동명사): 관용 표현 be better off의 뒤에서 주어의 상태를 보충 설명하는 명사적 성질로 쓰였다.</div><div class=\"lec-gr-item\">where they are (관계부사): 선행사를 포함한 장소의 관계부사절로 &#39;그들이 있는 곳&#39;이라는 의미를 나타내며, 문맥상 부사적/명사적 기능을 수행한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">remain</td><td class=\"m\">남다, 머무르다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>일부 사람들은 동물을 야생으로 돌려보내야 한다고 주장하지만, 이는 잘못된 생각일 수 있다.</li><li>오랜 기간 동물원에 머문 동물들은 야생에서 살아남을 생존 기술을 잃어버렸기 때문이다.</li><li>준비되지 않은 상태로 야생에 던져진 동물들은 생명의 위협을 이겨내지 못할 가능성이 크다.</li><li>따라서 이들에게는 원래 있던 동물원에서 보호받으며 지내는 것이 오히려 더 안전하고 나은 선택이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">While some argue for returning zoo animals to nature, doing so is impractical because these animals no longer possess the skills necessary for wild survival.</div>\n              <div class=\"lec-final-sum-ko\">비록 일부에서 동물원 동물의 야생 복귀를 주장하지만, 생존 기술이 부족한 동물들에게 그것은 실현 불가능한 위험한 조치이다.</div></div></div>"],"segs":[[{"audio":"./apply02_audio/1.mp3","hl":null}],[{"audio":"./apply02_audio/2.mp3","hl":null}],[{"audio":"./apply02_audio/3.mp3","hl":null},{"audio":"./apply02_audio/4.mp3","hl":"stage-0"},{"audio":"./apply02_audio/5.mp3","hl":"stage-1"},{"audio":"./apply02_audio/6.mp3","hl":"stage-2"},{"audio":"./apply02_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply02_audio/8.mp3","hl":null}],[{"audio":"./apply02_audio/9.mp3","hl":"main"},{"audio":"./apply02_audio/10.mp3","hl":"meaning"},{"audio":"./apply02_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/12.mp3","hl":"main"},{"audio":"./apply02_audio/13.mp3","hl":"meaning"},{"audio":"./apply02_audio/14.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/15.mp3","hl":"main"},{"audio":"./apply02_audio/16.mp3","hl":"meaning"},{"audio":"./apply02_audio/17.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/18.mp3","hl":"main"},{"audio":"./apply02_audio/19.mp3","hl":"meaning"},{"audio":"./apply02_audio/20.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/21.mp3","hl":"main"},{"audio":"./apply02_audio/22.mp3","hl":"meaning"},{"audio":"./apply02_audio/23.mp3","hl":" .playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
