Pue+euMYBHHHsLv31GtGm9tL9br8un3ruhemAOOeenb/E4GfWhhlW69D/AC9O/wDP07GkBRiBlSQeuRkYz3J6gdcnrwcHOGvJjO7HToO+eFA6qSR1H3e+7FXBK6bavdNJb3vpuvle2vlsKXwv0d9OjVvmrH//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Why Returning Zoo Animals to the Wild Is Not Always the Solution<small>동물원 동물을 야생으로 돌려보내는 것이 항상 해결책은 아닌 이유</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">동물원과 야생 동물 보호에 대해 다룬 이 글을 이해하기 위해서는 우선 재야생화(Rewilding)라는 개념과 야생 적응력(Wild adaptability)에 대해 알 필요가 있어요. 재야생화는 사육되던 동물을 다시 자연으로 돌려보내는 과정인데, 단순히 장소만 옮긴다고 해서 모든 문제가 해결되는 것은 아니에요. 마치 평생 실내에서만 자란 애완견이 갑자기 낯선 산속에 던져지면 먹이를 찾거나 천적을 피하기 어려운 것처럼, 동물원 동물들 역시 생존 기술(Survival skills)을 잃어버린 상태라 자연에서 살아남는 데 큰 어려움을 겪게 된답니다. 그래서 전문가들은 무조건적인 방생보다는 동물의 상태를 고려한 단계적 적응 훈련(Gradual adaptation training)이 필수적이라고 강조하죠. 즉, 이 지문은 인간의 따뜻한 의도와는 별개로, 동물의 실제 생존 확률이라는 현실적인 제약(Realistic constraints)을 고려해야 한다는 점을 짚어주고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01논쟁의 제기</div><ul><li>일부 사람들은 야생 동물을 동물원에 가두는 것에 반대하며 야생으로 돌려보내야 한다고 주장한다.</li><li>동물원 사육 반대론자들의 입장</li><li>야생 복귀(return to the wild)의 필요성 주장</li><li>핵심 키워드: 야생 동물(wild animals), 동물원(zoos)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02야생 적응력의 상실</div><ul><li>오랜 기간 동물원에서 생활한 동물들은 야생에서 생존하는 데 필요한 능력을 잃어버렸다.</li><li>야생 생존 기술(survival skills) 및 능력 부재</li><li>평생 혹은 오랜 시간 동안 동물원에 길들여짐</li><li>핵심 키워드: 야생(wild), 생존 기술(survival skills)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03생존의 위험성</div><ul><li>야생으로 돌아간 동물들은 예기치 못한 생존 위협을 극복하기 어렵다.</li><li>생사를 오가는 도전(life-or-death challenges)에 직면함</li><li>스스로 위기를 극복할 가능성이 매우 낮음</li><li>핵심 키워드: 생존(survival), 도전(challenges)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 제언</div><ul><li>야생으로의 방사는 무책임한 선택이 될 수 있으므로 현재의 환경을 유지하는 것이 더 낫다.</li><li>야생 복귀는 나쁜 생각(bad idea)으로 간주됨</li><li>현재의 동물원 환경에 머무는 것이 더 안전함</li><li>핵심 키워드: 방사(sending back), 보호(remaining)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">oppose</td><td class=\"m\">반대하다, 겨루다</td></tr><tr><td class=\"w\">not necessarily</td><td class=\"m\">반드시 ~은 아닌</td></tr><tr><td class=\"w\">improvement</td><td class=\"m\">개선, 향상</td></tr><tr><td class=\"w\">survive</td><td class=\"m\">살아남다, 생존하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">life-or-death</td><td class=\"m\">사활을 건, 절체절명의</td></tr><tr><td class=\"w\">be(v) unlikely to</td><td class=\"m\">~할 것 같지 않은</td></tr><tr><td class=\"w\">overcome</td><td class=\"m\">극복하다, 이겨내다</td></tr><tr><td class=\"w\">be(v) better off</td><td class=\"m\">더 나은 형편인, ~하는 편이 더 나은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일부 사람들이 있다</span><span class=\"en\"><b>There are some people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물원에 야생동물을 가둬두는 생각에 반대하는</span><span class=\"en\"><b><span class=\"grammar-hl\">who oppose</span> the idea of <span class=\"grammar-hl\">keeping wild animals in zoos</span>.</b></span></div></div><div class=\"lec-sent-ko\">야생동물들을 동물원에서 기른다는 생각에 반대하는 사람들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 동물원 존치에 대한 사회적 논란을 제시하며 글쓴이가 비판할 대상인 &#39;동물원 반대론자들&#39;의 입장을 먼저 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who oppose (관계대명사): who는 주격 관계대명사로 선행사 some people을 수식하며, 뒤에 주어가 없는 불완전한 절(oppose the idea...)이 이어짐</div><div class=\"lec-gr-item\">keeping wild animals in zoos (동명사): 전치사 of의 목적어 자리에 위치하여 &#39;야생 동물을 동물원에 가두는 것&#39;이라는 행위/활동을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">oppose</td><td class=\"m\">반대하다, 겨루다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 사람들은 믿는다</span><span class=\"en\"><b>These people <span class=\"grammar-hl\">believe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 동물원 동물들을 야생으로 돌려보내야 한다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> we should return zoo animals to the wild.</b></span></div></div><div class=\"lec-sent-ko\">이들은 우리가 동물원의 동물들을 야생으로 돌려보내야 한다고 믿는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 반대론자들의 구체적인 해결책을 서술하며, 이들이 왜 그러한 생각을 하는지 그 방향성을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">believe that 명사절 접속사: that절이 believe의 목적어 역할을 하며, 뒤에 완전한 절(we should return...)이 이어짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be(v) unlikely to</td><td class=\"m\">~할 것 같지 않은</td></tr><tr><td class=\"w\">be(v) better off</td><td class=\"m\">더 나은 형편인, ~하는 편이 더 나은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 그들이 깨닫지 못하는 것은</span><span class=\"en\"><b>But <span class=\"grammar-hl\">what they don’t realize</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것이 반드시 보장하지는 않는다는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> <span class=\"grammar-hl\">this doesn’t necessarily promise</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 동물들의 삶에서의 향상을</span><span class=\"en\"><b>an improvement in the lives of these animals.</b></span></div></div><div class=\"lec-sent-ko\">그러나 그들이 깨닫지 못하고 있는 것은 이것이 이 동물들의 삶에 향상을 반드시 약속하는 것은 아니라는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 접속사 &#39;But&#39;을 통해 반대론자들의 의견에 결함이 있음을 지적하며, 글쓴이가 본격적으로 자신의 논리를 전개하는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what they don’t realize (관계대명사): what은 &#39;…하는 것&#39;으로 해석되며, 뒤에 목적어가 빠진 불완전한 절(they don’t realize [something])이 명사절로서 주어 역할을 함</div><div class=\"lec-gr-item\">is that (5형식(보어)): be동사 뒤의 that절이 주어(what...)를 보충 설명하는 보어 역할을 수행함</div><div class=\"lec-gr-item\">this doesn’t necessarily promise 단순 부정: 일반동사 promise를 부정하기 위해 대동사 do를 활용한 부정형을 사용함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">improvement</td><td class=\"m\">개선, 향상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러 해를 보냈기에</span><span class=\"en\"><b><span class=\"grammar-hl\">As they have spent</span> years,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 전 생애를 때때로</span><span class=\"en\"><b>and sometimes their whole lives,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물원에서</span><span class=\"en\"><b>in zoos,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 더 이상 갖고 있지 못하다</span><span class=\"en\"><b>they no longer have</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기술과 능력을</span><span class=\"en\"><b>the skills and abilities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야생에서 살아남는 데 필요한</span><span class=\"en\"><b><span class=\"grammar-hl\">necessary</span> <span class=\"grammar-hl\">to survive</span> in the wild.</b></span></div></div><div class=\"lec-sent-ko\">동물원의 동물들은 여러 해를 혹은 전 생애를 동물원에서 보냈기에 그들은 더 이상 야생에서 살아남는 데 필요한 기술과 능력을 갖고 있지 못하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 야생 방사가 왜 위험한지에 대한 근본적인 원인을 설명합니다. 인간의 보호 아래 길들여진 환경이 동물들의 생존 본능을 앗아갔다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As they have spent (분사구문(접속사절)): As는 &#39;…하기 때문에&#39;라는 의미의 이유를 나타내는 접속사이며, 뒤에 주어(they)와 동사(have spent)를 갖춘 완전한 절이 옴</div><div class=\"lec-gr-item\">necessary 형용사 후치수식: skills and abilities라는 명사 뒤에서 해당 명사의 성질을 설명하는 형용사구로 쓰임</div><div class=\"lec-gr-item\">to survive (to부정사): 앞의 명사구(skills and abilities)를 수식하는 형용사적 용법으로, &#39;…할 능력&#39;이라는 의미를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">survive</td><td class=\"m\">살아남다, 생존하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 동물들이 사느냐 죽느냐의 도전에 직면하게 되면</span><span class=\"en\"><b><span class=\"grammar-hl\">when these animals face</span> life-or-death challenges</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야생에서</span><span class=\"en\"><b>in the wild,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 그 도전을 극복할 가능성이 별로 없다.</span><span class=\"en\"><b><span class=\"grammar-hl\">they are unlikely to overcome</span> them.</b></span></div></div><div class=\"lec-sent-ko\">그래서 이 동물들이 야생에서 사느냐 죽느냐의 도전에 직면하게 되면 그들은 그 도전을 극복할 가능성이 별로 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 생존 능력 상실이라는 원인이 야생 환경에서 어떤 치명적인 결과(생존 실패)로 이어지는지 논리적으로 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when these animals face (관계부사): when은 시간을 나타내는 접속사(혹은 관계부사)로 사용되어 &#39;…할 때&#39;라는 의미의 부사절을 이끎</div><div class=\"lec-gr-item\">they are unlikely to overcome (to부정사): be unlikely to V 구문에서 to overcome이 주어의 상태나 성질을 보충하는 보어적 성격으로 사용됨</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">life-or-death</td><td class=\"m\">사활을 건, 절체절명의</td></tr><tr><td class=\"w\">overcome</td><td class=\"m\">극복하다, 이겨내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 이유로,</span><span class=\"en\"><b>For this reason,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물원 동물들을 야생으로 다시 보내는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">sending zoo animals back into the wild</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그저 나쁜 생각이다</span><span class=\"en\"><b>is simply a bad idea.</b></span></div></div><div class=\"lec-sent-ko\">이러한 이유로 동물원 동물들을 야생에 돌려보내는 것은 그야말로 터무니 없는 생각이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시한 생존의 어려움을 근거로, 동물원 동물을 야생으로 보내는 행위가 부적절하다는 결론을 내립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sending zoo animals back into the wild (동명사): 문장의 주어 자리에 위치하여 &#39;동물들을 야생으로 돌려보내는 것&#39;이라는 행위적 개념을 명사화함</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 남는 편이 더 낫다</span><span class=\"en\"><b>They are better off <span class=\"grammar-hl\">remaining</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바로 그들이 있는 곳에</span><span class=\"en\"><b>exactly <span class=\"grammar-hl\">where they are</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 지금 그들이 있는 바로 그곳에 남는 편이 낫다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 동물들을 야생으로 보내는 대신, 현재의 환경(동물원)에서 보호받는 것이 그들에게 최선의 선택이라는 대안을 제시하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">remaining (현재분사): better off -ing(…하는 편이 낫다) 구문에서 진행 중인 상태나 동작을 강조하는 형용사적 성격의 분사로 사용됨</div><div class=\"lec-gr-item\">where they are (관계부사): 장소를 나타내는 명사절을 이끄는 관계부사로, &#39;그들이 있는 곳&#39;이라는 의미로 사용됨</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be(v) unlikely to</td><td class=\"m\">~할 것 같지 않은</td></tr><tr><td class=\"w\">be(v) better off</td><td class=\"m\">더 나은 형편인, ~하는 편이 더 나은</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>야생 동물을 동물원에 가두는 것에 반대하며 야생으로 돌려보내야 한다는 주장이 있다.</li><li>하지만 동물원 동물들은 야생 적응 능력을 상실했기 때문에 야생으로 돌아가면 생존이 어렵다.</li><li>따라서 무조건적인 야생 방사는 위험하며, 현재 환경에 머무르게 하는 것이 그들에게 더 나은 선택이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Zoo animals lack the essential survival skills for the wild, so keeping them in their current environment is a safer approach.</div>\n              <div class=\"lec-final-sum-ko\">동물원 동물들은 야생 생존 기술이 부족하므로, 현재 환경에 머물게 하는 것이 더 안전한 방법이다.</div></div></div>"],"segs":[[{"audio":"./point01-2_audio/1.mp3","hl":null}],[{"audio":"./point01-2_audio/2.mp3","hl":null}],[{"audio":"./point01-2_audio/3.mp3","hl":null},{"audio":"./point01-2_audio/4.mp3","hl":"stage-0"},{"audio":"./point01-2_audio/5.mp3","hl":"stage-1"},{"audio":"./point01-2_audio/6.mp3","hl":"stage-2"},{"audio":"./point01-2_audio/7.mp3","hl":
