juRgjgfdCEp22dMn5l/BVz06fQ98c5Lx0u0lbutfP0fo9urEk+l/zStb8uvqSAg9xwAev05+gzwTjnAwM0ZGM54+hA7H09xwPWmBo+cFMg7iNw68ZA+9gDPHOOmcEnK+ZGDjCHABwxGTkYxyCc5x3PIGOfujcejX4eXm93ca69fl6fr+dhQ68e4Hrxn+WO+cfnS7gOPYE+uCAT35x3HYg492bkx95MgDGGTkY542HPp1GcjI55RivIBUdTjcuSGAwMY9PwPY9DS5l3X3r/MLLtr1VuvX+rCszZIBHpx698DCnHqOenXBqMfX8/wD9WaCVAByvPT5gSc+i53cdD1peMHkZ9MjP5denPpgc9qLruvvATI/+v/n1yKViBk9gM9OenTA4z6+4pm9AQCVOc4+YZyD2BB/XHXpUgGOeOhzz2x3PbGT16n2BNF13X3r+u5Mk2na+z2V9Lrt0uv16H//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Advantages of Alternative Fuels: Safety and Economic Sustainability<small>대체 연료의 장점: 안전성과 경제적 지속 가능성</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에, 먼저 대체 연료(Alternative fuels)에 대해 알아두면 좋습니다. 이는 화석 연료(Fossil fuels)를 대체하여 에너지를 얻는 모든 물질을 뜻하는데, 주로 석유나 석탄 대신 사용하는 바이오 연료(Biofuel), 수소(Hydrogen), 전기(Electricity) 등이 대표적이에요. 우리가 흔히 쓰는 화석 연료는 타면서 지구 온난화(Global warming)의 주범인 이산화탄소를 배출하고 인체에 해로운 오염 물질을 뿜어내지만, 대체 연료는 이러한 환경적 부담을 줄여주죠. 마치 우리가 더 건강한 식단을 위해 가공식품을 줄이고 신선한 채소를 선택하는 것처럼, 자동차에게도 친환경적인 에너지원을 공급하는 것이라고 생각하면 이해가 쉬울 거예요. 이처럼 대체 연료는 단순히 환경 보호를 넘어 장기적으로 경제적 효율성(Economic efficiency)까지 고려한 미래 지향적인 에너지 전환의 핵심 열쇠랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입 및 주요 이점</div><ul><li>대체 연료를 사용하는 것은 우리에게 여러 가지 중요한 이점을 제공한다.</li><li>화석 연료 사용량의 감소 (reduce fossil fuels)</li><li>환경적, 생물학적 위험 감소</li><li>핵심 키워드: 화석 연료(fossil fuels), 대체 연료(alternative fuels)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02건강과 안전 보호</div><ul><li>화석 연료 연소 시 발생하는 유해가스는 인체에 치명적인 영향을 줄 수 있다.</li><li>자동차 배기가스(exhaust gas)의 위험성</li><li>인체 건강 손상 및 생명 위협</li><li>실내 사용 금지 이유 설명</li><li>핵심 키워드: 배기가스(exhaust gas), 생명 위협(cost lives)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03경제적 효율성</div><ul><li>대체 연료는 초기 비용은 높을지라도 장기적으로는 경제적인 선택이다.</li><li>장기적 관점의 경제성 (economical in the long term)</li><li>차량 엔진 수명 연장 (longer engine life)</li><li>비용 절감 및 차량 관리 효율성 증대</li><li>핵심 키워드: 경제성(economical), 엔진 수명(engine life)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론</div><ul><li>대체 연료 사용은 건강 보호와 경제적 이익이라는 두 가지 측면에서 가치가 있다.</li><li>인류의 건강과 재정적 이익의 결합</li><li>지속 가능한 에너지 선택의 필요성 제시</li><li>핵심 키워드: 비용 절감(save money), 생명 보호(save lives)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">alternative</td><td class=\"m\">대안의, 대체 가능한</td></tr><tr><td class=\"w\">reduce</td><td class=\"m\">줄이다, 감소시키다</td></tr><tr><td class=\"w\">exhaust gas</td><td class=\"m\">배기가스, 매연</td></tr><tr><td class=\"w\">cause</td><td class=\"m\">야기하다, 초래하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">damage</td><td class=\"m\">손상, 피해</td></tr><tr><td class=\"w\">cost</td><td class=\"m\">(어떤 대가를) 치르게 하다, 희생시키다</td></tr><tr><td class=\"w\">economical</td><td class=\"m\">경제적인, 절약하는</td></tr><tr><td class=\"w\">in the long term</td><td class=\"m\">장기적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 대체 연료를 사용할 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When we use alternative fuels</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 가져다준다</span><span class=\"en\"><b>it brings us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게 많은 이점을</span><span class=\"en\"><b>many advantages.</b></span></div></div><div class=\"lec-sent-ko\">우리가 대체 연료를 사용할 때, 그것은 우리에게 많은 이점을 가져다준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글 전체의 도입부로, 앞으로 전개될 대체 연료 사용의 긍정적인 측면들을 언급하겠다는 내용을 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When we use alternative fuels (분사구문(축약)): &#39;When + we + use alternative fuels&#39;와 같은 부사절 구조입니다. 여기서는 접속사 + 주어 + 동사로 이루어진 시간의 부사절로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">alternative</td><td class=\"m\">대안의, 대체 가능한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 중요한 것은,</span><span class=\"en\"><b>Most importantly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 우리가 할 수 있게 해준다는 것이다</span><span class=\"en\"><b>it <span class=\"grammar-hl\">allows us to reduce</span> the amount of fossil fuels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화석 연료의 양을 줄일 수 있도록</span><span class=\"en\"><b><span class=\"grammar-hl\">that we use</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 사용하는.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">가장 중요한 것은, 대체 연료는 우리가 사용하는 화석 연료의 양을 줄일 수 있게 해준다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 여러 이점 중 가장 핵심적인 이점인 &#39;화석 연료 사용 감소&#39;를 구체적으로 제시하며 글의 방향을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">allows us to reduce (5형식(SVOC)): &#39;allow + O + toV&#39; 구조입니다. allow(허용하다/하게 하다)가 동사(V), us가 목적어(O), to reduce가 목적보어(OC) 역할을 합니다.</div><div class=\"lec-gr-item\">that we use (관계대명사): &#39;that&#39;은 선행사 &#39;fossil fuels&#39;를 수식하며, 뒤의 &#39;use&#39; 동사의 목적어 자리가 비어 있는 목적격 관계대명사 절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reduce</td><td class=\"m\">줄이다, 감소시키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 화석 연료는</span><span class=\"en\"><b>These fossil fuels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">될 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">can be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위험할 수</span><span class=\"en\"><b><span class=\"grammar-hl\">dangerous</span>.</b></span></div></div><div class=\"lec-sent-ko\">화석 연료는 위험할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 화석 연료의 문제점을 지적하여, 왜 우리가 이를 줄여야 하는지에 대한 근거를 제시하는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be dangerous (관용표현): 조동사 can을 사용하여 가능성이나 능력을 나타내는 서술 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수백만 대의 차들이 휘발유를 태울 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">when millions of cars burn gasoline</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은 공기를 채운다</span><span class=\"en\"><b>they fill the air</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배기가스로</span><span class=\"en\"><b>with exhaust gas.</b></span></div></div><div class=\"lec-sent-ko\">예를 들면 수백만 대의 차들이 가솔린을 태울(사용할) 때, 차들은 공기를 배기가스로 채운다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화석 연료가 왜 위험한지에 대해 독자가 이해하기 쉬운 구체적인 사례를 들어 설명하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when millions of cars burn gasoline (분사구문(축약)): &#39;when + they(millions of cars) + burn gasoline&#39;으로 해석되는 시간의 부사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exhaust gas</td><td class=\"m\">배기가스, 매연</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 가스는</span><span class=\"en\"><b>This gas</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 몸에 심각한 해로움을 끼치거나</span><span class=\"en\"><b>can cause our bodies serious damage</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어는 앗아갈 수도 있다</span><span class=\"en\"><b>or even <span class=\"grammar-hl\">cost us our lives</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 목숨을.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">이 가스는 우리 몸에 심각한 해로움을 끼치거나 심지어는 목숨을 앗아갈 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 배기가스가 건강과 생명에 미치는 치명적인 영향력을 경고하며 화석 연료의 위험성을 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cost us our lives (5형식(SVOO)): &#39;cost + 간접목적어(us) + 직접목적어(our lives)&#39; 구조입니다. 주어가 목적어에게 무엇을 잃게 하다는 의미를 갖는 수여동사 패턴입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cause</td><td class=\"m\">야기하다, 초래하다</td></tr><tr><td class=\"w\">damage</td><td class=\"m\">손상, 피해</td></tr><tr><td class=\"w\">cost</td><td class=\"m\">(어떤 대가를) 치르게 하다, 희생시키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것이 이유이다</span><span class=\"en\"><b><span class=\"grammar-hl\">That’s why</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 사용하지 않는</span><span class=\"en\"><b>we don’t use</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가솔린 엔진을</span><span class=\"en\"><b>gasoline engines</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실내에서는</span><span class=\"en\"><b>indoors.</b></span></div></div><div class=\"lec-sent-ko\">그것이 우리가 가솔린 엔진을 실내에서는 사용하지 않는 이유이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시한 위험성에 대한 근거를 바탕으로, 일상생활에서 우리가 실천하고 있는 안전 수칙을 예시로 들어 논리를 강화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">That’s why (관계부사): &#39;the reason why&#39;에서 선행사가 생략된 형태로, 뒤에 완전한 절 &#39;we don’t use gasoline engines indoors&#39;가 이어지며 결과를 나타내는 부사절 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대체 연료의 또 다른 이점은</span><span class=\"en\"><b>Another advantage of alternative fuels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 경제적이라는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">that they are economical</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장기적으로 볼 때</span><span class=\"en\"><b>in the long term.</b></span></div></div><div class=\"lec-sent-ko\">대체 연료의 또 다른 이점은 장기적으로 볼 때 경제적이라는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 건강상 이점 외에 새로운 이점인 &#39;경제성&#39;을 추가로 제시하며 논의의 범위를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is that they are economical (보어절(that절)): 주격 보어 자리에 온 명사절로, 앞의 &#39;Another advantage&#39;를 구체화하는 절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">alternative</td><td class=\"m\">대안의, 대체 가능한</td></tr><tr><td class=\"w\">economical</td><td class=\"m\">경제적인, 절약하는</td></tr><tr><td class=\"w\">in the long term</td><td class=\"m\">장기적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대체 연료가 지금 조금 더 비싸기는 하지만</span><span class=\"en\"><b>They may cost a bit more now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자동차 엔진에 준다</span><span class=\"en\"><b>but they give <span class=\"grammar-hl\">your car’s engine</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 긴 내구성을.</span><span class=\"en\"><b>a much longer life.</b></span></div></div><div class=\"lec-sent-ko\">대체 연료가 지금 조금 더 비싸기는 하지만 자동차 엔진에 더 긴 내구성(수명)을 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 당장의 높은 가격이라는 단점을 인정하면서도, 엔진 수명 연장이라는 실질적인 가치를 강조하여 장기적 경제성을 입증합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">your car’s engine (5형식(SVOO)): give(주다)는 &#39;give + IO + DO&#39; 구조로, &#39;your car&#39;s engine(IO) + a much longer life(DO)&#39;의 4형식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cost</td><td class=\"m\">(어떤 대가를) 치르게 하다, 희생시키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러므로 대체 연료는</span><span class=\"en\"><b>So alternative fuels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리로 하여금 돈을 절약하게 해주고</span><span class=\"en\"><b><span class=\"grammar-hl\">save us money</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구해줄 수 있다</span><span class=\"en\"><b>and could save our lives.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 목숨을.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그러므로 대체 연료는 우리로 하여금 돈을 절약하게 해주고 우리의 목숨도 구해줄 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체에서 논의했던 경제적 가치와 건강상 이점을 요약하며 대체 연료 사용의 필요성을 다시 한번 확인하는 결론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">save us money (5형식(SVOO)): save(절약해 주다) 동사가 &#39;save + us(IO) + money(DO)&#39; 구조로 쓰여, 우리에게 돈을 절약해 준다는 의미를 전달합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">alternative</td><td class=\"m\">대안의, 대체 가능한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>대체 연료를 사용하면 화석 연료 사용을 줄여 환경과 건강을 지킬 수 있다.</li><li>화석 연료는 배기가스를 발생시켜 인체에 치명적인 위험을 줄 수 있다.</li><li>대체 연료는 당장 비용은 더 들 수 있지만, 자동차 수명을 연장해주어 장기적으로는 경제적이다.</li><li>결과적으로 대체 연료는 우리의 경제적 손실과 생명 위협을 모두 막아주는 유용한 대안이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Alternative fuels reduce the health risks caused by fossil fuel emissions, and they also increase the lifespan of car engines to save costs.</div>\n              <div class=\"lec-final-sum-ko\">대체 연료는 화석 연료 배출로 인한 건강 위험을 줄여주며, 자동차 엔진의 수명을 늘려 비용을 절감해 준다.</div></div></div>"],"segs":[[{"audio":"./point01-3_audio/1.mp3","hl":null}],[{"audio":"./point01-3_audio/2.mp3","hl":null}],[{"audio":"./point01-3_audio/3.mp3","hl":null},{"audio":"./point01-3_audio/4.mp3","hl":"stage-0"},{"audio":"./point01-3_audio/5.mp3","hl":"stage-1"},{"audio":"./point01-3_audio/6.mp3","hl":"stage-2"},{"audio":"./point01-3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./point01-3_audio/8.mp3","hl":null}],[{"audio":"./po
