: How We Manage the Annoyance of Waiting<small>3분의 법칙: 기다림의 짜증을 관리하는 방법</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 흔히 느끼는 지루함이나 짜증은 심리학에서 말하는 대기 심리(Waiting Psychology)와 밀접한 관련이 있는데, 이는 사람들이 대기 시간을 단순히 흐르는 시간이 아닌 &#39;심리적 비용&#39;으로 인식하기 때문이에요. 특히 이 지문에서 언급된 3분이라는 시간은 인간이 자신의 의지나 계획을 수정할지 결정하는 임계점(Threshold)과도 같은데, 마치 식당에서 메뉴판을 보고 주문을 고민하다가 3분이 지나면 &#39;다른 곳으로 갈까?&#39; 혹은 &#39;기다려 보자&#39;라고 마음을 굳히는 상황과 비슷하답니다. 이처럼 상황을 수용하는 과정을 인지적 재구조화(Cognitive Reframing)라고 하는데, 막연히 기다릴 때는 화가 나지만 &#39;기다리기로 마음먹는 순간&#39; 뇌는 스트레스 모드에서 평온 모드로 전환되죠. 결과적으로 우리 인간은 불확실한 상태를 견디기 힘들어하지만, 일단 스스로 선택을 내리면 그 상황을 훨씬 긍정적으로 받아들이는 선택의 힘(Power of Choice)을 가지고 있다는 점을 기억하면 지문을 더 깊이 이해하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01기다림의 고통</div><ul><li>사람들은 은행이나 극장에서 줄을 서서 기다리는 상황을 매우 견디기 힘들어한다.</li><li>대기 상황이 사람들을 화나게 함 (drives them crazy)</li><li>기다리는 것을 좋아하는 사람은 없음</li><li>핵심 키워드: 기다림(waiting), 인내심(patience)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">023분의 법칙</div><ul><li>과학적 연구에 따르면, 사람들에게는 3분이라는 대기 시간의 심리적 한계가 존재한다.</li><li>대부분의 사람에게는 3분이라는 제한 시간(time limit)이 있음</li><li>3분 이내에 떠날지 혹은 남을지를 결정함</li><li>핵심 키워드: 3분의 한계(three-minute limit)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03수용과 변화</div><ul><li>3분 이후 대기하기로 결정하면 기다림에 대한 고통은 현저히 줄어들게 된다.</li><li>상황을 받아들이면 짜증이 감소함 (less annoying)</li><li>마음을 편히 먹고 포기할 가능성이 낮아짐 (less likely to give up)</li><li>핵심 키워드: 수용(acceptance), 태도(attitude)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stand in line</td><td class=\"m\">줄을 서다, 대기하다</td></tr><tr><td class=\"w\">drive someone crazy</td><td class=\"m\">~를 미치게 만들다, ~를 화나게 하다</td></tr><tr><td class=\"w\">surprising</td><td class=\"m\">놀라운, 뜻밖의</td></tr><tr><td class=\"w\">scientific</td><td class=\"m\">과학의, 과학적인</td></tr><tr><td class=\"w\">the latter</td><td class=\"m\">후자</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">significantly</td><td class=\"m\">상당히, 의미심장하게</td></tr><tr><td class=\"w\">annoying</td><td class=\"m\">짜증나는, 성가신</td></tr><tr><td class=\"w\">take it easy</td><td class=\"m\">느긋하게 생각하다, 서두르지 않다</td></tr><tr><td class=\"w\">be likely to</td><td class=\"m\">~할 가능성이 있다, ~하기 쉽다</td></tr><tr><td class=\"w\">give up</td><td class=\"m\">포기하다, 단념하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들이 줄 서기를 강요받을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When people are forced to</span> stand in line</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오랫동안</span><span class=\"en\"><b>for a long time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">은행이나 영화관에서</span><span class=\"en\"><b>at a bank or a movie theater,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 그들을 미치게 만든다.</span><span class=\"en\"><b><span class=\"grammar-hl\">it drives them crazy</span>.</b></span></div></div><div class=\"lec-sent-ko\">은행이나 영화관에서 오래 줄을 서야만 하는 것은 사람들을 짜증나게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람들이 일상에서 겪는 보편적인 불편함을 언급하며, 글의 소재인 ‘줄 서기’에 대한 거부감을 제시하여 독자의 공감을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When people are forced to (분사구문): 접속사 When + 주어(people) + be동사(are) + 과거분사(forced)가 축약된 형태. 원래 절로 변환하면 &#39;when they are forced to&#39;가 되며, 시간을 나타낸다.</div><div class=\"lec-gr-item\">are forced (수동태): be동사(are)+p.p.(forced) 구조. force는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) are forced 형태로 쓴다. 기본구조: force + O + to V (O가 V하도록 강요하다).</div><div class=\"lec-gr-item\">to stand (to부정사): 앞선 수동태 구조 force + O + to V에서 목적어가 주어로 올라간 후 남은 목적격보어인 to부정사 구조이다.</div><div class=\"lec-gr-item\">it drives them crazy 5형식(SVOC) 구조: drive(동사) + them(목적어) + crazy(목적보어). 목적어의 상태를 보충 설명하는 형용사 보어(crazy)가 온 5형식 문장이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stand in line</td><td class=\"m\">줄을 서다, 대기하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 놀라운 일이 아니다,</span><span class=\"en\"><b>This is not surprising,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아무도 기다리는 것을 좋아하지 않기 때문에.</span><span class=\"en\"><b>since nobody likes <span class=\"grammar-hl\">to wait</span>.</b></span></div></div><div class=\"lec-sent-ko\">아무도 기다리는 것을 좋아하지 않기 때문에 이것은 놀라운 일이 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 사람들의 짜증 섞인 반응이 매우 당연한 심리적 현상임을 덧붙여 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to wait (to부정사): 타동사 like의 목적어 역할을 하는 명사적 용법의 to부정사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surprising</td><td class=\"m\">놀라운, 뜻밖의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최근의 한 과학 연구는 보여주었다</span><span class=\"en\"><b>a recent scientific study has shown</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 사람들이 한계 시간을 가지고 있다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that most people have a time limit</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기다리는 것에 대한: 3분.</span><span class=\"en\"><b><span class=\"grammar-hl\">for waiting</span>: three minutes.</b></span></div></div><div class=\"lec-sent-ko\">그러나 최근의 한 과학 연구는 대부분의 사람들이 기다리는 데 한계 시간을 갖고 있다는 것을 보여주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 ‘기다림은 괴롭다’는 일반적인 통념에서 벗어나, ‘3분’이라는 구체적인 수치를 제시하며 화제를 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that most people have a time limit for waiting 단순 that절: 타동사 shown의 목적어 역할을 하는 명사절이다. 이 구조는 당위성 that절이 아니므로 동사원형이 아닌 일반 시제(have)가 쓰였다.</div><div class=\"lec-gr-item\">waiting (동명사): 전치사 for의 목적어 역할을 하는 명사적 용법의 -ing 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scientific</td><td class=\"m\">과학의, 과학적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">첫 3분 안에</span><span class=\"en\"><b>Within the first three minutes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리들 대부분은 가 버리거나</span><span class=\"en\"><b>most of us will either <span class=\"grammar-hl\">walk away</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아니면 머무르기로 결정한다.</span><span class=\"en\"><b><span class=\"grammar-hl\">or decide to stay</span>.</b></span></div></div><div class=\"lec-sent-ko\">3분. 첫 3분 안에 우리들 대부분은 가 버리거나 아니면 머무르기로 결정한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3분이라는 한계 시간이 인간의 행동 선택에 어떤 영향을 미치는지 구체적인 상황을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">walk away or decide to stay (to부정사): 타동사 decide의 목적어 역할을 하는 명사적 용법의 to부정사이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 그들이 후자를 선택한다면,</span><span class=\"en\"><b>If they choose the latter,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 줄 서서 기다린다는 경험을 발견한다</span><span class=\"en\"><b>they find <span class=\"grammar-hl\">the experience of waiting</span> in line</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상당히 덜 짜증스럽게.</span><span class=\"en\"><b>significantly less annoying.</b></span></div></div><div class=\"lec-sent-ko\">그들이 후자를 선택하면 그들은 줄서서 기다린다는 경험을 훨씬 덜 짜증스럽게 생각한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기다리기로 마음을 먹은 사람들이 겪는 심리적 변화를 보여주며, 상황을 수용하는 것이 스트레스를 줄이는 전략이 됨을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the experience of waiting (동명사): 전치사 of의 목적어 역할을 하며, 앞의 명사 experience를 구체화하는 명사적 용법의 -ing 형태이다.</div><div class=\"lec-gr-item\">waiting in line (동명사): waiting이 &#39;줄 서기&#39;라는 행위/활동을 나타내며 명사적 개념으로 사용되었다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">the latter</td><td class=\"m\">후자</td></tr><tr><td class=\"w\">significantly</td><td class=\"m\">상당히, 의미심장하게</td></tr><tr><td class=\"w\">annoying</td><td class=\"m\">짜증나는, 성가신</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일단 그들이 상황을 받아들이면,</span><span class=\"en\"><b><span class=\"grammar-hl\">Once they have accepted</span> the situation,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 마음 편히 생각하고</span><span class=\"en\"><b>they take it easy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포기할 가능성이 더 적어진다.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">are less likely to give up</span>.</b></span></div></div><div class=\"lec-sent-ko\">일단 그들이 상황을 받아들이면 그들은 맘 편히 생각하고 포기를 덜 하게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 5번 문장의 결과를 뒷받침하며, 상황에 대한 심리적 수용이 어떻게 행동의 지속성을 이끌어내는지를 결론짓습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Once they have accepted (분사구문(축약)): 접속사 Once + 주어(they) + 동사(have accepted)로 이루어진 부사절이다.</div><div class=\"lec-gr-item\">are less likely to give up (to부정사): 형용사 likely를 수식하는 부사적 용법(형용사 수식)의 to부정사이다.</div><div class=\"lec-gr-item\">give up (관용표현): &#39;포기하다&#39;라는 의미의 이어동사(phrasal verb)이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take it easy</td><td class=\"m\">느긋하게 생각하다, 서두르지 않다</td></tr><tr><td class=\"w\">give up</td><td class=\"m\">포기하다, 단념하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들은 본능적으로 기다리는 것을 괴로워하며 짜증을 느낀다.</li><li>과학적 연구에 따르면, 사람들에게는 3분이라는 심리적 대기 한계 시간이 존재한다.</li><li>3분 안에 기다림을 수용하기로 마음먹으면 줄 서기에 대한 스트레스가 크게 줄어든다.</li><li>상황을 체념하고 받아들이는 심리적 변화가 중도 포기를 막는 핵심 요인이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People initially feel extreme impatience when waiting in line, yet they experience significantly less annoyance once they accept the situation after three minutes.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 줄을 서서 기다릴 때 초기에 극심한 조바심을 느끼지만, 3분 후 상황을 받아들이면 짜증을 훨씬 덜 느끼게 된다.</div></div></div>"],"segs":[[{"audio":"./review-3_audio/1.mp3","hl":null}],[{"audio":"./review-3_audio/2.mp3","hl":null}],[{"audio":"./review-3_audio/3.mp3","hl":null},{"audio":"./review-3_audio/4.mp3",
