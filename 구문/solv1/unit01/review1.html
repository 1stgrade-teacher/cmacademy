D/PP50KUdXfe11fZ6fc7NX/AOAx2d3o3Zu6338+772QoOR0P4j/AD1/pz04Pb/9f+f8jvRkcDjk8e/sP/rdfwGDJGcfTrj/AD+tHNHpJb90/wCv036C5W3on8/W3kvv00b6CnPvxx6dP8P8KSl3DrkY7fMOD3x6flxkexpu5ScZH5r/ACzx+PHv3o5o9/6/p/Lrs7Fn2f3P+uo4+3b6evt/9f8AKmsflPsCRxnBx/8AWH5cUZHqOfcce/6Y71CcK5YnPA9+COAR0IzjIxyQcHOCE5J2Wr1T630avpfrfva/UqMbvW+11o9dVp5b799OqP/Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Boost Your Brain: The Optimal Way to Nap for Better Performance<small>당신의 두뇌를 깨워라: 더 나은 성과를 위한 최적의 낮잠 방법</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 공부나 업무를 하다가 잠깐 눈을 붙이는 것을 단순히 시간을 낭비하는 것이라 생각하기 쉽지만, 사실 뇌과학적으로 낮잠은 기억 공고화(Memory Consolidation)라는 아주 중요한 과정을 돕습니다. 이는 학습한 내용을 뇌의 단기 기억 저장소에서 장기 기억 저장소로 옮겨 우리 것으로 만드는 작업인데, 마치 컴퓨터가 데이터를 저장하고 최적화하는 과정과 비슷하죠. 특히 적절한 낮잠은 인지 기능(Cognitive Function)을 회복시켜 멍한 머리를 맑게 해주는데, 이는 밤새워 공부하는 것보다 뇌의 효율을 극적으로 높여주는 효과가 있습니다. 다만, 너무 길게 자면 수면 관성(Sleep Inertia)이라는 현상 때문에 잠에서 깬 뒤에도 몸이 무겁고 정신이 몽롱해질 수 있어서 주의가 필요합니다. 따라서 짧고 효율적인 휴식을 통해 뇌의 성능을 최상으로 유지하는 전략적 쉼이 무엇보다 중요하답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01일반적인 오해</div><ul><li>많은 학생은 과제를 끝내기 위해 피로를 참고 깨어 있으려 하지만, 이는 좋은 전략이 아니다.</li><li>피로를 견디며 공부하는 습관의 비효율성</li><li>수면 부족 상태에서의 학습 지속은 역효과</li><li>핵심 키워드: 수면(sleeping), 효율성(efficiency)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02낮잠의 이점</div><ul><li>연구에 따르면 적절한 낮잠은 뇌의 기능을 향상해 업무와 의사결정 효율을 크게 높여준다.</li><li>업무 효율(work efficiency) 30% 이상 증가</li><li>정확한 의사결정 능력(decision-making ability) 50% 향상</li><li>두뇌의 효율성(brain efficiency)을 극대화함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03올바른 낮잠 전략</div><ul><li>낮잠의 효과를 제대로 보기 위해서는 시간 조절이 필수적이다.</li><li>적정 낮잠 시간: 45분 이내(limit)</li><li>45분 이상 수면 시 깊은 잠(deep sleep)에 빠질 위험</li><li>기상 후 겪을 수 있는 어려움 방지</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sound</td><td class=\"m\">~하게 들리다, 소리가 나다</td></tr><tr><td class=\"w\">a number of</td><td class=\"m\">많은, 몇몇의</td></tr><tr><td class=\"w\">suggest</td><td class=\"m\">암시하다, 제안하다, 시사하다</td></tr><tr><td class=\"w\">fall asleep</td><td class=\"m\">잠들다</td></tr><tr><td class=\"w\">whenever</td><td class=\"m\">conj.</td></tr><tr><td class=\"w\">according to</td><td class=\"m\">~에 따르면</td></tr><tr><td class=\"w\">take a nap</td><td class=\"m\">낮잠을 자다</td></tr><tr><td class=\"w\">efficient</td><td class=\"m\">효율적인, 유능한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">efficiency</td><td class=\"m\">효율성, 능률</td></tr><tr><td class=\"w\">raise</td><td class=\"m\">높이다, 들어 올리다, 기르다</td></tr><tr><td class=\"w\">decision</td><td class=\"m\">결정, 판단</td></tr><tr><td class=\"w\">limit</td><td class=\"m\">제한하다, 한정하다</td></tr><tr><td class=\"w\">be likely to</td><td class=\"m\">~할 가능성이 있다</td></tr><tr><td class=\"w\">have a hard time</td><td class=\"m\">~하는 데 어려움을 겪다</td></tr><tr><td class=\"w\">wake back up</td><td class=\"m\">다시 깨어나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이상하게 들릴지도 모른다,</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span> may sound strange,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 수면은</span><span class=\"en\"><b>but sleeping</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로 당신을 더 똑똑하게 만들 수 있다.</span><span class=\"en\"><b>can actually <span class=\"grammar-hl\">make you smarter</span>.</b></span></div></div><div class=\"lec-sent-ko\">이상하게 들릴지 모르지만, 수면은 실제로 당신을 더 똑똑하게 만들 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> It may sound strange는 독자가 잠을 자는 행위를 공부를 방해하는 요소로 생각할 것이라는 점을 미리 짐작하고 글을 시작하는 것입니다. 뒤에 이어질 잠의 긍정적인 효과를 강조하기 위해 먼저 일반적인 통념을 언급하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It (가주어): 진주어: It은 가주어이며, 뒤의 &#39;sleeping can actually make you smarter&#39;가 진주어 역할을 하여 문장의 주어 자리에 위치한다.</div><div class=\"lec-gr-item\">make you smarter 5형식(SVOC) 구조: make(사역동사) + 목적어(you) + 목적격보어(smarter, 형용사) 구조로, 목적어의 상태를 보충 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sound</td><td class=\"m\">~하게 들리다, 소리가 나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 학생들은</span><span class=\"en\"><b>Many students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">깨어 있는다</span><span class=\"en\"><b>stay awake</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">숙제가 끝날 때까지는</span><span class=\"en\"><b>until their homework <span class=\"grammar-hl\">is finished</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비록 그들이 매우 피곤할지라도</span><span class=\"en\"><b>even though they are very tired.</b></span></div></div><div class=\"lec-sent-ko\">많은 학생들이 그들이 매우 피곤함에도 불구하고 숙제가 끝날 때까지는 잠자지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;잠이 똑똑하게 만든다&#39;는 주장과 대비되는 학생들의 실제 행동을 제시합니다. 잠을 줄여가며 공부에 매진하는 흔한 상황을 보여줌으로써 뒤에서 이를 반박하기 위한 배경을 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is finished (수동태): be동사(is)+p.p.(finished) 구조. finish는 타동사인데 목적어가 없어서 수동구조 is finished 형태로 쓴다. 기본구조: finish + O (O를 끝내다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 많은 연구들은</span><span class=\"en\"><b>But a number of studies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시사했다</span><span class=\"en\"><b>have <span class=\"grammar-hl\">suggested</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것이 좋은 생각이 아니라는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> this is not a good idea.</b></span></div></div><div class=\"lec-sent-ko\">그러나 많은 연구들은 이것이 좋은 생각이 아니라는 것을 시사한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장에서 기술한 학생들의 학습 습관이 과학적으로는 올바르지 않다는 점을 지적하며 글의 논지를 본격적으로 전개합니다. 전문가들의 연구 결과를 근거로 앞선 행동을 부정하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">suggested that (명사절): that절이 suggested라는 타동사의 목적어 역할을 하는 명사절 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">a number of</td><td class=\"m\">많은, 몇몇의</td></tr><tr><td class=\"w\">suggest</td><td class=\"m\">암시하다, 제안하다, 시사하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신에,</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들은 잠자리에 들어야 한다</span><span class=\"en\"><b>students should fall asleep</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피곤을 느낄 때마다,</span><span class=\"en\"><b><span class=\"grammar-hl\">whenever</span> they are tired,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 낮 동안에도</span><span class=\"en\"><b>even during the day.</b></span></div></div><div class=\"lec-sent-ko\">오히려 학생들은 피곤을 느낄 때마다, 심지어 낮에도 자야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장의 반박에 뒤이어, 구체적으로 학생들에게 권장하는 행동 지침을 제시합니다. 피로를 참는 대신 적절한 휴식을 취하는 것이 학습에 더 도움이 된다는 대안을 명확히 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">whenever (관계부사): 부사절을 이끄는 복합관계부사로 &#39;~할 때는 언제든지&#39;라는 의미를 가지며, 시간의 부사절 내에서 주어+동사의 완전한 절을 수반한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fall asleep</td><td class=\"m\">잠들다</td></tr><tr><td class=\"w\">whenever</td><td class=\"m\">conj.</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">연구들에 따르면,</span><span class=\"en\"><b>According to the studies,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">낮잠을 자는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">taking a nap</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 두뇌를 만든다</span><span class=\"en\"><b><span class=\"grammar-hl\">makes your brain</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더욱 효율적으로</span><span class=\"en\"><b><span class=\"grammar-hl\">more efficient</span>.</b></span></div></div><div class=\"lec-sent-ko\">연구들에 따르면 낮잠을 자는 것은 당신의 두뇌를 더욱 효율적으로 만들어 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장에서 제안한 &#39;낮잠 자기&#39;가 왜 효과적인지 그 과학적 이유를 설명합니다. 뇌의 작동 방식이 휴식을 통해 개선된다는 점을 언급하며 글의 핵심 근거를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taking a nap (동명사): 문장에서 주어 역할을 하는 명사적 표현으로 &#39;낮잠을 자는 것&#39;이라는 행위를 의미한다.</div><div class=\"lec-gr-item\">makes your brain more efficient 5형식(SVOC) 구조: make + 목적어(your brain) + 목적격보어(more efficient, 형용사)로, 목적어의 상태를 설명하는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">according to</td><td class=\"m\">~에 따르면</td></tr><tr><td class=\"w\">efficient</td><td class=\"m\">효율적인, 유능한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">낮잠은</span><span class=\"en\"><b>Napping</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 업무 효율성을 높여준다</span><span class=\"en\"><b>increases your work efficiency</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">30% 이상</span><span class=\"en\"><b>by more than 30%</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 당신의 능력을 올려준다</span><span class=\"en\"><b>and raises your ability</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">옳은 결정을 내릴 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">to make</span> correct decisions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">50% 정도만큼</span><span class=\"en\"><b>by about 50%.</b></span></div></div><div class=\"lec-sent-ko\">낮잠은 당신의 업무 효율성을 30% 이상 높여주고 옳은 결정을 내릴 수 있는 능력을 50% 정도나 증진시켜 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 5번 문장에서 언급한 &#39;뇌가 효율적이 된다&#39;는 추상적인 결과를 구체적인 수치로 증명합니다. 낮잠이 구체적으로 어떤 면에서 학습에 도움을 주는지를 정량적으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to make (to부정사): 앞의 명사(ability)를 뒤에서 꾸며주는 형용사적 용법으로, &#39;결정을 내릴 수 있는 능력&#39;이라는 의미를 형성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">efficiency</td><td class=\"m\">효율성, 능률</td></tr><tr><td class=\"w\">raise</td><td class=\"m\">높이다, 들어 올리다, 기르다</td></tr><tr><td class=\"w\">decision</td><td class=\"m\">결정, 판단</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 낮잠을 제한해야만 한다</span><span class=\"en\"><b>you <span class=\"grammar-hl\">should limit</span> your naps</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">45분으로</span><span class=\"en\"><b>to 45 minutes.</b></span></div></div><div class=\"lec-sent-ko\">하지만 당신은 낮잠을 45분으로 제한해야만 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 낮잠의 긍정적인 면을 강조한 후, 무작정 많이 자는 것이 좋다는 오해를 바로잡기 위해 주의사항을 제시합니다. 효과적인 휴식을 위한 구체적인 가이드라인을 제공하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">should limit (조동사): should를 사용하여 충고나 권고의 의미를 나타내며, 뒤에 동사원형 limit을 취한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">limit</td><td class=\"m\">제한하다, 한정하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만일 당신이 낮잠을 잔다면</span><span class=\"en\"><b><span class=\"grammar-hl\">If</span> you nap</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그보다 더 길게,</span><span class=\"en\"><b>for longer than that,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 깊은 잠에 빠질 가능성이 높다</span><span class=\"en\"><b>you <span class=\"grammar-hl\">are likely to fall</span> into a deep sleep</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 어려움을 겪을 것이다</span><span class=\"en\"><b>and have a hard time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다시 깨어나는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">waking</span> back up.</b></span></div></div><div class=\"lec-sent-ko\">만일 그보다 더 오래 자면, 아마도 깊은 잠에 빠져, 깨어나는 데 어려움을 겪게 될 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 7번 문장에서 왜 시간을 45분으로 제한해야 하는지에 대한 이유를 설명합니다. 무분별한 휴식이 오히려 일상 복귀에 방해가 될 수 있음을 경고하며 논리적으로 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If (가정법(조건절)): if절을 통해 미래나 현재의 가상적 상황을 설정하는 조건 부사절이다.</div><div class=\"lec-gr-item\">are likely to fall (관용표현): be likely to + 동사원형 (~할 가능성이 있다) 구조이다.</div><div class=\"lec-gr-item\">to fall into a deep sleep (to부정사): be likely의 보어 역할을 하는 형용사적 성격의 to부정사 구조이다.</div><div class=\"lec-gr-item\">waking (동명사): 전치사 up의 목적어 역할을 하는 동명사 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">have a hard time</td><td class=\"m\">~하는 데 어려움을 겪다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>공부를 위해 잠을 줄이는 것은 오히려 학습에 비효율적이다.</li><li>낮잠은 뇌의 효율성과 판단력을 눈에 띄게 높여준다.</li><li>단, 낮잠은 깨어나는 어려움을 방지하기 위해 45분 이내로 자야 한다.</li><li>피로를 억지로 참기보다 적절한 짧은 휴식을 취하는 것이 공부에 더 유리하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Napping boosts work efficiency and decision-making skills, but you should keep it under 45 minutes to avoid falling into a deep sleep.</div>\n              <div class=\"lec-final-sum-ko\">낮잠은 업무 효율성과 의사결정 능력을 높여주지만, 깊은 잠에 빠지는 것을 방지하기 위해 45분 이내로 유지해야 한다.</div></div></div>"],"segs":[[{"audio":"./review-1_audio/1.mp3","hl":null}],[{"audio":"./review-1_audio/2.mp3","hl":null}],[{"audio":"./review-1_audio/3.mp3","hl":null},{"audio":"./review-1_audio/4.mp3","hl":"stage-0"},{"audio":"./review-1_audio/5.mp3","hl":"stage-1"},{"audio":"./review-1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./review-1_audio/7.mp3","hl":null}],[{"audio":"./review-1_audio/8.mp3","hl":"main"},{"audio":"./review-1_audio/9.mp3","hl":"meaning"},{"audio":"./review-1_audio/10.mp3","hl":"grammar"}],[{"audio":"./review-1_audio/11.mp3","hl":"main"},{"audio":"./review-1_audio/12.
