운 자극에 노출되는 긍정적 스트레스(Eustress)가 반드시 필요하다고 강조합니다. 즉, 스스로 설정한 한계라는 심리적 장벽(Psychological Barrier)을 깨뜨리는 것이 곧 자신의 잠재력을 확장하는 열쇠가 되는 셈이죠. 여러분도 일상에서 마주하는 작은 도전들을 거부하기보다, 스스로를 새로운 가능성으로 안내하는 기회로 바라보는 연습을 시작해 보시는 건 어떨까요?</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01한계 설정의 현실</div><ul><li>많은 사람들이 자신의 삶을 좁은 틀 안에 가두고 스스로를 제한한다.</li><li>안전지대(comfort zone) 내에 머물려는 경향</li><li>대중 연설이나 해외 유학 등 새로운 기회를 회피함</li><li>핵심 키워드: 안전지대(comfort zone)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02고착화된 자아상</div><ul><li>사람들은 스스로 규정한 한계 안에 갇혀 외부의 변화 요구에 방어적 태도를 보인다.</li><li>자신의 능력에 대한 편협한 개념(conception) 형성</li><li>한계를 넘으라는 요구에 분노(angry)와 거부감 표출</li><li>핵심 키워드: 한계(limits)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03새로운 태도의 필요성</div><ul><li>자신의 한계를 고정하는 것은 인생에서 매우 큰 실수임을 인식해야 한다.</li><li>기존의 경직된 사고방식은 큰 오류(huge mistake)임</li><li>틀을 깨고 나오는 능동적인 변화가 요구됨</li><li>핵심 키워드: 태도(attitude)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04긍정적 도전과 수용</div><ul><li>삶의 모든 순간에 다가오는 기회를 적극적으로 받아들이는 자세를 가져야 한다.</li><li>모든 상황에서 도전을 환영함(welcome new challenges)</li><li>가능한 한 자주 &#39;예(yes)&#39;라고 대답하는 습관</li><li>핵심 키워드: 도전(challenges)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">limit</td><td class=\"m\">제한하다, 한정하다</td></tr><tr><td class=\"w\">comfort zone</td><td class=\"m\">안전지대, 안락한 환경</td></tr><tr><td class=\"w\">reject</td><td class=\"m\">거부하다, 거절하다</td></tr><tr><td class=\"w\">adventurous</td><td class=\"m\">모험을 즐기는, 모험심이 강한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stuck</td><td class=\"m\">갇힌, 꼼짝 못 하는</td></tr><tr><td class=\"w\">conception</td><td class=\"m\">구상, 이해</td></tr><tr><td class=\"w\">step beyond</td><td class=\"m\">~을 넘어서다, ~의 범위를 벗어나다</td></tr><tr><td class=\"w\">at every turn</td><td class=\"m\">모든 경우에, 항상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리 모두는 만난 적이 있다</span><span class=\"en\"><b>We’ve all met people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을</span><span class=\"en\"><b><span class=\"grammar-hl\">who limit their lives</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능한 한 가장 좁은 한계 안에서 자신의 삶을 한정시키는</span><span class=\"en\"><b><span class=\"grammar-hl\">in the narrowest possible terms</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리 모두는 가능한 한 좁은 한계 안에서 자신의 삶을 한정시키는 사람들을 만난 적이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이어질 글의 도입부로서, 스스로의 가능성을 스스로 차단하며 사는 사람들의 존재를 제시합니다. 이는 앞으로 글쓴이가 비판하고자 하는 &#39;안전 지향적 태도&#39;를 가진 대상을 규정하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who limit their lives in the narrowest possible terms (관계대명사): who는 선행사 people을 수식하는 주격 관계대명사이며, 뒤에 주어가 빠진 불완전한 절(limit their lives...)이 이어집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">limit</td><td class=\"m\">제한하다, 한정하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 머물러 있다</span><span class=\"en\"><b>They stay</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제한되고 편안한 환경에</span><span class=\"en\"><b>in a <span class=\"grammar-hl\">limited</span> comfort zone.</b></span></div></div><div class=\"lec-sent-ko\">그들은 제한되고 편안한 환경에 머물러 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급된 사람들이 왜 삶을 좁게 만드는지를 설명합니다. 익숙하고 두려움이 없는 공간 안에서만 안주하려는 이들의 심리적 배경을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">limited (과거분사(형용사)): limited가 comfort zone을 수식하며, &#39;제한된&#39;이라는 수동/완료의 의미를 전달합니다. N + p.p. 형태는 &#39;p.p.된 N&#39;으로 해석합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">limit</td><td class=\"m\">제한하다, 한정하다</td></tr><tr><td class=\"w\">comfort zone</td><td class=\"m\">안전지대, 안락한 환경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들은 기회를 피한다</span><span class=\"en\"><b>Some people avoid <span class=\"grammar-hl\">the opportunity</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대중 앞에서 발표할</span><span class=\"en\"><b><span class=\"grammar-hl\">to make a public presentation</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 그들을 긴장시키기 때문에</span><span class=\"en\"><b>because it <span class=\"grammar-hl\">makes them nervous</span>.</b></span></div></div><div class=\"lec-sent-ko\">어떤 사람들은 그들을 긴장시킨다는 이유로 대중 앞에서 발표할 기회를 피한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람들이 구체적으로 어떤 상황에서 안전 지대를 선택하는지 보여 주는 예시입니다. 스스로의 잠재력을 발휘할 기회를 두려움 때문에 스스로 포기하는 구체적인 장면을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the opportunity to make a public presentation (to부정사): to make a public presentation이 앞의 명사 opportunity를 수식하는 형용사적 용법입니다.</div><div class=\"lec-gr-item\">makes them nervous 5형식(SVOC) 구조: make(사역동사류/변화동사)+목적어(them)+목적보어(형용사 nervous)의 구조로, 목적어를 보어한 상태로 만들다라는 의미입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들은 유학의 기회를 거부한다</span><span class=\"en\"><b>Others reject <span class=\"grammar-hl\">a chance to study abroad</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 스스로를 모험심이 있다고 생각하지 않기 때문에</span><span class=\"en\"><b>because they don’t consider themselves adventurous.</b></span></div></div><div class=\"lec-sent-ko\">또 다른 사람들은 자신을 도전적인 유형의 사람이 아니라고 생각하여 유학의 기회를 거부한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 이어 또 다른 사례를 제시합니다. 자신이 설정한 자아상(모험적이지 않은 사람) 안에 스스로를 가두어 성장의 기회를 발로 차는 경우를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a chance to study abroad (to부정사): to study abroad가 앞의 명사 chance를 수식하는 형용사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reject</td><td class=\"m\">거부하다, 거절하다</td></tr><tr><td class=\"w\">adventurous</td><td class=\"m\">모험을 즐기는, 모험심이 강한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 갇히게 된다</span><span class=\"en\"><b>People become <span class=\"grammar-hl\">stuck</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 자신만의 한계 개념 속에</span><span class=\"en\"><b>in their own conception of their limits,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그들은 화가 난다</span><span class=\"en\"><b>so they become angry</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 한계를 넘어서도록 요청받을 때</span><span class=\"en\"><b>when they <span class=\"grammar-hl\">are asked to step beyond them</span>.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 그들 자신만의 한계에 갇혀서, 그 한계를 넘어서도록 요청받을 때 분노하게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시한 사례들의 심리적 기제를 분석합니다. 스스로 정의한 한계를 객관적 사실로 착각하고 이를 흔드는 외부의 제안을 공격으로 받아들이는 인간의 경직된 심리를 꼬집습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stuck (과거분사(형용사)): become과 결합하여 주어의 상태를 설명하는 보어 역할을 합니다.</div><div class=\"lec-gr-item\">are asked to step beyond them (수동태): be동사(are)+p.p.(asked) 구조. ask는 타동사인데 목적어가 없어 수동구조 are asked 형태로 씁니다. 기본구조: ask + O + toV(5형식)에서 목적어(O)가 주어로 올라가 수동태가 되고, 목적보어였던 toV(to step)는 그대로 남습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">limit</td><td class=\"m\">제한하다, 한정하다</td></tr><tr><td class=\"w\">stuck</td><td class=\"m\">갇힌, 꼼짝 못 하는</td></tr><tr><td class=\"w\">conception</td><td class=\"m\">구상, 이해</td></tr><tr><td class=\"w\">step beyond</td><td class=\"m\">~을 넘어서다, ~의 범위를 벗어나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">삶에 대한 이러한 태도는</span><span class=\"en\"><b><span class=\"grammar-hl\">This attitude toward life,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b><span class=\"grammar-hl\">however,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 실수이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is a huge mistake.</span></b></span></div></div><div class=\"lec-sent-ko\">그러나 삶에 대한 이러한 태도는 큰 실수이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 내용을 바탕으로 글쓴이가 명확한 논평을 내놓는 전환점입니다. 스스로의 한계를 규정하고 기회를 차단하는 삶의 방식이 결과적으로 자신에게 손해를 끼친다는 점을 강력히 비판합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This attitude toward life, however, is a huge mistake. (관용표현): &#39;toward life&#39;는 &#39;~에 대한 삶의 태도&#39;를 나타내는 전치사구 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">새로운 도전을 환영해라</span><span class=\"en\"><b>Welcome new challenges</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매 순간마다</span><span class=\"en\"><b>at every turn,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예라고 말하면서</span><span class=\"en\"><b><span class=\"grammar-hl\">saying yes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능한 한 자주</span><span class=\"en\"><b>as often as possible.</b></span></div></div><div class=\"lec-sent-ko\">항상 새로운 도전을 환영해라 그리고 가능한 한 자주 그 도전을 받아들여라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론이자 실천적 제안입니다. 앞서 비판한 &#39;제한된 삶&#39;에서 벗어나기 위해, 모든 기회에 긍정적으로 반응하고 스스로의 한계를 확장해야 한다는 주장을 구체적인 행동 지침으로 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">saying yes (현재분사(분사구문)): 주절의 동작(Welcome...)에 이어지는 부수적인 동작을 나타냅니다. 접속사+주어+동사로 바꾸면 &#39;while you say yes&#39;와 같은 의미를 갖습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at every turn</td><td class=\"m\">모든 경우에, 항상</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들은 스스로의 한계를 규정하고 익숙한 안전 지대에만 머물려 한다.</li><li>이런 태도는 기회를 스스로 차단하고 성장을 방해하는 큰 잘못이다.</li><li>삶을 넓히기 위해서는 두려움을 극복하고 새로운 도전을 적극적으로 받아들여야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People often trap themselves within narrow self-imposed limits, but they should overcome this by actively embracing new challenges.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 종종 스스로 설정한 좁은 한계 안에 자신을 가두지만, 새로운 도전을 적극적으로 수용함으로써 이를 극복해야 한다.</div></div></div>"],"segs":[[{"audio":"./point02-3_audio/1.mp3","hl":null}],[{"audio":"./point02-3_audio/2.mp3","hl":null}],[{"audio":"./point02-3_audio/3.mp3","hl":null},{"audio":"./point02-3_audio/4.mp3","hl":"stage-0"},{"audio":"./point02-3_audio/5.mp3","hl":"stage-1"},{"audio":"./point02-3_audio/6.mp3","hl":"stage-2"},{"audio":"./point02-3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./point02-3_audio/8.mp3","hl":null}],[{"audio":"./point02-3_audio/9.mp3","hl":"main"},{"audio":"./point02-3_audio/10.mp3","hl":"meaning"},{"audio":"./point02-3_audio/11.mp3","hl":"grammar"}],[{"audio":"./point02-3_audio/12.mp3","hl":"main"},{"audio":"./point02-3_audio/13.mp3","hl":"meaning"},{"audio":"./point02-3_audio/14.mp3","hl":"grammar"}],[{"audio":"./point02-3_audio/15.mp3","hl":"main"},{"audio":"./point02-3_audio/16.mp3","hl":"meaning"},{"audio":"./point02-3_audio/17.mp3","hl":"grammar"}],[{"audio":"./point02-3_audio/18.mp3","hl":"main"},{"audio":"./point02-3_audio/19.mp3","hl":"meaning"},{"audio":"./point02-3_audio/20.mp3","hl":"grammar"}],[{"audio":"./point02-3_audio/21.mp3","hl":"main"},{"audio":"./point02-3_audio/22.mp3","hl":"meaning"},{"audio":"./point02-3_audio/23.mp3","hl":"grammar"}],[{"audio":"./point02-3_audio/24.mp3","hl":"main"},{"audio":"./point02-3_audio/25.mp3","hl":"meaning"},{"audio":"./point02-3_audio/26.mp3","hl":"grammar"}],[{"audio":"./point02-3_audio/27.mp3","hl":"main"},{"audio":"./point02-3_audio/28.mp3","hl":"meaning"},{"audio":"./point02-3_audio/29.mp3","hl":"grammar"}],[{"audio":"./point02-3_audio/30.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].
