<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 10강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 10강 적용독해01","audioDir":"10-01_audio","preview":false,"count":49,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">10강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>The Misleading Names of Iceland and Greenland\u003c/h1>\u003ch2>아이슬란드와 그린란드의 오해를 부르는 이름들\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>아이슬란드는 이름과 달리 얼음이 적고 온천이 많으며, 그린란드는 이름과 달리 대부분 얼음으로 덮여 있다. 두 이름은 바이킹들이 각각 \u003cb class=\"key\">모욕\u003c/b>과 \u003cb class=\"key\">사람들을 \u003c/b>\u003cb class=\"key\">끌어들이려는 \u003c/b>\u003cb class=\"key\">속임수\u003c/b>로 붙인 결과이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The names Iceland and Greenland are misleading because Vikings gave them as an insult and as a trick to attract people, not because of their actual environments.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 아이슬란드와 그린란드의 이름에 숨은 재미있는 이야기를 함께 읽어 볼 거예요. 이 글은 이름과 실제 환경이 왜 반대로 느껴지는지, 두 섬의 이름 유래를 통해 보여 주고 있어요. 핵심은 이름이 환경을 그대로 설명하는 것이 아니라 사람의 감정이나 의도에 따라 붙을 수 있다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">아이슬란드는 북대서양의 섬나라로, 이름과 달리 \u003cb class=\"key\">멕시코 \u003c/b>\u003cb class=\"key\">만류\u003c/b>(Gulf Stream)와 \u003cb class=\"key\">천연 \u003c/b>\u003cb class=\"key\">온천\u003c/b>(hot spring)의 영향을 받아 생각보다 따뜻하다. 반면 그린란드는 세계에서 가장 큰 섬으로, 이름과 달리 \u003cb class=\"key\">빙상\u003c/b>(ice sheet)이 대부분을 덮고 있다. \u003cb class=\"key\">바이킹\u003c/b>(Viking)은 북유럽에서 활동한 항해·약탈 집단으로, 새로운 땅을 발견하고 이름을 붙이는 일이 많았다. Erik the Red는 아이슬란드에서 추방된 뒤 그린란드를 발견했고, 사람들을 끌어들이기 위해 좋은 이름을 붙였다. 이는 오늘날 상품 이름이나 광고 문구가 실제와 다르게 소비자의 기대를 만드는 \u003cb class=\"key\">브랜딩\u003c/b>(branding)과 비슷하다. 그래서 지명도 마케팅처럼 \u003cb class=\"key\">이름의 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>와 실제 환경이 다를 수 있다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 볼게요. 아이슬란드는 북대서양에 있는 섬나라인데, 이름과 달리 멕시코 만류라고 하는 Gulf Stream과 천연 온천의 영향을 받아서 생각보다 따뜻해요. 반대로 그린란드는 이름과 달리 빙상이 대부분을 덮고 있는 큰 섬이에요. 바이킹은 북유럽에서 항해와 약탈로 유명했던 집단이고, 새로운 땅을 발견하면 자기 방식으로 이름을 붙이곤 했어요. Erik the Red도 그린란드를 발견한 뒤 사람들을 끌어들이려고 좋은 이름을 붙였죠. 이건 오늘날 브랜딩이나 광고 문구가 실제보다 좋은 이미지를 심어 주는 것과 비슷해요. 그래서 지명도 이름의 이미지와 실제 환경이 다를 수 있다는 점을 기억하면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>아이슬란드 통념\u003csmall>통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>사람들은 아이슬란드 하면 얼음으로 덮인 아주 추운 곳을 \u003cb class=\"key\">상상\u003c/b>한다. 하지만 글은 곧바로 그것이 \u003cb class=\"key\">사실\u003c/b>이 아니라고 못 박는다. 독자의 일반적 기대를 세운 뒤 \u003cb class=\"key\">반박\u003c/b>하는 출발점이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>따뜻한 실제\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>아이슬란드는 아주 먼 북쪽에 있지만 \u003cb class=\"key\">멕시코 \u003c/b>\u003cb class=\"key\">만류\u003c/b>와 천연 온천으로 데워진다. 실제로 얼음이 거의 없어서 오히려 이름의 이유가 궁금해진다. 그래서 왜 아이슬란드인가라는 \u003cb class=\"key\">질문\u003c/b>이 자연스럽게 제기된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>모욕의 이름\u003csmall>예시 · 문장 5\u003c/small>\u003c/h4>\u003cp>한 바이킹 탐험가가 섬을 싫어해서 \u003cb class=\"key\">모욕\u003c/b>의 의미로 아이슬란드라고 불렀다. 즉 이름은 환경을 설명한 것이 아니라 당시 사람의 \u003cb class=\"key\">감정\u003c/b>을 반영한다. 아이슬란드라는 이름의 \u003cb class=\"key\">유래\u003c/b>가 밝혀지는 부분이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>그린란드 반전\u003csmall>대조 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>그린란드는 초목으로 덮인 땅을 떠올리게 하지만 실제로는 대부분 얼음으로 덮여 있다. 이 섬의 이름은 또 다른 바이킹인 \u003cb class=\"key\">Erik \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">Red\u003c/b>가 지었다. 이름과 실제가 반대라는 \u003cb class=\"key\">대조\u003c/b>가 그린란드에서도 반복된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>속임수와 결과\u003csmall>결론 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>Erik the Red는 아이슬란드에서 사람을 죽인 뒤 섬에서 쫓겨났다. 항해 중 얼음으로 덮인 거친 땅을 발견했지만 사람들을 끌어들이기 위해 \u003cb class=\"key\">그린란드\u003c/b>라고 이름 지었다. 그의 \u003cb class=\"key\">속임수\u003c/b>는 적중해서 많은 바이킹이 이주했다. 두 이름 모두 실제보다 \u003cb class=\"key\">이미지\u003c/b>를 앞세운 결과임을 보여 준다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나누어 볼게요.","hl":null},{"n":4,"text":"첫 단계는 아이슬란드에 대한 통념이에요. 사람들은 아이슬란드 하면 얼음으로 덮인 아주 추운 곳을 상상하죠. 그런데 글은 바로 다음에 그것이 사실이 아니라고 말해요. 이렇게 일반적인 기대를 세운 뒤 반박하면서 글의 흥미가 시작돼요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 실제 환경을 설명해요. 아이슬란드는 아주 먼 북쪽에 있지만 멕시코 만류와 천연 온천으로 데워진다고 하죠. 실제로 얼음이 거의 없어서 오히려 왜 아이슬란드라고 부르는지 질문이 생겨요. 이 질문이 다음 이름 유래 이야기로 이어져요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 아이슬란드 이름의 유래가 나와요. 한 바이킹 탐험가가 그 섬을 좋아하지 않아서 모욕의 의미로 아이슬란드라고 불렀대요. 즉 이름은 환경 설명이 아니라 당시 사람의 감정이 반영된 결과예요. 그래서 이름의 유래를 알면 실제와 왜 다른지 이해할 수 있어요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 그린란드로 시선을 돌려요. 그린란드는 초목으로 덮인 땅을 떠올리게 하지만 실제로는 대부분 얼음으로 덮여 있죠. 이 섬의 이름은 또 다른 바이킹인 Erik the Red가 지었어요. 이름과 실제가 반대라는 대조가 그린란드에서도 반복되는 거예요.","hl":"f3"},{"n":8,"text":"다섯 번째 단계에서는 Erik the Red의 사건과 결과가 이어져요. 그는 아이슬란드에서 사람을 죽인 뒤 섬에서 쫓겨났고, 항해 중 얼음으로 덮인 거친 땅을 발견했어요. 그런데 사람들을 끌어들이려고 그곳을 그린란드라고 이름 지었죠. 결국 그의 속임수는 적중했고, 이름이 실제보다 좋은 이미지를 만들어 냈다는 점을 보여 줘요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 아이슬란드와 그린란드의 이름과 실제 환경을 \u003cb class=\"key\">비교·대조\u003c/b>한다. 처음에는 아이슬란드에 대한 통념을 뒤집고, 이어 그린란드의 반대 사례를 제시한다. 두 사례를 모두 설명한 뒤 마지막 문장에서 Erik의 속임수가 성공했다는 결과로 마무리하므로 주제는 글 끝에서 드러나는 \u003cb class=\"key\">미괄식\u003c/b>이다. 따라서 중심 내용은 이름이 실제 환경과 다를 수 있다는 점이며, 이를 함축하는 마지막 문장을 \u003cb class=\"key\">주제문\u003c/b>으로 본다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>통념 반박\u003c/span>\u003cb>Although (3)\u003c/b>\u003cspan>양보·대조\u003c/span>\u003cb>In fact (4)\u003c/b>\u003cspan>사실 강조\u003c/span>\u003cb>on the other hand (6)\u003c/b>\u003cspan>대조 전환\u003c/span>\u003cb>however (7)\u003c/b>\u003cspan>반전\u003c/span>\u003cb>But (11)\u003c/b>\u003cspan>의도 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a very cold place covered with ice\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">little ice at all\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a land covered with plants\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">most of Greenland is covered with ice\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a terrible place covered with ice\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">His trick worked well\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Iceland\u003c/th>\u003cth>Greenland\u003c/th>\u003c/tr>\u003ctr>\u003ctd>이름: 얼음의 나라\u003c/td>\u003ctd>이름: 초록의 땅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>실제: 얼음이 거의 없고 온천이 많음\u003c/td>\u003ctd>실제: 대부분 얼음으로 덮인 거친 땅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>이름의 의도: 모욕\u003c/td>\u003ctd>이름의 의도: 사람을 끌어들이기 위한 속임수\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 비교와 대조예요. 아이슬란드와 그린란드의 이름, 그리고 실제 환경을 나란히 놓고 반대되는 점을 보여 주죠. 처음부터 주제를 직접 말하기보다 두 사례를 차례로 설명한 뒤 마지막에 결론을 암시하기 때문에 미괄식으로 볼 수 있어요. 그래서 중심 내용은 마지막 부분의 속임수 성공 이야기까지 읽고 나서야 또렷해져요.","hl":"ty"},{"n":10,"text":"신호어도 꼭 챙겨야 해요. 첫 번째 문장 뒤에 나오는 But은 앞의 통념을 반박하는 신호이고, Although는 양보와 대조를 만들어요. In fact는 실제 사실을 강조하고, on the other hand와 however는 아이슬란드에서 그린란드로, 또는 통념에서 실제로 시선을 돌리는 신호예요. 이런 신호어를 따라가면 이름과 실제의 대조가 한눈에 잡혀요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>think of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 생각하다, 떠올리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>covered with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~으로 덮인\u003c/span>\u003c/div>\u003cdiv>\u003cb>although\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~이지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>located\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위치한\u003c/span>\u003c/div>\u003cdiv>\u003cb>warm\u003c/b>\u003cem>동사\u003c/em>\u003cspan>데우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>natural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>천연의\u003c/span>\u003c/div>\u003cdiv>\u003cb>hot spring\u003c/b>\u003cem>명사\u003c/em>\u003cspan>온천\u003c/span>\u003c/div>\u003cdiv>\u003cb>in fact\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사실\u003c/span>\u003c/div>\u003cdiv>\u003cb>little\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거의 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>at all\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전혀\u003c/span>\u003c/div>\u003cdiv>\u003cb>call\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>explorer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>탐험가\u003c/span>\u003c/div>\u003cdiv>\u003cb>not like\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>싫어하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>insult\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모욕\u003c/span>\u003c/div>\u003cdiv>\u003cb>on the other hand\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>반면에\u003c/span>\u003c/div>\u003cdiv>\u003cb>make ~ think of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 생각하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>plant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>식물\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>name\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이름 짓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>kick off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>쫓아내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sail\u003c/b>\u003cem>동사\u003c/em>\u003cspan>항해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>terrible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>끔찍한, 거친\u003c/span>\u003c/div>\u003cdiv>\u003cb>attract\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끌어들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>trick\u003c/b>\u003cem>명사\u003c/em>\u003cspan>속임수\u003c/span>\u003c/div>\u003cdiv>\u003cb>work well\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잘 통하다, 효과가 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>move to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이주하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 몇 개 짚어 볼게요. covered with는 덮인이라는 뜻이고, little은 여기서 거의 없는으로 해석해야 해요. insult는 모욕, attract는 끌어들이다, trick은 속임수로 기억해 두면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">true\u003c/b>\u003cspan class=\"m\">사실인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accurate\u003c/span>\u003cspan class=\"s\">correct\u003c/span>\u003cspan class=\"s\">real\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">false\u003c/span>\u003cspan class=\"a\">untrue\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">warm\u003c/b>\u003cspan class=\"m\">데우다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">heat\u003c/span>\u003cspan class=\"s\">warm up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cool\u003c/span>\u003cspan class=\"a\">freeze\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">insult\u003c/b>\u003cspan class=\"m\">모욕\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">offense\u003c/span>\u003cspan class=\"s\">abuse\u003c/span>\u003cspan class=\"s\">humiliation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">compliment\u003c/span>\u003cspan class=\"a\">praise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">little\u003c/b>\u003cspan class=\"m\">거의 없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">scarce\u003c/span>\u003cspan class=\"s\">minimal\u003c/span>\u003cspan class=\"s\">few\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">much\u003c/span>\u003cspan class=\"a\">abundant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discover\u003c/b>\u003cspan class=\"m\">발견하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">find\u003c/span>\u003cspan class=\"s\">uncover\u003c/span>\u003cspan class=\"s\">detect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">attract\u003c/b>\u003cspan class=\"m\">끌어들이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">draw\u003c/span>\u003cspan class=\"s\">lure\u003c/span>\u003cspan class=\"s\">appeal to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">repel\u003c/span>\u003cspan class=\"a\">deter\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">terrible\u003c/b>\u003cspan class=\"m\">끔찍한, 거친\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">awful\u003c/span>\u003cspan class=\"s\">dreadful\u003c/span>\u003cspan class=\"s\">harsh\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wonderful\u003c/span>\u003cspan class=\"a\">pleasant\u003c/span>\u003cspan class=\"a\">mild\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">trick\u003c/b>\u003cspan class=\"m\">속임수\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deception\u003c/span>\u003cspan class=\"s\">hoax\u003c/span>\u003cspan class=\"s\">ruse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">truth\u003c/span>\u003cspan class=\"a\">honesty\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해요. true는 accurate나 correct와 가깝고 반대말은 false예요. warm은 heat와 비슷하고 반대말은 cool이나 freeze죠. insult는 offense와 가깝고 반대말은 compliment예요. attract는 draw나 lure와 비슷하며 반대말은 repel이고, trick은 deception이나 hoax로 바꿔 말할 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이슬란드라는 나라를 생각하면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">country \u003c/span>\u003cspan class=\"tgt\">Iceland\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 아마 상상할 것이다\u003c/span>\u003cspan class=\"en\">you probably imagine\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 추운 곳을\u003c/span>\u003cspan class=\"en\">a very cold place\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼음으로 덮인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">covered \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">ice\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이슬란드라는 나라를 생각하면, 여러분은 아마 얼음으로 덮인 아주 추운 곳을 상상할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아이슬란드 하면 떠오르는 \u003cb class=\"key\">일반적 \u003c/b>\u003cb class=\"key\">인상\u003c/b>을 제시하며, 뒤에서 그 인상이 틀렸음을 밝히기 위한 \u003cb class=\"key\">도입\u003c/b> 역할을 해요. covered with ice는 얼음으로 덮인이라는 뜻으로 추운 이미지를 강화하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : When + [주어 + 동사], [주어 + 동사] : \"아이슬란드라는 나라를 생각하면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 수식\u003c/span> : [명사] + [과거분사구] : \"얼음으로 덮인\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"When you think of the country Iceland, 아이슬란드라는 나라를 생각하면. you probably imagine, 여러분은 아마 상상할 것이다. a very cold place, 아주 추운 곳을. covered with ice, 얼음으로 덮인. 이 문장 전체를 해석하면, 아이슬란드라는 나라를 생각하면, 여러분은 아마 얼음으로 덮인 아주 추운 곳을 상상할 것이다.","hl":"m"},{"n":14,"text":"이 문장은 아이슬란드 하면 떠오르는 일반적 인상을 제시하면서 글의 도입을 열어 줘요. 얼음으로 덮인 아주 추운 곳이라는 이미지를 먼저 깔아 두고, 뒤에서 그게 사실이 아니라고 뒤집을 준비를 하는 거죠.","hl":"mn"},{"n":15,"text":"첫 번째 포인트는 접속사 when이에요. when은 뒤에 완전한 절을 이끌면서 시간을 나타내고, 주절의 상황이 시작되는 계기를 만들어 줍니다. 두 번째 포인트는 covered with ice예요. place를 뒤에서 꾸미는 과거분사구인데, cover가 타동사라서 얼음이 무언가를 덮는 게 아니라 장소가 얼음으로 덮이는 수동의 의미를 담고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 이것은\u003c/span>\u003cspan class=\"en\">But this\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실이 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">true\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그렇지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 일반적 인상을 \u003cb class=\"key\">부정\u003c/b>하며 글의 \u003cb class=\"key\">전환\u003c/b>을 만드는 문장이에요. 짧지만 독자의 예상을 뒤집어 다음 설명을 궁금하게 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 부정문\u003c/span> : [be동사] + not + [보어] : \"사실이 아니다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"But this, 하지만 이것은. is not true, 사실이 아니다. 이 문장 전체를 해석하면, 하지만 그렇지 않다.","hl":"m"},{"n":17,"text":"이 문장은 앞에서 말한 일반적 인상을 부정하면서 글의 전환을 만들어요. 아주 짧지만 독자가 품은 예상을 뒤집어서 다음 설명을 궁금하게 만드는 장치죠.","hl":"mn"},{"n":18,"text":"여기서는 be동사 부정문을 봐요. is 뒤에 not을 붙여서 사실이 아니라는 부정을 만들고 있죠. true는 주어 this의 상태를 설명하는 보어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 아이슬란드가 아주 먼 북쪽에 위치해 있지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although\u003c/span> Iceland \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">located\u003c/span> quite far north,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 데워진다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">warmed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멕시코 만류에 의해\u003c/span>\u003cspan class=\"en\">by the Gulf Stream\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 천연 온천으로\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">natural \u003c/span>\u003cspan class=\"tgt\">hot \u003c/span>\u003cspan class=\"tgt\">springs\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이슬란드는 아주 먼 북쪽에 있지만, 멕시코 만류와 천연 온천으로 데워진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아이슬란드가 춥다는 인상의 이유인 \u003cb class=\"key\">고위도\u003c/b>를 인정하면서도, \u003cb class=\"key\">멕시코 \u003c/b>\u003cb class=\"key\">만류\u003c/b>와 온천 덕분에 따뜻해진다는 반전을 제시해요. 앞 문장의 not true를 구체적으로 뒷받침하는 \u003cb class=\"key\">근거\u003c/b> 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사 although\u003c/span> : Although + [주어 + 동사], [주어 + 동사] : \"비록 ~이지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 be located\u003c/span> : [be동사] + located : \"위치해 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : [be동사] + [과거분사] + by + [행위자] : \"데워진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">소유격 대명사 its\u003c/span> : [its] + [명사] : \"그것의 천연 온천\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Although Iceland is located quite far north, 비록 아이슬란드가 아주 먼 북쪽에 위치해 있지만. it is warmed, 그것은 데워진다. by the Gulf Stream, 멕시코 만류에 의해. and its natural hot springs, 그리고 그 천연 온천으로. 이 문장 전체를 해석하면, 아이슬란드는 아주 먼 북쪽에 있지만, 멕시코 만류와 천연 온천으로 데워진다.","hl":"m"},{"n":20,"text":"이 문장은 아이슬란드가 춥다는 인상의 이유인 고위도를 인정해요. 그런데 멕시코 만류와 온천 덕분에 따뜻해진다고 말하면서 앞 문장의 not true를 구체적으로 뒷받침하는 근거를 제시하죠.","hl":"mn"},{"n":21,"text":"먼저 Although는 비록 이지만이라는 양보의 뜻으로 뒤 내용과 대조되는 정보를 먼저 제시해요. 두 번째로 is located는 locate가 타동사라서 아이슬란드가 스스로 위치시키는 것이 아니라 수동으로 위치해 있다는 뜻이 됩니다. 세 번째로 is warmed는 주어가 주변 환경에 의해 데워진다는 수동태이고, by 이하는 데우는 행위자를 나타내요. 마지막으로 its는 앞에 나온 Iceland를 가리키는 소유격이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실,\u003c/span>\u003cspan class=\"en\">In fact,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이슬란드에는 얼음이 거의 없다\u003c/span>\u003cspan class=\"en\">Iceland has \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">little \u003c/span>\u003cspan class=\"tgt\">ice \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 왜 그것은 아이슬란드라고 불리는가\u003c/span>\u003cspan class=\"en\">so why \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">Iceland\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실, 아이슬란드에는 얼음이 거의 없다. 그런데 왜 아이슬란드라고 불릴까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 아이슬란드가 따뜻해 얼음이 거의 없다고 했으니, 이름과 실제가 어긋난다는 \u003cb class=\"key\">의문\u003c/b>을 던지는 문장이에요. 글에서 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">제기\u003c/b> 역할을 하며, 뒤에 이어질 이름의 \u003cb class=\"key\">유래\u003c/b> 설명으로 화제를 넘겨줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정어 little + 강조어 at all\u003c/span> : [very little + 불가산명사 ice] + [at all(강조)] : \"얼음이 거의 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사가 이끄는 수동태 의문문(도치)\u003c/span> : [의문사 why] + [be동사 is] + [주어 it] + [과거분사 called] : \"왜 그것은 아이슬란드라고 불리는가\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"In fact, 사실. Iceland has very little ice at all, 아이슬란드에는 얼음이 거의 없다. so why is it called Iceland?, 그런데 왜 그것은 아이슬란드라고 불리는가. 이 문장 전체를 해석하면, 사실, 아이슬란드에는 얼음이 거의 없다. 그런데 왜 아이슬란드라고 불릴까?","hl":"m"},{"n":23,"text":"앞에서 아이슬란드가 따뜻하다고 했죠. 그런데 얼음이 거의 없는데 이름은 왜 아이슬란드인지 의문을 던지는 부분이에요. 글 전체에서 문제 제기를 하는 역할을 하고, 바로 뒤에 나오는 이름의 유래 설명으로 이어지는 다리 역할을 합니다.","hl":"mn"},{"n":24,"text":"먼저 very little ice at all을 보세요. little은 셀 수 없는 명사 앞에서 거의 없다는 부정의 뜻을 내고, at all이 그 뜻을 강조해요. 두 번째로 is it called를 보면 의문사 why가 앞으로 나오면서 be동사와 주어의 자리가 바뀐 의문문이고, 섬이 이름을 부르는 게 아니라 이름이 붙여지는 대상이라서 수동태를 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 바이킹 탐험가가\u003c/span>\u003cspan class=\"en\">A Viking explorer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 섬을 싫어하던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">island\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 아이슬란드라고 불렀다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">Iceland\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 나라에 대한 모욕의 의미로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">insult \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">country\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 섬을 싫어하던 한 바이킹 탐험가가 그 나라에 대한 모욕의 의미로 그것을 아이슬란드라고 불렀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아이슬란드라는 이름이 붙은 \u003cb class=\"key\">유래\u003c/b>를 알려주는 문장이에요. 좋아하지 않는 섬에 일부러 \u003cb class=\"key\">모욕\u003c/b>의 뜻을 담아 이름을 붙였다는 점이 핵심이고, 뒤에 나오는 그린란드 이야기와 \u003cb class=\"key\">대조\u003c/b>를 이루며 흥미를 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 A Viking explorer] + [who + 동사 didn't like + 목적어 the island] : \"그 섬을 싫어하던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">call + 목적어 + 목적격 보어(명사)\u003c/span> : call [목적어 it] + [목적격 보어 Iceland] : \"그것을 아이슬란드라고 불렀다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">as + 명사 (~로서, ~의 의미로)\u003c/span> : [as + 명사구 an insult to the country] : \"그 나라에 대한 모욕으로서\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"A Viking explorer, 한 바이킹 탐험가가. who didn't like the island, 그 섬을 싫어하던. called it Iceland, 그것을 아이슬란드라고 불렀다. as an insult to the country, 그 나라에 대한 모욕의 의미로. 이 문장 전체를 해석하면, 그 섬을 싫어하던 한 바이킹 탐험가가 그 나라에 대한 모욕의 의미로 그것을 아이슬란드라고 불렀다.","hl":"m"},{"n":26,"text":"아이슬란드라는 이름이 붙은 유래를 알려주는 문장이에요. 좋아하지 않는 섬에 일부러 모욕의 뜻을 담아 이름을 붙였다는 거죠. 이 이야기가 뒤에 나오는 그린란드 이야기와 대조를 이루면서 글의 재미를 만들어 줍니다.","hl":"mn"},{"n":27,"text":"첫째, who didn't like the island에서 who는 앞에 있는 A Viking explorer라는 사람 선행사를 꾸며 주는 주격 관계대명사예요. 둘째, called it Iceland는 call 다음에 목적어 it과 목적격 보어 Iceland가 오는 구조라서 그것을 아이슬란드라고 부르다로 해석해요. 셋째, as an insult to the country에서 as는 그 나라에 대한 모욕이라는 자격을 나타내는 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“그린란드”는\u003c/span>\u003cspan class=\"en\">&quot;Greenland,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면에,\u003c/span>\u003cspan class=\"en\">on the other hand,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 땅을 생각하게 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">land \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초목으로 덮인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">covered \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">plants\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반면에, “그린란드”는 초목으로 덮인 땅을 생각하게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> '그린란드'라는 이름이 주는 \u003cb class=\"key\">이미지\u003c/b>를 설명하는 문장이에요. 이름만 들으면 초목으로 덮인 땅을 떠올리게 된다는 거죠. 실제로는 얼음으로 덮여 있다는 뒤 문장의 \u003cb class=\"key\">반전\u003c/b>을 준비하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 동사원형\u003c/span> : make [목적어 you] + [목적격 보어 think (동사원형)] : \"당신이 땅을 생각하게 만든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구의 명사 후치 수식\u003c/span> : [명사 a land] + [과거분사 covered with plants] : \"초목으로 덮인 땅\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"\"Greenland,\", “그린란드”는. on the other hand, 반면에. makes you think of a land, 당신이 땅을 생각하게 만든다. covered with plants, 초목으로 덮인. 이 문장 전체를 해석하면, 반면에, “그린란드”는 초목으로 덮인 땅을 생각하게 한다.","hl":"m"},{"n":29,"text":"그린란드라는 이름이 주는 이미지를 말하는 문장이에요. 이름만 들으면 초목으로 덮인 땅을 떠올리게 된다는 거죠. 그런데 뒤에서 실제로는 얼음으로 덮여 있다는 반전이 일어나기 때문에, 여기서는 독자의 기대를 미리 만들어 두는 역할을 합니다.","hl":"mn"},{"n":30,"text":"먼저 makes you think of a land를 보면 사역동사 make가 목적어 you 뒤에 동사원형 think를 보어로 데려서 너로 하여금 떠올리게 만든다는 뜻을 만들어요. 두 번째로 a land covered with plants는 a land와 covered 사이에 which is가 생략된 형태로, 수동의 의미를 가진 과거분사 covered가 뒤에서 땅을 꾸며 주는 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그린란드의 대부분은,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Most \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Greenland\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">however,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">덮여 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">covered \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼음으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with\u003c/span> ice.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그린란드의 대부분은 얼음으로 덮여 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서는 그린란드가 초목으로 덮인 땅을 떠올리게 한다고 했죠. 그런데 however가 나오면서 \u003cb class=\"key\">반전\u003c/b>이 일어나요. 실제로는 그린란드의 대부분이 \u003cb class=\"key\">얼음\u003c/b>으로 덮여 있다는 사실을 밝히는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Most of + 명사의 주어 수 일치\u003c/span> : Most of + [명사] + [동사] : \"그린란드의 대부분은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속부사 however의 삽입\u003c/span> : [주어] +, however, + [동사] : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태 (be동사 + 과거분사 + with)\u003c/span> : [주어] + be동사 + [과거분사] + with + [재료·도구] : \"~으로 덮여 있다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Most of Greenland, 그린란드의 대부분은. however, 하지만. is covered, 덮여 있다. with ice, 얼음으로. 이 문장 전체를 해석하면, 하지만 그린란드의 대부분은 얼음으로 덮여 있다.","hl":"m"},{"n":32,"text":"앞에서는 그린란드가 초목으로 덮인 땅을 떠올리게 한다고 했죠. 그런데 however가 나오면서 반전이 일어나요. 실제로는 그린란드의 대부분이 얼음으로 덮여 있다는 사실을 밝히는 문장이에요.","hl":"mn"},{"n":33,"text":"첫 번째 포인트는 Most of Greenland인데요, Most of는 대부분이라는 뜻이고 뒤에 나라 이름처럼 불가산으로 보는 명사가 오면 동사는 단수로 받아요, 그래서 is가 온 거예요. 두 번째는 is covered with인데요, 주어가 스스로 덮는 게 아니라 덮이는 입장이니까 수동태를 쓴 거고요, 덮는 재료는 with로 연결해요. 그리고 however는 접속부사로서 앞 내용을 반전시키는 역할을 한다는 것도 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 이름이 지어졌다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">named \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Erik the Red에 의해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">by\u003c/span> Erik the Red,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 바이킹인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"tgt\">Viking\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 섬은 또 다른 바이킹인 Erik the Red 에 의해 이름이 지어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그린란드라는 \u003cb class=\"key\">이름\u003c/b>을 지은 사람이 Erik the Red임을 밝히는 문장이에요. 앞에서 그린란드가 얼음으로 덮여 있다고 했으니, 이름과 실제가 \u003cb class=\"key\">반대\u003c/b>라는 흐름이 자연스럽게 이어지죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be동사 + 과거분사 + by 행위자)\u003c/span> : [주어] + be동사 + [과거분사] + by + [행위자] : \"~에 의해 이름이 지어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">콤마 동격 (명사 + , + 명사구)\u003c/span> : [고유명사], [another + 명사] : \"또 다른 바이킹인\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"It was named, 그것은 이름이 지어졌다. by Erik the Red, Erik the Red에 의해. another Viking, 또 다른 바이킹인. 이 문장 전체를 해석하면, 이 섬은 또 다른 바이킹인 Erik the Red 에 의해 이름이 지어졌다.","hl":"m"},{"n":35,"text":"그린란드라는 이름을 지은 사람이 Erik the Red임을 밝히는 문장이에요. 앞에서 그린란드가 얼음으로 덮여 있다고 했으니, 이름과 실제가 반대라는 흐름이 자연스럽게 이어지죠.","hl":"mn"},{"n":36,"text":"첫 번째 포인트는 was named by인데요, 이름을 짓는 사람이 주어가 아니라 이름이 지어지는 대상이 주어 자리에 있으니 수동태를 쓴 거예요. 짓는 주체는 by로 붙여 준다는 것도 기억해 두세요. 두 번째는 another Viking인데요, 콤마 뒤에 놓여서 앞에 나온 Erik the Red가 어떤 사람인지 부연 설명해 주는 동격 표현이에요. another가 또 다른 하나라는 뜻으로 그 부류를 알려 준다고 이해하시면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 누군가를 죽인 후에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">killed \u003c/span>\u003cspan class=\"tgt\">someone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이슬란드에서\u003c/span>\u003cspan class=\"en\">on Iceland,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 쫓겨났다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">kicked \u003c/span>\u003cspan class=\"tgt\">off\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 섬에서\u003c/span>\u003cspan class=\"en\">the island.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이슬란드에서 사람을 죽인 후, 그는 그 섬에서 쫓겨났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Erik the Red가 왜 아이슬란드를 떠나게 됐는지 \u003cb class=\"key\">원인\u003c/b>을 알려 주는 문장이에요. 아이슬란드에서 사람을 죽인 사건 때문에 그는 그 섬에서 \u003cb class=\"key\">쫓겨났다\u003c/b>는 내용이죠. 이 사건이 뒤에 그린란드를 발견하게 되는 \u003cb class=\"key\">배경\u003c/b>이 된다는 점에서 글의 흐름을 이어 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 after가 이끄는 시간 부사절\u003c/span> : After + [주어] + [동사] ..., + [주절] : \"그가 누군가를 죽인 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사의 수동태 (be동사 + 과거분사 + 부사)\u003c/span> : [주어] + be동사 + [과거분사] + off : \"쫓겨났다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"After he killed someone, 그가 누군가를 죽인 후에. on Iceland, 아이슬란드에서. he was kicked off, 그는 쫓겨났다. the island, 그 섬에서. 이 문장 전체를 해석하면, 아이슬란드에서 사람을 죽인 후, 그는 그 섬에서 쫓겨났다.","hl":"m"},{"n":38,"text":"여기서는 Erik the Red가 왜 아이슬란드를 떠나게 됐는지 원인을 알려 주고 있어요. 아이슬란드에서 사람을 죽인 사건 때문에 그는 그 섬에서 쫓겨났다, 그런 내용이죠. 그리고 이 사건이 뒤에 그린란드를 발견하게 되는 배경이 된다는 점도 같이 기억해 두세요.","hl":"mn"},{"n":39,"text":"첫 번째는 After he killed someone인데요, 접속사 after가 이끄는 시간 부사절이에요. 주절보다 먼저 일어난 일이라서 과거 시제 killed를 쓴 거죠. 두 번째는 was kicked off인데요, 쫓아내다는 뜻의 구동사 kick off가 수동태가 되면서 be동사에 과거분사가 붙은 형태예요. 여기서 off는 떨어져 나간다는 느낌을 더해 준다고 보시면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고는 그는\u003c/span>\u003cspan class=\"en\">He then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항해를 계속해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">sailing\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 발견했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">discovered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거친 땅을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">terrible \u003c/span>\u003cspan class=\"tgt\">place \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼음으로 덮인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">covered \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">ice\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고는 항해를 계속해 얼음으로 덮인 거친 땅을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 쫓겨난 Erik이 항해하던 중 얼음으로 뒤덮인 '끔찍한 땅'을 발견한 장면이에요. 이 땅이 훗날 \u003cb class=\"key\">그린란드\u003c/b>가 되는 흐름의 출발점이죠. 뒤에서 \u003cb class=\"key\">과거분사\u003c/b> covered가 place를 꾸며 '얼음으로 덮인'이라는 \u003cb class=\"key\">수동\u003c/b>의 의미를 더합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">go + 현재분사의 활동 표현\u003c/span> : go + [현재분사(-ing)] (예: went sailing) : \"항해를 계속해, 항해하러 갔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬\u003c/span> : [went sailing] + and + [discovered] : \"그리고 발견했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(수동)\u003c/span> : [명사 a terrible place] + [과거분사구 covered with ice] : \"얼음으로 덮인 거친 땅\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"He then, 그리고는 그는. went sailing, 항해를 계속해. and discovered, 그리고 발견했다. a terrible place, 거친 땅을. covered with ice, 얼음으로 덮인. 이 문장 전체를 해석하면, 그리고는 항해를 계속해 얼음으로 덮인 거친 땅을 발견했다.","hl":"m"},{"n":41,"text":"여기서 중요한 건 이 땅이 얼음으로 가득한 끔찍한 곳이었다는 점이에요. 그런데 바로 이 땅이 나중에 그린란드가 된다는 흐름의 출발점이죠. covered가 앞의 place를 뒤에서 꾸며 주면서 수동의 느낌을 준다는 것도 꼭 기억해 두세요.","hl":"mn"},{"n":42,"text":"첫 번째로 went sailing을 보세요. go 뒤에 현재분사가 오면 항해하러 가다, 항해를 하다라는 활동을 나타내요. 두 번째로 a terrible place covered with ice에서 covered는 과거분사로 뒤에서 명사를 꾸며 주는 후치수식이에요. 그래서 얼음으로 덮인이라는 수동의 뜻이 되죠. 세 번째로 and discovered의 and는 앞의 went와 뒤의 discovered를 병렬로 묶어 주는 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그는 원했다\u003c/span>\u003cspan class=\"en\">But he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을 끌어들이기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">attract \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">place\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 이름 지었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">named \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그린란드라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Greenland\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그는 그곳에 사람들을 끌어들이고 싶어서 이름을 그린란드라고 지었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그가 이름을 그린란드라고 붙인 이유가 여기 나와요. 얼음으로 덮인 거친 땅인데도 사람들을 \u003cb class=\"key\">끌어들이고\u003c/b> 싶어서 일부러 좋은 이름을 준 거죠. 이 선택이 뒤에 나오는 \u003cb class=\"key\">속임수\u003c/b>의 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want + [to attract (to부정사구/목적어)] : \"끌어들이기를 원했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">attract A to B 문형(3형식)\u003c/span> : attract + [목적어 people] + [전치사구 to the place] : \"사람들을 그곳으로 끌어들이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬 + 5형식(name A B)\u003c/span> : [wanted to attract ~] + and + named + [it] + [Greenland(목적격 보어)] : \"그리고 그것을 그린란드라고 이름 지었다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"But he wanted, 하지만 그는 원했다. to attract people, 사람들을 끌어들이기를. to the place, 그곳으로. and named it, 그리고 그것을 이름 지었다. Greenland, 그린란드라고. 이 문장 전체를 해석하면, 하지만 그는 그곳에 사람들을 끌어들이고 싶어서 이름을 그린란드라고 지었다.","hl":"m"},{"n":44,"text":"그가 이름을 그린란드라고 지은 이유가 바로 이 문장에 나와요. 얼음으로 덮인 거친 땅인데도 사람들을 끌어들이고 싶어서 일부러 좋은 이름을 붙인 거죠. 이 선택이 바로 뒤에 나오는 속임수 이야기의 근거가 됩니다.","hl":"mn"},{"n":45,"text":"첫 번째, wanted to attract에서 want는 목적어로 to부정사를 받는 동사예요. 그래서 to attract가 끌어들이기를이라는 목적어 역할을 해요. 두 번째, attract people to the place는 사람들을 그곳으로 끌어들이다라는 문형이고, 전치사 to가 도착점을 나타내죠. 세 번째, and named it Greenland에서 and는 wanted와 named를 병렬로 이어 주고, named는 it과 Greenland가 같은 대상임을 알려 주는 목적격 보어 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 속임수는 잘 통했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">His \u003c/span>\u003cspan class=\"tgt\">trick \u003c/span>\u003cspan class=\"tgt\">worked \u003c/span>\u003cspan class=\"tgt\">well\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 많은 바이킹들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">lots \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Vikings \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그린란드로 이주했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">moved\u003c/span> to Greenland.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 속임수는 적중해서 많은 바이킹들이 그린란드로 이주했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 사람들을 끌어들이려고 이름을 속인 결과가 여기서 드러나요. 그 \u003cb class=\"key\">속임수\u003c/b>가 실제로 \u003cb class=\"key\">효과\u003c/b>를 내서 많은 바이킹들이 그린란드로 이주했다는 거죠. 글의 마지막에서 앞 내용을 정리하며 맺는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">work의 자동사 용법(효과가 있다)\u003c/span> : [주어 His trick] + [자동사 worked] + [부사 well] : \"그의 속임수는 잘 통했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 절 연결\u003c/span> : [앞 절 His trick worked well] + , and + [뒤 절 lots of Vikings moved ~] : \"그리고 많은 바이킹들이 이주했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">lots of + 복수명사 수량 표현\u003c/span> : lots of + [복수가산명사 Vikings] : \"많은 바이킹들이\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"His trick worked well, 그의 속임수는 잘 통했다. and lots of Vikings, 그리고 많은 바이킹들이. moved to Greenland, 그린란드로 이주했다. 이 문장 전체를 해석하면, 그의 속임수는 적중해서 많은 바이킹들이 그린란드로 이주했다.","hl":"m"},{"n":47,"text":"앞에서 그가 사람들을 끌어들이려고 이름을 속인 결과가 여기서 드러나요. 그 속임수가 실제로 효과를 내서 많은 바이킹들이 그린란드로 이주했다는 거죠. 글의 마지막에서 앞 내용을 정리하며 끝맺는 역할을 해요.","hl":"mn"},{"n":48,"text":"첫 번째, worked well에서 work는 일하다가 아니라 효과가 있다, 잘 통하다라는 자동사로 쓰였어요. 그래서 뒤에 부사 well이 온 거죠. 두 번째, lots of Vikings에서 lots of는 복수명사와 함께 쓰고 뒤에 오는 동사도 복수 형태로 맞춰 줘요. 세 번째, and가 앞 절과 뒤 절을 대등하게 이어 주면서 속임수의 결과를 자연스럽게 연결해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아이슬란드는 얼음으로 덮인 추운 곳이라는 \u003cb class=\"key\">통념\u003c/b>과 달리 멕시코 만류와 천연 온천으로 데워진다.\u003c/li>\u003cli>아이슬란드라는 이름은 섬을 싫어한 바이킹이 \u003cb class=\"key\">모욕\u003c/b>의 뜻으로 붙인 것이다.\u003c/li>\u003cli>그린란드는 초목의 땅을 연상시키지만 실제로는 대부분이 \u003cb class=\"key\">얼음\u003c/b>으로 덮여 있다.\u003c/li>\u003cli>Erik the Red는 사람들을 끌어들이기 위해 \u003cb class=\"key\">속임수\u003c/b>로 그린란드라는 이름을 지었고, 그 효과로 많은 바이킹이 이주했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The names Iceland and Greenland are misleading because Vikings gave them as an insult and as a trick to attract people, not because of their actual environments.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">아이슬란드는 이름과 달리 얼음이 적고 온천이 많으며, 그린란드는 이름과 달리 대부분 얼음으로 덮여 있다. 두 이름은 바이킹들이 각각 \u003cb class=\"key\">모욕\u003c/b>과 \u003cb class=\"key\">사람들을 \u003c/b>\u003cb class=\"key\">끌어들이려는 \u003c/b>\u003cb class=\"key\">속임수\u003c/b>로 붙인 결과이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"정리해 볼게요. 아이슬란드와 그린란드의 이름은 실제 환경과 반대되는 느낌을 주지만, 그 안에는 바이킹의 모욕과 속임수가 담겨 있어요. 이름만 보고 실제 모습을 단정하면 안 된다는 점, 그리고 이름에도 사람의 의도와 이미지가 스며든다는 점을 기억해 주세요. 오늘 수업 열심히 들어 주셔서 고마워요. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
