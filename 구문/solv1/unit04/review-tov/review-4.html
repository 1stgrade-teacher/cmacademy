n/n/Pp6Cl/z/n/P9cJ754I47ep/ljn0BoyMgd8H+n8/6UAHXGP8f5fzz+dL7/5x/wDXpqsGGfTr+GM/lmlLAdx7c9f8+tHoAtFICOBntkfT8aMjrkY+vtn+XP0o/r7wFo/z/n/P40hIHOe+Pxzj9O/pg0tAdfv/AEDp/X/E01s7Tjrg+np7/nS5HqPbn16Y59DSMcKxHYEjvyAaL9dO/df8MH9f5H//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Price of Fame: Why People Endure Extreme Stunts for Television<small>명성의 대가: 사람들이 TV를 위해 극한의 스턴트를 견디는 이유</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에, 공포 관리 이론(Terror Management Theory)과 노출 치료(Exposure Therapy)의 기본 개념을 알아두면 좋습니다. 심리학적으로 사람은 본능적으로 뱀이나 거미, 쥐와 같은 대상에게 혐오감을 느끼는데, 이는 생존을 위한 진화적 방어 기제(Evolutionary Defense Mechanism)의 일환으로 볼 수 있어요. 마치 놀이공원의 &#39;공포 체험&#39;처럼, 통제된 상황에서 극도의 두려움을 마주하는 것은 아드레날린(Adrenaline) 분비를 촉진해 강렬한 쾌감을 주기도 합니다. 특히 TV 쇼와 같은 매체 환경에서는 이러한 극단적 경험이 사회적 인정(Social Approval)을 얻으려는 욕구와 결합되어, 사람들이 평소라면 절대 하지 않을 위험한 행동을 선택하게 만드는 강력한 동기가 된답니다. 이를 통해 우리는 인간이 보상을 위해서나 타인의 관심을 끌기 위해 얼마나 자신의 공포를 억누를 수 있는지 이해해 볼 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01공포스러운 상황 제시</div><ul><li>참가자들은 쥐나 바퀴벌레와 같은 불쾌한 상황을 견뎌야 하는 도전에 직면한다.</li><li>400마리의 쥐(rats)와 함께 좁은 상자에 갇히는 상황</li><li>살아있는 바퀴벌레(cockroaches)를 먹어야 하는 과제</li><li>핵심 키워드: 공포 요소(Fear Factor)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02도전의 목적과 보상</div><ul><li>참가자들은 상당한 상금을 얻기 위해 이러한 위험하고 기괴한 도전을 수행한다.</li><li>미국 TV 쇼 &#39;Fear Factor&#39; 출연</li><li>승리 시 5만 달러(50,000 dollars)의 상금 획득</li><li>스스로에게 강요된 고통스러운 도전(crazy stunts)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03심리적 동기 분석</div><ul><li>참가자들은 상금 외에도 대중의 관심과 주목을 받고 싶어 하는 심리를 보인다.</li><li>상금보다 큰 주목(attention)에 대한 욕구</li><li>카메라(television cameras)를 향한 강한 과시욕</li><li>수단과 방법을 가리지 않는 행동 패턴</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실제 도전 사례</div><ul><li>출연자들은 시청자의 눈길을 끌기 위해 생명을 위협할 수 있는 극단적인 행동을 마다하지 않는다.</li><li>악어(alligators)와 함께 수영하기</li><li>얼굴 위를 지나가는 수십 마리의 타란툴라(tarantula) 견디기</li><li>핵심 키워드: 극단적 행동(extreme stunts)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unpleasant</td><td class=\"m\">불쾌한, 기분 나쁜</td></tr><tr><td class=\"w\">perform</td><td class=\"m\">수행하다, 공연하다</td></tr><tr><td class=\"w\">stunt</td><td class=\"m\">곡예, 위험한 행동</td></tr><tr><td class=\"w\">force oneself to</td><td class=\"m\">억지로 ~하다, 애써 ~하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">clear</td><td class=\"m\">분명한, 명확한</td></tr><tr><td class=\"w\">point at</td><td class=\"m\">~을 향하다, ~을 가리키다</td></tr><tr><td class=\"w\">contestant</td><td class=\"m\">참가자, 도전자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 무엇을 하겠는가</span><span class=\"en\"><b><span class=\"grammar-hl\">What would you do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 누군가가 당신을 넣으려 한다면</span><span class=\"en\"><b>if someone <span class=\"grammar-hl\">tried to put</span> you inside in a small box</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">400마리의 쥐들과 함께 작은 상자 안에</span><span class=\"en\"><b>along with 400 rats?</b></span></div></div><div class=\"lec-sent-ko\">누군가 당신을 작은 상자 안에 400마리의 쥐들과 함께 넣으려고 한다면 당신은 어떻게 하겠는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 기괴하고 불쾌한 상황을 가정하게 함으로써, 이어질 글의 소재인 &#39;극한의 도전&#39;에 대한 관심을 환기하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What would you do (간접의문문): 의문사 What으로 시작하여 뒤에 주어+동사(you would do) 어순을 취하는 의문 구조입니다.</div><div class=\"lec-gr-item\">tried to put (to부정사): 동사 try의 목적어 역할을 하는 명사적 용법의 to부정사 구문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 그가 살아있는 바퀴벌레를 먹이려 한다면</span><span class=\"en\"><b>What if he or she <span class=\"grammar-hl\">tried to feed</span> live cockroaches</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에게</span><span class=\"en\"><b>to you?</b></span></div></div><div class=\"lec-sent-ko\">만일 누군가 당신에게 살아있는 바퀴벌레를 먹이려고 한다면?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 제시한 질문의 강도를 높여, 상식적으로 거부감이 드는 상황을 예시로 들어 독자의 공감을 이끌어냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tried to feed (to부정사): 동사 try의 목적어 역할을 하는 명사적 용법의 to부정사 구문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 아마도 아무도 이런 불쾌한 일들을 하도록 두지 않을 것이다</span><span class=\"en\"><b>You probably wouldn’t <span class=\"grammar-hl\">let anybody do</span> these unpleasant things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에게</span><span class=\"en\"><b>to you,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 어떤 사람들이 있다</span><span class=\"en\"><b>but there are some <span class=\"grammar-hl\">people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완전히 행복해하는</span><span class=\"en\"><b><span class=\"grammar-hl\">who are completely happy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그런 미친 듯한 묘기를 수행하는 것에</span><span class=\"en\"><b><span class=\"grammar-hl\">to perform</span> such crazy stunts.</b></span></div></div><div class=\"lec-sent-ko\">아마 당신은 누군가가 그런 불쾌한 일을 당신에게 하도록 허용하지 않을 것이다. 그러나 그런 말도 안 되는 일을 하며 행복해하는 사람들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일반적인 사람들의 반응과 대조되는 &#39;특수한 집단&#39;을 소개하며, 이 글의 중심 소재인 쇼 참가자들의 성향을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let anybody do 5형식(SVOC) 구조: 사역동사 let + 목적어(anybody) + 목적보어(원형부정사 do)의 구조입니다.</div><div class=\"lec-gr-item\">people who are completely happy (관계대명사): 주격 관계대명사 who가 선행사 people을 수식하며, 뒤에 be동사+형용사가 이어지는 절입니다.</div><div class=\"lec-gr-item\">to perform (to부정사): 앞의 형용사 happy를 수식하는 형용사적/부사적 용법의 to부정사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unpleasant</td><td class=\"m\">불쾌한, 기분 나쁜</td></tr><tr><td class=\"w\">perform</td><td class=\"m\">수행하다, 공연하다</td></tr><tr><td class=\"w\">stunt</td><td class=\"m\">곡예, 위험한 행동</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&#39;Fear Factor&#39;라고 불리는 미국 TV 쇼에 출연하기를 선택한 사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">People who choose to appear</span> on an American TV show <span class=\"grammar-hl\">called Fear Factor</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">5만 달러를 딸 수 있다</span><span class=\"en\"><b>can win $50,000</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 그들이 스스로에게 강요한다면</span><span class=\"en\"><b>if they <span class=\"grammar-hl\">force themselves</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이런 종류의 일들을 하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to do</span> these kinds of things.</b></span></div></div><div class=\"lec-sent-ko\">미국의 TV 프로그램인 “Fear Factor”에 출연하기로 한 사람들은 그런 종류의 일을 하면(스스로에게 시키면) 5만 불을 받을 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;미친 짓&#39;이 실제로 벌어지는 구체적인 무대를 소개하고, 그들이 왜 그런 행동을 하는지에 대한 경제적 동기를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">People who choose to appear (관계대명사): 주격 관계대명사 who가 선행사 People을 수식하는 절입니다.</div><div class=\"lec-gr-item\">to appear (to부정사): 동사 choose의 목적어 역할을 하는 명사적 용법의 to부정사입니다.</div><div class=\"lec-gr-item\">called Fear Factor (과거분사): 과거분사 called가 앞의 명사 show를 수식하는 형용사적 구조로, show + which is + called의 축약 형태입니다.</div><div class=\"lec-gr-item\">force themselves to do 5형식(SVOC) 구조: force + 목적어(themselves) + 목적보어(to부정사 to do)의 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">분명하다</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s clear</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 쇼에 나가는 사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> <span class=\"grammar-hl\">the people who go on the show</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈을 원한다는 것이</span><span class=\"en\"><b>want the money,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 그들 중 일부는 관심을 더 원하는 것 같다</span><span class=\"en\"><b>but some of them seem to want attention</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더</span><span class=\"en\"><b>even more.</b></span></div></div><div class=\"lec-sent-ko\">그 프로에 나가는 사람들이 돈을 원한다는 것은 분명하다. 그렇지만 그들 중 일부는 관심(주목 받기)을 더 원하는 것 같다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 쇼 참가자들의 동기를 &#39;경제적 보상&#39;에서 &#39;관종(주목받고자 하는 욕구)&#39;으로 확장하며 글의 논점을 심화하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s clear that (가주어): 진주어: It을 가주어로 사용하고, that절 이하의 내용을 진주어로 배치한 구조입니다.</div><div class=\"lec-gr-item\">the people who go on the show (관계대명사): 주격 관계대명사 who가 선행사 people을 수식하는 절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">clear</td><td class=\"m\">분명한, 명확한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일단 텔레비전 카메라들이 향해지면</span><span class=\"en\"><b><span class=\"grammar-hl\">Once the television cameras are pointed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 향해</span><span class=\"en\"><b><span class=\"grammar-hl\">at them</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 거의 무엇이든 할 것이다</span><span class=\"en\"><b>they’ll do almost anything!</b></span></div></div><div class=\"lec-sent-ko\">일단 TV 카메라가 그들을 비추기만 하면 그들은 거의 어떤 일이든 하려고 들었다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 5번 문장에서 언급한 &#39;관심을 향한 열망&#39;이 카메라라는 환경과 결합했을 때, 출연자들이 얼마나 극단적인 행동까지 감수하게 되는지를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Once the television cameras are pointed at them (수동태): be동사(are)+p.p.(pointed) 구조입니다. point는 타동사인데 목적어가 없어서 수동구조 are pointed 형태로 쓰였으며, 기본구조는 point A at B(A를 B로 향하게 하다)입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 쇼의 지난 에피소드들에서</span><span class=\"en\"><b>In past episodes of the show,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">참가자들은 수영했다</span><span class=\"en\"><b>contestants <span class=\"grammar-hl\">have swum</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">악어들과 함께</span><span class=\"en\"><b>with alligators</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 50마리의 타란툴라 거미들이 걷게 했다</span><spa
