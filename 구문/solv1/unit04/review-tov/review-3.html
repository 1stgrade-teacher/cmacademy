\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01물질주의적 세태</div><ul><li>현대 사회에서는 타인의 가치를 부의 척도로 판단하려는 경향이 강하다.</li><li>부를 과시하기 위해 비싼 자동차나 명품 의류를 선호함</li><li>물질적 성공을 곧 개인의 가치로 동일시함</li><li>핵심 키워드: 물질주의적 세계(materialistic world), 명품(luxury goods)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02노블레스 노마드의 등장</div><ul><li>물질적 소비를 지양하고 경험과 자유를 추구하는 새로운 소비 계층이 나타났다.</li><li>독일에서 처음 명명된 신조어인 노블레스 노마드(noblesse nomads)</li><li>소유보다는 여가 활동과 경험을 중시하는 소비 성향</li><li>핵심 키워드: 노블레스 노마드(noblesse nomads), 여가 활동(leisure activities)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03자유로운 삶의 방식</div><ul><li>노블레스 노마드는 유목민처럼 어디에도 얽매이지 않는 자유로운 이동을 선호한다.</li><li>고정된 물건에 얽매이는 것을 바람직하지 않게 여김</li><li>사막의 유목민(nomads)처럼 자유롭게 여행하며 삶을 즐김</li><li>핵심 키워드: 유목민(nomads), 자유(freedom)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04가치관의 차이</div><ul><li>이들에게 명품은 오히려 활동을 저해하는 불필요한 짐일 뿐이다.</li><li>명품 가방이나 하이힐은 역동적인 취미 활동에 방해가 됨</li><li>물질적 소유보다 삶의 체험을 우선시하는 태도</li><li>핵심 키워드: 가치관(value), 명품(luxury goods)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">no wonder</td><td class=\"m\">놀랄 일도 아닌, 당연한</td></tr><tr><td class=\"w\">materialistic</td><td class=\"m\">물질주의적인, 물질만능주의의</td></tr><tr><td class=\"w\">common practice</td><td class=\"m\">관례, 흔한 일</td></tr><tr><td class=\"w\">sacrifice</td><td class=\"m\">희생하다, 포기하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emerge</td><td class=\"m\">나타나다, 떠오르다</td></tr><tr><td class=\"w\">be composed of</td><td class=\"m\">~로 구성되다</td></tr><tr><td class=\"w\">undesirable</td><td class=\"m\">바람직하지 않은, 달갑지 않은</td></tr><tr><td class=\"w\">be burdened with</td><td class=\"m\">~에 부담을 느끼다, ~을 짊어지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘날의 물질적인 세상에서,</span><span class=\"en\"><b>In today’s materialistic world,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 흔한 관행이 되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">it has become a common practice</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 판단하는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">to judge people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 부에 의해</span><span class=\"en\"><b>by their wealth.</b></span></div></div><div class=\"lec-sent-ko\">오늘날과 같은 물질 만능 사회에서는 부(富)로 사람을 평가하는 게 일반적 관행이 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 현대 사회가 타인을 평가하는 기준이 돈에 맞춰져 있다는 일반적인 통념을 제시하며 이후 등장할 새로운 소비 형태와의 대비를 준비합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it has become a common practice to judge people (가주어): 진주어: it은 가주어, to judge people이 진주어인 구조이다. &#39;to부정사: to judge는 명사적 용법으로 진주어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">materialistic</td><td class=\"m\">물질주의적인, 물질만능주의의</td></tr><tr><td class=\"w\">common practice</td><td class=\"m\">관례, 흔한 일</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">따라서,</span><span class=\"en\"><b>Thus,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀랄 일은 아니다</span><span class=\"en\"><b><span class=\"grammar-hl\">it is no wonder</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들이 부자처럼 보이려고 노력하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">that some people</span> try to look rich</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~함으로써, 예를 들어,</span><span class=\"en\"><b>by, for example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비싼 차를 운전하거나</span><span class=\"en\"><b><span class=\"grammar-hl\">driving an expensive car</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아니면 디자이너 옷을 입음으로써</span><span class=\"en\"><b>or <span class=\"grammar-hl\">wearing a designer dress</span>.</b></span></div></div><div class=\"lec-sent-ko\">그래서 예를 들어 값비싼 차를 몰거나 유명 디자이너가 만든 옷을 입음으로써 부자처럼 보이려고 하는 사람들이 있는 것도 당연하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 &#39;부로 사람을 판단하는 사회 분위기&#39;라는 원인으로부터, 타인에게 잘 보이기 위해 과시적 소비를 선택하는 구체적인 결과가 나타남을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it is no wonder that some people (가주어): 진주어: it은 가주어, that절 이하가 진주어인 구조이다. &#39;that절: 명사절로서 진주어 역할을 한다.</div><div class=\"lec-gr-item\">driving an expensive car (동명사): 전치사 by의 목적어 자리에 쓰여 &#39;~하는 것&#39;이라는 명사적 역할을 한다.</div><div class=\"lec-gr-item\">wearing a designer dress (동명사): 전치사 by의 목적어 자리에 쓰여 &#39;~하는 것&#39;이라는 명사적 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">no wonder</td><td class=\"m\">놀랄 일도 아닌, 당연한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 사회에서는</span><span class=\"en\"><b>in this <span class=\"grammar-hl\">society</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 모든 것을 희생하는</span><span class=\"en\"><b><span class=\"grammar-hl\">where we sacrifice everything</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">명품을 위해,</span><span class=\"en\"><b>for luxury goods,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 소비 집단이</span><span class=\"en\"><b>a new group of spenders</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나타나고 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is emerging</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 명품을 위해서라면 모든 걸 희생하는 지금의 사회에서, 새로운 소비 집단이 부상하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장들의 일반적인 사회 현상과는 상반되는 태도를 가진 대상을 소개하며, 글의 논조를 전환하여 본격적으로 &#39;노블레스 노마드&#39;라는 화제를 꺼냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">society where we sacrifice everything (관계부사): where 뒤에는 &#39;주어(we)+타동사(sacrifice)+목적어(everything)&#39;가 갖춰진 완전한 절이 오며, 앞의 선행사 society를 수식한다.</div><div class=\"lec-gr-item\">is emerging (현재진행): be동사(is) + 현재분사(emerging)를 사용하여 동작이 현재 진행 중임을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sacrifice</td><td class=\"m\">희생하다, 포기하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 “귀족적 유목민”이라 불리고,</span><span class=\"en\"><b>They <span class=\"grammar-hl\">are called</span> “noblesse nomads,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음으로 확인되고 명명되었다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">were first identified and named</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독일에서.</span><span class=\"en\"><b>in Germany.</b></span></div></div><div class=\"lec-sent-ko\">그들은 “귀족적 유목민”으로 불리며, 독일에서 처음으로 (존재가) 확인되고, 명명되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새로 등장한 집단의 명칭을 밝히고, 이 용어가 탄생한 배경을 부연 설명하여 해당 개념의 객관적인 출처를 독자에게 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are called (수동태): be동사(are) + p.p.(called) 구조이다. call은 5형식 타동사로 &#39;call + O + OC(명사)&#39; 구조를 가지는데, 목적어가 주어로 올라가면서 수동태가 되고 목적보어(명사)가 그대로 남는다. 기본구조: call A B (A를 B라고 부르다).</div><div class=\"lec-gr-item\">were first identified and named (수동태): be동사(were) + p.p.(identified/named) 구조이다. identify와 name은 타동사인데 목적어가 없어서 수동구조로 쓰였다. 기본구조: identify/name + O (목적어를 식별하다/이름 짓다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 집단은 사람들로 구성된다</span><span class=\"en\"><b>The group <span class=\"grammar-hl\">is composed of</span> <span class=\"grammar-hl\">people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 돈을 쓰는</span><span class=\"en\"><b><span class=\"grammar-hl\">who spend their money</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여가 활동에</span><span class=\"en\"><b>on leisure activities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">성에서 일주일을 보내거나</span><span class=\"en\"><b>such as <span class=\"grammar-hl\">spending a week at a castle</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아니면 그냥 단순히 뮤지컬을 보는 것과 같은</span><span class=\"en\"><b>or just simply <span class=\"grammar-hl\">seeing musicals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주말에</span><span class=\"en\"><b>on the weekends.</b></span></div></div><div class=\"lec-sent-ko\">이 집단은 유럽의 성에서 일주일을 지내거나 주말에 그냥 간단히 뮤지컬을 보는 것과 같은 여가 활동에 돈을 쓰는 사람들로 구성된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물질적인 사치품 구매 대신 경험과 문화적 즐거움에 가치를 두는 이들의 구체적인 소비 패턴을 예시로 들어, 앞서 말한 집단의 특징을 명확히 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is composed of (수동태): be동사(is) + p.p.(composed) 구조이다. compose는 타동사인데 뒤에 목적어가 없어서 수동구조로 쓰였다. 기본구조: compose + O (O를 구성하다).</div><div class=\"lec-gr-item\">people who spend their money (관계대명사): who 뒤에 주어인 who가 생략된 불완전한 절(spend their money)이 오며, 앞의 선행사 people을 수식한다.</div><div class=\"lec-gr-item\">spending a week at a castle (동명사): 전치사 of의 목적어로 쓰여 명사적 역할을 한다.</div><div class=\"lec-gr-item\">seeing musicals (동명사): 전치사 such as의 목적어로 쓰여 명사적 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 “유목민”이라 불린다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">are called</span> “nomads”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면,</span><span class=\"en\"><b>because,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사막의 유목민들처럼,</span><span class=\"en\"><b>like the nomads of the deserts,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 자유롭게 여행하는 것을 좋아하기 때문이다.</span><span class=\"en\"><b>they like to travel freely.</b></span></div></div><div class=\"lec-sent-ko\">그들은 사막의 유목민처럼 자유롭게 여행하는 걸 좋아해서 “유목민”으로 불린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;노마드&#39;라는 명칭에 담긴 함의를 설명합니다. 소유물에 얽매이지 않고 이동하며 삶을 즐기는 그들의 생활 양식을 유목민의 이미지에 빗대어 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are called (수동태): be동사(are) + p.p.(called) 구조이다. call은 5형식 타동사로 &#39;call + O + OC(명사)&#39; 구조를 가지며 목적어가 주어로 올라가 수동태가 되었다. 기본구조: call A B (A를 B라고 부르다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들에게는,</span><span class=\"en\"><b>To them,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바람직하지 않다</span><span class=\"en\"><b><span class=\"grammar-hl\">it is undesirable</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">짐을 지는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to be burdened</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">명품들로</span><span class=\"en\"><b>with luxury goods.</b></span></div></div><div class=\"lec-sent-ko\">그들에게는 사치품으로 (치장하여) 몸에 짐을 지우는 것은 바람직하지 않은 일이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;자유로운 이동&#39;이라는 가치와 충돌하는 &#39;사치품 소유&#39;의 불편함을 지적하며, 이들의 가치관이 기존의 과시적 소비와 정반대임을 확정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it is undesirable to be burdened (가주어): 진주어: it은 가주어, to be burdened 이하가 진주어이다. &#39;수동태: to be burdened는 &#39;be + p.p.&#39; 형태의 수동부정사이다. burden은 타동사인데 목적어가 없어 수동구조로 쓰였다. 기본구조: burden + O (O에게 짐을 지우다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">undesirable</td><td class=\"m\">바람직하지 않은, 달갑지 않은</td></tr><tr><td class=\"w\">be burdened with</td><td class=\"m\">~에 부담을 느끼다, ~을 짊어지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어쨌든,</span><span class=\"en\"><b>After all,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 불가능할 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">it would be impossible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">승마를 하러 가는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to go horseback riding</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구찌 하이힐을 신고</span><span class=\"en\"><b><span class=\"grammar-hl\">wearing Gucci high heels</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 프라다 가방을 든 채로</span><span class=\"en\"><b>and <span class=\"grammar-hl\">carrying a Prada bag</span>!</b></span></div></div><div class=\"lec-sent-ko\">무엇보다도, 구치 하이힐을 신고 프라다 가방을 든 채 승마하러 가는 것은 불가능할 테니까!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사치품이 실제 활동적인 삶에 얼마나 방해가 되는지를 반어법적인 예시를 들어 설명하며, 경험 중심의 삶을 추구하는 노블레스 노마드의 태도가 합리적임을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it would be impossible to go horseback riding (가주어): 진주어: it은 가주어, to go horseback riding이 진주어이다. &#39;동명사: horseback riding에서 riding은 &#39;승마&#39;라는 활동을 나타내는 동명사이다.</div><div class=\"lec-gr-item\">wearing Gucci high heels (현재분사): 분사구문으로 쓰였다. while + they + were wearing ~와 같이 원래 절에서 접속사와 주어가 생략된 구조로 볼 수 있다.</div><div class=\"lec-gr-item\">carrying a Prada bag (현재분사): 분사구문으로 쓰였다. while + they + were carrying ~와 같이 원래 절에서 접속사와 주어가 생략된 구조로 볼 수 있다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>현대 사회는 부를 기준으로 사람을 평가하며, 많은 이들이 사치품으로 부를 과시하려 한다.</li><li>그러나 최근에는 물건 대신 경험과 여가에 투자하는 &#39;노블레스 노마드&#39;가 등장했다.</li><li>이들은 자유로운 이동을 중시하며, 오히려 사치품을 짐으로 여겨 기피한다.</li><li>실용적이고 경험 중심적인 이들의 소비 방식은 기존의 물질적 과시 문화와 대조를 이룬다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Noblesse nomads reject the burden of materialistic status symbols, as they prioritize the freedom of travel and leisure experiences.</div>\n              <div class=\"lec-final-sum-ko\">노블레스 노마드는 여행과 여가 경험의 자유를 우선시하기 때문에, 물질적인 지위 상징물에 얽매이는 것을 거부한다.</div></div></div>"],"segs":[[{"audio":"./review-3_audio/1.mp3","hl":null}],[{"audio":"./review-3_audio/2.mp3","hl":null}],[{"audio":"./review-3_audio/3.mp3","hl":null},{"audio":"./review-3_audio/4.mp3","hl":"stage-0"},{"audio":"./review-3_audio/5.mp3","hl":"stage-1"},{"audio":"./review-3_audio
