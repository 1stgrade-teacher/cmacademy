\"><div class=\"lec-stage-head\">04동반 성장의 가치</div><ul><li>상사를 빛나게 하는 행위는 결국 본인의 가치를 높이는 결과로 이어진다.</li><li>타인의 성공에 기여함으로 본인의 가치 증명</li><li>상사와 동료 모두가 함께 빛나는 효과(shine)</li><li>핵심 키워드: 동반 성장(shine)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hand out</td><td class=\"m\">나눠주다, 배포하다</td></tr><tr><td class=\"w\">look good</td><td class=\"m\">좋아 보이다, 유능해 보이다</td></tr><tr><td class=\"w\">contain</td><td class=\"m\">포함하다, 들어있다</td></tr><tr><td class=\"w\">essential</td><td class=\"m\">필수적인, 본질적인</td></tr><tr><td class=\"w\">basically</td><td class=\"m\">근본적으로, 기본적으로</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">associate with</td><td class=\"m\">~와 어울리다, ~와 연관되다</td></tr><tr><td class=\"w\">feedback</td><td class=\"m\">의견, 반응</td></tr><tr><td class=\"w\">as best one can</td><td class=\"m\">최선을 다해, 할 수 있는 한</td></tr><tr><td class=\"w\">shine</td><td class=\"m\">빛나다, 돋보이다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 회사가 한때 나누어 주었다</span><span class=\"en\"><b>A company once <span class=\"grammar-hl\">handed out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 재미있는 티셔츠들을</span><span class=\"en\"><b>some very interesting T-shirts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 직원들에게</span><span class=\"en\"><b>to all of its employees.</b></span></div></div><div class=\"lec-sent-ko\">한 회사가 매우 재미있는 티셔츠를 직원들 모두에게 지급한 일이 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로서, 직장 내 관계를 다루기 위해 흥미로운 일화 하나를 제시하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">handed out (관용표현(숙어)): &#39;나누어 주다&#39;라는 의미를 가진 구동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">각 셔츠의 앞면은</span><span class=\"en\"><b>The front of each shirt</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인쇄되어 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was printed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀라운 문구로: “우리 상사는 멋지다!”</span><span class=\"en\"><b>with a <span class=\"grammar-hl\">surprising</span> message: “Our boss is great!”</b></span></div></div><div class=\"lec-sent-ko\">티셔츠 앞면에는 “내 상사[사장]는 멋져!”라는 놀라운 문구가 인쇄되어 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 흥미로운 상황을 구체적으로 보여주며, 사장에 대한 긍정적인 평가를 먼저 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was printed (수동태): be동사(was)+p.p.(printed) 구조입니다. print는 타동사인데 목적어가 없어서 수동구조 was printed 형태로 씁니다. 기본구조: print + O (O를 인쇄하다)</div><div class=\"lec-gr-item\">surprising (현재분사): &#39;놀라움을 주는&#39;이라는 의미로 뒤의 명사 message를 수식하는 형용사적 기능입니다. N + -ing(…하는 N)의 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">각 셔츠의 뒷면은, 그러나,</span><span class=\"en\"><b>The back of each shirt, however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적혀 있었다: “내 일은</span><span class=\"en\"><b>read: “My job</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상사를 멋져 보이게 만드는 것이다.”</span><span class=\"en\"><b>is <span class=\"grammar-hl\">to make the boss look great</span>.”</b></span></div></div><div class=\"lec-sent-ko\">그러나 뒷면에는 “내 상사[사장]를 멋져 보이도록 만드는 게 내 일이다.”라고 적혀 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 겉으로 드러난 평가를 반전시키며, 직원의 실제 역할이 무엇인지 암시하는 대조적인 내용을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to make the boss look great (to부정사): be동사의 주격보어 역할을 하는 명사적 용법입니다. 5형식 구조(make + O + C: 목적어인 boss를 C인 great하게 만들다)를 포함하고 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">물론,</span><span class=\"en\"><b>Of course,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 티셔츠들은 의도된 것이었다</span><span class=\"en\"><b>the T-shirts <span class=\"grammar-hl\">were meant</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">농담으로,</span><span class=\"en\"><b>as a joke,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 직원들은 모두 한바탕 크게 웃었다.</span><span class=\"en\"><b>and the employees all had a good laugh.</b></span></div></div><div class=\"lec-sent-ko\">물론 이 셔츠는 장난이었고 모든 직원은 한바탕 웃었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 메시지가 진지한 비판이 아닌 가벼운 웃음을 위한 장치였음을 밝혀 글의 분위기를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were meant (수동태): be동사(were)+p.p.(meant) 구조입니다. mean은 타동사인데 목적어가 없어서 수동구조 were meant 형태로 씁니다. 기본구조: mean + O (O를 의미하다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 그 티셔츠들은</span><span class=\"en\"><b><span class=\"grammar-hl\">But the T-shirts</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">핵심적인 진실을 담고 있었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">contained an essential</span> truth.</b></span></div></div><div class=\"lec-sent-ko\">그러나 그 셔츠는 핵심적인 진리를 담고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 농담으로 웃고 넘긴 상황 속에 사실은 직장 생활의 중요한 원리가 들어 있다는 것을 강조하며 논의를 본격화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">But the T-shirts contained an essential 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">contain</td><td class=\"m\">포함하다, 들어있다</td></tr><tr><td class=\"w\">essential</td><td class=\"m\">필수적인, 본질적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신의 직업은</span><span class=\"en\"><b>Your job</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기본적으로 ~이다</span><span class=\"en\"><b>is basically</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 상사를 좋아 보이게 만드는 것이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">to make your boss look good</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신의 직업이 기본적으로 당신 상사[사장]를 멋져 보이게 만드는 일이라는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 예고한 &#39;본질적인 진실&#39;을 구체적으로 설명하며, 직장 생활의 핵심 과업을 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to make your boss look good (to부정사): be동사의 주격보어 역할을 하는 명사적 용법입니다. 5형식 구조(make + O + C: 목적어인 boss를 C인 good하게 보이다)를 포함하고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look good</td><td class=\"m\">좋아 보이다, 유능해 보이다</td></tr><tr><td class=\"w\">basically</td><td class=\"m\">근본적으로, 기본적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것을 함으로써,</span><span class=\"en\"><b><span class=\"grammar-hl\">By doing this</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 또한 당신 자신을 좋아 보이게 만들고 있는 것이다,</span><span class=\"en\"><b>you are also making yourself look good,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 당신은 연결되어 있기 때문에</span><span class=\"en\"><b>because you <span class=\"grammar-hl\">are associated</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그나 그녀와</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> him or her.</b></span></div></div><div class=\"lec-sent-ko\">이렇게 함으로써 당신은 또한 당신 자신을 좋아 보이게 만들고 있는 것이다. 왜냐하면 당신은 상사[사장]와 연결되어 있기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상사를 돕는 일이 왜 본인에게도 이득이 되는지 논리적 인과관계를 설명하여, 앞 문장의 주장을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">By doing this (동명사): 전치사 By의 목적어 자리에 위치하여 &#39;~함으로써&#39;라는 명사적 역할을 합니다.</div><div class=\"lec-gr-item\">are associated with (수동태): be동사(are)+p.p.(associated) 구조입니다. associate는 타동사인데 목적어가 없어서 수동구조 are associated with 형태로 씁니다. 기본구조: associate A with B (A를 B와 연관시키다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look good</td><td class=\"m\">좋아 보이다, 유능해 보이다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러니 항상 기억해라</span><span class=\"en\"><b>So always remember</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 상사에게 정직한 의견을 주는 것과</span><span class=\"en\"><b><span class=\"grammar-hl\">to give your boss honest feedback</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그나 그녀의 결정을 지원하는 것을</span><span class=\"en\"><b>and <span class=\"grammar-hl\">to support his or her decisions</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 할 수 있는 최선으로</span><span class=\"en\"><b>as best you can.</b></span></div></div><div class=\"lec-sent-ko\">그래서 언제나 너의 상사[사장]에게 정직한 반응(의견)을 주고 또 상사[사장]의 결정을 당신이 할 수 있는 최선을 다해 지원할 것을 기억해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 논리를 바탕으로, 직원이 실제로 직장에서 실천해야 할 구체적인 행동 지침을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to give your boss honest feedback (to부정사): remember의 목적어 역할을 하는 명사적 용법입니다. give는 수여동사로 4형식(give + IO + DO) 구조를 취합니다.</div><div class=\"lec-gr-item\">to support his or her decisions (to부정사): remember의 목적어 역할을 하는 명사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">feedback</td><td class=\"m\">의견, 반응</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신의 상사를 빛나게 만드는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">To make your boss shine</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신 자신을 빛나게 만드는 것이다, 또한.</span><span class=\"en\"><b>is <span class=\"grammar-hl\">to make yourself shine</span>, too.</b></span></div></div><div class=\"lec-sent-ko\">당신의 상사[사장]를 빛나게 만드는 것이 당신 자신을 빛나게 만드는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심 주제를 요약하며, 상사의 성공이 곧 본인의 성공과 직결된다는 점을 결론으로 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To make your boss shine (to부정사): 문장의 주어 역할을 하는 명사적 용법입니다. 5형식 구조(make + O + 원형부정사(shine): 목적어가 ~하게 만들다)를 포함합니다.</div><div class=\"lec-gr-item\">to make yourself shine (to부정사): be동사의 주격보어 역할을 하는 명사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shine</td><td class=\"m\">빛나다, 돋보이다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>회사가 직원들에게 나눠준 티셔츠에 담긴 농담 속에 직장 생활의 본질이 숨어 있다.</li><li>직원의 기본 업무는 상사를 돋보이게 하는 것이다.</li><li>상사를 성공적으로 보좌하는 것은 결국 상사와 연결된 나 자신의 가치를 높이는 일이다.</li><li>따라서 상사에게 솔직히 조언하고 최선을 다해 협력하여 동반 성장을 이뤄내야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Supporting your boss and providing honest feedback enhances their performance, and it simultaneously elevates your own professional value.</div>\n              <div class=\"lec-final-sum-ko\">상사를 지원하고 솔직한 피드백을 제공하는 것은 그들의 성과를 향상시키며, 동시에 당신 자신의 직업적 가치를 높인다.</div></div></div>"],"segs":[[{"audio":"./review-2_audio/1.mp3","hl":null}],[{"audio":"./review-2_audio/2.mp3","hl":null}],[{"audio":"./review-2_audio/3.mp3","hl":null},{"audio":"./review-2_audio/4.mp3","hl":"stage-0"},{"audio":"./review-2_audio/5.mp3","hl":"stage-1"},{"audio":"./review-2_audio/6.mp3","hl":"stage-2"},{"audio":"./review-2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./review-2_audio/8.mp3","hl":null}],[{"audio":"./review-2_audio/9.mp3","hl":"main"},{"audio":"./review-2_audio/10.mp3","hl":"meaning"},{"audio":"./review-2_audio/11.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/12.mp3","hl":"main"},{"audio":"./review-2_audio/13.mp3","hl":"meaning"},{"audio":"./review-2_audio/14.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/15.mp3","hl":"main"},{"audio":"./review-2_audio/16.mp3","hl":"meaning"},{"audio":"./review-2_audio/17.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/18.mp3","hl":"main"},{"audio":"./review-2_audio/19.mp3","hl":"meaning"},{"audio":"./review-2_audio/20.mp3","hl":"grammar"}],[{"audio":"./review-2_audio/21.mp3","hl":"main"},{"audio":"./review-2_audio/22.mp3","hl":"m
