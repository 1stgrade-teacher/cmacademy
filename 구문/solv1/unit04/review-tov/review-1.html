의 도서관 자료를 순식간에 대조하여 똑같은 문장이 있는지 찾아내는 정밀한 수사관과 같은 역할을 합니다. 이러한 기술적 대응은 학생들에게 정직한 학업 성취의 중요성을 일깨우는 동시에, 지식의 올바른 활용과 정당한 인용(Citation)이라는 학문적 윤리를 되새기게 하는 중요한 계기가 되고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01부정행위의 보편성</div><ul><li>학교 현장에서 시험이나 과제 시 부정행위를 하는 학생들은 드문 일이 아니다.</li><li>숙제 베끼기(copying homework)와 시험 부정행위(cheating)의 빈번함</li><li>부정행위를 하지 않는 학생이 소수(minority)인 현실</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02기술을 이용한 부정행위의 진화</div><ul><li>최신 기술의 발달은 학생들의 부정행위 방식을 더욱 교묘하게 변화시켰다.</li><li>휴대폰(cell phones)을 통한 실시간 답안 공유</li><li>인터넷상에 존재하는 에세이 베끼기(copying essays)가 가장 흔한 유형</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03교육 현장의 새로운 대응</div><ul><li>교사들은 첨단 기술을 활용하여 부정행위를 적발하고 방지하는 노력을 기울이고 있다.</li><li>학생들의 에세이와 온라인 자료를 대조하는 사이트 활용</li><li>부정행위자 적발(catch cheaters)을 통한 대응책 마련</li><li>핵심 키워드: 교사(teachers), 대응(fight back)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">minority</td><td class=\"m\">소수, 소수 집단</td></tr><tr><td class=\"w\">cheat</td><td class=\"m\">부정행위를 하다, 속이다</td></tr><tr><td class=\"w\">assignment</td><td class=\"m\">과제, 임무</td></tr><tr><td class=\"w\">development</td><td class=\"m\">발달, 개발</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fight back</td><td class=\"m\">저항하다, 반격하다</td></tr><tr><td class=\"w\">for instance</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">compare</td><td class=\"m\">비교하다</td></tr><tr><td class=\"w\">make it possible to</td><td class=\"m\">~을 가능하게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">누군가의 숙제를 베낀 적이 있는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Have you ever copied</span> someone’s homework</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아니면 다른 누군가가 부정행위하는 것을 도운 적이 있는가</span><span class=\"en\"><b>or helped someone else cheat</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시험 중에?</span><span class=\"en\"><b>during an exam?</b></span></div></div><div class=\"lec-sent-ko\">누군가의 숙제를 베끼거나 시험 중에 누군가가 커닝 (부정행위)하는 것을 도와준 적이 있는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 질문을 던짐으로써 독자가 자신의 경험을 되돌아보게 하고, 부정행위라는 주제를 자연스럽게 화두로 끌어들입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Have you ever copied 현재완료(have + p.p.): 과거의 특정 시점부터 현재까지의 경험을 묻는 구조로, have동사와 과거분사 copied가 결합된 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cheat</td><td class=\"m\">부정행위를 하다, 속이다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 당신의 대답이 “아니요”라면,</span><span class=\"en\"><b><span class=\"grammar-hl\">If your answer is “no,”</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 소수에 속한다.</span><span class=\"en\"><b>you are in the minority.</b></span></div></div><div class=\"lec-sent-ko\">당신의 대답이 “그런 적 없다.”라고 한다면, 당신은 소수에 속한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 대한 일반적인 대답을 예상하며, 부정행위가 학생들 사이에서 매우 흔한 일이라는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If your answer is “no,” (조건절(If)): 현재의 상황을 가정한 조건문으로, If절의 주어와 be동사(is)가 결합된 기본 문장 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">minority</td><td class=\"m\">소수, 소수 집단</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 학생들은 그것이 정상이라고 생각한다</span><span class=\"en\"><b>Many students <span class=\"grammar-hl\">find it normal</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부정행위하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to cheat</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시험과 쓰기 과제에서.</span><span class=\"en\"><b>in tests and writing assignments.</b></span></div></div><div class=\"lec-sent-ko\">많은 학생들이 시험이나 쓰기 과제에서 부정행위하는 것을 정상적인 것이라고 생각한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 내용을 구체적인 근거로 뒷받침하며, 학생들 사이에 퍼진 부정행위에 대한 무뎌진 인식을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">find it normal to cheat 5형식(SVOC) 구조: find(동사) + it(가목적어) + normal(목적보어) + to cheat(진목적어) 구조입니다. 목적어가 길어질 때 it을 가목적어로 세우고, to부정사 구를 뒤로 보낸 형태입니다.</div><div class=\"lec-gr-item\">to cheat (to부정사): 5형식 문장에서 가목적어 it을 보충 설명하는 진목적어 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cheat</td><td class=\"m\">부정행위를 하다, 속이다</td></tr><tr><td class=\"w\">assignment</td><td class=\"m\">과제, 임무</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">최근, 그러나,</span><span class=\"en\"><b>Recently, however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기술의 새로운 발전들이</span><span class=\"en\"><b>new developments in technology</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부정행위 문화를 바꾸었다</span><span class=\"en\"><b><span class=\"grammar-hl\">have changed</span> the cheating culture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교사와 학생들 모두에게 있어.</span><span class=\"en\"><b>for both teachers and students.</b></span></div></div><div class=\"lec-sent-ko\">그런데, 최근, 새로운 과학기술의 발달로 교사와 학생 모두에게 있어 커닝 문화에 변화가 생겼다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞까지의 통념(부정행위는 흔하다)을 유지하면서도, 기술의 도입이라는 새로운 변수를 제시하여 상황의 변화를 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have changed 현재완료(have + p.p.): 과거의 사건이 현재까지 영향을 미치고 있음을 나타내며, have와 과거분사 changed가 결합한 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cheat</td><td class=\"m\">부정행위를 하다, 속이다</td></tr><tr><td class=\"w\">development</td><td class=\"m\">발달, 개발</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">학생들은 이제 할 수 있다</span><span class=\"en\"><b>Students <span class=\"grammar-hl\">are now able</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로 답을 보내는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to send</span> each other answers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 휴대폰으로.</span><span class=\"en\"><b>on their cell phones.</b></span></div></div><div class=\"lec-sent-ko\">학생들은 이제 휴대폰으로 서로 답을 보낼 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 기술 발전을 구체적인 예시로 들어, 부정행위가 예전보다 훨씬 손쉽고 즉각적으로 이루어짐을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are now able to send (to부정사): able이라는 형용사를 보충하여 능력을 나타내는 형용사적 수식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 부정행위의 가장 흔한 형태 중 하나는</span><span class=\"en\"><b>And one of the most common forms of cheating</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">에세이를 베끼는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is to copy</span> essays</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인터넷으로부터.</span><span class=\"en\"><b>from the Internet.</b></span></div></div><div class=\"lec-sent-ko\">인터넷에서 에세이를 베끼는 것 또한 부정행위의 가장 흔한 형태이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 휴대폰을 이용한 부정행위에 이어, 또 다른 대표적인 유형을 추가하여 기술이 어떤 식으로 부정행위를 조장하는지 부연합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is to copy (to부정사): 주어(forms)를 보충 설명하는 보어 역할을 수행하는 명사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cheat</td><td class=\"m\">부정행위를 하다, 속이다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대학생들은</span><span class=\"en\"><b>University students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">베낄 에세이를 고를 수 있다</span><span class=\"en\"><b>can choose an essay <span class=\"grammar-hl\">to copy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수백 개의 웹사이트들로부터.</span><span class=\"en\"><b>from hundreds of websites.</b></span></div></div><div class=\"lec-sent-ko\">대학생들은 수백 개의 웹사이트에서 베껴 쓸 에세이를 선택할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인터넷을 통해 부정행위를 하는 것이 얼마나 방대하고 쉬운 환경이 되었는지를 구체적인 상황으로 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to copy (to부정사): 앞의 명사 an essay를 수식하는 형용사적 용법으로, &#39;복사할 에세이&#39;라는 의미를 가집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 가지 방법들이 있다</span><span class=\"en\"><b>there are some ways</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선생님들이 맞설 수 있는.</span><span class=\"en\"><b>for teachers <span class=\"grammar-hl\">to fight back</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 선생님들이 그에 맞설 몇 가지 방법들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지 기술이 부정행위를 도왔다는 문제 상황을 반전시켜, 이제는 교사가 기술을 이용해 대응할 차례임을 알리는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to fight back (to부정사): 앞의 명사 ways를 수식하는 형용사적 용법으로, &#39;반격할 방법들&#39;이라는 의미를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fight back</td><td class=\"m\">저항하다, 반격하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For instance,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇몇 새로운 웹사이트들은 선생님들이 ~하게 해준다</span><span class=\"en\"><b>some new websites <span class=\"grammar-hl\">allow teachers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들의 에세이를 인터넷에 있는 것들과 비교하도록,</span><span class=\"en\"><b><span class=\"grammar-hl\">to compare</span> students’ essays with those on the Internet,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 가능하게 만들면서</span><span class=\"en\"><b><span class=\"grammar-hl\">making it possible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부정행위자를 잡아내는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">to catch</span> cheaters.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 일부 새 웹사이트에서는 선생님들이 학생들의 에세이와 인터넷에 있는 것을 비교해서 부정행위를 한 사람들을 잡아낼 수 있게 해준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 대응 방법에 대한 구체적인 해결책을 제시하며, 기술이 부정행위를 돕기도 하지만 이를 적발하는 도구가 되기도 함을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">allow teachers to compare 5형식(SVOC) 구조: allow + 목적어(teachers) + 목적보어(to compare)의 구조입니다. allow는 타동사로서 목적어에게 to부정사할 것을 허락하거나 가능하게 한다는 의미를 지닙니다.</div><div class=\"lec-gr-item\">to compare (to부정사): 5형식 동사 allow의 목적보어 역할을 하며, teachers가 행하는 동작을 나타냅니다.</div><div class=\"lec-gr-item\">making (현재분사(분사구문)): 앞 절의 내용을 부연 설명하는 분사구문으로, &#39;그리고 ~하게 만든다&#39;는 동시 동작을 나타냅니다. 원래 절로 바꾸면 &#39;and it makes&#39;로 변환 가능합니다.</div><div class=\"lec-gr-item\">making it possible to catch 5형식(SVOC) 구조: make(동사) + it(가목적어) + possible(목적보어) + to catch(진목적어)의 구조입니다.</div><div class=\"lec-gr-item\">to catch (to부정사): 5형식 문장에서 가목적어 it의 실질적인 의미를 담고 있는 진목적어 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cheat</td><td class=\"m\">부정행위를 하다, 속이다</td></tr><tr><td class=\"w\">for instance</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">compare</td><td class=\"m\">비교하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>부정행위는 학생들 사이에 매우 흔한 일상이다.</li><li>최근 기술 발전으로 학생들은 휴대폰이나 인터넷을 이용해 더욱 쉽게 부정행위를 한다.</li><li>하지만 교사들도 새로운 웹사이트를 활용하여 이러한 부정행위를 잡아내고 대응하고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Students increasingly use digital technology to commit academic dishonesty, y
