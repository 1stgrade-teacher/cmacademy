APeiml1GMkck9x/nnrSkgdSOfcf1o/r+vmAv+fyo/z/n06f5NJuGSMjj3Hbr+Xf0pNwwckcEjrjp6ZPbp9aW35feAuOvucn/P8/Xn1pf8/wA/8KQkeoH9f8/170m4Zzkcj1Ht3z9OBx1PNMBc56f/AK/p/n36YytNDAjOQOfUf59j+ho3DBORwcdfw/zjPHvxQA4dB/8Aropu5QOvHuRxk98nt+dBZRjJHOMcjvSutPP/AC/L0/UP0HUf/q9/888f/XoyPXr0opgGenvRSZHGcck/pz+mPz9KRjtViOyk/kO3B/lQB//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Quacking Assistant: A Creative Way to Boost Business<small>꽥꽥거리는 보조원: 매출을 증대하기 위한 창의적인 방법</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에 마케팅의 일환인 &#39;이색 마케팅(Unconventional Marketing)&#39;에 대해 알면 참 흥미로워요. 이는 일반적인 홍보 방식에서 벗어나 소비자의 호기심을 자극하고 강렬한 인상을 남기는 기법인데, 마치 사람들이 줄 서서 먹는 맛집이 단순히 맛뿐만 아니라 독특한 인테리어로 눈길을 끄는 것과 비슷하답니다. 또한, 동물이 사람의 일을 돕는 것을 &#39;동물 매개 활동(Animal-Assisted Activity)&#39;이라고도 부르는데, 이는 단순한 노동력을 넘어 사람과 동물 사이의 유대감을 통해 긍정적인 상호작용과 홍보 효과를 동시에 만들어내죠. 이번 지문에서는 영리한 오리가 어떻게 가게의 마스코트가 되어 매출을 올리는지 살펴볼 텐데, 이러한 &#39;주의 집중(Attention Grabbing)&#39; 효과가 비즈니스에 얼마나 큰 힘이 되는지 상상하며 읽어보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 설정</div><ul><li>사업가들은 매출을 올릴 새로운 방안을 지속적으로 모색하며, 광둥성의 한 신문 판매원은 독특한 방식을 도입했다.</li><li>판매 실적 향상을 위한 새로운 아이디어 탐색</li><li>오리를 조수(assistant)로 활용하는 이색 전략</li><li>핵심 키워드: 매출 증대(increase sales), 조수(assistant)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02오리의 역할</div><ul><li>판매대를 지키는 오리는 돈을 받고 신문을 건네주는 등 능숙하게 판매 업무를 돕는다.</li><li>카운터 의자 위에서 손님 응대</li><li>부리(beak)를 사용해 지폐 수령 및 신문 전달</li><li>핵심 키워드: 손님 유인(attracting customers), 판매대(counter)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03알람 기능 수행</div><ul><li>오리는 주인이 잠들었을 때 손님의 방문을 알리는 경보 장치 역할도 수행한다.</li><li>주인의 낮잠 시간 동안 파수꾼 역할</li><li>손님이 오면 큰 소리로 울어 주인 깨우기(quack)</li><li>핵심 키워드: 알람 시계(alarm clock), 깨우다(wake up)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04판매원의 만족과 결심</div><ul><li>주인인 왕 씨는 오리를 매우 아끼며, 끝까지 함께할 것임을 분명히 했다.</li><li>뛰어난 조수에 대한 주인 왕 씨의 높은 만족도</li><li>오리를 도축하거나 팔 생각이 없음을 명확히 함</li><li>핵심 키워드: 의도(intentions), 만족하는(glad)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look for</td><td class=\"m\">~을 찾다, ~을 구하다</td></tr><tr><td class=\"w\">come up with</td><td class=\"m\">~을 생각해내다, ~을 제안하다</td></tr><tr><td class=\"w\">attract</td><td class=\"m\">유인하다, 마음을 끌다</td></tr><tr><td class=\"w\">assistant</td><td class=\"m\">조수, 보조원</td></tr><tr><td class=\"w\">counter</td><td class=\"m\">계산대, 판매대</td></tr><tr><td class=\"w\">kiosk</td><td class=\"m\">가판대, 매점</td></tr><tr><td class=\"w\">hand out</td><td class=\"m\">나눠주다, 배포하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take a nap</td><td class=\"m\">낮잠을 자다</td></tr><tr><td class=\"w\">wake up</td><td class=\"m\">깨우다, 깨어나다</td></tr><tr><td class=\"w\">come by</td><td class=\"m\">잠시 들르다, 얻다</td></tr><tr><td class=\"w\">as for</td><td class=\"m\">~에 관하여는, ~은 어떠냐 하면</td></tr><tr><td class=\"w\">make it clear</td><td class=\"m\">분명히 밝히다, 명확히 하다</td></tr><tr><td class=\"w\">intention</td><td class=\"m\">의도, 목적</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사업주들은</span><span class=\"en\"><b>Business owners</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상 찾고 있다</span><span class=\"en\"><b>are always <span class=\"grammar-hl\">looking for</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 매출 증대를 도울 새로운 아이디어를</span><span class=\"en\"><b>new ideas <span class=\"grammar-hl\">that will help them increase their sales</span>.</b></span></div></div><div class=\"lec-sent-ko\">사장들은 항상 매출 증대를 도와줄 새로운 아이디어를 찾는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 도입부로서, 기업이 수익 창출을 위해 기발한 방식을 추구하는 보편적인 배경을 제시하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looking for (현재진행): be동사(are) + -ing(looking) 구조로, 동작이 현재 진행 중임을 나타냄. (looking for: ~을 찾다)</div><div class=\"lec-gr-item\">that will help them increase their sales (관계대명사): 선행사 new ideas를 수식하며, 절 내부에서 주어 역할을 하는 주격 관계대명사 that이 이끄는 절임</div><div class=\"lec-gr-item\">help them increase (5형식(SVOC)): help는 준사역동사로, 목적어(them) 뒤에 목적격보어로 동사원형(increase)을 취하는 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">중국 광둥 성의 한 신문 판매상은</span><span class=\"en\"><b>One newspaper seller in the Chinese province of Guangdong</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각해 냈다</span><span class=\"en\"><b>has come up with</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고객들을 끌어들일 독특한 방법을</span><span class=\"en\"><b>a unique way of <span class=\"grammar-hl\">attracting customers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 그는 오리 한 마리를 조수로 이용한다</span><span class=\"en\"><b>— he uses a duck as his assistant.</b></span></div></div><div class=\"lec-sent-ko\">중국의 광동의 한 신문 판매업자는 고객을 끌 독특한 방법을 생각해 냈다. 오리를 조수로 활용하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 일반적인 사업 전략의 사례로, 광둥성 판매원의 구체적인 아이디어를 소개하며 글의 핵심 소재를 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">attracting customers (동명사): 전치사(of)의 목적어 자리에 쓰인 명사적 기능의 동명사로, 앞의 명사 way를 의미적으로 설명함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">come up with</td><td class=\"m\">~을 생각해내다, ~을 제안하다</td></tr><tr><td class=\"w\">attract</td><td class=\"m\">유인하다, 마음을 끌다</td></tr><tr><td class=\"w\">assistant</td><td class=\"m\">조수, 보조원</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 오리는</span><span class=\"en\"><b>The duck</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가판대 계산대 뒤 의자 위에 서서</span><span class=\"en\"><b><span class=\"grammar-hl\">stands</span> on a chair behind the counter of the kiosk</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부리를 사용한다</span><span class=\"en\"><b>and uses its beak</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈을 받고</span><span class=\"en\"><b><span class=\"grammar-hl\">to collect money</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고객들에게 신문을 건네주기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">and hand out</span> newspapers to customers.</b></span></div></div><div class=\"lec-sent-ko\">그 오리는 가판대 카운터 뒤에 있는 의자 위에 서서 부리를 이용해서 손님들에게 돈을 받고 신문을 건네준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 ‘조수’라는 역할이 실제로 어떻게 수행되는지 그 구체적인 업무 방식을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stands (일반동사): 주어(The duck)가 3인칭 단수이므로 동사에 -s가 붙은 형태</div><div class=\"lec-gr-item\">to collect money and hand out (to부정사): 동사(uses)의 목적어로 쓰인 명사적 용법의 to부정사 구조로, to collect와 (to) hand out이 병렬로 연결됨</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">counter</td><td class=\"m\">계산대, 판매대</td></tr><tr><td class=\"w\">kiosk</td><td class=\"m\">가판대, 매점</td></tr><tr><td class=\"w\">hand out</td><td class=\"m\">나눠주다, 배포하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 심지어 역할을 한다</span><span class=\"en\"><b>It even <span class=\"grammar-hl\">acts as</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자명종 시계로서의</span><span class=\"en\"><b>an alarm clock.</b></span></div></div><div class=\"lec-sent-ko\">심지어 그 오리는 자명종 시계로도 활약한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 단순한 판매 업무를 넘어, 오리의 능력이 다재다능하다는 점을 강조하여 흥미를 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">acts as (관용표현): &#39;…로서 역할을 하다&#39;라는 의미의 숙어적 표현</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">신문 판매상이, Wang이라는 이름의 남자가,</span><span class=\"en\"><b><span class=\"grammar-hl\">When the newspaper seller, a man named Wang,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">낮잠을 잘 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">takes a nap</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 오리는 크게 꽥꽥거린다</span><span class=\"en\"><b>the duck quacks loudly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그를 깨우기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to wake him up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 누군가가 신문을 사러 들르면</span><span class=\"en\"><b>if someone comes by to buy a newspaper.</b></span></div></div><div class=\"lec-sent-ko\">신문 판매업자가, 이름이 Wang이라는 사람인데, 낮잠을 자는 중에 누군가 신문을 사러오면 오리가 그를 깨우기 위해 크게 꽥 소리를 낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;자명종&#39;이라는 비유를 실제 상황으로 구체화하여, 오리가 판매원의 업무를 얼마나 완벽하게 보조하는지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When the newspaper seller, a man named Wang, takes a nap (분사구문): 시간의 부사절 &#39;When...&#39; 형태이나, 분사구문과 유사하게 문장 전체를 수식하는 시간 부사절</div><div class=\"lec-gr-item\">named Wang (과거분사(형용사)): named가 man을 수식하는 구조로, &#39;Wang이라는 이름이 붙여진 남자&#39;라는 의미. (N that is named Wang)</div><div class=\"lec-gr-item\">to wake him up (to부정사): 목적을 나타내는 부사적 용법으로, quacks loudly를 하는 이유를 설명</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Wang에 관해서라면,</span><span class=\"en\"><b><span class=\"grammar-hl\">As for Wang</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 꽤 기뻐한다</span><span class=\"en\"><b>he <span class=\"grammar-hl\">is</span> quite glad</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그토록 훌륭한 조수를 두어서</span><span class=\"en\"><b>to have such an excellent assistant.</b></span></div></div><div class=\"lec-sent-ko\">Wang으로서는 그토록 훌륭한 조수를 두어서 정말 기뻤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독특한 영업 방식을 통해 판매원이 느끼는 실질적인 만족감과 오리와의 관계를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As for Wang (관용표현): &#39;~에 관하여 말하자면&#39;이라는 의미의 도입구</div><div class=\"lec-gr-item\">is (be동사): 주어(he)와 형용사(glad)를 연결하는 연결동사</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">assistant</td><td class=\"m\">조수, 보조원</td></tr><tr><td class=\"w\">as for</td><td class=\"m\">~에 관하여는, ~은 어떠냐 하면</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분명히 했다</span><span class=\"en\"><b>has <span class=\"grammar-hl\">made it clear</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의도가 전혀 없다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that he has no intentions</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 오리를 죽이거나 팔</span><span class=\"en\"><b><span class=\"grammar-hl\">of killing or selling the duck</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 그 오리를 죽이거나 팔 의도가 전혀 없다는 것을 확실히 밝혔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 오리를 단순히 일회성 도구가 아닌 소중한 동료로 대우하며, 앞으로도 이 협력 관계를 지속할 것임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made it clear (5형식(SVOC)): make + 목적어(it/가목적어) + 목적격보어(clear/형용사) + 진목적어(that절) 구조</div><div class=\"lec-gr-item\">that he has no intentions of killing or selling the duck 동격의 that: 앞의 명사(it을 대신하는 내용)를 구체적으로 설명하는 that절. 명사 + that + S + V 구조</div><div class=\"lec-gr-item\">killing or selling (동명사): 전치사(of) 뒤에서 목적어 역할을 하는 명사적 용법의 동명사들</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intention</td><td class=\"m\">의도, 목적</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>매출 증대를 위해 새로운 아이디어를 찾는 사업주들이 많다.</li><li>중국의 한 신문 판매원은 오리를 조수로 활용하여 손님을 끄는 기발한 방법을 고안했다.</li><li>오리는 돈을 받고 신문을 전달할 뿐만 아니라, 잠든 주인을 깨우는 알람 역할까지 수행한다.</li><li>판매원 왕 씨는 오리를 매우 아끼며, 앞으로도 계속 함께 일할 것임을 분명히 밝혔다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The vendor utilizes a duck to assist with customer service and store management, and he remains committed to keeping his unique helper.</div>\n              <div class=\"lec-final-sum-ko\">판매상은 고객 서비스와 매장 관리를 돕도록 오리를 활용하며, 그는 자신의 독특한 조수를 계속해서 곁에 두기로 다짐한다.</di
