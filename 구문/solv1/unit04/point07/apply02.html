j/P5UvK+vyFdf15/8OhaTp078/wCNGR1yMDOfbHX6Y7+nH4mRnGen0x7985GD9O/amP8Ar+vvFzmk/wA9PX/P+J9U3A55BxnIzk8HDcex4+vHplcj1HTpn6fyoAP/ANf/ANb8Pfr/ACX/ADx/n/8AXSbhnGRySOo7DJ/Lv3oyvqPzFAf0xf8AP+FH+f8AP+fam7lyRkZGfTt1/Lv6UFlHORjJH5DJ+v4UAO/z/n/I9aTPbvzj/P064zj8smRxyO/XrgdRyc5HGfQ9RSZXPUd/Ttx+vH4CgB3+fr19f0/w6n+f1/8ArA00MrDqO46jPHX6Ed/SjcvPIPOMZHJ9Ov8A+rvjmgB1HP8Akf8A16buGOCD1A5HJHX247+n14pSyjqR/wDr6UX/AMv6/r8gFopMgd/agkd8YPH5/wCf69KAF/8A1/5/z601j8pI64OOv58A/wAqXcOOQcnjHv369PekY4DMOflOO+cAnp3+lG+wuy8vyt/mf//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Power of Visionary Thinking: Lessons from Walt Disney<small>비전적 사고의 힘: 월트 디즈니로부터 배우는 교훈</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">성공한 경영자들의 공통점인 창의적 사고(Creative Thinking)는 기존의 틀을 깨고 새로운 가능성을 발견하는 핵심 동력으로, 월트 디즈니의 사례처럼 평범한 일상을 비범한 아이디어로 연결하는 능력을 말합니다. 특히 우리 뇌가 새로운 연결을 만들어내는 방식을 뜻하는 발산적 사고(Divergent Thinking)는 정해진 정답을 찾기보다 하나의 문제에서 여러 갈래의 창의적인 해결책을 떠올리는 과정을 의미해요. 이는 마치 텅 빈 도화지 위에 아무것도 그려져 있지 않더라도 스스로 자신만의 풍경을 상상해내는 것과 같은데, 이 과정을 통해 혁신적인 결과물인 개념적 발상(Conceptual Ideation)이 탄생하게 됩니다. 결국, 남들과 다르게 생각하는 힘은 단순히 머리가 좋은 것을 넘어, 보이지 않는 미래의 모습을 구체적인 이미지로 그려낼 줄 아는 능력에서 시작된다는 점을 기억하면 글을 더 깊이 있게 이해하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01성공의 공통 자질</div><ul><li>성공적인 사업가들은 대중과 다르게 생각하는 특별한 사고방식을 공유한다.</li><li>모두와 다르게 생각하는 습관 (think differently)</li><li>일반적인 통념에서 벗어난 사고 (common trait)</li><li>핵심 키워드: 성공한 사업가(successful businesspeople)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02월트 디즈니의 창의적 계기</div><ul><li>디즈니는 어린아이 같은 순수한 시각으로 세상을 바라보며 새로운 영감을 얻었다.</li><li>아이의 눈으로 세상을 보는 능력 (think like a child)</li><li>놀이공원에서 관찰을 통한 상상력의 발현 (imagination)</li><li>핵심 키워드: 월트 디즈니(Walt Disney)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03창의적 구상의 과정</div><ul><li>기존의 모델이 없는 상황에서 오직 자신의 생각만으로 새로운 개념을 설계했다.</li><li>참고할 모델의 부재 (no existing places)</li><li>자신의 머릿속에서 아이디어를 창조 (come up with ideas)</li><li>핵심 키워드: 아이디어(ideas)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04성공의 핵심 요인</div><ul><li>미래를 구체적으로 그리는 능력이 거대한 프로젝트를 현실로 만들었다.</li><li>미래를 시각화하는 능력 (picture the future)</li><li>디즈니랜드 탄생의 결정적 계기 (birth of Disneyland)</li><li>핵심 키워드: 미래 투시력(ability to picture the future)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">trait</td><td class=\"m\">특성, 특징</td></tr><tr><td class=\"w\">businessperson</td><td class=\"m\">사업가, 기업인</td></tr><tr><td class=\"w\">amusement park</td><td class=\"m\">놀이공원</td></tr><tr><td class=\"w\">merry-go-round</td><td class=\"m\">회전목마</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">imagination</td><td class=\"m\">상상력, 창의력</td></tr><tr><td class=\"w\">come up with</td><td class=\"m\">~을 생각해내다, ~을 제안하다</td></tr><tr><td class=\"w\">factor</td><td class=\"m\">요인, 요소</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 성공적인 사업가들의 한 가지 공통된 특성은</span><span class=\"en\"><b>One common trait of many successful businesspeople</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 생각하지 않는다는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">that they don’t think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 모든 사람들처럼</span><span class=\"en\"><b><span class=\"grammar-hl\">like everyone else</span>.</b></span></div></div><div class=\"lec-sent-ko\">많은 성공적인 사업가들의 한 가지 공통된 특성은 그들이 다른 모든 사람들과는 다르게 생각한다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 성공한 인물들의 공통점을 제시하며, 이 글이 남다른 사고방식을 가진 사람들의 이야기를 다룰 것임을 알려주는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is that they don’t think like everyone else (명사절(보어)): be동사의 보어 역할을 하는 that절입니다. 관계대명사 that과 달리 뒤에 주어+동사를 포함한 완전한 문장이 옵니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">trait</td><td class=\"m\">특성, 특징</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">전해진다</span><span class=\"en\"><b><span class=\"grammar-hl\">It is said</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예를 들어 월트 디즈니는</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> Walt Disney, for example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결코 생각하기를 멈추지 않았다고</span><span class=\"en\"><b>never stopped thinking</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이처럼</span><span class=\"en\"><b>like a child.</b></span></div></div><div class=\"lec-sent-ko\">예를 들면 월트 디즈니는 아이처럼 생각하는 것을 결코 멈추지 않았다고 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;남다른 사고방식&#39;의 구체적인 사례로 월트 디즈니를 등장시켜, 그의 독창성이 유년기적 호기심에서 비롯되었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is said that (가주어): 진주어 및 수동태: it(가주어) + is said(수동태: be동사+p.p.) + that절(진주어) 구조입니다. say는 타동사인데 목적어가 없어 수동구조 is said 형태로 씁니다. 기본구조: say + O (O라고 말하다).</div><div class=\"lec-gr-item\">that Walt Disney, for example, never stopped thinking like a child (명사절(진주어)): It을 대신하는 진주어 역할을 하는 that절입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 딸들을 데려가기를 좋아했다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">loved to take</span> his daughters</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동네 놀이공원으로</span><span class=\"en\"><b>to the local amusement park</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">회전목마를 태워주려고</span><span class=\"en\"><b><span class=\"grammar-hl\">to ride the merry-go-round</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 자기 딸들을 회전목마를 태워주기 위해 동네 놀이공원에 데려가기를 좋아했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 디즈니가 평소 아이들과 함께 보내던 일상의 장면을 제시하여, 그가 특별한 기획을 하게 된 배경이 매우 개인적이고 평범한 순간이었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">loved to take (to부정사): take의 목적어인 his daughters를 데려가는 동작을 목적으로 하는 명사적 용법으로, 동사 love의 목적어 역할을 합니다.</div><div class=\"lec-gr-item\">to ride the merry-go-round (to부정사): 앞의 amusement park를 수식하거나, 목적을 나타내는 부사적 용법으로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">amusement park</td><td class=\"m\">놀이공원</td></tr><tr><td class=\"w\">merry-go-round</td><td class=\"m\">회전목마</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공원에 앉아 있는 동안</span><span class=\"en\"><b><span class=\"grammar-hl\">while sitting in the park</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 자녀들이 노는 것을 지켜보는 동안,</span><span class=\"en\"><b><span class=\"grammar-hl\">and watching his children play</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 상상력이 작동하기 시작했다.</span><span class=\"en\"><b>his imagination began to work.</b></span></div></div><div class=\"lec-sent-ko\">하루는 공원에 앉아 자녀들이 노는 것을 바라보다가 그의 상상력이 발동하기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 평범한 일상을 관찰하는 디즈니의 태도가 어떻게 창의적인 생각으로 전환되는지 보여주는 사건의 발단입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">while sitting in the park and watching his children play (분사구문): while(접속사) + he(주어) + was(be동사) + sitting/watching으로 변환 가능하며, 주절의 동작과 동시에 일어나는 일을 설명합니다.</div><div class=\"lec-gr-item\">watching his children play (5형식(SVOC)): watch(지각동사) + 목적어(his children) + 목적격보어(play: 동사원형) 구조입니다. 지각동사 뒤에는 목적격 보어로 동사원형이 옵니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">imagination</td><td class=\"m\">상상력, 창의력</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 거대한 공원을 만드는 것을 상상했다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">imagined creating</span> a huge park</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즐거움을 주기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to give pleasure</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족 전체에게,</span><span class=\"en\"><b>to whole families,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 그들의 아이들에게만이 아니라</span><span class=\"en\"><b>not just to their children.</b></span></div></div><div class=\"lec-sent-ko\">그는 단지 아이들뿐 아니라 가족 전체에게 즐거움을 주는 거대한 공원을 만드는 것에 대해 상상해보았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기존의 아이들을 위한 놀이터라는 좁은 범위를 넘어, 가족 전체를 타겟으로 하는 더 큰 규모의 공간을 구상하는 확장된 사고를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">imagined creating (동명사): 동사 imagine의 목적어로 쓰인 명사적 용법입니다.</div><div class=\"lec-gr-item\">to give pleasure (to부정사): ~하기 위하여라는 의미의 부사적 용법으로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기존의 장소들은 없었다</span><span class=\"en\"><b>There were no <span class=\"grammar-hl\">existing</span> places</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이디어를 얻어올</span><span class=\"en\"><b><span class=\"grammar-hl\">to draw ideas from</span>.</b></span></div></div><div class=\"lec-sent-ko\">아이디어를 얻을 기존의 장소는 존재하지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 당시에는 참고할 만한 모델이 없었다는 점을 짚어줌으로써, 디즈니가 추진한 사업이 과거의 것을 답습하는 것이 아니라 완전히 새로운 도전이었음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">existing (현재분사): existing이 places를 수식하며 &#39;존재하는 장소들&#39;이라는 상태를 나타내는 형용사적 기능입니다.</div><div class=\"lec-gr-item\">to draw ideas from (to부정사): 앞의 명사 places를 수식하는 형용사적 용법으로, &#39;~할 장소&#39;라는 의미를 가집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서 그가 그 공원의 세부 사항들을 상상하기 시작했을 때,</span><span class=\"en\"><b>So <span class=\"grammar-hl\">when he began to imagine</span> the details of the park,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 생각해 내야 했다</span><span class=\"en\"><b>he had to come up with</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 아이디어를</span><span class=\"en\"><b>all of the ideas</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 마음으로부터</span><span class=\"en\"><b>from his mind.</b></span></div></div><div class=\"lec-sent-ko\">그래서 그가 그 공원의 세세한 부분들을 상상하기 시작했을 때, 그는 모든 아이디어를 그의 머릿속으로부터 생각해 내야 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 상황을 바탕으로, 그가 외부의 도움 없이 오직 자신의 내면에서 창의적인 설계도를 만들어냈음을 보여주는 전개입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when he began to imagine (관계부사(시간)): 시간의 때를 나타내는 when 절이며, 주어(he)와 동사(began)가 갖춰진 절이 이어집니다.</div><div class=\"lec-gr-item\">to imagine (to부정사): 동사 begin의 목적어 역할을 하는 명사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">come up with</td><td class=\"m\">~을 생각해내다, ~을 제안하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">미래를 그리는 그의 능력은</span><span class=\"en\"><b><span class=\"grammar-hl\">His ability to picture the future</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">핵심 요소였다</span><span class=\"en\"><b>was the key factor</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디즈니랜드의 탄생으로 이어진</span><span class=\"en\"><b><span class=\"grammar-hl\">that led to the birth of Disneyland</span>.</b></span></div></div><div class=\"lec-sent-ko\">그의 미래를 상상하는 능력은 디즈니랜드의 탄생을 이끌어 낸 핵심 요소였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체를 아우르는 결론으로, 단순히 생각에 그치지 않고 남다른 관점으로 미래를 설계한 능력이 실제 결과물을 만들어냈음을 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">His ability to picture the future (to부정사): ability라는 명사를 수식하는 형용사적 용법입니다.</div><div class=\"lec-gr-item\">that led to the birth of Disneyland (관계대명사): that은 주격 관계대명사로, 선행사 the key factor를 수식합니다. 뒤에 주어가 없는 불완전한 문장(led to...)이 옵니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">factor</td><td class=\"m\">요인, 요소</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>성공한 사업가들은 남들과 다르게 생각하는 공통적인 특징이 있다.</li><li>월트 디즈니는 일상에서 아이처럼 생각하며 기존에 없던 거대한 공원을 구상했다.</li><li>참고할 모델이 없는 상황에서 그는 오직 자신의 상상력을 바탕으로 디즈니랜드를 설계했다.</li><li>미래를 구체적으로 그리는 능력이 혁신적인 결과를 만드는 핵심 원동력이 되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Walt Disney revolutionized the entertainment industry by applying a child-like perspective, and his unique ability to envision the future laid the foundation for Disneyland.</div>\n              <div class=\"lec-final-sum-ko\">월트 디즈니는 어린아이와 같은 관점을 적용하여 엔터테인먼트 산업에 혁신을 일으켰으며, 미래를 그리는 그의 독특한 능력은 디즈니랜드의 토대가 되었다.</div></div></div>"],"segs":[[{"audio":"./apply02_audio/1.mp3","hl":null}],[{"audio":"./apply02_audio/2.mp3","hl":null}],[{"audio":"./apply02_audio/3.mp3","hl":null},{"audio":"./apply02_audio/4.mp3","hl":"stage-0"},{"audio":"./apply02_audio/5.mp3","hl":"stage-1"},{"audio":"./apply02_audio/6.mp3","hl":"stage-2"},{"audio":"./apply02_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply02_audio/8.mp3","hl":null}],[{"audio":"./apply02_audio/9.mp3","hl":"main"},{"audio":"./apply02_audio/10.mp3","hl":"meaning"},{"audio":"./apply02_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/12.mp3","hl":"main"},{"audio":"./apply02_audio/13.mp3","hl":"meaning"},{"audio":"./apply02_audio/14.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/15.mp3","hl":"main"},{"audio":"./apply02_audio/16.mp3","hl":"meaning"},{"audio":"./apply02_audio/17.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/18.mp3","hl":"main"},{"audio":"./apply02_audio/19.mp3","hl":"meaning"},{"audio":"./apply02_audio/20.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/21.mp3","hl":"main"},{"audio":"./apply02_audio/22.mp3","hl":"meaning"},{"audio":"./apply02_audio/23.mp3","hl":"grammar"}],[
