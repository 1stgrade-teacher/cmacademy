9IOT9Mcf4+/6fjxheufrx0/Pqe/Tj+XLQ6Hgso+pGMdu3X1z9PqGQAE5XH+97gYz3xjHP5A0AO/lz/h/n6UfrTd64ySuc4+8OD0xxnrn6+3JoZgo7ZP8AtDGSOnTpxgt26Y4pX26Xt081p879l+Ad/LRjiD75HrnHtkUD3/H/ADz/AFpFYEDJHHBwQfU9eB/Lr044TcvIyBj3HfoR/KmA72+hz/n/ACPxprEbW5HTuRnkdccZHc98evWk3KOpQgKMfMOT1Ix+A4GOo75w0jAf5QTkkfNnGcnHPp2+XtxgdDbXp8rW/KwH/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Traffic Calming: Making Driving Difficult to Encourage Public Transport<small>교통 정온화: 대중교통 이용을 장려하기 위해 운전을 어렵게 만들기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">도시 계획의 새로운 흐름인 교통 정온화(Traffic Calming)는 단순히 차를 막는 것이 아니라, 운전자가 스스로 속도를 줄이도록 도로 환경을 설계하는 심리학적 접근 방식을 담고 있습니다. 마치 좁은 골목길에 들어섰을 때 본능적으로 속도를 늦추게 되는 것처럼, 도로의 폭을 줄이거나 굴곡을 만드는 등 물리적인 장치를 통해 운전자에게 심리적 압박을 주어 안전한 속도를 유지하게 만드는 것이죠. 이는 도시가 자동차 중심이 아닌 보행자 중심으로 변화해야 한다는 도시 재생의 핵심 개념으로, &#39;유도된 수요(Induced Demand)&#39; 이론에 반대되는 성격을 띱니다. 즉, 도로를 넓히면 오히려 차가 더 몰린다는 역설을 깨고, 오히려 불편함을 조성함으로써 지속 가능한 이동 수단으로의 전환을 유도하려는 고도의 전략인 셈입니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제 상황 인식</div><ul><li>한국의 대도시들은 심각한 교통 정체 문제를 겪고 있으며 이를 해결하기 위한 전통적인 방식을 택하고 있다.</li><li>주요 현상: 교통 정체 (traffic jams)</li><li>기존 해결책: 도로 확장 및 신설 (making roads wider, building new roads)</li><li>핵심 키워드: 교통 체증(traffic jams), 도시 계획가(city planners)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02유럽의 새로운 접근법</div><ul><li>유럽의 도시 계획가들은 운전의 편의를 낮추는 역발상적인 접근을 시도하고 있다.</li><li>전략 방향: 운전 환경을 어렵게 만듦</li><li>구체적 방법: 차선 축소, 속도 제한 강화, 과속 방지턱 설치</li><li>핵심 키워드: 교통 정온화(traffic calming)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03운전 환경 제어 기법</div><ul><li>운전자의 시야를 제한하고 도로 환경을 변화시켜 서행을 유도한다.</li><li>도로 구조 변경: 도로에 굴곡(bends) 만들기</li><li>시야 제한: 나무(trees)를 심어 전방 시야 확보 방해</li><li>핵심 키워드: 서행(slow down), 시야 제한(limited visibility)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04프로그램의 목적</div><ul><li>운전을 불편하게 함으로써 사람들이 대중교통이나 다른 이동 수단을 선택하게 유도한다.</li><li>최종 목표: 자가용 이용 감소 및 대중교통 전환</li><li>대안적 이동 방식: 버스 이용, 걷기(walking), 자전거 타기(biking)</li><li>핵심 키워드: 대중교통(public transportation), 이용 전환(leave their cars at home)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">suffer from</td><td class=\"m\">~으로 고통받다, ~을 겪다</td></tr><tr><td class=\"w\">traffic jam</td><td class=\"m\">교통 체증, 혼잡</td></tr><tr><td class=\"w\">meet the needs of</td><td class=\"m\">~의 요구를 충족시키다, ~의 필요를 만족시키다</td></tr><tr><td class=\"w\">city planner</td><td class=\"m\">도시 계획가</td></tr><tr><td class=\"w\">speed limit</td><td class=\"m\">속도 제한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">speed bump</td><td class=\"m\">과속 방지턱</td></tr><tr><td class=\"w\">slow down</td><td class=\"m\">속도를 줄이다, 완화하다</td></tr><tr><td class=\"w\">far ahead</td><td class=\"m\">훨씬 앞쪽에, 멀리 앞을</td></tr><tr><td class=\"w\">traffic calming</td><td class=\"m\">교통 완화(정책)</td></tr><tr><td class=\"w\">take steps</td><td class=\"m\">조치를 취하다, 단계를 밟다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한국의 대도시들은 대부분</span><span class=\"en\"><b><span class=\"grammar-hl\">Most big cities</span> in Korea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교통 체증을 겪는다.</span><span class=\"en\"><b>suffer from traffic jams.</b></span></div></div><div class=\"lec-sent-ko\">한국의 대도시들은 대부분 교통 체증을 겪는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 교통 문제가 현대 도시가 공통으로 겪고 있는 심각한 현안임을 제시하며 독자의 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Most big cities (주어): 문장의 주체로서, 형용사구(Most big)의 수식을 받는 명사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">suffer from</td><td class=\"m\">~으로 고통받다, ~을 겪다</td></tr><tr><td class=\"w\">traffic jam</td><td class=\"m\">교통 체증, 혼잡</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">늘어나는 교통량에 대처하려고</span><span class=\"en\"><b><span class=\"grammar-hl\">To meet the needs of drivers</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도시 설계자들은</span><span class=\"en\"><b>city planners</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도로를 더 넓히고</span><span class=\"en\"><b><span class=\"grammar-hl\">are making roads wider</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 도로를 만든다.</span><span class=\"en\"><b><span class=\"grammar-hl\">and building new roads</span>.</b></span></div></div><div class=\"lec-sent-ko\">늘어나는 교통량에 대처하려고 도시 설계자들은 도로를 더 넓히고 새로운 도로를 만든다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 교통 문제를 해결하기 위해 전통적으로 시행해 온 방법, 즉 공급 중심의 정책을 예시로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To meet the needs of drivers (to부정사): 문장 전체를 수식하는 부사적 용법으로, 목적(~하기 위해서)을 나타낸다.</div><div class=\"lec-gr-item\">are making roads wider and building new roads (5형식(SVOC)): make+O+C(목적보어) 구조이다. roads가 목적어, wider가 목적보어(형용사)로 쓰여 도로를 더 넓게 만드는 동작을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">meet the needs of</td><td class=\"m\">~의 요구를 충족시키다, ~의 필요를 만족시키다</td></tr><tr><td class=\"w\">city planner</td><td class=\"m\">도시 계획가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 유럽의 도시 설계자들은,</span><span class=\"en\"><b>Many European city planners,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나,</span><span class=\"en\"><b>however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">믿는다</span><span class=\"en\"><b>believe</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">운전을 더 쉽게 만드는 것이</span><span class=\"en\"><b>that <span class=\"grammar-hl\">to make driving easier</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 생각이 아니라고</span><span class=\"en\"><b>is not a good idea.</b></span></div></div><div class=\"lec-sent-ko\">그러나 유럽의 도시 설계자들은 운전을 더 쉽게 만드는 것이 좋은 생각이 아니라고 믿는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 해결책에 대해 반대 의견을 제시하며, 문제 해결의 관점이 완전히 전환되는 지점임을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to make driving easier (to부정사): 문장의 주어 역할을 하는 명사적 용법이다. 또한 make+O+C(5형식) 구조를 포함하고 있으며, driving이 목적어, easier가 목적보어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">city planner</td><td class=\"m\">도시 계획가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">유럽의 도시들은</span><span class=\"en\"><b>Cities there</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도로를 더 좁게 만들고,</span><span class=\"en\"><b>are <span class=\"grammar-hl\">making roads narrower</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제한속도를 낮추고,</span><span class=\"en\"><b>lowering speed limits,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도로에 과속방지턱을 만들어</span><span class=\"en\"><b>and building speed bumps in the roads</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">차들이 속도를 줄이도록 하고 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">to make cars slow down</span>.</b></span></div></div><div class=\"lec-sent-ko\">유럽의 도시들은 도로를 더 좁게 만들고, 제한속도를 낮추고, 도로에 과속방지턱을 만들어 차들이 속도를 줄이도록 하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에서 언급한 새로운 철학을 구체적으로 어떻게 실천하는지 보여주는 상세 사례입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">making roads narrower (5형식(SVOC)): 현재진행형(are making)의 일부이며, make+O+C 구조로 roads가 목적어, narrower가 목적보어이다.</div><div class=\"lec-gr-item\">to make cars slow down (to부정사): 목적(~하기 위해서)을 나타내는 부사적 용법이다. 내부적으로 make+O+C(동사원형)인 5형식 사역동사 구조를 취하고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">speed limit</td><td class=\"m\">속도 제한</td></tr><tr><td class=\"w\">speed bump</td><td class=\"m\">과속 방지턱</td></tr><tr><td class=\"w\">slow down</td><td class=\"m\">속도를 줄이다, 완화하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 도시는</span><span class=\"en\"><b>Some cities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 길에 굴곡을 만들고</span><span class=\"en\"><b>are even putting bends in road</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나무를 심고 있다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">planting trees</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">운전자들이 전방을 멀리 볼 수 없도록</span><span class=\"en\"><b>so drivers cannot see very far ahead.</b></span></div></div><div class=\"lec-sent-ko\">어떤 도시는 심지어 운전자들이 전방을 멀리 볼 수 없도록 길에 굴곡을 만들고 나무를 심고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장의 사례를 확장하여, 운전자의 시야를 제한하는 심리적·물리적 환경 조성까지 포함하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">planting trees (현재분사): 문장 내에서 진행되는 동작을 나열하는 병렬 구조의 일부로, putting과 함께 현재진행(are putting/planting)의 의미를 구성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">far ahead</td><td class=\"m\">훨씬 앞쪽에, 멀리 앞을</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 노력들은 모두</span><span class=\"en\"><b>All of these efforts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 프로그램의 일환이다</span><span class=\"en\"><b>are part of a new program</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“교통 진정시키기(차량 운행 억제)”라고 하는</span><span class=\"en\"><b><span class=\"grammar-hl\">called “traffic calming.”</span></b></span></div></div><div class=\"lec-sent-ko\">이러한 노력들은 모두 “교통 진정시키기(차량 운행 억제)”라고 하는 새로운 프로그램의 일환이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 나열한 일련의 조치들을 하나의 개념으로 묶어 정리하며 전문 용어를 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">called “traffic calming.” (과거분사): 명사(program)를 수식하는 형용사적 용법이다. &#39;program that is called ~&#39;에서 주격 관계대명사와 be동사가 생략된 축약 구조로, 수식받는 명사(program) 입장에서 ~라고 불리는이라는 의미를 가진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">traffic calming</td><td class=\"m\">교통 완화(정책)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 프로그램의 요지는</span><span class=\"en\"><b>The main idea of this program</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">운전하는 것을 더 어렵게 만드는 것이다.</span><span class=\"en\"><b>is <span class=\"grammar-hl\">to make driving more difficult</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 프로그램의 요지는 운전하는 것을 더 어렵게 만드는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 교통 정온화의 본질적인 목표를 명확히 밝히며, 왜 도로를 좁히고 시야를 가리는지 그 이유를 요약합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to make driving more difficult (to부정사): 주어(The main idea)를 보충 설명하는 보어 역할을 하는 명사적 용법이다. 또한 make+O+C(5형식) 구조를 포함한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">도시 설계자들은</span><span class=\"en\"><b>City planners</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기대한다</span><span class=\"en\"><b>hope</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 조치를 취함으로써</span><span class=\"en\"><b>that <span class=\"grammar-hl\">by taking these steps</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더욱 더 많은 운전자들이</span><span class=\"en\"><b>more and more drivers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">차를 집에 두고</span><span class=\"en\"><b>will leave their cars at home</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">버스를 타거나 걸어서, 혹은 자전거를 타고 출근하는 쪽을 택하기를.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">decide to take a bus</span>, walk, or bike to work.</b></span></div></div><div class=\"lec-sent-ko\">도시 설계자들은 이러한 조치를 취함으로써 더욱 더 많은 운전자들이 차를 집에 두고 버스를 타거나 걸어서, 혹은 자전거를 타고 출근하는 쪽을 택하기를 기대한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 정책이 도달하고자 하는 최종 목적을 서술하며, 개인의 행동 변화를 통해 도시 전체의 교통 흐름을 바꾸려는 계획을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">by taking these steps (동명사): 전치사 by의 목적어로 쓰여 수단(~함으로써)을 나타내는 명사적 용법이다.</div><div class=\"lec-gr-item\">decide to take a bus (to부정사): 타동사 decide의 목적어 역할을 하는 명사적 용법이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">city planner</td><td class=\"m\">도시 계획가</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>한국을 포함한 많은 도시는 교통 체증 문제를 겪고 있다.</li><li>과거에는 도로를 넓히는 방식으로 문제를 해결하려 했다.</li><li>유럽에서는 운전을 오히려 불편하게 만들어 차량 이용을 줄이는 &#39;교통 정온화&#39; 정책을 펼친다.</li><li>운전을 어렵게 함으로써 대중교통 이용이나 걷기 등 대체 수단으로의 전환을 유도하고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Cities implement traffic calming measures to discourage driving, and they hope these efforts will lead people to choose walking or public transit over cars.</div>\n              <div class=\"lec-final-sum-ko\">도시들은 운전을 억제하기 위해 교통 정온화 조치를 시행하며, 이러한 노력을 통해 사람들이 자동차 대신 도보나 대중교통을 선택하기를 기대한다.</div></div></div>"],"segs":[[{"audio":"./apply03_audio/1.mp3","hl":null}],[{"audio":"./apply03_audio/2.mp3","hl":null}],[{"audio":"./apply03_audio/3.mp3","hl":null},{"audio":"./apply03_audio/4.mp3","hl":"stage-0"},{"audio":"./apply03_audio/5.mp3","hl":"stage-1"},{"audio":"./apply03_audio/6.mp3","hl":"stage-2"},{"audio":"./apply03_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply03_audio/8.mp3","hl":null}],[{"audio":"./apply03_audio/9.mp3","hl":"main"},{"audio":"./apply03_audio/10.mp3","hl":"meaning"},{"audio":"./apply03_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/12.mp3","hl":"main"},{"audio":"./apply03_audio/13.mp3","hl":"meaning"},{"audio":"./apply03_audio/14.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/15.mp3","hl":"main"},{"audio":"./apply03_audio/16.mp3","hl":"meaning"},{"audio":"./apply03_audio/17.mp3","hl":"grammar"}],[{"audio":"./ap
