  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

}
lecturePlayer(document.getElementById("app"),{"brand":"to-v의 기본 역할","title":"중학 영문법 마스터: to-v의 기본 역할","audioDir":"lecture_audio","preview":false,"count":23,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">07강 to-v의 기본 역할\u003c/div>\u003ch1>중학 영문법 마스터: to-v의 기본 역할\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>문장에서 명사, 형용사, 부사 역할을 하는 to-v의 쓰임을 정확히 이해하고 구별한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 to에 동사원형을 붙인 to-v가 문장에서 어떤 멋진 역할을 하는지 함께 알아볼 거예요. to-v는 명사처럼 주어나 목적어로 쓰이기도 하고, 명사를 꾸며주는 형용사나 다양한 뜻을 더해주는 부사로도 아주 많이 쓰이거든요. 오늘 수업을 열심히 들으면 복잡한 문장도 to-v 덩어리를 척척 찾아내며 쉽게 이해할 수 있을 거예요. 자, 그럼 첫 번째 개념부터 차근차근 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">A. 명사 역할\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">to-v가 \u003cb class=\"key\">명사\u003c/b> 역할을 할 때는 문장에서 \u003cb class=\"key\">주어\u003c/b>, \u003cb class=\"key\">목적어\u003c/b>, be동사의 \u003cb class=\"key\">보어\u003c/b> 자리에 와서 v하는 것 또는 v하기로 해석돼요.\u003cdiv>\u003cspan class=\"g-formula\">to + 동사원형 = ~하는 것, ~하기\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">To drive fast at night\u003c/span> is dangerous.\u003c/div>\u003cdiv class=\"g-ko\">밤에 빨리 차를 모는 것은 위험하다.\u003c/div>\u003cdiv class=\"g-note\">문장의 주어 자리에 온 명사적 용법\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">My father refused \u003cspan class=\"fx\">to buy me a pet cat\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">아빠는 내게 애완 고양이를 사주기를 거절하셨다.\u003c/div>\u003cdiv class=\"g-note\">refused의 목적어 자리에 온 명사적 용법\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">My goal is \u003cspan class=\"fx\">to compete in the Boston Marathon\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">내 목표는 보스턴 마라톤 대회에 출전하는 것이다.\u003c/div>\u003cdiv class=\"g-note\">be동사 뒤의 보어 자리에 온 명사적 용법\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>의문사 뒤에 to-v가 오면 \u003cb class=\"key\">의문사 + to-v\u003c/b> 형태로 명사 역할을 하며 무엇을 v할지 등으로 해석해요.\u003c/div>","segs":[{"n":2,"text":"첫 번째로 볼 내용은 to-v의 명사 역할이에요. to-v가 명사처럼 문장 속에서 주어나 목적어 그리고 be동사 뒤의 보어 자리에 들어가면 v하는 것이나 v하기로 해석된답니다. 문장에서 어디가 to-v 덩어리이고 어떤 자리에 쓰였는지 그 자리를 정확히 확인하는 것이 중요해요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 같이 볼까요. To drive fast at night is dangerous.는 밤에 빨리 차를 모는 것은 위험하다라는 뜻이에요. 문장 맨 앞에서 주어 역할을 하고 있답니다.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. My father refused to buy me a pet cat.은 아빠는 내게 애완 고양이를 사주기를 거절하셨다라는 뜻이죠. 이번에는 동사 뒤에서 목적어 자리를 차지하고 있어요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문을 볼게요. My goal is to compete in the Boston Marathon.은 내 목표는 보스턴 마라톤 대회에 출전하는 것이다라는 뜻이에요. be동사 뒤에서 주어인 내 목표를 보충해 주는 보어 역할을 하고 있어요.","hl":"ex-2"},{"n":6,"text":"여기서 잠깐 팁을 줄게요. I could not decide whether to accept the offer나 The problem was where to set up the tent처럼 의문사 뒤에 to-v가 오면 무엇을 v할지나 어디서 v할지 등으로 해석되면서 명사 역할을 아주 톡톡히 해낸답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">B. 형용사 역할\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">to-v가 \u003cb class=\"key\">형용사\u003c/b> 역할을 할 때는 \u003cb class=\"key\">명사\u003c/b>의 바로 뒤에서 앞의 명사를 수식하여 v할 또는 v한으로 해석해요.\u003cdiv>\u003cspan class=\"g-formula\">명사 + to-v = ~할 / ~한 명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I have no friends \u003cspan class=\"fx\">to help me\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나를 도와줄 친구가 없다.\u003c/div>\u003cdiv class=\"g-note\">명사 friends를 뒤에서 수식\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She has a special ability \u003cspan class=\"fx\">to memorize numbers\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 숫자를 기억하는 특별한 능력이 있다.\u003c/div>\u003cdiv class=\"g-note\">명사 ability를 뒤에서 수식\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>특히 주어를 수식하는 경우 어디까지가 \u003cb class=\"key\">to-v 의미덩어리\u003c/b>인지 구분해야 문장 전체의 \u003cb class=\"key\">주어와 동사\u003c/b>를 볼 수 있어요.\u003c/div>","segs":[{"n":7,"text":"두 번째로 볼 내용은 to-v의 형용사 역할이에요. 형용사 역할을 하는 to-v는 언제나 명사의 뒤에서 명사를 꾸며주면서 v할이나 v한으로 해석된답니다.","hl":"rule"},{"n":8,"text":"첫 번째 예문을 읽어 볼게요. I have no friends to help me.는 나를 도와줄 친구가 없다라는 뜻이에요. 뒤에 있는 to help me가 앞의 명사인 friends를 꾸며주고 있죠.","hl":"ex-0"},{"n":9,"text":"두 번째 예문이에요. She has a special ability to memorize numbers.는 그녀는 숫자를 기억하는 특별한 능력이 있다라는 뜻이에요. to memorize numbers가 ability라는 명사를 꾸며주며 어떤 능력인지 설명해 주고 있어요.","hl":"ex-1"},{"n":10,"text":"여기서 정말 중요한 팁이 있어요. Their offer to rebuild the town was not accepted처럼 to-v가 주어 바로 뒤에서 주어를 꾸밀 때는 어디까지가 to-v 덩어리인지 정확히 끊어봐야 문장 전체의 진짜 동사를 찾을 수 있답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">C. 부사 역할\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">to-v가 \u003cb class=\"key\">부사\u003c/b> 역할을 할 때는 \u003cb class=\"key\">목적\u003c/b>, \u003cb class=\"key\">이유\u003c/b>, \u003cb class=\"key\">정도\u003c/b> 등의 부가적인 의미를 나타내요.\u003cdiv>\u003cspan class=\"g-formula\">v하기 위해, v해서, v하기에 등\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He stood up \u003cspan class=\"fx\">to see the game better\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 그는 경기를 더 잘 보기 위해 일어섰다.\u003c/div>\u003cdiv class=\"g-note\">목적을 나타내는 부사적 용법\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She is not old \u003cspan class=\"fx\">enough to get married\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 결혼하기에 충분한 나이가 아니다.\u003c/div>\u003cdiv class=\"g-note\">정도를 나타내는 부사적 용법\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>너무 위험해서 할 수 없다는 의미의 \u003cb class=\"key\">too ~ to-v\u003c/b> 구문과 충분히 뭐뭐하다는 \u003cb class=\"key\">enough to-v\u003c/b> 구문을 잘 기억해 두세요.\u003c/div>","segs":[{"n":11,"text":"세 번째는 to-v의 부사 역할이에요. 부사 역할을 하는 to-v는 무언가를 하기 위해서라는 목적이나 그렇게 해서라는 이유, 혹은 뭐뭐하기에 너무하다는 정도 같은 다양한 의미를 문장에 더해준답니다.","hl":"rule"},{"n":12,"text":"첫 번째 예문을 같이 볼까요. He stood up to see the game better.는 그는 경기를 더 잘 보기 위해 일어섰다라는 뜻이에요. 일어선 목적이 경기를 더 잘 보기 위해서인 거죠.","hl":"ex-0"},{"n":13,"text":"두 번째 예문이에요. She is not old enough to get married.는 그녀는 고작 열여섯 살이라 결혼하기에 충분한 나이가 아니다라는 뜻이에요. 정도를 나타내는 표현으로 쓰였어요.","hl":"ex-1"},{"n":14,"text":"주의할 점으로 This machine is too dangerous for children to use처럼 too 형용사 부사 to-v가 나오면 너무 뭐뭐해서 뭐뭐할 수 없다라고 해석해야 한다는 걸 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I want to eating pizza.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I want to eat pizza.\u003c/div>\u003cdiv class=\"g-why\">to 뒤에는 동사원형이 와야 하므로 동명사 형태인 eating이 아니라 eat을 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She got up early see the sunrise.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She got up early to see the sunrise.\u003c/div>\u003cdiv class=\"g-why\">목적을 나타내어 뭐뭐하기 위해서라고 할 때는 동사 앞에 반드시 to를 붙여야 해요.\u003c/div>\u003c/div>","segs":[{"n":15,"text":"학생들이 정말 자주 하는 실수예요. I want to eating pizza라고 쓰면 안 돼요. to 뒤에는 항상 동사원형이 와야 하니까 eating을 eat으로 바꿔서 I want to eat pizza라고 써야 올바른 문장이 된답니다.","hl":"mk-0"},{"n":16,"text":"두 번째로 자주 틀리는 실수예요. She got up early see the sunrise라고 하면 동사가 나란히 두 개 나와서 틀려요. 뭐뭐하기 위해서라는 목적을 나타낼 때는 see 앞에 to를 꼭 붙여서 to see라고 써야 맞아요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 2\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 밑줄 친 to-v의 쓰임이 나머지와 다른 하나를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">① I want to learn English.\n② My dream is to travel around the world.\n③ She went to the library to read books.\n④ I decided to buy a new smartphone.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>I want to learn English.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>My dream is to travel around the world.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>She went to the library to read books.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>I decided to buy a new smartphone.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">She went to the library to read books.\u003c/span>\u003cdiv class=\"g-exp\">①, ②, ④번의 to-v는 각각 목적어와 보어 자리에 쓰인 명사적 용법이지만, ③번의 to read는 도서관에 간 목적을 나타내는 부사적 용법이다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"첫 번째 문제를 함께 풀어 볼게요. 다음 보기 중에서 밑줄 친 to-v의 쓰임이 나머지 넷과 다른 하나를 찾는 문제예요. 화면에 나오는 네 개의 문장을 잘 읽어보고 잠시 멈춘 뒤에 정답을 직접 골라보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":6},{"n":19,"text":"정답은 세 번째 보기에요. 첫 번째와 두 번째 그리고 네 번째 문장의 to-v는 모두 명사처럼 목적어나 보어 자리에 쓰였지만, 세 번째 문장의 to read는 도서관에 간 목적을 나타내는 부사적 용법이기 때문에 정답이 된답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 2\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 알맞은 말을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">This box is ________ heavy for the little boy to carry.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>so\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>too\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>very\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>enough\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">too\u003c/span>\u003cdiv class=\"g-exp\">뒤에 이어지는 to부용사와 함께 쓰여 너무 뭐뭐해서 뭐뭐할 수 없다는 의미를 만드는 표현은 too이다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"두 번째 문제를 볼까요. This box is blank heavy for the little boy to carry라는 문장이에요. 빈칸에 들어가서 뒤의 to carry와 짝을 이루는 알맞은 단어를 보기에서 골라보세요. 잠시 화면을 멈추고 정답을 생각해보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 두 번째 보기인 too예요. too 형용사 부사 그리고 for 의미상의 주어 to-v 구문은 너무 뭐뭐해서 뭐뭐할 수 없다라는 의미를 나타내기 때문에 이 자리에 너무 안성맞춤이죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">07강 to-v의 기본 역할\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>오늘 우리는 to에 동사원형을 붙인 \u003cb class=\"key\">to-v\u003c/b>가 문장에서 어떤 역할을 하는지 배웠어요.\u003c/li>\u003cli>\u003cb class=\"key\">명사\u003c/b> 역할로는 주어, 목적어, 보어 자리에서 ~하는 것으로 해석되고요.\u003c/li>\u003cli>\u003cb class=\"key\">형용사\u003c/b> 역할로는 명사 뒤에서 앞의 명사를 꾸며주며 ~할로 해석돼요.\u003c/li>\u003cli>\u003cb class=\"key\">부사\u003c/b> 역할로는 목적, 이유, 정도 등을 나타내며 ~하기 위해 등으로 쓰인다는 것을 꼭 기억하세요.\u003c/li>\u003c/ul>","segs":[{"n":23,"text":"오늘 수업은 여기까지예요. 오늘 배운 to-v의 명사, 형용사, 부사 역할을 머릿속으로 깔끔하게 정리해 보세요. 각각의 자리에 따라 어떻게 해석되고 쓰이는지 알면 영문법이 훨씬 더 재밌어질 거예요. 모두 수고 많았고 다음 시간에 또 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
