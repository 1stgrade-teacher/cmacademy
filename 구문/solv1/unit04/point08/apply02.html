yQp4zkEbT14Y+/Q5GaTocEj0ABHXOMZzjj9PelKlcjHTP06bjz06c/Q5xVprulbXdWSX6CctLK7fS19tLyv8Agmk9V2tf/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Why Schools Should Start Later: Prioritizing Teenagers&#39; Health and Academic Success<small>학교 시작 시간을 늦춰야 하는 이유: 청소년의 건강과 학업 성공을 우선시하기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">청소년기 수면 부족 문제를 이해하기 위해서는 먼저 우리 뇌의 시계라 불리는 일주기 리듬(Circadian rhythm)에 대해 알아야 합니다. 사춘기가 되면 신체적 변화로 인해 멜라토닌 분비 시간이 늦춰지며 자연스럽게 늦게 자고 늦게 일어나는 상태가 되는데, 이를 사회적 시차(Social jetlag)라고 합니다. 이는 마치 매일 밤 비행기를 타고 시차가 다른 국가로 이동하는 것처럼 뇌가 만성적인 수면 부족(Chronic sleep deprivation) 상태에 빠지게 만드는 현상이죠. 우리 몸은 생물학적으로 밤 11시가 넘어야 졸음이 오도록 설계되어 있는데, 이른 아침 등교 시간은 청소년의 생체 리듬(Biological clock)과 정면으로 충돌하는 셈입니다. 따라서 이 글은 단순히 잠을 자고 싶어 하는 학생들의 투정이 아니라, 신체적 발달 단계와 사회적 제도 사이의 불균형이 청소년의 건강과 학업에 미치는 심각한 영향에 대해 다루고 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01잘못된 통념</div><ul><li>청소년은 성장할수록 적은 수면으로도 충분하다는 잘못된 믿음이 존재한다.</li><li>청소년기 수면 필요량 감소 오해 (less sleep)</li><li>하루 6시간 수면이면 충분하다는 인식</li><li>이른 등교 시간(early start) 설정의 근거로 활용됨</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02의학적 경고</div><ul><li>전문가들은 현재의 등교 시간이 청소년의 건강과 학업을 저해한다고 경고한다.</li><li>권장 수면 시간: 8시간 30분 (eight and a half hours)</li><li>부족한 수면으로 인한 오전 수업 집중력 저하 (snooze)</li><li>학업 성취도(poor grades) 악화 문제 발생</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03해결책 촉구</div><ul><li>의료계는 학생들의 건강한 수면 환경을 위해 정부 차원의 개입을 요구하고 있다.</li><li>등교 시간 조정(move back starting times)을 위한 정부 개입 요구</li><li>충분한 휴식(enough rest)을 통한 학생들의 학업 능력 향상 기대</li><li>핵심 키워드: 수면 부족(sleep deprivation), 등교 시간(starting times)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get older</td><td class=\"m\">나이가 들다, 성장하다</td></tr><tr><td class=\"w\">at risk</td><td class=\"m\">위험에 처한, 위태로운</td></tr><tr><td class=\"w\">rarely</td><td class=\"m\">좀처럼 ~않는, 드물게</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~로 인한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">snooze</td><td class=\"m\">졸다, 잠깐 자다</td></tr><tr><td class=\"w\">end up</td><td class=\"m\">결국 ~하게 되다</td></tr><tr><td class=\"w\">take steps</td><td class=\"m\">조치를 취하다</td></tr><tr><td class=\"w\">move back</td><td class=\"m\">(시간을) 뒤로 미루다, 늦추다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 믿는다</span><span class=\"en\"><b>People <span class=\"grammar-hl\">believe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">십 대들이 더 적은 잠을 필요로 한다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that teenagers need</span> less sleep</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 나이가 들면서</span><span class=\"en\"><b>as they get older.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 청소년들이 커가면서 잠이 덜 필요하다고 생각한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 십 대의 수면 시간에 관해 사회적으로 널리 퍼진 일반적인 통념을 제시하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">believe that teenagers need (명사절): that절이 believe의 목적어 역할을 하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get older</td><td class=\"m\">나이가 들다, 성장하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일부는 심지어 생각한다</span><span class=\"en\"><b>Some even <span class=\"grammar-hl\">think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하룻밤에 6시간의 잠이</span><span class=\"en\"><b><span class=\"grammar-hl\">that six hours of sleep a night</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">십 대들에게는 충분하다고</span><span class=\"en\"><b><span class=\"grammar-hl\">is enough</span> for teenagers.</b></span></div></div><div class=\"lec-sent-ko\">심지어 청소년들이 밤에 6시간만 자면 충분하다고 생각하는 이들도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 막연한 믿음을 구체적인 수치로 확장하여, 십 대에게 수면이 부족해도 괜찮다는 인식이 얼마나 깊은지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">think that six hours of sleep a night is enough (명사절): that절이 think의 목적어 역할을 하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 믿음은 많은 학교가 만들게 했다</span><span class=\"en\"><b>This belief has <span class=\"grammar-hl\">led many schools</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 수업을 일정을 잡도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to schedule</span> their classes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">7시 30분이나 그보다 더 일찍 시작하는</span><span class=\"en\"><b>to start at 7:30 or earlier</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아침에</span><span class=\"en\"><b>in the morning.</b></span></div></div><div class=\"lec-sent-ko\">이러한 믿음이 많은 학교에서 수업을 아침 7시 30분이나 그보다 일찍 시작하도록 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 잘못된 통념이 실제 교육 현장의 제도와 시간표 운영에 어떠한 영향을 미쳤는지 그 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">led many schools to schedule (5형식(SVOC)): lead(S) + many schools(O) + to schedule(OC, to부정사) 구조로, 목적어가 목적보어(to부정사)하도록 이끌다라는 의미입니다.</div><div class=\"lec-gr-item\">to schedule their classes to start (5형식(SVOC)): schedule(S) + their classes(O) + to start(OC, to부정사) 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나, 의사들은 경고한다</span><span class=\"en\"><b>However, doctors <span class=\"grammar-hl\">warn</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 사회가 십 대들의 건강과 교육을 두고 있다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that our society is putting</span> teenagers’ health and education</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위험에</span><span class=\"en\"><b>at risk.</b></span></div></div><div class=\"lec-sent-ko\">그러나 의사들은 우리 사회가 청소년들의 건강과 교육을 위험에 빠뜨리고 있다고 경고한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞까지의 통념과 그에 따른 학교의 관행을 정면으로 반박하며, 의학적 관점에서 문제의 심각성을 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">warn that our society is putting (명사절): that절이 warn의 목적어 역할을 하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at risk</td><td class=\"m\">위험에 처한, 위태로운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 전문가에 따르면,</span><span class=\"en\"><b>According to one expert,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“십 대들은 8시간 30분의 잠이 필요하다</span><span class=\"en\"><b>“Teenagers <span class=\"grammar-hl\">need eight and a half hours</span> of sleep</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일 밤,</span><span class=\"en\"><b>each night,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그들은 거의 그렇게 많이 자지 못한다</span><span class=\"en\"><b>but they rarely get that much</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이른 학교 시작 시간 때문에.</span><span class=\"en\"><b>due to early school starting times.</b></span></div></div><div class=\"lec-sent-ko\">한 전문가에 따르면, “청소년들은 매일 8시간 30분씩 자야 하는데, 수업 시작 시간이 빨라 거의 그렇게 자지 못한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전문가의 소견을 인용하여 의사들이 주장하는 문제의 구체적인 근거를 제시하고, 등교 시간과 수면 부족 사이의 연결고리를 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">need eight and a half hours 기본 문장 구조: S+V+O의 3형식 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rarely</td><td class=\"m\">좀처럼 ~않는, 드물게</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~로 인한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서 그들은 아침 수업 시간 내내 졸게 되고</span><span class=\"en\"><b>So they <span class=\"grammar-hl\">snooze through their morning classes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결국 좋지 않은 성적을 받게 된다.”</span><span class=\"en\"><b>and <span class=\"grammar-hl\">end up getting</span> poor grades.”</b></span></div></div><div class=\"lec-sent-ko\">그래서 아침 시간 내내 졸고 결국 좋지 않은 성적을 거두게 된다.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 수면 부족이 학생들의 학습 태도와 학업 성취도라는 실제 결과에 어떻게 부정적인 영향을 미치는지를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">snooze through their morning classes (관용표현): snooze through는 &#39;~를 졸면서 보내다&#39;라는 의미의 숙어입니다.</div><div class=\"lec-gr-item\">end up getting (관용표현): end up + -ing는 &#39;결국 ~하게 되다&#39;라는 뜻의 동명사 관용 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">snooze</td><td class=\"m\">졸다, 잠깐 자다</td></tr><tr><td class=\"w\">end up</td><td class=\"m\">결국 ~하게 되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제 의사들은 정부에 요청하고 있다</span><span class=\"en\"><b>Now doctors are <span class=\"grammar-hl\">asking the government</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조치를 취해달라고.</span><span class=\"en\"><b><span class=\"grammar-hl\">to take steps</span>.</b></span></div></div><div class=\"lec-sent-ko\">의사들은 정부에 조치를 취해줄 것을 요청하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 교육 현장의 문제를 해결하기 위해 의사들이 더 높은 차원인 정부의 개입을 촉구하는 단계로 논의를 넓힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asking the government to take steps (5형식(SVOC)): ask(S) + the government(O) + to take steps(OC, to부정사) 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take steps</td><td class=\"m\">조치를 취하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 요구한다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">demand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정부가 학교들을 압박해서</span><span class=\"en\"><b><span class=\"grammar-hl\">that the government push</span> schools</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 시작 시간을 뒤로 미루도록.</span><span class=\"en\"><b>to move back their starting times.</b></span></div></div><div class=\"lec-sent-ko\">그들은 정부가 학교에 압력을 넣어 수업 시작 시간을 늦출 것을 요구한다.</div></div>\
