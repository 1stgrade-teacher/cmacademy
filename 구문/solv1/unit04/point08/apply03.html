DP+f8KMjjJBzkZ47Z6/Tv7+lIcKjY5wrY79MnHPXn1P1oD+v6Z//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">A Lasting Legacy: The Gift of Life Through Organ Donation<small>영원한 유산: 장기 기증을 통한 생명의 선물</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">지문을 읽기 전, 우리가 꼭 알아두어야 할 개념은 바로 장기 기증(Organ Donation)입니다. 이는 세상을 떠난 사람의 장기를 건강한 사람에게 이식하여 그들의 생명을 구하거나 삶의 질을 획기적으로 개선하는 숭고한 나눔을 의미하죠. 흔히 뇌사(Brain Death) 판정을 받은 후 이루어지는데, 이는 단순히 심장만 멈춘 상태가 아니라 뇌의 기능이 완전히 소실되어 회복 가능성이 없는 의학적 상태를 뜻합니다. 비유하자면 컴퓨터의 본체가 완전히 고장 나서 다시는 켤 수 없는 상황과 같기에, 고인의 신체 일부를 통해 다른 이들에게 새 생명을 선물하는 생명 연장(Life Extension)의 핵심적인 방법이 됩니다. 요즘은 장기뿐만 아니라 뼈, 근육, 각막과 같은 인체 조직 기증(Tissue Donation)도 함께 활발히 이루어지고 있으며, 이는 우리 몸이 사라진 뒤에도 누군가의 삶 속에서 계속 이어질 수 있다는 깊은 의미를 담고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01임종과 의료적 판단</div><ul><li>뇌사 상태에 도달했을 때 인위적인 연명 치료를 중단해 줄 것을 요청한다.</li><li>뇌사(brain death) 판단 시 기계적 연명 거부</li><li>생명 유지 장치(machine) 사용 지양</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02장기 및 신체 기증</div><ul><li>타인에게 새로운 삶을 선물하기 위해 자신의 신체 일부를 기증하고자 한다.</li><li>시각(sight)을 통해 아름다움을 느끼지 못하는 이들에게 제공</li><li>심장(heart)과 신장(kidneys)을 기계에 의존하는 환자에게 기증</li><li>근육과 뼈(bones)를 사용하여 장애가 있는 아이를 돕도록 함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03신체 유해의 처리</div><ul><li>육체의 나머지는 자연으로 돌려보내고, 정신적 허물은 매장하기를 바란다.</li><li>화장(burn) 후 재를 뿌려 자연의 일부로 환원</li><li>개인의 잘못과 약점(faults and weaknesses)을 매장함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04기억되는 방식과 영원한 삶</div><ul><li>사후의 진정한 기억은 타인을 향한 선행을 통해 이루어지기를 소망한다.</li><li>도움이 필요한 이에게 친절한 말(kind word)과 행동(kind deed) 전달</li><li>타인을 위한 선행을 통해 고인이 영원히 기억됨(live forever)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">determine</td><td class=\"m\">결정하다, 밝혀내다, 알아내다</td></tr><tr><td class=\"w\">for all practical purposes</td><td class=\"m\">사실상, 실제적으로는</td></tr><tr><td class=\"w\">depend on</td><td class=\"m\">~에 의존하다, ~에 달려 있다</td></tr><tr><td class=\"w\">crippled</td><td class=\"m\">불구가 된, 절름발이의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scatter</td><td class=\"m\">흩뿌리다, 흩어지게 하다</td></tr><tr><td class=\"w\">by chance</td><td class=\"m\">우연히, 혹시</td></tr><tr><td class=\"w\">deed</td><td class=\"m\">행위, 행동</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">날이 올 것이다</span><span class=\"en\"><b>The day will come</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의사가 판정할</span><span class=\"en\"><b><span class=\"grammar-hl\">when a doctor will determine</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나의 뇌가 활동을 멈췄다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that my brain has stopped working</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고, 사실상,</span><span class=\"en\"><b>and, for all practical purposes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나의 생명이 끝났다고</span><span class=\"en\"><b>my life has ended.</b></span></div></div><div class=\"lec-sent-ko\">나의 뇌가 활동을 멈춰 사실상 생명이 다했다고 의사가 판정할 날이 올 겁니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 죽음이라는 불가피한 상황을 가정하며, 글의 서두에서 장기 기증에 관한 자신의 결심을 밝히기 위한 논리적 전제를 설정하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when a doctor will determine that my brain has stopped working (관계부사): the day를 선행사로 받아 그 뒤에 완전한 절(a doctor...working)이 이어지는 구조이다.</div><div class=\"lec-gr-item\">that my brain has stopped working (명사절): determine의 목적어 역할을 하는 that절이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">determine</td><td class=\"m\">결정하다, 밝혀내다, 알아내다</td></tr><tr><td class=\"w\">for all practical purposes</td><td class=\"m\">사실상, 실제적으로는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그런 일이 생기면,</span><span class=\"en\"><b><span class=\"grammar-hl\">When that happens</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나를 살려두려고 하지 마시오</span><span class=\"en\"><b><span class=\"grammar-hl\">do not try to keep me alive</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기계의 사용을 통해서</span><span class=\"en\"><b>through the use of a machine.</b></span></div></div><div class=\"lec-sent-ko\">그런 일이 생기면, 기계를 사용해서 나를 살려두려고 하지 마시오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 죽음의 시점에서 연명 치료를 거부하겠다는 단호한 의지를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When that happens (관계부사(접속사)): 때를 나타내는 부사절을 이끈다.</div><div class=\"lec-gr-item\">do not try to keep me alive (to부정사): try의 목적어 역할을 하며, 목적어 me와 목적보어 alive(형용사)를 갖는 5형식(SVOC) 구조를 포함한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내 몸을 사용하시오</span><span class=\"en\"><b>Use my body</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들이 돕도록</span><span class=\"en\"><b>to <span class=\"grammar-hl\">help others</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 온전한 삶을 살아가게</span><span class=\"en\"><b><span class=\"grammar-hl\">lead fuller lives</span>.</b></span></div></div><div class=\"lec-sent-ko\">내 몸이 다른 이들이 더 온전한 삶을 살아가는 데 도움이 되도록 사용되게 하시오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 연명 치료를 거부하는 대신, 자신의 신체를 타인을 위해 쓰겠다는 이 글의 핵심적인 목적과 제안을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">help others lead fuller lives 5형식(SVOC) 구조: help가 준사역동사로 쓰여 목적어 others 뒤에 목적보어로 원형부정사(lead)를 취했다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나의 시력을 주시오</span><span class=\"en\"><b>Give my sight</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람에게</span><span class=\"en\"><b>to a person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아기의 웃는 얼굴을 한 번도 본 적이 없는</span><span class=\"en\"><b><span class=\"grammar-hl\">who has never seen</span> <span class=\"grammar-hl\">a baby’s smiling face</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 아름다운 일몰을</span><span class=\"en\"><b>or a beautiful sunset.</b></span></div></div><div class=\"lec-sent-ko\">내 시력은 아기의 웃는 얼굴이나 멋진 일몰을 한 번도 본 적이 없는 사람에게 주도록 하시오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 장기 기증의 사례를 들어, 자신의 신체 일부가 타인에게 어떤 삶의 기쁨을 돌려줄 수 있는지 감성적으로 호소합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who has never seen (관계대명사): who는 선행사 a person을 수식하며, 절 내부에서 주어 역할을 하는 주격 관계대명사이다.</div><div class=\"lec-gr-item\">a baby’s smiling face (현재분사): smiling이 face를 수식하며 &#39;미소 짓는(동작)&#39;의 의미를 가진다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내 심장과 신장을 주시오</span><span class=\"en\"><b>Give my heart and kidneys</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람에게</span><span class=\"en\"><b>to <span class=\"grammar-hl\">one</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기계에 의존하는</span><span class=\"en\"><b><span class=\"grammar-hl\">who depends on a machine</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">살아가기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to exist</span>.</b></span></div></div><div class=\"lec-sent-ko\">내 심장과 신장은 기계장치에 의존해 살아가는 사람에게 주시오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 기계 사용에 대한 부정적 인식을 뒤집어, 타인의 생명을 살리는 데 기여할 수 있는 실질적인 방법을 제시하며 대조를 이룹니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">one who depends on a machine (관계대명사): who는 선행사 one을 수식하는 주격 관계대명사절이다.</div><div class=\"lec-gr-item\">to exist (to부정사): 부사적 용법으로 목적(~하기 위해)을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내 뼈와,</span><span class=\"en\"><b>Take my bones,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 몸의 모든 신경과 근육을 가져가서,</span><span class=\"en\"><b>every nerve and muscle in my body,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방법을 찾으시오</span><span class=\"en\"><b>and find a way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다리가 불편한 아이를 걷게 만들</span><span class=\"en\"><b>to <span class=\"grammar-hl\">make a crippled child walk</span>.</b></span></div></div><div class=\"lec-sent-ko\">내 뼈와 내 몸의 모든 신경, 근육들은 가져다 제대로 못 걷는 아이를 걷게 하는 방법을 찾도록 하시오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기증의 범위를 신체 조직까지 넓혀, 더 많은 사람에게 희망을 주고자 하는 기증자의 헌신적인 태도를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make a crippled child walk 5형식(SVOC) 구조: make가 사역동사로 쓰여 목적어(a crippled child) 뒤에 목적보어로 동사원형(walk)이 왔다.</div><div class=\"lec-gr-item\">crippled (과거분사): 형용사처럼 쓰여 child를 수식하며 &#39;불구가 된(상태)&#39;을 의미한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">crippled</td><td class=\"m\">불구가 된, 절름발이의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">남은 것은 태우고</span><span class=\"en\"><b>Burn <span class=\"grammar-hl\">what is left</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나의 유해를 바람 속에 뿌려주시오</span><span class=\"en\"><b>and scatter my ashes in the wind</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꽃들이 자라도록 돕기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to help the flowers grow</span>.</b></span></div></div><div class=\"lec-sent-ko\">남은 것은 태워서 (거름이 되어) 꽃이 잘 자라게 돕도록 나의 유해를 바람에 뿌려 주시오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 신체 기증 후 남은 육체조차 자연의 일부로 돌아가 생명을 꽃피우길 바라는, 죽음에 대한 긍정적이고 순환적인 시각을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what is left (관계대명사): what은 선행사를 포함한 관계대명사로 &#39;남겨진 것&#39;을 의미하며, is left는 수동구조(be+p.p.)이다. 기본구조: leave(남기다) A. 타동사 leave의 목적어가 없어 수동구조가 되었다.</div><div class=\"lec-gr-item\">to help the flowers grow (to부정사): 부사적 용법의 목적(~하기 위해)으로 쓰였으며, help는 5형식(SVOC) 구조로 목적보어 자리에 원형부정사(grow)를 취했다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scatter</td><td class=\"m\">흩뿌리다, 흩어지게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 무언가를 반드시 묻어야 한다면,</span><span class=\"en\"><b>If you must bury something,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 나의 잘못과 약점이 되게 하시오</span><span class=\"en\"><b><span class=\"grammar-hl\">let it be my faults and weaknesses</span>.</b></span></div></div><div class=\"lec-sent-ko\">뭔가를 묻어야 한다면, 그것이 나의 잘못과 약점이 되게 해주시오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 장례라는 관습적인 행위를 은유적으로 재해석하여, 타인에게는 육체적 도움을 남기고 스스로의 부정적인 면은 소멸시키겠다는 의지를 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let it be my faults and weaknesses 5형식(SVOC) 구조: let이 사역동사로 쓰여 목적어(it) 뒤에 목적보어로 동사원형(be)이 왔다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약, 혹시라도,</span><span class=\"en\"><b>If, by chance,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나를 기억하기를 원한다면,</span><span class=\"en\"><b>you wish to remember me,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렇게 해주시오</span><span class=\"en\"><b><span class=\"grammar-hl\">please do so</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친절한 행동을 함으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">by doing a kind deed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 친절한 말을 건넴으로써</span><span class=\"en\"><b>or giving a kind word</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도움이 필요한 누군가에게</span><span class=\"en\"><b>to someone in need.</b></span></div></div><div class=\"lec-sent-ko\">만약 혹시라도 나를 기억하고자 한다면, 어려움에 처한 사람에게 친절을 베풀거나 친절한 말을 건네는 것으로 나를 기억해주오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 추모의 방식을 물리적인 기억이 아닌, 사회적 선행을 통해 실천함으로써 자신의 존재 가치를 이어가길 바라는 결론으로 나아갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">if you wish to remember me (to부정사): wish의 목적어 역할을 하는 명사적 용법이다.</div><div class=\"lec-gr-item\">please do so (대동사): do는 앞의 일반동사구(remember me)를 대신한다. 앞의 동사가 일반동사이면 do를 쓴다.</div><div class=\"lec-gr-item\">by doing a kind deed (동명사): 전치사 by의 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">by chance</td><td class=\"m\">우연히, 혹시</td></tr><tr><td class=\"w\">deed</td><td class=\"m\">행위, 행동</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 모든 것을 한다면</span><span class=\"en\"><b>If you do <span class=\"grammar-hl\">all</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 요청했던,</span><span class=\"en\"><b><span class=\"grammar-hl\">I have asked</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 영원히 살 것이다</span><span class=\"en\"><b>I will live forever.</b></span></div></div><div class=\"lec-sent-ko\">내가 부탁한 것을 다 들어준다면, 나는 영원히 살 것이오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 요청대로 장기 기증과 선행이 이루어질 때, 육체의 죽음을 넘어선 영원한 삶이 가능하다는 철학적인 결론을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">all I have asked (관계대명사): 목적격 관계대명사 that(생략됨)이 I have asked의 목적어 자리를 대신하며 all을 수식한다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>의학적으로 삶이 끝났을 때 연명 치료를 거부하고 신체를 기증하겠다는 결심을 밝힌다.</li><li>시력, 심장, 신장, 근육 등을 기증하여 고통받는 타인의 삶을 돕고 싶다는 구체적인 의지를 드러낸다.</li><li>육체는 자연으로 돌려보내되, 자신의 잘못은 묻어버리기를 바란다.</li><li>타인에 대한 친절과 기증을 통해 자신의 삶이 영원히 이어지기를 소망한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The author encourages organ donation to save others after death, and asks to be remembered through acts of kindness.</div>\n              <div class=\"lec-final-sum-ko\">저자는 사후 타인을 살리기 위한 장기 기증을 독려하며, 친절한 행동을 통해 기억되기를 요청한다.</div></div></div>"],"segs":[[{"audio":"./apply03_audio/1.mp3","hl":null}],[{"audio":"./apply03_audio/2.mp3","hl":null}],[{"audio":"./apply03_audio/3.mp3","hl":null},{"audio":"./apply03_audio/4.mp3","hl":"stage-0"},{"audio":"./apply03_audio/5.mp3","hl":"stage-1"},{"audio":"./apply03_audio/6.mp3","hl":"stage-2"},{"audio":"./apply03_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply03_audio/8.mp3","hl":null}],[{"audio":"./apply03_audio/9.mp3","hl":"main"},{"audio":"./apply03_audio/10.mp3","hl":"meaning"},{"audio":"./apply03_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/12.mp3","hl":"main"},{"audio":"./apply03_audio/13.mp3","hl":"meaning"},{"audio":"./apply03_audio/14.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/15.mp3","hl":"main"},{"audio":"./apply03_audio/16.mp3","hl":"meaning"},{"audio":"./apply03_audio/17.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/18.mp3","hl":"main"},{"audio":"./apply03_audio/19.mp3","hl":"meaning"},{"audio":"./apply03_audio/20.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/21.mp3","hl":"main"},{"audio":"./apply03_audio/22.mp3","hl":"meaning"},{"audio":"./apply03_audio/23.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/24.mp3","hl":"main"},{"audio":"./apply03_audio/25.mp3","hl":"meaning"},{"audio":"./apply03_audio/26.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/27.mp3","hl":"main"},{"audio":"./apply03_audio/28.mp3","hl":"meaning"},{"audio":"./apply03_audio/29.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/30.mp3","hl":"main"},{"audio":"./apply03_audio/31.mp3","hl":"meaning"},{"audio":"./apply03_audio/32.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/33.mp3","hl":"main"},{"audio":"./apply03_audio/34.mp3","hl":"meaning"},{"audio":"./apply03_
