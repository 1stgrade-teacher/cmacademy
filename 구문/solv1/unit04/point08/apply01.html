nce)&#39;을 기르는 것이 정신 건강의 핵심이라고 할 수 있습니다. 오늘 지문은 바로 이러한 관점에서 무조건적인 회피보다는 현명한 균형이 왜 우리 삶에 필요한지 잘 보여주고 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01일반적인 통념</div><ul><li>최근까지 사람들은 건강을 위해 스트레스를 무조건 피해야 한다고 믿어왔다.</li><li>전통적인 건강 관념: 스트레스 회피(avoid stress)</li><li>스트레스 없는 상태를 이상적인 것으로 간주함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02스트레스 회피의 문제점</div><ul><li>스트레스를 피하려는 태도는 인생의 긍정적인 기회를 놓치게 만든다.</li><li>더 나은 직업이나 승진(promotion)과 같은 기회 상실</li><li>삶의 변화를 두려워하여 성장을 저해함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03스트레스의 필요성</div><ul><li>적당한 스트레스가 없는 삶은 오히려 정신적, 신체적 건강에 해로울 수 있다.</li><li>자극 부족(lack of stimulation)으로 인한 지루함과 불행 유발</li><li>적정 수준의 스트레스가 주는 활력 간과</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04전문가의 제언</div><ul><li>전문가들은 스트레스를 완전히 없애기보다 균형을 맞추는 것이 건강하다고 강조한다.</li><li>스트레스와 비스트레스 활동 간의 균형(balance) 유지</li><li>스트레스를 조절 가능한 상태로 다루는 스마트한 태도</li><li>핵심 키워드: 스트레스 관리(stress management)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">until recently</td><td class=\"m\">최근까지</td></tr><tr><td class=\"w\">maintain</td><td class=\"m\">유지하다, 주장하다</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다, 예방하다</td></tr><tr><td class=\"w\">drawback</td><td class=\"m\">결점, 문제점</td></tr><tr><td class=\"w\">miss out on</td><td class=\"m\">~을 놓치다, 기회를 놓치다</td></tr><tr><td class=\"w\">potentially</td><td class=\"m\">잠재적으로, 어쩌면</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">damaging</td><td class=\"m\">해로운, 손상을 주는</td></tr><tr><td class=\"w\">end up</td><td class=\"m\">결국 ~하게 되다</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~ 때문에</td></tr><tr><td class=\"w\">stimulation</td><td class=\"m\">자극, 고무</td></tr><tr><td class=\"w\">get rid of</td><td class=\"m\">~을 제거하다, ~을 처분하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">최근까지,</span><span class=\"en\"><b>Until recently,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일반적으로 믿어져 왔다</span><span class=\"en\"><b>it <span class=\"grammar-hl\">had generally been believed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건강을 유지하기 위해서는,</span><span class=\"en\"><b><span class=\"grammar-hl\">that to maintain good health,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 스트레스를 피해야 한다고</span><span class=\"en\"><b><span class=\"grammar-hl\">people should avoid stress</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능한 한 언제든</span><span class=\"en\"><b>whenever possible.</b></span></div></div><div class=\"lec-sent-ko\">최근까지, 건강을 유지하기 위해서는 사람들이 가능한 한 언제든 스트레스를 피해야만 한다고 대체로 믿어져 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글 전체의 논의를 시작하며, 대중들이 가진 일반적인 통념을 제시합니다. 스트레스를 무조건 회피하는 것이 건강의 비결이라는 과거의 지배적인 인식을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had generally been believed (수동태): be동사(had been)+p.p.(believed) 구조. believe는 타동사인데 목적어가 없어서 수동구조 had been believed 형태로 쓴다. 기본구조: believe + O(목적어) + (to be) C</div><div class=\"lec-gr-item\">to maintain (to부정사): 문장 내에서 목적(건강을 유지하기 위해)을 나타내는 부사적 용법으로 쓰임</div><div class=\"lec-gr-item\">that to maintain good health, people should avoid stress (가주어): 진주어: it이 가주어이며, that절(진주어)이 뒤에서 주어 역할을 대신함. that절은 명사절로 앞의 수동태 구조의 내용(believed의 대상)을 보충함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">until recently</td><td class=\"m\">최근까지</td></tr><tr><td class=\"w\">maintain</td><td class=\"m\">유지하다, 주장하다</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다, 예방하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 가지 심각한 결점이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">there are</span> some serious drawbacks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이런 종류의 생각에는</span><span class=\"en\"><b>to this kind of thinking.</b></span></div></div><div class=\"lec-sent-ko\">그러나 이런 생각에는 몇 가지 심각한 결점이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시된 통념에 반론을 제기하며 글의 논조를 전환합니다. 스트레스를 피하는 것이 항상 좋은 것만은 아니라는 점을 강조하며 본격적인 비판을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there are (도치): there가 문장 앞에 오면서 주어(some serious drawbacks)와 동사(are)의 위치가 바뀐 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">drawback</td><td class=\"m\">결점, 문제점</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스트레스를 피하려는 욕구는</span><span class=\"en\"><b>The desire <span class=\"grammar-hl\">to avoid</span> stress</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 이끌 수 있다</span><span class=\"en\"><b>can <span class=\"grammar-hl\">lead people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 삶에서 잠재적으로 이로운 변화들을 놓치도록,</span><span class=\"en\"><b><span class=\"grammar-hl\">to miss</span> out on potentially <span class=\"grammar-hl\">beneficial</span> changes in their lives,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 나은 직장을 구하거나 승진하는 것과 같은</span><span class=\"en\"><b>such as getting a better job or a promotion.</b></span></div></div><div class=\"lec-sent-ko\">스트레스를 피하고자 하는 욕구가 사람들로 하여금 더 좋은 일자리를 구한다거나 승진한다거나 하는 잠재적으로 이로운 변화들을 놓치게 할 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;단점&#39;을 구체적인 사례로 설명합니다. 성장을 위한 도전에는 불가피하게 스트레스가 따르는데, 이를 피하려다 보면 결국 삶을 발전시킬 기회까지 함께 잃게 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to avoid (to부정사): 형용사적 용법으로, 앞의 명사(desire)를 수식하여 &#39;~하려는 열망&#39;이라는 의미를 형성</div><div class=\"lec-gr-item\">lead people to miss 5형식(SVOC) 구조: lead(V) + people(O) + to miss(OC, to부정사) 형태. 목적어인 people이 뒤에 이어지는 to부정사의 동작을 하도록 유도하는 구조</div><div class=\"lec-gr-item\">beneficial (현재분사): beneficial은 형용사이지만, 변화하는 상태를 의미하는 과거분사/현재분사적 성격을 포함하여 변화(changes)를 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">avoid</td><td class=\"m\">피하다, 예방하다</td></tr><tr><td class=\"w\">miss out on</td><td class=\"m\">~을 놓치다, 기회를 놓치다</td></tr><tr><td class=\"w\">potentially</td><td class=\"m\">잠재적으로, 어쩌면</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 육체적으로나 정신적으로 해로울 수 있다</span><span class=\"en\"><b>can also be physically and mentally <span class=\"grammar-hl\">damaging</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사는 것이</span><span class=\"en\"><b>to live</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어느 정도의 스트레스 없이</span><span class=\"en\"><b>without a certain amount of stress.</b></span></div></div><div class=\"lec-sent-ko\">어느 정도의 스트레스 없이 산다는 것은 또한 육체적으로나 정신적으로 해로울 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 이어 스트레스 회피가 가져오는 또 다른 부작용을 제시합니다. 적절한 스트레스는 인간의 생존과 건강을 유지하는 데 필수적인 요소라는 점을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It ... to live (가주어): 진주어: it이 가주어이며, to live 이하가 진주어로서 문장의 진짜 주어 역할을 수행</div><div class=\"lec-gr-item\">damaging (현재분사): &#39;해를 끼치는(상태)&#39;이라는 의미로 live의 주격보어 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">damaging</td><td class=\"m\">해로운, 손상을 주는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 ~ 때문이다</span><span class=\"en\"><b>This is because</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전혀 스트레스를 겪지 않는 사람들은</span><span class=\"en\"><b>people <span class=\"grammar-hl\">experiencing</span> no stress at all</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 지루하고 불행하게 끝나버린다</span><span class=\"en\"><b>often end up bored and unhappy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자극의 부족 때문에</span><span class=\"en\"><b>due to a lack of stimulation.</b></span></div></div><div class=\"lec-sent-ko\">왜냐하면 아무런 스트레스도 겪지 않는 사람들은 종종 자극의 부족 때문에 지루하거나 기분이 좋지 않게 될 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이전 문장에서 주장한 &#39;정신적·신체적 피해&#39;의 구체적인 원인을 설명합니다. 인간은 적당한 외부 자극이 있을 때 활력을 느끼며, 자극이 완전히 차단된 상태는 오히려 심리적 무기력함을 유발한다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">experiencing (현재분사): people을 수식하는 구조. &#39;스트레스를 전혀 경험하지 않는 사람들&#39;이라는 의미로 people을 후치 수식</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">end up</td><td class=\"m\">결국 ~하게 되다</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~ 때문에</td></tr><tr><td class=\"w\">stimulation</td><td class=\"m\">자극, 고무</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러므로,</span><span class=\"en\"><b>Therefore,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현대 전문가들은 그것이 건강하다고 여긴다</span><span class=\"en\"><b>modern experts <span class=\"grammar-hl\">consider it healthy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현명한 균형을 유지하는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">to maintain</span> a smart balance</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스트레스가 있는 활동과 없는 활동 사이의</span><span class=\"en\"><b>between stressful and non-stressful activities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~하려고 하는 것보다는</span><span class=\"en\"><b>rather than <span class=\"grammar-hl\">trying</span> to get rid of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 모든 스트레스를 제거하려는</span><span class=\"en\"><b>all your stress.</b></span></div></div><div class=\"lec-sent-ko\">그래서 현대의 전문가들은 스트레스 가득한 활동과 전혀 스트레스 없는 활동 사이의 현명한 균형을 유지하는 것이 스트레스 전체를 제거하려고 하는 것보다 건강한 일이라고 생각한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지의 논의를 종합하여 결론을 내립니다. 스트레스를 제거의 대상이 아니라 적절히 관리하고 조절해야 할 필수적인 삶의 구성 요소로 재정의하는 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">consider it healthy to maintain 5형식(SVOC) 구조: consider(V) + it(가목적어) + healthy(O, 보어) + to maintain(진목적어) 구조. 목적어 자리에 to부정사가 길게 올 때 이를 뒤로 보내고 가목적어 it을 쓴 형태</div><div class=\"lec-gr-item\">to maintain (to부정사): 5형식 구조에서 진목적어 역할을 하는 명사적 용법</div><div class=\"lec-gr-item\">trying (동명사): 전치사(rather than)의 목적어 자리에 쓰인 동명사</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">maintain</td><td class=\"m\">유지하다, 주장하다</td></tr><tr><td class=\"w\">get rid of</td><td class=\"m\">~을 제거하다, ~을 처분하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>스트레스를 무조건 피하는 것이 건강에 좋다는 것은 과거의 통념이다.</li><li>스트레스를 피하려다 보면 더 나은 삶의 기회를 놓칠 수 있다.</li><li>적절한 스트레스가 없는 삶은 오히려 자극 부족으로 지루함과 불행을 낳는다.</li><li>전문가들은 스트레스를 완전히 없애는 것보다, 적절히 균형을 맞추는 것이 건강한 삶의 방식이라고 조언한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People often mistakenly believe that avoiding all stress is beneficial, yet maintaining a balance is essential for preventing boredom and promoting overall well-being.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 모든 스트레스를 피하는 것이 유익하다고 오해하지만, 지루함을 방지하고 전반적인 웰빙을 증진하기 위해서는 균형을 유지하는 것이 필수적이다.</div></div></div>"],"segs":[[{"audio":"./apply01_audio/1.mp3","hl":null}],[{"audio":"./apply01_audio/2.mp3","hl":null}],[{"audio":"./apply01_audio/3.mp3","hl":null},{"audio":"./apply01_audio/4.mp3","hl":"stage-0"},{"audio":"./apply01_audio/5.mp3","hl":"stage-1"},{"audio":"./apply01_audio/6.mp3","hl":"stage-2"},{"audio":"./apply01_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply01_audio/8.mp3","hl":null}],[{"audio":"./apply01_audio/9.mp3","hl":"main"},{"audio":"./apply01_audio/10.mp3","hl":"meaning"},{"audio":"./apply01_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/12.mp3","hl":"main"},{"audio":"./apply01_audio/13.mp3","hl":"meaning"},{"audio":"./apply01_audio/14.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/15.mp3","hl":"main"},{"audio":"./apply01_audio/16.mp3","hl":"meaning"},{"audio":"./apply01_audio/17.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/18.mp3","hl":"main"},{"audio":"./apply01_audio/19.mp3","hl":"meaning"},{"audio":"./apply01_au
