<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 8강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}
.lp-chips span{border-radius:3px;background:#fff}
.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

.lp-ko{border-radius:0;border-left:4px solid var(--pk);background:none;padding:4px 0 4px 12px}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 8강 적용독해01","audioDir":"8-01_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">8강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>A Smart Balance: Why We Need Some Stress\u003c/h1>\u003ch2>현명한 균형: 우리에게 어느 정도의 스트레스가 필요한 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>스트레스를 피하는 것이 건강에 좋다는 통념과 달리, 스트레스를 피하려는 마음은 더 좋은 일자리나 승진 같은 \u003cb class=\"key\">잠재적으로 \u003c/b>\u003cb class=\"key\">이로운 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 놓치게 하고, 자극이 없으면 지루하고 기분이 좋지 않게 만들 수 있다. 그래서 현대의 전문가들은 \u003cb class=\"key\">스트레스 \u003c/b>\u003cb class=\"key\">전체를 \u003c/b>\u003cb class=\"key\">제거\u003c/b>하려 하기보다 스트레스가 있는 활동과 없는 활동 사이의 \u003cb class=\"key\">현명한 \u003c/b>\u003cb class=\"key\">균형\u003c/b>을 유지하는 것이 건강하다고 본다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Instead of trying to get rid of all your stress, we should maintain a smart balance between stressful and non-stressful activities.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 스트레스에 대한 우리의 통념을 뒤집는 글이에요. 최근까지 많은 사람이 건강을 위해 스트레스를 피해야 한다고 믿어 왔지만, 이 글은 그 생각에 심각한 결점이 있다고 말합니다. 요지는 스트레스를 완전히 없애기보다 스트레스가 있는 활동과 없는 활동 사이의 현명한 균형을 유지하는 것이 건강하다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">흔히 스트레스는 무조건 나쁜 것이라고 배우지만, 심리학에서는 스트레스를 완전히 없애는 것보다 \u003cb class=\"key\">적정 \u003c/b>\u003cb class=\"key\">수준\u003c/b>으로 관리하는 것이 중요하다고 말해요. 실제로 약간의 긴장감은 집중력을 높이고 목표를 향해 나아가게 하는 원동력이 되는데, 이런 긍정적인 압박을 eustress, 즉 좋은 스트레스라고 부릅니다. 반대로 자극이 전혀 없는 상태가 오래 이어지면 사람은 지루함(boredom)과 무기력에 빠지기 쉬워요. 심리학에서는 이를 최적 각성 수준(optimal arousal)이라는 개념으로 설명하는데, 각성 수준이 너무 낮아도 너무 높아도 수행 능률이 떨어진다는 뜻입니다. 헬스장의 운동 기구에 비유해 볼 수 있어요. 너무 무거운 무게는 몸을 다치게 하지만 적당한 무게는 근육을 키우듯이, 스트레스도 \u003cb class=\"key\">균형\u003c/b> 있게 다룰 때 성장의 재료가 됩니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 하나 짚고 갈게요. 우리는 흔히 스트레스는 무조건 나쁜 것이라고 배우죠. 그런데 심리학에서는 스트레스를 완전히 없애는 것보다 적정 수준으로 관리하는 것이 중요하다고 말합니다. 약간의 긴장감은 집중력을 높이고 목표를 향해 나아가게 하는 원동력이 되는데, 이런 긍정적인 압박을 eustress, 즉 좋은 스트레스라고 불러요. 반대로 자극이 전혀 없는 상태가 오래 이어지면 사람은 지루함과 무기력에 빠지기 쉽습니다. 심리학에서는 이것을 최적 각성 수준, 영어로 optimal arousal이라는 개념으로 설명해요. 헬스장의 운동 기구처럼 너무 무거운 무게는 몸을 다치게 하지만 적당한 무게는 근육을 키우죠. 스트레스도 균형 있게 다룰 때 성장의 재료가 된답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>오래된 통념\u003csmall>통념 · 문장 1\u003c/small>\u003c/h4>\u003cp>첫 번째 문장은 오랫동안 당연하게 여겨진 생각을 소개해요. 건강을 유지하려면 가능한 한 언제든 \u003cb class=\"key\">스트레스 \u003c/b>\u003cb class=\"key\">회피\u003c/b>를 선택해야 한다는 믿음이죠. until recently라는 표현에서 알 수 있듯이, 이것이 과거의 \u003cb class=\"key\">일반적 \u003c/b>\u003cb class=\"key\">인식\u003c/b>이었다는 점이 중요해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>통념의 결점\u003csmall>전환 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>그러나 두 번째 문장에서 but을 통해 분위기가 바뀌어요. 이런 생각에는 몇 가지 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">결점\u003c/b>이 있다고 반박하죠. 세 번째 문장은 그 근거로, 스트레스를 피하려는 욕구 때문에 더 좋은 일자리나 승진 같은 \u003cb class=\"key\">잠재적으로 \u003c/b>\u003cb class=\"key\">이로운 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 놓칠 수 있다는 점을 예시로 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>자극 부족의 폐해\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>네 번째 문장은 근거를 하나 더 보태요. 어느 정도의 스트레스 없이 사는 것이 육체적으로나 정신적으로 \u003cb class=\"key\">해로울 \u003c/b>\u003cb class=\"key\">수도\u003c/b> 있다는 것이죠. 다섯 번째 문장은 this is because로 그 이유를 밝히는데, 아무런 스트레스도 겪지 않는 사람은 \u003cb class=\"key\">자극의 \u003c/b>\u003cb class=\"key\">부족\u003c/b> 때문에 지루하고 기분이 좋지 않게 된다고 설명해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>균형이라는 결론\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>마지막 문장은 therefore로 앞의 내용을 묶어 결론을 내려요. 현대의 전문가들은 스트레스 전체를 제거하려고 하기보다 스트레스가 있는 활동과 없는 활동 사이의 \u003cb class=\"key\">현명한 \u003c/b>\u003cb class=\"key\">균형\u003c/b>을 유지하는 것이 건강하다고 생각하죠. 결국 이 글의 \u003cb class=\"key\">주제문\u003c/b>은 바로 여섯 번째 문장이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 오래된 통념이에요. 첫 번째 문장에서 건강을 유지하려면 가능한 한 언제든 스트레스 회피를 선택해야 한다는 믿음이 나옵니다. until recently라는 표현이 있으니, 이것은 과거의 일반적 인식이었다는 점을 꼭 기억하세요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 통념에 대한 반박이에요. 두 번째 문장에서 but이 나오면서 분위기가 확 바뀌죠. 이런 생각에는 몇 가지 심각한 결점이 있다는 겁니다. 세 번째 문장은 그 근거로, 스트레스를 피하려는 욕구 때문에 더 좋은 일자리나 승진 같은 잠재적으로 이로운 변화를 놓칠 수 있다는 예시를 보여 줘요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 자극 부족의 폐해예요. 네 번째 문장은 어느 정도의 스트레스 없이 사는 것이 육체적으로나 정신적으로 해로울 수도 있다고 근거를 하나 더 보탭니다. 다섯 번째 문장은 this is because로 이유를 밝히는데, 아무런 스트레스도 겪지 않는 사람은 자극의 부족 때문에 지루하고 기분이 좋지 않게 된다고 설명해요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 균형이라는 결론이에요. 마지막 문장에서 therefore로 앞의 내용을 묶어 내리죠. 현대의 전문가들은 스트레스 전체를 제거하려고 하기보다 스트레스가 있는 활동과 없는 활동 사이의 현명한 균형을 유지하는 것이 건강하다고 생각합니다. 결국 이 글의 주제문은 바로 여섯 번째 문장이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장이 오랫동안 믿어져 온 \u003cb class=\"key\">통념\u003c/b>을 제시하고, 두 번째 문장이 but으로 이를 뒤집으며 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">결점\u003c/b>을 지적해요. 이어서 세 번째와 네 번째, 다섯 번째 문장이 근거와 예시를 차례로 쌓아 올리죠. 글쓴이의 실제 주장은 therefore로 시작하는 여섯 번째 문장에서 처음 나오기 때문에 \u003cb class=\"key\">미괄식\u003c/b> 구조예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Until recently (1)\u003c/b>\u003cspan>과거의 통념 제시\u003c/span>\u003cb>But (2)\u003c/b>\u003cspan>통념에 대한 반박 전환\u003c/span>\u003cb>also (4)\u003c/b>\u003cspan>추가 근거 제시\u003c/span>\u003cb>This is because (5)\u003c/b>\u003cspan>앞 내용의 이유 설명\u003c/span>\u003cb>Therefore (6)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">avoid stress whenever possible\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the desire to avoid stress\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">live without a certain amount of stress\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">experiencing no stress at all\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">trying to get rid of all your stress\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>스트레스 회피\u003c/th>\u003cth>현명한 균형\u003c/th>\u003c/tr>\u003ctr>\u003ctd>이로운 변화를 놓치고 승진 기회를 잃음\u003c/td>\u003ctd>적절한 자극으로 변화와 성장을 얻음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자극 부족으로 지루하고 기분이 좋지 않음\u003c/td>\u003ctd>육체적·정신적으로 건강을 유지함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 통념을 먼저 제시하고 그것을 반박하는 전개 방식이에요. 첫 번째 문장에서 통념을 꺼내고, 두 번째 문장에서 but으로 뒤집은 다음, 근거를 차례로 쌓아 올리죠. 그런데 필자의 진짜 주장은 therefore가 붙은 마지막 문장에서 처음 등장해요. 그래서 이 글은 주장이 맨 뒤에 나오는 미괄식 구조입니다.","hl":"ty"},{"n":9,"text":"신호어를 따라가면 구조가 아주 선명해져요. 첫 번째 문장의 Until recently는 과거의 통념을 여는 신호고, 두 번째 문장의 But은 반박으로 넘어가는 전환이에요. 네 번째 문장의 also는 근거를 하나 더 보태고, 다섯 번째 문장의 This is because는 앞 내용의 이유를 설명하죠. 마지막 문장의 Therefore는 결론을 도출하는 신호예요. 그리고 avoid stress, the desire to avoid stress, experiencing no stress at all처럼 같은 개념을 바꿔 말하는 재진술 표현도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>until recently\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>최근까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>generally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대체로, 일반적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>maintain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>유지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>whenever possible\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가능한 한 언제든\u003c/span>\u003c/div>\u003cdiv>\u003cb>serious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>심각한\u003c/span>\u003c/div>\u003cdiv>\u003cb>drawback\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결점, 단점\u003c/span>\u003c/div>\u003cdiv>\u003cb>desire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>욕구, 갈망\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead A to B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A가 B하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>miss out on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 놓치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>potentially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>잠재적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>beneficial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>promotion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>승진\u003c/span>\u003c/div>\u003cdiv>\u003cb>physically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>육체적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>mentally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정신적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>damaging\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>해로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>a certain amount of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어느 정도의\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>동사\u003c/em>\u003cspan>겪다, 경험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>end up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결국 ~하게 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bored\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지루한, 지루해하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>due to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>lack\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부족\u003c/span>\u003c/div>\u003cdiv>\u003cb>stimulation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자극\u003c/span>\u003c/div>\u003cdiv>\u003cb>therefore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>따라서\u003c/span>\u003c/div>\u003cdiv>\u003cb>expert\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전문가\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>여기다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>balance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>균형\u003c/span>\u003c/div>\u003cdiv>\u003cb>rather than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다는\u003c/span>\u003c/div>\u003cdiv>\u003cb>get rid of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>제거하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚어 볼게요. drawback은 결점이라는 뜻이고, beneficial은 이로운이라는 뜻이라서 잠재적으로 이로운 변화라는 표현으로 나옵니다. damaging은 해로운이라는 뜻이고, stimulation은 자극, lack은 부족이라는 뜻이에요. 마지막 문장의 rather than은 보다도, 라는 뜻으로 앞뒤를 비교할 때 꼭 나오는 표현이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">avoid\u003c/b>\u003cspan class=\"m\">피하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">evade\u003c/span>\u003cspan class=\"s\">dodge\u003c/span>\u003cspan class=\"s\">escape\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">confront\u003c/span>\u003cspan class=\"a\">face\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">maintain\u003c/b>\u003cspan class=\"m\">유지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">keep\u003c/span>\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"s\">sustain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abandon\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">drawback\u003c/b>\u003cspan class=\"m\">결점\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disadvantage\u003c/span>\u003cspan class=\"s\">downside\u003c/span>\u003cspan class=\"s\">flaw\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">advantage\u003c/span>\u003cspan class=\"a\">benefit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">beneficial\u003c/b>\u003cspan class=\"m\">이로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">helpful\u003c/span>\u003cspan class=\"s\">advantageous\u003c/span>\u003cspan class=\"s\">favorable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harmful\u003c/span>\u003cspan class=\"a\">detrimental\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">damaging\u003c/b>\u003cspan class=\"m\">해로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">harmful\u003c/span>\u003cspan class=\"s\">injurious\u003c/span>\u003cspan class=\"s\">destructive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">beneficial\u003c/span>\u003cspan class=\"a\">helpful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lack\u003c/b>\u003cspan class=\"m\">부족\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shortage\u003c/span>\u003cspan class=\"s\">deficiency\u003c/span>\u003cspan class=\"s\">scarcity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abundance\u003c/span>\u003cspan class=\"a\">plenty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stimulation\u003c/b>\u003cspan class=\"m\">자극\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">arousal\u003c/span>\u003cspan class=\"s\">excitement\u003c/span>\u003cspan class=\"s\">motivation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boredom\u003c/span>\u003cspan class=\"a\">dullness\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. avoid는 피하다인데 evade, dodge와 뜻이 같고 confront, face와 반대돼요. maintain은 유지하다로 keep, preserve와 가깝고 abandon과는 반대입니다. drawback은 disadvantage, downside와 같은 결점이고 advantage와 반대죠. beneficial은 helpful, advantageous와 동의어이고 harmful과 반대돼요. lack은 shortage, deficiency와 같은 부족이고 abundance와 반대라는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최근까지,\u003c/span>\u003cspan class=\"en\">Until recently,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 대체로 믿어져 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">generally \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">believed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건강을 유지하기 위해서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">maintain \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">health\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 스트레스를 피해야 한다고\u003c/span>\u003cspan class=\"en\">people should avoid stress\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능한 한 언제든\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">whenever \u003c/span>\u003cspan class=\"tgt\">possible\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">최근까지, 건강을 유지하기 위해서는 사람들이 가능한 한 언제든 스트레스를 피해야만 한다고 대체로 믿어져 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 배경을 까는 출발점 문장이에요. 오랫동안 널리 퍼져 있던 통념을 \u003cb class=\"key\">가주어\u003c/b> it과 \u003cb class=\"key\">수동태\u003c/b>로 감싸서 '그렇게들 믿어져 왔다'고 부드럽게 제시하죠. 다음 문장에서 이 통념에 제동을 걸기 때문에, 여기서는 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">제시\u003c/b> 이상의 역할은 하지 않습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it 구문 + 수동태\u003c/span> : [It + be동사 + p.p. + that절] = that절(진주어)이 뒤로 이동 : \"…라고 대체로 믿어져 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to + 동사원형] = '~하기 위해' : \"건강을 유지하기 위해서는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부사절 축약(whenever + 형용사)\u003c/span> : whenever (it is) possible = [whenever + 주어·be동사 생략] : \"가능한 한 언제든\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Until recently, 최근까지. it had generally been believed, 그것은 대체로 믿어져 왔다. that to maintain good health, 건강을 유지하기 위해서는. people should avoid stress, 사람들이 스트레스를 피해야 한다고. whenever possible, 가능한 한 언제든. 이 문장 전체를 해석하면, 최근까지, 건강을 유지하기 위해서는 사람들이 가능한 한 언제든 스트레스를 피해야만 한다고 대체로 믿어져 왔다.","hl":"m"},{"n":13,"text":"이 문장은 글의 출발점이에요. 예전부터 널리 퍼진 통념을 가주어 구문과 수동태로 부드럽게 소개하고 있죠. 바로 다음 문장에서 이 통념에 제동을 걸기 때문에, 여기서는 일단 그렇게들 믿어 왔다는 배경만 잡아 두시면 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째로 it had generally been believed that에서 it은 가주어예요. 진짜 주어는 that절인데 너무 길어서 뒤로 보낸 것이죠. 두 번째로 had been believed는 과거완료 수동태로, 과거 어느 시점까지 이어져 온 믿음을 보여 줍니다. 세 번째로 to maintain good health의 to는 건강을 유지하기 위해서라는 목적의 부사적 용법이에요. 마지막으로 whenever possible은 whenever it is possible에서 it is가 생략된 부사절 축약 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 심각한 결점이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">serious \u003c/span>\u003cspan class=\"tgt\">drawbacks\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 생각에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">thinking\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 이런 생각에는 몇 가지 심각한 결점이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 통념을 정면으로 뒤집는 \u003cb class=\"key\">전환\u003c/b> 문장이에요. But 하나로 흐름을 돌려놓고, there are 구문으로 '결점이 존재한다'는 사실만 먼저 던져 두죠. 구체적인 결점은 다음 문장들에서 하나씩 나오므로, 여기서는 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">제기\u003c/b>의 신호로만 읽으면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there be 구문(유도부사)\u003c/span> : [There + be동사 + 주어 + 수식어] : \"몇 가지 심각한 결점이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사 + to + 명사구] = '~에 대한' : \"이런 생각에 대한(결점)\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"But, 그러나. there are some serious drawbacks, 몇 가지 심각한 결점이 있다. to this kind of thinking, 이런 생각에는. 이 문장 전체를 해석하면, 그러나 이런 생각에는 몇 가지 심각한 결점이 있다.","hl":"m"},{"n":16,"text":"앞 문장의 통념을 정면으로 뒤집는 전환 문장이에요. But 하나로 흐름을 바꾸고, there are 구문으로 결점이 존재한다는 사실만 먼저 던져 두죠. 구체적인 결점은 뒤 문장들에서 하나씩 나오기 때문에, 여기서는 문제 제기의 신호로 읽으시면 됩니다.","hl":"mn"},{"n":17,"text":"첫 번째로 there are some serious drawbacks는 there be 구문이에요. 유도부사 there가 있다는 뜻을 만들고, 진짜 주어인 some serious drawbacks가 be동사 뒤에 오는 구조죠. 두 번째로 to this kind of thinking에서 to는 앞의 drawbacks를 뒤에서 꾸며 주는 전치사로, 이런 생각에 대한 결점이라는 뜻을 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스트레스를 피하고자 하는 욕구가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\"> class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 + to부정사] = '~하는/할 명사' : \"스트레스를 피하고자 하는 욕구\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격보어로 to부정사를 취하는 동사(5형식)\u003c/span> : lead + [목적어] + [to부정사(목적격보어)] = '~가 …하게 이끌다' : \"사람들로 하여금 놓치게 할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">such as + 동명사 / 병렬 구조\u003c/span> : such as + [getting ... or a promotion(명사 상당어 병렬)] : \"더 좋은 일자리를 구하거나 승진하는 것과 같은\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The desire to avoid stress, 스트레스를 피하고자 하는 욕구가. can lead people, 사람들을 이끌 수 있다. to miss out on potentially beneficial changes, 잠재적으로 이로운 변화들을 놓치도록. in their lives, 그들의 삶에서. such as getting a better job or a promotion, 더 좋은 일자리를 구하거나 승진하는 것과 같은. 이 문장 전체를 해석하면, 스트레스를 피하고자 하는 욕구가 사람들로 하여금 더 좋은 일자리를 구한다거나 승진한다거나 하는 잠재적으로 이로운 변화들을 놓치게 할 수도 있다.","hl":"m"},{"n":19,"text":"첫 번째 결점을 구체적으로 보여 주는 문장이에요. 스트레스를 피하려는 마음이 오히려 기회 상실로 이어진다는 역설을 담고 있죠. 뒤에 such as로 예시를 붙여서 독자가 어떤 변화인지 바로 이해하게 만듭니다.","hl":"mn"},{"n":20,"text":"첫 번째로 The desire to avoid stress에서 to avoid는 앞의 명사 desire를 꾸미는 형용사적 용법이에요. 피하려는 욕구, 이렇게 해석되죠. 두 번째로 lead people to miss out on은 목적어 people 뒤에 to부정사가 목적격보어로 붙은 오 형식 구조예요. 사람들로 하여금 놓치게 이끌다, 즉 놓치게 만들다라는 뜻이 됩니다. 세 번째로 such as getting a better job or a promotion에서 such as는 예시를 이끄는 표현이고, 전치사 뒤라서 get이 동명사 getting으로 바뀌었어요. or로 두 예시가 나란히 병렬을 이루고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 또한 육체적으로나 정신적으로 해로울 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">physically \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">mentally \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">damaging\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 정도의 스트레스 없이 사는 것은\u003c/span>\u003cspan class=\"en\">to live without a certain amount of stress.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 정도의 스트레스 없이 산다는 것은 또한 육체적으로나 정신적으로 해로울 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 스트레스를 피하려는 생각의 첫 번째 문제점을 말한 뒤, 두 번째 문제점을 꺼내는 문장이에요. 앞의 \u003cb class=\"key\">가주어\u003c/b> It이 뒤의 \u003cb class=\"key\">to부정사\u003c/b> 내용을 받아, 스트레스가 전혀 없는 삶 자체가 몸과 마음에 \u003cb class=\"key\">해로울 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있다\u003c/b>는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it + 진주어 to부정사\u003c/span> : [It (가주어)] + be동사 + [형용사 damaging (주격보어)] + [to live ~ (진주어)] : \"그것은 ~ 해로울 수 있다 / 스트레스 없이 사는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격보어로 쓰인 형용사\u003c/span> : be동사 + [형용사 damaging] : \"해로운 (상태이다)\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It can also be physically and mentally damaging, 그것은 또한 육체적으로나 정신적으로 해로울 수 있다. to live without a certain amount of stress, 어느 정도의 스트레스 없이 사는 것은. 이 문장 전체를 해석하면, 어느 정도의 스트레스 없이 산다는 것은 또한 육체적으로나 정신적으로 해로울 수도 있다.","hl":"m"},{"n":22,"text":"이 문장은 스트레스를 피하려는 생각의 두 번째 문제점을 말하고 있어요. 스트레스가 전혀 없는 삶이 오히려 몸과 마음에 해가 될 수 있다는 거죠. 앞에 있는 It은 뒤에 나오는 to live 이하를 가리키는 가주어라는 점이 핵심이에요.","hl":"mn"},{"n":23,"text":"첫 번째로, 문장 앞의 It은 진짜 주어가 아니라 가주어예요. 진짜 주어는 뒤에 나오는 to부정사, to live without a certain amount of stress이고, 이 긴 주어를 뒤로 보내 문장의 균형을 맞춘 거죠. 두 번째로, be동사 뒤의 damaging은 주격보어로 쓰인 형용사예요. 그래서 it can be damaging, 그것은 해로울 수 있다, 라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 ~ 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">because\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무런 스트레스도 겪지 않는 사람들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">experiencing \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">stress \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 지루하거나 기분이 좋지 않게 된다\u003c/span>\u003cspan class=\"en\">often \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">end \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">bored \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">unhappy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자극의 부족 때문에\u003c/span>\u003cspan class=\"en\">due to a lack of stimulation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜냐하면 아무런 스트레스도 겪지 않는 사람들은 종종 자극의 부족 때문에 지루하거나 기분이 좋지 않게 될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 '스트레스 없는 삶은 해롭다'고 한 데 대한 \u003cb class=\"key\">이유\u003c/b>를 because로 받아 설명하는 문장이에요. 자극이 없으면 사람은 \u003cb class=\"key\">지루함\u003c/b>과 불행을 느끼게 된다는 심리적 원리를 담고 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">because 명사절 (보어)\u003c/span> : This is + [because + 주어 + 동사 ~ (명사절/보어)] : \"이것은 ~ 때문이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사 후치수식\u003c/span> : [명사 people] + [현재분사 experiencing ~] : \"아무런 스트레스도 겪지 않는 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">end up + 형용사 (주격보어)\u003c/span> : end up + [형용사 bored and unhappy] : \"결국 지루하거나 기분이 좋지 않게 되다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"This is because, 이것은 ~ 때문이다. people experiencing no stress at all, 아무런 스트레스도 겪지 않는 사람들은. often end up bored and unhappy, 종종 지루하거나 기분이 좋지 않게 된다. due to a lack of stimulation, 자극의 부족 때문에. 이 문장 전체를 해석하면, 왜냐하면 아무런 스트레스도 겪지 않는 사람들은 종종 자극의 부족 때문에 지루하거나 기분이 좋지 않게 될 수 있다.","hl":"m"},{"n":25,"text":"앞 문장에서 스트레스 없는 삶이 해롭다고 했죠. 이 문장은 그 이유를 because로 받아서 설명하고 있어요. 자극이 없으면 사람은 지루함과 불행을 느끼게 된다는 심리적 원리를 보여 줍니다.","hl":"mn"},{"n":26,"text":"첫 번째로, This is because는 이것은 왜냐하면 그렇기 때문이다, 라는 뜻으로 뒤에 완전한 절이 오는 보어 절이에요. 두 번째로, people 뒤의 experiencing은 현재분사로, people을 뒤에서 꾸며 주는 후치수식이에요. 아무런 스트레스도 겪지 않는 사람들, 이렇게 해석하죠. 세 번째로, end up은 결국 그런 상태가 되다라는 뜻으로 뒤에 형용사 bored and unhappy가 와서 주격보어 역할을 해요. 네 번째로, due to는 전치사구로 자극의 부족 때문에, 라는 이유를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현대의 전문가들은 그것을 건강한 일이라고 생각한다\u003c/span>\u003cspan class=\"en\">modern experts \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">consider \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">healthy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현명한 균형을 유지하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">maintain \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">smart \u003c/span>\u003cspan class=\"tgt\">balance\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스트레스 가득한 활동과 전혀 스트레스 없는 활동 사이의\u003c/span>\u003cspan class=\"en\">between stressful and non-stressful activities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스트레스 전체를 제거하려고 하는 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">trying \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">rid \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">stress\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 현대의 전문가들은 스트레스 가득한 활동과 전혀 스트레스 없는 활동 사이의 현명한 균형을 유지하는 것이 스트레스 전체를 제거하려고 하는 것보다 건강한 일이라고 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 \u003cb class=\"key\">결론\u003c/b>을 정리하는 문장이에요. 스트레스를 완전히 없애려 하기보다 스트레스가 있는 활동과 없는 활동 사이의 \u003cb class=\"key\">현명한 \u003c/b>\u003cb class=\"key\">균형\u003c/b>을 유지하는 것이 건강하다는 것이죠. consider가 \u003cb class=\"key\">5형식\u003c/b>으로 쓰여 it을 healthy라고 평가하는 구조입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 consider + 가주어 it + 목적격보어 + 진주어 to부정사\u003c/span> : consider + [목적어 it (가주어)] + [목적격보어 healthy] + [to maintain ~ (진주어)] : \"현명한 균형을 유지하는 것이 건강한 일이라고 생각한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">rather than + 동명사 (대조)\u003c/span> : rather than + [동명사 trying] : \"스트레스 전체를 제거하려고 하는 것보다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Therefore, 그래서. modern experts consider it healthy, 현대의 전문가들은 그것을 건강한 일이라고 생각한다. to maintain a smart balance, 현명한 균형을 유지하는 것이. between stressful and non-stressful activities, 스트레스 가득한 활동과 전혀 스트레스 없는 활동 사이의. rather than trying to get rid of all your stress, 스트레스 전체를 제거하려고 하는 것보다. 이 문장 전체를 해석하면, 그래서 현대의 전문가들은 스트레스 가득한 활동과 전혀 스트레스 없는 활동 사이의 현명한 균형을 유지하는 것이 스트레스 전체를 제거하려고 하는 것보다 건강한 일이라고 생각한다.","hl":"m"},{"n":28,"text":"이 문장은 글 전체의 결론이에요. 스트레스를 완전히 없애려 하기보다 스트레스가 있는 활동과 없는 활동 사이에서 현명한 균형을 잡는 것이 건강하다고 정리합니다. 앞에서 말한 문제점들을 모두 아우르는 마무리 문장이죠.","hl":"mn"},{"n":29,"text":"첫 번째로, consider는 목적어와 목적격보어를 데리고 오는 다섯 형식 동사예요. 여기서는 목적어 자리에 가주어 it이 오고, 목적격보어로 healthy가 왔죠. 두 번째로, 그 it의 진짜 내용은 뒤에 나오는 to부정사, to maintain a smart balance예요. 그래서 현명한 균형을 유지하는 것이 건강하다고 생각한다, 라고 해석해요. 세 번째로, rather than 뒤에는 동명사 trying이 와서 앞의 to maintain과 의미상 대조를 이루고 있어요. 스트레스를 없애려는 것보다 균형을 유지하는 쪽이 낫다는 뜻이죠. 네 번째로, between stressful and non-stressful activities는 두 가지 활동 사이의 균형을 나타내는 전치사 표현이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>오랫동안 사람들은 건강을 유지하려면 가능한 한 언제든 \u003cb class=\"key\">스트레스 \u003c/b>\u003cb class=\"key\">회피\u003c/b>를 해야 한다고 믿어 왔다.\u003c/li>\u003cli>그러나 이런 생각에는 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">결점\u003c/b>이 있는데, 스트레스를 피하려는 욕구가 더 좋은 일자리나 승진 같은 이로운 변화를 놓치게 할 수 있기 때문이다.\u003c/li>\u003cli>또한 어느 정도의 스트레스 없이 사는 것은 육체적으로나 정신적으로 해로울 수 있는데, \u003cb class=\"key\">자극의 \u003c/b>\u003cb class=\"key\">부족\u003c/b>으로 사람들이 지루하고 기분이 좋지 않게 되기 때문이다.\u003c/li>\u003cli>따라서 현대의 전문가들은 스트레스 전체를 제거하려 하기보다 스트레스가 있는 활동과 없는 활동 사이의 \u003cb class=\"key\">현명한 \u003c/b>\u003cb class=\"key\">균형\u003c/b>을 유지하는 것이 건강하다고 본다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Instead of trying to get rid of all your stress, we should maintain a smart balance between stressful and non-stressful activities.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">스트레스를 피하는 것이 건강에 좋다는 통념과 달리, 스트레스를 피하려는 마음은 더 좋은 일자리나 승진 같은 \u003cb class=\"key\">잠재적으로 \u003c/b>\u003cb class=\"key\">이로운 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 놓치게 하고, 자극이 없으면 지루하고 기분이 좋지 않게 만들 수 있다. 그래서 현대의 전문가들은 \u003cb class=\"key\">스트레스 \u003c/b>\u003cb class=\"key\">전체를 \u003c/b>\u003cb class=\"key\">제거\u003c/b>하려 하기보다 스트레스가 있는 활동과 없는 활동 사이의 \u003cb class=\"key\">현명한 \u003c/b>\u003cb class=\"key\">균형\u003c/b>을 유지하는 것이 건강하다고 본다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 글의 핵심은 아주 간단해요. 스트레스를 무조건 피하는 것이 답이 아니라, 스트레스 전체를 제거하려 하기보다 스트레스가 있는 활동과 없는 활동 사이의 현명한 균형을 잡는 것이 건강하다는 것이었죠. 통념, 반박, 근거, 결론의 흐름과 but, This is because, Therefore 같은 신호어를 함께 기억해 두면 시험에서도 흔들리지 않을 거예요. 오늘 수업 여기까지입니다. 수고했어요, 여러분.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
