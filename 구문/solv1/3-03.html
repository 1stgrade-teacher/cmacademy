<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 3강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 3강 적용독해03","audioDir":"3-03_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">3강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>The Blood She Gave Came Back to Save Her\u003c/h1>\u003ch2>그녀가 헌혈한 피가 그녀를 살리다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 희귀 혈액형 때문에 늘 헌혈을 요청받던 Patricia는 미시간으로 이사한 뒤 교통사고로 응급 수술을 받다가 그 지역에 같은 혈액형의 피가 없어 위기에 몰렸지만, 결국 \u003cb class=\"key\">플로리다\u003c/b>에서 몇 달 전 자신이 헌혈해 둔 \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">혈액\u003c/b> 덕분에 목숨을 구했다. 이 이야기는 \u003cb class=\"key\">헌혈\u003c/b>이 남을 돕는 일이면서 동시에 자신을 지키는 일이 될 수 있음을 보여 준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Donating blood can end up saving your own life, as Patricia West survived only because the rare blood she had donated months earlier was available when no other matching blood could be found.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 희귀 혈액형을 가진 Patricia West의 실제 이야기예요. 자신이 늘 해 오던 헌혈이 결국 자기 목숨을 구했다는 아주 인상적인 글이죠. 한마디로 요약하면, 미시간에서 사고를 당해 응급 수술을 받던 Patricia가 플로리다에 보관되어 있던 자신의 혈액 덕분에 살아났다는 이야기예요. 그래서 이 글의 요지는 헌혈이 다른 사람뿐 아니라 자기 자신의 생명도 구할 수 있다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사람의 혈액형은 종류가 매우 많아서, 드물게 나타나는 \u003cb class=\"key\">희귀 \u003c/b>\u003cb class=\"key\">혈액형\u003c/b>을 가진 사람은 정작 필요할 때 같은 혈액형의 피를 구하기가 무척 어렵습니다. 그래서 병원과 \u003cb class=\"key\">혈액은행\u003c/b>은 이런 사람들의 헌혈을 특별히 관리하고, 국가 차원의 기증자 등록 기관에 정보를 등록해 둡니다. 수술 중에 출혈이 심해지면 반드시 \u003cb class=\"key\">수혈\u003c/b>을 해야 하는데, 혈액형이 맞지 않으면 대신 사용할 수 있는 피가 없습니다. 이때 등록 기관이 전국에 있는 \u003cb class=\"key\">기증자\u003c/b>들의 정보를 뒤져 필요한 혈액을 찾아 주는 역할을 합니다. 이것은 마치 갑자기 목돈이 필요할 때를 대비해 통장에 넣어 두는 \u003cb class=\"key\">비상금\u003c/b>과 같습니다. 평소에 미리 저축해 둔 것이 결정적인 순간에 나를 살리는 것이지요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚고 갈게요. 사람의 혈액형은 종류가 아주 많아서, 드물게 나타나는 희귀 혈액형을 가진 사람은 같은 혈액형의 피를 구하기가 무척 어려워요. 그래서 병원이나 혈액은행에서는 이런 사람들의 헌혈을 특별히 관리하고, 필요할 때를 대비해 기증자 정보를 등록해 두죠. 수술 중에 피가 많이 나오면 반드시 수혈을 해야 하는데, 혈액형이 맞지 않으면 대신 쓸 수 있는 피가 없어요. 우리가 갑자기 목돈이 필요할 때를 대비해 통장에 넣어 두는 비상금을 꺼내 쓰는 것처럼, 헌혈도 평소에 미리 저축해 두는 안전장치인 셈이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>헌혈 요청과 사고\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>Patricia West는 \u003cb class=\"key\">희귀 \u003c/b>\u003cb class=\"key\">혈액형\u003c/b>을 가져서 지역 \u003cb class=\"key\">혈액은행\u003c/b>으로부터 헌혈을 해 달라는 요청을 늘 받았어요. 그 후 그녀는 고향인 플로리다 주에서 미시간 주로 이사를 갔고, 그곳에서 길을 건너다 갑자기 차에 치였습니다. 결국 그녀는 병원으로 옮겨져 \u003cb class=\"key\">응급 \u003c/b>\u003cb class=\"key\">수술\u003c/b>을 받아야 했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>피가 없다\u003csmall>문제 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>수술 도중 그녀는 \u003cb class=\"key\">피를 \u003c/b>\u003cb class=\"key\">많이 \u003c/b>\u003cb class=\"key\">흘리기\u003c/b> 시작했어요. 의사는 그녀와 같은 혈액형의 피를 \u003cb class=\"key\">긴급 \u003c/b>\u003cb class=\"key\">요청\u003c/b>했지만 전혀 구할 수가 없었습니다. \u003cb class=\"key\">미시간\u003c/b> 전체에서 Patricia와 같은 혈액형의 혈액은 없었던 거예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>등록 협회의 연락\u003csmall>전환 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>마침내 \u003cb class=\"key\">국립 \u003c/b>\u003cb class=\"key\">희귀 \u003c/b>\u003cb class=\"key\">혈액 \u003c/b>\u003cb class=\"key\">기증자 \u003c/b>\u003cb class=\"key\">등록 \u003c/b>\u003cb class=\"key\">협회\u003c/b>에 절박한 요청이 전해졌어요. 그러자 그들은 곧 플로리다에서 필요한 혈액을 찾았다는 \u003cb class=\"key\">대답\u003c/b>을 보냈습니다. 문제가 해결되는 순간이죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>자신의 피가 살리다\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>이용할 수 있는 유일한 혈액은 Patricia가 몇 달 전에 헌혈한 \u003cb class=\"key\">그녀 \u003c/b>\u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">혈액\u003c/b>이었어요. 결국 Patricia West는 \u003cb class=\"key\">헌혈한 \u003c/b>\u003cb class=\"key\">덕분\u003c/b>에 지금도 살아 있습니다. 이 글은 남을 돕는 헌혈이 자신의 생명을 지키는 일이 될 수 있음을 보여 줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 사건이 어떤 순서로 이어지는지 단계별로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. Patricia는 희귀 혈액형을 가져서 지역 혈액은행으로부터 헌혈을 해 달라는 요청을 늘 받았어요. 그런데 그녀는 고향인 플로리다 주에서 미시간 주로 이사를 갔고, 그곳에서 길을 건너다 갑자기 차에 치였죠. 그래서 병원으로 옮겨져 응급 수술을 받아야 했어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 문제가 생기는 부분이에요. 수술 도중 그녀는 피를 많이 흘리기 시작했어요. 의사는 그녀와 같은 혈액형의 피를 긴급 요청했지만 전혀 구할 수가 없었죠. 미시간 전체를 뒤져 봐도 Patricia와 같은 혈액형의 혈액은 없었어요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 상황이 뒤집히는 전환이에요. 마침내 국립 희귀 혈액 기증자 등록 협회에 절박한 요청이 전해졌어요. 그러자 그들은 곧 플로리다에서 필요한 혈액을 찾았다는 대답을 보내 왔죠.","hl":"f2"},{"n":7,"text":"마지막 단계는 결론이에요. 이용할 수 있는 유일한 혈액은 Patricia가 몇 달 전에 헌혈한 그녀 자신의 혈액이었어요. 결국 그녀는 헌혈한 덕분에 지금도 살아 있고, 이 글은 남을 돕는 일이 결국 자신을 돕는 일이 될 수 있다는 것을 보여 줘요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결(시간순)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 시간의 흐름을 따라 사건을 늘어놓으면서도, 중심에는 분명한 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">해결\u003c/b> 구도가 있습니다. 미시간에서 같은 혈액형의 피를 찾지 못해 생명이 위험해지는 문제가 제시되고, 그것이 몇 달 전 자신의 헌혈혈로 해결됩니다. 주제를 담은 문장이 맨 마지막에 나오므로 \u003cb class=\"key\">미괄식\u003c/b> 구조이며, 마지막 문장이 \u003cb class=\"key\">주제문\u003c/b> 역할을 합니다. 그래서 마지막 문장의 because가 앞의 사건 전체와 맺는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 읽어 내는 것이 핵심입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>so (1)\u003c/b>\u003cspan>인과(이유→결과) 제시\u003c/span>\u003cb>but (4)\u003c/b>\u003cspan>기대와 다른 상황으로의 반전\u003c/span>\u003cb>Finally (6)\u003c/b>\u003cspan>절박한 상황의 마무리·전환\u003c/span>\u003cb>Soon (7)\u003c/b>\u003cspan>빠른 시간 경과 표시\u003c/span>\u003cb>because (9)\u003c/b>\u003cspan>결론의 이유 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a rare blood type\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">her blood type\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">no blood of Patricia's type\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the needed blood\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the only blood available\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">her own blood\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 문제 해결 구조예요. 같은 혈액형의 피가 없어서 생명이 위험해지는 문제가 제시되고, 그것이 자신의 헌혈혈로 해결되니까요. 그리고 글의 주제를 담은 문장이 맨 마지막에 나오는 미괄식 구조예요. 그래서 마지막 주제문을 읽는 순간 글 전체의 의미가 완성된다는 점을 꼭 기억해 두세요.","hl":"ty"},{"n":9,"text":"신호어도 하나하나 챙겨야 해요. 첫 번째 문장의 so는 앞의 이유와 뒤의 결과를 이어 주는 표시이고, 네 번째 문장의 but은 기대와 다른 상황을 알려 주죠. 여섯 번째 문장의 Finally와 일곱 번째 문장의 Soon은 시간이 긴박하게 흘러가고 있음을 보여 주고, 마지막 문장의 because는 결론의 이유를 제시해요. 이렇게 인과 관계를 표시하는 말들을 따라가면 문제와 해결이 또렷하게 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>rare\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>희귀한, 드문\u003c/span>\u003c/div>\u003cdiv>\u003cb>blood type\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>혈액형\u003c/span>\u003c/div>\u003cdiv>\u003cb>donate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>헌혈하다, 기증하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>local\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지역의, 고장의\u003c/span>\u003c/div>\u003cdiv>\u003cb>blood bank\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>혈액은행\u003c/span>\u003c/div>\u003cdiv>\u003cb>state\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주(州)\u003c/span>\u003c/div>\u003cdiv>\u003cb>cross\u003c/b>\u003cem>동사\u003c/em>\u003cspan>건너다\u003c/span>\u003c/div>\u003cdiv>\u003cb>suddenly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>갑자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>be hit by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 치이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take A to B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B로 데려가다, 옮기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>emergency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>응급, 비상\u003c/span>\u003c/div>\u003cdiv>\u003cb>surgery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수술\u003c/span>\u003c/div>\u003cdiv>\u003cb>bleed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피를 흘리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>heavily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심하게, 많이\u003c/span>\u003c/div>\u003cdiv>\u003cb>surgeon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>외과 의사\u003c/span>\u003c/div>\u003cdiv>\u003cb>emergency call\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>긴급 요청, 긴급 연락\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾다, 발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>desperate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>절박한, 필사적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>donor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기증자\u003c/span>\u003c/div>\u003cdiv>\u003cb>registry\u003c/b>\u003cem>명사\u003c/em>\u003cspan>등록 협회, 등록부\u003c/span>\u003c/div>\u003cdiv>\u003cb>respond\u003c/b>\u003cem>동사\u003c/em>\u003cspan>응답하다, 대답하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>needed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>필요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>available\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이용할 수 있는, 구할 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>own\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자신의\u003c/span>\u003c/div>\u003cdiv>\u003cb>several\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>몇몇의, 여러\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어는 몇 개만 짚고 넘어갈게요. rare는 희귀한, donate는 헌혈하다는 뜻이고, bleed는 피를 흘리다, desperate는 절박한이라는 뜻이에요. available은 이용할 수 있는, 다시 말해 구할 수 있다는 의미로 꼭 알아 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">rare\u003c/b>\u003cspan class=\"m\">희귀한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">uncommon\u003c/span>\u003cspan class=\"s\">unusual\u003c/span>\u003cspan class=\"s\">scarce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">donate\u003c/b>\u003cspan class=\"m\">기증하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">give\u003c/span>\u003cspan class=\"s\">contribute\u003c/span>\u003cspan class=\"s\">provide\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">receive\u003c/span>\u003cspan class=\"a\">take\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">desperate\u003c/b>\u003cspan class=\"m\">절박한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">urgent\u003c/span>\u003cspan class=\"s\">frantic\u003c/span>\u003cspan class=\"s\">hopeless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">relaxed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">available\u003c/b>\u003cspan class=\"m\">이용할 수 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accessible\u003c/span>\u003cspan class=\"s\">obtainable\u003c/span>\u003cspan class=\"s\">usable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unavailable\u003c/span>\u003cspan class=\"a\">scarce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">respond\u003c/b>\u003cspan class=\"m\">응답하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reply\u003c/span>\u003cspan class=\"s\">answer\u003c/span>\u003cspan class=\"s\">react\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suddenly\u003c/b>\u003cspan class=\"m\">갑자기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">abruptly\u003c/span>\u003cspan class=\"s\">unexpectedly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">gradually\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">emergency\u003c/b>\u003cspan class=\"m\">응급\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">crisis\u003c/span>\u003cspan class=\"s\">urgency\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">routine\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. rare는 uncommon이나 unusual과 가깝고 반대말은 common이에요. donate는 give, contribute로 바꿔 쓸 수 있고, desperate는 urgent, frantic과 비슷하죠. available은 accessible, obtainable의 동의어이고 반대는 unavailable이에요. respond는 reply, answer로 바꿔 말할 수 있다는 점도 함께 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Patricia West는 희귀한 혈액형을 가지고 있다,\u003c/span>\u003cspan class=\"en\">Patricia West has a rare blood type,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그녀는 항상 요청받았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so\u003c/span> she \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">asked \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혈액을 기증하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">donate \u003c/span>\u003cspan class=\"tgt\">blood\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 사는 고장의 혈액은행에 의해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">local \u003c/span>\u003cspan class=\"tgt\">blood \u003c/span>\u003cspan class=\"tgt\">bank\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Patricia West 는 희귀한 혈액형 때문에 자신이 사는 고장의 혈액은행으로부터 헌혈을 하라는 요청을 늘 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Patricia West가 희귀 혈액형이라 평소 지역 혈액은행의 헌혈 요청을 자주 받았다는 배경을 제시한다. 이는 뒤에서 그녀가 과거에 헌혈한 피가 결국 자신을 살리는 \u003cb class=\"key\">복선\u003c/b>이 된다. rare blood type은 '희귀 혈액형', local blood bank는 '자신이 사는 고장의 혈액은행'이라는 뜻이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 so(결과)\u003c/span> : 원인 + so + 결과 : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태와 to부정사\u003c/span> : S + be asked + to + 동사원형 : \"항상 혈액을 기증하도록 요청받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태의 행위자 by구\u003c/span> : be + p.p. + by + 행위자 : \"자신이 사는 고장의 혈액은행에 의해\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Patricia West has a rare blood type, Patricia West는 희귀한 혈액형을 가지고 있다. so she was always asked, 그래서 그녀는 항상 요청받았다. to donate blood, 혈액을 기증하도록. by her local blood bank, 자신이 사는 고장의 혈액은행에 의해.. 이 문장 전체를 해석하면, Patricia West 는 희귀한 혈액형 때문에 자신이 사는 고장의 혈액은행으로부터 헌혈을 하라는 요청을 늘 받았다.","hl":"m"},{"n":13,"text":"이 문장은 Patricia West가 희귀 혈액형이라 평소 지역 혈액은행의 헌혈 요청을 자주 받았다는 배경을 보여 줘요. 이 사실은 뒤에서 그녀가 과거에 한 헌혈이 자신을 살리는 복선이 된다는 점에서 중요해요. rare blood type은 희귀 혈액형, local blood bank는 자신이 사는 고장의 혈액은행이라는 뜻이에요.","hl":"mn"},{"n":14,"text":"첫 번째로 so는 앞의 원인과 뒤의 결과를 이어 주는 접속사예요. 희귀 혈액형이라는 원인 때문에 헌혈 요청을 받았다는 결과가 자연스럽게 이어지죠. 두 번째로 was always asked to donate blood는 수동태에 to부정사가 결합한 형태로, 그녀가 스스로 요청한 것이 아니라 혈액은행에게 요청받았다는 점을 보여 줘요. 세 번째로 by her local blood bank에서 by는 수동태의 행위자를 나타내서 요청한 주체가 자신이 사는 고장의 혈액은행임을 분명히 해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">후에,\u003c/span>\u003cspan class=\"en\">Later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Patricia는 그녀의 고향인 플로리다 주에서 미시간 주로 이사했다,\u003c/span>\u003cspan class=\"en\">Patricia moved from her home state of Florida to Michigan,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서 그녀는 갑자기 차에 치였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">where\u003c/span> she \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">suddenly \u003c/span>\u003cspan class=\"tgt\">hit \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">car\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길을 건너고 있는 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">crossing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">street\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 병원으로 옮겨져야 했다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">taken\u003c/span> to the hospital\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">응급 수술을 위해.\u003c/span>\u003cspan class=\"en\">for emergency surgery.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">후에 Patricia 는 고향인 플로리다 주에서 미시간 주로 이사를 했는데, 그곳에서 그녀는 길을 건너다 갑자기 차에 치여 병원으로 옮겨져 응급 수술을 받아야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Patricia가 플로리다에서 미시간으로 이사한 뒤 교통사고를 당해 응급 수술이 필요하게 된 사건을 전한다. 이 사고가 뒤에서 자신이 과거에 헌혈한 피가 필요해지는 결정적 \u003cb class=\"key\">계기\u003c/b>가 된다. where는 앞의 Michigan을 받는 \u003cb class=\"key\">관계부사\u003c/b>이고, while crossing은 길을 건너는 동안이라는 \u003cb class=\"key\">분사구문\u003c/b>으로 이해한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사 where\u003c/span> : 선행사(장소) + where + 주어 + 동사 : \"그곳에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + p.p. + by + 행위자 : \"갑자기 차에 치였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문(while + 동사원형-ing)\u003c/span> : while + 동사원형-ing : \"길을 건너는 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">조동사 have to + 수동태\u003c/span> : had to + be + p.p. : \"옮겨져야 했다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Later, 후에. Patricia moved from her home state of Florida to Michigan, Patricia는 그녀의 고향인 플로리다 주에서 미시간 주로 이사했다. where she was suddenly hit by a car, 그곳에서 그녀는 갑자기 차에 치였다. while crossing the street, 길을 건너고 있는 동안. and had to be taken to the hospital, 그리고 병원으로 옮겨져야 했다. for emergency surgery, 응급 수술을 위해.. 이 문장 전체를 해석하면, 후에 Patricia 는 고향인 플로리다 주에서 미시간 주로 이사를 했는데, 그곳에서 그녀는 길을 건너다 갑자기 차에 치여 병원으로 옮겨져 응급 수술을 받아야 했다.","hl":"m"},{"n":16,"text":"이 문장은 Patricia가 플로리다에서 미시간으로 이사한 뒤 교통사고를 당해 응급 수술이 필요하게 된 사건을 전해요. 이 사고가 뒤에서 자신이 과거에 헌혈한 피가 필요해지는 결정적 계기가 된다는 점이 중요해요. where는 앞의 Michigan을 받는 관계부사이고, while crossing은 길을 건너는 동안이라는 분사구문으로 이해하면 돼요.","hl":"mn"},{"n":17,"text":"첫 번째로 where는 앞의 Michigan을 장소로 받아 그곳에서라는 뜻을 더하는 관계부사예요. 두 번째로 was suddenly hit by a car는 주어 she가 차에 의해 치인 대상이므로 수동태로 표현했어요. 세 번째로 while crossing the street는 접속사 while이 이끄는 절에서 주어와 be동사가 생략된 분사구문이에요. 네 번째로 had to be taken은 과거에 해야 했다는 have to의 의미에 주어가 병원으로 옮겨지는 수동태가 결합한 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수술 도중,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">During \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">surgery\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 시작했다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">피를 많이 흘리기.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">bleed \u003c/span>\u003cspan class=\"tgt\">heavily\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수술 도중, 그녀는 피를 많이 흘리기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수술 중에 Patricia가 심하게 출혈하기 시작해 상황이 위급해졌음을 보여 준다. 이 출혈 때문에 의료진이 그녀의 희귀 혈액형에 맞는 피를 급히 찾게 되는 \u003cb class=\"key\">위기\u003c/b>가 시작된다. began to bleed는 피를 흘리기 시작했다는 뜻으로, begin 뒤 \u003cb class=\"key\">to부정사\u003c/b>가 시작하다의 내용을 이어 주는 구조다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 during + 명사구(때)\u003c/span> : during + 명사(구) : \"수술 도중에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : begin + to + 동사원형 + 부사 : \"피를 많이 흘리기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"During the surgery, 수술 도중. she began, 그녀는 시작했다. to bleed heavily, 피를 많이 흘리기.. 이 문장 전체를 해석하면, 수술 도중, 그녀는 피를 많이 흘리기 시작했다.","hl":"m"},{"n":19,"text":"이 문장은 수술 중에 Patricia가 심하게 출혈하기 시작해 상황이 위급해졌음을 보여 줘요. 이 출혈 때문에 의료진이 그녀의 희귀 혈액형에 맞는 피를 급히 찾게 되는 위기가 시작되죠. began to bleed는 피를 흘리기 시작했다는 뜻으로, begin 뒤에 to부정사가 와서 시작하다의 내용을 이어 주는 구조예요.","hl":"mn"},{"n":20,"text":"첫 번째로 During the surgery에서 during은 특정 기간 중임을 나타내는 전치사예요. 두 번째로 began to bleed heavily에서 begin 뒤에 to부정사가 와서 피를 많이 흘리기 시작했다는 의미를 만들고, heavily는 bleed를 꾸미는 부사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 의사는\u003c/span>\u003cspan class=\"en\">The surgeon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긴급 요청을 했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">emergency \u003c/span>\u003cspan class=\"tgt\">call\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 혈액형에 대해\u003c/span>\u003cspan class=\"en\">for her blood type,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 전혀 구할 수가 없었다\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">none\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">found\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">의사는 그녀와 혈액형이 같은 혈액을 긴급 요청했지만, 전혀 구할 수가 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수술 중 과다 출혈이 시작된 Patricia를 살리기 위해 의사가 같은 혈액형의 피를 긴급히 요청했지만, 결국 아무것도 찾지 못했다는 내용이에요. \u003cb class=\"key\">긴급 \u003c/b>\u003cb class=\"key\">요청\u003c/b>이라는 절박한 행동과 \u003cb class=\"key\">전혀 \u003c/b>\u003cb class=\"key\">구할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없음\u003c/b>이라는 결과가 but으로 대조를 이루며, 다음 문장에서 미시건 전체를 뒤져도 없다는 \u003cb class=\"key\">위기\u003c/b>로 이어지는 흐름을 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 동사 make + 동족 목적어\u003c/span> : make [an emergency call (목적어)] → 긴급 요청을 하다 : \"긴급 요청을 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정대명사 none (단수 취급)\u003c/span> : none (of + 복수명사) + 단수동사 → 아무것도 ~없다 : \"아무것도 (없었다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태 (be동사 + 과거분사)\u003c/span> : none [주어] + was found [be동사 + 과거분사/수동태] → 아무것도 발견되지 않았다 : \"발견되지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The surgeon, 그 의사는. made an emergency call, 긴급 요청을 했다. for her blood type, 그녀의 혈액형에 대해. but none was found, 그러나 전혀 구할 수가 없었다. 이 문장 전체를 해석하면, 의사는 그녀와 혈액형이 같은 혈액을 긴급 요청했지만, 전혀 구할 수가 없었다.","hl":"m"},{"n":22,"text":"수술 도중 피가 많이 나기 시작해서 의사가 같은 혈액형의 피를 급하게 찾았지만 결국 하나도 없었다는 장면이에요. 긴급 요청을 했는데도 결과가 없다는 점이 but으로 딱 갈라지면서 위기감을 만들어 주죠. 그래서 다음 문장에서 미시건 전체를 다 뒤져도 없다는 이야기로 자연스럽게 넘어가요.","hl":"mn"},{"n":23,"text":"첫 번째로 made an emergency call을 보세요. call은 make와 짝을 이루어 긴급 요청을 하다라는 동족 목적어 표현을 만듭니다. 두 번째로 none은 앞에 나온 혈액을 대신 받는 대명사라서 하나도 없다는 뜻이고, 그래서 뒤 동사도 단수로 받아요. 세 번째로 was found는 수동태예요. 누가 찾았는지는 중요하지 않고 발견되지 않았다는 결과만 말하고 싶을 때 이렇게 be동사에 과거분사를 붙입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미시건 전체에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Michigan\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었는데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무런 혈액도 없었다\u003c/span>\u003cspan class=\"en\">no blood\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Patricia와 같은 혈액형의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Patricia's \u003c/span>\u003cspan class=\"tgt\">type\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미시건 전체에서, Patricia 와 같은 혈액형의 혈액은 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 찾지 못한 이유를 구체적으로 밝히는 문장이에요. 미시건이라는 \u003cb class=\"key\">공간 \u003c/b>\u003cb class=\"key\">전체\u003c/b>를 다 뒤져도 Patricia와 같은 혈액형의 피가 존재하지 않았다는 뜻으로, 문제의 심각성을 \u003cb class=\"key\">범위\u003c/b>를 넓혀 강조해요. 그래서 다음 문장에서 전국 단위의 기관에 도움을 청하는 \u003cb class=\"key\">전환\u003c/b>이 자연스러워져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법 (장소·범위)\u003c/span> : In [all of Michigan (전치사구)] , [주절] → 미시건 전체에서 : \"미시건 전체에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">유도부사 there + be동사 (존재 구문)\u003c/span> : There + be동사 + 주어 → ~이 있다/없다 : \"있었다 (없었다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식 + 소유격\u003c/span> : no blood + of [Patricia's type] → Patricia의 혈액형인 혈액 : \"Patricia와 같은 혈액형의\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In all of Michigan, 미시건 전체에서. there was, 있었는데. no blood, 아무런 혈액도 없었다. of Patricia's type, Patricia와 같은 혈액형의. 이 문장 전체를 해석하면, 미시건 전체에서, Patricia 와 같은 혈액형의 혈액은 없었다.","hl":"m"},{"n":25,"text":"앞에서 피를 못 찾았다는 이야기를, 미시건이라는 주 전체로 범위를 확 넓혀 확인해 주는 문장이에요. 같은 혈액형의 피가 이 넓은 곳 어디에도 존재하지 않았다는 뜻이라 상황이 얼마나 심각한지 확실히 보여 주죠. 그래서 다음에 국가 기관에 도움을 청하는 흐름으로 넘어가게 됩니다.","hl":"mn"},{"n":26,"text":"첫 번째로 there was는 존재 구문이에요. 정말 주어는 뒤에 있는 no blood이고, 그래서 be동사가 단수 was로 맞춰집니다. 두 번째로 In all of Michigan은 문장 앞에서 장소와 범위를 딱 정해 주는 전치사구예요. all of가 붙어서 미시건 전체라는 느낌을 강하게 만들어 주죠. 세 번째로 of Patricia's type은 앞의 blood를 뒤에서 꾸며 주는 전치사구예요. 어떤 종류의 피인지, 바로 Patricia와 같은 혈액형이라는 걸 알려 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마침내\u003c/span>\u003cspan class=\"en\">Finally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">절박한 요청이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">desperate \u003c/span>\u003cspan class=\"tgt\">call\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전해졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">sent\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국립 희귀 혈액 기증자 등록 협회에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">National \u003c/span>\u003cspan class=\"tgt\">Rare \u003c/span>\u003cspan class=\"tgt\">Donor \u003c/span>\u003cspan class=\"tgt\">Registry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마침내 국립 희귀 혈액 기증자 등록 협회에 절박한 요청이 전해졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미시건 안에서는 답이 없다는 것을 확인한 뒤, 마침내 전국 단위의 \u003cb class=\"key\">희귀 \u003c/b>\u003cb class=\"key\">혈액\u003c/b> 기증자 명단에 구조 요청을 보냈다는 문장이에요. desperate라는 형용사가 상황의 \u003cb class=\"key\">절박함\u003c/b>을 압축해서 보여 주고, Finally가 앞의 여러 실패를 정리하며 사건의 \u003cb class=\"key\">전환점\u003c/b>을 열어 줘요. 이 요청 덕분에 다음 문장에서 플로리다에서 피를 찾았다는好消息으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 형용사의 명사 수식\u003c/span> : [desperate (형용사)] + call (명사) → 절박한 요청 : \"절박한 요청\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 (be동사 + 과거분사)\u003c/span> : a desperate call [주어] + was sent [be동사 + 과거분사/수동태] → 요청이 보내졌다 : \"전해졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 to의 도달점 표시\u003c/span> : send [A] to [B] → A를 B에게 보내다 / be sent to [B] → B에 전해지다 : \"국립 희귀 혈액 기증자 등록 협회에\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Finally, 마침내. a desperate call, 절박한 요청이. was sent, 전해졌다. to the National Rare Donor Registry, 국립 희귀 혈액 기증자 등록 협회에. 이 문장 전체를 해석하면, 마침내 국립 희귀 혈액 기증자 등록 협회에 절박한 요청이 전해졌다.","hl":"m"},{"n":28,"text":"미시건에서는 답이 없다는 걸 확인하고, 마침내 나라 전체의 희귀 혈액 기증자 명단에 구조 요청을 보냈다는 장면이에요. desperate라는 단어 하나로 상황이 얼마나 다급했는지 느껴지죠. Finally가 앞의 실패들을 정리하면서 사건이 반전되는 지점을 열어 주고, 다음 문장에서 플로리다에서 피를 찾았다는 소식으로 이어집니다.","hl":"mn"},{"n":29,"text":"첫 번째로 a desperate call을 보면 desperate가 명사 call 앞에서 절박한이라는 감정과 상태를 한 단어로 압축해 줍니다. 두 번째로 was sent는 수동태예요. 보내는 사람이 아니라 요청이 전달된 결과에 초점을 맞출 때 이렇게 be동사에 과거분사를 씁니다. 세 번째로 to the National Rare Donor Registry에서 to는 요청이 도달하는 지점을 표시해요. 긴 기관 이름이니까 국립 희귀 혈액 기증자 등록 협회라는 덩어리로 통째로 익혀 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧\u003c/span>\u003cspan class=\"en\">Soon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 대답했다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">responded \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 필요한 혈액을 찾았다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">found\u003c/span> the \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">needed\u003c/span> blood\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플로리다에서\u003c/span>\u003cspan class=\"en\">in Florida.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 곧 플로리다에서 필요한 혈액을 찾았다는 대답을 보냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 긴급 요청에 대한 \u003cb class=\"key\">응답\u003c/b>이 플로리다에서 필요한 혈액을 찾았다는 소식으로 이어지는 대목이에요. 미시간 전역에서 혈액을 찾지 못해 절망하던 상황에서, 플로리다에 \u003cb class=\"key\">필요한 \u003c/b>\u003cb class=\"key\">혈액\u003c/b>이 있다는 희망이 생긴 것이죠. 다음 문장에서 그 혈액이 누구의 것인지 밝혀질 \u003cb class=\"key\">복선\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that절을 이끄는 접속사 that\u003c/span> : respond + that + [주어 + 동사] : \"~라고 대답했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료\u003c/span> : had + [과거분사] : \"찾았었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사 형용사\u003c/span> : the + [과거분사] + [명사] : \"필요한\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Soon, 곧. they responded, 그들은 대답했다. that they had found the needed blood, 그들이 필요한 혈액을 찾았다고. in Florida, 플로리다에서. 이 문장 전체를 해석하면, 그들은 곧 플로리다에서 필요한 혈액을 찾았다는 대답을 보냈다.","hl":"m"},{"n":31,"text":"이 문장은 긴급 요청에 대한 응답을 전하는 대목이에요. 미시간 전역에서 혈액을 찾지 못한 상황에서 플로리다에 필요한 혈액이 있다는 소식이 들어온 거죠. 여기서 플로리다라는 장소는 다음에 밝혀질 반전을 위한 복선 역할을 합니다.","hl":"mn"},{"n":32,"text":"첫 번째 어법은 responded 뒤의 that절이 대답한 내용을 이끈다는 점이에요. 두 번째는 had found가 대답이 오기 전에 이미 찾은 일이 먼저 있었다는 과거완료를 보여 준다는 점이고요. 세 번째는 needed가 blood가 필요해진 대상이라는 뜻으로 앞에서 꾸며 주는 과거분사라는 점이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이용할 수 있는 유일한 혈액은\u003c/span>\u003cspan class=\"en\">The only \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">blood \u003c/span>\u003cspan class=\"tgt\">available\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Patricia 자신의 것이었다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">Patricia's \u003c/span>\u003cspan class=\"tgt\">own\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 헌혈했던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">donated\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 달 전에\u003c/span>\u003cspan class=\"en\">several months before.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이용할 수 있는 유일한 혈액은 Patricia 가 몇 달 전에 헌혈한 그녀 자신의 혈액이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미시간 전역에서 찾지 못한 혈액이 결국 \u003cb class=\"key\">Patricia \u003c/b>\u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">혈액\u003c/b>이었다는 \u003cb class=\"key\">반전\u003c/b>을 보여 줍니다. 몇 달 전 그녀가 헌혈했던 피가 저장되어 있다가, 수술 중 위기에 놓인 그녀를 살린 것이죠. \u003cb class=\"key\">유일한 \u003c/b>\u003cb class=\"key\">혈액\u003c/b>이라는 표현이 이 상황의 절박함과 아이러니를 동시에 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 후치 수식\u003c/span> : [명사] + [형용사] : \"이용할 수 있는 혈액\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유대명사\u003c/span> : [소유격] + own : \"Patricia 자신의 것이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">계속적 관계대명사 which\u003c/span> : [선행사], which + [주어 + 동사] : \"그것은 그녀가 헌혈했던\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The only blood available, 이용할 수 있는 유일한 혈액은. was Patricia's own, Patricia 자신의 것이었다. which she had donated, 그녀가 헌혈했던. several months before, 몇 달 전에. 이 문장 전체를 해석하면, 이용할 수 있는 유일한 혈액은 Patricia 가 몇 달 전에 헌혈한 그녀 자신의 혈액이었다.","hl":"m"},{"n":34,"text":"이 문장은 미시간 전역에서 찾지 못한 혈액이 결국 Patricia 자신의 혈액이었다는 반전을 보여 줍니다. 몇 달 전 그녀가 헌혈했던 피가 저장되어 있다가 수술 중 위기에 놓인 그녀를 살린 것이죠. 유일한 혈액이라는 표현이 이 상황의 절박함과 아이러니를 동시에 드러냅니다.","hl":"mn"},{"n":35,"text":"첫 번째 어법은 available이 blood 뒤에서 이용할 수 있다는 뜻으로 꾸미는 후치 수식이에요. 두 번째는 Patricia's own이 앞의 blood를 받아 Patricia 자신의 혈액을 뜻하는 소유대명사 표현이라는 점이고요. 세 번째는 쉼표 뒤의 which가 앞의 Patricia's own을 추가 설명하는 계속적 관계대명사이고, had donated가 그보다 더 이전의 과거완료를 보여 준다는 점이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Patricia West는\u003c/span>\u003cspan class=\"en\">Patricia West\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날 살아 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lives \u003c/span>\u003cspan class=\"tgt\">today\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 헌혈했기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">gave \u003c/span>\u003cspan class=\"tgt\">blood\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Patricia West 는 헌혈한 덕분에 지금 살아 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Patricia가 오늘날 살아 있는 이유가 과거의 \u003cb class=\"key\">헌혈\u003c/b> 덕분이라는 결론이에요. 자신이 남긴 피가 자신을 살린 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 통해 헌혈의 가치를 강조합니다. 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 한 문장으로 압축한 마무리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재시제\u003c/span> : [주어] + [현재형 동사] : \"오늘날 살아 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유 접속사 because\u003c/span> : [주절] + because + [이유 절] : \"그녀가 헌혈했기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Patricia West, Patricia West는. lives today, 오늘날 살아 있다. because she gave blood, 그녀가 헌혈했기 때문에. 이 문장 전체를 해석하면, Patricia West 는 헌혈한 덕분에 지금 살아 있다.","hl":"m"},{"n":37,"text":"이 문장은 Patricia가 오늘날 살아 있는 이유가 과거의 헌혈 덕분이라는 결론이에요. 자신이 남긴 피가 자신을 살린 인과 관계를 통해 헌혈의 가치를 강조합니다. 글 전체의 주제를 한 문장으로 압축한 마무리입니다.","hl":"mn"},{"n":38,"text":"첫 번째 어법은 lives today가 현재 그녀가 살아 있음을 나타내는 현재시제라는 점이에요. 두 번째는 because she gave blood에서 because가 앞의 결과에 대한 이유를 뒤에서 밝히는 이유 접속사이고, gave가 과거에 헌혈한 과거 시제를 나타낸다는 점이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Patricia는 \u003cb class=\"key\">희귀 \u003c/b>\u003cb class=\"key\">혈액형\u003c/b> 때문에 지역 혈액은행으로부터 헌혈을 요청받는 삶을 살았다.\u003c/li>\u003cli>그녀는 고향 플로리다를 떠나 \u003cb class=\"key\">미시간\u003c/b>으로 이사했고, 그곳에서 교통사고로 응급 수술을 받던 중 피를 많이 흘렸다.\u003c/li>\u003cli>수술 중 같은 혈액형의 피를 \u003cb class=\"key\">긴급 \u003c/b>\u003cb class=\"key\">요청\u003c/b>했지만 미시간에는 없었고, 국립 희귀 혈액 기증자 등록 협회의 도움으로 플로리다에서 혈액을 찾았다.\u003c/li>\u003cli>결국 이용할 수 있었던 유일한 피는 그녀가 몇 달 전에 헌혈한 \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">혈액\u003c/b>이었고, 이것이 \u003cb class=\"key\">헌혈\u003c/b>의 가치를 보여 준다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Donating blood can end up saving your own life, as Patricia West survived only because the rare blood she had donated months earlier was available when no other matching blood could be found.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 희귀 혈액형 때문에 늘 헌혈을 요청받던 Patricia는 미시간으로 이사한 뒤 교통사고로 응급 수술을 받다가 그 지역에 같은 혈액형의 피가 없어 위기에 몰렸지만, 결국 \u003cb class=\"key\">플로리다\u003c/b>에서 몇 달 전 자신이 헌혈해 둔 \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">혈액\u003c/b> 덕분에 목숨을 구했다. 이 이야기는 \u003cb class=\"key\">헌혈\u003c/b>이 남을 돕는 일이면서 동시에 자신을 지키는 일이 될 수 있음을 보여 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 글의 핵심은 아주 단순해요. 평소에 해 둔 헌혈이 위급한 순간 자신의 목숨을 구했다는 것, 그리고 그 피가 미시간이 아니라 플로리다에 있던 그녀 자신의 혈액이었다는 것이죠. 시험에서는 마지막 문장의 because에 주목해서 주제를 잡으면 틀릴 일이 거의 없어요. 오늘도 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
