<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 8강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 8강 적용독해03","audioDir":"8-03_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">8강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Let Me Live Forever Through Others\u003c/h1>\u003ch2>다른 이들을 통해 영원히 살게 하오\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>화자는 뇌사 판정 뒤 기계로 \u003cb class=\"key\">연명\u003c/b>하지 말고 자신의 몸을 \u003cb class=\"key\">장기 \u003c/b>\u003cb class=\"key\">기증\u003c/b>해 다른 이들이 더 온전한 삶을 살도록 도와달라고 부탁한다. 마지막으로 어려운 사람에게 \u003cb class=\"key\">친절\u003c/b>을 베푸는 것이 자신을 \u003cb class=\"key\">영원\u003c/b>히 기억하는 길이라고 말한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The speaker asks others not to keep him alive by machine but to donate his body and remember him through kind deeds, so that he may live forever.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 글은 한 사람이 자신의 죽음 이후를 미리 부탁하는 유언 같은 글입니다. 화자는 뇌사 판정 뒤 기계로 연명하지 말고 자신의 몸을 장기 기증해 다른 사람이 더 온전한 삶을 살도록 도와달라고 합니다. 그리고 어려운 사람에게 친절을 베푸는 것이 자신을 영원히 기억하는 길이라고 말하죠. 요지는 기계에 매달리기보다 나눔과 친절로 영원한 삶을 남기자는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글은 \u003cb class=\"key\">뇌사\u003c/b>와 \u003cb class=\"key\">장기 \u003c/b>\u003cb class=\"key\">기증\u003c/b>을 둘러싼 한 사람의 유언을 담고 있습니다. 뇌사는 brain death라고 하며, 뇌의 기능이 완전히 멈추어 회복이 어렵다고 판단되는 상태입니다. 이런 상황에서 인공호흡기 같은 기계로 생명을 유지할 수 있지만, 화자는 그런 연명보다 자신의 장기를 필요한 사람에게 주는 \u003cb class=\"key\">장기 \u003c/b>\u003cb class=\"key\">기증\u003c/b>을 선택합니다. 장기 기증은 organ donation이라고 하며, 기증자 donor의 장기나 조직을 수혜자 recipient에게 옮기는 일입니다. 미리 자신의 뜻을 적어 두는 문서는 \u003cb class=\"key\">리빙 \u003c/b>\u003cb class=\"key\">윌\u003c/b> living will이라고 하며, 화자의 글도 그와 닮아 있습니다. 마치 여행을 떠나기 전에 소중한 물건을 필요한 사람에게 나눠 주는 것처럼, 그는 죽음 이후에도 다른 사람의 삶을 돕고 싶어 합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 뇌사는 brain death라고 하며, 뇌 기능이 완전히 멈추어 회복이 어렵다고 판단되는 상태입니다. 이런 때 인공호흡기 같은 기계로 생명을 유지할 수 있지만, 화자는 그런 연명보다 장기 기증을 선택합니다. 장기 기증은 organ donation이라고 하고, 기증자 donor의 장기나 조직을 수혜자 recipient에게 옮기는 일이죠. 미리 자신의 뜻을 적어 두는 문서는 리빙 윌 living will이라고 합니다. 여행을 떠나기 전에 소중한 물건을 필요한 사람에게 나눠 주는 일처럼, 그는 죽음 이후에도 다른 사람의 삶을 돕고 싶어 하는 겁니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>연명 거부\u003csmall>도입·주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>화자는 뇌가 멈추고 생명이 끝났다고 판정되는 날을 상정한다. 그때 기계를 사용해 \u003cb class=\"key\">연명\u003c/b>하려 하지 말라고 단호히 요청한다. 이 대목에서 화자는 죽음을 자연스러운 과정으로 받아들이고 있음이 드러난다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>신체 기증\u003csmall>구체적 실천 · 문장 3–7\u003c/small>\u003c/h4>\u003cp>화자는 자신의 몸을 다른 이들이 더 온전한 삶을 살도록 돕는 데 쓰게 해 달라고 한다. 시력, 심장, 신장, 뼈와 신경과 근육까지 나누어 \u003cb class=\"key\">기증\u003c/b>하자는 구체적 요청이 이어진다. 남은 몸은 태워 \u003cb class=\"key\">유골\u003c/b>을 바람에 뿌려 꽃이 자라게 해 달라고 말한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>친절로 기억\u003csmall>전환·당부 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>이제 화자는 묻어야 할 것이 있다면 자신의 잘못과 \u003cb class=\"key\">약점\u003c/b>을 묻으라고 말한다. 그리고 자신을 기억하려면 어려운 사람에게 \u003cb class=\"key\">친절\u003c/b>한 행동이나 말을 해 달라고 당부한다. 이는 기념비보다 살아 있는 친절의 실천을 바란다는 뜻이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>영원한 삶\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>마지막으로 화자는 자신이 부탁한 일을 모두 실천해 준다면 자신은 \u003cb class=\"key\">영원\u003c/b>히 살 것이라고 선언한다. 이는 육체의 죽음 너머로 남는 삶이 \u003cb class=\"key\">기증\u003c/b>과 친절의 실천 속에 있음을 보여 준다. 따라서 글 전체의 중심 생각은 마지막 문장에서 완성된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서 화자는 뇌가 멈추고 생명이 끝났다고 판정되는 날을 떠올립니다. 그때 기계를 사용해 연명하려 하지 말라고 단호하게 요청하죠. 죽음을 자연스러운 과정으로 받아들이는 태도가 드러납니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 자신의 몸을 다른 이들이 더 온전한 삶을 살도록 돕는 데 쓰게 해 달라고 합니다. 시력과 심장과 신장, 뼈와 신경과 근육까지 나누어 기증하자는 구체적인 요청이 이어집니다. 남은 몸은 태워 유골을 바람에 뿌려 꽃이 자라게 해 달라고 말합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 화자는 묻어야 할 것이 있다면 자신의 잘못과 약점을 묻으라고 말합니다. 그리고 자신을 기억하려면 어려운 사람에게 친절한 행동이나 말을 해 달라고 당부하죠. 기념비보다 살아 있는 친절의 실천을 바란다는 뜻입니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결론입니다. 화자는 자신이 부탁한 일을 모두 실천해 준다면 자신은 영원히 살 것이라고 선언합니다. 육체의 죽음 너머로 남는 삶이 기증과 친절의 실천 속에 있음을 보여 주죠. 그래서 글 전체의 중심 생각은 마지막 문장에서 완성됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-구체적 실천\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">시작 부분은 죽음의 상황을 제시하고, 이어서 기계로 \u003cb class=\"key\">연명\u003c/b>하지 말라는 요청과 신체 \u003cb class=\"key\">기증\u003c/b>, 친절로 기억해 달라는 당부를 차례로 나열한다. 구체적인 실천 요청이 계속된 뒤 마지막 문장에서 그 실천이 자신을 \u003cb class=\"key\">영원\u003c/b>히 살게 한다는 중심 생각이 제시된다. 그래서 중심 주장이 끝에 오는 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When that happens (2)\u003c/b>\u003cspan>조건·전환\u003c/span>\u003cb>If you must bury something (8)\u003c/b>\u003cspan>조건\u003c/span>\u003cb>If, by chance (9)\u003c/b>\u003cspan>조건\u003c/span>\u003cb>If you do all I have asked (10)\u003c/b>\u003cspan>결론·조건\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">my brain has stopped working\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">my life has ended\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">do not try to keep me alive\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">depend on a machine to exist\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">help others lead fuller lives\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I will live forever\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>기계로 연명하는 삶\u003c/th>\u003cth>몸을 나누는 삶\u003c/th>\u003c/tr>\u003ctr>\u003ctd>기계에 의존해 존재만 유지\u003c/td>\u003ctd>다른 이의 온전한 삶을 도움\u003c/td>\u003c/tr>\u003ctr>\u003ctd>죽음을 붙잡으려 함\u003c/td>\u003ctd>죽음 이후에도 의미를 남김\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 구체적 실천이 이어지는 방식으로 전개됩니다. 앞부분에서 기계로 연명하지 말라는 요청을 제시하고, 이어서 신체 기증과 친절로 기억해 달라는 실천을 차례로 나열하죠. 중심 생각은 마지막 문장에서야 나오므로 미괄식 구조입니다. 마지막의 영원한 삶이라는 표현이 모든 요청을 하나로 묶어 줍니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 흐름이 잘 보입니다. When that happens는 앞의 죽음 상황을 받아 다음 요청으로 넘어가게 해 주고, If you must bury something과 If, by chance는 조건을 붙여 당부를 이어 갑니다. 마지막의 If you do all I have asked는 결론을 이끄는 조건 표현이죠. 또 기계에 의존해 존재하는 삶과 다른 이의 온전한 삶을 돕는 기증을 대조하며 읽으면 화자의 선택이 더 분명해집니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>determine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다, 판정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>brain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뇌\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop working\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>작동을 멈추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for all practical purposes\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사실상\u003c/span>\u003c/div>\u003cdiv>\u003cb>end\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끝나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep alive\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>생명을 유지하다, 살려두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>through\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 통해\u003c/span>\u003c/div>\u003cdiv>\u003cb>machine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기계\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead fuller lives\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>더 온전한 삶을 살다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시력, 시각\u003c/span>\u003c/div>\u003cdiv>\u003cb>sunset\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일몰\u003c/span>\u003c/div>\u003cdiv>\u003cb>heart\u003c/b>\u003cem>명사\u003c/em>\u003cspan>심장\u003c/span>\u003c/div>\u003cdiv>\u003cb>kidney\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신장\u003c/span>\u003c/div>\u003cdiv>\u003cb>depend on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>의존하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>exist\u003c/b>\u003cem>동사\u003c/em>\u003cspan>존재하다, 살아가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뼈\u003c/span>\u003c/div>\u003cdiv>\u003cb>nerve\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신경\u003c/span>\u003c/div>\u003cdiv>\u003cb>muscle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>근육\u003c/span>\u003c/div>\u003cdiv>\u003cb>crippled\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>제대로 못 걷는, 불구의\u003c/span>\u003c/div>\u003cdiv>\u003cb>burn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>태우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>what is left\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>남은 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>scatter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>뿌리다, 흩뿌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ashes\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유해, 재\u003c/span>\u003c/div>\u003cdiv>\u003cb>bury\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fault\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잘못, 결점\u003c/span>\u003c/div>\u003cdiv>\u003cb>weakness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>약점\u003c/span>\u003c/div>\u003cdiv>\u003cb>by chance\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>혹시, 우연히\u003c/span>\u003c/div>\u003cdiv>\u003cb>kind deed\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>친절한 행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>in need\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어려움에 처한\u003c/span>\u003c/div>\u003cdiv>\u003cb>forever\u003c/b>\u003cem>부사\u003c/em>\u003cspan>영원히\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 몇 개 짚어 볼게요. determine은 판정하다, depend on은 의존하다, crippled는 제대로 못 걷는이라는 뜻입니다. keep alive는 살려두다, what is left는 남은 것이라는 표현으로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">determine\u003c/b>\u003cspan class=\"m\">결정하다, 판정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decide\u003c/span>\u003cspan class=\"s\">establish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">waver\u003c/span>\u003cspan class=\"a\">hesitate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">practical\u003c/b>\u003cspan class=\"m\">실질적인, 실제의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">functional\u003c/span>\u003cspan class=\"s\">realistic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">impractical\u003c/span>\u003cspan class=\"a\">theoretical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">keep alive\u003c/b>\u003cspan class=\"m\">살려두다, 유지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sustain\u003c/span>\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abandon\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">depend on\u003c/b>\u003cspan class=\"m\">의존하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rely on\u003c/span>\u003cspan class=\"s\">count on\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">be independent of\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">crippled\u003c/b>\u003cspan class=\"m\">제대로 못 걷는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disabled\u003c/span>\u003cspan class=\"s\">impaired\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">healthy\u003c/span>\u003cspan class=\"a\">able-bodied\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">bury\u003c/b>\u003cspan class=\"m\">묻다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inter\u003c/span>\u003cspan class=\"s\">conceal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exhume\u003c/span>\u003cspan class=\"a\">dig up\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remember\u003c/b>\u003cspan class=\"m\">기억하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recall\u003c/span>\u003cspan class=\"s\">commemorate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">forever\u003c/b>\u003cspan class=\"m\">영원히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eternally\u003c/span>\u003cspan class=\"s\">permanently\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">temporarily\u003c/span>\u003cspan class=\"a\">briefly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. determine은 decide나 establish와 가깝고, 반대로 waver처럼 결정을 못 내리는 뜻과는 반대입니다. depend on은 rely on이나 count on으로 바꿀 수 있고, crippled는 disabled나 impaired와 비슷하지만 healthy나 able-bodied와는 반대죠. remember는 recall이나 commemorate로, forever는 eternally나 permanently로 바꿀 수 있습니다. 반대로 forget이나 temporarily를 떠올리면 의미가 더 선명해집니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그날이 올 겁니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">day \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사가 판정할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">doctor \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">determine\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 뇌가 활동을 멈췄다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">brain \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">stopped \u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 사실상\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and, \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">practical \u003c/span>\u003cspan class=\"tgt\">purposes, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 생명이 다했다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">life \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">ended\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나의 뇌가 활동을 멈춰 사실상 생명이 다했다고 의사가 판정할 날이 올 겁니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글쓴이가 자신의 \u003cb class=\"key\">죽음\u003c/b>을 어떤 기준으로 판단할지 제시하며, 뒤에 이어질 \u003cb class=\"key\">장기 \u003c/b>\u003cb class=\"key\">기증\u003c/b>과 유언의 출발점을 만듭니다. 'for all practical purposes'는 의학적 판정과 별개로 \u003cb class=\"key\">사실상\u003c/b> 생명이 끝난 상태를 뜻하는 표현이에요. 'The day will come when ~'은 '~할 날이 올 것이다'라는 구조로, when절이 The day를 꾸밉니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사 when(선행사 The day 수식)\u003c/span> : 선행사(The day) + [when + 주어 + 동사] : \"의사가 판정할 날이 올 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(determine의 목적어)\u003c/span> : determine + that + 주어 + 동사 ~ : \"나의 뇌가 활동을 멈춰 사실상 생명이 다했다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재완료(has + 과거분사)\u003c/span> : has + stopped(과거분사) : \"활동을 멈췄다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The day will come, 그날이 올 겁니다. when a doctor will determine, 의사가 판정할. that my brain has stopped working, 나의 뇌가 활동을 멈췄다고. and, for all practical purposes, 그리고 사실상. my life has ended, 내 생명이 다했다고. 이 문장 전체를 해석하면, 나의 뇌가 활동을 멈춰 사실상 생명이 다했다고 의사가 판정할 날이 올 겁니다.","hl":"m"},{"n":13,"text":"이 문장은 글쓴이가 자신의 죽음을 어떤 기준으로 판단할지 먼저 제시하는 부분이에요. for all practical purposes는 사실상이라는 뜻으로, 의학적 판정이 사실상 생명의 끝이라는 점을 강조하죠. 그래서 뒤에 이어지는 장기 기증과 유언의 출발점이 되는 문장이에요.","hl":"mn"},{"n":14,"text":"첫 번째로 The day will come when a doctor will determine에서 when은 앞의 선행사 The day를 꾸미는 관계부사예요. 두 번째로 that my brain has stopped working and, for all practical purposes, my life has ended에서 that은 determine의 목적어 역할을 하는 명사절을 이끌어요. 세 번째로 has stopped working은 현재완료로, 뇌가 활동을 멈춘 상태가 완료되었음을 보여 주고, stopped는 stop의 과거분사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 일이 생기면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">happens\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 살려두려고 하지 마시오\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">try \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">alive\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기계를 사용해서\u003c/span>\u003cspan class=\"en\">through the use of a machine.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 일이 생기면, 기계를 사용해서 나를 살려두려고 하지 마시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 말한 \u003cb class=\"key\">죽음\u003c/b>의 순간에 \u003cb class=\"key\">연명 \u003c/b>\u003cb class=\"key\">치료\u003c/b>를 거부하는 핵심 요청이에요. 'try to keep me alive'는 '나를 살려두려고 애쓰다'이고, 'through the use of a machine'은 기계 사용을 통해라는 수단을 나타냅니다. 명령문 'do not try'로 글쓴이의 단호한 \u003cb class=\"key\">의지\u003c/b>를 드러내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절을 이끄는 접속사 when\u003c/span> : When + 주어 + 동사, + 주절 : \"그런 일이 생기면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정 명령문\u003c/span> : Do not + 동사원형 ~ : \"나를 살려두려고 하지 마시오\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(try의 목적어)\u003c/span> : try + [to + 동사원형] : \"나를 살려두려고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">keep + 목적어 + 목적격보어(형용사)\u003c/span> : keep + 목적어 + 형용사 : \"나를 살아 있게 유지하다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"When that happens, 그런 일이 생기면. do not try to keep me alive, 나를 살려두려고 하지 마시오. through the use of a machine, 기계를 사용해서. 이 문장 전체를 해석하면, 그런 일이 생기면, 기계를 사용해서 나를 살려두려고 하지 마시오.","hl":"m"},{"n":16,"text":"이 문장은 앞에서 말한 죽음의 순간에 연명 치료를 거부하는 핵심 요청이에요. try to keep me alive는 나를 살려두려고 애쓰다는 뜻이고, through the use of a machine은 기계 사용을 통해라는 수단을 나타내죠. 부정 명령문 do not try로 글쓴이의 단호한 의지를 보여 줍니다.","hl":"mn"},{"n":17,"text":"첫 번째로 When that happens에서 when은 시간 부사절을 이끄는 접속사예요. 두 번째로 do not try to keep me alive는 부정 명령문으로 do not 뒤에 동사원형 try가 왔죠. 세 번째로 to keep me alive에서 to부정사는 try의 목적어 역할을 해요. 네 번째로 keep me alive는 목적어 me 뒤에 목적격보어 alive가 와서 나를 살아 있게 유지하다는 뜻을 만들어요. 여기서 alive는 형용사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 몸을 사용하시오\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Use \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">body\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 이들을 돕기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">others \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 온전한 삶을 살도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">lead \u003c/span>\u003cspan class=\"tgt\">fuller \u003c/span>\u003cspan class=\"tgt\">lives\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 몸이 다른 이들이 더 온전한 삶을 살아가는 데 도움이 되도록 사용되게 하시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글쓴이가 자신의 \u003cb class=\"key\">몸\u003c/b>을 \u003cb class=\"key\">장기 \u003c/b>\u003cb class=\"key\">기증\u003c/b>과 이웃 도움에 쓰라는 핵심 요청이에요. 'help others lead fuller lives'는 '다른 사람들이 더 온전한 삶을 살도록 돕다'라는 뜻으로, help 뒤에 목적어와 동사원형이 이어지는 구조입니다. 앞 문장의 연명 치료 거부와 이어져, 죽음 이후에도 \u003cb class=\"key\">생명 \u003c/b>\u003cb class=\"key\">나눔\u003c/b>을 실천하겠다는 의지를 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : 동사원형 + 목적어 : \"내 몸을 사용하시오\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : 주절 + [to + 동사원형] : \"다른 이들을 돕기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">help + 목적어 + 동사원형(목적격보어)\u003c/span> : help + 목적어 + 동사원형 : \"다른 이들이 더 온전한 삶을 살도록 돕다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Use my body, 내 몸을 사용하시오. to help others, 다른 이들을 돕기 위해. lead fuller lives, 더 온전한 삶을 살도록. 이 문장 전체를 해석하면, 내 몸이 다른 이들이 더 온전한 삶을 살아가는 데 도움이 되도록 사용되게 하시오.","hl":"m"},{"n":19,"text":"이 문장은 글쓴이가 자신의 몸을 장기 기증과 이웃 도움에 쓰라는 핵심 요청이에요. help others lead fuller lives는 다른 사람들이 더 온전한 삶을 살도록 돕는다는 뜻으로, help 뒤에 목적어와 동사원형이 이어지는 구조죠. 앞 문장의 연명 치료 거부와 이어져 죽음 이후에도 생명 나눔을 실천하겠다는 의지를 보여 줍니다.","hl":"mn"},{"n":20,"text":"첫 번째로 Use my body는 동사원형으로 시작하는 명령문이에요. 글쓴이가 독자에게 직접 요청하는 힘을 줍니다. 두 번째로 to help others에서 to부정사는 목적을 나타내는 부사적 용법이에요. 세 번째로 help others lead fuller lives에서 help는 목적어 others 뒤에 동사원형 lead를 목적격보어로 취해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 시력은 주도록 하시오\u003c/span>\u003cspan class=\"en\">Give my sight\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 사람에게\u003c/span>\u003cspan class=\"en\">to a person\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 번도 본 적이 없는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">seen \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아기의 웃는 얼굴이나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">baby's \u003c/span>\u003cspan class=\"tgt\">smiling \u003c/span>\u003cspan class=\"tgt\">face \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멋진 일몰을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">beautiful \u003c/span>\u003cspan class=\"tgt\">sunset\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 시력은 아기의 웃는 얼굴이나 멋진 일몰을 한 번도 본 적이 없는 사람에게 주도록 하시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시력을 기증하라는 당부로, 베풂의 대상을 구체적으로 제시하는 문장입니다. a person who has never seen은 \u003cb class=\"key\">관계대명사\u003c/b>절이 앞의 사람을 꾸미는 구조예요. 아기의 웃는 얼굴과 멋진 일몰은 \u003cb class=\"key\">시력\u003c/b>이 있어야만 누릴 수 있는 소중한 장면을 상징합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 who(주격, 제한적 용법)\u003c/span> : [선행사 a person] + [who + 동사 ~] → ~하는 사람 : \"아기의 웃는 얼굴이나 멋진 일몰을 한 번도 본 적이 없는 사람\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료(경험의 부정)\u003c/span> : [have/has + never + 과거분사] → 지금까지 ~해 본 적이 없다 : \"한 번도 본 적이 없다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Give my sight, 내 시력은 주도록 하시오. to a person, 한 사람에게. who has never seen, 한 번도 본 적이 없는. a baby's smiling face, 아기의 웃는 얼굴이나. or a beautiful sunset, 멋진 일몰을. 이 문장 전체를 해석하면, 내 시력은 아기의 웃는 얼굴이나 멋진 일몰을 한 번도 본 적이 없는 사람에게 주도록 하시오.","hl":"m"},{"n":22,"text":"이 문장은 내 시력을 다른 사람에게 주라는 당부예요. 여기서 관계대명사 who는 앞에 나온 a person을 받아서 그런 사람에게 주라고 대상을 콕 집어 주죠. 시력이 있어야만 볼 수 있는 아기의 웃는 얼굴과 멋진 일몰을 떠올리면 왜 하필 시력을 주라고 했는지 바로 이해가 될 거예요.","hl":"mn"},{"n":23,"text":"먼저 a person who has never seen을 보세요. 선행사가 사람이고 뒤에 동사가 이어지니까 주격 관계대명사 who를 쓴 거예요. 다음으로 has never seen은 지금까지 한 번도 본 적이 없다는 경험을 말하는 현재완료 표현이에요. 그래서 해석도 한 번도 본 적이 없는으로 자연스럽게 이어지는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 심장과 신장은 주도록 하시오\u003c/span>\u003cspan class=\"en\">Give my heart and kidneys\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 사람에게\u003c/span>\u003cspan class=\"en\">to one\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기계장치에 의존해 살아가는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">depends \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">machine\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">존재하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">exist\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 심장과 신장은 기계장치에 의존해 살아가는 사람에게 주시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심장과 신장을 기증하라는 당부입니다. one은 앞에 나온 사람을 대신하는 \u003cb class=\"key\">대명사\u003c/b>이고, who depends on a machine은 그 사람을 설명하는 \u003cb class=\"key\">관계대명사\u003c/b>절이에요. 기계에 의존해야만 살아가는 사람에게 \u003cb class=\"key\">생명\u003c/b>을 이어 주라는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 who(주격)\u003c/span> : [선행사 one] + [who + 동사 depends] → ~에 의존하는 사람 : \"기계장치에 의존해 살아가는 사람\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주절] + [to + 동사원형] → ~하기 위해 : \"존재하기 위해, 살아가기 위해\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Give my heart and kidneys, 내 심장과 신장은 주도록 하시오. to one, 한 사람에게. who depends on a machine, 기계장치에 의존해 살아가는. to exist, 존재하기 위해. 이 문장 전체를 해석하면, 내 심장과 신장은 기계장치에 의존해 살아가는 사람에게 주시오.","hl":"m"},{"n":25,"text":"이 문장은 내 심장과 신장을 다른 사람에게 주라는 당부예요. 여기서 one은 앞에 나온 사람을 대신하는 대명사이고, who depends on a machine은 그 사람이 어떤 사람인지 설명하는 관계대명사절이에요. 기계에 의존해야만 살아가는 사람에게 생명을 이어 주라는 따뜻한 뜻이 담겨 있죠.","hl":"mn"},{"n":26,"text":"먼저 one who depends on a machine을 보면, 선행사 one이 사람을 가리키고 뒤에 동사 depends가 오니까 주격 관계대명사 who를 썼어요. 다음으로 to exist는 왜 기계에 의존하는지를 알려 주는 목적의 to부정사예요. 그래서 기계장치에 의존해 살아가는 사람이라고 해석하는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 뼈와\u003c/span>\u003cspan class=\"en\">Take my bones,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 몸의 모든 신경, 근육들은 가져다\u003c/span>\u003cspan class=\"en\">every nerve and muscle in my body,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 방법을 찾도록 하시오\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제대로 못 걷는 아이를 걷게 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">crippled \u003c/span>\u003cspan class=\"tgt\">child \u003c/span>\u003cspan class=\"tgt\">walk\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 뼈와 내 몸의 모든 신경, 근육들은 가져다 제대로 못 걷는 아이를 걷게 하는 방법을 찾도록 하시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 한 문장 안에 여러 당부를 담아낸 부분입니다. Take와 find가 and로 이어지는 \u003cb class=\"key\">병렬\u003c/b> 구조이고, a way to make는 '~하게 하는 방법'이라는 \u003cb class=\"key\">형용사적 \u003c/b>\u003cb class=\"key\">용법\u003c/b>의 to부정사예요. make는 \u003cb class=\"key\">사역동사\u003c/b>라서 목적어 뒤에 동사원형 walk가 옵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문의 병렬 구조(and)\u003c/span> : [동사원형 A], and [동사원형 B] → ~하고, 그리고 ~하시오 : \"그리고 방법을 찾도록 하시오\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 a way] + [to + 동사원형] → ~할 방법 : \"제대로 못 걷는 아이를 걷게 하는 방법\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 동사원형\u003c/span> : [사역동사 make] + [목적어 a crippled child] + [동사원형 walk] → ~가 …하게 하다 : \"제대로 못 걷는 아이를 걷게 하다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Take my bones, 내 뼈와. every nerve and muscle in my body, 내 몸의 모든 신경, 근육들은 가져다. and find a way, 그리고 방법을 찾도록 하시오. to make a crippled child walk, 제대로 못 걷는 아이를 걷게 하는. 이 문장 전체를 해석하면, 내 뼈와 내 몸의 모든 신경, 근육들은 가져다 제대로 못 걷는 아이를 걷게 하는 방법을 찾도록 하시오.","hl":"m"},{"n":28,"text":"이 문장은 시신의 여러 부분을 나눠 주라는 당부를 한 번에 담고 있어요. Take와 find가 and로 이어지는 병렬 구조라서 두 가지 당부가 나란히 놓여 있죠. a way to make는 방법이라는 명사를 꾸미는 형용사적 용법이고, make는 사역동사라서 아이를 걷게 하다라는 뜻이 돼요.","hl":"mn"},{"n":29,"text":"먼저 Take my bones와 and find a way를 보면 동사원형으로 시작하는 명령문 두 개가 and로 이어진 병렬 구조예요. 다음으로 a way to make에서 to make는 앞의 명사 a way를 꾸며 주는 형용사적 용법이에요. 마지막으로 make a crippled child walk에서 make는 사역동사라서 목적격 보어로 to가 없는 동사원형 walk를 씁니다. 그래서 제대로 못 걷는 아이를 걷게 하는 방법을 찾으라는 해석이 나오는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남은 것은 태워서\u003c/span>\u003cspan class=\"en\">Burn \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">left\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 유해를 뿌려 주시오\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">scatter \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">ashes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바람에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">wind\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꽃이 잘 자라게 돕도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">flowers \u003c/span>\u003cspan class=\"tgt\">grow\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">남은 것은 태워서 (거름이 되어) 꽃이 잘 자라게 돕도록 나의 유해를 바람에 뿌려 주시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 죽은 뒤 자기 몸을 어떻게 처리해 달라는 부탁의 문장이에요. 남은 몸은 태우고 유해는 바람에 뿌려서 꽃이 자라는 데 \u003cb class=\"key\">거름\u003c/b>이 되게 해 달라는 뜻이죠. 자기 존재를 자연으로 돌려 다른 생명을 돕게 하겠다는 \u003cb class=\"key\">비유\u003c/b>로 읽으면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what + 수동태\u003c/span> : [what (선행사 포함) + be동사 + p.p.] : \"남아 있는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문과 동사의 병렬(and)\u003c/span> : [동사원형 ~] and [동사원형 ~] : \"그리고 나의 유해를 바람에 뿌려 주시오\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적) + help+목적어+동사원형\u003c/span> : [to + 동사원형 (목적)] / help + [목적어] + [(동사원형) 목적격 보어] : \"꽃이 잘 자라게 돕도록\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Burn what is left, 남은 것은 태워서. and scatter my ashes, 나의 유해를 뿌려 주시오. in the wind, 바람에. to help the flowers grow, 꽃이 잘 자라게 돕도록. 이 문장 전체를 해석하면, 남은 것은 태워서 (거름이 되어) 꽃이 잘 자라게 돕도록 나의 유해를 바람에 뿌려 주시오.","hl":"m"},{"n":31,"text":"이 문장은 자기가 죽은 뒤 몸을 어떻게 처리해 달라는 부탁이에요. 남은 몸은 태우고 유해는 바람에 뿌려서 꽃이 잘 자라는 데 거름이 되게 해 달라는 거죠. 다시 말해 자기 몸이 자연으로 돌아가 다른 생명을 돕는 비유로 읽으면 됩니다.","hl":"mn"},{"n":32,"text":"먼저 what is left를 보세요. what은 선행사를 포함한 관계대명사이고, is left는 수동태로 '남겨지는'이라는 뜻이에요. 그래서 '남아 있는 것'이 되는 거죠. 다음으로 Burn과 scatter를 보면 둘 다 동사원형으로 시작하는 명령문이고 and로 병렬 연결되어 있으니 '태우고 뿌려라'처럼 두 동작을 나란히 읽으면 됩니다. 마지막으로 to help the flowers grow에서 to는 목적을 나타내는 부사적 용법이고, help는 목적격 보어로 동사원형 grow를 데려와요. help 뒤에는 to를 쓰지 않는다는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뭔가를 묻어야 한다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">bury \u003c/span>\u003cspan class=\"tgt\">something\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 ~이 되게 해주시오\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">let \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 잘못과 약점\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">faults \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">weaknesses\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">뭔가를 묻어야 한다면, 그것이 나의 잘못과 약점이 되게 해주시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> '무언가를 꼭 묻어야만 한다면, 그것이 나의 \u003cb class=\"key\">잘못\u003c/b>과 \u003cb class=\"key\">약점\u003c/b>이 되게 해 달라'는 뜻이에요. 무덤이나 비석 대신 자기 부족함을 남기겠다는 \u003cb class=\"key\">겸손\u003c/b>의 표현이죠. 앞에서 몸을 모두 나눠 주라는 흐름과 이어져, 자신을 낮추는 태도를 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 접속사 if + 조동사 must\u003c/span> : If + [주어] + [동사], [주절] : \"만약 뭔가를 묻어야 한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 let + 목적어 + 동사원형\u003c/span> : let + [목적어] + [동사원형 (목적격 보어)] : \"그것이 나의 잘못과 약점이 되게 해주시오\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"If you must bury something, 뭔가를 묻어야 한다면. let it be, 그것이 ~이 되게 해주시오. my faults and weaknesses, 나의 잘못과 약점. 이 문장 전체를 해석하면, 뭔가를 묻어야 한다면, 그것이 나의 잘못과 약점이 되게 해주시오.","hl":"m"},{"n":34,"text":"이 문장은 무언가를 꼭 묻어야만 한다면, 그것이 나의 잘못과 약점이기를 바란다는 뜻이에요. 무덤이나 비석 대신 자기 부족함을 남기겠다는 겸손의 표현이죠. 앞에서 몸을 모두 나눠 주라는 흐름과 이어져서 자신을 낮추는 태도를 보여 줍니다.","hl":"mn"},{"n":35,"text":"먼저 If you must bury something에서 if는 조건을 이끄는 접속사예요. must가 붙어서 '굳이 묻어야만 한다면'이라는 양보의 느낌까지 살려 주면 좋아요. 다음으로 let it be my faults and weaknesses에서 let은 사역동사라서 목적격 보어로 동사원형 be를 씁니다. 여기서 it은 앞에 나온 something을 받는 대명사라는 점도 꼭 챙기세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 혹시라도\u003c/span>\u003cspan class=\"en\">If, by chance,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 기억하고자 한다면,\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wish \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">remember \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇게 해주오\u003c/span>\u003cspan class=\"en\">please \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">so\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">친절을 베푸는 것으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">deed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 친절한 말을 건네는 것으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">giving \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">word\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어려움에 처한 사람에게\u003c/span>\u003cspan class=\"en\">to \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">someone \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">need\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 혹시라도 나를 기억하고자 한다면, 어려움에 처한 사람에게 친절을 베풀거나 친절한 말을 건네는 것으로 나를 기억해주오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> '나를 기억하고 싶다면, 나를 기억하는 대신 어려운 사람에게 친절을 베풀어 달라'는 부탁이에요. \u003cb class=\"key\">기억\u003c/b>을 말이 아니라 \u003cb class=\"key\">행동\u003c/b>으로 바꾸라는 메시지죠. 마지막에 '영원히 살게 될 것'이라고 말하는 \u003cb class=\"key\">핵심\u003c/b> 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">wish + to부정사(목적어)\u003c/span> : wish + [to부정사 (목적어)] : \"나를 기억하기를 바라다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대동사 do + so\u003c/span> : do so = 앞에 나온 [동사구]를 대신함 : \"그렇게 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사 / 동명사의 병렬\u003c/span> : by + [동명사 ~] or [동명사 ~] : \"친절을 베풀거나 친절한 말을 건네는 것으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 후치수식\u003c/span> : [명사] + [전치사구 (형용사 역할)] : \"어려움에 처한 사람\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"If, by chance, 만약 혹시라도. you wish to remember me, 나를 기억하고자 한다면. please do so, 그렇게 해주오. by doing a kind deed, 친절을 베푸는 것으로. or giving a kind word, 혹은 친절한 말을 건네는 것으로. to someone in need, 어려움에 처한 사람에게. 이 문장 전체를 해석하면, 만약 혹시라도 나를 기억하고자 한다면, 어려움에 처한 사람에게 친절을 베풀거나 친절한 말을 건네는 것으로 나를 기억해주오.","hl":"m"},{"n":37,"text":"이 문장은 나를 기억하고 싶다면, 나를 기억하는 대신 어려운 사람에게 친절을 베풀어 달라는 부탁이에요. 기억을 말이 아니라 행동으로 바꾸라는 메시지죠. 그래서 마지막에 나오는 영원히 살게 될 거라는 말로 이어지는 핵심 문장입니다.","hl":"mn"},{"n":38,"text":"먼저 wish to remember me에서 wish는 to부정사를 목적어로 데려와 '~하기를 바라다'가 됩니다. 다음으로 do so는 앞에 나온 remember me를 대신하는 표현이고, 같은 말을 반복하지 않으려는 대용 장치예요. 그리고 by doing a kind deed or giving a kind word에서 by 뒤에는 동명사가 와서 수단을 나타내고, doing과 giving이 or로 병렬을 이루고 있어요. 마지막으로 someone in need에서 in need는 앞의 someone을 뒤에서 꾸며 주는 후치수식이고, need는 여기서 궁핍이라는 뜻의 명사로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 네가 한다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 부탁한 모든 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">asked\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 영원히 살 것이오\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">live \u003c/span>\u003cspan class=\"tgt\">forever\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 부탁한 것을 다 들어준다면, 나는 영원히 살 것이오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 \u003cb class=\"key\">결론\u003c/b>에 해당하는 문장으로, 남긴 부탁을 모두 실천해 주면 자신은 영원히 살게 된다는 뜻이에요. 여기서 'live forever'는 실제로 숨 쉬며 사는 것이 아니라 사람들의 \u003cb class=\"key\">기억\u003c/b> 속에서 정신적으로 불멸한다는 \u003cb class=\"key\">비유\u003c/b>예요. If 조건문을 써서 부탁의 \u003cb class=\"key\">이행\u003c/b>과 영원한 기억을 인과적으로 연결하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건 부사절의 현재시제(미래 대용)\u003c/span> : If + 주어 + 동사(현재시제), 주어 + will + 동사 : \"만약 네가 한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that의 생략\u003c/span> : all + [(that) + 주어 + 동사] (목적격 관계대명사 생략) : \"내가 부탁한 모든 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주절의 미래 시제 will\u003c/span> : 주어 + will + 동사원형 + [forever (부사)] : \"나는 영원히 살 것이오\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"If you do, 만약 네가 한다면. all I have asked, 내가 부탁한 모든 것을. I will live forever, 나는 영원히 살 것이오. 이 문장 전체를 해석하면, 내가 부탁한 것을 다 들어준다면, 나는 영원히 살 것이오.","hl":"m"},{"n":40,"text":"이 문장은 글 전체의 결론이에요. 내가 부탁한 것을 다 들어준다면 나는 영원히 살 것이오, 라는 뜻이죠. live forever는 실제로 숨 쉬며 사는 게 아니라 사람들 기억 속에서 정신적으로 불멸한다는 비유예요. if 조건문을 써서 부탁의 이행과 영원한 기억을 자연스럽게 이어 주고 있어요.","hl":"mn"},{"n":41,"text":"어법 포인트를 순서대로 짚어 볼게요. 첫 번째, If you do에서 if는 조건을 나타내는 접속사인데 조건 부사절 안에서는 미래의 일도 현재시제로 써요. 그래서 will do가 아니라 do가 된 거죠. 두 번째, all I have asked는 목적격 관계대명사 that이 생략된 형태예요. 선행사 all 뒤에 that이 원래 오는데 목적격이라 생략된 거고, 내가 부탁한 모든 것이라는 뜻이에요. 세 번째, 주절의 I will live forever에서 will이 진짜 미래를 담당해요. 조건절은 현재, 주절은 미래라는 시제 짝을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>화자는 뇌사 판정 뒤 기계로 \u003cb class=\"key\">연명\u003c/b>하지 말고 자신의 몸을 \u003cb class=\"key\">기증\u003c/b>해 달라고 부탁한다.\u003c/li>\u003cli>그는 시력, 심장, 신장, 뼈와 신경까지 다른 사람의 삶을 돕는 데 쓰게 해 달라고 한다.\u003c/li>\u003cli>남은 몸은 태워 \u003cb class=\"key\">유골\u003c/b>을 바람에 뿌리고, 묻을 것이 있다면 자신의 \u003cb class=\"key\">약점\u003c/b>을 묻으라고 말한다.\u003c/li>\u003cli>어려운 사람에게 \u003cb class=\"key\">친절\u003c/b>을 베푸는 것이 그를 \u003cb class=\"key\">영원\u003c/b>히 기억하는 길이며, 이는 육체를 넘어선 삶을 뜻한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The speaker asks others not to keep him alive by machine but to donate his body and remember him through kind deeds, so that he may live forever.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">화자는 뇌사 판정 뒤 기계로 \u003cb class=\"key\">연명\u003c/b>하지 말고 자신의 몸을 \u003cb class=\"key\">장기 \u003c/b>\u003cb class=\"key\">기증\u003c/b>해 다른 이들이 더 온전한 삶을 살도록 도와달라고 부탁한다. 마지막으로 어려운 사람에게 \u003cb class=\"key\">친절\u003c/b>을 베푸는 것이 자신을 \u003cb class=\"key\">영원\u003c/b>히 기억하는 길이라고 말한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"정리해 볼게요. 이 글은 기계로 연명하지 말고 몸을 기증하며 친절을 실천해 달라는 부탁을 통해 진정한 기억과 영원한 삶의 의미를 말합니다. 중심 생각은 마지막 문장에 있으니 미괄식 구조를 기억하면 좋겠습니다. 오늘 수업은 여기까지입니다. 끝까지 잘 따라와 주어서 고맙습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
