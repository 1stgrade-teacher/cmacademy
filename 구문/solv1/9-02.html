<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 9강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 9강 적용독해02","audioDir":"9-02_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">9강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Phantom Ringing: When Your Brain Hears a Call That Isn't There\u003c/h1>\u003ch2>유령 벨소리: 핸드폰 강박이 만든 작은 불편\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>현대 기술은 많은 편리를 가져왔지만 작은 불편도 낳았다. 특히 핸드폰에 대한 \u003cb class=\"key\">강박증\u003c/b> 때문에 벨소리를 계속 기다리다가, 비슷한 소리만 들어도 \u003cb class=\"key\">뇌\u003c/b>가 나머지를 채워 전화가 울린다고 \u003cb class=\"key\">착각\u003c/b>하는 현상이 생긴다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Cell phone obsession can make people mistakenly think their phones are ringing by causing the brain to fill in sounds resembling a ringtone.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 현대 기술이 가져온 편리함 뒤에 숨은 작은 불편에 관한 지문을 함께 읽어 볼 거예요. 핸드폰이 실제로 울리지 않았는데도 벨소리가 들린다고 착각하는 현상을 다룬 글이죠. 핵심은 핸드폰에 대한 강박증이 뇌로 하여금 소리의 빈 부분을 채우게 만든다는 점이에요. 그럼 지문을 통해 원인과 결과를 차근차근 따라가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">핸드폰을 자주 확인하는 사람은 벨소리를 기대하는 마음이 커져, 실제로는 없는 소리도 있다고 느끼기 쉽다. 이렇게 전화가 오지 않았는데 벨소리를 듣는 현상을 \u003cb class=\"key\">유령 \u003c/b>\u003cb class=\"key\">벨소리\u003c/b> 또는 phantom ringing이라고 부른다. 뇌는 모든 소리를 처음부터 분석하지 않고, 기대와 문맥에 따라 일부만 듣고 나머지를 추측해서 채우는 \u003cb class=\"key\">Top-down \u003c/b>\u003cb class=\"key\">처리\u003c/b>를 한다. 예를 들어 친구가 곧 전화할 거라고 생각하면 세탁기 소리나 책상 두드리는 소리도 벨소리의 일부처럼 들릴 수 있다. 이는 뇌가 \u003cb class=\"key\">패턴\u003c/b>을 빨리 찾으려는 습관 때문에 생기는 자연스러운 착각이며, 핸드폰에 대한 \u003cb class=\"key\">강박\u003c/b>이 심해지면 더 자주 나타날 수 있다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 더해 볼게요. 핸드폰을 자주 확인하는 사람은 벨소리를 기대하는 마음이 커져서 실제로는 없는 소리도 있다고 느끼기 쉬워요. 이렇게 전화가 오지 않았는데 벨소리를 듣는 현상을 유령 벨소리, 영어로 phantom ringing이라고 부릅니다. 우리 뇌는 모든 소리를 처음부터 분석하지 않고 기대와 문맥에 따라 일부만 듣고 나머지를 추측해서 채우는 Top-down 처리를 해요. 예를 들어 친구가 곧 전화할 거라고 생각하면 세탁기 소리나 책상 두드리는 소리도 벨소리의 일부처럼 들릴 수 있죠. 이는 뇌가 패턴을 빨리 찾으려는 습관 때문에 생기는 자연스러운 착각이고, 핸드폰에 대한 강박이 심해지면 더 자주 나타날 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>기술의 양면\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>현대의 기술은 우리 삶에 많은 \u003cb class=\"key\">편리\u003c/b>를 가져왔다. 그러나 그것은 또한 많은 작은 \u003cb class=\"key\">불편\u003c/b>들도 초래했다. 글은 기술의 긍정적 면과 부정적 면을 함께 제시하며 화제를 연다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>벨소리 착각 사례\u003csmall>예시 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>글은 핸드폰 벨소리와 관련된 질문으로 \u003cb class=\"key\">예시\u003c/b>를 시작한다. 열심히 일하는 중에 갑자기 핸드폰이 울린다고 느끼지만, 확인해 보면 아무도 전화하지 않았다. 이런 일은 많은 핸드폰 사용자 사이에서 나타나는 새로운 \u003cb class=\"key\">현상\u003c/b>이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>강박과 기다림\u003csmall>원인 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>이 현상은 핸드폰에 대한 사용자들의 \u003cb class=\"key\">강박증\u003c/b>에서 기인한다. 강박증은 그들로 하여금 폰이 울리는 것을 항상 기다리게 만든다. 즉, 끊임없는 \u003cb class=\"key\">기다림\u003c/b>이 착각의 바탕이 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>뇌의 소리 채우기\u003csmall>결과 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>그래서 벨소리를 닮은 작은 소리를 들으면, 그들의 \u003cb class=\"key\">뇌\u003c/b>가 그 소리의 나머지를 채운다. 결과적으로 그들은 핸드폰이 울리지 않을 때도 울리고 있다고 \u003cb class=\"key\">착각\u003c/b>한다. 이는 기대가 지각에 영향을 준 결과이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 지문이 어떤 순서로 착각 현상을 설명하는지 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 기술의 양면을 소개하는 부분이에요. 현대 기술은 우리 삶에 많은 편리를 가져왔지만, 동시에 많은 작은 불편도 초래했죠. 글은 이 두 얼굴을 함께 보여 주면서 이야기를 시작합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 벨소리 착각 사례가 나옵니다. 열심히 일하는 중에 갑자기 핸드폰이 울리는 것 같지만, 확인해 보면 아무도 전화하지 않았죠. 글은 이 질문과 예시를 통해 많은 사용자 사이에서 나타나는 새로운 현상을 소개합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 원인을 밝히는 부분이에요. 이 현상은 핸드폰에 대한 사용자들의 강박증에서 기인합니다. 강박증은 그들이 폰이 울리는 것을 항상 기다리게 만들고, 이 끊임없는 기다림이 착각의 바탕이 되죠.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 뇌가 소리를 채우는 과정이 설명됩니다. 벨소리를 닮은 작은 소리를 들으면 뇌가 그 소리의 나머지를 채워요. 그래서 핸드폰이 실제로 울리지 않을 때도 울리고 있다고 착각하게 됩니다. 기대가 지각에 영향을 준 결과인 거죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시·인과\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 현대 기술의 편리함과 불편함을 언급한 뒤, 핸드폰 벨소리 착각이라는 구체적 \u003cb class=\"key\">예시\u003c/b>를 제시한다. 이어서 그 현상의 원인을 핸드폰에 대한 \u003cb class=\"key\">강박증\u003c/b>으로 밝히고, 뇌가 소리를 채우는 과정을 설명한다. 주제를 직접적으로 드러내는 문장이 글 중간의 일곱 번째 문장에 있으므로 \u003cb class=\"key\">중괄식\u003c/b>으로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>전환·대조\u003c/span>\u003cb>For example (3)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>This is (6)\u003c/b>\u003cspan>앞 내용 지칭·개념 규정\u003c/span>\u003cb>caused by (7)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>So (9)\u003c/b>\u003cspan>결과·인과\u003c/span>\u003cb>As a result (10)\u003c/b>\u003cspan>결과 정리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">many small annoyances\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the following situation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">This is a new phenomenon\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their obsession with their cell phones\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">constantly waiting for their phones to ring\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">hear any small sound that resembles part of their cell phone's ring\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their brain fills in the rest of the sound\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">think their phones are ringing even when they aren't\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>실제 벨소리\u003c/th>\u003cth>상상 벨소리\u003c/th>\u003c/tr>\u003ctr>\u003ctd>전화가 실제로 걸려 올 때 들림\u003c/td>\u003ctd>작은 소리를 벨소리로 착각할 때 들림\u003c/td>\u003c/tr>\u003ctr>\u003ctd>외부 소리가 분명함\u003c/td>\u003ctd>뇌가 나머지 소리를 채움\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식을 보면 예시와 인과가 함께 쓰였어요. 현대 기술의 편리함과 불편함을 언급한 뒤, 핸드폰 벨소리 착각이라는 구체적인 예시를 제시하죠. 이어서 그 현상의 원인을 핸드폰에 대한 강박증으로 밝히고, 뇌가 소리를 채우는 과정을 설명합니다. 주제를 직접 드러내는 문장이 글 중간에 있기 때문에 중괄식 구조로 읽으면 됩니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 두 번째 문장의 But이 편리함에서 불편함으로 시선을 전환해요. 세 번째 문장의 For example은 구체적인 예시를 시작하라는 신호이고, 일곱 번째 문장의 caused by는 원인을 제시합니다. 아홉 번째 문장의 So와 마지막 문장의 As a result는 원인에서 결과로 넘어가는 흐름을 잡아 줍니다. 또한 this situation, this phenomenon처럼 앞 내용을 가리키는 표현을 통해 같은 개념이 반복해서 이어진다는 점도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>modern\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>현대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가져오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>convenience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>편리, 편의\u003c/span>\u003c/div>\u003cdiv>\u003cb>annoyance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성가심, 불편\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>following\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다음의\u003c/span>\u003c/div>\u003cdiv>\u003cb>situation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상황\u003c/span>\u003c/div>\u003cdiv>\u003cb>happen to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게 일어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hard at work\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>열심히 일하는 중에\u003c/span>\u003c/div>\u003cdiv>\u003cb>suddenly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>갑자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>hear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>듣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cell phone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>휴대전화\u003c/span>\u003c/div>\u003cdiv>\u003cb>ring\u003c/b>\u003cem>동사\u003c/em>\u003cspan>울리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>check\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>no one\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>아무도\u003c/span>\u003c/div>\u003cdiv>\u003cb>call\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>phenomenon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현상\u003c/span>\u003c/div>\u003cdiv>\u003cb>occur\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>among\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 사이에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>user\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사용자\u003c/span>\u003c/div>\u003cdiv>\u003cb>cause\u003c/b>\u003cem>동사\u003c/em>\u003cspan>야기하다, 원인이 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>obsession\u003c/b>\u003cem>명사\u003c/em>\u003cspan>강박증, 집착\u003c/span>\u003c/div>\u003cdiv>\u003cb>constantly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>끊임없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>wait for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 기다리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>resemble\u003c/b>\u003cem>동사\u003c/em>\u003cspan>닮다, 비슷하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>part\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부분\u003c/span>\u003c/div>\u003cdiv>\u003cb>brain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뇌\u003c/span>\u003c/div>\u003cdiv>\u003cb>fill in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>채우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>as a result\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결과적으로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어부터 짚어 볼게요. convenience는 편리, annoyance는 성가심이나 불편이라는 뜻이고, obsession은 강박증이나 집착을 말해요. resemble은 닮다, fill in은 채우다라는 뜻으로, 벨소리와 비슷한 소리를 뇌가 채우는 장면을 떠올리면 쉽게 기억할 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">convenience\u003c/b>\u003cspan class=\"m\">편리\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ease\u003c/span>\u003cspan class=\"s\">comfort\u003c/span>\u003cspan class=\"s\">benefit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inconvenience\u003c/span>\u003cspan class=\"a\">discomfort\u003c/span>\u003cspan class=\"a\">drawback\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">annoyance\u003c/b>\u003cspan class=\"m\">성가심, 불편\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">nuisance\u003c/span>\u003cspan class=\"s\">irritation\u003c/span>\u003cspan class=\"s\">bother\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">comfort\u003c/span>\u003cspan class=\"a\">pleasure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">phenomenon\u003c/b>\u003cspan class=\"m\">현상\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">occurrence\u003c/span>\u003cspan class=\"s\">event\u003c/span>\u003cspan class=\"s\">happening\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">occur\u003c/b>\u003cspan class=\"m\">발생하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">happen\u003c/span>\u003cspan class=\"s\">take place\u003c/span>\u003cspan class=\"s\">arise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cease\u003c/span>\u003cspan class=\"a\">disappear\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cause\u003c/b>\u003cspan class=\"m\">야기하다, 원인이 되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lead to\u003c/span>\u003cspan class=\"s\">bring about\u003c/span>\u003cspan class=\"s\">trigger\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">prevent\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">obsession\u003c/b>\u003cspan class=\"m\">강박증, 집착\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fixation\u003c/span>\u003cspan class=\"s\">preoccupation\u003c/span>\u003cspan class=\"s\">compulsion\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indifference\u003c/span>\u003cspan class=\"a\">detachment\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">constantly\u003c/b>\u003cspan class=\"m\">끊임없이\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">continuously\u003c/span>\u003cspan class=\"s\">continually\u003c/span>\u003cspan class=\"s\">persistently\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">occasionally\u003c/span>\u003cspan class=\"a\">intermittently\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">resemble\u003c/b>\u003cspan class=\"m\">닮다, 비슷하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">look like\u003c/span>\u003cspan class=\"s\">be similar to\u003c/span>\u003cspan class=\"s\">take after\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">differ from\u003c/span>\u003cspan class=\"a\">contrast with\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요 어휘의 동의어와 반의어도 정리해 볼게요. convenience는 ease, comfort와 가깝고 inconvenience, discomfort와 반대됩니다. annoyance는 nuisance, irritation과 비슷하고 comfort, pleasure와 반대돼요. cause는 lead to, trigger로 바꿔 쓸 수 있고 prevent, hinder와는 반대 의미입니다. obsession은 fixation, preoccupation과 가깝고 indifference, detachment와 반대된다는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현대의 기술은\u003c/span>\u003cspan class=\"en\">Modern technology\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가져왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">brought \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 편리를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">conveniences \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 삶에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">lives\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">현대의 기술은 우리 삶에 많은 편리를 가져왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현대 기술이 우리 삶에 편리함을 가져왔다는 긍정적인 면을 먼저 꺼내 놓는 \u003cb class=\"key\">도입\u003c/b> 문장이에요. 바로 뒤에 나올 '작은 불편'과 \u003cb class=\"key\">대조\u003c/b>를 이루기 위한 발판이죠. has brought는 지금까지 이어지는 \u003cb class=\"key\">현재완료\u003c/b>라서 편리함이 현재도 계속되고 있음을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(have/has + p.p.)\u003c/span> : 주어 + [has + brought(p.p.)] → 과거의 일이 현재까지 결과로 이어짐 : \"가져왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 + 목적어 + 전치사 to(방향)\u003c/span> : bring + [many conveniences(목적어)] + [to our lives(방향)] : \"우리 삶에 많은 편리를 가져오다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Modern technology, 현대의 기술은. has brought, 가져왔다. many conveniences, 많은 편리를. to our lives, 우리 삶에. 이 문장 전체를 해석하면, 현대의 기술은 우리 삶에 많은 편리를 가져왔다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 시작이에요. 현대 기술의 좋은 점을 먼저 말하면서 부드럽게 문을 열고 있죠. 바로 다음에 나올 작은 불편들과 대조를 이루기 위한 준비 단계라고 보면 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째, has brought는 현재완료예요. 과거에 가져온 것이 지금까지 결과로 이어진다는 뜻이죠. 두 번째, brought many conveniences to our lives에서 to는 방향을 나타내요. 많은 편리를 우리 삶 쪽으로 가져왔다는 방향성이 그대로 보이는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그것은\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 초래했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">brought\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 작은 불편들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">annoyances\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그것은 또한 많은 작은 불편들도 초래했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장을 \u003cb class=\"key\">But\u003c/b>으로 뒤집어, 기술이 준 부정적인 측면을 꺼내는 \u003cb class=\"key\">전환\u003c/b> 문장이에요. it은 앞 문장의 \u003cb class=\"key\">modern \u003c/b>\u003cb class=\"key\">technology\u003c/b>를 그대로 받는 대명사죠. '편리함뿐 아니라 불편함도'라는 흐름을 만들어, 뒤에 나올 구체적인 사례의 발판을 놓습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 it(앞 내용 지칭)\u003c/span> : [it] = 앞 문장의 Modern technology : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 + also의 위치\u003c/span> : 조동사 has + [also] + [brought(p.p.)] : \"또한 초래했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사 + 명사의 어순\u003c/span> : [many(수량 형용사)] + [small(성질 형용사)] + [annoyances(명사)] : \"많은 작은 불편들\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"But it, 하지만 그것은. has also brought, 또한 초래했다. many small annoyances, 많은 작은 불편들을. 이 문장 전체를 해석하면, 하지만 그것은 또한 많은 작은 불편들도 초래했다.","hl":"m"},{"n":16,"text":"앞 문장의 좋은 이야기를 But으로 한 번 뒤집는 문장이에요. 편리함만 있는 게 아니라 자잘한 불편도 생겼다고 말하면서 이야기의 방향을 바꾸죠. 이 한 문장이 글의 화제를 구체적인 휴대폰 이야기로 넘기는 신호탄 역할을 합니다.","hl":"mn"},{"n":17,"text":"첫 번째, it은 앞 문장의 modern technology를 그대로 받는 지시대명사예요. 두 번째, also는 조동사 has와 본동사 brought 사이에 들어가서 첫 문장의 has brought와 병렬 구조를 만들어요. 세 번째, many small annoyances는 수량 형용사 many가 먼저, 성질 형용사 small이 그다음, 마지막에 명사 annoyances가 오는 어순입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들면,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음과 같은 상황이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">following \u003c/span>\u003cspan class=\"tgt\">situation \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일어난 적이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">ever \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">happened \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신에게 있는가?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들면, 다음과 같은 상황이 당신에게 일어난 적 있는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 불편함을 독자 자신의 경험으로 끌어오는 \u003cb class=\"key\">질문\u003c/b> 문장이에요. '당신에게도 있었나요'라고 물으며 독자를 글 속으로 데려오죠. 의문문이지만 답을 요구하기보다 \u003cb class=\"key\">공감\u003c/b>을 유도하는 장치이고, 다음 문장의 구체적인 상황 설명으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 의문문(경험)과 도치\u003c/span> : [Has] + 주어 + [ever] + p.p. ...? : \"~한 적이 있는가?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">the + 형용사 + 명사\u003c/span> : [the] + [following(형용사)] + [situation(명사)] : \"다음과 같은 상황\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">happen to + 사람\u003c/span> : happen + [to + you] → 사람에게 (일이) 일어나다 : \"당신에게 일어나다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"For example, 예를 들면. has the following situation, 다음과 같은 상황이. ever happened, 일어난 적이. to you?, 당신에게 있는가?. 이 문장 전체를 해석하면, 예를 들면, 다음과 같은 상황이 당신에게 일어난 적 있는가?","hl":"m"},{"n":19,"text":"이 문장은 앞에서 말한 불편함을 독자 자신의 경험으로 끌어오는 질문이에요. 당신에게도 이런 일이 있었냐고 물으면서 독자를 이야기 속으로 데려오죠. 의문문 형식이지만 답을 요구하기보다 공감을 유도하는 장치입니다.","hl":"mn"},{"n":20,"text":"첫 번째, has the following situation ever happened는 현재완료 의문문이에요. 경험을 묻기 위해 has가 주어 앞으로 나간 도치 형태죠. 두 번째, the following situation에서 following은 명사를 꾸미는 형용사라서 the와 명사 사이에 들어갑니다. 세 번째, happened to you에서 happen은 자동사라서 사람에게는 전치사 to를 붙여 표현해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 열심히 일하는 중이다\u003c/span>\u003cspan class=\"en\">You're hard at work\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기 당신이 생각할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">suddenly \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 듣는다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tg b>의미\u003c/b> 앞에서 말한 상황이 한 사람만의 문제가 아니라는 걸 알려 주는 문장이에요. \u003cb class=\"key\">phenomenon\u003c/b>은 '현상'이라는 뜻으로, 이 증상이 \u003cb class=\"key\">발생\u003c/b>하고 있는 범위가 many cell phone users, 즉 많은 핸드폰 사용자들이라는 점을 밝혀 줘요. 개인의 착각에서 여러 사람의 공통된 증상으로 논의를 넓히는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사 (형용사적 용법, 명사 수식)\u003c/span> : [명사 a new phenomenon] + [occurring (현재분사)] : \"발생하고 있는 새로운 현상\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 among\u003c/span> : occur + [among + 복수명사] : \"많은 핸드폰 사용자들 사이에서\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This is a new phenomenon, 이것은 새로운 현상이다. occurring among, 발생하고 있는 ... 사이에서. many cell phone users, 많은 핸드폰 사용자들. 이 문장 전체를 해석하면, 이것은 핸드폰 사용자들 사이에서 발생하고 있는 새로운 증상이다.","hl":"m"},{"n":28,"text":"이 문장은 지금까지 말한 상황이 개인만의 문제가 아니라는 걸 알려 주는 문장이에요. phenomenon은 현상을 뜻하고, occurring among은 많은 핸드폰 사용자들 사이에서 발생하고 있다는 뜻이죠. 즉 이 증상이 여러 사람에게 퍼진 새로운 현상이라고 정리해 주는 역할을 해요.","hl":"mn"},{"n":29,"text":"첫 번째로 occurring은 앞에 있는 phenomenon을 뒤에서 꾸며 주는 현재분사예요, which is occurring이 분사로 줄어든 형태라고 보면 돼요. 두 번째로 among은 셋 이상의 집단 사이에서라는 뜻의 전치사라서 many cell phone users처럼 복수 명사와 함께 쓰여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 기인한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">caused \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 강박증(집착)에 의해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">by\u003c/span> their \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">obsession \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 핸드폰에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with\u003c/span> their cell phones.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 그들의 핸드폰에 대한 강박증(집착)에서 기인한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급한 새로운 현상이 왜 생기는지 \u003cb class=\"key\">원인\u003c/b>을 밝히는 문장입니다. 그 원인은 바로 핸드폰에 대한 \u003cb class=\"key\">강박증\u003c/b>이라는 점을 분명히 해 줍니다. 원인과 결과를 이어 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사 + by)\u003c/span> : [주어] + be동사 + [[과거분사]] + by + [행위자·원인] : \"그것은 ~에 의해 야기된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with를 동반하는 관용 표현\u003c/span> : obsession + [[with]] + [대상] : \"~에 대한 강박증(집착)\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"It is caused, 이것은 기인한다. by their obsession, 그들의 강박증(집착)에 의해. with their cell phones, 그들의 핸드폰에 대한. 이 문장 전체를 해석하면, 이것은 그들의 핸드폰에 대한 강박증(집착)에서 기인한다.","hl":"m"},{"n":31,"text":"앞 문장에서 나온 새로운 현상이 어디서 비롯된 건지 원인을 짚어 주는 문장이에요. 그 원인은 바로 핸드폰에 대한 강박증, 즉 집착이라는 거죠. 원인과 결과를 이어 주는 아주 중요한 연결 문장입니다.","hl":"mn"},{"n":32,"text":"첫 번째로 It is caused by는 수동태예요. 주어 It이 스스로 하는 게 아니라 원인에 의해 그렇게 되는 대상이라서 수동태로 쓴 거죠. 두 번째로 obsession with는 '무언가에 사로잡히다'라는 의미가 전치사 with와 짝을 이루는 표현이에요. 그래서 with their cell phones가 '그들의 핸드폰에 대한'으로 해석됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 강박증은\u003c/span>\u003cspan class=\"en\">This obsession\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 ~하게 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">keeps \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">끊임없이 기다리게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">constantly \u003c/span>\u003cspan class=\"tgt\">waiting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 폰이 울리기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">phones \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">ring\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 강박증은 그들로 하여금 폰이 울리는 것을 항상 기다리게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 강박증이 구체적으로 어떤 상태를 만들어 내는지 설명하는 문장입니다. 폰이 울리기를 늘 \u003cb class=\"key\">기다리는 \u003c/b>\u003cb class=\"key\">상태\u003c/b>가 계속된다는 뜻이죠. 이 상태 때문에 다음 문장처럼 작은 소리에도 반응하게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 keep + 목적어 + 현재분사(목적격보어)\u003c/span> : keep + [목적어] + [[현재분사]](목적격보어) : \"그들을 끊임없이 기다리는 상태로 만든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">for + 목적격 + to부정사(의미상 주어)\u003c/span> : [[for]] + [목적격] + [[to부정사]] : \"그들의 폰이 울리는 것을\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"This obsession, 이 강박증은. keeps them, 그들을 ~하게 만든다. constantly waiting, 끊임없이 기다리게. for their phones to ring, 그들의 폰이 울리기를. 이 문장 전체를 해석하면, 이 강박증은 그들로 하여금 폰이 울리는 것을 항상 기다리게 만든다.","hl":"m"},{"n":34,"text":"강박증이 실제로 어떤 상태를 만들어 내는지 보여 주는 문장이에요. 폰이 울리기를 늘 기다리는 상태가 계속된다는 뜻이죠. 바로 이 상태 때문에 다음 문장에서 작은 소리에도 반응하게 되는 겁니다.","hl":"mn"},{"n":35,"text":"첫 번째로 keeps them constantly waiting은 목적어 뒤에 현재분사가 오는 다섯 번째 형식 문장이에요. keep이 '계속 그 상태로 두다'라는 뜻이라 목적격보어로 현재분사를 써서 기다리는 상태가 이어진다는 걸 보여 줘요. 두 번째로 for their phones to ring은 to부정사의 의미상 주어를 for로 밝힌 형태예요. 우는 주체가 문장 주어와 다르기 때문에 for their phones를 붙인 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">So\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 어떤 작은 소리를 들으면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">hear \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">sound \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 핸드폰 벨소리의 일부를 닮은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">resembles \u003c/span>\u003cspan class=\"tgt\">part \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">cell \u003c/span>\u003cspan class=\"tgt\">phone's \u003c/span>\u003cspan class=\"tgt\">ring\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 뇌가 채운다\u003c/span>\u003cspan class=\"en\">their brain \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">fills \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 소리의 나머지를\u003c/span>\u003cspan class=\"en\">the rest of the sound.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 핸드폰 벨소리를 닮은 작은 소리라도 들으면 그들의 뇌가 그 소리의 나머지를 채운다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 작은 소리 하나만 들려도 뇌가 나머지 부분을 스스로 \u003cb class=\"key\">채워 \u003c/b>\u003cb class=\"key\">넣어\u003c/b> 벨소리로 착각하게 만든다는 내용입니다. 앞 문장의 강박증이 실제로 어떻게 작동하는지 보여 주는 대목이죠. 그래서 마지막 문장의 결론으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when이 이끄는 시간 부사절\u003c/span> : [[when]] + [주어] + [동사] , [주절] : \"그들이 어떤 작은 소리를 들을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사] + [[that]] + [동사] ~ : \"그들의 핸드폰 벨소리의 일부를 닮은 어떤 작은 소리\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사 fill in\u003c/span> : fill in + [목적어] : \"~을 채워 넣다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"So, 그래서. when they hear any small sound, 그들이 어떤 작은 소리를 들으면. that resembles part of their cell phone's ring, 그들의 핸드폰 벨소리의 일부를 닮은. their brain fills in, 그들의 뇌가 채운다. the rest of the sound, 그 소리의 나머지를. 이 문장 전체를 해석하면, 그래서 핸드폰 벨소리를 닮은 작은 소리라도 들으면 그들의 뇌가 그 소리의 나머지를 채운다.","hl":"m"},{"n":37,"text":"작은 소리 하나만 들려도 뇌가 나머지를 스스로 채워서 벨소리로 착각한다는 내용이에요. 앞에서 말한 강박증이 실제로 어떻게 작동하는지 보여 주는 대목이죠. 그래서 마지막 문장의 결론으로 자연스럽게 넘어갑니다.","hl":"mn"},{"n":38,"text":"첫 번째로 when they hear any small sound는 when이 이끄는 시간 부사절이에요. '~할 때'라는 뜻으로 뒤에 주절 their brain fills in이 이어집니다. 두 번째로 that resembles는 주격 관계대명사예요. 바로 뒤에 동사가 오니까 주격이고, 앞의 any small sound를 꾸며 줍니다. 세 번째로 fills in은 '빈 부분을 채우다'라는 뜻의 구동사예요. 여기서는 뇌가 나머지 소리를 채워 넣는다는 의미로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결과적으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">result,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 생각한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 핸드폰이 울리고 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">phones \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">ringing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇지 않을 때도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">when\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">aren't\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결과적으로 그들은 핸드폰이 울리지 않을 때도 울리고 있다고 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 설명한 착각이 낳은 \u003cb class=\"key\">결과\u003c/b>를 정리하는 결론 문장이에요. 뇌가 소리를 채워 넣기 때문에, 실제로는 핸드폰이 울리지 않는데도 울린다고 \u003cb class=\"key\">착각\u003c/b>한다는 뜻이죠. As a result는 글의 흐름에서 원인과 \u003cb class=\"key\">결과\u003c/b>를 연결하는 표지로 볼 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 부사구(결과)\u003c/span> : As a result, + [완전한 문장] : \"결과적으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">think + 목적절(that 생략)\u003c/span> : think + [(that) + 주어 + 동사 ~] : \"그들은 핸드폰이 울리고 있다고 생각한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복합접속사 even when(양보)\u003c/span> : even when + [주어 + 동사 ~] : \"비록 ~일 때라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">be동사 부정 축약 + 반복 생략\u003c/span> : they aren't (ringing) : \"그것들이 울리지 않는\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"As a result, 결과적으로. they think, 그들은 생각한다. their phones are ringing, 그들의 핸드폰이 울리고 있다고. even when they aren't, 그렇지 않을 때도. 이 문장 전체를 해석하면, 결과적으로 그들은 핸드폰이 울리지 않을 때도 울리고 있다고 생각한다.","hl":"m"},{"n":40,"text":"이 문장은 앞에서 설명한 착각이 낳은 결과를 정리하는 결론 문장이에요. 뇌가 소리를 채워 넣기 때문에 실제로는 핸드폰이 울리지 않는데도 울린다고 착각한다는 뜻이죠. As a result는 원인과 결과를 연결하는 표지로 기억해 두세요.","hl":"mn"},{"n":41,"text":"첫 번째, As a result는 앞 내용의 결과를 이끄는 접속부사구예요. 두 번째, they think 뒤에는 목적절이 이어지고 접속사 that은 생략되어 있죠. 세 번째, even when은 양보의 뜻을 더하는 복합접속사이고, 네 번째, they aren't는 are not의 축약에 ringing이 생략된 형태예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>현대 기술은 많은 \u003cb class=\"key\">편리\u003c/b>를 가져왔지만 동시에 작은 \u003cb class=\"key\">불편\u003c/b>도 초래했다.\u003c/li>\u003cli>핸드폰이 울리지 않는데도 울린다고 느끼는 새로운 \u003cb class=\"key\">현상\u003c/b>이 많은 사용자에게 나타난다.\u003c/li>\u003cli>이 현상은 핸드폰에 대한 \u003cb class=\"key\">강박증\u003c/b>이 벨소리를 끊임없이 기다리게 만들기 때문에 생긴다.\u003c/li>\u003cli>벨소리와 비슷한 작은 소리를 들으면 \u003cb class=\"key\">뇌\u003c/b>가 나머지 소리를 채워 실제로 울린다고 \u003cb class=\"key\">착각\u003c/b>하게 된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Cell phone obsession can make people mistakenly think their phones are ringing by causing the brain to fill in sounds resembling a ringtone.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">현대 기술은 많은 편리를 가져왔지만 작은 불편도 낳았다. 특히 핸드폰에 대한 \u003cb class=\"key\">강박증\u003c/b> 때문에 벨소리를 계속 기다리다가, 비슷한 소리만 들어도 \u003cb class=\"key\">뇌\u003c/b>가 나머지를 채워 전화가 울린다고 \u003cb class=\"key\">착각\u003c/b>하는 현상이 생긴다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"정리해 볼까요. 현대 기술은 편리함과 작은 불편을 함께 가져왔고, 핸드폰에 대한 강박증은 벨소리를 계속 기다리게 만들었어요. 그 결과 비슷한 소리만 들어도 뇌가 나머지를 채워 전화가 울린다고 착각하는 현상이 생깁니다. 오늘 배운 원인과 결과의 흐름을 꼭 기억해 주시고, 수고했어요, 다음 강의에서 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
