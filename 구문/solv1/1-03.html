<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 1강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}
.lp-st{border-radius:4px;border-left:4px solid var(--pk-b)}
.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}
.lp-chips span{border-radius:3px;background:#fff}
.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 1강 적용독해03","audioDir":"1-03_audio","preview":false,"count":27,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">1강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Social Class Decided Who Survived on the Titanic\u003c/h1>\u003ch2>사회적 계층이 생존자를 결정한 타이타닉\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>1912년 타이타닉 호가 가라앉자 승무원들은 누가 살아남고 누가 죽을지를 결정해야 했고, 그 결정은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">계층\u003c/b>을 바탕으로 이루어졌다. 1등 칸 승객은 구명보트를 탈 기회를 얻어 사망률이 3%에 그친 반면, 3등 칸 승객은 갑판 밑에 머물라는 명령을 받고 45%가 차가운 바닷물에서 죽었다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>When the Titanic sank, who survived was determined not by chance but by social class.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 타이타닉 호의 침몰이라는 아주 유명한 사건을 다루고 있어요. 배에 탄 사람들이 누가 살아남을지를 두고 벌어진 결정이 과연 무엇을 기준으로 이루어졌는지 보여 주는 글이죠. 요약하면 구명보트가 부족한 상황에서 승무원들이 사회적 계층을 기준으로 생존자를 정했고, 그 결과 계층에 따라 사망률이 크게 갈렸다는 겁니다. 요지는 생존이 운이 아니라 사회적 계층에 의해 결정되었다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">타이타닉 호는 당시 세계에서 가장 크고 호화로운 여객선이었지만, \u003cb class=\"key\">구명보트\u003c/b>는 정원의 절반 남짓만 태울 수 있는 수준이었습니다. 배의 구조는 안전보다 겉모습과 편의를 우선했고, 이는 참사가 커진 이유가 되었죠. 당시 영국 사회는 \u003cb class=\"key\">계급\u003c/b>이 일상 깊숙이 자리한 사회였고, 배 안에서도 1등 칸과 3등 칸은 식당부터 갑판 출입까지 완전히 분리되어 있었습니다. \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">계층\u003c/b>(social class)은 돈과 신분에 따라 사람을 나누는 기준으로, 위기 상황에서 누가 먼저 보호받을지를 정하는 힘이 되기도 합니다. 영화관에서 좌석 등급에 따라 입구가 다른 것처럼, 같은 배에 타고 있어도 누구에게 먼저 문이 열리는지는 달랐던 셈입니다. '여성과 어린이 먼저'라는 원칙조차 계층 앞에서는 지켜지지 않았다는 점이 이 사건의 핵심입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경부터 짚어 볼게요. 타이타닉 호는 당시 세계에서 가장 크고 호화로운 여객선이었지만, 구명보트는 정원의 절반 남짓만 태울 수 있는 수준이었어요. 배의 구조는 안전보다 겉모습과 편의를 우선했고, 그 선택이 참사를 키운 이유가 되었죠. 당시 영국 사회는 계급이 일상 깊숙이 자리한 사회였고, 배 안에서도 일등 칸과 삼등 칸은 식당부터 갑판 출입까지 완전히 분리되어 있었어요. 사회적 계층, 즉 social class는 돈과 신분에 따라 사람을 나누는 기준인데, 위기 상황에서 누가 먼저 보호받을지를 정하는 힘이 되기도 합니다. 영화관에서 좌석 등급에 따라 입구가 다른 것처럼, 같은 배에 타고 있어도 누구에게 먼저 문이 열리는지는 달랐던 셈이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>침몰과 절박한 선택\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>1912년 어느 날 밤 타이타닉 호가 \u003cb class=\"key\">대서양\u003c/b>에 가라앉았습니다. 이용할 수 있는 \u003cb class=\"key\">구명보트\u003c/b>의 수가 매우 적었기 때문에, 승무원들은 누가 살아남고 누가 죽을지를 \u003cb class=\"key\">결정\u003c/b>해야 했습니다. 모든 사람을 구할 수 없다는 절박한 상황이 글의 출발점입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>통념을 뒤집는 기준\u003csmall>통념-전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>당신이 기대하는 것과 \u003cb class=\"key\">반대로\u003c/b>, 그 결정은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">계층\u003c/b>을 바탕으로 이루어졌습니다. Contrary to what you might expect라는 표현이 독자가 가진 \u003cb class=\"key\">통념\u003c/b>을 곧바로 뒤집습니다. 위기 앞에서는 모두 평등할 것이라는 기대가 틀렸음을 못 박는 주제문입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>계층별 사망률 통계\u003csmall>근거 · 문장 4\u003c/small>\u003c/h4>\u003cp>배에 타고 있던 1,500명의 승객 중 1등 칸 승객은 3%만 물에 빠져 죽은 \u003cb class=\"key\">반면\u003c/b>, 2등 칸은 16%, 3등 칸 승객의 45%가 \u003cb class=\"key\">차가운 \u003c/b>\u003cb class=\"key\">바닷물\u003c/b>에서 죽었습니다. 계층이 낮아질수록 \u003cb class=\"key\">사망률\u003c/b>이 급격히 치솟는다는 점을 숫자로 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>실제 대우의 차이\u003csmall>예시 · 문장 5\u003c/small>\u003c/h4>\u003cp>모든 1등 칸 승객에게는 \u003cb class=\"key\">구명보트\u003c/b>를 탈 기회가 주어졌지만, 3등 칸에 있던 사람들은 \u003cb class=\"key\">갑판 \u003c/b>\u003cb class=\"key\">밑\u003c/b>에 그대로 있으라는 명령을 받았습니다. 일부는 \u003cb class=\"key\">총구\u003c/b>가 겨눠진 채로 말입니다. 계층에 따라 대우 자체가 완전히 달랐음을 보여 주는 마지막 근거입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 천구백십이 년 어느 날 밤, 타이타닉 호가 대서양에 가라앉았습니다. 이용할 수 있는 구명보트의 수가 매우 적었기 때문에 승무원들은 누가 살아남고 누가 죽을지를 결정해야 했죠. 모든 사람을 구할 수 없다는 절박한 상황이 이 글의 출발점입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 통념을 뒤집는 전환이에요. Contrary to what you might expect, 여러분이 기대하는 것과 반대로 그 결정은 사회적 계층을 바탕으로 이루어졌습니다. 우리는 위기 앞에서 모두 평등할 거라고 생각하기 쉽지만 현실은 그렇지 않았다는 걸 딱 한 문장으로 못 박고 있어요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 근거 제시입니다. 배에 타고 있던 천오백 명의 승객 중 일등 칸 승객은 삼 퍼센트만 물에 빠져 죽은 반면, 이등 칸은 십육 퍼센트, 삼등 칸 승객은 사십오 퍼센트가 차가운 바닷물에서 죽었어요. 계층이 낮아질수록 사망률이 급격히 치솟는다는 걸 숫자로 보여 주는 부분입니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 구체적인 예시로 마무리하는 부분이에요. 모든 일등 칸 승객에게는 구명보트를 탈 기회가 주어졌지만, 삼등 칸에 있던 사람들은 갑판 밑에 그대로 있으라는 명령을 받았습니다. 일부는 총구가 겨눠진 채로 말이죠. 대우 자체가 계층에 따라 완전히 달랐다는 걸 보여 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장과 두 번째 문장이 사건과 상황을 제시하는 \u003cb class=\"key\">도입\u003c/b>이고, 세 번째 문장에서 Contrary to what you might expect로 독자의 \u003cb class=\"key\">통념\u003c/b>을 뒤집으며 주제를 던집니다. 이어서 네 번째와 다섯 번째 문장이 통계와 구체적 사례로 그 주제를 뒷받침하는 \u003cb class=\"key\">근거\u003c/b>가 됩니다. 주제문이 글 앞부분에 놓이고 근거가 뒤따르므로 \u003cb class=\"key\">두괄식\u003c/b> 구조로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Since (2)\u003c/b>\u003cspan>이유·원인 제시\u003c/span>\u003cb>Contrary to what you might expect (3)\u003c/b>\u003cspan>통념 반박·전환\u003c/span>\u003cb>while (4)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>but (5)\u003c/b>\u003cspan>대조·반전\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">social class\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">first-class passengers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">second-class passengers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">third-class passengers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the first-class section\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the third-class section\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>1등 칸 승객\u003c/th>\u003cth>3등 칸 승객\u003c/th>\u003c/tr>\u003ctr>\u003ctd>구명보트를 탈 기회가 주어짐\u003c/td>\u003ctd>갑판 밑에 있으라는 명령을 받음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사망률 3%\u003c/td>\u003ctd>사망률 45%\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 통념 제시와 반박, 그리고 근거 제시로 이어지는 구조예요. 처음에 독자가 가질 만한 기대를 Contrary to what you might expect로 일단 세워 두고, 곧바로 사회적 계층이라는 진짜 기준을 제시하죠. 주제문인 세 번째 문장이 앞쪽에 나오고 뒤에 통계와 사례가 붙는 두괄식 구조입니다.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 두 번째 문장의 Since는 이유를 알려 주는 신호이고, 세 번째 문장의 Contrary to what you might expect는 통념을 뒤집는 대표적인 전환 표현입니다. 네 번째 문장의 while은 일등 칸과 다른 칸의 사망률을 대조하고, 다섯 번째 문장의 but은 일등 칸과 삼등 칸의 대우를 정면으로 갈라놓죠. 이렇게 대조 신호어를 따라가면 글의 핵심이 저절로 보입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>sink\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가라앉다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Atlantic Ocean\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대서양\u003c/span>\u003c/div>\u003cdiv>\u003cb>since\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~때문에, ~이므로\u003c/span>\u003c/div>\u003cdiv>\u003cb>number\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수, 숫자\u003c/span>\u003c/div>\u003cdiv>\u003cb>lifeboat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구명보트\u003c/span>\u003c/div>\u003cdiv>\u003cb>available\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이용할 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>crew\u003c/b>\u003cem>명사\u003c/em>\u003cspan>승무원, 선원\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>survive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>살아남다\u003c/span>\u003c/div>\u003cdiv>\u003cb>die\u003c/b>\u003cem>동사\u003c/em>\u003cspan>죽다\u003c/span>\u003c/div>\u003cdiv>\u003cb>contrary to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 반대로\u003c/span>\u003c/div>\u003cdiv>\u003cb>expect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기대하다, 예상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>decision\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결정\u003c/span>\u003c/div>\u003cdiv>\u003cb>be based on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 바탕으로 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>social class\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회적 계층\u003c/span>\u003c/div>\u003cdiv>\u003cb>passenger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>승객\u003c/span>\u003c/div>\u003cdiv>\u003cb>on board\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>배에 타고 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>percent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>퍼센트, ~%\u003c/span>\u003c/div>\u003cdiv>\u003cb>first-class\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일등 칸의\u003c/span>\u003c/div>\u003cdiv>\u003cb>drown\u003c/b>\u003cem>동사\u003c/em>\u003cspan>물에 빠져 죽다, 익사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>while\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~한 반면에\u003c/span>\u003c/div>\u003cdiv>\u003cb>second-class\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이등 칸의\u003c/span>\u003c/div>\u003cdiv>\u003cb>third-class\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>삼등 칸의\u003c/span>\u003c/div>\u003cdiv>\u003cb>ice-cold\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>얼음처럼 차가운\u003c/span>\u003c/div>\u003cdiv>\u003cb>section\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구역, 칸\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>get into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 타다, 들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>order\u003c/b>\u003cem>동사\u003c/em>\u003cspan>명령하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>below deck\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>갑판 아래에\u003c/span>\u003c/div>\u003cdiv>\u003cb>at gunpoint\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>총구가 겨눠진 채로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚을게요. sink는 가라앉다, available은 이용할 수 있는이라는 뜻이고 contrary to는 무엇과 반대로라는 숙어예요. drown은 물에 빠져 죽다, at gunpoint는 총구가 겨눠진 채로라는 표현이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">survive\u003c/b>\u003cspan class=\"m\">살아남다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">outlive\u003c/span>\u003cspan class=\"s\">remain alive\u003c/span>\u003cspan class=\"s\">endure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">die\u003c/span>\u003cspan class=\"a\">perish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">available\u003c/b>\u003cspan class=\"m\">이용할 수 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accessible\u003c/span>\u003cspan class=\"s\">obtainable\u003c/span>\u003cspan class=\"s\">usable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unavailable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contrary to\u003c/b>\u003cspan class=\"m\">~와 반대로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">opposed to\u003c/span>\u003cspan class=\"s\">against\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">in line with\u003c/span>\u003cspan class=\"a\">consistent with\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expect\u003c/b>\u003cspan class=\"m\">기대하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">anticipate\u003c/span>\u003cspan class=\"s\">predict\u003c/span>\u003cspan class=\"s\">suppose\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">drown\u003c/b>\u003cspan class=\"m\">물에 빠져 죽다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sink\u003c/span>\u003cspan class=\"s\">perish in water\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">survive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">opportunity\u003c/b>\u003cspan class=\"m\">기회\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">chance\u003c/span>\u003cspan class=\"s\">occasion\u003c/span>\u003cspan class=\"s\">opening\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">order\u003c/b>\u003cspan class=\"m\">명령하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">command\u003c/span>\u003cspan class=\"s\">instruct\u003c/span>\u003cspan class=\"s\">direct\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">allow\u003c/span>\u003cspan class=\"a\">permit\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. survive는 살아남다인데 outlive나 remain alive로 바꿔 쓸 수 있고 반대말은 die나 perish예요. available은 accessible이나 obtainable로 바꿀 수 있고 반대는 unavailable이죠. expect는 anticipate나 predict로, opportunity는 chance나 occasion으로 바꿔 말할 수 있어요. order는 명령하다라는 뜻으로 command나 instruct와 가깝고 반대말은 allow나 permit입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1912년 어느 날 밤,\u003c/span>\u003cspan class=\"en\">One night \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">1912\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">타이타닉 호가 가라앉았다\u003c/span>\u003cspan class=\"en\">the Titanic \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sank \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대서양 속으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Atlantic \u003c/span>\u003cspan class=\"tgt\">Ocean\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1912 년 어느 날 밤, 타이타닉 호가 대서양에 가라앉았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 \u003cb class=\"key\">배경\u003c/b>이 되는 사건을 제시해요. 1912년 어느 날 밤 타이타닉 호가 \u003cb class=\"key\">대서양\u003c/b>에 가라앉았다는 사실로 이야기를 시작하죠. sank는 sink의 \u003cb class=\"key\">과거형\u003c/b>으로 '가라앉았다'라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 in + 연도(시간의 부사구)\u003c/span> : [in] + [연도] : \"1912년에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 + 방향의 전치사구\u003c/span> : [sink(자동사)] + [into + the Atlantic Ocean(방향의 전치사구)] : \"대서양 속으로 가라앉았다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"One night in 1912, 1912년 어느 날 밤. the Titanic sank, 타이타닉 호가 가라앉았다. into the Atlantic Ocean, 대서양 속으로.. 이 문장 전체를 해석하면, 1912 년 어느 날 밤, 타이타닉 호가 대서양에 가라앉았다.","hl":"m"},{"n":13,"text":"이 문장은 글의 배경이 되는 사건을 열어 주는 문장이에요. 어느 날 밤 타이타닉 호가 대서양에 가라앉았다는 사실로 이야기가 시작되죠. 여기서 sank는 sink의 과거형이라서 이미 일어난 일을 말하고 있다는 점을 꼭 기억해 두세요.","hl":"mn"},{"n":14,"text":"첫 번째로, sank는 '가라앉다'라는 자동사예요. 목적어 없이 쓰고, 어디로 가라앉는지는 전치사 into로 방향을 보여 줍니다. 두 번째로, in 1912처럼 연도 앞에는 전치사 in을 써서 '그 해에'라는 시간을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이용할 수 있는 구명보트의 수가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Since\u003c/span> the number of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">lifeboats \u003c/span>\u003cspan class=\"tgt\">available\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 적었기 때문에,\u003c/span>\u003cspan class=\"en\">was very small,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">승무원들은 결정해야 했다\u003c/span>\u003cspan class=\"en\">the crew \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">decide\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누가 살아남을지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">survive \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 누가 죽을지.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">die\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이용할 수 있는 구명보트의 수가 매우 적었기 때문에, 승무원들은 누가 살아남고 누가 죽을지를 결정해야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 사건에 \u003cb class=\"key\">이유\u003c/b>를 붙여 주는 문장이에요. 구명보트가 아주 적어서 승무원들이 누가 살고 누가 죽을지를 \u003cb class=\"key\">선택\u003c/b>해야 했다는 \u003cb class=\"key\">배경\u003c/b>을 설명하죠. who would survive and who would die는 간접의문문 두 개가 and로 이어진 구조예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 Since(이유)\u003c/span> : [Since + 주어 + 동사, 주어 + 동사] : \"~때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 후치수식\u003c/span> : [명사 lifeboats] + [형용사 available] : \"이용할 수 있는 구명보트\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 have to의 과거(의무)\u003c/span> : [had to] + [동사원형 decide] : \"결정해야 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">간접의문문과 병렬\u003c/span> : [의문사 who] + [주어 would] + [동사 survive] + and + [의문사 who] + [주어 would] + [동사 die] : \"누가 살아남을지 그리고 누가 죽을지\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Since the number of lifeboats available, 이용할 수 있는 구명보트의 수가. was very small, 매우 적었기 때문에. the crew had to decide, 승무원들은 결정해야 했다. who would survive, 누가 살아남을지. and who would die, 그리고 누가 죽을지.. 이 문장 전체를 해석하면, 이용할 수 있는 구명보트의 수가 매우 적었기 때문에, 승무원들은 누가 살아남고 누가 죽을지를 결정해야 했다.","hl":"m"},{"n":16,"text":"이 문장은 앞 문장의 사건에 이유를 붙여 주는 문장이에요. 구명보트 수가 아주 적었기 때문에 승무원들이 누가 살고 누가 죽을지를 선택해야 했다는 배경을 설명하고 있죠. 그래서 다음 문장에서 그 선택이 과연 어떤 기준으로 이루어졌는지가 궁금해지는 거예요.","hl":"mn"},{"n":17,"text":"첫 번째, 문장 앞의 Since는 시간이 아니라 이유를 이끄는 접속사예요. 두 번째, lifeboats available처럼 available은 명사 뒤에서 꾸며 주는 후치수식 형용사예요. 세 번째, had to decide에서 have to는 의무를 나타내는 준조동사라서 뒤에 동사원형 decide가 왔어요. 네 번째, who would survive and who would die는 의문사가 이끄는 간접의문문 두 개가 and로 병렬로 연결된 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 기대하는 것과 반대로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Contrary \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">expect\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 결정은 바탕을 두었다\u003c/span>\u003cspan class=\"en\">the decision \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">based \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회적 계층에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on\u003c/span> social class.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 기대하는 것과 반대로, 그 결정은 사회적 계층을 바탕으로 이루어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주장\u003c/b>을 정리해 주는 문장이에요. 사람의 목숨이 공평하게 다뤄졌으리라는 \u003cb class=\"key\">기대\u003c/b>와 달리, 결정은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">계층\u003c/b>을 기준으로 이루어졌다고 밝히죠. Contrary to는 '기대와 반대'라는 신호를 주어 뒤 내용이 글의 진짜 주장임을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 to + 관계대명사 what절(명사절)\u003c/span> : [Contrary to] + [what + 주어 + 동사(명사절)] : \"당신이 기대하는 것과 반대로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 might(추측)\u003c/span> : [might] + [동사원형 expect] : \"기대할지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태(be based on)\u003c/span> : [be동사 was] + [과거분사 based] + [전치사 on] : \"~에 바탕을 두었다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Contrary to what you might expect, 당신이 기대하는 것과 반대로. the decision was based, 그 결정은 바탕을 두었다. on social class, 사회적 계층에.. 이 문장 전체를 해석하면, 당신이 기대하는 것과 반대로, 그 결정은 사회적 계층을 바탕으로 이루어졌다.","hl":"m"},{"n":19,"text":"이 문장은 글의 핵심 주장을 딱 정리해 주는 문장이에요. 독자는 보통 사람의 목숨이 공평하게 다뤄졌다고 기대하지만, 실제 결정은 사회적 계층에 따라 이루어졌다는 거죠. Contrary to가 기대와 반대라는 신호를 주기 때문에 뒤에 나오는 내용이 이 글의 진짜 주장이라는 걸 바로 알 수 있어요.","hl":"mn"},{"n":20,"text":"첫 번째, Contrary to 뒤에는 what you might expect처럼 선행사를 포함하는 관계대명사 what이 이끄는 명사절이 와요. 두 번째, might expect에서 might는 추측을 나타내는 조동사라서 뒤에 동사원형 expect가 옵니다. 세 번째, was based on은 be동사에 과거분사가 붙은 수동태이고, be based on 자체가 '~에 근거하다'라는 관용 표현으로 굳어져 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배에 타고 있던 1,500명의 승객 중,\u003c/span>\u003cspan class=\"en\">Of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">1,500 \u003c/span>\u003cspan class=\"tgt\">passengers \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">board\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1등 칸 승객은 3%만 물에 빠져 죽었는데,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">only\u003c/span> three percent of the first-class passengers drowned,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면에 2등 칸은 16%가,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">while\u003c/span> 16 percent of the second-class\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 3등 칸 승객의 45%는 죽었다\u003c/span>\u003cspan class=\"en\">and 45 percent of the third-class passengers died\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차가운 바닷물에서.\u003c/span>\u003cspan class=\"en\">in the ice-cold water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">배에 타고 있던 1 , 500 명의 승객 중, 1 등 칸 승객은 3 %만 물에 빠져 죽은 반면, 2 등 칸은 16 %, 3 등 칸 승객의 45 %가 차가운 바닷물에서 죽었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 숫자만으로 계급 차이를 증명하는 문장이에요. 일등 칸과 삼등 칸의 사망률을 \u003cb class=\"key\">대조\u003c/b>해서, 계급이 낮을수록 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">확률\u003c/b>이 급격히 떨어졌음을 보여 주죠. while이 두 수치를 맞세워 격차를 더 선명하게 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법(명사 후치 수식)\u003c/span> : [명사] + [on board (전치사구)] → 명사를 뒤에서 수식 : \"배에 타고 있던 승객들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">강조 부사 only의 위치\u003c/span> : only + [꾸미고 싶은 말] 바로 앞 : \"단 ~만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 while(대조)\u003c/span> : [절] + while + [절] (반면에) : \"반면에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Of the 1,500 passengers on board, 배에 타고 있던 1,500명의 승객 중. only three percent of the first-class passengers drowned, 1등 칸 승객은 3%만 물에 빠져 죽었는데. while 16 percent of the second-class, 반면에 2등 칸은 16%가. and 45 percent of the third-class passengers died, 그리고 3등 칸 승객의 45%는 죽었다. in the ice-cold water, 차가운 바닷물에서.. 이 문장 전체를 해석하면, 배에 타고 있던 1 , 500 명의 승객 중, 1 등 칸 승객은 3 %만 물에 빠져 죽은 반면, 2 등 칸은 16 %, 3 등 칸 승객의 45 %가 차가운 바닷물에서 죽었다.","hl":"m"},{"n":22,"text":"이 문장은 계급에 따라 생존율이 얼마나 달랐는지 숫자로 보여 주는 문장이에요. 일등 칸은 삼 퍼센트만 물에 빠져 죽었는데 삼등 칸은 사십오 퍼센트가 죽었다는 거죠. 이렇게 두 수치를 대조해 놓으니까 계급이 낮을수록 생존 확률이 확 떨어진다는 게 한눈에 보여요.","hl":"mn"},{"n":23,"text":"먼저 the 1,500 passengers on board를 보세요. on board 같은 전치사구가 명사 뒤에서 꾸며 주는 형용사적 용법, 바로 후치 수식이에요. 두 번째로 only는 꾸미는 말 바로 앞에 붙어서 삼 퍼센트만이라는 강조를 만들어요. 세 번째로 while은 반면에라는 뜻으로 두 절을 대조로 이어 주죠. 그래서 일등 칸과 삼등 칸의 사망률이 맞세워지면서 격차가 더 또렷해지는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 1등 칸 승객에게는\u003c/span>\u003cspan class=\"en\">All the passengers in the first-class section\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구명보트를 탈 기회가 주어졌지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">given\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">opportunity \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lifeboat\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3등 칸에 있던 사람들은\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">third-class \u003c/span>\u003cspan class=\"tgt\">section\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑판 밑에 그대로 있으라는 명령을 받았다,\u003c/span>\u003cspan class=\"en\">were ordered to stay below deck,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 중 일부는 총구가 겨눠진 채로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">gunpoint\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 1 등 칸 승객에게는 구명보트를 탈 기회가 주어졌지만, 3 등 칸에 있던 사람들은 갑판 밑에 그대로 있으라는 명령을 받았다, 일부는 총구가 겨눠진 채로.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 계급 차이가 기회 자체를 갈랐다는 걸 보여 주는 문장이에요. 일등 칸은 \u003cb class=\"key\">구명보트\u003c/b>를 탈 기회가 주어졌지만 삼등 칸은 갑판 밑에 있으라는 명령을 받았고, 심지어 \u003cb class=\"key\">총구\u003c/b>가 겨눠진 채였죠. 앞 문장의 사망률 차이가 왜 생겼는지 \u003cb class=\"key\">구조적\u003c/b>인 이유를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(give의 4형식 동사)\u003c/span> : [간접목적어] + be given + [직접목적어] (4형식의 수동태) : \"(기회가) 주어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(명사 수식)\u003c/span> : [명사] + [to + 동사원형] (~할 명사) : \"구명보트를 탈 기회\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지시대명사 those(복수)\u003c/span> : those = the + 복수명사 (앞에 나온 명사 반복을 피함) : \"3등 칸에 있던 사람들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">부대상황 표현(being 생략)\u003c/span> : [명사구] + [(being) + 전치사구] : \"그들 중 일부는 총구가 겨눠진 채로\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"All the passengers in the first-class section, 모든 1등 칸 승객에게는. were given the opportunity to get into a lifeboat, 구명보트를 탈 기회가 주어졌지만. but those in the third-class section, 3등 칸에 있던 사람들은. were ordered to stay below deck, 갑판 밑에 그대로 있으라는 명령을 받았다. some of them at gunpoint, 그들 중 일부는 총구가 겨눠진 채로.. 이 문장 전체를 해석하면, 모든 1 등 칸 승객에게는 구명보트를 탈 기회가 주어졌지만, 3 등 칸에 있던 사람들은 갑판 밑에 그대로 있으라는 명령을 받았다, 일부는 총구가 겨눠진 채로.","hl":"m"},{"n":25,"text":"이 문장은 계급이 생존 기회 자체를 갈랐다는 걸 보여 줘요. 일등 칸은 구명보트를 탈 기회가 주어졌지만 삼등 칸은 갑판 밑에 있으라는 명령을 받았죠. 심지어 총구가 겨눠진 채였으니까, 앞 문장의 사망률 차이가 왜 생겼는지 구조적인 이유가 여기서 드러나는 거예요.","hl":"mn"},{"n":26,"text":"먼저 were given을 보세요. give는 목적어를 두 개 갖는 동사라서, 물건을 받는 쪽이 주어로 나오면 수동태 were given이 되고 물건인 the opportunity가 뒤에 남아요. 두 번째로 the opportunity to get into a lifeboat에서 to부정사가 앞의 명사를 꾸며 탈 기회라는 뜻을 만들어 주죠. 세 번째로 those는 앞에 나온 the passengers를 대신하는 지시대명사예요. 네 번째로 some of them at gunpoint는 being이 생략된 부대상황 표현으로, 총구가 겨눠진 채로라는 동시 상황을 덧붙여 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>1912년 어느 날 밤 타이타닉 호가 \u003cb class=\"key\">대서양\u003c/b>에 가라앉았고, 이용할 수 있는 \u003cb class=\"key\">구명보트\u003c/b>의 수가 매우 적어 승무원들은 누가 살고 누가 죽을지를 결정해야 했다.\u003c/li>\u003cli>사람들이 기대하는 것과 \u003cb class=\"key\">반대로\u003c/b>, 그 결정은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">계층\u003c/b>을 바탕으로 이루어졌다.\u003c/li>\u003cli>1등 칸 승객은 3%만 익사한 \u003cb class=\"key\">반면\u003c/b>, 2등 칸은 16%, 3등 칸은 45%가 \u003cb class=\"key\">차가운 \u003c/b>\u003cb class=\"key\">바닷물\u003c/b>에서 죽었다.\u003c/li>\u003cli>1등 칸 승객에게는 구명보트를 탈 \u003cb class=\"key\">기회\u003c/b>가 주어졌지만, 3등 칸 승객은 \u003cb class=\"key\">갑판 \u003c/b>\u003cb class=\"key\">밑\u003c/b>에 있으라는 명령을 받았고 일부는 총구가 겨눠진 채였다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>When the Titanic sank, who survived was determined not by chance but by social class.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">1912년 타이타닉 호가 가라앉자 승무원들은 누가 살아남고 누가 죽을지를 결정해야 했고, 그 결정은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">계층\u003c/b>을 바탕으로 이루어졌다. 1등 칸 승객은 구명보트를 탈 기회를 얻어 사망률이 3%에 그친 반면, 3등 칸 승객은 갑판 밑에 머물라는 명령을 받고 45%가 차가운 바닷물에서 죽었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"오늘 글의 핵심은 아주 선명합니다. 타이타닉 호의 참사에서 누가 살아남을지를 가른 것은 운이 아니라 사회적 계층이었어요. 통계와 구체적인 사례가 그 주장을 단단하게 받쳐 주고 있으니, 대조 신호어를 중심으로 다시 한 번 읽어 보세요. 수고 많았습니다, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
