가 어떻게 시대의 아이콘이 되었는지 더 쉽게 공감하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01어린 시절의 명확한 목표</div><ul><li>오프라 윈프리는 어린 시절부터 대중 앞에서 말하는 재능을 보였으며 일찍이 자신의 진로를 결정했다.</li><li>두 살 때 교회에서 첫 공개 연설(publicly spoke) 경험</li><li>12세에 &#39;사람들과 대화하는 것&#39;을 직업으로 삼겠다는 미래 계획 수립</li><li>핵심 키워드: 목표 설정(goal setting)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02방송인으로서의 초기 경력</div><ul><li>경험이 부족했음에도 불구하고, 오프라는 라디오 뉴스 리포터가 되어 방송계에 첫발을 내디뎠다.</li><li>경험이 없었음에도 라디오 뉴스 리포터(radio news reporter)로 활동 시작</li><li>방송인으로서의 실무 경험 축적</li><li>핵심 키워드: 초기 경력(early career)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03다방면의 성장과 입지 다지기</div><ul><li>토크쇼 진행자로 자리를 잡기 전까지 오프라는 이미 다양한 매체를 거치며 역량을 쌓았다.</li><li>TV 뉴스 리포터 및 할리우드 영화(Hollywood movie) 출연</li><li>1986년 TV 토크쇼 진행자로서 본격적인 활동 시작</li><li>핵심 키워드: 경험 축적(accumulating experience)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04공감과 대중적 성공</div><ul><li>개인적인 아픔을 바탕으로 한 진솔한 이야기는 시청자들에게 깊은 감동을 주며 큰 인기를 끌었다.</li><li>아동 학대(child abuse) 등 민감하고 진실한 주제를 다룸</li><li>자신의 고통스러운 과거를 바탕으로 청중의 마음을 움직임(moved the hearts)</li><li>1980년대 후반 &#39;오프라 윈프리 쇼&#39;의 전국적인 대성공</li><li>핵심 키워드: 대중적 명성(household name)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">publicly</td><td class=\"m\">공공연하게, 공개적으로</td></tr><tr><td class=\"w\">decide on</td><td class=\"m\">~을 결정하다, ~으로 정하다</td></tr><tr><td class=\"w\">opportunity</td><td class=\"m\">기회, 계기</td></tr><tr><td class=\"w\">experience</td><td class=\"m\">경험, 경력</td></tr><tr><td class=\"w\">reporter</td><td class=\"m\">기자, 보도자료 기자</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">major</td><td class=\"m\">주요한, 중대한</td></tr><tr><td class=\"w\">abuse</td><td class=\"m\">학대, 오용</td></tr><tr><td class=\"w\">move</td><td class=\"m\">감동시키다, 움직이다</td></tr><tr><td class=\"w\">audience</td><td class=\"m\">청중, 관객</td></tr><tr><td class=\"w\">household name</td><td class=\"m\">누구나 아는 이름, 대명사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오프라 윈프리는 겨우 두 살이었다</span><span class=\"en\"><b>Oprah Winfrey <span class=\"grammar-hl\">was</span> just two</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀가 대중 앞에서 교회에서 말했을 때</span><span class=\"en\"><b>when she spoke publicly in church</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음으로</span><span class=\"en\"><b>for the first time.</b></span></div></div><div class=\"lec-sent-ko\">Oprah Winfrey가 교회에서 처음 사람들 앞에서 연설을 했을 때 그녀는 겨우 2살이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 어린 시절부터 남들 앞에서 말하는 것에 두각을 나타냈음을 보여주며, 그녀의 성공적인 커리어를 예고하는 서사의 시작점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was 2형식 구조: 주어(Oprah Winfrey) + 동사(was) + 보어(two) 형태로, 주어의 상태를 설명하는 구조입니다.</div><div class=\"lec-gr-item\">to speak to부정사(부사적 용법): &#39;말했을 때&#39;라는 의미로, 주절의 시점(was)을 수식하는 부사적 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">publicly</td><td class=\"m\">공공연하게, 공개적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">12살 무렵에는</span><span class=\"en\"><b>By the age of twelve,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 이미 결정했었다</span><span class=\"en\"><b>she had already <span class=\"grammar-hl\">decided on</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 미래 직업을</span><span class=\"en\"><b>her future career.</b></span></div></div><div class=\"lec-sent-ko\">12살쯤에는 그녀는 이미 장래 직업을 결정했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 어린 시절의 재능이 어떻게 구체적인 목표로 이어졌는지를 서술하며, 그녀가 일찍부터 자신의 적성을 명확히 파악했음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">decided on (관용표현): decide on(~을 결정하다/선택하다)은 전치사 on과 결합하여 하나의 동사구처럼 쓰이는 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 생계를 꾸려 나가길 원했는데</span><span class=\"en\"><b>She wanted <span class=\"grammar-hl\">to make</span> her living “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“사람들에게 말을 해서”</span><span class=\"en\"><b>“<span class=\"grammar-hl\">talking</span> to people.”</b></span></div></div><div class=\"lec-sent-ko\">그녀는 “사람들에게 말을 해서” 생계를 꾸려 나가길 원했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> talking to people은 단순히 대화하는 행위를 넘어, 자신의 목소리로 정보를 전달하고 타인과 소통하며 수익을 창출하는 전문적인 직업관을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to make to부정사(명사적 용법): want의 목적어로 쓰여 &#39;~하는 것을 원하다&#39;라는 명사적 기능을 수행합니다.</div><div class=\"lec-gr-item\">talking (현재분사(동작/상태)): talking to people은 &#39;사람들과 이야기하는 것&#39;이라는 행위의 의미를 포함하여, 앞의 의미를 보충 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">곧</span><span class=\"en\"><b><span class=\"grammar-hl\">Soon</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 얻었다 그녀의 첫 번째 기회를</span><span class=\"en\"><b><span class=\"grammar-hl\">she got her first opportunity.</span></b></span></div></div><div class=\"lec-sent-ko\">곧 그녀는 첫 번째 기회를 얻었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 열망이 실제 현장에서 실현될 수 있는 계기가 마련되었음을 알리는 연결 고리입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Soon she got her first opportunity. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opportunity</td><td class=\"m\">기회, 계기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 그녀가 어떤 경험도 없었지만</span><span class=\"en\"><b><span class=\"grammar-hl\">Although she didn’t have any experience</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 되었다</span><span class=\"en\"><b>she became</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">라디오 뉴스 리포터가</span><span class=\"en\"><b>a radio news reporter.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 경험이 전혀 없었지만 라디오 뉴스 리포터가 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> didn’t have any experience는 그럼에도 불구하고 능력을 인정받아 실무에 투입되었음을 강조하며, 그녀의 타고난 재능이 배경보다 앞섰음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Although she didn’t have any experience 분사구문의 원리(양보의 부사절): 접속사 Although + 주어 + 동사로 구성되어, 뒤에 오는 주절의 내용을 대조적으로 이끄는 부사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experience</td><td class=\"m\">경험, 경력</td></tr><tr><td class=\"w\">reporter</td><td class=\"m\">기자, 보도자료 기자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오프라가 그녀의 TV 토크쇼를 시작했을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When Oprah started her TV talk show</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1986년에</span><span class=\"en\"><b><span class=\"grammar-hl\">in 1986</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 이미였었다</span><span class=\"en\"><b>she <span class=\"grammar-hl\">had already been</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">TV 뉴스 리포터였고</span><span class=\"en\"><b>a TV news reporter</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연기했었었다</span><span class=\"en\"><b>and had acted</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주요 할리우드 영화에서</span><span class=\"en\"><b>in a major Hollywood movie.</b></span></div></div><div class=\"lec-sent-ko\">Oprah가 1986년 자신의 TV 토크쇼를 시작했을 때, 그녀는 이미 TV 뉴스 리포터였고 할리우드 메이저 영화에 출연했었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 성공적인 토크쇼 진행자가 되기까지 그녀가 쌓아온 다양한 미디어 경력을 나열하여, 토크쇼의 성공이 우연이 아닌 철저한 준비의 결과임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When Oprah started her TV talk show in 1986 (관계부사(시간)): When은 &#39;특정한 때&#39;를 나타내는 시간의 관계부사(혹은 접속사)로서 문장 전체의 시점을 명시합니다.</div><div class=\"lec-gr-item\">had already been (과거완료): 기준 시점인 &#39;started&#39;보다 더 과거에 시작되어 지속된 상태를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reporter</td><td class=\"m\">기자, 보도자료 기자</td></tr><tr><td class=\"w\">major</td><td class=\"m\">주요한, 중대한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀의 이야기들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Her stories</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아동 학대와 같은 주제들에 관한</span><span class=\"en\"><b><span class=\"grammar-hl\">on topics such as child abuse</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 오프라 그녀 자신이</span><span class=\"en\"><b>— Oprah, herself,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학대받았었지만 —</span><span class=\"en\"><b><span class=\"grammar-hl\">had been abused</span> —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">움직였다 마음을</span><span class=\"en\"><b>moved the hearts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 청중들의</span><span class=\"en\"><b>of her audience.</b></span></div></div><div class=\"lec-sent-ko\">아동학대와 같은 주제에 관한 그녀의 이야기는 ― Oprah 자신도 학대를 받았었다 ― 시청자들의 마음을 감동시켰다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> moved the hearts of her audience는 단순히 정보를 전달하는 것을 넘어, 자신의 고통스러운 경험을 공유함으로써 시청자들과 깊은 정서적 공감대를 형성했음을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Her stories on topics such as child abuse 5형식 구조: 주어(Her stories) + 동사(moved) + 목적어(the hearts) + 목적보어(of her audience) 형태로, 목적어가 어떠한 상태로 움직였는지를 설명합니다.</div><div class=\"lec-gr-item\">had been abused (수동태): be동사(been)+p.p.(abused) 구조입니다. abuse는 타동사인데 목적어가 없어서 수동구조(be+p.p.)로 씁니다. 기본구조: S + abuse + O (누군가를 학대하다)를 수동으로 전환한 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">abuse</td><td class=\"m\">학대, 오용</td></tr><tr><td class=\"w\">move</td><td class=\"m\">감동시키다, 움직이다</td></tr><tr><td class=\"w\">audience</td><td class=\"m\">청중, 관객</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1980년대 후반쯤에는</span><span class=\"en\"><b>By the late 1980s,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오프라 윈프리 쇼는 너무나 인기가 많아서</span><span class=\"en\"><b>The Oprah Winfrey Show was <span class=\"grammar-hl\">so popular</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“오프라”가</span><span class=\"en\"><b><span class=\"grammar-hl\">that “Oprah”</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">되었었다</span><span class=\"en\"><b><span class=\"grammar-hl\">had become</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누구나 아는 이름이</span><span class=\"en\"><b><span class=\"grammar-hl\">a household name</span>.</b></span></div></div><div class=\"lec-sent-ko\">1980년대 말쯤에 “Oprah Winfrey Show”는 아주 인기가 있어서 “Oprah”는 유명인사가 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> household name은 특정 분야를 넘어 대중에게 익숙한 인물로 자리 잡았음을 의미하며, 방송인으로서 그녀가 이룬 전성기를 요약하는 결론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so popular that “Oprah” had become a household name (관용표현): so ~ that 구문으로 &#39;매우 ~해서 ~하다&#39;라는 결과를 나타내는 부사절 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">household name</td><td class=\"m\">누구나 아는 이름, 대명사</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>오프라 윈프리는 어린 시절부터 대중 앞에 서는 재능을 보였다.</li><li>자신이 원하는 &#39;사람들과의 대화&#39;라는 목표를 위해 라디오 기자와 영화 출연 등 다양한 경력을 쌓았다.</li><li>자신의 아픈 경험을 토대로 시청자와 진심 어린 소통을 하여 큰 공감을 얻었다.</li><li>결과적으로 1980년대 후반, 그녀는 누구나 다 아는 최고의 방송인으로 성장했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Oprah Winfrey pursued her early career goal of communicating with others, and she eventually gained immense popularity through her empathetic approach to broadcasting.</div>\n              <div class=\"lec-final-sum-ko\">오프라 윈프리는 사람들과 소통하겠다는 초기 경력 목표를 추구했으며, 결국 공감적인 방송 방식을 통해 엄청난 인기를 얻게 되었다.</div></div></div>"],"segs":[[{"audio":"./apply01_audio/1.mp3","hl":null}],[{"audio":"./apply01_audio/2.mp3","hl":null}],[{"audio":"./apply01_audio/3.mp3","hl":null},{"audio":"./apply01_audio/4.mp3","hl":"stage-0"},{"audio":"./apply01_audio/5.mp3","hl":"stage-1"},{"audio":"./apply01_audio/6.mp3","hl":"stage-2"},{"audio":"./apply01_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply01_audio/8.mp3","hl":null}],[{"audio":"./apply01_audio/9.mp3","hl":"main"},{"audio":"./apply01_audio/10.mp3","hl":"meaning"},{"audio":"./apply01_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/12.mp3","hl":"main"},{"audio":"./apply01_audio/13.mp3","hl":"meaning"},{"audio":"./apply01_audio/14.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/15.mp3","hl":"main"},{"audio":"./apply01_audio/16.mp3","hl":"meaning"},{"audio":"./apply01_audio/17.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/18.mp3","hl":"main"},{"audio":"./apply01_audio/19.mp3","hl":"meaning"},{"audio":"./apply01_audio/20.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/21.mp3","hl":"main"},{"audio":"./apply01_audio/22.mp3","hl":"meaning"},{"audio":"./apply01_audio/23.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/24.mp3","hl":"main"},{"audio":"./apply01_audio/25.mp3","hl":"meaning"},{"audio":"./apply01_audio/26.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/27.mp3","hl":"main"},{"audio":"./apply01_audio/28.mp3","hl":"meaning"},{"audio":"./apply01_audio/29.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/30.mp3","hl":"main"},{"audio":"./apply01_audio/31.mp3","hl":"meaning"},{"audio":"./apply01_audio/32.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/33.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl
