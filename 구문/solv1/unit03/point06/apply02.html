&#39;을 찾는 것이 정신 건강에 매우 중요하다고 강조합니다. 특히 &#39;자기 효능감(Self-efficacy)&#39;은 스스로 어떤 일을 해낼 수 있다는 믿음을 뜻하는데, 지문의 주인공처럼 사소한 일이라도 사회적 기여를 시작하면 자신감을 회복하고 삶의 의욕을 되찾는 긍정적인 변화를 경험하게 됩니다. 즉, 은퇴는 끝이 아니라 새로운 역할을 통해 삶의 균형을 다시 맞추어가는 &#39;제2의 성장기&#39;가 될 수 있다는 점을 기억하며 지문을 읽어보시길 바랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01은퇴 후의 상실감</div><ul><li>성공적인 직장 생활을 했던 주인공이 은퇴 후 사회적 단절로 인해 심리적 어려움을 겪는다.</li><li>업무 관련 연락이 끊기며 찾아온 공허함(vanished calls)</li><li>후임자의 거절로 느끼는 소외감(social isolation)</li><li>6개월 전과 동일한 사람이지만 아무도 찾지 않는 현실</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02우울감의 심화</div><ul><li>사회적 지위를 잃은 주인공은 무기력한 일상을 보내며 우울증 증세를 보인다.</li><li>늦잠을 자는 습관과 깊어지는 우울감(depression)</li><li>친구의 조언으로 시작하게 된 새로운 제안</li><li>은퇴 후 목적의식의 부재(lack of purpose)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03새로운 역할 수행</div><ul><li>초등학교 교통정리 봉사를 시작하면서 주인공은 새로운 삶의 활력을 되찾기 시작한다.</li><li>교통정리원(crossing guard)으로서의 새로운 역할</li><li>차량을 통제하며 느끼는 책임감과 숙련도</li><li>신체적 자세와 눈빛의 변화(straighter posture and confident gaze)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04삶의 의욕 회복</div><ul><li>스스로 가치 있는 존재임을 확인하며 매일 아침 일어날 이유를 찾는다.</li><li>하루를 시작할 강력한 이유(compelling reason)의 발견</li><li>역할 수행을 통한 자존감 회복</li><li>핵심 키워드: 목적의식(sense of purpose)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">retired</td><td class=\"m\">은퇴한, 퇴직한</td></tr><tr><td class=\"w\">executive</td><td class=\"m\">경영진, 간부, 이사</td></tr><tr><td class=\"w\">vanish</td><td class=\"m\">사라지다, 없어지다</td></tr><tr><td class=\"w\">altogether</td><td class=\"m\">완전히, 전적으로, 다 합쳐서</td></tr><tr><td class=\"w\">decline</td><td class=\"m\">거절하다, 사양하다</td></tr><tr><td class=\"w\">seek out</td><td class=\"m\">~을 찾아내다, ~을 찾으려고 애쓰다</td></tr><tr><td class=\"w\">serve as</td><td class=\"m\">~로서 역할을 하다, 근무하다</td></tr><tr><td class=\"w\">point out</td><td class=\"m\">지적하다, 언급하다</td></tr><tr><td class=\"w\">depressed</td><td class=\"m\">우울한, 의기소침한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sleep in</td><td class=\"m\">늦잠 자다</td></tr><tr><td class=\"w\">oncoming</td><td class=\"m\">다가오는, 마주 오는</td></tr><tr><td class=\"w\">halt</td><td class=\"m\">멈추다, 세우다</td></tr><tr><td class=\"w\">take on</td><td class=\"m\">(특징, 양상 등을) 띠다, 떠맡다</td></tr><tr><td class=\"w\">posture</td><td class=\"m\">자세, 태도</td></tr><tr><td class=\"w\">gaze</td><td class=\"m\">시선, 응시</td></tr><tr><td class=\"w\">compelling</td><td class=\"m\">설득력 있는, 강력한</td></tr><tr><td class=\"w\">get out of bed</td><td class=\"m\">침대에서 일어나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">막 은퇴한 임원은</span><span class=\"en\"><b>A <span class=\"grammar-hl\">newly retired</span> executive</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">괴로웠다</span><span class=\"en\"><b><span class=\"grammar-hl\">was bothered</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아무도 자신에게 더 이상 전화하지 않을 때</span><span class=\"en\"><b>when no one called him anymore.</b></span></div></div><div class=\"lec-sent-ko\">막 은퇴한 임원은 더 이상 자신에게 아무도 전화하지 않는다는 사실에 괴로웠다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 은퇴 직후 겪게 된 사회적 고립감을 제시하며, 글의 주인공이 겪는 상실감을 서술합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">newly retired (과거분사(형용사)): retired가 executive를 수식(= &#39;은퇴한 임원&#39;). retired + N ≈ &#39;retired된 N&#39; 또는 &#39;N that is/was retired&#39; (축약 관계절)</div><div class=\"lec-gr-item\">was bothered (수동태): be동사(was)+p.p.(bothered) 구조. bother는 타동사(기본구조: bother + O)인데 목적어가 없어서 수동구조 was bothered 형태로 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">retired</td><td class=\"m\">은퇴한, 퇴직한</td></tr><tr><td class=\"w\">executive</td><td class=\"m\">경영진, 간부, 이사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">답해야 할 통화 목록은,</span><span class=\"en\"><b>His list of <span class=\"grammar-hl\">calls to return</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이전에는 몇 페이지로 길었던,</span><span class=\"en\"><b>previously pages long,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완전히 사라져 버렸다.</span><span class=\"en\"><b>had vanished altogether.</b></span></div></div><div class=\"lec-sent-ko\">이전에는 몇 페이지로 길었던 답해야 할 통화 목록이 모두 사라졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 고립된 상황을 구체적인 사례로 뒷받침합니다. 왕성하게 활동하던 과거의 영향력이 은퇴와 동시에 소멸했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">calls to return to부정사(형용사적 용법): to return이 앞의 명사 calls를 수식하여 &#39;회신해야 할 전화&#39;라는 의미를 형성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">vanish</td><td class=\"m\">사라지다, 없어지다</td></tr><tr><td class=\"w\">altogether</td><td class=\"m\">완전히, 전적으로, 다 합쳐서</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사무실에서 그를 대신한 젊은 후임이</span><span class=\"en\"><b>The younger man <span class=\"grammar-hl\">who replaced him at the office</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점심을 함께하자는 그의 제안을 정중히 사양하며</span><span class=\"en\"><b>had politely <span class=\"grammar-hl\">declined his offer of having lunch together</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신이 일을 “잘” 터득하고 있다고 말하며.</span><span class=\"en\"><b>claiming he was mastering the job “just fine.”</b></span></div></div><div class=\"lec-sent-ko\">사무실에서 그를 대신한 젊은 후임이 점심을 함께하자는 그의 제안을, 자신이 일을 “잘” 터득하고 있다고 말하며 정중히 사양했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 퇴직 후의 인간관계 단절을 보여주는 예시입니다. 과거의 권위가 사라진 주인공의 처지를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who replaced him at the office (관계대명사): 주격 관계대명사 who가 이끄는 절이 앞의 선행사 The younger man을 수식한다. 절 내부에서 who가 주어 역할을 하므로 뒤에 동사(replaced)가 바로 이어진다.</div><div class=\"lec-gr-item\">declined his offer of having lunch together (동명사(명사적)): 전치사 of 뒤에 쓰인 having은 &#39;점심을 함께 먹는 행위&#39;라는 명사적 개념을 나타내며, offer의 내용을 구체화하는 동격의 성격을 띤다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">decline</td><td class=\"m\">거절하다, 사양하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 68세의 남자는</span><span class=\"en\"><b>This 68-year-old man</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같은 사람이었다</span><span class=\"en\"><b>was <span class=\"grammar-hl\">the same person</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">6개월 전과 다름없는,</span><span class=\"en\"><b><span class=\"grammar-hl\">he had been</span> six months earlier,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 아무도 그를 찾지 않았다</span><span class=\"en\"><b>but no one sought him out</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 은퇴 후에.</span><span class=\"en\"><b>after his retirement.</b></span></div></div><div class=\"lec-sent-ko\">이 68세의 남자는 6개월 전과 같은 바로 그 사람이지만, 은퇴 후에는 누구도 그를 찾지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인간의 본질은 변하지 않았음에도 사회적 위치 변화에 따라 타인의 대우가 어떻게 달라지는지 대조하며 문제의 원인을 짚어냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the same person he had been 관계대명사(목적격 생략): person 뒤에 목적격 관계대명사(that/whom)가 생략되어 있으며, he had been의 보어 자리가 비어있는 구조로, 앞의 person을 수식한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 친구가 그를 격려했다</span><span class=\"en\"><b>a friend encouraged him</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교통안전 지킴이로 일하도록</span><span class=\"en\"><b>to serve as a crossing guard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">초등학교를 위한,</span><span class=\"en\"><b>for the elementary school,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지적하면서</span><span class=\"en\"><b><span class=\"grammar-hl\">pointing out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 점점 더 우울해지고 있는 것 같다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> he <span class=\"grammar-hl\">seemed to be getting more and more depressed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 점점 더 늦게까지 늦잠을 자고 있다는 것을.</span><span class=\"en\"><b>and was sleeping in later and later.</b></span></div></div><div class=\"lec-sent-ko\">어느 날, 한 친구가 그가 점점 우울해지고 있는 것 같고, 점점 늦잠을 자고 있다고 지적하며, 초등학교 교통안전 지킴이로 활동하도록 격려했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 무기력해진 주인공의 상태를 개선하기 위한 전환점이 제시됩니다. 앞선 고립의 문제를 해결할 수 있는 구체적인 대안입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">pointing out that (분사구문(현재분사)): 문장 전체의 부사적 기능을 하며, 원래 절로 변환하면 &#39;because he (a friend) pointed out that...&#39;으로 해석된다.</div><div class=\"lec-gr-item\">seemed to be getting (to부정사): seem의 목적보어로 쓰여 &#39;~인 것 같다&#39;는 상태를 나타낸다.</div><div class=\"lec-gr-item\">seemed to be getting more and more depressed (현재진행): be+ -ing(getting) 구조로 &#39;점점 더 우울해지고 있는 중&#39;이라는 동작의 진행 상태를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">serve as</td><td class=\"m\">~로서 역할을 하다, 근무하다</td></tr><tr><td class=\"w\">depressed</td><td class=\"m\">우울한, 의기소침한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">능숙해지면서</span><span class=\"en\"><b><span class=\"grammar-hl\">Skilled</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다가오는 차들에 신호를 보내는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">in signaling</span> the oncoming cars</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 차들이 멈추게 하는 데</span><span class=\"en\"><b>and <span class=\"grammar-hl\">getting them to halt</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정지선 몇 야드 앞에서,</span><span class=\"en\"><b>yards before the white lines,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 더 곧은 자세를 취하기 시작했다</span><span class=\"en\"><b>he began taking on a straighter posture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 더 자신감 있는 시선을.</span><span class=\"en\"><b>and a more confident gaze.</b></span></div></div><div class=\"lec-sent-ko\">오는 자동차에 신호를 보내고, 자동차가 정지선 몇 야드 앞에서 멈추게 하는 일에 능숙해지면서, 그는 더 곧은 자세와 더 자신감 있는 시선을 갖게 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사회적 역할을 다시 수행하면서 주인공의 내면과 외면이 긍정적으로 변화하는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Skilled in signaling (분사구문(과거분사)): 형용사구인 Skilled가 분사구문의 역할을 하며, 원래 절로 변환하면 &#39;As he was skilled in signaling...&#39;의 의미를 가진다.</div><div class=\"lec-gr-item\">getting them to halt 5형식(SVOC) 구조: get+O+to부정사 패턴. them이 목적어, to halt가 목적보어(O.C.)로, &#39;그들이 멈추도록 만들다&#39;라는 5형식 구조를 이룬다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">oncoming</td><td class=\"m\">다가오는, 마주 오는</td></tr><tr><td class=\"w\">halt</td><td class=\"m\">멈추다, 세우다</td></tr><tr><td class=\"w\">posture</td><td class=\"m\">자세, 태도</td></tr><tr><td class=\"w\">gaze</td><td class=\"m\">시선, 응시</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 찾았다</span><span class=\"en\"><b>He had found</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">설득력 있는 이유를</span><span class=\"en\"><b>a compelling <span class=\"grammar-hl\">reason</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">침대에서 나올</span><span class=\"en\"><b><span class=\"grammar-hl\">to get out</span> of bed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아침에.</span><span class=\"en\"><b>in the morning.</b></span></div></div><div class=\"lec-sent-ko\">그리고 그는 아침에 잠자리에서 나올 충분한 이유를 찾았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 은퇴 후 상실했던 삶의 목적과 활력을 사회적 기여를 통해 되찾았음을 결론짓습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reason to get out to부정사(형용사적 용법): to get이 앞의 명사 reason을 수식하며 &#39;~할 이유&#39;라는 의미를 형성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">compelling</td><td class=\"m\">설득력 있는, 강력한</td></tr><tr><td class=\"w\">get out of bed</td><td class=\"m\">침대에서 일어나다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>은퇴한 임원은 사회적 역할 상실로 인해 심각한 고립감과 우울함을 겪는다.</li><li>과거와 변함없는 본인이지만, 타인과의 관계는 직함 유무에 따라 냉정하게 단절된다.</li><li>초등학교 안전 요원이라는 새로운 사회적 역할을 맡으며 무기력함에서 벗어난다.</li><li>사회 속에서 기여할 대상을 찾음으로써 그는 다시 삶의 활력을 되찾는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">A retired executive struggled with feelings of isolation after losing his professional status, yet he regained his sense of self-worth by volunteering as a crossing guard.</div>\n              <div class=\"lec-final-sum-ko\">은퇴한 임원은 직업적 지위를 잃은 후 고립감을 겪었으나, 교통 봉사자로 활동하며 자존감을 되찾았다.</div></div></div>"],"segs":[[{"audio":"./apply02_audio/1.mp3","hl":null}],[{"audio":"./apply02_audio/2.mp3","hl":null}],[{"audio":"./apply02_audio/3.mp3","hl":null},{"audio":"./apply02_audio/4.mp3","hl":"stage-0"},{"audio":"./apply02_audio/5.mp3","hl":"stage-1"},{"audio":"./apply02_audio/6.mp3","hl":"stage-2"},{"audio":"./apply02_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply02_audio/8.mp3","hl":null}],[{"audio":"./apply02_audio/9.mp3","hl":"main"},{"audio":"./apply02_audio/10.mp3","hl":"meaning"},{"audio":"./apply02_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/12.mp3","hl":"main"},{"audio":"./apply02_audio/13.mp3","hl":"meaning"},{"audio":"./apply02_audio/14.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/15.mp3","hl":"main"},{"audio":"./apply02_audio/16.mp3","hl":"meaning"},{"audio":"./apply02_audio/17.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/18.mp3","hl":"main"},{"audio":"./apply02_audio/19.mp3","hl":"meaning"},{"audio":"./apply02_audio/20.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/21.mp3","hl":"main"},{"audio":"./apply02_audio/22.mp3","hl":"meaning"},{"audio":"./apply02_audio/23.mp3","hl":"grammar"}],[{"audio":"./apply02_au
