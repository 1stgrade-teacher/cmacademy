head\">03프로그램 지속성 증대</div><ul><li>환자가 다이어트 프로그램을 중도에 포기하지 않도록 배우자를 포함시키는 전략이 효과적이다.</li><li>배우자를 체중 조절 프로그램(weight-control program)에 참여시킴</li><li>환자의 중도 포기율(drop-out rates)이 현저하게 감소함</li><li>핵심 키워드: 참여의 중요성(importance of participation)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">a number of</td><td class=\"m\">많은, 다수의</td></tr><tr><td class=\"w\">have an impact on</td><td class=\"m\">~에 영향을 미치다</td></tr><tr><td class=\"w\">maintenance</td><td class=\"m\">유지, 보수</td></tr><tr><td class=\"w\">significantly</td><td class=\"m\">상당히, 크게</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">note</td><td class=\"m\">언급하다, 주목하다</td></tr><tr><td class=\"w\">even though</td><td class=\"m\">~임에도 불구하고, 비록 ~일지라도</td></tr><tr><td class=\"w\">suggest</td><td class=\"m\">시사하다, 암시하다</td></tr><tr><td class=\"w\">drop-out</td><td class=\"m\">중도 탈락, 중도 하차</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 연구들이</span><span class=\"en\"><b>A number of studies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보여주었다</span><span class=\"en\"><b>have <span class=\"grammar-hl\">shown</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환자 배우자의 체중과 태도가</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> the body weight and attitudes of a patient’s spouse</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 영향을 끼칠 수 있다는 것을</span><span class=\"en\"><b>can have a major impact</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감량된 체중의 양에</span><span class=\"en\"><b>on the amount of <span class=\"grammar-hl\">weight lost</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 체중 유지의 성공에</span><span class=\"en\"><b>and on success in weight maintenance.</b></span></div></div><div class=\"lec-sent-ko\">많은 (과체중 환자의 감량에 대한) 연구들은 환자 배우자의 체중과 태도가 감량된 체중의 양과 체중 유지 성공에 있어 대단한 영향을 끼칠 수 있다는 것을 보여주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글 전체의 주제를 제시합니다. 환자가 혼자 노력하는 것이 아니라 배우자의 신체적 특징이나 생활 습관이 다이어트 결과에 결정적인 변수로 작용한다는 사실을 학술적인 관점에서 도입합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shown that (명사절(that절)): show의 목적어 역할을 하는 절로, that은 문장 안에서 명사 역할을 함</div><div class=\"lec-gr-item\">weight lost (과거분사(형용사)): lost가 weight를 수식하며, &#39;체중이 줄어든(줄어든 체중)&#39;이라는 의미를 나타냄. 명사 + p.p. 구조로 축약된 관계절(weight that was lost)의 의미임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">a number of</td><td class=\"m\">많은, 다수의</td></tr><tr><td class=\"w\">maintenance</td><td class=\"m\">유지, 보수</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Black과 Threlfall은 발견했다</span><span class=\"en\"><b>Black and Threlfall found</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정상 체중의 배우자를 둔 과체중 환자들이</span><span class=\"en\"><b>that <span class=\"grammar-hl\">overweight patients</span> with <span class=\"grammar-hl\">normal-weight partners</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현저히 더 많은 체중을 감량했다는 것을</span><span class=\"en\"><b>lost significantly more weight</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과체중 배우자를 둔 사람들보다</span><span class=\"en\"><b>than those with overweight partners.</b></span></div></div><div class=\"lec-sent-ko\">Black and Threlfall은 과체중인 배우자를 가진 경우보다 정상 체중의 배우자를 가진 과체중 환자들이 현저하게 더 많은 몸무게를 감량했다는 것을 발견했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 일반적인 진술을 뒷받침하는 구체적인 연구 사례입니다. 배우자의 신체 상태가 환자의 다이어트 성과에 직접적인 영향을 주는 첫 번째 증거로서, 주변 환경이 환자의 식습관이나 활동 수준을 규정한다는 의미를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">overweight patients 형용사적 수식: overweight가 뒤의 명사 patients를 수식하는 구조</div><div class=\"lec-gr-item\">normal-weight partners 형용사적 수식: normal-weight가 뒤의 명사 partners를 수식하는 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">significantly</td><td class=\"m\">상당히, 크게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 또한 언급했다</span><span class=\"en\"><b>They also <span class=\"grammar-hl\">noted</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">성공이 더 컸다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> success was greater</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배우자 또한 체중을 감량한 그런 환자들에게서</span><span class=\"en\"><b>in those patients <span class=\"grammar-hl\">whose partners had also lost weight</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비록 그들이 프로그램에 포함되지 않았더라도,</span><span class=\"en\"><b>even though they <span class=\"grammar-hl\">were not included</span> in the program,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">권고된 변화들이</span><span class=\"en\"><b><span class=\"grammar-hl\">suggesting</span> that <span class=\"grammar-hl\">recommended changes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배우자에 의해 적극적으로 지지받고 있음을 시사하며</span><span class=\"en\"><b><span class=\"grammar-hl\">were being actively supported</span> by the spouse.</b></span></div></div><div class=\"lec-sent-ko\">비록 (감량) 프로그램에 직접 참여하지 않았지만 체중을 감량한 배우자를 가진 (과체중) 환자들이 보다 더 큰 성공을 거두었다고 그들은 또한 언급했는데, 이는 권고된 변화 항목들이 배우자들에 의해 적극 지지를 받았다는 것을 시사했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 연구 결과를 이어받아, 단순히 배우자의 체중 때문이 아니라 그들의 &#39;동조 행동&#39;이 핵심임을 설명합니다. 프로그램에 참여하지 않은 배우자조차 환자와 같은 변화를 겪고 있다는 것은, 부부가 공유하는 생활 환경이나 식단이 환자의 다이어트 성공을 돕는 강력한 지원군이 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">noted that (명사절(that절)): note의 목적어 역할을 하는 절</div><div class=\"lec-gr-item\">whose partners had also lost weight (관계대명사(소유격)): whose는 관계대명사로서 선행사 those patients를 수식하며, 뒤에 partners라는 명사를 포함한 완전한 절이 이어짐</div><div class=\"lec-gr-item\">were not included (수동태): be동사(were)+p.p.(included) 구조. include는 타동사인데 목적어가 없어서 수동구조 were included 형태로 쓴다. 기본구조: include + O (O를 포함하다)</div><div class=\"lec-gr-item\">suggesting (현재분사(분사구문)): 앞의 내용을 부연 설명하는 분사구문으로, 원래 절로 변환하면 &#39;and it suggests that...&#39;의 의미를 가짐</div><div class=\"lec-gr-item\">recommended changes (과거분사(형용사)): recommended가 changes를 수식하며, &#39;권장된 변화들&#39;이라는 의미를 나타냄. p.p. + 명사 구조로 축약된 관계절(changes that were recommended)의 의미임</div><div class=\"lec-gr-item\">were being actively supported (수동태(과거진행수동)): be동사(were)+being+p.p.(supported) 구조. support는 타동사인데 목적어가 없어서 수동구조 were being supported 형태로 쓴다. 기본구조: support + O (O를 지지하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">note</td><td class=\"m\">언급하다, 주목하다</td></tr><tr><td class=\"w\">even though</td><td class=\"m\">~임에도 불구하고, 비록 ~일지라도</td></tr><tr><td class=\"w\">suggest</td><td class=\"m\">시사하다, 암시하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비슷하게,</span><span class=\"en\"><b>Similarly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Pratt는 발견했다</span><span class=\"en\"><b>Pratt found</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중도 탈락률이 줄어들었다는 것을</span><span class=\"en\"><b>that drop-out rates <span class=\"grammar-hl\">were reduced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환자의 배우자가 포함되었을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when the patient’s spouse was included</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">체중 조절 프로그램에</span><span class=\"en\"><b>in a weight-control program.</b></span></div></div><div class=\"lec-sent-ko\">마찬가지로, Pratt는 환자의 배우자가 체중 조절 프로그램에 함께 참여하는 경우 프로그램 중도 탈락률이 감소했다는 것을 발견했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 배우자의 자발적인 지지 효과를 언급한 데 이어, 배우자를 프로그램에 공식적으로 포함시켰을 때의 긍정적 효과를 추가로 제시합니다. 환자와 배우자가 체중 관리에 대한 정보를 공유하고 공동의 목표를 가질 때 중도 포기라는 실패를 막을 수 있다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were reduced (수동태): be동사(were)+p.p.(reduced) 구조. reduce는 타동사인데 목적어가 없어서 수동구조 were reduced 형태로 쓴다. 기본구조: reduce + O (O를 줄이다)</div><div class=\"lec-gr-item\">when the patient’s spouse was included (분사구문(절)): 접속사 when을 포함한 부사절로, 수동태 구조(was included)가 사용됨. include는 타동사인데 목적어가 없어서 수동구조 was included 형태로 쓴다. 기본구조: include + O (O를 포함하다)</div><div class=\"lec-gr-item\">was included (수동태): be동사(was)+p.p.(included) 구조. include는 타동사인데 목적어가 없어서 수동구조 was included 형태로 쓴다. 기본구조: include + O (O를 포함하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">drop-out</td><td class=\"m\">중도 탈락, 중도 하차</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>환자의 체중 감량 성공 여부는 배우자의 상태와 태도에 크게 좌우된다.</li><li>정상 체중 배우자를 둔 환자가 더 많이 감량하며, 배우자의 동참은 성공률을 높인다.</li><li>배우자가 프로그램에 함께 참여하면 환자의 중도 포기 가능성이 현저히 줄어든다.</li><li>다이어트는 개인의 의지만으로 하는 것이 아니라 주변의 지지와 협력이 필수적인 과정이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Patients achieve greater weight loss when their spouses maintain a healthy weight or actively participate, and spousal inclusion decreases the likelihood of dropping out of programs.</div>\n              <div class=\"lec-final-sum-ko\">배우자가 건강한 체중을 유지하거나 적극적으로 참여할 때 환자는 더 큰 체중 감량 효과를 거두며, 배우자의 포함은 프로그램 중도 탈락 가능성을 낮춘다.</div></div></div>"],"segs":[[{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/1.mp3","hl":null}],[{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/2.mp3","hl":null}],[{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/3.mp3","hl":null},{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/7.mp3","hl":null}],[{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/8.mp3","hl":"main"},{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/9.mp3","hl":"meaning"},{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/11.mp3","hl":"main"},{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/12.mp3","hl":"meaning"},{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/13.mp3","hl":"grammar"}],[{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/14.mp3","hl":"main"},{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/15.mp3","hl":"meaning"},{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/16.mp3","hl":"grammar"}],[{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/17.mp3","hl":"main"},{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/18.mp3","hl":"meaning"},{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/19.mp3","hl":"grammar"}],[{"audio":"./구문사고력 기본 Unit03 review reading03_강의_audio/20.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=d
