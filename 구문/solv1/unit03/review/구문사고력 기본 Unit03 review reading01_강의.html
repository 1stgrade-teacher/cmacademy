/AK3sffmkLL1yPzGAF+8c9sA85P8AOl3D1HbuO9AC/wCfr+P+e34p255I/DP6/wD1qAR6jjI656dfy70hZVGSRjoOR29P5f4c0AOFJgjoc89+eCR39ueuaNygZLDHPOR+P5d/TvQWUdSP8/8A1uaAWv8Al69/MWj1/wA9h0/z1zSEgdx37+n3vy7/AK0ZHHv07UALSE8E+mf0/wA/1oBBHBB5I6g9+Rxnt2/PFDfdJ7YJz7YoD+vmf//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Survival Strategy: Finding the Right Environment<small>생존 전략: 적절한 환경 찾기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 읽기 전, 여러분이 주목해야 할 핵심 개념은 바로 &#39;희소성(Scarcity)&#39;과 &#39;경제적 가치(Economic Value)&#39;입니다. 경제학적으로 볼 때, 특정 대상이 희소할수록 그것을 잃었을 때의 반응이나 보호하려는 노력은 훨씬 강력해지기 마련인데요, 마치 멸종 위기 동물을 보호하는 것과 일반적인 동물을 대하는 태도의 차이라고 이해하시면 쉽습니다. 또한, 현대 사회에서 &#39;소프트웨어 개발자(Computer Programmer)&#39;라는 직업은 &#39;대체 불가능한 지식 노동자(Knowledge Worker)&#39;로서 매우 높은 생산성을 지닌 자원으로 평가받고 있습니다. 즉, 이 지문은 단순히 사자가 사람을 잡아먹는 이야기를 넘어, 누가 사회 시스템에서 어떤 &#39;가치&#39;를 지니고 있는지에 대한 풍자를 담고 있습니다. 이런 맥락을 이해하고 글을 읽으시면, 왜 마을 사람들은 즉각 반응하고 실리콘밸리에서는 아무도 눈치채지 못했는지에 대한 &#39;사회적 자본(Social Capital)&#39;의 역설을 재미있게 발견하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01사자들의 재회</div><ul><li>동물원을 탈출한 두 사자가 3개월 만에 다시 만나 서로의 상태를 확인한다.</li><li>두 사자의 각기 다른 신체 상태: 말라버린 사자와 건강한 사자</li><li>재회 장소에서 나누는 대화의 시작</li><li>핵심 키워드: 재회(Reunion), 신체 상태(Physical condition)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02마른 사자의 고난</div><ul><li>마른 사자는 마을에서 사람을 사냥했다가 쫓기게 되어 굶주림을 겪었다.</li><li>마을 습격 이후 마을 주민들의 추격(Chasing) 시작</li><li>총을 든 사람들로 인해 사냥을 하지 못함</li><li>핵심 키워드: 굶주림(Starvation), 추격(Pursuit)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03건강한 사자의 비결</div><ul><li>건강한 사자는 실리콘 밸리로 이동하여 프로그래머를 잡아먹으며 생활했다.</li><li>사람들의 눈에 띄지 않게 프로그래머를 사냥함</li><li>매주 꾸준히 영양 섭취가 가능한 환경 조성</li><li>핵심 키워드: 실리콘 밸리(Silicon Valley), 프로그래머(Computer programmer)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04대조적인 결과</div><ul><li>두 사자의 환경 선택에 따라 생존 결과가 극명하게 갈렸음을 보여준다.</li><li>사냥 대상과 장소 선택의 중요성</li><li>예측 불가능한 상황과 안정적인 환경의 차이</li><li>핵심 키워드: 환경(Environment), 전략(Strategy)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">split up</td><td class=\"m\">헤어지다, 분리되다</td></tr><tr><td class=\"w\">go by</td><td class=\"m\">(시간이) 지나가다, 흐르다</td></tr><tr><td class=\"w\">skinny</td><td class=\"m\">깡마른, 몹시 여윈</td></tr><tr><td class=\"w\">terrible</td><td class=\"m\">끔찍한, 형편없는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upset</td><td class=\"m\">속상한, 화가 난</td></tr><tr><td class=\"w\">make one&#39;s way to</td><td class=\"m\">~로 향하다, ~로 가다</td></tr><tr><td class=\"w\">notice</td><td class=\"m\">알아차리다, 인지하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사자 두 마리가 탈출한다</span><span class=\"en\"><b><span class=\"grammar-hl\">Two lions escape</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물원으로부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from the zoo</span>.</b></span></div></div><div class=\"lec-sent-ko\">사자 두 마리가 동물원에서 도망친다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 이어지는 사건의 배경이 되는 주인공들을 등장시키고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Two lions escape from the zoo (기본구조): S+V(1형식) 구조로, lions가 주어, escape가 동사로 쓰인 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 결정한다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">decide</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 좋을 것이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">it would be better</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 그들이 헤어진다면,</span><span class=\"en\"><b>if they split up,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 동의한다 만나기로</span><span class=\"en\"><b>but agree <span class=\"grammar-hl\">to meet</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">3개월 후에</span><span class=\"en\"><b>three months later.</b></span></div></div><div class=\"lec-sent-ko\">그들은 서로 헤어지는 게 좋겠다고 마음먹지만, 3개월 후에 만나기로 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사자들이 각자 다른 환경에서 경험을 쌓게 될 것임을 암시하며, 나중에 그 경험을 비교하기 위한 장치를 마련하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">decide it would be better (가주어): 진주어: it은 가주어이고 뒤의 if절(또는 to부정사 구조 등 문맥적 사실)을 진주어로 취하는 구조로, 동사 decide의 목적어 역할을 합니다.</div><div class=\"lec-gr-item\">to meet (to부정사): agree의 목적어로 쓰인 명사적 용법의 to부정사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">split up</td><td class=\"m\">헤어지다, 분리되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시간은</span><span class=\"en\"><b>The time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빠르게 지나가고,</span><span class=\"en\"><b>quickly goes by,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 만난다</span><span class=\"en\"><b>and they meet</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약속된 장소에서</span><span class=\"en\"><b>at the <span class=\"grammar-hl\">agreed place</span>.</b></span></div></div><div class=\"lec-sent-ko\">시간은 빠르게 흘러 그들은 약속 장소에서 만난다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간적 배경을 전환하여 주인공들의 상태가 어떻게 달라졌는지 확인하는 대면의 상황을 조성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">agreed place (과거분사): agree는 타동사인데 목적어가 없어서 과거분사(p.p.) 형태인 agreed가 뒤의 place를 수식하는 형용사적 기능으로 쓰였습니다. 기본구조: agree + O (동의하다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 마리는 이다</span><span class=\"en\"><b>One <span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 비쩍 마르고 힘이 없는,</span><span class=\"en\"><b><span class=\"grammar-hl\">very skinny and weak</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반면에 다른 한 마리는 보인다</span><span class=\"en\"><b>while the other <span class=\"grammar-hl\">appears</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 튼튼하고 건강해</span><span class=\"en\"><b><span class=\"grammar-hl\">very strong and healthy</span>.</b></span></div></div><div class=\"lec-sent-ko\">한 마리는 비쩍 말라 힘이 없는데, 다른 한 마리는 아주 튼튼하고 건강해 보인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 사건의 결과가 두 사자에게 상반된 모습으로 나타났음을 시각적으로 대조하여 독자의 호기심을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is very skinny and weak 5형식(SVOC) 구조: 주어(One) + 동사(is) + 주격보어(skinny and weak)로 연결된 2형식 문장입니다.</div><div class=\"lec-gr-item\">appears very strong and healthy 5형식(SVOC) 구조: 주어(the other) + 동사(appears) + 주격보어(strong and healthy)로 연결된 2형식 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">skinny</td><td class=\"m\">깡마른, 몹시 여윈</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사자 1: 무슨 일이 일어났니</span><span class=\"en\"><b>Lion 1: <span class=\"grammar-hl\">What happened</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너에게?</span><span class=\"en\"><b><span class=\"grammar-hl\">to you</span>?</b></span></div></div><div class=\"lec-sent-ko\">사자1: 어떻게 된 거야?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 건강한 상태인 사자 1이 상대방의 처참한 몰골을 보고 질문을 던지며 자연스럽게 대화의 물꼬를 틉니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What happened to you (간접의문문): 의문사 What이 주어 역할을 하며 happened(동사)와 결합하여 의문문의 형태를 이룹니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너는 보인다</span><span class=\"en\"><b><span class=\"grammar-hl\">You look</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">형편없어!</span><span class=\"en\"><b><span class=\"grammar-hl\">terrible</span>!</b></span></div></div><div class=\"lec-sent-ko\">아주 안 좋아 보이네!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사자 2가 겪은 실패의 원인을 설명합니다. 인간 사회에서 눈에 띄는 행동을 하는 것이 생존에 얼마나 위험한 결과를 초래하는지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">You look terrible 5형식(SVOC) 구조: 주어(You) + 동사(look) + 주격보어(terrible)로 이루어진 2형식 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">terrible</td><td class=\"m\">끔찍한, 형편없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사자 2: 나는 갔다</span><span class=\"en\"><b>Lion 2: I went</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">근처 마을로</span><span class=\"en\"><b>to a <span class=\"grammar-hl\">nearby village</span>.</b></span></div></div><div class=\"lec-sent-ko\">사자2: 난 여기서 가까운 마을로 갔었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사자 2가 겪은 실패의 원인을 설명합니다. 인간 사회에서 눈에 띄는 행동을 하는 것이 생존에 얼마나 위험한 결과를 초래하는지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">nearby village (관용표현): nearby는 &#39;근처의&#39;라는 뜻의 형용사로, 장소를 나타내는 부사적 의미를 포함하여 명사를 수식합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내가 한 전부는</span><span class=\"en\"><b><span class=\"grammar-hl\">All I did</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹은 것이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was eat</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조그만 사람 한 명을,</span><span class=\"en\"><b>one small person,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 마을 사람들은</span><span class=\"en\"><b>and the villagers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아주 화가 났다</span><span class=\"en\"><b><span class=\"grammar-hl\">got very upset</span>.</b></span></div></div><div class=\"lec-sent-ko\">내가 한 것이라곤 조그만 사람 한 명 잡아먹은 것밖에 없는데 마을 사람들이 아주 화가 났어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실패한 사자가 성공한 사자의 비결을 묻는 질문을 던짐으로써 글의 핵심 반전이 드러날 준비를 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">All I did was eat (대동사): 앞에 언급된 행위를 대신하여 did를 사용했습니다. &#39;앞의 동사가 일반동사이면 do[does,did]를 쓴다&#39;는 규칙에 따라 eat의 행위를 대신합니다.</div><div class=\"lec-gr-item\">got very upset 5형식(SVOC) 구조: 주어(the villagers) + 동사(get) + 주격보어(upset)로 이루어진 2형식 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upset</td><td class=\"m\">속상한, 화가 난</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 나를 쫓기 시작했다</span><span class=\"en\"><b>They started <span class=\"grammar-hl\">chasing</span> me</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">총을 가지고!</span><span class=\"en\"><b>with guns!</b></span></div></div><div class=\"lec-sent-ko\">총을 갖고 날 막 쫓아오는 거야!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사회가 구성원들의 실종에 무관심하거나 그들을 대체 가능한 부품처럼 취급하는 실리콘 밸리의 세태를 풍자하며, 눈에 띄지 않는 곳에서 취하는 생존 방식이 훨씬 효과적임을 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">chasing (현재분사): 문맥상 &#39;나를 뒤쫓으면서&#39;라는 부수적 동작을 나타내는 분사구문으로, 원래 절로 변환하면 &#39;while they were chasing me&#39;가 됩니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 계속 도망치고 있었다</span><span class=\"en\"><b>I’ve been <span class=\"grammar-hl\">running</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들로부터</span><span class=\"en\"><b>from them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 먹지 못했다</span><span class=\"en\"><b>and haven’t had</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹을 것을</span><span class=\"en\"><b>a thing to eat</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그때 이후로</span><span class=\"en\"><b>since then.</b></span></div></div><div class=\"lec-sent-ko\">그 사람들한테서 도망쳐 다니느라 그때부터 아무것도 못 먹었어.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">running (현재진행): have been + -ing 구조로, 과거부터 지금까지 계속해서 &#39;달려오고 있는 중&#39;임을 나타내는 현재완료진행형입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사자 1: 그것은</span><span class=\"en\"><b>Lion 1: <span class=\"grammar-hl\">That’s</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">참 안됐구나</span><span class=\"en\"><b><span class=\"grammar-hl\">too bad</span>.</b></span></div></div><div class=\"lec-sent-ko\">사자1: 그거 참 안됐구나.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상대방의 불행을 공감하는 짧은 반응을 보이며 대화의 흐름을 이어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">That’s too bad (관용표현): &#39;참 안됐구나/유감이다&#39;라는 의미의 영어 숙어적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사자 2: 어떠니</span><span class=\"en\"><b>Lion 2: <span class=\"grammar-hl\">What about</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너는?</span><span class=\"en\"><b><span class=\"grammar-hl\">you</span>?</b></span></div></div><div class=\"lec-sent-ko\">사자2: 너는 어때?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실패한 사자가 성공한 사자의 비결을 묻는 질문을 던짐으로써 글의 핵심 반전이 드러날 준비를 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What about you (관용표현): 상대방의 상태나 의견을 물을 때 사용하는 전치사구 숙어입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너는 보인다</span><span class=\"en\"><b>You <span class=\"grammar-hl\">seem</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘 지내고 있는 것처럼</span><span class=\"en\"><b><span class=\"grammar-hl\">to be doing</span> well.</b></span></div></div><div class=\"lec-sent-ko\">넌 잘 지내고 있는 것 같은데.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">seem to be doing (to부정사): seem의 보어로 쓰인 명사적 용법의 to부정사이며, 뒤에 진행형(be doing)이 결합된 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사자 1: 음,</span><span class=\"en\"><b>Lion 1: Well,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 갔다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">made my way</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실리콘 밸리로</span><span class=\"en\"><b>to Silicon Valley</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캘리포니아에 있는</span><span class=\"en\"><b>in California.</b></span></div></div><div class=\"lec-sent-ko\">사자1: 음, 난 캘리포니아에 있는 실리콘 밸리에 갔었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사회가 구성원들의 실종에 무관심하거나 그들을 대체 가능한 부품처럼 취급하는 실리콘 밸리의 세태를 풍자하며, 눈에 띄지 않는 곳에서 취하는 생존 방식이 훨씬 효과적임을 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made my way (관용표현): &#39;나아가다/길을 가다&#39;라는 의미의 관용구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 계속 먹어왔다</span><span class=\"en\"><b>I’ve been <span class=\"grammar-hl\">eating</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">컴퓨터 프로그래머 한 명을</span><span class=\"en\"><b>one computer programmer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매주,</span><span class=\"en\"><b>a week,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 아무도 모르는 것 같다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">nobody seems</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">눈치채는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">to notice</span>.</b></span></div></div><div class=\"lec-sent-ko\">컴퓨터 프로그래머를 한 주에 한 명씩 계속 잡아먹었는데 아무도 모르는 것 같더라고.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">eating (현재진행): have been + -ing 구조로, 과거부터 지금까지 컴퓨터 프로그래머를 먹고 있는 중임을 나타내는 현재완료진행형입니다.</div><div class=\"lec-gr-item\">nobody seems to notice (to부정사): seem의 목적보어 역할을 하는 명사적 용법의 to부정사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">notice</td><td class=\"m\">알아차리다, 인지하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>동물원에서 탈출한 두 사자가 3개월 뒤 재회한다.</li><li>한 사자는 마을에서 사람을 건드렸다가 쫓기느라 굶주린 상태가 되었다.</li><li>다른 사자는 실리콘 밸리에서 프로그래머를 잡아먹으며 여전히 건강하게 지내고 있다.</li><li>프로그래머는 아무도 눈치채지 못할 정도로 그 사회에서 무시되거나 소외된 존재임을 풍자하고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">One lion struggled after attacking humans in a village, whereas the other thrived by consuming programmers in Silicon Valley without being detected.</div>\n              <div class=\"lec-final-sum-ko\">한 사자는 마을에서 인간을 공격한 후 고통받았으나, 다른 사자는 실리콘 밸리에서 발각되지 않고 프로그래머들을 잡아먹으며 잘 지냈다.</div></div></div>"],"segs":[[{"audio":"./구문사고력 기본 Unit03 review reading01_강의_audio/1.mp3","hl":null}],[{"audio":"./구문사고력 기본 Unit03 review reading01_강의_audio/2.mp3","hl":null}],[{"audio":"./구문사고력 기본 Unit03 review reading01_강의_audio/3.mp3","hl":null},{"audio":"./구문사고력 기본 Unit03 review reading01_강의_audio/4.mp3","
