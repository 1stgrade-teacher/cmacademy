ass=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02교통사고 감소 효과</div><ul><li>낮은 속도 제한은 치명적인 사고를 줄이는 데 결정적인 역할을 한다.</li><li>사고 발생 시 사망이나 심각한 부상(death or serious injury)의 위험성 감소</li><li>물리적 충돌 속도가 낮을수록 생존 가능성 증대</li><li>핵심 키워드: 교통 사망률(traffic death rates)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03연료 소비 절감 효과</div><ul><li>제한 속도 규정은 고속 주행보다 연료 효율성을 높이는 결과를 가져왔다.</li><li>고속 주행에 비해 낮은 속도에서 연료 소비(fuel consumed)가 적음</li><li>에너지 수입 의존도를 낮추는 경제적 이점 발생</li><li>핵심 키워드: 연료 절약(fuel-saving)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 제언</div><ul><li>생명 보호와 자원 절약이라는 두 가지 목적을 위해 현행 속도 제한법은 유지되어야 한다.</li><li>두 가지 명백한 근거에 기반한 정책 유지 강조</li><li>해당 법안의 지속적인 시행 요구</li><li>핵심 키워드: 법적 조치(measure)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get rid of</td><td class=\"m\">~을 없애다, ~을 제거하다</td></tr><tr><td class=\"w\">undeniable</td><td class=\"m\">부인할 수 없는, 명백한</td></tr><tr><td class=\"w\">emerge</td><td class=\"m\">나타나다, 드러나다</td></tr><tr><td class=\"w\">adoption</td><td class=\"m\">채택, 도입</td></tr><tr><td class=\"w\">uniform</td><td class=\"m\">균일한, 일정한</td></tr><tr><td class=\"w\">collision</td><td class=\"m\">충돌, 부딪힘</td></tr><tr><td class=\"w\">be(v) likely to</td><td class=\"m\">~할 가능성이 있다</td></tr><tr><td class=\"w\">result in</td><td class=\"m\">~을 야기하다, ~으로 끝나다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consume</td><td class=\"m\">소비하다, 먹어치우다</td></tr><tr><td class=\"w\">import</td><td class=\"m\">수입하다</td></tr><tr><td class=\"w\">the comparative, the comparative</td><td class=\"m\">~하면 할수록 더 ~하다</td></tr><tr><td class=\"w\">lifesaving</td><td class=\"m\">인명을 구하는, 생명을 구하는</td></tr><tr><td class=\"w\">measure</td><td class=\"m\">조치, 방책</td></tr><tr><td class=\"w\">remain</td><td class=\"m\">여전히 ~한 상태이다, 남다</td></tr><tr><td class=\"w\">the law of the land</td><td class=\"m\">국법, 그 나라의 법</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최근의 시도들에 동의하지 않는다</span><span class=\"en\"><b>disagree with recent attempts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전국적인 시속 55마일 속도 제한을 없애려는</span><span class=\"en\"><b><span class=\"grammar-hl\">to get rid of</span> the national 55-mph speed limit.</b></span></div></div><div class=\"lec-sent-ko\">나는 전국적인 55mph 속도 제한을 없애려는 최근의 시도들에 대해 동의하지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이가 이 글을 쓴 목적을 밝히는 문장입니다. 자신이 앞으로 제시할 논리적 근거들이 왜 속도 제한 유지에 힘을 실어주는지 서술하기 위한 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to get rid of (to부정사): attempts를 뒤에서 수식하는 형용사적 용법으로, 명사의 내용을 구체화하여 &#39;제거하려는 시도&#39;라는 의미를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get rid of</td><td class=\"m\">~을 없애다, ~을 제거하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">두 가지 부인할 수 없는 증거가</span><span class=\"en\"><b>Two <span class=\"grammar-hl\">undeniable</span> pieces of evidence</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나타났다</span><span class=\"en\"><b>have emerged</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 주에 의한 채택 이후로</span><span class=\"en\"><b>since the adoption by all states</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동일한 속도 제한의</span><span class=\"en\"><b>of the uniform speed limit.</b></span></div></div><div class=\"lec-sent-ko\">모든 주에서 동일한 속도 제한을 채택한 이래로 두 가지 부인할 수 없는 증거가 나타났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장의 반대 입장을 뒷받침하기 위해 글의 구조를 예고합니다. 앞으로 제시할 두 가지 핵심 논거가 단순한 주장이 아니라 객관적인 사실임을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">undeniable (현재분사(형용사)): &#39;부인할 수 없는&#39;이라는 의미로 pieces of evidence를 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">undeniable</td><td class=\"m\">부인할 수 없는, 명백한</td></tr><tr><td class=\"w\">emerge</td><td class=\"m\">나타나다, 드러나다</td></tr><tr><td class=\"w\">adoption</td><td class=\"m\">채택, 도입</td></tr><tr><td class=\"w\">uniform</td><td class=\"m\">균일한, 일정한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">첫째,</span><span class=\"en\"><b>First,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교통사고 사망률이</span><span class=\"en\"><b>traffic death rates</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">크게 감소되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">have been greatly reduced</span>.</b></span></div></div><div class=\"lec-sent-ko\">첫째, 교통사고 사망률이 크게 감소되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장에서 예고한 두 가지 근거 중 첫 번째를 제시합니다. 제한 속도가 낮아지면서 실질적으로 인명 피해가 감소했다는 사실을 통해 제도 유지의 정당성을 확보합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have been greatly reduced (수동태): be동사(been)+p.p.(reduced) 구조. reduce는 타동사인데 목적어가 없어서 수동구조 have been reduced 형태로 쓴다. 기본구조: V(reduce) + O(목적어)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be(v) likely to</td><td class=\"m\">~할 가능성이 있다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">분명하다</span><span class=\"en\"><b><span class=\"grammar-hl\">It is obvious</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 낮은 속도에서의 충돌이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> a collision at a lower speed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~을 초래할 가능성이 더 적다는 것은</span><span class=\"en\"><b>is less likely to result in</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사망이나 심각한 부상을</span><span class=\"en\"><b>death or serious injury.</b></span></div></div><div class=\"lec-sent-ko\">더 낮은 속도에서의 충돌이 사망 또는 중상을 덜 초래하리라는 것은 분명하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에서 언급한 사망률 감소의 물리적 인과관계를 설명합니다. 속도와 충격량의 상관관계를 상식적으로 풀이하여 독자가 자연스럽게 결론을 수긍하도록 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is obvious that (가주어): 진주어: It은 가주어, that절은 진주어로 문장의 주어 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">collision</td><td class=\"m\">충돌, 부딪힘</td></tr><tr><td class=\"w\">result in</td><td class=\"m\">~을 야기하다, ~으로 끝나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">둘째,</span><span class=\"en\"><b>Second,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">입증되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">it has been proven</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 적은 연료가 소비된다는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> less fuel <span class=\"grammar-hl\">is consumed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">낮은 속도에서</span><span class=\"en\"><b>at low speeds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">높은 속도에서보다</span><span class=\"en\"><b>than at high speeds.</b></span></div></div><div class=\"lec-sent-ko\">둘째, 낮은 속도에서는 높은 속도에서보다 적은 연료가 소비된다는 것이 입증되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장에서 예고한 두 번째 근거를 제시합니다. 안전뿐만 아니라 경제적·환경적 차원에서도 속도 제한이 효과적임을 덧붙여 주장의 범위를 넓힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It has been proven that (가주어): 진주어: It은 가주어, that절은 진주어로 문장의 주어 역할을 함</div><div class=\"lec-gr-item\">has been proven (수동태): be동사(been)+p.p.(proven) 구조. prove는 타동사인데 목적어가 없어서 수동구조 has been proven 형태로 쓴다. 기본구조: V(prove) + O(목적어)</div><div class=\"lec-gr-item\">is consumed (수동태): be동사(is)+p.p.(consumed) 구조. consume은 타동사인데 목적어가 없어서 수동구조 is consumed 형태로 쓴다. 기본구조: V(consume) + O(목적어)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be(v) likely to</td><td class=\"m\">~할 가능성이 있다</td></tr><tr><td class=\"w\">consume</td><td class=\"m\">소비하다, 먹어치우다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일반적으로 동의된다</span><span class=\"en\"><b><span class=\"grammar-hl\">It is generally agreed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 더 적은 연료를 수입해야 할수록,</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> <span class=\"grammar-hl\">the less fuel we must import,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 좋다는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">the better</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리가 더 적은 연료를 수입해야 할수록 더 좋다는 것은 일반적으로 동의된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 5번 문장의 연료 절감 효과가 왜 사회적으로 중요한지 설명합니다. 연료 수입 감소라는 국가적 이익을 언급하여 개인의 속도 제한 불편함을 대의로 설득하려는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is generally agreed that (가주어): 진주어: It은 가주어, that절은 진주어로 문장의 주어 역할을 함</div><div class=\"lec-gr-item\">is generally agreed (수동태): be동사(is)+p.p.(agreed) 구조. agree는 타동사로 사용될 때(주로 that절을 목적어로 취함) 목적어가 주어로 올라가 수동구조 is agreed 형태로 쓴다. 기본구조: V(agree) + O(that절)</div><div class=\"lec-gr-item\">the less fuel we must import, the better (관용표현): &#39;the + 비교급, the + 비교급&#39; 구문으로 &#39;~하면 할수록 더 ~하다&#39;는 의미를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be(v) likely to</td><td class=\"m\">~할 가능성이 있다</td></tr><tr><td class=\"w\">import</td><td class=\"m\">수입하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 생명을 구하고 연료를 절약하는 조치는</span><span class=\"en\"><b>This <span class=\"grammar-hl\">lifesaving</span> and <span class=\"grammar-hl\">fuel-saving</span> measure</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">남아야 한다</span><span class=\"en\"><b>should remain</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 나라의 법으로</span><span class=\"en\"><b>the law of the land.</b></span></div></div><div class=\"lec-sent-ko\">생명을 구하고 연료를 절약하는 그 법안은 나라의 법으로 남아야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전체 글의 결론입니다. 앞서 제시한 안전과 경제성이라는 두 가지 근거를 종합하여, 시속 55마일 제한 속도 폐지 반대라는 자신의 입장을 다시 한번 강력하게 주장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">lifesaving (현재분사(형용사)): &#39;생명을 구하는&#39;이라는 의미로 measure를 수식함</div><div class=\"lec-gr-item\">fuel-saving (현재분사(형용사)): &#39;연료를 절약하는&#39;이라는 의미로 measure를 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lifesaving</td><td class=\"m\">인명을 구하는, 생명을 구하는</td></tr><tr><td class=\"w\">measure</td><td class=\"m\">조치, 방책</td></tr><tr><td class=\"w\">remain</td><td class=\"m\">여전히 ~한 상태이다, 남다</td></tr><tr><td class=\"w\">the law of the land</td><td class=\"m\">국법, 그 나라의 법</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>시속 55마일 제한 속도를 폐지하려는 움직임에 반대한다.</li><li>제한 속도 도입 이후 교통사고 사망률이 크게 줄어들어 안전이 입증되었다.</li><li>저속 주행 시 연료 소비가 감소하여 국가적 에너지 절약에도 효과적이다.</li><li>따라서 안전과 경제성을 고려할 때 현재의 속도 제한법은 반드시 유지되어야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The 55-mph speed limit should remain in effect because it significantly decreases traffic fatalities, while it simultaneously helps to conserve fuel resources.</div>\n              <div class=\"lec-final-sum-ko\">시속 55마일 속도 제한은 교통사고 사망자를 크게 줄여주며, 동시에 연료 자원을 보존하는 데 도움을 주므로 유지되어야 한다.</div></div></div>"],"segs":[[{"audio":"./구문사고력 기본 Unit03 review reading02_강의_audio/1.mp3","hl":null}],[{"audio":"./구문사고력 기본 Unit03 review reading02_강의_audio/2.mp3","hl":null}],[{"audio":"./구문사고력 기본 Unit03 review reading02_강의_audio/3.mp3","hl":null},{"audio":"./구문사고력 기본 Unit03 review reading02_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./구문사고력 기본 Unit03 review reading02_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./구문사고력 기본 Unit03 review reading02_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./구문사고력 기본 Unit03 review reading02_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./구문사고력 기본 Unit03 review reading02_강의_audio/8.mp3","hl":null}],[{"audio":"./구문사고력 기본 Unit03 review reading02_강의_audio/9.mp3","hl":"main"},{"audio":"./구문사고력 기본 Unit03 review reading0
