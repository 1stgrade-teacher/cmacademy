\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01고립된 환경의 생태적 특성</div><ul><li>오랜 기간 외부와 단절된 뉴질랜드는 고유한 동식물이 서식하는 환경을 갖추게 되었다.</li><li>외부와 고립된 지리적 환경 (cut off from the rest of the world)</li><li>독특한 형태의 식물과 동물 생명체 진화 (unique forms of life)</li><li>핵심 키워드: 뉴질랜드(New Zealand), 고립(isolated)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02뉴질랜드의 상징, 키위</div><ul><li>뉴질랜드의 국조로 잘 알려진 키위는 세계에서 가장 특이한 날지 못하는 새 중 하나이다.</li><li>닭 크기의 몸집과 깃털을 가진 새 (flightless birds)</li><li>머리카락처럼 보이는 긴 깃털 (long feathers)</li><li>보이지 않을 정도로 퇴화한 작은 날개 (small wings)</li><li>핵심 키워드: 키위(kiwi), 국가 상징(national symbol)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03살아있는 화석, 투아타라</div><ul><li>투아타라는 고대 파충류 가문의 유일한 생존자로 매우 독특한 신체적 특징을 지닌다.</li><li>고대 파충류의 유일한 생존자 (living member of an ancient family)</li><li>&#39;살아있는 화석&#39;이라는 별칭 (living fossil)</li><li>머리 꼭대기에 존재하는 세 번째 눈 (third eye)</li><li>핵심 키워드: 투아타라(tuatara), 파충류(reptiles)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cut off</td><td class=\"m\">~을 고립시키다, 차단하다</td></tr><tr><td class=\"w\">evolve</td><td class=\"m\">진화하다, 점진적으로 발달하다</td></tr><tr><td class=\"w\">flightless</td><td class=\"m\">날지 못하는</td></tr><tr><td class=\"w\">resemble</td><td class=\"m\">~을 닮다, 유사하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">odd</td><td class=\"m\">이상한, 특이한</td></tr><tr><td class=\"w\">living fossil</td><td class=\"m\">살아있는 화석</td></tr><tr><td class=\"w\">feature</td><td class=\"m\">특징, 특색</td></tr><tr><td class=\"w\">unsure</td><td class=\"m\">확신이 없는, 불확실한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다른 큰 섬들처럼</span><span class=\"en\"><b>Like other large islands</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오랫동안 세계의 나머지 지역으로부터 단절되어 온</span><span class=\"en\"><b><span class=\"grammar-hl\">that have long been cut off</span> from the rest of the world,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뉴질랜드는</span><span class=\"en\"><b>New Zealand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서식지가 되어 왔다</span><span class=\"en\"><b>has become home</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇몇 독특한 형태의 식물과 동물 생명의</span><span class=\"en\"><b>to some unique forms of plant and animal life.</b></span></div></div><div class=\"lec-sent-ko\">오랫동안 세계의 다른 나라들로부터 단절되어 온 다른 큰 섬들처럼 뉴질랜드는 독특한 동식물의 서식지가 되어 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지리적 고립이라는 환경적 배경이 어떻게 생태계의 특수성을 만들어냈는지 제시하며, 이어질 글의 소재인 뉴질랜드 고유종들에 대한 서론 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that have long been cut off (관계대명사): that이 이끄는 절이 앞의 명사 islands를 수식한다. 절 내부에서 주어 역할을 하며, have been cut off는 수동태(be+p.p.) 구조다. cut은 타동사인데 목적어가 없어 수동구조 have been cut off로 쓰였다. 기본구조: cut A off (A를 분리하다/차단하다)</div><div class=\"lec-gr-item\">have become home to (관용표현): have become home to는 &#39;~의 보금자리가 되다&#39;라는 의미로, 어떤 장소가 특정 생명체의 서식지가 되었음을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cut off</td><td class=\"m\">~을 고립시키다, 차단하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 흥미로운 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Most interesting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특이한 동물들 중 일부이다</span><span class=\"en\"><b><span class=\"grammar-hl\">are some of the unusual animals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이곳에서 진화해 온</span><span class=\"en\"><b><span class=\"grammar-hl\">that have evolved here</span>.</b></span></div></div><div class=\"lec-sent-ko\">이곳에서 진화해 온 특이한 동물들 중에 일부는 매우 흥미롭다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 독특한 생명체들 중에서도 특히 &#39;특이한 동물&#39;로 화제를 좁혀 구체적인 예시를 들기 위한 연결 고리입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Most interesting are some of the unusual animals (도치): 보어인 Most interesting이 문두로 강조되면서 주어(some of the unusual animals)와 동사(are)의 위치가 바뀐 구조다.</div><div class=\"lec-gr-item\">that have evolved here (관계대명사): that이 이끄는 절이 앞의 명사 animals를 수식한다. 절 내부에서 주어 역할을 하며, have evolved는 현재완료 시제다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evolve</td><td class=\"m\">진화하다, 점진적으로 발달하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">뉴질랜드는</span><span class=\"en\"><b>New Zealand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘 알려져 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is well known</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서식지로서</span><span class=\"en\"><b><span class=\"grammar-hl\">as being</span> the home</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계에서 가장 이상한 날지 못하는 새들 중 하나인</span><span class=\"en\"><b>of one of the strangest flightless birds in the world,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">키위의</span><span class=\"en\"><b>the kiwi.</b></span></div></div><div class=\"lec-sent-ko\">뉴질랜드는 세상에서 가장 이상한 날지 못하는 새들 중의 하나인 키위의 서식지로 잘 알려져 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독특한 동물의 첫 번째 사례로 키위를 소개하며, 고립된 환경에서 특이한 진화적 특징을 갖게 된 동물을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is well known as being (수동태): be동사(is)+p.p.(known) 구조다. know는 타동사인데 목적어가 없어 수동구조 is known으로 쓰였다. 기본구조: know A as B (A를 B로 알다). being은 전치사 as 뒤에 쓰인 동명사다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flightless</td><td class=\"m\">날지 못하는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 닭 크기의 새는,</span><span class=\"en\"><b>This chicken-sized bird,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뉴질랜드 사람들이 국가의 상징으로 여기는,</span><span class=\"en\"><b><span class=\"grammar-hl\">which New Zealanders considered the country’s national symbol</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">긴 깃털을 가지고 있다</span><span class=\"en\"><b>has long feathers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">털을 닮은</span><span class=\"en\"><b><span class=\"grammar-hl\">that resemble hair</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 날개를</span><span class=\"en\"><b>and wings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아주 작은</span><span class=\"en\"><b>so small</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보이지 않을 정도로</span><span class=\"en\"><b>that they <span class=\"grammar-hl\">cannot be seen</span>.</b></span></div></div><div class=\"lec-sent-ko\">닭 크기의 이 새는, 뉴질랜드 사람들이 국가의 상징으로 여기는데, 털을 닮은 긴 깃털과 아주 작아서 보이지 않는 날개를 가지고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 키위의 신체적 특징을 묘사하여, 왜 이 새가 &#39;이상한&#39; 새라고 불리는지 그 구체적인 이유를 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">which New Zealanders considered the country’s national symbol (관계대명사): which이 이끄는 절이 앞의 명사 bird를 수식한다. 절 내부에서 consider의 목적어 역할을 하며, consider는 5형식(SVOC) 구조로 &#39;A를 B라고 여기다&#39;를 의미한다.</div><div class=\"lec-gr-item\">that resemble hair (관계대명사): that이 이끄는 절이 앞의 명사 feathers를 수식한다. 절 내부에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">cannot be seen (수동태): be동사(be)+p.p.(seen) 구조다. see는 타동사인데 목적어가 없어 수동구조 be seen으로 쓰였다. 기본구조: see A (A를 보다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">resemble</td><td class=\"m\">~을 닮다, 유사하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">뉴질랜드는</span><span class=\"en\"><b>New Zealand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 서식지이다</span><span class=\"en\"><b>is also the home</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이상한 동물의</span><span class=\"en\"><b>of an odd animal</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">투아타라라고 알려진,</span><span class=\"en\"><b><span class=\"grammar-hl\">known as the tuatara</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 유일한 살아 있는 구성원이다</span><span class=\"en\"><b><span class=\"grammar-hl\">which is the only living member</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고대 파충류과의</span><span class=\"en\"><b>of an ancient family of reptiles.</b></span></div></div><div class=\"lec-sent-ko\">뉴질랜드는 또한 tuatara라고 알려진 이상한 동물의 서식지인데, tuatara는 고대 파충류과의 살아 있는 유일한 동물이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 키위에 이어 두 번째 사례인 투아타라를 소개하며, 과거와 현재를 잇는 생물학적 희귀성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">known as the tuatara (과거분사): known이 앞의 명사 animal을 수식한다. &#39;알려진 동물&#39;이라는 의미이며, N + p.p. 형태의 축약 관계절로 볼 수 있다.</div><div class=\"lec-gr-item\">which is the only living member (관계대명사): which이 이끄는 절이 앞의 명사 animal을 수식한다. 절 내부에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">living member (현재분사): living이 member를 수식한다. &#39;살아있는 구성원&#39;이라는 의미로 동작/상태를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">odd</td><td class=\"m\">이상한, 특이한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 이유로,</span><span class=\"en\"><b>For this reason,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">때때로 불린다</span><span class=\"en\"><b><span class=\"grammar-hl\">is sometimes called</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“살아 있는 화석”이라고</span><span class=\"en\"><b>a “living fossil.”</b></span></div></div><div class=\"lec-sent-ko\">이러한 이유로, tuatara는 때로는 “살아 있는 화석”이라고 불린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 투아타라가 왜 고대 파충류의 유일한 후예로 평가받는지 그 별명을 통해 직관적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is sometimes called (수동태): be동사(is)+p.p.(called) 구조다. call은 타동사인데 목적어가 없어 수동구조 is called로 쓰였다. 기본구조: call A B (A를 B라고 부르다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">living fossil</td><td class=\"m\">살아있는 화석</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">투아타라의 가장 특이한 특징은</span><span class=\"en\"><b>The tuatara’s most unusual feature</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제3의 눈이다</span><span class=\"en\"><b>is a third eye</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">머리 꼭대기에 위치한</span><span class=\"en\"><b><span class=\"grammar-hl\">located on the top of its head</span>!</b></span></div></div><div class=\"lec-sent-ko\">tuatara의 가장 특이한 특징은 머리 위에 위치한 제 3의 눈이다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 투아타라의 독특함을 심화하여 시각적으로 가장 두드러지는 특징을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">located on the top of its head (과거분사): located가 앞의 명사 eye를 수식한다. &#39;위치해 있는 눈&#39;이라는 의미로, N + p.p. 형태의 축약 관계절이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">feature</td><td class=\"m\">특징, 특색</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 그것이 정상적인 눈을 닮았지만,</span><span class=\"en\"><b>Although it resembles a normal eye,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학자들은</span><span class=\"en\"><b>scientists</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확신하지 못한다</span><span class=\"en\"><b>are unsure of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정확히 어떤 역할을</span><span class=\"en\"><b>exactly <span class=\"grammar-hl\">what role</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 하는지</span><span class=\"en\"><b><span class=\"grammar-hl\">it plays</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 제 3의 눈은 정상적인 눈을 닮았지만, 과학자들은 그것이 어떤 역할을 하는지 잘 알지 못한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 투아타라의 세 번째 눈에 대한 정보와 함께, 아직 밝혀지지 않은 미스터리한 측면을 제시하여 호기심을 남기며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what role it plays (간접의문문): 의문사(what) + 주어(it) + 동사(plays)의 어순으로 명사절 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">resemble</td><td class=\"m\">~을 닮다, 유사하다</td></tr><tr><td class=\"w\">unsure</td><td class=\"m\">확신이 없는, 불확실한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>뉴질랜드는 지리적으로 고립되어 있어 독특한 생물들이 진화했다.</li><li>날지 못하는 새인 키위는 머리카락 같은 깃털과 작은 날개를 가진 독특한 사례이다.</li><li>투아타라는 고대 파충류의 유일한 생존자로 &#39;살아있는 화석&#39;이라 불린다.</li><li>특히 투아타라의 머리 위에 있는 세 번째 눈은 과학적으로 아직 정확한 기능이 밝혀지지 않았다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">New Zealand possesses unique flora and fauna due to its long-term isolation, and it is particularly famous for peculiar creatures like the flightless kiwi and the ancient tuatara.</div>\n              <div class=\"lec-final-sum-ko\">뉴질랜드는 장기간의 고립으로 인해 독특한 동식물이 서식하며, 특히 날지 못하는 키위와 고대 파충류인 투아타라와 같은 기이한 생물들로 유명하다.</div></div></div>"],"segs":[[{"audio":"./구문사고력 기본 Unit03 review reading04_강의_audio/1.mp3","hl":null}],[{"audio":"./구문사고력 기본 Unit03 review reading04_강의_audio/2.mp3","hl":null}],[{"audio":"./구문사고력 기본 Unit03 review reading04_강의_audio/3.mp3","hl":null},{"audio":"./구문사고력 기본 Unit03 review reading04_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./구문사고력 기본 Unit03 review reading04_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./구문사고력 기본 Unit03 review reading04_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./구문사고력 기본 Unit03 review reading04_강의_audio/7.mp3","hl":null}],[{"audio":"./구문사고력 기본 Unit03 review reading04_강의_audio/8.mp3","hl":"main"},{"audio":"./구문사고력 기본 Unit03 review reading04_강의_audio/9.mp3","hl":"meaning"},{"audio":"./구문사고력 기본 Unit03 review reading04_강의_audio/10.mp3","hl":"gramm
