t), 화학 물질(Chemicals)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04향후 기대 효과</div><ul><li>과학적 연구를 통해 해양 자원을 새로운 유형의 의약품으로 전환하려는 노력이 진행 중이다.</li><li>화학 물질의 기능(function)에 대한 심층 연구</li><li>해양 자원을 신약(medicine)으로 변환하려는 목표</li><li>핵심 키워드: 의학적 발전(Medical progress), 변환(Convert)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make</td><td class=\"m\">만들다, 이루다</td></tr><tr><td class=\"w\">discovery</td><td class=\"m\">발견, 발견물</td></tr><tr><td class=\"w\">look for</td><td class=\"m\">~을 찾다, ~을 구하다</td></tr><tr><td class=\"w\">virtually</td><td class=\"m\">사실상, 거의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">turn to</td><td class=\"m\">~에게 도움을 청하다, ~로 눈을 돌리다</td></tr><tr><td class=\"w\">treasure chest</td><td class=\"m\">보물 상자, 보고</td></tr><tr><td class=\"w\">marine</td><td class=\"m\">바다의, 해양의</td></tr><tr><td class=\"w\">convert</td><td class=\"m\">전환하다, 개조하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1928년에,</span><span class=\"en\"><b>In 1928,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Alexander Fleming은 중요한 발견을 했다</span><span class=\"en\"><b>Alexander Fleming made the important <span class=\"grammar-hl\">discovery</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">페니실린이 박테리아를 죽인다는</span><span class=\"en\"><b><span class=\"grammar-hl\">that penicillin kills bacteria</span>.</b></span></div></div><div class=\"lec-sent-ko\">1928년, Alexander Fleming은 페니실린이 박테리아를 죽인다는 중요한 발견을 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 의학 역사에서 혁신적인 사건을 언급하며, 인류가 어떻게 질병을 치료하는 약을 찾기 시작했는지에 대한 논의의 출발점을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">discovery that penicillin kills bacteria 동격의 that: 명사(discovery) + that + S + V 구조. 뒤의 that절이 앞 명사인 &#39;발견&#39;의 구체적인 내용(페니실린이 박테리아를 죽인다는 것)을 보충 설명하고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">discovery</td><td class=\"m\">발견, 발견물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 이후로,</span><span class=\"en\"><b>Since that time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전 세계 의학 연구자들은</span><span class=\"en\"><b>medical researchers around the globe</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찾아왔다</span><span class=\"en\"><b><span class=\"grammar-hl\">have been looking for</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 종류의 의약품을</span><span class=\"en\"><b>new kinds of drugs.</b></span></div></div><div class=\"lec-sent-ko\">그 이후로 전 세계 의학 연구자들은 새로운 종류의 의약품을 찾아왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 발견을 계기로 전 세계적으로 약물 탐색이 활발해졌음을 보여주며, 연구의 범위가 지속적으로 확장되고 있음을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have been looking for (현재완료진행): have/has + been + 현재분사(-ing) 구조. 과거부터 현재까지 지속적으로 약을 찾는 동작이 진행되고 있음을 나타낸다.</div><div class=\"lec-gr-item\">looking for (관용표현): look for (~을 찾다)라는 구동사로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 뒤져왔다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">have searched</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사실상 모든 곳을</span><span class=\"en\"><b>virtually everywhere</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">육지에서</span><span class=\"en\"><b>on dry land.</b></span></div></div><div class=\"lec-sent-ko\">그들은 사실상 육지의 모든 곳을 다 뒤져왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 육지라는 한정된 공간에서 연구가 포화 상태에 이르렀음을 알려주며, 연구자들이 새로운 탐색지인 바다로 관심을 돌리게 된 배경을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have searched (현재완료): have + p.p. 구조. 과거에 시작된 탐색 행위가 현재까지 완료되었거나 영향을 미치고 있음을 의미한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">virtually</td><td class=\"m\">사실상, 거의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제</span><span class=\"en\"><b>Now</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약을 찾는 사람들은</span><span class=\"en\"><b>the drug hunters</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관심을 돌렸다</span><span class=\"en\"><b><span class=\"grammar-hl\">have turned to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구의 대양으로</span><span class=\"en\"><b>the planet’s oceans.</b></span></div></div><div class=\"lec-sent-ko\">이제 약을 찾는 사람들은 지구의 대양으로 관심을 돌렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 연구의 장소가 육지에서 바다로 전환되었음을 선언하며, 새로운 발견을 위한 돌파구를 찾고 있는 현재의 움직임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have turned to (현재완료): have + p.p. 구조. 약 사냥꾼들이 이제 바다 쪽으로 관심을 돌린 상태임을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실,</span><span class=\"en\"><b>In fact,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">there are some</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">믿는</span><span class=\"en\"><b><span class=\"grammar-hl\">who believe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바다가 보물 상자라고</span><span class=\"en\"><b>that the ocean is a treasure chest</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약으로 가득 찬</span><span class=\"en\"><b>full of medicine</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발견되기를 기다리는</span><span class=\"en\"><b>just <span class=\"grammar-hl\">waiting to be discovered</span>.</b></span></div></div><div class=\"lec-sent-ko\">사실, 바다야말로 발견되기를 기다리는 약들로 가득 차 있는 보물 상자라고 믿는 이들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 바다 연구가 단순한 시도가 아니라 상당한 잠재력을 지닌 보물 창고임을 강조하며, 다음 단계에서 나올 구체적 사례를 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there are some who believe (관계대명사): some(선행사) 뒤에 who(주격 관계대명사)가 이끄는 절이 결합하여 &#39;믿는 사람들&#39;이라는 의미로 선행사를 수식한다.</div><div class=\"lec-gr-item\">waiting to be discovered (현재분사): waiting이 앞의 a treasure chest를 수식하는 형용사적 기능의 현재분사구이다. &#39;발견되기를 기다리는 보물 상자&#39;라는 의미이다.</div><div class=\"lec-gr-item\">to be discovered (수동태): to부정사의 수동형(to be + p.p.)이다. discover(발견하다)는 타동사인데 목적어가 없어서 수동구조를 취하며, 앞의 waiting의 목적어인 보물 상자가 발견되는 대상임을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">treasure chest</td><td class=\"m\">보물 상자, 보고</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">해양 화학자 William Fenical은 설명한다</span><span class=\"en\"><b>Marine chemist William Fenical explains</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 화학물질이</span><span class=\"en\"><b>that special chemicals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개발되어왔다고</span><span class=\"en\"><b><span class=\"grammar-hl\">have been developed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해양 생물로부터</span><span class=\"en\"><b>from marine creatures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바다 표면 아래 깊은 곳에 사는</span><span class=\"en\"><b><span class=\"grammar-hl\">that live deep below</span> the surface of the ocean.</b></span></div></div><div class=\"lec-sent-ko\">해양 화학자 William Fenical은 특별한 화학물질이 바다 표면 아래 깊은 곳에 사는 해양 생물로부터 개발되어왔다고 설명한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;보물 상자&#39;라는 비유를 뒷받침하는 구체적인 실례를 제시하여, 심해 생물 연구가 이미 성과를 내고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have been developed (수동태): be동사(have been) + p.p.(developed) 구조. 기본구조: develop + O(목적어). develop은 타동사인데 목적어가 없어서 수동구조인 have been developed 형태로 쓴다.</div><div class=\"lec-gr-item\">that live deep below (관계대명사): that이 주격 관계대명사로 쓰여 선행사 marine creatures를 수식하며, 절 내부에 주어 없이 동사(live)가 바로 이어지는 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">marine</td><td class=\"m\">바다의, 해양의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">과학자들이 더 많이 배움에 따라</span><span class=\"en\"><b>As scientists learn more</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 화학물질들이 어떻게 작용하는지에 대해,</span><span class=\"en\"><b>about <span class=\"grammar-hl\">how these chemicals function</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">희망된다</span><span class=\"en\"><b><span class=\"grammar-hl\">it is hoped</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 그것들을 전환할 수 있기를</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> they can convert them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 종류의 의약품으로</span><span class=\"en\"><b>into new kinds of medicine.</b></span></div></div><div class=\"lec-sent-ko\">어떻게 이 화학물질들이 작용하는가에 대해 과학자들이 더 많이 배우고 있기에, 그들이 그화학물질들을 신종 의약품으로 전환시켜 낼 수 있을 것으로 전망된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현재의 연구 과정이 미래에 실질적인 치료제로 이어질 것이라는 기대를 나타내며, 이 글의 논리적 결론을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how these chemicals function (간접의문문): &#39;의문사(how) + S + V&#39;의 구조로, 문장 내에서 동사 learn의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">it is hoped that (가주어): 진주어: it이 가주어, 뒤의 that절이 진주어이다. 문장의 주어를 that절 전체로 보면 너무 길어지기 때문에 가주어 it을 사용했다.</div><div class=\"lec-gr-item\">is hoped (수동태): be동사(is) + p.p.(hoped) 구조. 기본구조: hope + that절(목적어). hope가 타동사로 목적어를 취할 때 목적어 절이 주어로 나가면서 수동태가 된 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">convert</td><td class=\"m\">전환하다, 개조하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>플레밍의 페니실린 발견 이후 의학계는 새로운 약을 찾기 위해 육지를 샅샅이 뒤졌다.</li><li>육지에서 한계를 느낀 연구자들은 이제 미지의 영역인 바다로 시선을 돌리고 있다.</li><li>바다는 수많은 약의 원료를 품은 보물 상자로 여겨진다.</li><li>심해 생물에서 추출한 화학 물질에 대한 연구가 활발하며, 이는 향후 새로운 치료제 개발로 이어질 것으로 기대된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Researchers have shifted their focus to the ocean, as they hope to develop new medicines from unique chemicals found in marine creatures.</div>\n              <div class=\"lec-final-sum-ko\">연구자들은 해양 생물에서 발견된 독특한 화학 물질로 신약을 개발하고자, 그들의 연구 초점을 바다로 옮기고 있다.</div></div></div>"],"segs":[[{"audio":"./apply02_audio/1.mp3","hl":null}],[{"audio":"./apply02_audio/2.mp3","hl":null}],[{"audio":"./apply02_audio/3.mp3","hl":null},{"audio":"./apply02_audio/4.mp3","hl":"stage-0"},{"audio":"./apply02_audio/5.mp3","hl":"stage-1"},{"audio":"./apply02_audio/6.mp3","hl":"stage-2"},{"audio":"./apply02_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply02_audio/8.mp3","hl":null}],[{"audio":"./apply02_audio/9.mp3","hl":"main"},{"audio":"./apply02_audio/10.mp3","hl":"meaning"},{"audio":"./apply02_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/12.mp3","hl":"main"},{"audio":"./apply02_audio/13.mp3","hl":"meaning"},{"audio":"./apply02_audio/14.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/15.mp3","hl":"main"},{"audio":"./apply02_audio/16.mp3","hl":"meaning"},{"audio":"./apply02_audio/17.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/18.mp3","hl":"main"},{"audio":"./apply02_audio/19.mp3","hl":"meaning"},{"audio":"./apply02_audio/20.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/21.mp3","hl":"main"},{"audio":"./apply02_audio/22.mp3","hl":"meaning"},{"audio":"./apply02_audio/23.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/24.mp3","hl":"main"},{"audio":"./apply02_audio/25.mp3","hl":"meaning"},{"audio":"./apply02_audio/26.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/27.mp3","hl":"main"},{"audio":"./apply02_audio/28.mp3","hl":"meaning"},{"audio":"./apply02_audio/29.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/30.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;whil
