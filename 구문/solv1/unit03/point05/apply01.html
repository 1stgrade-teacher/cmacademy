 문화적 맥락을 바탕으로 합니다. 영국은 수백 년의 역사를 간직한 유서 깊은 건물이 많아, 이와 관련해 초자연적인 현상(Supernatural phenomena)이나 유령이 나온다는 전설을 관광 상품으로 활용하는 경우가 매우 많죠. 여기서 &#39;유령&#39;은 단순히 무서운 존재라기보다는 역사의 흔적이 깃든 흥미로운 소재로 여겨지는데, 마치 우리나라에서 오래된 고택에 귀신 이야기가 따라붙는 것과 비슷한 이치라고 보시면 됩니다. 본문에서는 이러한 문화적 배경을 활용하여, 유령이 300년 동안 그 성을 지켜왔다는 반전(Twist)을 통해 독자에게 유머를 전달하고 있습니다. 즉, 유령을 목격하지 못했다는 가이드의 말이 사실은 그 자신이 유령이었음을 암시하는 아이러니(Irony)가 이 글의 핵심 포인트랍니다!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 설정</div><ul><li>영국의 오래된 성을 관람하고 나온 미국인 관광객이 가이드와 대화를 나눕니다.</li><li>관광객의 소감: 훌륭했지만 유령(ghost)이 나올까 봐 두려웠음</li><li>가이드의 안심: 수년간 근무했지만 유령을 본 적이 없다고 강조함</li><li>핵심 키워드: 성(castle), 유령(ghost)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02의문 제기</div><ul><li>관광객은 가이드의 경력에 대해 궁금증을 느껴 질문을 던집니다.</li><li>가이드의 근속 연수(length of time)를 묻는 관광객</li><li>가이드의 답변을 기다리는 기대감 형성</li><li>핵심 키워드: 경력(experience), 질문(question)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03반전 결말</div><ul><li>가이드의 대답을 통해 상황이 유머러스하게 반전됩니다.</li><li>300년 동안 일했다는 가이드의 답변</li><li>가이드 역시 유령(ghost)이었음을 암시하는 황당한 결말</li><li>핵심 키워드: 300년(300 years), 반전(twist)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">run into</td><td class=\"m\">~와 마주치다, 우연히 만나다</td></tr><tr><td class=\"w\">worry about</td><td class=\"m\">~에 대해 걱정하다</td></tr><tr><td class=\"w\">sightseeing</td><td class=\"m\">관광</td></tr><tr><td class=\"w\">terrific</td><td class=\"m\">아주 좋은, 훌륭한</td></tr><tr><td class=\"w\">passageway</td><td class=\"m\">통로, 복도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 젊은 미국인 관광객이</span><span class=\"en\"><b>A young American tourist</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영국에서 관광을 하고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is sightseeing</span> in England</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 막 마쳤다</span><span class=\"en\"><b>and has just finished a tour</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유명한 고성 관광을</span><span class=\"en\"><b>of a famous old castle.</b></span></div></div><div class=\"lec-sent-ko\">젊은 미국 관광객이 영국에서 관광을 하다가 유명한 고성 관광을 막 마쳤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 앞으로 전개될 대화의 배경이 되는 장소와 등장인물을 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is sightseeing (현재진행): be동사(is)+현재분사(sightseeing) 결합으로, 현재 진행 중인 동작을 나타내는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sightseeing</td><td class=\"m\">관광</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“어떠셨어요?”</span><span class=\"en\"><b>“<span class=\"grammar-hl\">How did you enjoy it?</span>”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 가이드가 그녀에게 묻는다.</span><span class=\"en\"><b>her guide asks her.</b></span></div></div><div class=\"lec-sent-ko\">“어떠셨어요?”하고 가이드가 묻는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 관람을 마쳤기에, 가이드가 관람객에게 만족도를 묻는 자연스러운 대화 흐름을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How did you enjoy it? (간접의문문): 의문사(How)가 포함된 의문문 구조로, 상대방의 경험이나 감상을 묻는 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“아주 좋았어요,”</span><span class=\"en\"><b>“It was terrific,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 소녀가 대답한다,</span><span class=\"en\"><b>the girl replies,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“하지만 두려웠어요</span><span class=\"en\"><b>“but <span class=\"grammar-hl\">I was afraid</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제가 유령이라도 만날까 봐</span><span class=\"en\"><b><span class=\"grammar-hl\">I might run into</span> a ghost</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저 어두운 통로 중 한 곳에서.”</span><span class=\"en\"><b>in one of <span class=\"grammar-hl\">those dark passageways</span>.”</b></span></div></div><div class=\"lec-sent-ko\">(“아주 좋았어요,” 여자가 대답한다, “근데 어두운 복도에서 유령이라도 만날까봐 무서웠어요.”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 관광객이 성에 대한 긍정적인 평가를 하면서도, 성 내부의 어두운 분위기 때문에 느꼈던 막연한 불안감을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I was afraid (관용표현): 형용사 afraid가 that절과 결합하여 &#39;...할까 봐 걱정되다/두렵다&#39;는 감정의 상태를 나타냅니다.</div><div class=\"lec-gr-item\">I might run into (관용표현): run into는 &#39;우연히 마주치다&#39;라는 의미를 가진 구동사입니다.</div><div class=\"lec-gr-item\">those dark passageways (현재분사): dark가 형용사로 passageways를 수식하며, 그 안에서 어떤 일이 일어날지에 대한 배경을 묘사합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">run into</td><td class=\"m\">~와 마주치다, 우연히 만나다</td></tr><tr><td class=\"w\">terrific</td><td class=\"m\">아주 좋은, 훌륭한</td></tr><tr><td class=\"w\">passageway</td><td class=\"m\">통로, 복도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“걱정할 것은 아무것도 없어요,”</span><span class=\"en\"><b><span class=\"grammar-hl\">“There’s nothing to worry about,”</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가이드가 말한다.</span><span class=\"en\"><b><span class=\"grammar-hl\">says</span> the guide.</b></span></div></div><div class=\"lec-sent-ko\">“걱정할 것 없어요,” 가이드가 말한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> There’s nothing to worry about은 관광객의 두려움을 안심시키려는 의도입니다. 가이드가 유령을 본 적이 없다는 근거를 들어 안심시키지만, 뒤에 이어질 반전을 예고하는 복선이 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">“There’s nothing to worry about,” says 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">worry about</td><td class=\"m\">~에 대해 걱정하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“저는 유령을 본 적이 결코 없어요</span><span class=\"en\"><b>“I have never seen a ghost</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 시간 동안</span><span class=\"en\"><b>in all the time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제가 여기 있어 온.”</span><span class=\"en\"><b><span class=\"grammar-hl\">I have been here</span>.”</b></span></div></div><div class=\"lec-sent-ko\">“전 여기 있으면서 유령을 한 번도 못 봤어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가이드의 경험담에 의구심을 가진 관광객이 그가 얼마나 오랫동안 그곳에 있었는지 확인하며 대화의 핵심을 파고듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I have been here (현재완료): &#39;have+p.p.&#39; 형태(have been)로, 과거부터 현재까지 머물고 있는 상태를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“그게 얼마나 긴 시간인가요?”</span><span class=\"en\"><b>“<span class=\"grammar-hl\">How long is that?</span>”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀가 묻는다.</span><span class=\"en\"><b>she asks.</b></span></div></div><div class=\"lec-sent-ko\">“얼마나 계셨는데요?” 그녀가 묻는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 대화에서 가이드는 산 사람인 것처럼 행동했으나, 이 마지막 답변을 통해 사실 가이드 자신이 유령(혹은 아주 오랫동안 그곳에 머문 존재)이었음을 보여주며 이야기를 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How long is that? (간접의문문): 의문사구(How long)로 시작하는 의문문 구조로, 앞 문장의 기간을 묻는 질문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“오,</span><span class=\"en\"><b>“Oh,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">300년 정도요.”</span><span class=\"en\"><b><span class=\"grammar-hl\">about 300 years</span>.”</b></span></div></div><div class=\"lec-sent-ko\">“300년 정도요.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">about 300 years (관용표현): about이 수치 앞에 쓰여 &#39;대략, 약&#39;이라는 의미의 부사적 표현으로 쓰였습니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>한 미국인 관광객이 영국 성을 관람한 후 가이드와 대화를 나눈다.</li><li>관광객은 성 내부의 유령을 무서워했다며 자신의 소감을 말한다.</li><li>가이드는 자신이 유령을 본 적이 없다며 관광객을 안심시킨다.</li><li>가이드가 300년 동안 성에 머물렀다고 대답하며 스스로 유령임을 밝히는 반전이 일어난다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">While a tourist expresses fear about encountering ghosts in a castle, the guide reveals his true nature by mentioning he has worked there for 300 years.</div>\n              <div class=\"lec-final-sum-ko\">관광객이 성에서 유령을 마주칠까 봐 두려움을 표하지만, 가이드는 자신이 그곳에서 300년 동안 일해왔다고 언급하며 자신의 정체를 드러낸다.</div></div></div>"],"segs":[[{"audio":"./apply01_audio/1.mp3","hl":null}],[{"audio":"./apply01_audio/2.mp3","hl":null}],[{"audio":"./apply01_audio/3.mp3","hl":null},{"audio":"./apply01_audio/4.mp3","hl":"stage-0"},{"audio":"./apply01_audio/5.mp3","hl":"stage-1"},{"audio":"./apply01_audio/6.mp3","hl":"stage-2"}],[{"audio":"./apply01_audio/7.mp3","hl":null}],[{"audio":"./apply01_audio/8.mp3","hl":"main"},{"audio":"./apply01_audio/9.mp3","hl":"meaning"},{"audio":"./apply01_audio/10.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/11.mp3","hl":"main"},{"audio":"./apply01_audio/12.mp3","hl":"meaning"},{"audio":"./apply01_audio/13.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/14.mp3","hl":"main"},{"audio":"./apply01_audio/15.mp3","hl":"meaning"},{"audio":"./apply01_audio/16.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/17.mp3","hl":"main"},{"audio":"./apply01_audio/18.mp3","hl":"meaning"},{"audio":"./apply01_audio/19.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/20.mp3","hl":"main"},{"audio":"./apply01_audio/21.mp3","hl":"meaning"},{"audio":"./apply01_audio/22.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/23.mp3","hl":"main"},{"audio":"./apply01_audio/24.mp3","hl":"meaning"},{"audio":"./apply01_audio/25.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/26.mp3","hl":"main"},{"audio":"./apply01_audio/27.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/28.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getCo
