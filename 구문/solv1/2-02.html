<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 2강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}
.lp-chips span{border-radius:3px;background:#fff}
.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

.lp-ko{border-radius:0;border-left:4px solid var(--pk);background:none;padding:4px 0 4px 12px}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 2강 적용독해02","audioDir":"2-02_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">2강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Why We Tell White Lies\u003c/h1>\u003ch2>우리는 왜 선의의 거짓말을 하는가\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사람들은 거짓말을 싫어한다고 말하지만, 우리는 매일 서로에게 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">거짓말\u003c/b>을 하며 그것은 흔하고 밝혀져도 화나지 않는다. 어머니의 헤어스타일에 대한 칭찬처럼, \u003cb class=\"key\">white \u003c/b>\u003cb class=\"key\">lies\u003c/b>는 사랑하고 상처 주고 싶지 않기 때문에 하는 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">목적\u003c/b>의 거짓말이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>We all tell white lies, and although they are lies, we tell them for a good reason out of love.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘도 함께 독해 공부해 볼까요. 오늘 다룰 지문은 선의의 거짓말, 즉 white lie에 관한 글이에요. 사람들은 거짓말을 싫어한다고 말하지만, 우리는 매일 작은 거짓말을 하고 그것은 흔하며 밝혀져도 화나지 않는다는 내용이죠. 그리고 어머니의 헤어스타일을 칭찬하는 예시를 통해, white lie는 사랑과 배려에서 나오는 좋은 목적의 거짓말이라는 점을 전달하고 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 흔히 말하는 \u003cb class=\"key\">white \u003c/b>\u003cb class=\"key\">lie\u003c/b>는 상대를 배려하기 위해 하는 작은 거짓말이에요. 영어에서 white는 깨끗함이나 순수함을 뜻하기 때문에, white lie는 악의 없는 거짓말이라는 느낌을 담고 있죠. 반대로 상대를 속여 이득을 챙기는 거짓말은 black lie라고 부르기도 해요. 사회생활에서는 이런 배려 섞인 표현을 politeness, 즉 예의라고 하며, 때로는 human relationship을 부드럽게 만드는 social lubricant 역할을 하기도 합니다. 예를 들어 친구가 정성껏 만든 요리가 조금 짜더라도 맛있다고 말해 주는 것은 사실을 숨기는 게 아니라 친구의 마음을 지켜 주는 선택이에요. 이처럼 white lie는 진실과 배려 사이에서 우리가 자연스럽게 건네는 말이라고 할 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 우리가 흔히 말하는 white lie는 상대를 배려하기 위해 하는 작은 거짓말을 뜻해요. 영어에서 white는 깨끗함이나 순수함을 의미하기 때문에, white lie에는 악의가 없다는 느낌이 담겨 있죠. 반대로 상대를 속여 이득을 챙기는 거짓말은 black lie라고 부르기도 합니다. 사회생활에서는 이런 배려 섞인 표현을 politeness, 즉 예의라고 하고, human relationship을 부드럽게 만드는 social lubricant 역할을 하기도 해요. 예를 들어 친구가 정성껏 만든 요리가 조금 짜더라도 맛있다고 말해 주는 것은 사실을 숨기는 게 아니라 친구의 마음을 지켜 주는 선택이거든요. 이처럼 white lie는 진실과 배려 사이에서 자연스럽게 건네는 말이라고 이해하시면 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>거짓말에 대한 통념\u003csmall>도입·통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>먼저 사람들에게 누군가 \u003cb class=\"key\">거짓말\u003c/b>을 하면 기분이 어떤지 물어보는 \u003cb class=\"key\">통념\u003c/b>으로 시작한다. 대부분은 그건 정말 싫다고 대답할 것이다. 그러나 글쓴이는 however로 방향을 틀며 거짓말에도 여러 \u003cb class=\"key\">종류\u003c/b>가 있다고 말한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>작은 거짓말의 일상성\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>사실 우리 모두는 매일 서로에게 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">거짓말\u003c/b>을 한다. 이건 매우 흔한 일일뿐 아니라, 밝혀진 후에도 우리를 정말 \u003cb class=\"key\">화나게\u003c/b> 하지는 않는다. 즉 작은 거짓말은 일상적이고 해가 되지 않는다는 \u003cb class=\"key\">주장\u003c/b>이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>어머니 헤어스타일 예시\u003csmall>예시 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>어머니가 \u003cb class=\"key\">헤어스타일\u003c/b>을 바꾸고 어떠냐고 물어보는 상황을 예로 든다. 스타일이 별로라고 생각해도 아마 아주 좋아 보인다고 말해 줄 것이다. 이것은 거짓말이지만 엄마를 \u003cb class=\"key\">사랑\u003c/b>하고 기분 나쁘게 하고 싶지 않기 때문이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>선의의 거짓말\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>마지막으로 이런 것을 \u003cb class=\"key\">white \u003c/b>\u003cb class=\"key\">lies\u003c/b>라고 부른다. 그것들은 거짓말일지 모르지만 우리는 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">목적\u003c/b>으로 그런 거짓말을 한다. 결국 글은 선의의 거짓말의 정당성을 \u003cb class=\"key\">결론\u003c/b>으로 제시한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 네 단계로 나누어 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 글은 사람들에게 누군가 거짓말을 하면 기분이 어떤지 물어보는 장면으로 시작해요. 그러면 대부분은 그건 정말 싫다고 대답하겠죠. 하지만 글쓴이는 however라는 말로 방향을 틀면서, 거짓말에도 여러 가지 종류가 있다고 말합니다. 사람들이 싫어하는 건 나쁜 거짓말이지, 모든 거짓말이 아니라는 뜻이에요.","hl":"f0"},{"n":5,"text":"이어서 사실 우리 모두는 매일 서로에게 작은 거짓말을 한다고 단언해요. 이건 매우 흔한 일일뿐더러, 나중에 밝혀져도 우리를 정말 화나게 하지는 않죠. 여기서 small lies와 does not upset이라는 표현이 핵심이에요. 즉 작은 거짓말은 일상적이고 해가 되지 않는다는 걸 강조하는 겁니다.","hl":"f1"},{"n":6,"text":"그다음 어머니가 헤어스타일을 바꾸고 어떠냐고 물어보는 상황을 예로 들어요. 비록 그 스타일이 정말 별로라고 생각할지라도, 아마 아주 좋아 보인다고 말해 줄 거예요. 이게 바로 거짓말이지만, 그 이유는 어머니를 사랑하고 기분 나쁘게 하고 싶지 않기 때문이죠. 그래서 글쓴이는 이것을 white lies라고 부릅니다.","hl":"f2"},{"n":7,"text":"마지막으로 글은 이렇게 정리해요. 그것들은 거짓말일지 모르지만 우리는 선한 목적으로 그런 거짓말을 한다는 거예요. 결국 white lie는 사실을 숨기는 나쁜 행동이 아니라, 사랑과 배려에서 나오는 좋은 목적의 거짓말이라는 주장으로 글을 맺고 있죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 사람들이 거짓말을 싫어한다는 \u003cb class=\"key\">통념\u003c/b>에서 출발해, 그러나 거짓말에는 여러 종류가 있다고 \u003cb class=\"key\">반박\u003c/b>하는 구조다. 핵심 주장은 마지막 문장인 we tell them for a good reason에 담겨 있어 결론에서 중심 내용을 밝히는 \u003cb class=\"key\">미괄식\u003c/b> 구성이다. 앞에서 통념을 세우고 예시로 근거를 보여 준 뒤 마지막에 \u003cb class=\"key\">주제문\u003c/b>을 확정하는 방식이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (2)\u003c/b>\u003cspan>통념 전환\u003c/span>\u003cb>In fact (3)\u003c/b>\u003cspan>사실 강조·주장 제시\u003c/span>\u003cb>For example (5)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>Although (6)\u003c/b>\u003cspan>양보 후 진짜 이유 부각\u003c/span>\u003cb>but (8)\u003c/b>\u003cspan>대조를 통한 결론 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">lies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">small lies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a lie\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">white lies\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>사람들이 싫어하는 거짓말\u003c/th>\u003cth>white lie(선의의 거짓말)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>듣는 사람을 화나게 함\u003c/td>\u003ctd>듣는 사람을 기분 좋게 함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>속이려는 나쁜 의도\u003c/td>\u003ctd>사랑과 배려의 목적\u003c/td>\u003c/tr>\u003ctr>\u003ctd>밝혀지면 문제가 됨\u003c/td>\u003ctd>밝혀져도 화나지 않음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 사람들이 거짓말을 싫어한다는 통념에서 출발해, 그러나 거짓말에는 여러 종류가 있다고 반박하는 통념-반박 구조예요. 주제문은 마지막 문장인 we tell them for a good reason에 담겨 있어서, 결론에서 핵심을 밝히는 미괄식 구성이라고 볼 수 있죠. 앞부분에서 통념을 세우고 예시로 근거를 보여 준 뒤 마지막에 주장을 확정하는 방식이에요.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. however는 앞의 통념을 뒤집는 전환 신호예요. in fact는 우리가 미처 몰랐던 사실을 강조하며 주장을 힘 있게 끌어올리죠. for example은 어머니 헤어스타일이라는 구체적인 예시를 불러오고, although는 양보하면서 뒤에 오는 진짜 이유를 부각합니다. 마지막의 but 역시 거짓말이라는 사실과 좋은 목적이라는 결론을 대조하며 글을 맺는 신호예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>ask\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>느끼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lie\u003c/b>\u003cem>동사\u003c/em>\u003cspan>거짓말하다, 거짓말\u003c/span>\u003c/div>\u003cdiv>\u003cb>likely\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>~할 것 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>hate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>싫어하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>different kinds of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다양한 종류의\u003c/span>\u003c/div>\u003cdiv>\u003cb>in fact\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사실\u003c/span>\u003c/div>\u003cdiv>\u003cb>tell a lie\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>거짓말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>one another\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>서로\u003c/span>\u003c/div>\u003cdiv>\u003cb>common\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흔한\u003c/span>\u003c/div>\u003cdiv>\u003cb>upset\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>화난, 속상한\u003c/span>\u003c/div>\u003cdiv>\u003cb>find out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>알아내다, 밝혀지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>change\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바꾸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hairstyle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>헤어스타일\u003c/span>\u003c/div>\u003cdiv>\u003cb>even if\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~일지라도\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>여기다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>terrible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>끔찍한, 별로인\u003c/span>\u003c/div>\u003cdiv>\u003cb>probably\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마도\u003c/span>\u003c/div>\u003cdiv>\u003cb>although\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~일지라도\u003c/span>\u003c/div>\u003cdiv>\u003cb>reason\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이유\u003c/span>\u003c/div>\u003cdiv>\u003cb>hurt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상처를 주다, 기분 나쁘게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>call\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>white lie\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선의의 거짓말\u003c/span>\u003c/div>\u003cdiv>\u003cb>good reason\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>좋은 이유, 선한 목적\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚어 볼게요. tell a lie는 거짓말하다, find out은 알아내다라는 뜻이고, upset은 화나게 하다라는 의미예요. consider는 여기다, hurt는 기분 나쁘게 하다, white lie는 선의의 거짓말로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">lie\u003c/b>\u003cspan class=\"m\">거짓말\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">falsehood\u003c/span>\u003cspan class=\"s\">fib\u003c/span>\u003cspan class=\"s\">untruth\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">truth\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hate\u003c/b>\u003cspan class=\"m\">싫어하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dislike\u003c/span>\u003cspan class=\"s\">detest\u003c/span>\u003cspan class=\"s\">loathe\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">love\u003c/span>\u003cspan class=\"a\">like\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">common\u003c/b>\u003cspan class=\"m\">흔한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">usual\u003c/span>\u003cspan class=\"s\">ordinary\u003c/span>\u003cspan class=\"s\">widespread\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rare\u003c/span>\u003cspan class=\"a\">unusual\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">upset\u003c/b>\u003cspan class=\"m\">화난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">angry\u003c/span>\u003cspan class=\"s\">disturbed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">pleased\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">terrible\u003c/b>\u003cspan class=\"m\">끔찍한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">awful\u003c/span>\u003cspan class=\"s\">horrible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wonderful\u003c/span>\u003cspan class=\"a\">great\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hurt\u003c/b>\u003cspan class=\"m\">상처를 주다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">harm\u003c/span>\u003cspan class=\"s\">wound\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">comfort\u003c/span>\u003cspan class=\"a\">please\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">various\u003c/span>\u003cspan class=\"s\">diverse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘의 동의어와 반의어도 정리해 볼게요. lie는 거짓말인데 falsehood나 fib로 바꿔 쓸 수 있고 반대말은 truth예요. hate는 dislike, detest와 가깝고 반대는 love죠. common은 usual, widespread와 같은 뜻이고 반대는 rare입니다. upset은 angry, disturbed로 바꿀 수 있고 반대는 calm이나 pleased예요. terrible은 awful, horrible과 비슷하고 반대는 wonderful이며, hurt는 harm, wound의 반대말이 comfort라는 점도 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들에게 물어보라\u003c/span>\u003cspan class=\"en\">Ask people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 어떻게 느끼는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">feel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가 그들에게 거짓말을 할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">someone \u003c/span>\u003cspan class=\"tgt\">lies \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 그들은 아마 말할 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">say\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 정말 싫어한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">hate \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들에게 누군가 그들에게 거짓말을 한다면 기분이 어떨지 물어보라, 그러면 아마도 그건 정말 싫다고 대답할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글을 여는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">질문\u003c/b>으로, 거짓말을 당하면 어떤 기분인지 물으면 대부분 \u003cb class=\"key\">싫어한다\u003c/b>고 답한다는 내용이에요. 독자의 공감을 먼저 끌어내 두었다가 뒤에서 \u003cb class=\"key\">반전\u003c/b>을 준비하는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사 + 주어 + 동사)\u003c/span> : ask + 목적어 + [의문사 + 주어 + 동사] : \"그들이 어떻게 느끼는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : when + [주어 + 동사] + 주절 : \"누군가 그들에게 거짓말을 할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명령문 + and (조건과 결과)\u003c/span> : [명령문], and + [주어 + will + 동사] : \"그러면 그들은 아마 말할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : say + [that + 주어 + 동사] : \"그것을 싫어한다고\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Ask people, 사람들에게 물어보라. how they feel, 그들이 어떻게 느끼는지. when someone lies to them, 누군가 그들에게 거짓말을 할 때. and they will likely say, 그러면 그들은 아마 말할 것이다. that they hate it, 그것을 정말 싫어한다고. 이 문장 전체를 해석하면, 사람들에게 누군가 그들에게 거짓말을 한다면 기분이 어떨지 물어보라, 그러면 아마도 그건 정말 싫다고 대답할 것이다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 글을 여는 도입 질문이에요. 거짓말을 당하면 기분이 어떠냐고 물으면 대부분 싫어한다고 답한다는 거죠. 이렇게 독자의 공감을 먼저 끌어 놓고, 뒤에서 반전을 준비하는 문장이랍니다.","hl":"mn"},{"n":14,"text":"어법 포인트 짚어 볼게요. 첫 번째, how they feel은 간접의문문이에요. 의문사 뒤에 주어와 동사가 오는 주어+동사 어순을 지켜야 하죠. 두 번째, when은 시간의 부사절을 이끌어서 누군가 거짓말을 할 때라는 상황을 만들어 줘요. 세 번째, 명령문 뒤에 and를 붙이면 조건과 결과 관계가 되어서 해라 그러면 이라는 뜻이 됩니다. 네 번째, say 뒤의 that은 목적어절을 이끄는 접속사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">However,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 많은 다양한 종류가\u003c/span>\u003cspan class=\"en\">many different kinds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거짓말의\u003c/span>\u003cspan class=\"en\">of lies.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 거짓말에는 종류가 많다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거짓말을 싫어한다는 일반적인 생각을 however로 \u003cb class=\"key\">전환\u003c/b>시켜, 거짓말에도 \u003cb class=\"key\">여러 \u003c/b>\u003cb class=\"key\">종류\u003c/b>가 있음을 알려 주는 문장이에요. 글의 \u003cb class=\"key\">주제\u003c/b>로 들어가는 징검다리 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 however\u003c/span> : However, + [주어 + 동사] (완전한 문장) : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">there be 구문(유도부사)\u003c/span> : There + be동사 + 주어 + (수식어) : \"~이 있다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"However, 그러나. there are, 있다. many different kinds, 아주 많은 다양한 종류가. of lies, 거짓말의. 이 문장 전체를 해석하면, 그러나 거짓말에는 종류가 많다.","hl":"m"},{"n":16,"text":"이 문장은 거짓말을 싫어한다는 생각을 however로 한 번 전환시켜요. 거짓말에도 여러 종류가 있다는 걸 알려 주면서 글의 주제로 들어가는 징검다리 역할을 한답니다.","hl":"mn"},{"n":17,"text":"어법 포인트 갑니다. 첫 번째, however는 접속부사예요. 접속사가 아니라서 뒤에 완전한 문장이 와야 하죠. 두 번째, there are는 유도부사 구문이에요. 진짜 주어가 뒤에 있는데 그 주어가 복수라서 be동사가 are로 온 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">fact,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 모두는 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">tell\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 거짓말들을\u003c/span>\u003cspan class=\"en\">small lies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">another\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매일\u003c/span>\u003cspan class=\"en\">every day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실, 우리 모두는 서로에게 매일 작은 거짓말들을 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거짓말은 특별한 사람만 하는 것이 아니라 \u003cb class=\"key\">우리 \u003c/b>\u003cb class=\"key\">모두\u003c/b>가 매일 조그맣게 한다는 점을 강조해요. in fact로 앞의 부정적인 느낌을 \u003cb class=\"key\">사실\u003c/b> 쪽으로 바로잡으면서 거짓말에 \u003cb class=\"key\">일상성\u003c/b>을 부여하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문장 부사구 In fact\u003c/span> : In fact, + [주어 + 동사] : \"사실\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사 all의 위치\u003c/span> : [주어 + all + 일반동사] : \"우리 모두는 ~한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">상호대명사 one another\u003c/span> : tell + 목적어 + to + one another : \"서로에게\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"In fact, 사실. we all tell, 우리 모두는 한다. small lies, 작은 거짓말들을. to one another, 서로에게. every day, 매일. 이 문장 전체를 해석하면, 사실, 우리 모두는 서로에게 매일 작은 거짓말들을 한다.","hl":"m"},{"n":19,"text":"이 문장은 거짓말이 특별한 사람만 하는 게 아니라는 걸 말해요. 우리 모두가 매일 조그맣게 한다는 점을 강조하면서, 거짓말에 일상성을 부여하는 거죠. 앞에서 나온 거짓말은 나쁘다라는 느낌을 사실 쪽으로 부드럽게 바로잡아 주는 문장이에요.","hl":"mn"},{"n":20,"text":"어법 포인트 세 개 짚을게요. 첫 번째, In fact는 문장 부사구라서 뒤에 주어와 동사가 다 있는 완전한 문장이 와요. 두 번째, all은 주어를 강조하는 부사로 일반동사 앞에 자리를 잡아요. be동사나 조동사가 있으면 그 뒤로 간다는 것도 기억해 두세요. 세 번째, to one another는 상호대명사로 서로에게라는 뜻이고 전치사 to의 목적어 자리에 왔어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이건 매우 흔한 일일뿐 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Not \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">common\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 정말 화나게 하진 않는다\u003c/span>\u003cspan class=\"en\">it doesn't really \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">upset\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(거짓말임이) 밝혀졌을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이건 매우 흔한 일일뿐 아니라 (거짓말임이) 밝혀진 후에라도 우리를 정말 화나게 하진 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 '작은 거짓말'을 이어받아, 그것이 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">일\u003c/b>일 뿐 아니라 밝혀져도 우리가 \u003cb class=\"key\">화나지 \u003c/b>\u003cb class=\"key\">않는다\u003c/b>는 점을 말해요. Not only 도치로 \u003cb class=\"key\">첨가\u003c/b> 정보를 덧붙여, 뒤에 나올 '선의의 거짓말' 설명의 발판을 놓는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정어구 Not only의 도치\u003c/span> : Not only + [be동사/조동사] + [주어] ~ : \"이건 매우 흔한 일일뿐 아니라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 동사 make + 목적어 + 형용사(목적격보어)\u003c/span> : make + [목적어] + [형용사(목적격보어)] : \"우리를 화나게 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [주절] + when + [주어 + 동사] : \"우리가 (거짓말임을) 알게 될 때\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Not only is this very common, 이건 매우 흔한 일일뿐 아니라. it doesn't really make us upset, 우리를 정말 화나게 하진 않는다. when we find out, (거짓말임이) 밝혀졌을 때. 이 문장 전체를 해석하면, 이건 매우 흔한 일일뿐 아니라 (거짓말임이) 밝혀진 후에라도 우리를 정말 화나게 하진 않는다.","hl":"m"},{"n":22,"text":"여기서 this는 바로 앞에 나온 작은 거짓말을 가리켜요. 그런 거짓말은 흔한 일일 뿐만 아니라, 나중에 사실이 밝혀져도 우리가 화나지 않는다는 뜻이죠. Not only로 첨가 정보를 덧붙이면서, 뒤에 나올 선의의 거짓말 이야기로 넘어가는 발판을 놓는 문장이에요.","hl":"mn"},{"n":23,"text":"첫 번째, Not only가 문장 앞에 오면 도치가 일어나서 be동사 is가 주어 this보다 앞으로 나와요. 두 번째, make us upset은 make가 목적어 us 뒤에 형용사 upset을 목적격보어로 데리고 오는 구조예요. 세 번째, when we find out은 시간을 나타내는 부사절이고, find out은 알아내다, 밝혀지다라는 뜻의 숙어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들면\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 어머니가 헤어스타일을 바꾸셨다고 상상해 보라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">imagine \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">mother \u003c/span>\u003cspan class=\"tgt\">changed \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">hairstyle\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 당신에게 그녀가 어떻게 보이는지 물어보셨다고\u003c/span>\u003cspan class=\"en\">and asked you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">looks\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들면, 당신의 어머니가 헤어스타일을 바꾸고는 어떠냐고 물어오셨을 때를 상상해보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 '작은 거짓말'의 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">예\u003c/b>를 떠올려 보라고 하는 대표 예시 문장이에요. 어머니의 헤어스타일을 \u003cb class=\"key\">소재\u003c/b>로 삼아, 뒤 문장에서 '좋아 보인다'고 말하는 \u003cb class=\"key\">선의의 \u003c/b>\u003cb class=\"key\">거짓말\u003c/b> 상황으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 imagine의 목적어로 쓰인 접속사 that의 생략\u003c/span> : imagine + [(that) + 주어 + 동사 + 목적어] : \"당신의 어머니가 헤어스타일을 바꾸셨다고 상상하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사 + 주어 + 동사)\u003c/span> : 의문사 + [주어] + [동사] : \"그녀가 어떻게 보이는지\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"For example, 예를 들면. imagine your mother changed her hairstyle, 당신의 어머니가 헤어스타일을 바꾸셨다고 상상해 보라. and asked you how she looks, 그리고 당신에게 그녀가 어떻게 보이는지 물어보셨다고. 이 문장 전체를 해석하면, 예를 들면, 당신의 어머니가 헤어스타일을 바꾸고는 어떠냐고 물어오셨을 때를 상상해보라.","hl":"m"},{"n":25,"text":"앞에서 우리가 매일 작은 거짓말을 한다고 했죠. 그 구체적인 예를 하나 떠올려 보라는 거예요. 어머니의 헤어스타일을 소재로 해서, 선의의 거짓말이 나오는 장면으로 넘어가는 겁니다.","hl":"mn"},{"n":26,"text":"첫 번째, imagine 뒤에 나오는 your mother changed her hairstyle은 접속사 that이 생략된 절이 목적어로 온 형태예요. 두 번째, how she looks는 간접의문문이라서 의문사 뒤에 주어 she, 동사 looks 순서로 평서문 어순을 쓴다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 그 스타일이 정말 별로라고 생각할지라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Even \u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">consider \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">style \u003c/span>\u003cspan class=\"tgt\">terrible\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 그녀에게 말해 줄 것이다\u003c/span>\u003cspan class=\"en\">you will probably \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 좋아 보인다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">looks \u003c/span>\u003cspan class=\"tgt\">great\u003c/span>. *\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 이것이 거짓말일지라도\u003c/span>\u003cspan class=\"en\">Although this is a lie,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 그것을 말하는 이유는 ~ 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">reason \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003cspan class=\"tgt\">it\u003c/span> is because\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄마를 사랑하기에\u003c/span>\u003cspan class=\"en\">you love your mother\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀를 기분 나쁘게 하고 싶지 않기\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">hurt \u003c/span>\u003cspan class=\"tgt\">her\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비록 그 스타일이 정말 별로라고 생각할지라도, 아마도 아주 좋아 보인다고 말해 줄 것이다. 비록 이것이 거짓말일지라도 당신이 그렇게 말한 이유는 엄마를 사랑하기에 그녀를 기분 나쁘게 하고 싶지 않기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 상상한 상황의 \u003cb class=\"key\">결론\u003c/b>으로, 상대의 기분을 상하게 하지 않으려는 \u003cb class=\"key\">배려\u003c/b>가 선의의 거짓말을 만든다는 점을 밝혀요. the reason ~ is because 구문으로 \u003cb class=\"key\">이유\u003c/b>를 분명히 제시한 뒤, 마지막 문장의 \u003cb class=\"key\">white \u003c/b>\u003cb class=\"key\">lies\u003c/b> 정의로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사 even if\u003c/span> : Even if + [주어 + 동사], [주절] : \"비록 그 스타일이 정말 별로라고 생각할지라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절 (tell + 목적어 + that절)\u003c/span> : tell + [목적어] + that + [주어 + 동사] : \"그녀가 아주 좋아 보인다고 말해 주다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계부사 why가 생략된 관계절\u003c/span> : the reason + [(why) + 주어 + 동사] : \"당신이 그것을 말하는 이유\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (want의 목적어)\u003c/span> : want + [to + 동사원형] : \"그녀를 기분 나쁘게 하고 싶지 않다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Even if you consider the style terrible, 비록 그 스타일이 정말 별로라고 생각할지라도. you will probably tell her, 아마도 그녀에게 말해 줄 것이다. that she looks great, 아주 좋아 보인다고. Although this is a lie, 비록 이것이 거짓말일지라도. the reason you tell it is because, 당신이 그것을 말하는 이유는 ~ 때문이다. you love your mother, 엄마를 사랑하기에. and don't want to hurt her, 그녀를 기분 나쁘게 하고 싶지 않기. 이 문장 전체를 해석하면, 비록 그 스타일이 정말 별로라고 생각할지라도, 아마도 아주 좋아 보인다고 말해 줄 것이다. 비록 이것이 거짓말일지라도 당신이 그렇게 말한 이유는 엄마를 사랑하기에 그녀를 기분 나쁘게 하고 싶지 않기 때문이다.","hl":"m"},{"n":28,"text":"앞에서 상상해 본 상황의 결론이에요. 스타일이 별로여도 좋아 보인다고 말하는 건 상대의 기분을 상하게 하지 않으려는 배려 때문이죠. 이 문장은 the reason is because 구문으로 그 이유를 분명히 밝히고, 마지막에 나오는 white lies라는 이름의 정의로 자연스럽게 이어 줍니다.","hl":"mn"},{"n":29,"text":"첫 번째, even if는 '비록 ~일지라도'라는 양보의 뜻을 만드는 접속사예요. 두 번째, tell her that she looks great에서 that절은 목적어 자리에 놓인 명사절입니다. 세 번째, the reason you tell it은 관계부사 why가 생략된 형태로, the reason 뒤에 왜인지 설명하는 절이 바로 이어진다고 보시면 돼요. 네 번째, want to hurt에서 to hurt는 want의 목적어로 쓰인 to부정사고, 그 앞에 don을 붙여 부정한다는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 부른다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">call \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">these \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하얀 거짓말(선의의 거짓말)이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">white \u003c/span>\u003cspan class=\"tgt\">lies\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 것을 하얀 거짓말(선의의 거짓말)이라 부른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 예로 든 엄마의 머리 스타일에 대한 거짓말처럼, 상대를 위하는 마음에서 하는 거짓말에 \u003cb class=\"key\">이름\u003c/b>을 붙여 주는 문장이에요. 즉 예시를 하나의 \u003cb class=\"key\">용어\u003c/b>로 묶어 정의하는 역할을 하죠. call A B는 'A를 B라고 부르다'라는 \u003cb class=\"key\">5형식\u003c/b> 표현이라 A와 B의 자리를 헷갈리지 않는 것이 중요해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 동사 call (목적격 보어)\u003c/span> : call + [목적어(these)] + [목적격 보어(white lies)] : \"이것들을 하얀 거짓말이라고 부르다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"We call, 우리는 부른다. these, 이런 것을. white lies, 하얀 거짓말(선의의 거짓말)이라고. 이 문장 전체를 해석하면, 이런 것을 하얀 거짓말(선의의 거짓말)이라 부른다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 엄마 머리 스타일을 예로 든 이야기를 하나의 이름으로 정리해 주는 문장이에요. 그런 거짓말에 이름을 붙이는 거죠. 이렇게 해서 글의 핵심 용어인 white lies가 등장하게 됩니다.","hl":"mn"},{"n":32,"text":"여기서 눈여겨볼 것은 call 다음에 목적어 these가 오고 바로 뒤에 white lies가 온다는 점이에요. call은 목적어 뒤에 명사를 붙여 '목적어를 그 명사라고 부르다'의 뜻을 만드는 5형식 동사입니다. 그래서 these와 white lies는 '이것들 equals 하얀 거짓말'의 관계가 되고, 목적격 보어 자리에는 형용사가 아니라 명사가 온다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 거짓말일지 모르지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">lies,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 그런 거짓말을 한다\u003c/span>\u003cspan class=\"en\">but we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선한 목적으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">reason\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 거짓말일지 모르지만 우리는 선한 목적으로 그런 거짓말을 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 제시한 white lies를 인정하면서도, 그것을 말하는 \u003cb class=\"key\">이유\u003c/b>가 좋다는 점을 강조하며 글을 맺는 문장이에요. may be ~ but ...은 '~일지 모르지만'이라는 \u003cb class=\"key\">양보\u003c/b> 표현으로, 앞의 부정적 측면보다 뒤의 긍정적 측면을 부각합니다. them은 앞의 white lies를 받는 \u003cb class=\"key\">지시대명사\u003c/b>이고, for a good reason은 '선한 목적으로'라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 may (~일지라도)\u003c/span> : [주어] + may + [동사원형] ..., but + [주절] : \"그것들은 거짓말일지 모르지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시대명사 them\u003c/span> : tell + [목적어(them = white lies)] + [전치사구(for a good reason)] : \"그런 거짓말을 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for (이유·목적)\u003c/span> : for + [명사(목적/이유)] : \"선한 목적으로\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"They may be lies, 그것들은 거짓말일지 모르지만. but we tell them, 우리는 그런 거짓말을 한다. for a good reason, 선한 목적으로. 이 문장 전체를 해석하면, 그것들은 거짓말일지 모르지만 우리는 선한 목적으로 그런 거짓말을 한다.","hl":"m"},{"n":34,"text":"이 문장은 글의 마지막에서 화이트 라이의 성격을 한 번에 정리해 주는 결론 문장이에요. 거짓말이라는 사실은 인정하되, 그 거짓말을 하는 까닭이 좋다는 점을 강조하고 있죠. 그래서 앞에서 든 엄마 머리 스타일 예시와도 자연스럽게 이어집니다.","hl":"mn"},{"n":35,"text":"먼저 may be lies에서 may는 허락이나 추측이 아니라 양보의 의미로 쓰였어요. 뒤에 but이 나오면서 '거짓말일지 모르지만'이라는 대조 구조를 만들어 줍니다. 두 번째로 tell them의 them은 앞 문장의 white lies를 그대로 받는 지시대명사라서 복수형으로 쓴 것이고요. 마지막으로 for a good reason은 전치사 for가 목적과 이유를 나타내서 '선한 목적으로'라고 해석한다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사람들은 \u003cb class=\"key\">거짓말\u003c/b>을 싫어한다고 말하지만 거짓말에는 여러 \u003cb class=\"key\">종류\u003c/b>가 있다.\u003c/li>\u003cli>우리는 매일 서로에게 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">거짓말\u003c/b>을 하며, 그것은 흔하고 밝혀져도 \u003cb class=\"key\">화나지\u003c/b> 않는다.\u003c/li>\u003cli>어머니의 헤어스타일 예시처럼 \u003cb class=\"key\">선의의 \u003c/b>\u003cb class=\"key\">거짓말\u003c/b>은 사랑하고 상처 주고 싶지 않기 때문에 한다.\u003c/li>\u003cli>\u003cb class=\"key\">white \u003c/b>\u003cb class=\"key\">lies\u003c/b>는 거짓말일지 모르지만 우리는 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">목적\u003c/b>으로 그런 거짓말을 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>We all tell white lies, and although they are lies, we tell them for a good reason out of love.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사람들은 거짓말을 싫어한다고 말하지만, 우리는 매일 서로에게 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">거짓말\u003c/b>을 하며 그것은 흔하고 밝혀져도 화나지 않는다. 어머니의 헤어스타일에 대한 칭찬처럼, \u003cb class=\"key\">white \u003c/b>\u003cb class=\"key\">lies\u003c/b>는 사랑하고 상처 주고 싶지 않기 때문에 하는 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">목적\u003c/b>의 거짓말이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 글은 거짓말을 무조건 나쁘다고 보지 말고, 그 목적과 종류를 함께 보라는 메시지를 담고 있어요. 작은 거짓말은 흔하고, white lie는 사랑과 배려에서 나오는 좋은 목적의 거짓말이죠. 시험에서도 however, in fact, for example 같은 신호어를 중심으로 흐름을 잡으면 답이 잘 보일 거예요. 오늘 수업도 잘 따라와 줘서 고마워요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
