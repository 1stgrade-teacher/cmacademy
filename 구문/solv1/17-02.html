<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 17강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 17강 적용독해02","audioDir":"17-02_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">17강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>A Goldfish That Can Play Soccer: Kyle's Step-by-Step Training\u003c/h1>\u003ch2>축구하는 금붕어: Kyle의 단계별 훈련\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Kyle은 선생님이 \u003cb class=\"key\">불가능\u003c/b>하다고 말한 금붕어 훈련을 포기하지 않고, 먹이를 \u003cb class=\"key\">보상\u003c/b>으로 주는 단계별 훈련으로 Einstein이 공을 골인시키게 만들었다. 결국 그는 물고기도 \u003cb class=\"key\">흥미로운 \u003c/b>\u003cb class=\"key\">애완동물\u003c/b>이 될 수 있음을 보여 주었다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Kyle ignored his teacher's claim that fish could not be trained and used step-by-step food rewards to teach his goldfish Einstein to push a ball into a goal, showing that fish can be interesting pets.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 금붕어 Einstein을 훈련시킨 Kyle의 이야기를 함께 읽어 볼 거예요. 이 글은 평범하지 않은 애완 금붕어 Einstein이 주인의 손에서 먹이를 받아먹고, 후프와 튜브 사이로 헤엄치며, 미니 축구공을 골인시키는 장면으로 시작하죠. 핵심은 과학 선생님이 불가능하다고 말했지만 Kyle이 포기하지 않고 먹이를 보상으로 주는 단계별 훈련을 했다는 점이고, 결국 물고기도 흥미로운 애완동물이 될 수 있음을 보여 준다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">동물이 새로운 행동을 배우는 원리는 \u003cb class=\"key\">조작적 \u003c/b>\u003cb class=\"key\">조건화\u003c/b>(operant conditioning)로 설명할 수 있습니다. 어떤 행동 뒤에 먹이 같은 좋은 결과가 따라오면 그 행동은 더 자주 나타나는데, 이를 \u003cb class=\"key\">정적 \u003c/b>\u003cb class=\"key\">강화\u003c/b>(positive reinforcement)라고 합니다. 훈련에서는 원하는 행동에 \u003cb class=\"key\">보상\u003c/b>을 주는 방식으로 작은 행동을 하나씩 늘려 갑니다. 금붕어의 \u003cb class=\"key\">기억력\u003c/b>이 3초라는 말은 과학적으로 과장된 \u003cb class=\"key\">통념\u003c/b>에 가깝고, 실제 물고기도 반복과 보상을 통해 복잡한 과제를 학습할 수 있습니다. 이것은 게임에서 작은 미션을 깨면 보상을 받고 그 보상으로 다음 단계에 도전하는 과정과 비슷합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 동물이 새로운 행동을 배우는 원리는 조작적 조건화로 설명할 수 있어요. 어떤 행동 뒤에 먹이 같은 좋은 결과가 따라오면 그 행동이 더 자주 나타나는데, 이것을 정적 강화라고 부릅니다. 그래서 훈련에서는 원하는 행동에 보상을 주면서 작은 행동을 하나씩 늘려 가죠. 금붕어의 기억력이 아주 짧다는 통념도 널리 퍼져 있지만, 실제 물고기는 반복과 보상을 통해 꽤 복잡한 과제도 배울 수 있어요. 마치 게임에서 작은 미션을 깨면 보상을 받고, 그 보상으로 다음 단계에 도전하는 것과 비슷하죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>놀라운 금붕어\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 Einstein이 평범한 애완 금붕어가 아니라는 \u003cb class=\"key\">도입\u003c/b>으로 시작한다. 그는 주인의 손에서 먹이를 받아먹고 후프와 튜브 사이로 헤엄치며 미니 축구공을 골인시키기까지 한다. 이렇게 구체적인 \u003cb class=\"key\">예시\u003c/b>를 먼저 제시해 독자의 흥미를 끈다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>선생님의 통념\u003csmall>통념 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>Kyle은 자신이 어항에 다가갈 때마다 물고기가 자신의 움직임에 \u003cb class=\"key\">반응\u003c/b>하는 것을 알아챘다. 그는 물고기를 조련시킬 수 있는지 궁금해서 과학 선생님께 여쭤보았지만, 선생님은 아무리 노력해도 \u003cb class=\"key\">불가능\u003c/b>할 거라고 말씀하셨다. 그러나 Kyle은 선생님 말씀을 \u003cb class=\"key\">무시\u003c/b>하고 Einstein을 훈련시키기로 결정한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>단계별 훈련\u003csmall>근거 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>Kyle은 먼저 Einstein이 작은 골네트를 향해 헤엄칠 때마다 먹이를 조금 주었다. 일단 물고기가 네트 쪽으로 가는 법을 배우자, 그는 \u003cb class=\"key\">공 \u003c/b>\u003cb class=\"key\">다루기\u003c/b>라는 새로운 단계를 추가했다. Einstein이 그것을 배우자마자 Kyle은 공을 \u003cb class=\"key\">골\u003c/b> 안으로 밀어 넣도록 가르쳤다. 먹이 보상에서 시작해 점점 \u003cb class=\"key\">난이도\u003c/b>를 높인 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>Kyle의 목적\u003csmall>결론 · 문장 9\u003c/small>\u003c/h4>\u003cp>마지막으로 Kyle은 물고기가 \u003cb class=\"key\">흥미로운\u003c/b> 애완동물이 될 수 있다는 것을 보여 주고 싶었다고 말한다. 이 한 문장이 선생님의 통념을 뒤집는 글의 \u003cb class=\"key\">결론\u003c/b>이 된다. 결국 이 글은 관찰에서 시작한 작은 시도가 편견을 깬 사례를 보여 준다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 글은 Einstein이 평범한 애완 금붕어가 아니라고 말하면서 시작하죠. 주인의 손에서 먹이를 받아먹고, 후프와 튜브 사이로 헤엄치고, 미니 축구공을 골인시키는 구체적인 예시를 먼저 보여 줍니다. 이 예시 덕분에 독자는 어떤 이야기가 펼쳐질지 궁금해하게 돼요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 선생님의 통념이 나오는 부분이에요. Kyle은 어항에 다가갈 때마다 물고기가 자신의 움직임에 반응하는 것을 알아챘죠. 그래서 물고기를 훈련시킬 수 있는지 과학 선생님께 물었지만, 선생님은 아무리 노력해도 불가능하다고 말씀하셨어요. 그런데 Kyle은 그 말을 무시하고 Einstein을 훈련시키기로 결정합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 단계별 훈련 과정이에요. Kyle은 먼저 Einstein이 작은 골네트를 향해 헤엄칠 때마다 먹이를 조금 주었어요. 일단 물고기가 네트 쪽으로 가는 법을 배우자 공 다루기라는 새로운 단계를 추가했고, 그것을 배우자마자 공을 골 안으로 밀어 넣도록 가르쳤죠. 먹이 보상에서 시작해 점점 난이도를 높인 셈입니다.","hl":"f2"},{"n":7,"text":"마지막 단계는 결론이에요. Kyle은 물고기가 흥미로운 애완동물이 될 수 있다는 것을 보여 주고 싶었다고 말합니다. 이 한 문장이 선생님의 통념을 뒤집는 결론이 되죠. 결국 이 글은 관찰에서 시작한 작은 시도가 편견을 깬 사례를 보여 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 '물고기 훈련은 불가능하다'는 \u003cb class=\"key\">통념\u003c/b>을 Kyle의 실제 성공 사례로 \u003cb class=\"key\">반박\u003c/b>하는 전개방식이다. 선생님의 부정적 말이 나온 뒤 however로 태도가 전환되고, First와 Once로 훈련 과정이 순서대로 제시된다. 마지막 문장에서 Kyle의 말로 글의 의도를 밝히므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있다. 따라서 주제문은 마지막 문장인 아홉 번째 문장이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>even (2)\u003c/b>\u003cspan>강조\u003c/span>\u003cb>but (4)\u003c/b>\u003cspan>대조·반박\u003c/span>\u003cb>however (5)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>First (6)\u003c/b>\u003cspan>순서 제시\u003c/span>\u003cb>Once (7)\u003c/b>\u003cspan>조건·시간\u003c/span>\u003cb>The moment (8)\u003c/b>\u003cspan>즉시성 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">could be trained\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">train Einstein\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">learned to go toward the net\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">learned that\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">trained him\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>선생님의 통념\u003c/th>\u003cth>Kyle의 실행\u003c/th>\u003c/tr>\u003ctr>\u003ctd>물고기 훈련은 불가능하다고 단정\u003c/td>\u003ctd>작은 목표부터 단계별로 시도\u003c/td>\u003c/tr>\u003ctr>\u003ctd>노력해도 안 된다고 조언\u003c/td>\u003ctd>먹이 보상으로 네트에서 공 다루기까지 훈련\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결과를 확인하지 않고 포기\u003c/td>\u003ctd>Einstein이 골을 넣는 결과 확인\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개방식은 통념과 반박의 구조예요. 물고기 훈련은 불가능하다는 선생님의 말이 통념으로 제시되고, Kyle의 실제 성공이 그 통념을 반박하죠. 글의 결론이 마지막 문장에서 나오기 때문에 미괄식 구조로 볼 수 있어요. 그래서 주제문은 마지막인 아홉 번째 문장입니다.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 네 번째 문장의 but은 선생님의 부정적 말과 Kyle의 행동을 이어 주는 대조의 신호예요. 다섯 번째 문장의 however는 전환 신호로, Kyle이 선생님 말을 무시하고 행동에 나선다는 것을 알려 주죠. 여섯 번째 문장의 First, 일곱 번째 문장의 Once, 여덟 번째 문장의 The moment는 훈련 과정이 순서대로 진행된다는 것을 보여 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>ordinary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>평범한\u003c/span>\u003c/div>\u003cdiv>\u003cb>pet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>애완동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>goldfish\u003c/b>\u003cem>명사\u003c/em>\u003cspan>금붕어\u003c/span>\u003c/div>\u003cdiv>\u003cb>owner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주인\u003c/span>\u003c/div>\u003cdiv>\u003cb>hoop\u003c/b>\u003cem>명사\u003c/em>\u003cspan>후프, 고리\u003c/span>\u003c/div>\u003cdiv>\u003cb>tube\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관, 튜브\u003c/span>\u003c/div>\u003cdiv>\u003cb>miniature\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>소형의, 미니어처의\u003c/span>\u003c/div>\u003cdiv>\u003cb>goal\ span class=\"ko\">아인슈타인은\u003c/span>\u003cspan class=\"en\">Einstein\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 평범한 애완 금붕어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">ordinary \u003c/span>\u003cspan class=\"tgt\">pet \u003c/span>\u003cspan class=\"tgt\">goldfish\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Einstein 은 평범한 애완 금붕어가 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 흥미를 끄는 도입 문장이에요. Einstein이 보통 금붕어가 아니라는 \u003cb class=\"key\">부정\u003c/b>을 먼저 던져 독자가 다음 내용을 궁금해하게 만들죠. 여기서 your는 직역하면 '당신의'지만, 실제로는 흔히 말하는 평범한이라는 \u003cb class=\"key\">관용적\u003c/b> 느낌으로 쓰였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 부정문\u003c/span> : 주어 + be동사 + not + 보어 : \"~이 아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격과 형용사의 명사구 수식\u003c/span> : 한정사(your) + 형용사(ordinary) + 복합명사(pet goldfish) : \"당신의 평범한 애완 금붕어\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Einstein, 아인슈타인은. is not, ~이 아니다. your ordinary pet goldfish, 당신의 평범한 애완 금붕어. 이 문장 전체를 해석하면, Einstein 은 평범한 애완 금붕어가 아니다.","hl":"m"},{"n":13,"text":"이 문장은 글의 흥미를 끄는 도입이에요. Einstein이 보통 금붕어가 아니라는 부정의 뜻을 먼저 던져서 독자가 다음 내용을 궁금해하게 하죠. 여기서 your는 직역하면 당신의지만, 실제로는 흔히 말하는 평범한이라는 관용적 느낌으로 쓰였어요.","hl":"mn"},{"n":14,"text":"첫 번째로 is not은 be동사 뒤에 not을 붙인 부정문이에요. 두 번째로 your ordinary pet goldfish에서는 소유격 your가 명사구를 한정하고 형용사 ordinary가 pet goldfish를 꾸며요. 그래서 평범한 애완 금붕어라는 하나의 명사구로 읽으면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 먹이를 받아먹고\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">takes \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주인의 손에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">owner's \u003c/span>\u003cspan class=\"tgt\">hand, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">후프와 튜브 사이로 헤엄치며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">swims \u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">hoops \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">tubes, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 심지어 ~하기까지 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">puts\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미니 축구 공을\u003c/span>\u003cspan class=\"en\">a miniature soccer ball\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">골 안으로!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">goal\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 주인의 손에서 먹이를 받아먹고, 후프와 튜브 사이로 헤엄치며, 미니 축구 공을 골인시키기까지 한다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Einstein이 얼마나 특별한지 구체적인 \u003cb class=\"key\">행동\u003c/b>으로 보여 주는 예시 문장이에요. 먹이 받기, 후프 통과, 공 넣기라는 세 가지 동작을 \u003cb class=\"key\">병렬\u003c/b>로 나열해 놀라움을 키워요. 앞 문장의 '평범하지 않다'를 \u003cb class=\"key\">구체화\u003c/b>하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 병렬 구조\u003c/span> : 주어 + 동사 A + 목적어, 동사 B, and even + 동사 C + 목적어 : \"먹이를 받아먹고, 헤엄치며, 넣기까지 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 into의 도달 의미\u003c/span> : put + 목적어 + into + 장소 : \"골 안으로 넣다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He takes food, 그것은 먹이를 받아먹고. from his owner's hand, 주인의 손에서. swims through hoops and tubes, 후프와 튜브 사이로 헤엄치며. and even puts, 그리고 심지어 ~하기까지 한다. a miniature soccer ball, 미니 축구 공을. into a goal!, 골 안으로!. 이 문장 전체를 해석하면, 그것은 주인의 손에서 먹이를 받아먹고, 후프와 튜브 사이로 헤엄치며, 미니 축구 공을 골인시키기까지 한다!","hl":"m"},{"n":16,"text":"이 문장은 Einstein이 얼마나 특별한지 구체적인 행동으로 보여 주는 예시예요. 먹이 받기, 후프 통과, 공 넣기라는 세 가지 동작을 병렬로 나열해서 놀라움을 키우죠. 앞 문장에서 말한 평범하지 않다는 내용을 구체화하는 역할을 합니다.","hl":"mn"},{"n":17,"text":"첫 번째로 He takes, swims, puts가 and로 이어진 동사 병렬 구조예요. 세 동작을 같은 형태로 나열하고 마지막 puts 앞의 even이 심지어라는 강조를 더하죠. 두 번째로 into a goal에서 into는 움직임의 도달점을 나타내서 공이 골 안까지 들어간다는 뜻을 분명히 해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 모든 것은 시작되었다\u003c/span>\u003cspan class=\"en\">(B) It all started\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Kyle이 알아챘을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">Kyle \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">noticed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물고기가 자신의 움직임에 반응하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">fish \u003c/span>\u003cspan class=\"tgt\">react\u003c/span> to his movements\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 어항에 다가갈 때마다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">near \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">tank\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 모든 것은 9 살인 Kyle 이 자신이 어항에 다가갈 때마다 물고기가 자신의 움직임에 반응하는 것을 알아챘을 때 시작되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이야기가 시작된 \u003cb class=\"key\">계기\u003c/b>를 알려 주는 문장이에요. Kyle이 물고기의 \u003cb class=\"key\">반응\u003c/b>을 알아차린 사건이 훈련의 출발점이 되었다는 \u003cb class=\"key\">인과\u003c/b>의 흐름을 보여 줍니다. every time은 '~할 때마다'라는 반복의 뜻으로, 물고기가 꾸준히 반응했음을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : 주어 + 동사 + when + 주어 + 동사 : \"Kyle이 알아챘을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지각동사 + 목적어 + 원형부정사\u003c/span> : notice + 목적어 + 동사원형 : \"물고기가 반응하는 것을 알아채다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">every time의 시간 부사절 접속사\u003c/span> : every time + 주어 + 동사 : \"그가 어항에 다가갈 때마다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It all started, 이 모든 것은 시작되었다. when Kyle noticed, Kyle이 알아챘을 때. his fish react to his movements, 물고기가 자신의 움직임에 반응하는 것을. every time he came near the tank, 그가 어항에 다가갈 때마다.. 이 문장 전체를 해석하면, 이 모든 것은 9 살인 Kyle 이 자신이 어항에 다가갈 때마다 물고기가 자신의 움직임에 반응하는 것을 알아챘을 때 시작되었다.","hl":"m"},{"n":19,"text":"이 문장은 이야기가 시작된 계기, 즉 출발점을 알려 주는 문장이에요. Kyle이 물고기의 반응, 다시 말해 움직임에 대한 반응을 알아차린 사건이 훈련의 출발점이 되었다는 인과, 즉 원인과 결과의 흐름을 보여 주죠. every time은 그가 어항에 다가갈 때마다 물고기가 꾸준히 반응했다는 반복의 느낌을 줍니다.","hl":"mn"},{"n":20,"text":"첫 번째로 when Kyle noticed에서 when이 시간 부사절을 이끌어 시작된 시점을 알려 줘요. 두 번째로 noticed his fish react는 지각동사 notice 뒤에 목적어와 동사원형 react가 온 구조라서 물고기가 반응하는 행동 전체를 알아챈 느낌을 줍니다. 세 번째로 every time he came near the tank에서 every time은 접속사처럼 쓰여 반복의 시간 부사절을 이끌어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Kyle은 궁금했다\u003c/span>\u003cspan class=\"en\">Kyle wondered\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물고기가 훈련될 수 있는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">fish \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">trained\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 과학 선생님께 여쭤보았다\u003c/span>\u003cspan class=\"en\">and asked his science teacher,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 선생님은 말씀하셨다\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">teacher \u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 불가능할 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">impossible\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무리 노력해도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">matter \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">hard \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">try\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Kyle 은 물고기를 조련시킬 수 있는지 궁금해서 과학 선생님께 여쭤보았지만 선생님은 아무리 노력해도 불가능할 거라고 말씀하셨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Kyle은 물고기가 훈련될 수 있는지 \u003cb class=\"key\">궁금해했지만\u003c/b>, 선생님은 아무리 노력해도 불가능하다는 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">조언\u003c/b>을 했다. 이 문장은 훈련을 시작하기 전 \u003cb class=\"key\">장애물\u003c/b>을 보여 주며, Kyle이 스스로 결정할 일을 암시한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문(if절)\u003c/span> : wonder + if + 주어 + 동사 : \"물고기가 훈련될 수 있는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적어절의 that 생략\u003c/span> : say + (that) + 주어 + would + 동사원형 : \"선생님은 불가능할 것이라고 말씀하셨다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복합관계부사 no matter how(양보)\u003c/span> : no matter how + 형용사/부사 + 주어 + 동사 : \"아무리 노력해도\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Kyle wondered, Kyle은 궁금했다. if fish could be trained, 물고기가 훈련될 수 있는지. and asked his science teacher, 그리고 과학 선생님께 여쭤보았다. but his teacher said, 하지만 선생님은 말씀하셨다. it would be impossible, 그것은 불가능할 것이라고. no matter how hard he might try, 아무리 노력해도. 이 문장 전체를 해석하면, Kyle 은 물고기를 조련시킬 수 있는지 궁금해서 과학 선생님께 여쭤보았지만 선생님은 아무리 노력해도 불가능할 거라고 말씀하셨다.","hl":"m"},{"n":22,"text":"Kyle은 물고기가 훈련될 수 있는지 궁금해했지만, 선생님은 아무리 노력해도 불가능하다는 부정적 조언을 했어요. 이 문장은 훈련을 시작하기 전 장애물을 보여 주며, Kyle이 스스로 결정할 일을 암시합니다.","hl":"mn"},{"n":23,"text":"첫 번째로 if fish could be trained에서 if는 인지 아닌지를 나타내는 간접의문문이에요. 간접의문문은 평서문 어순을 쓴다는 점, 그리고 fish가 훈련받는 대상이라 수동태로 쓰였다는 점을 기억하세요. 두 번째로 his teacher said it would be impossible에서는 said 뒤에 that이 생략된 목적어절이 이어지고, would는 과거 시점에서 불가능하다고 본 판단을 보여 줍니다. 세 번째로 no matter how hard he might try에서 no matter how는  을 훈련시키기로 했다.","hl":"m"},{"n":25,"text":"Kyle은 선생님의 부정적 조언을 무시하고 자신이 훈련을 결정해요. however가 앞의 반대와 이어지며, Kyle의 주도적 태도를 보여 주는 전환점입니다.","hl":"mn"},{"n":26,"text":"첫 번째로 however는 접속사가 아니라 접속부사예요. 그래서 콤마로 분리해 넣고, 앞뒤 동사를 연결할 때는 and 같은 접속사가 따로 필요하죠. 두 번째로 decided to train Einstein에서 decide는 to부정사를 목적어로 취해 하기로 결정하다라는 뜻을 만듭니다. 여기서 to train은 decided의 목적어 역할이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에 그는 Einstein에게\u003c/span>\u003cspan class=\"en\">First he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">gave \u003c/span>\u003cspan class=\"tgt\">Einstein \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹이를 조금\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">헤엄칠 때마다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">whenever \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">swam \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 골네트를 향해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">toward \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">tiny \u003c/span>\u003cspan class=\"tgt\">soccer \u003c/span>\u003cspan class=\"tgt\">net\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">처음에 그는 Einstein 이 작은 골네트를 향해 헤엄칠 때마다 먹이를 조금 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Kyle은 Einstein이 작은 골네트 쪽으로 \u003cb class=\"key\">헤엄칠 \u003c/b>\u003cb class=\"key\">때마다\u003c/b> 먹이를 주며 \u003cb class=\"key\">보상\u003c/b>을 이용해 행동을 가르쳤다. 이는 훈련의 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">단계\u003c/b>로, 목표 방향으로 가는 행동을 강화하는 장면이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수여동사 구문\u003c/span> : give + 간접목적어 + 직접목적어 : \"Einstein에게 먹이를 조금 주었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복합관계부사 whenever(시간 부사절)\u003c/span> : whenever + 주어 + 동사 : \"작은 골네트를 향해 헤엄칠 때마다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"First he gave Einstein, 처음에 그는 Einstein에게. some food, 먹이를 조금. whenever he swam, 헤엄칠 때마다. toward a tiny soccer net, 작은 골네트를 향해. 이 문장 전체를 해석하면, 처음에 그는 Einstein 이 작은 골네트를 향해 헤엄칠 때마다 먹이를 조금 주었다.","hl":"m"},{"n":28,"text":"Kyle은 Einstein이 작은 골네트 쪽으로 헤엄칠 때마다 먹이를 주며 보상을 이용해 행동을 가르쳤어요. 이는 훈련의 첫 단계로, 목표 방향으로 가는 행동을 강화하는 장면입니다.","hl":"mn"},{"n":29,"text":"첫 번째로 gave Einstein some food는 수여동사 구문이에요. gave는 사람에게 물건을 주다는 뜻이라 Einstein이 간접목적어, some food가 직접목적어가 됩니다. 두 번째로 whenever he swam toward a tiny soccer net에서 whenever는 할 때마다라는 시간의 뜻을 가지며, 뒤에 주어와 동사가 이어지는 부사절을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일단 물고기가 배우자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Once \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">fish \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">learned \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네트 쪽으로 가는 법을,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">toward \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">net\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Kyle 은 새로운 단계를 추가했는데,\u003c/span>\u003cspan class=\"en\">Kyle added a new step:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공 다루기였다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">ball \u003c/span>\u003cspan class=\"tgt\">handling\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일단 물고기가 네트 쪽으로 가는 법을 배우자, Kyle 은 새로운 단계를 추가했는데, 공 다루기였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 훈련이 한 단계 더 나아가는 지점을 보여 주는 문장이에요. 먹이를 주며 네트로 유인하던 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">단계\u003c/b>를 마친 뒤, 콜론 뒤에 제시된 \u003cb class=\"key\">ball \u003c/b>\u003cb class=\"key\">handling\u003c/b>이라는 다음 단계로 넘어간다는 뜻이죠. Once가 이끄는 절이 먼저 끝난 다음 주절의 동작이 일어나는 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>을 잡는 것이 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 접속사 Once\u003c/span> : [Once + 주어 + 동사], 주어 + 동사 : \"일단 물고기가 배우자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : learn + [to go (to부정사구/목적어)] : \"네트 쪽으로 가는 법을 배우다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">콜론(:)을 이용한 동격·설명\u003c/span> : a new step: [ball handling (구체적 내용)] : \"새로운 단계, 즉 공 다루기\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Once his fish learned, 일단 물고기가 배우자. to go toward the net, 네트 쪽으로 가는 법을. Kyle added a new step, Kyle 은 새로운 단계를 추가했는데. ball handling, 공 다루기였다.. 이 문장 전체를 해석하면, 일단 물고기가 네트 쪽으로 가는 법을 배우자, Kyle 은 새로운 단계를 추가했는데, 공 다루기였다.","hl":"m"},{"n":31,"text":"이 문장은 훈련이 한 단계 더 나아가는 지점을 보여 줘요. 네트로 유인하는 첫 단계를 마친 다음, 콜론 뒤에 나오는 ball handling이라는 공 다루기 단계로 넘어간다는 뜻이죠. Once가 이끄는 절이 먼저 끝나고 그다음 동작이 일어난다는 시간의 흐름을 놓치지 마세요.","hl":"mn"},{"n":32,"text":"첫 번째, 문장 앞의 Once는 '일단 하자, 하자마자'라는 뜻의 시간의 접속사예요. 그래서 Once his fish learned라는 절이 먼저 나오고 뒤에 Kyle added a new step이라는 주절이 이어지는 구조죠. 두 번째, learned to go toward the net에서 to go는 learn의 목적어로 쓰인 to부정사예요. '가는 법을 배우다'처럼 배움의 내용을 to부정사로 채워 준다고 기억해 두세요. 세 번째, 콜론 뒤의 ball handling은 앞에 나온 a new step이 무엇인지 구체적으로 설명해 주는 동격 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Einstein 이 그것을 배우자마자,\u003c/span>\u003cspan class=\"en\">(A) \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">moment \u003c/span>\u003cspan class=\"tgt\">Einstein \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">learned \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Kyle 은 그것을 훈련시켰다\u003c/span>\u003cspan class=\"en\">Kyle \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">trained \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공을 밀어 넣도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">push \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ball\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">골 안으로.\u003c/span>\u003cspan class=\"en\">into a goal.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Einstein 이 그것을 배우자마자 Kyle 은 공을 골 안으로 밀어 넣도록 가르쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 배운 공 다루기가 완성되는 순간, 곧바로 다음 훈련으로 넘어간다는 문장이에요. The moment가 as soon as처럼 '~하자마자'라는 뜻으로 쓰였고, that은 바로 앞의 \u003cb class=\"key\">공 \u003c/b>\u003cb class=\"key\">다루기\u003c/b>를 가리키는 \u003cb class=\"key\">지시대명사\u003c/b>죠. 그래서 '그것을 배우자마자 골에 넣는 동작까지 가르쳤다'는 \u003cb class=\"key\">훈련의 \u003c/b>\u003cb class=\"key\">연속성\u003c/b>이 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사 the moment의 접속사적 용법(=as soon as)\u003c/span> : [The moment + 주어 + 동사], 주어 + 동사 : \"Einstein 이 그것을 배우자마자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시대명사 that\u003c/span> : learned [that (앞 내용 = ball handling)] : \"그것을 배우다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식 목적격보어 to부정사\u003c/span> : train + [목적어] + [to push (목적격보어)] : \"그가 공을 밀어 넣도록 훈련시키다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The moment Einstein learned that, Einstein 이 그것을 배우자마자. Kyle trained him, Kyle 은 그것을 훈련시켰다. to push the ball, 공을 밀어 넣도록. into a goal, 골 안으로.. 이 문장 전체를 해석하면, Einstein 이 그것을 배우자마자 Kyle 은 공을 골 안으로 밀어 넣도록 가르쳤다.","hl":"m"},{"n":34,"text":"앞에서 배운 공 다루기가 완성되는 순간, 바로 다음 훈련으로 넘어간다는 문장이에요. The moment가 as soon as처럼 하자마자라는 뜻으로 쓰였고, that은 앞의 공 다루기를 가리키는 지시대명사죠. 그래서 그것을 배우자마자 골에 넣는 동작까지 가르쳤다는 훈련의 연속성이 보여요.","hl":"mn"},{"n":35,"text":"첫 번째, The moment Einstein learned that에서 The moment는 as soon as와 같은 뜻으로 절을 이끄는 표현이에요. 하자마자라고 해석하면 자연스럽죠. 두 번째, learned that의 that은 접속사가 아니라 앞에 나온 ball handling을 가리키는 지시대명사예요. 그래서 그것을 배우다로 받아 주셔야 해요. 세 번째, Kyle trained him to push the ball에서 train은 목적어 him을 데리고 목적격보어로 to push를 취하는 구조예요. 그래서 그가 공을 밀어 넣도록 훈련시켰다는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;나는 보여 주고 싶었다\u003c/span>\u003cspan class=\"en\">&quot;I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">show\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물고기가 흥미로운 애완동물이 될 수 있다는 것을&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">fish \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">interesting \u003c/span>\u003cspan class=\"tgt\">pets\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라고 Kyle 은 말했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">Kyle\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“나는 물고기가 흥미로운 애완동물이 될 수 있다는 걸 보여주고 싶었어요.” 라고 Kyle 은 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Kyle이 이 프로젝트로 전하고 싶었던 메시지를 직접 인용한 문장이에요. 물고기도 \u003cb class=\"key\">흥미로운 \u003c/b>\u003cb class=\"key\">애완동물\u003c/b>이 될 수 있다는 사실을 보여 주고 싶었다는 뜻이죠. 인용문 뒤에 said Kyle이 오는 \u003cb class=\"key\">도치\u003c/b> 어순으로, 말한 사람을 뒤에 붙여 인용의 힘을 살린 마무리 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want + [to show (to부정사구/목적어)] : \"보여 주고 싶었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : show + [that + 주어 + 동사 (명사절/목적어)] : \"물고기가 흥미로운 애완동물이 될 수 있다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주어·동사의 도치(인용문 뒤)\u003c/span> : &quot;인용문,&quot; + [said + 주어] : \"Kyle 은 말했다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"\"I wanted to show, \"나는 보여 주고 싶었다. that fish can be interesting pets,\", 물고기가 흥미로운 애완동물이 될 수 있다는 것을\". said Kyle, 라고 Kyle 은 말했다.. 이 문장 전체를 해석하면, “나는 물고기가 흥미로운 애완동물이 될 수 있다는 걸 보여주고 싶었어요.” 라고 Kyle 은 말했다.","hl":"m"},{"n":37,"text":"카일이 이 프로젝트를 통해 전하고 싶었던 메시지를 직접 인용한 문장이에요. 물고기도 흥미로운 애완동물이 될 수 있다는 것을 보여 주고 싶었다는 뜻이죠. 인용문 뒤에 said Kyle이 오는 도치 어순으로, 말한 사람을 뒤에 붙여 주는 방식이에요.","hl":"mn"},{"n":38,"text":"첫 번째, I wanted to show에서 to show는 want의 목적어로 쓰인 to부정사예요. 그래서 보여 주고 싶었다로 해석하면 돼요. 두 번째, that fish can be interesting pets에서 that은 뒤 절 전체를 show의 목적어로 만들어 주는 접속사예요. 물고기가 흥미로운 애완동물이 될 수 있다는 것을이라는 명사절이 되죠. 세 번째, said Kyle은 인용문 뒤에서 주어와 동사가 도치된 형태예요. 누가 말했는지 뒤에 붙여 주면서 인용문에 힘을 실어 주는 어순이랍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Einstein은 주인의 손에서 먹이를 받아먹고 후프와 튜브를 통과하며 미니 축구공을 골인시키는 \u003cb class=\"key\">평범하지 \u003c/b>\u003cb class=\"key\">않은\u003c/b> 애완 금붕어이다.\u003c/li>\u003cli>Kyle은 물고기가 자신의 움직임에 \u003cb class=\"key\">반응\u003c/b>하는 것을 보고 물고기 훈련이 가능한지 궁금해했지만, 과학 선생님은 \u003cb class=\"key\">불가능\u003c/b>하다고 말했다.\u003c/li>\u003cli>Kyle은 선생님의 말을 \u003cb class=\"key\">무시\u003c/b>하고, 네트로 헤엄칠 때 먹이를 주는 방식으로 \u003cb class=\"key\">단계별 \u003c/b>\u003cb class=\"key\">훈련\u003c/b>을 시작했다.\u003c/li>\u003cli>결국 Einstein은 공 다루기와 \u003cb class=\"key\">골인\u003c/b>까지 배웠고, Kyle은 물고기도 흥미로운 애완동물이 될 수 있음을 보여 주었다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Kyle ignored his teacher's claim that fish could not be trained and used step-by-step food rewards to teach his goldfish Einstein to push a ball into a goal, showing that fish can be interesting pets.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Kyle은 선생님이 \u003cb class=\"key\">불가능\u003c/b>하다고 말한 금붕어 훈련을 포기하지 않고, 먹이를 \u003cb class=\"key\">보상\u003c/b>으로 주는 단계별 훈련으로 Einstein이 공을 골인시키게 만들었다. 결국 그는 물고기도 \u003cb class=\"key\">흥미로운 \u003c/b>\u003cb class=\"key\">애완동물\u003c/b>이 될 수 있음을 보여 주었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 글의 핵심을 다시 정리해 볼게요. Kyle은 물고기가 자신의 움직임에 반응하는 것을 보고 훈련을 결심했고, 먹이를 보상으로 주는 단계별 훈련으로 Einstein이 공을 골인시키게 만들었어요. 선생님이 불가능하다고 했지만 작은 관찰과 꾸준한 시도가 통념을 깼다는 점이 중요합니다. 여러분도 주변의 작은 반응을 놓치지 말고 끝까지 시도해 보세요, 오늘 수업은 여기까지입니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
