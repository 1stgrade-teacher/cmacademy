<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 5강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}
.lp *{box-sizing:border-box}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}
.lp-st{border-radius:4px;border-left:4px solid var(--pk-b)}
.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}
.lp-chips span{border-radius:3px;background:#fff}
.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

.lp-ko{border-radius:0;border-left:4px solid var(--pk);background:none;padding:4px 0 4px 12px}

.lp-ap{border-radius:4px;border:1px solid var(--pk-b);border-top:3px solid var(--pk);background:var(--pk-ll)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 5강 적용독해01","audioDir":"5-01_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">5강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>The Guide Who Has Been There for 300 Years\u003c/h1>\u003ch2>삼백 년 동안 그곳에 있던 가이드\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>미국인 관광객이 영국 고성에서 유령이 나올까 걱정하자 가이드가 유령을 본 적 없다고 안심시킨다. 그러나 가이드가 그곳에 머문 시간이 \u003cb class=\"key\">삼백 \u003c/b>\u003cb class=\"key\">년\u003c/b>이라는 말에 그는 \u003cb class=\"key\">유령\u003c/b>임이 드러난다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The guide's claim that he has never seen a ghost in his three hundred years there humorously suggests that he himself is a ghost.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 짧지만 아주 재미있는 대화형 지문을 함께 읽어 볼게요. 영국 고성에서 관광객과 가이드가 주고받는 말을 따라가다 보면 마지막에 웃음과 동시에 으스스한 느낌이 드는 글입니다. 핵심은 가이드가 유령을 본 적 없다고 안심시키지만, 그가 그곳에 머문 시간이 삼백 년이라는 점이에요. 이제 이 글의 요지를 함께 짚어 보겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">영국 \u003cb class=\"key\">고성\u003c/b>(castle)은 오래된 건축물과 역사적 사건, 전설 때문에 유령 이야기(ghost story)의 배경으로 자주 등장해요. 관광 \u003cb class=\"key\">가이드\u003c/b>(tour guide)는 방문객에게 역사와 일화를 소개하며 안전과 흥미를 책임지는 역할을 하죠. 이 글은 '유령을 본 적 없다'는 평범한 안심이 '삼백 년 동안 이곳에 있었다'는 말과 결합하며 의미가 뒤집히는 \u003cb class=\"key\">반전\u003c/b>(twist)을 사용해요. 일상에서도 '나는 오래전부터 이 집에 있었어'라는 말이 상대에게 전혀 다른 뜻으로 들릴 수 있죠. 이런 \u003cb class=\"key\">말장난\u003c/b>(pun)과 \u003cb class=\"key\">아이러니\u003c/b>(irony)는 짧은 대화 속에서 독자가 스스로 의미를 깨닫게 만드는 장치예요.\u003c/div>","segs":[{"n":2,"text":"영국 고성은 오래된 건축물과 역사적 사건, 전설 때문에 유령 이야기의 배경으로 자주 등장해요. 관광 가이드는 방문객에게 역사와 일화를 소개하며 안전과 흥미를 책임지는 역할을 하죠. 이 글은 유령을 본 적 없다는 평범한 안심이 삼백 년 동안 이곳에 있었다는 말과 결합하며 의미가 뒤집히는 반전을 사용해요. 일상에서도 나는 오래전부터 이 집에 있었어라는 말이 상대에게 전혀 다른 뜻으로 들릴 수 있죠. 이런 말장난과 아이러니는 짧은 대화 속에서 독자가 스스로 의미를 깨닫게 만드는 장치예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>고성 관광과 걱정\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>젊은 미국인 관광객이 영국에서 유명한 \u003cb class=\"key\">고성\u003c/b> 관광을 막 마치고 가이드와 대화를 시작해요. 가이드가 소감을 묻자 관광객은 아주 좋았다고 말하죠. 하지만 어두운 복도에서 \u003cb class=\"key\">유령\u003c/b>이라도 만날까 봐 무서웠다고 덧붙여요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>가이드의 안심\u003csmall>통념 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>가이드는 걱정할 것 없다며 관광객을 \u003cb class=\"key\">안심\u003c/b>시켜요. 그리고 자신은 이곳에 있으면서 유령을 한 번도 \u003cb class=\"key\">본 \u003c/b>\u003cb class=\"key\">적 \u003c/b>\u003cb class=\"key\">없다\u003c/b>고 말하죠. 이 말만 들으면 가이드는 평범하고 믿음직한 안내인처럼 보여요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>머문 시간 질문\u003csmall>전환 · 문장 6\u003c/small>\u003c/h4>\u003cp>관광객은 가이드의 말에서 이상한 점을 느끼고 \u003cb class=\"key\">얼마나\u003c/b> 오래 있었는지 묻어요. 이 질문은 앞의 안심이 어떤 의미였는지 확인하게 만드는 \u003cb class=\"key\">전환\u003c/b>점이에요. 짧은 질문 하나가 다음 문장의 반전을 준비하죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>삼백 년의 반전\u003csmall>반전 · 문장 7\u003c/small>\u003c/h4>\u003cp>가이드는 \u003cb class=\"key\">삼백 \u003c/b>\u003cb class=\"key\">년\u003c/b> 정도라고 답해요. 그 순간 가이드가 이곳에 아주 오래 머문 존재, 즉 \u003cb class=\"key\">유령\u003c/b>일 수 있다는 \u003cb class=\"key\">정체\u003c/b>가 드러나죠. 안심시키던 말이 오히려 으스스한 웃음을 만드는 결말이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 첫 번째 문장부터 마지막 문장까지 네 단계로 나누어 흐름을 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계에서는 젊은 미국인 관광객이 영국에서 유명한 고성 관광을 막 마치고 가이드와 대화를 시작해요. 가이드가 소감을 묻자 관광객은 아주 좋았다고 말하죠. 하지만 어두운 복도에서 유령이라도 만날까 봐 무서웠다고 덧붙여요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서 가이드는 걱정할 것 없다며 관광객을 안심시켜요. 그리고 자신은 이곳에 있으면서 유령을 한 번도 본 적 없다고 말하죠. 이 말만 들으면 가이드는 평범하고 믿음직한 안내인처럼 보여요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 관광객은 가이드의 말에서 이상한 점을 느끼고 얼마나 오래 있었는지 묻어요. 이 질문은 앞의 안심이 어떤 의미였는지 확인하게 만드는 전환점이에요. 짧은 질문 하나가 다음 문장의 반전을 준비하죠.","hl":"f2"},{"n":7,"text":"네 번째 단계에서 가이드는 삼백 년 정도라고 답해요. 그 순간 가이드가 이곳에 아주 오래 머문 존재, 즉 유령일 수 있다는 정체가 드러나죠. 안심시키던 말이 오히려 으스스한 웃음을 만드는 결말이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변과 반전\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 관광객과 가이드의 \u003cb class=\"key\">질문과 \u003c/b>\u003cb class=\"key\">답변\u003c/b> 형식으로 진행돼요. 관광객의 질문과 가이드의 답이 이어지다가 마지막 문장에서 '삼백 년'이라는 정보가 공개되죠. 핵심 내용이 글 끝에서 드러나므로 \u003cb class=\"key\">미괄식\u003c/b> 구조예요. 마지막 답이 앞의 안심을 완전히 뒤집는 \u003cb class=\"key\">반전\u003c/b>을 만들어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (3)\u003c/b>\u003cspan>대조와 걱정 제시\u003c/span>\u003cb>There's nothing to worry about (4)\u003c/b>\u003cspan>안심 제시\u003c/span>\u003cb>never (5)\u003c/b>\u003cspan>부정 강조\u003c/span>\u003cb>How long (6)\u003c/b>\u003cspan>전환 질문\u003c/span>\u003cb>about 300 years (7)\u003c/b>\u003cspan>반전 정보 공개\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">run into a ghost\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">seen a ghost\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I have been here\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">How long is that?\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">about 300 years\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>겉으로 드러난 안심\u003c/th>\u003cth>마지막에 드러난 진실\u003c/th>\u003c/tr>\u003ctr>\u003ctd>유령을 본 적 없다고 말함\u003c/td>\u003ctd>삼백 년 동안 이곳에 머묾\u003c/td>\u003c/tr>\u003ctr>\u003ctd>평범한 가이드처럼 보임\u003c/td>\u003ctd>정체가 유령임을 암시\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 관광객과 가이드의 질문과 답변 형식으로 진행돼요. 관광객의 질문과 가이드의 답이 이어지다가 마지막 문장에서 삼백 년이라는 정보가 공개되죠. 핵심 내용이 글 끝에서 드러나므로 미괄식 구조예요. 마지막 답이 앞의 안심을 완전히 뒤집는 반전을 만들어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 but이 관광객의 좋은 소감과 걱정을 이어 주고, There's nothing to worry about이 안심을 제시해요. never는 가이드가 유령을 본 적 없다는 부정을 강조하고, How long이라는 질문이 전환을 만들어요. 마지막 about three hundred years에서 반전 정보가 공개되죠. 이처럼 신호어와 마지막 정보를 함께 보면 글의 구조가 선명해져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>young\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>젊은\u003c/span>\u003c/div>\u003cdiv>\u003cb>American\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>미국의, 미국인인\u003c/span>\u003c/div>\u003cdiv>\u003cb>tourist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관광객\u003c/span>\u003c/div>\u003cdiv>\u003cb>sightsee\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관광하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>England\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영국\u003c/span>\u003c/div>\u003cdiv>\u003cb>finish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>마치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>just\u003c/b>\u003cem>부사\u003c/em>\u003cspan>방금, 막\u003c/span>\u003c/div>\u003cdiv>\u003cb>tour\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관광, 여행\u003c/span>\u003c/div>\u003cdiv>\u003cb>famous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>old\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>오래된\u003c/span>\u003c/div>\u003cdiv>\u003cb>castle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성, 성곽\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>guide\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가이드, 안내인\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>terrific\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아주 좋은, 훌륭한\u003c/span>\u003c/div>\u003cdiv>\u003cb>girl\u \u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">젊은 미국 관광객이 영국에서 관광을 하다가 유명한 고성 관광을 막 마쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 \u003cb class=\"key\">배경\u003c/b>을 제시하는 문장이에요. 젊은 미국인 관광객이 영국에서 관광 중이고 유명한 고성 투어를 방금 끝냈다는 \u003cb class=\"key\">상황 \u003c/b>\u003cb class=\"key\">설정\u003c/b>을 해 줍니다. has just finished로 방금 끝난 일을 나타내는 \u003cb class=\"key\">현재완료\u003c/b>가 쓰였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + [[동사원형-ing]] : \"관광을 하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료(완료 용법)\u003c/span> : have/has + [[과거분사]] (+ just) : \"막 ~을 마쳤다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"A young American tourist, 젊은 미국인 관광객이. is sightseeing in England, 영국에서 관광을 하고 있다. and has just finished, 그리고 막 마쳤다. a tour of a famous old castle, 유명한 고성의 관광을. 이 문장 전체를 해석하면, 젊은 미국 관광객이 영국에서 관광을 하다가 유명한 고성 관광을 막 마쳤다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 배경을 깔아 주는 문장이에요. 젊은 미국인 관광객이 영국에서 관광을 하다가 유명한 고성 투어를 막 마친 상황 설정을 해 주죠. 여기서 has just finished는 방금 끝났다는 현재완료 표현이에요.","hl":"mn"},{"n":14,"text":"먼저 is sightseeing은 현재진행형이에요. be동사 뒤에 동사원형-ing, 그러니까 현재분사가 붙어서 지금 관광하고 있는 중이라는 뜻을 만들어요. 두 번째로 has just finished는 현재완료인데, have나 has 뒤에 과거분사가 온다는 공식을 꼭 기억해요. just가 함께 쓰여서 방금 막 완료되었다는 느낌을 강조해 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;어떠셨어요?&quot;\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">enjoy \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>?&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가이드가 그녀에게 묻는다.\u003c/span>\u003cspan class=\"en\">her guide asks her.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“어떠셨어요?”하고 가이드가 묻는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가이드가 관광을 마친 소녀에게 \u003cb class=\"key\">소감\u003c/b>을 묻는 장면이에요. enjoy it은 '그 관광을 즐겼다', 즉 '어떠셨어요'라는 \u003cb class=\"key\">의미\u003c/b>로 자연스럽게 옮겨 해석해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 있는 의문문(조동사 도치)\u003c/span> : [[의문사]] + did + 주어 + [[동사원형]] : \"(당신은 그것을) 어떻게 즐겼나요? = 어떠셨어요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사 + 목적어(대명사)\u003c/span> : enjoy + [[목적어]](it) : \"그것을 즐기다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"\"How did you enjoy it?\", \"어떠셨어요?\". her guide asks her, 가이드가 그녀에게 묻는다.. 이 문장 전체를 해석하면, “어떠셨어요?”하고 가이드가 묻는다.","hl":"m"},{"n":16,"text":"가이드가 관광을 마친 소녀에게 소감을 묻는 장면이에요. enjoy it은 그 관광을 즐겼다는 의미로, 우리말로는 어떠셨어요라고 자연스럽게 옮겨요.","hl":"mn"},{"n":17,"text":"먼저 How did you enjoy it을 볼게요. 의문사 How가 앞에 오고 조동사 did가 주어 you 앞으로 도치되는 의문문이에요. did가 이미 과거를 나타내니까 본동사는 동사원형 enjoy를 쓴다는 점도 꼭 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;아주 좋았어요,&quot;\u003c/span>\u003cspan class=\"en\">&quot;It was terrific,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여자가 대답한다,\u003c/span>\u003cspan class=\"en\">the girl replies,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;근데 나는 무서웠어요\u003c/span>\u003cspan class=\"en\">&quot;but I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">afraid\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유령이라도 만날까봐\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">run \u003c/span>\u003cspan class=\"tgt\">into\u003c/span> a ghost\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저 어두운 복도 중 하나에서&quot;\u003c/span>\u003cspan class=\"en\">in \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">dark \u003c/span>\u003cspan class=\"tgt\">passageways\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“아주 좋았어요,” 여자가 대답한다, “근데 어두운 복도에서 유령이라도 만날까봐 무서웠어요.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소녀가 아주 좋았다고 말하면서도 어두운 복도에서 유령을 만날까 봐 무서웠다고 \u003cb class=\"key\">덧붙이는\u003c/b> 문장이에요. terrific은 '아주 좋은'이라는 뜻이고, run into는 여기서 '\u003cb class=\"key\">우연히 \u003c/b>\u003cb class=\"key\">만나다\u003c/b>'라는 뜻으로 쓰였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be afraid (that)절의 that 생략\u003c/span> : be afraid + [(that) + 주어 + 조동사 + 동사원형] : \"~할까 봐 무서웠다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 might(추측) + 구동사\u003c/span> : might + [[동사원형]] + into : \"만날지도 모른다, 우연히 마주칠지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">one of + 복수명사\u003c/span> : one of + [[복수명사]] : \"저 어두운 복도들 중 하나\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"\"It was terrific,\", \"아주 좋았어요,\". the girl replies, 여자가 대답한다. \"but I was afraid, \"근데 나는 무서웠어요. I might run into a ghost, 유령이라도 만날까봐. in one of those dark passageways.\", 저 어두운 복도 중 하나에서\". 이 문장 전체를 해석하면, “아주 좋았어요,” 여자가 대답한다, “근데 어두운 복도에서 유령이라도 만날까봐 무서웠어요.”","hl":"m"},{"n":19,"text":"소녀가 아주 좋았다고 말하면서도 어두운 복도에서 유령을 만날까 봐 무서웠다고 덧붙이는 문장이에요. terrific은 아주 좋은이라는 뜻이고, run into는 여기서 우연히 만나다라는 뜻으로 쓰였어요.","hl":"mn"},{"n":20,"text":"첫 번째로 was afraid 뒤를 보세요. 원래 접속사 that이 와야 하는 자리에 that이 생략된 채로 명사절 I might run into가 바로 이어져요. 두 번째로 might run into에서 might는 할지도 모른다라는 추측의 조동사라서 뒤에 동사원형이 오고, run into는 우연히 만난다는 뜻의 구동사예요. 세 번째로 one of those dark passageways는 여러 개 중 하나라는 뜻이라서 one of 뒤에 반드시 복수명사 passageways가 온다는 규칙을 확인해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무것도 없다\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There's \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">nothing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걱정할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">worry \u003c/span>\u003cspan class=\"tgt\">about\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가이드가 말한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">says \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">guide\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">&quot;걱정할 것 없어요,&quot; 가이드가 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유령이 나올까 봐 무서워하는 여자를 가이드가 \u003cb class=\"key\">안심\u003c/b>시키는 장면이에요. '걱정할 것이 아무것도 없다'고 잘라 말하면서, 자신이 이 성에 아주 오래 있었다는 사실을 슬쩍 \u003cb class=\"key\">암시\u003c/b>해요. 그래서 이 한마디가 뒤에 나올 반전의 \u003cb class=\"key\">복선\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is 구문(유도부사 there)\u003c/span> : There + be동사 + 주어(~이 있다 / ~이 없다) : \"아무것도 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 nothing] + [to worry about (to부정사구가 명사를 뒤에서 수식)] : \"걱정할 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">인용문 뒤 주어·동사의 도치\u003c/span> : [인용문] + [동사 says] + [명사 주어 the guide] : \"가이드가 말한다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"\"There's nothing, 아무것도 없다. to worry about,\", 걱정할. says the guide, 가이드가 말한다. 이 문장 전체를 해석하면, \"걱정할 것 없어요,\" 가이드가 말한다.","hl":"m"},{"n":22,"text":"가이드가 겁먹은 여자를 안심시키는 대사예요. worry about은 '~에 대해 걱정하다'라는 뜻이죠. 여기서는 nothing이 앞에 나와서 '걱정할 것이 아무것도 없다'는 뜻이 됩니다.","hl":"mn"},{"n":23,"text":"첫 번째로 There's nothing은 there is 구문이에요. '~이 있다'라는 뜻으로, 뒤에 오는 nothing이 진짜 주어 역할을 하죠. 두 번째로 to worry about은 to부정사의 형용사적 용법으로 앞의 nothing을 꾸며 줍니다. 세 번째로 says the guide는 동사가 먼저 나오고 주어가 뒤로 간 도치 형태예요. 인용문 뒤에 명사 주어가 오면 이렇게 도치를 시킨다는 점, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 한 번도 본 적이 없다\u003c/span>\u003cspan class=\"en\">&quot;I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">seen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유령을\u003c/span>\u003cspan class=\"en\">a ghost\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 모든 시간 동안\u003c/span>\u003cspan class=\"en\">in all \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 여기 있어 온\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">here\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전 여기 있으면서 유령을 한 번도 못 봤어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가이드가 자신의 경험을 자신 있게 내세우는 문장이에요. 현재완료를 써서 '지금까지 단 한 번도' 유령을 못 봤다는 \u003cb class=\"key\">경험\u003c/b> 전체를 강조하고 있죠. 뒤에 이어질 '그럼 얼마나 계셨는데요'라는 질문과 삼백 년이라는 \u003cb class=\"key\">반전\u003c/b>을 준비하는 \u003cb class=\"key\">복선\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(경험)\u003c/span> : have/has + never + p.p.(과거분사) : \"한 번도 본 적이 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that의 생략\u003c/span> : [선행사 the time] + [(that/which) 생략] + [주어+동사 I have been here] : \"내가 여기 있어 온 시간\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"\"I have never seen, 나는 한 번도 본 적이 없다. a ghost, 유령을. in all the time, 그 모든 시간 동안. I have been here.\", 내가 여기 있어 온. 이 문장 전체를 해석하면, 전 여기 있으면서 유령을 한 번도 못 봤어요.","hl":"m"},{"n":25,"text":"가이드가 자기 경험을 자신 있게 말하는 대사예요. have never seen이라고 해서 지금까지 단 한 번도 유령을 못 봤다는 경험을 강조하죠. in all the time I have been here은 '내가 여기 있어 온 그 모든 시간 동안'이라는 뜻으로, 뒤에 나올 삼백 년이라는 반전을 준비하는 복선이에요.","hl":"mn"},{"n":26,"text":"첫 번째로 have never seen은 현재완료 경험 용법이에요. have에 과거분사 seen이 붙어서 '한 번도 ~한 적이 없다'라는 경험을 나타냅니다. 두 번째로 the time I have been here에서 the time 뒤에 목적격 관계대명사 that이 생략되어 있어요. 원래는 the time that I have been here인데 that이 빠진 형태죠. 그리고 그 안의 have been here는 현재완료 계속 용법으로 '여기 계속 있어 왔다'는 뜻이라는 것도 함께 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼마나 오래\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">long\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그게 ~인가요\u003c/span>\u003cspan class=\"en\">is that?&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 묻는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">asks\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">&quot;얼마나 계셨는데요?&quot; 그녀가 묻는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여자가 가이드의 말에서 \u003cb class=\"key\">기간\u003c/b>을 캐묻는 질문이에요. that은 가이드가 방금 말한 '여기 있어 온 시간'을 가리키죠. 이 짧은 되물음 덕분에 마지막 문장의 \u003cb class=\"key\">반전\u003c/b>이 자연스럽게 완성됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 How long (기간을 묻는 의문문)\u003c/span> : How long + be동사 + 주어? : \"얼마나 오래\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">인용문 뒤 대명사 주어는 도치하지 않음\u003c/span> : [인용문] + [대명사 주어 she] + [동사 asks] : \"그녀가 묻는다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"\"How long, 얼마나 오래. is that?\", 그게 ~인가요. she asks, 그녀가 묻는다. 이 문장 전체를 해석하면, \"얼마나 계셨는데요?\" 그녀가 묻는다.","hl":"m"},{"n":28,"text":"여자가 가이드의 말을 캐묻는 질문이에요. that은 앞에서 가이드가 말한 '여기 있어 온 시간'을 가리키죠. 이 짧은 질문 덕분에 마지막 문장의 반전이 완성됩니다.","hl":"mn"},{"n":29,"text":"첫 번째로 How long은 기간을 묻는 의문사예요. '얼마나 오래'라는 뜻으로 시간의 길이를 물을 때 쓰죠. 두 번째로 she asks를 보면 인용문 뒤에 대명사 주어가 왔을 때는 도치를 하지 않아요. 앞 문장의 says the guide처럼 명사 주어일 때만 도치가 일어난다는 차이를 꼭 비교해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아,\u003c/span>\u003cspan class=\"en\">&quot;Oh,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대략\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">300년 정도요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">300 \u003c/span>\u003cspan class=\"tgt\">years\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“ 300 년 정도요.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가이드가 &quot;얼마나 계셨는데요?&quot;라는 질문에 답하는 마지막 대사예요. 자신이 이 성에 \u003cb class=\"key\">삼백 \u003c/b>\u003cb class=\"key\">년\u003c/b> 동안 있었다고 말하는 순간, 가이드가 사실은 \u003cb class=\"key\">유령\u003c/b>이라는 사실이 드러나죠. 바로 앞에서 &quot;유령을 한 번도 못 봤다&quot;고 했던 말과 맞물려 웃음을 주는 \u003cb class=\"key\">반전\u003c/b>이 완성됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사(정도·수량 앞에서 '대략')\u003c/span> : [about + 숫자/수량] → '대략 ~, ~쯤' : \"대략\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">생략 구문(반복되는 주어·동사·전치사의 생략)\u003c/span> : [I have been here for] about 300 years → 반복되는 [[주어·동사·전치사]] 생략 : \"대략 삼백 년 (동안)\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Oh, 아. about, 대략. 300 years, 300년 정도요.. 이 문장 전체를 해석하면, “ 300 년 정도요.”","hl":"m"},{"n":31,"text":"이건 가이드의 마지막 대답이에요. 자기가 여기서 얼마나 있었냐는 질문에 삼백 년이라고 답하는 순간, 가이드가 사실은 유령이라는 게 드러나죠. 방금 유령을 한 번도 못 봤다고 했던 말이랑 딱 맞물려서 웃음이 나는 반전이에요.","hl":"mn"},{"n":32,"text":"먼저 about은 전치사가 아니라 수량 앞에서 '대략'이라는 정도를 더해 주는 부사예요. 두 번째로 앞 질문에 있던 I have been here for 같은 부분은 대화에서 통째로 생략되고, 대략 삼백 년이라는 핵심 정보만 남아요. 그래서 이 짧은 한마디가 기간 전체를 다 말해 주는 거죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>미국인 관광객이 영국에서 유명한 \u003cb class=\"key\">고성\u003c/b> 관광을 막 마치고 가이드와 대화를 나눈다.\u003c/li>\u003cli>관광객은 관광이 훌륭했지만 어두운 \u003cb class=\"key\">복도\u003c/b>에서 유령을 만날까 봐 무서웠다고 말한다.\u003c/li>\u003cli>가이드는 걱정할 것 없다며 자신은 이곳에서 \u003cb class=\"key\">유령\u003c/b>을 한 번도 본 적이 없다고 안심시킨다.\u003c/li>\u003cli>관광객이 얼마나 오래 있었느냐고 묻자 가이드가 \u003cb class=\"key\">삼백 \u003c/b>\u003cb class=\"key\">년\u003c/b> 정도라고 답해 반전이 완성된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The guide's claim that he has never seen a ghost in his three hundred years there humorously suggests that he himself is a ghost.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">미국인 관광객이 영국 고성에서 유령이 나올까 걱정하자 가이드가 유령을 본 적 없다고 안심시킨다. 그러나 가이드가 그곳에 머문 시간이 \u003cb class=\"key\">삼백 \u003c/b>\u003cb class=\"key\">년\u003c/b>이라는 말에 그는 \u003cb class=\"key\">유령\u003c/b>임이 드러난다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"정리해 보면 이 글은 영국 고성에서 관광객과 가이드가 나누는 짧은 대화로 시작해요. 관광객은 어두운 복도에서 유령이 나올까 걱정하지만 가이드는 유령을 본 적 없다며 안심시키죠. 그런데 가이드가 그곳에 머문 시간이 삼백 년이라고 밝혀지면서 반전이 완성돼요. 마지막 문장의 작은 정보가 앞의 의미를 어떻게 바꾸는지 눈여겨 읽어 보시고, 오늘 수업은 여기서 마무리하겠습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
