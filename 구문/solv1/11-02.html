<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 11강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 11강 적용독해02","audioDir":"11-02_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">11강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>A Phone Cover That Grows into a Sunflower\u003c/h1>\u003ch2>해바라기로 자라는 휴대폰 커버\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>휴대폰이 버려질 때 플라스틱과 화학물질로 환경을 오염시키는 문제를 줄이기 위해, 과학자들은 땅에서 분해되며 \u003cb class=\"key\">해바라기\u003c/b>로 자라는 \u003cb class=\"key\">휴대폰 \u003c/b>\u003cb class=\"key\">커버\u003c/b>를 개발했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Scientists have developed a biodegradable mobile phone cover that grows into a sunflower, offering some relief for nature.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 버려지면 해바라기로 자라는 아주 흥미로운 휴대폰 커버에 관한 지문을 함께 읽어 볼게요. 이 글은 환경 오염을 줄이기 위한 새로운 아이디어를 소개하고 있어요. 핵심은 땅에서 분해되는 소재로 만든 휴대폰 커버가 자연에 도움을 줄 수 있다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">휴대폰 같은 전자 제품이 버려지면 \u003cb class=\"key\">전자 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>가 되고, 이는 e-waste라고 불려요. 플라스틱과 화학물질은 땅과 물을 오염시켜 \u003cb class=\"key\">생태계\u003c/b>에 부담을 줍니다. 그래서 최근에는 땅속에서 스스로 분해되는 \u003cb class=\"key\">생분해\u003c/b> 소재, 즉 biodegradable material이 주목받아요. 이는 음식물 쓰레기나 종이컵이 흙으로 돌아가는 모습과 비슷한 원리예요. 식물 씨앗이 흙에서 싹트는 것처럼, 제품 안에 씨앗을 넣어 \u003cb class=\"key\">자연\u003c/b>으로 돌려보내는 발상도 가능해졌습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 휴대폰 같은 전자 제품이 버려지면 전자 쓰레기가 되고, 영어로는 electronic waste라고 불러요. 이런 쓰레기 속 플라스틱과 화학물질은 땅과 물을 오염시켜 생태계에 부담을 주죠. 그래서 최근에는 땅속에서 스스로 분해되는 생분해 소재, 즉 biodegradable material이 주목받고 있어요. 이건 음식물 쓰레기나 종이컵이 흙으로 돌아가는 모습과 비슷한 원리예요. 식물 씨앗이 흙에서 싹트는 것처럼, 제품 안에 씨앗을 넣어 자연으로 돌려보내는 발상도 가능해진 거죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>친환경 커버 개발\u003csmall>해결책 제시 · 문장 1\u003c/small>\u003c/h4>\u003cp>과학자들은 더 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">친화적\u003c/b>이 되려는 노력에서, 버려지면 \u003cb class=\"key\">해바라기\u003c/b>로 자라는 휴대폰 커버를 개발합니다. 이 문장은 글의 \u003cb class=\"key\">주제\u003c/b>를 처음에 제시합니다. 즉, 환경 문제를 의식한 새로운 발상이 글의 출발점입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>분해와 발아의 원리\u003csmall>작동 원리 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>이 커버는 땅에서 \u003cb class=\"key\">분해\u003c/b>되는 소재로 만들어집니다. 커버가 쓰레기로 바뀌면, 안에 심어 놓은 \u003cb class=\"key\">해바라기 \u003c/b>\u003cb class=\"key\">씨\u003c/b>가 싹을 틔워 자랍니다. 즉, 제품이 폐기된 뒤 \u003cb class=\"key\">자연\u003c/b>으로 돌아가는 원리를 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기존 휴대폰의 문제\u003csmall>문제 제기 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>매년 수백만 대의 휴대폰이 팔리지만, 대부분은 2년 안에 \u003cb class=\"key\">버려집니다\u003c/b>. 버려진 휴대폰은 플라스틱과 \u003cb class=\"key\">화학물질\u003c/b>로 환경을 오염시킵니다. 이는 새 커버가 필요한 \u003cb class=\"key\">문제\u003c/b>를 뒷받침합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>자연을 위한 결론\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>따라서 \u003cb class=\"key\">천연 \u003c/b>\u003cb class=\"key\">소재\u003c/b>로 만든 새 휴대폰 커버는 자연을 위해 어느 정도 \u003cb class=\"key\">도움\u003c/b>을 줄 것입니다. Therefore가 결론을 이끌며, 앞의 문제와 해결책을 하나로 묶습니다. 이는 글 전체의 주장을 간결하게 정리한 마무리입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 과학자들이 더 환경 친화적이 되려는 노력 속에서 새로운 휴대폰 커버를 개발했다는 점을 봐요. 이 커버는 나중에 버려지면 해바라기로 자란다는 재미있는 설정을 담고 있죠. 바로 이 문장이 글의 주제를 처음에 제시하는 역할을 해요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 그 커버가 어떻게 자연으로 돌아가는지 설명해요. 커버는 땅에서 분해되는 소재로 만들어지고, 쓰레기가 되면 안에 심어 둔 해바라기 씨가 싹을 틔워 자라죠. 즉, 폐기된 뒤에도 자연과 이어지는 원리를 보여 주는 부분이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 기존 휴대폰의 문제를 짚어요. 매년 수백만 대의 휴대폰이 팔리지만 대부분은 이 년 안에 버려집니다. 버려진 휴대폰은 플라스틱과 화학물질로 환경을 오염시키기 때문에, 새 커버가 필요한 문제를 분명히 뒷받침해 줘요.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 따라서 천연 소재로 만든 새 휴대폰 커버가 자연을 위해 어느 정도 도움을 줄 것이라고 정리해요. 앞에서 말한 환경 문제와 새로운 해결책을 하나로 묶는 결론이죠. 그래서 이 글은 작은 아이디어가 자연을 돕는다는 메시지를 전해요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 첫 문장에서 친환경 휴대폰 커버라는 \u003cb class=\"key\">해결책\u003c/b>을 먼저 내세우고, 뒤에서 기존 휴대폰이 환경을 오염시키는 \u003cb class=\"key\">문제\u003c/b>를 제시해 해결의 필요성을 뒷받침합니다. 다시 마지막 문장에서 새 커버가 자연에 \u003cb class=\"key\">도움\u003c/b>을 준다고 정리하므로, 주제를 앞에 두는 \u003cb class=\"key\">두괄식\u003c/b>으로 볼 수 있습니다. 문제와 해결의 짝이 분명해 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">해결\u003c/b> 전개로 읽으면 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Trying to be more environmentally friendly (1)\u003c/b>\u003cspan>목적 제시\u003c/span>\u003cb>When (3)\u003c/b>\u003cspan>시간·조건\u003c/span>\u003cb>Thrown away (5)\u003c/b>\u003cspan>원인·조건\u003c/span>\u003cb>Therefore (6)\u003c/b>\u003cspan>결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">more environmentally friendly\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">breaks down in the earth\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">turns to waste\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">thrown away\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pollute the environment\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">natural materials\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">relief for nature\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>기존 휴대폰\u003c/th>\u003cth>새 휴대폰 커버\u003c/th>\u003c/tr>\u003ctr>\u003ctd>플라스틱과 화학물질로 환경을 오염시킴\u003c/td>\u003ctd>천연 소재로 만들어져 땅에서 분해됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대부분 2년 안에 버려짐\u003c/td>\u003ctd>쓰레기가 되면 해바라기 씨가 싹을 틔움\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제 해결 전개 방식으로 읽을 수 있어요. 첫 문장에서 친환경 휴대폰 커버라는 해결책을 먼저 내세우고, 뒤에서 기존 휴대폰이 환경을 오염시키는 문제를 제시해 해결의 필요성을 보여 주죠. 마지막에는 새 커버가 자연에 도움을 준다고 정리해요. 주제를 앞에 두고 결론에서 다시 강조하므로 두괄식 구조로 볼 수 있고, 문제와 해결의 짝이 분명한 문제 해결 글입니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 첫 문장의 Trying to be more environmentally friendly가 목적을 알려 주고, 세 번째 문장의 When은 시간과 조건을 표시해요. 다섯 번째 문장의 Thrown away는 버려진 뒤라는 조건을 압축하고, 마지막의 Therefore는 결론으로 이끌죠. 또 environmentally friendly와 natural materials, pollute the environment와 relief for nature처럼 환경과 자연이라는 개념이 반복되고 확장되는 흐름도 눈여겨보세요. 기존 휴대폰의 오염과 새 커버의 자연 환원이 대조를 이룬다는 점도 함께 기억해 주세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>environmentally friendly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>환경 친화적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>develop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>개발하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mobile phone cover\u003c/b>\u003cem>명사\u003c/em>\u003cspan>휴대폰 커버\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 자라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be made out of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 만들어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>material\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소재, 재료\u003c/span>\u003c/div>\u003cdiv>\u003cb>break down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>분해되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>earth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>땅, 흙\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn to waste\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>쓰레기가 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>seed\u003c/b>\u003cem>명사\u003c/em>\u003cspan>씨앗\u003c/span>\u003c/div>\u003cdiv>\u003cb>plant\u003c/b>\u003cem>동사\u003c/em>\u003cspan>심다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inside\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 안에\u003c/span>\u003c/div>\u003cdiv>\u003cb>sprout\u003c/b>\u003cem>동사\u003c/em>\u003cspan>싹을 틔우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>millions of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>수백만의\u003c/span>\u003c/div>\u003cdiv>\u003cb>sell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>판매하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>throw away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>버리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>within\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 내에\u003c/span>\u003c/div>\u003cdiv>\u003cb>pollute\u003c/b>\u003cem>동사\u003c/em>\u003cspan>오염시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>plastic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>플라스틱\u003c/span>\u003c/div>\u003cdiv>\u003cb>chemical\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화학물질\u003c/span>\u003c/div>\u003cdiv>\u003cb>therefore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러므로\u003c/span>\u003c/div>\u003cdiv>\u003cb>natural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>천연의, 자연의\u003c/span>\u003c/div>\u003cdiv>\u003cb>provide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>relief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안도, 완화\u003c/span>\u003c/div>\u003cdiv>\u003cb>nature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자연\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 꼭 챙겨 볼게요. develop은 개발하다, break down은 분해되다, throw away는 버리다, pollute는 오염시키다라는 뜻이에요. natural은 천연의, relief는 완화나 안도라는 뜻으로 마지막 문장의 핵심을 잡아 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">develop\u003c/b>\u003cspan class=\"m\">개발하다\u003c/span>\u003cdiv class=\"lp-c 3cspan class=\"a\">synthetic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">relief\u003c/b>\u003cspan class=\"m\">안도, 완화\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comfort\u003c/span>\u003cspan class=\"s\">ease\u003c/span>\u003cspan class=\"s\">alleviation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003cspan class=\"a\">burden\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어로 어휘를 넓혀 볼까요? develop은 create, invent, produce와 가깝고 break down은 decompose, decay, rot처럼 말할 수 있어요. pollute는 contaminate, poison과 비슷하고 반대말은 purify, clean이에요. natural은 organic, green과 연결되고 반대말은 artificial, synthetic이죠. relief는 comfort, ease로 바꿔 말할 수 있으며 반대 방향은 harm, burden 정도로 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보다 환경 친화적이 되려는 노력에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Trying \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">environmentally \u003c/span>\u003cspan class=\"tgt\">friendly\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학자들은 개발했다\u003c/span>\u003cspan class=\"en\">scientists \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">developed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휴대폰 커버를\u003c/span>\u003cspan class=\"en\">a mobile phone cover\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해바라기로 자라는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">grows \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">sunflower\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">보다 환경 친화적이 되려는 노력에서 과학자들은 (나중에 버려지면) 해바라기로 자라는 휴대폰 커버를 개발했다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">친화적\u003c/b>인 제품 개발의 목적을 제시하며, 버려진 뒤 해바라기로 자라는 독특한 \u003cb class=\"key\">휴대폰 \u003c/b>\u003cb class=\"key\">커버\u003c/b>를 소개해요. 앞으로 이 커버의 소재와 원리를 설명할 \u003cb class=\"key\">도입\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(이유·목적)\u003c/span> : 접속사 + 주어 + 동사 → 동사원형-ing : \"보다 환경 친화적이 되려고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료(완료·결과)\u003c/span> : have/has + 과거분사 : \"개발했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 + that + 동사 ~ : \"해바라기로 자라는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Trying to be more environmentally friendly, 보다 환경 친화적이 되려는 노력에서. scientists have developed, 과학자들은 개발했다. a mobile phone cover, 휴대폰 커버를. that grows into a sunflower!, 해바라기로 자라는. 이 문장 전체를 해석하면, 보다 환경 친화적이 되려는 노력에서 과학자들은 (나중에 버려지면) 해바라기로 자라는 휴대폰 커버를 개발했다!","hl":"m"},{"n":13,"text":"이 문장은 환경 친화적인 제품 개발의 목적을 보여 주면서, 버려지면 해바라기로 자라는 휴대폰 커버를 소개하고 있어요. 글의 도입 부분에서 독자의 흥미를 끄는 역할을 하죠.","hl":"mn"},{"n":14,"text":"첫 번째로, Trying to be more environmentally friendly는 분사구문이에요. 주절 주어와 의미상 주어가 같아서 주어를 생략하고 목적을 나타낸 거죠. 두 번째로, have developed는 과거분사를 쓴 현재완료이고, 세 번째로, that grows into a sunflower는 주격 관계대명사 that절이에요. 선행사가 단수라서 grows를 쓴 점도 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 커버는\u003c/span>\u003cspan class=\"en\">The cover\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~로 만들어진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소재로\u003c/span>\u003cspan class=\"en\">a material\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분해되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">breaks \u003c/span>\u003cspan class=\"tgt\">down \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">땅에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">earth\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 커버는 땅에서 분해되는 소재로 만들어진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 소개한 \u003cb class=\"key\">휴대폰 \u003c/b>\u003cb class=\"key\">커버\u003c/b>가 \u003cb class=\"key\">생분해\u003c/b>되는 소재로 만들어졌음을 밝혀요. 'breaks down in the earth'는 땅속에서 \u003cb class=\"key\">분해되다\u003c/b>라는 뜻으로, 환경 오염을 줄일 수 있는 이유를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be made out of)\u003c/span> : be made out of + 재료 : \"~로 만들어진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 + that + 동사 ~ : \"땅에서 분해되는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The cover, 그 커버는. is made out of, ~로 만들어진다. a material, 소재로. that breaks down, 분해되는. in the earth, 땅에서. 이 문장 전체를 해석하면, 그 커버는 땅에서 분해되는 소재로 만들어진다.","hl":"m"},{"n":16,"text":"이 문장은 휴대폰 커버가 땅에서 생분해되는 소재로 만들어졌다는 점을 알려 줘요. breaks down은 분해되다라는 뜻이라서, 환경 오염을 줄일 수 있는 이유가 자연스럽게 드러나죠.","hl":"mn"},{"n":17,"text":"첫 번째로, is made out of는 수동태로, 주어가 재료로 만들어지는 대상임을 보여 줘요. 두 번째로, that breaks down은 주격 관계대명사절이고, 선행사 material이 단수라서 동사도 단수로 맞춘 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커버가 쓰레기로 바뀔 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cover \u003c/span>\u003cspan class=\"tgt\">turns \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">waste\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해바라기 씨가\u003c/span>\u003cspan class=\"en\">a sunflower seed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전화기 안에 심어놓은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">planted \u003c/span>\u003cspan class=\"tgt\">inside \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">phone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">싹을 틔워 자란다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">sprouts \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">grows\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">커버가 쓰레기로 바뀔 때 전화기 안에 심어놓은 해바라기 씨가 싹을 틔워 자란다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 커버가 \u003cb class=\"key\">쓰레기\u003c/b>로 변한 뒤 \u003cb class=\"key\">해바라기 \u003c/b>\u003cb class=\"key\">씨\u003c/b>가 싹을 틔우는 과정을 설명해요. 버려진 휴대폰 커버가 단순한 폐기물이 아니라 새 생명을 키우는 \u003cb class=\"key\">순환\u003c/b>의 사례가 된다는 점을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절(When)\u003c/span> : When + 주어 + 동사, 주절 ~ : \"커버가 쓰레기로 바뀔 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사(수동·한정적 용법)\u003c/span> : 명사 + 과거분사 + 수식어 : \"전화기 안에 심어놓은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬\u003c/span> : 동사 + and + 동사 : \"싹을 틔워 자란다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"When the cover turns to waste, 커버가 쓰레기로 바뀔 때. a sunflower seed, 해바라기 씨가. planted inside the phone, 전화기 안에 심어놓은. sprouts and grows, 싹을 틔워 자란다. 이 문장 전체를 해석하면, 커버가 쓰레기로 바뀔 때 전화기 안에 심어놓은 해바라기 씨가 싹을 틔워 자란다.","hl":"m"},{"n":19,"text":"이 문장은 커버가 쓰레기로 변한 뒤 해바라기 씨가 싹을 틔우는 과정을 설명해요. 버려진 커버가 새 생명을 키우는 순환의 사례가 된다는 점을 보여 주죠.","hl":"mn"},{"n":20,"text":"첫 번째로, When the cover turns to waste는 시간을 나타내는 부사절이고, 미래의 일도 현재시제로 표현해요. 두 번째로, planted inside the phone에서 과거분사 planted가 앞의 명사를 수식하고, 세 번째로, sprouts and grows는 and로 두 동사를 병렬로 연결한 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수백만 대의 휴대폰이\u003c/span>\u003cspan class=\"en\">Millions of mobile phones\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">올해 판매될 것인데,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">sold\u003c/span> this year,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 대부분은\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">버려질 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">thrown \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 년 안에.\u003c/span>\u003cspan class=\"en\">within two years.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">올해 수백만 대의 휴대폰이 판매될 것인데, 그 대부분이 2 년 내에 버려질 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 올해 팔리는 휴대폰의 양과 버려지는 속도를 \u003cb class=\"key\">수치\u003c/b>로 제시하는 문장이에요. 많이 팔리지만 아주 짧은 \u003cb class=\"key\">기간\u003c/b> 안에 버려진다는 사실이 뒤에 나올 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">오염\u003c/b>의 근거가 되죠. will be sold와 will be thrown away는 둘 다 \u003cb class=\"key\">수동태\u003c/b>로, 휴대폰이 팔리고 버려지는 대상임을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will + be + 과거분사 (미래 수동태)\u003c/span> : will + be + p.p. : \"올해 팔릴 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사 them의 지칭 (앞 명사 받기)\u003c/span> : most of + 목적격 대명사 : \"그 대부분은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태 + 구동사 throw away\u003c/span> : will + be + p.p. + away : \"버려질 것이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Millions of mobile phones, 수백만 대의 휴대폰이. will be sold this year, 올해 판매될 것인데. and most of them, 그리고 그 대부분은. will be thrown away, 버려질 것이다. within two years, 이 년 안에.. 이 문장 전체를 해석하면, 올해 수백만 대의 휴대폰이 판매될 것인데, 그 대부분이 2 년 내에 버려질 것이다.","hl":"m"},{"n":22,"text":"이 문장은 올해 팔리는 휴대폰의 수치와, 그 휴대폰이 얼마나 짧은 기간에 버려지는지를 같이 보여 줘요. 많이 팔리는데 쓰이는 기간은 아주 짧다는 것, 그게 바로 환경 오염 문제의 출발점이라는 거죠. 그래서 다음 문장의 오염 이야기로 자연스럽게 이어지는 근거를 깔아 주고, will be sold처럼 수동태를 써서 휴대폰이 팔리는 대상임을 보여 준답니다.","hl":"mn"},{"n":23,"text":"먼저 will be sold를 보세요. will 다음에 be가 오고 과거분사 sold가 이어지니까 미래 수동태예요. 주어인 휴대폰이 파는 사람이 아니라 팔리는 대상이라는 걸 이 형태가 딱 보여 주죠. 두 번째로 most of them에서 them은 앞에 나온 mobile phones를 가리키는 대명사예요. 세 번째로 will be thrown away도 똑같이 수동태인데, throw away가 하나의 덩어리로 버려지다라는 뜻을 만든다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">버려지면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Thrown \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휴대폰들은\u003c/span>\u003cspan class=\"en\">mobile phones\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경을 오염시킨다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">pollute \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">environment \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플라스틱과 화학물질로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">plastics \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">chemicals\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">버려지면, 휴대폰들은 플라스틱과 화학물질로 환경을 오염시킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 버려진다고 했으니, 그 버려진 휴대폰이 실제로 무엇을 망가뜨리는지 알려 주는 문장이에요. Thrown away는 '버려지면'이라는 \u003cb class=\"key\">분사구문\u003c/b>이고, 플라스틱과 \u003cb class=\"key\">화학물질\u003c/b>이라는 구체적인 오염원을 들어 \u003cb class=\"key\">오염\u003c/b>의 실체를 보여 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 부사적 용법 (분사구문)\u003c/span> : When + 주어 + be동사 + p.p. → p.p. : \"버려지면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">pollute A with B (수단·원인의 with)\u003c/span> : pollute + 목적어 + with + 오염원 : \"플라스틱과 화학물질로 환경을 오염시킨다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Thrown away, 버려지면. mobile phones, 휴대폰들은. pollute the environment, 환경을 오염시킨다. with plastics and chemicals, 플라스틱과 화학물질로.. 이 문장 전체를 해석하면, 버려지면, 휴대폰들은 플라스틱과 화학물질로 환경을 오염시킨다.","hl":"m"},{"n":25,"text":"앞 문장에서 휴대폰이 버려진다고 했죠. 그 버려진 휴대폰이 실제로 무엇을 망가뜨리는지 알려 주는 문장이에요. 플라스틱과 화학물질이라는 구체적인 재료를 들이대니까 오염이 추상적인 말이 아니라 눈에 보이는 문제로 느껴진답니다.","hl":"mn"},{"n":26,"text":"먼저 Thrown away를 보세요. 원래는 When mobile phones are thrown away인데, 주어와 be동사를 줄이고 과거분사만 남긴 분사구문이에요. 주어가 버려지는 쪽이니까 현재분사가 아니라 과거분사를 쓴다는 점이 핵심이에요. 그리고 pollute A with B는 A를 B로 오염시키다라는 덩어리 표현이고, with가 수단의 뜻을 담당한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로,\u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 휴대폰 커버는\u003c/span>\u003cspan class=\"en\">the new mobile phone cover\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천연 소재로 만들어진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">natural \u003c/span>\u003cspan class=\"tgt\">materials\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 정도 도움이 될 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">provide \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">relief \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연을 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">nature\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 천연 소재로 만들어진 새로운 휴대폰 커버는 자연(환경)을 위해 어느 정도 도움이 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Therefore로 앞의 문제를 정리하고 해결책을 제시하는 \u003cb class=\"key\">결론\u003c/b> 문장이에요. \u003cb class=\"key\">천연 \u003c/b>\u003cb class=\"key\">소재\u003c/b>로 만든 새 커버가 자연에 어느 정도 도움이 된다고 말하며 글을 긍정적으로 닫아 주죠. made of natural materials는 앞의 cover를 꾸미는 \u003cb class=\"key\">과거분사구\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 용법 (명사 수식)\u003c/span> : 명사 + made of + 재료 : \"천연 소재로 만들어진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 will + 동사원형 (미래)\u003c/span> : will + 동사원형 : \"제공할 것이다, 도움이 될 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">provide A for B (3형식 + 전치사구)\u003c/span> : provide + 목적어 + for + 대상 : \"자연을 위해 어느 정도 도움이 되다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Therefore, 그러므로. the new mobile phone cover, 새로운 휴대폰 커버는. made of natural materials, 천연 소재로 만들어진. will provide some relief, 어느 정도 도움이 될 것이다. for nature, 자연을 위해.. 이 문장 전체를 해석하면, 그러므로 천연 소재로 만들어진 새로운 휴대폰 커버는 자연(환경)을 위해 어느 정도 도움이 될 것이다.","hl":"m"},{"n":28,"text":"Therefore로 지금까지의 문제를 정리하고 해결책으로 넘어가는 결론 문장이에요. 천연 소재로 만든 커버가 자연에 어느 정도 도움이 된다고 말하면서 글을 희망적으로 닫아 주죠. 여기서 some은 큰 변화가 아니라 어느 정도라는 조심스러운 표현이라는 것도 눈여겨보세요.","hl":"mn"},{"n":29,"text":"첫 번째로 made of natural materials는 앞에 있는 the new mobile phone cover를 뒤에서 꾸며 주는 과거분사구예요. be made of는 재료로 만들어지다라는 뜻이고, 여기서는 be동사가 생략된 채 명사를 꾸미고 있죠. 두 번째로 will provide는 조동사 will 뒤에 동사원형이 온 미래 표현이에요. 세 번째로 provide A for B는 A를 B에게 제공하다라는 구조라서, some relief가 목적어이고 for nature가 전치사구라는 것도 함께 정리해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>과학자들은 환경 친화적인 \u003cb class=\"key\">휴대폰 \u003c/b>\u003cb class=\"key\">커버\u003c/b>를 개발했는데, 이 커버는 버려지면 \u003cb class=\"key\">해바라기\u003c/b>로 자란다.\u003c/li>\u003cli>이 커버는 땅에서 \u003cb class=\"key\">분해\u003c/b>되는 소재로 만들어져, 쓰레기가 되면 안에 심어진 \u003cb class=\"key\">해바라기 \u003c/b>\u003cb class=\"key\">씨\u003c/b>가 싹을 틔운다.\u003c/li>\u003cli>매년 수백만 대의 휴대폰이 팔리지만 대부분은 2년 안에 \u003cb class=\"key\">버려져\u003c/b>, 플라스틱과 \u003cb class=\"key\">화학물질\u003c/b>로 환경을 오염시킨다.\u003c/li>\u003cli>그러므로 \u003cb class=\"key\">천연 \u003c/b>\u003cb class=\"key\">소재\u003c/b>로 만든 새 커버는 자연을 위해 어느 정도 \u003cb class=\"key\">도움\u003c/b>을 줄 것이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Scientists have developed a biodegradable mobile phone cover that grows into a sunflower, offering some relief for nature.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">휴대폰이 버려질 때 플라스틱과 화학물질로 환경을 오염시키는 문제를 줄이기 위해, 과학자들은 땅에서 분해되며 \u003cb class=\"key\">해바라기\u003c/b>로 자라는 \u003cb class=\"key\">휴대폰 \u003c/b>\u003cb class=\"key\">커버\u003c/b>를 개발했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 글은 환경을 생각한 휴대폰 커버 이야기였어요. 이 커버는 땅에서 분해되는 소재로 만들어지고, 쓰레기가 되면 해바라기 씨가 싹을 틔워 해바라기로 자라죠. 반면 기존 휴대폰은 대부분 버려져 플라스틱과 화학물질로 환경을 오염시키지만, 천연 소재로 만든 새 커버는 자연에 도움을 줄 수 있어요. 이 결론을 꼭 기억하고 오늘 수업 마칠게요, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
