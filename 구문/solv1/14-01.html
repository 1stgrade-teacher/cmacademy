<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 14강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 14강 적용독해01","audioDir":"14-01_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">14강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Your Desk Is 400 Times Dirtier Than a Toilet Seat\u003c/h1>\u003ch2>당신의 책상은 변기 의자보다 400배 더럽다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>책상에 떨어진 치즈 스틱을 먹는 일상적 장면에서 출발해, 과학자들은 책상에 \u003cb class=\"key\">3만 \u003c/b>\u003cb class=\"key\">종의 \u003c/b>\u003cb class=\"key\">세균\u003c/b>이 있고 책상이 변기 의자보다 \u003cb class=\"key\">400배\u003c/b> 더럽다는 사실을 밝힌다. 따라서 특별한 \u003cb class=\"key\">면역 \u003c/b>\u003cb class=\"key\">강화\u003c/b> 목적이 없다면 책상에 있는 음식을 먹지 말아야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The passage warns that the desk you think is clean can be far dirtier than a toilet seat, so you should avoid eating food from it unless you have a special reason to expose yourself to many germs.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 시험 전날 책상 위에 떨어진 치즈 스틱을 먹는 상황에서 시작해요. 이 글은 우리가 두 번째 집처럼 생각하는 책상이 사실은 변기 의자보다 훨씬 더럽다는 과학적 사실을 전해 줘요. 그래서 글쓴이는 특별한 목적이 없다면 책상에서 먹지 말라고 말하고 있죠. 오늘 수업의 요지는 책상 위 음식과 세균, 그리고 위생이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리 주변에는 눈에 보이지 않는 \u003cb class=\"key\">세균\u003c/b>(germs)이 아주 많습니다. 세균은 손잡이, 스마트폰, 책상처럼 자주 만지는 표면에 잘 붙습니다. 우리 몸의 \u003cb class=\"key\">면역 \u003c/b>\u003cb class=\"key\">체계\u003c/b>(immune system)는 세균에 조금씩 노출되며 훈련되지만, 너무 많은 세균은 건강을 해칠 수 있습니다. 깨끗해 보이는 주방 행주가 실은 세균 덩어리일 수 있는 것처럼, 겉으로 보이는 청결과 실제 위생은 다를 수 있습니다. 변기 의자(toilet seat)는 더럽다고 생각하지만, 책상은 공부하는 공간이라 깨끗하다고 착각하기 쉽습니다. 그래서 표면의 \u003cb class=\"key\">위생\u003c/b>(hygiene)을 생각하며 음식을 먹는 습관을 점검할 필요가 있습니다.\u003c/div>","segs":[{"n":2,"text":"우리 주변에는 눈에 보이지 않는 germs가 아주 많아요. germs는 손잡이, 스마트폰, 책상처럼 자주 만지는 표면에 잘 붙어요. 우리 몸의 immune system은 이런 germs에 조금씩 노출되며 훈련되지만, 너무 많은 germs는 건강을 해칠 수 있죠. 변기 의자는 더럽다고 생각하지만, 책상은 공부하는 공간이라 깨끗하다고 착각하기 쉬워요. 실제로 책상은 toilet seat보다 훨씬 많은 germs가 있을 수 있어요. 그래서 표면의 hygiene을 생각하며 음식을 먹는 습관을 점검할 필요가 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>간식이 떨어진 순간\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>시험 전날 하루 종일 공부하던 학생에게 엄마가 \u003cb class=\"key\">간식\u003c/b>을 가져다줍니다. 그런데 치즈 스틱이 책상 위로 떨어지고, 학생은 어떻게 할지 잠깐 고민하죠. 이 장면은 누구나 겪을 수 있는 \u003cb class=\"key\">일상적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>먼지 털고 먹기\u003csmall>통념 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>학생은 별일 아니라고 생각하며 치즈 스틱을 집어 듭니다. 입으로 불어 \u003cb class=\"key\">먼지\u003c/b>를 털어내고 그대로 먹죠. '어차피 내 책상이니까'라는 생각이 깔려 있는 \u003cb class=\"key\">통념\u003c/b>을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>과학적 사실\u003csmall>전환 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>하지만 과학자들은 방금 입에 넣은 치즈 스틱에 책상에서 묻은 \u003cb class=\"key\">3만 \u003c/b>\u003cb class=\"key\">종의 \u003c/b>\u003cb class=\"key\">세균\u003c/b>이 있다고 말합니다. 우리가 제2의 집으로 여긴 책상은 변기 의자보다 \u003cb class=\"key\">400배\u003c/b> 더럽고, 변기 의자의 세균은 49개 정도에 불과하죠. 이 부분에서 일상의 통념이 \u003cb class=\"key\">반박\u003c/b>됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>먹지 말라는 주장\u003csmall>주장 · 문장 11\u003c/small>\u003c/h4>\u003cp>그래서 글쓴이는 일부러 많은 세균에 노출되어 \u003cb class=\"key\">면역체계\u003c/b>를 강화하려는 특별한 목적이 아니라면 책상에서 먹지 말라고 조언합니다. 이 문장이 글 전체의 \u003cb class=\"key\">주장\u003c/b>을 분명히 밝힙니다. 일상적 행동에 대한 과학적 근거가 결론으로 이어지는 구조예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 간식이 떨어진 순간이에요. 시험 전날 하루 종일 공부하던 학생에게 엄마가 간식을 가져다줍니다. 그런데 치즈 스틱이 책상 위로 떨어지고, 학생은 어떻게 할지 잠깐 고민하죠. 이 장면은 누구나 겪을 수 있는 일상적 상황을 보여 줘요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 먼지 털고 먹기예요. 학생은 별일 아니라고 생각하며 치즈 스틱을 집어 듭니다. 입으로 불어 먼지를 털어내고 그대로 먹죠. 어차피 내 책상이라는 생각이 깔린 통념을 보여 줍니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 과학적 사실이에요. 하지만 과학자들은 방금 입에 넣은 치즈 스틱에 책상에서 묻은 삼만 종의 세균이 있다고 말합니다. 우리가 두 번째 집으로 여긴 책상은 변기 의자보다 사백 배 더럽고, 변기 의자의 세균은 사십구 개 정도에 불과하죠. 이 부분에서 일상의 통념이 반박됩니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 먹지 말라는 주장이에요. 그래서 글쓴이는 일부러 많은 세균에 노출되어 면역체계를 강화하려는 특별한 목적이 아니라면 책상에서 먹지 말라고 조언합니다. 이 문장이 글 전체의 주장을 분명히 밝히죠. 일상적 행동에 대한 과학적 근거가 결론으로 이어지는 구조예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 '책상에 떨어진 음식을 먹어도 괜찮다'는 \u003cb class=\"key\">통념\u003c/b>에서 출발합니다. 그러나 과학자들의 발견이라는 \u003cb class=\"key\">근거\u003c/b>를 제시하며 그 통념을 뒤집고, 마지막에 책상에서 먹지 말라는 \u003cb class=\"key\">주장\u003c/b>을 내세웁니다. 결론이 글 끝에 나오므로 \u003cb class=\"key\">미괄식\u003c/b> 전개로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>After all (8)\u003c/b>\u003cspan>통념 강화\u003c/span>\u003cb>However (9)\u003c/b>\u003cspan>전환·반박\u003c/span>\u003cb>So (11)\u003c/b>\u003cspan>결론·주장\u003c/span>\u003cb>unless (11)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">picked up 30,000 kinds of germs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">is 400 times dirtier than your toilet seat\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">exposing it to as many germs as possible\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>책상\u003c/th>\u003cth>변기 의자\u003c/th>\u003c/tr>\u003ctr>\u003ctd>공부하고 간식 먹는 제2의 집\u003c/td>\u003ctd>더럽다고 여기는 장소\u003c/td>\u003c/tr>\u003ctr>\u003ctd>세균이 3만 종이나 묻어 있음\u003c/td>\u003ctd>세균이 약 49개뿐임\u003c/td>\u003c/tr>\u003ctr>\u003ctd>변기 의자보다 400배 더러움\u003c/td>\u003ctd>책상보다 훨씬 깨끗함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 책상에 떨어진 음식을 먹어도 괜찮다는 통념에서 출발해요. 그러나 과학자들의 발견이라는 근거를 제시하며 그 통념을 뒤집고, 마지막에 책상에서 먹지 말라는 주장을 내세우죠. 결론이 글 끝에 나오니까 미괄식 전개로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"먼저 After all은 어차피 내 책상이니 괜찮다는 통념을 강화하는 신호예요. However는 앞의 생각을 뒤집으며 과학적 사실로 전환한다는 것을 알려 주죠. 마지막의 So는 결론과 주장을 이끌고, unless는 특별한 조건이 아니면 먹지 말라는 의미를 분명히 해 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>have a test\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시험을 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>all day\u003c/b>\u003cem>부사\u003c/em>\u003cspan>하루 종일\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>두고 가다, 남기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>plateful\u003c/b>\u003cem>명사\u003c/em>\u003cspan>한 접시 가득\u003c/span>\u003c/div>\u003cdiv>\u003cb>snack\u003c/b>\u003cem>명사\u003c/em>\u003cspan>간식\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집어 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cheese stick\u003c/b>\u003cem>명사\u003c/em>\u003cspan>치즈 스틱\u003c/span>\u003c/div>\u003cdiv>\u003cb>fall\u003c/b>\u003cem>동사\u003c/em>\u003cspan>떨어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>no problem\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>문제없어, 괜찮아\u003c/span>\u003c/div>\u003cdiv>\u003cb>blow off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>불어서 털어내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dust\u003c/b>\u003cem>명사\u003c/em>\u003cspan>먼지\u003c/span>\u003c/div>\u003cdiv>\u003cb>after all\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어차피, 결국\u003c/span>\u003c/div>\u003cdiv>\u003cb>scientist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아내다, 발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>put in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>넣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>germ\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세균\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>여기다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>second home\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제2의 집\u003c/span>\u003c/div>\u003cdiv>\u003cb>dirty\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>toilet seat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변기 의자\u003c/span>\u003c/div>\u003cdiv>\u003cb>unless\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~하지 않는 한\u003c/span>\u003c/div>\u003cdiv>\u003cb>remarkable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대단한, 놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>goal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목적, 목표\u003c/span>\u003c/div>\u003cdiv>\u003cb>strengthen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>immune system\u003c/b>\u003cem>명사\u003c/em>\u003cspan>면역 체계\u003c/span>\u003c/div>\u003cdiv>\u003cb>expose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>노출시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>as many as possible\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가능한 한 많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어로는 germs, dirtier, toilet seat, immune system을 꼭 기억해 두세요. pick up은 집어 들다라는 뜻도 있지만, germs와 함께 쓰이면 세균이 묻다, 얻다라는 의미로 확장돼요. avoid는 피하다, expose는 노출시키다로 정리해 두면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">dirty\u003c/b>\u003cspan class=\"m\">더러운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">filthy\u003c/span>\u003cspan class=\"s\">unclean\u003c/span>\u003cspan class=\"s\">soiled\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clean\u003c/span>\u003csp 03c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">pick up\u003c/b>\u003cspan class=\"m\">집어 들다; (세균 등이) 묻다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lift\u003c/span>\u003cspan class=\"s\">collect\u003c/span>\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">drop\u003c/span>\u003cspan class=\"a\">put down\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. dirty는 filthy, unclean과 가깝고 clean, spotless와 반대돼요. avoid는 evade, prevent와 비슷하고 seek, face와 반대되죠. strengthen은 reinforce, boost와 가깝고 weaken과 반대됩니다. expose는 reveal, uncover와 비슷하고 hide, protect와 반대라는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 내일 시험이 있다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">test\u003c/span> tomorrow,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 너는 공부를 계속해 오고 있다\u003c/span>\u003cspan class=\"en\">and you've been studying\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하루 종일\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내일이 시험이라 하루 종일 공부를 하고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 내일 시험이라는 상황을 깔아 주는 \u003cb class=\"key\">배경\u003c/b> 문장이에요. 하루 종일 공부해 온 학생이라는 설정이 뒤에 나오는 책상 위 간식 사건으로 자연스럽게 이어지죠. 현재완료진행은 과거에 시작한 공부가 지금까지 \u003cb class=\"key\">계속\u003c/b>되고 있다는 느낌을 전해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재시제로 미래 일정 표현\u003c/span> : 주어 + have + a test + [미래를 나타내는 부사 tomorrow] : \"내일 시험이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">기간을 나타내는 부사구\u003c/span> : [동사구] + all day (기간의 부사구) : \"하루 종일\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">현재완료진행형(have/has been + -ing)\u003c/span> : have/has + been + [현재분사(-ing)] : \"공부를 계속해 오고 있다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"You have a test tomorrow, 너는 내일 시험이 있다. and you've been studying, 그리고 너는 공부를 계속해 오고 있다. all day, 하루 종일. 이 문장 전체를 해석하면, 내일이 시험이라 하루 종일 공부를 하고 있었다.","hl":"m"},{"n":13,"text":"이 문장은 내일 시험이라는 상황을 깔아 주는 배경 문장이에요. 하루 종일 공부한 학생이라는 설정이 뒤에 나오는 책상 위 간식 사건으로 자연스럽게 이어지죠. 현재완료진행은 과거에 시작한 공부가 지금까지 계속되고 있다는 느낌을 줍니다.","hl":"mn"},{"n":14,"text":"먼저 have a test tomorrow에서 현재시제에 미래 부사가 붙으면 예정된 미래를 나타낼 수 있어요. 두 번째로 have been studying은 현재완료진행으로, 공부가 지금까지 계속되고 있음을 보여 주죠. 마지막으로 all day는 기간을 나타내는 부사구로, 하루 종일이라는 시간만큼 동작이 이어졌음을 알려 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄마가 들어오셔서\u003c/span>\u003cspan class=\"en\">Your mother \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">comes \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 간식을 한 접시 두고 가신다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">leaves \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">plateful \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">snacks \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네 책상 위에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">desk\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">엄마가 들어오셔서 책상 위에 간식을 한 접시 두고 가신다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엄마가 간식을 갖다 주는 장면으로 이야기의 \u003cb class=\"key\">사건\u003c/b>을 시작하는 문장이에요. 여기서 나온 '간식 한 접시'가 뒤에 나오는 치즈 스틱 사건의 \u003cb class=\"key\">원인\u003c/b>이 되죠. leaves가 '떠나다'가 아니라 '\u003cb class=\"key\">두고 \u003c/b>\u003cb class=\"key\">가다\u003c/b>'라는 뜻으로 쓰였다는 점이 중요해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수일치(3인칭 단수 현재)\u003c/span> : [단수 주어 Your mother] + [동사 + -s/-es] : \"들어오신다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">leave + 목적어 + 장소 전치사구\u003c/span> : leave + [목적어 a plateful of snacks] + [장소 on your desk] : \"간식을 네 책상 위에 두고 가신다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수량 표현(단위명사 + of + 복수명사)\u003c/span> : a plateful of + [복수명사 snacks] : \"간식 한 접시\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Your mother comes in, 엄마가 들어오셔서. and leaves a plateful of snacks, 그리고 간식을 한 접시 두고 가신다. on your desk, 네 책상 위에. 이 문장 전체를 해석하면, 엄마가 들어오셔서 책상 위에 간식을 한 접시 두고 가신다.","hl":"m"},{"n":16,"text":"이 문장은 엄마가 간식을 갖다 주는 장면으로 이야기의 사건을 시작해요. 여기서 나온 간식 한 접시가 뒤에 나오는 치즈 스틱 사건의 원인이 되죠. leaves가 떠나다가 아니라 두고 가다라는 뜻이라는 점을 꼭 기억해 두세요.","hl":"mn"},{"n":17,"text":"먼저 comes in은 주어가 단수 주어라서 동사에 -s가 붙은 수일치 형태예요. leaves도 같은 이유로 -s가 붙았고, 여기서는 두고 가다라는 뜻으로 쓰였어요. 그리고 a plateful of snacks는 단위명사로 양을 세는 표현이고, of 뒤에는 복수명사가 온다는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치즈 스틱을 집는데\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">pick \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">cheese \u003c/span>\u003cspan class=\"tgt\">stick\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데, 이런!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> ... uh-oh!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">치즈 스틱을 집는데, 이런!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 치즈 스틱을 집어 드는 동작과 함께 uh-oh라는 감탄사로 \u003cb class=\"key\">사고\u003c/b>의 순간을 암시하는 문장이에요. 말줄임표가 잠깐의 긴장을 만들고, uh-oh가 '아차' 하는 \u003cb class=\"key\">실수\u003c/b>의 느낌을 전해 주죠. pick up은 '집어 들다'라는 뜻의 \u003cb class=\"key\">구동사\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(동사 + 부사) pick up\u003c/span> : pick + up + [목적어 a cheese stick] : \"치즈 스틱을 집다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and\u003c/span> : [동사구] + and + [이어지는 내용] : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"You pick up a cheese stick, 치즈 스틱을 집는데. and ... uh-oh!, 그런데, 이런!. 이 문장 전체를 해석하면, 치즈 스틱을 집는데, 이런!","hl":"m"},{"n":19,"text":"이 문장은 치즈 스틱을 집어 드는 동작과 함께 uh-oh라는 감탄사로 사고의 순간을 암시해요. 말줄임표가 잠깐의 긴장을 만들고, uh-oh가 아차 하는 실수의 느낌을 전해 주죠. pick up은 집어 들다라는 뜻의 구동사예요.","hl":"mn"},{"n":20,"text":"먼저 pick up은 pick과 up이 만나 집어 들다라는 뜻을 만드는 구동사예요. 목적어가 명사일 때는 up 뒤에 두지만, 대명사일 때는 pick it up처럼 사이에 넣는다는 것도 기억해 두세요. 그리고 and는 앞 동작과 뒤 상황을 병렬로 이어 주는 등위접속사이고, 뒤에 uh-oh가 와서 사고의 순간을 강조해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">떨어진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">falls\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 책상 위에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">desk\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">책상 위에 떨어져버린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 집어 든 치즈 스틱이 손에서 미끄러져 책상 위로 떨어지는 순간을 담은 문장이에요. 주어 It은 바로 앞의 \u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">cheese \u003c/b>\u003cb class=\"key\">stick\u003c/b>을 가리키죠. '어? 떨어졌네' 하고 상황이 \u003cb class=\"key\">문제\u003c/b> 쪽으로 넘어가기 시작하는 신호탄이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3인칭 단수 현재시제\u003c/span> : [주어 It] + [falls (동사원형 fall + -s)] : \"떨어진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 on의 장소 표현(부사구)\u003c/span> : [falls (동사)] + [on + your desk (전치사구/장소)] : \"당신의 책상 위에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It, 그것은. falls, 떨어진다. on your desk, 당신의 책상 위에. 이 문장 전체를 해석하면, 책상 위에 떨어져버린다.","hl":"m"},{"n":22,"text":"여기서 It은 앞에서 집어 든 a cheese stick을 가리켜요. 결국 치즈 스틱이 손에서 미끄러져 책상 위로 떨어지는 장면이고, 바로 이 순간부터 문제가 시작되는 거예요.","hl":"mn"},{"n":23,"text":"첫 번째, 주어 It이 3인칭 단수니까 동사 fall에 -s를 붙여 falls, 현재시제로 쓴 거예요. 두 번째, on your desk에서 on은 표면에 닿아 있다는 접촉의 느낌을 가진 전치사라서, 책상 위라는 장소를 나타내 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 하나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떻게 하지?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 떨어진 치즈 스틱을 두고 독자에게 '자, 이럴 땐 어떻게 할까요?' 하고 \u003cb class=\"key\">질문\u003c/b>을 던지는 문장이에요. 답을 요구하는 진짜 질문이 아니라, 독자를 이야기 속으로 끌어들이는 \u003cb class=\"key\">수사적 \u003c/b>\u003cb class=\"key\">의문문\u003c/b>이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 목적어로 쓰인 의문문\u003c/span> : [What (의문사/목적어)] + [do + 주어 + 동사원형?] : \"무엇을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">do동사 의문문(조동사 do + 주어 도치)\u003c/span> : [Do (조동사) + 주어 you + do (본동사 원형)?] : \"당신은 ~하나요\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"What, 무엇을. do you do?, 당신은 하나요. 이 문장 전체를 해석하면, 어떻게 하지?","hl":"m"},{"n":25,"text":"떨어진 치즈 스틱을 두고 독자에게 질문을 던지는 문장이에요. 진짜 대답을 듣기 위한 질문이 아니라, 독자를 이야기 속으로 끌어들이는 수사적 의문문이죠.","hl":"mn"},{"n":26,"text":"첫 번째, What은 원래 두 번째 do 뒤에 있던 목적어가 앞으로 도치된 의문사예요. 두 번째, do you do에서는 주어 you와 자리를 바꾸는 도치가 일어나고, 앞의 do는 조동사, 뒤의 do는 '하다'라는 본동사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">없는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">No \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문제\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">problem\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">괜찮아.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 질문에 대한 대답으로, '별일 아니야, 문제없어'라고 상황을 가볍게 넘기는 \u003cb class=\"key\">감탄\u003c/b> 표현이에요. 이 말 덕분에 독자는 안심하고, 바로 다음 문장에서 '집어서 먹어 버린다'는 \u003cb class=\"key\">행동\u003c/b>으로 자연스럽게 이어지죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is 생략 구문(부정 형용사 no + 명사)\u003c/span> : [No (형용사/부정어)] + [problem (명사)] ← (There is) no problem. : \"문제 없음\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"No, 없는. problem, 문제. 이 문장 전체를 해석하면, 괜찮아.","hl":"m"},{"n":28,"text":"앞에서 던진 질문에 대한 대답이에요. 별일 아니라고 가볍게 넘기는 감탄 표현이라서, 독자는 자연스럽게 다음 행동으로 넘어가게 되죠.","hl":"mn"},{"n":29,"text":"첫 번째, 원래는 There is no problem이라는 완전한 문장인데 회화에서는 앞부분을 생략하고 짧게 던진 거예요. no는 '하나도 없는'이라는 부정의 뜻으로 명사 problem을 꾸며 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 집고,\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">pick \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">up, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불어서 먼지를 털어내고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">blow \u003c/span>\u003cspan class=\"tgt\">off \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">dust \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 먹는 거야.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">eat \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것을 집고, 불어서 먼지를 털어내고 먹는 거야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시험 전날 책상에 떨어진 과자를 별생각 없이 처리하는 학생의 \u003cb class=\"key\">습관적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 세 동작으로 생생하게 보여 주는 문장이에요. pick it up, blow off, eat it이 and로 이어지며 \u003cb class=\"key\">연속 \u003c/b>\u003cb class=\"key\">동작\u003c/b>을 리듬감 있게 전달하죠. 이 사소한 장면이 뒤에 나오는 과학적 사실과 \u003cb class=\"key\">대조\u003c/b>를 이루는 장치가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 병렬구조\u003c/span> : [pick up] + [blow off] + [eat] + and → 같은 주어의 동작을 동일한 형태로 연결 : \"집어 들고, 먼지를 털어내고, 먹는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사와 대명사 목적어의 어순\u003c/span> : pick + it(대명사 목적어) + up(부사) : \"그것을 집어 들다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"You pick it up, 그것을 집고. blow off the dust, 불어서 먼지를 털어내고. and eat it, 그리고 먹는 거야.. 이 문장 전체를 해석하면, 그것을 집고, 불어서 먼지를 털어내고 먹는 거야.","hl":"m"},{"n":31,"text":"이 문장은 시험 전날 책상에서 과자를 떨어뜨린 학생이 별생각 없이 보이는 습관적 행동을 담고 있어요. 집고, 털고, 먹는 연속 동작이 and로 이어지면서 아주 자연스럽게 읽히죠. 그리고 이 사소한 장면이 뒤에 나오는 과학적 사실과 대조를 이룬다는 점도 꼭 기억해 두세요.","hl":"mn"},{"n":32,"text":"첫 번째로 pick up, blow off, eat은 모두 주어 You가 하는 동작이라서 병렬구조로 묶여 있어요. 그래서 세 동작의 형태를 똑같이 동사원형으로 맞춰 줍니다. 두 번째로 pick it up을 보면 목적어가 대명사일 때는 구동사를 분리해서 동사와 부사 사이에 넣는다는 규칙이 보여요. 이 어순은 서술형에서도 자주 물어보니까 손으로 써 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어차피,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 단지 ~일 뿐이야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 책상이니까.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">desk\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어차피 당신의 책상이니까.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 먼지를 털어 먹은 행동을 스스로 \u003cb class=\"key\">정당화\u003c/b>하는 문장이에요. After all은 '어차피, 결국'이라는 뜻으로 앞 내용에 \u003cb class=\"key\">이유\u003c/b>를 덧붙이죠. only가 붙어 '내 책상일 뿐이니 \u003cb class=\"key\">괜찮다\u003c/b>'는 안심의 뉘앙스를 만들어 냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 부사구 After all (이유·정당화)\u003c/span> : [After all], + 문장 → 문장 전체를 수식하는 부사구 : \"어차피, 결국\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한정 부사 only의 위치와 강조\u003c/span> : only + [한정하는 명사구] : \"단지 당신의 책상일 뿐이야\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"After all, 어차피. it's only, 그것은 단지 ~일 뿐이야. your desk, 당신의 책상이니까.. 이 문장 전체를 해석하면, 어차피 당신의 책상이니까.","hl":"m"},{"n":34,"text":"이 문장은 앞에서 먼지를 털어 먹은 행동을 스스로 정당화하는 대사예요. After all은 어차피, 결국이라는 뜻으로 앞 내용에 대한 이유를 덧붙여 주죠. only가 붙으면서 내 책상일 뿐이니 괜찮다는 안심의 뉘앙스가 생깁니다.","hl":"mn"},{"n":35,"text":"첫 번째로 After all은 문장 앞에서 전체 내용에 이유를 더해 주는 부사구예요. 결국 그렇다는 뜻으로 앞 문장을 정당화할 때 자주 씁니다. 두 번째로 only는 강조하고 싶은 말 바로 앞에 놓여서 한정의 뜻을 만들어요. 여기서는 your desk 앞에 와서 내 책상일 뿐이라는 안심의 뉘앙스를 더해 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학자들은 알아냈다\u003c/span>\u003cspan class=\"en\">scientists \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치즈 스틱이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cheese \u003c/span>\u003cspan class=\"tgt\">stick \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 방금 입에 넣은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you've \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">mouth\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3만 종의 세균을 묻혔다는 사실을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">picked \u003c/span>\u003cspan class=\"tgt\">up\u003c/span> 30,000 kinds of germs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 책상으로부터\u003c/span>\u003cspan class=\"en\">from your desk.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 과학자들은 당신이 방금 입에 넣은 치즈 스틱에는 책상에 있던 3 만 종의 세균이 묻어있다는 사실을 알아냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 '어차피 내 책상이니까' 하며 안심하던 흐름을 한 번에 뒤집는 \u003cb class=\"key\">반전\u003c/b> 문장이에요. 현재완료 have found로 과학자들이 지금까지 밝혀낸 \u003cb class=\"key\">연구 \u003c/b>\u003cb class=\"key\">결과\u003c/b>임을 강조하고, that절 안에서 다시 has picked up을 써서 이미 오염된 상태임을 보여 주죠. 뒤에 나오는 avoid eating from your desk라는 결론의 \u003cb class=\"key\">근거\u003c/b>가 되는 글의 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 + 접속사 that이 이끄는 명사절(목적어)\u003c/span> : have/has + 과거분사 + that + 주어 + 동사 : \"~라는 사실을 알아냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : [선행사] + (which/that) + 주어 + 동사 + 목적어 : \"당신이 방금 입에 넣은 치즈 스틱\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치 (that절 주어 the cheese stick)\u003c/span> : [단수 주어 the cheese stick] + has + 과거분사 : \"(세균을) 묻혀 왔다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"However, 하지만. scientists have found, 과학자들은 알아냈다. that the cheese stick, 치즈 스틱이. you've just put in your mouth, 당신이 방금 입에 넣은. has picked up 30,000 kinds of germs, 3만 종의 세균을 묻혔다는 사실을. from your desk, 당신의 책상으로부터. 이 문장 전체를 해석하면, 하지만, 과학자들은 당신이 방금 입에 넣은 치즈 스틱에는 책상에 있던 3 만 종의 세균이 묻어있다는 사실을 알아냈다.","hl":"m"},{"n":37,"text":"이 문장은 어차피 내 책상이니까 하고 안심하던 흐름을 한 번에 뒤집는 반전 문장이에요. 현재완료 have found로 과학자들이 지금까지 밝혀낸 연구 결과라는 점을 강조하고 있죠. 그리고 뒤에 나오는 avoid eating from your desk라는 결론의 근거가 되는 아주 중요한 문장입니다.","hl":"mn"},{"n":38,"text":"첫 번째로 have found는 현재완료 형태로, 과거의 발견이 지금까지 영향을 준다는 뜻을 담고 있어요. 뒤에 오는 that절은 found의 목적어 역할을 하는 명사절입니다. 두 번째로 the cheese stick 뒤에는 목적격 관계대명사가 생략되어 있어서, put의 목적어 자리가 비어 있고 그 자리에 선행사가 들어간다고 보면 돼요. 세 번째로 has picked up에서 주어는 the cheese stick이라서 단수로 보고 has를 썼습니다. 주어와 동사 사이에 긴 수식어가 끼어도 수 일치는 진짜 주어에 맞춘다는 점, 시험에 꼭 나오니까 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 책상은\u003c/span>\u003cspan class=\"en\">The desk\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 생각해온\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">considered \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 제2의 집으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">second \u003c/span>\u003cspan class=\"tgt\">home\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 공부도 하고 간식도 먹는 곳\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\ 003c/b>이 있고 책상이 변기 의자보다 \u003cb class=\"key\">400배\u003c/b> 더럽다는 사실을 밝힌다. 따라서 특별한 \u003cb class=\"key\">면역 \u003c/b>\u003cb class=\"key\">강화\u003c/b> 목적이 없다면 책상에 있는 음식을 먹지 말아야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 글은 작은 행동 하나가 얼마나 큰 위생 문제로 이어질 수 있는지 보여 줬어요. 책상이 두 번째 집처럼 편안하더라도, 세균 관점에서는 변기 의자보다 더러울 수 있다는 사실을 기억하세요. 시험 공부로 바쁜 날일수록 간식은 깨끗한 접시나 포장 위에서 먹는 습관을 가져 보면 좋겠어요. 오늘 수업도 수고 많았고, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
