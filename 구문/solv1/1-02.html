<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 1강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 1강 적용독해02","audioDir":"1-02_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">1강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Returning Zoo Animals to the Wild Is Simply a Bad Idea\u003c/h1>\u003ch2>동물원 동물을 야생으로 돌려보내는 것은 그야말로 나쁜 생각이다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>야생동물을 동물원에서 기르는 것에 반대하며 동물들을 야생으로 돌려보내야 한다는 사람들이 있다. 그러나 여러 해 혹은 전 생애를 동물원에서 보낸 동물들은 야생에서 살아남는 데 필요한 \u003cb class=\"key\">기술과 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 더 이상 갖고 있지 못하므로, \u003cb class=\"key\">야생으로 \u003c/b>\u003cb class=\"key\">돌려보내는 \u003c/b>\u003cb class=\"key\">것\u003c/b>은 나쁜 생각이며 그들은 지금 있는 곳에 남는 편이 낫다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Zoo animals that have spent years, or even their whole lives, in zoos no longer have the skills and abilities necessary to survive in the wild, so sending them back into the wild is simply a bad idea.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 동물원 동물을 야생으로 돌려보내는 일에 관한 글이에요. 일부 사람들은 동물원에 있는 동물을 자연으로 돌려주자고 말하지만, 이 글은 그 주장을 정면으로 반박하고 있죠. 요약하면 오랫동안 동물원에서 산 동물은 야생에서 살아남을 기술이 없어서, 돌려보내는 것이 오히려 동물에게 해가 될 수 있다는 내용이에요. 그럼 오늘도 힘차게 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">동물원에서 태어나 자란 동물은 먹이를 찾고 사냥하며 천적을 피하는 법을 배울 기회가 거의 없다. 이런 \u003cb class=\"key\">야생 \u003c/b>\u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">기술\u003c/b>은 유전자에 새겨진 본능만이 아니라 어릴 때 어미나 무리에게 배우는 학습된 행동, 즉 learned behavior이기 때문이다. 그래서 동물을 자연으로 되돌려보내는 재도입(reintroduction) 프로그램에서는 먼저 사냥 훈련이나 먹이 찾기 훈련을 시키는 경우가 많다. 이를테면 운전면허도 없이 고속도로에 차를 내보내는 것과 같다. 준비 없이 내보낸 차가 사고를 피하기 어렵듯이, 훈련 없는 동물이 야생에서 살아남기는 매우 어렵다. 이 배경을 알면 왜 글쓴이가 야생으로 돌려보내는 일에 회의적인지 자연스럽게 이해된다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 야생에서 살아남으려면 먹이를 찾고 사냥하고 천적을 피하는 기술이 필요한데, 이런 기술은 대부분 어릴 때 어미나 무리에게 배우는 학습된 행동이에요. 그런데 동물원에서 태어나 자란 동물은 그런 기회를 갖지 못하죠. 그래서 실제로 동물을 자연으로 되돌려보내는 재도입 프로그램에서는 먼저 사냥 훈련을 시키는 경우가 많아요. 이걸 운전면허도 없이 고속도로에 차를 내보내는 상황이라고 생각하면 이해가 쉬울 거예요. 준비 없이 내보내면 사고를 피하기 어렵겠죠. 이 배경을 알고 읽으면 글의 주장이 훨씬 자연스럽게 다가올 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>동물원 사육에 반대하는 사람들\u003csmall>통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 먼저 야생동물을 동물원에서 기르는 것에 \u003cb class=\"key\">반대하는 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>을 소개한다. 이들은 동물원의 동물들을 \u003cb class=\"key\">야생으로 \u003c/b>\u003cb class=\"key\">돌려보내야\u003c/b> 한다고 믿는다. 동물의 자유를 되찾아 주자는 흔한 \u003cb class=\"key\">통념\u003c/b>을 먼저 꺼내 놓으며 글을 연다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>그들이 깨닫지 못한 것\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>그러나 글쓴이는 But으로 말을 돌리며 이 생각에 \u003cb class=\"key\">문제를 \u003c/b>\u003cb class=\"key\">제기\u003c/b>한다. 그들이 \u003cb class=\"key\">깨닫지 \u003c/b>\u003cb class=\"key\">못하고 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">것\u003c/b>은 야생으로 돌려보내는 일이 이 동물들의 삶에 \u003cb class=\"key\">향상\u003c/b>을 반드시 약속하는 것은 아니라는 점이다. 여기서 글의 방향이 통념에서 반박으로 바뀐다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>남아 있지 않은 기술과 능력\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>근거는 동물들이 동물원에서 보낸 세월이다. 여러 해를, 때로는 \u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">생애\u003c/b>를 동물원에서 보냈기에 그들은 더 이상 야생에서 살아남는 데 필요한 \u003cb class=\"key\">기술과 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 갖고 있지 못하다. 그래서 사느냐 죽느냐의 \u003cb class=\"key\">도전\u003c/b>에 직면하면 그것을 극복할 가능성이 별로 없다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>남는 편이 낫다\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>마지막으로 글쓴이는 For this reason으로 \u003cb class=\"key\">결론\u003c/b>을 내린다. 동물원 동물을 야생으로 돌려보내는 것은 그야말로 \u003cb class=\"key\">나쁜 \u003c/b>\u003cb class=\"key\">생각\u003c/b>이다. 그들은 지금 그들이 있는 바로 그곳에 \u003cb class=\"key\">남는 \u003c/b>\u003cb class=\"key\">편이 \u003c/b>\u003cb class=\"key\">낫다\u003c/b>는 주장으로 글을 맺는다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 처음부터 끝까지 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 통념을 소개하는 부분이에요. 야생동물을 동물원에서 기르는 것에 반대하는 사람들이 있다고 말하죠. 그리고 그 사람들은 우리가 동물원의 동물들을 야생으로 돌려보내야 한다고 믿는다고 전해요. 우리가 흔히 접하는 주장을 먼저 꺼내 놓은 거예요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서 글쓴이가 방향을 바꿔요. But으로 시작하면서 그들이 깨닫지 못하고 있는 것을 짚어 주죠. 야생으로 돌려보내는 일이 이 동물들의 삶에 향상을 반드시 약속하는 것은 아니라는 겁니다. 여기서 통념에 대한 반박이 시작되는 거예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 그 반박의 근거예요. 동물들은 여러 해를, 때로는 전 생애를 동물원에서 보냈기 때문에 야생에서 살아남는 데 필요한 기술과 능력을 더 이상 갖고 있지 못해요. 그래서 야생에서 사느냐 죽느냐의 도전에 직면하면 그것을 극복할 가능성이 별로 없다고 말하죠.","hl":"f2"},{"n":7,"text":"마지막 단계는 결론이에요. For this reason, 다시 말해 이러한 이유로 동물원 동물을 야생으로 돌려보내는 것은 그야말로 나쁜 생각이라고 정리해요. 그리고 그들은 지금 그들이 있는 바로 그곳에 남는 편이 낫다고 주장하며 글을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 사람들의 흔한 주장을 먼저 제시한 뒤 그것을 뒤집는 \u003cb class=\"key\">통념-반박\u003c/b> 방식으로 전개된다. 첫 번째와 두 번째 문장이 \u003cb class=\"key\">통념\u003c/b>을, 세 번째 문장이 전환을, 네 번째와 다섯 번째 문장이 근거를 맡는다. 글쓴이의 주장은 여섯 번째 문장에서야 완성되므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있다. 마지막 문장은 그 주장을 실천적 결론으로 다듬어 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 통념과 반박이에요. 먼저 사람들의 흔한 주장을 제시하고, 그다음 그것을 뒤집는 구조죠. 주제문은 여섯 번째 문장인 sending zoo animals back into the wild is simply a bad idea예요. 글쓴이의 주장이 맨 뒤에서야 완성되니까 미괄식 구조로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보세요. 세 번째 문장의 But은 통념에서 반박으로 넘어가는 전환이고, 네 번째 문장의 As는 이유를, 다섯 번째 문장의 So는 결과를 이끌어요. 여섯 번째 문장의 For this reason은 앞의 근거를 한데 묶어 결론으로 넘어가게 해 줍니다. 그리고 return zoo animals to the wild와 sending zoo animals back into the wild는 같은 개념을 바꿔 말한 재진술이라는 점도 꼭 챙겨 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>oppose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>idea\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생각, 관념\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기르다, 사육하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wild animal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>야생동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>zoo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동물원\u003c/span>\u003c/div>\u003cdiv>\u003cb>return\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돌려보내다, 되돌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>the wild\u003c/b>\u003cem>명사\u003c/em>\u003cspan>야생, 자연\u003c/span>\u003c/div>\u003cdiv>\u003cb>realize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨닫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>necessarily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>반드시\u003c/span>\u003c/div>\u003cdiv>\u003cb>promise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>약속하다, 보장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>improvement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>향상, 개선\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(시간을) 보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>whole\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전체의, 온\u003c/span>\u003c/div>\u003cdiv>\u003cb>no longer\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>더 이상 ~아니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>skill\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술, 솜씨\u003c/span>\u003c/div>\u003cdiv>\u003cb>ability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>necessary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>필요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>survive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>살아남다\u003c/span>\u003c/div>\u003cdiv>\u003cb>face\u003c/b>\u003cem>동사\u003c/em>\u003cspan>직면하다, 마주하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>life-or-death\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사느냐 죽느냐의\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도전, 난관\u003c/span>\u003c/div>\u003cdiv>\u003cb>be unlikely to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 가능성이 별로 없다\u003c/span>\u003c/div>\u003cdiv>\u003cb>overcome\u003c/b>\u003cem>동사\u003c/em>\u003cspan>극복하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for this reason\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이러한 이유로\u003c/span>\u003c/div>\u003cdiv>\u003cb>simply\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그야말로, 단순히\u003c/span>\u003c/div>\u003cdiv>\u003cb>bad idea\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나쁜 생각\u003c/span>\u003c/div>\u003cdiv>\u003cb>be better off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 편이 낫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>remain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>남다, 머무르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>exactly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>바로, 정확히\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚어 볼게요. oppose는 반대한다는 뜻이고, necessarily는 반드시라는 부사로 not과 함께 쓰이면 반드시 그런 것은 아니다가 돼요. overcome은 극복하다, remain은 남다라는 뜻이고, be better off는 오히려 더 낫다라고 해석하면 자연스러워요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">oppose\u003c/b>\u003cspan class=\"m\">반대하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">object to\u003c/span>\u003cspan class=\"s\">be against\u003c/span>\u003cspan class=\"s\">resist\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">support\u003c/span>\u003cspan class=\"a\">favor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">improvement\u003c/b>\u003cspan class=\"m\">향상\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enhancement\u003c/span>\u003cspan class=\"s\">betterment\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decline\u003c/span>\u003cspan class=\"a\">deterioration\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">survive\u003c/b>\u003cspan class=\"m\">살아남다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">endure\u003c/span>\u003cspan class=\"s\">outlast\u003c/span>\u003cspan class=\"s\">persist\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">die\u003c/span>\u003cspan class=\"a\">perish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">overcome\u003c/b>\u003cspan class=\"m\">극복하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conquer\u003c/span>\u003cspan class=\"s\">surmount\u003c/span>\u003cspan class=\"s\">get over\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">yield\u003c/span>\u003cspan class=\"a\">surrender\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">necessary\u003c/b>\u003cspan class=\"m\">필요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">vital\u003c/span>\u003cspan class=\"s\">required\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unnecessary\u003c/span>\u003cspan class=\"a\">optional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remain\u003c/b>\u003cspan class=\"m\">남다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stay\u003c/span>\u003cspan class=\"s\">linger\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003cspan class=\"a\">depart\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">realize\u003c/b>\u003cspan class=\"m\">깨닫다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"s\">understand\u003c/span>\u003cspan class=\"s\">become aware\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어로 어휘를 넓혀 볼게요. oppose의 동의어는 object to와 be against이고 반의어는 support예요. survive는 endure나 outlast로 바꿔 쓸 수 있고 반대말은 perish죠. overcome은 conquer, surmount와 가깝고 반의어는 yield예요. necessary는 essential이나 vital로, remain은 stay나 linger로 바꿔 쓸 수 있다는 것도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 사람들이\u003c/span>\u003cspan class=\"en\">some people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 생각에 반대하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">oppose \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">idea\u003c/span> *(\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생동물들을 동물원에서 기르는 것에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">keeping \u003c/span>\u003cspan class=\"tgt\">wild \u003c/span>\u003cspan class=\"tgt\">animals \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">zoos\u003c/span>).\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">야생동물들을 동물원에서 기른다는 생각에 반대하는 사람들이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 야생동물을 동물원에서 사육하는 것에 반대하는 사람들이 있음을 먼저 꺼내는 도입 문장이에요. \u003cb class=\"key\">oppose\u003c/b>는 '반대하다'라는 뜻이고, 전치사 of 뒤의 \u003cb class=\"key\">동명사\u003c/b> keeping이 '기르는 것'이라는 명사 역할을 해요. 글 전체의 화제를 열어 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 There 구문\u003c/span> : There + [be동사] + [주어] (~이 있다) : \"~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 some people] + [who + 동사 ~] (관계대명사절이 선행사를 수식) : \"그 생각에 반대하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사의 목적어로 쓰인 동명사\u003c/span> : [전치사 of] + [[동명사 keeping]] + [목적어 wild animals] : \"야생동물들을 동물원에서 기르는 것에 대한\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"There are, ~이 있다. some people, 몇몇 사람들이. who oppose the idea, 그 생각에 반대하는. of keeping wild animals in zoos, 야생동물들을 동물원에서 기르는 것에 대한. 이 문장 전체를 해석하면, 야생동물들을 동물원에서 기른다는 생각에 반대하는 사람들이 있다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 글의 화제를 꺼내는 도입 문장이에요. 야생동물을 동물원에서 기르는 것에 반대하는 사람들이 있다고 말하고 있죠. 여기서 oppose는 반대하다는 뜻이고, 뒤에 오는 동명사 keeping은 기르는 것이라는 명사 역할을 해요.","hl":"mn"},{"n":14,"text":"첫 번째로, who oppose the idea에서 who는 주격 관계대명사예요. 선행사 some people을 뒤에서 꾸며 주면서 관계사절 안에서 주어 역할을 하죠. 두 번째로, 전치사 of 뒤에 동명사 keeping이 왔어요. 전치사 뒤에는 명사가 와야 하니까 동사 keep이 동명사로 바뀐 거예요. 세 번째로, There are는 유도부사 구문이에요. 진짜 주어인 some people이 be동사 뒤에 온다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 사람들은 ~라고 믿는다 우리가 돌려보내야 한다고 동물원의 동물들을 야생으로\u003c/span>\u003cspan class=\"en\">These people believe that we *\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">return \u003c/span>\u003cspan class=\"tgt\">zoo \u003c/span>\u003cspan class=\"tgt\">animals \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">wild\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이들은 우리가 동물원의 동물들을 야생으로 돌려보내야 한다고 믿는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물원 동물을 야생으로 돌려보내야 한다고 믿는 사람들의 주장을 정리한 문장이에요. \u003cb class=\"key\">believe\u003c/b> 뒤의 that절이 이들의 생각을 그대로 담고 있고, \u003cb class=\"key\">should\u003c/b>가 '마땅히 ~해야 한다'는 당위를 나타내요. 바로 다음 문장에서 이 주장에 대한 \u003cb class=\"key\">반박\u003c/b>이 이어지도록 준비하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 should (당위)\u003c/span> : [should + 동사원형] (~해야 한다) : \"돌려보내야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">return A to B (타동사 + 목적어 + 전치사구)\u003c/span> : [[return]] + [목적어 A] + [to + 장소 B] (A를 B로 돌려보내다) : \"동물원의 동물들을 야생으로 돌려보내다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : [believe] + [that + 주어 + 동사 ~] (that절이 목적어) : \"우리가 동물원의 동물들을 야생으로 돌려보내야 한다고 믿는다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"These people, 이 사람들은. believe that, ~라고 믿는다. we should return, 우리가 돌려보내야 한다고. zoo animals to the wild, 동물원의 동물들을 야생으로. 이 문장 전체를 해석하면, 이들은 우리가 동물원의 동물들을 야생으로 돌려보내야 한다고 믿는다.","hl":"m"},{"n":16,"text":"두 번째 문장은 앞에서 나온 사람들의 주장을 정리한 문장이에요. 동물원 동물을 야생으로 돌려보내야 한다고 그들은 믿는다는 거죠. 여기서 should는 마땅히 해야 한다는 당위의 느낌을 담고 있어요.","hl":"mn"},{"n":17,"text":"첫 번째로, believe that에서 that은 해석하지 않고 ~라고로 이어 주는 명사절 접속사예요. that절 전체가 believe의 목적어 자리에 들어가 있죠. 두 번째로, should return에서 should는 ~해야 한다는 당위의 조동사이고 뒤에는 반드시 동사원형이 와요. 세 번째로, return zoo animals to the wild는 return이 목적어를 바로 받는 타동사로 쓰인 구조예요. to 뒤에 도착지인 the wild가 온다는 것도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 깨닫지 못하고 있는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">realize\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이라는 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이 반드시 ~을 약속하는 것은 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">doesn't \u003c/span>\u003cspan class=\"tgt\">necessarily \u003c/span>\u003cspan class=\"tgt\">promise\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">향상을\u003c/span>\u003cspan class=\"en\">an improvement (\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 동물들의 삶에 있어서\u003c/span>\u003cspan class=\"en\">in the lives of these animals).\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 그들이 깨닫지 못하고 있는 것은 이것이 이 동물들의 삶에 향상을 반드시 약속하는 것은 아니라는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 주장을 정면으로 반박하는 핵심 문장이에요. what절이 주어, that절이 보어인 'A는 B이다' 구조로 이들이 \u003cb class=\"key\">모르는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 무엇인지 짚어 줍니다. \u003cb class=\"key\">not \u003c/b>\u003cb class=\"key\">necessarily\u003c/b>는 부분 부정이라, 야생으로 돌려보낸다고 해서 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">향상\u003c/b>이 반드시 보장되지는 않는다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what (주어 역할)\u003c/span> : [[what]] + [주어 + 동사] (~하는 것) → 문장의 주어 : \"그들이 깨닫지 못하고 있는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 보어로 쓰인 that절\u003c/span> : [주어 what절] + [be동사 is] + [[that절]] (주어는 ~이다) : \"이것이 반드시 ~을 약속하는 것은 아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부분 부정 (not necessarily)\u003c/span> : [[not necessarily]] + 동사 (~라고 반드시 …인 것은 아니다) : \"반드시 약속하는 것은 아니다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But, 그러나. what they don't realize, 그들이 깨닫지 못하고 있는 것은. is that, ~이라는 것이다. this doesn't necessarily promise, 이것이 반드시 ~을 약속하는 것은 아니다. an improvement, 향상을. in the lives of these animals, 이 동물들의 삶에 있어서. 이 문장 전체를 해석하면, 그러나 그들이 깨닫지 못하고 있는 것은 이것이 이 동물들의 삶에 향상을 반드시 약속하는 것은 아니라는 것이다.","hl":"m"},{"n":19,"text":"세 번째 문장은 앞의 주장을 정면으로 반박하는 핵심 문장이에요. 그들이 깨닫지 못하는 것은 야생으로 돌려보낸다고 해서 그 동물들의 삶이 좋아진다고 반드시 보장되지는 않는다는 점이죠. 글의 흐름이 여기서 한 번 크게 꺾인다고 보시면 됩니다.","hl":"mn"},{"n":20,"text":"첫 번째로, what they don't realize에서 what은 선행사를 포함한 관계대명사예요. ~하는 것이라는 뜻으로 이 절 전체가 문장의 주어가 되죠. 두 번째로, is that this doesn't necessarily promise에서 that절이 be동사 뒤의 주격 보어 자리에 통째로 들어가 있어요. 그래서 A는 B이다 구조로 읽으면 됩니다. 세 번째로, doesn't necessarily promise는 부분 부정이에요. not이 necessarily를 부정해서 반드시 그런 것은 아니다라고 해석해야 하지, 약속하지 않는다라고 해석하면 안 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 여러 해를 보냈기에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">spent \u003c/span>\u003cspan class=\"tgt\">years\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 때로는 전 생애를\u003c/span>\u003cspan class=\"en\">and sometimes their whole lives,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물원에서\u003c/span>\u003cspan class=\"en\">in zoos,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 더 이상 그 기술과 능력을 갖고 있지 못하다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">longer\u003c/span> have the skills and abilities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생에서 살아남는 데 필요한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">necessary \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">survive\u003c/span> in the wild.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">동물원의 동물들은 여러 해를 혹은 전 생애를 동물원에서 보냈기에 그들은 더 이상 야생에서 살아남는 데 필요한 기술과 능력을 갖고 있지 못하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 동물원 동물을 야생으로 돌려보내자는 주장의 문제점을 뒷받침합니다. 동물원 생활이 길어지면 \u003cb class=\"key\">야생 \u003c/b>\u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 잃는다는 점을 말하며, 앞의 돌려보내면 좋아질 것이라는 기대를 반박하죠. 여러 해를 넘어 전 생애를 동물원에서 보낸 경우가 있다는 점은 \u003cb class=\"key\">동물원 \u003c/b>\u003cb class=\"key\">생활 \u003c/b>\u003cb class=\"key\">기간\u003c/b>이 얼마나 긴지 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 As의 이유 용법과 현재완료\u003c/span> : [As + 주어 + have/has + p.p.] = [이유] ~이므로 : \"그들이 여러 해를 보냈기에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사구 no longer\u003c/span> : [no longer + 동사] = 더 이상 ~하지 않다 : \"더 이상 ~하지 않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사구의 후치수식과 to부정사\u003c/span> : [명사 + necessary + to + 동사원형] = ~하는 데 필요한 [명사] : \"살아남는 데 필요한\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"As they have spent years, 그들이 여러 해를 보냈기에. and sometimes their whole lives, 그리고 때로는 전 생애를. in zoos, 동물원에서. they no longer have the skills and abilities, 그들은 더 이상 그 기술과 능력을 갖고 있지 못하다. necessary to survive in the wild, 야생에서 살아남는 데 필요한. 이 문장 전체를 해석하면, 동물원의 동물들은 여러 해를 혹은 전 생애를 동물원에서 보냈기에 그들은 더 이상 야생에서 살아남는 데 필요한 기술과 능력을 갖고 있지 못하다.","hl":"m"},{"n":22,"text":"이 문장은 동물원 동물을 야생으로 돌려보내면 좋아질 것이라는 기대를 반박하는 근거예요. 동물원에서 오래 지내면 야생 생존 기술을 잃기 때문에 돌려보내는 것이 개선이 될 수 없다는 흐름을 만들어 줍니다. 특히 여러 해를 넘어 전 생애를 동물원에서 보낸 경우가 있다는 점을 짚어 문제의 심각성을 강조하죠.","hl":"mn"},{"n":23,"text":"어법 포인트를 짚어 볼게요. 첫 번째, As they have spent years에서 As는 이유를 나타내는 접속사이고 have spent는 현재완료예요. 두 번째, no longer는 더 이상이라는 뜻으로 부정의 의미를 분명하게 만들어 줍니다. 세 번째, necessary to survive in the wild에서 necessary가 앞의 the skills and abilities를 뒤에서 꾸미는 후치수식이고, to survive는 살아남는 데 필요한이라는 의미를 더하는 to부정사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 동물들이 사느냐 죽느냐의 도전에 직면하게 되면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">animals \u003c/span>\u003cspan class=\"tgt\">face\u003c/span> life-or-death challenges\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">wild\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 그 도전을 극복할 가능성이 별로 없다.\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">unlikely \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">overcome\u003c/span> them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 이 동물들이 야생에서 사느냐 죽느냐의 도전에 직면하게 되면 그들은 그 도전을 극복할 가능성이 별로 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 \u003cb class=\"key\">야생 \u003c/b>\u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">기술\u003c/b>의 부재가 실제 상황에서 어떤 결과를 낳는지 보여 줍니다. 야생에서 생사가 걸린 \u003cb class=\"key\">도전\u003c/b>을 만나도 극복할 \u003cb class=\"key\">가능성\u003c/b>이 낮다는 뜻이죠. 그래서 이 문장은 동물원 동물을 야생으로 보내는 것이 위험하다는 주장을 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [when + 주어 + 동사] = ~할 때 : \"이 동물들이 ~에 직면할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 역할\u003c/span> : [in + the + wild] = 야생에서 : \"야생에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be unlikely to부정사\u003c/span> : [be unlikely + to + 동사원형] = ~할 가능성이 별로 없다 : \"극복할 가능성이 별로 없다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"So, 그래서. when these animals face life-or-death challenges, 이 동물들이 사느냐 죽느냐의 도전에 직면하게 되면. in the wild, 야생에서. they are unlikely to overcome them, 그들은 그 도전을 극복할 가능성이 별로 없다.. 이 문장 전체를 해석하면, 그래서 이 동물들이 야생에서 사느냐 죽느냐의 도전에 직면하게 되면 그들은 그 도전을 극복할 가능성이 별로 없다.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 말한 야생 생존 기술의 부재가 실제 상황에서 어떤 결과로 이어지는지 보여 줍니다. 야생에서 생사가 걸린 도전을 만나도 극복할 가능성이 낮다는 뜻이죠. 그래서 동물원 동물을 야생으로 보내는 일이 위험하다는 흐름을 분명히 해 줍니다.","hl":"mn"},{"n":26,"text":"어법 포인트를 볼게요. 첫 번째, when these animals face life-or-death challenges에서 when은 시간을 나타내는 부사절을 이끌어요. 두 번째, in the wild는 야생에서라는 장소의 전치사구로 앞의 상황을 한정합니다. 세 번째, are unlikely to overcome은 be unlikely to부정사 구조로 극복할 가능성이 별로 없다는 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 이유로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">For \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">reason\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물원 동물들을 야생에 돌려보내는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sending \u003c/span>\u003cspan class=\"tgt\">zoo \u003c/span>\u003cspan class=\"tgt\">animals \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">wild\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그야말로 터무니 없는 생각이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">simply \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bad \u003c/span>\u003cspan class=\"tgt\">idea\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 이유로 동물원 동물들을 야생에 돌려보내는 것은 그야말로 터무니 없는 생각이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 근거를 바탕으로 글의 결론을 내리는 문장입니다. 동물원 동물을 야생으로 돌려보내는 일은 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">기술\u003c/b> 부족 때문에 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">생각\u003c/b>이 아니라는 것이죠. For this reason은 앞의 내용이 결론의 \u003cb class=\"key\">이유\u003c/b>임을 분명히 연결합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 문장 연결 부사 역할\u003c/span> : [For this reason, + 문장] = 이러한 이유로 : \"이러한 이유로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [동명사 + 목적어 + ...] + 단수 동사 = ~하는 것은 : \"동물원 동물들을 야생에 돌려보내는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주어 + be동사 + 주격 보어\u003c/span> : [주어 + is + 명사구(주격 보어)] = ~은 ...이다 : \"그야말로 터무니없는 생각이다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"For this reason, 이러한 이유로. sending zoo animals back into the wild, 동물원 동물들을 야생에 돌려보내는 것은. is simply a bad idea, 그야말로 터무니 없는 생각이다.. 이 문장 전체를 해석하면, 이러한 이유로 동물원 동물들을 야생에 돌려보내는 것은 그야말로 터무니 없는 생각이다.","hl":"m"},{"n":28,"text":"이 문장은 앞의 근거를 바탕으로 글의 결론을 내리는 문장이에요. 동물원 동물을 야생으로 돌려보내는 일은 생존 기술 부족 때문에 좋은 생각이 아니라는 것이죠. For this reason은 앞의 내용이 결론의 이유임을 분명히 연결해 줍니다.","hl":"mn"},{"n":29,"text":"어법 포인트를 짚어 볼게요. 첫 번째, For this reason은 앞 문장과의 인과관계를 표시하는 연결어예요. 두 번째, sending zoo animals back into the wild는 동명사구 전체가 주어로 쓰였고, 그래서 뒤에 단수 동사 is가 옵니다. 세 번째, is simply a bad idea는 주어를 받는 단수 동사와 주격 보어의 구조이고, send animals back into the wild는 동물들을 야생으로 돌려보내다라는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 더 나은 상태다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">off\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">remaining\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정확히 그들이 있는 곳에\u003c/span>\u003cspan class=\"en\">exactly \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 지금 그들이 있는 바로 그곳에 남는 편이 낫다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 결론으로, 동물원 동물을 야생으로 돌려보내는 것보다 \u003cb class=\"key\">제자리에 \u003c/b>\u003cb class=\"key\">남는 \u003c/b>\u003cb class=\"key\">편\u003c/b>이 낫다고 정리해요. 앞에서 말한 '야생에서 살아남을 \u003cb class=\"key\">능력\u003c/b>이 없다'는 이유를 바탕으로 내린 최종 판단이죠. \u003cb class=\"key\">better \u003c/b>\u003cb class=\"key\">off\u003c/b>는 '더 나은 상태'라는 뜻으로, 동물의 이익을 기준으로 한 비교 판단임을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 관용 표현 (be better off)\u003c/span> : [[주어]] + be better off + [[동명사(구)]] = ~하는 편이 더 낫다 : \"~하는 편이 낫다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사(구)\u003c/span> : be better off + [[remaining (동명사구)]] : \"남는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계부사 where (선행사 생략)\u003c/span> : [[where]] + 주어 + 동사 = ~가 있는 곳(에) : \"그들이 있는 곳에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"They are better off, 그들은 더 나은 상태다. remaining, 남는 것이. exactly where they are, 정확히 그들이 있는 곳에. 이 문장 전체를 해석하면, 그들은 지금 그들이 있는 바로 그곳에 남는 편이 낫다.","hl":"m"},{"n":31,"text":"이 문장은 글 전체의 결론이에요. 동물원 동물을 야생으로 보내는 건 좋은 생각이 아니라는 주장을 마지막에 다시 못 박는 거죠. better off는 '더 나은 상태'라는 뜻이라서, 결국 제자리에 머무는 쪽이 동물에게 더 이롭다고 정리하는 겁니다.","hl":"mn"},{"n":32,"text":"첫 번째, are better off는 비교급 관용 표현이에요. well off의 비교급인 better off 뒤에 동명사가 오면 '~하는 편이 낫다'로 해석해요. 두 번째, remaining은 동명사로 '남는 것'이라는 동작을 명사처럼 나타냅니다. 세 번째, where they are는 관계부사 where가 이끄는 절로 '그들이 있는 곳'이라는 장소를 표현하는 구조예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>야생동물을 동물원에서 기르는 것에 \u003cb class=\"key\">반대하는 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>이 있다.\u003c/li>\u003cli>이들은 동물원의 동물들을 \u003cb class=\"key\">야생으로 \u003c/b>\u003cb class=\"key\">돌려보내야\u003c/b> 한다고 믿는다.\u003c/li>\u003cli>그러나 오랫동안 동물원에서 산 동물은 야생에서 살아남는 데 필요한 \u003cb class=\"key\">기술과 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 더 이상 갖고 있지 못하다.\u003c/li>\u003cli>그래서 야생으로 돌려보내는 것은 나쁜 생각이며, 그들은 \u003cb class=\"key\">지금 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">곳에 \u003c/b>\u003cb class=\"key\">남는 \u003c/b>\u003cb class=\"key\">편\u003c/b>이 낫다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Zoo animals that have spent years, or even their whole lives, in zoos no longer have the skills and abilities necessary to survive in the wild, so sending them back into the wild is simply a bad idea.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">야생동물을 동물원에서 기르는 것에 반대하며 동물들을 야생으로 돌려보내야 한다는 사람들이 있다. 그러나 여러 해 혹은 전 생애를 동물원에서 보낸 동물들은 야생에서 살아남는 데 필요한 \u003cb class=\"key\">기술과 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 더 이상 갖고 있지 못하므로, \u003cb class=\"key\">야생으로 \u003c/b>\u003cb class=\"key\">돌려보내는 \u003c/b>\u003cb class=\"key\">것\u003c/b>은 나쁜 생각이며 그들은 지금 있는 곳에 남는 편이 낫다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글의 핵심은 야생으로 돌려보내는 일이 이 동물들의 삶에 향상을 보장하지 않는다는 점이었어요. 동물원에서 여러 해를 보낸 동물은 야생에서 살아남는 데 필요한 기술과 능력이 부족해서 사느냐 죽느냐의 도전을 극복하기 어렵다는 근거도 꼭 기억해 두세요. 결국 글쓴이는 그들이 지금 있는 곳에 남는 편이 낫다고 주장하고 있습니다. 오늘 수업은 여기까지예요, 모두 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
