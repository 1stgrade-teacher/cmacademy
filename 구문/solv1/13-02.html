<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 13강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 13강 적용독해02","audioDir":"13-02_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">13강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Why Birds Lay Eggs: Adaptation to a Way of Life\u003c/h1>\u003ch2>새는 왜 알을 낳을까: 삶의 방식에 맞춘 적응\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>John Ray는 새가 알을 낳아 번식하는 데에는 타당한 이유가 있다고 보았다. 새끼가 체내 자궁에서 성장한다면 새는 너무 무거워 날지 못해 포식자에게 취약해지고 머지않아 사라질 것이므로, 알을 낳아 번식하는 것은 새가 \u003cb class=\"key\">환경에 \u003c/b>\u003cb class=\"key\">맞추는 \u003c/b>\u003cb class=\"key\">방식\u003c/b>의 한 사례이자 \u003cb class=\"key\">적응\u003c/b>의 표현이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Reproduction by egg-laying is one example of the way birds fit their environment, showing that every organism is equipped for the way of life assigned to it.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 영국의 동식물 연구가인 John Ray가 새의 번식 방식을 설명한 글이에요. 이 글은 새가 알을 낳아 번식하는 데에는 타당한 이유가 있다는 주장에서 출발해서, 만약 새끼를 뱃속에서 키운다면 어떤 일이 벌어질지를 따져 보고, 결국 그것이 환경에 맞춘 적응의 한 사례임을 보여 줍니다. 요지는 알을 낳아 번식하는 방식이야말로 새가 환경에 맞추는 방식의 한 예라는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">John Ray는 오래전 영국에서 활동한 \u003cb class=\"key\">naturalist\u003c/b>, 즉 동식물 연구가로, 생물의 생김새와 습성이 환경에 얼마나 잘 맞는지를 관찰한 사람이에요. 이런 관점을 \u003cb class=\"key\">adaptation\u003c/b>(적응)이라고 부르는데, 생물이 살아남기 위해 몸과 행동을 환경에 맞추는 현상을 말해요. 예를 들어 사막 식물이 물을 아껴 쓰려고 잎을 가늘게 만드는 것도 적응의 한 예이고, 새가 알을 낳아 번식하는 것도 같은 맥락이에요. 여기서 핵심은 \u003cb class=\"key\">자궁\u003c/b>(womb)인데, 포유류처럼 새끼를 뱃속에서 키우면 몸이 무거워져 날아야 하는 새에게는 치명적일 수 있어요. 비유하자면 커다란 배낭을 메고 줄타기를 하는 것과 같아서, 무게가 늘면 균형을 잡지 못하고 곧바로 위험에 노출되죠. 그래서 Ray는 생물의 모든 특징을 우연이 아니라 환경에 맞춘 결과로 보았어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. John Ray는 오래전 영국에서 활동한 naturalist, 그러니까 동식물 연구가였어요. 그는 생물의 생김새와 습성이 얼마나 환경에 잘 맞는지를 관찰하면서 adaptation, 즉 적응이라는 개념을 이야기했죠. 적응이란 생물이 살아남기 위해 몸과 행동을 환경에 맞추는 것을 말해요. 사막 식물이 물을 아껴 쓰려고 잎을 가늘게 만드는 것도 적응이고, 새가 알을 낳아 번식하는 것도 같은 맥락이에요. 커다란 배낭을 메고 줄타기를 하면 균형을 잡기 어렵죠? 새에게 무거운 몸은 바로 그 배낭과 같아서 날지 못하게 만들고 결국 목숨을 위협합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>문제 제기\u003csmall>도입·주장 · 문장 1\u003c/small>\u003c/h4>\u003cp>영국 동식물 연구가인 John Ray는 새가 알을 낳아 번식하는 데에는 \u003cb class=\"key\">타당한 \u003c/b>\u003cb class=\"key\">이유\u003c/b>가 있다고 믿었습니다. 그는 이것이 우연이 아니라 새의 삶의 방식에 맞춘 결과라고 보았죠. 그래서 먼저 결론을 내세우고 그 이유를 하나씩 따져 보는 방식을 택합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>가정과 결과\u003csmall>근거·인과 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>Ray는 새끼가 \u003cb class=\"key\">체내 \u003c/b>\u003cb class=\"key\">자궁\u003c/b>에서 성장한다고 가정해 봅니다. 그러면 새끼를 밴 새는 너무 무거워서 날지 못할 것이고, 그래서 \u003cb class=\"key\">포식자\u003c/b>에게 매우 취약할 것입니다. 그 결과 새끼를 밴 새는 목숨을 잃게 되고 머지않아 모든 새가 사라질 것이라고 그는 지적합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>반대 상황의 검증\u003csmall>반례 · 문장 4\u003c/small>\u003c/h4>\u003cp>이어서 그는 더 짧은 문장으로 같은 논리를 한 번 더 밀어붙입니다. 새가 새끼를 낳는다면, 즉 \u003cb class=\"key\">태생\u003c/b>이라면 한 마리의 새도 존재할 수 없다는 것입니다. 이렇게 반대 상황을 끝까지 가정해 보면 알을 낳는 번식만이 살아남는 방식임이 분명해집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>일반화\u003csmall>결론·일반화 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>마지막으로 Ray는 알을 낳아 번식하는 것을 새가 \u003cb class=\"key\">환경에 \u003c/b>\u003cb class=\"key\">맞추는 \u003c/b>\u003cb class=\"key\">방식\u003c/b>의 한 사례로 확장합니다. 면밀한 관찰을 통해 드러난 바로는 모든 종류의 식물과 동물이 자신의 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">방식\u003c/b>에 필요한 것을 갖추었다는 것이죠. 그래서 그는 적응을 모든 생물이 자연에서 자신에게 부여된 \u003cb class=\"key\">역할\u003c/b>에 맞추는 방식의 표현이라고 보았습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 문제 제기예요. 영국 동식물 연구가인 John Ray는 새가 알을 낳아 번식하는 데에는 타당한 이유가 있다고 믿었어요. 그는 이것이 우연이 아니라 새의 삶의 방식에 맞춘 결과라고 보았죠. 그래서 먼저 결론을 내세우고 그 이유를 따져 보는 방식을 택합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 가정과 그 결과예요. Ray는 새끼가 체내 자궁에서 성장한다고 가정해 봅니다. 그러면 새끼를 밴 새는 너무 무거워서 날지 못할 것이고, 그래서 포식자에게 매우 취약할 거예요. 그 결과 새끼를 밴 새는 목숨을 잃게 되고 머지않아 모든 새가 사라진다고 그는 지적합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 반대 상황의 검증이에요. 그는 새가 새끼를 낳는다면, 그러니까 태생이라면 한 마리의 새도 존재할 수 없다고 짧게 못 박습니다. 반대 상황을 끝까지 가정해 보면 알을 낳는 번식만이 살아남는 방식임이 분명해지는 거죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 일반화예요. Ray는 알을 낳아 번식하는 것을 새가 환경에 맞추는 방식의 한 사례로 확장합니다. 면밀한 관찰을 통해 드러난 바로는 모든 종류의 식물과 동물이 자신의 삶의 방식에 필요한 것을 갖추었다는 것이죠. 그래서 그는 적응을 모든 생물이 자연에서 자신에게 부여된 역할에 맞추는 방식의 표현이라고 보았어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 Ray의 주장이 먼저 제시되므로 이 글은 \u003cb class=\"key\">두괄식\u003c/b> 전개입니다. 이어서 두 번째 문장부터는 if로 시작하는 \u003cb class=\"key\">가정\u003c/b>을 세워 그 결과를 따져 보는 방식으로 주장을 뒷받침합니다. 세 번째와 네 번째 문장은 그 가정이 낳을 결과를 인과적으로 정리한 \u003cb class=\"key\">근거\u003c/b>이고, 다섯 번째와 여섯 번째 문장은 이를 새 전체에서 모든 생물로 넓힌 \u003cb class=\"key\">일반화\u003c/b>입니다. 즉 주장을 먼저 던지고 근거와 사례로 확인하는 \u003cb class=\"key\">주장-근거\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>If their young developed in an internal womb (2)\u003c/b>\u003cspan>가정·조건 제시\u003c/span>\u003cb>therefore (2)\u003c/b>\u003cspan>가정의 결과 연결\u003c/span>\u003cb>Consequently (3)\u003c/b>\u003cspan>인과·결과 제시\u003c/span>\u003cb>If birds bore live young (4)\u003c/b>\u003cspan>반대 상황 가정\u003c/span>\u003cb>one example (5)\u003c/b>\u003cspan>예시·일반화\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a good reason why birds reproduce by laying eggs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one example of the way that birds fit environment\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">every type of plant and animal is equipped for its way of life\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">adaptation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">every organism fits its assigned role in nature\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>알을 낳아 번식 (egg-laying)\u003c/th>\u003cth>체내 자궁에서 발달 (internal womb)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>새가 가볍게 날 수 있음\u003c/td>\u003ctd>새가 너무 무거워 날지 못함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>포식자로부터 안전함\u003c/td>\u003ctd>포식자에게 매우 취약함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>새가 계속 존재함\u003c/td>\u003ctd>머지않아 모든 새가 사라짐\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거로 짜인 두괄식 글입니다. 첫 번째 문장에서 새가 알을 낳는 데에는 타당한 이유가 있다는 주장이 먼저 나오죠. 그다음 if로 가정을 세워 결과를 따져 보는 방식으로 근거를 대고, 마지막에는 그 결론을 모든 생물로 넓힙니다. 그래서 주장을 먼저 던지고 근거와 예시로 확인하는 주장과 근거의 구조라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 두 번째 문장의 if는 가정을 여는 신호이고, therefore는 그 가정의 결과를 이어 주는 말이에요. 세 번째 문장의 Consequently도 앞의 내용이 원인이 되어 어떤 결과가 생기는지를 알려 주죠. 다섯 번째 문장의 one example은 새의 사례를 모든 생물로 넓히는 재진술의 신호이고, fit과 equipped, 그리고 마지막 문장의 adaptation은 모두 같은 개념을 바꿔 말한 표현들입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>naturalist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동식물 연구가, 박물학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>reproduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>번식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(알을) 낳다\u003c/span>\u003c/div>\u003cdiv>\u003cb>point out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>지적하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>develop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>성장하다, 발달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>internal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>내부의, 체내의\u003c/span>\u003c/div>\u003cdiv>\u003cb>womb\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자궁\u003c/span>\u003c/div>\u003cdiv>\u003cb>pregnant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>임신한, 새끼를 밴\u003c/span>\u003c/div>\u003cdiv>\u003cb>heavy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무거운\u003c/span>\u003c/div>\u003cdiv>\u003cb>therefore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>따라서, 그러므로\u003c/span>\u003c/div>\u003cdiv>\u003cb>vulnerable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>취약한, 상처받기 쉬운\u003c/span>\u003c/div>\u003cdiv>\u003cb>predator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포식자\u003c/span>\u003c/div>\u003cdiv>\u003cb>consequently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>결과적으로, 따라서\u003c/span>\u003c/div>\u003cdiv>\u003cb>before long\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>머지않아, 곧\u003c/span>\u003c/div>\u003cdiv>\u003cb>disappear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사라지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>낳다, 출산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>live\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>살아 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>reproduction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>번식, 생식\u003c/span>\u003c/div>\u003cdiv>\u003cb>fit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>맞추다, 적응시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>close\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>면밀한, 철저한\u003c/span>\u003c/div>\u003cdiv>\u003cb>examination\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관찰, 조사\u003c/span>\u003c/div>\u003cdiv>\u003cb>reveal\u003c/b>\u003cem>동사\u003c/em>\u003cspan>드러내다, 밝히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be equipped for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 필요한 것을 갖추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>way of life\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>삶의 방식\u003c/span>\u003c/div>\u003cdiv>\u003cb>adaptation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>적응\u003c/span>\u003c/div>\u003cdiv>\u003cb>expression\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표현\u003c/span>\u003c/div>\u003cdiv>\u003cb>organism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생물, 유기체\u003c/span>\u003c/div>\u003cdiv>\u003cb>assigned\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부여된, 주어진\u003c/span>\u003c/div>\u003cdiv>\u003cb>role\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역할\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚을게요. vulnerable은 취약한, predator는 포식자라는 뜻이고, before long은 머지않아라는 숙어예요. be equipped for는 무엇에 필요한 것을 갖추었다는 뜻으로, 생물이 자신의 삶의 방식에 맞게 준비되어 있다는 이 글의 핵심을 담고 있죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">vulnerable\u003c/b>\u003cspan class=\"m\">취약한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">exposed\u003c/span>\u003cspan class=\"s\">defenseless\u003c/span>\u003cspan class=\"s\">susceptible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">protected\u003c/span>\u003cspan class=\"a\">immune\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">predator\u003c/b>\u003cspan class=\"m\">포식자\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hunter\u003c/span>\u003cspan class=\"s\">killer\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">prey\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disappear\u003c/b>\u003cspan class=\"m\">사라지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">vanish\u003c/span>\u003cspan class=\"s\">fade away\u003c/span>\u003cspan class=\"s\">die out\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">appear\u003c/span>\u003cspan class=\"a\">emerge\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">consequently\u003c/b>\u003cspan class=\"m\">결과적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">therefore\u003c/span>\u003cspan class=\"s\">as a result\u003c/span>\u003cspan class=\"s\">hence\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">nevertheless\u003c/span>\u003cspan class=\"a\">however\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reveal\u003c/b>\u003cspan class=\"m\">드러내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">show\u003c/span>\u003cspan class=\"s\">disclose\u003c/span>\u003cspan class=\"s\">expose\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">adaptation\u003c/b>\u003cspan class=\"m\">적응\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adjustment\u003c/span>\u003cspan class=\"s\">accommodation\u003c/span>\u003cspan class=\"s\">acclimation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">maladaptation\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘를 동의어와 반의어로 정리해 볼게요. vulnerable은 exposed나 defenseless로 바꿔 쓸 수 있고, 반대말은 protected나 immune이에요. disappear는 vanish나 die out과 같은 뜻이고 반대말은 appear죠. predator는 hunter나 killer로 바꿀 수 있고 반대말은 prey예요. consequently는 therefore나 as a result로 바꿔 쓸 수 있고, reveal은 show나 disclose로 바꿀 수 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">John Ray는\u003c/span>\u003cspan class=\"en\">John Ray,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영국 동식물 연구가인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">English \u003c/span>\u003cspan class=\"tgt\">naturalist\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">믿었다\u003c/span>\u003cspan class=\"en\">believed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">타당한 이유가 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">reason\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새가 알을 낳아 번식하는지에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">birds \u003c/span>\u003cspan class=\"tgt\">reproduce \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">laying \u003c/span>\u003cspan class=\"tgt\">eggs\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">영국 동식물 연구가인 John Ray 는 새가 알을 낳아 번식하는 타당한 이유가 있다고 믿었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> John Ray가 새가 알을 낳아 번식하는 데는 \u003cb class=\"key\">타당한 \u003c/b>\u003cb class=\"key\">이유\u003c/b>가 있다고 말하며 글의 화제를 여는 문장이에요. 여기서 \u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">good \u003c/b>\u003cb class=\"key\">reason\u003c/b>은 그냥 이유 하나가 아니라 환경에 적응한 결과로 설명되는 이유라는 뜻이죠. 그래서 이 문장은 뒤에서 그 이유를 구체적으로 풀어 갈 \u003cb class=\"key\">도입부\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격(콤마 동격)\u003c/span> : [고유명사 John Ray] , [the English naturalist] , → 앞 명사와 뒤 명사가 같은 대상 : \"영국 동식물 연구가인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">there is 구문(유도부사)\u003c/span> : There + be동사 + [주어] + [수식어] : \"타당한 이유가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계부사 why\u003c/span> : [선행사 a good reason] + why + [주어 + 동사 ~] : \"새가 알을 낳아 번식하는 (이유)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : by + [동명사(-ing)] = ~함으로써, ~하는 방식으로 : \"알을 낳음으로써\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"John Ray, John Ray는. the English naturalist, 영국 동식물 연구가인. believed, 믿었다. there is a good reason, 타당한 이유가 있다고. why birds reproduce by laying eggs, 새가 알을 낳아 번식하는지에 대한. 이 문장 전체를 해석하면, 영국 동식물 연구가인 John Ray 는 새가 알을 낳아 번식하는 타당한 이유가 있다고 믿었다.","hl":"m"},{"n":13,"text":"이 문장은 John Ray가 새가 알을 낳아 번식하는 데는 타당한 이유가 있다고 말하며 이야기를 여는 부분이에요. 여기서 a good reason은 그냥 이유 하나가 아니라 환경에 적응한 결과로 설명되는 이유라는 뜻이죠. 그래서 이 문장은 뒤에서 그 이유를 하나씩 풀어 갈 도입부 역할을 합니다.","hl":"mn"},{"n":14,"text":"먼저 the English naturalist는 앞의 John Ray와 같은 대상을 가리키는 동격이에요. 콤마로 끼워 넣어 신분을 부연 설명해 주는 장치죠. 두 번째로 there is a good reason은 무엇이 있다를 존재로 먼저 알려 주는 구문이고, 세 번째로 why birds reproduce by laying eggs에서 why는 선행사 a good reason을 받는 관계부사로서 뒤에 완전한 절이 와요. 마지막으로 by laying eggs는 전치사 by 뒤에 동명사가 와서 방법을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 지적한 바에 따르면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">He \u003c/span>\u003cspan class=\"tgt\">pointed \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> *\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 새끼가 체내 자궁에서 성장한다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">young \u003c/span>\u003cspan class=\"tgt\">developed \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">internal \u003c/span>\u003cspan class=\"tgt\">womb\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새끼를 밴 새는 너무 무거워서 날지 못할 것이고\u003c/span>\u003cspan class=\"en\">pregnant birds would be \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">heavy \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fly\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 포식자에게 매우 취약할 것이다\u003c/span>\u003cspan class=\"en\">and would therefore be very \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">vulnerable \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">predators\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 지적한 바에 따르면 새끼가 체내 자궁에서 성장한다면, 새끼를 밴 새는 너무 무거워서 날지 못할 것이고 그래서 포식자에게 매우 취약할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 만약 새가 포유류처럼 \u003cb class=\"key\">체내 \u003c/b>\u003cb class=\"key\">자궁\u003c/b>에서 새끼를 키운다면 어떻게 될지를 상상하는 문장이에요. 새끼를 밴 새는 무거워져 날지 못하고, 그래서 \u003cb class=\"key\">포식자\u003c/b>에게 취약해질 수밖에 없다는 거죠. 알을 낳는 방식이 왜 새에게 유리한지 보여 주는 이 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">근거\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 목적어절\u003c/span> : [point out] + that + [주어 + 동사 ~] = ~라는 점을 지적하다 : \"그가 지적한 바에 따르면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가정법 과거(if절)\u003c/span> : If + [주어] + [과거동사] , [주어] + would + [동사원형] : \"만약 새끼가 체내 자궁에서 성장한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">too ~ to부정사(부정적 결과)\u003c/span> : too + [형용사] + to + [동사원형] = 너무 ~해서 …할 수 없다 : \"너무 무거워서 날지 못할\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">형용사 + 전치사 to\u003c/span> : be vulnerable to + [명사] = ~에 취약하다 : \"포식자에게 취약할\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He pointed out that, 그가 지적한 바에 따르면. if their young developed in an internal womb, 만약 새끼가 체내 자궁에서 성장한다면. pregnant birds would be too heavy to fly, 새끼를 밴 새는 너무 무거워서 날지 못할 것이고. and would therefore be very vulnerable to predators, 그래서 포식자에게 매우 취약할 것이다. 이 문장 전체를 해석하면, 그가 지적한 바에 따르면 새끼가 체내 자궁에서 성장한다면, 새끼를 밴 새는 너무 무거워서 날지 못할 것이고 그래서 포식자에게 매우 취약할 것이다.","hl":"m"},{"n":16,"text":"이 문장은 만약 새가 포유류처럼 체내 자궁에서 새끼를 키운다면 어떻게 될지를 상상하는 부분이에요. 새끼를 밴 새는 무거워져 날지 못하고, 그래서 포식자에게 취약해질 수밖에 없다는 거죠. 알을 낳는 방식이 왜 새에게 유리한지 보여 주는 이 글의 핵심 근거예요.","hl":"mn"},{"n":17,"text":"첫 번째로 that절은 point out의 목적어로 들어가서 무엇을 지적했는지를 채워 줘요. 두 번째로 if their young developed는 현재 사실과 반대되는 상상이라 과거형 developed를 쓰고 주절에는 would를 쓰는 가정법이에요. 세 번째로 too heavy to fly는 too와 to 사이 형용사가 정도를 나타내고 to부정사는 부정으로 해석해서 너무 무거워서 날 수 없다가 되죠. 마지막으로 be vulnerable to는 전치사 to와 짝을 이루어 포식자에게 취약하다는 뜻을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서\u003c/span>\u003cspan class=\"en\">Consequently,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새끼를 밴 새는 목숨을 잃게 될 것이고\u003c/span>\u003cspan class=\"en\">pregnant birds \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">killed\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">머지않아\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">long\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 새는 사라질 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">birds \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">disappear\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 새끼를 밴 새는 목숨을 잃게 될 것이고 머지않아 모든 새는 사라질 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 가정이 낳을 최종 결과를 \u003cb class=\"key\">인과\u003c/b>적으로 정리한 문장이에요. 새끼를 밴 새가 죽으면 머지않아 새 전체가 \u003cb class=\"key\">멸종\u003c/b>한다는 뜻이죠. 결국 알을 낳는 번식 방식이 종의 \u003cb class=\"key\">생존\u003c/b>과 직결된다는 결론으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 would + 수동태\u003c/span> : would + be + [과거분사] = ~하게 될 것이다(당할 것이다) : \"목숨을 잃게 될 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현(before long)\u003c/span> : before long = 머지않아, 곧 / long before = 오래 전에 : \"머지않아\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 would(가정법의 귀결)\u003c/span> : [If절 과거] , [주어] + would + [동사원형] : \"모든 새는 사라질 것이다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Consequently, 따라서. pregnant birds would be killed, 새끼를 밴 새는 목숨을 잃게 될 것이고. and before long, 머지않아. all birds would disappear, 모든 새는 사라질 것이다. 이 문장 전체를 해석하면, 따라서 새끼를 밴 새는 목숨을 잃게 될 것이고 머지않아 모든 새는 사라질 것이다.","hl":"m"},{"n":19,"text":"이 문장은 앞의 가정이 낳을 최종 결과를 인과적으로 정리한 부분이에요. 새끼를 밴 새가 죽으면 머지않아 새 전체가 멸종한다는 뜻이죠. 결국 알을 낳는 번식 방식이 종의 생존과 직결된다는 결론으로 이어집니다.","hl":"mn"},{"n":20,"text":"첫 번째로 would be killed는 주어인 새끼를 밴 새가 죽는 대상이기 때문에 be killed라는 수동태를 쓴 거예요. 앞의 would는 가정법의 귀결을 이어받아 이렇게 될 거라는 뜻을 더하고요. 두 번째로 before long은 머지않아라는 덩어리 표현이고, 어순이 바뀌어 long before가 되면 오래 전에가 되니까 조심해야 해요. 세 번째로 all birds would disappear의 would도 앞 가정이 낳을 결과를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 새가 새끼를 낳는다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">birds \u003c/span>\u003cspan class=\"tgt\">bore \u003c/span>\u003cspan class=\"tgt\">live \u003c/span>\u003cspan class=\"tgt\">young\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 마리의 새도 존재할 수 없을 것이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">birds\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">새가 새끼를 낳는다면, 한 마리의 새도 존재할 수 없을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 새가 새끼를 낳는 \u003cb class=\"key\">태생\u003c/b>으로 번식한다면 새가 \u003cb class=\"key\">멸종\u003c/b>했을 것이라는 \u003cb class=\"key\">가정\u003c/b>을 통해 알 낳기의 필요성을 강조한다. 결국 알을 낳는 번식 방식이 새에게 꼭 필요하다는 점을 뒷받침하는 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거(현재 사실의 반대)\u003c/span> : If + 주어 + 과거동사, 주어 + 조동사 과거형 + 동사원형 : \"만약 새가 새끼를 낳는다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">there is 구문 + 조동사 could\u003c/span> : There + could + be + 명사 : \"새가 존재할 수 없을 것이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"If birds bore live young, 만약 새가 새끼를 낳는다면. there could be no birds, 한 마리의 새도 존재할 수 없을 것이다.. 이 문장 전체를 해석하면, 새가 새끼를 낳는다면, 한 마리의 새도 존재할 수 없을 것이다.","hl":"m"},{"n":22,"text":"이 문장은 새가 태생으로 번식한다면 새가 멸종했을 것이라는 가정을 통해 알 낳기의 필요성을 보여 줘요. 결국 알을 낳는 번식 방식이 새에게 꼭 필요하다는 점을 뒷받침하는 거죠.","hl":"mn"},{"n":23,"text":"If birds bore live young은 현재 사실의 반대를 가정하는 가정법 과거예요. 그래서 bear의 과거형 bore를 쓰고, there could be no birds에서는 there is 구문에 조동사 could가 붙어 새가 존재할 수 없다는 뜻을 만들어요. if절의 과거동사는 현실과 반대되는 상황을 표시한다는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알을 낳아 번식하는 것은\u003c/span>\u003cspan class=\"en\">Reproduction by egg-laying\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방식의 한 사례이다\u003c/span>\u003cspan class=\"en\">is one example of the way/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새가 환경에 맞추는\u003c/span>\u003cspan class=\"en\">that birds fit environment,/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 면밀한 관찰을 통해 드러난 바로는\u003c/span>\u003cspan class=\"en\">and close examination \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">revealed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 종류의 식물과 동물이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> every type of plant and animal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 삶의 방식에 필요한 것을 갖추었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">equipped \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">알을 낳아 번식하는 것은 새가 환경에 맞추는 방식의 한 사례이고, 면밀한 관찰을 통해 드러난 바로는 모든 종류의 식물과 동물이 자신의 삶의 방식에 필요한 것을 갖추었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 알을 낳는 번식이 새가 \u003cb class=\"key\">환경에 \u003c/b>\u003cb class=\"key\">맞추는\u003c/b> 방식의 한 사례임을 제시하고, 면밀한 관찰을 통해 모든 생물이 자신의 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">방식\u003c/b>에 필요한 것을 \u003cb class=\"key\">갖추었음\u003c/b>을 밝힌다. 즉 번식 방식 하나만 보아도 생물이 환경에 적응한 결과라는 점을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that절을 목적어로 취하는 타동사\u003c/span> : reveal + that + 주어 + 동사 : \"~라는 사실이 드러났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be equipped for)\u003c/span> : be + p.p. + for + 명사 : \"자신의 삶의 방식에 필요한 것을 갖추었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">관계부사 that(the way that)\u003c/span> : the way + that + 주어 + 동사 : \"새가 환경에 맞추는 방식\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Reproduction by egg-laying, 알을 낳아 번식하는 것은. is one example of the way, 방식의 한 사례이다. that birds fit environment, 새가 환경에 맞추는. and close examination revealed, 그리고 면밀한 관찰을 통해 드러난 바로는. that every type of plant and animal, 모든 종류의 식물과 동물이. is equipped for its way of life, 자신의 삶의 방식에 필요한 것을 갖추었다.. 이 문장 전체를 해석하면, 알을 낳아 번식하는 것은 새가 환경에 맞추는 방식의 한 사례이고, 면밀한 관찰을 통해 드러난 바로는 모든 종류의 식물과 동물이 자신의 삶의 방식에 필요한 것을 갖추었다.","hl":"m"},{"n":25,"text":"이 문장은 알을 낳는 번식이 새가 환경에 맞추는 방식의 한 사례임을 제시해요. 그리고 면밀한 관찰을 통해 모든 식물과 동물이 자신의 삶의 방식에 필요한 것을 갖추었음이 드러났다는 뜻이에요.","hl":"mn"},{"n":26,"text":"여기서 the way that은 새가 환경에 맞추는 방식이라는 뜻을 만드는 관계부사 that이에요. 그래서 the way가 선행사 역할을 해요. revealed 뒤의 that절은 동사의 목적어로 쓰여 드러난 내용을 이끌고, is equipped for는 수동태로 필요한 것을 갖추었다는 의미를 나타내요. be equipped for는 자신의 삶의 방식에 맞게 준비되어 있다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Ray는 적응을 보았다\u003c/span>\u003cspan class=\"en\">Ray \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">saw \u003c/span>\u003cspan class=\"tgt\">adaptation \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">표현이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">expression\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방식의\u003c/span>\u003cspan class=\"en\">of the way/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 생물이 맞추는\u003c/span>\u003cspan class=\"en\">that every organism fits\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신에게 부여된 역할에\u003c/span>\u003cspan class=\"en\">its \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">assigned\u003c/span> role\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연에서.\u003c/span>\u003cspan class=\"en\">in nature.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Ray 는 적응을 모든 생물이 자연에서 자신에게 부여된 역할에 적절하게 맞추는 방식의 표현이라고 보았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Ray가 적응을 모든 생물이 자연에서 자신에게 \u003cb class=\"key\">부여된 \u003c/b>\u003cb class=\"key\">역할\u003c/b>에 맞추는 방식의 \u003cb class=\"key\">표현\u003c/b>이라고 본 것임을 나타낸다. 즉 적응은 생물이 자연 속에서 맡은 \u003cb class=\"key\">역할\u003c/b>에 알맞게 살아가는 방식이 겉으로 드러난 것이라는 뜻이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">see A as B 구문\u003c/span> : see + 목적어 + as + 명사(보어) : \"적응을 표현이라고 보았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(수동)\u003c/span> : 명사 + p.p. : \"부여된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">관계부사 that(the way that)\u003c/span> : the way + that + 주어 + 동사 : \"모든 생물이 맞추는 방식\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Ray saw adaptation, Ray는 적응을 보았다. as an expression, 표현이라고. of the way, 방식의. that every organism fits, 모든 생물이 맞추는. its assigned role, 자신에게 부여된 역할에. in nature, 자연에서.. 이 문장 전체를 해석하면, Ray 는 적응을 모든 생물이 자연에서 자신에게 부여된 역할에 적절하게 맞추는 방식의 표현이라고 보았다.","hl":"m"},{"n":28,"text":"이 문장은 Ray가 적응을 모든 생물이 자연에서 자신에게 부여된 역할에 맞추는 방식의 표현이라고 본 거예요. 즉 적응은 생물이 자연 속에서 맡은 역할에 알맞게 살아가는 방식이 겉으로 드러난 것이라는 뜻이에요.","hl":"mn"},{"n":29,"text":"saw adaptation as an expression은 see A as B 구조로 적응을 표현이라고 본다는 뜻이고, adaptation이 목적어, as an expression이 목적격 보어예요. the way that은 모든 생물이 맞추는 방식이라는 뜻을 이어 주는 관계부사 that이고 the way를 수식해요. assigned는 과거분사로 역할이 부여된이라는 수동의 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>John Ray는 새가 알을 낳아 번식하는 데에는 \u003cb class=\"key\">타당한 \u003c/b>\u003cb class=\"key\">이유\u003c/b>가 있다고 믿었다.\u003c/li>\u003cli>새끼가 \u003cb class=\"key\">체내 \u003c/b>\u003cb class=\"key\">자궁\u003c/b>에서 성장하면 새는 너무 무거워 날지 못해 \u003cb class=\"key\">포식자\u003c/b>에게 취약해지고 머지않아 사라질 것이다.\u003c/li>\u003cli>그래서 새가 새끼를 낳는다면 한 마리의 새도 존재할 수 없으며, 알을 낳아 번식하는 방식만이 살아남는다.\u003c/li>\u003cli>결국 알을 낳는 번식은 새가 \u003cb class=\"key\">환경에 \u003c/b>\u003cb class=\"key\">맞추는 \u003c/b>\u003cb class=\"key\">방식\u003c/b>의 한 사례이고, 모든 생물은 자신의 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">방식\u003c/b>에 필요한 것을 갖추고 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Reproduction by egg-laying is one example of the way birds fit their environment, showing that every organism is equipped for the way of life assigned to it.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">John Ray는 새가 알을 낳아 번식하는 데에는 타당한 이유가 있다고 보았다. 새끼가 체내 자궁에서 성장한다면 새는 너무 무거워 날지 못해 포식자에게 취약해지고 머지않아 사라질 것이므로, 알을 낳아 번식하는 것은 새가 \u003cb class=\"key\">환경에 \u003c/b>\u003cb class=\"key\">맞추는 \u003c/b>\u003cb class=\"key\">방식\u003c/b>의 한 사례이자 \u003cb class=\"key\">적응\u003c/b>의 표현이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 글의 핵심은 아주 분명해요. 새가 알을 낳는 것은 우연이 아니라 날 수 있음을 지키기 위한 적응이고, Ray는 그렇게 모든 생물이 자연에서 맡은 역할에 맞게 갖추어져 있다고 보았습니다. 시험에서는 첫 문장의 주장과 if로 시작하는 가정의 결과를 연결해서 읽는 것이 가장 중요해요. 오늘 수업 여기까지입니다, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
