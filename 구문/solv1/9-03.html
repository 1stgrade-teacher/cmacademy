<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 9강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 9강 적용독해03","audioDir":"9-03_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">9강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>From Lance to Pen: The Story of Freelancers\u003c/h1>\u003ch2>창에서 펜으로: 프리랜서 이야기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 'freelancer'는 원래 돈을 받고 싸우던 창을 든 병사를 뜻했지만, 오늘날에는 큰 뉴스거리가 있는 위험한 현장에서 보도하며 돈을 버는 \u003cb class=\"key\">프리랜스 \u003c/b>\u003cb class=\"key\">기자\u003c/b>를 가리킨다. 이들은 위험한 일 속에서 \u003cb class=\"key\">짜릿한 \u003c/b>\u003cb class=\"key\">흥분\u003c/b>과 \u003cb class=\"key\">자부심\u003c/b>을 느낀다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The word &quot;freelancer&quot; has shifted from soldiers who fought for money to freelance reporters who cover dangerous news, and these reporters love the excitement and take pride in their work.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 freelancer라는 단어의 뜻이 어떻게 변해 왔는지 다루는 글이에요. 옛날에는 창을 들고 돈을 받고 싸우던 사람을 뜻했다면, 오늘날에는 위험한 현장에서 뉴스를 전하는 프리랜스 기자를 뜻한다는 내용이죠. 요지는 이 단어의 의미가 군인에서 기자로 옮겨 갔고, 그 기자들은 위험 속에서도 짜릿한 흥분과 자부심을 느낀다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">프리랜서(freelancer)는 특정 회사나 조직에 \u003cb class=\"key\">소속\u003c/b>되지 않고 일한 만큼 돈을 받는 사람을 말해요. 이런 고용 형태를 독립 계약자(independent contractor)라고 부르고, 반대 개념은 조직에 묶인 정규직(employee)이에요. 'lance'는 중세 기사가 쓰던 긴 창을 뜻해서, 원래 프리랜서는 창을 들고 돈을 받고 싸우던 \u003cb class=\"key\">용병\u003c/b>(mercenary)이었어요. 요즘은 이 단어가 기자, 디자이너, 프로그래머처럼 다양한 분야로 퍼졌죠. 학교 축제에서 우리 반 무대만 따로 도와주러 온 외부 조명 팀처럼, 필요할 때만 불려 와서 자기 기술로 일하는 사람들이라고 생각하면 쉬워요. 그래서 프리랜서라는 말에는 \u003cb class=\"key\">자유\u003c/b>와 \u003cb class=\"key\">불안정\u003c/b>이라는 두 얼굴이 함께 담겨 있어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 프리랜서는 특정 회사나 조직에 소속되지 않고 일한 만큼 돈을 받는 사람을 말해요. 영어로는 independent contractor라고도 부르고, 조직에 묶인 정규직은 employee라고 하죠. 그리고 lance는 중세 기사가 쓰던 긴 창을 뜻하는 단어예요. 그래서 원래 프리랜서는 창을 들고 돈을 받고 싸우던 용병, 즉 mercenary를 가리켰답니다. 학교 축제 때 우리 반 무대만 따로 도와주러 온 외부 조명 팀처럼, 필요할 때 불려 와서 자기 기술로 일하는 사람들이라고 생각하면 이해가 쉬워요. 그래서 프리랜서라는 말에는 자유와 불안정이라는 두 얼굴이 함께 담겨 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문과 어원\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 'freelancer'라는 말을 들어본 적이 있는지 \u003cb class=\"key\">질문\u003c/b>을 던지며 시작한다. 이어서 free는 '어떤 조직에도 속하지 않는', lancer는 '창을 든 병사'라는 \u003cb class=\"key\">어원\u003c/b>을 하나씩 풀어 준다. 두 단어가 합쳐진 의미가 곧 이 글 전체를 이끄는 \u003cb class=\"key\">열쇠\u003c/b>가 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>과거의 프리랜서\u003csmall>과거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>옛날의 프리랜서는 돈을 벌기 위해 전 세계를 돌아다니며 싸우는 \u003cb class=\"key\">프리랜스 \u003c/b>\u003cb class=\"key\">군인\u003c/b>이었다. 창을 들고 전쟁터를 옮겨 다니던 \u003cb class=\"key\">용병\u003c/b>의 모습이다. 그러나 이제 그런 프리랜스 군인은 많지 않다고 말하며 과거 이야기를 \u003cb class=\"key\">마무리\u003c/b>한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>오늘날의 의미\u003csmall>전환 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>'These days'라는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">전환\u003c/b> 표시와 함께 단어의 뜻이 오늘날로 옮겨 온다. 이제 'freelancer'라고 하면 보통 프리랜스 기자, 즉 \u003cb class=\"key\">프리랜스 \u003c/b>\u003cb class=\"key\">기자\u003c/b>를 뜻한다. 실제로 많은 프리랜스 기자들이 전 세계에서 \u003cb class=\"key\">활동\u003c/b>하고 있다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>하는 일과 이유\u003csmall>근거 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>이들은 큰 뉴스거리가 있는 \u003cb class=\"key\">현장\u003c/b>에 가서 보도하며 돈을 번다. TV 방송국과 신문사가 이들의 서비스를 기꺼이 이용하는 이유는, 그들이 가는 곳이 대개 자기 \u003cb class=\"key\">직원\u003c/b>을 보내기에는 너무 위험하기 때문이다. 다시 말해 위험이라는 \u003cb class=\"key\">대가\u003c/b>를 프리랜서가 대신 지는 셈이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>위험과 자부심\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>프리랜서의 일은 매우 위험하지만, 이들 기자들은 그 일의 \u003cb class=\"key\">짜릿한 \u003c/b>\u003cb class=\"key\">흥분\u003c/b>을 사랑한다. 또 그들이 아니면 사람들이 들을 기회가 없는 \u003cb class=\"key\">이야기\u003c/b>를 전해 준다는 사실이 일에 대한 \u003cb class=\"key\">자부심\u003c/b>을 준다. 결국 이 글은 위험이라는 조건과 보람이라는 가치를 함께 보여 주며 끝난다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"글은 freelancer라는 말을 들어본 적 있냐고 질문을 던지며 시작해요. 그러고는 free가 어떤 조직에도 속하지 않는다는 뜻이고, lancer가 창을 든 병사라는 뜻이라고 어원을 하나씩 풀어 주죠. 이 두 단어의 의미가 합쳐진 것이 이 글 전체를 이끄는 열쇠예요.","hl":"f0"},{"n":5,"text":"옛날의 프리랜서는 돈을 벌기 위해 전 세계를 돌아다니며 싸우는 프리랜스 군인이었어요. 창을 들고 전쟁터를 옮겨 다니던 용병의 모습이죠. 그런데 이제 그런 프리랜스 군인은 많지 않다고 하면서 과거 이야기를 마무리해요.","hl":"f1"},{"n":6,"text":"These days라는 시간 전환 표시와 함께 단어의 뜻이 오늘날로 옮겨 와요. 이제 freelancer라고 하면 보통 프리랜스 기자를 뜻한다고 말하죠. 실제로 많은 프리랜스 기자들이 전 세계에서 활동하고 있다고 이어집니다.","hl":"f2"},{"n":7,"text":"그들은 큰 뉴스거리가 있는 현장에 가서 보도하며 돈을 벌어요. TV 방송국과 신문사가 이들의 서비스를 기꺼이 이용하는 이유는, 그들이 가는 곳이 대개 자기 직원을 보내기에는 너무 위험하기 때문이에요. 다시 말해 위험이라는 대가를 프리랜서가 대신 지는 셈이죠.","hl":"f3"},{"n":8,"text":"프리랜서의 일은 매우 위험하지만, 이들 기자들은 그 일의 짜릿한 흥분을 사랑해요. 또 그들이 아니면 사람들이 들을 기회가 없는 이야기를 전해 준다는 사실이 일에 대한 자부심을 준다고 해요. 결국 이 글은 위험이라는 조건과 보람이라는 가치를 함께 보여 주며 끝난답니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 'freelancer'라는 \u003cb class=\"key\">질문\u003c/b>을 던지고, 어원과 과거 의미를 차례로 풀어 나가다가 마지막 문장에서 이 일이 주는 \u003cb class=\"key\">자부심\u003c/b>으로 글을 맺기 때문이다. 핵심 결론이 글 끝에 놓인 \u003cb class=\"key\">미괄식\u003c/b> 구조이다. 또한 'These days'를 기준으로 과거와 현재의 의미가 \u003cb class=\"key\">전환\u003c/b>되는 흐름을 함께 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Have you ever heard of (1)\u003c/b>\u003cspan>도입 질문\u003c/span>\u003cb>In ancient times (3)\u003c/b>\u003cspan>과거 시간 표시\u003c/span>\u003cb>anymore (4)\u003c/b>\u003cspan>과거 의미의 종결\u003c/span>\u003cb>These days (5)\u003c/b>\u003cspan>현재로의 전환\u003c/span>\u003cb>since (8)\u003c/b>\u003cspan>이유 제시\u003c/span>\u003cb>but (9)\u003c/b>\u003cspan>대조·반전\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">freelancer\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a soldier with a lance\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">people who traveled around the world fighting for money\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a freelance reporter\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">freelance reporters\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these reporters\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>옛날의 프리랜서(프리랜스 군인)\u003c/th>\u003cth>오늘날의 프리랜서(프리랜스 기자)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>창을 들고 돈을 받고 싸움\u003c/td>\u003ctd>카메라와 펜으로 현장을 보도\u003c/td>\u003c/tr>\u003ctr>\u003ctd>전쟁터를 돌아다님\u003c/td>\u003ctd>큰 뉴스거리가 있는 곳으로 감\u003c/td>\u003c/tr>\u003ctr>\u003ctd>이제는 거의 사라짐\u003c/td>\u003ctd>전 세계에서 활발히 활동\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 질문과 답변이에요. freelancer가 무슨 뜻이냐는 질문에서 출발해 어원, 과거, 현재의 순서로 답을 채워 가니까요. 그리고 중요한 결론, 즉 이 일이 주는 자부심이 마지막 문장에 놓여 있어서 미괄식 구조라고 볼 수 있어요. 주제문은 열 번째 문장이에요.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. 첫 번째 문장의 Have you ever heard of는 도입 질문을 던지는 표현이고, In ancient times는 과거로, These days는 현재로 시간을 옮겨 주는 신호예요. anymore는 과거 의미가 끝났음을 알려 주고, since는 이유를, but은 위험과 보람이라는 대조를 이끌어 냅니다. 이렇게 시간 표시어를 축으로 잡으면 재진술이 보여요. freelancer가 people who traveled around the world fighting for money로, 다시 a freelance reporter로, 마지막에는 these reporters로 바뀌어 가니까요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>hear of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 들어보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>freelancer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>프리랜서\u003c/span>\u003c/div>\u003cdiv>\u003cb>belong to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 속하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>organization\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조직, 단체\u003c/span>\u003c/div>\u003cdiv>\u003cb>lancer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>창을 든 병사\u003c/span>\u003c/div>\u003cdiv>\u003cb>ancient\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고대의, 옛날의\u003c/span>\u003c/div>\u003cdiv>\u003cb>travel around\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌아다니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fight for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 위해 싸우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>anymore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 이상\u003c/span>\u003c/div>\u003cdiv>\u003cb>these days\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>요즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>usually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>보통, 대개\u003c/span>\u003c/div>\u003cdiv>\u003cb>reporter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기자\u003c/span>\u003c/div>\u003cdiv>\u003cb>all around the world\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전 세계에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>area\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지역, 곳\u003c/span>\u003c/div>\u003cdiv>\u003cb>happen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일어나다, 발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>earn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(돈을) 벌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>report on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 보도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>channel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(TV) 채널, 방송국\u003c/span>\u003c/div>\u003cdiv>\u003cb>be happy to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기꺼이 ~하다\u003c/span>\u003c/ s\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 지금까지 ~해 본 적이 있니\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Have \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">ever \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 대해 들어본\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">heard \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“프리랜서”라는 말을?\u003c/span>\u003cspan class=\"en\">a &quot;freelancer&quot;?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“프리랜서”라는 말을 들어본 적이 있는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글을 시작하며 독자에게 \u003cb class=\"key\">질문\u003c/b>을 던져 흥미를 끄는 \u003cb class=\"key\">도입\u003c/b> 문장이에요. 우리가 흔히 쓰는 freelancer라는 단어의 뜻을 함께 생각해 보게 만드는 질문이죠. 뒤에서 이 단어가 어떻게 만들어졌는지 설명할 것을 미리 예고하는 역할도 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 경험 용법(의문문)\u003c/span> : [[Have]] + 주어 + [[ever]] + [[과거분사]] ~? : \"지금까지 ~해 본 적이 있니?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 hear of\u003c/span> : [[hear of]] + 명사(~에 대해 들어보다) : \"~에 대해 들어본\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Have you ever, 너는 지금까지 ~해 본 적이 있니. heard of, ~에 대해 들어본. a \"freelancer\"?, “프리랜서”라는 말을?. 이 문장 전체를 해석하면, “프리랜서”라는 말을 들어본 적이 있는가?","hl":"m"},{"n":14,"text":"이 문장은 글을 여는 질문이에요. 독자에게 질문을 던져 흥미를 끄는 도입 역할을 하죠. 우리가 흔히 쓰는 freelancer라는 단어의 뜻을 한 번 생각해 보게 만드는 문장이에요.","hl":"mn"},{"n":15,"text":"먼저 Have you ever heard는 현재완료 경험을 묻는 형태예요. have가 주어 앞으로 나가고 ever가 들어가면 지금까지 한 번이라도 해 봤는지를 묻는 경험이 되죠. 다음으로 heard of는 hear of라는 구동사로 소식을 들어보다라는 뜻이에요. of라는 전치사까지 붙여서 하나로 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“ free ”는\u003c/span>\u003cspan class=\"en\">&quot;Free&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뜻한다\u003c/span>\u003cspan class=\"en\">means\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“어떤 조직에도 속하지 않는”다는\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">belonging \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">organization\u003c/span>&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">and\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“ lancer ”는\u003c/span>\u003cspan class=\"en\">&quot;lancer&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뜻한다\u003c/span>\u003cspan class=\"en\">means\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“창을 든 병사”라는\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">soldier \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lance\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“ free ”는 “어떤 조직에도 속하지 않는”다는 뜻이고 “ lancer ”는 “창을 든 병사”라는 뜻이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 freelancer라는 단어를 free와 lancer로 나눠서 각각의 \u003cb class=\"key\">뜻\u003c/b>을 알려 주는 \u003cb class=\"key\">정의\u003c/b> 문장이에요. 두 부분이 and로 대등하게 연결되어 같은 방식으로 뜻을 풀어 주고 있죠. 독자가 단어의 이미지를 머릿속에 그리도록 도와주는 부분입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구의 부정(not + 동명사)\u003c/span> : [[not]] + [[동명사]] + 전치사 + 목적어 : \"어떤 조직에도 속하지 않는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [[명사]] + with + [[명사]](~을 가진) : \"창을 든 병사\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"\"Free\", “ free ”는. means, 뜻한다. \"not belonging to any organization\", “어떤 조직에도 속하지 않는”다는. and, 그리고. \"lancer\", “ lancer ”는. means, 뜻한다. \"a soldier with a lance.\", “창을 든 병사”라는. 이 문장 전체를 해석하면, “ free ”는 “어떤 조직에도 속하지 않는”다는 뜻이고 “ lancer ”는 “창을 든 병사”라는 뜻이다.","hl":"m"},{"n":17,"text":"이 문장은 freelancer라는 단어를 free와 lancer로 쪼개서 각각의 뜻을 설명해 줘요. 두 부분이 and로 나란히 연결되어 같은 방식으로 뜻을 풀어 주고 있죠. 단어의 정의를 내리는 아주 중요한 부분이에요.","hl":"mn"},{"n":18,"text":"먼저 not belonging to any organization을 보세요. be동사 뒤에서 주격 보어 역할을 하는 동명사구인데, 부정할 때는 동명사 앞에 not을 붙여요. 여기서 belong to는 자동사라서 전치사 to가 꼭 필요하다는 점도 기억해 주세요. 두 번째로 a soldier with a lance에서 with a lance는 앞의 명사 soldier를 뒤에서 꾸며 주는 전치사구예요. 그래서 창을 가진 병사, 다시 말해 창을 든 병사로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옛날에는\u003c/span>\u003cspan class=\"en\">In ancient times,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프리랜서란 사람들이었다\u003c/span>\u003cspan class=\"en\">freelancers were people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계를 돌아다니는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">traveled \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈을 벌기 위해 싸우면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">fighting \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">옛날에는 프리랜서란 돈을 벌기 위해 전 세계를 돌아다니며 싸우는 사람들이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 옛날의 프리랜서가 어떤 사람들이었는지 \u003cb class=\"key\">정의\u003c/b>해 주는 문장이에요. 앞에서 설명한 free와 lancer의 이미지를 실제 사람의 모습으로 보여 주는 거죠. 과거의 의미와 현재의 의미를 이어 주는 \u003cb class=\"key\">전환\u003c/b>의 출발점이 되는 부분입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [[선행사]] people + [[who]] + [[동사]] ~ : \"전 세계를 돌아다닌 (사람들)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구(동시 동작·부대상황)\u003c/span> : 주절 + [[현재분사]] ~ing (~하면서) : \"돈을 벌기 위해 싸우면서\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"In ancient times, 옛날에는. freelancers were people, 프리랜서란 사람들이었다. who traveled around the world, 전 세계를 돌아다니는. fighting for money, 돈을 벌기 위해 싸우면서. 이 문장 전체를 해석하면, 옛날에는 프리랜서란 돈을 벌기 위해 전 세계를 돌아다니며 싸우는 사람들이었다.","hl":"m"},{"n":20,"text":"이 문장은 옛날 프리랜서가 어떤 사람들이었는지 정의해 주는 문장이에요. 앞에서 설명한 free와 lancer의 이미지를 실제 사람의 모습으로 보여 주는 거죠. 그래서 단어의 정의를 기억할 때 아주 중요한 문장이에요.","hl":"mn"},{"n":21,"text":"먼저 who traveled around the world를 보면 앞의 people을 받아 꾸며 주는 주격 관계대명사예요. 관계대명사 뒤에는 동사가 바로 온다는 것, 잊지 마세요. 두 번째로 fighting for money는 현재분사구로 주어인 freelancers가 전 세계를 돌아다니는 것과 동시에 싸웠다는 동시 동작을 나타내요. for money는 돈을 위해인데, 문맥에 맞게 돈을 벌기 위해로 풀어 주면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많지 않은 프리랜스 군인들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">many\u003c/span> freelance soldiers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상은\u003c/span>\u003cspan class=\"en\">anymore.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제 프리랜스 군인들은 많지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 고대의 프리랜서는 돈을 받고 싸우는 군인이었다고 했죠. 이 문장은 그런 \u003cb class=\"key\">프리랜스 \u003c/b>\u003cb class=\"key\">군인\u003c/b>이 \u003cb class=\"key\">오늘날\u003c/b>에는 거의 없다고 알려 줘요. 옛 이야기에서 현재 이야기로 넘어가는 \u003cb class=\"key\">화제 \u003c/b>\u003cb class=\"key\">전환\u003c/b>의 신호 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 There + be동사(존재 구문)\u003c/span> : There + be동사 + 주어 (~이/가 있다) : \"~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정어 not + many(부분 부정)\u003c/span> : not + many + 복수명사 (~가 많지 않다) : \"많지 않은\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"There are, ~이 있다. not many freelance soldiers, 많지 않은 프리랜스 군인들이. anymore, 더 이상은. 이 문장 전체를 해석하면, 이제 프리랜스 군인들은 많지 않다.","hl":"m"},{"n":23,"text":"앞에서 고대의 프리랜서는 돈을 받고 싸우는 군인이었다고 했죠. 그런 프리랜스 군인은 오늘날에는 거의 볼 수 없다는 걸 이 문장이 알려 줘요. 옛날 이야기에서 지금 이야기로 넘어가는 화제 전환의 신호라고 보면 됩니다.","hl":"mn"},{"n":24,"text":"먼저 There are는 유도부사 there로 시작해서 많은 프리랜스 군인들이 존재한다는 걸 먼저 던져 주는 형태예요. 그래서 주어 many freelance soldiers가 동사 뒤로 밀려나는 도치가 일어나죠. 다음으로 not many는 많지 않다는 부분 부정을 만들고, 문장 끝의 anymore와 만나 더 이상 없다는 완전 부정으로 바뀝니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">These \u003c/span>\u003cspan class=\"tgt\">days,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 freelancer라는 단어를 말할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">say \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">word \u003c/span>\u003cspan class=\"tgt\">&quot;freelancer,&quot;\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 보통 뜻한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it\u003c/span> usually means\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프리랜스 기자를\u003c/span>\u003cspan class=\"en\">a freelance reporter.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날, “프리랜서”라고 하면, 그것은 보통 프리랜스(어떤 조직에 소속되지 않은) 기자를 뜻한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 freelancer라는 단어의 뜻이 옛날과 달라졌다는 걸 정리해요. 요즘 이 단어를 쓰면 조직에 소속되지 않은 기자, 즉 \u003cb class=\"key\">프리랜스 \u003c/b>\u003cb class=\"key\">기자\u003c/b>를 가리킨다는 거죠. 앞 문장의 옛 의미와 대비되는 \u003cb class=\"key\">현대적 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 제시하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사구 These days(시간 부사어)\u003c/span> : These days, + 주절 (~요즘, 주절) : \"오늘날에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 when이 이끄는 시간 부사절\u003c/span> : When + 주어 + 동사, + 주절 (~할 때, 주절) : \"우리가 freelancer라는 단어를 말할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지시대명사 it\u003c/span> : it(앞에 나온 말을 받음) + 동사 : \"그것은\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"These days, 오늘날에는. when we say the word \"freelancer,\", 우리가 freelancer라는 단어를 말할 때. it usually means, 그것은 보통 뜻한다. a freelance reporter, 프리랜스 기자를. 이 문장 전체를 해석하면, 오늘날, “프리랜서”라고 하면, 그것은 보통 프리랜스(어떤 조직에 소속되지 않은) 기자를 뜻한다.","hl":"m"},{"n":26,"text":"이 문장은 freelancer라는 단어의 뜻이 옛날과 많이 달라졌다는 걸 정리해 줘요. 요즘 이 단어를 쓰면 조직에 소속되지 않은 기자, 즉 프리랜스 기자를 가리키죠. 앞 문장의 옛 의미와 대비되는 현대적 의미를 제시하는 역할을 합니다.","hl":"mn"},{"n":27,"text":"첫 번째로 These days는 전치사 없이 굳어서 쓰는 관용 부사구로, 문장 전체의 시간 배경을 정해 줘요. 두 번째로 when we say the word freelancer는 접속사 when이 이끄는 부사절이라 뜻이 혼자 완성되지 않고 뒤 주절을 수식하면서 시간 조건을 붙입니다. 세 번째로 it은 바로 앞에 나온 the word freelancer를 받는 지시대명사예요. 그래서 해석할 때 그것은이라고 받아 주면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 프리랜스 기자들이\u003c/span>\u003cspan class=\"en\">many freelance reporters\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계에서 활동하고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 프리랜스 기자들이 전 세계에서 활동하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 프리랜스 기자의 존재를 꺼냈다면, 이 문장은 그들이 어디서 일하는지를 덧붙여요. 바로 \u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">세계\u003c/b>에서 활동하고 있다는 사실을 \u003cb class=\"key\">현재분사\u003c/b>로 묶어 설명하는 거죠. 뒤 문장에서 위험한 지역으로 가는 이야기로 자연스럽게 이어지는 발판이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 There + be동사(존재 구문)\u003c/span> : There + be동사 + 주어 + (수식어) : \"~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구의 후치 수식\u003c/span> : 명사 + [현재분사(-ing) + 수식어] (능동 관계) : \"전 세계에서 활동하고 있는\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"There are, ~이 있다. many freelance reporters, 많은 프리랜스 기자들이. working all around the world, 전 세계에서 활동하고 있는. 이 문장 전체를 해석하면, 많은 프리랜스 기자들이 전 세계에서 활동하고 있다.","hl":"m"},{"n":29,"text":"앞 문장에서 프리랜스 기자가 많다고 했는데, 이 문장은 그들이 어디서 일하는지를 덧붙여 줘요. 바로 전 세계에서 활동하고 있다는 사실을 현재분사 working으로 묶어서 설명하는 거죠. 짧은 문장이지만 기자들의 활동 범위를 확 넓혀 주는 역할을 합니다.","hl":"mn"},{"n":30,"text":"먼저 There are는 유도부사 there로 존재를 먼저 알려 주는 구문이에요. 주어 many freelance reporters가 동사 뒤에 놓여도 전혀 어색하지 않죠. 두 번째로 working all around the world는 앞의 many freelance reporters를 뒤에서 꾸미는 현재분사구예요. 기자들이 스스로 활동하는 능동 관계라서 ing 형태를 쓴다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 한 지역에 간다\u003c/span>\u003cspan class=\"en\">They go to \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">area \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 뉴스가 일어나고 있는 곳\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">news \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">happening\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 돈을 번다\u003c/span>\u003cspan class=\"en\">and earn money\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 보도함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">reporting \u003c/span>\u003 체가 이들에게 \u003cb class=\"key\">자부심\u003c/b>을 준다는 뜻이죠. 앞 문장의 '위험하지만 흥미를 사랑한다'는 내용에 더해, 이 일의 진짜 \u003cb class=\"key\">보람\u003c/b>을 보여 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [동명사 Telling stories ~] + [단수동사 gives] : \"(그들이 아니면) 사람들이 들을 기회가 없는 이야기들을 전해주는 것이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : [선행사 stories] + [관계대명사 that] + [주어 people] + [동사 would not have] : \"사람들이 들을 기회가 없는 (이야기들)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">without을 이용한 가정법(조건)\u003c/span> : [주어 + would + 동사원형 ~ without + 명사] : \"그들이 아니면 ~할 기회가 없을 텐데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">4형식(수여동사) 구문\u003c/span> : give + [간접목적어 them] + [직접목적어 a sense of pride] : \"그들에게 자부심을 준다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"And, 그리고. telling stories, 이야기들을 전해주는 것이. that people would not have the chance to hear, 사람들이 들을 기회가 없는. without them, 그들이 아니면. gives them, 그들에게 주는 것은. a sense of pride in their job, 자신의 일에 대한 자부심이에요. 이 문장 전체를 해석하면, 또 그들이 아니면 사람들이 들을 기회가 없는 이야기들을 전해준다는 것이 그들에게 일에 대한 자부심을 준다.","hl":"m"},{"n":41,"text":"이 문장은 프리랜서 기자들이 왜 위험한 일을 계속하는지 그 이유를 밝혀 주는 마무리예요. 그들이 아니면 사람들이 누릴 수 없는 기회, 바로 그 이야기를 전한다는 사실이 이들에게 자부심을 준다는 거죠. 위험하다는 앞 내용과 짝을 이루면서, 이 일의 진짜 보람을 보여 주는 문장입니다.","hl":"mn"},{"n":42,"text":"첫 번째, telling stories처럼 동명사구가 문장의 주어로 길게 나왔어요. 동명사구가 주어일 때는 하나의 일로 보기 때문에 단수동사 gives로 받는다는 걸 기억해 주세요. 두 번째, stories 뒤의 that은 목적격 관계대명사예요. 뒤에 people이라는 주어와 would not have라는 동사가 완전히 있으니, 빠진 목적어 자리를 that이 채우면서 앞의 stories를 꾸며 주는 겁니다. 세 번째, without them은 조건을 담은 가정법 표현이에요. 그들이 아니면, 다시 말해 if it were not for them과 같은 뜻이라서 앞에 would가 자연스럽게 나오는 거죠. 네 번째, gives them a sense of pride는 간접목적어 them과 직접목적어 a sense of pride를 데리고 온 4형식이에요. 그래서 그들에게 자부심을 준다, 이렇게 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>'freelancer'는 '어떤 조직에도 속하지 않는'이라는 free와 '창을 든 병사'라는 lancer가 합쳐진 \u003cb class=\"key\">어원\u003c/b>을 가진 말이다.\u003c/li>\u003cli>옛날의 프리랜서는 돈을 벌기 위해 전 세계를 돌아다니며 싸우는 \u003cb class=\"key\">프리랜스 \u003c/b>\u003cb class=\"key\">군인\u003c/b>이었지만 이제 그 수는 많지 않다.\u003c/li>\u003cli>오늘날 이 단어는 큰 뉴스거리가 있는 곳에 가서 보도하며 돈을 버는 \u003cb class=\"key\">프리랜스 \u003c/b>\u003cb class=\"key\">기자\u003c/b>를 뜻한다.\u003c/li>\u003cli>이들은 위험한 일을 하면서도 \u003cb class=\"key\">짜릿한 \u003c/b>\u003cb class=\"key\">흥분\u003c/b>과, 자기들만이 전할 수 있는 이야기를 통한 \u003cb class=\"key\">자부심\u003c/b>을 느낀다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The word &quot;freelancer&quot; has shifted from soldiers who fought for money to freelance reporters who cover dangerous news, and these reporters love the excitement and take pride in their work.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 'freelancer'는 원래 돈을 받고 싸우던 창을 든 병사를 뜻했지만, 오늘날에는 큰 뉴스거리가 있는 위험한 현장에서 보도하며 돈을 버는 \u003cb class=\"key\">프리랜스 \u003c/b>\u003cb class=\"key\">기자\u003c/b>를 가리킨다. 이들은 위험한 일 속에서 \u003cb class=\"key\">짜릿한 \u003c/b>\u003cb class=\"key\">흥분\u003c/b>과 \u003cb class=\"key\">자부심\u003c/b>을 느낀다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":43,"text":"오늘 글의 핵심은 freelancer라는 단어가 창을 든 용병에서 위험한 현장을 누비는 프리랜스 기자로 의미가 옮겨 갔다는 점이에요. 그리고 그 기자들은 위험 속에서도 짜릿한 흥분과 자부심을 느낀다는 것까지 기억해 주세요. 시간 표시어를 따라가며 단어의 의미가 어떻게 변하는지 다시 한번 읽어 보면 좋겠어요. 오늘 수업도 수고 많았어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
