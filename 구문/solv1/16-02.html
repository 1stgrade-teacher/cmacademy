</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 16강 적용독해02","audioDir":"16-02_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">16강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Reverse Culture Shock: The Harder Return\u003c/h1>\u003ch2>역 문화 충격: 더 힘든 귀환\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>해외 유학생들은 새로운 환경 적응을 어려워하지만, 일부는 귀국 후 \u003cb class=\"key\">예전 \u003c/b>\u003cb class=\"key\">생활방식\u003c/b>에 다시 적응하지 못하는 \u003cb class=\"key\">역 \u003c/b>\u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">충격\u003c/b>을 겪는다. 이는 \u003cb class=\"key\">보통의 \u003c/b>\u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">충격\u003c/b>보다 더 힘들 수 있고, 해외 생활로 변한 자신을 가족이 이해하지 못해 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">관계\u003c/b>에 큰 영향을 줄 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Reverse culture shock can be harder than normal culture shock because returning students have changed and their families may not understand them.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Reverse Culture Shock, 즉 역 문화 충격에 관한 지문을 함께 읽어 볼 거예요. 이 글은 해외 유학에서 돌아온 학생들이 겪는 어려움과 그 영향에 대해 말하고 있어요. 요약하면, 일부 학생은 예전 생활방식에 다시 적응하지 못하는 역 문화 충격을 겪고, 이것이 보통의 문화 충격보다 더 힘들 수 있다는 내용이죠. 그래서 오늘의 요지는 역 문화 충격이 변한 자신과 가족의 이해 부족 때문에 더 어려울 수 있다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">충격\u003c/b>(culture shock)은 낯선 문화권에 들어갔을 때 느끼는 혼란과 불편을 말해요. 반대로 \u003cb class=\"key\">역 \u003c/b>\u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">충격\u003c/b>(reverse culture shock)은 해외 생활을 마치고 원래의 문화로 돌아왔을 때 겪는 적응의 어려움이에요. 사람은 외국에서 생활하며 가치관과 생활 습관이 변하기 때문에, 돌아온 뒤에도 \u003cb class=\"key\">예전의 \u003c/b>\u003cb class=\"key\">자기\u003c/b>로 완전히 돌아가기 어려워요. 이때 가족이나 친구가 그 변화를 이해하지 못하면 오해와 갈등이 생길 수 있고, 이것이 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">관계\u003c/b>에 영향을 주기도 해요. 마치 오랜 캠프 생활 후 집에 돌아왔는데 내 방과 가족의 생활 리듬이 낯설게 느껴지는 것과 비슷해요.\u003c/div>","segs":[{"n":2,"text":"먼저 culture shock, 즉 문화 충격이라는 말부터 짚어 볼게요. 문화 충격은 낯선 문화권에 들어갔을 때 느끼는 혼란과 불편을 말해요. 반대로 역 문화 충격, reverse culture shock은 해외 생활을 마치고 원래의 문화로 돌아왔을 때 겪는 적응의 어려움이에요. 사람은 외국에서 살면서 가치관과 생활 습관이 변하기 때문에 돌아온 뒤에도 예전의 자기로 완전히 돌아가기 어려워요. 이때 가족이나 친구가 그 변화를 이해하지 못하면 오해와 갈등이 생기고 가족 관계에도 영향을 줄 수 있죠. 오랜 캠프 생활 후 집에 돌아왔는데 내 방과 가족의 생활 리듬이 낯설게 느껴지는 상황을 떠올리면 이해하기 쉬워요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>해외 유학의 고민\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>요즘 많은 학생이 공부를 위해 \u003cb class=\"key\">해외\u003c/b>로 간다는 배경을 제시해요. 그리고 그들이 겪는 가장 어려운 부분을 새로운 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">적응\u003c/b>이라고 말하며 일반적인 생각을 보여 줘요. 여기서는 아직 귀국 후의 문제가 드러나지 않아요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>귀국 후의 문제\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>그러나 어떤 학생들에게는 예전의 \u003cb class=\"key\">생활방식\u003c/b>에 다시 적응하지 못하는 것이 문제라고 전환해요. 이런 현상을 \u003cb class=\"key\">역 \u003c/b>\u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">충격\u003c/b>이라고 부르며, 보통의 \u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">충격\u003c/b>보다 더 힘들 수 있다고 강조해요. 그래서 이 부분이 글의 핵심 문제를 드러내는 대목이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>변화와 이해 부족\u003csmall>근거 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>Craig Storti는 해외 생활이 사람들을 변화시킨다고 설명해요. 그래서 귀국한 학생들은 예전의 \u003cb class=\"key\">자기\u003c/b>로 돌아가는 것이 불가능하다고 느껴요. 가족 역시 그들이 왜, 어떻게 \u003cb class=\"key\">변했는지\u003c/b> 이해하지 못할 수 있다고 덧붙여요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>가족 관계의 영향\u003csmall>결과 · 문장 8\u003c/small>\u003c/h4>\u003cp>이러한 변화와 이해 부족은 결국 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">관계\u003c/b>에 커다란 영향을 미칠 수 있어요. 따라서 귀국 후의 적응 문제는 학생 개인만의 어려움이 아니에요. 역 문화 충격이 관계의 문제로 이어질 수 있음을 보여 주는 마무리예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 차례대로 살펴볼게요.","hl":null},{"n":4,"text":"먼저 요즘 많은 학생이 공부를 위해 해외로 간다는 배경이 나와요. 그리고 그들이 겪는 가장 어려운 부분은 새로운 환경 적응이라고 말하죠. 여기까지는 일반적인 생각을 보여 주는 도입 부분이에요.","hl":"f0"},{"n":5,"text":"그런데 어떤 학생들에게는 예전의 생활방식에 다시 적응하지 못하는 것이 문제라고 전환돼요. 이런 현상을 역 문화 충격이라고 부르고, 보통의 문화 충격보다 더 힘들 수 있다고 강조해요. 그래서 이 부분이 글의 핵심 문제를 드러내는 대목이에요.","hl":"f1"},{"n":6,"text":"이어서 Craig Storti가 해외 생활이 사람들을 변화시킨다고 설명해요. 그래서 귀국한 학생들은 예전의 자기로 돌아가는 것이 불가능하다고 느끼죠. 가족 역시 그들이 왜, 어떻게 변했는지 이해하지 못할 수 있다고 덧붙여요.","hl":"f2"},{"n":7,"text":"마지막으로 이러한 변화와 이해 부족이 가족 관계에 커다란 영향을 미칠 수 있다고 말해요. 따라서 귀국 후의 적응 문제는 학생 개인만의 어려움이 아니에요. 역 문화 충격이 관계의 문제로 이어질 수 있음을 보여 주는 결말이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장과 두 번째 문장은 해외 유학의 일반적 상황을 제시하고, 세 번째 문장에서 But으로 \u003cb class=\"key\">통념\u003c/b>을 뒤집어요. 네 번째 문장에서 \u003cb class=\"key\">역 \u003c/b>\u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">충격\u003c/b>이라는 핵심 개념과 그 심각성을 밝히므로 \u003cb class=\"key\">주제문\u003c/b>은 네 번째 문장이에요. 뒤에는 전문가 인용을 통해 왜 더 힘든지 \u003cb class=\"key\">근거\u003c/b>를 제시해요. 이처럼 중심 내용이 글 뒤쪽에서 분명해지는 \u003cb class=\"key\">미괄식\u003c/b> 전개예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>These days (1)\u003c/b>\u003cspan>배경 제시\u003c/span>\u003cb>But (3)\u003c/b>\u003cspan>전환·반박\u003c/span>\u003cb>known as (4)\u003c/b>\u003cspan>개념 정의\u003c/span>\u003cb>more difficult than (4)\u003c/b>\u003cspan>비교·강조\u003c/span>\u003cb>explains (5)\u003c/b>\u003cspan>근거 제시\u003c/span>\u003cb>This (8)\u003c/b>\u003cspan>결과 지시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">fit back into their old lives\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reverse culture shock\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">go back to who they were before\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">not who they used to be\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">changed\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>보통의 문화 충격\u003c/th>\u003cth>역 문화 충격\u003c/th>\u003c/tr>\u003ctr>\u003ctd>낯선 새 환경에 적응할 때 발생\u003c/td>\u003ctd>예전 생활로 돌아온 뒤 발생\u003c/td>\u003c/tr>\u003ctr>\u003ctd>주로 해외 체류 중 겪음\u003c/td>\u003ctd>귀국 후 겪을 수 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>일반적으로 덜 어려움\u003c/td>\u003ctd>더 힘들 수 있음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 일반적인 생각을 먼저 제시한 뒤 But으로 뒤집는 통념 반박 구조예요. 도입에서 해외 생활의 어려움을 말하지만, 핵심은 귀국 후의 적응 문제로 옮겨 가죠. 역 문화 충격이라는 개념과 그 심각성을 밝히는 네 번째 문장이 주제문이고, 글의 중심 내용이 뒤쪽에 나오는 미괄식 구조예요. 그래서 통념과 반박을 구분하며 읽는 것이 중요해요.","hl":"ty"},{"n":9,"text":"신호어를 보면 첫 번째 문장의 These days는 배경을 제시하고, 세 번째 문장의 But은 통념을 뒤집는 전환 신호예요. 네 번째 문장의 known as는 역 문화 충격이라는 개념을 정의하고, more difficult than은 보통의 문화 충격과 비교하며 더 어렵다는 점을 강조하죠. explains 뒤에는 전문가의 말이 나오면서 주장을 뒷받침하는 근거가 제시돼요. 또한 This가 마지막 문장에서 앞의 변화와 이해 부족을 받아 결과로 연결해 줘요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>These days\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>요즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>overseas\u003c/b>\u003cem>부사\u003c/em>\u003cspan>해외로\u003c/span>\u003c/div>\u003cdiv>\u003cb>study\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공부하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>often\u003c/b>\u003cem>부사\u003c/em>\u003cspan>종종\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u00 3c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 학생들이\u003c/span>\u003cspan class=\"en\">many students\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해외에 간다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">overseas\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공부를 하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">study\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">요즘 많은 학생들이 공부를 하기 위해 해외에 간다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 배경을 깔아 주는 \u003cb class=\"key\">도입\u003c/b> 문장이에요. 요즘 많은 학생들이 공부를 목적으로 해외에 간다는 \u003cb class=\"key\">배경\u003c/b>을 먼저 제시하죠. 이 배경 위에 다음 문장부터 유학 생활의 어려움과 \u003cb class=\"key\">역문화 \u003c/b>\u003cb class=\"key\">충격\u003c/b> 이야기가 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">완전자동사 + 부사(수식)\u003c/span> : [주어] + [완전자동사] + [부사] : \"해외로 가다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [동사] + to + [동사원형] (~하기 위해) : \"공부하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"These days, 요즘. many students, 많은 학생들이. go overseas, 해외에 간다. to study, 공부를 하기 위해. 이 문장 전체를 해석하면, 요즘 많은 학생들이 공부를 하기 위해 해외에 간다.","hl":"m"},{"n":13,"text":"이 문장은 글의 배경을 깔아 주는 도입 문장이에요. 요즘 많은 학생들이 공부를 하러 해외에 간다는 배경을 먼저 보여 주죠. 이 배경 위에 다음 문장부터 유학 생활의 어려움이 이어집니다.","hl":"mn"},{"n":14,"text":"첫 번째, to study는 목적을 나타내는 to부정사예요. 왜 해외로 가는지 그 목적을 설명해 주죠. 두 번째, go overseas에서 overseas는 해외로라는 뜻의 부사로 쓰였어요. 그래서 전치사 없이 동사 바로 뒤에 붙는다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 종종 생각한다\u003c/span>\u003cspan class=\"en\">They often find\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 어려운 부분이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">hardest \u003c/span>\u003cspan class=\"tgt\">part \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적응하는 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">adjusting \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 환경에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">environment\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 종종 가장 어려운 부분은 새로운 환경에 적응하는 것이라고 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 유학생들이 겪는 \u003cb class=\"key\">어려움\u003c/b>의 핵심을 짚어 줘요. 가장 힘든 것은 새로운 \u003cb class=\"key\">환경\u003c/b>에 적응하는 일이라는 뜻이죠. 뒤에 나올 역문화 충격과 대비되는 일반적인 \u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">충격\u003c/b>의 내용을 미리 깔아 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : find + that + [주어 + 동사 ~] : \"가장 어려운 부분이 ~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구의 주격보어\u003c/span> : [주어] + be동사 + [동명사구] : \"새로운 환경에 적응하는 것\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They often find, 그들은 종종 생각한다. that the hardest part, 가장 어려운 부분이. is adjusting, 적응하는 것이라고. to their new environment, 새로운 환경에. 이 문장 전체를 해석하면, 그들은 종종 가장 어려운 부분은 새로운 환경에 적응하는 것이라고 생각한다.","hl":"m"},{"n":16,"text":"이 문장은 유학생들이 겪는 어려움의 핵심을 짚어 줘요. 가장 힘든 것은 새로운 환경에 적응하는 일이라는 거죠. 뒤에 나올 역문화 충격과 대비되는 일반적인 문화 충격의 내용을 미리 깔아 주는 역할입니다.","hl":"mn"},{"n":17,"text":"첫 번째, find 뒤의 that은 명사절을 이끌면서 find의 목적어 자리를 채워요. find와 that이 만나면 알게 되다라는 관용 표현이 되니 통째로 익혀 두세요. 두 번째, is 뒤의 adjusting은 동명사구로 주격보어 역할을 해요. 가장 어려운 부분이 곧 적응하는 것이라고 등식으로 읽으면 됩니다. 세 번째, adjust는 전치사 to와 짝을 이루는 동사라서 adjust to를 숙어로 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 어떤 학생들에게는\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">students\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문제가 되는 것이\u003c/span>\u003cspan class=\"en\">the trouble is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 다시 적응할 수 없다는 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">fit \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예전의 생활방식에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">into\u003c/span> their old lives.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 어떤 학생들에게는 문제가 되는 것이 그들이 (돌아왔을 때) 예전의 생활방식에 다시 적응할 수 없다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 \u003cb class=\"key\">문제\u003c/b>를 정면으로 꺼내는 전환점이에요. 해외 적응이 아니라 귀국한 뒤 \u003cb class=\"key\">예전 \u003c/b>\u003cb class=\"key\">생활\u003c/b>로 돌아가지 못한다는 것이 진짜 고민이라는 뜻이죠. But으로 앞 문장과 대비시키면서 '역문화 충격'이라는 \u003cb class=\"key\">주제\u003c/b>로 글을 끌고 갑니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 문두 배치(화제 제시)\u003c/span> : But + [전치사구] + [주어 + 동사] : \"어떤 학생들에게는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that이 이끄는 명사절(주격보어)\u003c/span> : [주어] + be동사 + that + [완전한 절] : \"그들이 다시 적응할 수 없다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사(동사 + 부사 + 전치사)\u003c/span> : fit + back + into + [명사] : \"~에 다시 적응하다, ~로 되돌아가다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But for some students, 그러나 어떤 학생들에게는. the trouble is, 문제가 되는 것이. that they can't fit back, 그들이 다시 적응할 수 없다는 것이다. into their old lives, 예전의 생활방식에. 이 문장 전체를 해석하면, 그러나 어떤 학생들에게는 문제가 되는 것이 그들이 (돌아왔을 때) 예전의 생활방식에 다시 적응할 수 없다는 것이다.","hl":"m"},{"n":19,"text":"이 문장은 글의 문제를 정면으로 꺼내는 전환점이에요. 해외 적응이 아니라 귀국한 뒤 예전 생활로 돌아가지 못한다는 것이 진짜 고민이라는 거죠. But으로 앞 문장과 대비시키면서 역문화 충격이라는 주제로 글을 끌고 갑니다.","hl":"mn"},{"n":20,"text":"첫 번째, for some students가 문장 앞에 나와서 화제를 먼저 던져요. 모든 학생이 아니라 어떤 학생들에게만 해당한다는 범위 제한을 강조하는 장치죠. 두 번째, the trouble is 뒤의 that은 주격보어 자리에 오는 명사절이에요. that절 안에 they can't fit back처럼 완전한 문장 모양이 들어 있으니 접속사 that이라고 보면 됩니다. 세 번째, fit back into는 동사에 부사 back과 전치사 into가 붙은 덩어리예요. 다시 예전 생활에 들어맞는다는 뜻으로 한 묶음으로 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 알려져 있는데\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">known \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘역 문화 충격’으로\u003c/span>\u003cspan class=\"en\">\u003cspan cla ho they used to be는 ‘예전의 그들’이라는 \u003cb class=\"key\">의문사절\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when + 분사구문(시간 부사절의 축약)\u003c/span> : when + 현재분사 (~ing), 주어가 주절과 같을 때 : \"외국에 살 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사절의 병렬 구조\u003c/span> : when + 절 + , and when + 절 : \"그리고 그들이 돌아오면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사 who가 이끄는 명사절(주격 보어)\u003c/span> : 주어 + be동사 + 의문사절 : \"예전의 그들\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"\"People change, 사람들은 변한다. when living abroad, 외국에 살 때. and when they return, 그리고 그들이 돌아오면. they are not, 그들은 ~이 아니다. who they used to be, 예전의 그들. 이 문장 전체를 해석하면, “외국에 살 때 사람들은 변하는데, 돌아오면 그들은 예전의 그들이 아닙니다.","hl":"m"},{"n":28,"text":"이 문장은 외국 생활을 하면서 사람이 변한다는 점을 말하고 있어요. 그래서 돌아왔을 때 예전의 그 모습이 아니라는 거죠. 이어지는 문장에서 가족이 그 변화를 이해하지 못해 갈등이 생긴다는 흐름으로 이어지니까, 변화와 가족 관계를 함께 묶어서 기억해 두세요.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 when living abroad예요. 시간 부사절에서 주어가 주절과 같으면 주어와 be동사가 사라지고 동사가 현재분사로 줄어드는데, 이걸 분사구문이라고 해요. 두 번째는 and when they return인데, when절 두 개가 and로 병렬 연결되어 ‘살 때’와 ‘돌아올 때’를 나란히 놓은 구조예요. 세 번째는 who they used to be로, be동사 뒤에 의문사절이 와서 주격 보어 역할을 하고 used to be는 ‘예전에 ~였다’라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 가족들은\u003c/span>\u003cspan class=\"en\">Their family members\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이해하지 못합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 그리고 어떻게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 변했는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they've \u003c/span>\u003cspan class=\"tgt\">changed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 가족들은 그들이 왜 그리고 어떻게 변했는지 이해하지 못합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가족들이 학생이 왜, 어떻게 변했는지를 이해하지 못한다는 뜻이에요. 앞에서 사람은 해외 생활을 하며 변한다는 흐름을 이어 받아, 그 변화가 가족에게는 설명되지 않는 것임을 보여 주죠. 여기서 why는 \u003cb class=\"key\">이유\u003c/b>를, how는 \u003cb class=\"key\">방식\u003c/b>을 묻는 의문사예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can의 부정(can't + 동사원형)\u003c/span> : [조동사 can + not + 동사원형 understand] : \"이해하지 못합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사 + 주어 + 동사)\u003c/span> : [의문사 why and how + 주어 they + 동사 have changed] → 타동사 understand의 목적어 : \"그들이 왜 그리고 어떻게 변했는지\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Their family members, 그 가족들은. can't understand, 이해하지 못합니다. why and how, 왜 그리고 어떻게. they've changed, 그들이 변했는지. 이 문장 전체를 해석하면, 그 가족들은 그들이 왜 그리고 어떻게 변했는지 이해하지 못합니다.","hl":"m"},{"n":31,"text":"이 문장은 가족들이 학생의 변화를 이해하지 못한다는 거예요. 해외 생활을 하면서 사람은 변하는데, 그 이유와 방식을 가족은 알 수 없다는 거죠. 여기서 why는 이유를, how는 방식을 묻는 말이에요.","hl":"mn"},{"n":32,"text":"첫 번째, can't understand는 조동사 can에 not이 붙은 부정형이에요. 조동사 뒤에는 언제나 동사원형 understand가 온다는 점을 꼭 기억하세요. 두 번째, why and how they've changed는 간접의문문이에요. 의문사 다음에 주어 they, 그다음 동사가 오는 어순을 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이\u003c/span>\u003cspan class=\"en\">This\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커다란 영향을 미칠 수 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">greatly \u003c/span>\u003cspan class=\"tgt\">impact\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족 관계에\u003c/span>\u003cspan class=\"en\">family relationships,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라고 Storti는 말한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">says \u003c/span>\u003cspan class=\"tgt\">Storti\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것이 가족 관계에 커다란 영향을 미칠 수 있습니다.”라고 Storti 는 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 상황 전체를 This로 받아, 그것이 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">관계\u003c/b>에 큰 영향을 줄 수 있다는 뜻이에요. 인용문이 끝난 뒤에 says Storti가 붙어 이 말이 Storti의 \u003cb class=\"key\">인용\u003c/b>임을 밝히며 글을 마무리하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 부사 + 동사원형\u003c/span> : [조동사 can + 부사 greatly + 동사원형 impact] : \"커다란 영향을 미칠 수 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">인용문 뒤 주어·동사 도치\u003c/span> : [&quot;인용문,&quot; + 동사 says + 주어 Storti] : \"라고 Storti는 말한다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"This, 이것이. can greatly impact, 커다란 영향을 미칠 수 있습니다. family relationships, 가족 관계에. says Storti, 라고 Storti는 말한다. 이 문장 전체를 해석하면, 이것이 가족 관계에 커다란 영향을 미칠 수 있습니다.”라고 Storti 는 말한다.","hl":"m"},{"n":34,"text":"앞 문장의 상황 전체를 This로 받아서, 그것이 가족 관계에 큰 영향을 줄 수 있다는 뜻이에요. 그리고 마지막에 says Storti가 붙어서 이 말이 Storti의 인용임을 알려 주죠.","hl":"mn"},{"n":35,"text":"첫 번째, greatly는 부사라서 조동사 can 뒤, 동사원형 impact 앞에 자리해요. 조동사가 있으니 동사는 원형이라는 것도 같이 기억하세요. 두 번째, says Storti는 인용문 뒤에서 주어와 동사가 도치된 형태예요. 인용문이 먼저 나오면 이렇게 순서가 바뀐다는 점이 시험 포인트예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>많은 학생이 공부를 위해 \u003cb class=\"key\">해외\u003c/b>로 가지만, 가장 어려운 것은 새로운 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">적응\u003c/b>이라고 생각한다.\u003c/li>\u003cli>그러나 일부 학생은 귀국 후 예전의 \u003cb class=\"key\">생활방식\u003c/b>에 다시 적응하지 못하는 문제를 겪는다.\u003c/li>\u003cli>이 현상은 \u003cb class=\"key\">역 \u003c/b>\u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">충격\u003c/b>이라 불리며 보통의 문화 충격보다 더 힘들 수 있다.\u003c/li>\u003cli>해외 생활로 변한 사람을 가족이 이해하지 못하면 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">관계\u003c/b>에 큰 영향을 미칠 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Reverse culture shock can be harder than normal culture shock because returning students have changed and their families may not understand them.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">해외 유학생들은 새로운 환경 적응을 어려워하지만, 일부는 귀국 후 \u003cb class=\"key\">예전 \u003c/b>\u003cb class=\"key\">생활방식\u003c/b>에 다시 적응하지 못하는 \u003cb class=\"key\">역 \u003c/b>\u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">충격\u003c/b>을 겪는다. 이는 \u003cb class=\"key\">보통의 \u003c/b>\u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">충격\u003c/b>보다 더 힘들 수 있고, 해외 생활로 변한 자신을 가족이 이해하지 못해 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">관계\u003c/b>에 큰 영향을 줄 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 글은 해외 생활 후 돌아온 학생들이 겪는 역 문화 충격을 다뤘어요. 핵심은 예전 생활방식에 다시 적응하기 어렵고, 변한 자신을 가족이 이해하지 못해 가족 관계에 영향을 줄 수 있다는 점이에요. 통념을 뒤집는 But과 전문가의 설명을 함께 기억하면 글의 구조가 잘 보일 거예요. 오늘도 수고했어요, 다음 강의에서 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
