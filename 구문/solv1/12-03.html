<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 12강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 12강 적용독해03","audioDir":"12-03_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">12강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Why Do We Still Believe in Love at First Sight?\u003c/h1>\u003ch2>첫눈에 반하는 사랑, 왜 우리는 여전히 믿을까?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>누군가를 처음 보고 가슴이 뛰는 경험, 즉 \u003cb class=\"key\">첫눈에 \u003c/b>\u003cb class=\"key\">반하는 \u003c/b>\u003cb class=\"key\">사랑\u003c/b>은 생각보다 흔하며 최근 조사에서도 많은 사람이 이를 믿는다고 답한다. 요즘처럼 현실적이고 실용적인 세상에서도 사람들이 이 사랑을 믿는 까닭은 과학기술과 빠른 변화 속에서 \u003cb class=\"key\">마술 \u003c/b>\u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">사랑\u003c/b>에 대한 생각을 간직하고 싶기 때문이며, 그것은 누구나 믿고 싶어 하는 좋은 \u003cb class=\"key\">동화\u003c/b>와 같다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>People still believe in love at first sight because they want to keep the idea of magical romance, like a good fairy tale, even in a realistic and practical world.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 첫눈에 반하는 사랑, love at first sight에 관한 글이에요. 누군가를 처음 보고 가슴이 빨리 뛰는 경험, 한 번쯤 있으시죠? 이 글은 그런 감정을 많은 사람이 여전히 믿고 있다는 조사 결과에서 출발해, 왜 그런 믿음이 남아 있는지 질문하고 답하는 구조예요. 요지는 사람들이 현실적인 세상에서도 마술 같은 사랑에 대한 생각을 간직하고 싶어 한다는 것이고, 첫눈에 반하는 사랑은 누구나 믿고 싶어 하는 동화 같다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">첫눈에 반하는 사랑(love at first sight)은 심리학에서 첫인상이 만드는 강한 감정 반응으로 설명되곤 해요. 상대의 겉모습에서 시작된 호감이 \u003cb class=\"key\">후광 \u003c/b>\u003cb class=\"key\">효과\u003c/b>(halo effect)로 번지면서 그 사람 전체를 긍정적으로 보게 된다는 것이죠. 사람들은 짧은 순간의 설렘을 운명적인 신호로 해석하는 경향이 있고, 이런 해석은 \u003cb class=\"key\">낭만\u003c/b>(romance)에 대한 갈망과 만나 더 강해져요. 좋아하는 드라마의 첫 회를 보고 단번에 빠져드는 것처럼, 첫 장면의 강한 인상이 전체에 대한 기대를 만들어 내는 것과 비슷하죠. 조사(survey)는 사람들이 무엇을 믿는지 수치로 보여 주지만 그 믿음의 이유까지 알려 주지는 않아요. 그래서 과학기술과 빠른 변화의 시대에도 사람들은 \u003cb class=\"key\">동화\u003c/b> 같은 사랑 이야기를 간직하려 한다는 점을 기억해 두면 좋아요.\u003c/div>","segs":[{"n":2,"text":"배경지식을 조금 더해 볼게요. 첫눈에 반하는 사랑은 심리학에서 첫인상이 만드는 강한 감정 반응으로 설명되곤 해요. 상대의 겉모습에서 시작된 호감이 후광 효과, 영어로 halo effect로 번지면서 그 사람 전체를 긍정적으로 보게 된다는 거죠. 사람들은 짧은 순간의 설렘을 운명적인 신호로 해석하는 경향이 있고, 그 해석은 낭만, 즉 romance에 대한 갈망과 만나 더 강해져요. 좋아하는 드라마의 첫 회를 보고 단번에 빠져드는 것처럼, 첫 장면의 강한 인상이 전체에 대한 기대를 만드는 것과 비슷해요. 그래서 과학기술과 빠른 변화의 시대에도 사람들은 동화 같은 사랑 이야기를 간직하려 한다는 점을 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>현상 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 누군가를 처음 봤을 때 가슴이 빠르게 뛰고 얼굴이 빨개지는 경험을 \u003cb class=\"key\">첫눈에 \u003c/b>\u003cb class=\"key\">반하는 \u003c/b>\u003cb class=\"key\">사랑\u003c/b>이라는 멋진 감정으로 이름 붙이며 시작해요. 그리고 이것이 특별한 사람만 겪는 일이 아니라 생각보다 자주 일어나는 \u003cb class=\"key\">현상\u003c/b>이라고 말하죠. 독자는 이 부분에서 글의 화제가 무엇인지 자연스럽게 파악하게 돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>근거 제시\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>이어서 최근 \u003cb class=\"key\">조사\u003c/b> 결과를 근거로 내세우는데, 응답자의 63%가 여전히 첫눈에 반하는 사랑을 믿는다고 답했어요. 그중 55%는 그 경험이 실제로 \u003cb class=\"key\">결혼\u003c/b>으로 이어졌다고 말했고, 몇 분 안에 방금 만난 사람을 사랑하게 되었다는 구체적인 \u003cb class=\"key\">경험담\u003c/b>도 나와요. 숫자와 사례를 함께 배치해 이 믿음이 얼마나 퍼져 있는지 뒷받침하는 단계예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>질문으로 전환\u003csmall>전환 · 문장 5\u003c/small>\u003c/h4>\u003cp>그다음 요즘처럼 현실적이고 실용적인 세상에서 왜 그렇게 많은 사람들이 아직도 이 사랑을 믿는지 \u003cb class=\"key\">질문\u003c/b>을 던져요. 앞에서 제시한 통계가 자연스럽게 의문으로 바뀌는 \u003cb class=\"key\">전환\u003c/b> 지점이죠. 이 질문이 뒤에 올 답을 이끄는 \u003cb class=\"key\">주제\u003c/b> 역할을 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>답과 정리\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>마지막으로 사람들이 과학기술과 빠른 변화의 세상에서도 \u003cb class=\"key\">마술 \u003c/b>\u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">사랑\u003c/b>에 대한 생각을 간직하고 싶어 한다는 답을 조심스럽게 제시해요. Perhaps와 Maybe를 써서 단정하지 않고 \u003cb class=\"key\">추측\u003c/b>의 형태로 말하는 점이 특징이에요. 결국 첫눈에 반하는 사랑은 누구나 믿고 싶어 하는 좋은 \u003cb class=\"key\">동화\u003c/b> 같다고 정리하며 글을 맺어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 글은 누군가를 처음 봤을 때 가슴이 빠르게 뛰고 얼굴이 빨개지는 경험을 첫눈에 반하는 사랑이라고 이름 붙이면서 시작해요. 그리고 이런 현상이 특별한 사람만 겪는 게 아니라 생각보다 자주 일어난다고 말하죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 근거 제시예요. 최근 조사에서 육십삼 퍼센트가 여전히 첫눈에 반하는 사랑을 믿는다고 답했고, 그중 오십오 퍼센트는 그 경험이 결혼으로 이어졌다고 말했어요. 몇 분 안에 방금 만난 사람을 사랑하게 되었다는 경험담도 함께 나옵니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 질문으로 넘어가는 전환이에요. 요즘처럼 현실적이고 실용적인 세상에서 왜 그렇게 많은 사람들이 아직도 이 사랑을 믿는지 질문을 던지죠. 앞에서 본 통계가 자연스럽게 의문으로 바뀌는 지점이고, 이 질문이 글의 주제를 이끌어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 답이에요. 사람들이 과학기술과 빠른 변화의 세상에서도 마술 같은 사랑에 대한 생각을 간직하고 싶어 한다는 답을 조심스럽게 내놓아요. 단정하지 않고 추측의 형태로 말하고, 마지막에는 첫눈에 반하는 사랑이 누구나 믿고 싶어 하는 좋은 동화 같다고 정리해요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 현상과 통계를 먼저 보여 준 뒤 왜 그런지를 묻고 답하는 \u003cb class=\"key\">질문-답변\u003c/b> 구조예요. 첫 번째부터 네 번째 문장까지는 첫눈에 반하는 사랑이 무엇이고 얼마나 흔한지를 \u003cb class=\"key\">근거\u003c/b>로 제시하는 도입부이고, 다섯 번째 문장의 질문에 여섯 번째와 일곱 번째 문장이 답하는 \u003cb class=\"key\">미괄식\u003c/b> 전개를 보여요. 그래서 글의 중심 생각은 맨 뒤에 나오는 \u003cb class=\"key\">마술 \u003c/b>\u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">사랑\u003c/b>과 동화에 대한 언급에서 완성돼요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>According to (3)\u003c/b>\u003cspan>근거 제시\u003c/span>\u003cb>So (5)\u003c/b>\u003cspan>질문으로 전환\u003c/span>\u003cb>Perhaps (6)\u003c/b>\u003cspan>추측으로 답 제시\u003c/span>\u003cb>Maybe (7)\u003c/b>\u003cspan>비유로 답 정리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">love at first sight\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this phenomenon\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the experience\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the person that they had just met\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">magical romance\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a good fairy tale\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>현실적이고 실용적인 세상\u003c/th>\u003cth>마술 같은 사랑에 대한 믿음\u003c/th>\u003c/tr>\u003ctr>\u003ctd>과학기술과 빠른 변화\u003c/td>\u003ctd>동화 같은 로맨스\u003c/td>\u003c/tr>\u003ctr>\u003ctd>논리와 효율\u003c/td>\u003ctd>설렘과 운명\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 질문과 답변이에요. 현상을 소개하고 통계로 근거를 댄 뒤, 왜 그런지를 묻고 답하는 순서로 나아가죠. 중심 생각이 맨 뒤에서 완성되기 때문에 미괄식 구조라고 부릅니다. 그래서 마지막 두 문장을 특히 주의 깊게 읽어야 해요.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 세 번째 문장의 According to는 근거를 제시하는 신호이고, 다섯 번째 문장의 So는 질문으로 방향을 트는 신호예요. 여섯 번째 문장의 Perhaps와 일곱 번째 문장의 Maybe는 단정 대신 추측으로 답을 제시한다는 표시죠. 그리고 마술 같은 사랑, 좋은 동화처럼 같은 생각을 비유로 바꿔 말하는 재진술도 놓치지 마세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>for the first time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>처음으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>heart\u003c/b>\u003cem>명사\u003c/em>\u003cspan>심장, 마음\u003c/span>\u003c/div>\u003cdiv>\u003cb>beat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(심장이) 뛰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rush\u003c/b>\u003cem>동사\u003c/em>\u003cspan>몰리다, 급히 움직이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wonderful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>멋진, 놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>at first sight\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>첫눈에\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>phenomenon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현상\u003c/span>\u003c/div>\u003cdiv>\u003cb>seem\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~인 것 같다\u003c/span>\u003c/div>\u003cdiv>\u003cb>according to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 따르면\u003c/span>\u003c/div>\u003cdiv>\u003cb>recent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>최근의\u003c/span>\u003c/div>\u003cdiv>\u003cb>survey\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조사, 설문\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead A to B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B로 이끌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>marriage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결혼\u003c/span>\u003c/div>\u003cdiv>\u003cb>within\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 이내에, 안에\u003c/span>\u003c/div>\u003cdiv>\u003cb>come to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하게 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>just\u003c/b>\u003cem>부사\u003c/em>\u003cspan>방금, 막\u003c/span>\u003c/div>\u003cdiv>\u003cb>realistic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>현실적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>practical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>실용적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>perhaps\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마도\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep\u003c/b>\u003cem>동사\u003c/em>\u003cspan>간직하다, 유지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>idea\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생각, 관념\u003c/span>\u003c/div>\u003cdiv>\u003cb>magical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>마술 같은, 마법의\u003c/span>\u003c/div>\u003cdiv>\u003cb>romance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>낭만, 로맨스\u003c/span>\u003c/div>\u003cdiv>\u003cb>technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>rapid\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>빠른, 급격한\u003c/span>\u003c/div>\u003cdiv>\u003cb>change\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변화\u003c/span>\u003c/div>\u003cdiv>\u003cb>fairy tale\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동화\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚어 볼게요. phenomenon은 현상, survey는 조사라는 뜻이고, lead A to B는 A를 B로 이끌다는 숙어예요. practical은 실용적인, rapid는 빠른이라는 형용사로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">wonderful\u003c/b>\u003cspan class=\"m\">멋진\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">marvelous\u003c/span>\u003cspan class=\"s\">amazing\u003c/span>\u003cspan class=\"s\">fantastic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">terrible\u003c/span>\u003cspan class=\"a\">awful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">believe in\u003c/b>\u003cspan class=\"m\">~을 믿다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trust\u003c/span>\u003cspan class=\"s\">have faith in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003cspan class=\"a\">disbelieve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">experience\u003c/b>\u003cspan class=\"m\">경험하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">undergo\u003c/span>\u003cspan class=\"s\">go through\u003c/span>\u003cspan class=\"s\">encounter\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">avoid\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">realistic\u003c/b>\u003cspan class=\"m\">현실적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">practical\u003c/span>\u003cspan class=\"s\">pragmatic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unrealistic\u003c/span>\u003cspan class=\"a\">idealistic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">practical\u003c/b>\u003cspan class=\"m\">실용적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">useful\u003c/span>\u003cspan class=\"s\">functional\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">theoretical\u003c/span>\u003cspan class=\"a\">impractical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rapid\u003c/b>\u003cspan class=\"m\">빠른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fast\u003c/span>\u003cspan class=\"s\">quick\u003c/span>\u003cspan class=\"s\">swift\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slow\u003c/span>\u003cspan class=\"a\">gradual\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">magical\u003c/b>\u003cspan class=\"m\">마술 같은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mystical\u003c/span>\u003cspan class=\"s\">enchanting\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">mundane\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어로 정리해 볼게요. wonderful은 marvelous, amazing과 가깝고 반대말은 terrible이에요. realistic은 practical, pragmatic과 비슷하고 unrealistic과는 반대죠. rapid는 fast, quick과 같은 뜻이고 slow와 반대이며, magical은 enchanting과 가깝고 ordinary와는 반대예요. believe in은 trust와 바꿔 쓸 수 있고 doubt와는 반대라는 점도 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 누군가를 처음 볼 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">someone \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 가슴이 더 빠르게 뛰기 시작하면\u003c/span>\u003cspan class=\"en\">and your heart \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">starts \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">beat \u003c/span>\u003cspan class=\"tgt\">faster\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 피가 얼굴로 몰려들면,\u003c/span>\u003cspan class=\"en\">and the blood rushes to your face,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 경험하고 있을지도 모른다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">experiencing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 멋진 감정을\u003c/span>\u003cspan class=\"en\">the wonderful feeling\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 “첫눈에 반하는 사랑”이라고 부르는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">call\u003c/span> &quot;love at first sight.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">누군가를 처음 봤는데 가슴이 빠르게 뛰기 시작하고 얼굴이 빨개지면, 아마도 당신은 “첫눈에 반하는 사랑”이라고 하는 멋진 감정을 경험하고 있는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫눈에 반하는 사랑이 어떤 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">변화\u003c/b>와 함께 찾아오는지를 보여 주는 문장이에요. 가슴이 빨리 뛰고 얼굴이 붉어지는 모습을 먼저 제시한 뒤, 그것이 바로 love at first sight라는 \u003cb class=\"key\">멋진 \u003c/b>\u003cb class=\"key\">감정\u003c/b>이라고 이름을 붙여 줍니다. 글 전체에서 \u003cb class=\"key\">화제\u003c/b>를 처음 꺼내는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : When + [주어] + [동사] , [주어] + [동사] : \"당신이 누군가를 처음 볼 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : start + [to부정사 (목적어)] : \"더 빠르게 뛰기 시작한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 may + 진행형\u003c/span> : may + be + [현재분사] : \"경험하고 있을지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : [선행사] + that + [주어] + [동사] : \"우리가 ~라고 부르는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"When you see someone for the first time, 당신이 누군가를 처음 볼 때. and your heart starts to beat faster, 그리고 가슴이 더 빠르게 뛰기 시작하면. and the blood rushes to your face, 그리고 피가 얼굴로 몰려들면. you may be experiencing, 당신은 경험하고 있을지도 모른다. the wonderful feeling, 그 멋진 감정을. that we call \"love at first sight.\", 우리가 “첫눈에 반하는 사랑”이라고 부르는. 이 문장 전체를 해석하면, 누군가를 처음 봤는데 가슴이 빠르게 뛰기 시작하고 얼굴이 빨개지면, 아마도 당신은 “첫눈에 반하는 사랑”이라고 하는 멋진 감정을 경험하고 있는 것이다.","hl":"m"},{"n":13,"text":"이 문장은 첫눈에 반하는 사랑이 어떤 신체 변화와 함께 찾아오는지 보여 줍니다. 가슴이 두근거리고 얼굴이 달아오르는 신체 변화를 먼저 보여 준 다음, 그 감정에 첫눈에 반하는 사랑이라는 멋진 감정이라는 이름을 붙여 주는 거죠. 글 전체에서 화제를 처음 꺼내는 아주 중요한 문장이에요.","hl":"mn"},{"n":14,"text":"어법 포인트부터 볼게요. 첫 번째, when은 주어와 동사를 갖춘 절을 이끌어서 '~할 때'라는 시간 상황을 만들어 줍니다. 두 번째, start 뒤에는 to부정사가 와서 '뛰기 시작하다'처럼 시작의 의미를 채워 주죠. 세 번째, may be experiencing은 추측의 조동사 may에 진행형이 붙어서 지금 그 일이 진행 중일지도 모른다는 뜻이에요. 네 번째, that은 앞의 the wonderful feeling을 꾸며 주는 관계대명사로, call의 목적어 자리를 대신하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이 여전히 이런 현상을 믿고 있으며,\u003c/span>\u003cspan class=\"en\">Many people still \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">phenomenon\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은 일어나는 것처럼 보인다\u003c/span>\u003cspan class=\"en\">and it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">seems \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">happen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 생각할 수 있는 것보다 더 많이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 사람들이 여전히 이런 현상을 믿고 있으며, 생각보다 많이 일어나는 것으로 보인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 많은 사람들이 여전히 첫눈에 반하는 사랑을 \u003cb class=\"key\">믿는다\u003c/b>는 사실을 다시 확인해 주는 문장이에요. 그리고 그런 일이 \u003cb class=\"key\">생각보다 \u003c/b>\u003cb class=\"key\">자주\u003c/b> 일어난다고 말하면서 앞 문장의 \u003cb class=\"key\">화제\u003c/b>를 자연스럽게 이어 갑니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 in을 취하는 구동사 believe in\u003c/span> : believe in + [목적어] : \"이런 현상을 믿다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">seem + to부정사\u003c/span> : seem + [to부정사] : \"일어나는 것처럼 보인다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 than절\u003c/span> : [more] + than + [주어] + [조동사] + [동사] : \"당신이 생각할 수 있는 것보다 더 많이\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Many people still believe in this phenomenon, 많은 사람들이 여전히 이런 현상을 믿고 있으며. and it seems to happen, 그리고 그것은 일어나는 것처럼 보인다. more than you might think, 당신이 생각할 수 있는 것보다 더 많이. 이 문장 전체를 해석하면, 많은 사람들이 여전히 이런 현상을 믿고 있으며, 생각보다 많이 일어나는 것으로 보인다.","hl":"m"},{"n":16,"text":"이 문장은 많은 사람들이 여전히 첫눈에 반하는 사랑을 믿는다는 사실을 다시 확인해 줘요. 그리고 그런 일이 생각보다 자주 일어난다고 말하면서 앞 문장의 화제를 독자 쪽으로 넓혀 주죠.","hl":"mn"},{"n":17,"text":"어법 포인트 세 개 볼게요. 첫 번째, believe in은 단순히 믿는다가 아니라 존재와 가치를 인정한다는 뜻을 가진 구동사예요. 두 번째, seem은 보어로 to부정사를 데려와 '일어나는 것처럼 보인다'를 만들어 주고, it은 바로 앞의 현상을 가리킵니다. 세 번째, than 뒤에는 주어와 동사가 있는 절이 와서 비교의 기준을 세우고, might가 들어가서 추측의 여지를 남겨 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최근의 한 조사에 따르면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">According \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">recent \u003c/span>\u003cspan class=\"tgt\">survey\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">63%의 사람들이 여전히 첫눈에 반하는 사랑을 믿고 있으며,\u003c/span>\u003cspan class=\"en\">63% of people still believe in love at first sight,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들 중 55%는 말했다\u003c/span>\u003cspan class=\"en\">and 55% of them \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 경험이 그들을 결혼으로 이끌었다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> the experience \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">led \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">marriage\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">최근의 한 조사에 따르면, 63 %의 사람들이 여전히 첫눈에 반하는 사랑을 믿고 있으며, 그것을 경험한 사람의 55 %가 그러한 경험이 그들을 결혼으로 이끌었다고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 조사 \u003cb class=\"key\">통계\u003c/b>를 제시해서 첫눈에 반하는 사랑이 얼마나 널리 퍼져 있는지 보여 주는 문장이에요. 63%가 믿고 그중 55%가 \u003cb class=\"key\">결혼\u003c/b>으로 이어졌다고 하니, 앞 문장의 '생각보다 자주 일어난다'는 말이 \u003cb class=\"key\">숫자\u003c/b>로 뒷받침되는 셈입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 according to (근거 제시)\u003c/span> : According to + [명사(구)] , [문장] : \"최근의 한 조사에 따르면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절(목적어)\u003c/span> : said + that + [주어] + [동사] + ... : \"~라고 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">lead A to B 구문\u003c/span> : lead + [목적어] + to + [명사] : \"그들을 결혼으로 이끌었다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"According to a recent survey, 최근의 한 조사에 따르면. 63% of people still believe in love at first sight, 63%의 사람들이 여전히 첫눈에 반하는 사랑을 믿고 있으며. and 55% of them said, 그리고 그들 중 55%는 말했다. that the experience led them to marriage, 그 경험이 그들을 결혼으로 이끌었다고. 이 문장 전체를 해석하면, 최근의 한 조사에 따르면, 63 %의 사람들이 여전히 첫눈에 반하는 사랑을 믿고 있으며, 그것을 경험한 사람의 55 %가 그러한 경험이 그들을 결혼으로 이끌었다고 말했다.","hl":"m"},{"n":19,"text":"이 문장은 조사 통계를 제시해서 첫눈에 반하는 사랑이 얼마나 널리 퍼져 있는지 보여 줘요. 육십삼 퍼센트가 여전히 믿고 있고, 그중 오십오 퍼센트는 그 경험이 결혼으로 이어졌다고 말했죠. 그래서 앞 문장에서 말한 생각보다 자주 일어난다는 이야기가 숫자로 뒷받침되는 셈이에요.","hl":"mn"},{"n":20,"text":"어법 포인트 세 개 짚을게요. 첫 번째, according to는 뒤에 명사구만 데려와서 근거를 제시하는 전치사구예요. 두 번째, said 뒤에 that절이 통째로 와서 말한 내용을 목적어로 받아 주고 있습니다. 세 번째, lead A to B는 A를 B라는 결과로 이끈다는 뜻으로, 여기서 to는 방향을 나타내는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 말했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 분 안에\u003c/span>\u003cspan class=\"en\">\u003cspan clas 3c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사 병렬\u003c/span> : [명사 technology] + and + [명사 rapid change] : \"과학기술과 빠른 변화\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Perhaps, 아마. people want to keep, 사람들이 간직하고 싶어 한다. the idea of magical romance, 마술 같은 사랑에 대한 생각을. in a world, 세상에서. of technology and rapid change, 과학기술과 빠른 변화의. 이 문장 전체를 해석하면, 아마 과학기술과 빠른 변화의 세상에서 사람들이 마술 같은 사랑에 대한 생각을 간직하고 싶은 것인지 모른다.","hl":"m"},{"n":28,"text":"이 문장은 사람들이 과학기술과 빠른 변화 속에서도 마술 같은 사랑에 대한 생각을 간직하려 한다고 추측하며, 첫눈에 반하는 사랑이 왜 매력적인지 설명해요. 마법 같은 로맨스를 동화처럼 붙잡고 싶은 심리를 보여 주는 부분이죠.","hl":"mn"},{"n":29,"text":"첫 번째로, want to keep에서 to부정사는 want의 목적어로 와서 하고 싶은 행동을 나타내요. 두 번째로, the idea of magical romance에서 of 뒤의 magical romance가 앞의 idea의 내용을 구체화해요. 세 번째로, technology and rapid change는 두 명사가 and로 대등하게 연결되어 a world의 내용을 함께 채워 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도\u003c/span>\u003cspan class=\"en\">Maybe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫눈에 반하는 사랑은\u003c/span>\u003cspan class=\"en\">love at first sight\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 동화 같은 것일 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">fairy \u003c/span>\u003cspan class=\"tgt\">tale\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누구나 믿고 싶어 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">everyone \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">wants \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아마도 첫눈에 반하는 사랑은 누구나 믿고 싶어 하는 좋은 동화 같은 것일 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 마지막에서 앞 문장의 질문에 답하듯, 첫눈에 반하는 사랑을 \u003cb class=\"key\">동화\u003c/b>에 빗대어 정리한 문장이에요. 사람들이 그 사랑을 계속 믿는 까닭은 마법 같은 로맨스에 대한 \u003cb class=\"key\">동경\u003c/b> 때문이라는 필자의 생각을 부드럽게 담아냈죠. 그래서 이 문장은 글 전체의 \u003cb class=\"key\">결론\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 like를 이용한 비유(직유) 표현\u003c/span> : [주어] + be동사 + like + [명사(비유 대상)] : \"좋은 동화 같은 것일 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : [선행사 a good fairy tale] + that + [주어 everyone] + [동사 wants] + [to believe in] : \"누구나 믿고 싶어 하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want + [to부정사(목적어)] : \"믿고 싶어 한다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Maybe, 아마도. love at first sight, 첫눈에 반하는 사랑은. is like a good fairy tale, 좋은 동화 같은 것일 것이다. that everyone wants to believe in, 누구나 믿고 싶어 하는. 이 문장 전체를 해석하면, 아마도 첫눈에 반하는 사랑은 누구나 믿고 싶어 하는 좋은 동화 같은 것일 것이다.","hl":"m"},{"n":31,"text":"마지막 문장은 앞에서 던진 질문에 답하듯 첫눈에 반하는 사랑을 동화에 비유하고 있어요. 사람들이 그것을 계속 믿는 이유는 마법 같은 로맨스에 대한 동경 때문이라는 걸 부드럽게 정리한 거죠. 그래서 이 문장은 글 전체의 결론 역할을 합니다.","hl":"mn"},{"n":32,"text":"첫 번째로 is like a good fairy tale에서 like는 동사가 아니라 전치사예요. 그래서 '좋은 동화와 같은'이라는 비유로 읽어 주시면 됩니다. 두 번째로 that everyone wants to believe in에서 that은 앞의 a good fairy tale을 받는 목적격 관계대명사예요. believe in의 목적어가 빠진 자리에 that이 들어갔기 때문에 전치사 in이 뒤에 홀로 남아 있는 것을 꼭 확인하세요. 세 번째로 wants to believe in은 want가 목적어로 to부정사를 데려간 형태이고, believe in은 '믿다'라는 숙어로 통째로 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>누군가를 처음 보고 가슴이 빨리 뛰는 것은 \u003cb class=\"key\">첫눈에 \u003c/b>\u003cb class=\"key\">반하는 \u003c/b>\u003cb class=\"key\">사랑\u003c/b>이라고 부르는 멋진 감정이다.\u003c/li>\u003cli>최근 조사에서 63%가 이를 여전히 믿는다고 답했고, 55%는 그 경험이 \u003cb class=\"key\">결혼\u003c/b>으로 이어졌다고 말했다.\u003c/li>\u003cli>요즘처럼 현실적이고 실용적인 세상에서 왜 많은 사람이 이 사랑을 믿는지가 \u003cb class=\"key\">질문\u003c/b>으로 제시된다.\u003c/li>\u003cli>사람들은 과학기술과 빠른 변화 속에서도 \u003cb class=\"key\">마술 \u003c/b>\u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">사랑\u003c/b>을 간직하고 싶어 하며, 그것은 누구나 믿고 싶어 하는 동화와 같다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>People still believe in love at first sight because they want to keep the idea of magical romance, like a good fairy tale, even in a realistic and practical world.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">누군가를 처음 보고 가슴이 뛰는 경험, 즉 \u003cb class=\"key\">첫눈에 \u003c/b>\u003cb class=\"key\">반하는 \u003c/b>\u003cb class=\"key\">사랑\u003c/b>은 생각보다 흔하며 최근 조사에서도 많은 사람이 이를 믿는다고 답한다. 요즘처럼 현실적이고 실용적인 세상에서도 사람들이 이 사랑을 믿는 까닭은 과학기술과 빠른 변화 속에서 \u003cb class=\"key\">마술 \u003c/b>\u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">사랑\u003c/b>에 대한 생각을 간직하고 싶기 때문이며, 그것은 누구나 믿고 싶어 하는 좋은 \u003cb class=\"key\">동화\u003c/b>와 같다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글은 첫눈에 반하는 사랑을 믿는 사람들이 여전히 많다는 조사에서 출발해, 그 믿음의 이유를 질문하고 답하는 글이었어요. 핵심은 사람들이 현실적인 세상에서도 마술 같은 사랑에 대한 생각을 간직하고 싶어 한다는 것, 그리고 그것이 누구나 믿고 싶어 하는 동화 같다는 점이에요. 질문 뒤에 오는 답을 중심 생각으로 잡는 연습, 꼭 해 보세요. 수고하셨습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
