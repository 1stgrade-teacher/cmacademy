<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 6강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}
.lp *{box-sizing:border-box}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}
.lp-st{border-radius:4px;border-left:4px solid var(--pk-b)}
.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}
.lp-chips span{border-radius:3px;background:#fff}
.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

.lp-ko{border-radius:0;border-left:4px solid var(--pk);background:none;padding:4px 0 4px 12px}
.lp-mn{border-radius:4px;background:var(--am-l);border-color:var(--am-b);color:#5C4510}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 6강 적용독해01","audioDir":"6-01_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">6강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Talking to People: How Oprah Became a Household Name\u003c/h1>\u003ch2>사람들에게 말하기: Oprah가 유명인사가 되기까지\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Oprah Winfrey는 어린 시절부터 &quot;사람들에게 말을 해서&quot; 생계를 꾸리길 원했고, 경험이 전혀 없었지만 라디오 뉴스 리포터로 첫 기회를 잡은 뒤 TV 뉴스 리포터와 할리우드 영화 배우를 거쳐 자신의 TV 토크쇼를 시작했다. 아동학대 같은 주제를 진솔하게 다룬 그녀의 이야기가 시청자들의 마음을 감동시켜, 1980년대 말에는 &quot;Oprah&quot;가 \u003cb class=\"key\">유명인사\u003c/b>를 뜻하는 이름이 되었다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Oprah Winfrey's childhood dream of talking to people came true step by step from radio to TV, and her sincere stories moved audiences and made her a household name.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 미국의 유명한 방송인 Oprah Winfrey가 어떤 과정을 거쳐 유명인사가 되었는지 담은 이야기예요. 어린 시절의 꿈에서 출발해 라디오와 TV를 거쳐 자신의 토크쇼를 갖게 되기까지의 과정이 시간 순서대로 펼쳐집니다. 이 글의 요지는 사람들에게 말을 하며 살고 싶다는 어린 시절의 꿈이 차근차근 현실이 되었고, 진심 어린 이야기가 그녀를 유명인사로 만들었다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">미국의 방송인 Oprah Winfrey는 자신의 이름을 건 토크쇼(talk show)로 세계적인 인물이 되었어요. 토크쇼는 진행자와 출연자가 대화를 나누는 형식의 방송 프로그램인데, 미국에서는 진행자의 이름을 그대로 딴 The Oprah Winfrey Show처럼 이름 자체가 브랜드가 되기도 하죠. 어떤 사람의 이름이 household name, 즉 \u003cb class=\"key\">유명인사\u003c/b>가 되었다는 말은 온 국민이 그 이름을 알 만큼 유명해졌다는 뜻이에요. 마치 우리나라에서 '국민 MC'라는 말이 특정 방송인을 바로 떠올리게 하는 것과 비슷합니다. 그리고 아동학대(child abuse)처럼 무거운 주제를 다룰 때는 말하는 사람이 그 고통을 직접 겪었는지가 이야기의 \u003cb class=\"key\">설득력\u003c/b>을 크게 바꿔요. 그래서 이 지문은 화려한 경력(career)만이 아니라 진심이 사람의 마음을 움직인다는 점을 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 토크쇼는 진행자와 출연자가 대화를 나누는 형식의 방송 프로그램인데, 미국에서는 진행자의 이름을 그대로 딴 The Oprah Winfrey Show처럼 이름 자체가 브랜드가 되기도 합니다. 어떤 사람의 이름이 household name, 즉 유명인사가 되었다는 말은 온 국민이 그 이름을 알 만큼 유명해졌다는 뜻이에요. 우리나라에서 국민 MC라는 말이 특정 방송인을 바로 떠올리게 하는 것과 같은 이치죠. 그리고 아동학대처럼 무거운 주제를 다룰 때는 말하는 사람이 그 고통을 직접 겪었는지가 이야기의 설득력을 크게 바꿉니다. 그래서 이 지문은 화려한 경력만이 아니라 진심이 사람의 마음을 움직인다는 점을 보여 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>어린 시절의 재능과 꿈\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>Oprah는 겨우 두 살 때 교회에서 처음으로 사람들 앞에서 연설했을 만큼 말에 재능이 있었어요. 열두 살쯤에는 이미 장래 직업을 결정했고, 그 꿈은 바로 \u003cb class=\"key\">사람들에게 \u003c/b>\u003cb class=\"key\">말을 \u003c/b>\u003cb class=\"key\">하며\u003c/b> 생계를 꾸리는 일이었죠. 이처럼 어린 시절의 \u003cb class=\"key\">결심\u003c/b>이 이후 모든 선택의 출발점이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>경험 없는 첫 기회\u003csmall>전환 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>곧 그녀는 첫 번째 \u003cb class=\"key\">기회\u003c/b>를 얻었어요. 그런데 그녀는 경험이 전혀 없었죠. 그럼에도 라디오 뉴스 리포터가 되었다는 점에서, 이 글은 \u003cb class=\"key\">경험\u003c/b>보다 기회를 붙잡는 용기가 중요함을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>쌓여 가는 경력과 진심\u003csmall>예시 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>TV 토크쇼를 시작할 무렵 그녀는 이미 TV 뉴스 리포터였고 할리우드 메이저 영화에 출연한 상태였죠. 여기에 아동학대처럼 무거운 주제를 다룬 이야기가 시청자들의 \u003cb class=\"key\">마음\u003c/b>을 감동시켰어요. 그녀 자신도 학대를 겪었다는 \u003cb class=\"key\">진솔함\u003c/b>이 이야기의 설득력을 더해 주었습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>유명인사가 된 결과\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>결국 1980년대 말쯤에 The Oprah Winfrey Show는 아주 인기가 있어서 &quot;Oprah&quot;라는 이름 자체가 \u003cb class=\"key\">유명인사\u003c/b>를 뜻하게 되었어요. 어린 시절의 꿈과 쌓아 온 경력, 그리고 진심이 만나 완성된 \u003cb class=\"key\">결말\u003c/b>인 셈입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. Oprah는 겨우 두 살 때 교회에서 처음으로 사람들 앞에서 연설했을 만큼 말에 재능이 있었어요. 열두 살쯤에는 이미 장래 직업을 결정했고, 그 꿈은 사람들에게 말을 하며 생계를 꾸리는 일이었죠. 이 어린 시절의 결심이 이후 모든 선택의 출발점이 됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 전환이에요. 곧 그녀는 첫 번째 기회를 얻었습니다. 그런데 그녀는 경험이 전혀 없었죠. 그럼에도 라디오 뉴스 리포터가 되었다는 점에서, 이 글은 경험보다 기회를 붙잡는 용기가 중요함을 보여 줍니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 예시예요. TV 토크쇼를 시작할 무렵 그녀는 이미 TV 뉴스 리포터였고 할리우드 메이저 영화에 출연한 상태였죠. 여기에 아동학대처럼 무거운 주제를 다룬 이야기가 시청자들의 마음을 감동시켰어요. 그녀 자신도 학대를 겪었다는 진솔함이 이야기의 설득력을 더해 주었습니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결론이에요. 팔십 년대 말쯤에 The Oprah Winfrey Show는 아주 인기가 있어서 Oprah라는 이름 자체가 유명인사를 뜻하게 되었어요. 어린 시절의 꿈과 쌓아 온 경력, 그리고 진심이 만나 완성된 결말인 셈입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 Oprah의 삶을 어린 시절부터 시간의 흐름에 따라 차례대로 늘어놓는 \u003cb class=\"key\">시간순\u003c/b> 전개 방식이에요. 두 살, 열두 살, 1986년, 1980년대 말처럼 시점을 알려 주는 표현이 계속 이어지며 사건이 연결되죠. 글의 결정적인 결과는 마지막 문장에서 household name이라는 표현으로 제시됩니다. 그래서 결론이 끝에 오는 \u003cb class=\"key\">미괄식\u003c/b> 구조로 읽어야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>for the first time (1)\u003c/b>\u003cspan>최초의 사건 표시\u003c/span>\u003cb>By the age of twelve (2)\u003c/b>\u003cspan>시간 기준 제시\u003c/span>\u003cb>Soon (4)\u003c/b>\u003cspan>사건의 빠른 진행\u003c/span>\u003cb>Although (5)\u003c/b>\u003cspan>양보·대조\u003c/span>\u003cb>When (6)\u003c/b>\u003cspan>시간 접속\u003c/span>\u003cb>By the late 1980s (8)\u003c/b>\u003cspan>결과를 향한 시간 마무리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">spoke publicly in church\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">decided on her future career\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">make her living &quot;talking to people&quot;\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">got her first opportunity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">became a radio news reporter\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">started her TV talk show\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">had become a household name\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 시간순입니다. 두 살일 때, 열두 살쯤, TV 토크쇼를 시작한 때, 팔십 년대 말쯤처럼 시점을 알려 주는 표현이 계속 이어지면서 사건이 순서대로 배열되죠. 결정적인 결과는 맨 마지막 문장에서 household name이라는 표현으로 제시됩니다. 그래서 이 글은 결론이 끝에 오는 미괄식 구조로 읽으면 됩니다.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. for the first time은 최초의 사건을, By the age of twelve는 시간의 기준을, Soon은 사건의 빠른 진행을 알려 줍니다. Although는 양보의 대조를, When은 시간 접속을, By the late 1980s는 결과를 향한 시간의 마무리를 표시하죠. 또 became a radio news reporter와 had become a household name처럼 경력이 쌓이는 표현이 재진술처럼 이어지는 점도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>speak\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다, 연설하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>publicly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>사람들 앞에서, 공개적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>for the first time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>처음으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>by the age of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~살쯤에\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>career\u003c/b>\u003cem>명사\u003c/em>\u003cspan>직업, 경력\u003c/span>\u003c/div>\u003cdiv>\u003cb>make one's living\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>생계를 꾸리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>although\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~이지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경험\u003c/span>\u003c/div>\u003cdiv>\u003cb>radio news reporter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>라디오 뉴스 리포터\u003c/span>\u003c/div>\u003cdiv>\u003cb>become\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~이 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>talk show\u003c/b>\u003cem>명사\u003c/em>\u003cspan>토크쇼\u003c/span>\u003c/div>\u003cdiv>\u003cb>already\u003c/b>\u003cem>부사\u003c/em>\u003cspan>이미\u003c/span>\u003c/div>\u003cdiv>\u003cb>act\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연기하다, 출연하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>major\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>주요한, 메이저의\u003c/span>\u003c/div>\u003cdiv>\u003cb>topic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주제\u003c/span>\u003c/div>\u003cdiv>\u003cb>child abuse\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아동학대\u003c/span>\u003c/div>\u003cdiv>\u003cb>herself\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>그녀 자신\u003c/span>\u003c/div>\u003cdiv>\u003cb>abuse\u003c/b>\u003cem>동사\u003c/em>\u003cspan>학대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>move\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감동시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>audience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시청자, 청중\u003c/span>\u003c/div>\u003cdiv>\u003cb>by the late 1980s\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>1980년대 말쯤에\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>so ~ that\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>너무 ~해서 …하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>household name\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>유명인사, 집집마다 아는 이름\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚을게요. decide on은 무엇을 결정하다는 뜻이고, make one's living은 생계를 꾸리다라는 숙어예요. opportunity는 기회, experience는 경험, audience는 시청자나 청중을 뜻합니다. 그리고 household name은 집집마다 아는 이름, 즉 유명인사라는 표현이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">decide\u003c/b>\u003cspan class=\"m\">결정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">determine\u003c/span>\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hesitate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">opportunity\u003c/b>\u003cspan class=\"m\">기회\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">chance\u003c/span>\u003cspan class=\"s\">opening\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">experience\u003c/b>\u003cspan class=\"m\">경험\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">practice\u003c/span>\u003cspan class=\"s\">exposure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inexperience\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">popular\u003c/b>\u003cspan class=\"m\">인기 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-liked\u003c/span>\u003cspan class=\"s\">favored\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpopular\u003c/span>\u003cspan class=\"a\">unknown\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">major\u003c/b>\u003cspan class=\"m\">주요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">main\u003c/span>\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">move\u003c/b>\u003cspan class=\"m\">감동시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">touch\u003c/span>\u003cspan class=\"s\">affect\u003c/span>\u003cspan class=\"s\">stir\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">household name\u003c/b>\u003cspan class=\"m\">유명인사\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">celebrity\u003c/span>\u003cspan class=\"s\">well-known figure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">nobody\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. decide는 determine이나 resolve로 바꿔 쓸 수 있고, 반대말로는 hesitate를 기억하면 좋아요. experience의 동의어는 practice나 exposure이고 반대말은 inexperience입니다. popular는 well-liked나 favored로, major는 main이나 significant로 바꿀 수 있으며 각각 unpopular와 minor가 반대말이죠. opportunity는 chance나 opening으로 바꿔 쓸 수 있고, household name은 celebrity나 well-known figure와 같은 뜻입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오프라 윈프리는 겨우 두 살이었다\u003c/span>\u003cspan class=\"en\">Oprah Winfrey \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">two\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 사람들 앞에서 연설을 했을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">spoke \u003c/span>\u003cspan class=\"tgt\">publicly \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교회에서 처음으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">church \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Oprah Winfrey 가 교회에서 처음 사람들 앞에서 연설을 했을 때 그녀는 겨우 2 살이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 오프라 윈프리가 얼마나 어린 나이에 처음 사람들 앞에 섰는지를 보여 줍니다. \u003cb class=\"key\">겨우 \u003c/b>\u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">살\u003c/b>이라는 표현으로 그녀의 이른 시작을 강조하고, 뒤에 이어질 놀라운 성공 이야기의 출발점 역할을 합니다. \u003cb class=\"key\">publicly\u003c/b>는 '사적으로'가 아니라 '사람들 앞에서, 공개적으로'라는 뜻으로 기억해 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">강조 부사 just와 나이 표현\u003c/span> : Oprah Winfrey [was] + [just two (나이를 나타내는 수사)] : \"겨우 두 살이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [when + 주어 + 동사] + 주절 : \"그녀가 교회에서 처음으로 사람들 앞에서 연설을 했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부사의 동사 수식(방법)\u003c/span> : spoke [자동사] + [publicly (부사/방법)] : \"사람들 앞에서(공개적으로) 연설했다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Oprah Winfrey was just two, 오프라 윈프리는 겨우 두 살이었다. when she spoke publicly, 그녀가 사람들 앞에서 연설을 했을 때. in church for the first time, 교회에서 처음으로. 이 문장 전체를 해석하면, Oprah Winfrey 가 교회에서 처음 사람들 앞에서 연설을 했을 때 그녀는 겨우 2 살이었다.","hl":"m"},{"n":13,"text":"이 문장은 오프라 윈프리가 얼마나 어린 나이에 처음 사람들 앞에 섰는지를 보여 주는 문장이에요. 겨우 두 살이라는 점을 강조해서, 뒤에 나올 그녀의 놀라운 성공 이야기와 대비시키는 출발점이 되는 거죠. 그리고 publicly는 사적인 게 아니라 사람들 앞에서, 공개적으로라는 뜻으로 꼭 기억해 두세요.","hl":"mn"},{"n":14,"text":"첫 번째로 was just two에서 just는 겨우, 단지라는 뜻으로 나이를 나타내는 수사를 강조하고 있어요. 그리고 be동사 뒤에 수사가 오면 나이 표현이 된다는 것도 함께 알아 두세요. 두 번째로 when she spoke publicly in church for the first time은 시간 부사절인데, 주절이 과거이기 때문에 when절 동사도 과거형 spoke로 시제를 맞춘 거예요. 세 번째로 spoke publicly에서 publicly는 부사로서 동사 spoke를 꾸며 어떻게 연설했는지 방법을 알려 주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">12살쯤에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">age \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">twelve\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 이미 결정했다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">already \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">decided \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장래 직업을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on\u003c/span> her future career.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">12 살쯤에는 그녀는 이미 장래 직업을 결정했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 오프라가 아주 이른 나이에 이미 장래 직업을 정해 두었다는 사실을 전합니다. \u003cb class=\"key\">By \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">age \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">twelve\u003c/b>라는 기준 시점이 있고, 그보다 더 이전에 결정이 끝났다는 점이 \u003cb class=\"key\">과거완료\u003c/b>로 표현됩니다. 앞 문장의 꿈이 단순한 바람이 아니라 확실한 결심이었다는 것을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 by + 시점(완료의 기준)\u003c/span> : [By + the age of twelve] : \"12살쯤에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료(have + p.p.)\u003c/span> : had + [already + p.p.] : \"이미 결정해 두었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 on이 붙는 동사 decide\u003c/span> : decide + [on + 명사] : \"장래 직업을 결정하다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"By the age of twelve, 12살쯤에는. she had already decided, 그녀는 이미 결정했다. on her future career, 장래 직업을. 이 문장 전체를 해석하면, 12 살쯤에는 그녀는 이미 장래 직업을 결정했다.","hl":"m"},{"n":16,"text":"이 문장은 오프라가 12살이라는 아주 이른 나이에 이미 장래 직업을 정해 두었다는 사실을 전해요. by the age of twelve라는 기준 시점이 있고, 그보다 더 이전에 결정이 끝났다는 점이 과거완료로 표현된 거죠. 앞 문장에서 말한 꿈이 단순한 바람이 아니라 확실한 결심이었다는 걸 보여 줍니다.","hl":"mn"},{"n":17,"text":"첫 번째로 By the age of twelve에서 by는 그 시점까지 완료라는 기준 시점을 만들어 주는 전치사예요. 그래서 두 번째로 had already decided라는 과거완료가 자연스럽게 이어지는데, 12살보다 더 이전에 이미 결정을 끝냈다는 완료의 의미를 already가 강조해 줍니다. 세 번째로 decided on은 decide on 형태로 쓰여 무엇으로 정할지를 말하는 구조이고, on her future career가 전치사 목적어로 이어집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 원했다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생계를 꾸려 나가기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">living\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;사람들에게 말을 해서&quot;\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">talking \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 “사람들에게 말을 해서” 생계를 꾸려 나가길 원했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 오프라가 장래 직업으로 무엇을 원했는지 구체적으로 말해 줍니다. 사람들과 이야기하는 일로 먹고살고 싶다는 것인데, 이 꿈이 훗날 토크쇼 진행자라는 직업과 정확히 이어진다는 점이 중요합니다. 큰따옴표 안의 \u003cb class=\"key\">talking \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">people\u003c/b>이 그 꿈의 내용을 그대로 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : wanted [타동사] + [to make (to부정사/목적어)] : \"생계를 꾸리기를 원했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">make a living 관용표현\u003c/span> : make + [one's living] : \"생계를 꾸리다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사구(방법·수단)\u003c/span> : make one's living + [talking to people (현재분사구)] : \"사람들에게 말을 하면서(그것으로)\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"She wanted, 그녀는 원했다. to make her living, 생계를 꾸려 나가기를. \"talking to people.\", \"사람들에게 말을 해서\". 이 문장 전체를 해석하면, 그녀는 “사람들에게 말을 해서” 생계를 꾸려 나가길 원했다.","hl":"m"},{"n":19,"text":"이 문장은 오프라가 장래 직업으로 무엇을 원했는지 구체적으로 말해 줘요. 바로 사람들과 이야기하는 일로 먹고살고 싶다는 것인데, 그 꿈이 훗날 토크쇼 진행자라는 직업과 정확히 연결된다는 점이 중요합니다. 큰따옴표 안의 talking to people이 그 꿈의 내용을 그대로 보여 주고 있어요.","hl":"mn"},{"n":20,"text":"첫 번째로 wanted to make에서 want는 목적어로 to부정사를 취하는 동사라서 to make가 목적어로 온 거예요. 두 번째로 make her living은 생계를 꾸리다라는 관용표현이고, living은 먹고사는 일, 즉 생계를 뜻합니다. 세 번째로 talking to people은 문장의 동사가 아니라 어떤 방법으로 생계를 꾸리는지를 덧붙여 주는 현재분사이고, talk to people은 사람들에게 말을 하다라는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Soon\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 얻었다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 첫 번째 기회를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">opportunity\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">곧 그녀는 첫 번째 기회를 얻었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 장래 희망을 정한 이야기를 받아, 그 꿈이 현실로 이어지는 장면을 열어 주는 문장이에요. \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">기회\u003c/b>라는 표현이 뒤에 나올 라디오 리포터 사건을 \u003cb class=\"key\">예고\u003c/b>하는 신호탄이죠. soon 하나만 봐도 그 기회가 아주 오래 걸리지 않고 찾아왔다는 것이 느껴집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사의 문두 위치\u003c/span> : [Soon (시간 부사)] + [주어] + [동사] + [목적어] : \"곧\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사의 3형식 문형\u003c/span> : [주어 she] + [동사 got] + [목적어 her first opportunity] : \"그녀는 그녀의 첫 번째 기회를 얻었다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Soon, 곧. she got, 그녀는 얻었다. her first opportunity, 그녀의 첫 번째 기회를. 이 문장 전체를 해석하면, 곧 그녀는 첫 번째 기회를 얻었다.","hl":"m"},{"n":22,"text":"이 문장은 장래 희망을 정한 이야기를 받아서 그 꿈이 현실로 이어지는 장면을 열어 주는 역할을 해요. 여기서 첫 번째 기회라는 말이 뒤에 나올 라디오 리포터 사건을 예고하는 신호탄이죠. soon 하나만 봐도 기회가 아주 오래 걸리지 않고 찾아왔다는 게 느껴집니다.","hl":"mn"},{"n":23,"text":"먼저 Soon은 시간을 나타내는 시간 부사인데, 문장 맨 앞인 문두에 놓여서 사건이 일어난 시점을 먼저 알려 줍니다. 두 번째로 got her first opportunity를 보시면, get이 목적어를 필요로 하는 타동사라서 her first opportunity가 목적어 자리에 딱 들어와 있어요. 그래서 그녀가 무엇을 얻었는지가 한눈에 보이는 문장입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 그녀는 가지고 있지 않았지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 경험도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">experience\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라디오 뉴스 리포터가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">radio \u003c/span>\u003cspan class=\"tgt\">news \u003c/span>\u003cspan class=\"tgt\">reporter\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 경험이 전혀 없었지만 라디오 뉴스 리포터가 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 기회를 얻었다고 했으니, 이 문장은 그 기회가 어떻게 가능했는지를 설명해 줘요. 경험이 전혀 없다는 \u003cb class=\"key\">양보\u003c/b>의 상황을 먼저 깔아 놓고, 그래도 리포터가 되었다는 결과를 보여 주면서 그녀의 \u003cb class=\"key\">도전\u003c/b>을 부각시키죠. 쉽게 말해 스펙보다 의지로 문을 연 장면입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 부사절 접속사 Although\u003c/span> : [Although + 주어 + 동사 ~], [주어 + 동사 ~] : \"비록 그녀는 ~가 없었지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정문에서의 any\u003c/span> : [부정어 didn't] + [동사 have] + [any + 명사] : \"어떤 경험도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">불완전자동사 become + 주격보어\u003c/span> : [주어 she] + [동사 became] + [주격보어 a radio news reporter] : \"그녀는 라디오 뉴스 리포터가 되었다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Although she didn't have, 비록 그녀는 가지고 있지 않았지만. any experience, 어떤 경험도. she became, 그녀는 되었다. a radio news reporter, 라디오 뉴스 리포터가. 이 문장 전체를 해석하면, 그녀는 경험이 전혀 없었지만 라디오 뉴스 리포터가 되었다.","hl":"m"},{"n":25,"text":"앞 문장에서 기회를 얻었다고 했으니, 이 문장은 그 기회가 어떻게 가능했는지를 설명해 줘요. 경험이 전혀 없다는 양보의 상황을 먼저 깔아 놓고, 그래도 리포터가 되었다는 결과를 보여 주면서 그녀의 도전을 부각시키죠. 쉽게 말해 스펙보다 의지로 문을 연 장면입니다.","hl":"mn"},{"n":26,"text":"첫 번째로 Although는 뒤에 오는 절이 양보의 뜻을 담도록 이끄는 부사절 접속사예요. 비록 그런데도, 이렇게 반대 흐름을 만들어 주는 거죠. 두 번째로 부정문에서는 some 대신 any를 써서 어떤 경험도 없다는 뜻을 만듭니다. 세 번째로 became은 주어의 상태 변화를 나타내는 불완전자동사라서 뒤에 주격보어가 꼭 필요해요. 그래서 a radio news reporter가 그 자리에 온 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오프라가 1986년 자신의 TV 토크쇼를 시작했을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">Oprah \u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">TV \u003c/span>\u003cspan class=\"tgt\">talk \u003c/span>\u003cspan class=\"tgt\">show \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">1986\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 이미 TV 뉴스 리포터였고\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">already \u003c/span>\u003cspan class=\"tgt\">been\u003c/span> a TV news reporter\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 출연했었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">acted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할리우드 메이저 영화에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">major \u003c/span>\u003cspan class=\"tgt\">Hollywood \u003c/span>\u003cspan class=\"tgt\">movie\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Oprah 가 1986 년 자신의 TV 토크쇼를 시작했을 때, 그녀는 이미 TV 뉴스 리포터였고 할리우드 메이저 영화에 출연했었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 쇼를 시작한 시점을 기준으로 그 이전에 쌓아 둔 경력을 정리해 주는 역할을 해요. 리포터였던 일과 영화 출연을 \u003cb class=\"key\">과거완료\u003c/b>로 묶어 \u003cb class=\"key\">대과거\u003c/b>의 상황을 보여 주고, 두 일을 and로 \u003cb class=\"key\">병렬\u003c/b> 연결해 한 사람의 이력으로 묶었죠. 덕분에 뒤에 나오는 성공이 우연이 아니라는 흐름이 만들어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절 접속사 When\u003c/span> : [When + 주어 + 동사 ~], [주어 + 동사 ~] : \"오프라가 1986년에 자신의 TV 토크쇼를 시작했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료(have + p.p.)\u003c/span> : [had + already + p.p.] : \"이미 ~이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거완료의 병렬 구조\u003c/span> : [had been ~] + and + [had acted ~] : \"그리고 출연했었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 in (act in)\u003c/span> : [act] + [in + 작품·장소] : \"할리우드 메이저 영화에\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"When Oprah started her TV talk show in 1986, 오프라가 1986년 자신의 TV 토크쇼를 시작했을 때. she had already been a TV news reporter, 그녀는 이미 TV 뉴스 리포터였고. and had acted, 그리고 출연했었다. in a major Hollywood movie, 할리우드 메이저 영화에. 이 문장 전체를 해석하면, Oprah 가 1986 년 자신의 TV 토크쇼를 시작했을 때, 그녀는 이미 TV 뉴스 리포터였고 할리우드 메이저 영화에 출연했었다.","hl":"m"},{"n":28,"text":"이 문장은 쇼를 시작한 시점을 기준으로 그 이전에 쌓아 둔 경력을 정리해 주는 역할을 해요. 리포터였던 일과 영화 출연을 과거완료로 묶어서 대과거의 상황을 보여 주고, 두 가지 일을 and로 병렬 연결해서 한 사람의 이력으로 깔끔하게 묶었죠. 덕분에 뒤에 나오는 성공이 우연이 아니라는 흐름이 자연스럽게 만들어집니다.","hl":"mn"},{"n":29,"text":"첫 번째로 When은 시간 부사절을 이끄는 접속사예요. 쇼를 시작한 그때를 기준점으로 먼저 세워 주는 거죠. 두 번째로 had already been은 과거완료인데, 쇼를 시작한 시점보다 더 앞선 대과거의 일을 말합니다. 세 번째로 and had acted는 앞의 과거완료와 병렬로 묶여서 영화에 출연한 일도 같은 시점의 일임을 보여 줘요. 네 번째로 in a major Hollywood movie에서 in은 작품 앞에 붙어 영화에 출연하다는 뜻을 만드는 전치사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 이야기들은\u003c/span>\u003cspan class=\"en\">Her stories\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아동학대와 같은 주제에 관한\u003c/span>\u003cspan class=\"en\">on topics \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">child \u003c/span>\u003cspan class=\"tgt\">abuse\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">― Oprah 자신도 학대를 받았었다 ―\u003c/span>\u003cspan class=\"en\">– Oprah, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">herself\u003c/span>, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">abused\u003c/span> –\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마음을 감동시켰다\u003c/span>\u003cspan class=\"en\">moved the hearts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시청자들의\u003c/span>\u003cspan class=\"en\">of her audience.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아동학대와 같은 주제에 관한 그녀의 이야기는 ― Oprah 자신도 학대를 받았었다 ― 시청자들의 마음을 감동시켰다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오프라의 이야기가 사람들을 움직인 이유를 밝히는 문장이에요. 소재가 \u003cb class=\"key\">아동학대\u003c/b>였고, 오프라 자신이 바로 그 피해자였기에 이야기에 힘이 실렸다는 뜻이죠. 대시로 묶인 부분은 앞 내용에 \u003cb class=\"key\">부연 \u003c/b>\u003cb class=\"key\">설명\u003c/b>을 덧붙이는 삽입구로, 문장 흐름을 잠깐 멈추고 배경을 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 such as (예시 제시)\u003c/span> : such as + [명사(예시)] (앞 명사의 예를 들어 줌) : \"아동학대와 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사의 강조 용법\u003c/span> : [명사] + [재귀대명사] (동격·강조) : \"Oprah 자신도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거완료 수동태\u003c/span> : had + been + [과거분사] (대과거의 수동) : \"학대를 받았었다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Her stories, 그녀의 이야기들은. on topics such as child abuse, 아동학대와 같은 주제에 관한. – Oprah, herself, had been abused –, ― Oprah 자신도 학대를 받았었다 ―. moved the hearts, 마음을 감동시켰다. of her audience, 시청자들의. 이 문장 전체를 해석하면, 아동학대와 같은 주제에 관한 그녀의 이야기는 ― Oprah 자신도 학대를 받았었다 ― 시청자들의 마음을 감동시켰다.","hl":"m"},{"n":31,"text":"이 문장은 오프라의 이야기가 왜 사람들 마음을 움직였는지 설명해 줘요. 다룬 소재가 아동학대였고, 오프라 자신이 바로 그 피해자였기 때문에 이야기에 설득력이 있었던 거죠. 중간에 대시로 묶인 부분은 잠깐 끼어들어 배경을 알려 주는 삽입구라고 기억해 두세요.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 such as child abuse예요. 앞에 나온 topics의 구체적인 예를 하나 들어 주는 표현이죠. 두 번째는 herself인데, 명사 바로 뒤에서 그 사람 자신을 강조하는 재귀대명사예요. 세 번째는 had been abused인데, 주어가 당하는 입장이라 수동태로 썼고, 이야기가 전달된 시점보다 더 이전에 일어난 일이라 과거완료를 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1980년대 말쯤에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">late \u003c/span>\u003cspan class=\"tgt\">1980s\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“Oprah Winfrey Show”는\u003c/span>\u003cspan class=\"en\">The Oprah Winfrey Show\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 인기가 있어서\u003c/span>\u003cspan class=\"en\">was \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">popular \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“Oprah”가 되어 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> &quot;Oprah&quot; \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">become\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유명인사가\u003c/span>\u003cspan class=\"en\">a household name.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1980 년대 말쯤에 “ Oprah Winfrey Show ”는 아주 인기가 있어서 “ Oprah ”는 유명인사가 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 쇼의 인기가 어느 정도였는지를 결과로 보여 주는 문장이에요. 프로그램 이름인 Oprah가 사람 이름처럼 통할 만큼 대중적이었다는 뜻이죠. 앞 문장에서 말한 감동적인 이야기들이 결국 이런 \u003cb class=\"key\">인기\u003c/b>로 이어졌다는 흐름을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 by + 시점 (완료 시제와 호응)\u003c/span> : by + [시점] + [완료시제] : \"1980년대 말쯤에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">so ~ that 구문 (정도의 결과)\u003c/span> : so + [형용사/부사] + that + [주어 + 동사] : \"아주 인기가 있어서 …했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거완료 (대과거)\u003c/span> : had + [과거분사] : \"되어 있었다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"By the late 1980s, 1980년대 말쯤에는. The Oprah Winfrey Show, “Oprah Winfrey Show”는. was so popular, 아주 인기가 있어서. that \"Oprah\" had become, “Oprah”가 되어 있었다. a household name, 유명인사가. 이 문장 전체를 해석하면, 1980 년대 말쯤에 “ Oprah Winfrey Show ”는 아주 인기가 있어서 “ Oprah ”는 유명인사가 되었다.","hl":"m"},{"n":34,"text":"이 문장은 쇼의 인기가 어느 정도였는지를 결과로 보여 줘요. 프로그램 이름이 곧 사람 이름처럼 통할 만큼 대중적이었다는 뜻이죠. 앞에서 말한 감동적인 이야기들이 결국 이런 인기로 이어졌다는 흐름을 잡으면 됩니다.","hl":"mn"},{"n":35,"text":"첫 번째는 By the late 1980s인데요, by에 시점이 붙으면 그 시점까지 이미라는 뜻이 되고 완료 시제와 잘 어울려요. 두 번째는 so popular that 구문으로, 인기의 정도가 뒤의 결과로 이어지는 구조예요. 세 번째는 had become인데, 과거보다 더 이전에 이미 완료된 일을 나타내는 과거완료라고 정리해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Oprah는 두 살 때 교회에서 처음 사람들 앞에서 연설했고, 열두 살쯤에는 이미 장래 직업을 \u003cb class=\"key\">결정\u003c/b>했습니다.\u003c/li>\u003cli>그녀의 꿈은 &quot;사람들에게 말을 해서&quot; \u003cb class=\"key\">생계\u003c/b>를 꾸리는 일이었고, 곧 첫 번째 기회를 얻어 경험이 전혀 없었지만 라디오 뉴스 리포터가 되었습니다.\u003c/li>\u003cli>TV 토크쇼를 시작할 무렵 그녀는 이미 TV 뉴스 리포터이자 할리우드 영화에 출연한 배우였고, 아동학대 같은 주제의 이야기로 시청자들의 \u003cb class=\"key\">마음\u003c/b>을 감동시켰습니다.\u003c/li>\u003cli>1980년대 말쯤 The Oprah Winfrey Show가 아주 인기가 있어서 &quot;Oprah&quot;는 \u003cb class=\"key\">유명인사\u003c/b>를 뜻하는 이름이 되었습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Oprah Winfrey's childhood dream of talking to people came true step by step from radio to TV, and her sincere stories moved audiences and made her a household name.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Oprah Winfrey는 어린 시절부터 &quot;사람들에게 말을 해서&quot; 생계를 꾸리길 원했고, 경험이 전혀 없었지만 라디오 뉴스 리포터로 첫 기회를 잡은 뒤 TV 뉴스 리포터와 할리우드 영화 배우를 거쳐 자신의 TV 토크쇼를 시작했다. 아동학대 같은 주제를 진솔하게 다룬 그녀의 이야기가 시청자들의 마음을 감동시켜, 1980년대 말에는 &quot;Oprah&quot;가 \u003cb class=\"key\">유명인사\u003c/b>를 뜻하는 이름이 되었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 글은 어린 시절의 꿈이 시간순으로 현실이 되어 가는 과정을 보여 주었어요. 사람들에게 말을 하며 살고 싶다는 결심, 경험 없이도 잡은 첫 기회, 그리고 진심 어린 이야기가 그녀를 유명인사로 만들었죠. 시간 표현에 표시를 하며 읽는 습관을 꼭 기억하세요. 수고했어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
