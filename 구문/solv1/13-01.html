}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 13강 적용독해01","audioDir":"13-01_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">13강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>From a Class Story to Free the Children\u003c/h1>\u003ch2>한 교실 이야기에서 Free the Children까지\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Craig Kielburger는 아시아 어린이 노동자들의 \u003cb class=\"key\">열악한 \u003c/b>\u003cb class=\"key\">대우\u003c/b>를 듣고 \u003cb class=\"key\">어린이 \u003c/b>\u003cb class=\"key\">권리\u003c/b>를 위해 싸우기로 결심했으며, 친구들과 \u003cb class=\"key\">Free \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">Children\u003c/b>을 세워 인도 등 여러 나라에서 학교와 \u003cb class=\"key\">의료 \u003c/b>\u003cb class=\"key\">프로그램\u003c/b>을 지원해 왔다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Craig Kielburger founded Free the Children after learning about child laborers and has helped provide education and medical programs around the world.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 학생 여러분. 오늘은 Craig Kielburger가 어린이 노동자 문제를 알게 된 뒤 Free the Children을 세우고 실제 변화를 만들어 낸 이야기를 읽어 볼 거예요. 이 글은 한 소년의 작은 결심이 학교와 의료 지원이라는 큰 성과로 이어지는 과정을 보여 줍니다. 핵심은 어린이 권리를 위해 싸우기로 한 결심과 그 결심을 행동으로 옮긴 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">세계 곳곳에서는 아이들이 학교에 다니지 못하고 \u003cb class=\"key\">아동 \u003c/b>\u003cb class=\"key\">노동\u003c/b>(child labor)에 내몰리는 경우가 있다. 이러한 \u003cb class=\"key\">어린이 \u003c/b>\u003cb class=\"key\">노동자\u003c/b>(child laborers)는 힘들고 위험한 일을 하며 교육과 건강을 보호받지 못하기 쉽다. 그래서 국제 사회는 \u003cb class=\"key\">어린이 \u003c/b>\u003cb class=\"key\">권리\u003c/b>(children's rights)를 보호하고 무상 교육과 의료 지원을 늘리는 것을 중요한 과제로 본다. Free the Children 같은 단체는 시민들이 자발적으로 참여하는 비영리 기구(NGO)의 예로, 작은 모금이 학교와 의료 프로그램으로 이어지게 한다. 이는 마치 반 친구들이 용돈을 모아 어려운 친구의 학용품을 사 주는 것과 비슷하다. 작은 관심과 행동이 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">변화\u003c/b>로 이어질 수 있다는 점을 보여 준다.\u003c/div>","segs":[{"n":2,"text":"배경지식을 조금 더해 볼게요. 세계 곳곳에는 아이들이 학교에 다니지 못하고 아동 노동에 내몰리는 경우가 있어요. 이런 어린이 노동자는 힘들고 위험한 일을 하면서 교육과 건강을 제대로 보호받지 못하기 쉽죠. 그래서 국제 사회는 어린이 권리를 보호하고 무상 교육과 의료 지원을 늘리는 일을 중요하게 생각합니다. Free the Children 같은 단체는 시민들이 자발적으로 참여하는 비영리 기구의 예로, 작은 모금이 학교와 의료 프로그램으로 이어지게 해요. 이건 마치 반 친구들이 용돈을 모아 어려운 친구의 학용품을 사 주는 것과 비슷합니다. 작은 관심과 행동이 사회 변화로 이어질 수 있다는 점을 기억해 주세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>기억과 계기\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 Craig Kielburger가 아직도 그날을 기억한다는 말로 시작한다. 그는 열두 살 때 선생님에게서 아시아의 \u003cb class=\"key\">어린이 \u003c/b>\u003cb class=\"key\">노동자\u003c/b>에 대해 들었다. 지구 반대편 아이들의 \u003cb class=\"key\">열악한 \u003c/b>\u003cb class=\"key\">대우\u003c/b>가 이야기의 출발점이 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문제 인식과 결심\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>Craig는 아이들이 왜 힘들고 위험한 일을 \u003cb class=\"key\">강요\u003c/b>받는지 이해할 수 없었다. 그래서 그는 그 자리에서 아이들의 \u003cb class=\"key\">권리\u003c/b>를 위해 싸우기로 결심한다. 이 결심이 이후 행동의 동기가 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>단체 설립과 모금\u003csmall>행동 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>Craig는 학교 친구 몇 명과 함께 \u003cb class=\"key\">Free \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">Children\u003c/b>이라는 단체를 세웠다. 그들은 인도의 어린이 노동자들이 \u003cb class=\"key\">무상 \u003c/b>\u003cb class=\"key\">교육\u003c/b>을 받을 수 있는 학교를 짓기 위해 모금을 시작했다. 작은 친구들의 힘이 구체적인 \u003cb class=\"key\">행동\u003c/b>으로 이어졌다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>십 년 뒤의 성과\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>십 년이 지난 뒤 Free the Children은 20여 개국에서 420개가 넘는 학교를 세웠다. 또한 의료 프로그램의 \u003cb class=\"key\">비용\u003c/b>을 지불하며 지원 범위를 넓혔다. 한 소년의 \u003cb class=\"key\">결심\u003c/b>이 여러 나라의 교육과 건강을 돕는 성과로 이어졌다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"먼저 Craig Kielburger가 그날을 아직도 기억한다는 말로 글이 시작해요. 그는 열두 살 때 선생님에게서 아시아의 어린이 노동자에 대해 들었죠. 지구 반대편 아이들이 열악한 대우를 받고 있다는 사실이 이야기의 출발점이 됩니다.","hl":"f0"},{"n":5,"text":"그런데 Craig는 아이들이 왜 힘들고 위험한 일을 강요받는지 이해할 수 없었어요. 그래서 그는 그 자리에서 아이들의 권리를 위해 싸우기로 결심합니다. 이 결심이 이후 행동을 이끄는 힘이 되죠.","hl":"f1"},{"n":6,"text":"결심은 행동으로 이어졌어요. Craig는 학교 친구 몇 명과 함께 Free the Children이라는 단체를 세웠고, 인도의 어린이 노동자들이 무상 교육을 받을 수 있는 학교를 짓기 위해 모금을 시작했습니다. 작은 친구들의 힘이 구체적인 행동으로 나타난 거예요.","hl":"f2"},{"n":7,"text":"십 년이 지난 뒤 Free the Children은 여러 나라에서 수백 개가 넘는 학교를 세웠어요. 또 의료 프로그램의 비용을 지불하며 지원의 범위를 넓혔습니다. 한 소년의 결심이 여러 나라의 교육과 건강을 돕는 성과로 이어진 거죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 열두 살 때의 수업 장면에서 시작해 그 자리에서의 결심, 단체 설립과 모금, 십 년 뒤의 성과로 이어지는 \u003cb class=\"key\">시간순\u003c/b> 전개를 보인다. 핵심 사건이 앞에서 제시되고 구체적 결과가 마지막에 정리되므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있다. 특히 마지막 문장이 학교와 의료 프로그램이라는 \u003cb class=\"key\">성과\u003c/b>를 압축해 주제를 드러낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>still remembers (1)\u003c/b>\u003cspan>회상 도입\u003c/span>\u003cb>Then and there (4)\u003c/b>\u003cspan>즉각적 결심\u003c/span>\u003cb>Now, ten years later (7)\u003c/b>\u003cspan>시간 경과 후 결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">children on the other side of the world\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">child laborers in Asia\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">children's rights\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Free the Children\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">child laborers in India\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">free education\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">medical programs\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간순으로 전개되는 이야기예요. 열두 살 때의 수업 장면에서 시작해 그 자리에서의 결심, 단체 설립과 모금, 십 년 뒤의 성과로 자연스럽게 이어집니다. 핵심 결과가 마지막에 정리되므로 미괄식 구조로 볼 수 있어요. 마지막 문장이 학교와 의료 프로그램이라는 성과를 압축해 주제를 드러냅니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 still remembers가 과거 회상의 문을 열고, Then and there는 결심이 바로 그 자리에서 일어났음을 보여 줘요. Now, ten years later는 시간이 흐른 뒤의 결과로 독자를 데려갑니다. 또한 어린이 노동자, 무상 교육, 의료 프로그램 같은 표현이 아이들을 돕는 행동과 성과로 이어지며 내용을 재진술해 줍니다. 이 글은 강한 대조보다는 시간의 흐름과 결심의 결과를 따라 읽는 것이 중요해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>remember\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기억하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>learn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>배우다, 알게 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>on the other side of the world\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>지구 반대편에\u003c/span>\u003c/div>\u003cdiv>\u003cb>treat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대우하다, 다루다\u003c/span>\u003c/div>\u003cdiv>\u003cb>poorly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>열악하게, 형편없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>just\u003c/b>\u003cem>부사\u003c/em>\u003cspan>겨우, 단지\u003c/span>\u003c/div>\u003cdiv>\u003cb>child laborer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>어린이 노동자\u003c/span>\u003c/div>\u003cdiv>\u003cb>explain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>설명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reason\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이유\u003c/span>\u003c/div>\u003cdiv>\u003cb>force\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강요하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>difficult\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>힘든, 어려운\u003c/span>\u003c/div>\u003cdiv>\u003cb>dangerous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위험한\u003c/span>\u003c/div>\u003cdiv>\u003cb>then and there\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그때 그 자리에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결심하다, 결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fight for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 위해 싸우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>right\u003c/b>\u003cem>명사\u003c/em>\u003cspan>권리\u003c/span>\u003c/div>\u003cdiv>\u003cb>school friend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>학교 친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다, 설립하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>organization\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단체, 조직\u003c/span>\u003c/div>\u003cdiv>\u003cb>called\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불리는, ~라고 불리는\u003c/span>\u003c/div>\u003cdiv>\u003cb>begin by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 것으로 시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>raise money\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>모금하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>build\u003c/b>\u003cem>동사\u003c/em>\u003cspan>짓다, 세우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>free education\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무상 교육\u003c/span>\u003c/div>\u003cdiv>\u003cb>ten years later\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>십 년 후에\u003c/span>\u003c/div>\u003cdiv>\u003cb>more than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다 많은, 이상\u003c/span>\u003c/div>\u003cdiv>\u003cb>medical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의료의\u003c/span>\u003c/div>\u003cdiv>\u003cb>program\u003c/b>\u003cem>명사\u003c/em>\u003cspan>프로그램\u003c/span>\u003c/div>\u003cdiv>\u003cb>country\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나라, 국가\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚고 갈게요. treat는 대우하다, poorly는 열악하게라는 뜻이라서 treated poorly는 열악한 대우를 받는다는 의미가 됩니다. force는 강요하다, decide는 결심하다, raise money는 모금하다라는 뜻으로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">remember\u003c/b>\u003cspan class=\"m\">기억하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recall\u003c/span>\u003cspan class=\"s\">recollect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">force\u003c/b>\u003cspan class=\"m\">강요하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">compel\u003c/span>\u003cspan class=\"s\">oblige\u003c/span>\u003cspan class=\"s\">pressure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">allow\u003c/span>\u003cspan class=\"a\">permit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">decide\u003c/b>\u003cspan class=\"m\">결심하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">determine\u003c/span>\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hesitate\u003c/span>\u003cspan class=\"a\">waver\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">start\u003c/b>\u003cspan class=\"m\">시작하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">begin\u003c/span>\u003cspan class=\"s\">establish\u003c/span>\u003cspan class=\"s\">launch\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">end\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dangerous\u003c/b>\u003cspan class=\"m\">위험한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">risky\u003c/span>\u003cspan class=\"s\">hazardous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safe\u003c/span>\u003cspan class=\"a\">secure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">poorly\u003c/b>\u003cspan class=\"m\">열악하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">badly\u003c/span>\u003cspan class=\"s\">inadequately\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">well\u003c/span>\u003cspan class=\"a\">properly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">build\u003c/b>\u003cspan class=\"m\">짓다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">construct\u003c/span>\u003cspan class=\"s\">establish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">demolish\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. remember는 recall, recollect와 가깝고 반대말은 forget이며, force는 compel, oblige와 비슷하고 allow, permit과 반대됩니다. decide는 determine, resolve로 바꿔 말할 수 있고 hesitate, waver와는 반대예요. start는 begin, establish, launch와 가깝고 end, stop과 반대이며, dangerous는 risky, hazardous와 비슷하고 safe, secure와 반대됩니다. poorly는 badly, inadequately와 가깝고 well, properly와 반대이며, build는 construct, establish와 비슷하고 destroy, demolish와 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Craig Kielburger는 아직도 그날을 기억한다\u003c/span>\u003cspan class=\"en\">Craig Kielburger still remembers the day/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 배운\u003c/span>\u003cspan class=\"en\">when he learned\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구 반대편 아이들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">children \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">side \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 열악한 대우를 받고 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">treated \u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">poorly\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Craig Kielburger 는 지구 반대편 아이들이 매우 열악한 대우를 받고 있는 것을 배운 날을 아직도 기억한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 도입부로, the day 뒤에 \u003cb class=\"key\">관계부사\u003c/b> when이 와서 '그가 무엇을 알게 된 날'인지 이끌어 줍니다. learned 뒤의 that절이 '배운 내용'을 담고, 그 안에서 아이들이 \u003cb class=\"key\">수동태\u003c/b>로 표현되어 '대우를 받는' 대상임이 드러나죠. 이 충격적인 사실이 훗날 그가 행동에 나서는 \u003cb class=\"key\">계기\u003c/b>가 된다는 흐름을 잡아 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : learned [타동사] + [that + 주어 + 동사 ... (명사절/목적어)] : \"지구 반대편 아이들이 매우 열악한 대우를 받고 있다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : [주어 children] + were + [과거분사 treated] + so poorly : \"매우 열악한 대우를 받고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">관계부사 when\u003c/span> : [선행사 the day] + when + [주어 + 동사 (완전한 절)] : \"그가 배운 날\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Craig Kielburger still remembers the day, Craig Kielburger는 아직도 그날을 기억한다. when he learned, 그가 배운. that children on the other side of the world, 지구 반대편 아이들이. were treated so poorly, 매우 열악한 대우를 받고 있다는 것을. 이 문장 전체를 해석하면, Craig Kielburger 는 지구 반대편 아이들이 매우 열악한 대우를 받고 있는 것을 배운 날을 아직도 기억한다.","hl":"m"},{"n":13,"text":"이 문장은 글의 도입부예요. the day 뒤에 관계부사 when이 와서 그가 무엇을 알게 된 날인지 설명해 주고, learned 뒤에는 접속사 that이 이끄는 절이 와서 배운 내용을 담고 있어요. 아이들은 수동태로 표현되어 대우를 받는 대상임이 드러나고, 이 충격적인 사실이 훗날 그가 행동에 나서는 계기가 된다는 흐름을 꼭 잡아 두세요.","hl":"mn"},{"n":14,"text":"첫 번째로, the day when he learned를 볼게요. when은 앞의 선행사 the day를 받아 주는 관계부사이고, 뒤에는 he learned처럼 주어와 동사가 다 있는 완전한 절이 와요. 두 번째로, that children on the other side of the world were treated so poorly를 볼게요. learned의 목적어 자리에 놓인 명사절을 접속사 that이 이끌고 있고, 절 안에는 주어 children과 동사 were treated가 들어 있어요. 세 번째로, were treated so poorly를 볼게요. 아이들이 대우를 받는 대상이니까 be동사에 과거분사를 붙인 수동태로 썼고, so poorly가 그 정도를 보태 주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 겨우 12살이었어요\u003c/span>\u003cspan class=\"en\">&quot;I was just 12 years old\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선생님이 아시아의 어린이 노동자들에 대해 말씀하셨을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">teacher \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">talked \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">child \u003c/span>\u003cspan class=\"tgt\">laborers \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Asia\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라고 그는 설명했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">explained.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“선생님이 아시아의 어린이 노동자들에 대해 말씀하셨을 때 난 겨우 12 살이었어요.”라고 그는 설명했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞의 내용을 본인이 직접 말한 \u003cb class=\"key\">직접인용\u003c/b> 문장입니다. 겨우 열두 살이었던 나이와 그때 들은 이야기를 함께 제시해서, 그가 어린 나이에 이 문제를 접했다는 \u003cb class=\"key\">배경\u003c/b>을 만들어 줘요. 인용문 뒤에 he explained가 붙어 누가 한 말인지 분명히 밝히고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when이 이끄는 시간 부사절\u003c/span> : [when + 주어 + 동사 ...] + 주절 : \"선생님이 아시아의 어린이 노동자들에 대해 말씀하셨을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 talk + 전치사 about\u003c/span> : talk [자동사] + about + [명사구] : \"아시아의 어린이 노동자들에 대해 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">직접인용(인용문 + 전달문)\u003c/span> : &quot;인용문&quot; + [주어 + explained (전달문)] : \"라고 그는 설명했다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"\"I was just 12 years old, 나는 겨우 12살이었어요. when my teacher talked about child laborers in Asia,\", 선생님이 아시아의 어린이 노동자들에 대해 말씀하셨을 때. he explained, 라고 그는 설명했다. 이 문장 전체를 해석하면, “선생님이 아시아의 어린이 노동자들에 대해 말씀하셨을 때 난 겨우 12 살이었어요.”라고 그는 설명했다.","hl":"m"},{"n":16,"text":"이 문장은 앞의 내용을 본인이 직접 말한 직접인용 문장이에요. 겨우 열두 살이었던 나이와 그때 들은 이야기를 함께 보여 주면서, 그가 아주 어린 나이에 이 문제를 접했다는 배경을 만들어 줍니다. 인용문 뒤에 he explained가 붙어서 누가 한 말인지 분명히 밝히고 있다는 점도 기억해 두세요.","hl":"mn"},{"n":17,"text":"첫 번째로, when my teacher talked about child laborers in Asia를 볼게요. when이 '~할 때'라는 시간의 뜻을 더하는 접속사로 쓰였고, 절 안에 주어 my teacher와 동사 talked가 다 있어서 문장의 기본 요소를 갖추고 있어요. 두 번째로, talked about child laborers in Asia를 볼게요. talk는 자동사라서 목적어를 바로 못 데리고, 전치사 about을 통해 말하는 대상을 연결합니다. 세 번째로, he explained를 볼게요. 인용부호 안의 말을 그대로 옮긴 직접인용 구조라서 뒤에 전달문 he explained가 오고, 인용문이 과거이니 시제도 과거형 explained로 맞춘 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그 이유를 이해할 수가 없었습니다\u003c/span>\u003cspan class=\"en\">&quot;I couldn't understand the reason/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어린이들이 강요받고 있는\u003c/span>\u003cspan class=\"en\">why children \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">forced\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">힘들고 위험한 일을 하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">dangerous \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“나는 어린이들이 힘들고 어려운 일을 하도록 강요받고 있는 이유를 이해할 수가 없었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> the reason why는 '~하는 이유'라는 뜻으로, 화자가 도저히 이해할 수 없었던 \u003cb class=\"key\">관계부사 \u003c/b>\u003cb class=\"key\">why\u003c/b>의 구조를 보여 줍니다. 아이들이 스스로 일한 게 아니라 \u003cb class=\"key\">수동태\u003c/b>로 '강요받고 있었다'는 점이 이 상황의 \u003cb class=\"key\">부당함\u003c/b>을 또렷하게 드러내죠. 이 문장은 앞 문장의 충격을 이어 받아, 그가 왜 어린이 권리를 위해 싸우기로 했는지 분위기를 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 진행형(be동사 + being + 과거분사)\u003c/span> : [주어 children] + were + being + [과거분사 forced] : \"강요받고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사(be forced to do 관용 표현)\u003c/span> : be forced + [to do + 목적어] : \"힘들고 위험한 일을 하도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">관계부사 why\u003c/span> : [선행사 the reason] + why + [주어 + 동사 (완전한 절)] : \"어린이들이 강요받고 있는 이유\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"\"I couldn't understand the reason, 나는 그 이유를 이해할 수가 없었습니다. why children were being forced, 어린이들이 강요받고 있는. to do difficult and dangerous work, 힘들고 위험한 일을 하도록. 이 문장 전체를 해석하면, “나는 어린이들이 힘들고 어려운 일을 하도록 강요받고 있는 이유를 이해할 수가 없었습니다.","hl":"m"},{"n":19,"text":"the reason why는 '~하는 이유'라는 뜻으로, 화자가 도저히 이해할 수 없었던 관계부사 why의 구조를 보여 줘요. 아이들이 스스로 일한 게 아니라 수동태로 강요받고 있었다는 점이 이 상황의 부당함을 또렷하게 드러내죠. 그래서 이 문장은 앞 문장의 충격을 이어 받아, 그가 왜 어린이 권리를 위해 싸우기로 했는지 분위기를 만들어 줍니다.","hl":"mn"},{"n":20,"text":"첫 번째로, the reason why children were being forced를 볼게요. the reason 뒤에서 '~하는 이유'를 이끄는 관계부사 why이고, 뒤에는 주어 children과 동사 were being forced가 있는 완전한 절이 와요. 두 번째로, were being forced를 볼게요. 강요하는 주체가 아니라 강요받는 대상이니까 수동태를 썼고, 그 일이 계속되고 있었다는 진행의 의미를 살리려고 being을 넣었어요. 세 번째로, to do difficult and dangerous work를 볼게요. be forced to do는 '~하도록 강요받다'라는 관용 표현이고, 여기서 to부정사는 강요의 내용, 즉 무엇을 하도록 강요받았는지를 알려 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때 그 자리에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Then \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">there\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">난 결심했습니다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">decided \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어린이들의 권리를 위해 싸우기로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fight\u003c/span> for children's rights.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그때 그 자리에서 난 어린이들의 권리를 위해 싸우기로 결심했습니다.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Craig가 결심을 굳힌 장면이에요. \u003cb class=\"key\">Then \u003c/b>\u003cb class=\"key\">and \u003c/b>\u003cb class=\"key\">there\u003c/b>는 '그때 그 자리에서', 즉 망설임 없이 즉시라는 뜻이죠. 어려운 현실을 알게 된 직후 바로 \u003cb class=\"key\">행동\u003c/b>을 다짐했다는 흐름을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현(부사구)\u003c/span> : [Then and there] = at that time and place : \"그때 그 자리에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : decide + [to fight (to부정사구/목적어)] : \"싸우기로 결심했다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Then and there, 그때 그 자리에서. I decided, 난 결심했습니다. to fight for children's rights, 어린이들의 권리를 위해 싸우기로. 이 문장 전체를 해석하면, 그때 그 자리에서 난 어린이들의 권리를 위해 싸우기로 결심했습니다.”","hl":"m"},{"n":22,"text":"이 문장은 Craig가 결심을 굳힌 장면이에요. Then and there는 그때 그 자리에서, 즉 망설이지 않고 바로라는 뜻이죠. 힘든 현실을 알게 된 직후에 곧장 행동을 다짐했다는 흐름을 보여 줍니다.","hl":"mn"},{"n":23,"text":"첫 번째로 Then and there는 관용 표현이에요. 때와 장소를 함께 가리키면서 즉시성을 강조하는 부사구죠. 두 번째로 decided to fight에서 to fight는 decide의 목적어로 쓰인 to부정사 명사적 용법이에요. decide 뒤에는 이렇게 to부정사가 목적어로 온다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교 친구 몇 명과 함께,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">With \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">few \u003c/span>\u003cspan class=\"tgt\">school \u003c/span>\u003cspan class=\"tgt\">friends\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Craig 는 단체를 설립했다\u003c/span>\u003cspan class=\"en\">Craig started an organization\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Free the Children 이라는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">Free \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Children\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학교 친구 몇 명과 함께 Craig 는 Free the Children 이라는 단체를 설립했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Craig 혼자가 아니라 친구들과 \u003cb class=\"key\">함께\u003c/b> 단체를 만들었다는 점이 중요해요. called Free the Children은 단체의 \u003cb class=\"key\">이름\u003c/b>을 알려 주는 부분이죠. 작은 학교 모임이 훗날 국제적인 단체로 자라나는 출발점을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 with의 동반 표현\u003c/span> : With + [명사구], + 주어 + 동사 : \"학교 친구 몇 명과 함께\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(명사 수식)\u003c/span> : an organization + [called Free the Children (과거분사구/형용사 역할)] : \"Free the Children 이라는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"With a few school friends, 학교 친구 몇 명과 함께. Craig started an organization, Craig 는 단체를 설립했다. called Free the Children, Free the Children 이라는. 이 문장 전체를 해석하면, 학교 친구 몇 명과 함께 Craig 는 Free the Children 이라는 단체를 설립했다.","hl":"m"},{"n":25,"text":"Craig 혼자가 아니라 친구들과 함께 단체를 만들었다는 점이 중요해요. called Free the Children은 단체의 이름을 알려 주는 부분이죠. 작은 모임이 국제적인 단체로 자라나는 출발점을 보여 줍니다.","hl":"mn"},{"n":26,"text":"첫 번째로 With a few school friends는 전치사 with가 동반을 나타내는 표현이에요. '함께'라는 뜻으로 해석하죠. 두 번째로 called Free the Children은 organization을 뒤에서 꾸며 주는 과거분사구예요. 단체는 이름이 불리우는 대상이므로 수동의 의미를 담은 과거분사가 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 시작했다\u003c/span>\u003cspan class=\"en\">They began\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모금함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">raising \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교를 짓기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">build \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인도의 어린이 노동자들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">child \u003c/span>\u003cspan class=\"tgt\">laborers \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">India \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무상 교육을 받을 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">free \u003c/span>\u003cspan class=\"tgt\">education\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 인도의 어린이 노동자들이 무상 교육을 받을 수 있는 학교를 짓기 위한 모금부터 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Free the Children의 첫 활동을 구체적으로 보여 주는 문장이에요. 단순히 돈을 모은 게 아니라, 학교를 짓기 \u003cb class=\"key\">위해\u003c/b> 모금했다는 목적까지 담고 있죠. where절은 어떤 \u003cb class=\"key\">학교\u003c/b>인지 설명해 주는 부분입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : by + [raising money (동명사구/수단)] : \"모금함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : raising money + [to build a school (to부정사구/목적)] : \"학교를 짓기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계부사 where\u003c/span> : a school + [where ~ (관계부사절/형용사 역할)] : \"인도의 어린이 노동자들이 무상 교육을 받을 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"They began, 그들은 시작했다. by raising money, 모금함으로써. to build a school, 학교를 짓기 위해. where child laborers in India, 인도의 어린이 노동자들이. could get a free education, 무상 교육을 받을 수 있는. 이 문장 전체를 해석하면, 그들은 인도의 어린이 노동자들이 무상 교육을 받을 수 있는 학교를 짓기 위한 모금부터 시작했다.","hl":"m"},{"n":28,"text":"이 문장은 Free the Children의 첫 활동을 구체적으로 보여 줘요. 단순히 돈을 모은 게 아니라 학교를 짓기 위해 모금했다는 목적까지 담고 있죠. where절은 어떤 학교인지 설명해 주는 부분입니다.","hl":"mn"},{"n":29,"text":"첫 번째로 by raising money는 전치사 by 뒤에 동명사가 온 형태로 수단과 방법을 나타내요. 두 번째로 to build a school은 목적을 나타내는 to부정사의 부사적 용법이에요. 세 번째로 where는 선행사 a school을 받는 관계부사로, 뒤에 완전한 절이 이어지죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">10년이 지난 지금\u003c/span>\u003cspan class=\"en\">Now, ten years later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Free the Children은\u003c/span>\u003cspan class=\"en\">Free the Children\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">420개가 넘는 학교를 세웠고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">built\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">420 \u003c/span>\u003cspan class=\"tgt\">schools\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의료 프로그램의 비용을 지불하였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">paid\u003c/span> for medical programs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">20여 개 국에서\u003c/span>\u003cspan class=\"en\">in 20 countries.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">10 년이 지난 지금 Free the Children 은 20 여개 국에서 420 개가 넘는 학교를 세웠고 의료 프로그램의 비용을 지불하였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Craig가 어린 나이에 시작한 일이 \u003cb class=\"key\">10년\u003c/b> 뒤 얼마나 큰 성과로 이어졌는지 보여 줍니다. \u003cb class=\"key\">현재완료\u003c/b>를 써서 과거에 시작된 일이 지금까지 쌓여 온 결과임을 드러내고, 420개가 넘는 학교와 20여 개 국이라는 \u003cb class=\"key\">수치\u003c/b>로 신뢰성을 높이고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(have/has + 과거분사)\u003c/span> : 주어 + [have/has + p.p.] : 과거의 일이 현재까지 이어지거나 현재의 결과로 남음 : \"세워 왔다, 세웠다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 관용표현(more than + 수량)\u003c/span> : more than + 수량 : ~보다 많은, ~이상 : \"420개가 넘는 학교\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬구조(동사구의 병렬)\u003c/span> : has [built] + and [paid] : 조동사 has를 함께 쓰는 과거분사 병렬 : \"그리고 지불하였다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Now, ten years later, 10년이 지난 지금. Free the Children, Free the Children은. has built more than 420 schools, 420개가 넘는 학교를 세웠고. and paid for medical programs, 의료 프로그램의 비용을 지불하였다. in 20 countries, 20여 개 국에서. 이 문장 전체를 해석하면, 10 년이 지난 지금 Free the Children 은 20 여개 국에서 420 개가 넘는 학교를 세웠고 의료 프로그램의 비용을 지불하였다.","hl":"m"},{"n":31,"text":"이 문장은 Craig가 어린 나이에 시작한 일이 십 년 뒤에 얼마나 큰 성과로 이어졌는지 보여 주는 부분이에요. 현재완료를 써서 과거에 시작된 일이 지금까지 쌓여 온 결과임을 드러내고 있고, 사백 이십 개가 넘는 학교와 스무 개 국이라는 수치로 신뢰성을 높이고 있습니다.","hl":"mn"},{"n":32,"text":"첫 번째로 has built는 현재완료예요. 과거에 시작한 일이 지금까지 이어져 온 결과를 말할 때는 has에 과거분사를 붙여서 씁니다. 두 번째로 and paid는 병렬구조예요. 앞의 has built와 짝을 이루니까 paid 앞에 has를 또 쓰지 않죠. 세 번째로 more than 사백 이십 schools는 비교급 관용표현으로, 숫자 앞에 more than을 붙여 사백 이십 개가 넘는다는 수치를 나타냅니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Craig Kielburger는 열두 살 때 아시아의 \u003cb class=\"key\">어린이 \u003c/b>\u003cb class=\"key\">노동자\u003c/b>가 힘들고 위험한 일을 강요받는다는 이야기를 들었다.\u003c/li>\u003cli>그는 그 자리에서 아이들의 \u003cb class=\"key\">권리\u003c/b>를 위해 싸우기로 결심했다.\u003c/li>\u003cli>친구들과 함께 \u003cb class=\"key\">Free \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">Children\u003c/b>을 세우고 인도의 어린이 노동자들을 위한 \u003cb class=\"key\">무상 \u003c/b>\u003cb class=\"key\">교육\u003c/b> 학교를 짓기 위해 모금했다.\u003c/li>\u003cli>십 년 뒤 이 단체는 여러 나라에 학교를 세우고 \u003cb class=\"key\">의료 \u003c/b>\u003cb class=\"key\">프로그램\u003c/b>을 지원하는 성과를 냈다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Craig Kielburger founded Free the Children after learning about child laborers and has helped provide education and medical programs around the world.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Craig Kielburger는 아시아 어린이 노동자들의 \u003cb class=\"key\">열악한 \u003c/b>\u003cb class=\"key\">대우\u003c/b>를 듣고 \u003cb class=\"key\">어린이 \u003c/b>\u003cb class=\"key\">권리\u003c/b>를 위해 싸우기로 결심했으며, 친구들과 \u003cb class=\"key\">Free \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">Children\u003c/b>을 세워 인도 등 여러 나라에서 학교와 \u003cb class=\"key\">의료 \u003c/b>\u003cb class=\"key\">프로그램\u003c/b>을 지원해 왔다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글은 한 소년이 어린이 노동자 문제를 알고 권리를 위해 싸우기로 결심한 뒤, 친구들과 단체를 세워 교육과 의료 지원이라는 성과를 만든 이야기였어요. 시간순 흐름을 따라가며 결심이 행동과 결과로 이어지는 점을 꼭 기억해 주세요. 작은 관심과 행동도 사회 변화로 이어질 수 있다는 메시지를 마음에 새기면 좋겠습니다. 오늘도 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
