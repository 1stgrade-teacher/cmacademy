<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 17강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 17강 적용독해03","audioDir":"17-03_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">17강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Kindness Without the Expectation of Reward\u003c/h1>\u003ch2>보상 기대 없는 친절\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>필자는 누군가에게 뭘 해줄 때마다 보답을 기대하다가 많은 실망을 겪었고, 보답할 것 같지 않은 사람들에게도 조건 없이 친절을 베푸는 친구의 조언을 통해 깨달음을 얻는다. \u003cb class=\"key\">보상\u003c/b>을 바라는 조건부 친절은 \u003cb class=\"key\">실망\u003c/b>을 자초하므로, 우리는 \u003cb class=\"key\">조건 \u003c/b>\u003cb class=\"key\">없이\u003c/b> 친절해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Kindness expecting a reward only sets you up for disappointment, while unconditional kindness benefits the giver.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 보상과 친절에 관한 짧지만 아주 중요한 글을 함께 읽어 볼 거예요. 이 글은 누군가에게 뭘 해줄 때마다 보답을 기대하던 사람이, 조건 없이 친절을 베푸는 친구를 만나면서 생각이 바뀌는 이야기예요. 요약하면 보상을 바라는 친절은 실망을 부르고 조건 없는 친절은 나를 이롭게 한다는 거죠. 자, 그럼 차근차근 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">심리학에서는 어떤 행동의 대가를 계산하는 마음을 \u003cb class=\"key\">계산적\u003c/b> 동기라고 부릅니다. 반대로 아무 대가 없이 베푸는 행동은 \u003cb class=\"key\">이타심\u003c/b>, 영어로 altruism이라고 해요. 이때 중요한 것은 보답이 오지 않아도 만족할 수 있는지인데, 이를 \u003cb class=\"key\">내적 \u003c/b>\u003cb class=\"key\">보상\u003c/b> intrinsic reward라고 하죠. 친구에게 간식을 사 주면서 마음속으로 '다음엔 네가 사'라고 계산하면, 그 간식은 선물이 아니라 \u003cb class=\"key\">거래\u003c/b> transaction가 됩니다. 반면 순수하게 나눠 주면 상대의 반응과 상관없이 기분이 좋아지죠. 즉 무엇을 바라고 베푸느냐가 \u003cb class=\"key\">결과\u003c/b>를 바꾼다는 것이 이 글의 출발점입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식 하나 짚고 갈게요. 심리학에서는 행동의 대가를 계산하는 마음을 계산적 동기라고 부릅니다. 반대로 아무 대가 없이 베푸는 행동은 이타심, 영어로 altruism이라고 해요. 그리고 보답이 오지 않아도 스스로 만족하는 걸 내적 보상, intrinsic reward라고 하죠. 친구한테 간식을 사 주면서 마음속으로 다음엔 네가 사라고 계산하면 그건 선물이 아니라 거래가 돼요. 그런데 순수하게 나눠 주면 상대가 어떻게 하든 기분이 좋아지죠. 무엇을 바라고 베푸느냐가 결과를 바꾼다는 게 이 글의 출발점이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>보상 기대와 실망\u003csmall>도입·통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>필자는 누군가에게 뭘 해줄 때마다 '이 사람도 \u003cb class=\"key\">보답\u003c/b>으로 나한테 뭘 해주겠지'라는 생각을 늘 했다. 그래서 이러한 보상의 기대에 깊이 사로잡혀 있었고, 그것이 그에게 많은 \u003cb class=\"key\">실망\u003c/b>을 주었다. 베푼 만큼 돌아와야 한다는 마음이 \u003cb class=\"key\">기대\u003c/b>를 키우고, 그 기대가 어긋날 때 상처가 커지기 때문이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>친구의 반례\u003csmall>예시·반례 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>내 친구 한 명은 \u003cb class=\"key\">보답\u003c/b>할 것 같지 않은 사람들에게 일관되게 친절한 행동을 했다. 친구는 다른 사람을 위해 뭔가를 하면서 돌려받기를 바라면, 자신이 \u003cb class=\"key\">원하는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 얻게 될지 전혀 확신할 수 없다고 말했다. 대신 \u003cb class=\"key\">조건 \u003c/b>\u003cb class=\"key\">없이\u003c/b> 기쁜 마음으로 친절한 행동을 할 때 자기가 하는 것에서 이익을 얻는다고 조언했다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>친구가 옳았다\u003csmall>전환 · 문장 6\u003c/small>\u003c/h4>\u003cp>필자는 친구의 말에 동의하며 '내 친구가 옳았다'라고 짧게 정리한다. 여기서 글의 방향이 \u003cb class=\"key\">전환\u003c/b>된다. 앞에서 본 조건부 친절의 실망과 친구의 조건 없는 태도가 \u003cb class=\"key\">대조\u003c/b>를 이루기 때문이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>조건 없는 친절\u003csmall>결론·주장 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>어떤 사람이 자신에게 잘 해줄 것을 기대해서 친절하게 하면, 그것은 스스로에게 \u003cb class=\"key\">실망\u003c/b>을 준비시키는 셈이다. 그래서 글은 마지막에 \u003cb class=\"key\">조건 \u003c/b>\u003cb class=\"key\">없이\u003c/b> 잘해 주라고 단호하게 주장한다. 이유를 \u003cb class=\"key\">인과\u003c/b>로 제시한 뒤 결론을 닫는 마무리다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 필자의 경험으로 시작해요. 필자는 누군가에게 뭘 해줄 때마다 이 사람도 보답으로 나한테 뭘 해주겠지 하는 생각을 늘 했어요. 그런데 그런 보상의 기대가 오히려 그에게 많은 실망을 안겼죠. 기대가 크면 어긋날 때 상처도 커지는 법이니까요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 친구가 등장해요. 친구는 보답할 것 같지 않은 사람들에게도 일관되게 친절한 행동을 했어요. 그러면서 다른 사람을 위해 뭔가를 하면서 돌려받기를 바라면 자신이 원하는 걸 얻게 될지 전혀 확신할 수 없다고 말했죠. 대신 조건 없이 기쁜 마음으로 친절한 행동을 할 때 자기가 하는 것에서 이익을 얻는다고 조언했어요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 아주 짧아요. 필자가 내 친구가 옳았다고 인정하는 대목이에요. 여기서 글의 방향이 완전히 전환되죠. 조건부 친절이 낳은 실망과 조건 없는 친절이 낳은 만족이 선명하게 대조를 이루기 때문이에요.","hl":"f2"},{"n":7,"text":"마지막 단계는 주장이에요. 잘해줄 걸 기대하면서 친절하게 하면 스스로에게 실망을 준비시키는 셈이라고 정리하죠. 그래서 글은 조건 없이 잘해 주라고 단호하게 말해요. 이유를 먼저 제시하고 결론을 뒤에 놓는 인과의 방식이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 처음에 보답을 기대하며 베푸는 태도를 필자의 경험으로 보여 주며 \u003cb class=\"key\">통념\u003c/b>을 세운다. 이어서 보답을 바라지 않는 친구의 사례를 \u003cb class=\"key\">반례\u003c/b>로 내세워 그 통념을 흔든다. 마지막 문장에서 'Therefore'로 \u003cb class=\"key\">주장\u003c/b>을 제시하기 때문에 결론이 끝에 오는 \u003cb class=\"key\">미괄식\u003c/b> 구조다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Whenever (1)\u003c/b>\u003cspan>반복되는 경험 도입\u003c/span>\u003cb>because (7)\u003c/b>\u003cspan>이유 제시\u003c/span>\u003cb>Therefore (8)\u003c/b>\u003cspan>결론·주장 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">do something for someone in return\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">expectation of reward\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">hope that they will do something in return\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">do favors for you\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>보상을 기대하는 친절\u003c/th>\u003cth>조건 없는 친절\u003c/th>\u003c/tr>\u003ctr>\u003ctd>보답을 바라며 조건을 붙임\u003c/td>\u003ctd>대가 없이 기쁜 마음으로 베풂\u003c/td>\u003c/tr>\u003ctr>\u003ctd>원하는 것을 얻을지 확신 없음\u003c/td>\u003ctd>하는 일에서 스스로 이익을 얻음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>실망을 자초함\u003c/td>\u003ctd>만족과 이익이 남음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 통념을 먼저 보여 주고 그것을 반박하는 방식으로 전개돼요. 보답을 기대하며 베푸는 필자의 과거 모습이 통념이고, 보답을 바라지 않는 친구의 태도가 그 통념을 흔드는 반례예요. 결정적인 주장은 맨 마지막 문장에서 나오기 때문에 미괄식 구조라고 정리할 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 잘 보세요. 첫 번째 문장의 Whenever은 반복되는 경험을 끌어오는 역할을 해요. 일곱 번째 문장의 because는 왜 실망하게 되는지 이유를 붙여 주고, 여덟 번째 문장의 Therefore가 결론을 딱 닫아 주죠. 또 보상에 대한 기대라는 개념이 expectation of reward와 do favors for you처럼 계속 바꿔 표현되는 것도 눈여겨보세요. 글 전체를 떠받치는 건 대조 구도예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>whenever\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~할 때마다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in return\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>보답으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>deeply\u003c/b>\u003cem>부사\u003c/em>\u003cspan>깊이, 몹시\u003c/span>\u003c/div>\u003cdiv>\u003cb>be obsessed with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 사로잡혀 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>expectation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기대\u003c/span>\u003c/div>\u003cdiv>\u003cb>reward\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보상\u003c/span>\u003c/div>\u003cdiv>\u003cb>cause\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일으키다, 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>disappointment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실망\u003c/span>\u003c/div>\u003cdiv>\u003cb>consistently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>일관되게, 꾸준히\u003c/span>\u003c/div>\u003cdiv>\u003cb>act\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동, 행위\u003c/span>\u003c/div>\u003cdiv>\u003cb>kindness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>친절\u003c/span>\u003c/div>\u003cdiv>\u003cb>be likely to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 것 같다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reciprocate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보답하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hope\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기대, 희망\u003c/span>\u003c/div>\u003cdiv>\u003cb>certain\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>확신하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>joyfully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>기쁜 마음으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>unconditionally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>조건 없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>benefit from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 이익을 얻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>favor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>호의, 친절\u003c/span>\u003c/div>\u003cdiv>\u003cb>set oneself up for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 자초하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>therefore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러므로\u003c/span>\u003c/div>\u003cdiv>\u003cb>do something for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 위해 뭔가 해주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>another person\u003c/b>\u003cem>명사구\u003c/em>\u003cspan>다른 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>get what they want\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>원하는 것을 얻다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어는 나온 순서대로 챙겨요. be obsessed with는 무엇에 사로잡히다, reciprocate는 보답하다, unconditionally는 조건 없이라는 뜻이에요. set oneself up for는 스스로 자초하다, benefit from은 이익을 얻다로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">obsessed\u003c/b>\u003cspan class=\"m\">사로잡힌\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">preoccupied\u003c/span>\u003cspan class=\"s\">fixated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indifferent\u003c/span>\u003cspan class=\"a\">detached\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expectation\u003c/b>\u003cspan class=\"m\">기대\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">anticipation\u003c/span>\u003cspan class=\"s\">hope\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">resignation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">consistently\u003c/b>\u003cspan class=\"m\">일관되게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">steadily\u003c/span>\u003cspan class=\"s\">constantly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inconsistently\u003c/span>\u003cspan class=\"a\">sporadically\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reciprocate\u003c/b>\u003cspan class=\"m\">보답하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">return\u003c/span>\u003cspan class=\"s\">repay\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unconditionally\u003c/b>\u003cspan class=\"m\">조건 없이\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unreservedly\u003c/span>\u003cspan class=\"s\">freely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conditionally\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disappointment\u003c/b>\u003cspan class=\"m\">실망\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">letdown\u003c/span>\u003cspan class=\"s\">frustration\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">satisfaction\u003c/span>\u003cspan class=\"a\">delight\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">benefit\u003c/b>\u003cspan class=\"m\">이익을 얻다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gain\u003c/span>\u003cspan class=\"s\">profit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">suffer\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">certain\u003c/b>\u003cspan class=\"m\">확신하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sure\u003c/span>\u003cspan class=\"s\">confident\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uncertain\u003c/span>\u003cspan class=\"a\">doubtful\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. obsessed는 preoccupied, fixated와 가깝고 indifferent와는 반대예요. consistently는 steadily, constantly와 통하고 inconsistently와는 반대죠. reciprocate는 return, repay와 같고 ignore와는 반대예요. unconditionally는 conditionally와 정확히 반대되고, disappointment는 letdown, frustration과 가까워요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 누군가에게 뭘 해줄 때마다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Whenever \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">someone\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 늘 생각했다,\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">thinking\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“이 사람이 ~하기를 바란다\u003c/span>\u003cspan class=\"en\">&quot;I hope this person\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나에게 뭔가를 해줄\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보답으로.”\u003c/span>\u003cspan class=\"en\">in return.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 누군가에게 뭘 해줄 때마다, 나는 “이 사람도 보답으로 나한테 뭘 해주겠지.”라는 생각을 늘 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글쓴이가 과거에 \u003cb class=\"key\">조건부 \u003c/b>\u003cb class=\"key\">친절\u003c/b> 곧 보답을 전제로 한 행동을 했음을 보여주는 도입 문장이에요. in return, 즉 \u003cb class=\"key\">보답\u003c/b>에 대한 기대가 이 문장의 화두로 제시되면서 뒤에 이어질 실망의 원인을 미리 깔아 줍니다. 결국 이 문장은 글 전체에서 바뀌어야 할 글쓴이의 \u003cb class=\"key\">옛 \u003c/b>\u003cb class=\"key\">습관\u003c/b>을 드러내는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복합관계부사 whenever의 시간 부사절\u003c/span> : Whenever + [주어] + [동사] ~ , + [주절] : \"나는 누군가에게 뭘 해줄 때마다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거진행형 + always(습관적 반복)\u003c/span> : was/were + [동사-ing] : \"늘 생각하고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">hope절 안의 미래 표현(will)\u003c/span> : hope + [that] + [주어] + will + [동사원형] : \"나에게 뭔가를 해줄 것이다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Whenever I did something for someone, 나는 누군가에게 뭘 해줄 때마다. I was always thinking, 나는 늘 생각했다. \"I hope this person, “이 사람이 ~하기를 바란다. will do something for me, 나에게 뭔가를 해줄. in return.\", 보답으로.”. 이 문장 전체를 해석하면, 나는 누군가에게 뭘 해줄 때마다, 나는 “이 사람도 보답으로 나한테 뭘 해주겠지.”라는 생각을 늘 했다.","hl":"m"},{"n":13,"text":"이 문장은 글쓴이가 예전에 어떤 마음으로 남을 도왔는지 고백하는 부분이에요. 보답을 전제로 한 조건부 친절이었다는 거죠. 여기서 나온 in return이라는 보답의 기대가 앞으로 글 전체를 끌고 가는 화두가 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 whenever예요. 이 단어는 ~할 때마다라는 뜻으로 시간 부사절을 끌고 오는 복합관계부사죠. 반복된 과거 습관이라 과거시제 did를 쓴 것도 같이 기억해 두세요. 두 번째는 was always thinking인데, 과거진행에 always가 붙으면 진행이 아니라 습관적 반복을 강조하는 표현이 돼요. 세 번째는 hope 뒤에 온 will do인데, 아직 일어나지 않은 일이라 명사절 안에서 will로 미래를 표현한 거예요. 이때 that은 생략된 접속사라는 점도 챙겨 두시고요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 너무 깊이 사로잡혀 있었다\u003c/span>\u003cspan class=\"en\">I was \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">deeply \u003c/span>\u003cspan class=\"tgt\">obsessed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 보상의 기대에\u003c/span>\u003cspan class=\"en\">with this expectation of reward/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그것은 나에게 ~을 일으켰다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">it\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">caused \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 실망감을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">disappointment\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 이러한 보상의 기대에 깊이 사로잡혀서 그것이 나에게 많은 실망감을 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 보상에 대한 \u003cb class=\"key\">기대\u003c/b>가 얼마나 깊었는지, 그리고 그 기대가 결국 \u003cb class=\"key\">실망\u003c/b>으로 돌아왔다는 인과 관계를 so ~ that 구문으로 압축한 문장이에요. 앞 문장의 in return이 this expectation of reward로 다시 표현되면서 글의 \u003cb class=\"key\">인과\u003c/b> 흐름이 자연스럽게 이어집니다. 즉 이 문장은 보답을 바라는 마음의 폐해를 보여 주는 근거가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">so ~ that 결과 구문\u003c/span> : so + [부사] + [형용사] + that + [주어] + [동사] : \"너무 깊이 사로잡혀서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">결과의 접속사 that + 대명사 it\u003c/span> : so + [형용사] + that + [주어(it)] + [동사] : \"그래서 그것이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">4형식 수여동사(cause)\u003c/span> : cause + [간접목적어] + [직접목적어] : \"나에게 많은 실망감을 일으켰다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"I was so deeply obsessed, 나는 너무 깊이 사로잡혀 있었다. with this expectation of reward, 이러한 보상의 기대에. that it caused me, 그래서 그것은 나에게 ~을 일으켰다. a lot of disappointment, 많은 실망감을. 이 문장 전체를 해석하면, 나는 이러한 보상의 기대에 깊이 사로잡혀서 그것이 나에게 많은 실망감을 주었다.","hl":"m"},{"n":16,"text":"이 문장은 보상에 대한 기대가 얼마나 깊었는지, 그리고 그 기대가 결국 실망으로 돌아왔다는 인과 관계를 한 번에 보여 줘요. 앞 문장에서 나온 in return이 여기서는 보상의 기대로 다시 표현되죠. 결국 보답을 바라는 마음이 스스로를 아프게 한다는 근거를 깔아 주는 문장입니다.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 so deeply obsessed, 즉 so와 that 사이에 부사와 형용사가 들어간 so ~ that 결과 구문이에요. 너무 ~해서 …하다라는 인과를 한 문장에 담는 구조죠. 두 번째는 that it인데, that은 결과를 이끄는 접속사이고 it은 보상의 기대를 가리키는 대명사예요. 세 번째는 caused me a lot of disappointment로, cause가 ~에게 …을 일으키다라는 4형식 동사라서 간접목적어 me가 먼저 온다는 점을 꼭 챙기세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 친구 한 명은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">friend \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">mine\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일관되게 친절한 행동을 했다\u003c/span>\u003cspan class=\"en\">consistently did \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">acts \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">kindness\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들을 위해\u003c/span>\u003cspan class=\"en\">for other people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보답할 것 같지 않은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">weren't \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">reciprocate\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 친구 한 명은 보답할 것 같지 않은 사람들에게 일관되게 친절하게 행동했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글쓴이의 과거 태도와 정반대되는 \u003cb class=\"key\">대조\u003c/b> 인물로 친구를 소개하는 문장이에요. 보답을 계산하지 않는 친절, 곧 \u003cb class=\"key\">무조건적\u003c/b> 친절을 보여 주면서 뒤에 이어질 친구의 말에 힘을 실어 줍니다. 이 문장은 글 전체에서 글쓴이의 생각이 바뀌는 \u003cb class=\"key\">계기\u003c/b>가 되는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이중소유격(of + 소유대명사)\u003c/span> : a + [명사] + of + [소유대명사 mine] : \"내 친구 한 명\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">of + 추상명사의 형용사적 용법\u003c/span> : [명사 acts] + of + [추상명사 kindness] : \"친절한 행동\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who + be likely to\u003c/span> : [선행사 other people] + who + [동사] / be likely to + [동사원형] : \"보답할 것 같지 않은\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"A friend of mine, 내 친구 한 명은. consistently did acts of kindness, 일관되게 친절한 행동을 했다. for other people, 다른 사람들을 위해. who weren't likely to reciprocate, 보답할 것 같지 않은. 이 문장 전체를 해석하면, 내 친구 한 명은 보답할 것 같지 않은 사람들에게 일관되게 친절하게 행동했다.","hl":"m"},{"n":19,"text":"이 문장은 글쓴이의 과거와 정반대되는 친구를 대조로 소개하는 부분이에요. 보답을 계산하지 않는 무조건적 친절을 보여 주죠. 그래서 뒤에 나오는 친구의 말이 훨씬 설득력 있게 들리도록 발판을 깔아 주는 문장입니다.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 A friend of mine이에요. of mine은 내 친구들 중의 한 명이라는 뜻을 만드는 이중소유격이죠. 두 번째는 acts of kindness인데, of kindness가 앞의 acts를 뒤에서 꾸며 주는 형용사적 용법이에요. 세 번째는 who weren't likely to reciprocate로, who는 other people을 받는 주격 관계대명사이고 be likely to는 ~할 것 같다는 가능성 표현이에요. 선행사가 사람이라 who를 쓴 점까지 함께 정리해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 내게 말했다\u003c/span>\u003cspan class=\"en\">He told me,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“사람들이 다른 사람을 위해 무엇을 해주면\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"tgt\">person\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기대를 가지고\u003c/span>\u003cspan class=\"en\">with the hope/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 보답으로 뭔가를 해주리라는\u003c/span>\u003cspan class=\"en\">that they will do something in return,/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 전혀 확신을 못해\u003c/span>\u003cspan class=\"en\">they are never certain/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 얻게 될지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">get\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원하는 걸\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">want\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 내게 “그들이 보답으로 뭔가를 해주리라는 기대를 가지고 다른 사람을 위해 무엇을 해주면, 자신이 원하는 걸 얻게 될지 그렇지 않을지 전혀 확신을 못해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구는 \u003cb class=\"key\">보답을 \u003c/b>\u003cb class=\"key\">기대\u003c/b>하면서 남을 돕는 사람은 자신이 원하는 것을 실제로 얻을지 \u003cb class=\"key\">확신할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없다\u003c/b>고 말합니다. 여기서 if는 조건의 ‘만약’이 아니라 ‘~인지 아닌지’라는 \u003cb class=\"key\">간접의문문\u003c/b>의 의미로 쓰였습니다. 이 문장은 뒤 문장의 ‘기대가 실망을 부른다’는 결론을 뒷받침하는 \u003cb class=\"key\">근거\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : When + 주어 + 동사 + 목적어, 주절 : \"사람들이 다른 사람을 위해 무엇인가를 할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 if (~인지 아닌지)\u003c/span> : be certain + [if + 주어 + 조동사 + 동사] : \"그들이 얻을지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 what (선행사 포함)\u003c/span> : get + [what + 주어 + 동사] : \"그들이 원하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동격의 that\u003c/span> : the hope + [that + 완전한 절] : \"그들이 보답으로 뭔가를 해주리라는 기대\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"He told me, 그는 내게 말했다. \"When people do something for another person, “사람들이 다른 사람을 위해 무엇을 해주면. with the hope, 기대를 가지고. that they will do something in return, 그들이 보답으로 뭔가를 해주리라는. they are never certain, 그들은 전혀 확신을 못해. if they will get, 자신이 얻게 될지. what they want, 원하는 걸. 이 문장 전체를 해석하면, 그는 내게 “그들이 보답으로 뭔가를 해주리라는 기대를 가지고 다른 사람을 위해 무엇을 해주면, 자신이 원하는 걸 얻게 될지 그렇지 않을지 전혀 확신을 못해.","hl":"m"},{"n":22,"text":"이 문장은 친구가 보답을 기대하면서 남을 돕는 사람은 자신이 원하는 것을 실제로 얻을지 확신할 수 없다고 말하는 부분이에요. 여기서 if는 조건의 뜻이 아니라 무엇인지 아닌지를 나타내는 간접의문문이므로 해석에 주의해야 해요. 이 말은 뒤에 나오는 기대가 실망을 부른다는 결론을 뒷받침하는 근거가 됩니다.","hl":"mn"},{"n":23,"text":"첫 번째로 When people do something for another person에서 when은 할 때를 나타내는 시간 부사절을 이끌어요. 두 번째로 the hope that they will do something in return에서 that절은 앞에 있는 hope의 구체적인 내용을 설명하는 동격의 that이에요. 세 번째로 if they will get에서 if는 조건이 아니라 무엇인지 아닌지를 뜻하는 간접의문문으로 쓰였어요. 마지막으로 what they want에서 what은 선행사를 포함하는 관계대명사로 그들이 원하는 것이라는 명사절을 이끌고 get의 목적어 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조건 없이 기쁜 마음으로 친절한 행동을 할 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">joyfully \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">act \u003c/span>\u003cspan class=\"tgt\">unconditionally\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 이익을 얻지\u003c/span>\u003cspan class=\"en\">I benefit\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 하는 것에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">조건 없이 기쁜 마음으로 친절한 행동을 할 때, 내가 하는 것에서 이익을 얻지.”라고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구는 \u003cb class=\"key\">조건 \u003c/b>\u003cb class=\"key\">없이\u003c/b> 기쁜 마음으로 친절한 행동을 하면 그 행동 자체에서 \u003cb class=\"key\">이익을 \u003c/b>\u003cb class=\"key\">얻는다\u003c/b>고 말합니다. 이는 보답을 바라는 조건부 친절과 대비되는 \u003cb class=\"key\">무조건적 \u003c/b>\u003cb class=\"key\">친절\u003c/b>의 긍정적 결과를 보여 줍니다. 여기서 benefit from은 돈이나 보상만이 아니라 마음의 만족 같은 내적 유익까지 포함합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : When + 주어 + 부사 + 동사 + 목적어, 주절 : \"내가 조건 없이 기쁜 마음으로 친절한 행동을 할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 관계대명사 what\u003c/span> : benefit from + [what + 주어 + 동사] : \"내가 하는 것에서\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"When I joyfully do a kind act unconditionally, 조건 없이 기쁜 마음으로 친절한 행동을 할 때. I benefit, 나는 이익을 얻지. from what I do, 내가 하는 것에서. 이 문장 전체를 해석하면, 조건 없이 기쁜 마음으로 친절한 행동을 할 때, 내가 하는 것에서 이익을 얻지.”라고 말했다.","hl":"m"},{"n":25,"text":"이 문장은 조건 없이 기쁜 마음으로 친절한 행동을 하면 그 행동 자체에서 이익을 얻는다는 뜻이에요. 보답을 바라는 조건부 친절과 대비되는 무조건적 친절의 긍정적 결과를 보여 주죠. benefit from은 돈이나 보상만이 아니라 마음의 만족 같은 내적 유익까지 포함해요.","hl":"mn"},{"n":26,"text":"첫 번째로 When I joyfully do a kind act unconditionally에서 when은 할 때를 이끄는 시간 부사절 접속사예요. 두 번째로 from what I do에서 what은 선행사를 포함하는 관계대명사로 내가 하는 것이라는 명사절을 만들고, 전치사 from의 목적어 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 친구가\u003c/span>\u003cspan class=\"en\">My friend\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옳았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">right\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 친구가 옳았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화자는 친구의 말이 \u003cb class=\"key\">옳았다\u003c/b>고 인정하며, 앞에서 들은 친구의 조언을 받아들입니다. 이 문장은 친구의 주장에 대한 \u003cb class=\"key\">동의\u003c/b>를 나타내면서, 뒤에 이어질 조건 없이 친절하라는 결론으로 자연스럽게 연결해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : My friend [주어] + was [be동사] + right [주격보어] : \"내 친구는 옳았다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"My friend, 내 친구가. was right, 옳았다. 이 문장 전체를 해석하면, 내 친구가 옳았다.","hl":"m"},{"n":28,"text":"이 문장은 화자가 친구의 말이 옳았다고 인정하는 부분이에요. 친구의 주장에 대한 동의를 나타내면서 뒤에 이어질 조건 없이 친절하라는 결론으로 자연스럽게 연결해 줍니다.","hl":"mn"},{"n":29,"text":"was right에서 was는 be동사이고 right는 주어 My friend의 상태를 설명하는 주격보어예요. 그래서 My friend was right는 내 친구는 옳았다라는 뜻의 2형식 문장이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 어떤 사람에게 친절하게 한다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">someone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 당신은 기대하기 때문이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">expect \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사람이 당신에게 호의를 베풀 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">person \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">favors \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 스스로를 준비시키는 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">setting \u003c/span>\u003cspan class=\"tgt\">yourself \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실망을 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">disappointment\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 사람이 자신에게 잘 해줄 것을 기대해서 그 사람에게 친절하게 한다면, 너 스스로에게 실망을 준비시키는 (실망을 자초하는) 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상대의 보답을 기대하며 친절하면 그 기대가 어긋날 때 실망하게 되므로, 조건적 친절은 \u003cb class=\"key\">실망을 \u003c/b>\u003cb class=\"key\">자초\u003c/b>한다는 뜻입니다. 앞에서 말한 보상에 대한 기대가 왜 실망을 낳는지 설명하며, 뒤의 무조건적 친절 권고로 이어지는 \u003cb class=\"key\">근거\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 부사절\u003c/span> : When + 주어 + 동사, 주절 : \"당신이 어떤 사람에게 친절하게 한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유의 접속사 because와 expect의 목적어절\u003c/span> : because + 주어 + expect + (that) + 주어 + 동사 : \"왜냐하면 당신은 그 사람이 당신에게 호의를 베풀 것이라고 기대하기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재진행형과 재귀대명사, 관용 표현\u003c/span> : 주어 + be + 동사-ing + oneself + up for + 명사 : \"당신은 실망을 자초하는 것이다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"When you are kind to someone, 당신이 어떤 사람에게 친절하게 한다면. because you expect, 왜냐하면 당신은 기대하기 때문이에요. the person will do favors for you, 그 사람이 당신에게 호의를 베풀 것이라고. you are setting yourself up, 당신은 스스로를 준비시키는 것이다. for disappointment, 실망을 위해. 이 문장 전체를 해석하면, 어떤 사람이 자신에게 잘 해줄 것을 기대해서 그 사람에게 친절하게 한다면, 너 스스로에게 실망을 준비시키는 (실망을 자초하는) 것이다.","hl":"m"},{"n":31,"text":"이 문장은 상대의 보답을 기대하며 친절하는 태도가 왜 위험한지 말해요. 기대가 어긋나면 결국 실망하게 되니까 조건적 친절은 실망을 자초하는 일이라는 거죠. 그래서 이 문장은 뒤에 나오는 무조건적 친절의 권고를 뒷받침하는 근거 역할을 합니다.","hl":"mn"},{"n":32,"text":"첫째, When you are kind to someone에서 when은 시간이나 조건을 나타내는 부사절을 이끌어요. 둘째, because you expect the person will do favors for you에서 expect 뒤에는 접속사 that이 생략된 명사절이 목적어로 와서 그 사람이 호의를 베풀 것이라는 기대를 표현합니다. 셋째, you are setting yourself up for disappointment에서 set oneself up for는 실망을 자초하다라는 관용 표현이고, yourself는 주어 you를 다시 가리키는 재귀대명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Therefore,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 친절해야 한다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">kind\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조건 없이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">unconditionally\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 (남에게) 조건 없이 잘해주어라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 보답을 기대하는 친절이 실망을 자초한다고 했으므로, 결론적으로 \u003cb class=\"key\">조건 \u003c/b>\u003cb class=\"key\">없이\u003c/b> 친절하라고 권고합니다. 글 전체의 \u003cb class=\"key\">주제문\u003c/b> 역할을 하며, 독자에게 실천 방향을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">결론을 이끄는 접속부사 Therefore\u003c/span> : Therefore, + 주어 + 조동사 + 동사 : \"그러므로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">충고의 조동사 should\u003c/span> : 주어 + should + 동사원형 : \"친절해야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사구를 수식하는 부사\u003c/span> : be + 형용사 + 부사 : \"조건 없이\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Therefore, 그러므로. you should be kind, 당신은 친절해야 한다. unconditionally, 조건 없이. 이 문장 전체를 해석하면, 그러므로 (남에게) 조건 없이 잘해주어라.","hl":"m"},{"n":34,"text":"이 문장은 앞에서 보답을 기대하는 친절이 실망을 자초한다고 했으니 결론적으로 조건 없이 친절하라고 권고해요. 글 전체의 주제문 역할을 하면서 독자에게 실천 방향을 제시합니다.","hl":"mn"},{"n":35,"text":"첫째, Therefore는 앞 문장의 내용을 받아 결론을 이끄는 접속부사로, 문장 맨 앞에서 쉼표와 함께 쓰여요. 둘째, should be kind에서 should는 충고나 권고를 나타내는 조동사이고 뒤에는 동사원형 be가 왔어요. 셋째, unconditionally는 조건 없이라는 뜻의 부사로 be kind라는 태도를 수식합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>필자는 누군가에게 뭘 해줄 때마다 \u003cb class=\"key\">보답\u003c/b>을 기대했고, 그 기대가 많은 실망을 낳았다.\u003c/li>\u003cli>친구는 보답할 것 같지 않은 사람들에게도 일관되게 \u003cb class=\"key\">친절\u003c/b>을 베풀었다.\u003c/li>\u003cli>친구는 보상을 바라며 베풀면 원하는 것을 얻을지 \u003cb class=\"key\">확신\u003c/b>할 수 없다고 말했다.\u003c/li>\u003cli>따라서 보상 기대는 \u003cb class=\"key\">실망\u003c/b>을 자초하므로 조건 없이 친절해야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Kindness expecting a reward only sets you up for disappointment, while unconditional kindness benefits the giver.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">필자는 누군가에게 뭘 해줄 때마다 보답을 기대하다가 많은 실망을 겪었고, 보답할 것 같지 않은 사람들에게도 조건 없이 친절을 베푸는 친구의 조언을 통해 깨달음을 얻는다. \u003cb class=\"key\">보상\u003c/b>을 바라는 조건부 친절은 \u003cb class=\"key\">실망\u003c/b>을 자초하므로, 우리는 \u003cb class=\"key\">조건 \u003c/b>\u003cb class=\"key\">없이\u003c/b> 친절해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"정리해 볼게요. 보답을 기대하는 친절은 실망을 자초하고 조건 없는 친절은 나를 이롭게 해요. 오늘 배운 미괄식 구조와 Therefore 신호어를 꼭 기억해 두세요. 여러분의 친절에 조건을 붙이지 않는 하루가 되길 바라요. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
