<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 12강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 12강 적용독해02","audioDir":"12-02_audio","preview":false,"count":27,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">12강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Is Technology Making Young People Forgetful?\u003c/h1>\u003ch2>기술이 젊은이들을 건망증으로 만드는가?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요즘 컴퓨터 기술에 점점 더 의존하는 젊은이들이 \u003cb class=\"key\">기억력 \u003c/b>\u003cb class=\"key\">감퇴\u003c/b>를 겪고 있다는 현상이 제시된다. 전문가들은 컴퓨터, 전자수첩, 내비게이션 같은 장치에 의존해 \u003cb class=\"key\">뇌를 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">이상 \u003c/b>\u003cb class=\"key\">사용하지 \u003c/b>\u003cb class=\"key\">않는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 사람들이 무엇을 기억하는 것을 점점 더 어렵게 만든다고 주장한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Relying on computers and other devices leads to the disuse of the brain, which makes it harder and harder for young people to remember things.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 컴퓨터 기술과 기억력에 관한 글이에요. 요즘 젊은이들이 컴퓨터에 점점 더 의존하면서 기억력 감퇴를 겪고 있다는 내용이죠. 요약하면 기기 의존이 뇌의 미사용으로 이어지고, 결국 무엇을 기억하기가 점점 더 어려워진다는 이야기예요. 오늘의 요지는 컴퓨터와 여러 장치에 의존하는 것이 뇌를 쓰지 않게 만들어 기억을 어렵게 만든다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리 뇌는 근육과 비슷해서 계속 써야 힘이 유지되고, 쓰지 않으면 금방 약해집니다. 뇌가 경험에 따라 연결을 바꾸는 이 능력을 \u003cb class=\"key\">신경가소성\u003c/b>(neuroplasticity)이라고 부르고, 기억을 담당하는 \u003cb class=\"key\">해마\u003c/b>(hippocampus)는 정보를 반복해서 꺼내 쓸수록 더 강하게 연결됩니다. 그래서 ‘Use it or lose it(쓰지 않으면 잃는다)’이라는 말이 뇌에도 그대로 적용되죠. 스마트폰에 전화번호를 다 저장해 두면 외울 일이 사라지는 것처럼, 기억은 인출(recall)할 기회가 줄면 약해질 수 있습니다. 이렇게 두뇌의 기억 부담을 기계에 넘기는 현상을 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">오프로딩\u003c/b>(cognitive offloading) 또는 ‘구글 효과(Google effect)’라고 합니다. 결국 편리한 장치는 우리를 게으르게 만드는 것이 아니라, 뇌를 쓸 기회 자체를 줄여 버리는 셈입니다.\u003c/div>","segs":[{"n":2,"text":"우리 뇌는 근육과 비슷해요. 계속 써야 힘이 유지되고, 안 쓰면 금방 약해지죠. 뇌가 경험에 따라 연결을 바꾸는 능력을 신경가소성, 영어로 neuroplasticity라고 해요. 기억을 담당하는 해마, hippocampus도 정보를 반복해서 꺼내 쓸수록 더 강하게 연결됩니다. 그래서 Use it or lose it, 즉 쓰지 않으면 잃는다는 말이 뇌에도 그대로 적용돼요. 스마트폰에 전화번호를 다 저장해 두면 외울 일이 사라지는 것처럼, 기억은 꺼내 쓸 기회가 줄면 약해질 수 있습니다. 이렇게 기억 부담을 기계에 넘기는 현상을 인지적 오프로딩, cognitive offloading이라고 부른다는 것도 함께 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>현상 제시\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>요즘 컴퓨터 기술에 점점 더 \u003cb class=\"key\">의존\u003c/b>하는 젊은이들이 \u003cb class=\"key\">기억력 \u003c/b>\u003cb class=\"key\">감퇴\u003c/b>를 겪고 있다는 사실이 먼저 제시돼요. 이어서 그들은 이름, 전화번호, 그밖에 날마다 이용하는 자료가 \u003cb class=\"key\">기억하기가 \u003c/b>\u003cb class=\"key\">점점 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">힘들어\u003c/b>졌다고 불평한다는 점이 덧붙습니다. 개인적인 증상과 당사자들의 목소리로 문제를 띄우는 단계예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>원인 지목\u003csmall>근거 · 문장 3\u003c/small>\u003c/h4>\u003cp>그다음 전문가들이 컴퓨터, 전자수첩, 자동차 내비게이션 시스템을 \u003cb class=\"key\">원인\u003c/b>으로 지목해요. 문제를 개인의 게으름이 아니라 \u003cb class=\"key\">기기\u003c/b> 탓으로 돌리는 장면이죠. 이 한 문장이 뒤에 나올 주장의 발판을 열어 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>주장 제시\u003csmall>주장 · 문장 4\u003c/small>\u003c/h4>\u003cp>전문가들은 이러한 장치들에 의존해 \u003cb class=\"key\">뇌를 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">이상 \u003c/b>\u003cb class=\"key\">사용하지 \u003c/b>\u003cb class=\"key\">않는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 기억을 어렵게 만든다고 주장해요. 기기를 쓰는 일과 뇌를 쓰지 않는 일이 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>로 이어진다는 설명이죠. 앞 문장의 원인 지목이 여기서 ‘뇌의 미사용(disuse)’이라는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">개념\u003c/b>으로 구체화됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>인용으로 강조\u003csmall>결론 · 문장 5\u003c/small>\u003c/h4>\u003cp>마지막으로 한 전문가의 \u003cb class=\"key\">직접 \u003c/b>\u003cb class=\"key\">인용\u003c/b>이 나오면서 글의 경고가 강해져요. ‘이런 말을 하고 싶지는 않지만, 요즘 젊은이들은 점점 바보가 되어가고 있다’는 표현은 \u003cb class=\"key\">자극적인 \u003c/b>\u003cb class=\"key\">어조\u003c/b>로 문제의 심각성을 환기합니다. 근거를 제시한 뒤 인용으로 \u003cb class=\"key\">결론\u003c/b>을 맺는 마무리 단계예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 문장과 두 번째 문장에서는 현상이 제시돼요. 요즘 컴퓨터 기술에 점점 더 의존하는 젊은이들이 기억력 감퇴를 겪고 있다는 거죠. 이어서 이름이나 전화번호, 그밖에 날마다 이용하는 자료가 기억하기가 점점 더 힘들어졌다고 그들이 불평한다는 점이 나옵니다. 구체적인 증상과 당사자들의 목소리로 문제를 띄우는 도입부예요.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 전문가들이 나서서 컴퓨터와 전자수첩, 자동차 내비게이션 시스템을 원인으로 지목합니다. 문제를 개인의 게으름이 아니라 기기 탓으로 돌리는 장면이죠. 이 원인 지목이 뒤에 나올 주장의 발판이 되어 줍니다.","hl":"f1"},{"n":6,"text":"네 번째 문장은 이 글의 주장이에요. 이러한 장치들에 의존해 뇌를 더 이상 사용하지 않는 것이 사람들이 무엇을 기억하는 것을 점점 더 어렵게 만든다고 그들은 주장합니다. 기기를 쓰는 일과 뇌를 쓰지 않는 일이 인과 관계로 이어진다는 설명이죠. 여기서 뇌의 미사용이라는 핵심 개념이 분명하게 드러납니다.","hl":"f2"},{"n":7,"text":"마지막으로 한 전문가의 직접 인용이 나오면서 경고가 강해져요. 이런 말을 하고 싶지는 않지만 요즘 젊은이들은 점점 바보가 되어가고 있다고 말하죠. 자극적인 어조로 문제의 심각성을 환기하면서 글을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 젊은이들의 \u003cb class=\"key\">기억력 \u003c/b>\u003cb class=\"key\">감퇴\u003c/b>라는 핵심 현상을 먼저 던지고, 뒤에서 그 원인을 차례로 풀어내는 \u003cb class=\"key\">두괄식\u003c/b> 구성이에요. 두 번째 문장은 현상을 구체화하고, 세 번째와 네 번째 문장은 \u003cb class=\"key\">전문가\u003c/b>의 말을 빌려 원인과 주장을 제시합니다. 기기 의존이라는 원인이 뇌의 미사용을 거쳐 \u003cb class=\"key\">기억력 \u003c/b>\u003cb class=\"key\">저하\u003c/b>라는 결과로 이어지는 \u003cb class=\"key\">인과\u003c/b> 관계가 글 전체를 관통하죠. 그래서 전개 방식은 인과, 구조는 두괄식으로 판단합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>These days (1)\u003c/b>\u003cspan>시간적 배경 제시(도입)\u003c/span>\u003cb>They complain that (2)\u003c/b>\u003cspan>구체적 현상 제시\u003c/span>\u003cb>Experts blame (3)\u003c/b>\u003cspan>원인 지목\u003c/span>\u003cb>They claim that (4)\u003c/b>\u003cspan>주장 제시\u003c/span>\u003cb>but (5)\u003c/b>\u003cspan>인용 속 어조 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">memory loss\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">getting harder to recall\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">making it more and more difficult for people to remember things\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">becoming stupid\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 인과 관계를 따라 전개되는 두괄식 글입니다. 첫 번째 문장에서 젊은이들의 기억력 감퇴라는 핵심 현상을 먼저 던져 놓고, 뒤에서 그 원인을 차례로 풀어내죠. 두 번째 문장은 현상을 구체화하고, 세 번째와 네 번째 문장은 전문가의 말을 빌려 원인과 주장을 제시합니다. 기기 의존이 뇌의 미사용으로, 다시 기억력 저하로 이어지는 흐름이 글 전체를 관통해요.","hl":"ty"},{"n":9,"text":"신호어도 꼭 챙겨 보세요. These days는 시간적 배경을 열어 주고, They complain that은 구체적인 현상을 붙여 줍니다. Experts blame은 원인을 지목하는 신호이고, They claim that은 주장이 시작된다는 표시예요. 마지막 문장의 but은 인용 속에서 어조가 한 번 꺾인다는 것을 알려 주죠. 그리고 memory loss가 getting harder to recall로, 다시 remember things로 바뀌어 반복되는 재진술도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>these days\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>요즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>a number of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>increasingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>점점 더\u003c/span>\u003c/div>\u003cdiv>\u003cb>rely on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 의존하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>suffer from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 겪다, ~로 고통받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>memory loss\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기억력 감퇴\u003c/span>\u003c/div>\u003cdiv>\u003cb>complain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>불평하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>data\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자료, 데이터\u003c/span>\u003c/div>\u003cdiv>\u003cb>recall\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기억해 내다, 상기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>expert\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전문가\u003c/span>\u003c/div>\u003cdiv>\u003cb>blame\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~의 탓으로 돌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>electronic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전자의\u003c/span>\u003c/div>\u003cdiv>\u003cb>organizer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(전자)수첩, 정리 기구\u003c/span>\u003c/div>\u003cdiv>\u003cb>automobile\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자동차\u003c/span>\u003c/div>\u003cdiv>\u003cb>navigation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>항법, 내비게이션\u003c/span>\u003c/div>\u003cdiv>\u003cb>system\u003c/b>\u003cem>명사\u003c/em>\u003cspan>체계, 시스템\u003c/span>\u003c/div>\u003cdiv>\u003cb>claim\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>disuse\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사용하지 않음, 폐용\u003c/span>\u003c/div>\u003cdiv>\u003cb>come from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 비롯되다, ~에서 오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dependence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의존\u003c/span>\u003c/div>\u003cdiv>\u003cb>device\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장치, 기기\u003c/span>\u003c/div>\u003cdiv>\u003cb>difficult\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어려운\u003c/span>\u003c/div>\u003cdiv>\u003cb>hate to say it\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이런 말을 하고 싶지는 않지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>stupid\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>멍청한, 바보 같은\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚어 볼게요. rely on은 의존하다, suffer from은 겪다는 뜻이에요. recall은 기억해 내다, 상기하다는 의미이고, disuse는 사용하지 않음, dependence는 의존을 뜻합니다. blame은 탓으로 돌리다, claim은 주장하다로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">rely on\u003c/b>\u003cspan class=\"m\">~에 의존하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">depend on\u003c/span>\u003cspan class=\"s\">count on\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">be independent of\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">increasingly\u003c/b>\u003cspan class=\"m\">점점 더\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">more and more\u003c/span>\u003cspan class=\"s\">gradually\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decreasingly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suffer from\u003c/b>\u003cspan class=\"m\">~을 겪다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">experience\u003c/span>\u003cspan class=\"s\">undergo\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">benefit from\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">recall\u003c/b>\u003cspan class=\"m\">기억해 내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">remember\u003c/span>\u003cspan class=\"s\">recollect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">blame\u003c/b>\u003cspan class=\"m\">~의 탓으로 돌리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accuse\u003c/span>\u003cspan class=\"s\">hold responsible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">praise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dependence\u003c/b>\u003cspan class=\"m\">의존\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reliance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">independence\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stupid\u003c/b>\u003cspan class=\"m\">바보 같은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">foolish\u003c/span>\u003cspan class=\"s\">silly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">smart\u003c/span>\u003cspan class=\"a\">clever\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. rely on은 depend on, count on과 가깝습니다. suffer from은 experience, undergo와 바꿔 쓸 수 있고, recall은 remember, recollect와 같아요. 반대로 forget은 recall의 반의어입니다. blame은 accuse와 비슷하고, dependence의 반대말은 independence예요. stupid는 foolish, silly와 가깝고 반대말은 smart나 clever입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요즘\u003c/span>\u003cspan class=\"en\">These days,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 젊은이들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">number \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">young \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 컴퓨터 기술에 의존하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">increasingly \u003c/span>\u003cspan class=\"tgt\">rely \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">computer \u003c/span>\u003cspan class=\"tgt\">technology\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기억력 감퇴를 겪고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">suffering \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">memory \u003c/span>\u003cspan class=\"tgt\">loss\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">요즘 컴퓨터 기술에 점점 더 의존하는 많은 젊은이들이 기억력 감퇴를 겪고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 화제를 여는 도입 문장이에요. \u003cb class=\"key\">젊은이들\u003c/b>이 겪는 문제, 즉 \u003cb class=\"key\">기억력 \u003c/b>\u003cb class=\"key\">감퇴\u003c/b>를 먼저 던져 독자의 관심을 끌죠. 원인은 뒤 문장에서 밝혀지므로 여기서는 현상만 제시한다고 보면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">a number of + 복수명사 (수량 표현)\u003c/span> : a number of + [복수명사] + [복수동사] : \"많은 젊은이들이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 young people] + who + [동사 rely] ~ : \"점점 더 컴퓨터 기술에 의존하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재진행형 + suffer from\u003c/span> : be동사 + [동사-ing] / suffer from + [명사] : \"기억력 감퇴를 겪고 있다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"These days, 요즘. a number of young people, 많은 젊은이들이. who increasingly rely on computer technology, 점점 더 컴퓨터 기술에 의존하는. are suffering from memory loss, 기억력 감퇴를 겪고 있다. 이 문장 전체를 해석하면, 요즘 컴퓨터 기술에 점점 더 의존하는 많은 젊은이들이 기억력 감퇴를 겪고 있다.","hl":"m"},{"n":13,"text":"이 문장은 글의 화제를 여는 도입 문장이에요. 젊은이들이 겪는 문제, 즉 기억력 감퇴를 먼저 던져서 독자의 관심을 끄는 거죠. 원인은 뒤 문장에서 밝혀지니까 여기서는 현상만 제시한다고 보면 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째로 a number of young people, 여기서 a number of는 '많은'이라는 수량 표현이에요. 진짜 주어는 뒤에 오는 복수명사라서 동사도 복수로 받아 줍니다. 두 번째로 who increasingly rely on computer technology, 앞의 young people을 꾸며 주는 주격 관계대명사죠. 선행사가 복수니까 동사도 rely로 맞춰 줍니다. 세 번째로 are suffering from memory loss, 지금 이어지는 상황이라 현재진행형을 썼고, suffer from은 '겪다'라는 숙어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 ~라고 불평한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">complain \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이름이나 전화번호, 그밖에 다른 자료들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">names, \u003c/span>\u003cspan class=\"tgt\">phone \u003c/span>\u003cspan class=\"tgt\">numbers \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">data\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 날마다 이용하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기억하기가 점점 더 힘들어지고 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">getting \u003c/span>\u003cspan class=\"tgt\">harder \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">recall\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 이름이나 전화번호, 그밖에 날마다 이용하는 자료들이 기억하기가 점점 더 힘들어진다고 불평한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 '기억력 감퇴'를 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>로 풀어 주는 문장이에요. 이름·전화번호처럼 매일 쓰는 \u003cb class=\"key\">자료\u003c/b>조차 떠올리기 어려워졌다는 것이죠. 즉 젊은이들이 느끼는 불편을 그대로 보여 주어 문제를 실감 나게 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절 목적어)\u003c/span> : complain + [that + 주어 + 동사 ~] : \"그들은 ~라고 불평한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조 (A, B and C)\u003c/span> : [명사 A], [명사 B] and [명사 C] : \"이름, 전화번호, 그밖에 자료들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 that (목적격)\u003c/span> : [선행사 data] + that + [주어 they] + [동사 use] : \"그들이 날마다 이용하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">get + 비교급 + to부정사\u003c/span> : get + [비교급 형용사] + [to부정사] : \"기억하기가 점점 더 힘들어지고 있다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They complain that, 그들은 ~라고 불평한다. names, phone numbers and other data, 이름이나 전화번호, 그밖에 다른 자료들이. that they use every day, 그들이 날마다 이용하는. are getting harder to recall, 기억하기가 점점 더 힘들어지고 있다고. 이 문장 전체를 해석하면, 그들은 이름이나 전화번호, 그밖에 날마다 이용하는 자료들이 기억하기가 점점 더 힘들어진다고 불평한다.","hl":"m"},{"n":16,"text":"앞 문장의 기억력 감퇴를 구체적 사례로 풀어 주는 문장이에요. 이름이나 전화번호처럼 매일 쓰는 자료조차 떠올리기 어려워졌다는 거죠. 젊은이들이 느끼는 불편을 그대로 보여 줘서 문제를 실감 나게 만들어 줍니다.","hl":"mn"},{"n":17,"text":"첫 번째로 They complain that, complain 뒤에 that절이 와서 불평의 내용을 채우는 명사절이에요. 두 번째로 names, phone numbers and other data, 같은 자격의 명사를 and로 병렬로 묶었습니다. 세 번째로 that they use every day, 앞의 data를 꾸미는 목적격 관계대명사라서 뒤에 목적어가 빠진 불완전한 구조가 옵니다. 네 번째로 are getting harder to recall, get이 '~해지다'라는 상태 변화를 나타내고, harder 뒤의 to recall이 '기억하기가'라는 뜻으로 형용사를 수식해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전문가들은 탓한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Experts \u003c/span>\u003cspan class=\"tgt\">blame\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">컴퓨터와 전자수첩,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">computers, \u003c/span>\u003cspan class=\"tgt\">electronic \u003c/span>\u003cspan class=\"tgt\">organizers \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 자동차 내비게이션 시스템을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">automobile \u003c/span>\u003cspan class=\"tgt\">navigation \u003c/span>\u003cspan class=\"tgt\">systems\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전문가들은 컴퓨터와 전자수첩, 자동차 내비게이션 시스템이 원인이라고 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 제시된 현상의 \u003cb class=\"key\">원인\u003c/b>을 전문가 입장에서 짚어 주는 문장이에요. blame은 여기서 '탓하다'보다 '\u003cb class=\"key\">원인\u003c/b>으로 지목하다'로 읽는 게 자연스럽죠. 기억력 감퇴의 책임을 \u003cb class=\"key\">기기\u003c/b> 쪽으로 돌리며 다음 문장의 근거로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">blame + 목적어 (타동사)\u003c/span> : blame + [목적어] : \"전문가들은 ~을 탓한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조 (A, B and C)\u003c/span> : [명사 A], [명사 B] and [명사 C] : \"컴퓨터, 전자수첩, 자동차 내비게이션 시스템\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Experts blame, 전문가들은 탓한다. computers, electronic organizers, 컴퓨터와 전자수첩. and automobile navigation systems, 그리고 자동차 내비게이션 시스템을. 이 문장 전체를 해석하면, 전문가들은 컴퓨터와 전자수첩, 자동차 내비게이션 시스템이 원인이라고 말한다.","hl":"m"},{"n":19,"text":"앞에서 나온 현상의 원인을 전문가 입장에서 짚어 주는 문장이에요. blame은 여기서 그냥 '탓하다'보다 원인으로 지목한다는 뜻으로 읽는 게 자연스럽죠. 기억력 감퇴의 책임을 기기 쪽으로 돌리면서 다음 문장의 근거로 이어집니다.","hl":"mn"},{"n":20,"text":"첫 번째로 Experts blame, blame은 '~을 탓하다'라는 타동사라서 목적어만 있으면 문장이 완성되는 구조예요. 두 번째로 computers, electronic organizers and automobile navigation systems, blame의 목적어로 세 개의 명사구를 and로 병렬 연결했습니다. 셋을 나열할 때는 쉼표와 and를 함께 쓴다는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 주장한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">claim \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌를 더 이상 사용하지 않는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> the disuse of the brain/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 장치들에 의존해 비롯되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">comes \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">dependence \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">devices\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 어렵게 하고 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 무엇을 기억하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">remember \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 장치들에 의존해 뇌를 더 이상 사용하지 않는 것이 사람들이 무엇을 기억하는 것을 점점 더 어렵게 하고 있다고 그들은 주장한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전문가들이 컴퓨터와 전자 수첩, 자동차 항법 장치를 탓한 이유를 구체적으로 풀어 놓은 문장이에요. 장치에 의존하면 뇌를 쓰지 않게 되고, 그 결과 기억력이 떨어진다는 \u003cb class=\"key\">주장\u003c/b>을 담고 있죠. 핵심은 '의존 → 뇌의 미사용 → 기억력 저하'로 이어지는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : claim [타동사] + [that + 주어 + 동사 ~ (명사절/목적어)] : \"그들은 ~라고 주장한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 the disuse] + that + [동사 comes] ~ (주격 관계대명사절) : \"이러한 장치들에 의존하는 데서 비롯되는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">가목적어 it과 진목적어 to부정사 (make + 목적어 + 목적격보어)\u003c/span> : make + [가목적어 it] + [목적격보어 difficult] + [진목적어 to remember things] : \"사람들이 무엇을 기억하는 것을 점점 더 어렵게 만들고 있다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They claim, 그들은 주장한다. that the disuse of the brain, 뇌를 더 이상 사용하지 않는 것이. that comes from dependence on these devices, 이러한 장치들에 의존해 비롯되는. is making it more and more difficult, 점점 더 어렵게 하고 있다고. for people to remember things, 사람들이 무엇을 기억하는 것을. 이 문장 전체를 해석하면, 이러한 장치들에 의존해 뇌를 더 이상 사용하지 않는 것이 사람들이 무엇을 기억하는 것을 점점 더 어렵게 하고 있다고 그들은 주장한다.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 전문가들이 컴퓨터와 전자 수첩, 자동차 항법 장치를 탓했다는 내용을 이어받아요. 그 장치들에 의존하다 보면 뇌를 쓰지 않게 되고, 결국 무엇을 기억하는 것이 점점 더 어려워진다고 주장하는 거죠. 그러니까 핵심은 뇌의 미사용이 기억력 저하로 이어지는 인과 관계라는 점이에요.","hl":"mn"},{"n":23,"text":"어법 포인트를 순서대로 짚어 볼게요. 첫 번째, They claim that에서 claim은 뒤에 절을 통째로 목적어로 데려가는 타동사예요. that절 안에는 주어와 동사가 다 갖춰진 완전한 절이 와요. 두 번째, that comes from은 앞의 the disuse를 꾸며 주는 주격 관계대명사예요. 관계사가 주어 노릇을 하니까 바로 뒤에 동사 comes가 오는 거죠. 세 번째, is making it more and more difficult for people to remember things에서는 길어진 목적어 자리를 it이 대신하는 가목적어 구조예요. make는 목적어 뒤에 형용사를 목적격보어로 데려오고, for people은 to부정사의 의미상 주어로 사람들이 기억하는 것이라는 뜻을 만들어 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“이런 말을 하고 싶지는 않지만,\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">hate \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">say \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요즘 젊은이들은 점점 바보가 되어가고 있다.”\u003c/span>\u003cspan class=\"en\">but young people today \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">becoming \u003c/span>\u003cspan class=\"tgt\">stupid\u003c/span>.&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고 한 전문가는 말한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">says \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">expert\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“이런 말을 하고 싶지는 않지만, 요즘 젊은이들은 점점 바보가 되어가고 있다.”고 한 전문가는 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전문가의 말을 그대로 옮겨 온 인용문이에요. 앞에서 뇌를 쓰지 않게 되면 기억력이 나빠진다고 설명했으니, 여기서는 그 결론을 '바보가 되어간다'는 \u003cb class=\"key\">직설적\u003c/b> 표현으로 받아쳐요. 글의 끝에서 독자에게 강한 \u003cb class=\"key\">경고\u003c/b>의 메시지를 남기는 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사를 목적어로 취하는 동사 hate\u003c/span> : hate + [to say it (to부정사/목적어)] : \"나는 그것을 말하기를 싫어한다 → 이런 말을 하고 싶지는 않지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 동사 become + 주격보어(형용사)\u003c/span> : become + [stupid (주격보어/형용사)] : \"점점 바보가 되어가고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">인용문 뒤의 도치(동사 + 주어)\u003c/span> : [인용문] + says [동사] + one expert [주어] : \"고 한 전문가는 말한다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"\"I hate to say it, “이런 말을 하고 싶지는 않지만. but young people today are becoming stupid.\", 요즘 젊은이들은 점점 바보가 되어가고 있다.”. says one expert, 고 한 전문가는 말한다.. 이 문장 전체를 해석하면, “이런 말을 하고 싶지는 않지만, 요즘 젊은이들은 점점 바보가 되어가고 있다.”고 한 전문가는 말한다.","hl":"m"},{"n":25,"text":"이 문장은 한 전문가의 말을 그대로 옮긴 인용문이에요. 앞에서 뇌를 쓰지 않게 되면 기억력이 나빠진다고 설명했으니, 여기서는 그 결론을 직설적 표현으로 받아쳐서 요즘 젊은이들은 점점 바보가 되어간다고 말하는 거예요. 글의 마지막에서 독자에게 강한 경고의 메시지를 남기는 역할을 하죠.","hl":"mn"},{"n":26,"text":"어법 포인트를 순서대로 볼게요. 첫 번째, I hate to say it에서 hate는 to부정사를 목적으로 데려가는 동사예요. 그래서 to say it이 통째로 목적어가 되고, 이런 말을 하고 싶지는 않지만이라는 뜻이 되죠. 두 번째, are becoming stupid에서 become은 주어의 상태 변화를 나타내고 뒤에 형용사 stupid를 주격보어로 데려와요. 세 번째, says one expert는 인용문 뒤에서 동사가 주어보다 먼저 나오는 도치 구문이에요. 누가 말했는지를 뒤에서 밝히는 방식이랍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>요즘 컴퓨터 기술에 점점 더 의존하는 젊은이들이 \u003cb class=\"key\">기억력 \u003c/b>\u003cb class=\"key\">감퇴\u003c/b>를 겪고 있다.\u003c/li>\u003cli>이름, 전화번호 같은 날마다 이용하는 자료가 \u003cb class=\"key\">기억하기가 \u003c/b>\u003cb class=\"key\">점점 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">힘들어\u003c/b>졌다고 그들은 불평한다.\u003c/li>\u003cli>전문가들은 컴퓨터, 전자수첩, 자동차 내비게이션 시스템 같은 \u003cb class=\"key\">장치\u003c/b>를 원인으로 지목한다.\u003c/li>\u003cli>장치에 의존해 \u003cb class=\"key\">뇌를 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">이상 \u003c/b>\u003cb class=\"key\">사용하지 \u003c/b>\u003cb class=\"key\">않는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 기억을 어렵게 만든다는 주장이며, 한 전문가는 젊은이들이 점점 바보가 되어간다고 경고한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Relying on computers and other devices leads to the disuse of the brain, which makes it harder and harder for young people to remember things.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요즘 컴퓨터 기술에 점점 더 의존하는 젊은이들이 \u003cb class=\"key\">기억력 \u003c/b>\u003cb class=\"key\">감퇴\u003c/b>를 겪고 있다는 현상이 제시된다. 전문가들은 컴퓨터, 전자수첩, 내비게이션 같은 장치에 의존해 \u003cb class=\"key\">뇌를 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">이상 \u003c/b>\u003cb class=\"key\">사용하지 \u003c/b>\u003cb class=\"key\">않는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 사람들이 무엇을 기억하는 것을 점점 더 어렵게 만든다고 주장한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"오늘 글의 핵심은 결국 하나예요. 기기에 의존해 뇌를 쓰지 않게 되면 기억력은 약해진다는 것, 그리고 그것이 인과 관계로 이어진다는 점입니다. 첫 문장에서 현상을 잡고, 원인을 설명하는 문장에 표시하면서 한 번 더 읽어 보세요. 수고 많았습니다, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
