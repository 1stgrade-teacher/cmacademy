<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 17강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 17강 적용독해01","audioDir":"17-01_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">17강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>A Smile That Hid a Quiet Revenge\u003c/h1>\u003ch2>조용한 복수를 감춘 미소\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>공항에서 손님의 짐을 실수로 넘어뜨린 화물 취급자는 소리치는 여행객에게도 웃으며 침착하게 대응했지만, 사실 그는 그 여행객의 \u003cb class=\"key\">가방\u003c/b>을 엉뚱한 목적지로 보내는 \u003cb class=\"key\">복수\u003c/b>를 이미 실행한 뒤였다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The baggage handler could stay calm and smiling because he had already sent the angry traveler's bags to the wrong city.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 공항에서 벌어진 아주 재미있는 이야기예요. 화물 취급자와 여행객이 등장하는데, 겉으로 보이는 태도와 실제 속마음이 정반대라서 읽는 재미가 아주 커요. 짧은 이야기지만 마지막에 반전이 있으니까 끝까지 집중해서 들어 봐요. 이 글의 요지는 화물 취급자가 웃으며 침착하게 대응한 이유가 사실은 조용한 복수였다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">공항에서 짐을 맡기면 \u003cb class=\"key\">수하물 \u003c/b>\u003cb class=\"key\">태그\u003c/b>(baggage tag)에 목적지 코드가 찍히고, 분류 시스템(sorting system)이 그 태그를 따라 짐을 해당 항공편으로 보내 준다. 그래서 짐이 어디로 갈지는 사람의 기분이 아니라 태그와 경로(routing)에 의해 결정된다. 이는 택배를 보낼 때 송장에 엉뚱한 주소를 적으면 물건이 다른 도시로 가 버리는 것과 같은 원리다. 이 지문에서 화물 취급자는 겉으로는 \u003cb class=\"key\">자제력\u003c/b>(self-control)을 보여 주었지만, 실제로는 짐의 경로를 바꾸어 조용히 되갚았다. 즉 감정을 드러내지 않는 것이 반드시 용서를 뜻하지는 않는다는 점을 보여 주는 이야기다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 공항에서 짐을 맡기면 baggage tag라는 태그에 목적지 코드가 찍히고, sorting system이 그 태그를 따라 짐을 각 항공편으로 보내 줘요. 그래서 짐이 어디로 갈지는 사람의 기분이 아니라 태그와 routing, 즉 경로에 의해 결정되죠. 여러분이 택배를 보낼 때 송장에 엉뚱한 주소를 적으면 물건이 다른 도시로 가 버리는 것과 똑같은 원리예요. 이 지문에서 화물 취급자는 겉으로는 self-control, 즉 자제력을 보여 주었지만 실제로는 짐의 경로를 바꿔서 조용히 되갚은 거예요. 그래서 감정을 드러내지 않는 게 꼭 용서를 뜻하는 건 아니라는 점, 이게 이 글의 핵심이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>실수와 분노\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>공항에서 화물 취급자가 손님을 돕다가 실수로 그 사람의 \u003cb class=\"key\">짐\u003c/b>을 넘어뜨린다. 그는 재빨리 \u003cb class=\"key\">사과\u003c/b>하고 떨어진 가방들을 주웠지만, 여행객은 그의 \u003cb class=\"key\">서툰 \u003c/b>\u003cb class=\"key\">행동\u003c/b>에 화를 내며 소리치기 시작한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>웃는 취급자\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>화물 취급자는 마치 못 들은 것처럼 그냥 웃으며 그 자리에 서 있었다. 줄서 있던 다음 손님은 이 장면을 보고 그의 \u003cb class=\"key\">자제력\u003c/b>에 감명을 받는다. 겉으로 보기에는 완벽한 \u003cb class=\"key\">침착함\u003c/b>이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>왜 화를 참았나\u003csmall>질문 · 문장 5\u003c/small>\u003c/h4>\u003cp>다음 손님이 저 남자가 소리를 지르는데 어떻게 그렇게 침착하냐고 \u003cb class=\"key\">질문\u003c/b>한다. 이 질문은 독자가 품고 있던 궁금증과 정확히 같다. 이야기는 이제 답을 향해 달려간다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>가방의 행방\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>취급자는 '쉬웠다'고 답하며 진짜 이유를 밝힌다. 그 사람은 덴버로 가지만 가방은 지금 \u003cb class=\"key\">달라스\u003c/b>로 가고 있다는 것이다. 웃음의 근거가 마지막 순간에 \u003cb class=\"key\">반전\u003c/b>으로 드러난다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떤 순서로 흘러가는지 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 공항에서 한 화물 취급자가 손님을 도와주다가 실수로 그 사람의 짐을 넘어뜨려요. 그는 재빨리 사과하고 떨어진 가방들을 주웠죠. 그런데 여행객은 그의 서툰 행동에 화를 내며 소리치기 시작해요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 전환이에요. 화물 취급자는 마치 못 들은 것처럼 그냥 웃으며 그 자리에 서 있었어요. 줄서 있던 다음 손님은 그 장면을 보고 그의 자제력에 감명을 받죠. 여기까지 보면 취급자는 정말 대단한 사람처럼 보여요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 질문이에요. 다음 손님이 저 남자가 소리를 지르는데 어떻게 그렇게 침착하냐고 물어요. 이 질문은 독자가 품고 있던 궁금증과 정확히 같죠. 이야기는 이제 답을 향해 달려가요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결론이자 반전이에요. 취급자는 쉬웠다고 답하면서 진짜 이유를 밝혀요. 저 사람은 덴버로 가지만 가방은 지금 달라스로 간다고 말하죠. 그 순간 웃음의 근거가 완전히 드러나요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 다섯 번째 문장의 \u003cb class=\"key\">질문\u003c/b>에 여섯 번째와 일곱 번째 문장이 답하는 \u003cb class=\"key\">질문-답변\u003c/b> 구조다. 앞부분에서는 취급자가 화를 참는 대단한 사람처럼 보이지만, 마지막 문장에서 그가 이미 \u003cb class=\"key\">복수\u003c/b>를 실행했다는 사실이 드러나 \u003cb class=\"key\">반전\u003c/b>이 완성된다. 글의 주제가 결말에 제시되므로 \u003cb class=\"key\">미괄식\u003c/b>으로 판단한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>As (1)\u003c/b>\u003cspan>시간·상황 제시\u003c/span>\u003cb>but (2)\u003c/b>\u003cspan>대조·전환\u003c/span>\u003cb>as if (3)\u003c/b>\u003cspan>가정적 태도 표현\u003c/span>\u003cb>How did you~? (5)\u003c/b>\u003cspan>질문 제시\u003c/span>\u003cb>It was easy (6)\u003c/b>\u003cspan>답변 시작\u003c/span>\u003cb>Although (7)\u003c/b>\u003cspan>양보·반전\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">began shouting angrily at him\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">stood there smiling\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his control\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">keep so calm\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">was yelling at you\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>여행객 (Traveler)\u003c/th>\u003cth>화물 취급자 (Baggage handler)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>화를 그대로 드러내며 소리침\u003c/td>\u003ctd>겉으로 웃으며 침착하게 대응\u003c/td>\u003c/tr>\u003ctr>\u003ctd>그 자리에서 문제를 키움\u003c/td>\u003ctd>뒤에서 조용히 되갚음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결과: 가방이 달라스로 감\u003c/td>\u003ctd>결과: 자제력 있는 사람으로 보임\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 질문과 답변, 그리고 마지막의 반전으로 이루어져 있어요. 앞부분에서 독자는 취급자가 화를 잘 참는 대단한 사람이라고 생각하게 되고, 마지막 문장에서 그 생각이 한 번에 뒤집히죠. 그래서 주제가 결말에 제시되는 미괄식 구조예요.","hl":"ty"},{"n":9,"text":"신호어도 같이 짚어 볼게요. 두 번째 문장의 but은 사과하고 주웠는데도 여행객이 화를 냈다는 대조를 만들어 줘요. 세 번째 문장의 as if는 그가 못 들은 것처럼 행동했다는 태도를 보여 주고, 다섯 번째 문장의 의문문이 독자의 궁금증을 만들어 내죠. 그리고 마지막 문장의 Although가 양보의 표현이면서 동시에 반전의 방아쇠가 된다는 점, 꼭 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>as\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~할 때, ~하는 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>baggage handler\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>수하물(화물) 취급자\u003c/span>\u003c/div>\u003cdiv>\u003cb>customer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>손님, 고객\u003c/span>\u003c/div>\u003cdiv>\u003cb>airport\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공항\u003c/span>\u003c/div>\u003cdiv>\u003cb>accidentally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실수로, 우연히\u003c/span>\u003c/div>\u003cdiv>\u003cb>knock over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>넘어뜨리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>luggage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>짐, 수하물\u003c/span>\u003c/div>\u003cdiv>\u003cb>apologize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사과하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집어 들다, 줍다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fallen\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>떨어진, 쓰러진\u003c/span>\u003c/div>\u003cdiv>\u003cb>bag\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가방, 짐\u003c/span>\u003c/div>\u003cdiv>\u003cb>traveler\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여행객, 여행자\u003c/span>\u003c/div>\u003cdiv>\u003cb>shout\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소리치다, 외치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>angrily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>화나서, 성나서\u003c/span>\u003c/div>\u003cdiv>\u003cb>clumsiness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>서툶, 어색함\u003c/span>\u003c/div>\u003cdiv>\u003cb>simply\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그냥, 단지\u003c/span>\u003c/div>\u003cdiv>\u003cb>stand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>서 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>as if\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>마치 ~인 것처럼\u003c/span>\u003c/div>\u003cdiv>\u003cb>hear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>듣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in line\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>줄을 서서\u003c/span>\u003c/div>\u003cdiv>\u003cb>happen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일어나다, 발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be impressed by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 감명을 받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>control\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자제력, 통제\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep\u003c/b>\u003cem>동사\u003c/em>\u003cspan>유지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>calm\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>침착한\u003c/span>\u003c/div>\u003cdiv>\u003cb>yell at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게 소리치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>although\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~이지만\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚고 갈게요. accidentally는 실수로, knock over는 넘어뜨리다라는 뜻이고, clumsiness는 서툰 행동이나 어색함을 말해요. apologize는 사과하다, yell at은 소리치다라는 뜻이고, be impressed by는 감명을 받다로 기억해 두면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">accidentally\u003c/b>\u003cspan class=\"m\">실수로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unintentionally\u003c/span>\u003cspan class=\"s\">by mistake\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deliberately\u003c/span>\u003cspan class=\"a\">intentionally\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">apologize\u003c/b>\u003cspan class=\"m\">사과하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">say sorry\u003c/span>\u003cspan class=\"s\">express regret\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">blame\u003c/span>\u003cspan class=\"a\">accuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">angrily\u003c/b>\u003cspan class=\"m\">화나서\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">furiously\u003c/span>\u003cspan class=\"s\">fiercely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calmly\u003c/span>\u003cspan class=\"a\">peacefully\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">clumsiness\u003c/b>\u003cspan class=\"m\">서툶, 어색함\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">awkwardness\u003c/span>\u003cspan class=\"s\">ineptness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">skill\u003c/span>\u003cspan class=\"a\">grace\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">calm\u003c/b>\u003cspan class=\"m\">침착한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">composed\u003c/span>\u003cspan class=\"s\">cool\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">nervous\u003c/span>\u003cspan class=\"a\">agitated\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">control\u003c/b>\u003cspan class=\"m\">자제력, 통제\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">self-restraint\u003c/span>\u003cspan class=\"s\">composure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rage\u003c/span>\u003cspan class=\"a\">panic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">be impressed by\u003c/b>\u003cspan class=\"m\">~에 감명을 받다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be moved by\u003c/span>\u003cspan class=\"s\">be struck by\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">be indifferent to\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">yell at\u003c/b>\u003cspan class=\"m\">~에게 소리치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shout at\u003c/span>\u003cspan class=\"s\">scream at\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">whisper to\u003c/span>\u003cspan class=\"a\">speak softly to\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. accidentally는 unintentionally, by mistake와 비슷하고 반대로는 deliberately, intentionally가 있어요. angrily는 furiously와 가깝고 반대말은 calmly죠. clumsiness의 반대말은 skill이나 grace이고, calm은 composed, cool과 비슷하며 반대말은 nervous, agitated예요. yell at은 shout at, scream at과 같고, 반대로는 whisper to처럼 조용히 말하는 표현이 와요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 수화물 취급자가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">baggage \u003c/span>\u003cspan class=\"tgt\">handler \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손님을 도와줄 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">helping\u003c/span> a customer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공항에서\u003c/span>\u003cspan class=\"en\">at the airport,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 실수로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">accidentally \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">넘어뜨렸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">knocked \u003c/span>\u003cspan class=\"tgt\">over\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사람의 짐을\u003c/span>\u003cspan class=\"en\">the man's luggage.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 수화물 취급자가 공항에서 손님을 도와줄 때, 실수로 그 사람의 짐을 넘어뜨렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사건의 발단을 알려 주는 첫 문장이에요. 공항에서 수화물 취급자가 \u003cb class=\"key\">실수\u003c/b>로 손님의 짐을 넘어뜨리면서 갈등이 시작된다는 것을 보여 줘요. accidentally라는 부사가 이 사고가 \u003cb class=\"key\">고의\u003c/b>가 아닌 우연임을 분명히 해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 As(시간, ~할 때) + 과거진행\u003c/span> : As + [주어] + [was + -ing] , [주절] : \"수화물 취급자가 돕고 있을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 knock over (동사+부사)\u003c/span> : [knock + over + 목적어] = 목적어를 넘어뜨리다 : \"그는 실수로 넘어뜨렸다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"As a baggage handler, 한 수화물 취급자가. was helping a customer, 손님을 도와줄 때. at the airport, 공항에서. he accidentally, 그는 실수로. knocked over, 넘어뜨렸다. the man's luggage, 그 사람의 짐을. 이 문장 전체를 해석하면, 한 수화물 취급자가 공항에서 손님을 도와줄 때, 실수로 그 사람의 짐을 넘어뜨렸다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 발단이에요. 공항에서 직원이 실수로 손님 짐을 넘어뜨리면서 사건이 시작되죠. accidentally가 있으니까 일부러 그런 게 아니라 우연이었다는 점을 꼭 기억해 주세요.","hl":"mn"},{"n":14,"text":"어법 포인트 짚어 볼게요. 첫 번째, As는 시간을 나타내는 접속사로 ~할 때라고 해석해요. 두 번째, was helping은 과거진행으로 그 순간 돕고 있던 동작 중임을 보여 주죠. 세 번째, knocked over는 구동사로 over가 쓰러져라는 방향의 뜻을 더해 넘어뜨리다가 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 재빨리 사과하고\u003c/span>\u003cspan class=\"en\">He quickly apologized\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주웠다\u003c/span>\u003cspan class=\"en\">and picked up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">떨어진 가방들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fallen \u003c/span>\u003cspan class=\"tgt\">bags\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 여행객은 시작했다\u003c/span>\u003cspan class=\"en\">but the traveler \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게 화를 내며 소리치기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">shouting\u003c/span> angrily at him\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 서툰 행동에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">clumsiness\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 재빨리 사과하고 떨어진 가방들을 주웠다. 하지만 여행객은 그의 서툰 행동에 대해 화를 내며 그에게 소리치기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 직원의 \u003cb class=\"key\">사과\u003c/b>와 반대되는 손님의 반응을 대조해서 보여 주는 문장이에요. but을 기준으로 직원은 침착하게 수습하고, 여행객은 \u003cb class=\"key\">화\u003c/b>를 내며 소리친다는 두 태도가 갈립니다. 이 대비가 뒤에 나오는 직원의 \u003cb class=\"key\">자제력\u003c/b>을 더 돋보이게 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사 형용사 (fallen)\u003c/span> : the + [fallen (과거분사)] + [bags (명사)] : \"떨어진 가방들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 목적어 (begin + -ing)\u003c/span> : begin + [shouting (동명사/목적어)] : \"소리치기 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for (이유·원인)\u003c/span> : for + [명사(원인)] : \"그의 서툰 행동 때문에\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He quickly apologized, 그가 재빨리 사과하고. and picked up, 주웠다. the fallen bags, 떨어진 가방들을. but the traveler began, 하지만 여행객은 시작했다. shouting angrily at him, 그에게 화를 내며 소리치기. for his clumsiness, 그의 서툰 행동에 대해. 이 문장 전체를 해석하면, 그가 재빨리 사과하고 떨어진 가방들을 주웠다. 하지만 여행객은 그의 서툰 행동에 대해 화를 내며 그에게 소리치기 시작했다.","hl":"m"},{"n":16,"text":"여기서 두 사람의 태도가 갈려요. 직원은 재빨리 사과하고 짐을 주우며 수습하는데, 여행객은 오히려 화를 내며 소리치기 시작하죠. 이 대비 덕분에 다음 문장에서 직원의 자제력이 더 크게 보이는 거예요.","hl":"mn"},{"n":17,"text":"어법 포인트 세 가지예요. 첫 번째, fallen은 fall의 과거분사로 명사 bags 앞에서 떨어진이라는 형용사 역할을 해요. 두 번째, began 뒤에 동명사 shouting이 와서 소리치기 시작했다는 동작의 시작을 나타내죠. 세 번째, for는 이유를 나타내는 전치사로 그의 서툰 행동 때문에라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 수화물 취급자는\u003c/span>\u003cspan class=\"en\">The baggage handler\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그냥 거기에 서 있었다\u003c/span>\u003cspan class=\"en\">simply \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stood \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">웃으면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">smiling\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마치 그가 못 들은 것처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">hadn't \u003c/span>\u003cspan class=\"tgt\">heard \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 수화물 취급자는 마치 그의 말을 못 들은 것처럼 그냥 웃으며 거기에 서 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 여행객이 소리치는 상황과 정반대로, 직원이 \u003cb class=\"key\">침착\u003c/b>하게 웃으며 서 있는 모습을 그린 문장이에요. as if는 실제로는 들었지만 못 들은 \u003cb class=\"key\">척\u003c/b>한다는 뉘앙스를 담고 있어요. 이 장면이 뒤에서 손님이 감명을 받는 \u003cb class=\"key\">이유\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사 동시동작 (~하면서)\u003c/span> : [본동사 stood] + [smiling (현재분사/동시동작)] : \"웃으면서 서 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">as if 가정법 (과거완료, 사실 반대)\u003c/span> : as if + [주어 + had + p.p.] : \"마치 그가 못 들은 것처럼\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The baggage handler, 그 수화물 취급자는. simply stood there, 그냥 거기에 서 있었다. smiling, 웃으면서. as if he hadn't heard him, 마치 그가 못 들은 것처럼. 이 문장 전체를 해석하면, 그 수화물 취급자는 마치 그의 말을 못 들은 것처럼 그냥 웃으며 거기에 서 있었다.","hl":"m"},{"n":19,"text":"여행객이 소리치는데도 직원은 그냥 웃으면서 서 있어요. 실제로는 다 들었지만 못 들은 척한 거죠. 이 침착한 태도가 다음에 나오는 손님의 감탄으로 이어지는 중요한 장면이에요.","hl":"mn"},{"n":20,"text":"어법 포인트 짚어 볼게요. 첫 번째, smiling은 현재분사로 서 있는 것과 웃는 것이 동시에 일어나는 동시동작을 나타내요. 두 번째, as if는 마치 ~인 것처럼이라는 뜻으로 사실과 반대되는 상황을 가정하죠. 세 번째, 실제로는 들었는데도 못 들은 척하는 상황이라 가정법 과거완료인 had not heard를 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">줄서 있던 다음 손님\u003c/span>\u003cspan class=\"en\">The next customer in line\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌어진 일을 보고\u003c/span>\u003cspan class=\"en\">saw \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">happened\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 감명을 받았다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">impressed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화물 취급자의 자제력에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">by\u003c/span> the baggage handler's control.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">줄서 있던 다음 손님이 벌어진 일을 보고 화물 취급자의 자제력에 감명을 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 줄서 있던 다음 손님이 상황을 지켜보고 화물 취급자의 태도에 감명을 받았다는 장면이에요. 화를 내는 손님 앞에서도 \u003cb class=\"key\">자제력\u003c/b>을 잃지 않은 모습이 \u003cb class=\"key\">인상적\u003c/b>이었다는 뜻이죠. 이 감명이 바로 다음 문장의 \u003cb class=\"key\">질문\u003c/b>으로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what + 과거완료\u003c/span> : what(선행사 포함) + had + [[과거분사]] : \"벌어진 일\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(감정동사의 수동태)\u003c/span> : be동사 + [[과거분사]] + by + 감정의 원인 : \"~에 감명을 받았다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The next customer in line, 줄서 있던 다음 손님. saw what had happened, 벌어진 일을 보고. and was impressed, 그리고 감명을 받았다. by the baggage handler's control, 화물 취급자의 자제력에. 이 문장 전체를 해석하면, 줄서 있던 다음 손님이 벌어진 일을 보고 화물 취급자의 자제력에 감명을 받았다.","hl":"m"},{"n":22,"text":"이 문장은 줄서 있던 다음 손님이 상황을 보고 감명을 받았다는 거예요. 화물 취급자가 화를 내는 손님에게도 자제력을 잃지 않는 모습을 보였다는 핵심 장면이죠. 그래서 다음 문장에서 그가 왜 그렇게 침착했는지 질문으로 이어지는 거예요.","hl":"mn"},{"n":23,"text":"먼저 what had happened를 보세요. what은 선행사를 포함해서 '~한 것'으로 해석하는 관계대명사예요. had happened는 그 전에 이미 벌어진 일이라 대과거로 쓴 거죠. 두 번째로 was impressed by는 수동태예요. impress가 '감동을 주다'라는 타동사라서, 감동을 받는 쪽이 주어가 되면 수동태로 표현해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 그렇게 침착할 수 있었어요\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">calm\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저 남자가 당신에게 소리를 지르는데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">man \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">yelling \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>?&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 물었어요\u003c/span>\u003cspan class=\"en\">he asked.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“저 남자가 당신에게 소리를 지르는데 어떻게 그렇게 침착하세요?”하고 그가 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 다음 손님이 화물 취급자를 향해 어떻게 그렇게 침착할 수 있었는지 놀라움 섞인 \u003cb class=\"key\">질문\u003c/b>을 던지는 문장이에요. 앞에서 느낀 \u003cb class=\"key\">감명\u003c/b>이 실제 대화로 이어진 거죠. 이 질문 덕분에 뒤에서 화물 취급자의 \u003cb class=\"key\">속마음\u003c/b>이 드러나는 반전이 시작돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 이끄는 의문문(도치)\u003c/span> : 의문사 + [[조동사]] + 주어 + [[동사원형]]? : \"어떻게 그렇게 침착할 수 있었어요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 while + 과거진행형\u003c/span> : while + 주어 + was/were + [[현재분사]] : \"저 남자가 당신에게 소리를 지르고 있는 동안\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"How did you keep so calm, 어떻게 그렇게 침착할 수 있었어요. while that man was yelling at you?\", 저 남자가 당신에게 소리를 지르는데. he asked, 그가 물었어요. 이 문장 전체를 해석하면, “저 남자가 당신에게 소리를 지르는데 어떻게 그렇게 침착하세요?”하고 그가 물었다.","hl":"m"},{"n":25,"text":"다음 손님이 화물 취급자에게 어떻게 그렇게 침착할 수 있었는지 놀라움 섞인 질문을 던지는 문장이에요. 앞에서 느낀 감명이 실제 대화로 이어진 거죠. 이 질문 덕분에 뒤에서 화물 취급자의 속마음이 드러나는 반전이 시작돼요.","hl":"mn"},{"n":26,"text":"먼저 How did you keep so calm을 보세요. 의문문이라서 의문사 How가 앞으로 나가고 조동사 did가 주어 앞으로 오는 도치가 일어나요. 그래서 본동사 keep은 동사원형으로 써요. 두 번째로 while은 '~하는 동안'이라는 시간 접속사예요. 그 순간 계속 소리치고 있었으니까 과거진행인 was yelling로 표현한 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉬워요\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">easy\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수화물 취급자가 대답했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">baggage \u003c/span>\u003cspan class=\"tgt\">handler \u003c/span>\u003cspan class=\"tgt\">answered\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“쉬워요,” 화물 취급자가 대답했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화물 취급자가 아주 짧게 '쉬웠다'고 \u003cb class=\"key\">대답\u003c/b>하는 문장이에요. 앞에서 본 침착함이 사실은 \u003cb class=\"key\">복수\u003c/b>를 준비한 결과였다는 걸 암시하는 \u003cb class=\"key\">복선\u003c/b>이죠. 다음 문장에서 그 이유가 가방의 행선지로 밝혀지면서 웃음이 터져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 it(앞 내용을 받는 it)\u003c/span> : It + be동사 + [[형용사]] : \"그건 쉬웠어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어 + 자동사(평서문 어순)\u003c/span> : [[주어]] + answered([[자동사]]) : \"화물 취급자가 대답했어요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It was easy,\", 쉬워요. the baggage handler answered, 수화물 취급자가 대답했어요. 이 문장 전체를 해석하면, “쉬워요,” 화물 취급자가 대답했다.","hl":"m"},{"n":28,"text":"화물 취급자가 아주 짧게 '쉬웠다'고 대답하는 문장이에요. 앞에서 본 침착함이 사실은 복수를 준비한 결과였다는 걸 암시하는 복선이죠. 다음 문장에서 그 이유가 가방의 행선지로 밝혀지면서 웃음이 터져요.","hl":"mn"},{"n":29,"text":"It was easy에서 It은 앞에서 물어본 '그렇게 침착했던 일'을 가리키는 대명사예요. 그래서 '그건 쉬웠어요'라는 뜻이 되죠. 그리고 the baggage handler answered처럼 인용문 뒤에는 주어 다음에 answered를 놓아서 누가 말했는지 밝혀요. 여기서 answer는 목적어 없이 쓰인 자동사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 그가 덴버로 가고 있지만,\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">he's \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Denver\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 가방들은 지금 달라스로 가고 있다!\u003c/span>\u003cspan class=\"en\">his bags \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">going\u003c/span> to Dallas!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“저 사람은 덴버로 가지만, 가방은 지금 달라스로 가거든요!”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화물 취급자가 소리치는 손님에게도 웃음을 잃지 않았던 진짜 이유를 밝히는 \u003cb class=\"key\">반전\u003c/b> 문장이에요. 손님 본인은 덴버로 가지만 그의 가방은 달라스로 보내 버리겠다는, 조용하지만 확실한 \u003cb class=\"key\">복수\u003c/b>가 담겨 있죠. 앞에서 보인 침착함이 사실은 \u003cb class=\"key\">응징\u003c/b>을 예고한 미소였음을 드러내며 이야기를 웃음으로 마무리해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 부사절 접속사 Although\u003c/span> : [[Although + 주어 + 동사]] , 주어 + 동사 (양보 부사절이 문장 앞에 온 형태) : \"비록 그가 덴버로 가고 있지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형(be + -ing)\u003c/span> : [[주어 + be동사 + 동사원형-ing]] + 장소 (지금 ~로 가고 있다) : \"그가 덴버로 가고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간 부사 now의 위치(be동사 뒤)\u003c/span> : 주어 + [[be동사 + now + 동사원형-ing]] : \"지금 가고 있다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Although he's going to Denver, 비록 그가 덴버로 가고 있지만. his bags are now going to Dallas!, 그의 가방들은 지금 달라스로 가고 있다!. 이 문장 전체를 해석하면, “저 사람은 덴버로 가지만, 가방은 지금 달라스로 가거든요!”","hl":"m"},{"n":31,"text":"이 문장은 화물 취급자가 왜 그렇게 침착할 수 있었는지 밝히는 반전의 대사예요. 손님은 덴버로 가지만 가방은 달라스로 보내 버리겠다는, 조용하지만 확실한 복수인 거죠. 앞에서 보여 준 미소가 사실은 응징을 예고한 웃음이었다는 걸 알 수 있어요.","hl":"mn"},{"n":32,"text":"먼저 Although는 비록 이지만이라는 뜻의 양보 접속사예요. 뒤에 주어와 동사가 있는 완전한 절이 와야 하니까 he's going to Denver가 통째로 이어지는 거죠. 그다음 he's going은 현재진행형으로 지금 덴버로 가고 있는 이동 상태를 보여 줘요. 마지막으로 are now going에서 now는 be동사 뒤에 놓여 지금 바로 가방이 다른 도시로 향하고 있다는 점을 강조한답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>공항에서 화물 취급자가 실수로 손님의 \u003cb class=\"key\">짐\u003c/b>을 넘어뜨렸고, 그는 곧바로 사과하고 떨어진 가방들을 주웠다.\u003c/li>\u003cli>그러나 여행객은 그의 \u003cb class=\"key\">서툰 \u003c/b>\u003cb class=\"key\">행동\u003c/b>에 화를 내며 소리치기 시작했다.\u003c/li>\u003cli>화물 취급자는 마치 못 들은 것처럼 웃으며 서 있었고, 이를 본 다음 손님은 그의 \u003cb class=\"key\">자제력\u003c/b>에 감명을 받았다.\u003c/li>\u003cli>사실 그는 이미 그 여행객의 가방을 \u003cb class=\"key\">달라스\u003c/b>로 보내 버린 뒤였기 때문에 그렇게 웃을 수 있었다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The baggage handler could stay calm and smiling because he had already sent the angry traveler's bags to the wrong city.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">공항에서 손님의 짐을 실수로 넘어뜨린 화물 취급자는 소리치는 여행객에게도 웃으며 침착하게 대응했지만, 사실 그는 그 여행객의 \u003cb class=\"key\">가방\u003c/b>을 엉뚱한 목적지로 보내는 \u003cb class=\"key\">복수\u003c/b>를 이미 실행한 뒤였다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 지문은 짧지만 반전이 아주 강한 이야기였어요. 겉으로 드러난 웃음과 침착함 뒤에 조용한 복수가 숨어 있었다는 점이 핵심이에요. 시험에서는 마지막 문장의 반전을 놓치지 않고 주제를 잡는 연습을 꼭 해 보세요. 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
