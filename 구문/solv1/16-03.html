<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 16강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 16강 적용독해03","audioDir":"16-03_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">16강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Why Supermarkets Want You Hungry\u003c/h1>\u003ch2>슈퍼마켓이 당신이 배고프길 바라는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>슈퍼마켓 입구의 갓 구운 빵 냄새는 손님을 배고프게 해 \u003cb class=\"key\">충동 \u003c/b>\u003cb class=\"key\">구매\u003c/b>를 유도한다. 배고픔은 계획에 없던 지출을 늘리므로, \u003cb class=\"key\">식사를 \u003c/b>\u003cb class=\"key\">충분히 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">뒤\u003c/b> 장을 보는 것이 유혹에 저항하는 현명한 방법이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>To avoid impulse buying, you should do your grocery shopping after a big meal, because the hunger created by the store's smells makes you spend more money.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 슈퍼마켓 입구의 냄새가 우리 지갑을 어떻게 비우는지에 대한 지문을 함께 읽어 보겠습니다. 이 글은 갓 구운 빵 냄새가 배고픔을 자극하고, 그 배고픔이 지출을 늘린다는 사실을 알려 줘요. 그래서 해결책으로 식사를 충분히 한 뒤에 장을 보라고 말하고 있습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">슈퍼마켓은 매출을 높이기 위해 \u003cb class=\"key\">후각 \u003c/b>\u003cb class=\"key\">마케팅\u003c/b>(scent marketing)을 적극적으로 활용한다. 갓 구운 빵 냄새를 입구에 배치하는 것은 손님의 허기를 자극해 충동 구매(impulse buying)를 유도하는 계산된 전략이다. 심리학에서는 배고픔이 의사 결정을 흐리게 만들어 \u003cb class=\"key\">자제력\u003c/b>(self-control)을 약화시킨다고 설명한다. 실제로 배가 고플 때는 뇌가 음식과 보상(reward)에 더 민감하게 반응해 계획에 없던 소비가 늘어난다. 영화관에 들어설 때 나는 팝콘 냄새에 이끌려 필요 없던 팝콘을 사 본 경험을 떠올리면 이해가 쉽다. 그래서 예산(budget)을 지키고 싶다면 \u003cb class=\"key\">배부른 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에서 장을 보는 것이 가장 간단한 대비책이 된다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 알고 가면 훨씬 쉬워요. 슈퍼마켓은 후각 마케팅, 영어로 scent marketing을 아주 적극적으로 활용합니다. 갓 구운 빵 냄새를 입구에 배치하는 것은 손님의 허기를 자극해서 충동 구매를 유도하는 계산된 전략이에요. 심리학에서는 배고픔이 의사 결정을 흐리게 만들어 자제력, 즉 self-control을 약하게 만든다고 설명합니다. 영화관에 들어설 때 나는 팝콘 냄새에 이끌려 필요 없던 팝콘을 사 본 경험, 한 번쯤 있으시죠? 그래서 예산, budget을 지키고 싶다면 배부른 상태에서 장을 보는 것이 가장 간단한 대비책이 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>입구의 냄새\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>슈퍼마켓에 들어서면 가장 먼저 \u003cb class=\"key\">갓 \u003c/b>\u003cb class=\"key\">구운 \u003c/b>\u003cb class=\"key\">제품\u003c/b>의 군침 도는 냄새가 우리를 맞이한다. 이 냄새는 우리를 배고프게 만들고, 그것은 바로 가게가 \u003cb class=\"key\">의도\u003c/b>한 결과이다. 즉 입구의 냄새는 우연이 아니라 계산된 \u003cb class=\"key\">장치\u003c/b>라는 점을 첫 두 문장이 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>배고픔의 힘\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>가게는 손님이 \u003cb class=\"key\">배고플 \u003c/b>\u003cb class=\"key\">때\u003c/b> 더 많은 돈을 쓴다는 사실을 알고 있다. 배고픔은 살 계획이 없던 물건에도 관심을 갖게 만든다. 그래서 냄새로 \u003cb class=\"key\">허기\u003c/b>를 자극하는 것은 매출을 늘리는 확실한 근거가 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>빈 지갑\u003csmall>결과 · 문장 5\u003c/small>\u003c/h4>\u003cp>그 결과 손님은 \u003cb class=\"key\">지갑\u003c/b>이 비고 양팔에는 불필요한 식료품이 가득한 채 집으로 향하게 된다. 계획에 없던 지출이 \u003cb class=\"key\">충동 \u003c/b>\u003cb class=\"key\">구매\u003c/b>로 이어지는 순간이다. 이 문장은 문제 상황을 압축적으로 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>식사 후 쇼핑\u003csmall>해결 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>이 문제를 막는 현명한 방법은 \u003cb class=\"key\">배부른 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에서 쇼핑하는 것이다. 식사를 충분히 한 뒤 장을 보면 가게가 준비한 \u003cb class=\"key\">유혹\u003c/b>에 저항하기가 훨씬 쉬워진다. 글은 이렇게 실천 가능한 \u003cb class=\"key\">해결책\u003c/b>으로 마무리된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문을 네 단계로 나누어서 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 문장부터 볼게요. 슈퍼마켓에 들어서면 가장 먼저 갓 구운 제품의 군침 도는 냄새가 우리를 맞이합니다. 그 냄새는 우리를 배고프게 만들고, 두 번째 문장은 그것이 바로 가게가 의도한 결과라고 말하죠. 즉 입구의 냄새는 우연이 아니라 계산된 장치라는 점을 첫 두 문장이 보여 줍니다.","hl":"f0"},{"n":5,"text":"다음은 세 번째와 네 번째 문장이에요. 가게는 손님이 배고플 때 더 많은 돈을 쓴다는 사실을 알고 있습니다. 배고픔은 살 계획이 없던 물건에도 관심을 갖게 만들죠. 그래서 냄새로 허기를 자극하는 것은 매출을 늘리는 확실한 근거가 됩니다.","hl":"f1"},{"n":6,"text":"다섯 번째 문장은 그 결과를 보여 줍니다. 결국 손님은 지갑이 비고 양팔에는 불필요한 식료품이 가득한 채 집으로 향하게 됩니다. 계획에 없던 지출이 충동 구매로 이어지는 순간이에요. 이 문장은 문제 상황을 아주 압축적으로 보여 주죠.","hl":"f2"},{"n":7,"text":"마지막으로 여섯 번째와 일곱 번째 문장입니다. 이 문제를 막는 현명한 방법은 식사를 충분히 한 뒤, 즉 배부른 상태에서 쇼핑하는 것이에요. 배가 부르면 가게가 준비한 유혹에 저항하기가 훨씬 쉬워집니다. 글은 이렇게 실천 가능한 해결책으로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 슈퍼마켓의 냄새라는 \u003cb class=\"key\">문제\u003c/b>를 제시하고 마지막에 \u003cb class=\"key\">해결책\u003c/b>을 주는 문제-해결 구조이다. 1~5번은 문제가 생기는 과정과 결과를 차례로 설명하고, 6번에서 'A smart way to prevent this'라는 신호어로 해결책을 연다. 핵심 주장이 글 끝에 나오므로 \u003cb class=\"key\">미괄식\u003c/b>이다. 따라서 주제문은 6번이며, 7번은 그 해결책의 효과를 덧붙인 문장이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>that's exactly what the supermarket wants (2)\u003c/b>\u003cspan>가게의 의도 제시\u003c/span>\u003cb>than if you are not hungry (3)\u003c/b>\u003cspan>비교·대조\u003c/span>\u003cb>In the end (5)\u003c/b>\u003cspan>결과 정리\u003c/span>\u003cb>A smart way to prevent this (6)\u003c/b>\u003cspan>해결책 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the mouthwatering smell of freshly baked goods\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">make you hungry\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">feel hungry\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Hunger\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spend more money\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">your wallet empty and your arms full of unneeded groceries\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>배고플 때 쇼핑\u003c/th>\u003cth>배부를 때 쇼핑\u003c/th>\u003c/tr>\u003ctr>\u003ctd>더 많은 돈을 지출한다\u003c/td>\u003ctd>유혹에 쉽게 저항한다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>계획에 없던 물건에 관심이 간다\u003c/td>\u003ctd>불필요한 구매가 줄어든다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"구조를 정리해 볼게요. 이 글은 슈퍼마켓의 냄새라는 문제를 던지고 마지막에 해결책을 주는 문제-해결 구조입니다. 앞부분에서는 문제가 생기는 과정과 결과를 차근차근 설명하고, 여섯 번째 문장에서 해결책을 꺼내죠. 핵심 주장이 글 끝에 나오기 때문에 미괄식 구조이고, 주제문은 당연히 여섯 번째 문장입니다.","hl":"ty"},{"n":9,"text":"신호어도 꼭 챙겨 보세요. 두 번째 문장의 that's exactly what the supermarket wants는 가게의 의도를 콕 집어 주는 표현입니다. 다섯 번째 문장의 In the end는 결과를 정리하는 신호어이고, 여섯 번째 문장의 A smart way to prevent this는 해결책을 여는 신호어예요. 또 세 번째 문장에서는 배고플 때와 배고프지 않을 때를 than if you are not hungry로 비교하고 있다는 점도 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>notice\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아차리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mouthwatering\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>군침이 도는\u003c/span>\u003c/div>\u003cdiv>\u003cb>freshly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>갓, 방금\u003c/span>\u003c/div>\u003cdiv>\u003cb>baked goods\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>구운 제품, 빵류\u003c/span>\u003c/div>\u003cdiv>\u003cb>store\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가게, 매장\u003c/span>\u003c/div>\u003cdiv>\u003cb>entrance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>입구\u003c/span>\u003c/div>\u003cdiv>\u003cb>be likely to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 것 같다, ~하기 쉽다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hungry\u003c/b>\u003cem>형용사\u003c/e l":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가게는 안다\u003c/span>\u003cspan class=\"en\">The store knows\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 더 많은 돈을 쓸 것 같다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">spend \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 당신이 배고프다고 느끼면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">hungry\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 쇼핑하는 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">shopping\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 배고프지 않을 때보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">hungry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가게는 쇼핑하는 동안 당신이 배고프지 않을 때보다 배가 고플 때 더 많은 돈을 쓴다는 것을 안다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 가게가 손님의 심리를 정확히 파악하고 있다는 것을 말한다. 배가 고픈 채로 쇼핑하면 배고프지 않을 때보다 \u003cb class=\"key\">지출\u003c/b>이 늘어난다는 비교 구조이다. 앞 문장에서 냄새로 배고프게 만든 이유가 바로 이 \u003cb class=\"key\">소비 \u003c/b>\u003cb class=\"key\">심리\u003c/b>에 있다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that 생략 + be likely to\u003c/span> : know + [that] + 주어 + [[be likely to]] + 동사원형 : \"당신이 더 많은 돈을 쓸 것 같다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조건의 부사절 if\u003c/span> : if + 주어 + [[현재시제]], 주절 : \"당신이 배고프다고 느끼면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간의 부사절 while + 진행형\u003c/span> : while + 주어 + be동사 + -ing : \"당신이 쇼핑하는 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">비교급 than + if절\u003c/span> : more + 명사 + than + if절 : \"당신이 배고프지 않을 때보다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The store knows, 가게는 안다. you are likely to spend more money, 당신이 더 많은 돈을 쓸 것 같다는 것을. if you feel hungry, 만약 당신이 배고프다고 느끼면. while you are shopping, 당신이 쇼핑하는 동안. than if you are not hungry, 당신이 배고프지 않을 때보다. 이 문장 전체를 해석하면, 가게는 쇼핑하는 동안 당신이 배고프지 않을 때보다 배가 고플 때 더 많은 돈을 쓴다는 것을 안다.","hl":"m"},{"n":19,"text":"이 문장은 가게가 손님의 심리를 정확히 알고 있다는 걸 말해요. 배가 고픈 상태로 쇼핑하면 배고프지 않을 때보다 돈을 더 쓰게 된다는 거죠. 앞 문장에서 냄새로 배고프게 만든 이유가 바로 여기에 있어요.","hl":"mn"},{"n":20,"text":"첫 번째, knows 뒤에 you are likely to spend가 이어지는데 여기에는 접속사 that이 생략되어 있어요. 그리고 그 안에서 be likely to가 '~할 것 같다'라는 뜻을 만들어요. 두 번째, if you feel hungry는 조건을 나타내는 부사절이고, 미래 상황이어도 부사절에서는 현재시제 feel을 써요. 세 번째, while you are shopping에서 while은 두 일이 동시에 일어난다는 걸 보여 주고, 쇼핑이 계속되는 상황이라 진행형을 썼어요. 네 번째, than if you are not hungry는 비교급 than 뒤에 if절이 통째로 온 경우예요. 상황과 상황을 비교하니까 비교 대상이 절이 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배고픔은 당신을 ~하게 만들지도 모른다\u003c/span>\u003cspan class=\"en\">Hunger may \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">것들에 관심을 갖게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">interested\u003c/span> in \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 살 계획이 없던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">plan \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">buy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">배고픔은 당신이 살 계획이 없던 것에 관심을 갖게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 배가 고프면 원래 살 생각이 없던 물건에도 관심이 생긴다는 뜻이에요. 앞 문장에서 배고픔이 \u003cb class=\"key\">소비\u003c/b>를 늘린다고 했으니, 여기서는 그 이유를 \u003cb class=\"key\">계획에 \u003c/b>\u003cb class=\"key\">없던 \u003c/b>\u003cb class=\"key\">구매\u003c/b>로 구체화한 문장이에요. \u003cb class=\"key\">make \u003c/b>\u003cb class=\"key\">+ \u003c/b>\u003cb class=\"key\">목적어 \u003c/b>\u003cb class=\"key\">+ \u003c/b>\u003cb class=\"key\">형용사\u003c/b> 구조로 '배고픔이 당신을 ~한 상태로 만든다'는 의미를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 make + 목적어 + 형용사(목적격 보어)\u003c/span> : make [목적어 you] + [interested (형용사/목적격 보어)] : \"당신을 관심 있게 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : things [(which/that) + 주어 + 동사] : \"당신이 살 계획이 없던 것들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : plan [to buy (to부정사구/목적어)] : \"살 계획이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Hunger may make you, 배고픔은 당신을 ~하게 만들지도 모른다. interested in things, 것들에 관심을 갖게. you didn't plan to buy, 당신이 살 계획이 없던. 이 문장 전체를 해석하면, 배고픔은 당신이 살 계획이 없던 것에 관심을 갖게 한다.","hl":"m"},{"n":22,"text":"이 문장은 배고픔의 힘을 말하고 있어요. 배가 고프면 원래 살 생각이 없던 물건에도 관심이 생긴다는 뜻이죠. 앞에서 배고픔이 소비를 늘린다고 했으니, 여기서는 그 이유를 계획에 없던 구매로 구체적으로 보여 주는 거예요.","hl":"mn"},{"n":23,"text":"먼저 make you interested를 보세요. make가 목적어 you 뒤에 형용사 interested를 데리고 와서 목적어를 어떤 상태로 만든다는 구조를 만들죠. 두 번째로 things you didn't plan to buy에서 things와 you 사이에 목적격 관계대명사가 생략되어 있어요. 마지막으로 plan to buy는 plan이 to부정사를 목적어로 받아 살 계획이라는 뜻을 만드는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결국,\u003c/span>\u003cspan class=\"en\">In the end,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 발견할지도 모른다\u003c/span>\u003cspan class=\"en\">you may \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">yourself \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집으로 향하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">going\u003c/span> home\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지갑이 빈 채로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">wallet \u003c/span>\u003cspan class=\"tgt\">empty\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 양팔은 불필요한 식료품들로 가득한 채로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">arms \u003c/span>\u003cspan class=\"tgt\">full \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">unneeded \u003c/span>\u003cspan class=\"tgt\">groceries\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결국, 당신은 지갑이 비고 양팔은 불필요한 식료품들로 가득한 채로 집으로 향하는 당신을 발견할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 쇼핑이 끝나면 지갑은 비고 양팔에는 필요 없는 물건만 가득한 결과를 장면처럼 그려 낸 문장이에요. 앞 문장에서 말한 \u003cb class=\"key\">계획에 \u003c/b>\u003cb class=\"key\">없던 \u003c/b>\u003cb class=\"key\">구매\u003c/b>가 실제 결과로 이어진다는 흐름을 보여 줍니다. \u003cb class=\"key\">find \u003c/b>\u003cb class=\"key\">+ \u003c/b>\u003cb class=\"key\">목적어 \u003c/b>\u003cb class=\"key\">+ \u003c/b>\u003cb class=\"key\">현재분사\u003c/b>와 \u003cb class=\"key\">with \u003c/b>\u003cb class=\"key\">부대상황\u003c/b>을 이용해 상황을 생생하게 묘사했어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 find + 목적어 + 현재분사(목적격 보어)\u003c/span> : find [목적어 yourself] + [going (현재분사/목적격 보어)] : \"당신이 가고 있는 자신을 발견하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">with + 목적어 + 형용사(부대상황)\u003c/span> : with [목적어 your wallet] + [형용사 empty] : \"지갑이 빈 채로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조(and)\u003c/span> : with [A + 형용사] and [(with) B + 형용사구] : \"그리고 양팔은 불필요한 식료품으로 가득한 채로\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In the end, 결국. you may find yourself, 당신은 발견할지도 모른다. going home, 집으로 향하는. with your wallet empty, 지갑이 빈 채로. and your arms full of unneeded groceries, 그리고 양팔은 불필요한 식료품들로 가득한 채로. 이 문장 전체를 해석하면, 결국, 당신은 지갑이 비고 양팔은 불필요한 식료품들로 가득한 채로 집으로 향하는 당신을 발견할지도 모른다.","hl":"m"},{"n":25,"text":"결국 쇼핑이 끝나면 지갑은 비고 양팔에는 필요 없는 물건만 가득하다는 뜻이에요. 배고픔에 이끌린 쇼핑의 결과를 아주 생생한 장면으로 보여 주죠. 앞 문장의 계획에 없던 구매가 실제 결과로 이어진다는 흐름을 이어 줍니다.","hl":"mn"},{"n":26,"text":"먼저 find yourself going에서 find는 목적어 뒤에 현재분사를 붙여 목적어가 하고 있는 것을 발견한다는 의미를 만들어요. 이때 목적어와 분사가 능동 관계라서 현재분사를 쓴다는 점도 기억해요. 다음으로 with your wallet empty는 with 다음에 목적어와 형용사가 와서 지갑이 빈 채로라는 부대상황을 나타냅니다. 그리고 and 뒤의 your arms full of unneeded groceries는 앞의 with your wallet empty와 병렬을 이루는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 것을 예방하는 영리한 방법은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">smart \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">prevent \u003c/span>\u003cspan class=\"tgt\">this\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식료품 쇼핑을 하는 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">grocery \u003c/span>\u003cspan class=\"tgt\">shopping\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 식사를 충분히 한 뒤에야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">you've \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">meal\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 것을 예방할 수 있는 가장 영리한 방법은 식사를 충분히 한 후에 식료품 쇼핑을 하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 문제를 막는 해결책을 제시하는 \u003cb class=\"key\">주제문\u003c/b>이에요. 배고픈 상태를 피하려면 \u003cb class=\"key\">배를 \u003c/b>\u003cb class=\"key\">든든히 \u003c/b>\u003cb class=\"key\">채운 \u003c/b>\u003cb class=\"key\">뒤\u003c/b> 쇼핑하라는 실천적 조언이죠. \u003cb class=\"key\">A \u003c/b>\u003cb class=\"key\">is \u003c/b>\u003cb class=\"key\">B\u003c/b> 구문으로 '영리한 방법은 ~하는 것이다'라고 정의하듯 문제와 해결을 연결합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(명사 수식)\u003c/span> : A smart way [to prevent this (to부정사구/형용사적)] : \"이것을 예방하는 영리한 방법\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(주격 보어)\u003c/span> : [주어 A smart way ...] + be동사 + [to do (to부정사/주격 보어)] : \"식료품 쇼핑을 하는 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간 부사절의 현재완료와 only 강조\u003c/span> : after + 주어 + [have/has + p.p.] : \"당신이 식사를 충분히 한 뒤에야\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"A smart way to prevent this, 이런 것을 예방하는 영리한 방법은. is to do your grocery shopping, 식료품 쇼핑을 하는 것이다. only after you've had a big meal, 당신이 식사를 충분히 한 뒤에야. 이 문장 전체를 해석하면, 이런 것을 예방할 수 있는 가장 영리한 방법은 식사를 충분히 한 후에 식료품 쇼핑을 하는 것이다.","hl":"m"},{"n":28,"text":"이 문장은 글의 해결책을 제시하는 핵심 문장이에요. 배고픈 상태를 피하려면 배를 든든히 채운 뒤에 쇼핑하라는 거죠. 앞에서 말한 문제를 막는 아주 영리한 방법을 알려 주고 있어요.","hl":"mn"},{"n":29,"text":"첫 번째로 A smart way to prevent this에서 to부정사가 명사 way 뒤에서 형용사처럼 이것을 예방하는이라는 뜻으로 way를 꾸며요. 두 번째로 is to do your grocery shopping에서 be동사 뒤의 to부정사는 주격 보어로 주어의 내용을 풀어 설명합니다. 마지막으로 only after you've had a big meal에서 after 절에 현재완료를 써서 식사를 끝낸 뒤라는 완료의 의미를 살리고, only가 오직 그 뒤에야라는 강조를 더해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쇼핑하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Shopping\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 배부른 상태인 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">you're \u003c/span>\u003cspan class=\"tgt\">full\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신에게 그것을 훨씬 더 쉽게 만들 것이다\u003c/span>\u003cspan class=\"en\">will \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">easier \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유혹에 저항하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">resist\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">temptations \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">슈퍼마켓이 당신을 위해 준비해 놓은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">supermarket \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">prepared \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">배부른 상태에서 쇼핑하는 것은 슈퍼마켓이 당신을 위해 준비해 놓은 유혹에 당신이 저항하는 것을 훨씬 더 쉽게 만들 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 마지막 결론 문장으로, 앞에서 말한 '배고프면 더 많이 사게 된다'는 문제에 대한 해결책을 다시 정리합니다. \u003cb class=\"key\">배부른 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에서 쇼핑하면 슈퍼마켓이 준비해 놓은 \u003cb class=\"key\">유혹\u003c/b>을 이겨내기가 훨씬 수월해진다는 뜻이에요. 즉 글쓴이는 '큰 식사 후에 장을 보라'는 조언을 이 문장으로 마무리하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [동명사 Shopping] + [동사 will make] : \"쇼핑하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 while의 부사절\u003c/span> : while + [주어 you] + [동사 are] (~하는 동안) : \"당신이 배부른 상태인 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">가목적어 it과 진목적어 to부정사(5형식)\u003c/span> : make + [가목적어 it] + [목적격보어 easier] + [for + 목적격 you] + [to부정사(진목적어)] : \"당신이 저항하는 것을 훨씬 더 쉽게 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략 + 현재완료\u003c/span> : [선행사 the temptations] + [목적격 관계대명사 which/that 생략] + [주어 the supermarket] + [has prepared] : \"슈퍼마켓이 당신을 위해 준비해 놓은 유혹\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Shopping, 쇼핑하는 것은. while you're full, 당신이 배부른 상태인 동안. will make it a lot easier for you, 당신에게 그것을 훨씬 더 쉽게 만들 것이다. to resist the temptations, 유혹에 저항하는 것을. the supermarket has prepared for you, 슈퍼마켓이 당신을 위해 준비해 놓은. 이 문장 전체를 해석하면, 배부른 상태에서 쇼핑하는 것은 슈퍼마켓이 당신을 위해 준비해 놓은 유혹에 당신이 저항하는 것을 훨씬 더 쉽게 만들 것이다.","hl":"m"},{"n":31,"text":"이 문장은 글의 마지막 결론이에요. 배부른 상태에서 쇼핑하면 슈퍼마켓이 준비해 놓은 유혹에 저항하기가 훨씬 쉬워진다고 말하고 있죠. 그래서 글쓴이는 큰 식사를 한 뒤에 장을 보라고 조언하는 거예요.","hl":"mn"},{"n":32,"text":"첫 번째, Shopping은 문장의 주어로 쓰인 동명사예요. 쇼핑하는 행위 자체를 주어로 만든 것이죠. 두 번째, while you're full은 배부른 상태인 동안이라는 뜻으로 시간을 나타내는 부사절이에요. 세 번째, will make it a lot easier for you to resist에서 it은 가목적어이고 진짜 목적어는 to resist 이하의 to부정사구예요. 그래서 해석할 때 it 자리에 to부정사 내용을 넣어 읽어요. 네 번째, the temptations 뒤에는 목적격 관계대명사가 생략되어 있어서 슈퍼마켓이 당신을 위해 준비해 놓은 유혹이라는 뜻이 되고, has prepared는 현재완료로 지금까지 준비해 온 상태를 보여 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>슈퍼마켓 입구의 갓 구운 빵 \u003cb class=\"key\">냄새\u003c/b>는 손님을 배고프게 만들어 구매 욕구를 자극한다.\u003c/li>\u003cli>가게는 손님이 배고플 때 더 많은 돈을 쓴다는 것을 알고 \u003cb class=\"key\">허기\u003c/b>를 자극하는 냄새를 활용한다.\u003c/li>\u003cli>배고픔은 계획에 없던 물건에 관심을 갖게 해 결국 \u003cb class=\"key\">지갑\u003c/b>이 비고 불필요한 식료품만 남게 한다.\u003c/li>\u003cli>이를 막는 가장 현명한 방법은 \u003cb class=\"key\">배부른 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에서 장을 보아 유혹에 저항하는 것이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>To avoid impulse buying, you should do your grocery shopping after a big meal, because the hunger created by the store's smells makes you spend more money.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">슈퍼마켓 입구의 갓 구운 빵 냄새는 손님을 배고프게 해 \u003cb class=\"key\">충동 \u003c/b>\u003cb class=\"key\">구매\u003c/b>를 유도한다. 배고픔은 계획에 없던 지출을 늘리므로, \u003cb class=\"key\">식사를 \u003c/b>\u003cb class=\"key\">충분히 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">뒤\u003c/b> 장을 보는 것이 유혹에 저항하는 현명한 방법이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글의 핵심은 아주 단순합니다. 냄새가 배고픔을 만들고, 배고픔이 지출을 늘리니까 식사 후에 장을 보라는 거죠. 여러분도 다음에 마트에 갈 때는 꼭 배를 채우고 가 보세요. 오늘 수업도 여기까지입니다. 수고했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
