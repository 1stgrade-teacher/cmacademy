<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 3강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 3강 적용독해02","audioDir":"3-02_audio","preview":false,"count":27,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">3강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Social Class Determined Survival on the Titanic\u003c/h1>\u003ch2>사회적 계층이 결정한 타이타닉의 생존\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 1912년 타이타닉 침몰 당시 구명보트가 부족하자, 생존 여부는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">계층\u003c/b>에 따라 갈렸다. 1등 칸 승객은 구명보트 탈 \u003cb class=\"key\">기회\u003c/b>를 얻었지만 3등 칸 승객은 \u003cb class=\"key\">갑판 \u003c/b>\u003cb class=\"key\">밑\u003c/b>에 남으라는 명령을 받았고, 사망률도 계층별로 크게 달랐다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>During the Titanic disaster, survival was determined by social class, as first-class passengers had far greater access to lifeboats than third-class passengers.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 타이타닉호의 침몰과 생존을 가른 사회적 계층에 관한 지문을 함께 읽어 볼 거예요. 이 글은 구명보트가 부족한 상황에서 누가 살아남고 누가 죽을지가 사회적 계층에 따라 결정되었다고 말하죠. 다시 말해 당시 재난 속에서도 생존 기회와 대우가 계층에 따라 크게 달라졌다는 것이 이 글의 요지예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">1912년 타이타닉호는 당시 최대 규모의 여객선이었지만, 침몰 당시 \u003cb class=\"key\">구명보트\u003c/b> 수가 승객 전원을 태우기에 턱없이 부족했습니다. 이런 재난 상황에서는 누구를 먼저 구조할지 정하는 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">우선순위\u003c/b>가 생기고, 이는 당시의 사회적 가치와 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">계층\u003c/b>(social class)을 반영하기 쉽습니다. 1등 칸 승객은 더 좋은 객실과 접근 권한을 가진 상류층이었고, 3등 칸 승객은 이민자와 노동자 등 상대적으로 힘없는 사람들이 많았습니다. 오늘날에도 공연장의 VIP석과 일반석처럼 좌석 등급에 따라 \u003cb class=\"key\">기회\u003c/b>와 대우가 달라지는 경우가 있습니다. 이 글은 타이타닉 참사의 구체적 수치를 통해 계층에 따른 차별적 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">기회\u003c/b>를 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경을 조금 알아볼게요. 천구백십이 년 당시 타이타닉호는 최대 규모의 여객선이었지만, 침몰할 때 구명보트 수가 모든 승객을 태우기에 턱없이 부족했어요. 이런 재난에서는 누구를 먼저 구조할지 정하는 생존 우선순위가 생기고, 그것은 당시의 사회적 가치와 사회적 계층을 반영하기 쉬워요. first-class 승객은 더 좋은 객실과 접근 권한을 가진 상류층이었고, third-class 승객은 이민자와 노동자가 많았죠. 오늘날에도 공연장의 VIP석과 일반석처럼 등급에 따라 기회와 대우가 달라지는 것과 비슷해요. 이 글은 타이타닉 참사의 구체적 수치로 계층에 따른 차별적 생존 기회를 보여 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>타이타닉 침몰과 선택\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>1912년 어느 날 밤, 타이타닉호가 대서양에 가라앉았다. 이용할 수 있는 \u003cb class=\"key\">구명보트\u003c/b>의 수가 매우 적었기 때문에, \u003cb class=\"key\">승무원\u003c/b>들은 누가 살아남고 누가 죽을지를 결정해야 했다. 이 대목은 재난의 상황과 선택의 필요성을 제시하는 도입이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>예상을 뒤집은 기준\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>당신이 기대하는 것과 반대로, 그 결정은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">계층\u003c/b>을 바탕으로 이루어졌다. 이 문장은 통념을 뒤집으며 글의 주제를 드러내는 전환점이다. 생존 여부가 능력이나 운이 아니라 \u003cb class=\"key\">계층\u003c/b>에 의해 갈릴 수 있음을 암시한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>계층별 생존율\u003csmall>근거 · 문장 4\u003c/small>\u003c/h4>\u003cp>배에 타고 있던 1,500명의 승객 중, 1등 칸 승객은 3퍼센트만 물에 빠져 죽은 반면, 2등 칸은 16퍼센트, 3등 칸 승객의 45퍼센트가 차가운 바닷물에서 죽었다. 구체적인 수치가 \u003cb class=\"key\">계층별 \u003c/b>\u003cb class=\"key\">생존율\u003c/b>의 차이를 분명히 보여 준다. 이는 앞의 주제를 뒷받침하는 \u003cb class=\"key\">근거\u003c/b>에 해당한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>기회와 명령의 차이\u003csmall>예시 · 문장 5\u003c/small>\u003c/h4>\u003cp>모든 1등 칸 승객에게는 \u003cb class=\"key\">구명보트\u003c/b>를 탈 기회가 주어졌지만, 3등 칸에 있던 사람들은 \u003cb class=\"key\">갑판 \u003c/b>\u003cb class=\"key\">밑\u003c/b>에 그대로 있으라는 명령을 받았다. 일부는 총구가 겨눠진 채로 그 명령을 따라야 했다. 이 예시는 계층에 따른 \u003cb class=\"key\">차별적 \u003c/b>\u003cb class=\"key\">대우\u003c/b>를 극명하게 보여 준다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 지문의 흐름을 도입, 전환, 근거, 예시의 순서로 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 천구백십이 년 어느 날 밤, Titanic이 Atlantic Ocean에 가라앉았죠. 구명보트 수가 매우 적었기 때문에 승무원들은 누가 살아남고 누가 죽을지를 결정해야 했어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 예상을 뒤집는 전환이에요. 여러분이 기대하는 것과 반대로, 그 결정은 사회적 계층을 바탕으로 이루어졌죠. 여기서 social class, 즉 사회적 계층이 핵심 기준으로 등장해요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 계층별 생존율이라는 근거를 보여 줘요. 배에 타고 있던 천오백 명의 승객 중에서 first-class 승객은 삼 퍼센트만 익사했고, second-class는 십육 퍼센트, third-class 승객은 사십오 퍼센트가 차가운 바닷물에서 죽었어요. 이 수치는 계층에 따라 생존 가능성이 얼마나 달랐는지를 분명히 보여 주죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 구체적인 예시이자 결론이에요. first-class 구역의 모든 승객에게는 구명보트를 탈 기회가 주어졌어요. 하지만 third-class 구역에 있던 사람들은 갑판 밑에 그대로 있으라는 명령을 받았고, 일부는 at gunpoint, 즉 총구가 겨눠진 채였죠. 같은 배 안에서도 대우가 이렇게 달랐다는 점이 이 글의 충격적인 메시지예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 사건의 배경을 제시한 뒤 사회적 계층에 따른 생존 차이를 \u003cb class=\"key\">비교·대조\u003c/b>하는 방식으로 전개된다. 처음 두 문장은 타이타닉 침몰과 구명보트 부족을 설명하고, 세 번째 문장에서 결정이 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">계층\u003c/b>에 기반했다는 주제를 제시한다. 이어서 네 번째와 다섯 번째 문장이 1등 칸과 3등 칸의 생존율과 대우를 \u003cb class=\"key\">대조\u003c/b>하며 근거를 제시한다. 따라서 주제문이 글 중간에 놓인 미괄식 구조로 판단할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Since (2)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>Contrary to (3)\u003c/b>\u003cspan>통념 반박·전환\u003c/span>\u003cb>Of (4)\u003c/b>\u003cspan>범위 제시\u003c/span>\u003cb>while (4)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>but (5)\u003c/b>\u003cspan>대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">social class\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">first-class passengers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">second-class\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">third-class passengers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">those in the third-class section\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>1등 칸 승객\u003c/th>\u003cth>3등 칸 승객\u003c/th>\u003c/tr>\u003ctr>\u003ctd>구명보트 탈 기회가 주어짐\u003c/td>\u003ctd>갑판 밑에 머물라는 명령을 받음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>익사율 3퍼센트\u003c/td>\u003ctd>사망률 45퍼센트\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상대적으로 나은 대우\u003c/td>\u003ctd>총구가 겨눠진 채 통제됨\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 비교와 대조의 전개 방식을 사용해요. 처음 두 문장은 타이타닉 침몰과 구명보트 부족이라는 상황을 제시하고, 세 번째 문장에서 생존 결정이 사회적 계층에 기반했다는 주제를 던지죠. 이어서 네 번째와 다섯 번째 문장이 first-class와 third-class의 생존율과 대우를 대조하며 근거를 대요. 그래서 주제문이 글 중간에 놓인 미괄식 구조로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 두 번째 문장의 Since가 구명보트 부족이라는 원인을 이끌고, 세 번째 문장의 Contrary to what you might expect가 통념을 반박하며 전환을 만들어요. 네 번째 문장의 while과 다섯 번째 문장의 but은 계층 간 대조를 분명히 드러내죠. 또 the decision과 based on social class처럼 결정과 기준을 이어 주는 재진술도 놓치지 마세요. 이런 신호어를 따라가면 글의 주제와 근거가 쉽게 연결됩니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>sink\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가라앉다\u003c/span>\u003c/div>\u003cdiv>\u003cb>the number of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 수\u003c/span>\u003c/div>\u003cdiv>\u003cb>lifeboat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구명보트\u003c/span>\u003c/div>\u003cdiv>\u003cb>available\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이용할 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>crew\u003c/b>\u003cem>명사\u003c/em>\u003cspan>승무원\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>survive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>살아남다\u003c/span>\u003c/div>\u003cdiv>\u003cb>die\u003c/b>\u003cem>동사\u003c/em>\u003cspan>죽다\u003c/span>\u003c/div>\u003cdiv>\u003cb>contrary to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 반대로\u003c/span>\u003c/div>\u003cdiv>\u003cb>expect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>decision\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결정\u003c/span>\u003c/div>\u003cdiv>\u003cb>be based on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 근거하다, ~을 바탕으로 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>social class\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회적 계층\u003c/span>\u003c/div>\u003cdiv>\u003cb>passenger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>승객\u003c/span>\u003c/div>\u003cdiv>\u003cb>on board\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>배에 타고 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>percent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>퍼센트, 백분율\u003c/span>\u003c/div>\u003cdiv>\u003cb>first-class\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>1등 칸의\u003c/span>\u003c/div>\u003cdiv>\u003cb>drown\u003c/b>\u003cem>동사\u003c/em>\u003cspan>익사하다, 물에 빠져 죽다\u003c/span>\u003c/div>\u003cdiv>\u003cb>while\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>반면에\u003c/span>\u003c/div>\u003cdiv>\u003cb>second-class\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>2등 칸의\u003c/span>\u003c/div>\u003cdiv>\u003cb>third-class\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>3등 칸의\u003c/span>\u003c/div>\u003cdiv>\u003cb>ice-cold\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>얼음처럼 차가운\u003c/span>\u003c/div>\u003cdiv>\u003cb>section\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구역, 칸\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>get into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 타다, ~에 들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>order\u003c/b>\u003cem>동사\u003c/em>\u003cspan>명령하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>머무르다, 남아 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>below deck\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>갑판 아래에\u003c/span>\u003c/div>\u003cdiv>\u003cb>at gunpoint\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>총구가 겨눠진 채로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어부터 짚어 볼게요. sink는 가라앉다, available은 이용할 수 있는, survive는 살아남다라는 뜻이고, be based on은 바탕으로 하다, drown은 익사하다로 기억해 두세요. opportunity는 기회, at gunpoint는 총구가 겨눠진 채로라는 표현이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">survive\u003c/b>\u003cspan class=\"m\">살아남다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">outlive\u003c/span>\u003cspan class=\"s\">endure\u003c/span>\u003cspan class=\"s\">remain alive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">die\u003c/span>\u003cspan class=\"a\">perish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">available\u003c/b>\u003cspan class=\"m\">이용할 수 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accessible\u003c/span>\u003cspan class=\"s\">obtainable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unavailable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contrary to\u003c/b>\u003cspan class=\"m\">~와 반대로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">opposite to\u003c/span>\u003cspan class=\"s\">in opposition to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">in accordance with\u003c/span>\u003cspan class=\"a\">consistent with\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expect\u003c/b>\u003cspan class=\"m\">기대하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">anticipate\u003c/span>\u003cspan class=\"s\">foresee\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">drown\u003c/b>\u003cspan class=\"m\">익사하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sink\u003c/span>\u003cspan class=\"s\">perish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rescue\u003c/span>\u003cspan class=\"a\">save\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">opportunity\u003c/b>\u003cspan class=\"m\">기회\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">chance\u003c/span>\u003cspan class=\"s\">occasion\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">order\u003c/b>\u003cspan class=\"m\">명령하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">command\u003c/span>\u003cspan class=\"s\">instruct\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forbid\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. survive는 outlive, endure와 가깝고 die, perish와 반대돼요. available은 accessible, obtainable과 비슷하고 unavailable과는 반대죠. decide는 determine, resolve로 바꿔 쓸 수 있고, opportunity는 chance, occasion과 가까워요. 이런 표현들을 묶어 기억하면 어휘 문제가 훨씬 쉬워집니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1912년 어느 날 밤,\u003c/span>\u003cspan class=\"en\">One night \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">1912\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">타이타닉 호가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Titanic\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가라앉았다, ...속으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">sank \u003c/span>\u003cspan class=\"tgt\">into\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대서양 속으로\u003c/span>\u003cspan class=\"en\">the Atlantic Ocean.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1912 년 어느 날 밤, 타이타닉 호가 대서양에 가라앉았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 타이타닉 호 침몰이라는 \u003cb class=\"key\">배경\u003c/b>을 먼저 깔아 주는 \u003cb class=\"key\">도입\u003c/b> 문장이에요. 이 사건을 \u003cb class=\"key\">출발점\u003c/b>으로 삼아, 뒤에서 누가 살아남았는지에 대한 이야기가 펼쳐지죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시점)\u003c/span> : [전치사 in] + [연도] → '~년에' : \"1912년에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">고유명사 앞의 정관사 the\u003c/span> : the + [선박·호텔 이름] : \"타이타닉 호\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">자동사 sink의 불규칙 과거형\u003c/span> : sink - sank - sunk + [전치사 into] : \"...속으로 가라앉았다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"One night in 1912, 1912년 어느 날 밤. the Titanic, 타이타닉 호가. sank into, 가라앉았다, ...속으로. the Atlantic Ocean, 대서양 속으로. 이 문장 전체를 해석하면, 1912 년 어느 날 밤, 타이타닉 호가 대서양에 가라앉았다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 배경을 여는 도입 문장이에요. 1912년 어느 날 밤 타이타닉 호가 대서양에 가라앉았다는 사실을 먼저 알려 주죠. 이 사건을 출발점으로 삼아서 뒤에서 누가 살아남았는지에 대한 이야기가 펼쳐져요.","hl":"mn"},{"n":14,"text":"먼저 in 1912에서 전치사 in은 연도 앞에 붙어서 천구백십이 년이라는 배경 시점을 만들어 줘요. 두 번째로 the Titanic을 보면 배 이름 같은 선박 이름 앞에는 정관사 the를 관례적으로 붙여요. 세 번째로 sank는 목적어를 갖지 않는 자동사 sink의 불규칙 과거형이라서 뒤에 into the Atlantic Ocean이 바로 이어지는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이용할 수 있는 구명보트의 수가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Since\u003c/span> the number of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">lifeboats \u003c/span>\u003cspan class=\"tgt\">available\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 적었기 때문에,\u003c/span>\u003cspan class=\"en\">was very small,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">승무원들은 결정해야 했다\u003c/span>\u003cspan class=\"en\">the crew \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">decide\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누가 살아남을지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">survive \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 누가 죽을지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">die\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이용할 수 있는 구명보트의 수가 매우 적었기 때문에, 승무원들은 누가 살아남고 누가 죽을지를 결정해야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 구명보트가 부족했다는 \u003cb class=\"key\">원인\u003c/b>과, 그래서 승무원이 생존자를 선택해야 했다는 \u003cb class=\"key\">결과\u003c/b>를 한 문장에 담았어요. 뒤에 나올 '사회적 계층에 따른 차별'의 \u003cb class=\"key\">근거\u003c/b>가 되어 주는 부분이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 since(이유)\u003c/span> : Since + [주어+동사(이유)], [주어+동사(결과)] : \"~때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 후치 수식\u003c/span> : [명사 lifeboats] + [형용사 available] : \"이용할 수 있는 구명보트\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 have to의 과거(의무)\u003c/span> : had to + [동사원형 decide] : \"결정해야 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">간접의문문과 병렬\u003c/span> : [의문사 who] + [주어] + [조동사 would] + [동사원형] : \"누가 살아남을지 그리고 누가 죽을지\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Since the number of lifeboats available, 이용할 수 있는 구명보트의 수가. was very small, 매우 적었기 때문에. the crew had to decide, 승무원들은 결정해야 했다. who would survive, 누가 살아남을지. and who would die, 그리고 누가 죽을지를. 이 문장 전체를 해석하면, 이용할 수 있는 구명보트의 수가 매우 적었기 때문에, 승무원들은 누가 살아남고 누가 죽을지를 결정해야 했다.","hl":"m"},{"n":16,"text":"구명보트가 부족했다는 원인과, 그래서 승무원들이 생존자를 선택해야 했다는 결과를 한 문장에 담았어요. 뒤에 나올 사회적 계층에 따른 차별의 근거가 되는 부분이죠. 그래서 이 문장은 글의 논리를 받쳐 주는 아주 중요한 뼈대예요.","hl":"mn"},{"n":17,"text":"첫 번째로 Since는 ~때문에라는 이유를 이끄는 접속사예요. 앞에는 원인, 뒤에는 결과가 오는 구조죠. 두 번째로 lifeboats available을 보면 available 같은 형용사가 명사 뒤에서 후치 수식으로 꾸며 주고 있어요. 세 번째로 had to decide는 have to의 과거형으로 결정해야 했다는 의무를 나타내죠. 네 번째로 who would survive and who would die는 decide의 목적어로 들어간 간접의문문이고, 두 의문사절이 병렬로 연결된 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반대로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Contrary \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 기대하는 것과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">expect\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 결정은\u003c/span>\u003cspan class=\"en\">the decision\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바탕으로 이루어졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">based \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회적 계층을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">class\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 기대하는 것과 반대로, 그 결정은 사회적 계층을 바탕으로 이루어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 흐름을 뒤집는 \u003cb class=\"key\">반전\u003c/b>을 만들어 주는 문장이에요. 독자가 예상하는 것과 반대로 결정 기준이 '사회적 계층'이었다고 말하면서 이 글의 \u003cb class=\"key\">주제\u003c/b>를 또렷하게 드러내죠. 그래서 뒤 문장들을 묶어 주는 중심축 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 관용표현 contrary to\u003c/span> : contrary to + [명사 / 의문사절] → '~와 반대로' : \"~와 반대로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what(선행사 포함 명사절)\u003c/span> : what + [주어 you] + [조동사 might] + [동사원형 expect] : \"당신이 기대할지도 모르는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be based on의 수동태\u003c/span> : be + [과거분사 based] + on + [명사] : \"~을 바탕으로 이루어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">복합명사\u003c/span> : [형용사 social] + [명사 class] → 하나의 명사 : \"사회적 계층\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Contrary to, 반대로. what you might expect, 당신이 기대하는 것과. the decision, 그 결정은. was based on, 바탕으로 이루어졌다. social class, 사회적 계층을. 이 문장 전체를 해석하면, 당신이 기대하는 것과 반대로, 그 결정은 사회적 계층을 바탕으로 이루어졌다.","hl":"m"},{"n":19,"text":"앞 문장의 내용을 뒤집는 반전을 만들어 주는 문장이에요. 독자가 예상하는 것과 반대로 결정 기준이 사회적 계층이었다고 말하면서 이 글의 주제를 드러내죠. 그래서 이 문장이 글 전체의 중심축이 되는 거예요.","hl":"mn"},{"n":20,"text":"첫 번째로 Contrary to는 ~와 반대라는 뜻의 전치사구예요. 뒤에 명사나 의문사절이 와서 짝을 이루죠. 두 번째로 what you might expect에서 what은 선행사를 품은 관계대명사라서 절 전체가 to의 목적어가 되고, might는 추측의 조동사로 쓰였어요. 세 번째로 was based on은 ~을 바탕으로 이루어졌다는 관용적 수동태이고, 근거가 주어졌다는 수동의 느낌을 담고 있죠. 네 번째로 social class는 하나로 굳어진 복합명사로, 뒤에 나오는 계급 표현들을 묶어 주는 핵심어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배에 타고 있던 1,500명의 승객 중,\u003c/span>\u003cspan class=\"en\">Of the 1,500 passengers \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">board\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1등 칸 승객은 3퍼센트만 물에 빠져 죽었다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">percent \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">first-class \u003c/span>\u003cspan class=\"tgt\">passengers \u003c/span>\u003cspan class=\"tgt\">drowned\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면 2등 칸은 16퍼센트,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">16 \u003c/span>\u003cspan class=\"tgt\">percent \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">second-class\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 3등 칸 승객의 45퍼센트가 죽었다\u003c/span>\u003cspan class=\"en\">and 45 percent of the third-class passengers died\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차가운 바닷물에서.\u003c/span>\u003cspan class=\"en\">in the ice-cold water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">배에 타고 있던 1 , 500 명의 승객 중, 1 등 칸 승객은 3 %만 물에 빠져 죽은 반면, 2 등 칸은 16 %, 3 등 칸 승객의 45 %가 차가운 바닷물에서 죽었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 '사회적 계층에 따른 결정'이 실제로 얼마나 처참했는지를 숫자로 증명하는 문장입니다. 3퍼센트, 16퍼센트, 45퍼센트를 계단처럼 늘어놓아 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">계층\u003c/b>이 곧 생존을 갈랐음을 보여 주죠. while은 앞뒤 수치를 \u003cb class=\"key\">대조\u003c/b>로 이어 주는 신호어입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현(on board)\u003c/span> : [명사] + on board = 탈것 [[안에 타고 있다]] : \"배에 타고 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">percent of + 명사의 수 일치\u003c/span> : [숫자] percent of + [복수명사] + [복수 동사] : \"1등 칸 승객은 3퍼센트만 익사했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 while(대조)\u003c/span> : [문장] + while + [문장] = …인 반면 …이다 : \"반면 2등 칸은 16퍼센트\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Of the 1,500 passengers on board, 배에 타고 있던 1,500명의 승객 중. only three percent of the first-class passengers drowned, 1등 칸 승객은 3퍼센트만 물에 빠져 죽었다. while 16 percent of the second-class, 반면 2등 칸은 16퍼센트. and 45 percent of the third-class passengers died, 그리고 3등 칸 승객의 45퍼센트가 죽었다. in the ice-cold water, 차가운 바닷물에서.. 이 문장 전체를 해석하면, 배에 타고 있던 1 , 500 명의 승객 중, 1 등 칸 승객은 3 %만 물에 빠져 죽은 반면, 2 등 칸은 16 %, 3 등 칸 승객의 45 %가 차가운 바닷물에서 죽었다.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 말한 사회적 계층에 따른 결정이 실제로 얼마나 처참했는지를 숫자로 보여 줍니다. 일등 칸은 삼 퍼센트만 죽었는데 이등 칸은 십육 퍼센트, 삼등 칸은 사십오 퍼센트가 죽었으니 격차가 아주 크죠. while이 앞뒤 수치를 대조로 이어 주면서 그 차이를 더 선명하게 만들어 줍니다.","hl":"mn"},{"n":23,"text":"첫 번째, on board는 배 위가 아니라 탈것 안에 타고 있다는 관용 표현이에요. 그래서 the passengers on board는 배에 타고 있던 승객들이라고 해석합니다. 두 번째, three percent of the passengers에서 동사의 수는 of 뒤 명사에 맞춰요. passengers가 복수니까 동사도 복수형 drowned가 되는 겁니다. 세 번째, while은 여기서 반면에라는 뜻으로 앞뒤 숫자를 대조하는 접속사예요. 삼 퍼센트와 십육 퍼센트, 사십오 퍼센트를 나란히 놓아 주는 신호라고 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 1등 칸 승객에게는\u003c/span>\u003cspan class=\"en\">All the passengers in the first-class section\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구명보트를 탈 기회가 주어졌다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">given \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">opportunity \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lifeboat\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 3등 칸에 있던 사람들은\u003c/span>\u003cspan class=\"en\">but those in the third-class section\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑판 밑에 그대로 있으라는 명령을 받았다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">ordered \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stay \u003c/span>\u003cspan class=\"tgt\">below \u003c/span>\u003cspan class=\"tgt\">deck\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일부는 총구가 겨눠진 채로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">gunpoint\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 1 등 칸 승객에게는 구명보트를 탈 기회가 주어졌지만, 3 등 칸에 있던 사람들은 갑판 밑에 그대로 있으라는 명령을 받았다, 일부는 총구가 겨눠진 채로.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 통계를 구체적인 장면으로 바꿔 보여 주는 문장입니다. 1등 칸 승객에게는 \u003cb class=\"key\">기회\u003c/b>가 주어졌지만 3등 칸 사람들은 \u003cb class=\"key\">갑판 \u003c/b>\u003cb class=\"key\">밑\u003c/b>에 머물라는 명령을 받았고, 일부는 총구까지 겨눠졌죠. 두 개의 수동태가 나란히 반복되면서 \u003cb class=\"key\">계층에 \u003c/b>\u003cb class=\"key\">따른 \u003c/b>\u003cb class=\"key\">차별\u003c/b>이 개인의 선택이 아니라 제도적으로 강제되었음을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 수동태(give + 간접목적어 + 직접목적어)\u003c/span> : [사람] be given + [사물] = [사람]에게 [사물]이 주어지다 : \"구명보트를 탈 기회가 주어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 opportunity] + to + [동사원형] = ~할 기회 : \"구명보트를 탈\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식 수동태(order + 목적어 + to부정사)\u003c/span> : [사람] be ordered + to + [동사원형] = ~하라는 명령을 받다 : \"갑판 밑에 그대로 있으라는 명령을 받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">분사구문(being 생략)\u003c/span> : [주어] + (being) + [전치사구] = ~한 상태로 : \"일부는 총구가 겨눠진 채로\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"All the passengers in the first-class section, 모든 1등 칸 승객에게는. were given the opportunity to get into a lifeboat, 구명보트를 탈 기회가 주어졌다. but those in the third-class section, 그러나 3등 칸에 있던 사람들은. were ordered to stay below deck, 갑판 밑에 그대로 있으라는 명령을 받았다. some of them at gunpoint, 일부는 총구가 겨눠진 채로.. 이 문장 전체를 해석하면, 모든 1 등 칸 승객에게는 구명보트를 탈 기회가 주어졌지만, 3 등 칸에 있던 사람들은 갑판 밑에 그대로 있으라는 명령을 받았다, 일부는 총구가 겨눠진 채로.","hl":"m"},{"n":25,"text":"이 문장은 앞의 통계를 아주 생생한 장면으로 바꿔 줍니다. 일등 칸 승객에게는 기회가 주어졌지만 삼등 칸 사람들은 갑판 밑에 머물라는 명령을 받았고, 일부는 총구까지 겨눠졌어요. 수동태가 두 번 나란히 반복되면서 계층에 따른 차별이 개인의 선택이 아니라 제도적으로 강제된 일이었음이 드러납니다.","hl":"mn"},{"n":26,"text":"첫 번째, were given은 give가 4형식이라서 만들어진 수동태예요. 사람인 간접목적어가 주어 자리로 올라간 형태죠. 두 번째, to get into a lifeboat에서 to부정사가 opportunity를 뒤에서 꾸며 주는 형용사적 용법으로 쓰였습니다. 추상명사 뒤에 잘 붙는 형태예요. 세 번째, were ordered to stay는 order가 5형식으로 쓰인 문장이 수동태가 된 모습이고요. 네 번째, some of them at gunpoint는 being이 생략된 분사구문으로, 일부가 총구가 겨눠진 상태라는 부대상황을 덧붙여 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>타이타닉호는 1912년 침몰했고, \u003cb class=\"key\">구명보트\u003c/b>가 부족해 승무원들은 누가 살아남을지 결정해야 했다.\u003c/li>\u003cli>당시 결정은 예상과 달리 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">계층\u003c/b>을 기준으로 이루어졌다.\u003c/li>\u003cli>1등 칸 승객의 익사율은 3퍼센트였지만 3등 칸 승객의 사망률은 45퍼센트로 훨씬 높았다.\u003c/li>\u003cli>1등 칸 승객은 구명보트 탈 \u003cb class=\"key\">기회\u003c/b>를 얻었지만 3등 칸 승객은 \u003cb class=\"key\">갑판 \u003c/b>\u003cb class=\"key\">밑\u003c/b>에 남으라는 명령을 받았다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>During the Titanic disaster, survival was determined by social class, as first-class passengers had far greater access to lifeboats than third-class passengers.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 1912년 타이타닉 침몰 당시 구명보트가 부족하자, 생존 여부는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">계층\u003c/b>에 따라 갈렸다. 1등 칸 승객은 구명보트 탈 \u003cb class=\"key\">기회\u003c/b>를 얻었지만 3등 칸 승객은 \u003cb class=\"key\">갑판 \u003c/b>\u003cb class=\"key\">밑\u003c/b>에 남으라는 명령을 받았고, 사망률도 계층별로 크게 달랐다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"정리해 볼게요. 타이타닉 침몰 당시 구명보트가 부족했고, 생존 여부는 사회적 계층에 따라 갈렸어요. first-class 승객은 구명보트를 탈 기회를 얻었지만 third-class 승객은 갑판 밑에 남아야 했고, 사망률도 훨씬 높았죠. 이 글은 재난 속에서도 사회적 계층이 생존 기회와 대우를 어떻게 갈랐는지 보여 줍니다. 오늘 수업은 여기까지예요, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
