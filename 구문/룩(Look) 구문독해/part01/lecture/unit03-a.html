ered\u003c/span>\u003cdiv class=\"w\">처음 만났다는 표현을 조금 더 고급스러운 단어로 바꿀 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">July 15th\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the 15th of July\u003c/span>\u003cspan class=\"y-eq\">July 15th = the 15th of July\u003c/span>\u003cdiv class=\"w\">날짜를 표현하는 방식을 다르게 바꿀 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The day on which I first met her was the 15th of July.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"내 기억 속에 특별한 그녀를 처음으로 마주했던 그 기념비적인 날이 바로 7월 15일이었다는 추억을 전하고 있어요.","hl":"mn"},{"n":24,"text":"여기서 관계부사 when은 전치사 and 관계대명사인 on which로 바꾸어 쓸 수 있어요.","hl":"rw"},{"n":25,"text":"first met은 initially encountered로 바꿀 수 있고 July 15th는 the 15th of July로 표현을 바꿀 수 있어요.","hl":"ph"},{"n":26,"text":"이 문장은 The day on which I first met her was the 15th of July라고 세련되게 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 9\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">\u003cspan class=\"fx\">The house where he lives\u003c/span> is very large.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The house\u003c/div>\u003cdiv class=\"k\">그 집은\u003c/div>\u003cdiv class=\"e\">where he lives\u003c/div>\u003cdiv class=\"k\">그가 살고 있는\u003c/div>\u003cdiv class=\"e\">is very large.\u003c/div>\u003cdiv class=\"k\">매우 크다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 \u003cb class=\"key\">The house\u003c/b>가 \u003cb class=\"key\">장소의 관계부사절 where ~: 완전한 절\u003c/b>의 수식을 받아 주어가 길어졌습니다.\u003c/div>","segs":[{"n":27,"text":"The house, 그 집은. where he lives, 그가 살고 있는. is very large, 매우 크다.","hl":"ch"},{"n":28,"text":"다섯 번째 문장이에요. 선행사 The house 뒤에 완전한 절이 오는 장소의 관계부사절 where he lives가 붙어 주어를 수식하고 있죠.","hl":"st"}]},{" \">waves dance = ocean waves move rhythmically\u003c/span>\u003cdiv class=\"w\">파도가 춤춘다는 시적 표현을 리드미컬하게 움직인다는 설명으로 바꿀 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is romantic\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is poetic and dreamy\u003c/span>\u003cspan class=\"y-eq\">is romantic = is poetic and dreamy\u003c/span>\u003cdiv class=\"w\">로맨틱하다는 의미를 시적이고몽환적이라고 구체화할 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The idea of waves dancing is poetic and dreamy.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"차가운 바다의 파도가 마치 살아 움직이며 춤을 춘다고 상상하는 그 감성적인 생각 자체가 참 낭만적이라는 뜻이에요.","hl":"mn"},{"n":36,"text":"여기서 that절은 of를 이용한 명사구 형태로 바꾸어 문장을 더욱 간결하게 만들 수 있어요.","hl":"rw"},{"n":37,"text":"waves dance는 ocean waves move rhythmically로 바꾸고 is romantic은 is poetic and dreamy로 바꿀 수 있어요.","hl":"ph"},{"n":38,"text":"이 문장을 The idea of waves dancing is poetic and dreamy라고 바꾸어 표현하면 감성이 더 살아나요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 9\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">\u003cspan class=\"fx\">The fact that she bought a sports car\u003c/span> doesn't matter.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The fact\u003c/div>\u003cdiv class=\"k\">그 사실은\u003c/div>\u003cdiv class=\"e\">that she bought a sports car\u003c/div>\u003cdiv class=\"k\">그녀가 스포츠카를 샀다는\u003c/div>\u003cdiv class=\"e\">doesn't matter.\u003c/div>\u003cdiv class=\"k\">중요하지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>추상명사 \u003cb class=\"key\">The fact\u003c/b>가 \u003cb class=\"key\">동격의 that절 (~라는 사실)\u003c/b>의 수식을 받으며, 주어가 단수이므로 단수동사 \u003cb class=\"key\">doesn't matter\u003c/b>가 쓰였습니다.\u003c/div>","segs":[{"n":39,"text":"The fact, 그 사실은. that she bought a spor   /* 구문 강의 끝의 '구문 연습': ① 끊어읽기(/) → ② 의미덩어리 해석 쓰기 → ③ 덩어리 배열 또는 빈칸 채우기 */
  function s(x){return x==null?"":String(x);}

  function words(t){t=clean(t);return t?t.split(" "):[];}
  function key(w){return clean(w).toLowerCase().replace(/^[^a-z0-9']+|[^a-z0-9']+$/g,"");}

  /* 문장 하나를 연습 문제로: 단어 목록, 모범 끊는 자리(단어 번호 뒤), 덩어리, 빈칸 덩어리 */
  function item(x,i,mode){

    if(ch.length<2)return null;
    var W=[],cut={},wc=[];ch.forEach(function(c,k){var w=words(c.en);wc.push([W.length,W.length+w.length]);W=W.concat(w);if(k<ch.length-1)cut[W.length-1]=1;});
    if(W.length<3)return null;
    var ko=clean(x.ko)||ch.map(function(c){return c.ko;}).join(" "),natural=!!clean(x.ko);
    /* 빈칸 덩어리: 첫 덩어리가 아니고 2~6단어인 덩어리, 강조 구문과 겹치면 우선 */
    var fw=words(x.focus).map(key),best=-1,bs=-1;
    ch.forEach(function(c,k){var n=wc[k][1]-wc[k][0];if(n<1||n>7)return;var sc=(k>0?10:0)+(n>=2&&n<=6?5:0)+Math.min(n,4);
      for(var q=wc[k][0];q<wc[k][1];q++)if(fw.indexOf(key(W[q]))>=0){sc+=3;break;}if(sc>bs){bs=sc;best=k;}});
    var kind=mode==="order"?"order":mode==="blank"?"blank":(i%2===0?"order":"blank");
    if(kind==="order"&&ch.length<3&&best>=0)kind="blank";if(kind==="blank"&&best<0)kind="order";
    return {n:i+1,W:W,cut:cut,ch:ch,wc:wc,ko:ko,natural:natural,kind:kind,blank:best};

        if(k<0||k>=it.W.length-1)return;if(me[k])delete me[k];else me[k]=1;paint();};

        var hit=0,extra=0,miss=0,mine={},model={};for(var k in it.cut){if(me[k]){hit++;mine[k]="ok";}else{miss++;model[k]="miss";}model[k]=model[k]||"model";}
