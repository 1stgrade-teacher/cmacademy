ass=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>He must be crazy \u003cspan class=\"fx\">to go out in this harsh weather\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>The man was \u003cspan class=\"fx\">brave enough to catch\u003c/span> the thief.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>Irene was \u003cspan class=\"fx\">too busy to clean\u003c/span> the room for a week.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"부사적 수식어는 문장에서 시간, 장소, 이유, 목적 등을 나타내며 문장을 더 구체적으로 만들어 줘요. 특히 전치사구와 다양한 to부정사 용법을 잘 익혀 두면 복잡한 문장도 쉽게 해결할 수 있답니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 9\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">The big tree stands \u003cspan class=\"fx\">on the hill\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The big tree stands\u003c/div>\u003cdiv class=\"k\">그 커다란 나무가 서 있다\u003c/div>\u003cdiv class=\"e\">on the hill.\u003c/div>\u003cdiv class=\"k\">언덕 위에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">전치사구\u003c/b>(on the hill)가 동사(stands)를 수식하는 부사 역할\u003c/div>","segs":[{"n":3,"text":"The big tree stands, 그 커다란 나무가 서 있다. on the hill, 언덕 위에","hl":"ch"},{"n":4,"text":"첫 번째 문장을 보면 on the hill이라는 전치사구가 동사인 stands를 수식해서 부사 역할을 하고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 9\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">The big tree stands \u003cspan class=\"fx\">on the hill\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>나무가 어디에 서 있는지 장소를 구체적으로 설명해 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">on the hill\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">upon the hill\u003c/span>\u003cdiv class=\"w\">on 대신 upon을 쓰면 조금 더 격식 있는 느낌을 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stand\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be located\u003c/span>\u003cspan class=\"y-eq\">stand = be located\u003c/span>\u003cdiv class=\"w\">서 있다라는 의미를 위치해 있다라는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">on the hill\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at the top of the hill\u003c/span>\u003cdiv class=\"w\">언덕 위라는 장소를 언덕 꼭대기라는 표현으로 구체화했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The big tree is located on the hill.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"나무가 있는 장소를 구체적으로 나타내며 문장의 배경을 설명해 주죠.","hl":"mn"},{"n":6,"text":"on the hill을 upon the hill로 바꾸면 조금 더 고급스러운 표현이 돼요.","hl":"rw"},{"n":7,"text":"stand를 be located로 바꾸어 쓸 수 있고, on the hill을 at the top of the hill로 바꾸어 표현할 수도 있어요.","hl":"ph"},{"n":8,"text":"The big tree is located on the hill이라고 쓰면 뜻이 똑같은 멋진 문장이 됩니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 9\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">We can send messages by phone \u003cspan class=\"fx\">with ease\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We can send messages\u003c/div>\u003cdiv class=\"k\">우리는 메시지를 보낼 수 있다\u003c/div>\u003cdiv class=\"e\">by phone\u003c/div>\u003cdiv class=\"k\">전화로\u003c/div>\u003cdiv class=\"e\">with ease.\u003c/div>\u003cdiv class=\"k\">쉽게\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class= refully로 바꿀 수 있다는 점을 꼭 기억해 두세요.","hl":"ph"},{"n":14,"text":"We can send messages by phone easily라고 쓰면 원래 문장과 완전히 같은 뜻이 됩니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 9\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">\u003cspan class=\"fx\">Because he was sick\u003c/span>, he didn't go to school.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Because he was sick,\u003c/div>\u003cdiv class=\"k\">그가 아팠기 때문에\u003c/div>\u003cdiv class=\"e\">he didn't go\u003c/div>\u003cdiv class=\"k\">그는 가지 않았다\u003c/div>\u003cdiv class=\"e\">to school.\u003c/div>\u003cdiv class=\"k\">학교에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">이유의 부사절\u003c/b>(Because ~)이 주절을 수식하며, 부사절이 앞에 오면 쉼표 표기\u003c/div>","segs":[{"n":15,"text":"Because he was sick, 그가 아팠기 때문에. he didn't go, 그는 가지 않았다. to school, 학교에","hl":"ch"},{"n":16,"text":"세 번째 문장은 Because he was sick이라는 이유의 부사절이 주절을 수식하고 있어요. 부사절이 앞에 올 때는 반드시 쉼표를 찍어야 한답니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 9\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">\u003cspan class=\"fx\">Because he was sick\u003c/span>, he didn't go to school.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>학교에 가지 못한 명확한 이유가 몸이 아팠기 때문임을 나타냅니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Because he was sick\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Since he was sick\u003c/span>\u003cdiv class=\"w\">Because를 의미가 비슷한 접속사 Since로 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">because\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">since\u003c/span>\u003cspan class=\"y-eq\">because = since\u003c/span>\u003cdiv class=\"w\">이유를 나타내는 접속사를 동의어로 교체했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">go to school\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">attend school\u003c/span>\u003cspan class=\"y-eq\">go to school = attend school\u003c/span>\u003cdiv class=\"w\">학교에 가다라는 표현을 등교하다라는 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Since he was sick, he didn't go to school.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"그가 결석한 이유가 아팠기 때문이라는 인과관계를 아주 명확하게 보여 주죠.","hl":"mn"},{"n":18,"text":"Because를 Since로 바꾸어 써도 같은 이유를 나타낼 수 있어요.","hl":"rw"},{"n":19,"text":"because는 since로 바꿀 수 있고, go to school은 attend school로 바꿔 쓸 수 있어요.","hl":"ph"},{"n":20,"text":"Since he was sick, he didn't go to school이라고 쓰면 똑같은 의미의 문장이 완성됩니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 9\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">I went out \u003cspan class=\"fx\">to buy some bread\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I went out\u003c/div>\u003cdiv class=\"k\">나는 나갔다\u003c/div>\u003cdiv class=\"e\">to buy\u003c/div>\u003cdiv class=\"k\">사기 위해서\u003c/div>\u003cdiv class=\"e\">some bread.\u003c/div>\u003cdiv class=\"k\">빵을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">to부정사 부사적 용법\u003c/b>(목적: ~하기 위해서)으로 쓰임\u003c/div>","segs":[{"n":21,"text":"I went out, 나는 나갔다. to buy, 사기 위해서. some bread, 빵을","hl":"ch"},{"n":22,"text":"네 번째 문장의 to buy는 to부정사 부사적 용법 중에서도 목적을 나타내어 ~하기 위해서라고 해석해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 9     root.querySelector(".pq-x").onclick=close;
    document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest('[data-act="synpractice"]');if(t){e.preventDefault();open();}});
    var top=document.querySelector(".lp-top");if(top){var b=document.createElement("button");b.className="pq-open";b.type="button";b.setAttribute("data-act","synpractice");b.textContent="✎ 구문 연습";top.appendChild(b);}
    function start(only){S.list=only||L;S.idx=0;S.step=0;S.res=S.list.map(function(){return {cut:null,last:null};});draw();}
    S.res=L.map(function(){return {cut:null,last:null};});
    var STEPS=["끊어읽기","덩어리 해석","배열·빈칸"];
    function head(it,q){var n=S.list.length;
      return '<div class="pq-pill">'+(S.idx+1)+' / '+n+'</div><ol class="sy-steps">'+STEPS.map(function(t,k){return '<li class="'+(k===S.step?"on":k<S.step?"done":"")+'"><span>'+(k+1)+'</span>'+(k===2?(it.kind==="order"?"배열하기":"빈칸 채우기"):t)+'</li>';}).join("")+'</ol><h2 class="pq-q">'+q+'</h2>';}
    function foot(btn,next){return '<div class="pq-res" hidden></div><div class="pq-foot"><button class="pq-btn sy-main" type="button">'+btn+'</button><button class="pq-btn sy-next" type="button" hidden>'+next+'</button><span class="sy-key">Enter</span></div>';}
    function nextLabel(){return S.step<2?"다음 단계 →":(S.idx<S.list.length-1?"다음 문장 →":"결과 보기");}
    function go(){if(S.step<2)S.step++;else{S.step=0;S.idx++;}draw();root.scrollTop=0;}
    var ENTER=null;
    function bindEnter(fn){ENTER=fn;}
    function onKey(e){if(root.hidden||!ENTER||e.key!=="Enter"||e.shiftKey||e.isComposing||e.keyCode===229)return;var t=e.target&&e.target.tagName;if(t==="BUTTON"||t==="SELECT"||t==="TEXTAREA")return;e.preventDefault();ENTER();}
    root.addEventListener("keydown",onKey);document.addEventListener("keydown",function(e){if(!root.contains(e.target))onKey(e);});
    function draw(){
      if(S.idx>=S.list.length){summary();return;}
      var it=S.list[S.idx];
      if(S.step===0)stepCut(it);else if(S.step===1)stepKo(it);else if(it.kind==="order")stepOrder(it);else stepBlank(it);
      var f=main.querySelector("input.sy-in,.sy-ko textarea");if(f)setTimeout(function(){try{f.focus();}catch(_){}},30);else{try{document.activeElement&&document.activeElement.blur&&document.activeElement.blur();}catch(_){}}
    }
    /* 문장을 끊는 표시(/)와 함께 그리기. marks: {단어번호:종류} 종류 = ok / no(내가 잘못 끊음) / miss(놓친 자리) / me / model */
    function sent(it,marks,cls){var h='<div class="sy-sen '+(cls||"")+'">';
      it.W.forEach(function(w,k){h+='<span class="sy-w" data-k="'+k+'">'+esc(w)+'</span>';
        if(k<it.W.length-1)h+='<span class="sy-g'+(marks&&marks[k]?" "+marks[k]:"")+'" data-g="'+k+'"><i>/</i></span>';});
      return h+'</div>';}
    /* ① 끊어읽기 */
    function stepCut(it){
      var me={};
      main.innerHTML=head(it,"다음 문장을 의미덩어리로 끊어 보세요.")+'<div class="pq-card"><p class="pq-note">단어와 단어 사이(또는 끊을 곳 앞의 단어)를 누르면 <b class="sy-sl">/</b> 표시가 생겨요. 다시 누르면 지워져요.</p><div class="sy-cut"></div><div class="sy-tools"><button type="button" class="sy-tool" data-t="clear">⌫ 지우기</button></div></div>'+foot("끊어읽기 확인",nextLabel());
      var box=main.querySelector(".sy-cut");
      function paint(){var m={};for(var k in me)m[k]="me";box.innerHTML=sent(it,m,"edit");}
      paint();
      box.onclick=function(e){if(S.res[S.idx].cut)return;var g=e.target.closest(".sy-g"),w=e.target.closest(".sy-w"),k=g?+g.getAttribute("data-g"):w?+w.getAttribute("data-k"):-1;
        if(k<0||k>=it.W.length-1)return;if(me[k])delete me[k];else me[k]=1;paint();};
      main.querySelector('[data-t="clear"]').onclick=function(){if(S.res[S.idx].cut)return;me={};paint();};
      var btn=main.querySelector(".sy-main"),nx=main.querySelector(".sy-next");
      function check(){if(S.res[S.idx].cut){go();return;}
        var hit=0,extra=0,miss=0,mine={},model={};for(var k in it.cut){if(me[k]){hit++;mine[k]="ok";}else{miss++;model[k]="miss";}model[k]=model[k]||"model";}
        for(k in me)if(!it.cut[k]){extra++;mine[k]="no";}
        var tot=Object.keys(it.cut).length,ok=!extra&&!miss;S.res[S.idx].cut={ok:ok,hit:hit,tot:tot,extra:extra};
        main.querySelector(".pq-card").innerHTML='<div class="sy-ans"><span class="sy-lb me">나의 답안</span>'+sent(it,mine)+'</div><div class="sy-ans"><span class="sy-lb">모범 답안</span>'+sent(it,model,"model")+'</div>';
        var rb=main.querySelector(".pq-res");rb.hidden=false;rb.className="pq-res "+(ok?"ok":"no");
        rb.innerHTML=ok?'<b>✓ 모범 답안과 똑같이 끊었어요!</b>':'<b>'+hit+' / '+tot+' 자리를 맞혔어요.</b><div class="pq-exp">'+(miss?'<span class="sy-k miss">/</span> 놓친 자리 '+miss+'곳 ':'')+(extra?'<span class="sy-k no">/</span> 모범 답안에는 없는 자리 '+extra+'곳':'')+'<br>끊는 자리는 조금 달라도 뜻이 통하면 괜찮아요. 모범 답안의 덩어리로 다음 단계를 해 봐요.</div>';
        btn.hidden=true;nx.hidden=false;nx.focus();}
      btn.onclick=check;nx.onclick=go;bindEnter(function(){if(!nx.hidden)go();else check();});
    }
    /* ② 덩어리마다 해석 쓰기 */
    function stepKo(it){
      var h='<div class="sy-kos">';it.ch.forEach(function(c,k){h+='<div class="sy-ko"><div class="e">'+esc(c.en)+(k<it.ch.length-1?' <b class="sy-sl">/</b>':'')+'</div><textarea rows="1" class="pq-in" data-k="'+k+'" placeholder="해석을 써 보세요"></textarea><div class="m" hidden>'+esc(c.ko)+'</div></div>';});h+='</div>';
      main.innerHTML=head(it,"끊어 읽은 덩어리마다 우리말 해석을 써 보세요.")+'<div class="pq-card">'+h+'</div>'+foot("모범 해석 보기",nextLabel());
      var btn=main.querySelector(".sy-main"),nx=main.querySelector(".sy-next");
      [].forEach.call(main.querySelectorAll(".sy-ko textarea"),function(t){t.oninput=function(){t.style.height="auto";t.style.height=t.scrollHeight+"px";};t.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();e.stopPropagation();var n=main.querySelector('.sy-ko textarea[data-k="'+(+t.getAttribute("data-k")+1)+'"]');if(n&&!btn.hidden)n.focus();else if(!btn.hidden)show();else go();}};});
      function show(){[].forEach.call(main.querySelectorAll(".sy-ko .m"),function(x){x.hidden=false;});[].forEach.call(main.querySelectorAll(".sy-ko textarea"),function(t){t.readOnly=true;});
        var rb=main.querySelector(".pq-res");rb.hidden=false;rb.className="pq-res ok";rb.innerHTML='<b>내 해석과 모범 해석을 비교해 보세요.</b><div class="pq-exp">덩어리의 뜻만 통하면 표현은 달라도 괜찮아요.</div>';btn.hidden=true;nx.hidden=false;nx.focus();}
      btn.onclick=show;nx.onclick=go;bindEnter(function(){if(!nx.hidden)go();else show();});
    }
    function koBox(it){return '<div class="sy-kline"><span class="sy-lb">'+(it.natural?"해석":"직독직해")+'</span>'+esc(it.ko)+'</div>';}
    function finish(it,ok,answerHtml){S.res[S.idx].last=ok;var rb=main.querySelector(".pq-res");rb.hidden=false;rb.className="pq-res "+(ok?"ok":"no");
      rb.innerHTML='<b>'+(ok?"✓ 정답이에요!":"✗ 아쉬워요")+'</b>'+(ok?"":'<div class="pq-ans"><span>정답</span>'+answerHtml+'</div>');
      main.querySelector(".sy-main").hidden=true;var nx=main.querySelector(".sy-next");nx.hidden=false;nx.focus();}
    /* ③-가 덩어리 배열 */
    function stepOrder(it){
      var pool=it.ch.map(function(c,k){return {k:k,en:c.en};}),tries=0;do{pool=shuffle(pool);tries++;}while(tries<8&&pool.every(function(x,i){return x.k===i;}));
      var line=[],done=false;
      main.innerHTML=head(it,"우리말과 일치하도록 의미덩어리를 알맞은 순서로 배열하세요.")+koBox(it)+'<div class="pq-card"><div class="pq-line sy-line"></div><div class="pq-pool"></div><div class="sy-tools"><button type="button" class="sy-tool" data-t="clear">⌫ 지우기</button></div></div>'+foot("정답 확인",nextLabel());
      var ln=main.querySelector(".sy-line"),pl=main.querySelector(".pq-pool"),btn=main.querySelector(".sy-main"),nx=main.querySelector(".sy-next");
      function paint(){ln.innerHTML=line.length?line.map(function(x,i){return '<button type="button" class="pq-chip c'+(x.k%6)+'" data-i="'+i+'">'+esc(x.en)+'</button>';}).join(""):'<span class="pq-ph">아래 덩어리를 순서대로 누르세요</span>';
        pl.innerHTML=pool.map(function(x,i){return line.indexOf(x)>=0?'':'<button type="button" class="pq-chip c'+(x.k%6)+'" data-p="'+i+'">'+esc(x.en)+'</button>';}).join("");btn.disabled=line.length<pool.length;}
      paint();
      pl.onclick=function(e){var b=e.target.closest("[data-p]");if(!b||done)return;line.push(pool[+b.getAttribute("data-p")]);paint();};
      ln.onclick=function(e){var b=e.target.closest("[data-i]");if(!b||done)return;line.splice(+b.getAttribute("data-i"),1);paint();};
      main.querySelector('[data-t="clear"]').onclick=function(){if(!done){line=[];paint();}};
      function check(){if(done){go();return;}if(line.length<pool.length)return;done=true;
        var ok=line.map(function(x){return key(x.en);}).join(" ")===it.ch.map(function(c){return key(c.en);}).join(" ");
        ln.classList.add(ok?"ok":"no");finish(it,ok,esc(it.ch.map(function(c){return c.en;}).join(" ")));}
      btn.onclick=check;nx.onclick=go;bindEnter(function(){if(!nx.hidden)go();else check();});
    }
    /* ③-나 빈칸 채우기 */
    function stepBlank(it){
      var a=it.wc[it.blank][0],b=it.wc[it.blank][1],h='<div class="sy-sen sy-bl">',ins=[];
      it.W.forEach(function(w,k){if(k<a||k>=b){h+='<span class="sy-w">'+esc(w)+'</span> ';return;}
        var m=w.match(/^([^A-Za-z0-9']*)(.*?)([^A-Za-z0-9']*)$/),core=m?m[2]:w;ins.push({k:k,core:core});
        h+=esc(m?m[1]:"")+'<span class="sy-bw"><input class="sy-in" data-i="'+(ins.length-1)+'" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:'+Math.max(3.2,core.length*0.72+1.4)+'em"><small hidden></small></span>'+esc(m?m[3]:"")+' ';});
      h+='</div>';
      main.innerHTML=head(it,"우리말과 일치하도록 빈칸에 알맞은 말을 써서 문장을 완성하세요.")+koBox(it)+'<div class="pq-card">'+h+'<div class="sy-tools"><button type="button" class="sy-tool" data-t="hint">💡 힌트 보기</button><button type="button" class="sy-tool" data-t="clear">⌫ 지우기</button></div></div>'+foot("정답 확인",nextLabel());
      var IN=[].slice.call(main.querySelectorAll(".sy-in")),btn=main.querySelector(".sy-main"),nx=main.querySelector(".sy-next"),done=false;
      IN.forEach(function(x,i){x.onkeydown=function(e){if(e.key===" "&&IN[i+1]){e.preventDefault();IN[i+1].focus();}else if(e.key==="Backspace"&&!x.value&&IN[i-1]){e.preventDefault();IN[i-1].focus();}};});
      main.querySelector('[data-t="hint"]').onclick=function(){IN.forEach(function(x,i){var c=ins[i].core;x.placeholder=c.charAt(0)+(c.length>1?"…":"");});};
      main.querySelector('[data-t="clear"]').onclick=function(){if(!done)IN.forEach(function(x){x.value="";});};
      function check(){if(done){go();return;}if(!IN.some(function(x){return x.value.trim();})){IN[0].focus();return;}done=true;var all=true;
        IN.forEach(function(x,i){var ok=key(x.value)===key(ins[i].core);all=all&&ok;x.readOnly=true;x.classList.add(ok?"ok":"no");if(!ok){var sm=x.nextSibling;sm.hidden=false;sm.textContent=ins[i].core;}});
        finish(it,all,esc(it.ch[it.blank].en));}
      btn.onclick=check;nx.onclick=go;bindEnter(function(){if(!nx.hidden)go();else check();});
    }
    function summary(){
      var n=S.list.length,cut=0,last=0,wrong=[];
      S.list.forEach(function(it,i){var r=S.res[i];if(r.cut&&r.cut.ok)cut++;if(r.last)last++;if(!(r.cut&&r.cut.ok)||!r.last)wrong.push(it);});
      main.innerHTML='<div class="pq-sum"><div class="sy-score"><div><b>'+cut+'</b> / '+n+'<small>끊어읽기 모범 답안과 같음</small></div><div><b>'+last+'</b> / '+n+'<small>배열·빈칸 정답</small></div></div><p>'+(wrong.length?"틀린 문장만 한 번 더 연습해 볼까요?":"모두 맞혔어요! 훌륭해요 👏")+'</p>'+
        '<ol class="pq-list">'+S.list.map(function(it,i){var r=S.res[i],ok=r.cut&&r.cut.ok&&r.last;return '<li class="'+(ok?"ok":"no")+'"><span>'+(ok?"✓":"✗")+'</span>'+esc((function(t){return t.length>80?t.slice(0,t.lastIndexOf(" ",78)>40?t.lastIndexOf(" ",78):78)+" …":t;})(it.W.join(" ")))+'<em>'+(r.cut?"끊기 "+r.cut.hit+"/"+r.cut.tot:"")+' · '+(it.kind==="order"?"배열":"빈칸")+" "+(r.last?"○":"×")+'</em></li>';}).join("")+'</ol><div class="pq-acts">'+
        (wrong.length?'<button class="pq-btn" data-a="wrong">틀린 문장 다시 ('+wrong.length+')</button>':'')+'<button class="pq-btn ghost" data-a="again">처음부터 다시</button><button class="pq-btn ghost" data-a="close">강의로 돌아가기</button></div></div>';
      main.querySelector(".pq-acts").onclick=function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a");if(a==="wrong")start(wrong);else if(a==="again")start(null);else close();};
      ENTER=null;
    }
    return {open:open,close:close,items:L};
  }
  return {item:item,mount:mount};
}
