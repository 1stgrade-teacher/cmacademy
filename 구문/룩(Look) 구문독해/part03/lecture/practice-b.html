  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;

  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}

  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    if(t.getAttribute("data-act"))return;
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;

  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};

}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"12강","title":"Chapter III Read & Practice","audioDir":"practice-b_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter III Read &amp; Practice\u003c/div>\u003ch1>중등 영어 구문 마스터: 수동태와 5형식 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>다양한 형식의 수동태 문장을 완벽하게 이해하고 실전 독해에 적용한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕 여러분, 오늘도 열공할 준비 되었나요? 이번 시간은 Chapter III Read & Practice 유닛으로, 중학교 영어 시험에 단골로 나오는 핵심 구문들을 함께 뽀개볼 거예요. 우리가 배울 내용은 독해뿐만 아니라 서술형에서도 정말 중요하니까 끝까지 집중해 주세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">Chapter III Read &amp; Practice\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">이번 유닛의 핵심은 \u003cb class=\"key\">수동태\u003c/b>와 \u003cb class=\"key\">5형식\u003c/b> 구문의 결합이에요. 5형식 동사 consider, ask, make와 4형식 동사 give가 수동태로 바뀔 때 어떻게 문장 구조가 달라지는지 꼼꼼하게 기억해야 해요.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>Apple Computer's classic 'Think Different' campaign \u003cspan class=\"fx\">is widely considered\u003c/span> the best advertisement of all time.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>Advertising experts \u003cspan class=\"fx\">have learned that\u003c/span> the most memorable advertisements are the ones with a strong story plot.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>In one study, students \u003cspan class=\"fx\">were asked to number\u003c/span> ten posters, from most beautiful to least beautiful.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>Participants \u003cspan class=\"fx\">were given 90 seconds\u003c/span> to memorize information in each of the different fonts.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>Students \u003cspan class=\"fx\">who are made to feel happy\u003c/span> before taking math exams perform much better than their neutral peers.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"자, 먼저 핵심 포인트를 짚어볼게요. 오늘 배울 문장들에는 consider A B, ask O to-V, 사역동사 make 같은 중요한 5형식 동사들과 4형식 동사 give가 수동태로 바뀐 형태들이 가득해요. 이 구조들을 정확히 파악하면 복잡한 긴 문장도 한눈에 쏙 들어오게 될 거예요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 5\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">Apple Computer's classic 'Think Different' campaign \u003cspan class=\"fx\">is widely considered\u003c/span> the best advertisement of all time.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Apple Computer's classic 'Think Different' campaign\u003c/div>\u003cdiv class=\"k\">애플 컴퓨터의 클래식한 'Think Different' 캠페인은\u003c/div>\u003cdiv class=\"e\">is widely considered\u003c/div>\u003cdiv class=\"k\">널리 여겨진다\u003c/div>\u003cdiv class=\"e\">the best advertisement of all time.\u003c/div>\u003cdiv class=\"k\">역사상 최고의 광고로.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">5형식(consider A B)의 수동태\u003c/b> 문장으로, 원래 목적격보어였던 명사구가 주어 뒤에 남아 'be considered + 명사구' 형태로 쓰였습니다.\u003c/div>","segs":[{"n":3,"text":"Apple Computer's classic 'Think Different' campaign, 애플 컴퓨터의 클래식한 'Think Different' 캠페인은. is widely considered, 널리 여겨진다. the best advertisement of all time, 역사상 최고의 광고로.","hl":"ch"},{"n":4,"text":"첫 번째 문장은 5형식 consider A B 구문의 수동태를 보여주고 있어요. 능동태일 때 목적격보어였던 명사구가 수동태가 된 후에도 그대로 뒤에 남아서 be considered 뒤에 바로 이어진다는 점을 기억해 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 5\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">Apple Computer's classic 'Think Different' campaign \u003cspan class=\"fx\">is widely considered\u003c/span> the best advertisement of all time.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사람들의 마음속에 오랜 세월 동안 가장 뛰어난 광고 캠페인으로 확실하게 자리 잡고 있다는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is widely considered the best advertisement\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is widely thought to be the best advertisement\u003c/span>\u003cdiv class=\"w\">consider를 think to be로 바꾸어 같은 의미를 더 풀어서 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is widely considered\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is generally regarded\u003c/span>\u003cspan class=\"y-eq\">is considered = is regarded\u003c/span>\u003cdiv class=\"w\">considered를 유의어인 regarded로 바꾸어 널리 여겨진다는 뜻을 강조했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">of all time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ever\u003c/span>\u003cspan class=\"y-eq\">of all time = ever\u003c/span>\u003cdiv class=\"w\">역사상 최고의라는 의미를 부사 ever로 간단하게 대체했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Apple Computer's famous 'Think Different' campaign is generally regarded as the greatest advertisement ever made.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 애플의 광고가 단순히 좋았던 수준을 넘어, 세상에 나온 모든 광고 중 최고로 손꼽힌다는 의미를 담고 있어요.","hl":"mn"},{"n":6,"text":"is widely considered the best advertisement라는 표현을 is widely thought to be the best advertisement로 바꾸어 쓰면, 생각된다는 뉘앙스를 조금 더 부드럽게 전달할 수 있죠.","hl":"rw"},{"n":7,"text":"여기서 is widely considered는 is generally regarded로 바꿔 쓸 수 있고, of all time은 ever라는 단어로 간단하게 표현할 수도 있어요.","hl":"ph"},{"n":8,"text":"뜻이 똑같은 다른 문장도 살펴볼게요. Apple Computer's famous 'Think Different' campaign is generally regarded as the greatest advertisement ever made라고 쓰면 아주 자연스러운 문장이 돼요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 5\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">Advertising experts \u003cspan class=\"fx\">have learned that\u003c/span> the most memorable advertisements are the ones with a strong story plot.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Advertising experts have learned\u003c/div>\u003cdiv class=\"k\">광고 전문가들은 알게 되었다\u003c/div>\u003cdiv class=\"e\">that the most memorable advertisements\u003c/div>\u003cdiv class=\"k\">가장 기억에 남는 광고들이\u003c/div>\u003cdiv class=\"e\">are the ones with a strong story plot.\u003c/div>\u003cdiv class=\"k\">탄탄한 스토리 플롯을 가진 것들이라는 것을.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">현재완료(have learned) + 목적어 that절\u003c/b> 구조로, 전문가들이 과거부터 지금까지 경험을 통해 깨달은 사실을 that절로 설명하고 있습니다.\u003c/div>","segs":[{"n":9,"text":"Advertising experts have learned, 광고 전문가들은 알게 되었다. that the most memorable advertisements, 가장 기억에 남는 광고들이. are the ones with a strong story plot, 탄탄한 스토리 플롯을 가진 것들이라는 것을.","hl":"ch"},{"n":10,"text":"두 번째 문장은 현재완료 have learned 뒤에 목적어 역할을 하는 that절이 이어지는 구조예요. 과거부터 지금까지 전문가들이 연구하고 알아낸 사실을 전달할 때 현재완료를 쓴다는 것을 잊지 마세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 5\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">Advertising experts \u003cspan class=\"fx\">have learned that\u003c/span> the most memorable advertisements are the ones with a strong story plot.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>단순한 시각적 효과보다 흡입력 있는 이야기가 담긴 광고가 사람들의 기억에 훨씬 오래 남는다는 의미입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have learned that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have found that\u003c/span>\u003cdiv class=\"w\">learned를 발견하다라는 뜻의 found로 바꾸어 연구나 경험을 통해 알게 된 점을 강조했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">memorable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">unforgettable\u003c/span>\u003cspan class=\"y-eq\">memorable = unforgettable\u003c/span>\u003cdiv class=\"w\">기억에 남는다는 의미를 잊을 수 없는 이라는 단어로 확장했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">story plot\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">narrative structure\u003c/span>\u003cspan class=\"y-eq\">story plot = narrative structure\u003c/span>\u003cdiv class=\"w\">스토리 플롯이라는 표현을 전문적인 서사 구조라는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Experts in advertising have discovered that unforgettable ads are those featuring a powerful storyline.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"사람들의 머릿속에 오래 남는 광고는 결국 탄탄한 이야기가 담겨 있는 광고라는 걸 전문가들이 깨달았다는 뜻이에요.","hl":"mn"},{"n":12,"text":"여기서 have learned that을 have found that으로 바꾸면, 전문가들이 조사를 통해 그 사실을 발견했다는 뉘앙스를 더 살릴 수 있어요.","hl":"rw"},{"n":13,"text":"단어를 바꿔 볼까요? memorable은 unforgettable로 쓸 수 있고, story plot은 narrative structure라는 멋진 표현으로도 바꿔 쓸 수 있답니다.","hl":"ph"},{"n":14,"text":"이 문장을 다르게 표현하면 Experts in advertising have discovered that unforgettable ads are those featuring a powerful storyline이 돼요. 의미는 완전히 똑같죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 5\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">In one study, students \u003cspan class=\"fx\">were asked to number\u003c/span> ten posters, from most beautiful to least beautiful.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">In one study,\u003c/div>\u003cdiv class=\"k\">어떤 연구에서,\u003c/div>\u003cdiv class=\"e\">students were asked\u003c/div>\u003cdiv class=\"k\">학생들은 요청받았다\u003c/div>\u003cdiv class=\"e\">to number ten posters,\u003c/div>\u003cdiv class=\"k\">열 개의 포스터에 번호를 매기도록,\u003c/div>\u003cdiv class=\"e\">from most beautiful to least beautiful.\u003c/div>\u003cdiv class=\"k\">가장 아름다운 것부터 가장 덜 아름다운 것까지.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">5형식(ask + O + to-V)의 수동태\u003c/b> 문장으로, 능동태의 목적격보어였던 to부정사(to number)가 주어 뒤에 그대로 내려와 수동태를 완성합니다.\u003c/div>","segs":[{"n":15,"text":"In one study, 어떤 연구에서. students were asked, 학생들은 요청받았다. to number ten posters, 열 개의 포스터에 번호를 매기도록. from most beautiful to least beautiful, 가장 아름다운 것부터 가장 덜 아름다운 것까지.","hl":"ch"},{"n":16,"text":"세 번째 문장에서는 5형식 ask O to-V 구문의 수동태를 만나요. 능동태에서 목적격보어였던 to부정사구인 to number가 수동태가 된 후에도 주어 뒤에 그대로 남아 있는 모습을 꼭 확인해 두세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 5\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">In one study, students \u003cspan class=\"fx\">were asked to number\u003c/span> ten posters, from most beautiful to least beautiful.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>연구에 참여한 학생들이 주관적인 미적 기준으로 포스터의 순위를 매기는 실험을 진행했다는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">were asked to number\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">were required to rank\u003c/span>\u003cdiv class=\"w\">요청받았다를 요구받았다 및 순위를 매기다로 바꾸어 실험의 지시 성격을 명확히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">study\     var main=root.querySelector(".pq-main"),S={list:L,idx:0,step:0,res:[]};
    ["keydown","keyup","keypress"].forEach(function(ev){root.addEventListener(ev,function(e){e.stopPropagation();});});
    function open(){if(LP&&LP.stop)try{LP.stop();}catch(_){}root.hidden=false;document.documentElement.classList.add("pq-lock");draw();}
    function close(){root.hidden=true;document.documentElement.classList.remove("pq-lock");}
    root.querySelector(".pq-x").onclick=close;
    document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest('[data-act="synpractice"]');if(t){e.preventDefault();open();}});
    var top=document.querySelector(".lp-top");if(top){var b=document.createElement("button");b.className="pq-open";b.type="button";b.setAttribute("data-act","synpractice");b.textContent="✎ 구문 연습";top.appendChild(b);}
    function start(only){S.list=only||L;S.idx=0;S.step=0;S.res=S.list.map(function(){return {cut:null,last:null};});draw();}
    S.res=L.map(function(){return {cut:null,last:null};});
    var STEPS=["끊어읽기","덩어리 해석","배열·빈칸"];
    function head(it,q){var n=S.list.length;
      return '<div class="pq-pill">'+(S.idx+1)+' / '+n+'</div><ol class="sy-steps">'+STEPS.map(function(t,k){return '<li class="'+(k===S.step?"on":k<S.step?"done":"")+'"><span>'+(k+1)+'</span>'+(k===2?(it.kind==="order"?"배열하기":"빈칸 채우기"):t)+'</li>';}).join("")+'</ol><h2 class="pq-q">'+q+'</h2>';}
    function foot(btn,next){return '<div class="pq-res" hidden></div><div class="pq-foot"><button class="pq-btn sy-main" type="button">'+btn+'</button><button class="pq-btn sy-next" type="button" hidden>'+next+'</button><span class="sy-key">Enter</span></div>';}
    function nextLabel(){return S.step<2?"다음 단계 →":(S.idx<S.list.length-1?"다음 문장 →":"결과 보기");}
    function go(){if(S.step<2)S.step++;else{S.step=0;S.idx++;}draw();root.scrollTop=0;}
    var ENTER=null;
    function bindEnter(fn){ENTER=fn;}
    function onKey(e){if(root.hidden||!ENTER||e.key!=="Enter"||e.shiftKey||e.isComposing||e.keyCode===229)return;var t=e.target&&e.target.tagName;if(t==="BUTTON"||t==="SELECT"||t==="TEXTAREA")return;e.preventDefault();ENTER();}
    root.addEventListener("keydown",onKey);document.addEventListener("keydown",function(e){if(!root.contains(e.target))onKey(e);});
    function draw(){
      if(S.idx>=S.list.length){summary();return;}
      var it=S.list[S.idx];
      if(S.step===0)stepCut(it);else if(S.step===1)stepKo(it);else if(it.kind==="order")stepOrder(it);else stepBlank(it);
      var f=main.querySelector("input.sy-in,.sy-ko textarea");if(f)setTimeout(function(){try{f.focus();}catch(_){}},30);else{try{document.activeElement&&document.activeElement.blur&&document.activeElement.blur();}catch(_){}}
    }
    /* 문장을 끊는 표시(/)와 함께 그리기. marks: {단어번호:종류} 종류 = ok / no(내가 잘못 끊음) / miss(놓친 자리) / me / model */
    function sent(it,marks,cls){var h='<div class="sy-sen '+(cls||"")+'">';
      it.W.forEach(function(w,k){h+='<span class="sy-w" data-k="'+k+'">'+esc(w)+'</span>';
        if(k<it.W.length-1)h+='<span class="sy-g'+(marks&&marks[k]?" "+marks[k]:"")+'" data-g="'+k+'"><i>/</i></span>';});
      return h+'</div>';}
    /* ① 끊어읽기 */
    function stepCut(it){
      var me={};
      main.innerHTML=head(it,"다음 문장을 의미덩어리로 끊어 보세요.")+'<div class="pq-card"><p class="pq-note">단어와 단어 사이(또는 끊을 곳 앞의 단어)를 누르면 <b class="sy-sl">/</b> 표시가 생겨요. 다시 누르면 지워져요.</p><div class="sy-cut"></div><div class="sy-tools"><button type="button" class="sy-tool" data-t="clear">⌫ 지우기</button></div></div>'+foot("끊어읽기 확인",nextLabel());
      var box=main.querySelector(".sy-cut");
      function paint(){var m={};for(var k in me)m[k]="me";box.innerHTML=sent(it,m,"edit");}
      paint();
      box.onclick=function(e){if(S.res[S.idx].cut)return;var g=e.target.closest(".sy-g"),w=e.target.closest(".sy-w"),k=g?+g.getAttribute("data-g"):w?+w.getAttribute("data-k"):-1;
        if(k<0||k>=it.W.length-1)return;if(me[k])delete me[k];else me[k]=1;paint();};
      main.querySelector('[data-t="clear"]').onclick=function(){if(S.res[S.idx].cut)return;me={};paint();};
      var btn=main.querySelector(".sy-main"),nx=main.querySelector(".sy-next");
      function check(){if(S.res[S.idx].cut){go();return;}
        var hit=0,extra=0,miss=0,mine={},model={};for(var k in it.cut){if(me[k]){hit++;mine[k]="ok";}else{miss++;model[k]="miss";}model[k]=model[k]||"model";}
        for(k in me)if(!it.cut[k]){extra++;mine[k]="no";}
        var tot=Object.keys(it.cut).length,ok=!extra&&!miss;S.res[S.idx].cut={ok:ok,hit:hit,tot:tot,extra:extra};
        main.querySelector(".pq-card").innerHTML='<div class="sy-ans"><span class="sy-lb me">나의 답안</span>'+sent(it,mine)+'</div><div class="sy-ans"><span class="sy-lb">모범 답안</span>'+sent(it,model,"model")+'</div>';
        var rb=main.querySelector(".pq-res");rb.hidden=false;rb.className="pq-res "+(ok?"ok":"no");
        rb.innerHTML=ok?'<b>✓ 모범 답안과 똑같이 끊었어요!</b>':'<b>'+hit+' / '+tot+' 자리를 맞혔어요.</b><div class="pq-exp">'+(miss?'<span class="sy-k miss">/</span> 놓친 자리 '+miss+'곳 ':'')+(extra?'<span class="sy-k no">/</span> 모범 답안에는 없는 자리 '+extra+'곳':'')+'<br>끊는 자리는 조금 달라도 뜻이 통하면 괜찮아요. 모범 답안의 덩어리로 다음 단계를 해 봐요.</div>';
        btn.hidden=true;nx.hidden=false;nx.focus();}
      btn.onclick=check;nx.onclick=go;bindEnter(function(){if(!nx.hidden)go();else check();});
    }
    /* ② 덩어리마다 해석 쓰기 */
    function stepKo(it){
      var h='<div class="sy-kos">';it.ch.forEach(function(c,k){h+='<div class="sy-ko"><div class="e">'+esc(c.en)+(k<it.ch.length-1?' <b class="sy-sl">/</b>':'')+'</div><textarea rows="1" class="pq-in" data-k="'+k+'" placeholder="해석을 써 보세요"></textarea><div class="m" hidden>'+esc(c.ko)+'</div></div>';});h+='</div>';
      main.innerHTML=head(it,"끊어 읽은 덩어리마다 우리말 해석을 써 보세요.")+'<div class="pq-card">'+h+'</div>'+foot("모범 해석 보기",nextLabel());
      var btn=main.querySelector(".sy-main"),nx=main.querySelector(".sy-next");
      [].forEach.call(main.querySelectorAll(".sy-ko textarea"),function(t){t.oninput=function(){t.style.height="auto";t.style.height=t.scrollHeight+"px";};t.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();e.stopPropagation();var n=main.querySelector('.sy-ko textarea[data-k="'+(+t.getAttribute("data-k")+1)+'"]');if(n&&!btn.hidden)n.focus();else if(!btn.hidden)show();else go();}};});
      function show(){[].forEach.call(main.querySelectorAll(".sy-ko .m"),function(x){x.hidden=false;});[].forEach.call(main.querySelectorAll(".sy-ko textarea"),function(t){t.readOnly=true;});
        var rb=main.querySelector(".pq-res");rb.hidden=false;rb.className="pq-res ok";rb.innerHTML='<b>내 해석과 모범 해석을 비교해 보세요.</b><div class="pq-exp">덩어리의 뜻만 통하면 표현은 달라도 괜찮아요.</div>';btn.hidden=true;nx.hidden=false;nx.focus();}
      btn.onclick=show;nx.onclick=go;bindEnter(function(){if(!nx.hidden)go();else show();});
    }
    function koBox(it){return '<div class="sy-kline"><span class="sy-lb">'+(it.natural?"해석":"직독직해")+'</span>'+esc(it.ko)+'</div>';}
    function finish(it,ok,answerHtml){S.res[S.idx].last=ok;var rb=main.querySelector(".pq-res");rb.hidden=false;rb.className="pq-res "+(ok?"ok":"no");
      rb.innerHTML='<b>'+(ok?"✓ 정답이에요!":"✗ 아쉬워요")+'</b>'+(ok?"":'<div class="pq-ans"><span>정답</span>'+answerHtml+'</div>');
      main.querySelector(".sy-main").hidden=true;var nx=main.querySelector(".sy-next");nx.hidden=false;nx.focus();}
    /* ③-가 덩어리 배열 */
    function stepOrder(it){
      var pool=it.ch.map(function(c,k){return {k:k,en:c.en};}),tries=0;do{pool=shuffle(pool);tries++;}while(tries<8&&pool.every(function(x,i){return x.k===i;}));
      var line=[],done=false;
      main.innerHTML=head(it,"우리말과 일치하도록 의미덩어리를 알맞은 순서로 배열하세요.")+koBox(it)+'<div class="pq-card"><div class="pq-line sy-line"></div><div class="pq-pool"></div><div class="sy-tools"><button type="button" class="sy-tool" data-t="clear">⌫ 지우기</button></div></div>'+foot("정답 확인",nextLabel());
      var ln=main.querySelector(".sy-line"),pl=main.querySelector(".pq-pool"),btn=main.querySelector(".sy-main"),nx=main.querySelector(".sy-next");
      function paint(){ln.innerHTML=line.length?line.map(function(x,i){return '<button type="button" class="pq-chip c'+(x.k%6)+'" data-i="'+i+'">'+esc(x.en)+'</button>';}).join(""):'<span class="pq-ph">아래 덩어리를 순서대로 누르세요</span>';
        pl.innerHTML=pool.map(function(x,i){return line.indexOf(x)>=0?'':'<button type="button" class="pq-chip c'+(x.k%6)+'" data-p="'+i+'">'+esc(x.en)+'</button>';}).join("");btn.disabled=line.length<pool.length;}
      paint();
      pl.onclick=function(e){var b=e.target.closest("[data-p]");if(!b||done)return;line.push(pool[+b.getAttribute("data-p")]);paint();};
      ln.onclick=function(e){var b=e.target.closest("[data-i]");if(!b||done)return;line.splice(+b.getAttribute("data-i"),1);paint();};
      main.querySelector('[data-t="clear"]').onclick=function(){if(!done){line=[];paint();}};
      function check(){if(done){go();return;}if(line.length<pool.length)return;done=true;
        var ok=line.map(function(x){return key(x.en);}).join(" ")===it.ch.map(function(c){return key(c.en);}).join(" ");
        ln.classList.add(ok?"ok":"no");finish(it,ok,esc(it.ch.map(function(c){return c.en;}).join(" ")));}
      btn.onclick=check;nx.onclick=go;bindEnter(function(){if(!nx.hidden)go();else check();});
    }
    /* ③-나 빈칸 채우기 */
    function stepBlank(it){
      var a=it.wc[it.blank][0],b=it.wc[it.blank][1],h='<div class="sy-sen sy-bl">',ins=[];
      it.W.forEach(function(w,k){if(k<a||k>=b){h+='<span class="sy-w">'+esc(w)+'</span> ';return;}
        var m=w.match(/^([^A-Za-z0-9']*)(.*?)([^A-Za-z0-9']*)$/),core=m?m[2]:w;ins.push({k:k,core:core});
        h+=esc(m?m[1]:"")+'<span class="sy-bw"><input class="sy-in" data-i="'+(ins.length-1)+'" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:'+Math.max(3.2,core.length*0.72+1.4)+'em"><small hidden></small></span>'+esc(m?m[3]:"")+' ';});
      h+='</div>';
      main.innerHTML=head(it,"우리말과 일치하도록 빈칸에 알맞은 말을 써서 문장을 완성하세요.")+koBox(it)+'<div class="pq-card">'+h+'<div class="sy-tools"><button type="button" class="sy-tool" data-t="hint">💡 힌트 보기</button><button type="button" class="sy-tool" data-t="clear">⌫ 지우기</button></div></div>'+foot("정답 확인",nextLabel());
      var IN=[].slice.call(main.querySelectorAll(".sy-in")),btn=main.querySelector(".sy-main"),nx=main.querySelector(".sy-next"),done=false;
      IN.forEach(function(x,i){x.onkeydown=function(e){if(e.key===" "&&IN[i+1]){e.preventDefault();IN[i+1].focus();}else if(e.key==="Backspace"&&!x.value&&IN[i-1]){e.preventDefault();IN[i-1].focus();}};});
      main.querySelector('[data-t="hint"]').onclick=function(){IN.forEach(function(x,i){var c=ins[i].core;x.placeholder=c.charAt(0)+(c.length>1?"…":"");});};
      main.querySelector('[data-t="clear"]').onclick=function(){if(!done)IN.forEach(function(x){x.value="";});};
      function check(){if(done){go();return;}if(!IN.some(function(x){return x.value.trim();})){IN[0].focus();return;}done=true;var all=true;
        IN.forEach(function(x,i){var ok=key(x.value)===key(ins[i].core);all=all&&ok;x.readOnly=true;x.classList.add(ok?"ok":"no");if(!ok){var sm=x.nextSibling;sm.hidden=false;sm.textContent=ins[i].core;}});
        finish(it,all,esc(it.ch[it.blank].en));}
      btn.onclick=check;nx.onclick=go;bindEnter(function(){if(!nx.hidden)go();else check();});
    }
    function summary(){
      var n=S.list.length,cut=0,last=0,wrong=[];
      S.list.forEach(function(it,i){var r=S.res[i];if(r.cut&&r.cut.ok)cut++;if(r.last)last++;if(!(r.cut&&r.cut.ok)||!r.last)wrong.push(it);});
      main.innerHTML='<div class="pq-sum"><div class="sy-score"><div><b>'+cut+'</b> / '+n+'<small>끊어읽기 모범 답안과 같음</small></div><div><b>'+last+'</b> / '+n+'<small>배열·빈칸 정답</small></div></div><p>'+(wrong.length?"틀린 문장만 한 번 더 연습해 볼까요?":"모두 맞혔어요! 훌륭해요 👏")+'</p>'+
        '<ol class="pq-list">'+S.list.map(function(it,i){var r=S.res[i],ok=r.cut&&r.cut.ok&&r.last;return '<li class="'+(ok?"ok":"no")+'"><span>'+(ok?"✓":"✗")+'</span>'+esc((function(t){return t.length>80?t.slice(0,t.lastIndexOf(" ",78)>40?t.lastIndexOf(" ",78):78)+" …":t;})(it.W.join(" ")))+'<em>'+(r.cut?"끊기 "+r.cut.hit+"/"+r.cut.tot:"")+' · '+(it.kind==="order"?"배열":"빈칸")+" "+(r.last?"○":"×")+'</em></li>';}).join("")+'</ol><div class="pq-acts">'+
        (wrong.length?'<button class="pq-btn" data-a="wrong">틀린 문장 다시 ('+wrong.length+')</button>':'')+'<button class="pq-btn ghost" data-a="again">처음부터 다시</button><button class="pq-btn ghost" data-a="close">강의로 돌아가기</button></div></div>';
      main.querySelector(".pq-acts").onclick=function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a");if(a==="wrong")start(wrong);else if(a==="again")start(null);else close();};
      ENTER=null;
    }
    return {open:open,close:close,items:L};
  }
  return {item:item,mount:mount};
}
window.__SYK=synKit().mount(window.__LP);</script><script src="/chat-widget.js" defer></script>
