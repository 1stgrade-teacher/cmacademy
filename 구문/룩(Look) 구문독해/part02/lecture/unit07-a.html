ass=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Getting up early in the morning is familiar to me.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"아침 일찍 일어나는 게 이제는 힘들지 않고 완전히 체화되었다는 의미를 담고 있답니다.","hl":"mn"},{"n":24,"text":"be used to 대신에 be accustomed to를 써서 I am accustomed to getting up early in the morning이라고 바꿀 수 있어요.","hl":"rw"},{"n":25,"text":"be used to는 be accustomed to와 뜻이 완전히 같고, early in the morning은 이른 아침 시간을 나타내는 유용한 표현이에요.","hl":"ph"},{"n":26,"text":"이 문장은 아침에 일어나는 것이 나에게 익숙하다는 의미로 Getting up early in the morning is familiar to me라고 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 9\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">You \u003cspan class=\"fx\">may well\u003c/span> love your parents.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">You may well\u003c/div>\u003cdiv class=\"k\">너는 ~하는 것은 당연하다\u003c/div>\u003cdiv class=\"e\">love your parents.\u003c/div>\u003cdiv class=\"k\">너의 부모님을 사랑하는 것\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">may well + 동사원형\u003c/b> 구문은 '~하는 것은 당연하다, 아마 ~하는 게 당연할 것이다'라는 당연한 추측이나 인정을 나타냅니다.\u003c/div>","segs":[{"n":27,"text":"You may well, 너는 ~하는 것은 당연하다. love your parents, 너의 부모님을 사랑하는 것","hl":"ch"},{"n":28,"text":"다섯 번째 문장인 You may well love your parents를 살펴봅시다. may well 뒤에 동사원형을 쓰면 ~하는 것은 당연하다는 뜻이 돼요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 9\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">You \u003cspan class=\"fx\">may well\u003c/span> love your parents.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>상식적으로 생각했을 때 그렇게 하는 것이 마땅하다며 상대방의 행동을 칭찬하거나 지지할 때 쓰여요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">You may well love your parents.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">It is natural that you love your parents.\u003c/span>\u003cdiv class=\"w\">당연하다는 의미의 구문 It is natural that을 사용하여 풀어서 쓸 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">may well\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have every reason to\u003c/span>\u003cspan class=\"y-eq\">may well = have every reason to\u003c/span>\u003cdiv class=\"w\">~하는 것이 당연하다는 의미의 표현으로 바꿀 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">parents\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">mother and father\u003c/span>\u003cspan class=\"y-eq\">parents = mother and father\u003c/span>\u003cdiv class=\"w\">부모님이라는 명사를 어머니와 아버지라는 풀이 표현으로 바꿀 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">It is natural for you to love your parents.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"부모님을 사랑하는 건 당연한 일이지라며 상대방의 마음을 전적으로 공감하고 인정해 주는 표현이에요.","hl":"mn"},{"n":30,"text":"may well을 It is natural that이라는 표현으로 바꾸어 It is natural that you love your parents라고 쓸 수도 있어요.","hl":"rw"},{"n":31,"text":"may well은 당연히 ~하다는 뜻이고, parents는 우리말의 부모님을 뜻하는 대표적인 명사예요.","hl":"ph"},{"n":32,"text":"이 문장은 It is natural for you to love your parents라는 자연스러운 구문으로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 9\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">I would rather eat a steak than eat pizza.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I would rather\u003c/div>\u003cdiv class=\"k\">나는 차라리 ~하겠다\u003c/div>\u003cdiv class=\"e\">eat a steak\u003c/div>\u003cdiv class=\"k\">스테이크를 먹는 것\u003c/div>\u003cdiv class=\"e\">than eat pizza.\u003c/div>\u003cdiv class=\"k\">피자를 먹느니보다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">would rather A than B\u003c/b> 구문은 'B하느니 차라리 A하겠다'라는 의미로 두 가지 선택지 중 선호하는 것을 나타냅니다.\u003c/div>","segs":[{"n":33,"text":"I would rather, 나는 차라리 ~하겠다. eat a steak, 스테이크를 먹는 것. than eat pizza, 피자를 먹느니보다","hl":"ch"},{"n":34,"text":"여섯 번째 문장인 I would rather eat a steak than eat pizza를 볼까요. would rather A than B 구문을 써서 피자 먹는 것보다 스테이크 먹는 걸 더 좋아한다고 말하고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 9\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">I would rather eat a steak than eat pizza.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>피자도 좋지만 그보다 스테이크를 훨씬 더 강하게 원한다는 자신의 취향과 선호를 명확히 드러내는 표현이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I would rather eat a steak than eat pizza.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">I prefer eating a steak to eating pizza.\u003c/span>\u003cdiv class=\"w\">선호를 나타내는 동사 prefer A to B 구문으로 바꾸어 쓸 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">would rather A than B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">prefer A to B\u003c/span>\u003cspan class=\"y-eq\">would rather A than B = prefer A to B\u003c/span>\u003cdiv class=\"w\">B보다 A를 더 선호한다는 의미의 동명사 구문으로 전환할 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">steak\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">beef\u003c/span>\u003cspan class=\"y-eq\">steak = beef\u003c/span>\u003cdiv class=\"w\">스테이크의 재료인 소고기라는 단어로 유의어 관계를 볼 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I choose to eat a steak instead of eating pizza.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"두 가지 중에서 내 마음이 어디로 더 기우는지를 확실하게 보여주는 강한 선호 표현이랍니다.","hl":"mn"},{"n":36,"text":"would rather 대신에 prefer를 사용해서 I prefer eating a steak to eating pizza라고 바꾸어 쓸 수도 있어요.","hl":"rw"},{"n":37,"text":"would rather A than B는 prefer A to B와 뜻이 같고, steak는 소고기 요리를 뜻하는 대표적인 단어예요.","hl":"ph"},{"n":38,"text":"이 문장은 피자 대신 스테이크를 고르겠다는 의미로 I choose to eat a steak instead of eating pizza라고 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 9\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">I \u003cspan class=\"fx\">would like to\u003c/span> travel around the world.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I would like to\u003c/div>\u003cdiv class=\"k\">나는 ~하고 싶다\u003c/div>\u003cdiv class=\"e\">travel\u003c/div>\u003cdiv class=\"k\">여행하는 것\u003c/div>\u003cdiv class=\"e\">around the world.\u003c/div>\u003cdiv class=\"k\">세계 곳곳을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">would like to + 동사원형\u003c/b> 구문은 '~하고 싶다'라는 의미로, want to의 공손하고 정중한 표현입니다.\u003c/div>","segs":[{"n":39,"text":"I would like to, 나는 ~하고 싶다. travel, 여행하는 것. around the world, 세계 곳곳을","hl":"ch"},{"n":40,"text":"일곱 번째 문장인 I would like to travel around the world를 살펴봅시다. would like to 뒤에 동사원형을 쓰면 ~하고 싶다는 뜻으로 want to보다 훨씬 공손한 느낌을 줘요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 9\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">I \u003cspan class=\"fx\">would like to\u003c/span> travel around the world.\u003c/div>\u003cdiv class=\ 3c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to the end\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">until the end\u003c/span>\u003cspan class=\"y-eq\">to the end = until the end\u003c/span>\u003cdiv class=\"w\">끝까지라는 의미를 전치사 until을 사용해 다르게 표현할 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I have no choice but to read the book to the end.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"너무 몰입해서 내 힘으로는 멈출 수가 없고 결국 끝까지 다 보게 된다는 강한 끌림을 나타내죠.","hl":"mn"},{"n":48,"text":"can't help but 대신에 can't help reading이라는 동명사 표현을 써서 I cannot help reading the book to the end라고 바꿀 수 있어요.","hl":"rw"},{"n":49,"text":"can't help but 뒤에는 동사원형이 오고, can't help 뒤에는 동명사가 온다는 점을 꼭 비교해서 기억해 두세요.","hl":"ph"},{"n":50,"text":"이 문장은 다른 선택의 여지가 없다는 의미를 담아 I have no choice but to read the book to the end로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 9\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">You cannot be too careful when crossing the street.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">You cannot\u003c/div>\u003cdiv class=\"k\">너는 ~할 수 없다\u003c/div>\u003cdiv class=\"e\">be too careful\u003c/div>\u003cdiv class=\"k\">아무리 조심해도 지나치지\u003c/div>\u003cdiv class=\"e\">when crossing the street.\u003c/div>\u003cdiv class=\"k\">길을 건널 때\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">cannot + 동사원형 + too + 형용사/부사\u003c/b> 구문은 아무리 ~해도 지나치지 않다라는 의미를 나타내는 대표적인 관용 표현입니다.\u003c/div>","segs":[{"n":51,"text":"You cannot, 너는 ~할 수 없다. be too careful, 아무리 조심해도 지나치지. when crossing the street, 길을 건널 때","hl":"ch"},{"n":52,"text":"마지막 아홉 번째 문장인 You cannot be too careful when crossing the street를 살펴볼까요. cannot과 too가 만나서 아무리 ~해도 지나치지 않다는 뜻을 만들어내요.","hl":"st"}]},{"ht oo와 뜻이 완전히 같고, crossing the street는 길을 건널 때라는 뜻의 필수 표현이에요.","hl":"ph"},{"n":56,"text":"이 문장은 가능한 한 최대한 조심해야 한다는 의미로 You should be as careful as possible when crossing the street라고 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">07. 조동사가 쓰인 여러 가지 구문\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>강한 충고 \u003cb class=\"key\">had better + 동사원형\u003c/b>과 부정형 \u003cb class=\"key\">had better not\u003c/b>\u003c/li>\u003cli>과거의 습관 \u003cb class=\"key\">used to + 동사원형\u003c/b>과 익숙함을 뜻하는 \u003cb class=\"key\">be used to + (동)명사\u003c/b>\u003c/li>\u003cli>당연함을 뜻하는 \u003cb class=\"key\">may well\u003c/b>과 선호를 나타내는 \u003cb class=\"key\">would rather A than B\u003c/b>\u003c/li>\u003cli>정중한 소망 \u003cb class=\"key\">would like to\u003c/b>과 피할 수 없는 행동을 뜻하는 \u003cb class=\"key\">cannot but\u003c/b>, \u003cb class=\"key\">cannot ~ too\u003c/b>\u003c/li>\u003c/ul>\u003cbutton class=\"pq-go\" data-act=\"synpractice\">✎ 구문 연습 하러 가기 (9문장)\u003c/button>","segs":[{"n":57,"text":"오늘 우리는 조동사가 들어간 아주 유용하고 재미있는 9가지 구문들을 함께 공부했어요. 형태가 비슷해서 헷갈리기 쉬운 표현들은 예문을 소리 내어 읽어 보면서 확실하게 구분할 수 있어야 해요. 오늘 배운 내용들을 복습 노트에 꼭 정리해 두고 다음 시간에 또 만나요!","hl":"sum"}]}],"syn":{"mode":"blank","items":[{"chunks":[{"en":"You had better","ko":"너는 ~하는 게 낫겠다"},{"en":"clean your room.","ko":"너의 방을 청소하는 것"}],"ko":"너는 방을 청소하는 게 좋겠어.","focus":"had better"},{"chunks":[{"en":"You'd better not","ko":"너는 ~하지 않는 게 낫겠다"},{"en":"bite your nails.","ko":"너의 손톱을 물어뜯는 것"}],"ko":"너는 손톱을 물어뜯지 않는 게 좋겠어.","focus":"had better not"},{"chunks":[{"en":"I used to","ko":"나는 ~하곤 했다"},{"en":"drink coffee","ko":"커피를 마시는 것"},{"en":"after meals.","ko":"식사 후에"}],"ko":"나는 식사 후에 커피를 마시곤 했다.","focus":"used to + 동사원형"},{"chunks":[{"en":"I'm used to","ko":"나는 익숙하다"},{"en":"getting up","ko":"일어나는 것에"},{"en":"early in the morning.","ko":"아침 일찍"}],"ko":"나는 아침 일찍 일어나는 것에 익숙하다.","focus":"be used to + (동)명사"},{"chunks":[{"en":"You may well","ko":"너는 ~하는 것은 당연하다"},{"en":"love your parents.","ko":"너의 부모님을 사랑하는 것"}],"ko":"네가 부모님을 사랑하는 것은 당연하다.","focus":"may well"},{"chunks":[{"en":"I would rather","ko":"나는 차라리 ~하겠다"},{"en":"eat a steak","ko":"스테이크를 먹는 것"},{"en":"than eat pizza.","ko":"피자를 먹느니보다"}],"ko":"나는 피자를 먹느니 차라리 스테이크를 먹겠다.","focus":"would rather A than B"},{"chunks":[{"en":"I would like to","ko":"나는 ~하고 싶다"},{"en":"travel","ko":"여행하는 것"},{"en":"around the world.","ko":"세계 곳곳을"}],"ko":"나는 세계 일주를 하고 싶다.","focus":"would like to"},{"chunks":[{"en":"I can't help but","ko":"나는 ~하지 않을 수 없다"},{"en":"read the book","ko":"그 책을 읽는 것"},{"en":"to the end.","ko":"끝까지"}],"ko":"나는 그 책을 끝까지 읽지 않을 수 없다.","focus":"cannot (help) but"},{"chunks":[{"en":"You cannot","ko":"너는 ~할 수 없다"},{"en":"be too careful","ko":"아무리 조심해도 지나치지"},{"en":"when crossing the street.","ko":"길을 건널 때"}],"ko":"길을 건널 때는 아무리 조심해도 지나치지 않다.","focus":"cannot ~ too"}]}});</script><script>function synKit(){
  /* 구문 강의 끝의 '구문 연습': ① 끊어읽기(/) → ② 의미덩어리 해석 쓰기 → ③ 덩어리 배열 또는 빈칸 채우기 */
  function s(x){return x==null?"":String(x);}
  function esc(x){return s(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function clean(t){return s(t).replace(/[‘’`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g," ").trim();}
  function words(t){t=clean(t);return t?t.split(" "):[];}
  function key(w){return clean(w).toLowerCase().replace(/^[^a-z0-9']+|[^a-z0-9']+$/g,"");}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  /* 문장 하나를 연습 문제로: 단어 목록, 모범 끊는 자리(단어 번호 뒤), 덩어리, 빈칸 덩어리 */
  function item(x,i,mode){
    var ch=(x&&x.chunks||[]).map(function(c){return {en:clean(c&&c.en).replace(/^\(?\d{1,3}[.)]?\s+(?=[A-Za-z"'])/,""),ko:clean(c&&c.ko)};}).filter(function(c){return c.en;});
    if(ch.length<2)return null;
    var W=[],cut={},wc=[];ch.forEach(function(c,k){var w=words(c.en);wc.push([W.length,W.length+w.length]);W=W.concat(w);if(k<ch.length-1)cut[W.length-1]=1;});
    if(W.length<3)return null;
    var ko=clean(x.ko)||ch.map(function(c){return c.ko;}).join(" "),natural=!!clean(x.ko);
    /* 빈칸 덩어리: 첫 덩어리가 아니고 2~6단어인 덩어리, 강조 구문과 겹치면 우선 */
    var fw=words(x.focus).map(key),best=-1,bs=-1;
    ch.forEach(function(c,k){var n=wc[k][1]-wc[k][0];if(n<1||n>7)return;var sc=(k>0?10:0)+(n>=2&&n<=6?5:0)+Math.min(n,4);
      for(var q=wc[k][0];q<wc[k][1];q++)if(fw.indexOf(key(W[q]))>=0){sc+=3;break;}if(sc>bs){bs=sc;best=k;}});
    var kind=mode==="order"?"order":mode==="blank"?"blank":(i%2===0?"order":"blank");
    if(kind==="order"&&ch.length<3&&best>=0)kind="blank";if(kind==="blank"&&best<0)kind="order";
    return {n:i+1,W:W,cut:cut,ch:ch,wc:wc,ko:ko,natural:natural,kind:kind,blank:best};
  }
  function mount(LP){
    var D=LP&&LP.D?LP.D:LP,P=D&&D.syn;if(!P)return null;
    var L=(P.items||[]).map(function(x,i){return item(x,i,P.mode);}).filter(Boolean);if(!L.length)return null;
    var root=document.createElement("div");root.className="pq sy";root.hidden=true;root.setAttribute("role","dialog");root.setAttribute("aria-label","구문 연습");
    root.innerHTML='<div class="pq-in0"><div class="pq-hd"><div class="pq-tt"><b>구문 연습</b><small></small></div><button class="pq-x" type="button">✕ 강의로 돌아가기</button></div><div class="pq-main"></div></div>';
    document.body.appendChild(root);root.querySelector(".pq-tt small").textContent=s(D.title);
    var main=root.querySelector(".pq-main"),S={list:L,idx:0,step:0,res:[]};
    ["keydown","keyup","keypress"].forEach(function(ev){root.addEventListener(ev,function(e){e.stopPropagation();});});
    function open(){if(LP&&LP.stop)try{LP.stop();}catch(_){}root.hidden=false;document.documentElement.classList.add("pq-lock");draw();}
    function close(){root.hidden=true;document.documentElement.classList.remove("pq-lock");}
    root.querySelector(".pq-x").onclick=close;
    document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest('[data-act="synpractice"]');if(t){e.preventDefault();open();}});
    var top=document.querySelector(".lp-top");if(top){var b=document.createElement("button");b.className="pq-open";b.type="button";b.setAttribute("data-act","synpractice");b.textContent="✎ 구문 연습";top.appendChild(b);}
    function start(only){S.list=only||L;S.idx=0;S.step=0;S.res=S.list.map(function(){return {cut:null,last:null};});draw();}
    S.res=L.map(function(){return {cut:null,last:null};});
    var STEPS=["끊어읽기","덩어리 해석","배열·빈칸"];
    function head(it,q){var n=S.list.length;
      return '<div class="pq-pill">'+(S.idx+1)+' / '+n+'</div><ol class="sy-steps">'+STEPS.map(function(t,k){return '<li class="'+(k===S.step?"on":k<S.step?"done":"")+'"><span>'+(k+1)+'</span>'+(k===2?(it.kind==="order"?"배열하기":"빈칸 채우기"):t)+'</li>';}).join("")+'</ol><h2 class="pq-q">'+q+'</h2>';}
    function foot(btn,next){return '<div class="pq-res" hidden></div><div class="pq-foot"><button class="pq-btn sy-main" type="button">'+btn+'</button><button class="pq-btn sy-next" type="button" hidden>'+next+'</button><span class="sy-key">Enter</span></div>';}
    function nextLabel(){return S.step<2?"다음 단계 →":(S.idx<S.list.length-1?"다음 문장 →":"결과 보기");}
    function go(){if(S.step<2)S.step++;else{S.step=0;S.idx++;}draw();root.scrollTop=0;}
    var ENTER=null;
    function bindEnter(fn){ENTER=fn;}
    function onKey(e){if(root.hidden||!ENTER||e.key!=="Enter"||e.shiftKey||e.isComposing||e.keyCode===229)return;var t=e.target&&e.target.tagName;if(t==="BUTTON"||t==="SELECT"||t==="TEXTAREA")return;e.preventDefault();ENTER();}
    root.addEventListener("keydown",onKey);document.addEventListener("keydown",function(e){if(!root.contains(e.target))onKey(e);});
    function draw(){
      if(S.idx>=S.list.length){summary();return;}
      var it=S.list[S.idx];
      if(S.step===0)stepCut(it);else if(S.step===1)stepKo(it);else if(it.kind==="order")stepOrder(it);else stepBlank(it);
      var f=main.querySelector("input.sy-in,.sy-ko textarea");if(f)setTimeout(function(){try{f.focus();}catch(_){}},30);else{try{document.activeElement&&document.activeElement.blur&&document.activeElement.blur();}catch(_){}}
    }
    /* 문장을 끊는 표시(/)와 함께 그리기. marks: {단어번호:종류} 종류 = ok / no(내가 잘못 끊음) / miss(놓친 자리) / me / model */
    function sent(it,marks,cls){var h='<div class="sy-sen '+(cls||"")+'">';
      it.W.forEach(function(w,k){h+='<span class="sy-w" data-k="'+k+'">'+esc(w)+'</span>';
        if(k<it.W.length-1)h+='<span class="sy-g'+(marks&&marks[k]?" "+marks[k]:"")+'" data-g="'+k+'"><i>/</i></span>';});
      return h+'</div>';}
    /* ① 끊어읽기 */
    function stepCut(it){
      var me={};
      main.innerHTML=head(it,"다음 문장을 의미덩어리로 끊어 보세요.")+'<div class="pq-card"><p class="pq-note">단어와 단어 사이(또는 끊을 곳 앞의 단어)를 누르면 <b class="sy-sl">/</b> 표시가 생겨요. 다시 누르면 지워져요.</p><div class="sy-cut"></div><div class="sy-tools"><button type="button" class="sy-tool" data-t="clear">⌫ 지우기</button></div></div>'+foot("끊어읽기 확인",nextLabel());
      var box=main.querySelector(".sy-cut");
      function paint(){var m={};for(var k in me)m[k]="me";box.innerHTML=sent(it,m,"edit");}
      paint();
      box.onclick=function(e){if(S.res[S.idx].cut)return;var g=e.target.closest(".sy-g"),w=e.target.closest(".sy-w"),k=g?+g.getAttribute("data-g"):w?+w.getAttribute("data-k"):-1;
        if(k<0||k>=it.W.length-1)return;if(me[k])delete me[k];else me[k]=1;paint();};
      main.querySelector('[data-t="clear"]').onclick=function(){if(S.res[S.idx].cut)return;me={};paint();};
      var btn=main.querySelector(".sy-main"),nx=main.querySelector(".sy-next");
      function check(){if(S.res[S.idx].cut){go();return;}
        var hit=0,extra=0,miss=0,mine={},model={};for(var k in it.cut){if(me[k]){hit++;mine[k]="ok";}else{miss++;model[k]="miss";}model[k]=model[k]||"model";}
        for(k in me)if(!it.cut[k]){extra++;mine[k]="no";}
        var tot=Object.keys(it.cut).length,ok=!extra&&!miss;S.res[S.idx].cut={ok:ok,hit:hit,tot:tot,extra:extra};
        main.querySelector(".pq-card").innerHTML='<div class="sy-ans"><span class="sy-lb me">나의 답안</span>'+sent(it,mine)+'</div><div class="sy-ans"><span class="sy-lb">모범 답안</span>'+sent(it,model,"model")+'</div>';
        var rb=main.querySelector(".pq-res");rb.hidden=false;rb.className="pq-res "+(ok?"ok":"no");
        rb.innerHTML=ok?'<b>✓ 모범 답안과 똑같이 끊었어요!</b>':'<b>'+hit+' / '+tot+' 자리를 맞혔어요.</b><div class="pq-exp">'+(miss?'<span class="sy-k miss">/</span> 놓친 자리 '+miss+'곳 ':'')+(extra?'<span class="sy-k no">/</span> 모범 답안에는 없는 자리 '+extra+'곳':'')+'<br>끊는 자리는 조금 달라도 뜻이 통하면 괜찮아요. 모범 답안의 덩어리로 다음 단계를 해 봐요.</div>';
        btn.hidden=true;nx.hidden=false;nx.focus();}
      btn.onclick=check;nx.onclick=go;bindEnter(function(){if(!nx.hidden)go();else check();});
    }
    /* ② 덩어리마다 해석 쓰기 */
    function stepKo(it){
      var h='<div class="sy-kos">';it.ch.forEach(function(c,k){h+='<div class="sy-ko"><div class="e">'+esc(c.en)+(k<it.ch.length-1?' <b class="sy-sl">/</b>':'')+'</div><textarea rows="1" class="pq-in" data-k="'+k+'" placeholder="해석을 써 보세요"></textarea><div class="m" hidden>'+esc(c.ko)+'</div></div>';});h+='</div>';
