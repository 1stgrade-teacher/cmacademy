window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"12강","title":"19. 분사, to부정사 형태의 목적격보어","audioDir":"unit19-a_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">19. 분사, to부정사 형태의 목적격보어\u003c/div>\u003ch1>분사와 to부정사를 목적격보어로 쓰는 5형식 마스터\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>지각동사, 사역동사, 그리고 to부정사를 목적격보어로 취하는 동사들의 5형식 문장 구조를 완벽하게 이해하고 영작할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕 여러분, 오늘 우리 함께 공부할 내용은 정말 중요해요. 바로 19번 유닛인 분사와 to부정사 형태의 목적격보어인데요. 5형식 문장에서 목적어가 무엇을 하는지 설명해 주는 목적격보어 자리에 어떤 형태가 오는지 꼼꼼하게 파헤쳐 볼 거예요. 자, 그럼 선생님과 함께 기분 좋게 출발해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">19. 분사, to부정사 형태의 목적격보어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">5형식 문장에서 목적어 뒤에 오는 목적격보어로 \u003cb class=\"key\">지각동사\u003c/b>는 \u003cb class=\"key\">현재분사나 동사원형\u003c/b>, \u003cb class=\"key\">사역동사\u003c/b>는 \u003cb class=\"key\">과거분사나 동사원형\u003c/b>, 그 외 일반동사들은 주로 \u003cb class=\"key\">to부정사\u003c/b>를 취합니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>I \u003cspan class=\"fx\">felt the house shaking\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>She \u003cspan class=\"fx\">had the dress made\u003c/span> by this week.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>\u003cspan class=\"fx\">Get your car parked\u003c/span> here.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>My mother \u003cspan class=\"fx\">allowed me to go out\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>We \u003cspan class=\"fx\">want our father to cook dinner\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>The accident \u003cspan class=\"fx\">caused her to quit the job\u003c/span>.\u003c/div>\u003cdiv class=\"y div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to go out\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to step outside\u003c/span>\u003cspan class=\"y-eq\">go out = step outside\u003c/span>\u003cdiv class=\"w\">외출하다라는 표현을 밖으로 나가다라는 표현으로 바꾸어 쓸 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">My mother permitted me to go out.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"엄마가 내가 밖에 나갈 수 있도록 허락해 주신 따뜻하고 고마운 상황을 그린 문장이에요.","hl":"mn"},{"n":24,"text":"allow를 비슷한 뜻의 permit으로 바꿔서 My mother permitted me to go out이라고 쓰면 조금 더 멋진 표현이 돼요.","hl":"rw"},{"n":25,"text":"allow와 permit은 둘 다 목적격보어로 to부정사를 데리고 다니는 대표적인 동사랍니다.","hl":"ph"},{"n":26,"text":"이 문장을 똑같은 의미로 My mother permitted me to go out이라고 바꿔 말할 수도 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 8\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">We \u003cspan class=\"fx\">want our father to cook dinner\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We want\u003c/div>\u003cdiv class=\"k\">우리는 원한다\u003c/div>\u003cdiv class=\"e\">our father\u003c/div>\u003cdiv class=\"k\">우리 아버지가\u003c/div>\u003cdiv class=\"e\">to cook dinner.\u003c/div>\u003cdiv class=\"k\">저녁을 요리해 주시기를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>동사 \u003cb class=\"key\">want\u003c/b> + 목적어 \u003cb class=\"key\">our father\u003c/b> + to부정사 \u003cb class=\"key\">to cook dinner\u003c/b>가 와서 목적어가 ~하기를 바라는 소망을 나타냅니다.\u003c/div>","segs":[{"n":27,"text":"We want, 우리는 원한다. our father, 우리 아버지가. to cook dinner, 저녁을 요리해 주시기를","hl":"ch"},{"n":28,"text":"다섯 번째 문장입니다. want 동사 뒤에 목적어 our father가 나오고 그 뒤에 목적격보어로 to부정사 to cook dinner가 쓰였어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 8\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">We \u003cspan class=\"fx\">want our father to cook dinner\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>아버지가 맛있는 저녁 식사를 만들어 주셨으면 하는 가족들의 바람을 담고 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">want our father to cook dinner\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">expect our father to cook dinner\u003c/span>\u003cdiv class=\"w\">원하다라는 want를 기대하다라는 expect로 바꾸어 아버지가 요리해 주실 것을 기대하는 뉘앙스로 만들 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">want\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">would like\u003c/span>\u003cspan class=\"y-eq\">want = would like\u003c/span>\u003cdiv class=\"w\">정중하게 무엇을 원한다고 할 때 want를 would like로 바꿀 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cook dinner\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">prepare supper\u003c/span>\u003cspan class=\"y-eq\">cook dinner = prepare supper\u003c/span>\u003cdiv class=\"w\">저녁을 요리하다라는 표현을 저녁 식사를 준비하다라는 표현으로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We expect our father to cook dinner.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"아버지가 우리를 위해 맛있는 저녁을 만들어 주셨으면 하는 가족들의 귀여운 바람을 나타내죠.","hl":"mn"},{"n":30,"text":"want를 expect로 바꿔서 We expect our father to cook dinner라고 쓰면 아버지가 요리해 주실 걸 기대한다는 뜻이 돼요.","hl":"rw"},{"n":31,"text":"want나 wish, expect 같은 동사들은 모두 뒤에 목적어와 to부정사를 짝으로 데리고 다닌다는 걸 잊지 마세요.","hl":"ph"},{"n":32,"text":"뜻이 같은 다른 표현으로 We expect our father to cook dinner라고 아주 자연스럽게 바꿔 말할 수 있답니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u0
