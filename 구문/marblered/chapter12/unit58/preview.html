  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

    att=0;playAudio(s);}

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 58 부정 구문","title":"헷갈리기 쉬운 영어 부정 표현 정복하기","audioDir":"preview_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 12 Unit 58 부정 구문\u003c/div>\u003ch1>헷갈리기 쉬운 영어 부정 표현 정복하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>전체 부정부터 이중 부정, 준부정어까지 다양한 부정의 형태와 의미를 정확하게 이해한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 챕터 십이 유닛 오십팔에서 다루는 다양한 부정 구문을 함께 배워볼 거예요. 영어를 공부하다 보면 낫이라는 단어가 들어가지 않았는데도 부정의 의미를 가진 표현들이 많아서 헷갈릴 때가 있죠. 오늘 저와 함께 전체 부정부터 부분 부정, 준부정어, 이중 부정 그리고 낫띵 벗과 애니띵 벗의 차이까지 깔끔하게 정리해 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">전체 부정과 부분 부정\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전체 부정은 no, none, never, neither, nothing 등을 사용하여 모두 ~아니다라는 \u003cb class=\"key\">전체 부정\u003c/b> 의미를 나타내요. 반면 not all, not every, not both, not always, not necessarily는 모두 ~인 것은 아니다라는 \u003cb class=\"key\">부분 부정\u003c/b> 의미를 나타내요.\u003cdiv>\u003cspan class=\"g-formula\">not + 전체를 나타내는 말(all, every, both, always, necessarily) = 부분 부정\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">None\u003c/span> of the answers was correct.\u003c/div>\u003cdiv class=\"g-ko\">정답은 하나도 없었다.\u003c/div>\u003cdiv class=\"g-note\">none을 사용하여 전체를 부정하는 문장이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Not all\u003c/span> birds can fly.\u003c/div>\u003cdiv class=\"g-ko\">모든 새가 날 수 있는 것은 아니다.\u003c/div>\u003cdiv class=\"g-note\">not all을 사용하여 부분적으로 부정하는 문장이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>부분 부정 표현에서 not의 위치는 항상 전체를 나타내는 말 바로 앞에 와야 해요.\u003c/div>","segs":[{"n":2,"text":"첫 번째로 전체 부정과 부분 부정의 차이를 알아볼게요. 노나 넌, 네버 같은 단어들이 쓰이면 모두 아니다라는 전체 부정의 뜻이 돼요. 하지만 낫 올이나 낫 에브리처럼 낫이 전체를 나타내는 말 앞에 붙으면 모두 그런 것은 아니라는 부분 부정의 의미가 된답니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 볼게요. None of the answers was correct. 라고 하면 정답은 하나도 없었다라는 뜻이에요. 넌을 써서 모든 답이 아니라고 전체를 부정하고 있죠.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. Not all birds can fly. 라고 하면 모든 새가 날 수 있는 것은 아니다라는 뜻이에요. 낫 올을 써서 전부 다 날 수 있는 건 아니라고 부분 부정을 하고 있어요.","hl":"ex-1"},{"n":5,"text":"여기서 주의할 점은 낫의 위치예요. 부분 부정을 할 때는 반드시 올이나 에브리 같은 단어 바로 앞에 낫을 써야 한다는 것을 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">준부정어와 이중 부정\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">few, little, hardly, scarcely, rarely, seldom 같은 \u003cb class=\"key\">준부정어\u003c/b>는 그 자체로 거의 ~않다라는 부정의 의미를 가져요. 또한 no ~ without ~ing나 never ~ without ~ing 형태의 \u003cb class=\"key\">이중 부정\u003c/b>은 ~하면 반드시 ...한다라는 강한 긍정의 의미를 나타내요.\u003cdiv>\u003cspan class=\"g-formula\">no ~ without ~ing = ~할 때마다 반드시 ...하다\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I could \u003cspan class=\"fx\">hardly\u003c/span> breathe.\u003c/div>\u003cdiv class=\"g-ko\">나는 거의 숨을 쉴 수 없었다.\u003c/div>\u003cdiv class=\"g-note\">hardly를 사용하여 거의 ~할 수 없었다는 의미를 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I never see her without feeling happy.\u003c/div>\u003cdiv class=\"g-ko\">나는 그녀를 볼 때마다 행복해진다.\u003c/div>\u003cdiv class=\"g-note\">이중 부정 구문으로 ~할 때마다 반드시 ~한다는 의미예요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>준부정어가 문장 맨 앞에 오면 주어와 동사의 위치가 도치될 수 있다는 점을 기억하세요.\u003c/div>","segs":[{"n":6,"text":"다음으로 준부정어와 이중 부정에 대해 살펴볼게요. 퓨나 리틀, 하들리 같은 준부정어들은 낫이 없어도 거의 뭐뭐 하지 않다라는 부정의 뜻을 담고 있어요. 그리고 노나 네버와 위다웃이 함께 쓰이는 이중 부정 구문은 뭐뭐 하면 반드시 무엇무엇을 한다는 뜻이 된답니다.","hl":"rule"},{"n":7,"text":"첫 번째 예문을 보죠. I could hardly breathe. 라고 하면 나는 거의 숨을 쉴 수 없었다라는 뜻이에요. 하들리가 들어가서 거의 숨을 쉴 수 없었다는 부정적인 의미를 만들어요.","hl":"ex-0"},{"n":8,"text":"다음 예문이에요. I never see her without feeling happy. 라고 하면 나는 그녀를 볼 때마다 행복해진다라는 뜻이에요. 네버와 위다웃이 만나서 그녀를 볼 때는 언제나 행복을 느낀다는 이중 부정의 긍정 의미를 나타내요.","hl":"ex-1"},{"n":9,"text":"준부정어가 문장 맨 앞으로 가버리면 주어랑 동사의 자리가 바뀐다는 팁도 함께 알아두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">nothing but과 anything but\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">nothing but은 단지 ~뿐이라는 \u003cb class=\"key\">only\u003c/b>의 의미를 나타내고, anything but은 결코 ~가 아닌이라는 \u003cb class=\"key\">강한 부정\u003c/b>의 의미를 나타내요.\u003cdiv>\u003cspan class=\"g-formula\">nothing but = only / anything but = never / not at all\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He is \u003cspan class=\"fx\">anything but\u003c/span> lazy.\u003c/div>\u003cdiv class=\"g-ko\">그는 결코 게으르지 않다.\u003c/div>\u003cdiv class=\"g-note\">anything but을 사용하여 결코 게으르지 않음을 강조해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>anything but은 not의 의미와 같아서 뒤에 오는 형용사의 반대 의미로 이해하면 쉬워요.\u003c/div>","segs":[{"n":10,"text":"마지막으로 낫띵 벗과 애니띵 벗의 차이를 알아볼게요. 낫띵 벗은 단지 뭐뭐뿐이라는 온니의 뜻이지만, 애니띵 벗은 결코 뭐뭐가 아니라는 아주 강한 부정의 뜻을 가지므로 혼동하지 않도록 주의해야 해요.","hl":"rule"},{"n":11,"text":"예문을 함께 읽어볼게요. He is anything but lazy. 라고 하면 그는 결코 게으르지 않다라는 뜻이에요. 애니띵 벗이 쓰여서 게으른 것과는 전혀 거리가 멀다는 것을 강조하고 있죠.","hl":"ex-0"},{"n":12,"text":"팁을 하나 주자면 애니띵 벗 뒤에 나오는 형용사의 반대말로 해석하면 훨씬 쉽게 이해할 수 있어요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>All birds cannot fly.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Not all birds can fly.\u003c/div>\u003cdiv class=\"g-why\">낫을 올 앞에 쓰지 않고 캔트 뒤에 쓰면 전체 부정인 모두 날 수 없다라는 뜻이 되어 의미가 달라져요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He is nothing but lazy.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He is anything but lazy.\u003c/div>\u003cdiv class=\"g-why\">그는 단지 게으를 뿐이라는 의미가 아니라 결코 게으르지 않다고 해야 하므로 anything but을 써야 해요.\u003c/div>\u003c/div>","segs":[{"n":13,"text":"학생들이 자주 하는 실수 중 하나는 부분 부정을 쓸 때 낫의 위치를 잘못 놓는 거예요. 올버즈 캔트 플라이라고 하면 모든 새가 날 수 없다는 뜻이 되므로 모든 새가 다 날 수 있는 것은 아니라고 할 때는 반드시 낫 올 버즈 캔 플라이처럼 써야 해요.","hl":"mk-0"},{"n":14,"text":"두 번째 실수는 낫띵 벗과 애니띵 벗을 헷갈리는 거예요. 그는 단지 게으를 뿐이다가 아니라 결코 게으르지 않다고 말하고 싶다면 낫띵 벗이 아니라 애니띵 벗을 써야 한다는 것을 꼭 기억해 주세요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 가장 적절한 표현을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">____ of the answers was correct.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>Not all\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>None\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Hardly\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Anything but\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">None\u003c/span>\u003cdiv class=\"g-exp\">정답이 하나도 없었다는 전체 부정의 의미를 나타내야 하므로 단수 동사 was와 어울리는 None이 정답이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":15,"text":"첫 번째 문제입니다. 빈칸에 들어갈 가장 적절한 표현을 골라보세요. None of the answers was correct라는 문맥을 생각하며 첫 번째부터 네 번째 보기 중에서 정답을 골라보고 잠시 멈추고 직접 풀어보세요.","hl":"q"},{"n":16,"text":"","hl":"q","pause":6},{"n":17,"text":"정답은 두 번째 보기인 None이에요. 정답은 하나도 없었다는 전체 부정을 나타내야 하고 뒤에 단수 동사 워즈가 왔기 때문에 넌이 가장 알맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 밑줄 친 부분의 의미가 바르게 설명된 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Not all birds can fly.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>어떤 새도 날 수 없다\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>모든 새가 날 수 있다\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>모든 새가 날 수 있는 것은 아니다\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>새들은 결코 날 수 없다\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">모든 새가 날 수 있는 것은 아니다\u003c/span>\u003cdiv class=\"g-exp\">not all은 전체를 부정하는 것이 아니라 일부는 맞고 일부는 아님을 나타내는 부분 부정이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"두 번째 문제입니다. 낫 올 버즈 캔 플라이라는 문장에서 낫 올의 뜻으로 바른 것을 첫 번째 보기부터 네 번째 보기 중에서 골라보세요. 잠깐 멈추고 직접 풀어보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":6},{"n":20,"text":"정답은 세 번째 보기인 모든 새가 날 수 있는 것은 아니다예요. 낫 올은 전체를 다 부정하는 게 아니라 일부는 맞고 일부는 아님을 나타내는 부분 부정이기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 알맞은 말을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">I could ______ breathe in the smoke-filled room.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>always\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>hardly\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>very\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>quite\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">hardly\u003c/span>\u003cdiv class=\"g-exp\">연기가 가득한 방에서 거의 숨을 쉴 수 없었다는 의미가 되어야 하므로 준부정어 hardly가 정답이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":21,"text":"세 번째 문제입니다. 연기가 가득한 방에서 숨을 거의 쉴 수 없 text":"정답은 세 번째 보기인 None이에요. 넌은 전체 부정이라서 뒤에 일부는 날 수 없다는 부분 부정의 맥락과 어긋나기 때문에 낫 올이나 낫 에브리, 낫 보스 같은 부분 부정 표현이 들어가야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 12 Unit 58 부정 구문\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>모두 ~가 아니라는 \u003cb class=\"key\">전체 부정\u003c/b>과 모두 ~인 것은 아니라는 \u003cb class=\"key\">부분 부정\u003c/b>의 표현을 구분하여 사용할 수 있어요.\u003c/li>\u003cli>거의 ~않다라는 의미의 \u003cb class=\"key\">준부정어\u003c/b>와 ~하면 반드시 ~한다는 \u003cb class=\"key\">이중 부정\u003c/b> 구문의 의미를 정확히 이해했어요.\u003c/li>\u003cli>단지 ~뿐이라는 \u003cb class=\"key\">nothing but\u003c/b>과 결코 ~가 아닌이라는 \u003cb class=\"key\">anything but\u003c/b>의 차이를 확실하게 익혔어요.\u003c/li>\u003c/ul>","segs":[{"n":33,"text":"오늘 우리는 전체 부정과 부분 부정 그리고 준부정어와 이중 부정까지 영어의 다양한 부정 구문들을 꼼꼼하게 정리해 보았어요. 낫이 들어간 위치나 단어 하나에 따라 의미가 완전히 달라질 수 있으니까 오늘 배운 내용들을 복습하면서 내 것으로 만들어 보아요. 오늘 강의는 여기까지예요. 수고하셨어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
