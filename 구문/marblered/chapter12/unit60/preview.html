  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}

    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};

  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 60 전치사 + 명사절","title":"전치사 뒤에 명사절이 오는 다양한 형태 정복하기","audioDir":"preview_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 12 Unit 60\u003c/div>\u003ch1>전치사 뒤에 명사절이 오는 다양한 형태 정복하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>전치사 뒤에 올 수 있는 의문사절, whether절, 복합관계대명사절 및 예외적인 that절의 쓰임을 정확히 이해한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 전치사 뒤에 명사절이 오는 다양한 형태에 대해 공부할 거예요. 전치사 뒤에는 보통 명사나 대명사가 오지만, 절 형태도 목적어로 올 수 있답니다. 특히 시험에 자주 나오는 예외적인 표현들과 함께 꼼꼼하게 정리해 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">전치사 뒤의 의문사절과 whether절\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사 뒤에는 \u003cb class=\"key\">that절\u003c/b>을 쓸 수 없고, \u003cb class=\"key\">whether\u003c/b>, \u003cb class=\"key\">what\u003c/b>, \u003cb class=\"key\">how\u003c/b> 같은 의문사절이나 whether절을 목적어로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + whether / what / how + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">We talked \u003cspan class=\"fx\">about what we should do\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우리는 무엇을 해야 할지에 대해 이야기했다.\u003c/div>\u003cdiv class=\"g-note\">전치사 about의 목적어로 what절이 쓰였다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>전치사 바로 뒤에는 \u003cb class=\"key\">whether\u003c/b>는 쓸 수 있지만 \u003cb class=\"key\">if\u003c/b>는 명사절을 이끌어도 전치사의 목적어로 쓸 수 없으니 주의하세요.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념이에요. 전치사 뒤에는 that절을 쓸 수 없고 대신 whether, what, how 같은 의문사절이나 whether절을 쓴다는 점을 기억해야 해요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 볼게요. We talked about what we should do는 우리는 무엇을 해야 할지에 대해 이야기했다라는 뜻이에요. 전치사 about 뒤에 what we should do가 목적어로 왔어요.","hl":"ex-0"},{"n":4,"text":"주의할 점이 있어요. 전치사 바로 뒤에는 whether는 쓸 수 있지만 if는 쓸 수 없다는 것을 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">전치사 + that절의 예외 (in that, except that, but that)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사 뒤에 that절은 원칙적으로 안 되지만, \u003cb class=\"key\">in that\u003c/b>은 ~라는 점에서라는 이유와 근거를 나타내고, \u003cb class=\"key\">except that\u003c/b>과 \u003cb class=\"key\">but that\u003c/b>은 ~라는 점을 제외하면이라는 의미로 예외적으로 쓰인다.\u003cdiv>\u003cspan class=\"g-formula\">in that / except that + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This plan is good \u003cspan class=\"fx\">in that it saves money\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">이 계획은 돈을 절약한다는 점에서 좋다.\u003c/div>\u003cdiv class=\"g-note\">in that절이 앞 문장의 이유와 근거를 설명한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The trip was perfect \u003cspan class=\"fx\">except that it rained\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">비가 온 것만 제외하면 여행은 완벽했다.\u003c/div>\u003cdiv class=\"g-note\">except that절로 예외적인 상황을 더한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>이 표현들은 하나의 접속사구처럼 외워두면 독해할 때 아주 유용해요.\u003c/div>","segs":[{"n":5,"text":"두 번째 개념은 전치사 뒤에 that절이 오는 예외적인 경우예요. in that은 ~라는 점에서라는 이유를 나타내고 except that이나 but that은 ~라는 점을 제외하면이라는 의미로 쓰여요.","hl":"rule"},{"n":6,"text":"첫 번째 예문을 들어볼게요. This plan is good in that it saves money는 이 계획은 돈을 절약한다는 점에서 좋다라는 뜻이에요. in that it saves money가 이 계획이 좋은 이유를 설명하고 있어요.","hl":"ex-0"},{"n":7,"text":"두 번째 예문을 볼까요. The trip was perfect except that it rained는 비가 온 것만 제외하면 여행은 완벽했다라는 뜻이에요. 비가 온 것을 빼고는 완벽하다는 의미로 except that이 쓰였어요.","hl":"ex-1"},{"n":8,"text":"이 표현들은 따로 떼어서 외우기보다 하나의 표현처럼 기억해 두면 문장 해석이 훨씬 쉬워져요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">전치사와 의문사절의 확장 (as to, in terms of)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">as to\u003c/b>는 ~에 관해라는 뜻이고, \u003cb class=\"key\">in terms of\u003c/b>는 ~의 관점에서라는 뜻으로 뒤에 의문사절이나 명사절을 취한다.\u003cdiv>\u003cspan class=\"g-formula\">as / in terms of + 의문사절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">There is a debate \u003cspan class=\"fx\">as to whether it is safe\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그것이 안전한지에 대한 논쟁이 있다.\u003c/div>\u003cdiv class=\"g-note\">as to 뒤에 whether절이 와서 논쟁의 내용을 구체화한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>as to는 전치사 about과 비슷한 의미로 쓰인다고 이해하면 쉬워요.\u003c/div>","segs":[{"n":9,"text":"세 번째 개념이에요. as to는 무엇에 관해라는 뜻이고 in terms of는 무엇의 관점에서라는 뜻으로 뒤에 의문사절을 이끌어 쓸 수 있어요.","hl":"rule"},{"n":10,"text":"예문을 함께 읽어볼게요. There is a debate as to whether it is safe는 그것이 안전한지에 대한 논쟁이 있다라는 뜻이에요. as to 뒤에 whether가 이끄는 절이 와서 어떤 논쟁인지 설명하고 있죠.","hl":"ex-0"},{"n":11,"text":"as to는 우리가 잘 아는 전치사 about과 비슷한 의미로 쓰인다고 생각하면 이해하기 편할 거예요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">전치사 + 복합관계대명사절\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">whoever\u003c/b>나 \u003cb class=\"key\">whatever\u003c/b> 같은 복합관계대명사절도 문장 안에서 전치사의 목적어 역할을 할 수 있다.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + whoever / whatever + 동사 (~하는 사람이 누구든지 / 무엇이든지)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Give it \u003cspan class=\"fx\">to whoever needs it\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그것이 필요한 사람에게는 누구에게든 줘라.\u003c/div>\u003cdiv class=\"g-note\">전치사 to의 목적어로 whoever절이 사용되었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>복합관계대명사절은 명사절 역할을 하므로 전치사 뒤에 오는 데 문제가 없어요.\u003c/div>","segs":[{"n":12,"text":"마지막 네 번째 개념이에요. whoever나 whatever 같은 복합관계대명사절도 전치사의 목적어 자리에 올 수 있다는 것을 배워볼게요.","hl":"rule"},{"n":13,"text":"예문을 살펴볼게요. Give it to whoever needs it는 그것이 필요한 사람에게는 누구에게든 줘라라는 뜻이에요. 전치사 to 뒤에 whoever needs it이라는 복합관계대명사절이 목적어로 왔어요.","hl":"ex-0"},{"n":14,"text":"복합관계대명사절이 명사절의 역할을 하기 때문에 전치사 뒤에 자연스럽게 올 수 있답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>We talked about that we should do.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ We talked about what we should do.\u003c/div>\u003cdiv class=\"g-why\">전치사 바로 뒤에는 명사절을 이끄는 접속사 that을 쓸 수 없고 what이나 whether 등을 써야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>There is a debate about if it is safe.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ There is a debate about whether it is safe.\u003c/div>\u003cdiv class=\"g-why\">전치사 바로 뒤의 목적어 자리에는 접속사 if를 쓸 수 없고 whether를 써야 한다.\u003c/div>\u003c/div>","segs":[{"n":15,"text":"첫 번째 자주 하는 실수를 볼게요. 전치사 about 뒤에 that을 써서 틀린 문장이에요. 전치사 뒤에는 that을 쓸 수 없으므로 what을 써야 올바른 문장이 돼요.","hl":"mk-0"},{"n":16,"text":"두 번째 실수예요. 전치사 about 뒤에 if를 쓰면 틀려요. 전치사 바로 뒤의 명사절 자리에는 if를 쓸 수 없고 whether만 쓸 수 있다는 점을 꼭 기억해 주세요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 어법상 틀린 부분을 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"g-qs\">We talked about that we should do.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">about that -&gt; about what\u003c/span>\u003cdiv class=\"g-exp\">전치사 about 뒤에는 that절을 쓸 수 없으므로 what절을 써야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"첫 번째 문제예요. 제시된 문장에서 어법상 틀린 부분을 찾아 바르게 고쳐보세요. 화면의 문장을 잠시 멈추고 직접 풀어보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":6},{"n":19,"text":"정답은 about that을 about what으로 고치는 거예요. 전치사 뒤에는 that절을 쓸 수 없기 때문이죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">This plan is good ____ it saves money.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>that\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>in that\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>except\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>as to\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">in that\u003c/span>\u003cdiv class=\"g-exp\">~라는 점에서라는 의미로 이유와 근거를 나타내는 전치사구는 in that이다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"두 번째 문제는 빈칸 채우기예요. 빈칸에 들어갈 가장 알맞은 표현을 보기 중에서 골라보세요. 잠시 멈추고 정답을 생각해보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 두 번째 보기인 in that이에요. 돈을 절약한다는 점에서 좋다라는 의미의 이유를 나타내므로 in that이 알맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 어법상 올바른 문장을 고르시오.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>We are thinking about if we should go.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>The trip was perfect except that it rained.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Give it to whomever needs it.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>There is a doubt about that he is honest.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The trip was perfect except that it rained.\u003c/span>\u003cdiv class=\"g-exp\">except that은 ~라는 점을 제외하면이라는 의미로 올바르게 쓰였다. 첫 번째는 전치사 뒤 if 불가, 세 번째는 주격 관계대명사 자리이므로 whoever가 맞고, 네 번째는 전치사 뒤 that 불가이다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"세 번째 문제는 객관식이에요. 보기 네 개 중 어법상 올바른 문장을 골라보세요. 영상을 멈추고 천천히 읽어본 뒤 풀어보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":6},{"n":25,"text":"정답은 두 번째 보기예요. except that은 ~를 제외하면이라는 뜻으로 알맞게 쓰였고, 나머지 문장들은 전치사 뒤에 if나 that을 썼거나 격이 틀렸어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 말을 쓰시오.\u003c/div>\u003cdiv class=\"g-qs\">There is a debate as to ________ it is safe.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">whether\u003c/span>\u003cdiv class=\"g-exp\">as to 뒤에서 안전한지 아닌지 선택의 의미를 나타내는 명사절 접속사 whether가 와야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"네 번째 문제예요. 빈칸에 들어갈 알맞은 단어를 직접 적어보세요. 잠시 멈추고 생각해 보세요.","hl":"q"},{"n":27,"text":"","hl":"q","pause":6},{"n":28,"text":"정답은 whether예요. as to 뒤에서 안전한지에 대한 논쟁이라는 의미를 만들어야 하므로 whether가 정답이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 단어를 바르게 배열하시오. (의미: 그것이 필요한 사람에게는 누구에게든 줘라)\u003c/div>\u003cdiv class=\"g-qs\">Give / it / to / needs / it / whoever (.)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Give it to whoever needs it.\u003c/span>\u003cdiv class=\"g-exp\">전치사 to 뒤에 복합관계대명사절 whoever needs it이 목적어로 왔다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":29,"text":"다섯 번째 문제는 단어 배열이에요. 주어진 단어를 알맞게 배열해 문장을 완성해 보세요. 잠시 멈추고 공책에 적어보세요.","hl":"q"},{"n":30,"text":"","hl":"q","pause":6},{"n":31,"text":"정답은 Give it to whoever needs it이에요. 전치사 to 뒤에 복합관계대명사절이 목적어로 온 형태죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말에 알맞도록 영작하시오.\u003c/div>\u003cdiv class=\"g-qs\">비가 온 것만 제외하면 여행은 완벽했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The trip was perfect except that it rained.\u003c/span>\u003cdiv class=\"g-exp\">except that S V 구조를 사용하여 ~라는 점을 제외하면이라는 의미를 영작한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":32,"text":"마지막 여섯 번째 문제예요. 주어진 우리말 뜻을 보고 알맞은 영어 문장으로 영작해 보세요. 화면을 멈추고 직접 써보세요.","hl":"q"},{"n":33,"text":"","hl":"q","pause":6},{"n":34,"text":"정답은 The trip was perfect except that it rained예요. except that을 활용해 문장을 바르게 완성하셨나요?","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 12 Unit 60\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>전치사 뒤에는 \u003cb class=\"key\">that절\u003c/b>을 쓸 수 없고 \u003cb class=\"key\">whether\u003c/b>, \u003cb class=\"key\">what\u003c/b>, \u003cb class=\"key\">how\u003c/b> 같은 의문사절이나 whether절을 쓴다.\u003c/li>\u003cli>\u003cb class=\"key\">in that\u003c/b>은 ~라는 점에서, \u003cb class=\"key\">except that\u003c/b>은 ~라는 점을 제외하면이라는 의미의 예외적인 전치사 + that절 표현이다.\u003c/li>\u003cli>\u003cb class=\"key\">whoever\u003c/b>나 \u003cb class=\"key\">whatever\u003c/b> 같은 복합관계대명사절도 전치사의 목적어가 될 수 있다.\u003c/li>\u003c/ul>","segs":[{"n":35,"text":"오늘 우리는 전치사 뒤에 명사절이 오는 다양한 형태를 함께 공부했어요. 전치사 뒤에 that절을 쓸 수 없다는 기본 원칙과 in that, except that 같은 예외 표현들을 잘 기억해 두세요. 오늘 배운 내용을 복습하면서 마무리할게요. 수고하셨습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
