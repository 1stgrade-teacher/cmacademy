}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 59 동명사 관용 구문","title":"내신과 수능에 꼭 나오는 동명사 관용 구문 마스터하기","audioDir":"preview_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 12 Unit 59 동명사 관용 구문\u003c/div>\u003ch1>내신과 수능에 꼭 나오는 동명사 관용 구문 마스터하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>자주 출제되는 동명사 관용 표현의 의미를 정확히 알고 문장에 적용할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 고등학교 내신과 수능 어법 문제에서 절대 놓쳐서는 안 되는 동명사 관용 구문을 함께 공부할 거예요. 동명사의 관용 표현들은 정해진 형태와 뜻이 있어서 암기해 두면 시험에서 아주 쉽게 정답을 찾을 수 있답니다. 자, 그럼 집중해서 첫 번째 핵심 구문부터 차근차근 시작해 볼까요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">소용없음과 불가능, 그리고 피할 수 없는 행동 표현하기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">It is no use\u003c/b> 또는 \u003cb class=\"key\">There is no\u003c/b> 뒤에 동명사를 쓰면 각각 '~해도 소용없다', '~하는 것은 불가능하다'라는 뜻이 돼요. 또한 \u003cb class=\"key\">cannot help\u003c/b> 뒤에 동명사를 쓰면 '~하지 않을 수 없다', \u003cb class=\"key\">feel like\u003c/b> 뒤에 동명사를 쓰면 '~하고 싶다'라는 의미를 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">It is no use / There is no / cannot help / feel like + ~ing\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It is no use \u003cspan class=\"fx\">crying over spilt milk\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">엎질러진 우유를 두고 울어도 소용없다.\u003c/div>\u003cdiv class=\"g-note\">이미 벌어진 일에 대해 후회해도 소용없다는 의미의 관용 구문이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I cannot help \u003cspan class=\"fx\">laughing at his jokes\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그의 농담에 웃지 않을 수 없다.\u003c/div>\u003cdiv class=\"g-note\">cannot help 다음에 동명사를 써서 어쩔 수 없이 무언가를 함을 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I feel like \u003cspan class=\"fx\">eating pizza tonight\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 오늘 밤에 피자를 먹고 싶다.\u003c/div>\u003cdiv class=\"g-note\">feel like 다음에 동명사를 쓰면 '~하고 싶다'라는 뜻이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>cannot help 뒤에 동명사 대신 \u003cb class=\"key\">cannot help but\u003c/b> 동사원형을 써도 같은 뜻이 되므로 함께 기억해 두세요.\u003c/div>","segs":[{"n":2,"text":"첫 번째로 살펴볼 표현들은 뭔가 소용이 없거나 피할 수 없는 상황을 나타낼 때 쓰는 구문들이에요. It is no use 뒤에 동명사를 쓰면 아무리 해도 소용없다는 뜻이 되고, There is no 뒤에 쓰면 아예 불가능하다는 뜻이 되죠. 그리고 멈출 수 없이 꼭 해야 할 때는 cannot help를, 무언가 하고 싶은 마음이 들 때는 feel like를 쓴다는 것을 기억해 주세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 읽어 볼게요. It is no use crying over spilt milk. 엎질러진 우유를 두고 울어도 소용없다라는 뜻이에요. 이미 벌어진 일에 대해 후회해 봤자 소용없다는 의미로 아주 자주 쓰이는 표현이랍니다.","hl":"ex-0"},{"n":4,"text":"다음 예문이에요. I cannot help laughing at his jokes. 나는 그의 농담에 웃지 않을 수 없다라는 뜻이죠. cannot help 뒤에 동명사가 와서 웃음을 참을 수 없다는 의미를 아주 잘 보여 주고 있어요.","hl":"ex-1"},{"n":5,"text":"보충 예문 하나 더 볼게요. I feel like eating pizza tonight. 나는 오늘 밤에 피자를 먹고 싶다라는 뜻이에요. feel like 뒤에 동명사를 써서 지금 당장 무언가를 하고 싶은 기분을 나타낼 수 있답니다.","hl":"ex-2"},{"n":6,"text":"여기서 아주 중요한 팁을 하나 드릴게요. cannot help 뒤에 동명사를 쓰는 것과 똑같은 뜻으로 cannot help but 뒤에 동사원형을 쓸 수도 있어요. 시험에 아주 잘 나오니까 이 두 가지 형태를 꼭 세트로 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">가치와 바쁨을 나타내는 동명사 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">be worth\u003c/b> 뒤에 동명사를 쓰면 '~할 가치가 있다'라는 뜻이 되고, \u003cb class=\"key\">be busy\u003c/b> 뒤에 동명사를 쓰면 '~하느라 바쁘다'라는 의미를 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">be worth ~ing / be busy ~ing\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This book is worth \u003cspan class=\"fx\">reading twice\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">이 책은 두 번 읽을 가치가 있다.\u003c/div>\u003cdiv class=\"g-note\">be worth 다음에 동명사를 써서 '~할 가치가 있다'를 표현합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She is busy \u003cspan class=\"fx\">preparing for the exam\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 시험 준비를 하느라 바쁘다.\u003c/div>\u003cdiv class=\"g-note\">be busy 다음에 동명사를 써서 바쁘게 무언가를 하는 상태를 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>be worth는 능동형태인 동명사를 쓰지만 수동의 의미를 나타낸다는 점을 주의하세요.\u003c/div>","segs":[{"n":7,"text":"두 번째 개념은 어떤 행동을 할 가치가 충분히 있거나 무언가를 하느라 눈코 뜰 새 없이 바쁠 때 쓰는 구문이에요. be worth 뒤에 동명사를 쓰면 그 일을 해볼 만하다는 뜻이 되고, be busy 뒤에 동명사를 쓰면 지금 한창 바쁘게 무언가를 하고 있다는 뜻이 된답니다.","hl":"rule"},{"n":8,"text":"예문을 함께 소리 내어 읽어 볼까요. This book is worth reading twice. 이 책은 두 번 읽을 가치가 있다라는 뜻이에요. worth 뒤에 동명사 reading이 와서 이 책을 읽는 것이 충분히 가치 있다는 것을 나타내고 있죠.","hl":"ex-0"},{"n":9,"text":"보충 예문이에요. She is busy preparing for the exam. 그녀는 시험 준비를 하느라 바쁘다라는 뜻이죠. be busy 뒤에 동명사를 써서 현재 시험 준비로 매우 바쁜 모습을 잘 설명하고 있어요.","hl":"ex-1"},{"n":10,"text":"이 구문에서 한 가지 주의할 점이 있어요. be worth 뒤에 오는 동명사는 형태는 능동이지만 의미는 수동으로 해석될 때가 많답니다. 이 부분도 문제로 자주 출제되니 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">어려움과 시간·돈의 낭비 및 소비 표현\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">have difficulty\u003c/b>, \u003cb class=\"key\">have trouble\u003c/b> 뒤에 동명사를 쓰면 '~하는 데 어려움을 겪다'라는 뜻이 되고, \u003cb class=\"key\">spend\u003c/b>나 \u003cb class=\"key\">waste\u003c/b> 뒤에 시간이나 돈을 쓰고 동명사를 쓰면 '~하는 데 시간이나 돈을 쓰거나 낭비하다'라는 뜻이 됩니다.\u003cdiv>\u003cspan class=\"g-formula\">have difficulty / trouble ~ing, spend / waste + 시간·돈 + ~ing\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Don't waste your time \u003cspan class=\"fx\">worrying about it\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그것을 걱정하느라 시간을 낭비하지 마라.\u003c/div>\u003cdiv class=\"g-note\">waste + 시간 + ~ing 구조로 '~하느라 시간을 낭비하다'를 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I had trouble \u003cspan class=\"fx\">finding the address\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 주소를 찾는 데 어려움을 겪었다.\u003c/div>\u003cdiv class=\"g-note\">have trouble ~ing 구조로 '~하는 데 어려움이 있다'를 표현합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>have difficulty[trouble] 뒤에 오는 전치사 in은 보통 생략하고 동명사만 쓴다는 것을 기억하세요.\u003c/div>","segs":[{"n":11,"text":"세 번째는 무언가를 하느라 애를 먹거나 시간과 돈을 투자할 때 쓰는 표현들이에요. have difficulty나 have trouble 뒤에는 전치사 in이 생략되어 있어서 바로 동명사를 쓴답니다. 또한 spend나 waste 뒤에 시간이나 돈 목적어가 나오고 그 뒤에 동명사가 이어지는 구조도 정말 자주 나와요.","hl":"rule"},{"n":12,"text":"예문을 살펴볼게요. Don't waste your time worrying about it. 그것을 걱정하느라 시간을 낭비하지 마라라는 뜻이에요. waste 뒤에 시간 목적어가 오고 바로 동명사 worrying이 연결된 아주 전형적인 예문이랍니다.","hl":"ex-0"},{"n":13,"text":"보충 예문도 확인해 볼게요. I had trouble finding the address. 나는 주소를 찾는 데 어려움을 겪었다라는 뜻이죠. have trouble 뒤에 동명사를 써서 길이나 주소를 찾느라 애를 먹었던 상황을 나타내고 있어요.","hl":"ex-1"},{"n":14,"text":"have difficulty나 have trouble 뒤에 원래는 전치사 in이 있었지만 현대 영어에서는 주로 생략하고 바로 동명사를 쓴답니다. 빈칸 채우기 문제에서 전치사 유무를 물어볼 수 있으니 잘 알아두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">전치사 to를 사용하는 중요한 동명사 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">on ~ing\u003c/b>는 '~하자마자'라는 뜻이고, \u003cb class=\"key\">look forward to ~ing\u003c/b>는 '~을 고대하다', \u003cb class=\"key\">be used to ~ing\u003c/b>는 '~하는 데 익숙하다'라는 뜻이에요. 이때 to는 부정사가 아니라 \u003cb class=\"key\">전치사\u003c/b>이므로 반드시 뒤에 동명사나 명사가 와야 합니다.\u003cdiv>\u003cspan class=\"g-formula\">on ~ing / look forward to ~ing / be used to ~ing\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I look forward to \u003cspan class=\"fx\">meeting you\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 너를 만나기를 고대한다.\u003c/div>\u003cdiv class=\"g-note\">look forward to 다음의 to가 전치사이므로 동명사 meeting이 왔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She is used to \u003cspan class=\"fx\">working under pressure\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 압박감 속에서 일하는 데 익숙하다.\u003c/div>\u003cdiv class=\"g-note\">be used to 다음의 to가 전치사여서 동명사 working이 쓰였습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>used to 동사원형은 '~하곤 했다'라는 뜻이고, be used to ~ing는 '~하는 데 익숙하다'라는 뜻이므로 반드시 구별해야 해요.\u003c/div>","segs":[{"n":15,"text":"마지막 네 번째 개념은 시험에 가장 많이 나오는 아주 중요한 별표 다섯 개짜리 구문들이에요. on 뒤에 동명사가 오면 ~하자마자라는 뜻이 되고요. look forward to와 be used to에 들어있는 to는 동사원형을 이끄는 부정사가 아니라 전치사예요. 그렇기 때문에 이 to 뒤에는 반드시 동명사나 명사가 와야 한답니다.","hl":"rule"},{"n":16,"text":"예문을 읽어 볼게요. I look forward to meeting you. 나는 너를 만나기를 고대한다라는 뜻이에요. 여기서 to 뒤에 동사원형 meet이 아니라 동명사 meeting이 온 것을 눈여겨봐야 해요.","hl":"ex-0"},{"n":17,"text":"보충 예문이에요. She is used to working under pressure. 그녀는 압박감 속에서 일하는 데 익숙하다라는 뜻이죠. 역시 be used to의 to가 전치사이기 때문에 뒤에 동명사 working이 왔답니다.","hl":"ex-1"},{"n":18,"text":"여기서 정말 중요한 팁을 하나 더 줄게요. used to 뒤에 동사원형이 오면 예전에 뭐뭐하곤 했다라는 뜻이지만, be used to 뒤에 동명사가 오면 뭐뭐하는 데 익숙하다라는 완전히 다른 뜻이 돼요. 시험에서 이 두 가지를 비교하는 문제가 대단히 자주 출제되니 확실하게 구별해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I look forward to meet you.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I look forward to meeting you.\u003c/div>\u003cdiv class=\"g-why\">look forward to의 to는 전치사이므로 뒤에 동사원형이 아니라 동명사를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>It is no use to cry over spilt milk.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ It is no use crying over spilt milk.\u003c/div>\u003cdiv class=\"g-why\">It is no use 다음에는 to부정사가 아니라 동명사를 목적어로 취합니다.\ n he was young.\n• I am used to getting up early.\n• She is used to working hard.\n• They are used to cold weather.\n• I am used to speaking English.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>He used to smoke when he was young.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>I am used to getting up early.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>She is used to working hard.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>They are used to cold weather.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>해당 없음\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">He used to smoke when he was young.\u003c/span>\u003cdiv class=\"g-exp\">첫 번째 문장의 used to는 '~하곤 했다'라는 조동사 표현이고, 나머지는 모두 '익숙하다'라는 be used to 구문입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"다섯 번째 문제입니다. 다음 보기 중에서 밑줄 친 표현의 의미가 나머지 넷과 다른 하나를 골라 보세요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 첫 번째 보기예요. 첫 번째 문장의 used to는 과거에 뭐뭐하곤 했다라는 조동사 표현이지만, 나머지 문장들의 used to는 모두 뭐뭐하는 데 익숙하다라는 의미의 be used to 구분이랍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 단어들을 알맞게 배열하여 문장을 완성하시오. (단, 필요시 형태 변형 가능)\u003c/div>\u003cdiv class=\"g-qs\">( time / waste / don't / worry / about / it / your )\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Don't waste your time worrying about it.\u003c/span>\u003cdiv class=\"g-exp\">waste + 시간 + ~ing 구조를 활용하여 Don't waste your time worrying about it으로 배열합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"마지막 여섯 번째 문제입니다. 주어진 단어들을 알맞게 배열해서 문장을 완성해 보세요. 잠시 멈추고 직접 적어 보세요.","hl":"q"},{"n":38,"text":"","hl":"q","pause":6},{"n":39,"text":"정답은 Don't waste your time worrying about it이에요. waste 뒤에 시간 목적어인 your time을 쓰고 이어서 동명사 worrying을 쓰는 관용 구문 어순을 정확히 맞추면 되는 문제였어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 12 Unit 59 동명사 관용 구문\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">It is no use ~ing\u003c/b>와 \u003cb class=\"key\">There is no ~ing\u003c/b>는 각각 '~해도 소용없다', '~하는 것은 불가능하다'라는 의미를 가진 대표적인 \u003cb class=\"key\">동명사 관용 구문\u003c/b>이에요.\u003c/li>\u003cli>\u003cb class=\"key\">cannot help ~ing\u003c/b>는 '~하지 않을 수 없다', \u003cb class=\"key\">be worth ~ing\u003c/b>는 '~할 가치가 있다', \u003cb class=\"key\">be busy ~ing\u003c/b>는 '~하느라 바쁘다'로 쓰여요.\u003c/li>\u003cli>\u003cb class=\"key\">look forward to ~ing\u003c/b>와 \u003cb class=\"key\">be used to ~ing\u003c/b>에서 to는 \u003cb class=\"key\">전치사\u003c/b>이므로 반드시 뒤에 \u003cb class=\"key\">동명사\u003c/b>나 명사를 써야 한다는 점을 꼭 기억하세요.\u003c/li>\u003c/ul>","segs":[{"n":40,"text":"오늘 우리는 Chapter 12 Unit 59 동명사 관용 구문들을 아주 꼼꼼하게 살펴보았어요. It is no use, cannot help, be worth 같은 표현들의 형태와 뜻을 확실히 외워 두면 시험에서 절대 틀리지 않을 거예요. 특히 look forward to나 be used to의 to가 전치사라는 점은 수능과 내신 단골 출제 포인트이니 꼭 복습해 주세요. 오늘 강의 들느라 정말 수고 많았어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
