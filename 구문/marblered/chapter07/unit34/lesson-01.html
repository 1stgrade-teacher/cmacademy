  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;

lecturePlayer(document.getElementById("app"),{"brand":"unit34","title":"분사구문의 다양한 형태 2: Being 생략과 with 구문","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>분사구문의 다양한 형태 2: Being 생략과 with 구문\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>Being/Having been이 생략된 분사구문과 with 뒤에 명사와 분사가 오는 구문, 관용적 분사구문을 정확히 해석하고 바꿔 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘도 함께 영어 구문의 힘을 키워 볼까요? 오늘은 분사구문의 다양한 형태 두 번째 시간으로, Being이나 Having been이 생략된 표현과 with 뒤에 명사와 분사가 오는 구문을 집중적으로 봅니다. 이 표현들은 독해에서 자주 나오니, 끊어 읽기와 함께 자연스럽게 익혀 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">분사구문에서 접속사와 주어가 주절과 같을 때 \u003cb class=\"key\">Being\u003c/b>이나 \u003cb class=\"key\">Having been\u003c/b>이 생략되어 형용사·분사가 문장 앞에 올 수 있습니다. 「\u003cb class=\"key\">with + 명사 + v-ing/v-ed\u003c/b>」는 명사가 동작의 주체인지 대상인지에 따라 현재분사와 과거분사를 구별해 '~가 …하면서/된 채로'로 해석합니다. \u003cb class=\"key\">Judging from\u003c/b>, \u003cb class=\"key\">Granted that\u003c/b>, \u003cb class=\"key\">Taking into account\u003c/b>, \u003cb class=\"key\">Strictly speaking\u003c/b>은 분사구문이 굳어진 관용 표현입니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Adolescents have been quick to immerse themselves in technology \u003cspan class=\"fx\">with most using the Internet to communicate\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">Judging from his latest novel that I have read\u003c/span>, he seems to be a fairly promising writer.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 While afloat, the reindeer is uniquely vulnerable, moving slowly \u003cspan class=\"fx\">with its antlers held high\u003c/span> as it struggles to keep its nose above water.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 \u003cspan class=\"fx\">Desperate to keep himself and his family from starving\u003c/span>, Erich took any available job.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">Granted that you've made some progress\u003c/span>, you should not be conceited.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">With the industrial society evolving into an information-based society\u003c/span>, the concept of information as a product, a commodity with its own value, has emerged.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 \u003cspan class=\"fx\">Unable to write, or even to speak clearly\u003c/span>, Stephen Hawking was leaping beyond relativity, beyond quantum mechanics, beyond the Big Bang, to the 'dance of geometry' that created the universe.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Some pioneers in computer usage see the ultimate relation between man and computer as a symbiotic union of two living species, \u003cspan class=\"fx\">each completely dependent on the other for survival\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">Strictly speaking\u003c/span>, Great Britain consists of Scotland, Wales and England, and the United Kingdom consists of Great Britain and Northern Ireland.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 The role of science can sometimes be overstated, \u003cspan class=\"fx\">with its advocates slipping into scientism\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">Taking into account growing population numbers, climate change and natural disasters\u003c/span>, global food security is under threat.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">With so much data collected about us and with anybody being able to disseminate it around the globe\u003c/span>, is there anything we really can do to protect privacy?\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 분사구문에서 접속사와 주어가 주절과 같으면 Being이나 Having been이 자주 생략돼요. 그래서 문장 앞에 형용사나 분사가 바로 나와도 당황하지 말고, 원래 있던 Being을 떠올리면 됩니다. 또 with 뒤에 명사가 오고 그 뒤에 현재분사나 과거분사가 오면, 명사가 그 동작의 주체인지 대상인지에 따라 분사를 고르죠. 마지막으로 Judging from이나 Granted that, Taking into account, Strictly speaking처럼 분사구문이 굳어진 관용 표현도 함께 익혀 둡시다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Adolescents have been quick to immerse themselves in technology \u003cspan class=\"fx\">with most using the Internet to communicate\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Adolescents \u003c/div>\u003cdiv class=\"k\">청소년들은 \u003c/div>\u003cdiv class=\"e\">have been quick \u003c/div>\u003cdiv class=\"k\">재빨랐다 \u003c/div>\u003cdiv class=\"e\">to immerse themselves in technology \u003c/div>\u003cdiv class=\"k\">기술에 몰두하는 것에 \u003c/div>\u003cdiv class=\"e\">with most \u003c/div>\u003cdiv class=\"k\">대부분이 \u003c/div>\u003cdiv class=\"e\">using the Internet \u003c/div>\u003cdiv class=\"k\">인터넷을 사용하면서 \u003c/div>\u003cdiv class=\"e\">to communicate.\u003c/div>\u003cdiv class=\"k\">소통하기 위해서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">with + 명사 + v-ing\u003c/b>」 구문으로, most가 using의 의미상 주어입니다. to communicate는 '소통하기 위해'라는 목적을 나타내는 \u003cb class=\"key\">to부정사\u003c/b>의 부사적 용법입니다.\u003c/div>","segs":[{"n":3,"text":"Adolescents, 청소년들은. have been quick, 재빨랐다. to immerse themselves in technology, 기술에 몰두하는 것에. with most, 대부분이. using the Internet, 인터넷을 사용하면서. to communicate, 소통하기 위해서","hl":"ch"},{"n":4,"text":"첫 번째 문장은 with 뒤에 most와 using이 이어지는 구조예요. 여기서 most는 most of adolescents를 가리키고, using은 대부분이 인터넷을 사용하는 동작을 나타냅니다. to communicate는 소통하기 위해서라는 목적을 보여 주죠. 그래서 with most using the Internet to communicate는 대부분이 소통하기 위해 인터넷을 사용하면서라고 해석하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Adolescents have been quick to immerse themselves in technology \u003cspan class=\"fx\">with most using the Internet to communicate\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>청소년들이 기술을 빠르게 받아들이고, 그들 대부분은 인터넷으로 소통한다는 뜻입니다. quick to는 '~하는 데 재빠른'이므로 단순한 속도보다 거리낌 없이 곧바로 받아들이는 뉘앙스가 있습니다. most는 문맥상 most of adolescents를 가리킵니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have been quick to immerse themselves in technology\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have quickly become absorbed in technology\u003c/span>\u003cdiv class=\"w\">be quick to를 quickly become으로 바꿔 '빠르게 ~하게 되다'라는 의미를 자연스럽게 살렸습니다. immerse themselves in은 become absorbed in과 호응합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">most using the Internet to communicate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">most of them using the Internet to communicate\u003c/span>\u003cdiv class=\"w\">most의 지시 대상을 most of them으로 분명히 밝혀 독해의 모호함을 줄였습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">immerse oneself in\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be absorbed in\u003c/span>\u003cspan class=\"y-eq\">immerse oneself in = be absorbed in\u003c/span>\u003cdiv class=\"w\">'몰두하다'를 '열중하다'로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be quick to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">readily\u003c/span>\u003cspan class=\"y-eq\">be quick to = readily\u003c/span>\u003cdiv class=\"w\">'~하기를 서슴지 않다'의 뜻을 부사 readily로 간결하게 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">communicate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">interact\u003c/span>\u003cdiv class=\"w\">'의사소통하다'를 더 넓은 의미의 '상호작용하다'로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Teenagers have readily embraced technology, with most of them using the Internet as a means of communication.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 청소년들이 기술에 아주 빠르게 몰입하고, 그중 대부분은 인터넷으로 소통한다는 뜻이에요. have been quick to는 단순히 빠르다는 뜻보다 거리낌 없이 곧바로 받아들인다는 느낌을 줍니다. 그래서 기술을 자연스럽게 받아들이는 청소년의 모습이 잘 드러나요.","hl":"mn"},{"n":6,"text":"have been quick to immerse themselves in technology는 have quickly become absorbed in technology로 바꿔 말할 수 있어요. 또 most를 most of them으로 풀어 주면 누구를 가리키는지 더 분명해집니다.","hl":"rw"},{"n":7,"text":"immerse oneself in은 be absorbed in으로 바꿔 쓸 수 있고, be quick to는 readily로 간결하게 표현할 수 있어요. communicate는 interact로 바꾸면 더 넓은 의미의 상호작용을 나타냅니다.","hl":"ph"},{"n":8,"text":"이제 같은 뜻을 다른 문장으로 읽어 볼게요. Teenagers have readily embraced technology, with most of them using the Internet as a means of communication. 청소년들이 기술을 쉽게 받아들이고, 대부분 인터넷을 의사소통 수단으로 사용한다는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">Judging from his latest novel that I have read\u003c/span>, he seems to be a fairly promising writer.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Judging from \u003c/div>\u003cdiv class=\"k\">~로 판단하건대 \u0  appears to be\u003c/span>\u003cdiv class=\"w\">seems to be를 appears to be로 바꾸면 더 격식 있는 인상을 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">latest\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">most recent\u003c/span>\u003cspan class=\"y-eq\">latest = most recent\u003c/span>\u003cdiv class=\"w\">'최신의'를 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fairly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rather\u003c/span>\u003cspan class=\"y-eq\">fairly = rather\u003c/span>\u003cdiv class=\"w\">'제법'이라는 정도를 rather로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">promising\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">likely to succeed\u003c/span>\u003cspan class=\"y-eq\">promising = likely to succeed\u003c/span>\u003cdiv class=\"w\">'유망한'을 풀어 '성공할 가능성이 있는'으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">On the basis of the most recent novel I have read by him, he appears to be a rather promising writer.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 내가 읽은 그의 최신 소설을 보면 그가 제법 유망한 작가인 것 같다는 뜻이에요. seems to be는 확신보다는 인상을 말할 때 쓰죠. fairly는 아주 강하지 않은 제법이라는 정도를 나타냅니다.","hl":"mn"},{"n":12,"text":"Judging from은 To judge from으로 바꿔도 같은 뜻이에요. he seems to be는 he appears to be로 바꾸면 조금 더 격식 있는 느낌을 줍니다.","hl":"rw"},{"n":13,"text":"latest는 most recent로 풀어 쓸 수 있고, fairly는 rather로 바꿀 수 있어요. promising은 likely to succeed로 설명하면 유망하다는 뜻이 더 분명해집니다.","hl":"ph"},{"n":14,"text":"같은 뜻을 이렇게도 말할 수 있어요. On the basis of the most recent novel I have read by him, he appears to be a rather promising writer. 내가 읽은 그의 가장 최근 소설을 근거로 보면 그가 제법 유망한 작가처럼 보인다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u  is uniquely vulnerable, moving slowly \u003cspan class=\"fx\">with its antlers held high\u003c/span> as it struggles to keep its nose above water.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>순록은 물에 떠 있을 때 뿔을 높이 쳐든 채 천천히 움직여서 특히 취약하다는 뜻입니다. 코를 물 위로 유지하려 애쓰는 모습이 취약함을 생생히 보여 줍니다. uniquely는 '특히, 유일하게' 정도로 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">with its antlers held high\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">holding its antlers high\u003c/span>\u003cdiv class=\"w\">수동의 with 구문을 능동의 현재분사구로 바꿔 같은 상황을 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is uniquely vulnerable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is especially at risk\u003c/span>\u003cdiv class=\"w\">vulnerable을 at risk로 풀어 '위험에 처한'이라는 뜻을 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">afloat\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">floating\u003c/span>\u003cspan class=\"y-eq\">afloat = floating\u003c/span>\u003cdiv class=\"w\">'물에 떠 있는'을 일반 동사 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">vulnerable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at risk\u003c/span>\u003cspan class=\"y-eq\">vulnerable = at risk\u003c/span>\u003cdiv class=\"w\">'취약한'을 '위험에 노출된'으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">struggle to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make an effort to\u003c/span>\u003cspan class=\"y-eq\">struggle to = make an effort to\u003c/span>\u003cdiv class=\"w\">'애쓰다'를 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb  desperate to keep ~, 즉 '그가 필사적이었기 때문에'라는 이유의 분사구문으로 이해합니다.\u003c/div>","segs":[{"n":21,"text":"Desperate, 필사적이었다. to keep himself and his family, 자기 자신과 가족이. from starving, 굶주리지 않게 하려고. Erich took, Erich는 구했다. any available job, 수 있는 어떠한 일자리라도","hl":"ch"},{"n":22,"text":"네 번째 문장은 Desperate 앞에 Being이 생략된 분사구문이에요. 원래는 Being desperate to keep himself and his family from starving이고, 이것이 이유를 나타냅니다. 그래서 그는 필사적이었기 때문에라는 뜻으로 연결하면 됩니다. keep himself and his family from starving은 자신과 가족이 굶지 않게 하다라는 뜻이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 \u003cspan class=\"fx\">Desperate to keep himself and his family from starving\u003c/span>, Erich took any available job.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>에리히는 자신과 가족이 굶지 않게 하려는 절박함 때문에 할 수 있는 일이라면 어떤 일자리든 택했다는 뜻입니다. any available job은 직업의 종류를 가리지 않는 절박함을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Desperate to keep himself and his family from starving\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Because he was desperate to keep himself and his family from starving\u003c/span>\u003cdiv class=\"w\">생략된 Being과 이유의 의미를 because절로 풀어 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">took any available job\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">took whatever job was available\u003c/span>\u003cdiv class=\"w\">any available job을 whatever절로 바꿔 '구할 수 있는 어떤 일이든'의 뜻을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">desperate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">frantic\u003c/span>\u003cspan class=\"y-eq\">desperate = frantic\u003c/span>\u003cdiv class=\"w\">'필사적인'을 더 강한 절박함의 frantic으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">keep ~ from v-ing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">prevent ~ from v-ing\u003c/span>\u003cspan class=\"y-eq\">keep ~ from v-ing = prevent ~ from v-ing\u003c/span>\u003cdiv class=\"w\">'~하지 못하게 하다'를 같은 구조의 prevent로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">available\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">obtainable\u003c/span>\u003cspan class=\"y-eq\">available = obtainable\u003c/span>\u003cdiv class=\"w\">'구할 수 있는'이라는 뜻을 obtainable로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Because he was desperate to prevent himself and his family from starving, Erich took whatever job was available.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 에리히가 자신과 가족을 굶주림에서 지키려는 절박함 때문에 구할 수 있는 일이라면 무엇이든 했다는 뜻이에요. any available job은 일의 종류를 가리지 않을 만큼 간절했다는 느낌을 줍니다.","hl":"mn"},{"n":24,"text":"Desperate to keep himself and his family from starving은 Because he was desperate to keep himself and his family from starving으로 풀어 쓸 수 있어요. took any available job은 took whatever job was available로 바꾸면 어떤 일이든 구했다는 뜻이 더 분명해집니다.","hl":"rw"},{"n":25,"text":"desperate는 frantic으로 강조할 수 있고, keep from은 prevent from으로 바꿀 수 있어요. available은 obtainable로 풀어 쓸 수 있습니다.","hl":"ph"},{"n":26,"text":"이 문장을 이렇게 패러프레이징해 볼게요. Because he was desperate to prevent himself and his family from starving, Erich took whatever job was available. 절박해서 가족이 굶지 않게 하려고 구할 수 있는 어떤 일이든 했다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 \u003cspan class=\"fx\">Granted that you've made some progress\u003c/span>, you should not be conceited.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Granted that \u003c/div>\u003cdiv class=\"k\">~을 인정한다 하더라도 \u003c/div>\u003cdiv class=\"e\">you've made some progress, \u003c/div>\u003cdiv class=\"k\">네가 어느 정도 진전을 이루었다는 것을 \u003c/div>\u003cdiv class=\"e\">you should not \u003c/div>\u003cdiv class=\"k\">너는 ~해서는 안 된다 \u003c/div>\u003cdiv class=\"e\">be conceited.\u003c/div>\u003cdiv class=\"k\">자만하다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Granted that\u003c/b>은 granting that과 같은 뜻으로 '~을 인정한다 하더라도'라는 양보의 관용적 분사구문입니다. that절 전체가 양보의 대상이 됩니다.\u003c/div>","segs":[{"n":27,"text":"Granted that, ~을 인정한다 하더라도. you've made some progress, 네가 어느 정도 진전을 이루었다는 것을. you should not, 너는 ~해서는 안 된다. be conceited, 자만하다","hl":"ch"},{"n":28,"text":"다섯 번째 문장의 Granted that은 양보를 나타내는 관용적인 분사구문이에요. ~을 인정한다 하더라도라는 뜻으로, 뒤에 오는 절 전체를 양보의 대상으로 만듭니다. 그래서 네가 어느 정도 진전을 이루었다고 인정하더라도라는 의미가 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 \u003cspan class=\"fx\">Granted that you've made some progress\u003c/span>, you should not be conceited.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>네가 어느 정도 진전을 이루었다고 인정하더라도 자만하지 말라는 뜻입니다. 진전을 인정하면서도 교만을 경계하는 양보의 흐름입니다. conceited는 자신이 뛰어나다고 지나치게 믿는 태도를 말합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Granted that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Even though\u003c/span>\u003cdiv class=\"w\">양보의 의미를 even though절로 직접 드러냈습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">should not be conceited\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">must not become arrogant\u003c/span>\u003cdiv class=\"w\">conceited를 arrogant로 바꾸고 should not을 must not으로 강하게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make progress\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">improve\u003c/span>\u003cspan class=\"y-eq\">make progress = improve\u003c/span>\u003cdiv class=\"w\">'진전을 이루다'를 동사 improve로 간결하게 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">conceited\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">arrogant\u003c/span>\u003cspan class=\"y-eq\">conceited = arrogant\u003c/span>\u003cdiv class=\"w\">'자만한'을 '거만한'으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Granted that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Even if\u003c/span>\u003cspan class=\"y-eq\">Granted that = Even if\u003c/span>\u003cdiv class=\"w\">양보의 뜻을 살린 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Even if you have made some progress, you must not become arrogant.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 네가 어느 정도 발전했다고 해도 자만해서는 안 된다는 뜻이에요. 상대의 성과를 인정하면서도 교만을 경계하는 말이죠. conceited는 자신이 대단하다고 지나치게 믿는 태도를 말합니다.","hl":"mn"},{"n":30,"text":"Granted that은 Even though나 Even if로 바꿔 양보의 뜻을 분명히 할 수 있어요. should not be conceited는 must not become arrogant로 바꾸면 더 강한 충고가 됩니다.","hl":"rw"},{"n":31,"text":"make progress는 improve로 간결하게 바꿀 수 있고, conceited는 arrogant로 표현할 수 있어요. Granted that은 Even if와 같은 양보의 의미로 정리해 두세요.","hl":"ph"},{"n":32,"text":"같은 뜻을 이렇게 말할 수 있어요. Even if you have made some progress, you must not become arrogant. 어느 정도 발전했더라도 거만해지면 안 된다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 \u003cspan class=\"fx\">With the industrial society evolving into an information-based society\u003c/span>, the concept of information as a product, a commodity with its own value, has emerged.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">With the industrial society \u003c/div>\u003cdiv class=\"k\">산업 사회가 \u003c/div>\u003cdiv class=\"e\">evolving into an information-based society, \u003c/div>\u003cdiv class=\"k\">정보 기반 사회로 진화하면서 \u003c/div>\u003cdiv class=\"e\">the concept of information \u003c/div>\u003cdiv class=\"k\">정보의 개념이 \u003c/div>\u003cdiv class=\"e\">as a product, \u003c/div>\u003cdiv class=\"k\">상품으로서 \u003c/div>\u003cdiv class=\"e\">a commodity with its own value, \u003c/div>\u003cdiv class=\"k\">즉 자체의 가치를 가진 상품으로서 \u003c/div>\u003cdiv class=\"e\">has emerged.\u003c/div>\u003cdiv class=\"k\">나타났다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">with + 명사(구) + v-ing\u003c/b>」 구문으로, the industrial society가 evolve의 주체이므로 현재분사 \u003cb class=\"key\">evolving\u003c/b>이 쓰였습니다. with절은 '~가 …하면서'라는 배경·동시 상황을 나타냅니다.\u003c/div>","segs":[{"n":33,"text":"With the industrial society, 산업 사회가. evolving into an information-based society, 정보 기반 사회로 진화하면서. the concept of information, 정보의 개념이. as a product, 상품으로서. a commodity with its own value, 즉 자체의 가치를 가진 상품으로서. has emerged, 나타났다","hl":"ch"},{"n":34,"text":"여섯 번째 문장에서는 With the industrial society evolving into an information-based society를 먼저 보세요. with 뒤에 명사 the industrial society가 오고, 그 명사가 진화하는 주체라서 현재분사 evolving이 왔습니다. 이 부분은 산업 사회가 정보 기반 사회로 진화하면서라는 배경을 만들어 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 \u003cspan class=\"fx\">With the industrial society evolving into an information-based society\u003c/span>, the concept of information as a product, a commodity with its own value, has emerged.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>산업 사회가 정보 기반 사회로 발전함에 따라 정보가 자체 가치를 지닌 상품이라는 개념이 등장했다는 뜻입니다. a commodity with its own value는 a product를 부연 설명하는 동격 표현입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">With the industrial society evolving into an information-based society\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">As industrial society evolves into an information-based society\u003c/span>\u003cdiv class=\"w\">with 분사구문을 as절로 바꿔 변화의 흐름을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">has emerged\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has come to the fore\u003c/span>\u003cdiv class=\"w\">emerge를 '전면에 떠오르다'라는 관용 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">evolve into\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">develop into\u003c/span>\u003cspan class=\"y-eq\">evolve into = develop into\u003c/span>\u003cdiv class=\"w\">'진화하다'를 '발전하다'로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">emerge\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">appear\u003c/span>\u003cspan class=\"y-eq\">emerge = appear\u003c/span>\u003cdiv class=\"w\">'나타나다'를 기본 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">commodity\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">goods\u003c/span>\u003cspan class=\"y-eq\">commodity = goods\u003c/span>\u003cdiv class=\"w\">'상품'을 일반적인 goods로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">As industrial society develops into an information-based society, the idea of information as a product, a commodity with its own value, has appeared.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 산업 사회가 정보 기반 사회로 바뀌면서 정보가 자체 가치를 지닌 상품이라는 개념이 나타났다는 뜻이에요. a commodity with its own value는 바로 앞의 a product를 부연 설명하는 표현입니다. 정보가 단순한 내용이 아니라 가치 있는 상품으로 여겨지기 시작했다는 흐름을 읽으면 됩니다.","hl":"mn"},{"n":36,"text":"With the industrial society evolving into an information-based society는 As industrial society evolves into an information-based society로 바꿀 수 있어요. has emerged는 has come to the fore로 바꾸면 전면에 떠올랐다는 느낌이 살아납니다.","hl":"rw"},{"n":37,"text":"evolve into는 develop into로, emerge는 appear로 바꿀 수 있어요. commodity는 goods로 풀어 쓸 수 있습니다.","hl":"ph"},{"n":38,"text":"같은 내용을 이렇게 정리해 볼게요. As industrial society develops into an information-based society, the idea of information as a product, a commodity with its own value, has appeared. 산업 사회가 정보 기반 사회로 발전하면서 정보가 가치 있는 상품이라는 개념이 나타났다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 \u003cspan class=\"fx\">Unable to write, or even to speak clearly\u003c/span>, Stephen Hawking was leaping beyond relativity, beyond quantum mechanics, beyond the Big Bang, to the 'dance of geometry' that created the universe.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Unable to write, \u003c/div>\u003cdiv class=\"k\">글을 쓸 수 없었지만 \u003c/div>\u003cdiv class=\"e\">or even to speak clearly, \u003c/div>\u003cdiv class=\"k\">혹은 명확하게 말할 수도 없었지만 \u003c/div>\u003cdiv class=\"e\">Stephen Hawking was leaping \u003c/div>\u003cdiv class=\"k\">스티븐 호킹은 도달하고 있었다 \u003c/div>\u003cdiv class=\"e\">beyond relativity, \u003c/div>\u003cdiv class=\"k\">상대성 이론을 넘어 \u003c/div>\u003cdiv class=\"e\">beyond quantum mechanics, \u003c/div>\u003cdiv class=\"k\">양자 역학을 넘어 \u003c/div>\u003cdiv class=\"e\">beyond the Big Bang, \u003c/div>\u003cdiv class=\"k\">빅뱅을 넘어 \u003c/div>\u003cdiv class=\"e\">to the 'dance of geometry' \u003c/div>\u003cdiv class=\"k\">기하학의 춤으로 \u003c/div>\u003cdiv class=\"e\">that created the universe.\u003c/div>\u003cdiv class=\"k\">[우주를 창조한]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>형용사 \u003cb class=\"key\">Unable\u003c/b> 앞에 Being이 생략된 분사구문으로, '비록 글을 쓸 수도, 명확히 말할 수도 없었지만'이라는 양보의 의미를 나타냅니다. 원래는 \u003cb class=\"key\">Being unable to write, or even to speak clearly\u003c/b>입니다.\u003c/div>","segs":[{"n":39,"text":"Unable to write, 글을 쓸 수 없었지만. or even to speak clearly, 혹은 명확하게 말할 수도 없었지만. Stephen Hawking was leaping, 스티븐 호킹은 도달하고 있었다. beyond relativity, 상대성 이론을 넘어. beyond quantum mechanics, 양자 역학을 넘어. beyond the Big Bang, 빅뱅을 넘어. to the 'dance of geometry', 기하학의 춤으로. that created the universe, [우주를 창조한]","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 Unable 앞에 Being이 생략된 분사구문이에요. 원래는 Being unable to write, or even to speak clearly이고, 비록 글을 쓸 수도 명확히 말할 수도 없었지만이라는 양보의 뜻을 냅니다. 뒤에서는 was leaping beyond가 반복되면서 호킹이 여러 이론을 넘어 나아가는 모습을 강조해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 \u003cspan class=\"fx\">Unable to write, or even to speak clearly\u003c/span>, Stephen Hawking was leaping beyond relativity, beyond quantum mechanics, beyond the Big Bang, to the 'dance of geometry' that created the universe.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>호킹은 글을 쓰거나 명확히 말할 수 없었지만, 상대성 이론과 양자 역학, 빅뱅을 넘어 우주를 창조한 기하학의 춤으로 나아가고 있었다는 뜻입니다. 신체적 한계와 지적 도약의 대비가 핵심입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Unable to write, or even to speak clearly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Although he was unable to write or even speak clearly\u003c/span>\u003cdiv class=\"w\">생략된 Being과 양보의 의미를 although절로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">was leaping beyond\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">was moving beyond\u003c/span>\u003cdiv class=\"w\">leap beyond를 move beyond로 바꿔 도약의 뜻을 자연스럽게 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unable to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">incapable of\u003c/span>\u003cspan class=\"y-eq\">unable to = incapable of\u003c/span>\u003cdiv class=\"w\">'~할 수 없는'을 같은 뜻의 구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">leap beyond\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">go beyond\u003c/span>\u003cspan class=\"y-eq\">leap beyond = go beyond\u003c/span>\u003cdiv class=\"w\">'넘어 도달하다'를 기본 동사 go로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">clearly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">distinctly\u003c/span>\u003cspan class=\"y-eq\">clearly = distinctly\u003c/span>\u003cdiv class=\"w\">'명확하게'를 또렷하게라는 뜻으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Although he could neither write nor even speak clearly, Stephen Hawking was moving beyond relativity, quantum mechanics, and the Big Bang toward the dance of geometry that created the universe.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 호킹이 글을 쓰거나 말하는 데 큰 어려움이 있었지만, 상대성 이론과 양자 역학과 빅뱅을 넘어 우주를 창조한 기하학의 춤으로 나아가고 있었다는 뜻이에요. 신체적 한계와 지적 도약이 강하게 대비됩니다.","hl":"mn"},{"n":42,"text":"Unable to write, or even to speak clearly는 Although he was unable to write or even speak clearly로 풀어 쓸 수 있어요. was leaping beyond는 was moving beyond로 바꾸면 도달해 가는 느낌이 자연스럽습니다.","hl":"rw"},{"n":43,"text":"unable to는 incapable of로 바꿀 수 있고, leap beyond는 go beyond로 풀 수 있어요. clearly는 distinctly로 바꿔 또렷하게라는 뜻을 살릴 수 있습니다.","hl":"ph"},{"n":44,"text":"이 문장을 이렇게 바꿔 읽어 볼게요. Although he could neither write nor even speak clearly, Stephen Hawking was moving beyond relativity, quantum mechanics, and the Big Bang toward the dance of geometry that created the universe. 글도 말도 명확히 하기 어려웠지만 호킹은 여러 이론을 넘어 우주를 창조한 기하학의 춤으로 나아가고 있었다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 Some pioneers in computer usage see the ultimate relation between man and computer as a symbiotic union of two living species, \u003cspan class=\"fx\">each completely dependent on the other for survival\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Some pioneers \u003c/div>\u003cdiv class=\"k\">일부 개척자들은 \u003c/div>\u003cdiv class=\"e\">in computer usage \u003c/div>\u003cdiv class=\"k\">컴퓨터 사용에 있어서 \u003c/div>\u003cdiv class=\"e\">see the ultimate relation \u003c/div>\u003cdiv class=\"k\">궁극적인 관계를 여긴다 \u003c/div>\u003cdiv class=\"e\">between man and computer \u003c/div>\u003cdiv class=\"k\">인간과 컴퓨터 사이의 \u003c/div>\u003cdiv class=\"e\">as a symbiotic union \u003c/div>\u003cdiv class=\"k\">공생 연합으로 \u003c/div>\u003cdiv class=\"e\">of two living species, \u003c/div>\u003cdiv class=\"k\">두 개의 살아 있는 종의 \u003c/div>\u003cdiv class=\"e\">each completely dependent \u003c/div>\u003cdiv class=\"k\">각자는 완전히 의존하고 있다 \u003c/div>\u003cdiv class=\"e\">on the other \u003c/div>\u003cdiv class=\"k\">상대방에 \u003c/div>\u003cdiv class=\"e\">for survival.\u003c/div>\u003cdiv class=\"k\">생존을 위해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>분사구문의 의미상 주어가 주절의 주어와 다르므로 \u003cb class=\"key\">each\u003c/b>가 그대로 남은 독립분사구문입니다. \u003cb class=\"key\">Being\u003c/b>이 생략된 completely dependent ~ 형태로, '각자는 …에 의존하면서'라는 뜻을 더합니다. see A as B는 '\u003cb class=\"key\">A를 B로 여기다\u003c/b>'입니다.\u003c/div>","segs":[{"n":45,"text":"Some pioneers, 일부 개척자들은. in computer usage, 컴퓨터 사용에 있어서. see the ultimate relation, 궁극적인 관계를 여긴다. between man and computer, 인간과 컴퓨터 사이의. as a symbiotic union, 공생 연합으로. of two living species, 두 개의 살아 있는 종의. each completely dependent, 각자는 완전히 의존하고 있다. on the other, 상대방에. for survival, 생존을 위해","hl":"ch"},{"n":46,"text":"여덟 번째 문장에서는 마지막의 each completely dependent on the other for survival를 눈여겨보세요. 주절의 주어는 Some pioneers이지만 이 부분의 의미상 주어는 each라서 서로 다릅니다. 이렇게 의미상 주어가 남아 있는 분사구문을 독립분사구문이라고 하고, 여기서는 Being이 생략되어 있어요. 또 see A as B는 A를 B로 여기다라는 중요한 표현입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 Some pioneers in computer usage see the ultimate relation between man and computer as a symbiotic union of two living species, \u003cspan class=\"fx\">each completely dependent on the other for survival\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>컴퓨터 사용의 일부 선구자들은 인간과 컴퓨터의 궁극적 관계를 두 생명 종의 공생 결합으로 본다는 뜻입니다. 각 종이 생존을 위해 서로 완전히 의존한다는 점을 강조합니다. symbiotic은 서로 이익을 주고받는 관계를 뜻합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">each completely dependent on the other for survival\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">with each completely dependent on the other for survival\u003c/span>\u003cdiv class=\"w\">독립분사구문을 with 구문으로 바꿔 부연 설명의 느낌을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">see the ultimate relation between man and computer as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regard the ultimate relationship between humans and computers as\u003c/span>\u003cdiv class=\"w\">see A as B를 regard A as B로 바꾸고 man과 computer를 복수 일반명사로 자연스럽게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">see A as B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regard A as B\u003c/span>\u003cspan class=\"y-eq\">see A as B = regard A as B\u003c/span>\u003cdiv class=\"w\">'A를 B로 여기다'를 같은 구조의 regard로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ultimate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fundamental\u003c/span>\u003cspan class=\"y-eq\">ultimate = fundamental\u003c/span>\u003cdiv class=\"w\">'궁극적인'을 근본적인이라는 뜻으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dependent on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">reliant on\u003c/span>\u003cspan class=\"y-eq\">dependent on = reliant on\u003c/span>\u003cdiv class=\"w\">'의존하는'을 같은 뜻의 reliant on으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Some pioneers in computer use regard the ultimate relationship between humans and computers as a symbiotic union of two living species, with each species completely dependent on the other for survival.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"이 문장은 컴퓨터 사용의 일부 선구자들이 인간과 컴퓨터의 궁극적 관계를 두 생명 종의 공생 결합으로 본다는 뜻이에요. 각 종이 생존을 위해 서로 완전히 의존한다는 점이 핵심입니다. symbiotic은 서로 도움을 주고받는 관계를 뜻합니다.","hl":"mn"},{"n":48,"text":"each completely dependent on the other for survival는 with each completely dependent on the other for survival로 바꿔 부연 설명을 분명히 할 수 있어요. see the ultimate relation between man and computer as는 regard the ultimate relationship between humans and computers as로 바꿀 수 있습니다.","hl":"rw"},{"n":49,"text":"see A as B는 regard A as B로 바꿔 쓸 수 있어요. ultimate는 fundamental로, dependent on은 reliant on으로 바꿀 수 있습니다.","hl":"ph"},{"n":50,"text":"같은 뜻을 이렇게 표현해 볼게요. Some pioneers in computer use regard the ultimate relationship between humans and computers as a symbiotic union of two living species, with each species completely dependent on the other for survival. 인간과 컴퓨터가 서로 생존을 위해 의존하는 두 종의 공생 결합처럼 여겨진다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 \u003cspan class=\"fx\">Strictly speaking\u003c/span>, Great Britain consists of Scotland, Wales and England, and the United Kingdom consists of Great Britain and Northern Ireland.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Strictly speaking, \u003c/div>\u003cdiv class=\"k\">엄격히 말하자면 \u003c/div>\u003cdiv class=\"e\">Great Britain consists of \u003c/div>\u003cdiv class=\"k\">Great Britain은 ~으로 구성된다 \u003c/div>\u003cdiv class=\"e\">Scotland, Wales and England, \u003c/div>\u003cdiv class=\"k\">스코틀랜드, 웨일스, 그리고 잉글랜드로 \u003c/div>\u003cdiv class=\"e\">and the United Kingdom consists of \u003c/div>\u003cdiv class=\"k\">그리고 The United Kingdom은 ~으로 구성된다 \u003c/div>\u003cdiv class=\"e\">Great Britain and Northern Ireland.\u003c/div>\u003cdiv class=\"k\">Great Britain과 북아일랜드로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Strictly speaking\u003c/b>은 '엄격히 말하자면'이라는 관용적 분사구문입니다. speaking의 의미상 주어는 문장 주어가 아니라 일반 사람 we로 보는 것이 자연스럽습니다.\u003c/div>","segs":[{"n":51,"text":"Strictly speaking, 엄격히 말하자면. Great Britain consists of, Great Britain은 ~으로 구성된다. Scotland, Wales and England, 스코틀랜드, 웨일스, 그리고 잉글랜드로. and the United Kingdom consists of, 그리고 The United Kingdom은 ~으로 구성된다. Great Britain and Northern Ireland, Great Britain과 북아일랜드로","hl":"ch"},{"n":52,"text":"아홉 번째 문장의 Strictly speaking은 엄격히 말하자면이라는 뜻으로 굳어진 분사구문이에요. 여기서 speaking의 의미상 주어는 문장의 주어라기보다 일반 사람인 we로 보는 것이 자연스럽습니다. 뒤에서는 consists of가 두 번 나오면서 구성 요소를 정확히 구분해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 \u003cspan class=\"fx\">Strictly speaking\u003c/span>, Great Britain consists of Scotland, Wales and England, and the United Kingdom consists of Great Britain and Northern Ireland.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>엄격히 구분하면 그레이트브리튼과 영국은 구성이 다르다는 뜻입니다. consists of는 '~으로 구성되다'로, 두 개념의 차이를 정확히 설명합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Strictly speaking\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">To be precise\u003c/span>\u003cdiv class=\"w\">관용 분사구문을 부정사구로 바꿔 같은 의미를 나타냈습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">consists of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is made up of\u003c/span>\u003cdiv class=\"w\">consist of를 더 일상적인 구동사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">strictly speaking\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to be precise\u003c/span>\u003cspan class=\"y-eq\">strictly speaking = to be precise\u003c/span>\u003cdiv class=\"w\">'엄격히 말하자면'을 '정확히 말하자면'으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">consist of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be composed of\u003c/span>\u003cspan class=\"y-eq\">consist of = be composed of\u003c/span>\u003cdiv class=\"w\">'~으로 구성되다'를 같은 뜻의 수동 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">To be precise, Great Britain is made up of Scotland, Wales, and England, and the United Kingdom is made up of Great Britain and Northern Ireland.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 엄격히 구분하면 그레이트브리튼과 영국이 서로 다른 구성 요소를 가진다는 뜻이에요. 그레이트브리튼은 스코틀랜드와 웨일스와 잉글랜드로, 영국은 그레이트브리튼과 북아일랜드로 이루어집니다. 두 개념을 헷갈리지 말라는 설명이죠.","hl":"mn"},{"n":54,"text":"Strictly speaking은 To be precise로 바꿔도 같은 뜻이에요. consists of는 is made up of로 바꾸면 더 일상적인 표현이 됩니다.","hl":"rw"},{"n":55,"text":"strictly speaking은 to be precise로 정리할 수 있고, consist of는 be composed of나 be made up of로 바꿀 수 있어요.","hl":"ph"},{"n":56,"text":"이 문장을 이렇게 바꿔 볼게요. To be precise, Great Britain is made up of Scotland, Wales, and England, and the United Kingdom is made up of Great Britain and Northern Ireland. 정확히 말하면 두 명칭의 구성이 다르다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 The role of science can sometimes be overstated, \u003cspan class=\"fx\">with its advocates slipping into scientism\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The role of science \u003c/div>\u003cdiv class=\"k\">과학의 역할은 \u003c/div>\u003cdiv class=\"e\">can sometimes be overstated, \u003c/div>\u003cdiv class=\"k\">때때로 과장될 수 있다 \u003c/div>\u003cdiv class=\"e\">with its advocates \u003c/div>\u003cdiv class=\"k\">그 지지자들이 \u003c/div>\u003cdiv class=\"e\">slipping into scientism.\u003c/div>\u003cdiv class=\"k\">과학만능주의에 빠져들면서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">with + 명사 + v-ing\u003c/b>」 구문으로, its advocates가 slip into의 주체이므로 현재분사 \u003cb class=\"key\">slipping\u003c/b>이 왔습니다. '지지자들이 과학만능주의에 빠져들면서'라는 동시 상황을 나타냅니다.\u003c/div>","segs":[{"n":57,"text":"The role of science, 과학의 역할은. can sometimes be overstated, 때때로 과장될 수 있다. with its advocates, 그 지지자들이. slipping into scientism, 과학만능주의에 빠져들면서","hl":"ch"},{"n":58,"text":"열 번째 문장은 with its advocates slipping into scientism을 중심으로 봅니다. with 뒤에 명사 its advocates가 오고, 그 지지자들이 과학만능주의에 빠져드는 주체라서 현재분사 slipping이 왔어요. 이 부분은 과학의 역할이 과장되는 상황을 덧붙여 설명합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 The role of science can sometimes be overstated, \u003cspan class=\"fx\">with its advocates slipping into scientism\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>과학의 역할은 때때로 과장될 수 있는데, 그 지지자들이 과학만능주의로 흘러들 때 그런 일이 생긴다는 뜻입니다. scientism은 과학이 모든 것을 설명할 수 있다고 과신하는 태도입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">with its advocates slipping into scientism\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as its advocates slip into scientism\u003c/span>\u003cdiv class=\"w\">with 분사구문을 as절로 바꿔 원인·동시 상황을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">can sometimes be overstated\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">may sometimes be exaggerated\u003c/span>\u003cdiv class=\"w\">overstate를 exaggerate로 바꾸고 가능성의 can을 may로 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">overstate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">exaggerate\u003c/span>\u003cspan class=\"y-eq\">overstate = exaggerate\u003c/span>\u003cdiv class=\"w\">'과장하다'를 같은 뜻의 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">advocate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">supporter\u003c/span>\u003cspan class=\"y-eq\">advocate = supporter\u003c/span>\u003cdiv class=\"w\">'지지자'를 일반적인 supporter로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">slip into\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fall into\u003c/span>\u003cspan class=\"y-eq\">slip into = fall into\u003c/span>\u003cdiv class=\"w\">'빠져들다'를 같은 뜻의 구로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The role of science may sometimes be exaggerated as its supporters fall into scientism.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 과학의 역할이 때때로 과장될 수 있는데, 그 지지자들이 과학만능주의에 빠져들 때 그런 일이 생긴다는 뜻이에요. scientism은 과학이 모든 것을 설명할 수 있다고 지나치게 믿는 태도를 말합니다.","hl":"mn"},{"n":60,"text":"with its advocates slipping into scientism은 as its advocates slip into scientism으로 바꿀 수 있어요. can sometimes be overstated는 may sometimes be exaggerated로 바꾸면 과장된다는 뜻이 자연스럽습니다.","hl":"rw"},{"n":61,"text":"overstate는 exaggerate로, advocate는 supporter로 바꿀 수 있어요. slip into는 fall into로 풀어 쓸 수 있습니다.","hl":"ph"},{"n":62,"text":"같은 내용을 이렇게 말해 볼게요. The role of science may sometimes be exaggerated as its supporters fall into scientism. 과학의 역할이 때때로 과장되는데, 그 지지자들이 과학만능주의에 빠질 때라는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 \u003cspan class=\"fx\">Taking into account growing population numbers, climate change and natural disasters\u003c/span>, global food security is under threat.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Taking into account \u003c/div>\u003cdiv class=\"k\">~을 고려하면 \u003c/div>\u003cdiv class=\"e\">growing population numbers, \u003c/div>\u003cdiv class=\"k\">늘어나는 인구 수, \u003c/div>\u003cdiv class=\"e\">climate change \u003c/div>\u003cdiv class=\"k\">기후 변화, \u003c/div>\u003cdiv class=\"e\">and natural disasters, \u003c/div>\u003cdiv class=\"k\">그리고 자연재해를 \u003c/div>\u003cdiv class=\"e\">global food security \u003c/div>\u003cdiv class=\"k\">전 세계의 식량 안보가 \u003c/div>\u003cdiv class=\"e\">is under threat.\u003c/div>\u003cdiv class=\"k\">위협받고 있다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">taking ~ into account\u003c/b>는 '~을 고려하면'이라는 뜻의 분사구문입니다. Taking의 목적어가 growing population numbers, climate change and natural disasters로 길어서 \u003cb class=\"key\">into account\u003c/b> 뒤로 이동한 형태입니다.\u003c/div>","segs":[{"n":63,"text":"Taking into account, ~을 고려하면. growing population numbers, 늘어나는 인구 수. climate change, 기후 변화. and natural disasters, 그리고 자연재해를. global food security, 전 세계의 식량 안보가. is under threat, 위협받고 있다","hl":"ch"},{"n":64,"text":"열한 번째 문장에서는 Taking into account가 ~을 고려하면이라는 뜻으로 쓰였어요. 원래는 take A into account 형태인데, 목적어인 growing population numbers, climate change and natural disasters가 길어서 into account 뒤로 이동했습니다. 그래서 앞에서부터 고려하면이라는 의미로 받아 주면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 \u003cspan class=\"fx\">Taking into account growing population numbers, climate change and natural disasters\u003c/span>, global food security is under threat.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>늘어나는 인구, 기후 변화, 자연재해를 고려하면 전 세계 식량 안보가 위협받고 있다는 뜻입니다. under threat는 '위협 아래에 있는', 즉 위험에 처한 상태를 나타냅니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Taking into account\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Considering\u003c/span>\u003cdiv class=\"w\">긴 목적어를 가진 분사구문을 간단한 전치사 considering으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is under threat\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is at risk\u003c/span>\u003cdiv class=\"w\">'위협받고 있다'를 '위험에 처해 있다'로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take into account\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">consider\u003c/span>\u003cspan class=\"y-eq\">take into account = consider\u003c/span>\u003cdiv class=\"w\">'고려하다'를 단일 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">growing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">increasing\u003c/span>\u003cspan class=\"y-eq\">growing = increasing\u003c/span>\u003cdiv class=\"w\">'늘어나는'을 increasing으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">under threat\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at risk\u003c/span>\u003cspan class=\"y-eq\">under threat = at risk\u003c/span>\u003cdiv class=\"w\">'위협받는'을 '위험에 처한'으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Considering increasing population numbers, climate change, and natural disasters, global food security is at risk.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 늘어나는 인구 수와 기후 변화와 자연재해를 고려하면 전 세계의 식량 안보가 위협받고 있다는 뜻이에요. under threat는 위험한 상태에 놓여 있다는 뜻입니다. 여러 위험 요인을 함께 고려해야 한다는 메시지가 담겨 있어요.","hl":"mn"},{"n":66,"text":"Taking into account는 Considering으로 간단히 바꿀 수 있어요. is under threat는 is at risk로 바꾸면 위험에 처해 있다는 뜻이 분명해집니다.","hl":"rw"},{"n":67,"text":"take into account는 consider로 바꿀 수 있고, growing은 increasing으로 표현할 수 있어요. under threat는 at risk로 정리해 두세요.","hl":"ph"},{"n":68,"text":"이 문장을 이렇게 바꿔 볼게요. Considering increasing population numbers, climate change, and natural disasters, global food security is at risk. 인구 증가와 기후 변화와 자연재해를 고려하면 세계 식량 안보가 위험하다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">With so much data collected about us and with anybody being able to disseminate it around the globe\u003c/span>, is there anything we really can do to protect privacy?\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">With so much data \u003c/div>\u003cdiv class=\"k\">너무나 많은 자료가 \u003c/div>\u003cdiv class=\"e\">collected about us \u003c/div>\u003cdiv class=\"k\">우리에 대해 수집된 상태에서 \u003c/div>\u003cdiv class=\"e\">and with anybody \u003c/div>\u003cdiv class=\"k\">그리고 누구라도 \u003c/div>\u003cdiv class=\"e\">being able to disseminate it \u003c/div>\u003cdiv class=\"k\">그것을 유포할 수 있는 상태에서 \u003c/div>\u003cdiv class=\"e\">around the globe, \u003c/div>\u003cdiv class=\"k\">전 세계에 \u003c/div>\u003cdiv class=\"e\">is there anything \u003c/div>\u003cdiv class=\"k\">어떤 것이 있는가 \u003c/div>\u003cdiv class=\"e\">we really can do \u003c/div>\u003cdiv class=\"k\">우리가 정말로 할 수 있는 \u003c/div>\u003cdiv class=\"e\">to protect privacy?\u003c/div>\u003cdiv class=\"k\">사생활을 보호하기 위해서?\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">with + 명사(구) + v-ing(v-ed)\u003c/b>」 구문이 and로 병렬 연결된 문장입니다. so much data는 수집되는 대상이므로 과거분사 \u003cb class=\"key\">collected\u003c/b>가, anybody는 유포할 수 있는 주체이므로 현재분사 \u003cb class=\"key\">being\u003c/b>이 왔습니다.\u003c/div>","segs":[{"n":69,"text":"With so much data, 너무나 많은 자료가. collected about us, 우리에 대해 수집된 상태에서. and with anybody, 그리고 누구라도. being able to disseminate it, 그것을 유포할 수 있는 상태에서. around the globe, 전 세계에. is there anything, 어떤 것이 있는가. we really can do, 우리가 정말로 할 수 있는. to protect privacy?, 사생활을 보호하기 위해서?","hl":"ch"},{"n":70,"text":"열두 번째 문장은 with 구문이 and로 두 번 연결되어 있어요. with so much data collected about us에서는 data가 수집되는 대상이라서 과거분사 collected가 왔습니다. with anybody being able to disseminate it around the globe에서는 anybody가 유포하는 주체라서 현재분사 being이 왔고요. 이 두 상황을 바탕으로 사생활 보호가 가능한지 묻는 문장입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">With so much data collected about us and with anybody being able to disseminate it around the globe\u003c/span>, is there anything we really can do to protect privacy?\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리에 대한 많은 데이터가 수집되어 있고 누구나 그것을 전 세계로 퍼뜨릴 수 있는 상황에서, 사생활을 보호하기 위해 정말 할 수 있는 일이 있느냐는 뜻입니다. 현대의 프라이버시 문제를 반문하는 수사적 질문입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">With so much data collected about us\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Since so much data is collected about us\u003c/span>\u003cdiv class=\"w\">with 분사구문을 since절로 풀어 이유를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">with anybody being able to disseminate it around the globe\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">since anybody can disseminate it around the globe\u003c/span>\u003cdiv class=\"w\">being able to를 can으로 바꾸고 with 구문을 since절로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">collect\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">gather\u003c/span>\u003cspan class=\"y-eq\">collect = gather\u003c/span>\u003cdiv class=\"w\">'수집하다'를 같은 뜻의 gather로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">disseminate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">spread\u003c/span>\u003cspan class=\"y-eq\">disseminate = spread\u003c/span>\u003cdiv class=\"w\">'유포하다'를 일상적인 spread로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">privacy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">personal privacy\u003c/span>\u003cspan class=\"y-eq\">privacy = personal privacy\u003c/span>\u003cdiv class=\"w\">'사생활'을 개인 사생활로 풀어 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Since so much data is collected about us and anyone can spread it around the world, is there anything we can really do to protect our privacy?\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 우리에 대한 너무나 많은 자료가 수집되어 있고, 누구나 그것을 전 세계로 퍼뜨릴 수 있는 상황에서 사생활을 보호하기 위해 우리가 정말 할 수 있는 일이 있느냐고 묻고 있어요. 현대 사회의 프라이버시 문제를 강하게 환기하는 수사적 질문입니다.","hl":"mn"},{"n":72,"text":"With so much data collected about us는 Since so much data is collected about us로 풀 수 있어요. with anybody being able to disseminate it around the globe는 since anybody can disseminate it around the globe로 바꾸면 이유와 상황이 더 분명해집니다.","hl":"rw"},{"n":73,"text":"collect는 gather로, disseminate는 spread로 바꿀 수 있어요. privacy는 personal privacy로 풀어 쓸 수 있습니다.","hl":"ph"},{"n":74,"text":"마지막으로 같은 뜻을 이렇게 읽어 볼게요. Since so much data is collected about us and anyone can spread it around the world, is there anything we can really do to protect our privacy? 많은 자료가 수집되고 누구나 퍼뜨릴 수 있는 상황에서 사생활을 지킬 방법이 있는지 묻는 문장입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">Being\u003c/b>이나 \u003cb class=\"key\">Having been\u003c/b>은 분사구문에서 접속사와 주어가 주절과 같을 때 생략되어, 형용사·분사가 문장 앞에 올 수 있습니다.\u003c/li>\u003cli>\u003cb class=\"key\">with + 명사 + v-ing\u003c/b>는 명사가 동작의 주체일 때, \u003cb class=\"key\">with + 명사 + v-ed\u003c/b>는 명사가 동작의 대상일 때 씁니다.\u003c/li>\u003cli>\u003cb class=\"key\">Judging from\u003c/b>, \u003cb class=\"key\">Granted that\u003c/b>, \u003cb class=\"key\">Taking into account\u003c/b>, \u003cb class=\"key\">Strictly speaking\u003c/b>은 분사구문이 굳어진 관용 표현입니다.\u003c/li>\u003cli>패러프레이징에서는 분사구문을 절로 풀거나 전치사구로 바꾸어 같은 의미를 자연스럽게 전달합니다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 분사구문의 다양한 형태 두 번째 시간을 공부했어요. Being이 생략된 표현과 with 다음에 명사와 분사가 오는 구문, 그리고 관용적인 분사구문 표현들을 꼭 기억해 두세요. 특히 with 구문에서는 명사가 동작의 주체인지 대상인지 먼저 판단하는 습관이 중요합니다. 그럼 다음 시간에도 더 정확하고 자연스러운 영어 구문으로 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
