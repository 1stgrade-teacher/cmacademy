  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"unit29","title":"Unit 29 부사 역할을 하는 전치사구 — 문장을 여는 전치사구, 동사를 꾸미는 전치사구","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편 Unit 29 부사 역할을 하는 전치사구\u003c/div>\u003ch1>Unit 29 부사 역할을 하는 전치사구 — 문장을 여는 전치사구, 동사를 꾸미는 전치사구\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>전치사구가 문장 전체나 동사·형용사를 수식하는 부사 역할을 한다는 점을 잡고, 긴 문장을 끊어 읽으며 직독직해할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘도 함께 공부하게 되어 반갑습니다. 오늘은 Unit 29, 부사 역할을 하는 전치사구를 공부할 거예요. 전치사구는 명사 앞에 붙어서 꾸며 주는 형용사 역할도 하지만, 오늘처럼 문장 앞이나 동사 뒤에서 문장 전체와 동사를 꾸며 주는 부사 역할도 한답니다. 이 역할만 잡으면 길고 복잡해 보이는 문장이 훨씬 쉽게 읽혀요. 오늘 예문 열두 개를 통해서 그 감각을 확실히 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 Unit 29 부사 역할을 하는 전치사구\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">전치사구는 \u003cb class=\"key\">문장 앞\u003c/b>에 오면 문장 전체를 수식하고, \u003cb class=\"key\">동사 뒤\u003c/b>에 오면 그 동사를 수식한다. \u003cb class=\"key\">upon + v-ing\u003c/b>, \u003cb class=\"key\">in spite of\u003c/b>, \u003cb class=\"key\">due to\u003c/b>, \u003cb class=\"key\">as a result of\u003c/b>처럼 전치사가 굳어진 어구도 모두 뒤에 명사·동명사를 데리고 부사 역할을 한다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">By means of photosynthesis\u003c/span>, plants convert the radiant energy of the sun into chemical energy.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">From the moment that we are born\u003c/span>, we begin to make sense of the world around us by associating the unknown with the known.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 Fossil fuels form \u003cspan class=\"fx\">beneath the ground\u003c/span> from dead plants and animals that do not break down completely.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04  \u003cspan class=\"fx\">Despite its high price\u003c/span>, this new cell phone sells like hot cakes because of its high quality.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 We borrow environmental capital \u003cspan class=\"fx\">from future generations\u003c/span> with no intention or prospect of repaying.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Each year about 50,000 species of plants and animals disappear from the planet \u003cspan class=\"fx\">as a result of human activity\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07  Sometimes my eyes get jealous of my heart because you always remain \u003cspan class=\"fx\">close to my heart\u003c/span> and far from my eyes.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">Upon discovering his own passion and talent for architecture\u003c/span>, Frank Lloyd Wright dropped out of school and went to work for an architectural firm in Chicago.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">Above all\u003c/span>, watch with glittering eyes the whole world around you because the greatest secrets are always hidden in the most unlikely places.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">In a democratic environment\u003c/span>, old ideas can be challenged and rigorously criticized, though there are some difficulty due to the human desire to hold onto old ideas, especially by the original proposers.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">In spite of the rare case of receiving rewarding email\u003c/span>, we cannot resist the impulse to check email because our behaviors are maintained with the reward presented in an unpredictable way.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">With the advent of social media\u003c/span>, our children become impatient for an immediate answer or &quot;Like&quot; within minutes of sending an urgent piece of information out.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 오늘의 핵심 규칙부터 정리할게요. 전치사구가 문장 앞에 나오면 보통 문장 전체를 꾸며 주는 부사 역할을 합니다. 반대로 동사 뒤에 붙으면 그 동사를 꾸며 주죠. 그리고 upon 다음에 동명사가 오면 하자마자라는 뜻이 되고, in spite of나 due to, as a result of처럼 굳어진 전치사 어구도 뒤에 명사를 데리고 똑같이 부사 역할을 한답니다. 그러니까 전치사구를 만나면 뒤에 명사가 있는지, 그리고 이 덩어리가 어디를 꾸미는지만 확인하면 돼요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">By means of photosynthesis\u003c/span>, plants convert the radiant energy of the sun into chemical energy.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">By means of photosynthesis, \u003c/div>\u003cdiv class=\"k\">광합성에 의해\u003c/div>\u003cdiv class=\"e\">plants convert the radiant energy of the sun \u003c/div>\u003cdiv class=\"k\">식물은 태양의 복사 에너지를 전환한다\u003c/div>\u003cdiv class=\"e\">into chemical energy.\u003c/div>\u003cdiv class=\"k\">화학 에너지로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">By means of photosynthesis\u003c/b>는 문장 앞에서 문장 전체를 수식하는 부사 역할의 전치사구이고, \u003cb class=\"key\">into chemical energy\u003c/b>는 동사 convert 뒤에서 방향·결과를 나타내며 convert를 수식한다.\u003c/div>","segs":[{"n":3,"text":"By means of photosynthesis, 광합성에 의해. plants convert the radiant energy of the sun, 식물은 태양의 복사 에너지를 전환한다. into chemical energy, 화학 에너지로","hl":"ch"},{"n":4,"text":"첫 번째 문장부터 볼게요. 문장 앞에 있는 By means of photosynthesis는 광합성에 의해서라는 뜻으로, 문장 전체를 꾸며 주는 부사 역할을 합니다. 그리고 뒤에 있는 into chemical energy는 동사 convert를 꾸며 주면서 화학 에너지로라는 방향을 알려 주죠. 이렇게 한 문장 안에서 전치사구가 두 군데에서 각각 다른 것을 꾸미고 있다는 점이 포인트예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">By means of photosynthesis\u003c/span>, plants convert the radiant energy of the sun into chemical energy.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>식물이 햇빛을 먹고 사는 게 아니라, 햇빛 에너지를 몸속에서 쓸 수 있는 형태로 바꿔 저장한다는 뜻이에요. 쉽게 말해 태양 빛을 화학 에너지로 갈아 끼우는 작업이 광합성이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">By means of photosynthesis\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Through photosynthesis\u003c/span>\u003cdiv class=\"w\">by means of는 다소 딱딱한 표현이라 일상 문장에서는 through가 더 자연스러워요. 의미는 똑같습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">convert the radiant energy of the sun into chemical energy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">turn the sun's radiant energy into chemical energy\u003c/span>\u003cdiv class=\"w\">convert는 turn이나 change로 바꿔 쓸 수 있고, of the sun은 소유격으로 바꾸면 더 간단해져요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by means of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">through / via\u003c/span>\u003cspan class=\"y-eq\">by means of = through\u003c/span>\u003cdiv class=\"w\">수단·방법을 나타내는 전치사 어구를 한 단어 전치사로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">convert A into B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">turn A into B / change A into B\u003c/span>\u003cspan class=\"y-eq\">convert A into B = turn A into B\u003c/span>\u003cdiv class=\"w\">전환을 뜻하는 동사를 일상적인 동사로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">radiant energy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">solar energy\u003c/span>\u003cdiv class=\"w\">태양의 복사 에너지를 가리키는 더 익숙한 표현으로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Plants use photosynthesis to turn the sun's radiant energy into chemical energy.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장이 말하는 건 아주 단순해요. 식물은 태양 빛을 그대로 쓰는 게 아니라, 광합성을 통해서 몸속에서 쓸 수 있는 화학 에너지로 바꿔 저장한다는 거예요. 빛을 연료로 갈아 끼우는 작업이라고 생각하면 쉽습니다.","hl":"mn"},{"n":6,"text":"표현도 함께 바꿔 볼까요. By means of photosynthesis는 Through photosynthesis로 바꿔도 같은 뜻이고요. convert the radiant energy of the sun into chemical energy는 turn the sun's radiant energy into chemical energy로 조금 더 편하게 말할 수 있어요.","hl":"rw"},{"n":7,"text":"여기서 꼭 외워 둘 어구가 세 가지 있습니다. by means of는 through와 같은 말이고요. convert A into B는 A를 B로 바꾸다라는 뜻으로 turn A into B와 같아요. radiant energy는 solar energy, 그러니까 태양 에너지라고 바꿔 말할 수 있습니다.","hl":"ph"},{"n":8,"text":"이제 문장 전체를 바꿔서 읽어 볼게요. Plants use photosynthesis to turn the sun's radiant energy into chemical energy. 식물은 광합성을 이용해서 태양의 복사 에너지를 화학 에너지로 바꾼다는 뜻으로, 원래 문장과 의미가 완전히 같습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">From the moment that we are born\u003c/span>, we begin to make sense of the world around us by associating the unknown with the known.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">From the moment that we are born, \u003c/div>\u003cdiv class=\"k\">그 순간부터, 우리가 태어나는\u003c/div>\u003cdiv class=\"e\">we begin to make sense of the world around us \u003c/div>\u003cdiv class=\"k\">우리는 우리 주변의 세상을 이해하기 시작한다\u003c/div>\u003cdiv class=\"e\">by associating the unknown with the known.\u003c/div>\u003cdiv class=\"k\">알려지지 않은 것을 알려진 것과 연관시킴으로써\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">From the moment that we are born\u003c/b>은 문장 전체를 수식하는 부사 역할의 전치사구이고, \u003cb class=\"key\">by associating the unknown with the known\u003c/b>은 make sense를 수식한다. the moment 뒤의 that은 선행사 the moment를 수식하는 형용사절을 이끄는 \u003cb class=\"key\">관계부사\u003c/b>이다.\u003c/div>","segs":[{"n":9,"text":"From the moment that we are born, 그 순간부터, 우리가 태어나는. we begin to make sense of the world around us, 우리는 우리 주변의 세상을 이해하기 시작한다. by associating the unknown with the known, 알려지지 않은 것을 알려진 것과 연관시킴으로써","hl":"ch"},{"n":10,"text":"두 번째 문장입니다. 맨 앞의 From the moment that we are born은 우리가 태어나는 그 순간부터라는 뜻으로 문장 전체를 꾸며 줘요. 여기서 the moment 다음에 온 that은 관계부사로, the moment를 꾸며 주는 절을 이끌고 있습니다. 그리고 문장 끝의 by associating은 make sense of를 꾸며 주는 부사구예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 \u003cspan class=\"fx\">From the moment that we are born\u003c/span>, we begin to make sense of the world around us by associating the unknown with the known.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>아기가 태어나자마자 세상이 저절로 이해되는 게 아니라, 모르는 것을 이미 아는 것에 계속 연결 지으면서 세상을 배워 간다는 뜻이에요. 새 정보를 기존 지식이라는 옷걸이에 거는 과정이라고 보면 됩니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">From the moment that we are born\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">As soon as we are born\u003c/span>\u003cdiv class=\"w\">the moment that은 as soon as로 바꿔 쓸 수 있는 대표 표현이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make sense of the world around us\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">come to understand the world around us\u003c/span>\u003cdiv class=\"w\">make sense of를 동사 understand로 풀어 써서 뜻을 분명히 했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make sense of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">understand / figure out\u003c/span>\u003cspan class=\"y-eq\">make sense of = understand\u003c/span>\u003cdiv class=\"w\">이해하다라는 뜻의 구동사를 한 단어 동사로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">associate A with B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">link A to B / connect A with B\u003c/span>\u003cspan class=\"y-eq\">associate A with B = link A to B\u003c/span>\u003cdiv class=\"w\">연관 짓다라는 동사를 더 흔한 동사로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the moment that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as soon as\u003c/span>\u003cspan class=\"y-eq\">the moment that = as soon as\u003c/span>\u003cdiv class=\"w\">시간의 시작점을 나타내는 접속 표현으로 전환했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">As soon as we are born, we start to understand the world around us by linking what we do not know to what we already know.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장의 핵심은 배움의 방식이에요. 우리는 세상을 저절로 아는 게 아니라, 모르는 것을 이미 아는 것에 붙여 보면서 이해해 간다는 겁니다. 처음 보는 동물을 강아지 비슷하다고 생각하는 것도 바로 이 과정이에요.","hl":"mn"},{"n":12,"text":"표현을 바꿔 보면 From the moment that we are born은 As soon as we are born으로 쓸 수 있어요. 그리고 make sense of the world around us는 come to understand the world around us로 풀어 쓸 수 있습니다.","hl":"rw"},{"n":13,"text":"어구도 정리해 볼게요. make sense of는 understand와 같은 말이고, associate A with B는 link A to B로 바꿀 수 있어요. 그리고 the moment that은 as soon as로 바꿔 쓰면 훨씬 간단해집니다.","hl":"ph"},{"n":14,"text":"바꾼 문장을 읽어 볼게요. As soon as we are born, we start to understand the world around us by linking what we do not know to what we already know. 태어나자마자 모르는 것을 아는 것에 연결하면서 세상을 이해하기 시작한다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 Fossil fuels form \u003cspan class=\"fx\">beneath the ground\u003c/span> from dead plants and animals that do not break down completely.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Fossil fuels form \u003c/div>\u003cdiv class=\"k\">화석 연료들은 형성된다\u003c/div>\u003cdiv class=\"e\">beneath the ground \u003c/div>\u003cdiv class=\"k\">땅 밑에서\u003c/div>\u003cdiv class=\"e\">from dead plants and animals \u003c/div>\u003cdiv class=\"k\">죽은 식물과 동물로부터\u003c/div>\u003cdiv class=\"e\">that do not break down completely.\u003c/div>\u003cdiv class=\"k\">완전히 분해되지 않은\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">beneath the ground\u003c/b>와 \u003cb class=\"key\">from dead plants and animals\u003c/b>는 둘 다 동사 form을 수식하는 부사 역할의 전치사구이다. dead plants and animals를 \u003cb class=\"key\">관계대명사 that\u003c/b>이 이끄는 절이 수식한다.\u003c/div>","segs":[{"n":15,"text":"Fossil fuels form, 화석 연료들은 형성된다. beneath the ground, 땅 밑에서. from dead plants and animals, 죽은 식물과 동물로부터. that do not break down completely, 완전히 분해되지 않은","hl":"ch"},{"n":16,"text":"세 번째 문장을 볼게요. beneath the ground와 from dead plants and animals, 이 두 전치사구가 나란히 동사 form을 꾸며 주고 있습니다. 그리고 맨 뒤의 that절은 바로 앞의 dead plants and animals를 꾸며 주는 관계대명사절이에요. 전치사구가 두 개 연달아 나오면 동사 뒤에서 각각 어디서, 무엇으로부터인지를 알려 준다고 생각하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 Fossil fuels form \u003cspan class=\"fx\">beneath the ground\u003c/span> from dead plants and animals that do not break down completely.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>화석 연료는 공장에서 만들어지는 게 아니라, 완전히 썩지 않고 남은 생물의 흔적이 땅속에서 오랜 시간 동안 바뀐 것이라는 뜻이에요. 그래서 한 번 쓰면 다시 채워지지 않는 자원이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">beneath the ground\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">under the ground\u003c/span>\u003cdiv class=\"w\">beneath는 문어적인 느낌이라 under가 더 흔하게 쓰여요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">do not break down completely\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are not fully decomposed\u003c/span>\u003cdiv class=\"w\">break down을 수동태 분해되다로 바꿔 뜻을 또렷하게 했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">break down\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">decompose / rot\u003c/span>\u003cspan class=\"y-eq\">break down = decompose\u003c/span>\u003cdiv class=\"w\">썩어서 분해되다라는 뜻을 한 단어 동사로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">beneath\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">under / below\u003c/span>\u003cspan class=\"y-eq\">beneath = under\u003c/span>\u003cdiv class=\"w\">위치를 나타내는 전치사를 더 익숙한 단어로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fossil fuels\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">coal, oil, and natural gas\u003c/span>\u003cspan class=\"y-eq\">fossil fuels = coal, oil, and natural gas\u003c/span>\u003cdiv class=\"w\">화석 연료의 구체적인 예를 들어 풀어 썼어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Fossil fuels are created under the ground from the remains of dead plants and animals that have not completely decomposed.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 화석 연료가 어떻게 생기는지를 설명해요. 완전히 분해되지 않고 남은 죽은 생물들이 땅속에서 오랜 세월을 거치며 화석 연료가 된다는 거죠. 그래서 화석 연료는 한 번 쓰면 다시 만들어지기까지 아주 오랜 시간이 걸립니다.","hl":"mn"},{"n":18,"text":"표현을 바꿔 볼까요. beneath the ground는 under the ground로 바꿀 수 있고, do not break down completely는 are not fully decomposed로 바꾸면 더 학술적인 느낌이 납니다.","hl":"rw"},{"n":19,"text":"어구 정리 들어갑니다. break down은 decompose, 그러니까 분해되다와 같은 말이에요. beneath는 under로 바꿀 수 있고, fossil fuels는 coal, oil, and natural gas처럼 구체적으로 풀어 말할 수도 있습니다.","hl":"ph"},{"n":20,"text":"바꾼 문장을 읽어 볼게요. Fossil fuels are created under the ground from the remains of dead plants and animals that have not completely decomposed. 완전히 분해되지 않은 죽은 식물과 동물의 흔적에서 화석 연료가 만들어진다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04  \u003cspan class=\"fx\">Despite its high price\u003c/span>, this new cell phone sells like hot cakes because of its high quality.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Despite its high price, \u003c/div>\u003cdiv class=\"k\">높은 가격에도 불구하고\u003c/div>\u003cdiv class=\"e\">this new cell phone sells \u003c/div>\u003cdiv class=\"k\">이 신형 휴대폰은 팔린다\u003c/div>\u003cdiv class=\"e\">like hot cakes \u003c/div>\u003cdiv class=\"k\">핫케이크처럼\u003c/div>\u003cdiv class=\"e\">because of its high quality.\u003c/div>\u003cdiv class=\"k\">그것의 고품질 때문에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Despite its high price\u003c/b>는 문장 전체를 수식하는 부사 역할의 전치사구이다. \u003cb class=\"key\">like hot cakes\u003c/b>와 \u003cb class=\"key\">because of\u003c/b>가 이끄는 어구는 둘 다 동사 sells를 수식한다. because of는 뒤에 명사를, 접속사 because는 뒤에 「S + V」를 취한다.\u003c/div>","segs":[{"n":21,"text":"Despite its high price, 높은 가격에도 불구하고. this new cell phone sells, 이 신형 휴대폰은 팔린다. like hot cakes, 핫케이크처럼. because of its high quality, 그것의 고품질 때문에","hl":"ch"},{"n":22,"text":"네 번째 문장입니다. Despite its high price는 높은 가격에도 불구하고라는 뜻으로 문장 전체를 꾸며 줘요. 여기서 despite는 전치사라서 뒤에 명사가 온다는 점, 꼭 기억해 두세요. 그리고 like hot cakes와 because of its high quality는 둘 다 동사 sells를 꾸며 주고 있습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04  \u003cspan class=\"fx\">Despite its high price\u003c/span>, this new cell phone sells like hot cakes because of its high quality.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>값이 비싼데도 불구하고 품질이 좋아서 엄청 잘 팔린다는, 예상과 반대되는 결과를 강조하는 문장이에요. 비싸면 안 팔릴 것 같다는 우리의 예상을 뒤집는 표현이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Despite its high price\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Even though it is expensive\u003c/span>\u003cdiv class=\"w\">전치사 despite를 접속사 even though로 바꿔 뒤에 절을 쓰는 형태로 전환했어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sells like hot cakes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">sells extremely quickly\u003c/span>\u003cdiv class=\"w\">관용 표현을 뜻이 분명한 부사구로 풀어 썼어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">despite\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in spite of\u003c/span>\u003cspan class=\"y-eq\">despite = in spite of\u003c/span>\u003cdiv class=\"w\">같은 뜻의 전치사 어구로 바꿨어요. 뒤에는 둘 다 명사가 옵니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">because of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">due to / owing to\u003c/span>\u003cspan class=\"y-eq\">because of = due to\u003c/span>\u003cdiv class=\"w\">이유를 나타내는 전치사 어구를 격식 있는 표현으로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sell like hot cakes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">sell very quickly\u003c/span>\u003cspan class=\"y-eq\">sell like hot cakes = sell very quickly\u003c/span>\u003cdiv class=\"w\">관용 표현을 직설적인 표현으로 풀었어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Even though this new cell phone is expensive, it sells extremely quickly because of its high quality.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 예상 밖의 결과를 말하고 있어요. 비싸면 잘 안 팔릴 것 같은데, 품질이 좋아서 날개 돋친 듯이 팔린다는 거죠. sell like hot cakes는 방금 구운 따뜻한 팬케이크가 순식간에 팔리는 모습에서 나온 표현이에요.","hl":"mn"},{"n":24,"text":"표현을 바꿔 보면 Despite its high price는 Even though it is expensive로 바꿀 수 있어요. 전치사 대신 접속사를 쓰면 뒤에 주어와 동사가 오죠. 그리고 sells like hot cakes는 sells extremely quickly로 풀어 쓸 수 있습니다.","hl":"rw"},{"n":25,"text":"어구 정리해 볼게요. despite는 in spite of와 같은 뜻이고, because of는 due to나 owing to로 바꿀 수 있어요. 참고로 because of 뒤에는 명사가, because 뒤에는 주어와 동사가 온다는 차이도 꼭 챙겨 두세요.","hl":"ph"},{"n":26,"text":"마지막으로 바꾼 문장을 읽어 볼게요. Even though this new cell phone is expensive, it sells extremely quickly because of its high quality. 값이 비싸지만 품질이 좋아서 아주 빨리 팔린다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 We borrow environmental capital \u003cspan class=\"fx\">from future generations\u003c/span> with no intention or prospect of repaying.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We borrow environmental capital \u003c/div>\u003cdiv class=\"k\">우리는 환경 자본을 빌린다\u003c/div>\u003cdiv class=\"e\">from future generations \u003c/div>\u003cdiv class=\"k\">미래 세대에게서\u003c/div>\u003cdiv class=\"e\">with no intention or prospect of repaying.\u003c/div>\u003cdiv class=\"k\">갚으려는 의도나 가망도 없이\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">from future generations\u003c/b>와 \u003cb class=\"key\">with no intention or prospect of repaying\u003c/b>는 둘 다 동사 borrow를 수식하는 부사 역할의 전치사구이다.\u003c/div>","segs":[{"n":27,"text":"We borrow environmental capital, 우리는 환경 자본을 빌린다. from future generations, 미래 세대에게서. with no intention or prospect of repaying, 갚으려는 의도나 가망도 없이","hl":"ch"},{"n":28,"text":"다섯 번째 문장이에요. from future generations는 미래 세대에게서, with no intention or prospect of repaying는 갚을 의도나 가망 없이, 이렇게 두 전치사구가 동사 borrow를 꾸며 주고 있습니다. 전치사 뒤에 명사나 동명사가 온다는 기본 원칙이 그대로 보이죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 We borrow environmental capital \u003cspan class=\"fx\">from future generations\u003c/span> with no intention or prospect of repaying.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리가 지금 쓰는 자연자원은 원래 미래 세대의 몫인데, 그걸 빌려 놓고 갚을 생각도 없이 쓰고 있다는 뜻이에요. 환경 문제를 빚에 비유한 표현이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">with no intention or prospect of repaying\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">without any plan or hope of paying it back\u003c/span>\u003cdiv class=\"w\">전치사 with no를 without으로 바꾸고 prospect를 hope로 풀었어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">prospect\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">possibility / chance\u003c/span>\u003cspan class=\"y-eq\">prospect = possibility\u003c/span>\u003cdiv class=\"w\">가망, 가능성이라는 뜻을 쉬운 단어로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">repay\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pay back\u003c/span>\u003cspan class=\"y-eq\">repay = pay back\u003c/span>\u003cdiv class=\"w\">한 단어 동사를 구동사로 풀었어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">environmental capital\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">natural resources\u003c/span>\u003cspan class=\"y-eq\">environmental capital = natural resources\u003c/span>\u003cdiv class=\"w\">비유적인 표현을 실제 의미로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We use up natural resources that belong to future generations, and we have no plan or hope of giving them back.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 환경 문제를 빚에 비유하고 있어요. 미래 세대의 몫인 자연자원을 우리가 빌려 쓰면서 갚을 생각조차 없다는 겁니다. 상당히 무거운 경고를 담은 표현이에요.","hl":"mn"},{"n":30,"text":"표현을 바꿔 보면 with no intention or prospect of repaying은 without any plan or hope of paying it back으로 풀어 쓸 수 있어요. 훨씬 이해하기 쉬워지죠.","hl":"rw"},{"n":31,"text":"어구 정리해 볼게요. prospect는 possibility나 chance와 같은 말이고, repay는 pay back으로 바꿀 수 있습니다. environmental capital은 자연자원이라는 뜻으로 natural resources라고 풀어 말할 수 있어요.","hl":"ph"},{"n":32,"text":"바꾼 문장을 읽어 볼게요. We use up natural resources that belong to future generations, and we have no plan or hope of giving them back. 미래 세대의 자연자원을 써 버리면서 돌려줄 생각이 없다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 Each year about 50,000 species of plants and animals disappear from the planet \u003cspan class=\"fx\">as a result of human activity\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Each year \u003c/div>\u003cdiv class=\"k\">매년\u003c/div>\u003cdiv class=\"e\">about 50,000 species of plants and animals \u003c/div>\u003cdiv class=\"k\">약 5만 종의 식물과 동물들이\u003c/div>\u003cdiv class=\"e\">disappear from the planet \u003c/div>\u003cdiv class=\"k\">세상으로부터 사라진다\u003c/div>\u003cdiv class=\"e\">as a result of human activity.\u003c/div>\u003cdiv class=\"k\">인간 활동의 결과로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">from the planet\u003c/b>과 \u003cb class=\"key\">as a result of human activity\u003c/b>가 이끄는 전치사구가 동사 disappear를 수식하는 부사 역할을 한다.\u003c/div>","segs":[{"n":33,"text":"Each year, 매년. about 50,000 species of plants and animals, 약 5만 종의 식물과 동물들이. disappear from the planet, 세상으로부터 사라진다. as a result of human activity, 인간 활동의 결과로","hl":"ch"},{"n":34,"text":"여섯 번째 문장입니다. disappear from the planet에서 from the planet은 어디로부터 사라지는지를 알려 주고, as a result of human activity는 왜 사라지는지를 알려 주면서 둘 다 동사 disappear를 꾸며 줍니다. 이렇게 동사 뒤에 전치사구가 여러 개 이어지면 앞에서부터 차례로 의미를 붙여 가며 읽으면 돼요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 Each year about 50,000 species of plants and animals disappear from the planet \u003cspan class=\"fx\">as a result of human activity\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>지구에서 생물이 사라지는 이유가 자연적인 변화가 아니라 우리 인간의 활동 때문이라는 점을 강조하는 문장이에요. 숫자를 통해 규모가 상당히 크다는 것도 보여 주고 있죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as a result of human activity\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">because of what humans do\u003c/span>\u003cdiv class=\"w\">전치사 어구를 절로 풀어 원인을 더 쉽게 표현했어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">disappear from the planet\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">vanish from the earth\u003c/span>\u003cdiv class=\"w\">disappear와 planet을 각각 더 생생한 단어로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as a result of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">because of / due to\u003c/span>\u003cspan class=\"y-eq\">as a result of = because of\u003c/span>\u003cdiv class=\"w\">원인을 나타내는 전치사 어구를 짧은 표현으로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">disappear\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">vanish / die out\u003c/span>\u003cspan class=\"y-eq\">disappear = vanish\u003c/span>\u003cdiv class=\"w\">사라지다, 멸종하다의 느낌을 살린 동의어로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">species\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">kinds of living things\u003c/span>\u003cdiv class=\"w\">생물 분류 단위인 species를 쉽게 풀어 썼어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Every year, human activity causes about fifty thousand kinds of plants and animals to vanish from the earth.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 인간 활동 때문에 매년 엄청난 수의 생물 종이 지구에서 사라지고 있다는 사실을 전하고 있어요. 숫자가 구체적으로 나오기 때문에 문제의 심각성이 더 크게 느껴집니다.","hl":"mn"},{"n":36,"text":"표현을 바꿔 볼까요. as a result of human activity는 because of what humans do로 풀 수 있고, disappear from the planet은 vanish from the earth로 바꿀 수 있어요.","hl":"rw"},{"n":37,"text":"어구 정리해 볼게요. as a result of는 because of나 due to와 같은 말이고, disappear는 vanish나 die out으로 바꿀 수 있습니다. species는 kinds of living things처럼 풀어 말할 수 있어요.","hl":"ph"},{"n":38,"text":"바꾼 문장을 읽어 볼게요. Every year, human activity causes about fifty thousand kinds of plants and animals to vanish from the earth. 인간 활동 때문에 매년 수많은 생물이 지구에서 사라진다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07  Sometimes my eyes get jealous of my heart because you always remain \u003cspan class=\"fx\">close to my heart\u003c/span> and far from my eyes.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Sometimes my eyes get jealous of my heart \u003c/div>\u003cdiv class=\"k\">때때로 나의 눈은 내 심장을 질투하게 된다\u003c/div>\u003cdiv class=\"e\">because you always remain \u003c/div>\u003cdiv class=\"k\">왜냐하면 당신은 항상 남아 있기 때문이다\u003c/div>\u003cdiv class=\"e\">close to my heart \u003c/div>\u003cdiv class=\"k\">나의 심장과 가까이\u003c/div>\u003cdiv class=\"e\">and far from my eyes.\u003c/div>\u003cdiv class=\"k\">그리고 나의 눈에서는 멀리\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">of my heart\u003c/b>, \u003cb class=\"key\">to my heart\u003c/b>, \u003cb class=\"key\">from my eyes\u003c/b> 세 개의 전치사구가 각각 형용사 \u003cb class=\"key\">jealous\u003c/b>, \u003cb class=\"key\">close\u003c/b>, \u003cb class=\"key\">far\u003c/b>를 수식한다.\u003c/div>","segs":[{"n":39,"text":"Sometimes my eyes get jealous of my heart, 때때로 나의 눈은 내 심장을 질투하게 된다. because you always remain, 왜냐하면 당신은 항상 남아 있기 때문이다. close to my heart, 나의 심장과 가까이. and far from my eyes, 그리고 나의 눈에서는 멀리","hl":"ch"},{"n":40,"text":"일곱 번째 문장이에요. of my heart는 jealous를, to my heart는 close를, from my eyes는 far를 각각 꾸며 주고 있습니다. 형용사 뒤에 오는 전치사구는 이렇게 그 형용사의 대상을 알려 주는 역할을 해요. 그래서 형용사와 짝을 이루는 전치사를 통째로 외워 두는 게 중요합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07  Sometimes my eyes get jealous of my heart because you always remain \u003cspan class=\"fx\">close to my heart\u003c/span> and far from my eyes.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>당신이 내 마음속에는 늘 있지만 눈앞에는 보이지 않아서, 눈이 마음을 부러워한다는 뜻이에요. 보고 싶은 사람을 그리워하는 마음을 재치 있게 표현한 문장이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">get jealous of my heart\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">become envious of my heart\u003c/span>\u003cdiv class=\"w\">jealous를 격식 있는 envious로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">remain close to my heart\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stay near my heart\u003c/span>\u003cdiv class=\"w\">remain과 close to를 더 일상적인 표현으로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">jealous of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">envious of\u003c/span>\u003cspan class=\"y-eq\">jealous = envious\u003c/span>\u003cdiv class=\"w\">질투하는, 부러워하는을 뜻하는 형용사를 같은 뜻的其他 단어로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">remain\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stay\u003c/span>\u003cspan class=\"y-eq\">remain = stay\u003c/span>\u003cdiv class=\"w\">계속 그 상태에 있다는 뜻을 쉬운 동사로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">far from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a long way from\u003c/span>\u003cspan class=\"y-eq\">far from = a long way from\u003c/span>\u003cdiv class=\"w\">거리를 나타내는 표현을 풀어 썼어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Sometimes my eyes feel envious of my heart, because you are always near my heart but far away from my eyes.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 보고 싶은 사람에 대한 마음을 재치 있게 표현했어요. 그 사람은 내 마음 가까이에는 늘 있지만 눈앞에서는 멀리 있으니, 눈이 마음을 부러워한다는 거죠. 슬프면서도 위트가 있는 표현입니다.","hl":"mn"},{"n":42,"text":"표현을 바꿔 볼게요. get jealous of는 become envious of로 바꿀 수 있고, remain close to는 stay near로 바꿀 수 있어요. 훨씬 편한 단어들이죠.","hl":"rw"},{"n":43,"text":"어구 정리를 해 볼게요. jealous는 envious와 같은 뜻이고, remain은 stay로 바꿀 수 있습니다. far from은 a long way from으로 풀어 말할 수 있어요.","hl":"ph"},{"n":44,"text":"바꾼 문장을 읽어 볼게요. Sometimes my eyes feel envious of my heart, because you are always near my heart but far away from my eyes. 당신이 마음 가까이엔 있지만 눈앞엔 없어서 눈이 마음을 부러워한다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 \u003cspan class=\"fx\">Upon discovering his own passion and talent for architecture\u003c/span>, Frank Lloyd Wright dropped out of school and went to work for an architectural firm in Chicago.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Upon discovering his own passion and talent for architecture, \u003c/div>\u003cdiv class=\"k\">자기 자신의 열정과 재능을 발견하자마자, 건축을 향한\u003c/div>\u003cdiv class=\"e\">Frank Lloyd Wright dropped out of school \u003c/div>\u003cdiv class=\"k\">Frank Lloyd Wright는 학교를 그만두었다\u003c/div>\u003cdiv class=\"e\">and went to work \u003c/div>\u003cdiv class=\"k\">그리고 일하러 갔다\u003c/div>\u003cdiv class=\"e\">for an architectural firm in Chicago.\u003c/div>\u003cdiv class=\"k\">시카고에 있는 건축 회사에서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">upon + v-ing\u003c/b>」는 '~하자마자'를 뜻하는 전치사구로, \u003cb class=\"key\">Upon ~ architecture\u003c/b>가 문장 전체를 수식한다. \u003cb class=\"key\">for ~ Chicago\u003c/b>는 동사 to work를 수식하는 부사구이다.\u003c/div>","segs":[{"n":45,"text":"Upon discovering his own passion and talent for architecture, 자기 자신의 열정과 재능을 발견하자마자, 건축을 향한. Frank Lloyd Wright dropped out of school, Frank Lloyd Wright는 학교를 그만두었다. and went to work, 그리고 일하러 갔다. for an architectural firm in Chicago, 시카고에 있는 건축 회사에서","hl":"ch"},{"n":46,"text":"여덟 번째 문장입니다. 맨 앞의 upon discovering은 발견하자마자라는 뜻으로, upon 다음에 동명사가 오면 바로 그 행동 직후를 나타내요. 이 전치사구 전체가 문장을 꾸며 주고 있고, 뒤에 나오는 for an architectural firm in Chicago는 to work를 꾸며 주면서 어디서 일했는지를 알려 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 \u003cspan class=\"fx\">Upon discovering his own passion and talent for architecture\u003c/span>, Frank Lloyd Wright dropped out of school and went to work for an architectural firm in Chicago.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자기가 건축을 정말 좋아하고 잘한다는 걸 깨닫자마자, 학교를 그만두고 바로 그 분야의 회사로 간 거예요. 발견과 행동 사이에 시간이 거의 없었다는 점이 핵심이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Upon discovering his own passion and talent for architecture\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">As soon as he discovered his own passion and talent for architecture\u003c/span>\u003cdiv class=\"w\">upon + 동명사를 as soon as 절로 바꿔 주어와 동사를 살렸어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dropped out of school\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">quit school\u003c/span>\u003cdiv class=\"w\">drop out of school을 한 단어 동사 quit으로 간단히 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">upon + v-ing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as soon as + S + V\u003c/span>\u003cspan class=\"y-eq\">upon discovering = as soon as he discovered\u003c/span>\u003cdiv class=\"w\">전치사구를 접속사절로 전환한 대표적인 구조 바꾸기예요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">drop out of school\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">quit school\u003c/span>\u003cspan class=\"y-eq\">drop out of school = quit school\u003c/span>\u003cdiv class=\"w\">학교를 그만두다라는 뜻을 짧게 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">firm\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">company\u003c/span>\u003cspan class=\"y-eq\">firm = company\u003c/span>\u003cdiv class=\"w\">회사를 뜻하는 단어를 가장 흔한 표현으로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">As soon as Frank Lloyd Wright found his own passion and talent for architecture, he quit school and began working for an architecture company in Chicago.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"이 문장은 자신의 재능을 알아차린 순간 바로 행동으로 옮긴 사람的故事예요. 건축에 대한 열정과 재능을 깨닫자마자 학교를 그만두고 시카고의 건축 회사에서 일을 시작했다는 겁니다. 알아차림과 실행 사이에 망설임이 없었다는 점이 인상적이에요.","hl":"mn"},{"n":48,"text":"표현을 바꿔 보면 upon discovering은 as soon as he discovered로 바꿀 수 있어요. 전치사구가 절로 바뀌면서 주어와 동사가 살아나는 거죠. 그리고 dropped out of school은 quit school로 간단히 말할 수 있습니다.","hl":"rw"},{"n":49,"text":"어구 정리 들어갑니다. upon 다음에 동명사가 오면 as soon as 절로 바꿔 쓸 수 있다는 것, 시험에 정말 잘 나오는 포인트예요. drop out of school은 quit school과 같고, firm은 company와 같은 말입니다.","hl":"ph"},{"n":50,"text":"바꾼 문장을 읽어 볼게요. As soon as Frank Lloyd Wright found his own passion and talent for architecture, he quit school and began working for an architecture company in Chicago. 건축에 대한 열정을 발견하자마자 학교를 그만두고 건축 회사에서 일하기 시작했다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 \u003cspan class=\"fx\">Above all\u003c/span>, watch with glittering eyes the whole world around you because the greatest secrets are always hidden in the most unlikely places.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Above all, \u003c/div>\u003cdiv class=\"k\">무엇보다도\u003c/div>\u003cdiv class=\"e\">watch with glittering eyes the whole world around you \u003c/div>\u003cdiv class=\"k\">반짝이는 눈으로 당신 주변의 온 세상을 주시하라\u003c/div>\u003cdiv class=\"e\">because the greatest secrets are always hidden \u003c/div>\u003cdiv class=\"k\">왜냐하면 가장 큰 비밀들은 항상 감춰져 있기 때문이다\u003c/div>\u003cdiv class=\"e\">in the most unlikely places.\u003c/div>\u003cdiv class=\"k\">가장 있을 법하지 않은 곳에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Above all\u003c/b>은 문장 앞에서 문장 전체를 수식하는 부사 역할의 전치사구이다. \u003cb class=\"key\">with glittering eyes\u003c/b>는 동사 watch를, \u003cb class=\"key\">in the most unlikely places\u003c/b>는 are hidden을 수식한다.\u003c/div>","segs":[{"n":51,"text":"Above all, 무엇보다도. watch with glittering eyes the whole world around you, 반짝이는 눈으로 당신 주변의 온 세상을 주시하라. because the greatest secrets are always hidden, 왜냐하면 가장 큰 비밀들은 항상 감춰져 있기 때문이다. in the most unlikely places, 가장 있을 법하지 않은 곳에","hl":"ch"},{"n":52,"text":"아홉 번째 문장이에요. 맨 앞의 Above all은 무엇보다도라는 뜻으로 문장 전체를 꾸며 줍니다. 그리고 with glittering eyes는 동사 watch를 꾸며서 어떻게 보는지를 알려 주고, in the most unlikely places는 are hidden을 꾸며서 어디에 숨겨져 있는지를 알려 줘요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 \u003cspan class=\"fx\">Above all\u003c/span>, watch with glittering eyes the whole world around you because the greatest secrets are always hidden in the most unlikely places.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>비밀은 특별한 곳에 있는 게 아니라, 우리가 대수롭지 않게 여기는 평범한 곳에 숨어 있다는 뜻이에요. 그러니 주변을 눈을 반짝이며 자세히 보라는 격려의 메시지죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Above all\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Most importantly\u003c/span>\u003cdiv class=\"w\">문장 전체를 강조하는 부사구를 부사로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in the most unlikely places\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in the places you would least expect\u003c/span>\u003cdiv class=\"w\">unlikely를 관계절로 풀어 뜻을 쉽게 했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">above all\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">most of all / most importantly\u003c/span>\u003cspan class=\"y-eq\">above all = most importantly\u003c/span>\u003cdiv class=\"w\">무엇보다도라는 강조 표현을 풀어 썼어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unlikely\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">improbable / hard to imagine\u003c/span>\u003cspan class=\"y-eq\">unlikely = improbable\u003c/span>\u003cdiv class=\"w\">있을 법하지 않다는 뜻을 같은 뜻의 형용사로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">glittering\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">shining / sparkling\u003c/span>\u003cspan class=\"y-eq\">glittering = shining\u003c/span>\u003cdiv class=\"w\">반짝이는을 뜻하는 형용사를 흔한 단어로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Most importantly, look at the whole world around you with shining eyes, because the greatest secrets are always hidden in the places you would least expect.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 위대한 비밀은 멀리 특별한 곳에 있지 않다는 걸 말해요. 우리가 별것 아니라고 여기는 곳에 가장 큰 비밀이 숨어 있으니, 주변을 반짝이는 눈으로 잘 살펴보라는 격려입니다.","hl":"mn"},{"n":54,"text":"표현을 바꿔 보면 Above all은 Most importantly로 바꿀 수 있어요. 그리고 in the most unlikely places는 in the places you would least expect로 풀어 쓰면 훨씬 와닿는 표현이 됩니다.","hl":"rw"},{"n":55,"text":"어구 정리해 볼게요. above all은 most importantly와 같은 말이고, unlikely는 improbable과 같아요. glittering은 shining이나 sparkling으로 바꿀 수 있습니다.","hl":"ph"},{"n":56,"text":"바꾼 문장을 읽어 볼게요. Most importantly, look at the whole world around you with shining eyes, because the greatest secrets are always hidden in the places you would least expect. 가장 큰 비밀은 가장 의외의 장소에 숨어 있다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 \u003cspan class=\"fx\">In a democratic environment\u003c/span>, old ideas can be challenged and rigorously criticized, though there are some difficulty due to the human desire to hold onto old ideas, especially by the original proposers.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">In a democratic environment, \u003c/div>\u003cdiv class=\"k\">민주적인 환경에서\u003c/div>\u003cdiv class=\"e\">old ideas can be challenged and rigorously criticized, \u003c/div>\u003cdiv class=\"k\">오래된 개념은 도전을 받을 수 있고 엄격히 비판받을 수 있다\u003c/div>\u003cdiv class=\"e\">though there are some difficulty \u003c/div>\u003cdiv class=\"k\">비록 약간의 어려움이 있더라도\u003c/div>\u003cdiv class=\"e\">due to the human desire to hold onto old ideas, \u003c/div>\u003cdiv class=\"k\">인간의 욕구 때문에, 오래된 개념을 유지하려는\u003c/div>\u003cdiv class=\"e\">especially by the original proposers.\u003c/div>\u003cdiv class=\"k\">특히 최초 제안자에 의해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">In a democratic environment\u003c/b>는 문장 전체를 수식하는 부사 역할의 전치사구이고, \u003cb class=\"key\">due to\u003c/b>가 이끄는 전치사구가 '~ 때문에'라는 의미로 문장 뒤에 쓰였다.\u003c/div>","segs":[{"n":57,"text":"In a democratic environment, 민주적인 환경에서. old ideas can be challenged and rigorously criticized, 오래된 개념은 도전을 받을 수 있고 엄격히 비판받을 수 있다. though there are some difficulty, 비록 약간의 어려움이 있더라도. due to the human desire to hold onto old ideas, 인간의 욕구 때문에, 오래된 개념을 유지하려는. especially by the original proposers, 특히 최초 제안자에 의해","hl":"ch"},{"n":58,"text":"열 번째 문장입니다. In a democratic environment는 민주적인 환경에서라는 뜻으로 문장 전체를 꾸며 줘요. 그리고 문장 뒤쪽의 due to가 이끄는 전치사구는 ~ 때문에라는 이유를 나타내면서 앞 내용에 붙습니다. 특히 by the original proposers처럼 전치사구가 문장 끝에 하나 더 붙어서 누구 때문에 그런지를 알려 주고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 \u003cspan class=\"fx\">In a democratic environment\u003c/span>, old ideas can be challenged and rigorously criticized, though there are some difficulty due to the human desire to hold onto old ideas, especially by the original proposers.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>민주 사회에서는 오래된 생각도 얼마든지 의심하고 비판할 수 있지만, 그 생각을 처음 꺼낸 사람일수록 자기 생각을 놓지 않으려 해서 비판이 쉽지 않다는 뜻이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">due to the human desire to hold onto old ideas\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">because of people's wish to keep old ideas\u003c/span>\u003cdiv class=\"w\">due to를 because of로, desire를 wish로 풀어 썼어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rigorously criticized\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">strictly criticized\u003c/span>\u003cdiv class=\"w\">rigorously를 더 흔한 부사 strictly로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">due to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">because of / owing to\u003c/span>\u003cspan class=\"y-eq\">due to = because of\u003c/span>\u003cdiv class=\"w\">원인을 나타내는 전치사 어구를 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">hold onto\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stick with / keep\u003c/span>\u003cspan class=\"y-eq\">hold onto = keep\u003c/span>\u003cdiv class=\"w\">계속 유지하다라는 뜻을 쉬운 동사로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rigorously\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">strictly\u003c/span>\u003cspan class=\"y-eq\">rigorously = strictly\u003c/span>\u003cdiv class=\"w\">엄격히라는 뜻의 부사를 같은 뜻으로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">In a democracy, old ideas can be questioned and strictly criticized, although it is somewhat difficult because people, especially those who first proposed the ideas, want to keep them.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"민주 사회에서는 어떤 생각이든 도전하고 비판할 수 있어야 하는데, 현실에서는 쉽지 않다는 걸 말하고 있어요. 특히 그 생각을 처음 꺼낸 사람일수록 자기 생각을 놓지 않으려는 마음이 강해서 비판이 어렵다는 거죠.","hl":"mn"},{"n":60,"text":"표현을 바꿔 볼까요. due to the human desire to hold onto old ideas는 because of people's wish to keep old ideas로 풀어 쓸 수 있어요. 그리고 rigorously criticized는 strictly criticized로 바꿔도 같은 뜻입니다.","hl":"rw"},{"n":61,"text":"어구 정리해 볼게요. due to는 because of와 같은 말이고, hold onto는 keep이나 stick with로 바꿀 수 있습니다. rigorously는 strictly와 같은 뜻의 부사예요.","hl":"ph"},{"n":62,"text":"바꾼 문장을 읽어 볼게요. In a democracy, old ideas can be questioned and strictly criticized, although it is somewhat difficult because people, especially those who first proposed the ideas, want to keep them. 민주 사회에서도 처음 제안한 사람들의 욕구 때문에 비판이 쉽지 않다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 \u003cspan class=\"fx\">In spite of the rare case of receiving rewarding email\u003c/span>, we cannot resist the impulse to check email because our behaviors are maintained with the reward presented in an unpredictable way.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">In spite of the rare case of receiving rewarding email, \u003c/div>\u003cdiv class=\"k\">가치 있는 이메일을 받을 경우가 드물더라도\u003c/div>\u003cdiv class=\"e\">we cannot resist the impulse to check email \u003c/div>\u003cdiv class=\"k\">우리는 이메일을 확인하려는 충동을 참지 못한다\u003c/div>\u003cdiv class=\"e\">because our behaviors are maintained \u003c/div>\u003cdiv class=\"k\">왜냐하면 우리의 행동이 유지되기 때문이다\u003c/div>\u003cdiv class=\"e\">with the reward presented in an unpredictable way.\u003c/div>\u003cdiv class=\"k\">예측할 수 없는 방식으로 제공되는 보상으로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">In spite of ~ email\u003c/b>이 문장 전체를 수식하는 부사 역할을 하며, \u003cb class=\"key\">with ~ way\u003c/b>는 동사 are maintained를 수식한다. with가 이끄는 전치사구 안에서 \u003cb class=\"key\">in an unpredictable way\u003c/b>는 과거분사 presented를 수식한다.\u003c/div>","segs":[{"n":63,"text":"In spite of the rare case of receiving rewarding email, 가치 있는 이메일을 받을 경우가 드물더라도. we cannot resist the impulse to check email, 우리는 이메일을 확인하려는 충동을 참지 못한다. because our behaviors are maintained, 왜냐하면 우리의 행동이 유지되기 때문이다. with the reward presented in an unpredictable way, 예측할 수 없는 방식으로 제공되는 보상으로","hl":"ch"},{"n":64,"text":"열한 번째 문장이에요. In spite of the rare case of receiving rewarding email은 가치 있는 메일을 받는 경우가 드물더라도라는 뜻으로 문장 전체를 꾸며 줍니다. 그리고 with the reward는 동사 are maintained를 꾸며 주고, 그 안에 있는 in an unpredictable way는 과거분사 presented를 꾸며 줘요. 전치사구 안에 또 전치사구가 들어갈 수 있다는 점이 핵심입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 \u003cspan class=\"fx\">In spite of the rare case of receiving rewarding email\u003c/span>, we cannot resist the impulse to check email because our behaviors are maintained with the reward presented in an unpredictable way.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>보람 있는 메일을 받는 일은 거의 없는데도 우리는 습관처럼 메일을 확인한다는 뜻이에요. 언제 올지 모르는 보상이기 때문에 오히려 더 자꾸 확인하게 된다는 심리 설명이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">In spite of the rare case of receiving rewarding email\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Even though we rarely receive worthwhile email\u003c/span>\u003cdiv class=\"w\">전치사구를 접속사절로 바꿔 주어와 동사를 드러냈어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cannot resist the impulse to check email\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cannot stop ourselves from checking email\u003c/span>\u003cdiv class=\"w\">resist the impulse to를 stop oneself from -ing로 풀었어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in spite of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">despite\u003c/span>\u003cspan class=\"y-eq\">in spite of = despite\u003c/span>\u003cdiv class=\"w\">같은 뜻의 전치사로 바꿨어요. 둘 다 뒤에 명사가 옵니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">impulse\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">urge\u003c/span>\u003cspan class=\"y-eq\">impulse = urge\u003c/span>\u003cdiv class=\"w\">충동이라는 뜻을 같은 뜻의 명사로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rewarding\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">worthwhile / valuable\u003c/span>\u003cspan class=\"y-eq\">rewarding = worthwhile\u003c/span>\u003cdiv class=\"w\">보람 있는, 가치 있는이라는 뜻을 쉬운 형용사로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Even though we seldom get worthwhile email, we cannot stop ourselves from checking it, because our behavior is kept going by rewards that come in unpredictable ways.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 우리가 왜 자꾸 메일을 확인하는지를 설명해요. 좋은 메일을 받는 일은 드문데도 말이죠. 보상이 언제 올지 예측할 수 없기 때문에, 오히려 더 자주 확인하게 되는 겁니다.","hl":"mn"},{"n":66,"text":"표현을 바꿔 보면 In spite of the rare case of receiving rewarding email은 Even though we rarely receive worthwhile email로 바꿀 수 있어요. 그리고 cannot resist the impulse to check email은 cannot stop ourselves from checking email로 풀어 쓸 수 있습니다.","hl":"rw"},{"n":67,"text":"어구 정리해 볼게요. in spite of는 despite와 같은 뜻이고, impulse는 urge로 바꿀 수 있습니다. rewarding은 worthwhile이나 valuable과 같은 말이에요.","hl":"ph"},{"n":68,"text":"바꾼 문장을 읽어 볼게요. Even though we seldom get worthwhile email, we cannot stop ourselves from checking it, because our behavior is kept going by rewards that come in unpredictable ways. 예측할 수 없는 보상 때문에 자꾸 메일을 확인하게 된다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">With the advent of social media\u003c/span>, our children become impatient for an immediate answer or &quot;Like&quot; within minutes of sending an urgent piece of information out.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">With the advent of social media, \u003c/div>\u003cdiv class=\"k\">소셜 미디어의 출현으로\u003c/div>\u003cdiv class=\"e\">our children become impatient \u003c/div>\u003cdiv class=\"k\">우리의 아이들은 초조해진다\u003c/div>\u003cdiv class=\"e\">for an immediate answer or &quot;Like&quot; \u003c/div>\u003cdiv class=\"k\">즉각적인 응답 또는 '좋아요'를\u003c/div>\u003cdiv class=\"e\">within minutes of sending an urgent piece of information out.\u003c/div>\u003cdiv class=\"k\">긴급한 정보를 보내고 몇 분 이내에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">With the advent of social media\u003c/b>는 문장 전체를 수식하는 부사 역할의 전치사구이다. \u003cb class=\"key\">for an ~ &quot;Like&quot;\u003c/b>는 형용사 impatient를 수식하며, \u003cb class=\"key\">within\u003c/b>이 이끄는 전치사구는 동사를 수식한다.\u003c/div>","segs":[{"n":69,"text":"With the advent of social media, 소셜 미디어의 출현으로. our children become impatient, 우리의 아이들은 초조해진다. for an immediate answer or \"Like\", 즉각적인 응답 또는 '좋아요'를. within minutes of sending an urgent piece of information out, 긴급한 정보를 보내고 몇 분 이내에","hl":"ch"},{"n":70,"text":"마지막 열두 번째 문장입니다. With the advent of social media는 소셜 미디어의 출현으로라는 뜻으로 문장 전체를 꾸며 줘요. 그리고 for an immediate answer or Like는 형용사 impatient를 꾸며 주고, within minutes는 몇 분 이내에라는 뜻으로 동사를 꾸며 줍니다. 전치사구가 형용사도 꾸미고 동사도 꾸민다는 걸 보여 주는 문장이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">With the advent of social media\u003c/span>, our children become impatient for an immediate answer or &quot;Like&quot; within minutes of sending an urgent piece of information out.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>소셜 미디어가 생기면서 아이들이 무언가를 보내자마자 곧바로 반응이 오기를 초조하게 기다리게 되었다는 뜻이에요. 기다림에 약해진 세태를 꼬집는 표현이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">With the advent of social media\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">As social media has appeared\u003c/span>\u003cdiv class=\"w\">전치사구를 접속사절로 바꿔 변화의 시점을 분명히 했어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">become impatient for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">grow eager for\u003c/span>\u003cdiv class=\"w\">impatient for를 eager for로 바꿔 기다리는 마음을 표현했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">with the advent of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">with the arrival of / as ~ appears\u003c/span>\u003cspan class=\"y-eq\">advent = arrival\u003c/span>\u003cdiv class=\"w\">출현, 도래를 뜻하는 명사를 더 흔한 단어로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">impatient for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">eager for / anxious for\u003c/span>\u003cspan class=\"y-eq\">impatient for = eager for\u003c/span>\u003cdiv class=\"w\">초조하게 기다리는 마음을 나타내는 표현으로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">urgent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pressing\u003c/span>\u003cspan class=\"y-eq\">urgent = pressing\u003c/span>\u003cdiv class=\"w\">긴급한이라는 뜻을 같은 뜻의 형용사로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">As social media has arrived, our children grow eager for an immediate answer or a &quot;Like&quot; within minutes of sending out an urgent message.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 소셜 미디어가 생기면서 아이들의 기다리는 방식이 달라졌다는 걸 말해요. 뭔가를 보내자마자 몇 분 안에 답이나 좋아요가 오기를 초조하게 바라보게 되었다는 거죠. 요즘 세태를 잘 보여 주는 표현입니다.","hl":"mn"},{"n":72,"text":"표현을 바꿔 볼까요. With the advent of social media는 As social media has appeared로 바꿀 수 있어요. 그리고 become impatient for는 grow eager for로 바꾸면 기다리는 마음이 더 자연스럽게 드러납니다.","hl":"rw"},{"n":73,"text":"어구 정리해 볼게요. with the advent of는 with the arrival of와 같고, advent는 arrival로 바꿀 수 있어요. impatient for는 eager for로, urgent는 pressing으로 바꿀 수 있습니다.","hl":"ph"},{"n":74,"text":"바꾼 문장을 읽어 볼게요. As social media has arrived, our children grow eager for an immediate answer or a Like within minutes of sending out an urgent message. 소셜 미디어 이후 아이들이 즉각적인 반응을 초조하게 기다리게 되었다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 Unit 29 부사 역할을 하는 전치사구\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>전치사구는 \u003cb class=\"key\">문장 앞\u003c/b>에 오면 문장 전체를, \u003cb class=\"key\">동사·형용사 뒤\u003c/b>에 오면 그 동사나 형용사를 수식하는 부사 역할을 한다.\u003c/li>\u003cli>\u003cb class=\"key\">upon + v-ing\u003c/b>는 '~하자마자'로 as soon as절로 바꿔 쓸 수 있다.\u003c/li>\u003cli>\u003cb class=\"key\">despite / in spite of\u003c/b>, \u003cb class=\"key\">because of / due to / as a result of\u003c/b>는 뒤에 명사를 데리고 부사구를 만든다.\u003c/li>\u003cli>전치사구 안에 \u003cb class=\"key\">또 다른 전치사구\u003c/b>가 들어갈 수 있으므로, 덩어리 단위로 끊어 읽는 습관이 중요하다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 부사 역할을 하는 전치사구를 열두 문장으로 정리해 봤어요. 전치사구가 문장 앞에 오면 문장 전체를 꾸미고, 동사나 형용사 뒤에 오면 그것들을 꾸민다는 점, 꼭 기억하세요. 특히 upon 다음에 동명사가 오면 하자마자라는 뜻이 된다는 것과, despite나 due to 뒤에는 명사가 온다는 것도 시험에 자주 나오는 포인트예요. 오늘 배운 덩어리 끊어 읽기 습관을 다른 지문에도 꼭 적용해 보시고요, 다음 시간에 또 만나요. 수고했습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
