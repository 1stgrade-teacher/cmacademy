  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}

  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;

lecturePlayer(document.getElementById("app"),{"brand":"unit31","title":"too와 enough, 부사적 to부정사로 문장의 방향을 잡아라","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편 - Unit 31 부사적 to-v의 관용 구문\u003c/div>\u003ch1>too와 enough, 부사적 to부정사로 문장의 방향을 잡아라\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>too ~ to-v와 형용사 + enough + to-v, 그리고 부사적 to부정사 관용 표현을 이용해 문장의 의미와 논조를 정확히 파악하고 바꿔 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘도 함께 구문 블록을 하나씩 쌓아 볼게요. 오늘 배울 것은 부사적 to부정사의 관용 구문입니다. too와 enough가 형용사나 부사와 만나서 어떤 의미 덩어리를 만드는지 아주 쉽게 정리해 드릴게요. 겁먹지 말고 차근차근 따라오세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 - Unit 31 부사적 to-v의 관용 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">\u003cb class=\"key\">too + 형용사·부사 + to-v\u003c/b>는 '너무 ~해서 …할 수 없다'라는 부정의 결과를 담고, \u003cb class=\"key\">형용사·부사 + enough + to-v\u003c/b>는 '~할 정도로 충분히 …한'이라는 긍정의 방향을 담습니다. \u003cb class=\"key\">for + 목적격\u003c/b>은 to-v의 의미상 주어 자리이며, \u003cb class=\"key\">never too ~ to-v\u003c/b>는 부정의 의미를 다시 뒤집어 전체를 긍정으로 만듭니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Our span of life is brief, but is \u003cspan class=\"fx\">long enough for us to live well and honestly\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 Some kinds of viruses are \u003cspan class=\"fx\">too small to be seen by the naked eye\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 You are \u003cspan class=\"fx\">never too old to set another goal or to dream a new dream\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Change is the law of life. And those who look only to the past or present \u003cspan class=\"fx\">are certain to miss the future\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">To make a long story short\u003c/span>, Beauty fell in love with the Beast, who turned out to be a handsome prince.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Copywriters must be \u003cspan class=\"fx\">versatile enough to adjust to each new product and medium and to vary the language and tone of each message\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 People draw \u003cspan class=\"fx\">too heavily, too quickly, on already overdrawn environmental resource accounts to be affordable far into the future\u003c/span> without bankrupting those accounts.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 It is not fair to ask of others \u003cspan class=\"fx\">what you are not willing to do yourself\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 The team has lost the last two games and, \u003cspan class=\"fx\">to make matters worse\u003c/span>, two of its best players are injured.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 I always like to look on the optimistic side of life, but I am \u003cspan class=\"fx\">realistic enough to know that life is a complex matter\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 The bargain must truly stand out in the consumer's mind as a good deal that is \u003cspan class=\"fx\">just too exceptional to pass up\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Pollution has a negative effect on the health of everyone living in the city, \u003cspan class=\"fx\">not to mention the damage to the environment\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 too와 to부정사의 결합부터 볼게요. too difficult to understand라고 하면 이해하기에 너무 어렵다는 뜻이죠. 여기서 to부정사는 앞의 형용사를 부정하는 방향으로 작용합니다. 반대로 enough는 형용사 뒤에 붙어서 충분히 그럴 만하다는 긍정의 느낌을 만들어요. 그리고 for us처럼 for 다음에 의미상 주어를 넣어 주면 누가 그 행동을 하는지 분명해집니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Our span of life is brief, but is \u003cspan class=\"fx\">long enough for us to live well and honestly\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Our span of life\u003c/div>\u003cdiv class=\"k\">우리의 수명은\u003c/div>\u003cdiv class=\"e\">is brief,\u003c/div>\u003cdiv class=\"k\">짧다\u003c/div>\u003cdiv class=\"e\">but is long enough\u003c/div>\u003cdiv class=\"k\">그러나 충분히 길다\u003c/div>\u003cdiv class=\"e\">for us to live\u003c/div>\u003cdiv class=\"k\">우리가 살기에\u003c/div>\u003cdiv class=\"e\">well and honestly.\u003c/div>\u003cdiv class=\"k\">멋지게 그리고 정직하게\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「형용사 + \u003cb class=\"key\">enough\u003c/b> + to-v」 구조로, brief와 대조되는 long을 enough가 받쳐 주며 '우리가 멋지고 정직하게 살기에 충분히 길다'는 의미를 만듭니다. \u003cb class=\"key\">for us\u003c/b>는 to live의 의미상 주어입니다.\u003c/div>","segs":[{"n":3,"text":"Our span of life, 우리의 수명은. is brief, 짧다. but is long enough, 그러나 충분히 길다. for us to live, 우리가 살기에. well and honestly, 멋지게 그리고 정직하게","hl":"ch"},{"n":4,"text":"첫 번째 문장은 Our span of life is brief라는 짧은 정보로 시작해 but으로 방향을 틀어요. 뒤에 나오는 long enough for us to live가 핵심인데, enough가 형용사 long 뒤에서 충분히 그럴 만하다는 의미를 만들어 줍니다. for us는 to live의 의미상 주어라서 우리가 살기에 충분히 길다는 뜻이 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Our span of life is brief, but is \u003cspan class=\"fx\">long enough for us to live well and honestly\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>수명은 짧지만, 그 짧은 시간 안에서도 잘 살아 갈 만큼은 충분하다는 뜻이에요. 인생의 길이보다 어떻게 채우는지가 중요하다는 따뜻한 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is long enough for us to live well and honestly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is sufficiently long for us to live well and honestly\u003c/span>\u003cdiv class=\"w\">enough를 sufficiently로 바꿔 같은 '충분히'의 의미를 더 격식 있게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">long enough for us to live\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so long that we can live\u003c/span>\u003cdiv class=\"w\">enough to 구문을 so that 구문으로 전환해 결과의 의미를 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">span of life\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lifespan / life expectancy\u003c/span>\u003cspan class=\"y-eq\">span of life = lifespan\u003c/span>\u003cdiv class=\"w\">수명이라는 뜻을 한 단어나 다른 명사구로 바꿔 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">honestly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">with honesty\u003c/span>\u003cspan class=\"y-eq\">honestly = with honesty\u003c/span>\u003cdiv class=\"w\">부사를 전치사구로 바꿔 같은 의미를 담았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">live well\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">live a good life\u003c/span>\u003cdiv class=\"w\">동사구를 목적어를 가진 표현으로 넓혀 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Although our lives are short, they are long enough for us to live well and honestly.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"수명은 짧지만 잘 살고 정직하게 살기에는 충분히 길다는 말이에요. 시간의 길이보다 채우는 방식이 중요하다는 메시지로 읽으면 됩니다.","hl":"mn"},{"n":6,"text":"enough를 sufficiently로 바꾸면 조금 더 격식 있는 표현이 되고요. so long that we can live처럼 so that 구문으로 바꿔도 같은 뜻을 전달할 수 있습니다.","hl":"rw"},{"n":7,"text":"span of life는 lifespan이나 life expectancy로 바꿔 쓸 수 있어요. honestly는 with honesty로, live well은 live a good life로 표현을 넓힐 수 있습니다.","hl":"ph"},{"n":8,"text":"오늘 문장을 하나로 다시 말하면 Although our lives are short, they are long enough for us to live well and honestly입니다. although로 양보의 느낌을 살려 같은 의미를 담았어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 Some kinds of viruses are \u003cspan class=\"fx\">too small to be seen by the naked eye\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Some kinds of viruses\u003c/div>\u003cdiv class=\"k\">어떤 종류의 바이러스는\u003c/div>\u003cdiv class=\"e\">are too small\u003c/div>\u003cdiv class=\"k\">너무 작다\u003c/div>\u003cdiv class=\"e\">to be seen\u003c/div>\u003cdiv class=\"k\">보이기에\u003c/div>\u003cdiv class=\"e\">by the naked eye.\u003c/div>\u003cdiv class=\"k\">맨눈으로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">too\u003c/b> + 형용사 + to-v」로 '너무 작아서 보일 수 없다'는 부정의 의미를 만듭니다. 같은 내용을 so small that they cannot be seen by the naked eye로 바꿔 쓸 수 있습니다.\u003c/div>","segs":[{"n":9,"text":"Some kinds of viruses, 어떤 종류의 바이러스는. are too small, 너무 작다. to be seen, 보이기에. by the naked eye, 맨눈으로","hl":"ch"},{"n":10,"text":"두 번째 문장은 too small to be seen이 핵심이에요. too 다음에 형용사가 오고 to부정사가 이어지면 너무 그 정도가 심해서 그 행동을 할 수 없다는 부정의 뜻이 됩니다. 그래서 이 문장은 맨눈으로 볼 수 없을 만큼 작다는 의미가 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 Some kinds of viruses are \u003cspan class=\"fx\">too small to be seen by the naked eye\u003c/s the naked eye cannot see them.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"바이러스가 얼마나 작은지 감이 오죠. 눈으로 확인할 수 없을 정도로 작다는 뜻이고, too to 구문은 이렇게 부정의 결과를 담는다는 점이 중요합니다.","hl":"mn"},{"n":12,"text":"so small that they cannot be seen처럼 so that 구문으로 바꾸면 부정의 의미가 더 분명해져요. not large enough to be seen으로 바꾸면 반대 방향에서 같은 말을 할 수 있습니다.","hl":"rw"},{"n":13,"text":"the naked eye는 the unaided eye로 바꿔 쓸 수 있고요. some kinds of는 certain types of로, be seen은 be visible로 바꿔 표현을 넓힐 수 있습니다.","hl":"ph"},{"n":14,"text":"다시 말하면 Certain types of viruses are so small that the naked eye cannot see them입니다. 같은 내용을 so that 구문으로 담아 봤어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 You are \u003cspan class=\"fx\">never too old to set another goal or to dream a new dream\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">You are never too old\u003c/div>\u003cdiv class=\"k\">당신은 결코 너무 나이가 많지 않다\u003c/div>\u003cdiv class=\"e\">to set another goal\u003c/div>\u003cdiv class=\"k\">다른 목표를 세우기에\u003c/div>\u003cdiv class=\"e\">or to dream a new dream.\u003c/div>\u003cdiv class=\"k\">혹은 새로운 꿈을 꾸기에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">never\u003c/b> + too + 형용사 + to-v」는 '결코 너무 ~해서 …할 수 없는 것은 아니다'로, too ~ to의 부정 의미를 never가 다시 뒤집어 전체를 긍정으로 만듭니다. \u003cb class=\"key\">to set\u003c/b>과 \u003cb class=\"key\">to dream\u003c/b>이 or로 연결되어 too old에 함께 걸립니다.\u003c/div>","segs":[{"n":15,"text":"You are never too old, 당신은 결코 너무 나이가 많지 않다. to set another goal, 다른 목표를 세우기에. or to dream a new dream, 혹은 새로운 꿈을 꾸기에","hl":"ch"},{"n":16,"text":"세 번째 문장에는 never가 붙어 있어요. never too old to set이라고 하면 결코 너무 늙어서 목표를 세울 수 없는 것은 아니라는 뜻이 됩니다. never가 too to의 부정을 한 번 더 뒤집어서 전체를 긍정으로 바꿔 주는 거죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 You are \u003cspan class=\"fx\">never too old to set another goal or to dream a new dream\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>나이가 많다는 이유로 새로운 목표나 꿈을 포기할 필요는 없다는 뜻이에요. 시작하기에 늦은 때는 없다는 격려의 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">You are never too old to set another goal\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">It is never too late for you to set another goal\u003c/span>\u003cdiv class=\"w\">나이 대신 때를 가리키는 late로 바꿔 같은 격려를 더 자연스럽게 전했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">never too old to dream a new dream\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">never so old that you cannot dream a new dream\u003c/span>\u003cdiv class=\"w\">too ~ to를 so ~ that 구문으로 풀어 부정의 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">set a goal\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">establish a goal\u003c/span>\u003cspan class=\"y-eq\">set = establish\u003c/span>\u003cdiv class=\"w\">목표를 정한다는 동사를 격식 있는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dream a new dream\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cherish a new dream\u003c/span>\u003cdiv class=\"w\">꿈을 꾼다는 동사를 마음에 품는다는 뉘앙스로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">never too old\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">it is never too late\u003c/span>\u003cspan class=\"y-eq\">never too old = never too late\u003c/span>\u003cdiv class=\"w\">나이 제한을 때의 문제로 바꿔 같은 뜻을 전했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">No matter how old you are, you can always set a new goal and dream a new dream.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"나이가 많아도 새 목표를 세우고 새 꿈을 꿀 수 있다는 격려예요. 늦었다고 포기할 필요가 없다는 따뜻한 말로 들으면 됩니다.","hl":"mn"},{"n":18,"text":"It is never too late for you to set another goal처럼 바꾸면 때의 문제로 표현할 수 있어요. never so old that you cannot dream a new dream으로 풀어 써도 같은 뜻입니다.","hl":"rw"},{"n":19,"text":"set a goal은 establish a goal로 바꿀 수 있고, dream a new dream은 cherish a new dream으로 바꿔 뉘앙스를 살릴 수 있어요. never too old는 it is never too late로 바꿔 쓸 수 있습니다.","hl":"ph"},{"n":20,"text":"한 문장으로 정리하면 No matter how old you are, you can always set a new goal and dream a new dream입니다. no matter how로 나이와 상관없다는 뜻을 살렸어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Change is the law of life. And those who look only to the past or present \u003cspan class=\"fx\">are certain to miss the future\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Change is the law of life.\u003c/div>\u003cdiv class=\"k\">변화는 삶의 법칙이다\u003c/div>\u003cdiv class=\"e\">And those\u003c/div>\u003cdiv class=\"k\">그리고 사람들은\u003c/div>\u003cdiv class=\"e\">who look only to the past or present\u003c/div>\u003cdiv class=\"k\">과거 또는 현재만을 바라보는\u003c/div>\u003cdiv class=\"e\">are certain to miss the future.\u003c/div>\u003cdiv class=\"k\">반드시 미래를 놓치게 된다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">be certain to-v\u003c/b>」는 '반드시 ~하다'로, those who look only to the past or present를 주어로 받아 미래를 놓칠 것이 확실하다고 단정합니다. to-v는 형용사 certain의 의미를 이어받는 부사적 to부정사구입니다.\u003c/div>","segs":[{"n":21,"text":"Change is the law of life, 변화는 삶의 법칙이다. And those, 그리고 사람들은. who look only to the past or present, 과거 또는 현재만을 바라보는. are certain to miss the future, 반드시 미래를 놓치게 된다","hl":"ch"},{"n":22,"text":"네 번째 문장은 두 문장이 이어져 있어요. 뒤 문장의 주어는 those who look only to the past or present이고, be certain to가 반드시 그렇게 된다는 확신을 나타냅니다. to부정사가 형용사 certain을 이어받아 미래를 놓칠 것이라는 내용을 완성합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Change is the law of life. And those who look only to the past or present \u003cspan class=\"fx\">are certain to miss the future\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>변화는 삶의 법칙이므로 과거와 현재만 바라보는 사람은 미래를 놓친다는 뜻이에요. 변화에 열린 태도가 필요하다는 케네디의 말입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are certain to miss the future\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are sure to miss the future\u003c/span>\u003cdiv class=\"w\">certain to를 sure to로 바꿔 같은 '반드시 ~하다'의 의미를 전했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">look only to the past or present\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">focus only on the past or present\u003c/span>\u003cdiv class=\"w\">look to를 focus on으로 바꿔 주의를 기울인다는 뜻을 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">look to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pay attention to\u003c/span>\u003cspan class=\"y-eq\">look to = pay attention to\u003c/span>\u003cdiv class=\"w\">바라본다는 동사를 주의를 기울인다는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be certain to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be sure to\u003c/span>\u003cspan class=\"y-eq\">be certain to = be sure to\u003c/span>\u003cdiv class=\"w\">확신을 나타내는 형용사를 같은 뜻의 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">miss the future\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lose the future\u003c/span>\u003cdiv class=\"w\">놓친다는 동사를 잃는다는 표현으로 바꿔 무게감을 더했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Change is the law of life, and those who look only to the past or the present will surely miss the future.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"변화는 삶의 법칙이니 과거와 현재만 보면 미래를 놓친다는 뜻이에요. 변화에 열린 사람이 미래를 잡는다는 메시지입니다.","hl":"mn"},{"n":24,"text":"are certain to는 are sure to로 바꿔도 같은 뜻이에요. look only to는 focus only on으로 바꾸면 주의를 기울인다는 의미가 더 또렷해집니다.","hl":"rw"},{"n":25,"text":"look to는 pay attention to로, be certain to는 be sure to로 바꿔 쓸 수 있어요. miss the future는 lose the future로 바꿔 표현을 넓힐 수 있습니다.","hl":"ph"},{"n":26,"text":"다시 말하면 Change is the law of life, and those who look only to the past or the present will surely miss the future입니다. surely를 넣어 반드시라는 뜻을 살렸어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 \u003cspan class=\"fx\">To make a long story short\u003c/span>, Beauty fell in love with the Beast, who turned out to be a handsome prince.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">To make a long story short,\u003c/div>\u003cdiv class=\"k\">간단히 말해서\u003c/div>\u003cdiv class=\"e\">Beauty fell in love with the Beast,\u003c/div>\u003cdiv class=\"k\">미녀는 야수와 사랑에 빠졌다\u003c/div>\u003cdiv class=\"e\">who turned out to be a handsome prince.\u003c/div>\u003cdiv class=\"k\">그리고 그는 잘생긴 왕자인 것으로 밝혀졌다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">to make a long story short\u003c/b>」는 문장 전체를 꾸미는 부사적 to부정사 관용 표현으로 '간단히 말해서'라는 뜻입니다. 뒤의 who절은 the Beast를 보충 설명하는 관계대명사절입니다.\u003c/div>","segs":[{"n":27,"text":"To make a long story short, 간단히 말해서. Beauty fell in love with the Beast, 미녀는 야수와 사랑에 빠졌다. who turned out to be a handsome prince, 그리고 그는 잘생긴 왕자인 것으로 밝혀졌다","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 to make a long story short로 시작해요. 이 to부정사구는 문장 성분을 만들지 않고 문장 전체를 꾸미는 부사 역할을 합니다. 뒤에 나오는 who는 the Beast를 보충 설명하는 관계대명사이고요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 \u003cspan class=\"fx\">To make a long story short\u003c/span>, Beauty fell in love with the Beast, who turned out to be a handsome prince.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>길게 설명하지 않고 핵심만 말하자면, 미녀가 야수와 사랑에 빠졌고 그 야수가 사실은 잘생긴 왕자였다는 이야기예요. 결말을 압축해서 던져 주는 표현입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">To make a long story short\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">To put it simply\u003c/span>\u003cdiv class=\"w\">같은 '간단히 말해'의 의미를 더 짧은 관용 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">turned out to be a handsome prince\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">was revealed to be a handsome prince\u003c/span>\u003cdiv class=\"w\">turn out을 be revealed로 바꿔 밝혀졌다는 의미를 격식 있게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">turn out\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be revealed / prove to be\u003c/span>\u003cspan class=\"y-eq\">turn out = prove to be\u003c/span>\u003cdiv class=\"w\">밝혀지다라는 뜻을 다른 동사 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fall in love with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lose one's heart to\u003c/span>\u003cspan class=\"y-eq\">fall in love with = lose one's heart to\u003c/span>\u003cdiv class=\"w\">사랑에 빠지다는 표현을 문어적인 관용구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to make a long story short\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in short / to be brief\u003c/span>\u003cspan class=\"y-eq\">to make a long story short = in short\u003c/span>\u003cdiv class=\"w\">긴 이야기를 줄인다는 관용구를 같은 뜻의 부사구로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">In short, Beauty fell in love with the Beast, who turned out to be a handsome prince.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"길게 말하지 않고 핵심만 전하면 미녀가 야수와 사랑에 빠졌는데 그 야수가 잘생긴 왕자였다는 거예요. 이야기의 결말을 짧게 압축한 표현입니다.","hl":"mn"},{"n":30,"text":"to make a long story short는 to put it simply로 바꿔도 같은 뜻이에요. turned out to be는 was revealed to be로 바꾸면 밝혀졌다는 의미가 더 분명해집니다.","hl":"rw"},{"n":31,"text":"turn out은 prove to be나 be revealed로 바꿀 수 있고, fall in love with는 lose one's heart to로 바꿔 쓸 수 있어요. in short도 같은 뜻의 표현입니다.","hl":"ph"},{"n":32,"text":"한 문장으로 바꾸면 In short, Beauty fell in love with the Beast, who turned out to be a handsome prince입니다. in short로 간단히 말해서라는 뜻을 그대로 살렸어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 Copywriters must be \u003cspan class=\"fx\">versatile enough to adjust to each new product and medium and to vary the language and tone of each message\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Copywriters must be versatile enough\u003c/div that 구문으로 바꿔도 뜻은 그대로예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 People draw \u003cspan class=\"fx\">too heavily, too quickly, on already overdrawn environmental resource accounts to be affordable far into the future\u003c/span> without bankrupting those accounts.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">People draw too heavily, too quickly,\u003c/div>\u003cdiv class=\"k\">사람들은 너무 많이, 너무 빠르게 이용한다\u003c/div>\u003cdiv class=\"e\">on already overdrawn environmental resource accounts\u003c/div>\u003cdiv class=\"k\">이미 초과 인출된 환경 자원 계좌들을\u003c/div>\u003cdiv class=\"e\">to be affordable far into the future\u003c/div>\u003cdiv class=\"k\">먼 미래까지 감당 가능하기에는\u003c/div>\u003cdiv class=\"e\">without bankrupting those accounts.\u003c/div>\u003cdiv class=\"k\">그러한 계좌들을 파산시키지 않고서는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">too\u003c/b> + 부사 + to-v」로 '너무 많이, 너무 빠르게 이용해서 ~할 수 없다'는 부정의 결과를 만듭니다. \u003cb class=\"key\">without + v-ing\u003c/b>는 '~하지 않고서는'이라는 조건을 덧붙입니다.\u003c/div>","segs":[{"n":39,"text":"People draw too heavily, too quickly, 사람들은 너무 많이, 너무 빠르게 이용한다. on already overdrawn environmental resource accounts, 이미 초과 인출된 환경 자원 계좌들을. to be affordable far into the future, 먼 미래까지 감당 가능하기에는. without bankrupting those accounts, 그러한 계좌들을 파산시키지 않고서는","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 draw too heavily, too quickly on accounts가 뼈대예요. too가 부사를 꾸미고 뒤의 to be affordable가 너무 그래서 그렇게 될 수 없다는 부정의 결과를 만듭니다. without bankrupting은 파산시키지 않고서는이라는 조건을 더해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 People draw \u003cspan class=\"fx\">too heavily, too quickly, on already overdrawn environmental resource accounts to be affordable far into the future\u003c/span> without bankrupting those accounts.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인류가 이미 한계를 넘은 환경 자원을 너무 빠르고 많이 쓰고 있어서, 그 자원을 파산시키지 않고 먼 미래까지 감당하기는 어렵다는 뜻이에요. 지속 가능성에 대한 경고입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">draw too heavily, too quickly, on already overdrawn environmental resource accounts to be affordable far into the future\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">draw so heavily and so quickly on already overdrawn environmental resource accounts that they cannot be affordable far into the future\u003c/span>\u003cdiv class=\"w\">too ~ to 구문을 so ~ that 구문으로 풀어 부정의 결과를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">without bankrupting those accounts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">while keeping those accounts from going bankrupt\u003c/span>\u003cdiv class=\"w\">without v-ing를 while keeping from 구문으로 바꿔 조건의 의미를 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">draw on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">use / tap into\u003c/span>\u003cspan class=\"y-eq\">draw on = tap into\u003c/span>\u003cdiv class=\"w\">이용한다는 동사구를 같은 뜻의 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">overdrawn\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">overused / exhausted\u003c/span>\u003cspan class=\"y-eq\">overdrawn = exhausted\u003c/span>\u003cdiv class=\"w\">초과 인출된이라는 형용사를 자원 상황에 맞는 말로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">affordable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">sustainable\u003c/span>\u003cspan class=\"y-eq\">affordable = sustainable\u003c/span>\u003cdiv class=\"w\">감당할 수 있는이라는 뜻을 지속 가능한이라는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">People are using already overdrawn environmental resources so heavily and so quickly that those resources cannot be sustained far into the future without going bankrupt.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이미 한도를 넘은 환경 자원을 너무 빠르고 많이 쓰고 있어서 미래까지 버티기 어렵다는 경고예요. 지속 가능성이라는 말이 떠오르면 이해가 잘 됩니다.","hl":"mn"},{"n":42,"text":"so heavily and so quickly that they cannot be affordable로 바꾸면 부정의 의미가 더 분명해져요. without bankrupting은 while keeping those accounts from going bankrupt로 바꿔도 뜻이 통합니다.","hl":"rw"},{"n":43,"text":"draw on은 tap into나 use로 바꿀 수 있고, overdrawn은 exhausted로 바꾸면 의미가 잘 살아요. affordable은 sustainable로 바꿔 쓸 수 있습니다.","hl":"ph"},{"n":44,"text":"한 문장으로 정리하면 People are using already overdrawn environmental resources so heavily and so quickly that those resources cannot be sustained far into the future without going bankrupt입니다. so that 구문으로 바꿔도 뜻은 같아요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 It is not fair to ask of others \u003cspan class=\"fx\">what you are not willing to do yourself\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It is not fair\u003c/div>\u003cdiv class=\"k\">공정하지 않다\u003c/div>\u003cdiv class=\"e\">to ask of others\u003c/div>\u003cdiv class=\"k\">타인들에게 요구하는 것은\u003c/div>\u003cdiv class=\"e\">what you are not willing to do yourself.\u003c/div>\u003cdiv class=\"k\">당신 스스로 기꺼이 하려고 하지 않는 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>It은 가주어이고 to ask 이하가 진주어이며, what이 이끄는 명사절이 to ask의 목적어입니다. \u003cb class=\"key\">be willing to-v\u003c/b>는 '기꺼이 ~하다'로, not이 붙어 '하려고 하지 않는'이라는 의미를 만듭니다.\u003c/div>","segs":[{"n":45,"text":"It is not fair, 공정하지 않다. to ask of others, 타인들에게 요구하는 것은. what you are not willing to do yourself, 당신 스스로 기꺼이 하려고 하지 않는 것을","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 It으로 시작하는데, 이 It은 가주어예요. 진짜 주어는 to ask of others이고, what이 이끄는 명사절이 to ask의 목적어로 들어갑니다. not willing to do는 기꺼이 하려 하지 않는다는 뜻이고요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 It is not fair to ask of others \u003cspan class=\"fx\">what you are not willing to do yourself\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자신이 하기 싫은 일을 남에게 요구하는 것은 공정하지 않다는 뜻이에요. 남에게 요구하기 전에 먼저 자신을 돌아보라는 말입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are not willing to do\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are unwilling to do\u003c/span>\u003cdiv class=\"w\">not willing을 한 단어 unwilling으로 바꿔 같은 의미를 간결하게 전했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ask of others\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">demand of others\u003c/span>\u003cdiv class=\"w\">ask of를 demand of로 바꿔 강하게 요구한다는 뉘앙스를 더했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be willing to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be ready to / be prepared to\u003c/span>\u003cspan class=\"y-eq\">be willing to = be prepared to\u003c/span>\u003cdiv class=\"w\">기꺼이 하다라는 표현을 같은 뜻의 형용사구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ask of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">demand of / require of\u003c/span>\u003cspan class=\"y-eq\">ask of = require of\u003c/span>\u003cdiv class=\"w\">요구한다는 동사구를 더 강한 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fair\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">just / reasonable\u003c/span>\u003cspan class=\"y-eq\">fair = just\u003c/span>\u003cdiv class=\"w\">공정한이라는 형용사를 같은 뜻의 다른 형용사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">It is unfair to demand of others what you are unwilling to do yourself.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"내가 하기 싫은 일을 남에게 시키는 건 공정하지 않다는 말이에요. 요구하기 전에 먼저 자신을 돌아보라는 뜻으로 읽으면 됩니다.","hl":"mn"},{"n":48,"text":"not willing to do는 unwilling to do로 바꾸면 훨씬 간결해져요. ask of others는 demand of others로 바꾸면 요구의 강도가 세집니다.","hl":"rw"},{"n":49,"text":"be willing to는 be prepared to나 be ready to로 바꿀 수 있고, ask of는 require of로 바꿔 쓸 수 있어요. fair는 just나 reasonable로 바꿔도 좋습니다.","hl":"ph"},{"n":50,"text":"다시 말하면 It is unfair to demand of others what you are unwilling to do yourself입니다. unfair와 unwilling을 써서 같은 뜻을 더 압축했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 The team has lost the last two games and, \u003cspan class=\"fx\">to make matters worse\u003c/span>, two of its best players are injured.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The team has lost the last two games\u003c/div>\u003cdiv class=\"k\">그 팀은 마지막 두 경기를 졌다\u003c/div>\u003cdiv class=\"e\">and, to make matters worse,\u003c/div>\u003cdiv class=\"k\">그리고 설상가상으로\u003c/div>\u003cdiv class=\"e\">two of its best players\u003c/div>\u003cdiv class=\"k\">최고의 선수들 중 두 명이\u003c/div>\u003cdiv class=\"e\">are injured.\u003c/div>\u003cdiv class=\"k\">부상을 입었다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">to make matters worse\u003c/b>」는 문장 전체를 꾸미는 부사적 to부정사 관용 표현으로 '설상가상으로'라는 뜻입니다. and 뒤에 삽입구처럼 들어가 앞뒤 상황을 이어 줍니다.\u003c/div>","segs":[{"n":51,"text":"The team has lost the last two games, 그 팀은 마지막 두 경기를 졌다. and, to make matters worse, 그리고 설상가상으로. two of its best players, 최고의 선수들 중 두 명이. are injured, 부상을 입었다","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 and 뒤에 to make matters worse가 끼어 있어요. 이 to부정사구는 문장 성분이 아니라 전체를 꾸미는 부사 역할을 합니다. 그래서 앞의 패배에 이어 더 나쁜 소식을 덧붙이는 연결 장치가 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 The team has lost the last two games and, \u003cspan class=\"fx\">to make matters worse\u003c/span>, two of its best players are injured.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>팀이 두 경기를 연달아 졌는데, 게다가 주축 선수 둘까지 다쳤다는 뜻이에요. 나쁜 일이 겹쳤다는 안타까움이 담겨 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to make matters worse\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">what is worse\u003c/span>\u003cdiv class=\"w\">같은 '설상가상으로'의 의미를 더 짧은 관용 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are injured\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are out with injuries\u003c/span>\u003cdiv class=\"w\">부상을 입었다는 뜻을 경기에서 빠졌다는 뉘앙스로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to make matters worse\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">worse still / on top of that\u003c/span>\u003cspan class=\"y-eq\">to make matters worse = worse still\u003c/span>\u003cdiv class=\"w\">설상가상으로라는 표현을 같은 뜻의 부사구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">injure\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">hurt / wound\u003c/span>\u003cspan class=\"y-eq\">injure = hurt\u003c/span>\u003cdiv class=\"w\">부상을 입힌다는 동사를 쉬운 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">lose a game\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be defeated in a game\u003c/span>\u003cspan class=\"y-eq\">lose = be defeated\u003c/span>\u003cdiv class=\"w\">경기를 졌다는 표현을 수동태로 바꿔 격식을 갖췄습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The team has lost the last two games, and what is worse, two of its best players are injured.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"두 경기를 졌는데 주축 선수 둘까지 다쳤다는 거예요. 안 좋은 일이 겹쳤다는 안타까운 상황을 전하는 문장입니다.","hl":"mn"},{"n":54,"text":"to make matters worse는 what is worse로 바꿔도 같은 뜻이에요. are injured는 are out with injuries로 바꾸면 경기에서 빠졌다는 느낌이 살아납니다.","hl":"rw"},{"n":55,"text":"to make matters worse는 worse still이나 on top of that으로 바꿀 수 있어요. injure는 hurt로, lose a game은 be defeated in a game으로 바꿔 표현을 넓힐 수 있습니다.","hl":"ph"},{"n":56,"text":"한 문장으로 바꾸면 The team has lost the last two games, and what is worse, two of its best players are injured입니다. what is worse로 설상가상이라는 뜻을 그대로 담았어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 I always like to look on the optimistic side of life, but I am \u003cspan class=\"fx\">realistic enough to know that life is a complex matter\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I always like to look\u003c/div>\u003cdiv class=\"k\">나는 항상 보는 것을 좋아한다\u003c/div>\u003cdiv class=\"e\">on the optimistic side of life,\u003c/div>\u003cdiv class=\"k\">인생의 낙관적인 면을\u003c/div>\u003cdiv class=\"e\">but I am realistic enough\u003c/div>\u003cdiv class=\"k\">그러나 나는 충분히 현실적이다\u003c/div>\u003cdiv class=\"e\">to know\u003c/div>\u003cdiv class=\"k\">알 정도로\u003c/div>\u003cdiv class=\"e\">that life is a complex matter.\u003c/div>\u003cdiv class=\"k\">인생이 복잡한 문제라는 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">형용사 + enough + to-v\u003c/b>」로 '알 만큼 충분히 현실적이다'라는 의미를 만듭니다. 접속사 that이 이끄는 절이 동사 know의 목적어로 들어가 있습니다.\u003c/div>","segs":[{"n":57,"text":"I always like to look, 나는 항상 보는 것을 좋아한다. on the optimistic side of life, 인생의 낙관적인 면을. but I am realistic enough, 그러나 나는 충분히 현실적이다. to know, 알 정도로. that life is a complex matter, 인생이 복잡한 문제라는 것을","hl":"ch"},{"n":58,"text":"열 번째 문장은 but을 기준으로 두 부분이에요. 뒤쪽의 realistic enough to know가 오늘의 핵심으로, 알 만큼 충분히 현실적이라는 뜻을 만듭니다. 그리고 that이 이끄는 절이 know의 목적어로 들어가 있습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 I always like to look on the optimistic side of life, but I am \u003cspan class=\"fx\">realistic enough to know that life is a complex matter\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>낙관적으로 살고 싶지만 인생이 복잡하다는 사실을 알 만큼 현실적이기도 하다는 뜻이에요. 이상과 현실을 함께 보는 균형 잡힌 태도입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I am realistic enough to know that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">I am so realistic that I know that\u003c/span>\u003cdiv class=\"w\">enough to 구문을 so that 구문으로 바꿔 인과의 의미를 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">look on the optimistic side of life\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">look on the bright side of life\u003c/span>\u003cdiv class=\"w\">optimistic side를 bright side로 바꿔 더 익숙한 관용 표현으로 전했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">look on the optimistic side\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">look on the bright side\u003c/span>\u003cspan class=\"y-eq\">optimistic side = bright side\u003c/span>\u003cdiv class=\"w\">낙관적인 면이라는 표현을 관용적인 bright side로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">realistic\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">practical / down-to-earth\u003c/span>\u003cspan class=\"y-eq\">realistic = practical\u003c/span>\u003cdiv class=\"w\">현실적인이라는 형용사를 같은 뜻의 다른 형용사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">complex\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">complicated\u003c/span>\u003cspan class=\"y-eq\">complex = complicated\u003c/span>\u003cdiv class=\"w\">복잡한이라는 형용사를 같은 뜻의 형용사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I always like to look on the bright side of life, but I am realistic enough to know that life is complicated.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"낙관적인 면을 보길 좋아하지만 인생이 복잡하다는 걸 알 만큼 현실적이기도 하다는 말이에요. 이상과 현실을 함께 챙기는 태도가 멋지죠.","hl":"mn"},{"n":60,"text":"so realistic that I know로 바꾸면 enough to의 의미가 더 풀어서 전달돼요. optimistic side는 bright side로 바꾸면 훨씬 익숙하게 들립니다.","hl":"rw"},{"n":61,"text":"look on the optimistic side는 look on the bright side로 바꿀 수 있고, realistic은 practical로, complex는 complicated로 바꿔 쓸 수 있어요.","hl":"ph"},{"n":62,"text":"다시 말하면 I always like to look on the bright side of life, but I am realistic enough to know that life is complicated입니다. bright side와 complicated로 같은 뜻을 더 쉽게 담았어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 The bargain must truly stand out in the consumer's mind as a good deal that is \u003cspan class=\"fx\">just too exceptional to pass up\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The bargain must truly stand out\u003c/div>\u003cdiv class=\"k\">그 특가 상품은 정말로 눈에 띄어야 한다\u003c/div>\u003cdiv class=\"e\">in the consumer's mind\u003c/div>\u003cdiv class=\"k\">소비자의 마음속에서\u003c/div>\u003cdiv class=\"e\">as a good deal\u003c/div>\u003cdiv class=\"k\">좋은 거래로서\u003c/div>\u003cdiv class=\"e\">that is just too exceptional to pass up.\u003c/div>\u003cdiv class=\"k\">정말 너무 파격적이어서 놓칠 수 없는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">too\u003c/b> + 형용사 + to-v」로 '너무 파격적이어서 놓칠 수 없는'이라는 부정의 결과를 만듭니다. that은 a good deal을 수식하는 관계대명사입니다.\u003c/div>","segs":[{"n":63,"text":"The bargain must truly stand out, 그 특가 상품은 정말로 눈에 띄어야 한다. in the consumer's mind, 소비자의 마음속에서. as a good deal, 좋은 거래로서. that is just too exceptional to pass up, 정말 너무 파격적이어서 놓칠 수 없는","hl":"ch"},{"n":64,"text":"열한 번째 문장은 The bargain must stand out as a good deal이 뼈대예요. 뒤에 that is just too exceptional to pass up이 붙어서 어떤 거래인지 설명합니다. too exceptional to pass up은 너무 파격적이라서 놓칠 수 없다는 부정의 의미를 담고요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 The bargain must truly stand out in the consumer's mind as a good deal that is \u003cspan class=\"fx\">just too exceptional to pass up\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>그 거래는 소비자 마음속에서 놓치기 아까운 좋은 기회로 확실히 눈에 띄어야 한다는 뜻이에요. 특가 상품이 갖춰야 할 조건을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">too exceptional to pass up\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so exceptional that it cannot be passed up\u003c/span>\u003cdiv class=\"w\">too ~ to 구문을 so that 구문으로 바꿔 부정의 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stand out in the consumer's mind\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be noticeable to consumers\u003c/span>\u003cdiv class=\"w\">stand out을 be noticeable로 바꿔 같은 뜻을 형용사 표현으로 전했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stand out\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be conspicuous / be noticeable\u003c/span>\u003cspan class=\"y-eq\">stand out = be noticeable\u003c/span>\u003cdiv class=\"w\">눈에 띄다라는 동사구를 형용사 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pass up\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">miss out on / skip\u003c/span>\u003cspan class=\"y-eq\">pass up = miss out on\u003c/span>\u003cdiv class=\"w\">기회를 놓치다라는 뜻을 같은 의미의 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">exceptional\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">extraordinary / outstanding\u003c/span>\u003cspan class=\"y-eq\">exceptional = extraordinary\u003c/span>\u003cdiv class=\"w\">파격적인이라는 형용사를 같은 뜻의 다른 형용사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The bargain must clearly stand out in the consumer's mind as a good deal that is simply so exceptional that it cannot be passed up.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"좋은 거래라면 소비자 머릿속에 확실히 남아서 놓치면 손해라는 느낌을 줘야 한다는 뜻이에요. 특가 상품의 조건을 강조하는 문장입니다.","hl":"mn"},{"n":66,"text":"too exceptional to pass up은 so exceptional that it cannot be passed up으로 바꿀 수 있어요. stand out은 be noticeable to consumers로 바꿔도 뜻이 통합니다.","hl":"rw"},{"n":67,"text":"stand out은 be noticeable로, pass up은 miss out on으로 바꿔 쓸 수 있어요. exceptional은 extraordinary나 outstanding으로 바꾸면 의미가 잘 살아납니다.","hl":"ph"},{"n":68,"text":"한 문장으로 바꾸면 The bargain must clearly stand out in the consumer's mind as a good deal that is simply so exceptional that it cannot be passed up입니다. so that 구문으로 바꿔도 뜻은 그대로예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Pollution has a negative effect on the health of everyone living in the city, \u003cspan class=\"fx\">not to mention the damage to the environment\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Pollution has a negative effect\u003c/div>\u003cdiv class=\"k\">오염은 부정적인 영향을 미친다\u003c/div>\u003cdiv class=\"e\">on the health of everyone\u003c/div>\u003cdiv class=\"k\">모든 사람의 건강에\u003c/div>\u003cdiv class=\"e\">living in the city,\u003c/div>\u003cdiv class=\"k\">도시에 살고 있는\u003c/div>\u003cdiv class=\"e\">not to mention the damage to the environment.\u003c/div>\u003cdiv class=\"k\">환경에 대한 손상은 말할 것도 없이\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「\u003cb class=\"key\">not to mention\u003c/b>」은 '~은 말할 것도 없이'라는 부사적 to부정사 관용 표현으로, 앞의 내용에 더 큰 것을 덧붙입니다. 현재분사구 living in the city가 everyone을 수식합니다.\u003c/div>","segs":[{"n":69,"text":"Pollution has a negative effect, 오염은 부정적인 영향을 미친다. on the health of everyone, 모든 사람의 건강에. living in the city, 도시에 살고 있는. not to mention the damage to the environment, 환경에 대한 손상은 말할 것도 없이","hl":"ch"},{"n":70,"text":"열두 번째 문장은 not to mention이 핵심이에요. 이 to부정사구는 앞의 내용에 더 큰 것을 덧붙이는 부사 역할을 합니다. 그리고 living in the city는 everyone을 뒤에서 수식하는 현재분사구입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Pollution has a negative effect on the health of everyone living in the city, \u003cspan class=\"fx\">not to mention the damage to the environment\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>오염은 도시에 사는 모든 사람의 건강에 해롭고, 환경에 대한 피해는 말할 것도 없다는 뜻이에요. 문제의 범위가 훨씬 넓다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not to mention the damage to the environment\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to say nothing of the damage to the environment\u003c/span>\u003cdiv class=\"w\">같은 '말할 것도 없이'의 의미를 다른 관용 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">has a negative effect on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has a harmful effect on\u003c/span>\u003cdiv class=\"w\">negative를 harmful로 바꿔 해롭다는 뜻을 더 직접적으로 전했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not to mention\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to say nothing of / not to speak of\u003c/span>\u003cspan class=\"y-eq\">not to mention = to say nothing of\u003c/span>\u003cdiv class=\"w\">말할 것도 없다는 관용 표현을 같은 뜻의 다른 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have an effect on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">affect / have an impact on\u003c/span>\u003cspan class=\"y-eq\">have an effect on = affect\u003c/span>\u003cdiv class=\"w\">영향을 미치다는 동사구를 동사 하나나 다른 명사구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">damage\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">harm\u003c/span>\u003cspan class=\"y-eq\">damage = harm\u003c/span>\u003cdiv class=\"w\">손상이라는 명사를 같은 뜻의 명사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Pollution affects the health of everyone living in the city negatively, to say nothing of the damage to the environment.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"오염은 도시에 사는 사람들의 건강에 나쁜 영향을 주고, 환경에 대한 피해는 말할 것도 없다는 뜻이에요. 문제가 생각보다 훨씬 넓다는 강조로 읽으면 됩니다.","hl":"mn"},{"n":72,"text":"not to mention은 to say nothing of로 바꿔도 같은 뜻이에요. has a negative effect on은 has a harmful effect on으로 바꾸면 해롭다는 의미가 더 또렷해집니다.","hl":"rw"},{"n":73,"text":"not to mention은 to say nothing of나 not to speak of로 바꿀 수 있고, have an effect on은 affect로 줄여 쓸 수 있어요. damage는 harm으로 바꿔도 좋습니다.","hl":"ph"},{"n":74,"text":"다시 말하면 Pollution affects the health of everyone living in the city negatively, to say nothing of the damage to the environment입니다. to say nothing of로 말할 것도 없다는 뜻을 살렸어요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 - Unit 31 부사적 to-v의 관용 구문\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">too + 형용사·부사 + to-v\u003c/b>는 '너무 ~해서 …할 수 없다'라는 부정의 의미를 만든다.\u003c/li>\u003cli>\u003cb class=\"key\">형용사·부사 + enough + to-v\u003c/b>는 '~할 정도로 충분히 …하다'라는 긍정의 의미를 만든다.\u003c/li>\u003cli>\u003cb class=\"key\">for + 목적격\u003c/b>은 to-v의 의미상 주어이며, \u003cb class=\"key\">never too ~ to-v\u003c/b>는 부정을 뒤집어 전체를 긍정으로 만든다.\u003c/li>\u003cli>\u003cb class=\"key\">to make a long story short\u003c/b>, \u003cb class=\"key\">to make matters worse\u003c/b>, \u003cb class=\"key\">not to mention\u003c/b>은 문장 전체를 꾸미는 부사적 to부정사 관용 표현이다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 too와 enough, 그리고 부사적 to부정사 관용 표현을 정리했어요. too는 뒤의 to부정사와 만나 부정의 결과를 만들고, enough는 긍정의 방향으로 문장을 이끌어 갑니다. to make a long story short나 not to mention 같은 표현은 통째로 외워 두면 시험장에서 바로 써먹을 수 있어요. 오늘 배운 표현들을 문장으로 꼭 소리 내어 연습해 보세요. 수고했어요, 여러분.","hl":"sum"}]}]});</script></body></html>
