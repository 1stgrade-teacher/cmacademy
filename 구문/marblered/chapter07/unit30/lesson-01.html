  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

lecturePlayer(document.getElementById("app"),{"brand":"unit30","title":"부사 역할을 하는 to부정사, 문맥으로 의미 잡기","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 30 부사 역할을 하는 to-v의 의미\u003c/div>\u003ch1>부사 역할을 하는 to부정사, 문맥으로 의미 잡기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>부사 역할을 하는 to부정사가 목적, 결과, 감정의 원인, 조건, 판단의 근거 등 다양한 의미로 쓰이는 것을 문맥 속에서 파악한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마법같은 블록구문 실전편에서 부사 역할을 하는 to부정사의 의미를 배워 볼 거예요. to부정사가 목적만 나타내는 것이 아니라 결과, 감정의 원인, 조건, 판단의 근거까지 다양하게 쓰인다는 점이 오늘의 포인트입니다. 문장을 끊어 읽으면서 to부정사가 어떤 의미로 쓰였는지 함께 찾아봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">Unit 30 부사 역할을 하는 to-v의 의미\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">부사 역할을 하는 \u003cb class=\"key\">to-v\u003c/b>는 \u003cb class=\"key\">목적\u003c/b>, \u003cb class=\"key\">결과\u003c/b>, \u003cb class=\"key\">감정의 원인\u003c/b>, \u003cb class=\"key\">조건\u003c/b>, \u003cb class=\"key\">판단의 근거\u003c/b> 등 다양한 의미를 나타냅니다. 해석은 '~하기 위해서', '~해서 결국 …하다', '~하게 되어', '~한다면', '~하다니'처럼 문맥에 맞게 달라집니다. \u003cb class=\"key\">so as to-v\u003c/b>, \u003cb class=\"key\">in order to-v\u003c/b>, \u003cb class=\"key\">only to-v\u003c/b> 같은 확장 형태도 함께 익혀 두세요.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Charles Dickens used his desperate experience as a child laborer in Victorian England \u003cspan class=\"fx\">to write David Copperfield.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 That Friday morning, I awoke to find myself caught in the middle  of a social media storm.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 Our brain organizes the available sensory information and environmental stimuli \u003cspan class=\"fx\">so as to make sense out of millions of bits and pieces of data.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 When at length the deal was settled, Dr. Paul was delighted \u003cspan class=\"fx\">to purchase the carving at a reasonable price.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 If an activity is \u003cspan class=\"fx\">easy to perform, easy to fit into your schedule, and easy to love\u003c/span>, you're more likely to stick with it.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 We should carefully think about the reason for someone's behavior \u003cspan class=\"fx\">to avoid coming to a hasty conclusion about it.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 When temperatures near 0°C, water molecules start bonding with one another \u003cspan class=\"fx\">to form a crystal structure.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 We would be honored \u003cspan class=\"fx\">to have you as a guest at the annual festival.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 If you are fortunate \u003cspan class=\"fx\">to have opportunity\u003c/span>, it is your duty to make sure other people have those opportunities as well.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 We can't help but think James must have his head in the clouds \u003cspan class=\"fx\">to talk like that.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Have you ever found yourself speaking to someone at length \u003cspan class=\"fx\">only to realize they haven't heard a single thing you've said?\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 A child who has been repeatedly criticized for poor performance on math may learn to dodge difficult math problems \u003cspan class=\"fx\">in order to avoid further punishment.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"부사 역할을 하는 to부정사는 문장에서 목적, 결과, 감정의 원인, 조건, 판단의 근거 같은 다양한 의미를 나타냅니다. 그래서 무조건 하기 위해서라고만 해석하면 안 되고, 앞뒤 문맥을 먼저 봐야 해요. so as to나 in order to는 목적을 분명히 할 때, only to는 예상 밖의 결과를 강조할 때 자주 쓰입니다. 오늘은 이 다섯 가지 의미를 문장 속에서 구별하는 연습을 해 봅시다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Charles Dickens used his desperate experience as a child laborer in Victorian England \u003cspan class=\"fx\">to write David Copperfield.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Charles Dickens \u003c/div>\u003cdiv class=\"k\">찰스 디킨스는 \u003c/div>\u003cdiv class=\"e\">used \u003c/div>\u003cdiv class=\"k\">사용했다 \u003c/div>\u003cdiv class=\"e\">his desperate experience \u003c/div>\u003cdiv class=\"k\">그의 절망적인 경험을 \u003c/div>\u003cdiv class=\"e\">as a child laborer \u003c/div>\u003cdiv class=\"k\">아동 노동자로서 \u003c/div>\u003cdiv class=\"e\">in Victorian England \u003c/div>\u003cdiv class=\"k\">빅토리아 시대 영국에서 \u003c/div>\u003cdiv class=\"e\">to write David Copperfield.\u003c/div>\u003cdiv class=\"k\">데이비드 코퍼필드를 쓰기 위해서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>to write 이하는 \u003cb class=\"key\">목적\u003c/b>을 나타내는 부사적 to부정사로, '데이비드 코퍼필드를 쓰기 위해서'라는 뜻으로 used의 목적을 설명합니다.\u003c/div>","segs":[{"n":3,"text":"Charles Dickens, 찰스 디킨스는. used, 사용했다. his desperate experience, 그의 절망적인 경험을. as a child laborer, 아동 노동자로서. in Victorian England, 빅토리아 시대 영국에서. to write David Copperfield, 데이비드 코퍼필드를 쓰기 위해서","hl":"ch"},{"n":4,"text":"먼저 첫 번째 문장을 볼게요. to write는 David Copperfield를 쓰기 위해서라는 목적을 나타내는 부사적 to부정사예요. Charles Dickens used his desperate experience라는 뼈대 뒤에 to write가 붙어서 그 경험을 왜 활용했는지 설명해 주죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Charles Dickens used his desperate experience as a child laborer in Victorian England \u003cspan class=\"fx\">to write David Copperfield.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>디킨스가 빅토리아 시대 영국에서 아동 노동자로 겪은 절망적인 경험이 《데이비드 코퍼필드》를 쓰는 바탕이 되었다는 의미입니다. 힘든 과거가 오히려 작품을 쓰게 한 동력이었다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">used his desperate experience as a child laborer in Victorian England to write David Copperfield\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">drew on his desperate experience as a child laborer in Victorian England in order to write David Copperfield\u003c/span>\u003cdiv class=\"w\">used를 draw on으로 바꾸어 '경험을 활용하다'의 뜻을 살리고, to write를 in order to write로 바꾸어 목적을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to write David Copperfield\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so as to write David Copperfield\u003c/span>\u003cdiv class=\"w\">목적의 to부정사를 so as to로 바꾼 표현입니다. 격식 있는 문어체에서 목적을 강조합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">desperate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">hopeless\u003c/span>\u003cspan class=\"y-eq\">desperate = hopeless\u003c/span>\u003cdiv class=\"w\">절망적인이라는 뜻을 유지하면서 감정의 강도를 드러내는 동의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">used\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">drew on\u003c/span>\u003cspan class=\"y-eq\">used = drew on\u003c/span>\u003cdiv class=\"w\">경험·자원을 활용하다는 뜻을 더 자연스럽게 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as a child laborer\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">while working as a child\u003c/span>\u003cdiv class=\"w\">아동 노동자로서라는 신분 표현을 일하면서라는 동작 표현으로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Charles Dickens drew on his painful experience as a child worker in Victorian England in order to write David Copperfield.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 디킨스가 아동 노동자로 겪은 힘든 경험이 David Copperfield를 쓰는 밑거름이 되었다는 뜻이에요. 절망적인 경험이 오히려 작품을 쓰게 한 힘이었다는 점을 기억해 주세요.","hl":"mn"},{"n":6,"text":"used는 drew on으로 바꿔도 경험을 활용했다는 뜻이 잘 살아요. 목적을 더 분명히 하고 싶으면 to write를 in order to write나 so as to write로 바꿔 쓸 수 있습니다.","hl":"rw"},{"n":7,"text":"desperate는 hopeless와 가까운 표현이고, used는 drew on으로 바꿔 쓸 수 있어요. as a child laborer는 while working as a child처럼 풀어 쓸 수 있습니다.","hl":"ph"},{"n":8,"text":"이제 같은 뜻을 자연스럽게 바꾼 문장을 읽어 볼게요. Charles Dickens drew on his painful experience as a child worker in Victorian England in order to write David Copperfield. 경험을 활용해서 작품을 썼다는 핵심은 그대로죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 That Friday morning, I awoke to find myself caught in the middle  of a social media storm.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">That Friday morning, \u003c/div>\u003cdiv class=\"k\">그 금요일 아침에 \u003c/div>\u003cdiv class=\"e\">I awoke \u003c/div>\u003cdiv class=\"k\">나는 깨어나서 \u003c/div>\u003cdiv class=\"e\">to find myself \u003c/div>\u003cdiv class=\"k\">내가 있음을 알게 되었다 \u003c/div>\u003cdiv class=\"e\">caught in the middle \u003c/div>\u003cdiv class=\"k\">한가운데에 처해 있는 \u003c/div>\u003cdiv class=\"e\">of a social media storm.\u003c/div>\u003cdiv class=\"k\">소셜 미디어 폭풍의\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>awoke 뒤의 to find 이하는 \u003cb class=\"key\">결과\u003c/b>를 나타내는 부사적 to부정사로, '깨어나서 결국 …임을 알게 되었다'라는 의미를 만듭니다. find myself caught는 \u003cb class=\"key\">find + 목적어 + 과거분사\u003c/b> 구조로 '내가 처해 있는 모습을 발견하다'라는 뜻입니다.\u003c/div>","segs":[{"n":9,"text":"That Friday morning, 그 금요일 아침에. I awoke, 나는 깨어나서. to find myself, 내가 있음을 알게 되었다. caught in the middle, 한가운데에 처해 있는. of a social media storm, 소셜 미디어 폭풍의","hl":"ch"},{"n":10,"text":"두 번째 문장에서는 awoke 뒤에 to find가 이어져요. 이 to find는 깨어나서 결국 알게 되었다는 결과를 나타내는 부사적 to부정사입니다. find myself caught는 내가 처해 있는 모습을 발견했다는 뜻으로 이해하면 돼요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 That Friday morning, I awoke to find myself caught in the middle  of a social media storm.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>금요일 아침에 일어나 보니 자신이 소셜 미디어 논란의 한복판에 있다는 것을 알게 되었다는 뜻입니다. 'storm'은 실제 폭풍이 아니라 온라인에서 벌어진 거센 논란을 비유합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">awoke to find myself caught in the middle of a social media storm\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">woke up and found myself in the middle of a social media storm\u003c/span>\u003cdiv class=\"w\">결과의 to부정사를 and로 풀어 두 동작을 순서대로 드러냈습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">caught in the middle of a social media storm\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at the center of a social media controversy\u003c/span>\u003cdiv class=\"w\">'폭풍'이라는 비유를 '논란'으로 풀어 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">awoke\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">woke up\u003c/sp iv class=\"k\">우리의 뇌는 \u003c/div>\u003cdiv class=\"e\">organizes \u003c/div>\u003cdiv class=\"k\">체계화한다 \u003c/div>\u003cdiv class=\"e\">the available sensory information \u003c/div>\u003cdiv class=\"k\">이용 가능한 감각 정보를 \u003c/div>\u003cdiv class=\"e\">and environmental stimuli \u003c/div>\u003cdiv class=\"k\">그리고 환경 자극을 \u003c/div>\u003cdiv class=\"e\">so as to make sense out of \u003c/div>\u003cdiv class=\"k\">이해하기 위해서 \u003c/div>\u003cdiv class=\"e\">millions of bits and pieces of data.\u003c/div>\u003cdiv class=\"k\">수백만 개의 이리저리 흩어진 자료를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>so as to make 이하는 \u003cb class=\"key\">목적\u003c/b>을 나타내는 부사적 to부정사로, 목적을 분명히 하기 위해 \u003cb class=\"key\">so as to-v\u003c/b> 형태로 쓰였습니다. '수백만 개의 흩어진 자료를 이해하기 위해서'라고 해석합니다.\u003c/div>","segs":[{"n":15,"text":"Our brain, 우리의 뇌는. organizes, 체계화한다. the available sensory information, 이용 가능한 감각 정보를. and environmental stimuli, 그리고 환경 자극을. so as to make sense out of, 이해하기 위해서. millions of bits and pieces of data, 수백만 개의 이리저리 흩어진 자료를","hl":"ch"},{"n":16,"text":"세 번째 문장에서는 so as to make가 목적을 나타내요. to부정사만으로도 목적을 말할 수 있지만 so as to를 쓰면 이해하기 위해서라는 목적이 더 분명해집니다. 그래서 so as to make sense out of는 자료를 이해하기 위해서라고 해석해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 Our brain organizes the available sensory information and environmental stimuli \u003cspan class=\"fx\">so as to make sense out of millions of bits and pieces of data.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>뇌는 감각 정보와 환경 자극을 정리해서 흩어진 수많은 자료를 의미 있게 파악한다는 뜻입니다. 즉 뇌가 혼란스러운 정보를 해석 가능한 형태로 조직한다는 설명입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so as to make sense out of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in order to understand\u003c/span>\u003cdiv class=\"w\">so as to를 in order to로 바꾸고 make sense out of를 understand로 풀어 목적을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">organizes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">arranges\u003c/span>\u003cdiv class=\"w\">체계화한다는 뜻을 arrange로 바꿔 정리한다는 느낌을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make sense (out) of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">understand\u003c/span>\u003cspan class=\"y-eq\">make sense of = understand\u003c/span>\u003cdiv class=\"w\">이해하다는 뜻을 쉬운 동의어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">bits and pieces\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">scattered pieces\u003c/span>\u003cdiv class=\"w\">흩어진 조각들이라는 뜻을 살린 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">environmental stimuli\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cues from the environment\u003c/span>\u003cspan class=\"y-eq\">stimuli = cues\u003c/span>\u003cdiv class=\"w\">자극을 환경적 단서라는 뜻으로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Our brain arranges the sensory information and environmental cues available to us in order to understand millions of scattered pieces of data.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"우리 뇌는 감각 정보와 환경 자극을 정리해서 흩어진 수많은 자료를 의미 있게 이해한다는 뜻이에요. 복잡한 정보를 쓸모 있는 형태로 바꾼다고 생각하면 됩니다.","hl":"mn"},{"n":18,"text":"so as to는 in order to로 바꿔도 목적이 잘 드러나요. make sense out of는 understand로 바꾸면 학생들이 이해하기 쉬운 문장이 됩니다.","hl":"rw"},{"n":19,"text":"make sense out of는 understand와 같은 뜻이고, bits and pieces는 흩어진 조각들이라는 표현이에요. stimuli는 자극이나 단서라는 뜻으로 기억해 두세요.","hl":"ph"},{"n":20,"text":"같은 뜻의 문장을 읽어 볼게요. Our brain arranges the sensory information and environmental cues available to us in order to understand millions of scattered pieces of data. 뇌가 정보를 정리해 이해한다는 핵심은 유지됩니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 When at length the deal was settled, Dr. Paul was delighted \u003cspan class=\"fx\">to purchase the carving at a reasonable price.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">When at length \u003c/div>\u003cdiv class=\"k\">마침내 \u003c/div>\u003cdiv class=\"e\">the deal was settled, \u003c/div>\u003cdiv class=\"k\">그 거래가 합의에 이르렀을 때 \u003c/div>\u003cdiv class=\"e\">Dr. Paul \u003c/div>\u003cdiv class=\"k\">Paul 박사는 \u003c/div>\u003cdiv class=\"e\">was delighted \u003c/div>\u003cdiv class=\"k\">기뻤다 \u003c/div>\u003cdiv class=\"e\">to purchase the carving \u003c/div>\u003cdiv class=\"k\">그 조각품을 구입하게 되어 \u003c/div>\u003cdiv class=\"e\">at a reasonable price.\u003c/div>\u003cdiv class=\"k\">적절한 가격에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>형용사 delighted 뒤의 to purchase 이하는 \u003cb class=\"key\">감정의 원인\u003c/b>을 나타내는 부사적 to부정사로, '~하게 되어 기뻤다'라는 의미를 만듭니다.\u003c/div>","segs":[{"n":21,"text":"When at length, 마침내. the deal was settled, 그 거래가 합의에 이르렀을 때. Dr. Paul, Paul 박사는. was delighted, 기뻤다. to purchase the carving, 그 조각품을 구입하게 되어. at a reasonable price, 적절한 가격에","hl":"ch"},{"n":22,"text":"네 번째 문장에서는 delighted 뒤에 to purchase가 와요. 이 to purchase는 기쁨의 원인을 나타내는 부사적 to부정사입니다. 그래서 was delighted to purchase는 사게 되어 기뻤다라고 해석합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 When at length the deal was settled, Dr. Paul was delighted \u003cspan class=\"fx\">to purchase the carving at a reasonable price.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>오랜 협상 끝에 거래가 성사되자 Paul 박사가 합리적인 가격에 조각품을 사게 되어 기뻤다는 뜻입니다. 'at length'는 '마침내'라는 뜻으로 문맥상 시간의 결과를 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">was delighted to purchase\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">was very happy that he purchased\u003c/span>\u003cdiv class=\"w\">감정의 원인 to부정사를 that절로 풀어 원인을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at a reasonable price\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at a fair price\u003c/span>\u003cdiv class=\"w\">reasonable을 fair로 바꿔 적절한 가격이라는 뜻을 자연스럽게 전달했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at length\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">finally\u003c/span>\u003cspan class=\"y-eq\">at length = finally\u003c/span>\u003cdiv class=\"w\">문맥상 마침내라는 뜻으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">settle\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be agreed\u003c/span>\u003cspan class=\"y-eq\">settle = be agreed\u003c/span>\u003cdiv class=\"w\">거래가 합의되다라는 수동 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">reasonable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fair\u003c/span>\u003cspan class=\"y-eq\">reasonable = fair\u003c/span>\u003cdiv class=\"w\">가격이 적절한이라는 뜻을 fair로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">When the deal was finally settled, Dr. Paul was very happy that he purchased the carving at a fair price.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"마침내 거래가 성사되었고 Paul 박사는 적절한 가격에 조각품을 사게 되어 기뻤다는 뜻이에요. at length는 여기서 마침내라는 의미로 쓰였습니다.","hl":"mn"},{"n":24,"text":"was delighted to purchase는 was very happy that he purchased로 풀어 쓸 수 있어요. at a reasonable price는 at a fair price로 바꿔도 자연스럽습니다.","hl":"rw"},{"n":25,"text":"at length는 finally, settle은 be agreed, reasonable은 fair로 바꿔 쓸 수 있습니다. 가격 표현에서는 reasonable과 fair가 자주 함께 나와요.","hl":"ph"},{"n":26,"text":"바꾼 문장을 읽어 볼게요. When the deal was finally settled, Dr. Paul was very happy that he purchased the carving at a fair price. 거래가 성사되고 기뻤다는 의미가 그대로 살아 있습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 If an activity is \u003cspan class=\"fx\">easy to perform, easy to fit into your schedule, and easy to love\u003c/span>, you're more likely to stick with it.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If \u003c/div>\u003cdiv class=\"k\">만약 \u003c/div>\u003cdiv class=\"e\">an activity \u003c/div>\u003cdiv class=\"k\">어떤 활동이 \u003c/div>\u003cdiv class=\"e\">is easy to perform, \u003c/div>\u003cdiv class=\"k\">하기 쉽고 \u003c/div>\u003cdiv class=\"e\">easy to fit into your schedule, \u003c/div>\u003cdiv class=\"k\">당신의 일정에 맞추기 쉬우며 \u003c/div>\u003cdiv class=\"e\">and easy to love, \u003c/div>\u003cdiv class=\"k\">그리고 좋아하기 쉽다면 \u003c/div>\u003cdiv class=\"e\">you're \u003c/div>\u003cdiv class=\"k\">당신은 \u003c/div>\u003cdiv class=\"e\">more likely \u003c/div>\u003cdiv class=\"k\">더욱 ~할 가능성이 높다 \u003c/div>\u003cdiv class=\"e\">to stick with it.\u003c/div>\u003cdiv class=\"k\">그것을 계속할\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>easy 뒤의 to perform, to fit, to love는 '~하기에'라는 의미로 각각 \u003cb class=\"key\">easy\u003c/b>를 수식하는 to부정사입니다. '하기 쉽고, 일정에 맞추기 쉬우며, 좋아하기 쉬운'처럼 형용사 easy의 의미를 완성합니다.\u003c/div>","segs":[{"n":27,"text":"If, 만약. an activity, 어떤 활동이. is easy to perform, 하기 쉽고. easy to fit into your schedule, 당신의 일정에 맞추기 쉬우며. and easy to love, 그리고 좋아하기 쉽다면. you're, 당신은. more likely, 더욱 ~할 가능성이 높다. to stick with it, 그것을 계속할","hl":"ch"},{"n":28,"text":"다섯 번째 문장에는 easy 뒤에 to perform, to fit, to love가 이어져요. 이 to부정사들은 하기에라는 뜻으로 easy를 꾸며 줍니다. 그래서 easy to perform은 하기 쉽다는 뜻이 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 If an activity is \u003cspan class=\"fx\">easy to perform, easy to fit into your schedule, and easy to love\u003c/span>, you're more likely to stick with it.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>어떤 활동이 실행하기 쉽고 일정에 넣기 쉬우며 좋아하기도 쉽다면, 사람은 그 활동을 계속할 가능성이 높다는 뜻입니다. 즉 시작 장벽이 낮고 즐거움이 있어야 습관으로 이어진다는 조언입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">you're more likely to stick with it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">you will probably keep doing it\u003c/span>\u003cdiv class=\"w\">more likely to를 probably로 풀고 stick with를 keep doing으로 바꿔 의미를 쉽게 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">easy to fit into your schedule\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">easy to work into your schedule\u003c/span>\u003cdiv class=\"w\">fit into를 work into로 바꿔 일정에 넣다는 뜻을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stick with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">keep doing\u003c/span>\u003cspan class=\"y-eq\">stick with = keep doing\u003c/span>\u003cdiv class=\"w\">계속하다는 뜻을 쉬운 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fit into\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">work into\u003c/span>\u003cspan class=\"y-eq\">fit into = work into\u003c/span>\u003cdiv class=\"w\">일정에 맞추다·넣다는 뜻의 유사 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">more likely to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">probably\u003c/span>\u003cspan class=\"y-eq\">likely = probable\u003c/span>\u003cdiv class=\"w\">가능성 표현을 부사 probably로 바꿔 자연스럽게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If an activity is easy to do, easy to work into your schedule, and easy to enjoy, you will probably keep doing it.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"활동이 하기 쉽고 일정에 넣기 쉬우며 좋아하기 쉽다면 그 활동을 계속할 가능성이 높다는 뜻이에요. 쉽고 즐거운 활동이 습관으로 이어진다는 조언이죠.","hl":"mn"},{"n":30,"text":"you are more likely to stick with it은 you will probably keep doing it으로 바꿀 수 있어요. easy to fit into your schedule은 easy to work into your schedule로 바꿔도 뜻이 잘 통합니다.","hl":"rw"},{"n":31,"text":"stick with는 keep doing, fit into는 work into로 바꿀 수 있어요. be likely to는 probably처럼 가능성 표현으로 풀어 쓸 수 있습니다.","hl":"ph"},{"n":32,"text":"같은 뜻으로 바꾼 문장을 읽어 볼게요. If an activity is easy to do, easy to work into your schedule, and easy to enjoy, you will probably keep doing it. 하기 쉽고 즐거우면 계속하게 된다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 We should carefully think about the reason for someone's behavior \u003cspan class=\"fx\">to avoid coming to a hasty conclusion about it.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We should carefully think \u003c/div>\u003cdiv class=\"k\">우리는 조심스럽게 생각해야 한다 \u003c/div>\u003cdiv class=\"e\">about the reason for someone's behavior \u003c/div>\u003cdiv class=\"k\">어떤 사람의 행동의 이유에 대해 \u003c/div>\u003cdiv class=\"e\">to avoid \u003c/div>\u003cdiv class=\"k\">피하기 위해서 \u003c/div>\u003cdiv class=\"e\">coming to a hasty conclusion \u003c/div>\u003cdiv class=\"k\">성급한 결론에 도달하는 것을 \u003c/div>\u003cdiv class=\"e\">about it.\u003c/div>\u003cdiv class=\"k\">그것에 대한\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>to avoid 이하는 \u003cb class=\"key\">목적\u003c/b>을 나타내는 부사적 to부정사로, '그것에 대해 성급한 결론에 도달하는 것을 피하기 위해서'라는 뜻입니다. think about의 목적어 뒤에서 행동의 목적을 설명합니다.\u003c/div>","segs":[{"n":33,"text":"We should carefully think, 우리는 조심스럽게 생각해야 한다. about the reason for someone's behavior, 어떤 사람의 행동의 이유에 대해. to avoid, 피하기 위해서. coming to a hasty conclusion, 성급한 결론에 도달하는 것을. about it, 그것에 대한","hl":"ch"},{"n":34,"text":"여섯 번째 문장에서는 to avoid가 목적을 나타내요. 어떤 사람의 행동 이유를 조심스럽게 생각하는 목적이 성급한 결론을 피하기 위해서라는 거죠. to avoid 뒤에는 동명사 coming이 와서 피하다의 대상이 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 We should carefully think about the reason for someone's behavior \u003cspan class=\"fx\">to avoid coming to a hasty conclusion about it.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>어떤 사람이 왜 그렇게 행동했는지 충분히 생각한 뒤에 결론을 내려야 한다는 뜻입니다. 섣불리 판단하지 말라는 조언입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to avoid coming to a hasty conclusion\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so as not to jump to a hasty conclusion\u003c/span>\u003cdiv class=\"w\">목적의 to avoid를 so as not to로 바꾸고 come to를 jump to로 바꿔 부정 목적을 강조했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">carefully think about\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">consider carefully\u003c/span>\u003cdiv class=\"w\">think about을 consider로 바꿔 더 간결하게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">hasty\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rushed\u003c/span>\u003cspan class=\"y-eq\">hasty = rushed\u003c/span>\u003cdiv class=\"w\">성급한이라는 뜻을 rushed로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">come to a conclusion\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">reach a conclusion\u003c/span>\u003cspan class=\"y-eq\">come to a conclusion = reach a conclusion\u003c/span>\u003cdiv class=\"w\">결론에 도달하다의 대표 동의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">think about\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">consider\u003c/span>\u003cspan class=\"y-eq\">think about = consider\u003c/span>\u003cdiv class=\"w\">고려하다는 뜻으로 간결하게 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We should consider carefully why someone behaved that way so as not to jump to a hasty conclusion about it.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"누군가가 왜 그렇게 행동했는지 충분히 따져 보고 섣불리 결론을 내리지 말라는 뜻이에요. hasty는 성급한이라는 뜻으로 기억해 주세요.","hl":"mn"},{"n":36,"text":"to avoid coming to a hasty conclusion은 so as not to jump to a hasty conclusion으로 바꿀 수 있어요. carefully think about는 consider carefully로 간결하게 바꿀 수 있습니다.","hl":"rw"},{"n":37,"text":"hasty는 rushed, come to a conclusion은 reach a conclusion, think about은 consider로 바꿀 수 있어요. 시험에서는 결론에 도달하다라는 표현이 자주 나옵니다.","hl":"ph"},{"n":38,"text":"바꾼 문장을 읽어 볼게요. We should consider carefully why someone behaved that way so as not to jump to a hasty conclusion about it. 성급한 판단을 피하자는 뜻이 잘 드러납니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 When temperatures near 0°C, water molecules start bonding with one another \u003cspan class=\"fx\">to form a crystal structure.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">When temperatures near 0°C, \u003c/div>\u003cdiv class=\"k\">온도가 섭씨 0도에 가까워질 때 \u003c/div>\u003cdiv class=\"e\">water molecules \u003c/div>\u003cdiv class=\"k\">물 분자는 \u003c/div>\u003cdiv class=\"e\">start bonding with one another \u003c/div>\u003cdiv class=\"k\">서로 결합하기 시작한다 \u003c/div>\u003cdiv class=\"e\">to form a crystal structure.\u003c/div>\u003cdiv class=\"k\">그래서 결정 구조를 형성한다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>to form 이하는 \u003cb class=\"key\">결과\u003c/b>를 나타내는 부사적 to부정사로, '결합해서 결국 결정 구조를 형성한다'라는 의미입니다. 앞 절의 동작이 이어져 어떤 결과를 낳는지 보여 줍니다.\u003c/div>","segs":[{"n":39,"text":"When temperatures near 0°C, 온도가 섭씨 0도에 가까워질 때. water molecules, 물 분자는. start bonding with one another, 서로 결합하기 시작한다. to form a crystal structure, 그래서 결정 구조를 형성한다","hl":"ch"},{"n":40,"text":"일곱 번째 문장에서 to form은 결과를 나타내는 부사적 to부정사예요. 물 분자가 서로 결합해서 그 결과 결정 구조를 형성한다는 뜻을 이어 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 When temperatures near 0°C, water molecules start bonding with one another \u003cspan class=\"fx\">to form a crystal structure.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>온도가 섭씨 영 도에 가까워지면 물 분자들이 서로 결합해서 결정 구조를 만든다는 뜻입니다. 물이 얼음 결정을 이루는 과학적 과정을 설명합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">start bonding with one another to form\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">begin to bond with each other, forming\u003c/span>\u003cdiv class=\"w\">결과의 to부정사를 분사구 forming으로 바꿔 자연스럽게 연결했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">near 0°C\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">approach zero degrees Celsius\u003c/span>\u003cdiv class=\"w\">near를 approach로 풀고 온도 표현을 말로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">bond with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">combine with\u003c/span>\u003cspan class=\"y-eq\">bond with = combine with\u003c/span>\u003cdiv class=\"w\">결합하다는 뜻을 combine으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">one another\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">each other\u003c/span>\u003cspan class=\"y-eq\">one another = each other\u003c/span>\u003cdiv class=\"w\">서로라는 뜻의 대표 동의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">form\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">create\u003c/span>\u003cspan class=\"y-eq\">form = create\u003c/span>\u003cdiv class=\"w\">형성하다는 뜻을 create로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">When temperatures approach zero degrees Celsius, water molecules begin to combine with each other, forming a crystal structure.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"온도가 섭씨 영 도에 가까워지면 물 분자가 서로 붙어서 결정 구조를 만든다는 뜻이에요. 물이 얼음 결정이 되는 과정을 설명하는 문장입니다.","hl":"mn"},{"n":42,"text":"to form은 forming으로 바꿔 결과를 분사구로 표현할 수 있어요. near zero degrees Celsius는 approach zero degrees Celsius처럼 동사로 풀어 쓸 수 있습니다.","hl":"rw"},{"n":43,"text":"bond with는 combine with, one another는 each other, form은 create로 바꿀 수 있어요. 과학 지문에서 자주 나오는 표현들이니 익혀 두세요.","hl":"ph"},{"n":44,"text":"같은 뜻의 문장을 읽어 볼게요. When temperatures approach zero degrees Celsius, water molecules begin to combine with each other, forming a crystal structure. 결합해서 결정 구조를 만든다는 의미가 유지됩니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 We would be honored \u003cspan class=\"fx\">to have you as a guest at the annual festival.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We \u003c/div>\u003cdiv class=\"k\">우리는 \u003c/div>\u003cdiv class=\"e\">would be honored \u003c/div>\u003cdiv class=\"k\">영광일 것입니다 \u003c/div>\u003cdiv class=\"e\">to have you as a guest \u003c/div>\u003cdiv class=\"k\">당신을 손님으로 모신다면 \u003c/div>\u003cdiv class=\"e\">at the annual festival.\u003c/div>\u003cdiv class=\"k\">해마다 열리는 축제에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>to have 이하는 '~한다면'이라는 \u003cb class=\"key\">조건\u003c/b>을 나타내는 부사적 to부정사로, would와 함께 쓰여 가정적 조건을 만듭니다. (= If we had you as a guest ~, we would be honored)\u003c/div>","segs":[{"n":45,"text":"We, 우리는. would be honored, 영광일 것입니다. to have you as a guest, 당신을 손님으로 모신다면. at the annual festival, 해마다 열리는 축제에","hl":"ch"},{"n":46,"text":"여덟 번째 문장에서 to have는 조건을 나타내는 부사적 to부정사예요. would be honored와 함께 쓰여 만약 당신을 손님으로 모신다면이라는 가정의 뜻을 만듭니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 We would be honored \u003cspan class=\"fx\">to have you as a guest at the annual festival.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리가 해마다 열리는 축제에 당신을 손님으로 모실 수 있다면 영광일 것이라는 뜻입니다. 정중한 초대 표현으로, 상대를 귀하게 대접하는 느낌을 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">We would be honored to have you as a guest\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">We would be delighted if you could join us as a guest\u003c/span>\u003cdiv class=\"w\">honored를 delighted로 풀고 조건의 to부정사를 if절로 바꿔 정중한 초대의 뜻을 살렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at the annual festival\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at the festival held every year\u003c/span>\u003cdiv class=\"w\">annual을 every year로 풀어 쉬운 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be honored\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be privileged\u003c/span>\u003cspan class=\"y-eq\">be honored = be privileged\u003c/span>\u003cdiv class=\"w\">영광으로 느끼다는 뜻을 격식 있는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">annual\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">yearly\u003c/span>\u003cspan class=\"y-eq\">annual = yearly\u003c/span>\u003cdiv class=\"w\">해마다의라는 뜻의 동의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have you as a guest\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">welcome you as a guest\u003c/span>\u003cspan class=\"y-eq\">have = welcome\u003c/span>\u003cdiv class=\"w\">손님으로 모시다는 뜻을 welcome으로 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We would be delighted if you could join us as a guest at the festival held every year.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"해마다 열리는 축제에 당신을 손님으로 모실 수 있다면 영광이겠다는 정중한 초대의 말이에요. 상대를 아주 귀하게 대접하는 느낌을 줍니다.","hl":"mn"},{"n":48,"text":"We would be honored to have you as a guest는 We would be delighted if you could join us as a guest로 바꿀 수 있어요. annual은 every year로 풀어 쓸 수 있습니다.","hl":"rw"},{"n":49,"text":"be honored는 be privileged, annual은 yearly, have you as a guest는 welcome you as a guest로 바꿀 수 있어요. 초대 표현에서 자주 쓰이는 어구입니다.","hl":"ph"},{"n":50,"text":"바꾼 문장을 읽어 볼게요. We would be delighted if you could join us as a guest at the festival held every year. 정중하게 초대하는 뜻이 잘 살아 있습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 If you are fortunate \u003cspan class=\"fx\">to have opportunity\u003c/span>, it is your duty to make sure other people have those opportunities as well.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If you are fortunate \u003c/div>\u003cdiv class=\"k\">만약 당신이 운이 좋다면 \u003c/div>\u003cdiv class=\"e\">to have opportunity, \u003c/div>\u003cdiv class=\"k\">기회를 가질 때 \u003c/div>\u003cdiv class=\"e\">it is your duty \u003c/div>\u003cdiv class=\"k\">그것은 당신의 의무이다 \u003c/div>\u003cdiv class=\"e\">to make sure \u003c/div>\u003cdiv class=\"k\">반드시 ~하도록 하는 것은 \u003c/div>\u003cdiv class=\"e\">other people have those opportunities \u003c/div>\u003cdiv class=\"k\">다른 사람들도 그러한 기회를 갖도록 \u003c/div>\u003cdiv class=\"e\">as well.\u003c/div>\u003cdiv class=\"k\">또한\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">to have opportunity\u003c/b>는 '~하는 데'라는 의미로 형용사 fortunate를 수식하는 to부정사입니다. 한편 it은 \u003cb class=\"key\">가주어\u003c/b>이고 to make sure 이하는 \u003cb class=\"key\">진주어\u003c/b>로, make sure 뒤에는 접속사 that이 생략되어 있습니다.\u003c/div>","segs":[{"n":51,"text":"If you are fortunate, 만약 당신이 운이 좋다면. to have opportunity, 기회를 가질 때. it is your duty, 그것은 당신의 의무이다. to make sure, 반드시 ~하도록 하는 것은. other people have those opportunities, 다른 사람들도 그러한 기회를 갖도록. as well, 또한","hl":"ch"},{"n":52,"text":"아홉 번째 문장에서는 to have opportunity가 fortunate를 꾸며요. 기회를 가질 만큼 운이 좋다는 뜻으로 해석하면 됩니다. 또 it은 가주어이고 to make sure 이하는 진주어라는 점도 꼭 기억해 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 If you are fortunate \u003cspan class=\"fx\">to have opportunity\u003c/span>, it is your duty to make sure other people have those opportunities as well.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>기회를 가질 만큼 운이 좋다면, 다른 사람도 그런 기회를 갖도록 도와야 한다는 뜻입니다. 특권을 혼자 누리지 말고 나눠야 한다는 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">If you are fortunate to have opportunity\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If you are lucky enough to have opportunities\u003c/span>\u003cdiv class=\"w\">fortunate를 lucky enough로 풀고 opportunity를 복수로 바꿔 자연스럽게 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">it is your duty to make sure other people have those opportunities as well\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">you have a duty to ensure that others have the same opportunities\u003c/span>\u003cdiv class=\"w\">가주어 it 구문을 주어 you로 바꾸고 make sure를 ensure that으로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fortunate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lucky\u003c/span>\u003cspan class=\"y-eq\">fortunate = lucky\u003c/span>\u003cdiv class=\"w\">운이 좋은이라는 뜻의 쉬운 동의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make sure\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ensure\u003c/span>\u003cspan class=\"y-eq\">make sure = ensure\u003c/span>\u003cdiv class=\"w\">확실히 하다·반드시 ~하도록 하다는 뜻입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as well\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">too\u003c/span>\u003cspan class=\"y-eq\">as well = too\u003c/span>\u003cdiv class=\"w\">또한이라는 뜻의 동의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If you are lucky enough to have opportunities, you have a duty to ensure that others have the same opportunities too.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"기회를 가질 만큼 운이 좋다면 다른 사람도 그런 기회를 가질 수 있도록 도와야 한다는 뜻이에요. 혼자만 누리지 말고 나누라는 메시지입니다.","hl":"mn"},{"n":54,"text":"to have opportunity는 lucky enough to have opportunities로 풀어 쓸 수 있어요. it is your duty to make sure는 you have a duty to ensure that으로 바꾸면 주어가 분명해집니다.","hl":"rw"},{"n":55,"text":"fortunate는 lucky, make sure는 ensure, as well은 too로 바꿀 수 있어요. make sure 뒤에는 that절이 올 수 있다는 점도 함께 기억해 주세요.","hl":"ph"},{"n":56,"text":"바꾼 문장을 읽어 볼게요. If you are lucky enough to have opportunities, you have a duty to ensure that others have the same opportunities too. 기회를 나누어야 한다는 뜻이 잘 드러납니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 We can't help but think James must have his head in the clouds \u003cspan class=\"fx\">to talk like that.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We can't help but think \u003c/div>\u003cdiv class=\"k\">우리는 생각하지 않을 수 없다 \u003c/div>\u003cdiv class=\"e\">James must have his head in the clouds \u003c/div>\u003cdiv class=\"k\">James가 엉뚱한 공상에 잠긴 것이 틀림없다고 \u003c/div>\u003cdiv class=\"e\">to talk like that.\u003c/div>\u003cdiv class=\"k\">그렇게 말하다니\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>to talk 이하는 '~하다니'라는 \u003cb class=\"key\">판단의 근거\u003c/b>를 나타내는 부사적 to부정사입니다. think 다음에는 목적어 명사절을 이끄는 접속사 that이 생략되어 있습니다.\u003c/div>","segs":[{"n":57,"text":"We can't help but think, 우리는 생각하지 않을 수 없다. James must have his head in the clouds, James가 엉뚱한 공상에 잠긴 것이 틀림없다고. to talk like that, 그렇게 말하다니","hl":"ch"},{"n":58,"text":"열 번째 문장에서 to talk는 판단의 근거를 나타내는 부사적 to부정사예요. 그렇게 말하다니 James가 공상에 잠겼다고 판단하는 근거를 제시합니다. think 뒤에는 that이 생략되어 있다고 이해하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 We can't help but think James must have his head in the clouds \u003cspan class=\"fx\">to talk like that.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>James가 그렇게 말하는 것을 보니 머릿속이 공상으로 가득한 것이 틀림없다고 생각하지 않을 수 없다는 뜻입니다. 즉 그의 말이 현실과 동떨어져 보인다는 비유적 판단입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">We can't help but think\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">We cannot help thinking\u003c/span>\u003cdiv class=\"w\">can't help but think를 cannot help thinking으로 바꾼 같은 뜻의 구문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">must have his head in the clouds\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">must be daydreaming\u003c/span>\u003cdiv class=\"w\">관용 표현 have one's head in the clouds를 daydreaming으로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">can't help but think\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cannot help thinking\u003c/span>\u003cspan class=\"y-eq\">can't help but + 동사원형 = cannot help -ing\u003c/span>\u003cdiv class=\"w\">~하지 않을 수 없다는 같은 뜻의 구문 전환입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have one's head in the clouds\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be daydreaming\u003c/span>\u003cspan class=\"y-eq\">have one's head in the clouds = daydream\u003c/span>\u003cdiv class=\"w\">공상에 잠기다라는 관용 표현을 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to talk like that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to say something like that\u003c/span>\u003cspan class=\"y-eq\">talk like that = say something like that\u003c/span>\u003cdiv class=\"w\">그렇게 말하다라는 뜻을 풀어 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We cannot help thinking that James must be daydreaming to say something like that.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"James가 그렇게 말하는 걸 보니 머릿속이 공상으로 가득한 게 틀림없다고 생각하지 않을 수 없다는 뜻이에요. 현실과 동떨어진 말을 한다는 비유적인 판단입니다.","hl":"mn"},{"n":60,"text":"cannot help but think는 cannot help thinking으로 바꿔도 같은 뜻이에요. have his head in the clouds는 be daydreaming으로 풀어 쓸 수 있습니다.","hl":"rw"},{"n":61,"text":"cannot help but 다음에는 동사원형이 오고, cannot help 뒤에는 동명사가 와요. have one's head in the clouds는 공상에 잠기다라는 관용 표현입니다.","hl":"ph"},{"n":62,"text":"바꾼 문장을 읽어 볼게요. We cannot help thinking that James must be daydreaming to say something like that. 그렇게 말하다니 공상에 잠겼다는 뜻이 잘 살아 있습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 Have you ever found yourself speaking to someone at length \u003cspan class=\"fx\">only to realize they haven't heard a single thing you've said?\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Have you ever found yourself \u003c/div>\u003cdiv class=\"k\">당신은 발견한 적이 있는가 자신이 \u003c/div>\u003cdiv class=\"e\">speaking to someone at length \u003c/div>\u003cdiv class=\"k\">어떤 사람에게 상세히 말하고 있는 것을 \u003c/div>\u003cdiv class=\"e\">only to realize \u003c/div>\u003cdiv class=\"k\">그러나 결국 깨닫게 된 \u003c/div>\u003cdiv class=\"e\">they haven't heard a single thing \u003c/div>\u003cdiv class=\"k\">그들이 하나도 듣지 않았다는 것을 \u003c/div>\u003cdiv class=\"e\">you've said?\u003c/div>\u003cdiv class=\"k\">당신이 말했던\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>only to realize 이하는 '(~했으나) 결국 ~하게 되다'라는 \u003cb class=\"key\">결과\u003c/b>를 나타내는 부사적 to부정사입니다. realize 뒤에는 접속사 that이, a single thing 뒤에는 목적격 관계대명사 which 또는 that이 생략되어 있습니다.\u003c/div>","segs":[{"n":63,"text":"Have you ever found yourself, 당신은 발견한 적이 있는가 자신이. speaking to someone at length, 어떤 사람에게 상세히 말하고 있는 것을. only to realize, 그러나 결국 깨닫게 된. they haven't heard a single thing, 그들이 하나도 듣지 않았다는 것을. you've said?, 당신이 말했던","hl":"ch"},{"n":64,"text":"열한 번째 문장에서는 only to realize가 결과를 나타내요. 오랫동안 말했지만 결국 깨닫게 되었다는 예상 밖의 결과를 강조합니다. realize 뒤에는 that이, a single thing 뒤에는 관계대명사가 생략되어 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 Have you ever found yourself speaking to someone at length \u003cspan class=\"fx\">only to realize they haven't heard a single thing you've said?\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>누군가에게 오랫동안 열심히 말했는데, 상대가 내 말을 한 마디도 듣지 못했다는 사실을 뒤늦게 깨닫는 상황입니다. 허무하고 당황스러운 느낌을 담고 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">only to realize\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">but then realized\u003c/span>\u003cdiv class=\"w\">only to-v를 but then + 과거형으로 풀어 예상 밖의 결과를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at length\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">for a long time\u003c/span>\u003cdiv class=\"w\">상세히·오랫동안이라는 뜻을 쉬운 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at length\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">for a long time\u003c/span>\u003cspan class=\"y-eq\">at length = for a long time\u003c/span>\u003cdiv class=\"w\">문맥상 오랫동안·상세히라는 뜻을 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a single thing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">anything at all\u003c/span>\u003cspan class=\"y-eq\">a single thing = anything at all\u003c/span>\u003cdiv class=\"w\">하나도·전혀라는 부정 강조를 살렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">only to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">but then\u003c/span>\u003cspan class=\"y-eq\">only to-v = but then\u003c/span>\u003cdiv class=\"w\">예상 밖의 결과를 나타내는 전환 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Have you ever found yourself talking to someone for a long time, only to realize that they haven't heard anything you said?\u003c/div>\u003c/div>","segs":[{"n":65,"text":"누군가에게 한참 열심히 말했는데 상대가 내 말을 하나도 듣지 못했다는 걸 뒤늦게 깨닫는 상황이에요. 허무하고 당황스러운 느낌이 담겨 있습니다.","hl":"mn"},{"n":66,"text":"only to realize는 but then realized로 풀어 쓸 수 있어요. at length는 for a long time으로 바꾸면 뜻이 더 쉽게 드러납니다.","hl":"rw"},{"n":67,"text":"only to는 예상 밖의 결과를 나타내고, at length는 for a long time, a single thing은 anything at all로 바꿀 수 있어요. 부정 강조 표현에 주의해 주세요.","hl":"ph"},{"n":68,"text":"바꾼 문장을 읽어 볼게요. Have you ever found yourself talking to someone for a long time, only to realize that they have not heard anything you said? 오랫동안 말했지만 결국 못 들었다는 상황이 잘 드러납니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 A child who has been repeatedly criticized for poor performance on math may learn to dodge difficult math problems \u003cspan class=\"fx\">in order to avoid further punishment.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A child \u003c/div>\u003cdiv class=\"k\">아이는 \u003c/div>\u003cdiv class=\"e\">who has been repeatedly criticized \u003c/div>\u003cdiv class=\"k\">반복해서 비판을 받아온 \u003c/div>\u003cdiv class=\"e\">for poor performance on math \u003c/div>\u003cdiv class=\"k\">수학에서의 부족한 성과로 인해 \u003c/div>\u003cdiv class=\"e\">may learn to dodge difficult math problems \u003c/div>\u003cdiv class=\"k\">어려운 수학 문제를 피하는 것을 배울지도 모른다 \u003c/div>\u003cdiv class=\"e\">in order to avoid further punishment.\u003c/div>\u003cdiv class=\"k\">더 심한 처벌을 피하기 위해서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>in order to avoid 이하는 \u003cb class=\"key\">목적\u003c/b>을 나타내는 부사적 to부정사로, 목적을 분명히 하기 위해 \u003cb class=\"key\">in order to-v\u003c/b> 형태로 쓰였습니다. A child는 who has been repeatedly criticized ~ math라는 관계절의 수식을 받습니다.\u003c/div>","segs":[{"n":69,"text":"A child, 아이는. who has been repeatedly criticized, 반복해서 비판을 받아온. for poor performance on math, 수학에서의 부족한 성과로 인해. may learn to dodge difficult math problems, 어려운 수학 문제를 피하는 것을 배울지도 모른다. in order to avoid further punishment, 더 심한 처벌을 피하기 위해서","hl":"ch"},{"n":70,"text":"열두 번째 문장에서는 in order to avoid가 목적을 나타내요. 더 심한 처벌을 피하기 위해서라는 목적을 분명히 하기 위해 in order to를 썼습니다. A child는 who절의 수식을 받는다는 점도 함께 봐 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 A child who has been repeatedly criticized for poor performance on math may learn to dodge difficult math problems \u003cspan class=\"fx\">in order to avoid further punishment.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>수학 성적이 나쁘다고 반복해서 비판받은 아이는 더 이상의 처벌을 피하려고 어려운 수학 문제를 회피하는 법을 배울 수 있다는 뜻입니다. 비판이 아이의 회피 행동을 만들 수 있다는 점을 보여 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in order to avoid further punishment\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so as to avoid more punishment\u003c/span>\u003cdiv class=\"w\">in order to를 so as to로 바꾸고 further를 more로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">may learn to dodge\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">might learn to avoid\u003c/span>\u003cdiv class=\"w\">may를 might로, dodge를 avoid로 바꿔 가능성과 회피의 뜻을 자연스럽게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">criticize\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">blame\u003c/span>\u003cspan class=\"y-eq\">criticize = blame\u003c/span>\u003cdiv class=\"w\">비판하다·비난하다는 뜻의 유사어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dodge\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">avoid\u003c/span>\u003cspan class=\"y-eq\">dodge = avoid\u003c/span>\u003cdiv class=\"w\">피하다·회피하다는 뜻을 쉬운 동의어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">further punishment\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">more punishment\u003c/span>\u003cspan class=\"y-eq\">further = more\u003c/span>\u003cdiv class=\"w\">추가의·더 심한이라는 뜻을 more로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A child who has been repeatedly blamed for poor performance in math may learn to avoid difficult math problems so as to escape more punishment.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"수학 성적이 좋지 않다고 반복해서 비판받은 아이는 더 심한 처벌을 피하려고 어려운 문제를 피하는 법을 배울 수 있다는 뜻이에요. 비판이 회피 행동을 만들 수 있다는 점을 보여 줍니다.","hl":"mn"},{"n":72,"text":"in order to avoid further punishment는 so as to avoid more punishment로 바꿀 수 있어요. may learn to dodge는 might learn to avoid로 바꾸면 뜻이 더 쉽게 느껴집니다.","hl":"rw"},{"n":73,"text":"criticize는 blame, dodge는 avoid, further는 more로 바꿀 수 있어요. in order to는 목적을 분명히 하는 표현으로 기억해 주세요.","hl":"ph"},{"n":74,"text":"바꾼 문장을 읽어 볼게요. A child who has been repeatedly blamed for poor performance in math may learn to avoid difficult math problems so as to escape more punishment. 비판과 회피, 처벌의 관계가 그대로 드러납니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 30 부사 역할을 하는 to-v의 의미\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>부사 역할을 하는 \u003cb class=\"key\">to-v\u003c/b>는 목적, 결과, 감정의 원인, 조건, 판단의 근거를 나타낸다.\u003c/li>\u003cli>목적은 \u003cb class=\"key\">to-v\u003c/b>, \u003cb class=\"key\">so as to-v\u003c/b>, \u003cb class=\"key\">in order to-v\u003c/b>, 결과는 \u003cb class=\"key\">only to-v\u003c/b>로 자주 표현한다.\u003c/li>\u003cli>감정 형용사 뒤의 to-v는 \u003cb class=\"key\">감정의 원인\u003c/b>, would와 함께 쓰이면 \u003cb class=\"key\">조건\u003c/b>을 나타낼 수 있다.\u003c/li>\u003cli>문맥을 먼저 보고 '~하기 위해서', '~해서 결국', '~하게 되어', '~한다면', '~하다니' 중 알맞은 해석을 고른다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 부사 역할을 하는 to부정사의 여러 의미를 살펴봤어요. 목적, 결과, 감정의 원인, 조건, 판단의 근거까지 문맥에 따라 해석이 달라진다는 점이 핵심입니다. so as to, in order to, only to 같은 확장 표현도 함께 기억해 두세요. 다음 시간에도 문장의 뼈대를 먼저 잡고 to부정사의 의미를 문맥으로 판단해 봅시다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
