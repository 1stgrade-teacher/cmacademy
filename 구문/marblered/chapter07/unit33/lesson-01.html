    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

lecturePlayer(document.getElementById("app"),{"brand":"unit33","title":"분사구문의 다양한 형태 1","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>분사구문의 다양한 형태 1\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>분사구문이 완료, 수동, 부정, 접속사 결합, 의미상 주어 등 다양한 형태로 쓰이는 원리를 익힌다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마법같은 블록구문 실전편에서 분사구문의 다양한 형태를 공부해요. 분사구문이 완료, 수동, 부정, 접속사 결합, 독립 주어와 만나면 어떻게 달라지는지 차근차근 살펴볼 거예요. 문장을 끊어 읽으면서 의미가 살아나는 구조를 함께 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">분사구문은 접속사와 주어를 줄이면서 \u003cb class=\"key\">원인\u003c/b>, \u003cb class=\"key\">양보\u003c/b>, \u003cb class=\"key\">조건\u003c/b>, \u003cb class=\"key\">동시 상황\u003c/b>을 나타낸다. 의미가 분명해야 할 때는 \u003cb class=\"key\">접속사\u003c/b>나 \u003cb class=\"key\">의미상 주어\u003c/b>를 남기고, 완료나 수동은 \u003cb class=\"key\">having been\u003c/b>으로 표현한다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">Not having been to the city before\u003c/span>, I needed some tourist pamphlets.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 Can we sustain our standard of living in the same ecological space \u003cspan class=\"fx\">while consuming the resources of that space\u003c/span>?\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 The fundamental problem most patients face is an inability to love themselves, \u003cspan class=\"fx\">having been unloved by others during some crucial part of their lives\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 I sat quietly in a chair, \u003cspan class=\"fx\">my only actions consisting of taking notes and stuffing my ears with wadded toilet paper\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">Though seriously injured\u003c/span>, the pilot crawled out of the wreckage and was flown by helicopter to a nearby medical center.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">Turned down for countless jobs\u003c/span>, Jenny didn't give up hope and is now a successful architect.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 In recent history, countries with the highest net inward migration have also had the highest growth rates, \u003cspan class=\"fx\">the two factors clearly being linked in harmony\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">When faced with a bunch of watermelons, all promising delicious juiciness inside\u003c/span>, how do you know which one to pick?\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 The time spent in lamenting their lot, \u003cspan class=\"fx\">if applied to honest endeavor\u003c/span>, would yield splendid results and give them proper places in the world.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 The making of a contract requires the mutual agreement of two or more persons or parties, \u003cspan class=\"fx\">one of them ordinarily making an offer and another accepting\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">There being a dispute over a topic of environment\u003c/span>, the country is to make an  effective law for its sustainable development.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">When expelled from the nucleus of an atom\u003c/span>, a neutron is unstable and decayed to form a proton and an electron.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘은 분사구문이 여러 모습으로 변하는 경우를 배워요. 분사구문은 접속사와 주어를 줄이면서 원인이나 양보, 조건, 동시 상황을 나타내죠. 의미를 분명히 해야 할 때는 접속사나 의미상 주어를 남겨요. 완료나 수동의 느낌은 having been으로 표현한다는 점도 꼭 기억해 주세요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">Not having been to the city before\u003c/span>, I needed some tourist pamphlets.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Not having been to the city before, \u003c/div>\u003cdiv class=\"k\">전에 그 도시에 가본 적이 없었기 때문에 \u003c/div>\u003cdiv class=\"e\">I needed \u003c/div>\u003cdiv class=\"k\">나는 필요했다 \u003c/div>\u003cdiv class=\"e\">some tourist pamphlets.\u003c/div>\u003cdiv class=\"k\">몇 개의 여행자용 팜플렛이\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 I가 도시에 가본 적이 없는 일이 팜플렛이 필요했던 때보다 이전이므로 \u003cb class=\"key\">완료분사구문\u003c/b> having been이 쓰였다. 분사구문의 부정은 \u003cb class=\"key\">not\u003c/b>을 분사 앞에 두어 나타낸다.\u003c/div>","segs":[{"n":3,"text":"Not having been to the city before, 전에 그 도시에 가본 적이 없었기 때문에. I needed, 나는 필요했다. some tourist pamphlets, 몇 개의 여행자용 팜플렛이","hl":"ch"},{"n":4,"text":"여기서 Not having been은 완료 분사구문이에요. 주어 I가 도시에 가본 적이 없는 일이 팜플렛이 필요했던 때보다 먼저라서 having been을 쓴 거죠. 분사구문의 부정은 not을 분사 앞에 두면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">Not having been to the city before\u003c/span>, I needed some tourist pamphlets.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>전에 그 도시에 가본 적이 없어서 여행 안내 책자가 필요했다는 뜻이다. 경험이 없으니 정보가 필요했던 자연스러운 상황을 보여 준다. because I had not been to the city before처럼 이유를 살려 이해하면 쉽다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Not having been to the city before\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Because I had not been to the city before\u003c/span>\u003cdiv class=\"w\">완료 분사구문을 이유를 나타내는 절로 풀어 의미를 선명하게 한 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">tourist pamphlets\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">tourist brochures\u003c/span>\u003cspan class=\"y-eq\">pamphlet = brochure\u003c/span>\u003cdiv class=\"w\">pamphlet을 안내 책자라는 뜻의 brochure로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">needed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">required\u003c/span>\u003cspan class=\"y-eq\">need = require\u003c/span>\u003cdiv class=\"w\">필요로 했다는 뜻을 조금 더 격식 있는 require로 바꾸었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Because I had never visited the city before, I needed a few tourist brochures.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 말은 전에 그 도시에 가본 적이 없어서 여행 안내 책자가 필요했다는 뜻이에요. 경험이 없으니까 정보가 필요했던 자연스러운 상황을 보여 주죠. 그래서 because I had not been to the city before처럼 이유를 살려 이해하면 쉬워요.","hl":"mn"},{"n":6,"text":"표현을 바꿔 쓸 때는 Not having been to를 Because I had not been to로 풀 수 있어요. 그러면 이유를 나타내는 절이 되어 의미가 아주 선명해지죠. 시험에서는 완료 분사구문을 절로 바꾸는 문제가 자주 나와요.","hl":"rw"},{"n":7,"text":"pamphlet은 소책자나 안내 책자라는 뜻이에요. tourist pamphlets는 tourist brochures로 바꿔 쓸 수 있죠. needed는 required로 바꾸면 조금 더 격식 있는 느낌이에요.","hl":"ph"},{"n":8,"text":"뜻을 그대로 살려 바꾸면 Because I had never visited the city before, I needed a few tourist brochures.라고 할 수 있어요. 완료 분사구문을 이유 절로 풀고 pamphlet을 brochures로 바꾼 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 Can we sustain our standard of living in the same ecological space \u003cspan class=\"fx\">while consuming the resources of that space\u003c/span>?\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Can we sustain \u003c/div>\u003cdiv class=\"k\">우리는 유지할 수 있을까 \u003c/div>\u003cdiv class=\"e\">our standard of living \u003c/div>\u003cdiv class=\"k\">우리의 생활 수준을 \u003c/div>\u003cdiv class=\"e\">in the same ecological space \u003c/div>\u003cdiv class=\"k\">동일한 생태적 공간에서 \u003c/div>\u003cdiv class=\"e\">while consuming the resources of that space?\u003c/div>\u003cdiv class=\"k\">그 공간의 자원을 소비하면서?\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>분사구문의 의미를 분명히 하기 위해 consuming 앞에 접속사 \u003cb class=\"key\">while\u003c/b>이 쓰였다. 원래는 while we are consuming the resources of that space로 풀어 쓸 수 있다.\u003c/div>","segs":[{"n":9,"text":"Can we sustain, 우리는 유지할 수 있을까. our standard of living, 우리의 생활 수준을. in the same ecological space, 동일한 생태적 공간에서. while consuming the resources of that space?, 그 공간의 자원을 소비하면서?","hl":"ch"},{"n":10,"text":"while consuming은 접속사 while이 붙은 분사구문이에요. 의미를 분명하게 하려고 while을 남겨 둔 형태죠. 원래는 while we are consuming으로 풀어 쓸 수 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 Can we sustain our standard of living in the same ecological space \u003cspan class=\"fx\">while consuming the resources of that space\u003c/span>?\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>같은 생태 공간에서 그 공간의 자원을 쓰면서 생활 수준을 계속 유지할 수 있느냐고 묻는 문장이다. 편리함과 환경 부담을 동시에 생각해 보자는 뉘앙스가 있다. while 이하를 절로 풀면 의미가 더 또렷해진다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">while consuming the resources of that space\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">while we consume the resources of that space\u003c/span>\u003cdiv class=\"w\">생략된 주어와 시제를 살려 동시 상황을 분명히 한 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sustain\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">maintain\u003c/span>\u003cspan class=\"y-eq\">sustain = maintain\u003c/span>\u003cdiv class=\"w\">유지하다는 뜻을 maintain으로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">standard of living\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">living standard\u003c/span>\u003cspan class=\"y-eq\">standard of living = living standard\u003c/span>\u003cdiv class=\"w\">생활 수준이라는 같은 뜻의 어순을 바꾼 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">consume\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">use up\u003c/span>\u003cspan class=\"y-eq\">consume = use up\u003c/span>\u003cdiv class=\"w\">자원을 소비한다는 뜻을 use up으로 쉽게 풀었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Can we maintain our living standard within the same ecological space while using that space's resources?\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 같은 생태 공간에서 그 공간의 자원을 쓰면서 생활 수준을 계속 유지할 수 있느냐고 묻고 있어요. 편리함과 환경 부담을 동시에 생각해 보자는 뉘앙스죠. while 이하를 절로 풀면 의미가 더 또렷해져요.","hl":"mn"},{"n":12,"text":"while consuming은 while we consume으로 바꿔 쓸 수 있어요. 분사구문에 주어와 시제를 다시 넣어 준 것이죠. 이렇게 하면 누가 소비하는지와 언제인지가 분명해져요.","hl":"rw"},{"n":13,"text":"sustain은 maintain으로 바꿔 쓸 수 있어요. standard of living은 living standard라고도 해요. consume은 use up이나 use로 바꿔 표현할 수 있습니다.","hl":"ph"},{"n":14,"text":"패러프레이징하면 Can we maintain our living standard within the same ecological space while using that space's resources?가 돼요. sustain과 consume을 각각 maintain과 use로 바꿔도 핵심 뜻은 그대로예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 The fundamental problem most patients face is an inability to love themselves, \u003cspan class=\"fx\">having been unloved by others during some crucial part of their lives\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The fundamental problem \u003c/div>\u003cdiv class=\"k\">근본적인 문제는 \u003c/div>\u003cdiv class=\"e\">most patients face \u003c/div>\u003cdiv class=\"k\">대부분의 환자들이 직면하는 \u003c/div>\u003cdiv class=\"e\">is an inability to love themselves, \u003c/div>\u003cdiv class=\"k\">자신을 사랑하지 못하는 것이다 \u003c/div>\u003cdiv class=\"e\">having been unloved by others \u003c/div>\u003cdiv class=\"k\">다른 사람들에 의해 사랑받지 못했기 때문에 \u003c/div>\u003cdiv class=\"e\">during some crucial part of their lives.\u003c/div>\u003cdiv class=\"k\">그들의 삶의 어떤 결정적인 기간 동안에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>문장의 동사 is가 현재를 나타내지만 사랑받지 못한 일은 그 이전의 일이고 수동 관계이므로 \u003cb class=\"key\">완료 수동 분사구문\u003c/b> having been unloved가 쓰였다. 문장 주어와 분사구문의 주어가 달라도 흐름이 자연스러우면 주어를 따로 쓰지 않으며 이런 문장을 \u003cb class=\"key\">현수분사구문\u003c/b>이라고 한다.\u003c/div>","segs":[{"n":15,"text":"The fundamental problem, 근본적인 문제는. most patients face, 대부분의 환자들이 직면하는. is an inability to love themselves, 자신을 사랑하지 못하는 것이다. having been unloved by others, 다른 사람들에 의해 사랑받지 못했기 때문에. during some crucial part of their lives, 그들의 삶의 어떤 결정적인 기간 동안에","hl":"ch"},{"n":16,"text":"having been unloved는 완료 수동 분사구문이에요. 환자들이 사랑받지 못한 일이 현재의 문제보다 이전이고 수동 관계라서 having been이 쓰였죠. 또 문장 주어와 분사구문 주어가 달라도 흐름이 자연스러우면 주어를 따로 쓰지 않는데 이것을 현수분사구문이라고 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 The fundamental problem most patients face is an inability to love themselves, \u003cspan class=\"fx\">having been unloved by others during some crucial part of their lives\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>대부분의 환자가 겪는 근본 문제는 자신을 사랑하지 못한다는 것이다. 그 이유로 삶의 중요한 시기에 다른 사람에게 사랑받지 못한 경험을 들고 있다. 상처의 원인과 현재의 어려움을 함께 설명하는 문장이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">having been unloved by others\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">because they had been unloved by others\u003c/span>\u003cdiv class=\"w\">완료 수동 분사구문을 이유를 나타내는 절로 풀어 원인을 분명히 한 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fundamental\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">basic\u003c/span>\u003cspan class=\"y-eq\">fundamental = basic\u003c/span>\u003cdiv class=\"w\">근본적인이라는 뜻을 basic으로 쉽게 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">crucial\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">critical\u003c/span>\u003cspan class=\"y-eq\">crucial = critical\u003c/span>\u003cdiv class=\"w\">결정적인이라는 뜻을 critical로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">inability to love themselves\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">being unable to love themselves\u003c/span>\u003cspan class=\"y-eq\">inability = being unable\u003c/span>\u003cdiv class=\"w\">명사구를 be unable to 구문으로 풀어 썼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The basic problem that most patients face is that they cannot love themselves, because they were unloved by others during an important period of their lives.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"대부분의 환자가 겪는 근본 문제는 자신을 사랑하지 못한다는 것이에요. 그 이유로 삶의 중요한 시기에 다른 사람에게 사랑받지 못한 경험을 들고 있죠. 그래서 이 문장은 상처의 원인과 현재의 어려움을 함께 설명해요.","hl":"mn"},{"n":18,"text":"having been unloved는 because they had been unloved로 바꿀 수 있어요. 완료 수동 분사구문을 이유를 나타내는 절로 풀어 준 거죠. 이렇게 쓰면 환자들이 사랑받지 못한 과거 경험이 원인으로 드러나요.","hl":"rw"},{"n":19,"text":"fundamental은 basic으로 바꿀 수 있어요. crucial은 critical이나 very important로 바꿔 쓸 수 있죠. inability to love themselves는 being unable to love themselves로 풀어 쓸 수 있어요.","hl":"ph"},{"n":20,"text":"바꿔 말하면 The basic problem that most patients face is that they cannot love themselves, because they were unloved by others during an important period of their lives.예요. 어려운 단어를 쉽게 풀고 분사구문을 이유 절로 바꿨어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 I sat quietly in a chair, \u003cspan class=\"fx\">my only actions consisting of taking notes and stuffing my ears with wadded toilet paper\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I sat quietly in a chair, \u003c/div>\u003cdiv class=\"k\">나는 의자에 조용히 앉아 있었다 \u003c/div>\u003cdiv class=\"e\">my only actions \u003c/div>\u003cdiv class=\"k\">(그러면서) 나의 유일한 행동은 \u003c/div>\u003cdiv class=\"e\">consisting of taking notes \u003c/div>\u003cdiv class=\"k\">필기하는 것으로 구성되었고 \u003c/div>\u003cdiv class=\"e\">and stuffing my ears with wadded toilet paper.\u003c/div>\u003cdiv class=\"k\">그리고 내 귀를 뭉친 휴지로 채우는 것이었다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>문장의 주어 I와 분사구문의 주어 my only actions가 서로 다르므로 현재분사 \u003cb class=\"key\">consisting\u003c/b> 앞에 분사구문의 \u003cb class=\"key\">의미상 주어\u003c/b>를 쓴 구조이다. 전치사 of의 목적어로 동명사구 taking notes와 stuffing 이하가 and로 병렬 연결되어 있다.\u003c/div>","segs":[{"n":21,"text":"I sat quietly in a chair, 나는 의자에 조용히 앉아 있었다. my only actions, (그러면서) 나의 유일한 행동은. consisting of taking notes, 필기하는 것으로 구성되었고. and stuffing my ears with wadded toilet paper, 그리고 내 귀를 뭉친 휴지로 채우는 것이었다","hl":"ch"},{"n":22,"text":"my only actions consisting은 의미상 주어가 있는 분사구문이에요. 문장 주어 I와 분사구문 주어 my only actions가 다르기 때문에 주어를 남긴 거죠. consisting 뒤에는 taking notes와 stuffing 이하가 of의 목적어로 나란히 연결되어 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 I sat quietly in a chair, \u003cspan class=\"fx\">my only actions consisting of taking notes and stuffing my ears with wadded toilet paper\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>나는 의자에 조용히 앉아 있었고 내가 한 일이라고는 필기하고 귀를 휴지로 막은 것뿐이었다는 뜻이다. 주변 상황에 집중하거나 소음을 막으려는 모습이 그려진다. 다소 익살스러운 분위기도 느낄 수 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">my only actions consisting of taking notes and stuffing my ears with wadded toilet paper\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">and my only actions consisted of taking notes and stuffing my ears with wadded toilet paper\u003c/span>\u003cdiv class=\"w\">의미상 주어가 있는 분사구문을 and로 이어진 독립절로 바꾼 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">consist of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be made up of\u003c/span>\u003cspan class=\"y-eq\">consist of = be made up of\u003c/span>\u003cdiv class=\"w\">구성되다라는 뜻을 be made up of로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stuff A with B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fill A with B\u003c/span>\u003cspan class=\"y-eq\">stuff = fill\u003c/span>\u003cdiv class=\"w\">A를 B로 채우다는 뜻을 fill로 쉽게 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">wadded\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">crumpled\u003c/span>\u003cspan class=\"y-eq\">wadded = crumpled\u003c/span>\u003cdiv class=\"w\">뭉친이라는 뜻을 crumpled로 바꾸었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I sat quietly in a chair, and my only actions were taking notes and filling my ears with crumpled toilet paper.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"나는 의자에 조용히 앉아 있었고 내가 한 일이라고는 필기하고 귀를 휴지로 막은 것뿐이었다는 뜻이에요. 주변 상황에 집중하거나 소음을 막으려는 모습이 그려지죠. 다소 익살스러운 분위기도 느낄 수 있어요.","hl":"mn"},{"n":24,"text":"my only actions consisting은 and my only actions consisted로 바꿔 쓸 수 있어요. 분사구문을 and로 이어진 독립절로 바꾼 것이죠. 그러면 두 문장의 관계가 더 직접적으로 보여요.","hl":"rw"},{"n":25,"text":"consist of는 be made up of로 바꿔 쓸 수 있어요. stuff A with B는 fill A with B로 바꿀 수 있죠. wadded는 crumpled나 pressed into a ball로 표현할 수 있어요.","hl":"ph"},{"n":26,"text":"같은 뜻으로는 I sat quietly in a chair, and my only actions were taking notes and filling my ears with crumpled toilet paper.라고 할 수 있어요. 분사구문을 and로 이어진 절로 바꾸고 wadded를 crumpled로 풀었죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 \u003cspan class=\"fx\">Though seriously injured\u003c/span>, the pilot crawled out of the wreckage and was flown by helicopter to a nearby medical center.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Though seriously injured, \u003c/div>\u003cdiv class=\"k\">비록 심하게 다쳤지만 \u003c/div>\u003cdiv class=\"e\">the pilot crawled out of the wreckage \u003c/div>\u003cdiv class=\"k\">그 조종사는 잔해에서 기어 나왔다 \u003c/div>\u003cdiv class=\"e\">and was flown by helicopter \u003c/div>\u003cdiv class=\"k\">그리고 헬리콥터에 의해 이송되었다 \u003c/div>\u003cdiv class=\"e\">to a >\u003cspan class=\"f\">There being a dispute over a topic of environment\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Because there is a dispute over a topic of environment\u003c/span>\u003cdiv class=\"w\">분사구문을 이유를 나타내는 절로 풀어 배경을 분명히 한 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dispute\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">argument\u003c/span>\u003cspan class=\"y-eq\">dispute = argument\u003c/span>\u003cdiv class=\"w\">논쟁이라는 뜻을 argument로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sustainable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">able to be maintained\u003c/span>\u003cspan class=\"y-eq\">sustainable = able to be maintained\u003c/span>\u003cdiv class=\"w\">지속 가능한이라는 뜻을 풀어 썼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is to make\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is going to make\u003c/span>\u003cspan class=\"y-eq\">be to = be going to\u003c/span>\u003cdiv class=\"w\">예정을 나타내는 be to를 be going to로 바꾸었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Because there is a dispute over an environmental topic, the country is going to make an effective law for its sustainable development.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"환경 문제에 대한 논쟁이 있기 때문에 그 나라가 지속 가능한 발전을 위해 효과적인 법을 만들 예정이라는 뜻이에요. 갈등이 법 제정의 배경이 된다는 흐름이죠. There being이 원인이나 배경을 자연스럽게 이어 줘요.","hl":"mn"},{"n":66,"text":"There being은 Because there is로 바꿀 수 있어요. 분사구문을 이유를 나타내는 절로 풀어 준 거죠. 논쟁이 있다는 배경이 원인으로 분명해져요.","hl":"rw"},{"n":67,"text":"dispute는 argument나 disagreement로 바꿀 수 있어요. sustainable은 able to be maintained로 풀어 쓸 수 있죠. is to make는 is scheduled to make나 is going to make로 바꿀 수 있어요.","hl":"ph"},{"n":68,"text":"바꿔 말하면 Because there is a dispute over an environmental topic, the country is going to make an effective law for its sustainable development.예요. There being을 이유 절로 풀고 예정의 is to를 is going to로 바꿨어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">When expelled from the nucleus of an atom\u003c/span>, a neutron is unstable and decayed to form a proton and an electron.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">When expelled from the nucleus of an atom, \u003c/div>\u003cdiv class=\"k\">원자핵에서 방출되었을 때 \u003c/div>\u003cdiv class=\"e\">a neutron is unstable \u003c/div>\u003cdiv class=\"k\">중성자는 불안정하다 \u003c/div>\u003cdiv class=\"e\">and decayed to form a proton and an electron.\u003c/div>\u003cdiv class=\"k\">그리고 양성자와 전자를 형성하기 위해 붕괴된다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 a neutron이 방출되는 대상이므로 과거분사 \u003cb class=\"key\">expelled\u003c/b>가 와야 한다. 분사구문의 의미를 분명히 하기 위해 과거분사 앞에 접속사 \u003cb class=\"key\">When\u003c/b>이 붙은 것이다.\u003c/div>","segs":[{"n":69,"text":"When expelled from the nucleus of an atom, 원자핵에서 방출되었을 때. a neutron is unstable, 중성자는 불안정하다. and decayed to form a proton and an electron, 그리고 양성자와 전자를 형성하기 위해 붕괴된다","hl":"ch"},{"n":70,"text":"When expelled from은 접속사 when이 붙은 수동 분사구문이에요. 주어 a neutron이 방출되는 대상이라서 과거분사 expelled가 와야 하죠. when을 붙여서 방출되었을 때라는 의미를 분명히 했어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">When expelled from the nucleus of an atom\u003c/span>, a neutron is unstable and decayed to form a proton and an electron.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>중성자는 원자핵에서 방출되면 불안정해지고 붕괴해서 양성자와 전자를 만든다는 과학 설명이다. expelled가 중성자가 방출되는 수동 상황을 보여 준다. when 덕분에 방출되었을 때라는 조건이 분명해진다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">When expelled from the nucleus of an atom\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">When it is expelled from the nucleus of an atom\u003c/span>\u003cdiv class=\"w\">수동 분사구문에 주어와 be동사를 다시 넣어 완전한 절로 바꾼 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">expelled\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ejected\u003c/span>\u003cspan class=\"y-eq\">expel = eject\u003c/span>\u003cdiv class=\"w\">방출되다는 뜻을 ejected로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nucleus\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">core\u003c/span>\u003cspan class=\"y-eq\">nucleus = core\u003c/span>\u003cdiv class=\"w\">핵이라는 뜻을 core로 쉽게 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">decayed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">broke down\u003c/span>\u003cspan class=\"y-eq\">decay = break down\u003c/span>\u003cdiv class=\"w\">붕괴되다는 뜻을 broke down으로 풀어 썼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">When a neutron is expelled from an atomic nucleus, it is unstable and decays to form a proton and an electron.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"중성자는 원자핵에서 방출되면 불안정해지고 붕괴해서 양성자와 전자를 만든다는 과학 설명이에요. expelled가 중성자가 방출되는 수동 상황을 보여 주죠. when 덕분에 방출되었을 때라는 조건이 분명해져요.","hl":"mn"},{"n":72,"text":"When expelled from은 When it is expelled from으로 바꿀 수 있어요. 수동 분사구문에 주어와 be동사를 다시 넣은 형태죠. 중성자가 방출되는 상황이 정확해집니다.","hl":"rw"},{"n":73,"text":"expelled는 ejected나 driven out으로 바꿀 수 있어요. nucleus는 core로 쉽게 바꿀 수 있죠. decayed는 broke down이나 changed into simpler forms로 표현할 수 있어요.","hl":"ph"},{"n":74,"text":"같은 뜻으로는 When a neutron is expelled from an atomic nucleus, it is unstable and decays to form a proton and an electron.예요. 수동 분사구문을 완전한 절로 풀고 decayed를 decays로 자연스럽게 다듬었어요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>분사구문의 부정은 \u003cb class=\"key\">not\u003c/b>이나 never를 분사 앞에 둔다.\u003c/li>\u003cli>완료나 수동의 의미는 \u003cb class=\"key\">having been\u003c/b>으로 나타낼 수 있다.\u003c/li>\u003cli>의미가 분명해야 할 때는 \u003cb class=\"key\">접속사\u003c/b>를 남기고, 주어가 다르면 \u003cb class=\"key\">의미상 주어\u003c/b>를 쓴다.\u003c/li>\u003cli>문장 주어와 분사구문 주어가 달라도 자연스러우면 주어를 생략할 수 있으며 이를 \u003cb class=\"key\">현수분사구문\u003c/b>이라고 한다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 분사구문이 완료, 수동, 부정, 접속사 결합, 의미상 주어와 만나는 다양한 모습을 배웠어요. 분사구문의 부정은 not을 분사 앞에 두고, 완료나 수동은 having been으로 표현한다는 점을 기억해 주세요. 접속사를 남기면 의미가 분명해지고, 주어가 다르면 의미상 주어를 쓸 수 있죠. 오늘 배운 구조를 문장에서 직접 찾아보면서 복습해 보세요. 수고했습니다.","hl":"sum"}]}]});</script></body></html>
