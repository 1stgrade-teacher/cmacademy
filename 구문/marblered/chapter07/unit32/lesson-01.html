  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}

  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};

  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"unit32","title":"부사 역할을 하는 분사구문, 의미의 방향을 잡아라","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편 Unit 32 부사 역할을 하는 분사구문의 의미\u003c/div>\u003ch1>부사 역할을 하는 분사구문, 의미의 방향을 잡아라\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>분사구문이 문장 전체를 수식하며 이유·조건·양보·동시동작·결과 등 부사의 의미를 나타내는 원리를 익힌다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요. 오늘은 부사 역할을 하는 분사구문을 배워 볼 거예요. 분사구문은 문장 앞이나 뒤에서 이유, 조건, 양보, 동시 동작, 결과 같은 의미를 덧붙이는 블록이에요. 능동이면 현재분사, 수동이면 과거분사를 쓴다는 점을 꼭 기억해 주세요. 예문 열두 개를 통해 실제 문장에서 어떻게 해석되는지 함께 살펴보겠습니다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 Unit 32 부사 역할을 하는 분사구문의 의미\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">분사구문은 \u003cb class=\"key\">접속사와 주어를 생략한 부사절\u003c/b>처럼 문장 전체를 수식합니다. 분사의 주체가 주절 주어와 같고 능동 관계면 \u003cb class=\"key\">현재분사\u003c/b>, 수동 관계면 \u003cb class=\"key\">과거분사\u003c/b>를 씁니다. 문맥에 따라 \u003cb class=\"key\">이유·조건·양보·동시동작·결과\u003c/b> 등으로 해석합니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">Tapping his fingers loudly on the desk top\u003c/span>, he made his impatience and dissatisfaction known.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">Pressed for time and stuck in a deadlock\u003c/span>, she had no idea how to finish the paper.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 \u003cspan class=\"fx\">Being a hybrid art as well as a late one\u003c/span>, film has always been in a dialogue with other narrative genres.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 \u003cspan class=\"fx\">Taken daily\u003c/span>, according to a new study, vitamin D can help treat severe asthma.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">Originally raised mainly for their meat\u003c/span>, sheep and goats became valuable also for their milk and wool.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Children at play often take on other roles, \u003cspan class=\"fx\">pretending to be Principal Walsh or Josh's mom, happily forcing themselves to imagine how someone else thinks and feels\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 A mother is a person who \u003cspan class=\"fx\">seeing there are only four pieces of pie for five people\u003c/span>, promptly announces she never did care for pie.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">Assumed to have a substantial amount of water\u003c/span>, Mars is probably most habitable out of all the planets in our solar system.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 When I find myself in times of trouble, mother Mary comes to me, \u003cspan class=\"fx\">speaking words of wisdom, &quot;Let it be.&quot;\u003c/span> And in my hour of darkness she is standing right in front of me, speaking words of wisdom, &quot;Let it be.&quot;\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">Fueled by drought and development\u003c/span>, wildfires in the West are getting bigger and more aggressive.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Seconds after its spectacular launch, the spacecraft with seven astronauts on board blew up and came apart, \u003cspan class=\"fx\">striking the viewers dumb with shock\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 The very real genetic differences between races or genders are insignificant \u003cspan class=\"fx\">compared with the similarities in our minds\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"부사 역할을 하는 분사구문은 문장 전체에 이유나 조건, 양보, 동시 동작, 결과 같은 의미를 더해 줍니다. 원래 부사절에서 접속사와 주어를 줄여 만든 표현이라고 생각하면 쉬워요. 분사의 주체가 주절 주어와 같고 스스로 하는 동작이면 현재분사를, 당하는 동작이면 과거분사를 씁니다. 해석은 접속사 하나로 고정하지 말고 문맥에 맞게 잡아야 합니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">Tapping his fingers loudly on the desk top\u003c/span>, he made his impatience and dissatisfaction known.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Tapping his fingers loudly\u003c/div>\u003cdiv class=\"k\">그의 손가락을 크게 톡톡 두드리며\u003c/div>\u003cdiv class=\"e\">on the desk top,\u003c/div>\u003cdiv class=\"k\">책상 위를,\u003c/div>\u003cdiv class=\"e\">he made\u003c/div>\u003cdiv class=\"k\">그는 드러냈습니다\u003c/div>\u003cdiv class=\"e\">his impatience and dissatisfaction\u003c/div>\u003cdiv class=\"k\">그의 조바심과 불만이\u003c/div>\u003cdiv class=\"e\">known.\u003c/div>\u003cdiv class=\"k\">알려지도록.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주절 주어 \u003cb class=\"key\">he\u003c/b>와 분사 \u003cb class=\"key\">Tapping\u003c/b>의 주체가 같아 능동의 \u003cb class=\"key\">현재분사구문\u003c/b>이며, '손가락을 두드리면서'라는 \u003cb class=\"key\">동시동작\u003c/b>을 나타냅니다. \u003cb class=\"key\">make + 목적어 + 과거분사\u003c/b> 구문으로 '조바심과 불만이 알려지게 했다'는 의미를 만듭니다.\u003c/div>","segs":[{"n":3,"text":"Tapping his fingers loudly, 그의 손가락을 크게 톡톡 두드리며. on the desk top, 책상 위를. he made, 그는 드러냈습니다. his impatience and dissatisfaction, 그의 조바심과 불만이. known, 알려지도록.","hl":"ch"},{"n":4,"text":"이 문장은 주절 주어 he가 손가락을 두드리는 주체이므로 현재분사 Tapping으로 시작합니다. Tapping his fingers loudly on the desk top은 책상을 톡톡 두드리면서라는 동시 동작을 나타내는 부사 역할의 분사구문이에요. 뒤의 make his impatience and dissatisfaction known은 조바심과 불만이 알려지게 했다, 즉 드러냈다는 뜻입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">Tapping his fingers loudly on the desk top\u003c/span>, he made his impatience and dissatisfaction known.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>그가 책상을 톡톡 두드린 것은 기다림이나 불만을 숨기지 못한 행동이에요. 즉 말로 하지 않아도 몸짓으로 '나는 조바심이 나고 불만스러워요'라고 보여 준 장면입니다. made known은 '드러냈다, 알게 했다'로 쉽게 바꿔 이해할 수 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Tapping his fingers loudly on the desk top\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">While he tapped his fingers loudly on the desk top\u003c/span>\u003cdiv class=\"w\">분사구문을 부사절로 풀어 동시 상황을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">made his impatience and dissatisfaction known\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">showed his impatience and dissatisfaction\u003c/span>\u003cdiv class=\"w\">make known을 show로 바꾸어 '드러내다'의 의미를 자연스럽게 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">tap\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">drum one's fingers on\u003c/span>\u003cspan class=\"y-eq\">tap = drum\u003c/span>\u003cdiv class=\"w\">손가락으로 톡톡 두드리는 동작을 더 구체적으로 표현합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">impatience\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">restlessness\u003c/span>\u003cspan class=\"y-eq\">impatience = restlessness\u003c/span>\u003cdiv class=\"w\">성급함과 안절부절못함의 느낌을 비슷하게 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dissatisfaction\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">discontent\u003c/span>\u003cspan class=\"y-eq\">dissatisfaction = discontent\u003c/span>\u003cdiv class=\"w\">불만족스러운 상태를 나타내는 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">By tapping his fingers loudly on the desk, he showed that he was impatient and dissatisfied.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"그가 책상을 두드린 행동은 말 대신 감정을 보여 주는 몸짓이에요. 그래서 이 문장은 그가 조바심과 불만을 숨기지 못하고 겉으로 드러냈다는 장면을 그립니다. made known은 showed나 revealed로 이해하면 쉬워요.","hl":"mn"},{"n":6,"text":"분사구문을 부사절로 바꾸면 While he tapped his fingers loudly on the desk top, he made his impatience and dissatisfaction known처럼 표현할 수 있어요. 또 made known은 showed로 바꾸어도 같은 뜻을 자연스럽게 전달합니다. 시험에서는 분사구문을 접속사가 있는 절로 바꾸는 문제가 자주 나옵니다.","hl":"rw"},{"n":7,"text":"tap은 drum one's fingers처럼 손가락으로 두드리다는 뜻으로 바꿀 수 있어요. impatience는 restlessness, dissatisfaction은 discontent로 바꾸어도 비슷한 느낌을 줍니다. make known은 reveal이나 show로 정리해 두면 좋습니다.","hl":"ph"},{"n":8,"text":"같은 뜻을 이렇게 바꿔 말할 수 있어요. By tapping his fingers loudly on the desk, he showed that he was impatient and dissatisfied. 손가락을 두드린 행동을 수단으로 표현하고, made known을 showed로 풀어 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">Pressed for time and stuck in a deadlock\u003c/span>, she had no idea how to finish the paper.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Pressed for time\u003c/div>\u003cdiv class=\"k\">시간에 쫓기고\u003c/div>\u003cdiv class=\"e\">and stuck in a deadlock,\u003c/div>\u003cdiv class=\"k\">교착 상태에 갇힌 채,\u003c/div>\u003cdiv class=\"e\">she had no idea\u003c/div>\u003cdiv class=\"k\">그녀는 전혀 몰랐습니다\u003c/div>\u003cdiv class=\"e\">how to finish the paper.\u003c/div>\u003cdiv class=\"k\">보고서를 어떻게 끝내야 할지.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 \u003cb class=\"key\">she\u003c/b>가 시간에 쫓기고 교착 상태에 갇히는 수동의 대상이므로 \u003cb class=\"key\">과거분사\u003c/b> \u003cb class=\"key\">Pressed\u003c/b>와 \u003cb class=\"key\">stuck\u003c/b>으로 시작하는 \u003cb class=\"key\">분사구문\u003c/b>입니다. '시간에 쫓기고 교착 상태에 빠진 상태에서'라는 \u003cb class=\"key\">이유·상태\u003c/b>를 나타냅니다.\u003c/div>","segs":[{"n":9,"text":"Pressed for time, 시간에 쫓기고. and stuck in a deadlock, 교착 상태에 갇힌 채. she had no idea, 그녀는 전혀 몰랐습니다. how to finish the paper, 보고서를 어떻게 끝내야 할지.","hl":"ch"},{"n":10,"text":"이 문장은 주어 she가 시간에 쫓기고 교착 상태에 갇히는 대상이므로 과거분사 Pressed와 stuck으로 시작합니다. Pressed for time and stuck in a deadlock은 시간에 쫓기고 교착 상태에 빠진 상태에서라는 이유와 상태를 나타내는 분사구문이에요. 주절에서는 그녀가 보고서를 어떻게 끝내야 할지 전혀 알지 못한다고 말합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 \u003cspan class=\"fx\">Pressed for time and stuck in a deadlock\u003c/span>, she had no idea how to finish the paper.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>그녀는 마감 압박과 해결되지 않는 상황 때문에 보고서를 끝낼 방법을 찾지 못하고 있어요. have no idea는 전혀 몰랐다기보다 방법을 떠올리지 못했다는 느낌입니다. 막막한 상황을 강조하는 표현이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Pressed for time and stuck in a deadlock\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Because she was pressed for time and stuck in a deadlock\u003c/span>\u003cdiv class=\"w\">분사구문을 이유를 나타내는 부사절로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">had no idea how to finish\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">was at a loss how to finish\u003c/span>\u003cdiv class=\"w\">막막해서 방법을 모르는 느낌을 더 분명하게 보여 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be pressed for time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be short on time\u003c/span>\u003cspan class=\"y-eq\">be pressed for time = be short on time\u003c/span>\u003cdiv class=\"w\">시간이 부족하다는 뜻을 쉬운 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">deadlock\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">standstill\u003c/span>\u003cspan class=\"y-eq\">deadlock = standstill\u003c/span>\u003cdiv class=\"w\">진전이 없는 막힌 상태를 비슷하게 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have no idea\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be at a loss\u003c/span>\u003cspan class=\"y-eq\">have no idea = be at a loss\u003c/span>\u003cdiv class=\"w\">어찌할 바를 모르는 상태를 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Because she was short on time and caught in a standstill, she was at a loss about how to finish the paper.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"그녀는 마감에 쫓기고 일이 막혀서 보고서를 끝낼 방법을 찾지 못하고 있어요. have no idea는 단순히 몰랐다기보다 방법이 떠오르지 않는다는 막막함을 담고 있습니다. 그래서 이 문장은 꽉 막힌 상황을 강하게 보여 줘요.","hl":"mn"},{"n":12,"text":"이 분사구문은 Because she was pressed for time and stuck in a deadlock처럼 이유를 나타내는 절로 바꿀 수 있어요. had no idea how to finish는 was at a loss how to finish로 바꾸면 막막함이 더 잘 드러납니다. 분사구문을 부사절로 풀어 쓰는 연습은 독해에 큰 도움이 됩니다.","hl":"rw"},{"n":13,"text":"be pressed for time은 be short on time으로 바꿀 수 있고, deadlock은 standstill로 정리할 수 있어요. have no idea는 be at a loss로 익혀 두세요. 이런 표현은 문제 상황을 설명할 때 자주 나옵니다.","hl":"ph"},{"n":14,"text":"같은 뜻을 이렇게 바꿔 말할 수 있어요. Because she was short on time and caught in a standstill, she was at a loss about how to finish the paper. 이유를 나타내는 절로 풀고 have no idea를 be at a loss로 바꾼 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 \u003cspan class=\"fx\">Being a hybrid art as well as a late one\u003c/span>, film has always been in a dialogue with other narrative genres.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Being a hybrid art\u003c/div>\u003cdiv class=\"k\">혼합 예술이면서\u003c/div>\u003cdiv class=\"e\">as well as a late one,\u003c/div>\u003cdiv class=\"k\">후발 예술이기도 한,\u003c/div>\u003cdiv class=\"e\">film has always been\u003c/div>\u003cdiv class=\"k\">영화는 항상\u003c/div>\u003cdiv class=\"e\">in a dialogue\u003c/div>\u003cdiv class=\"k\">대화 속에 있어 왔습니다\u003c/div>\u003cdiv class=\"e\">with other narrative genres.\u003c/div>\u003cdiv class=\"k\">다른 서사 장르들과.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 \u003cb class=\"key\">film\u003c/b>의 성격을 설명하는 \u003cb class=\"key\">현재분사구문\u003c/b>으로, '영화가 혼합 예술이자 후발 예술이기 때문에'라는 \u003cb class=\"key\">이유\u003c/b>를 나타냅니다. \u003cb class=\"key\">Being\u003c/b>은 주절 주어 film과 능동 관계를 이루는 분사입니다.\u003c/div>","segs":[{"n":15,"text":"Being a hybrid art, 혼합 예술이면서. as well as a late one, 후발 예술이기도 한. film has always been, 영화는 항상. in a dialogue, 대화 속에 있어 왔습니다. with other narrative genres, 다른 서사 장르들과.","hl":"ch"},{"n":16,"text":"이 문장은 film의 성격을 설명하면서 시작합니다. Being a hybrid art as well as a late one은 영화가 혼합 예술이자 후발 예술이기 때문에라는 이유를 나타내는 현재분사구문이에요. 주절에서는 영화가 다른 서사 장르들과 항상 대화를 나눠 왔다고 말합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 \u003cspan class=\"fx\">Being a hybrid art as well as a late one\u003c/span>, film has always been in a dialogue with other narrative genres.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>영화는 여러 예술 형식이 섞인 혼합 예술이고, 다른 장르보다 늦게 등장한 예술이에요. 그래서 영화는 처음부터 다른 서사 장르들과 영향을 주고받으며 발전해 왔다는 뜻입니다. in a dialogue with는 '대화를 나누다'보다 '서로 영향을 주고받다'로 발전해 왔다는 뜻입니다. in a dialogue with는 대화를 나눈다기보다 함께 영향을 주고받는다는 느낌으로 이해하세요.","hl":"mn"},{"n":18,"text":"Being a hybrid art as well as a late one은 Because it is both a hybrid art and a late one으로 바꿀 수 있어요. has always been in a dialogue with는 has always interacted with로 바꾸면 뜻이 더 분명해집니다. 이유를 나타내는 분사구문을 절로 풀어 보는 연습이에요.","hl":"rw"},{"n":19,"text":"hybrid는 mixed, narrative genres는 storytelling genres로 바꿀 수 있어요. be in a dialogue with는 interact with로 정리해 두세요. 예술이나 장르에 관한 글에서 자주 만나는 표현들입니다.","hl":"ph"},{"n":20,"text":"같은 뜻을 이렇게 바꿔 말할 수 있어요. Because film is both a mixed art and a latecomer, it has always interacted with other storytelling genres. Being을 Because it is로 풀고 in a dialogue with를 interacted with로 바꾼 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 \u003cspan class=\"fx\">Taken daily\u003c/span>, according to a new study, vitamin D can help treat severe asthma.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Taken daily,\u003c/div>\u003cdiv class=\"k\">매일 복용될 경우,\u003c/div>\u003cdiv class=\"e\">according to a new study,\u003c/div>\u003cdiv class=\"k\">새로운 연구에 따르면,\u003c/div>\u003cdiv class=\"e\">vitamin D can help\u003c/div>\u003cdiv class=\"k\">비타민 D는 도울 수 있습니다\u003c/div>\u003cdiv class=\"e\">treat severe asthma.\u003c/div>\u003cdiv class=\"k\">심각한 천식을 치료하는 데.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 \u003cb class=\"key\">vitamin D\u003c/b>가 복용되는 대상이므로 \u003cb class=\"key\">과거분사\u003c/b> \u003cb class=\"key\">Taken\u003c/b>을 쓴 수동의 \u003cb class=\"key\">분사구문\u003c/b>입니다. '매일 복용될 경우'라는 \u003cb class=\"key\">조건\u003c/b>을 나타냅니다.\u003c/div>","segs":[{"n":21,"text":"Taken daily, 매일 복용될 경우. according to a new study, 새로운 연구에 따르면. vitamin D can help, 비타민 D는 도울 수 있습니다. treat severe asthma, 심각한 천식을 치료하는 데.","hl":"ch"},{"n":22,"text":"이 문장은 vitamin D가 복용되는 대상이므로 과거분사 Taken으로 시작하는 수동의 분사구문을 씁니다. Taken daily는 매일 복용될 경우라는 조건의 의미를 나타내요. according to a new study는 새로운 연구에 따르면이라는 출처를 덧붙입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 \u003cspan class=\"fx\">Taken daily\u003c/span>, according to a new study, vitamin D can help treat severe asthma.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 문장은 비타민 D를 매일 먹으면 심한 천식 치료에 도움이 될 수 있다는 연구 결과를 전해요. Taken daily는 '만약 매일 복용한다면'이라는 조건으로 풀어 이해하면 자연스럽습니다. according to는 '새로운 연구에 따르면'이라는 출처 표시예요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Taken daily\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If it is taken daily\u003c/span>\u003cdiv class=\"w\">수동의 분사구문을 조건을 나타내는 부사절로 전환했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">help treat severe asthma\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be helpful in treating severe asthma\u003c/span>\u003cdiv class=\"w\">help 동사원형을 be helpful in 동명사로 풀어 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">severe\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">serious\u003c/span>\u003cspan class=\"y-eq\">severe = serious\u003c/span>\u003cdiv class=\"w\">천식이 심각하다는 뜻을 쉬운 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">treat\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">manage\u003c/span>\u003cspan class=\"y-eq\">treat = manage\u003c/span>\u003cdiv class=\"w\">질병을 치료하고 관리한다는 의미를 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">accord ">구문\u003c/b>주어 \u003cb class=\"key\">sheep and goats\u003c/b>가 사육되는 대상이므로 \u003cb class=\"key\">과거분사\u003c/b> \u003cb class=\"key\">raised\u003c/b>를 쓴 수동의 \u003cb class=\"key\">분사구문\u003c/b>입니다. '원래 주로 고기를 위해 사육되었지만'이라는 \u003cb class=\"key\">양보\u003c/b>의 의미를 담습니다.\u003c/div>","segs":[{"n":27,"text":"Originally raised mainly for their meat, 원래 주로 그들의 고기를 위해 사육되었지만. sheep and goats became valuable, 양과 염소는 귀중해졌습니다. also for their milk and wool, 또한 그들의 우유와 털 때문에.","hl":"ch"},{"n":28,"text":"이 문장은 sheep and goats가 사육되는 대상이므로 과거분사 raised로 시작하는 수동의 분사구문입니다. Originally raised mainly for their meat은 원래 주로 고기를 위해 사육되었지만이라는 양보의 의미를 담아요. 주절에서는 우유와 털 때문에도 가치가 있게 되었다고 이어집니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 \u003cspan class=\"fx\">Originally raised mainly for their meat\u003c/span>, sheep and goats became valuable also for their milk and wool.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>양과 염소는 처음에는 고기를 얻기 위해 길러졌어요. 하지만 이제는 우유와 털 때문에도 가치가 있는 동물이 되었다는 뜻입니다. also가 붙어 고기 외에 다른 용도가 더해졌음을 보여 줘요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Originally raised mainly for their meat\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Although they were originally raised mainly for their meat\u003c/span>\u003cdiv class=\"w\">분사구문을 양보를 나타내는 부사절로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">became valuable also for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">also became valued for\u003c/span>\u003cdiv class=\"w\">become valuable for를 become valued for로 바꾸어 가치가 인정받는다는 느낌을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">raise\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rear\u003c/span>\u003cspan class=\"y-eq\">raise = rear\u003c/span>\u003cdiv class=\"w\">가축을 기르고 사육한다는 뜻을 같은 수준의 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">valuable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">precious\u003c/span>\u003cspan class=\"y-eq\">valuable = precious\u003c/span>\u003cdiv class=\"w\">가치 있고 귀중하다는 의미를 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">mainly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">chiefly\u003c/span>\u003cspan class=\"y-eq\">mainly = chiefly\u003c/span>\u003cdiv class=\"w\">주로, 대부분이라는 뜻을 격식 있는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Although sheep and goats were originally reared chiefly for their meat, they also became valued for their milk and wool.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"양과 염소는 처음에는 고기를 얻으려고 길러졌어요. 그런데 이제는 우유와 털 때문에도 중요한 동물이 되었다는 뜻입니다. also가 들어 있어 고기 외에 다른 가치가 더해졌다는 점이 잘 드러납니다.","hl":"mn"},{"n":30,"text":"Originally raised mainly for their meat는 Although they were originally raised mainly for their meat로 풀 수 있어요. became valuable also for는 also became valued for로 바꿀 수 있습니다. 양보의 의미를 살려 문장을 다시 쓰는 연습이에요.","hl":"rw"},{"n":31,"text":"raise는 rear, valuable은 precious로 바꿀 수 있어요. mainly는 chiefly로 정리해 두세요. 동물의 사육과 용도를 설명할 때 유용한 표현들입니다.","hl":"ph"},{"n":32,"text":"같은 뜻을 이렇게 바꿔 말할 수 있어요. Although sheep and goats were originally reared chiefly for their meat, they also became valued for their milk and wool. 분사구문을 Although 절로 풀고 raise와 valuable을 각각 reared와 valued로 바꾼 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 Children at play often take on other roles, \u003cspan class=\"fx\">pretending to be Principal Walsh or Josh's mom, happily forcing themselves to imagine how someone else thinks and feels\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Children at play\u003c/div>\u003cdiv class=\"k\">놀이 중인 아이들은\u003c/div>\u003cdiv class=\"e\">often take on other roles,\u003c/div>\u003cdiv class=\"k\">자주 다른 역할을 맡습니다,\u003c/div>\u003cdiv class=\"e\">pretending to be Principal Walsh\u003c/div>\u003cdiv class=\"k\">월시 교장 선생님인 척하면서\u003c/div>\u003cdiv class=\"e\">or Josh's mom,\u003c/div>\u003cdiv class=\"k\">혹은 조시의 엄마인 척하면서,\u003c/div>\u003cdiv class=\"e\">happily forcing themselves\u003c/div>\u003cdiv class=\"k\">기꺼이 스스로를 몰아가며\u003c/div>\u003cdiv class=\"e\">to imagine how someone else\u003c/div>\u003cdiv class=\"k\">다른 누군가가 어떻게\u003c/div>\u003cdiv class=\"e\">thinks and feels.\u003c/div>\u003cdiv class=\"k\">생각하고 느끼는지 상상하도록.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주절의 \u003cb class=\"key\">Children\u003c/b>이 역할을 맡고 상상하는 주체이므로 \u003cb class=\"key\">현재분사\u003c/b> \u003cb class=\"key\">pretending\u003c/b>과 \u003cb class=\"key\">forcing\u003c/b>이 이어지는 \u003cb class=\"key\">분사구문\u003c/b>입니다. 앞의 분사구문은 '다른 역할을 하면서'라는 \u003cb class=\"key\">동시동작\u003c/b>, 뒤의 분사구문은 '스스로 상상하게 만들며'라는 \u003cb class=\"key\">부대상황\u003c/b>을 나타냅니다.\u003c/div>","segs":[{"n":33,"text":"Children at play, 놀이 중인 아이들은. often take on other roles, 자주 다른 역할을 맡습니다. pretending to be Principal Walsh, 월시 교장 선생님인 척하면서. or Josh's mom, 혹은 조시의 엄마인 척하면서. happily forcing themselves, 기꺼이 스스로를 몰아가며. to imagine how someone else, 다른 누군가가 어떻게. thinks and feels, 생각하고 느끼는지 상상하도록.","hl":"ch"},{"n":34,"text":"이 문장은 Children이 역할을 맡는 주체이므로 현재분사 pretending과 forcing이 이어서 쓰입니다. pretending to be Principal Walsh or Josh's mom은 교장 선생님이나 조시의 엄마인 척하면서라는 동시 동작을 나타내요. happily forcing themselves to imagine은 기꺼이 스스로를 상상의 상황으로 밀어 넣는다는 부대상황입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 Children at play often take on other roles, \u003cspan class=\"fx\">pretending to be Principal Walsh or Josh's mom, happily forcing themselves to imagine how someone else thinks and feels\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>아이들은 놀이 속에서 교장 선생님이나 친구 엄마 같은 다른 역할을 맡아요. 그러면서 다른 사람의 생각과 감정을 상상하는 연습을 자연스럽게 하게 됩니다. happily forcing themselves는 억지로라기보다 기꺼이 스스로를 그 상황에 밀어 넣는다는 느낌이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pretending to be Principal Walsh or Josh's mom\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">acting as Principal Walsh or Josh's mom\u003c/span>\u003cdiv class=\"w\">pretend to be를 act as로 바꾸어 역할을 수행하는 느낌을 살렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">happily forcing themselves to imagine\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">willingly pushing themselves to imagine\u003c/span>\u003cdiv class=\"w\">happily를 willingly로, forcing을 pushing으로 바꾸어 자발적인 몰입을 드러냈습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">assume\u003c/span>\u003cspan class=\"y-eq\">take on = assume\u003c/span>\u003cdiv class=\"w\">역할을 맡는다는 뜻을 격식 있는 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pretend to be\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">act as\u003c/span>\u003cspan class=\"y-eq\">pretend to be = act as\u003c/span>\u003cdiv class=\"w\">다른 사람인 척하며 역할을 한다는 의미를 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">force oneself to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">push oneself to\u003c/span>\u003cspan class=\"y-eq\">force oneself to = push oneself to\u003c/span>\u003cdiv class=\"w\">스스로를 밀어붙여 하게 만든다는 느낌을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Children at play often assume other roles, acting as Principal Walsh or Josh's mom, and willingly push themselves to imagine how someone else thinks and feels.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"아이들은 놀이 속에서 다른 역할을 맡으며 다른 사람의 마음을 상상하는 연습을 해요. happily forcing themselves는 억지로 괴롭힌다기보다 즐겁게 스스로를 그 역할에 몰입시킨다는 느낌입니다. 놀이가 공감 능력을 기르는 과정이라는 점을 보여 주는 문장이에요.","hl":"mn"},{"n":36,"text":"pretending to be는 acting as로 바꿀 수 있고, happily forcing themselves는 willingly pushing themselves로 바꿀 수 있어요. 이렇게 바꾸면 뜻은 유지하면서 표현이 더 분명해집니다. 시험에서는 take on이나 pretend to be 같은 구동사를 유의어로 바꾸는 문제가 나올 수 있어요.","hl":"rw"},{"n":37,"text":"take on은 assume, pretend to be는 act as로 정리해 두세요. force oneself to는 push oneself to로 바꿀 수 있습니다. 이런 표현은 역할이나 태도를 설명할 때 자주 쓰여요.","hl":"ph"},{"n":38,"text":"같은 뜻을 이렇게 바꿔 말할 수 있어요. Children at play often assume other roles, acting as Principal Walsh or Josh's mom, and willingly push themselves to imagine how someone else thinks and feels. pretending과 forcing을 각각 acting as와 pushing themselves로 풀어 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 A mother is a person who \u003cspan class=\"fx\">seeing there are only four pieces of pie for five people\u003c/span>, promptly announces she never did care for pie.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A mother is a person\u003c/div>\u003cdiv class=\"k\">어머니는 한 사람입니다\u003c/div>\u003cdiv class=\"e\">who seeing there are only four pieces of pie for five people,\u003c/div>\u003cdiv class=\"k\">다섯 명에게 파이가 단 네 조각뿐인 것을 보고\u003c/div>\u003cdiv class=\"e\">promptly announces\u003c/div>\u003cdiv class=\"k\">즉시 말합니다\u003c/div>\u003cdiv class=\"e\">she never did care for pie.\u003c/div>\u003cdiv class=\"k\">자신은 원래 파이를 좋아하지 않았다고.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">seeing\u003c/b>은 관계대명사 who 뒤에서 '보고는'의 의미를 더하는 \u003cb class=\"key\">현재분사구문\u003c/b>으로, 어머니가 상황을 확인하는 \u003cb class=\"key\">동시동작\u003c/b>과 \u003cb class=\"key\">이유\u003c/b>를 함께 나타냅니다. 주된 동작은 \u003cb class=\"key\">promptly announces\u003c/b>이고, 분사구가 그 판단의 배경을 만듭니다.\u003c/div>","segs":[{"n":39,"text":"A mother is a person, 어머니는 한 사람입니다. who seeing there are only four pieces of pie for five people, 다섯 명에게 파이가 단 네 조각뿐인 것을 보고. promptly announces, 즉시 말합니다. she never did care for pie, 자신은 원래 파이를 좋아하지 않았다고.","hl":"ch"},{"n":40,"text":"이 문장에서는 who 뒤의 seeing이 상황을 보고서라는 의미를 더하는 현재분사구문으로 쓰였습니다. 다섯 명에게 파이가 단 네 조각뿐인 것을 보고 즉시 말한다는 흐름이에요. seeing이 배경을 만들고 promptly announces가 주된 행동을 완성합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 A mother is a person who \u003cspan class=\"fx\">seeing there are only four pieces of pie for five people\u003c/span>, promptly announces she never did care for pie.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>다섯 사람이 먹을 파이가 네 조각뿐인 상황을 보면 보통 한 사람이 양보해야 하죠. 이 어머니는 그 순간 바로 '나는 파이를 별로 좋아하지 않아요'라고 말해 다른 사람이 먹을 수 있게 해요. never did care for는 '원래 좋아하지 않았다'는 뜻으로, 배려를 자연스럽게 표현하는 유머 섞인 말이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">seeing there are only four pieces of pie for five people\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">when she sees that there are only four pieces of pie for five people\u003c/span>\u003cdiv class=\"w\">분사구문을 시간을 나타내는 부사절로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">never did care for pie\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">never really liked pie\u003c/span>\u003cdiv class=\"w\">care for를 like로 바꾸고 did 강조를 really로 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">promptly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">immediately\u003c/span>\u003cspan class=\"y-eq\">promptly = immediately\u003c/span>\u003cdiv class=\"w\">바로, 즉시라는 뜻을 가장 익숙한 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">announce\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">declare\u003c/span>\u003cspan class=\"y-eq\">announce = declare\u003c/span>\u003cdiv class=\"w\">말해 알린다는 뜻을 더 힘 있는 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">care for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be fond of\u003c/span>\u003cspan class=\"y-eq\">care for = be fond of\u003c/span>\u003cdiv class=\"w\">좋아하다는 뜻을 구체적인 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A mother is someone who, when she sees only four pieces of pie for five people, immediately says that she never really liked pie.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"다섯 사람이 먹을 파이가 네 조각뿐이면 누군가는 양보해야 하죠. 이 어머니는 바로 자신이 파이를 좋아하지 않는다고 말해 다른 사람이 먹게 해 줍니다. never did care for는 원래 별로 좋아하지 않았다는 뜻으로 배려를 유머럽게 표현한 말이에요.","hl":"mn"},{"n":42,"text":"seeing there are only four pieces of pie for five people는 when she sees that there are only four pieces of pie for five people로 풀 수 있어요. never did care for pie는 never really liked pie로 바꾸면 뜻이 더 쉽게 들어옵니다. 분사구를 시간을 나타내는 절로 바꾸는 연습을 해 보세요.","hl":"rw"},{"n":43,"text":"promptly는 immediately, announce는 declare로 바꿀 수 있어요. care for는 be fond of나 like로 정리해 두면 좋습니다. never did care for처럼 did를 넣으면 강조의 느낌이 살아나요.","hl":"ph"},{"n":44,"text":"같은 뜻을 이렇게 바꿔 말할 수 있어요. A mother is someone who, when she sees only four pieces of pie for five people, immediately says that she never really liked pie. seeing을 when she sees로, care for를 like로 풀어 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 \u003cspan class=\"fx\">Assumed to have a substantial amount of water\u003c/span>, Mars is probably most habitable out of all the planets in our solar system.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Assumed to have a substantial amount of water,\u003c/div>\u003cdiv class=\"k\">상당한 양의 물을 가지고 있는 것으로 추정되어,\u003c/div>\u003cdiv class=\"e\">Mars is probably most habitable\u003c/div>\u003cdiv class=\"k\">화성은 아마도 가장 살기 적합합니다\u003c/div>\u003cdiv class=\"e\">out of all the planets\u003c/div>\u003cdiv class=\"k\">모든 행성 중에서\u003c/div>\u003cdiv class=\"e\">in our solar system.\u003c/div>\u003cdiv class=\"k\">우리 태양계에 있는.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 \u003cb class=\"key\">Mars\u003c/b>가 추정되는 대상이므로 \u003cb class=\"key\">과거분사\u003c/b> \u003cb class=\"key\">Assumed\u003c/b>를 쓴 수동의 \u003cb class=\"key\">분사구문\u003c/b>입니다. '상당한 양의 물을 가진 것으로 추정되기 때문에'라는 \u003cb class=\"key\">이유\u003c/b>를 나타냅니다.\u003c/div>","segs":[{"n":45,"text":"Assumed to have a substantial amount of water, 상당한 양의 물을 가지고 있는 것으로 추정되어. Mars is probably most habitable, 화성은 아마도 가장 살기 적합합니다. out of all the planets, 모든 행성 중에서. in our solar system, 우리 태양계에 있는.","hl":"ch"},{"n":46,"text":"이 문장은 Mars가 추정되는 대상이므로 과거분사 Assumed로 시작하는 수동의 분사구문입니다. Assumed to have a substantial amount of water는 상당한 물을 가진 것으로 추정되기 때문에라는 이유를 나타내요. 뒤에서는 화성이 태양계 행성 중 가장 살기 적합할 가능성이 높다고 말합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 \u003cspan class=\"fx\">Assumed to have a substantial amount of water\u003c/span>, Mars is probably most habitable out of all the planets in our solar system.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>화성은 상당한 물을 가지고 있을 것으로 여겨져요. 그래서 태양계의 모든 행성 가운데 생명이 살기에 가장 적합할 가능성이 높다는 뜻입니다. most habitable은 '가장 살기 좋은' 정도로 이해하면 됩니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Assumed to have a substantial amount of water\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Because it is assumed to have a substantial amount of water\u003c/span>\u003cdiv class=\"w\">수동의 분사구문을 이유를 나타내는 부사절로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">most habitable out of all the planets\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the most suitable for life among all the planets\u003c/span>\u003cdiv class=\"w\">habitable을 생명이 살기 적합하다는 뜻으로 풀어 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">assume\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">suppose\u003c/span>\u003cspan class=\"y-eq\">assume = suppose\u003c/span>\u003cdiv class=\"w\">추정하거나 가정한다는 뜻을 비슷한 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">substantial\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">considerable\u003c/span>\u003cspan class=\"y-eq\">substantial = considerable\u003c/span>\u003cdiv class=\"w\">상당한 양이나 정도를 나타내는 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">habitable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">livable\u003c/span>\u003cspan class=\"y-eq\">habitable = livable\u003c/span>\u003cdiv class=\"w\">살기에 적합하다는 뜻을 쉬운 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Because Mars is believed to have a considerable amount of water, it is probably the most livable of all the planets in our solar system.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"화성은 상당한 물을 품고 있을 것으로 여겨집니다. 그래서 우리 태양계의 여러 행성 가운데 생명이 살기에 가장 적합할 수 있다는 뜻이에요. most habitable은 가장 살기 좋은 정도로 이해하면 됩니다.","hl":"mn"},{"n":48,"text":"Assumed to have a substantial amount of water는 Because it is assumed to have a substantial amount of water로 풀 수 있어요. most habitable out of all the planets는 the most suitable for life among all the planets로 바꿀 수 있습니다. 이유의 의미를 분명히 하고 habitable을 풀어 쓴 표현이에요.","hl":"rw"},{"n":49,"text":"assume은 suppose, substantial은 considerable로 바꿀 수 있습니다. habitable은 livable로 정리해 두세요. 이 단어들은 과학 지문에서 자주 나와요.","hl":"ph"},{"n":50,"text":"같은 뜻을 이렇게 바꿔 말할 수 있어요. Because Mars is believed to have a considerable amount of water, it is probably the most livable of all the planets in our solar system. assumed를 believed로, habitable을 livable로 풀어 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 When I find myself in times of trouble, mother Mary comes to me, \u003cspan class=\"fx\">speaking words of wisdom, &quot;Let it be.&quot;\u003c/span> And in my hour of darkness she is standing right in front of me, speaking words of wisdom, &quot;Let it be.&quot;\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">When I find myself\u003c/div>\u003cdiv class=\"k\">내가 나 자신을 발견할 때\u003c/div>\u003cdiv class=\"e\">in times of trouble,\u003c/div>\u003cdiv class=\"k\">어려움의 시기에,\u003c/div>\u003cdiv class=\"e\">mother Mary comes to me,\u003c/div>\u003cdiv class=\"k\">성모 마리아께서 내게 오십니다,\u003c/div>\u003cdiv class=\"e\">speaking words of wisdom,\u003c/div>\u003cdiv class=\"k\">지혜의 말씀을 하시면서,\u003c/div>\u003cdiv class=\"e\">&quot;Let it be.&quot;\u003c/div>\u003cdiv class=\"k\">“내버려 두라.”\u003c/div>\u003cdiv class=\"e\">And in my hour of darkness\u003c/div>\u003cdiv class=\"k\">그리고 내 어둠의 시간에\u003c/div>\u003cdiv class=\"e\">she is standing right in front of me,\u003c/div>\u003cdiv class=\"k\">그녀는 바로 내 앞에 서 계십니다,\u003c/div>\u003cdiv class=\"e\">speaking words of wisdom,\u003c/div>\u003cdiv class=\"k\">지혜의 말씀을 하시면서,\u003c/div>\u003cdiv class=\"e\">&quot;Let it be.&quot;\u003c/div>\u003cdiv class=\"k\">“내버려 두라.”\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">speaking\u003c/b>은 주어 \u003cb class=\"key\">mother Mary\u003c/b>가 말하는 동시 동작을 나타내는 \u003cb class=\"key\">현재분사구문\u003c/b>입니다. 두 번째 \u003cb class=\"key\">speaking\u003c/b>도 같은 방식으로 '서 계시면서 말씀하시는' \u003cb class=\"key\">동시동작\u003c/b>을 이어 줍니다.\u003c/div>","segs":[{"n":51,"text":"When I find myself, 내가 나 자신을 발견할 때. in times of trouble, 어려움의 시기에. mother Mary comes to me, 성모 마리아께서 내게 오십니다. speaking words of wisdom, 지혜의 말씀을 하시면서. \"Let it be.\", “내버려 두라.”. And in my hour of darkness, 그리고 내 어둠의 시간에. she is standing right in front of me, 그녀는 바로 내 앞에 서 계십니다. speaking words of wisdom, 지혜의 말씀을 하시면서. \"Let it be.\", “내버려 두라.”","hl":"ch"},{"n":52,"text":"이 가사에서는 mother Mary가 말하는 동시 동작을 speaking으로 표현합니다. speaking words of wisdom은 지혜의 말씀을 하면서라는 뜻의 현재분사구문이에요. 뒤에서도 speaking이 반복되어 그녀가 바로 앞에 서서 말씀을 전하는 장면이 이어집니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 When I find myself in times of trouble, mother Mary comes to me, \u003cspan class=\"fx\">speaking words of wisdom, &quot;Let it be.&quot;\u003c/span> And in my hour of darkness she is standing right in front of me, speaking words of wisdom, &quot;Let it be.&quot;\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 가사는 힘든 시기에 성모 마리아가 지혜의 말씀을 전하며 위로해 주는 장면을 그려요. Let it be는 '그냥 내버려 두세요, 흘러가게 하세요'라는 뜻으로, 걱정을 놓으라는 위로의 메시지입니다. 반복되는 speaking이 말씀과 함께 곁에 서 있는 느낌을 강조해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">speaking words of wisdom\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">offering words of wisdom\u003c/span>\u003cdiv class=\"w\">말을 전한다는 의미를 offering으로 바꾸어 위로의 뉘앙스를 살렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in my hour of darkness\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in my darkest hour\u003c/span>\u003cdiv class=\"w\">어둠의 시간을 가장 어두운 순간으로 바꾸어 극적인 느낌을 더했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">words of wisdom\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">wise words\u003c/span>\u003cspan class=\"y-eq\">words of wisdom = wise words\u003c/span>\u003cdiv class=\"w\">지혜의 말씀이라는 표현을 간결하게 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">come to me\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">approach me\u003c/span>\u003cspan class=\"y-eq\">come to me = approach me\u003c/span>\u003cdiv class=\"w\">내게 다가온다는 뜻을 더 분명한 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in times of trouble\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in difficult times\u003c/span>\u003cspan class=\"y-eq\">in times of trouble = in difficult times\u003c/span>\u003cdiv class=\"w\">어려운 시기라는 뜻을 쉬운 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">When I am in difficult times, Mother Mary comes to me and offers wise words: 'Let it be.' And in my darkest hour, she stands right before me, offering wise words: 'Let it be.'\u003c/div>\u003c/div>","segs":[{"n":53,"text":"힘든 시기에 성모 마리아가 찾아와 위로의 말씀을 건네는 장면이에요. Let it be는 그냥 내버려 두라, 걱정을 놓으라는 뜻으로 이해하면 됩니다. 반복되는 speaking이 따뜻하고 간절한 분위기를 만들어 줍니다.","hl":"mn"},{"n":54,"text":"speaking words of wisdom은 offering words of wisdom으로 바꿀 수 있어요. in my hour of darkness는 in my darkest hour로 바꾸면 더 극적인 느낌을 줍니다. 이런 표현 교체는 가사의 분위기를 해치지 않으면서 뜻을 분명히 해 줍니다.","hl":"rw"},{"n":55,"text":"words of wisdom은 wise words로 바꿀 수 있고, in times of trouble은 in difficult times로 풀 수 있어요. come to me는 approach me처럼 바꿀 수 있습니다. 시험에서는 이런 유의 표현을 묶어서 기억해 두면 좋아요.","hl":"ph"},{"n":56,"text":"같은 뜻을 이렇게 바꿔 볼 수 있어요. When I am in difficult times, Mother Mary comes to me and offers wise words, Let it be. And in my darkest hour, she stands right before me, offering wise words, Let it be. speaking을 offering으로, words of wisdom을 wise words로 풀어 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 \u003cspan class=\"fx\">Fueled by drought and development\u003c/span>, wildfires in the West are getting bigger and more aggressive.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Fueled by drought and development,\u003c/div>\u003cdiv class=\"k\">가뭄과 개발로 인해 불붙어,\u003c/div>\u003cdiv class=\"e\">wildfires in the West\u003c/div>\u003cdiv class=\"k\">서부의 산불은\u003c/div>\u003cdiv class=\"e\">are getting bigger\u003c/div>\u003cdiv class=\"k\">더 커지고 있습니다\u003c/div>\u003cdiv class=\"e\">and more aggressive.\u003c/div>\u003cdiv class=\"k\">그리고 더 맹렬해지고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 \u003cb class=\"key\">wildfires\u003c/b>가 가뭄과 개발의 영향을 받는 대상이므로 \u003cb class=\"key\">과거분사\u003c/b> \u003cb class=\"key\">Fueled\u003c/b>를 쓴 수동의 \u003cb class=\"key\">분사구문\u003c/b>입니다. '가뭄과 개발로 인해 불이 붙어'라는 \u003cb class=\"key\">원인\u003c/b>을 나타냅니다.\u003c/div>","segs":[{"n":57,"text":"Fueled by drought and development, 가뭄과 개발로 인해 불붙어. wildfires in the West, 서부의 산불은. are getting bigger, 더 커지고 있습니다. and more aggressive, 그리고 더 맹렬해지고 있습니다.","hl":"ch"},{"n":58,"text":"이 문장은 wildfires가 가뭄과 개발의 영향을 받는 대상이므로 과거분사 Fueled로 시작하는 수동의 분사구문입니다. Fueled by drought and development는 가뭄과 개발로 인해 불이 붙어라는 원인을 나타내요. 주절에서는 서부 산불이 더 커지고 맹렬해지고 있다고 말합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 \u003cspan class=\"fx\">Fueled by drought and development\u003c/span>, wildfires in the West are getting bigger and more aggressive.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>서부 지역의 산불은 가뭄과 개발 때문에 더 쉽게 번지고 세져요. fueled by는 '연료를 공급받아'라는 이미지로, 어떤 요인이 상황을 악화시킨다는 뜻입니다. 산불이 점점 커지고 공격적으로 변하고 있다는 경고예요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Fueled by drought and development\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Because of drought and development\u003c/span>\u003cdiv class=\"w\">수동의 분사구문을 원인을 나타내는 전치사구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are getting bigger and more aggressive\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are growing larger and fiercer\u003c/span>\u003cdiv class=\"w\">get bigger를 grow larger로, aggressive를 fiercer로 바꾸어 자연스럽게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fuel\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">drive\u003c/span>\u003cspan class=\"y-eq\">fuel = drive\u003c/span>\u003cdiv class=\"w\">상황을 부추기고 악화시킨다는 뜻을 비슷하게 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">drought\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">dry spell\u003c/span>\u003cspan class=\"y-eq\">drought = dry spell\u003c/span>\u003cdiv class=\"w\">가뭄을 쉬운 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">aggressive\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fierce\u003c/span>\u003cspan class=\"y-eq\">aggressive = fierce\u003c/span>\u003cdiv class=\"w\">산불이 맹렬하고 공격적이라는 느낌을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Because of drought and development, wildfires in the West are growing larger and fiercer.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"서부 지역의 산불은 가뭄과 개발 때문에 더 쉽게 번지고 세져요. fueled by는 연료를 공급받는다는 이미지로, 어떤 요인이 상황을 악화시킨다는 뜻입니다. 산불이 점점 커지고 공격적으로 변하고 있다는 경고의 문장이에요.","hl":"mn"},{"n":60,"text":"Fueled by drought and development는 Because of drought and development로 바꿀 수 있어요. are getting bigger and more aggressive는 are growing larger and fiercer로 바꿀 수 있습니다. 원인과 변화를 더 분명하게 드러낸 표현이에요.","hl":"rw"},{"n":61,"text":"fuel은 drive, drought는 dry spell로 바꿀 수 있어요. aggressive는 fierce로 정리해 두세요. 산불이나 재난을 설명하는 글에서 자주 만나는 단어들입니다.","hl":"ph"},{"n":62,"text":"같은 뜻을 이렇게 바꿔 말할 수 있어요. Because of drought and development, wildfires in the West are growing larger and fiercer. 분사구문을 원인을 나타내는 전치사구로 풀고 aggressive를 fiercer로 바꾼 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 Seconds after its spectacular launch, the spacecraft with seven astronauts on board blew up and came apart, \u003cspan class=\"fx\">striking the viewers dumb with shock\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Seconds after its spectacular launch,\u003c/div>\u003cdiv class=\"k\">그것의 장관인 발사 후 몇 초 만에,\u003c/div>\u003cdiv class=\"e\">the spacecraft with seven astronauts on board\u003c/div>\u003cdiv class=\"k\">일곱 명의 우주비행사가 탑승한 우주선은\u003c/div>\u003cdiv class=\"e\">blew up and came apart,\u003c/div>\u003cdiv class=\"k\">폭발하고 산산조각 났습니다,\u003c/div>\u003cdiv class=\"e\">striking the viewers\u003c/div>\u003cdiv class=\"k\">시청자들을 강타하면서\u003c/div>\u003cdiv class=\"e\">dumb with shock.\u003c/div>\u003cdiv class=\"k\">충격으로 말문이 막히게.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 \u003cb class=\"key\">the spacecraft\u003c/b>가 시청자들을 놀라게 만드는 주체이므로 \u003cb class=\"key\">현재분사\u003c/b> \u003cb class=\"key\">striking\u003c/b>을 쓴 \u003cb class=\"key\">분사구문\u003c/b>입니다. 앞의 사건이 이어져 '시청자들을 충격으로 말문이 막히게 만들면서'라는 \u003cb class=\"key\">결과\u003c/b>를 나타냅니다.\u003c/div>","segs":[{"n":63,"text":"Seconds after its spectacular launch, 그것의 장관인 발사 후 몇 초 만에. the spacecraft with seven astronauts on board, 일곱 명의 우주비행사가 탑승한 우주선은. blew up and came apart, 폭발하고 산산조각 났습니다. striking the viewers, 시청자들을 강타하면서. dumb with shock, 충격으로 말문이 막히게.","hl":"ch"},{"n":64,"text":"이 문장은 우주선이 시청자들을 놀라게 만드는 주체이므로 현재분사 striking으로 이어지는 분사구문을 씁니다. striking the viewers dumb with shock은 시청자들을 충격으로 말문이 막히게 만들면서라는 결과의 의미예요. 앞에서는 우주선이 폭발하고 산산조각 났다는 사건이 먼저 제시됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 Seconds after its spectacular launch, the spacecraft with seven astronauts on board blew up and came apart, \u003cspan class=\"fx\">striking the viewers dumb with shock\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우주선이 발사 직후 폭발해 산산조각 났고, 그 장면을 본 사람들은 너무 놀라 말을 잃었어요. striking the viewers dumb with shock은 '시청자들을 충격으로 벙어리처럼 만들었다'는 강한 표현이에요. striking은 때린다기보다 강한 인상을 준다는 뜻으로 이해하세요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">striking the viewers dumb with shock\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">leaving the viewers speechless with shock\u003c/span>\u003cdiv class=\"w\">strike someone dumb을 leave someone speechless로 바꾸어 같은 의미를 자연스럽게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">blew up and came apart\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">exploded and broke into pieces\u003c/span>\u003cdiv class=\"w\">구동사를 일반 동사구로 풀어 뜻을 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">spectacular\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">dramatic\u003c/span>\u003cspan class=\"y-eq\">spectacular = dramatic\u003c/span>\u003cdiv class=\"w\">장관이고 극적인 느낌을 비슷하게 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">blow up\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">explode\u003c/span>\u003cspan class=\"y-eq\">blow up = explode\u003c/span>\u003cdiv class=\"w\">폭발하다는 구동사를 한 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dumb\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">speechless\u003c/span>\u003cspan class=\"y-eq\">dumb = speechless\u003c/span>\u003cdiv class=\"w\">충격으로 말을 못 하는 상태를 자연스럽게 표현합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Seconds after its dramatic launch, the spacecraft carrying seven astronauts exploded and broke into pieces, leaving the viewers speechless with shock.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"우주선이 발사 직후 폭발해 산산조각 났고, 그 장면을 본 사람들은 너무 놀라 말을 잃었어요. striking the viewers dumb with shock은 시청자들을 충격으로 벙어리처럼 만들었다는 강한 표현입니다. striking은 때린다기보다 강한 충격을 준다는 뜻으로 이해하세요.","hl":"mn"},{"n":66,"text":"striking the viewers dumb with shock은 leaving the viewers speechless with shock으로 바꿀 수 있어요. blew up and came apart는 exploded and broke into pieces로 풀 수 있습니다. 구동사를 일반 동사로 바꾸면 뜻이 더 분명해집니다.","hl":"rw"},{"n":67,"text":"spectacular은 dramatic, blow up은 explode로 바꿀 수 있어요. dumb은 speechless로 정리해 두세요. come apart는 break into pieces로도 기억해 두면 좋습니다.","hl":"ph"},{"n":68,"text":"같은 뜻을 이렇게 바꿔 말할 수 있어요. Seconds after its dramatic launch, the spacecraft carrying seven astronauts exploded and broke into pieces, leaving the viewers speechless with shock. striking을 leaving으로, dumb을 speechless로 풀어 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 The very real genetic differences between races or genders are insignificant \u003cspan class=\"fx\">compared with the similarities in our minds\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The very real genetic differences\u003c/div>\u003cdiv class=\"k\">아주 실제적인 유전적 차이는\u003c/div>\u003cdiv class=\"e\">between races or genders\u003c/div>\u003cdiv class=\"k\">인종이나 성별 사이의\u003c/div>\u003cdiv class=\"e\">are insignificant\u003c/div>\u003cdiv class=\"k\">중요하지 않습니다\u003c/div>\u003cdiv class=\"e\">compared with the similarities\u003c/div>\u003cdiv class=\"k\">유사성과 비교했을 때\u003c/div>\u003cdiv class=\"e\">in our minds.\u003c/div>\u003cdiv class=\"k\">우리 마음속에 있는.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">compared with\u003c/b>는 '~와 비교해 볼 때'라는 의미를 만드는 \u003cb class=\"key\">과거분사구\u003c/b>로, 주어인 \u003cb class=\"key\">genetic differences\u003c/b>가 비교되는 대상임을 나타냅니다. 즉 \u003cb class=\"key\">수동 의미의 분사구문\u003c/b>이 문장 전체에 비교의 \u003cb class=\"key\">조건\u003c/b>을 더합니다.\u003c/div>","segs":[{"n":69,"text":"The very real genetic differences, 아주 실제적인 유전적 차이는. between races or genders, 인종이나 성별 사이의. are insignificant, 중요하지 않습니다. compared with the similarities, 유사성과 비교했을 때. in our minds, 우리 마음속에 있는.","hl":"ch"},{"n":70,"text":"이 문장에서 compared with는 우리 마음속 유사성과 비교했을 때라는 의미를 만드는 과거분사구입니다. 주어인 genetic differences가 비교되는 대상이므로 수동의 느낌을 가진 분사구문으로 이해하면 됩니다. 이 분사구가 문장 전체에 비교의 조건을 더해 주고 있습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 The very real genetic differences between races or genders are insignificant \u003cspan class=\"fx\">compared with the similarities in our minds\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인종이나 성별 사이에 실제 유전적 차이가 있긴 하지만, 우리 마음속의 유사성에 비하면 아주 사소하다는 뜻이에요. very real을 강조해 차이가 없다기보다 차이의 중요성을 낮추는 표현입니다. 결국 인간의 공통점이 더 중요하다는 메시지예요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">compared with the similarities in our minds\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">when they are compared with the similarities in our minds\u003c/span>\u003cdiv class=\"w\">분사구를 비교의 부사절로 풀어 주어와 동사의 관계를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are insignificant\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">do not matter much\u003c/span>\u003cdiv class=\"w\">insignificant를 동사구로 바꾸어 '중요하지 않다'는 뜻을 쉽게 전달했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">insignificant\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">trivial\u003c/span>\u003cspan class=\"y-eq\">insignificant = trivial\u003c/span>\u003cdiv class=\"w\">사소하고 중요하지 않다는 뜻을 비슷하게 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">compared with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in comparison with\u003c/span>\u003cspan class=\"y-eq\">compared with = in comparison with\u003c/span>\u003cdiv class=\"w\">비교 표현을 좀 더 격식 있는 형태로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">similarity\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">commonality\u003c/span>\u003cspan class=\"y-eq\">similarity = commonality\u003c/span>\u003cdiv class=\"w\">공통점이라는 의미를 강조하는 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">When compared with the similarities in our minds, the very real genetic differences between races or genders do not matter much.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"인종이나 성별 사이에 실제 유전적 차이가 있긴 하지만, 우리 마음속의 유사성에 비하면 아주 사소하다는 뜻이에요. very real을 강조해서 차이가 없다기보다 차이의 중요성을 낮추고 있습니다. 결국 인간의 공통점이 더 중요하다는 메시지예요.","hl":"mn"},{"n":72,"text":"compared with the similarities in our minds는 when they are compared with the similarities in our minds로 풀 수 있어요. are insignificant는 do not matter much로 바꿀 수 있습니다. 비교의 분사구를 절로 바꾸고 형용사를 동사구로 풀어 쓴 표현이에요.","hl":"rw"},{"n":73,"text":"insignificant는 trivial, compared with는 in comparison with로 바꿀 수 있어요. similarity는 commonality로 정리해 두면 좋습니다. 비교와 차이를 다루는 글에서 자주 쓰이는 표현들입니다.","hl":"ph"},{"n":74,"text":"같은 뜻을 이렇게 바꿔 말할 수 있어요. When compared with the similarities in our minds, the very real genetic differences between races or genders do not matter much. 비교의 분사구를 절로 풀고 insignificant를 do not matter much로 바꾼 문장입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 Unit 32 부사 역할을 하는 분사구문의 의미\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>부사 역할의 분사구문은 \u003cb class=\"key\">접속사와 주어를 생략한 부사절\u003c/b>처럼 문맥에 의미를 더합니다.\u003c/li>\u003cli>분사의 주체가 주절 주어와 같고 능동이면 \u003cb class=\"key\">현재분사\u003c/b>, 수동이면 \u003cb class=\"key\">과거분사\u003c/b>를 씁니다.\u003c/li>\u003cli>해석은 \u003cb class=\"key\">이유·조건·양보·동시동작·결과\u003c/b> 중 문맥에 맞는 것으로 잡습니다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 부사 역할을 하는 분사구문을 살펴보았습니다. 분사구문은 접속사와 주어를 줄인 부사절처럼 문장 전체에 이유나 조건, 양보, 동시 동작, 결과 같은 의미를 더해 줍니다. 능동 관계면 현재분사, 수동 관계면 과거분사를 쓰는 점을 꼭 기억해 주세요. 해석은 하나로 외우지 말고 문맥에 맞게 잡는 연습을 계속해 보세요.","hl":"sum"}]}]});</script></body></html>
