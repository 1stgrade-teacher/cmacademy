  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

lecturePlayer(document.getElementById("app"),{"brand":"unit46","title":"마블레드 비교 구문 완전 정복","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마블레드\u003c/div>\u003ch1>마블레드 비교 구문 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>비교급과 than, 배수 표현, likely to, rather than을 활용해 긴 문장의 비교 기준과 대상을 정확히 파악한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마블레드 유닛의 비교 구문을 함께 정리해 볼 거예요. 이 유닛에서는 more than, less than, times more than, likely to, rather than 같은 표현이 반복해서 나옵니다. 겉으로는 길어 보여도 비교 대상만 정확히 찾으면 문장이 아주 또렷해지죠. 열두 문장을 하나씩 읽으면서 비교의 기준과 대상에 표시해 보세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">이 유닛의 중심은 \u003cb class=\"key\">비교급 + than\u003c/b>으로 두 대상의 정도를 비교하는 것입니다. \u003cb class=\"key\">much/far/even\u003c/b>은 비교급을 강조하고, \u003cb class=\"key\">배수 + 비교급 + than\u003c/b>은 차이의 크기를 수치로 보여 줍니다. \u003cb class=\"key\">be likely to\u003c/b>와 \u003cb class=\"key\">rather than\u003c/b>은 가능성과 대조를 나타내므로 앞뒤 비교 대상의 형태를 맞춰 읽어야 합니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 According to recent research, the universe is expanding \u003cspan class=\"fx\">faster today than it did in its infancy\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 The energy in sunlight arriving on earth contains \u003cspan class=\"fx\">about twelve thousand times more energy than humanity uses in a year\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 It is \u003cspan class=\"fx\">more important to be honorable and trustworthy than to look important\u003c/span> for one small minute.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Learning to study effectively \u003cspan class=\"fx\">is even more important than merely acquiring\u003c/span> a particular body of information.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Champion golfers are \u003cspan class=\"fx\">much less likely than average golfers to blame their problems on\u003c/span> the weather, the course, or chance factors. Instead they focus relentlessly on their own performance.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Medical procedures may sound \u003cspan class=\"fx\">scarier when presented in terms of the risk of dying, rather than the likelihood of coming through unharmed\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 We are always \u003cspan class=\"fx\">more anxious to be distinguished for a talent which we do not possess, than to be praised for the fifteen which we do possess\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 What some call health, if purchased by perpetual anxiety about diet, \u003cspan class=\"fx\">isn't much better than tedious disease\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 It takes \u003cspan class=\"fx\">two to six times more grain to produce food value through animals than to get the equivalent value directly from plants\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 Astronomers observe that the sun's diameter is \u003cspan class=\"fx\">more than one hundred times larger than the earth's\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Insights are \u003cspan class=\"fx\">far more likely to come when you are in the mind-wandering mode than in the task-focused mode\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12  Big cars that use a lot of petrol are \u003cspan class=\"fx\">less popular now than twenty years ago\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 비교급 뒤에 오는 than을 눈여겨보세요. than 앞에는 비교의 기준이 되고 than 뒤에는 비교 대상이 온다고 생각하면 됩니다. much, far, even은 비교급을 강하게 만들어 주고, 배수 표현은 차이가 몇 배인지를 알려 줘요. likely to와 rather than도 앞뒤에 오는 표현의 짝을 맞춰 읽는 것이 핵심입니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 According to recent research, the universe is expanding \u003cspan class=\"fx\">faster today than it did in its infancy\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">According to recent research,\u003c/div>\u003cdiv class=\"k\">최근의 연구에 의하면\u003c/div>\u003cdiv class=\"e\">the universe is expanding\u003c/div>\u003cdiv class=\"k\">우주는 팽창하고 있다\u003c/div>\u003cdiv class=\"e\">faster today\u003c/div>\u003cdiv class=\"k\">오늘날 더 빠르게\u003c/div>\u003cdiv class=\"e\">than it did in its infancy.\u003c/div>\u003cdiv class=\"k\">그것이 초기에 그랬던 것보다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>비교급 \u003cb class=\"key\">faster\u003c/b> 뒤에 \u003cb class=\"key\">than\u003c/b>을 두어 우주의 팽창 속도를 초기와 비교합니다. than 절의 \u003cb class=\"key\">did\u003c/b>는 앞의 is expanding을 대신하는 대동사입니다.\u003c/div>","segs":[{"n":3,"text":"According to recent research, 최근의 연구에 의하면. the universe is expanding, 우주는 팽창하고 있다. faster today, 오늘날 더 빠르게. than it did in its infancy, 그것이 초기에 그랬던 것보다","hl":"ch"},{"n":4,"text":"첫 번째 문장은 비교급 faster와 than을 함께 쓴 구조예요. 우주의 팽창 속도를 오늘날과 초기라는 두 시점으로 비교하죠. than 뒤의 did는 앞에 나온 is expanding을 반복하지 않고 받아 주는 대동사입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 According to recent research, the universe is expanding \u003cspan class=\"fx\">faster today than it did in its infancy\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우주는 지금 초기보다 더 빠르게 팽창하고 있다는 뜻입니다. 최근 연구 결과를 근거로 말하고 있죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">According to recent research\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Recent research shows that\u003c/span>\u003cdiv class=\"w\">연구 결과를 인용하는 표현을 더 직접적인 문장으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in its infancy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in its early stage\u003c/span>\u003cdiv class=\"w\">우주의 초기 단계라는 뜻을 더 쉽게 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">According to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as stated by\u003c/span>\u003cspan class=\"y-eq\">according to = as stated by\u003c/span>\u003cdiv class=\"w\">출처나 근거를 제시하는 표현을 같은 기능의 어구로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">expanding\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">growing larger\u003c/span>\u003cspan class=\"y-eq\">expand = grow larger\u003c/span>\u003cdiv class=\"w\">규모가 커진다는 뜻을 풀어 쓴 동의 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in its infancy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in its early stage\u003c/span>\u003cspan class=\"y-eq\">infancy = early stage\u003c/span>\u003cdiv class=\"w\">초기 단계라는 의미를 더 일반적인 어구로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Recent research shows that the universe is expanding more rapidly today than it was in its early stage.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 최근 연구에 따르면 우주가 초기보다 지금 더 빠르게 팽창한다는 뜻이에요. 그래서 과학적 근거를 먼저 제시하고 결론을 말하는 느낌입니다.","hl":"mn"},{"n":6,"text":"According to recent research는 Recent research shows that으로 바꿀 수 있어요. in its infancy는 in its early stage로 바꾸면 초기 단계라는 뜻이 더 쉽게 드러납니다.","hl":"rw"},{"n":7,"text":"According to는 as stated by로 바꿀 수 있고, expanding은 growing larger로 풀어 쓸 수 있습니다. infancy는 early stage로 정리해 두면 독해에서 바로 알아보기 좋아요.","hl":"ph"},{"n":8,"text":"패러프레이징 문장은 Recent research shows that the universe is expanding more rapidly today than it was in its early stage입니다. 같은 뜻을 더 직접적인 문장으로 바꾼 것이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 The energy in sunlight arriving on earth contains \u003cspan class=\"fx\">about twelve thousand times more energy than humanity uses in a year\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The energy in sunlight\u003c/div>\u003cdiv class=\"k\">햇빛 속의 에너지는\u003c/div>\u003cdiv class=\"e\">arriving on earth\u003c/div>\u003cdiv class=\"k\">지구에 도달하는\u003c/div>\u003cdiv class=\"e\">contains\u003c/div>\u003cdiv class=\"k\">포함하고 있다\u003c/div>\u003cdiv class=\"e\">about twelve thousand times more energy\u003c/div>\u003cdiv class=\"k\">약 12,000배 더 많은 에너지를\u003c/div>\u003cdiv class=\"e\">than humanity uses\u003c/div>\u003cdiv class=\"k\">인류가 사용하는 것보다\u003c/div>\u003cdiv class=\"e\">in a year.\u003c/div>\u003cdiv class=\"k\">일 년에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">배수 + 비교급 + than\u003c/b> 구조로, 햇빛 에너지의 양이 인류의 연간 사용량보다 약 12,000배 더 많음을 나타냅니다. \u003cb class=\"key\">arriving on earth\u003c/b>는 sunlight를 꾸미는 현재분사입니다.\u003c/div>","segs":[{"n":9,"text":"The energy in sunlight, 햇빛 속의 에너지는. arriving on earth, 지구에 도달하는. contains, 포함하고 있다. about twelve thousand times more energy, 약 12,000배 더 많은 에너지를. than humanity uses, 인류가 사용하는 것보다. in a year, 일 년에","hl":"ch"},{"n":10,"text":"두 번째 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">humanity\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">human beings\u003c/span>\u003cspan class=\"y-eq\">humanity = human beings\u003c/span>\u003cdiv class=\"w\">인류라는 집합적 표현을 사람들이라는 표현으로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The energy in sunlight that reaches the earth holds roughly twelve thousand times as much energy as humanity uses per year.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 지구에 닿는 햇빛에 담긴 에너지가 인류가 일 년 동안 쓰는 에너지보다 약 만 이천 배나 많다는 뜻이에요. 태양 에너지의 규모가 상상을 초월한다는 점을 강조하죠.","hl":"mn"},{"n":12,"text":"arriving on earth는 that reaches the earth로 바꿀 수 있어요. about twelve thousand times more energy than은 roughly twelve thousand times as much energy as로 바꾸면 뜻은 같으면서 배수 비교 구조가 더 분명해집니다.","hl":"rw"},{"n":13,"text":"arriving on earth는 reaching the earth로, contains는 holds로 바꿀 수 있습니다. humanity는 human beings로, in a year는 per year로 정리해 두면 좋아요.","hl":"ph"},{"n":14,"text":"패러프레이징 문장은 The energy in sunlight that reaches the earth holds roughly twelve thousand times as much energy as humanity uses per year입니다. sunlight 뒤에 that reaches the earth를 붙여 같은 내용을 풀어 쓴 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 It is \u003cspan class=\"fx\">more important to be honorable and trustworthy than to look important\u003c/span> for one small minute.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It is more important\u003c/div>\u003cdiv class=\"k\">더 중요하다\u003c/div>\u003cdiv class=\"e\">to be honorable and trustworthy\u003c/div>\u003cdiv class=\"k\">명예롭고 신뢰할 수 있는 것이\u003c/div>\u003cdiv class=\"e\">than to look important\u003c/div>\u003cdiv class=\"k\">중요해 보이는 것보다\u003c/div>\u003cdiv class=\"e\">for one small minute.\u003c/div>\u003cdiv class=\"k\">짧은 한 순간 동안\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">It is more important to A than to B\u003c/b> 구문으로, 진짜 가치 A와 겉모습 B를 비교합니다. \u003cb class=\"key\">to부정사\u003c/b> 두 개가 than 앞뒤에서 나란히 비교 대상이 됩니다.\u003c/div>","segs":[{"n":15,"text":"It is more important, 더 중요하다. to be honorable and trustworthy, 명예롭고 신뢰할 수 있는 것이. than to look important, 중요해 보이는 것보다. for one small minute, 짧은 한 순간 동안","hl":"ch"},{"n":16,"text":"세 번째 문장은 It is more important to A than to B 구조예요. 진짜 중요한 것 A와 겉으로 보이는 것 B를 to부정사로 나란히 놓고 비교합니다. 이때 than 뒤에도 to부정사가 와서 비교 대상의 형태를 맞춰 주는 점이 핵심이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 It is \u003cspan class=\"fx\">more important to be honorable and trustworthy than to look important\u003c/span> for one small minute.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>짧은 순간 대단해 보이는 것보다 명예롭고 신뢰할 수 있는 사람이 되는 것이 더 중요하다는 뜻입니다. 겉모습보다 인격을 중시하라는 메시지죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to be honorable and trustworthy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to act with honor and trustworthiness\u003c/span>\u003cdiv class=\"w\">성품을 나타내는 형용사 표현을 행동 중심의 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">for one small minute\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">for a brief moment\u003c/span>\u003cdiv class=\"w\">짧은 순간이라는 뜻을 더 자연스러운 어구로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">honorable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">worthy of respect\u003c/span>\u003cspan class=\"y-eq\">honorable = worthy of respect\u003c/span>\u003cdiv class=\"w\">존경받을 만하다는 뜻으로 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">trustworthy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">reliable\u003c/span>\u003cspan class=\"y-eq\">trustworthy = reliable\u003c/span>\u003cdiv class=\"w\">신뢰할 수 있다는 뜻을 가장 가까운 동의어로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">look important\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">appear important\u003c/span>\u003cspan class=\"y-eq\">look = appear\u003c/span>\u003cdiv class=\"w\">겉으로 보인다는 의미를 같은 뜻의 동사로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Being honorable and trustworthy matters more than appearing important for a brief moment.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 짧은 순간 대단해 보이는 것보다 명예롭고 신뢰할 수 있는 사람이 되는 것이 더 중요하다는 뜻이에요. 겉모습보다 인격과 신뢰를 중시하자는 메시지입니다.","hl":"mn"},{"n":18,"text":"to be honorable and trustworthy는 to act with honor and trustworthiness로 바꿀 수 있어요. for one small minute는 for a brief moment로 바꾸면 더 자연스럽게 짧은 순간이라는 뜻이 살아납니다.","hl":"rw"},{"n":19,"text":"honorable은 worthy of respect, trustworthy는 reliable로 정리할 수 있습니다. look important는 appear important로 바꿔 겉으로 보인다는 느낌을 살릴 수 있어요.","hl":"ph"},{"n":20,"text":"패러프레이징 문장은 Being honorable and trustworthy matters more than appearing important for a brief moment입니다. 동명사 주어를 써서 같은 뜻을 더 간결하게 만든 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Learning to study effectively \u003cspan class=\"fx\">is even more important than merely acquiring\u003c/span> a particular body of information.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Learning to study effectively\u003c/div>\u003cdiv class=\"k\">효과적으로 공부하는 것을 배우는 것은\u003c/div>\u003cdiv class=\"e\">is even more important\u003c/div>\u003cdiv class=\"k\">훨씬 더 중요하다\u003c/div>\u003cdiv class=\"e\">than merely acquiring\u003c/div>\u003cdiv class=\"k\">단지 습득하는 것보다\u003c/div>\u003cdiv class=\"e\">a particular body of information.\u003c/div>\u003cdiv class=\"k\">특정한 양의 정보를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>동명사 주어 \u003cb class=\"key\">Learning to study effectively\u003c/b>를 \u003cb class=\"key\">even more important than\u003c/b>으로 비교합니다. than 뒤의 \u003cb class=\"key\">merely acquiring\u003c/b>도 동명사로 맞춰 병렬 구조를 이룹니다.\u003c/div>","segs":[{"n":21,"text":"Learning to study effectively, 효과적으로 공부하는 것을 배우는 것은. is even more important, 훨씬 더 중요하다. than merely acquiring, 단지 습득하는 것보다. a particular body of information, 특정한 양의 정보를","hl":"ch"},{"n":22,"text":"네 번째 문장은 동명사 주어 Learning to study effectively를 even more important than으로 비교하는 구조예요. than 뒤에는 merely acquiring이라는 동명사가 와서 앞의 Learning to study와 형태를 맞춥니다. 즉 공부하는 방법을 배우는 일과 정보를 습득하는 일을 나란히 놓고 비교하는 문장입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Learning to study effectively \u003cspan class=\"fx\">is even more important than merely acquiring\u003c/span> a particular body of information.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>특정 정보를 많이 외우는 것보다 효과적으로 공부하는 방법을 배우는 것이 훨씬 중요하다는 뜻입니다. 단순 암기보다 학습 능력 자체를 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">merely acquiring\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">simply memorizing\u003c/span>\u003cdiv class=\"w\">정보를 얻는 행위를 암기 중심의 표현으로 바꾸어 대조를 선명하게 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a particular body of information\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a specific set of facts\u003c/span>\u003cdiv class=\"w\">특정한 정보의 묶음이라는 뜻을 더 쉬운 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">effectively\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">efficiently\u003c/span>\u003cspan class=\"y-eq\">effectively = efficiently\u003c/span>\u003cdiv class=\"w\">효과적으로라는 뜻을 능률적으로라는 가까운 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">acquiring\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">gaining\u003c/span>\u003cspan class=\"y-eq\">acquire = gain\u003c/span>\u003cdiv class=\"w\">습득한다는 의미를 같은 뜻의 동사로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a body of information\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a collection of facts\u003c/span>\u003cspan class=\"y-eq\">body of information = collection of facts\u003c/span>\u003cdiv class=\"w\">정보의 묶음이라는 표현을 더 구체적으로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Learning how to study efficiently is even more important than simply gaining a specific set of facts.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 특정 정보를 많이 외우는 것보다 효과적으로 공부하는 방법을 배우는 것이 훨씬 중요하다는 뜻이에요. 단순 암기보다 학습 능력 자체를 강조하는 말이죠.","hl":"mn"},{"n":24,"text":"merely acquiring은 simply memorizing으로 바꿔 암기 중심의 느낌을 살릴 수 있어요. a particular body of information은 a specific set of facts로 바꾸면 특정한 정보의 묶음이라는 뜻이 더 쉽게 전달됩니다.","hl":"rw"},{"n":25,"text":"effectively는 efficiently로, acquiring은 gaining으로 바꿀 수 있습니다. a body of information은 a collection of facts로 풀어 쓰면 독해할 때 의미가 분명해져요.","hl":"ph"},{"n":26,"text":"패러프레이징 문장은 Learning how to study efficiently is even more important than simply gaining a specific set of facts입니다. how to study를 써서 공부하는 방법을 배운다는 뜻을 자연스럽게 살린 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Champion golfers are \u003cspan class=\"fx\">much less likely than average golfers to blame their problems on\u003c/span> the weather, the course, or chance factors. Instead they focus relentlessly on their own performance.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Champion golfers are much less likely\u003c/div>\u003cdiv class=\"k\">챔피언 골프 선수들은 훨씬 덜 할 것 같다\u003c/div>\u003cdiv class=\"e\">than average golfers\u003c/div>\u003cdiv class=\"k\">일반 골프 선수들보다\u003c/div>\u003cdiv class=\"e\">to blame their problems\u003c/div>\u003cdiv class=\"k\">자신들의 문제를 탓할\u003c/div>\u003cdiv class=\"e\">on the weather, the course, or chance factors.\u003c/div>\u003cdiv class=\"k\">날씨, 코스, 또는 우연한 요소에\u003c/div>\u003cdiv class=\"e\">Instead\u003c/div>\u003cdiv class=\"k\">대신에\u003c/div>\u003cdiv class=\"e\">they focus relentlessly\u003c/div>\u003cdiv class=\"k\">그들은 가차없이 집중한다\u003c/div>\u003cdiv class=\"e\">on their own performance.\u003c/div>\u003cdiv class=\"k\">자신들의 실력에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">less likely than\u003c/b> 구조로 가능성을 비교하고, \u003cb class=\"key\">be likely to\u003c/b> 안에 \u003cb class=\"key\">blame A on B\u003c/b>가 들어갑니다. much는 less likely를 강조합니다.\u003c/div>","segs":[{"n":27,"text":"Champion golfers are much less likely, 챔피언 골프 선수들은 훨씬 덜 할 것 같다. than average golfers, 일반 골프 선수들보다. to blame their problems, 자신들의 문제를 탓할. on the weather, the course, or chance factors, 날씨, 코스, 또는 우연한 요소에. Instead, 대신에. they focus relentlessly, 그들은 가차없이 집중한다. on their own performance, 자신들의 실력에","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 much less likely than average golfers to blame 구조를 눈여겨보세요. be likely to 안에 blame A on B가 들어가서 문제를 무엇에 탓하는지를 말합니다. much는 less likely를 강조하고, Instead 뒤에서는 초점이 외부 요인에서 자기 실력으로 넘어갑니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Champion golfers are \u003cspan class=\"fx\">much less likely than average golfers to blame their problems on\u003c/span> the weather, the course, or chance factors. Instead they focus relentlessly on their own performance.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>챔피언 골퍼는 일반 골퍼보다 날씨나 코스, 운 같은 외부 요인을 탓할 가능성이 훨씬 낮습니다. 대신 자기 경기력에 철저히 집중한다는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">blame their problems on the weather\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">attribute their problems to the weather\u003c/span>\u003cdiv class=\"w\">탓한다는 표현을 원인으로 돌린다는 더 격식 있는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">focus relentlessly on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">concentrate intensely on\u003c/span>\u003cdiv class=\"w\">가차없이 집중한다는 뜻을 강한 집중이라는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">much less likely\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">far less probable\u003c/span>\u003cspan class=\"y-eq\">likely = probable\u003c/span>\u003cdiv class=\"w\">가능성이 더 낮다는 비교 표현을 같은 뜻의 형용사로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">blame A on B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">hold B responsible for A\u003c/span>\u003cspan class=\"y-eq\">blame A on B = hold B responsible for A\u003c/span>\u003cdiv class=\"w\">A를 B 탓으로 돌린다는 의미를 책임 소재 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">chance factors\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">random factors\u003c/span>\u003cspan class=\"y-eq\">chance = random\u003c/span>\u003cdiv class=\"w\">우연적인 요소라는 뜻을 같은 의미의 형용사로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Champion golfers are far less probable than average golfers to attribute their problems to the weather, the course, or random factors. Instead, they concentrate intensely on their own performance.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 챔피언 골퍼가 일반 골퍼보다 날씨나 코스, 운 같은 외부 요인을 탓할 가능성이 훨씬 낮다는 뜻이에요. 대신 자기 경기력에 철저히 집중한다는 점을 말합니다.","hl":"mn"},{"n":30,"text":"blame their problems on the weather는 attribute their problems to the weather로 바꿀 수 있어요. focus relentlessly on은 concentrate intensely on으로 바꾸면 강한 집중의 느낌이 살아납니다.","hl":"rw"},{"n":31,"text":"much less likely는 far less probable로 바꿀 수 있고, chance factors는 random factors로 정리할 수 있습니다. blame A on B는 hold B responsible for A로 풀어 쓸 수 있어요.","hl":"ph"},{"n":32,"text":"패러프레이징 문장은 Champion golfers are far less probable than average golfers to attribute their problems to the weather, the course, or random factors. Instead, they concentrate intensely on their own performance입니다. 같은 내용을 더 격식 있는 어구로 바꾼 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 Medical procedures may sound \u003cspan class=\"fx\">scarier when presented in terms of the risk of dying, rather than the likelihood of coming through unharmed\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdi 003cdiv class=\"w\">관점이나 기준을 나타내는 표현을 더 명확한 어구로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">coming through unharmed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">recovering safely\u003c/span>\u003cdiv class=\"w\">무사히 지나간다는 뜻을 회복이라는 맥락에 맞게 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in terms of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">with regard to\u003c/span>\u003cspan class=\"y-eq\">in terms of = with regard to\u003c/span>\u003cdiv class=\"w\">관점이나 기준을 나타내는 동의 어구로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the risk of dying\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the danger of death\u003c/span>\u003cspan class=\"y-eq\">risk = danger\u003c/span>\u003cdiv class=\"w\">죽음의 위험이라는 뜻을 같은 의미의 명사 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">coming through unharmed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">surviving safely\u003c/span>\u003cspan class=\"y-eq\">come through = survive\u003c/span>\u003cdiv class=\"w\">무사히 겪어낸다는 의미를 생존이라는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Medical procedures can sound more frightening when described from the perspective of the danger of death rather than the likelihood of recovering safely.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 같은 의료 시술도 죽을 위험으로 설명하면 무사히 회복될 가능성으로 설명할 때보다 더 무섭게 들릴 수 있다는 뜻이에요. 표현 방식이 느낌을 바꾼다는 점을 말합니다.","hl":"mn"},{"n":36,"text":"in terms of는 from the perspective of로 바꿀 수 있어요. coming through unharmed는 recovering safely로 바꾸면 회복이라는 맥락이 더 분명해집니다.","hl":"rw"},{"n":37,"text":"in terms of는 with regard to로, the risk of dying는 the danger of death로 바꿀 수 있습니다. coming through unharmed는 surviving safely로 정리해 두세요.","hl":"ph"},{"n":38,"text":"패러프레이징 문장은 Medical procedures can sound more frightening when described from the perspective of the danger of death rather than the likelihood of recovering safely입니다. 같은 내용을 관점과 회복이라는 표현으로 다시 쓴 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 We are always \u003cspan class=\"fx\">more anxious to be distinguished for a talent which we do not possess, than to be praised for the fifteen which we do possess\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We are always more anxious\u003c/div>\u003cdiv class=\"k\">우리는 항상 더 열망한다\u003c/div>\u003cdiv class=\"e\">to be distinguished\u003c/div>\u003cdiv class=\"k\">유명해지기를\u003c/div>\u003cdiv class=\"e\">for a talent which we do not possess,\u003c/div>\u003cdiv class=\"k\">우리가 갖지 않은 한 가지 재능으로\u003c/div>\u003cdiv class=\"e\">than to be praised\u003c/div>\u003cdiv class=\"k\">칭찬받기보다\u003c/div>\u003cdiv class=\"e\">for the fifteen which we do possess.\u003c/div>\u003cdiv class=\"k\">우리가 가진 열다섯 가지 재능으로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">more anxious to A than to B\u003c/b>로 두 욕망을 비교합니다. \u003cb class=\"key\">which\u003c/b>는 각각 a talent와 the fifteen을 꾸미는 관계대명사입니다.\u003c/div>","segs":[{"n":39,"text":"We are always more anxious, 우리는 항상 더 열망한다. to be distinguished, 유명해지기를. for a talent which we do not possess, 우리가 갖지 않은 한 가지 재능으로. than to be praised, 칭찬받기보다. for the fifteen which we do possess, 우리가 가진 열다섯 가지 재능으로","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 more anxious to A than to B 구조로 두 바람을 비교합니다. a talent which we do not possess와 the fifteen which we do possess가 각각 관계대명사 which로 꾸며지죠. 갖지 않은 재능과 실제로 가진 재능을 나란히 놓아 아이러니를 만듭니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003c  class=\"ar\">→\u003c/span>\u003cspan class=\"t\">obtain the same value\u003c/span>\u003cdiv class=\"w\">동등한 가치를 얻는다는 뜻을 같은 의미의 어구로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">It takes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">It requires\u003c/span>\u003cspan class=\"y-eq\">take = require\u003c/span>\u003cdiv class=\"w\">필요로 한다는 뜻을 같은 의미의 동사로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">food value\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">nutritional value\u003c/span>\u003cspan class=\"y-eq\">food value = nutritional value\u003c/span>\u003cdiv class=\"w\">식품으로서의 가치라는 뜻을 더 분명한 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the equivalent value\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the same value\u003c/span>\u003cspan class=\"y-eq\">equivalent = same\u003c/span>\u003cdiv class=\"w\">동등한 가치라는 뜻을 쉬운 표현으로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">It requires two to six times as much grain to create nutritional value through animals as to obtain the same value directly from plants.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 동물을 통해 영양가를 얻으려면 식물에서 직접 같은 영양가를 얻을 때보다 두 배에서 여섯 배 많은 곡물이 필요하다는 뜻이에요. 육류 생산의 비효율성을 강조합니다.","hl":"mn"},{"n":54,"text":"produce food value는 create nutritional value로 바꿀 수 있어요. get the equivalent value는 obtain the same value로 바꾸면 동등한 가치를 얻는다는 뜻이 더 분명해집니다.","hl":"rw"},{"n":55,"text":"It takes는 It requires로 바꿀 수 있고, food value는 nutritional value로 정리할 수 있습니다. the equivalent value는 the same value로 풀어 쓰면 좋아요.","hl":"ph"},{"n":56,"text":"패러프레이징 문장은 It requires two to six times as much grain to create nutritional value through animals as to obtain the same value di ocused on a task.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 통찰력이 과제에 집중하는 상태보다 멍하니 생각이 떠도는 상태에서 훨씬 더 잘 생긴다는 뜻이에요. 집중을 풀어 주는 시간의 가치를 말합니다.","hl":"mn"},{"n":66,"text":"mind-wandering mode는 daydreaming state로 바꿀 수 있어요. task-focused mode는 concentrated working state로 바꾸면 두 상태의 대조가 더 분명해집니다.","hl":"rw"},{"n":67,"text":"insights는 sudden understandings로 풀어 쓸 수 있고, far more likely는 much more probable로 바꿀 수 있습니다. mind-wandering은 daydreaming으로 정리해 두세요.","hl":"ph"},{"n":68,"text":"패러프레이징 문장은 Insights are much more likely to arise when you are daydreaming than when you are focused on a task입니다. 두 상태를 when절로 나란히 비교해 같은 뜻을 전달하는 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12  Big cars that use a lot of petrol are \u003cspan class=\"fx\">less popular now than twenty years ago\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Big cars\u003c/div>\u003cdiv class=\"k\">대형차들은\u003c/div>\u003cdiv class=\"e\">that use a lot of petrol\u003c/div>\u003cdiv class=\"k\">많은 휘발유를 사용하는\u003c/div>\u003cdiv class=\"e\">are less popular now\u003c/div>\u003cdiv class=\"k\">현재 덜 인기가 있다\u003c/div>\u003cdiv class=\"e\">than twenty years ago.\u003c/div>\u003cdiv class=\"k\">이십 년 전보다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">less popular now than\u003c/b>으로 현재와 과거의 인기를 비교합니다. \u003cb class=\"key\">that use a lot of petrol\u003c/b>은 Big cars를 꾸미는 관계절입니다.\u003c/div>","segs":[{"n":69,"text":"Big cars, 대형차들은. that use a lot of petrol, 많은 휘발유를 사용하는. are less popular now, 현재 덜 인기가 있다. than twenty years ago, 이십 년 전보다","hl":"ch"},{"n":70,"text":"열두 번째 문장은 less popular now than twenty years ago 구조로 현재와 과거의 인기를 비교합니다. Big cars that use a lot of petrol에서 that절은 Big cars를 꾸며 주는 관계절이에요. 비교 대상은 now와 twenty years ago이고, 인기의 정도는 less popular로 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12  Big cars that use a lot of petrol are \u003cspan class=\"fx\">less popular now than twenty years ago\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>휘발유를 많이 쓰는 대형차는 이십 년 전보다 지금 인기가 덜하다는 뜻입니다. 연료 효율과 환경에 대한 관심이 높아진 흐름을 보여 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">use a lot of petrol\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">consume a lot of fuel\u003c/span>\u003cdiv class=\"w\">휘발유를 많이 쓴다는 표현을 연료를 많이 소비한다는 뜻으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">less popular\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">not as popular\u003c/span>\u003cdiv class=\"w\">덜 인기 있다는 비교 표현을 not as popular as 구조로 바꿀 수 있게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a lot of petrol\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">much fuel\u003c/span>\u003cspan class=\"y-eq\">petrol = fuel\u003c/span>\u003cdiv class=\"w\">휘발유라는 구체적 연료를 더 일반적인 연료 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">less popular\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">not as popular\u003c/span>\u003cspan class=\"y-eq\">less popular = not as popular\u003c/span>\u003cdiv class=\"w\">덜 인기 있다는 비교 표현을 부정 비교 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">now\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">these days\u003c/span>\u003cspan class=\"y-eq\">now = these days\u003c/span>\u003cdiv class=\"w\">현재라는 뜻을 더 구어적인 시간 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Large cars that consume a lot of fuel are not as popular these days as they were twenty years ago.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 휘발유를 많이 쓰는 대형차가 이십 년 전보다 지금 인기가 덜하다는 뜻이에요. 연료 효율과 환경에 대한 관심이 높아진 흐름을 보여 줍니다.","hl":"mn"},{"n":72,"text":"use a lot of petrol은 consume a lot of fuel로 바꿀 수 있어요. less popular는 not as popular로 바꾸면 부정 비교 구조로 같은 뜻을 표현할 수 있습니다.","hl":"rw"},{"n":73,"text":"a lot of petrol은 much fuel로, less popular는 not as popular로 바꿀 수 있습니다. now는 these days로 정리해 두면 현재라는 느낌이 살아나요.","hl":"ph"},{"n":74,"text":"패러프레이징 문장은 Large cars that consume a lot of fuel are not as popular these days as they were twenty years ago입니다. less popular를 not as popular as 구조로 바꿔 같은 뜻을 전달하는 문장이에요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">비교급 + than\u003c/b>은 두 대상의 정도를 비교한다.\u003c/li>\u003cli>\u003cb class=\"key\">much/far/even + 비교급\u003c/b>은 비교급을 강조한다.\u003c/li>\u003cli>\u003cb class=\"key\">배수 + 비교급 + than\u003c/b>은 차이의 크기를 수치로 나타낸다.\u003c/li>\u003cli>\u003cb class=\"key\">be likely to\u003c/b>는 가능성을, \u003cb class=\"key\">rather than\u003c/b>은 대조를 나타낸다.\u003c/li>\u003cli>\u003cb class=\"key\">to부정사\u003c/b>끼리 비교할 때는 than 앞뒤 형태를 맞춘다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 마블레드 유닛에서 비교 구문을 집중적으로 봤어요. 비교급 뒤의 than, much나 far 같은 강조어, 배수 표현, likely to, rather than을 중심으로 읽으면 긴 문장도 구조가 보입니다. 특히 than 앞뒤의 대상과 to부정사, 동명사의 형태가 맞는지 꼭 확인하세요. 열두 문장을 소리 내어 다시 읽으면서 비교의 기준을 찾아보면 훨씬 오래 기억에 남을 거예요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
