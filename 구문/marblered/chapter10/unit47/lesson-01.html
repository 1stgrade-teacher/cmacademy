    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

lecturePlayer(document.getElementById("app"),{"brand":"unit47","title":"마블레드 구문 분석 강의","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마블레드\u003c/div>\u003ch1>마블레드 구문 분석 강의\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>비교급 구문과 no more than 계열 표현을 직독직해로 익히고, 의미를 바꿔 말할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"오늘은 마블레드 유닛의 비교 구문을 배워 볼 거예요. the 비교급 the 비교급, no more than, no less than처럼 시험에 자주 나오는 표현을 정리하죠. 먼저 직독직해로 문장을 끊어 읽고, 그다음 의미와 패러프레이징까지 차근차근 살펴볼게요. 비교 대상이 무엇인지 표시하면서 따라와 주세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">이 유닛의 핵심은 \u003cb class=\"key\">the 비교급, the 비교급\u003c/b>과 \u003cb class=\"key\">no more than\u003c/b> 계열의 비교 구문입니다. \u003cb class=\"key\">the more ... the more ...\u003c/b>는 앞의 정도가 커질수록 뒤의 정도도 커진다는 비례 관계를 나타내고, \u003cb class=\"key\">no more ... than\u003c/b>은 앞뒤를 모두 부정해 'B가 아닌 것만큼 A도 아니다'로 해석합니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">The more we use certain parts of our brain, the more developed and efficient those parts of the brain become.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 A collection of facts \u003cspan class=\"fx\">is no more science than a dictionary is poetry\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 According to Einstein's Special Theory of Relativity, \u003cspan class=\"fx\">the faster a spaceship goes, the slower its clock ticks and the shorter its length in the direction of travel gets\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Man \u003cspan class=\"fx\">is no more than a reed\u003c/span>, the weakest in nature, but he is a thinking reed.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Air pollution \u003cspan class=\"fx\">does no less harm to birds and animals than it does to human beings\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Anyone who has tried to complete a jigsaw puzzle as the clock ticked on toward a deadline knows that \u003cspan class=\"fx\">the more they struggle to find the missing pieces, the harder it is to find them\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 We have called upon the people to set their air conditioners \u003cspan class=\"fx\">at no lower than 28 degrees Celsius in the summer and no higher than 20 in the winter\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">We can no more explain a passion to a person who has never experienced it than we can explain light to the blind.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 Organic farmers grow \u003cspan class=\"fx\">crops that are no less plagued by pests than those of conventional farmers\u003c/span>; insects generally do not discriminate between organic and conventional as well as we do.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">The closer the people in the world become, the more frequently they are exposed to people from other cultures.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 If all our knowledge stopped at the level of the senses, \u003cspan class=\"fx\">we would be no better off than the subhuman members of the animal kingdom\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">Mind is not to be found in molecules any more than the works of Shakespeare were to be found in his genes.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"이 유닛의 핵심은 비교 표현이에요. the 비교급 the 비교급은 앞의 정도가 커질수록 뒤의 정도도 커진다는 비례 관계를 만들어 줍니다. no more than 계열은 겉으로 보면 비교 같지만 실제로는 앞뒤를 모두 부정하거나 단지 그 정도에 불과하다는 뜻을 강조해요. 소리 내어 읽으면서 어떤 대상이 무엇과 비교되는지 꼭 확인해 보세요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">The more we use certain parts of our brain, the more developed and efficient those parts of the brain become.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The more we use certain parts of our brain,\u003c/div>\u003cdiv class=\"k\">우리가 우리 뇌의 특정 부분들을 더 많이 사용할수록,\u003c/div>\u003cdiv class=\"e\">the more developed and efficient\u003c/div>\u003cdiv class=\"k\">더욱더 발달하고 효율적인\u003c/div>\u003cdiv class=\"e\">those parts of the brain become.\u003c/div>\u003cdiv class=\"k\">뇌의 그 부분들은 된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">the 비교급, the 비교급\u003c/b> 구문으로, 앞의 사용량이 증가할수록 뒤의 발달과 효율성도 함께 증가한다는 비례 관계를 나타냅니다. 뒤쪽은 \u003cb class=\"key\">become + 형용사\u003c/b> 보어 구조로 those parts of the brain의 상태 변화를 설명합니다.\u003c/div>","segs":[{"n":3,"text":"The more we use certain parts of our brain, 우리가 우리 뇌의 특정 부분들을 더 많이 사용할수록. the more developed and efficient, 더욱더 발달하고 효율적인. those parts of the brain become, 뇌의 그 부분들은 된다.","hl":"ch"},{"n":4,"text":"첫 번째 문장은 the 비교급 the 비교급 구문이에요. 앞에서 뇌를 더 많이 쓸수록 뒤에서 뇌의 그 부분이 더 발달하고 효율적이 된다고 말하죠. 뒤에는 become 다음에 형용사가 와서 상태 변화를 보여 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">The more we use certain parts of our brain, the more developed and efficient those parts of the brain become.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>뇌를 많이 쓸수록 그 부분이 더 발달하고 효율적이 된다는 뜻이에요. 즉, 연습과 사용이 뇌 기능을 키운다는 긍정적 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The more we use certain parts of our brain\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">As we use certain parts of our brain more\u003c/span>\u003cdiv class=\"w\">the 비교급 구문을 as 절로 바꿔 같은 비례 의미를 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the more developed and efficient those parts of the brain become\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">those parts of the brain become increasingly developed and efficient\u003c/span>\u003cdiv class=\"w\">비교급 대신 increasingly를 써서 점진적 변화를 강조합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">certain parts of our brain\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">particular areas of our brain\u003c/span>\u003cspan class=\"y-eq\">certain = particular\u003c/span>\u003cdiv class=\"w\">certain을 particular로 바꿔 특정 부분이라는 뜻을 살립니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">developed and efficient\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">advanced and effective\u003c/span>\u003cspan class=\"y-eq\">developed = advanced\u003c/span>\u003cdiv class=\"w\">형용사 쌍을 바꿔 발달과 효율성의 의미를 유지합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">become\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">grow\u003c/span>\u003cspan class=\"y-eq\">become = grow\u003c/span>\u003cdiv class=\"w\">grow를 써서 상태 변화가 점차 진행되는 느낌을 더합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">As we use particular areas of our brain more, those areas grow increasingly advanced and effective.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 뇌도 많이 쓸수록 좋아진다는 뜻이에요. 연습하고 사용하는 만큼 그 부분이 더 발달하고 효율적이 된다는 긍정적인 메시지죠.","hl":"mn"},{"n":6,"text":"the more 구문을 as 절로 바꾸면 As we use certain parts of our brain more가 됩니다. 또는 increasingly developed and efficient처럼 increasingly를 써서 점진적인 변화를 살릴 수 있어요.","hl":"rw"},{"n":7,"text":"certain parts는 particular areas로 바꿀 수 있고 developed and efficient는 advanced and effective로 바꿀 수 있어요. become은 grow로 바꿔도 상태 변화의 느낌이 잘 살아납니다.","hl":"ph"},{"n":8,"text":"전체 뜻을 바꿔 말하면 As we use particular areas of our brain more, those areas grow increasingly advanced and effective예요. 같은 내용을 더 자연스럽게 정리한 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 A collection of facts \u003cspan class=\"fx\">is no more science than a dictionary is poetry\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A collection of facts\u003c/div>\u003cdiv class=\"k\">사실들의 모음은\u003c/div>\u003cdiv class=\"e\">is no more science\u003c/div>\u003cdiv class=\"k\">과학이 아니다\u003c/div>\u003cdiv class=\"e\">than a dictionary is poetry.\u003c/div>\u003cdiv class=\"k\">사전이 시가 아닌 것만큼.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">no more A than B\u003c/b>는 'B가 A가 아닌 것과 마찬가지로 A도 아니다'라는 뜻으로, 앞뒤를 모두 부정하는 강조 비교입니다. 여기서는 사실의 모음이 과학이 아니라는 점을 사전이 시가 아니라는 점에 빗대어 강조합니다.\u003c/div>","segs":[{"n":9,"text":"A collection of facts, 사실들의 모음은. is no more science, 과학이 아니다. than a dictionary is poetry, 사전이 시가 아닌 것만큼.","hl":"ch"},{"n":10,"text":"두 번째 문장은 no more A than B 구문이에요. 사전이 시가 아닌 것과 마찬가지로 사실들의 모음도 과학이 아니라는 뜻으로, 앞과 뒤를 모두 부정해요. no more science than a dictionary is poetry에서 비교의 틀을 확인하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 A collection of facts \u003cspan class=\"fx\">is no more science than a dictionary is poetry\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>단순히 사실을 모은 것은 과학이 아니라는 뜻이에요. 과학에는 체계와 원리, 검증 같은 것이 필요하다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">A collection of facts is no more science than a dictionary is poetry.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">A collection of facts is not science, just as a dictionary is not poetry.\u003c/span>\u003cdiv class=\"w\">no more than을 not과 just as로 풀어 써서 부정 비교를 분명히 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">A collection of facts is no more science\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">A collection of facts is far from science\u003c/span>\u003cdiv class=\"w\">far from을 써서 전혀 과학이 아니라는 강조를 살립니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a collection of facts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a mere accumulation of facts\u003c/span>\u003cspan class=\"y-eq\">collection = accumulation\u003c/span>\u003cdiv class=\"w\">mere를 더해 단순히 모은 것이라는 뉘앙스를 강화합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">no more science than\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">not science any more than\u003c/span>\u003cspan class=\"y-eq\">no more ... than = not ... any more than\u003c/span>\u003cdiv class=\"w\">같은 부정 비교 구조로 바꿔 해석을 돕습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a dictionary is poetry\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a dictionary is a poem\u003c/span>\u003cspan class=\"y-eq\">poetry = a poem\u003c/span>\u003cdiv class=\"w\">시라는 의미를 유지하며 명사 형태를 바꿉니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Just as a dictionary is not poetry, a mere accumulation of facts is not science.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 사실을 많이 모은다고 해서 바로 과학이 되는 것은 아니라는 뜻이에요. 과학에는 체계와 원리 그리고 검증 같은 것이 필요하다는 점을 강조하죠.","hl":"mn"},{"n":12,"text":"not science just as a dictionary is not poetry로 풀어 쓸 수 있어요. 또는 far from science처럼 표현해서 전혀 과학이 아니라는 느낌을 살릴 수도 있습니다.","hl":"rw"},{"n":13,"text":"a collection of facts는 a mere accumulation of facts로 바꿀 수 있어요. no more science than은 not science any more than으로 바꿔 같은 부정 비교를 나타낼 수 있습니다.","hl":"ph"},{"n":14,"text":"전체 문장을 바꾸면 Just as a dictionary is not poetry, a mere accumulation of facts is not science예요. 사전과 시의 비유를 그대로 살린 패러프레이징이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 According to Einstein's Special Theory of Relativity, \u003cspan class=\"fx\">the faster a spaceship goes, the slower its clock ticks and the shorter its length in the direction of travel gets\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">According to Einstein's Special Theory of Relativity,\u003c/div>\u003cdiv class=\"k\">아인슈타인의 특수 상대성 이론에 따르면,\u003c/div>\u003cdiv class=\"e\">the faster a spaceship goes,\u003c/div>\u003cdiv class=\"k\">우주선이 더 빠르게 갈수록,\u003c/div>\u003cdiv class=\"e\">the slower its clock ticks\u003c/div>\u003cdiv class=\"k\">그것의 시계는 더 느리게 움직이고\u003c/div>\u003cdiv class=\"e\">and the shorter its length in the direction of travel gets.\u003c/div>\u003cdiv class=\"k\">이동 방향의 그것의 길이는 더 짧아진다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">the 비교급, the 비교급\u003c/b> 구문이 두 개의 결과절과 연결된 형태입니다. 속도가 증가할수록 시계의 속도는 감소하고 이동 방향의 길이는 짧아진다는 비례와 반비례 관계를 동시에 나타냅니다.\u003c/div>","segs":[{"n":15,"text":"According to Einstein's Special Theory of Relativity, 아인슈타인의 특수 상대성 이론에 따르면. the faster a spaceship goes, 우주선이 더 빠르게 갈수록. the slower its clock ticks, 그것의 시계는 더 느리게 움직이고. and the shorter its length in the direction of travel gets, 이동 방향의 그것의 길이는 더 짧아진다.","hl":"ch"},{"n":16,"text":"세 번째 문장은 the 비교급 the 비교급 구문이 두 개의 결과와 연결되어 있어요. 우주선이 더 빠르게 갈수록 시계는 더 느리게 움직이고 이동 방향의 길이는 더 짧아진다고 말합니다. and로 두 결과를 나란히 묶은 구조를 눈여겨보세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 According to Einstein's Special Theory of Relativity, \u003cspan class=\"fx\">the faster a spaceship goes, the slower its clock ticks and the shorter its length in the direction of travel gets\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우주선이 빨라질수록 시간은 느리게 흐르고 길이는 줄어든다는 상대성 이론의 설명이에요. 일상 감각과 다른 과학적 원리를 비교급으로 표현한 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the faster a spaceship goes, the slower its clock ticks and the shorter its length in the direction of travel gets\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">As a spaceship goes faster, its clock ticks more slowly and its length in the direction of travel gets shorter\u003c/span>\u003cdiv class=\"w\">the 비교급 구문을 as 절과 비교급 부사로 풀어 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the faster a spaceship goes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The greater the speed of a spaceship\u003c/span>\u003cdiv class=\"w\">속도라는 명사 중심으로 바꿔 같은 비례 관계를 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">According to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">As stated by\u003c/span>\u003cspan class=\"y-eq\">according to = as stated by\u003c/span>\u003cdiv class=\"w\">출처를 제시하는 표현을 바꿔 같은 의미를 전합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in the direction of travel\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">along its direction of motion\u003c/span>\u003cspan class=\"y-eq\">direction of travel = direction of motion\u003c/span>\u003cdiv class=\"w\">travel을 motion으로 바꿔 과학적 문맥을 살립니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ticks\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">runs\u003c/span>\u003cspan class=\"y-eq\">ticks = runs\u003c/span>\u003cdiv class=\"w\">시계가 움직인다는 의미를 runs로 자연스럽게 바꿉니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">As stated by Einstein's Special Theory of Relativity, as a spaceship moves faster, its clock runs more slowly and its length along the direction of motion becomes shorter.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 우주선이 빨라질수록 시간은 느리게 흐르고 길이는 줄어든다는 상대성 이론의 설명이에요. 일상 감각과 다른 과학적 원리를 비교급으로 표현한 문장이죠.","hl":"mn"},{"n":18,"text":"As a spaceship goes faster, its clock ticks more slowly and its length in the direction of travel gets shorter로 바꿀 수 있어요. The greater the speed of a spaceship으로 시작하는 형태도 같은 뜻을 담습니다.","hl":"rw"},{"n":19,"text":"According to는 As stated by로 바꿀 수 있어요. in the direction of travel은 along its direction of motion으로 바꿀 수 있고 ticks는 runs로 바꿔도 자연스럽습니다.","hl":"ph"},{"n":20,"text":"전체 문장을 바꾸면 As stated by Einstein's Special Theory of Relativity, as a spaceship moves faster, its clock runs more slowly and its length along the direction of motion becomes shorter예요. 과학적인 의미를 그대로 유지한 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Man \u003cspan class=\"fx\">is no more than a reed\u003c/span>, the weakest in nature, but he is a thinking reed.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Man is no more than a reed,\u003c/div>\u003cdiv class=\"k\">인간은 갈대에 불과하다,\u003c/div>\u003cdiv class=\"e\">the weakest in nature,\u003c/div>\u003cdiv class=\"k\">자연에서 가장 연약한 존재인,\u003c/div>\u003cdiv class=\"e\">but he is a thinking reed.\u003c/div>\u003cdiv class=\"k\">그러나 그는 생각하는 갈대이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">no more than\u003c/b>은 '단지 ~에 불과하다'로, 수량이나 존재의 한계를 강하게 제한합니다. 이 문장에서는 인간을 갈대에 비유하며 연약한 존재임을 강조합니다.\u003c/div>","segs":[{"n":21,"text":"Man is no more than a reed, 인간은 갈대에 불과하다. the weakest in nature, 자연에서 가장 연약한 존재인. but he is a thinking reed, 그러나 그는 생각하는 갈대이다.","hl":"ch"},{"n":22,"text":"네 번째 문장은 no more than이 나와요. 여기서는 단지 갈대에 불과하다는 뜻으로, 인간의 연약함을 강하게 제한하는 표현이에요. but 뒤에서 생각하는 갈대라고 말하며 연약함과 사유 능력을 대비합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Man \u003cspan class=\"fx\">is no more than a reed\u003c/span>, the weakest in nature, but he is a thinking reed.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인간은 자연 속에서 갈대처럼 연약하지만 생각할 수 있는 존재라는 뜻이에요. 연약함과 사유 능력의 대비가 핵심입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Man is no more than a reed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Man is nothing but a reed\u003c/span>\u003cdiv class=\"w\">no more than 표현할 수 있습니다.","hl":"ph"},{"n":26,"text":"전체 문장을 바꾸면 Man is nothing but a weak reed in nature, yet he is a reed capable of thought예요. 연약함과 사유 능력의 대비를 잘 살린 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Air pollution \u003cspan class=\"fx\">does no less harm to birds and animals than it does to human beings\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Air pollution does no less harm\u003c/div>\u003cdiv class=\"k\">대기 오염은 조금도 덜한 해를 끼치지 않는다\u003c/div>\u003cdiv class=\"e\">to birds and animals\u003c/div>\u003cdiv class=\"k\">조류와 동물에게\u003c/div>\u003cdiv class=\"e\">than it does to human beings.\u003c/div>\u003cdiv class=\"k\">그것이 인간에게 끼치는 것보다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">no less ... than\u003c/b>은 '~보다 덜하지 않다', 즉 '~만큼 많이, 마찬가지로'라는 뜻의 강조 비교입니다. 대기 오염이 동물에게 끼치는 해가 인간에게 끼치는 해보다 결코 적지 않다는 점을 강조합니다.\u003c/div>","segs":[{"n":27,"text":"Air pollution does no less harm, 대기 오염은 조금도 덜한 해를 끼치지 않는다. to birds and animals, 조류와 동물에게. than it does to human beings, 그것이 인간에게 끼치는 것보다.","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 no less A than B 구문이에요. 대기 오염이 동물에게 끼치는 해가 인간에게 끼치는 해보다 결코 적지 않다는 뜻으로, B만큼 A도 심하다는 강조 비교입니다. does harm to 구조와 than 이하를 함께 보면 이해가 쉬워요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Air pollution \u003cspan class=\"fx\">does no less harm to birds and animals than it does to human beings\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>대기 오염은 인간뿐 아니라 새와 동물에게도 똑같이 심각한 피해를 준다는 뜻이에요. 피해 대상이 동물까지 넓다는 경고입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\"> 3c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 We have called upon the people to set their air conditioners \u003cspan class=\"fx\">at no lower than 28 degrees Celsius in the summer and no higher than 20 in the winter\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We have called upon the people\u003c/div>\u003cdiv class=\"k\">우리는 사람들에게 요청해왔다\u003c/div>\u003cdiv class=\"e\">to set their air conditioners\u003c/div>\u003cdiv class=\"k\">그들의 에어컨을 설정하도록\u003c/div>\u003cdiv class=\"e\">at no lower than 28 degrees Celsius in the summer\u003c/div>\u003cdiv class=\"k\">여름에는 섭씨 28도보다 조금도 낮지 않게\u003c/div>\u003cdiv class=\"e\">and no higher than 20 in the winter.\u003c/div>\u003cdiv class=\"k\">그리고 겨울에는 20도보다 조금도 높지 않게.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">no lower than\u003c/b>은 '~보다 낮지 않게', \u003cb class=\"key\">no higher than\u003c/b>은 '~보다 높지 않게'로 최소 기준과 최대 기준을 강조합니다. set A at B 구조에서 목표 온도의 범위를 제시합니다.\u003c/div>","segs":[{"n":39,"text":"We have called upon the people, 우리는 사람들에게 요청해왔다. to set their air conditioners, 그들의 에어컨을 설정하도록. at no lower than 28 degrees Celsius in the summer, 여름에는 섭씨 28도보다 조금도 낮지 않게. and no higher than 20 in the winter, 그리고 겨울에는 20도보다 조금도 높지 않게.","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 no lower than과 no higher than이 나와요. no lower than은 그보다 낮지 않게, no higher than은 그보다 높지 않게라는 뜻으로 최소 기준과 최대 기준을 강조합니다. set their air conditioners at 뒤에 목표 온도가 이어지는 구조예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 We have called upon the people to set their air conditioners \u003cspan class=\"fx\">at no lower than 28 degrees Celsius in the summer and no higher than 20 in the winter\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>여름에는 섭씨 28도 이상, 겨울에는 20도 이하로 에어컨을 설정하자는 공공 캠페인 문장이에요. 에너지 절약과 적정 실내 온도를 권장합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at no lower than 28 degrees Celsius\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at a minimum of 28 degrees Celsius\u003c/span>\u003cdiv class=\"w\">no lower than을 minimum으로 바꿔 최소 기준을 분명히 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">no higher than 20\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at a maximum of 20 degrees Celsius\u003c/span>\u003cdiv class=\"w\">no higher than을 maximum으로 바꿔 최대 기준을 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">called upon\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">urged\u003c/span>\u003cspan class=\"y-eq\">call upon = urge\u003c/span>\u003cdiv class=\"w\">요청하고 촉구하는 의미를 더 직접적인 urged로 바꿉니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">set their air conditioners at\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">keep their air conditioners at\u003c/span>\u003cspan class=\"y-eq\">set at = keep at\u003c/span>\u003cdiv class=\"w\">설정해 두고 유지한다는 의미를 keep at으로 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">no lower than\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at least\u003c/span>\u003cspan class=\"y-eq\">no lower than = at least\u003c/span>\u003cdiv class=\"w\">최소 기준을 간단한 표현으로 바꿉니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We have urged people to keep their air conditioners at a minimum of 28 degrees Celsius in summer and a maximum of 20 degrees Celsius in winter.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"여름에는 섭씨 스물여덟 도 이상, 겨울에는 섭씨 이십 도 이하로 에어컨을 설정하자는 공공 캠페인 문장이에요. 에너지 절약과 적정 실내 온도를 권장하고 있죠.","hl":"mn"},{"n":42,"text":"at no lower than twenty-eight degrees Celsius는 at a minimum of twenty-eight degrees Celsius로 바꿀 수 있어요. no higher than twenty는 at a maximum of twenty degrees Celsius로 바꿀 수 있습니다.","hl":"rw"},{"n":43,"text":"called upon은 urged로 바꿀 수 있어요. set their air conditioners at은 keep their air conditioners at으로 바꿀 수 있고 no lower than은 at least로 정리할 수 있습니다.","hl":"ph"},{"n":44,"text":"전체 문장을 바꾸면 We have urged people to keep their air conditioners at a minimum of twenty-eight degrees Celsius in summer and a maximum of twenty degrees Celsius in winter예요. 숫자는 영어로 읽어 주면 좋아요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 \u003cspan class=\"fx\">We can no more explain a passion to a person who has never experienced it than we can explain light to the blind.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We can no more explain a passion\u003c/div>\u003cdiv class=\"k\">우리는 열정을 설명할 수 없다\u003c/div>\u003cdiv class=\"e\">to a person who has never experienced it\u003c/div>\u003cdiv class=\"k\">그것을 한 번도 경험하지 않은 사람에게\u003c/div>\u003cdiv class=\"e\">than we can explain light to the blind.\u003c/div>\u003cdiv class=\"k\">우리가 눈이 먼 사람에게 빛을 설명할 수 없는 것만큼.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">no more ... than\u003c/b>은 'B할 수 없는 것과 마찬가지로 A도 할 수 없다'라는 뜻으로, 앞뒤를 모두 부정합니다. 열정을 모르는 사람에게 열정을 설명하는 일과 맹인에게 빛을 설명하는 일을 대등하게 놓아 불가능성을 강조합니다.\u003c/div>","segs":[{"n":45,"text":"We can no more explain a passion, 우리는 열정을 설명할 수 없다. to a person who has never experienced it, 그것을 한 번도 경험하지 않은 사람에게. than we can explain light to the blind, 우리가 눈이 먼 사람에게 빛을 설명할 수 없는 것만큼.","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 no more A than B 구문이에요. 눈이 먼 사람에게 빛을 설명할 수 없는 것과 마찬가지로 열정을 경험하지 못한 사람에게 열정을 설명할 수 없다는 뜻이죠. 앞과 뒤를 모두 부정해서 불가능성을 강조합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 \u003cspan class=\"fx\">We can no more explain a passion to a person who has never experienced it than we can explain light to the blind.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>경험하지 않은 감정은 말로 설명해도 이해시키기 어렵다는 뜻이에요. 직접 경험의 중요성을 강조하는 비유입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">We can no more explain a passion to a person who has never experienced it than we can explain light to the blind.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">We cannot explain a passion to someone who has never experienced it, just as we cannot explain light to the blind.\u003c/span>\u003cdiv class=\"w\">no more than을 cannot과 just as로 풀어 부정 비교를 드러냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a person who has never experienced it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">someone with no experience of it\u003c/span>\u003cdiv class=\"w\">관계절을 전치사구로 간단히 바꿉니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">no more ... than\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">not ... any more than\u003c/span>\u003cspan class=\"y-eq\">no more ... than = not ... any more than\u003c/span>\u003cdiv class=\"w\">같은 부정 비교 구조로 바꿔 해석을 돕습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">explain light to the blind\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">describe light to those who cannot see\u003c/span>\u003cspan class=\"y-eq\">the blind = those who cannot see\u003c/span>\u003cdiv class=\"w\">the blind를 풀어 써서 의미를 분명히 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">has never experienced it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has no experience of it\u003c/span>\u003cspan class=\"y-eq\">never experienced = has no experience of\u003c/span>\u003cdiv class=\"w\">경험이 없다는 의미를 명사구로 바꿉니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Just as we cannot describe light to people who cannot see, we cannot explain a passion to someone who has no experience of it.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"경험하지 않은 감정은 말로 설명해도 이해시키기 어렵다는 뜻이에요. 직접 경험의 중요성을 강조하는 비유입니다.","hl":"mn"},{"n":48,"text":"We cannot explain a passion to someone who has never experienced it, just as we cannot explain light to the blind로 바꿀 수 있어요. a person who has never experienced it은 someone with no experience of it으로 바꿀 수 있습니다.","hl":"rw"},{"n":49,"text":"no more than은 not any more than으로 바꿀 수 있어요. explain light to the blind는 describe light to those who cannot see로 바꿀 수 있고 has never experienced it은 has no experience of it으로 바꿀 수 있습니다.","hl":"ph"},{"n":50,"text":"전체 문장을 바꾸면 Just as we cannot describe light to people who cannot see, we cannot explain a passion to someone who has no experience of it예요. 비유의 구조를 그대로 살린 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 Organic farmers grow \u003cspan class=\"fx\">crops that are no less plagued by pests than those of conventional farmers\u003c/span>; insects generally do not discriminate between organic and conventional as well as we do.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Organic farmers grow crops\u003c/div>\u003cdiv class=\"k\">유기 농법을 사용하는 농부들은 작물을 재배한다\u003c/div>\u003cdiv class=\"e\">that are no less plagued by pests\u003c/div>\u003cdiv class=\"k\">해충에 시달리는 정도가 조금도 덜하지 않은\u003c/div>\u003cdiv class=\"e\">than those of conventional farmers;\u003c/div>\u003cdiv class=\"k\">재래 농법을 사용하는 농부들의 작물보다;\u003c/div>\u003cdiv class=\"e\">insects generally do not discriminate\u003c/div>\u003cdiv class=\"k\">곤충들은 대개 구별하지 않는다\u003c/div>\u003cdiv class=\"e\">between organic and conventional\u003c/div>\u003cdiv class=\"k\">유기 농법과 재래 농법 사이를\u003c/div>\u003cdiv class=\"e\">as well as we do.\u003c/div>\u003cdiv class=\"k\">우리가 그런 것만큼 잘.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">no less ... than\u003c/b>은 '~보다 덜하지 않다', 즉 '~만큼이나'라는 강조 비교입니다. 유기 농작물도 재래 농작물만큼 해충 피해를 받는다는 점을 나타냅니다. 뒤쪽의 \u003cb class=\"key\">as well as we do\u003c/b>는 원급 비교로, 곤충이 우리만큼 잘 구별하지 못한다는 뜻을 보탭니다.\u003c/div>","segs":[{"n":51,"text":"Organic farmers grow crops, 유기 농법을 사용하는 농부들은 작물을 재배한다. that are no less plagued by pests, 해충에 시달리는 정도가 조금도 덜하지 않은. than those of conventional farmers, 재래 농법을 사용하는 농부들의 작물보다;. insects generally do not discriminate, 곤충들은 대개 구별하지 않는다. between organic and conventional, 유기 농법과 재래 농법 사이를. as well as we do, 우리가 그런 것만큼 잘.","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 no less A than B 구문이에요. 유기 농작물도 재래 농작물만큼 해충 피해를 받는다는 뜻으로, B보다 덜하지 않다라는 강조 비교를 만듭니다. 뒤쪽의 as well as we do는 우리가 구별하는 것만큼 잘 구별하지 못한다는 원급 비교예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 Organic farmers grow \u003cspan class=\"fx\">crops that are no less plagued by pests than those of conventional farmers\u003c/span>; insects generally do not discriminate between organic and conventional as well as we do.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>유기 농법도 해충 피해에서 자유롭지 않다는 뜻이에요. 곤충은 우리처럼 유기 농법과 재래 농법을 잘 구별하지 못한다는 유머도 담겨 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">crops that are no less plagued by pests than those of conventional farmers\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">crops that suffer just as much pest damage as conventional farmers' crops\u003c/span>\u003cdiv class=\"w\">no less than을 just as much as로 바꿔 같은 정도의 피해를 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">insects generally do not discriminate between organic and conventional as well as we do\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">insects generally cannot tell organic from conventional as well as we can\u003c/span>\u003cdiv class=\"w\">discriminate between을 tell A from B로 바꿔 자연스럽게 표현합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">plagued by pests\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">damaged by pests\u003c/span>\u003cspan class=\"y-eq\">plagued by = damaged by\u003c/span>\u003cdiv class=\"w\">해충에 시달린다는 뜻을 damage로 바꿉니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">discriminate between A and B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">tell A from B\u003c/span>\u003cspan class=\"y-eq\">discriminate between = tell from\u003c/span>\u003cdiv class=\"w\">구별하다는 의미를 더 일상적인 표현으로 바꿉니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as well as we do\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as skillfully as we do\u003c/span>\u003cspan class=\"y-eq\">well = skillfully\u003c/span>\u003cdiv class=\"w\">well의 구별 능력 의미를 skillfully로 분명히 합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Organic farmers grow crops that suffer just as much pest damage as conventional farmers' crops; insects generally cannot tell organic from conventional as well as we can.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"유기 농법도 해충 피해에서 자유롭지 않다는 뜻이에요. 곤충은 우리처럼 유기 농법과 재래 농법을 잘 구별하지 못한다는 유머도 담겨 있죠.","hl":"mn"},{"n":54,"text":"crops that are no less plagued by pests than those of conventional farmers는 crops that suffer just as much pest damage as conventional farmers' crops로 바꿀 수 있어요. do not discriminate between organic and conventional은 cannot tell organic from conventional로 바꿀 수 있습니다.","hl":"rw"},{"n":55,"text":"plagued by pests는 damaged by pests로 바꿀 수 있어요. discriminate between A and B는 tell A from B로 바꿀 수 있고 as well as we do는 as skillfully as we do로 바꿀 수 있습니다.","hl":"ph"},{"n":56,"text":"전체 문장을 바꾸면 Organic farmers grow crops that suffer just as much pest damage as conventional farmers' crops, and insects generally cannot tell organic from conventional as well as we can예요. 두 절의 의미를 자연스럽게 이어 준 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 \u003cspan class=\"fx\">The closer the people in the world become, the more frequently they are exposed to people from other cultures.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The closer the people in the world become,\u003c/div>\u003cdiv class=\"k\">세상 사람들이 더 가까워질수록,\u003c/div>\u003cdiv class=\"e\">the more frequently they are exposed\u003c/div>\u003cdiv class=\"k\">그들은 더욱더 자주 노출된다\u003c/div>\u003cdiv class=\"e\">to people from other cultures.\u003c/div>\u003cdiv class=\"k\">다른 문화권의 사람들에게.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">the 비교급, the 비교급\u003c/b> 구문으로, 세계 사람들이 가까워지는 정도가 커질수록 다른 문화권 사람들에게 노출되는 빈도도 커진다는 비례 관계를 나타냅니다. \u003cb class=\"key\">be exposed to\u003c/b>는 '~에 노출되다'라는 수동태 표현입니다.\u003c/div>","segs":[{"n":57,"text":"The closer the people in the world become, 세상 사람들이 더 가까워질수록. the more frequently they are exposed, 그들은 더욱더 자주 노출된다. to people from other cultures, 다른 문화권의 사람들에게.","hl":"ch"},{"n":58,"text":"열 번째 문장은 the 비교급 the 비교급 구문이에요. 세상 사람들이 더 가까워질수록 다른 문화권 사람들에게 더 자주 노출된다는 비례 관계를 나타냅니다. be exposed to는 사람이나 자극에 접하게 된다는 수동태 표현이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 \u003cspan class=\"fx\">The closer the people in the world become, the more frequently they are exposed to people from other cultures.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>세계가 가까워질수록 다른 문화 사람들을 더 자주 만나게 된다는 뜻이에요. 문화 교류가 늘어난다는 긍정적 변화를 말합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The closer the people in the world become\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">As people around the world become closer\u003c/span>\u003cdiv class=\"w\">the 비교급 구문을 as 절로 바꿔 비례 의미를 유지합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the more frequently they are exposed to people from other cultures\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">they encounter people from other cultures more often\u003c/span>\u003cdiv class=\"w\">be exposed to를 encounter로 바꿔 더 자연스러운 동사 표현으로 만듭니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the people in the world\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">people around the world\u003c/span>\u003cspan class=\"y-eq\">in the world = around the world\u003c/span>\u003cdiv class=\"w\">세계 사람들을 가리키는 표현을 자연스럽게 바꿉니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are exposed to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">come into contact with\u003c/span>\u003cspan class=\"y-eq\">be exposed to = come into contact with\u003c/span>\u003cdiv class=\"w\">접촉한다는 의미를 더 분명히 드러냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">more frequently\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">more often\u003c/span>\u003cspan class=\"y-eq\">frequently = often\u003c/span>\u003cdiv class=\"w\">빈도를 나타내는 부사를 더 쉬운 말로 바꿉니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">As people around the world become closer, they come into contact with people from other cultures more often.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"세계가 가까워질수록 다른 문화 사람들을 더 자주 만나게 된다는 뜻이에요. 문화 교류가 늘어난다는 긍정적 변화를 말합니다.","hl":"mn"},{"n":60,"text":"The closer the people in the world become은 As people around the world become closer로 바꿀 수 있어요. are exposed to people from other cultures는 encounter people from other cultures로 바꿀 수 있습니다.","hl":"rw"},{"n":61,"text":"the people in the world는 people around the world로 바꿀 수 있어요. are exposed to는 come into contact with로 바꿀 수 있고 more frequently는 more often으로 바꿀 수 있습니다.","hl":"ph"},{"n":62,"text":"전체 문장을 바꾸면 As people around the world become closer, they come into contact with people from other cultures more often예요. 비례 관계를 자연스럽게 풀어 쓴 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 If all our knowledge stopped at the level of the senses, \u003cspan class=\"fx\">we would be no better off than the subhuman members of the animal kingdom\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If all our knowledge stopped\u003c/div>\u003cdiv class=\"k\">만약 우리의 모든 지식이 멈춘다면\u003c/div>\u003cdiv class=\"e\">at the level of the senses,\u003c/div>\u003cdiv class=\"k\">감각의 수준에서,\u003c/div>\u003cdiv class=\"e\">we would be no better off\u003c/div>\u003cdiv class=\"k\">우리는 조금도 더 낫지 않을 것이다\u003c/div>\u003cdiv class=\"e\">than the subhuman members of the animal kingdom.\u003c/div>\u003cdiv class=\"k\">동물 세계의 인간 이하의 존재들보다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">no better off than\u003c/b>은 '~보다 조금도 더 낫지 않다', 즉 '~와 별로 다르지 않다'라는 뜻입니다. 가정법 과거 구조 안에서 감각에만 머문 지식의 한계를 동물과 비교해 강조합니다.\u003c/div>","segs":[{"n":63,"text":"If all our knowledge stopped, 만약 우리의 모든 지식이 멈춘다면. at the level of the senses, 감각의 수준에서. we would be no better off, 우리는 조금도 더 낫지 않을 것이다. than the subhuman members of the animal kingdom, 동물 세계의 인간 이하의 존재들보다.","hl":"ch"},{"n":64,"text":"열한 번째 문장은 no better off than 구문이에요. 동물 세계의 존재들보다 조금도 더 낫지 않다는 뜻으로, 비교를 통해 한계를 강조합니다. If all our knowledge stopped는 가정법 과거 구조라서 현실과 반대되는 상황을 상상하고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 If all our knowledge stopped at the level of the senses, \u003cspan class=\"fx\">we would be no better off than the subhuman members of the animal kingdom\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>지식이 감각 수준에만 머문다면 인간은 동물과 크게 다르지 않을 것이라는 뜻이에요. 인간을 인간답게 하는 것은 감각을 넘어선 사고와 지식이라는 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">we would be no better off than the subhuman members of the animal kingdom\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\"> gdom은 we would be no different from the lower animals로 바꿀 수 있어요. If all our knowledge stopped at the level of the senses는 If our knowledge were limited to the senses로 바꿀 수 있습니다.","hl":"rw"},{"n":67,"text":"stopped at the level of the senses는 were limited to sensory experience로 바꿀 수 있어요. no better off than은 no different from으로 바꿀 수 있고 subhuman members of the animal kingdom은 lower animals로 정리할 수 있습니다.","hl":"ph"},{"n":68,"text":"전체 문장을 바꾸면 If our knowledge were limited to sensory experience, we would be no different from the lower animals예요. 가정법의 의미를 살린 패러프레이징이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">Mind is not to be found in molecules any more than the works of Shakespeare were to be found in his genes.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Mind is not to be found in molecules\u003c/div>\u003cdiv class=\"k\">정신은 분자 속에서 발견될 수 없다\u003c/div>\u003cdiv class=\"e\">any more than the works of Shakespeare were to be found\u003c/div>\u003cdiv class=\"k\">셰익스피어의 작품들이 발견될 수 없었던 것만큼\u003c/div>\u003cdiv class=\"e\">in his genes.\u003c/div>\u003cdiv class=\"k\">그의 유전자 속에서.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">not ... any more than\u003c/b>은 'B가 아닌 것과 마찬가지로 A도 아니다'라는 뜻으로, no more ... than과 같은 방식의 부정 비교입니다. 정신이 분자에서 발견될 수 없다는 주장을 셰익스피어 작품과 유전자의 비유로 강조합니다.\u003c/div>","segs":[{"n":69,"text":"Mind is not to be found in molecules, 정신은 분자 속에서 발견될 수 없다. any more than the works of Shakespeare were to be found, 셰익스피어의 작품들이 발견될 수 없었던 것만큼. in his genes, 그의 유전자 속에서.","hl":"ch"},{"n":70,"text":"열두 번째 문장은 not any more than 구문이에요. 셰익스피어의 작품이 그의 유전자에서 발견될 수 없었던 것과 마찬가지로 정신도 분자에서 발견될 수 없다는 뜻이죠. 앞과 뒤를 모두 부정하는 부정 비교입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">Mind is not to be found in molecules any more than the works of Shakespeare were to be found in his genes.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>정신은 단순한 분자의 배열에서 찾을 수 없다는 뜻이에요. 셰익스피어의 작품이 유전자에 들어 있지 않듯, 정신도 물질만으로 설명되지 않는다는 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Mind is not to be found in molecules any more than the works of Shakespeare were to be found in his genes.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Just as Shakespeare's works were not found in his genes, mind is not found in molecules.\u003c/span>\u003cdiv class=\"w\">not any more than을 just as로 풀어 부정 비교를 분명히 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is not to be found in molecules\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cannot be found in molecules\u003c/span>\u003cdiv class=\"w\">be to be found를 can be found로 바꿔 가능성의 의미를 드러냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not ... any more than\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">no more ... than\u003c/span>\u003cspan class=\"y-eq\">not ... any more than = no more ... than\u003c/span>\u003cdiv class=\"w\">같은 부정 비교 구조로 바꿔 해석을 돕습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is not to be found\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cannot be found\u003c/span>\u003cspan class=\"y-eq\">is not to be found = cannot be found\u003c/span>\u003cdiv class=\"w\">발견될 수 없다는 의미를 더 직접적으로 표현합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the works of Shakespeare\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Shakespeare's works\u003c/span>\u003cspan class=\"y-eq\">the works of Shakespeare = Shakespeare's works\u003c/span>\u003cdiv class=\"w\">소유격으로 바꿔 간결하게 표현합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Just as Shakespeare's works cannot be found in his genes, the mind cannot be found in molecules.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"정신은 단순한 분자의 배열에서 찾을 수 없다는 뜻이에요. 셰익스피어의 작품이 유전자에 들어 있지 않듯 정신도 물질만으로 설명되지 않는다는 메시지입니다.","hl":"mn"},{"n":72,"text":"Just as Shakespeare's works were not found in his genes, mind is not found in molecules로 바꿀 수 있어요. is not to be found in molecules는 cannot be found in molecules로 바꿀 수 있습니다.","hl":"rw"},{"n":73,"text":"not any more than은 no more than으로 바꿀 수 있어요. is not to be found는 cannot be found로 바꿀 수 있고 the works of Shakespeare는 Shakespeare's works로 바꿀 수 있습니다.","hl":"ph"},{"n":74,"text":"전체 문장을 바꾸면 Just as Shakespeare's works cannot be found in his genes, the mind cannot be found in molecules예요. 비유의 구조를 그대로 유지한 문장입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">the 비교급, the 비교급\u003c/b>은 '~할수록 더 ~하다'로 비례 관계를 나타낸다.\u003c/li>\u003cli>\u003cb class=\"key\">no more than\u003c/b>은 '단지 ~에 불과하다', \u003cb class=\"key\">no less ... than\u003c/b>은 '~만큼이나'로 해석한다.\u003c/li>\u003cli>\u003cb class=\"key\">no more ... than\u003c/b>과 \u003cb class=\"key\">not ... any more than\u003c/b>은 앞뒤를 모두 부정해 'B가 아닌 것처럼 A도 아니다'로 해석한다.\u003c/li>\u003cli>\u003cb class=\"key\">no better off than\u003c/b>은 '~보다 조금도 낫지 않다'로 비교 대상을 통해 한계를 강조한다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 마블레드 유닛의 비교 구문을 정리했어요. the 비교급 the 비교급은 앞의 정도가 커질수록 뒤의 정도도 커진다는 비례 관계를 만듭니다. no more than과 no less than은 겉모습이 비슷해도 각각 단지 그 정도에 불과하다와 그만큼이나라는 뜻으로 달라요. no more than 계열의 부정 비교는 앞뒤를 모두 부정해서 해석하는 습관을 꼭 기억해 주세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
