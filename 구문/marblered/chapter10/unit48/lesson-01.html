lecturePlayer(document.getElementById("app"),{"brand":"unit48","title":"마블레드 구문 강의: 비교급과 최상급으로 최고를 말하기","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마블레드\u003c/div>\u003ch1>마블레드 구문 강의: 비교급과 최상급으로 최고를 말하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>비교급과 최상급 표현을 활용해 어떤 대상이 가장 뛰어나거나 가장 심각하다는 뜻을 정확히 읽고 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마블레드 유닛을 함께 공부해 볼 거예요. 이 유닛은 비교급과 최상급을 이용해서 어떤 대상이 가장 뛰어나거나 가장 심각하다는 점을 강조하는 표현을 배웁니다. 실제 문장에서 어떻게 쓰이는지 하나씩 살펴보면서 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">마블레드 유닛은 \u003cb class=\"key\">the most\u003c/b>, \u003cb class=\"key\">more ... than\u003c/b>, \u003cb class=\"key\">No other ... as ... as\u003c/b>, \u003cb class=\"key\">nothing ... more ... than\u003c/b>처럼 비교급과 최상급으로 최고와 차이를 강조하는 구문입니다. 특히 부정어와 비교급이 만나면 표면은 부정이지만 실제로는 최상급 의미를 냅니다. 비교 대상이 같은 집단일 때는 \u003cb class=\"key\">any other\u003c/b>를 써서 논리적으로 정확하게 만듭니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Global warming \u003cspan class=\"fx\">is considered to be the most serious threat\u003c/span> facing humanity by many environmentalists.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">Nothing in all the world is more dangerous than\u003c/span> sincere ignorance and conscientious stupidity.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 Personal computers have become \u003cspan class=\"fx\">the most empowering tool we've ever created\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Next to religion, baseball \u003cspan class=\"fx\">has had a greater impact on our American way of life than any other American institution\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">No other writer's plays have been produced so many times or read so widely in so many countries as Shakespeare's.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">Nobody is so miserable as he who longs to be somebody and something other than the person he is in body and mind.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 \u003cspan class=\"fx\">One of the hardest things in this world is to admit you are wrong. And nothing is more helpful in resolving a situation than its frank admission.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">The most exciting phrase to hear in science, the one that heralds new discoveries, is not &quot;Eureka!&quot; (I found it!) but &quot;That's funny.&quot;\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 The Amazon's aquatic life, such as freshwater dolphins, 400-pound catfish, giant eels, \u003cspan class=\"fx\">is larger and more diverse than that of all the other river systems\u003c/span> in the world.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">Of all the wonderful and unique characteristics of man, his ability to communicate through the use of language is perhaps the most important.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11  Although humans are not the only animals who use tools, our species has developed this skill \u003cspan class=\"fx\">to a far greater extent than any other animal\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 In today's industry, where technology and speed of information are critical factors, \u003cspan class=\"fx\">nothing is more valuable to our clients than providing timely and accurate information\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"마블레드 유닛의 핵심은 비교급과 최상급을 이용해 최고와 차이를 강조하는 거예요. the most나 more than은 최상급과 비교급을 만들고, No other나 nothing이 more나 as와 함께 쓰이면 부정형처럼 보여도 실제로는 가장 그렇다는 뜻을 냅니다. 이때 any other를 쓰면 같은 집단을 비교 대상에서 제외할 수 있어서 논리적으로 더 정확해집니다. 오늘은 이 세 가지 흐름을 중심으로 문장을 해석해 볼게요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Global warming \u003cspan class=\"fx\">is considered to be the most serious threat\u003c/span> facing humanity by many environmentalists.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Global warming \u003c/div>\u003cdiv class=\"k\">지구 온난화는\u003c/div>\u003cdiv class=\"e\">is considered to be \u003c/div>\u003cdiv class=\"k\">여겨진다\u003c/div>\u003cdiv class=\"e\">the most serious threat \u003c/div>\u003cdiv class=\"k\">가장 심각한 위협으로\u003c/div>\u003cdiv class=\"e\">facing humanity \u003c/div>\u003cdiv class=\"k\">인류를 마주한\u003c/div>\u003cdiv class=\"e\">by many environmentalists.\u003c/div>\u003cdiv class=\"k\">많은 환경 운동가들에 의해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">is considered to be\u003c/b>는 '~로 여겨진다'라는 수동태이고, 그 안의 \u003cb class=\"key\">the most serious\u003c/b>는 최상급으로 '가장 심각한'을 만듭니다. 최상급 뒤의 \u003cb class=\"key\">facing humanity\u003c/b>는 threat를 뒤에서 꾸미는 현재분사구입니다.\u003c/div>","segs":[{"n":3,"text":"Global warming, 지구 온난화는. is considered to be, 여겨진다. the most serious threat, 가장 심각한 위협으로. facing humanity, 인류를 마주한. by many environmentalists, 많은 환경 운동가들에 의해","hl":"ch"},{"n":4,"text":"여기서 is considered to be는 여겨진다는 뜻의 수동태로 쓰였고, the most serious는 최상급이에요. 그래서 가장 심각한 위협이라고 강조하는 구조죠. 뒤에 facing humanity는 threat를 꾸며 주는 표현으로 이해하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Global warming \u003cspan class=\"fx\">is considered to be the most serious threat\u003c/span> facing humanity by many environmentalists.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>환경 운동가들이 지구 온난화를 인류가 직면한 가장 심각한 위협이라고 본다는 뜻입니다. 단순히 '위험하다'가 아니라 여러 위협 중 최고 수준이라고 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is considered to be the most serious threat\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is regarded as the greatest threat\u003c/span>\u003cdiv class=\"w\">consider A to be B를 regard A as B로 바꾸면 'A를 B로 여긴다'는 뜻이 더 직접적으로 드러납니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by many environmentalists\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">according to many environmentalists\u003c/span>\u003cdiv class=\"w\">행위자를 by로 표현하는 대신 according to로 바꾸면 '많은 환경 운동가들에 따르면'이라는 관점 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Global warming\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">climate change\u003c/span>\u003cspan class=\"y-eq\">global warming = climate change\u003c/span>\u003cdiv class=\"w\">지구 온난화와 기후 변화는 함께 묶여 쓰이는 관련 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">facing humanity\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">confronting humanity\u003c/span>\u003cspan class=\"y-eq\">facing = confronting\u003c/span>\u003cdiv class=\"w\">face는 '직면하다'이고 confront도 '맞서다, 직면하다'라는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">serious threat\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">grave danger\u003c/span>\u003cspan class=\"y-eq\">serious = grave\u003c/span>\u003cdiv class=\"w\">serious를 grave로 바꾸면 '중대한, 심각한'이라는 뉘앙스가 더 강해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Many environmentalists regard global warming as the greatest threat that humanity faces.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 환경 운동가들이 지구 온난화를 인류가 마주한 가장 심각한 위협으로 본다는 뜻이에요. 여러 위협 중에서도 최고 수준이라고 강조하는 표현이죠.","hl":"mn"},{"n":6,"text":"is considered to be는 is regarded as로 바꿔 쓸 수 있어요. 또 by many environmentalists는 according to many environmentalists처럼 관점을 나타내는 표현으로 바꿀 수 있습니다.","hl":"rw"},{"n":7,"text":"serious threat는 grave danger처럼 바꿀 수 있고, facing humanity는 confronting humanity로 표현할 수 있어요. global warming은 climate change와 함께 묶어 기억해 두면 좋습니다.","hl":"ph"},{"n":8,"text":"전체 문장은 Many environmentalists regard global warming as the greatest threat that humanity faces라고 바꿀 수 있어요. 같은 뜻을 조금 더 능동적인 문장으로 표현한 것이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">Nothing in all the world is more dangerous than\u003c/span> sincere ignorance and conscientious stupidity.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Nothing in all the world \u003c/div>\u003cdiv class=\"k\">세상의 어떤 것도\u003c/div>\u003cdiv class=\"e\">is more dangerous \u003c/div>\u003cdiv class=\"k\">더 위험하지 않다\u003c/div>\u003cdiv class=\"e\">than sincere ignorance \u003c/div>\u003cdiv class=\"k\">성실한 무지보다\u003c/div>\u003cdiv class=\"e\">and conscientious stupidity.\u003c/div>\u003cdiv class=\"k\">그리고 양심적인 어리석음보다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Nothing ... more dangerous than\u003c/b>은 '~보다 더 위험한 것은 없다'라는 비교급 강조 표현입니다. 표면은 부정이지만 실제로는 '가장 위험하다'는 최상급 의미를 냅니다.\u003c/div>","segs":[{"n":9,"text":"Nothing in all the world, 세상의 어떤 것도. is more dangerous, 더 위험하지 않다. than sincere ignorance, 성실한 무지보다. and conscientious stupidity, 그리고 양심적인 어리석음보다","hl":"ch"},{"n":10,"text":"Nothing in all the world is more dangerous than은 직역하면 세상의 어떤 것도 더 위험하지 않다는 뜻이에요. 하지만 실제로는 성실한 무지와 양심적인 어리석음이 가장 위험하다는 최상급 의미를 냅니다. 부정어와 비교급이 만나면 이렇게 최고를 강조할 수 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 \u003cspan class=\"fx\">Nothing in all the world is more dangerous than\u003c/span> sincere ignorance and conscientious stupidity.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>성실하게 모르는 것과 양심적으로 어리석은 것이 세상에서 가장 위험하다는 뜻입니다. 무지나 어리석음이 선한 의도와 결합해도 위험할 수 있음을 경고합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Nothing in all the world is more dangerous than\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The most dangerous things in the world are\u003c/span>\u003cdiv class=\"w\">부정형 비교 표현을 최상급 표현으로 바꾸면 의미가 더 직접적으로 드러납니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in all the world\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">on earth\u003c/span>\u003cspan class=\"y-eq\">in all the world = on earth\u003c/span>\u003cdiv class=\"w\">'세상에서'라는 뜻을 더 자연스러운 관용 표현 on earth로 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sincere ignorance\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">honest ignorance\u003c/span>\u003cspan class=\"y-eq\">sincere = honest\u003c/span>\u003cdiv class=\"w\">sincere를 honest로 바꾸면 '진실한, 성실한'이라는 뉘앙스를 살릴 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">conscientious stupidity\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">well-meaning foolishness\u003c/span>\u003cspan class=\"y-eq\">conscientious = well-meaning\u003c/span>\u003cdiv class=\"w\">conscientious는 '양심적인'이므로 well-meaning으로 풀어 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Sincere ignorance and conscientious stupidity are the most dangerous things in the world.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 성실하게 모르는 것과 양심적으로 어리석은 것이 세상에서 가장 위험하다는 뜻이에요. 착한 의도로 시작했더라도 무지와 어리석음이 결합하면 큰 위험이 될 수 있다는 경고죠.","hl":"mn"},{"n":12,"text":"Nothing in all the world is more dangerous than은 The most dangerous things in the world are로 바꿔 쓸 수 있어요. 부정형 비교를 최상급 표현으로 바꾼 것이죠.","hl":"rw"},{"n":13,"text":"in all the world는 on earth로 바꿀 수 있고, sincere ignorance는 honest ignorance처럼 표현할 수 있어요. conscientious stupidity는 well-meaning foolishness로 풀어 쓸 수도 있습니다.","hl":"ph"},{"n":14,"text":"전체 문장은 Sincere ignorance and conscientious stupidity are the most dangerous things in the world라고 바꿀 수 있어요. 뜻은 같지만 최상급을 사용해 더 분명하게 말한 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 Personal computers have become \u003cspan class=\"fx\">the most empowering tool we've ever created\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Personal computers \u003c/div>\u003cdiv class=\"k\">개인용 컴퓨터는\u003c/div>\u003cdiv class=\"e\">have become \u003c/div>\u003cdiv class=\"k\">되었다\u003c/div>\u003cdiv class=\"e\">the most empowering tool \u003c/div>\u003cdiv class=\"k\">가장 힘을 실어 주는 도구가\u003c/div>\u003cdiv class=\"e\">we've ever created.\u003c/div>\u003cdiv class=\"k\">우리가 지금껏 만들어 낸\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">the most empowering\u003c/b>은 최상급이고, \u003cb class=\"key\">we've ever created\u003c/b>는 앞의 tool을 꾸미는 관계절입니다. 그래서 '우리가 지금까지 만들어 온 것 중 가장 ~한 도구'라는 의미를 만듭니다.\u003c/div>","segs":[{"n":15,"text":"Personal computers, 개인용 컴퓨터는. have become, 되었다. the most empowering tool, 가장 힘을 실어 주는 도구가. we've ever created, 우리가 지금껏 만들어 낸","hl":"ch"},{"n":16,"text":"the most empowering은 가장 힘을 주는이라는 최상급 표현이에요. 뒤에 we have ever created가 붙어서 우리가 지금까지 만들어 온 것 중 가장 힘을 주는 도구라는 뜻을 만듭니다. 최상급 뒤의 관계절이 범위를 정해 주는 구조죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 Personal computers have become \u003cspan class=\"fx\">the most empowering tool we've ever created\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>개인용 컴퓨터가 인류가 만든 도구 중 사람에게 가장 큰 힘을 준다는 뜻입니다. empowering은 단순히 편리한 것이 아니라 할 수 있는 일을 넓혀 준다는 뉘앙스입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the most empowering tool we've ever created\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the greatest tool for empowerment that we have ever created\u003c/span>\u003cdiv class=\"w\">empowering을 명사구 for empowerment로 풀어 쓰면 의미가 더 분명해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">empowering\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">enabling\u003c/span>\u003cspan class=\"y-eq\">empowering = enabling\u003c/span>\u003cdiv class=\"w\">empowering은 '힘을 주는'이고 enabling은 '할 수 있게 해 주는'이라는 뜻으로 가깝습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">tool\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">instrument\u003c/span>\u003cspan class=\"y-eq\">tool = instrument\u003c/span>\u003cdiv class=\"w\">tool을 instrument로 바꾸면 도구라는 뜻을 조금 더 격식 있게 표현할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ever created\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">created so far\u003c/span>\u003cspan class=\"y-eq\">ever = so far\u003c/span>\u003cdiv class=\"w\">ever created는 '지금까지 만들어 온'이라는 뜻이므로 created so far로 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Personal computers have become the greatest tool for empowerment that humans have ever created.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 개인용 컴퓨터가 인류가 만든 도구 중 사람에게 가장 큰 힘을 준다는 뜻이에요. 여기서 empowering은 그냥 편리하다가 아니라 사람이 더 많은 일을 할 수 있게 해 준다는 뉘앙스입니다.","hl":"mn"},{"n":18,"text":"the most empowering tool we have ever created는 the greatest tool for empowerment that we have ever created로 바꿀 수 있어요. empowering을 풀어 써서 의미를 더 분명하게 만든 것이죠.","hl":"rw"},{"n":19,"text":"empowering은 enabling으로 바꿀 수 있고, tool은 instrument로 표현할 수 있어요. ever created는 created so far처럼 바꿔도 같은 뜻을 살릴 수 있습니다.","hl":"ph"},{"n":20,"text":"전체 문장은 Personal computers have become the greatest tool for empowerment that humans have ever created라고 바꿀 수 있어요. 최상급 의미를 살리면서 조금 더 설명적으로 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Next to religion, baseball \u003cspan class=\"fx\">has had a greater impact on our American way of life than any other American institution\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Next to religion, \u003c/div>\u003cdiv class=\"k\">종교 다음으로\u003c/div>\u003cdiv class=\"e\">baseball has had \u003c/div>\u003cdiv class=\"k\">야구는 가져왔다\u003c/div>\u003cdiv class=\"e\">a greater impact \u003c/div>\u003cdiv class=\"k\">더 큰 영향을\u003c/div>\u003cdiv class=\"e\">on our American way of life \u003c/div>\u003cdiv class=\"k\">우리 미국인의 생활 방식에\u003c/div>\u003cdiv class=\"e\">than any other American institution.\u003c/div>\u003cdiv class=\"k\">다른 어떤 미국의 제도보다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">a greater impact ... than any other\u003c/b>는 비교급으로 '다른 어떤 ~보다 더 큰 영향'을 나타냅니다. \u003cb class=\"key\">any other\u003c/b>를 쓰면 비교 대상과 같은 집단을 제외해 논리적으로 정확해집니다.\u003c/div>","segs":[{"n":21,"text":"Next to religion, 종교 다음으로. baseball has had, 야구는 가져왔다. a greater impact, 더 큰 영향을. on our American way of life, 우리 미국인의 생활 방식에. than any other American institution, 다른 어떤 미국의 제도보다","hl":"ch"},{"n":22,"text":"a greater impact than any other는 다른 어떤 것보다 더 큰 영향을이라는 비교급 표현이에요. 여기서 any other를 쓰면 야구와 같은 미국의 제도들을 비교 대상에서 자연스럽게 제외할 수 있습니다. 그래서 논리적으로 정확한 비교가 되는 거죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Next to religion, baseball \u003cspan class=\"fx\">has had a greater impact on our American way of life than any other American institution\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>미국 생활 방식에 미친 영향력을 비교할 때 야구가 종교 다음으로 크고, 다른 제도보다도 크다는 뜻입니다. 야구를 미국 문화의 핵심으로 평가하는 표현입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Next to religion\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">After religion\u003c/span>\u003cdiv class=\"w\">Next to는 '다음으로'라는 뜻이므로 After로 바꾸면 순서가 더 분명해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">has had a greater impact on our American way of life than any other American institution\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has influenced our American way of life more than any other American institution\u003c/span>\u003cdiv class=\"w\">have an impact on을 동사 influence로 바꾸면 문장이 더 간결해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have an impact on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have an influence on\u003c/span>\u003cspan class=\"y-eq\">impact = influence\u003c/span>\u003cdiv class=\"w\">impact와 influence는 모두 '영향'이라는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">way of life\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lifestyle\u003c/span>\u003cspan class=\"y-eq\">way of life = lifestyle\u003c/span>\u003cdiv class=\"w\">way of life는 lifestyle로 간단히 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">institution\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">establishment\u003c/span>\u003cspan class=\"y-eq\">institution = establishment\u003c/span>\u003cdiv class=\"w\">제도나 기관을 뜻할 때 institution을 establishment로 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">After religion, baseball has influenced our American way of life more than any other American institution.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 미국 생활 방식에 미친 영향을 비교할 때 야구가 종교 다음으로 크고 다른 제도보다도 크다는 뜻이에요. 야구를 미국 문화의 핵심으로 평가하는 표현입니다.","hl":"mn"},{"n":24,"text":"Next to religion은 After religion으로 바꿀 수 있어요. 또 has had a greater impact on은 has influenced more than으로 바꾸면 더 간결하게 표현할 수 있습니다.","hl":"rw"},{"n":25,"text":"have an impact on은 have an influence on으로 바꿀 수 있고, way of life는 lifestyle로 표현할 수 있어요. institution은 establishment로 바꿔도 비슷한 뜻을 살릴 수 있습니다.","hl":"ph"},{"n":26,"text":"전체 문장은 After religion, baseball has influenced our American way of life more than any other American institution이라고 바꿀 수 있어요. 비교의 뜻을 그대로 살린 자연스러운 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 \u003cspan class=\"fx\">No other writer's plays have been produced so many times or read so widely in so many countries as Shakespeare's.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">No other writer's plays \u003c/div>\u003cdiv class=\"k\">다른 어떤 작가의 희곡도\u003c/div>\u003cdiv class=\"e\">have been produced \u003c/div>\u003cdiv class=\"k\">상연되어 오지 않았다\u003c/div>\u003cdiv class=\"e\">so many times \u003c/div>\u003cdiv class=\"k\">그렇게 여러 번\u003c/div>\u003cdiv class=\"e\">or read so widely \u003c/div>\u003cdiv class=\"k\">혹은 그렇게 널리 읽히지 않았다\u003c/div>\u003cdiv class=\"e\">in so many countries \u003c/div>\u003cdiv class=\"k\">그렇게 많은 나라에서\u003c/div>\u003cdiv class=\"e\">as Shakespeare's.\u003c/div>\u003cdiv class=\"k\">셰익스피어의 희곡만큼\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">No other ... as ...\u003c/b>는 '다른 어떤 ~도 ...만큼 ~하지 않다'라는 최상급 표현입니다. 부정어 No other와 원급 비교 as가 결합해 셰익스피어의 희곡이 가장 많이 상연되고 가장 널리 읽힌다는 뜻을 냅니다.\u003c/div>","segs":[{"n":27,"text":"No other writer's plays, 다른 어떤 작가의 희곡도. have been produced, 상연되어 오지 않았다. so many times, 그렇게 여러 번. or read so widely, 혹은 그렇게 널리 읽히지 않았다. in so many countries, 그렇게 많은 나라에서. as Shakespeare's, 셰익스피어의 희곡만큼","hl":"ch"},{"n":28,"text":"No other writer's plays have been produced so many times as Shakespeare's는 다른 어떤 작가의 희곡도 셰익스피어의 희곡만큼 많이 상연되지 않았다는 뜻이에요. 부정어 No other와 as가 결합해서 실제로는 셰익스피어가 최고라는 의미를 냅니다. 이런 부정 비교는 최상급처럼 해석하는 것이 핵심이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 \u003cspan class=\"fx\">No other writer's plays have been produced so many times or read so widely in so many countries as Shakespeare's.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>셰익스피어의 희곡이 다른 어떤 작가의 희곡보다 더 많이 상연되고 더 널리 읽혔다는 뜻입니다. 부정형이지만 실제로는 최고라는 칭송입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">No other writer's plays have been produced so many times\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Shakespeare's plays have been produced more times than those of any other writer\u003c/span>\u003cdiv class=\"w\">No other를 주어로 둔 부정 비교를 최상급에 가까운 긍정 비교로 바꾼 것입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">produced\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">staged\u003c/span>\u003cspan class=\"y-eq\">produced = staged\u003c/span>\u003cdiv class=\"w\">희곡의 경우 produce는 '상연하다'이므로 staged로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">read so widely\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">read by so many people\u003c/span>\u003cspan class=\"y-eq\">widely = by many people\u003c/span>\u003cdiv class=\"w\">널리 읽힌다는 뜻을 '많은 사람에게 읽히다'로 풀어 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in so many countries\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">across so many nations\u003c/span>\u003cspan class=\"y-eq\">countries = nations\u003c/span>\u003cdiv class=\"w\">country를 nation으로 바꾸면 조금 더 격식 있는 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Shakespeare's plays have been staged more often and read more widely in more countries than those of any other writer.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 셰익스피어의 희곡이 다른 어떤 작가의 희곡보다 더 많이 상연되고 더 널리 읽혔다는 뜻이에요. 부정형으로 시작하지만 내용은 셰익스피어를 최고로 칭송하는 것입니다.","hl":"mn"},{"n":30,"text":"No other writer's plays have been produced so many times는 Shakespeare's plays have been produced more times than those of any other writer로 바꿀 수 있어요. 부정 비교를 긍정 비교로 바꾼 것이죠.","hl":"rw"},{"n":31,"text":"produced는 희곡 문맥에서 staged로 바꿀 수 있고, read so widely는 read by so many people로 풀어 쓸 수 있어요. in so many countries는 across so many nations로 바꿔도 좋습니다.","hl":"ph"},{"n":32,"text":"전체 문장은 Shakespeare's plays have been staged more often and read more widely in more countries than those of any other writer라고 바꿀 수 있어요. 같은 뜻을 긍정 비교 형태로 자연스럽게 표현한 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 \u003cspan class=\"fx\">Nobody is so miserable as he who longs to be somebody and something other than the person he is in body and mind.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Nobody is so miserable \u003c/div>\u003cdiv class=\"k\">어느 누구도 그렇게 비참하지 않다\u003c/div>\u003cdiv class=\"e\">as he who longs to be \u003c/div>\u003cdiv class=\"k\">그가 되기를 갈망하는 사람만큼\u003c/div>\u003cdiv class=\"e\">somebody and something \u003c/div>\u003cdiv class=\"k\">누군가 그리고 무언가가\u003c/div>\u003cdiv class=\"e\">other than the person \u003c/div>\u003cdiv class=\"k\">그가 아닌 사람\u003c/div>\u003cdiv class=\"e\">he is in body and mind.\u003c/div>\u003cdiv class=\"k\">몸과 마음에서 지닌\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Nobody is so ... as ...\u003c/b>는 '누구도 ~만큼 ...하지 않다'라는 최상급 비교 표현입니다. \u003cb class=\"key\">he who\u003c/b>는 '~하는 사람'을 뜻하고, \u003cb class=\"key\">other than\u003c/b>은 '~이 아닌'으로 자기 자신과 다른 존재를 가리킵니다.\u003c/div>","segs":[{"n":33,"text":"Nobody is so miserable, 어느 누구도 그렇게 비참하지 않다. as he who longs to be, 그가 되기를 갈망하는 사람만큼. somebody and something, 누군가 그리고 무언가가. other than the person, 그가 아닌 사람. he is in body and mind, 몸과 마음에서 지닌","hl":"ch"},{"n":34,"text":"Nobody is so miserable as he who는 누구도 그 사람만큼 비참하지 않다는 최상급 비교 표현이에요. he who는 하는 사람이라는 뜻이고, other than은 아닌이라는 뜻으로 쓰였습니다. 그래서 자신이 아닌 다른 존재가 되고 싶어 하는 사람과 비교하는 구조입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 \u003cspan class=\"fx\">Nobody is so miserable as he who longs to be somebody and something other than the person he is in body and mind.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>몸과 마음으로 자신이 아닌 다른 사람이나 다른 무엇이 되고 싶어 하는 사람보다 더 비참한 사람은 없다는 뜻입니다. 자기 자신을 인정하지 못하고 다른 존재를 동경할 때 큰 고통이 생긴다는 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Nobody is so miserable as he who longs to be somebody and something other than the person he is\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The most miserable person is the one who longs to be someone and something different from who he is\u003c/span>\u003cdiv class=\"w\">부정 비교를 최상급 표현으로 바꾸고 somebody를 someone으로 자연스럽게 바꾼 것입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">long to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">desire to\u003c/span>\u003cspan class=\"y-eq\">long to = desire to\u003c/span>\u003cdiv class=\"w\">long to는 '간절히 ~하고 싶어 하다'이므로 desire to로 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">somebody and something\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a different person and a different thing\u003c/span>\u003cspan class=\"y-eq\">somebody = a different person\u003c/span>\u003cdiv class=\"w\">somebody와 something을 풀어서 '다른 사람과 다른 것'이라는 뜻을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">miserable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">wretched\u003c/span>\u003cspan class=\"y-eq\">miserable = wretched\u003c/span>\u003cdiv class=\"w\">miserable은 '비참한'이고 wretched도 '비참한, 불행한'이라는 뜻으로 가깝습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The most miserable person is the one who desperately wants to be a different person, in body and mind, from who he really is.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 몸과 마음으로 자신이 아닌 다른 사람이나 다른 무엇이 되고 싶어 하는 사람보다 더 비참한 사람은 없다는 뜻이에요. 자기 자신을 인정하지 못하고 다른 존재를 동경할 때 큰 고통이 생긴다는 메시지입니다.","hl":"mn"},{"n":36,"text":"Nobody is so miserable as he who longs to be는 The most miserable person is the one who longs to be로 바꿀 수 있어요. 부정 비교를 최상급으로 바꾼 것이죠.","hl":"rw"},{"n":37,"text":"long to는 desire to로 바꿀 수 있고, somebody and something은 a different person and a different thing으로 풀어 쓸 수 있어요. miserable은 wretched로 바꿔도 비슷한 뉘앙스입니다.","hl":"ph"},{"n":38,"text":"전체 문장은 The most miserable person is the one who desperately wants to be a different person, in body and mind, from who he really is라고 바꿀 수 있어요. 같은 뜻을 최상급 문장으로 표현한 것입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 \u003cspan class=\"fx\">One of the hardest things in this world is to admit you are wrong. And nothing is more helpful in resolving a situation than its frank admission.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">One of the hardest things in this world \u003c/div>\u003cdiv class=\"k\">이 세상에서 가 pan class=\"fx\">is larger and more diverse than that of all the other river systems\u003c/span> in the world.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>아마존의 수생 생물이 세계 다른 모든 하천의 수생 생물보다 몸집이 더 크고 종류도 더 다양하다는 뜻입니다. 아마존의 생태적 풍요로움을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is larger and more diverse than that of all the other river systems\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has greater size and diversity than those of all the other river systems\u003c/span>\u003cdiv class=\"w\">형용사 비교를 명사 비교로 바꾸어 의미를 더 분명하게 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">such as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">including\u003c/span>\u003cdiv class=\"w\">예시를 들 때 such as를 including으로 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">aquatic life\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">water life\u003c/span>\u003cspan class=\"y-eq\">aquatic = water\u003c/span>\u003cdiv class=\"w\">aquatic은 '물에 사는'이므로 water life로 풀어 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">diverse\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">varied\u003c/span>\u003cspan class=\"y-eq\">diverse = varied\u003c/span>\u003cdiv class=\"w\">diverse는 '다양한'이고 varied도 '다양한'이라는 뜻으로 가깝습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">river systems\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">river networks\u003c/span>\u003cspan class=\"y-eq\">system = network\u003c/span>\u003cdiv class=\"w\">하천 체계라는 뜻에서 river systems를 river networks로 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The Amazon's aquatic life, including freshwater dolphins, four-hundred-pound catfish, and giant eels, has greater size and diversity than the aquatic life of any other river system in the world.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 아마존의 수생 생물이 세계 다른 모든 하천의 수생 생물보다 몸집이 더 크고 종류도 더 다양하다는 뜻이에요. 아마존의 생태적 풍요로움을 강조하는 문장입니다.","hl":"mn"},{"n":54,"text":"is larger and more diverse than that of는 has greater size and diversity than that of로 바꿀 수 있어요. 형용사 비교를 명사 비교로 풀어 쓴 것이죠. such as는 including으로 바꿔도 자연스럽습니다.","hl":"rw"},{"n":55,"text":"aquatic life는 water life로 풀어 쓸 수 있고, diverse는 varied로 바꿀 수 있어요. river systems는 river networks로 표현해도 비슷한 뜻입니다.","hl":"ph"},{"n":56,"text":"전체 문장은 The Amazon's aquatic life, including freshwater dolphins, four hundred pound catfish, and giant eels, has greater size and diversity than the aquatic life of any other river system in the world라고 바꿀 수 있어요. 숫자를 말로 풀어 읽어 주면 됩니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 \u003cspan class=\"fx\">Of all the wonderful and unique characteristics of man, his ability to communicate through the use of language is perhaps the most important.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Of all the wonderful and unique characteristics of man, \u003c/div>\u003cdiv class=\"k\">인간의 모든 놀랍고 독특한 특성들 중에서\u003c/div>\u003cdiv class=\"e\">his ability to communicate \u003c/div>\u003cdiv class=\"k\">의사소통하는 그의 능력은\u003c/div>\u003cdiv class=\"e\">through the use of language \u003c/div>\u003cdiv class=\"k\">언어의 사용을 통해\u003c/div>\u003cdiv class=\"e\">is perhaps the most important.\u003c/div>\u003cdiv class=\"k\">아마 가장 중요한 것이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb clas >\u003cspan class=\"t\">traits\u003c/span>\u003cspan class=\"y-eq\">characteristics = traits\u003c/span>\u003cdiv class=\"w\">characteristics는 '특성'이고 traits도 '특성, 기질'이라는 뜻으로 가깝습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">communicate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">interact\u003c/span>\u003cspan class=\"y-eq\">communicate = interact\u003c/span>\u003cdiv class=\"w\">의사소통한다는 뜻을 interact로 넓혀 표현할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">perhaps\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">possibly\u003c/span>\u003cspan class=\"y-eq\">perhaps = possibly\u003c/span>\u003cdiv class=\"w\">perhaps와 possibly는 모두 '아마도'라는 뜻입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Perhaps the most important of all man's wonderful and unique characteristics is his ability to communicate by using language.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 인간의 놀랍고 독특한 특성들 가운데 언어로 의사소통하는 능력이 아마 가장 중요하다는 뜻이에요. 언어 능력을 인간을 인간답게 만드는 핵심 특성으로 평가하는 문장입니다.","hl":"mn"},{"n":60,"text":"Of all the wonderful and unique characteristics of man, his ability is perhaps the most important는 Perhaps the most important of all man's wonderful and unique characteristics is his ability로 바꿀 수 있어요. 최상급 구문의 어순을 바꾼 것이죠.","hl":"rw"},{"n":61,"text":"characteristics는 traits로 바꿀 수 있고, communicate는 interact로 넓혀 표현할 수 있어요. perhaps는 possibly로 바꿔도 같은 뜻입니다.","hl":"ph"},{"n":62,"text":"전체 문장은 Perhaps the most important of all man's wonderful and unique characteristics is his ability to communicate by using language라고 바꿀 수 있어요. 최상급의 의미를 그대로 살린 자연스러운 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11  Although humans are not the only animals who use tools, our species has developed this skill \u003cspan class=\"fx\">to a far greater extent than any other animal\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Although humans are not the only animals \u003c/div>\u003cdiv class=\"k\">비록 인간이 유일한 동물은 아닐지라도\u003c/div>\u003cdiv class=\"e\">who use tools, \u003c/div>\u003cdiv class=\"k\">도구를 사용하는\u003c/div>\u003cdiv class=\"e\">our species has developed this skill \u003c/div>\u003cdiv class=\"k\">우리 종은 이 기술을 발전시켜 왔다\u003c/div>\u003cdiv class=\"e\">to a far greater extent \u003c/div>\u003cdiv class=\"k\">훨씬 더 큰 정도로\u003c/div>\u003cdiv class=\"e\">than any other animal.\u003c/div>\u003cdiv class=\"k\">다른 어떤 동물보다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">to a far greater extent than\u003c/b>는 '다른 어떤 ~보다 훨씬 더 큰 정도로'라는 비교급 강조 표현입니다. \u003cb class=\"key\">Although\u003c/b> 절이 양보의 의미를 만들어 '비록 ~이지만'으로 연결합니다.\u003c/div>","segs":[{"n":63,"text":"Although humans are not the only animals, 비록 인간이 유일한 동물은 아닐지라도. who use tools, 도구를 사용하는. our species has developed this skill, 우리 종은 이 기술을 발전시켜 왔다. to a far greater extent, 훨씬 더 큰 정도로. than any other animal, 다른 어떤 동물보다","hl":"ch"},{"n":64,"text":"to a far greater extent than any other animal은 다른 어떤 동물보다 훨씬 더 큰 정도로라는 비교급 강조 표현이에요. Although는 비록 그렇더라도라는 양보의 뜻을 만들어 줍니다. 그래서 인간이 유일한 도구 사용 동물은 아니지만 정도의 차이가 크다는 구조가 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11  Although humans are not the only animals who use tools, our species has developed this skill \u003cspan class=\"fx\">to a far greater extent than any other animal\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인간만 도구를 쓰는 것은 아니지만, 인류는 다른 어떤 동물보다 도구 사용 기술을 훨씬 더 발전시켰다는 뜻입니다. 도구 사용의 독점이 아니라 정도의 차이를 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to a far greater extent than any other animal\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">far more than any other animal\u003c/span>\u003cdiv class=\"w\">to a great extent를 far more로 간결하게 바꿔 같은 비교의 뜻을 살렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Although humans are not the only animals who use tools\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Humans are not the only animals that use tools, but\u003c/span>\u003cdiv class=\"w\">Although 절을 but으로 이어 주어 양보의 뜻을 자연스럽게 드러냈습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">species\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">kind\u003c/span>\u003cspan class=\"y-eq\">species = kind\u003c/span>\u003cdiv class=\"w\">species는 '종'이고 kind도 생물의 종류를 뜻할 때 가깝게 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">develop a skill\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">hone a skill\u003c/span>\u003cspan class=\"y-eq\">develop = hone\u003c/span>\u003cdiv class=\"w\">기술을 발전시키다는 뜻을 hone a skill로 표현하면 '연마하다'는 뉘앙스가 살아납니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to a greater extent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to a higher degree\u003c/span>\u003cspan class=\"y-eq\">extent = degree\u003c/span>\u003cdiv class=\"w\">정도를 나타낼 때 extent를 degree로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Humans are not the only animals that use tools, but our species has developed this skill far more than any other animal.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 인간만 도구를 쓰는 것은 아니지만 인류는 다른 어떤 동물보다 도구 사용 기술을 훨씬 더 발전시켰다는 뜻이에요. 도구 사용을 독점했다는 뜻이 아니라 정도의 차이를 강조하는 문장입니다.","hl":"mn"},{"n":66,"text":"to a far greater extent than any other animal은 far more than any other animal로 간결하게 바꿀 수 있어요. Although 절은 Humans are not the only animals that use tools, but으로 이어 표현할 수도 있습니다.","hl":"rw"},{"n":67,"text":"species는 kind로 바꿀 수 있고, develop a skill은 hone a skill로 표현할 수 있어요. to a greater extent는 to a higher degree로 바꿔도 같은 뜻입니다.","hl":"ph"},{"n":68,"text":"전체 문장은 Humans are not the only animals that use tools, but our species has developed this skill far more than any other animal이라고 바꿀 수 있어요. 양보와 비교의 뜻을 자연스럽게 살린 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 In today's industry, where technology and speed of information are critical factors, \u003cspan class=\"fx\">nothing is more valuable to our clients than providing timely and accurate information\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">In today's industry, \u003c/div>\u003cdiv class=\"k\">오늘날의 산업에서\u003c/div>\u003cdiv class=\"e\">where technology and speed of information \u003c/div>\u003cdiv class=\"k\">기술과 정보의 속도가\u003c/div>\u003cdiv class=\"e\">are critical factors, \u003c/div>\u003cdiv class=\"k\">중대한 요소인\u003c/div>\u003cdiv class=\"e\">nothing is more valuable to our clients \u003c/div>\u003cdiv class=\"k\">우리의 고객에게 더 가치 있는 것은 없다\u003c/div>\u003cdiv class=\"e\">than providing timely and accurate information.\u003c/div>\u003cdiv class=\"k\">시기적절하고 정확한 정보를 제공하는 것보다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">nothing is more valuable than\u003c/b>은 '~보다 더 가치 있는 것은 없다'라는 비교급 강조입니다. \u003cb class=\"key\">where\u003c/b>는 앞의 industry를 설명하는 관계부사로 '그곳에서 ~한'의 의미를 더합니다.\u003c/div>","segs":[{"n":69,"text":"In today's industry, 오늘날의 산업에서. where technology and speed of information, 기술과 정보의 속도가. are critical factors, 중대한 요소인. nothing is more valuable to our clients, 우리의 고객에게 더 가치 있는 것은 없다. than providing timely and accurate information, 시기적절하고 정확한 정보를 제공하는 것보다","hl":"ch"},{"n":70,"text":"nothing is more valuable than은 그 무엇보다 더 가치 있는 것은 없다는 비교급 강조 표현이에요. where는 앞의 industry를 설명하면서 그 산업에서 기술과 정보의 속도가 중대한 요소라고 덧붙여 줍니다. 그래서 전체적으로 고객에게 가장 가치 있는 일을 강조하는 구조가 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 In today's industry, where technology and speed of information are critical factors, \u003cspan class=\"fx\">nothing is more valuable to our clients than providing timely and accurate information\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>오늘날 산업에서 기술과 정보 속도가 중요하기 때문에, 고객에게는 시기적절하고 정확한 정보를 주는 것보다 가치 있는 일이 없다는 뜻입니다. 정보의 속도와 정확성을 고객 서비스의 핵심으로 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nothing is more valuable to our clients than providing timely and accurate information\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">providing timely and accurate information is the most valuable thing to our clients\u003c/span>\u003cdiv class=\"w\">부정 비교를 최상급 표현으로 바꾸어 의미를 더 직접적으로 드러냈습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">timely and accurate information\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">information that is both prompt and correct\u003c/span>\u003cdiv class=\"w\">timely를 prompt로, accurate를 correct로 풀어 써서 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">valuable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">precious\u003c/span>\u003cspan class=\"y-eq\">valuable = precious\u003c/span>\u003cdiv class=\"w\">valuable은 '가치 있는'이고 precious도 '소중한'이라는 뜻으로 가깝습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">timely\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">prompt\u003c/span>\u003cspan class=\"y-eq\">timely = prompt\u003c/span>\u003cdiv class=\"w\">timely는 '시기적절한'이고 prompt는 '즉시의, 신속한'이라는 뜻으로 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">critical factors\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">crucial elements\u003c/span>\u003cspan class=\"y-eq\">critical = crucial\u003c/span>\u003cdiv class=\"w\">critical과 crucial은 모두 '중대한'이라는 뜻이고 factors는 elements로 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">In today's industry, where technology and the speed of information are crucial, providing prompt and accurate information is the most valuable thing we can do for our clients.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 오늘날 산업에서 기술과 정보 속도가 중요하기 때문에 고객에게는 시기적절하고 정확한 정보를 주는 것보다 가치 있는 일이 없다는 뜻이에요. 정보의 속도와 정확성을 고객 서비스의 핵심으로 강조합니다.","hl":"mn"},{"n":72,"text":"nothing is more valuable than은 providing information is the most valuable thing으로 바꿀 수 있어요. timely and accurate information은 information that is both prompt and correct로 풀어 쓸 수도 있습니다.","hl":"rw"},{"n":73,"text":"valuable은 precious로 바꿀 수 있고, timely는 prompt로 표현할 수 있어요. critical factors는 crucial elements로 바꿔도 같은 뜻을 살릴 수 있습니다.","hl":"ph"},{"n":74,"text":"전체 문장은 In today's industry, where technology and the speed of information are crucial, providing prompt and accurate information is the most valuable thing we can do for our clients라고 바꿀 수 있어요. 부정 비교를 최상급으로 바꾼 자연스러운 문장입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">the most\u003c/b>는 '가장 ~한'이라는 최상급을 만든다.\u003c/li>\u003cli>\u003cb class=\"key\">more ... than any other\u003c/b>는 '다른 어떤 ~보다 더 ...한'을 나타낸다.\u003c/li>\u003cli>\u003cb class=\"key\">No other ... as ... as\u003c/b>와 \u003cb class=\"key\">nothing ... more ... than\u003c/b>은 부정형이지만 실제로는 최상급 의미를 낸다.\u003c/li>\u003cli>\u003cb class=\"key\">one of the hardest\u003c/b>는 '가장 ~한 것들 중 하나'로 최상급의 범위를 나타낸다.\u003c/li>\u003cli>\u003cb class=\"key\">not A but B\u003c/b>는 'A가 아니라 B'라는 대조를 만든다.\u003c/li>\u003cli>비교할 때 \u003cb class=\"key\">any other\u003c/b>를 쓰면 같은 집단을 제외해 논리적으로 정확해진다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 마블레드 유닛에서 비교급과 최상급을 이용한 강조 표현을 배웠어요. the most는 가장이라는 뜻을 만들고, more than any other는 다른 어떤 것보다 더라는 비교를 만들어 줍니다. No other나 nothing이 들어간 비교 구문은 부정형처럼 보여도 실제로는 최고를 강조한다는 점이 중요해요. 이 원리를 기억하면 시험에서도 문장의 핵심 의미를 빠르게 잡을 수 있습니다. 수고했어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
