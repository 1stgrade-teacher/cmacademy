  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}

    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};

  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"unit45","title":"마블레드 비교 구문 완전 정복","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마블레드\u003c/div>\u003ch1>마블레드 비교 구문 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>비교 구문 as ... as, 배수 표현, not so much A as B를 활용해 문장의 정도와 강조점을 정확히 파악한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마블레드 유닛에서 비교 표현을 함께 공부해요. as 와 as 사이에 형용사나 부사를 넣는 원급 비교부터 배수 표현, not so much A as B까지 차근차근 익혀 볼게요. 직독직해와 의미, 바꿔 쓰기까지 함께 연습해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">마블레드 유닛의 핵심은 \u003cb class=\"key\">as ... as\u003c/b>를 중심으로 정도와 배수를 비교하는 표현입니다. \u003cb class=\"key\">not so much A as B\u003c/b>와 \u003cb class=\"key\">not A so much as B\u003c/b>는 모두 'A라기보다는 오히려 B'로, \u003cb class=\"key\">as much on A as on B\u003c/b>는 'B만큼 A에'라는 의미를 만듭니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 What you get by achieving your goals is \u003cspan class=\"fx\">not as important as\u003c/span> what you become by achieving your goals.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 The human brain cell can hold \u003cspan class=\"fx\">five times as much information as\u003c/span> the Encyclopaedia Britannica.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 To ask what is the use of poetry should be \u003cspan class=\"fx\">as absurd as\u003c/span> asking what is the use of a rainbow, or the sea, or a nice dress.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 The International Space Station is \u003cspan class=\"fx\">almost four times as large as the Russian space station Mir and about five times as large as\u003c/span> the U.S. Skylab.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 It is important \u003cspan class=\"fx\">not so much to give a man bread, as to put him in the way of earning it for himself\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 A person's choice and use of words \u003cspan class=\"fx\">tells as much about him or her as do manners, dress, and general behavior\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 Happiness is produced \u003cspan class=\"fx\">not so much by great pieces of good fortune that seldom happen, as by little advantages that occur every day\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 While people today have \u003cspan class=\"fx\">twice as much spending power as they did in the 1950s, they are ten times more likely to be depressed\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 A hero can be anyone, even a man doing something \u003cspan class=\"fx\">as simple and reassuring as putting a coat on a young boy's shoulders\u003c/span> to let him know that the world hadn't ended.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 The consequences of interaction can be difficult to foresee because they \u003cspan class=\"fx\">depend as much on the behavior of others as on oneself\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Singapore has nearly 8,000 people per km2, and is \u003cspan class=\"fx\">more than 200 times as dense as\u003c/span> the U.S.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Most insomnia is \u003cspan class=\"fx\">not an illness or a physical condition so much as a  symptom\u003c/span> of another problem that may simply be a reaction to certain medications, anxiety about travel, or stress before a job interview.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"마블레드 유닛의  더 중요하다는 뜻이에요. 성과 자체보다 성장과 변화의 가치를 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is not as important as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is less important than\u003c/span>\u003cdiv class=\"w\">부정 원급 비교를 비교급으로 바꾸어 '덜 중요하다'는 의미를 직접적으로 드러냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">What you get by achieving your goals\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The rewards you gain from reaching your goals\u003c/span>\u003cdiv class=\"w\">get과 achieve를 좀 더 격식 있는 표현으로 바꾸어 의미를 분명히 합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">achieve your goals\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">reach your goals\u003c/span>\u003cspan class=\"y-eq\">achieve = reach\u003c/span>\u003cdiv class=\"w\">목표를 이루다라는 뜻을 같은 의미의 동사구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">get\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">obtain\u003c/span>\u003cspan class=\"y-eq\">get = obtain\u003c/span>\u003cdiv class=\"w\">일상적인 get을 격식 있는 obtain으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">important\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">significant\u003c/span>\u003cspan class=\"y-eq\">important = significant\u003c/span>\u003cdiv class=\"w\">중요한이라는 뜻을 좀 더 격식 있는 형용사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The person you become while reaching your goals matters more than what you gain from achieving them.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"목표를 이루면서 얻는 결과보다 그 과정에서 내가 어떤 사람이 되는지가 더 중요하다는 뜻이에요. 결국 성취의 성과보다 성장의 가치를 강조하는 문장이라고 볼 수 있죠.","hl":"mn"},{"n":6,"text":"is not as important as는 is less important than으로 바꿔 쓸 수 있어요. 또 What you get by achieving your goals는 The rewards you gain from reaching your goals처럼 더 격식 있게 표현할 수 있습니다.","hl":"rw"},{"n":7,"text":"achieve your goals는 reach your goals로 바꿀 수 있고, get은 obtain, important는 significant로 바꿔 표현할 수 있어요. 시험에서는 같은 뜻의 격식 표현으로 바꾸는 문제가 자주 나옵니다.","hl":"ph"},{"n":8,"text":"전체 문장을 바꿔 말하면 The person you become while reaching your goals matters more than what you gain from achieving them이라고 할 수 있어요. 목표 달성의 보상보다 그 과정에서 형성되는 나 자신이 더 중요하다는 뜻이 잘 드러나죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 The human brain cell can hold \u003cspan class=\"fx\">five times as much information as\u003c/span> the Encyclopaedia Britannica.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The human brain cell\u003c/div>\u003cdiv class=\"k\">인간의 뇌세포는\u003c/div>\u003cdiv class=\"e\">can hold\u003c/div>\u003cdiv class=\"k\">보유할 수 있다\u003c/div>\u003cdiv class=\"e\">five times as much information as\u003c/div>\u003cdiv class=\"k\">다섯 배 많은 정보를\u003c/div>\u003cdiv class=\"e\">the Encyclopaedia Britannica.\u003c/div>\u003cdiv class=\"k\">브리태니커 백과사전보다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">five times as much + 명사 + as\u003c/b>는 '~보다 다섯 배 많은 명사'를 나타내는 배수 원급 비교입니다. 배수 표현이 as much 앞에 와서 정보의 양을 비교합니다.\u003c/div>","segs":[{"n":9,"text":"The human brain cell, 인간의 뇌세포는. can hold, 보유할 수 있다. five times as much information as, 다섯 배 많은 정보를. the Encyclopaedia Britannica, 브리태니커 백과사전보다","hl":"ch"},{"n":10,"text":"이 문장은 five times as much information as라는 배수 원급 비교를 사용해요. 배수는 as much 앞에 놓이고, as 뒤에는 비교 대상인 백과사전이 옵니다. 그래서 뇌세포가 백과사전보다 다섯 배 많은 정보를 담을 수 있다는 뜻이 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 The human brain cell can hold \u003cspan class=\"fx\">five times as much information as\u003c/span> the Encyclopaedia Britannica.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인간의 뇌세포 하나가 브리태니커 백과사전 전체보다 다섯 배 많은 정보를 담을 수 있다는 비유적 강조예요. 뇌의 저장 능력을 놀라울 정도로 크게 표현한 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">can hold five times as much information as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can store five times more information than\u003c/span>\u003cdiv class=\"w\">hold를 store로 바꾸고 배수 원급 비교를 배수 비교급으로 바꾸어 같은 의미를 더 직접적으로 표현합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The human brain cell\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">A single human brain cell\u003c/span>\u003cdiv class=\"w\">하나의 뇌세포라는 점을 분명히 하여 비교의 초점을 살립니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">hold information\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">store information\u003c/span>\u003cspan class=\"y-eq\">hold = store\u003c/span>\u003cdiv class=\"w\">정보를 보유하다라는 뜻을 저장하다라는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">five times as much ... as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">five times more ... than\u003c/span>\u003cspan class=\"y-eq\">times as much as = times more than\u003c/span>\u003cdiv class=\"w\">배수 원급 비교를 배수 비교급 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">brain cell\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">neuron\u003c/span>\u003cspan class=\"y-eq\">brain cell = neuron\u003c/span>\u003cdiv class=\"w\">뇌세포를 뜻하는 전문적인 동의어로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A single human brain cell is capable of storing five times more information than the Encyclopaedia Britannica contains.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"인간의 뇌세포 하나가 브리태니커 백과사전 전체보다 다섯 배 많은 정보를 저장할 수 있다는 비유적인 강조예요. 실제 수치보다 뇌의 저장 능력이 얼마나 놀라운지를 크게 부각하는 표현이죠.","hl":"mn"},{"n":12,"text":"can hold five times as much information as는 can store five times more information than으로 바꿀 수 있어요. The human brain cell은 A single human brain cell처럼 하나라는 점을 분명히 해 줄 수 있습니다.","hl":"rw"},{"n":13,"text":"hold information은 store information, brain cell은 neuron으로 바꿀 수 있어요. five times as much information as는 five times more information than으로도 표현할 수 있습니다.","hl":"ph"},{"n":14,"text":"전체 문장을 바꿔 말하면 A single human brain cell is capable of storing five times more information than the Encyclopaedia Britannica contains라고 할 수 있어요. 뇌세포 하나의 저장 능력을 백과사전과 비교한 의미가 그대로 살아 있죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 To ask what is the use of poetry should be \u003cspan class=\"fx\">as absurd as\u003c/span> asking what is the use of a rainbow, or the sea, or a nice dress.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">To ask what is the use of poetry\u003c/div>\u003cdiv class=\"k\">시의 효용이 무엇인지 묻는 것은\u003c/div>\u003cdiv class=\"e\">should be as absurd as\u003c/div>\u003cdiv class=\"k\">그만큼 어리석을 것이다\u003c/div>\u003cdiv class=\"e\">asking what is the use of a rainbow, or the sea, or a nice dress.\u003c/div>\u003cdiv class=\"k\">무지개나 바다 또는 근사한 옷의 효용이 무엇인지 묻는 것\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as + 형용사 + as\u003c/b>는 '~만큼 ...한'을 만드는 원급 비교입니다. to부정사 주어 To ask ...와 동명사 asking ...을 비교해 두 행위의 어리석음을 대조합니다.\u003c/div>","segs":[{"n":15,"text":"To ask what is the use of poetry, 시의 효용이 무엇인지 묻는 것은. should be as absurd as, 그만큼 어리석을 것이다. asking what is the use of a rainbow, or the sea, or a nice dress, 무지개나 바다 또는 근사한 옷의 효용이 무엇인지 묻는 것","hl":"ch"},{"n":16,"text":"이 문장은 as absurd as라는 원급 비교를 사용해요. as 와 as 사이에 absurd가 들어가서 무엇인가만큼 어리석다는 뜻을 만듭니다. 앞의 to부정사 주어와 뒤의 동명사 asking이 서로 비교되는 구조죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 To ask what is the use of poetry should be \u003cspan class=\"fx\">as absurd as\u003c/span> asking what is the use of a rainbow, or the sea, or a nice dress.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>시의 효용을 묻는 일은 무지개나 바다, 근사한 옷의 효용을 묻는 것만큼 어리석다는 뜻이에요. 시의 가치는 쓸모라는 잣대로만 판단할 수 없다는 뉘앙스입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as absurd as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">just as foolish as\u003c/span>\u003cdiv class=\"w\">absurd를 더 일상적인 foolish로 바꾸고 just를 더해 의미를 강조했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">what is the use of poetry\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">what poetry is good for\u003c/span>\u003cdiv class=\"w\">what is the use of를 what something is good for로 풀어 써서 구어적인 느낌을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">absurd\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ridiculous\u003c/span>\u003cspan class=\"y-eq\">absurd = ridiculous\u003c/span>\u003cdiv class=\"w\">어리석은이라는 뜻을 같은 의미의 형용사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">what is the use of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">what is the point of\u003c/span>\u003cspan class=\"y-eq\">what is the use of = what is the point of\u003c/span>\u003cdiv class=\"w\">효용을 묻는 표현을 목적이나 의미를 묻는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a nice dress\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a beautiful dress\u003c/span>\u003cspan class=\"y-eq\">nice = beautiful\u003c/span>\u003cdiv class=\"w\">근사한 옷이라는 뜻을 아름다운 옷으로 자연스럽게 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Questioning the purpose of poetry would be just as ridiculous as questioning the purpose of a rainbow, the sea, or a beautiful dress.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"시의 효용을 묻는 일은 무지개나 바다, 또는 근사한 옷의 효용을 묻는 것만큼 어리석다는 뜻이에요. 시의 가치는 단순한 쓸모만으로 판단할 수 없다는 뉘앙스를 담고 있습니다.","hl":"mn"},{"n":18,"text":"as absurd as는 just as foolish as로 바꿀 수 있어요. what is the use of poetry는 what poetry is good for처럼 풀어 써서 더 자연스럽게 표현할 수 있습니다.","hl":"rw"},{"n":19,"text":"absurd는 ridiculous, what is the use of는 what is the point of, a nice dress는 a beautiful dress로 바꿔 표현할 수 있어요. 같은 뜻을 가진 어구를 찾는 연습에 좋은 표현들입니다.","hl":"ph"},{"n":20,"text":"전체 문장을 바꿔 말하면 Questioning the purpose of poetry would be just as ridiculous as questioning the purpose of a rainbow, the sea, or a beautiful dress라고 할 수 있어요. 시의 쓸모를 따지는 일이 얼마나 어리석은지 잘 보여 주죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 The International Space Station is \u003cspan class=\"fx\">almost four times as large as the Russian space station Mir and about five times as large as\u003c/span> the U.S. Skylab.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The International Space Station\u003c/div>\u003cdiv class=\"k\">국제 우주 정거장은\u003c/div>\u003cdiv class=\"e\">is almost four times as large as\u003c/div>\u003cdiv class=\"k\">거의 네 배만큼 크다\u003c/div>\u003cdiv class=\"e\">the Russian space station Mir\u003c/div>\u003cdiv class=\"k\">러시아 우주 정거장 미르보다\u003c/div>\u003cdiv class=\"e\">and about five times as large as\u003c/div>\u003cdiv class=\"k\">그리고 약 다섯 배만큼 크다\u003c/div>\u003cdiv class=\"e\">the U.S. Skylab.\u003c/div>\u003cdiv class=\"k\">미국 스카이랩보다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">배수 + as + 형용사 + as\u003c/b>는 '~보다 몇 배 더 ...한'을 나타냅니다. almost와 about이 각각 배수 표현을 꾸미고, and로 Mir와 Skylab에 대한 비교가 병렬됩니다.\u003c/div>","segs":[{"n":21,"text":"The International Space Station, 국제 우주 정거장은. is almost four times as large as, 거의 네 배만큼 크다. the Russian space station Mir, 러시아 우주 정거장 미르보다. and about five times as large as, 그리고 약 다섯 배만큼 크다. the U.S. Skylab, 미국 스카이랩보다","hl":"ch"},{"n":22,"text":"이 문장은 배수와 as large as를 결합한 비교 표현이에요. almost four times as large as는 러시아의 Mir와 비교하고, about five times as large as는 미국의 Skylab과 비교하죠. and로 두 비교가 자연스럽게 이어집니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 The International Space Station is \u003cspan class=\"fx\">almost four times as large as the Russian space station Mir and about five times as large as\u003c/span> the U.S. Skylab.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>국제 우주 정거장이 러시아의 Mir보다 거의 네 배 크고 미국의 Skylab보다 약 다섯 배 크다는 뜻이에요. 두 비교를 통해 크기 차이를 구체적으로 보여 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">almost four times as large as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">nearly four times larger than\u003c/span>\u003cdiv class=\"w\">almost를 nearly로 바꾸고 배수 원급 비교를 배수 비교급으로 바꾸어 같은 의미를 더 직접적으로 표현합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">about five times as large as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">roughly five times the size of\u003c/span>\u003cdiv class=\"w\">about을 roughly로 바꾸고 크기 비교를 the size of 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">almost\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">nearly\u003c/span>\u003cspan class=\"y-eq\">almost = nearly\u003c/span>\u003cdiv class=\"w\">거의라는 뜻을 같은 의미의 부사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">about\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">approximately\u003c/span>\u003cspan class=\"y-eq\">about = approximately\u003c/span>\u003cdiv class=\"w\">약이라는 뜻을 더 격식 있는 부사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as large as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the size of\u003c/span>\u003cspan class=\"y-eq\">as large as = the size of\u003c/span>\u003cdiv class=\"w\">크기가 같거나 몇 배라는 비교를 크기 자체를 나타내는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The International Space Station is nearly four times larger than the Russian station Mir and roughly five times the size of the American Skylab.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"국제 우주 정거장이 러시아의 Mir보다 거의 네 배 크고, 미국의 Skylab보다 약 다섯 배 크다는 뜻이에요. 두 비교를 통해 크기 차이를 아주 구체적으로 보여 주는 문장입니다.","hl":"mn"},{"n":24,"text":"almost four times as large as는 nearly four times larger than, about five times as large as는 roughly five times the size of로 바꿀 수 있어요. 같은 크기 비교를 더 자연스럽게 표현한 것이죠.","hl":"rw"},{"n":25,"text":"almost는 nearly, about은 approximately, as large as는 the size of로 바꿔 표현할 수 있어요. 배수 비교에서는 almost나 about 같은 부사가 어디에 붙는지도 함께 기억해 두세요.","hl":"ph"},{"n":26,"text":"전체 문장을 바꿔 말하면 The International Space Station is nearly four times larger than the Russian station Mir and roughly five times the size of the American Skylab이라고 할 수 있어요. 두 우주 정거장과의 크기 비교가 분명하게 드러납니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 It is important \u003cspan class=\"fx\">not so much to give a man bread, as to put him in the way of earning it for himself\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It is important\u003c/div>\u003cdiv class=\"k\">중요하다\u003c/div>\u003cdiv class=\"e\">not so much to give a man bread,\u003c/div>\u003cdiv class=\"k\">남자에게 빵을 주는 것이라기보다는\u003c/div>\u003cdiv class=\"e\">as to put him in the way of earning it for himself.\u003c/div>\u003cdiv class=\"k\">그가 스스로 그것을 벌 수 있는 길에 들어서게 하는 것이\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">not so much A as B\u003c/b>는 'A라기보다는 오히려 B'라는 뜻입니다. 여기서는 to give a man bread와 to put him in the way of earning it for himself, 두 to부정사가 비교됩니다.\u003c/div>","segs":[{"n":27,"text":"It is important, 중요하다. not so much to give a man bread, 남자에게 빵을 주는 것이라기보다는. as to put him in the way of earning it for himself, 그가 스스로 그것을 벌 수 있는 길에 들어서게 하는 것이","hl":"ch"},{"n":28,"text":"이 문장은 not so much A as B 구조를 사용해요. A는 빵을 주는 일이고, B는 스스로 빵을 벌 수 있게 해 주는 일이죠. not so much가 A를 약하게 만들고 as 뒤의 B를 더 강하게 강조합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 It is important \u003cspan class=\"fx\">not so much to give a man bread, as to put him in the way of earning it for himself\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>당장 빵을 주는 일보다 스스로 빵을 벌 수 있게 도와주는 일이 더 중요하다는 뜻이에요. 일시적인 구제보다 자립을 돕는 것이 진짜 도움이라는 뉘앙스입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not so much to give a man bread, as to put him in the way of earning it for himself\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to put him in the way of earning it for himself rather than to give him bread\u003c/span>\u003cdiv class=\"w\">not so much A as B 구조를 B rather than A 구조로 바꾸어 강조점을 뒤에 두었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">put him in the way of earning it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">help him earn it\u003c/span>\u003cdiv class=\"w\">어려운 관용 표현을 쉽고 직접적인 동사구로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">put someone in the way of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">enable someone to\u003c/span>\u003cspan class=\"y-eq\">put someone in the way of = enable someone to\u003c/span>\u003cdiv class=\"w\">할 수 있는 길에 들어서게 하다라는 뜻을 가능하게 하다로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">earn it for himself\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make a living for himself\u003c/span>\u003cspan class=\"y-eq\">earn = make a living\u003c/span>\u003cdiv class=\"w\">스스로 벌다라는 뜻을 생계를 꾸리다라는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">give a man bread\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">provide a man with bread\u003c/span>\u003cspan class=\"y-eq\">give = provide with\u003c/span>\u003cdiv class=\"w\">빵을 주다라는 표현을 더 격식 있는 provide with 구조로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">It is more important to help a person earn bread for himself than simply to give him bread.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"당장 빵을 주는 것보다 스스로 빵을 벌 수 있도록 도와주는 것이 더 중요하다는 뜻이에요. 일시적인 도움보다 자립할 수 있게 하는 진짜 도움을 강조하는 문장입니다.","hl":"mn"},{"n":30,"text":"not so much to give a man bread, as to put him in the way of earning it for himself는 to put him in the way of earning it for himself rather than to give him bread로 바꿀 수 있어요. 또 put him in the way of earning it은 help him earn it처럼 쉽게 바꿀 수 있습니다.","hl":"rw"},{"n":31,"text":"put someone in the way of는 enable someone to, earn it for himself는 make a living for himself, give a man bread는 provide a man with bread로 바꿔 표현할 수 있어요. 관용 표현을 쉬운 말로 풀어 보는 연습이 중요합니다.","hl":"ph"},{"n":32,"text":"전체 문장을 바꿔 말하면 It is more important to help a person earn bread for himself than simply to give him bread라고 할 수 있어요. 빵을 주는 일보다 스스로 벌게 하는 일이 더 중요하다는 뜻이 잘 드러나죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 A person's choice and use of words \u003cspan class=\"fx\">tells as much about him or her as do manners, dress, and general behavior\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A person's choice and use of words\u003c/div>\u003cdiv class=\"k\">한 사람의 단어 선택과 사용은\u003c/div>\u003cdiv class=\"e\">tells as much about him or her\u003c/div>\u003cdiv class=\"k\">그 사람에 대해 그만큼 많이 말한다\u003c/div>\u003cdiv class=\"e\">as do manners, dress, and general behavior.\u003c/div>\u003cdiv class=\"k\">예의, 복장, 그리고 일반적인 행동이 말하는 것만큼\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as much about A as B\u003c/b>는 'B만큼 A에 대해 많이'라는 뜻입니다. as절에서 do manners, dress, and general behavior처럼 주어와 동사가 도치되어 길어진 주어를 자연스럽게 처리합니다.\u003c/div>","segs":[{"n":33,"text":"A person's choice and use of words, 한 사람의 단어 선택과 사용은. tells as much about him or her, 그 사람에 대해 그만큼 많이 말한다. as do manners, dress, and general behavior, 예의, 복장, 그리고 일반적인 행동이 말하는 것만큼","hl":"ch"},{"n":34,"text":"이 문장은 as much about A as B 구조예요. 단어 선택과 사용이 그 사람에 대해 말해 주는 정도를, 예의와 복장과 일반 행동이 말해 주는 정도와 비교하죠. as절에서는 do manners, dress, and general behavior처럼 도치가 일어나 문장이 조금 길어 보입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 A person's choice and use of words \u003cspan class=\"fx\">tells as much about him or her as do manners, dress, and general behavior\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>한 사람의 단어 선택과 사용이 그 사람의 예의, 복장, 일반적인 행동만큼 그 사람을 잘 보여 준다는 뜻이에요. 말투가 인상을 결정하는 중요한 단서라는 뉘앙스입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">tells as much about him or her as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">reveals as much about him or her as\u003c/span>\u003cdiv class=\"w\">tell about을 reveal about으로 바꾸어 '보여 주다'는 의미를 더 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">do manners, dress, and general behavior\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">manners, dress, and general behavior do\u003c/span>\u003cdiv class=\"w\">as절의 도치를 풀어 써서 문장 구조를 더 쉽게 만들었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">tell about\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">reveal about\u003c/span>\u003cspan class=\"y-eq\">tell = reveal\u003c/span>\u003cdiv class=\"w\">말해 주다라는 뜻을 드러내다라는 동의어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">choice and use of words\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">word choice and usage\u003c/span>\u003cspan class=\"y-eq\">choice and use of words = word choice and usage\u003c/span>\u003cdiv class=\"w\">단어 선택과 사용이라는 표현을 더 간결한 명사구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">general behavior\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">overall conduct\u003c/span>\u003cspan class=\"y-eq\">general behavior = overall conduct\u003c/span>\u003cdiv class=\"w\">일반적인 행동이라는 뜻을 격식 있는 conduct로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The words a person chooses and uses reveal as much about them as their manners, clothing, and overall behavior do.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"한 사람이 어떤 단어를 고르고 사용하는지가 그 사람의 예의나 복장, 일반적인 행동만큼 그 사람을 잘 보여 준다는 뜻이에요. 말투와 언어 습관이 인상을 결정하는 중요한 단서라는 뉘앙스입니다.","hl":"mn"},{"n":36,"text":"tells as much about him or her as는 reveals as much about him or her as로 바꿀 수 있어요. do manners, dress, and general behavior는 manners, dress, and general behavior do처럼 도치를 풀어 쓸 수 있습니다.","hl":"rw"},{"n":37,"text":"tell about은 reveal about, choice and use of words는 word choice and usage, general behavior는 overall conduct로 바꿔 표현할 수 있어요. as much about A as B 구조에서는 A와 B의 위치를 헷갈리지 않는 것이 중요합니다.","hl":"ph"},{"n":38,"text":"전체 문장을 바꿔 말하면 The words a person chooses and uses reveal as much about them as their manners, clothing, and overall behavior do라고 할 수 있어요. 말투가 그 사람을 보여 주는 정도를 예의나 복장과 나란히 비교한 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 Happiness is produced \u003cspan class=\"fx\">not so much by great pieces of good fortune that seldom happen, as by little advantages that occur every day\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Happiness is produced\u003c/div>\u003cdiv class=\"k\">행복은 만들어진다\u003c/div>\u003cdiv class=\"e\">not so much by great pieces of good fortune that seldom happen,\u003c/div>\u003cdiv class=\"k\">드물게 일어나는 큰 행운에 의해서라기보다는\u003c/div>\u003cdiv class=\"e\">as by little advantages that occur every day.\u003c/div>\u003cdiv class=\"k\">매일 일어나는 작은 이점들에 의해서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">not so much by A as by B\u003c/b>는 'A에 의해서라기보다는 B에 의해서'입니다. 수동태 is produced의 원인을 by구 두 개로 비교하며, that절이 각 명사를 꾸밉니다.\u003c/div>","segs":[{"n":39,"text":"Happiness is produced, 행복은 만들어진다. not so much by great pieces of good fortune that seldom happen, 드물게 일어나는 큰 행운에 의해서라기보다는. as by little advantages that occur every day, 매일 일어나는 작은 이점들에 의해서","hl":"ch"},{"n":40,"text":"이 문장은 not so much by A as by B 구조를 사용해요. A는 드물게 생기는 큰 행운이고, B는 매일 일어나는 작은 이점이죠. 수동태 is produced 뒤에서 두 by구의 원인을 비교하며, that절이 각 명사를 설명합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 Happiness is produced \u003cspan class=\"fx\">not so much by great pieces of good fortune that seldom happen, as by little advantages that occur every day\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>행복은 드물게 생기는 큰 행운보다 매일 일어나는 작은 좋은 일에서 더 많이 만들어진다는 뜻이에요. 일상의 소소한 긍정이 행복에 더 큰 영향을 준다는 뉘앙스입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not so much by great pieces of good fortune that seldom happen, as by little advantages that occur every day\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">by little advantages that occur every day rather than by great pieces of good fortune that seldom happen\u003c/span>\u003cdiv class=\"w\">not so much A as B 구조를 B rather than A 구조로 바꾸어 강조점을 앞으로 이동했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">great pieces of good fortune\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">huge strokes of luck\u003c/span>\u003cdiv class=\"w\">큰 행운이라는 표현을 더 관용적인 strokes of luck으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">seldom\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rarely\u003c/span>\u003cspan class=\"y-eq\">seldom = rarely\u003c/span>\u003cdiv class=\"w\">드물게라는 뜻을 같은 의미의 빈도 부사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">occur\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">happen\u003c/span>\u003cspan class=\"y-eq\">occur = happen\u003c/span>\u003cdiv class=\"w\">일어나다라는 뜻을 더 일상적인 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">little advantages\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">small benefits\u003c/span>\u003cspan class=\"y-eq\">little advantages = small benefits\u003c/span>\u003cdiv class=\"w\">작은 이점이라는 표현을 작은 유익함이라는 뜻으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Happiness comes more from small everyday benefits than from rare strokes of great luck.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"행복은 드물게 찾아오는 큰 행운보다 매일 일어나는 작은 좋은 일에서 더 많이 만들어진다는 뜻이에요. 일상 속 소소한 긍정이 행복에 더 큰 영향을 준다는 뉘앙스입니다.","hl":"mn"},{"n":42,"text":"not so much by great pieces of good fortune that seldom happen, as by little advantages that occur every day는 by little advantages that occur every day rather than by great pieces of good fortune that seldom happen으로 바꿀 수 있어요. great pieces of good fortune은 huge strokes of luck처럼 더 관용적으로 표현할 수 있습니다.","hl":"rw"},{"n":43,"text":"seldom은 rarely, occur는 happen, little advantages는 small benefits로 바꿔 표현할 수 있어요. by구 두 개를 비교할 때는 not so much 뒤와 as 뒤에 무엇이 오는지 정확히 표시하는 것이 중요합니다.","hl":"ph"},{"n":44,"text":"전체 문장을 바꿔 말하면 Happiness comes more from small everyday benefits than from rare strokes of great luck이라고 할 수 있어요. 큰 행운보다 매일의 작은 이점이 행복을 더 많이 만든다는 뜻이 간결하게 드러납니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 While people today have \u003cspan class=\"fx\">twice as much spending power as they did in the 1950s, they are ten times more likely to be depressed\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">While people today have\u003c/div>\u003cdiv class=\"k\">오늘날 사람들은 가지는 반면에\u003c/div>\u003cdiv class=\"e\">twice as much spending power as\u003c/div>\u003cdiv class=\"k\">두 배 많은 구매력을\u003c/div>\u003cdiv class=\"e\">they did in the 1950s,\u003c/div>\u003cdiv class=\"k\">1950년대에 그랬던 것만큼\u003c/div>\u003cdiv class=\"e\">they are ten times more likely\u003c/div>\u003cdiv class=\"k\">그들은 열 배 더 가능성이 높다\u003c/div>\u003cdiv class=\"e\">to be depressed.\u003c/div>\u003cdiv class=\"k\">우울해질\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">twice as much ... as\u003c/b>는 '~보다 두 배 많은'을, \u003cb class=\"key\">ten times more likely\u003c/b>는 '열 배 더 가능성이 높은'을 나타냅니다. while이 두 사실을 대조합니다.\u003c/div>","segs":[{"n":45,"text":"While people today have, 오늘날 사람들은 가지는 반면에. twice as much spending power as, 두 배 많은 구매력을. they did in the 1950s, 1950년대에 그랬던 것만큼. they are ten times more likely, 그들은 열 배 더 가능성이 높다. to be depressed, 우울해질","hl":"ch"},{"n":46,"text":"이 문장에는 두 가지 비교가 함께 있어요. twice as much spending power as는 천구백오십 년대보다 두 배 많은 구매력을 뜻하고, ten times more likely to be depressed는 열 배 더 우울해질 가능성이 높다는 뜻이죠. while이 이 두 사실을 대조해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 While people today have \u003cspan class=\"fx\">twice as much spending power as they did in the 1950s, they are ten times more likely to be depressed\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>오늘날 사람들은 1950년대보다 두 배의 구매력을 지녔지만 우울해질 가능성은 열 배 더 높다는 뜻이에요. 물질적 풍요가 정신적 행복을 보장하지 않는다는 대조가 드러납니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">twice as much spending power as they did\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">twice the spending power that they had\u003c/span>\u003cdiv class=\"w\">배수 원급 비교를 명사 중심의 배수 표현으로 바꾸어 간결하게 만들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ten times more likely to be depressed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ten times as likely to suffer from depression\u003c/span>\u003cdiv class=\"w\">more likely to be depressed를 as likely to suffer from depression으로 바꾸어 같은 의미를 더 격식 있게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">spending power\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">purchasing power\u003c/span>\u003cspan class=\"y-eq\">spending power = purchasing power\u003c/span>\u003cdiv class=\"w\">구매력이라는 뜻을 경제 분야에서 자주 쓰는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be likely to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be apt to\u003c/span>\u003cspan class=\"y-eq\">be likely to = be apt to\u003c/span>\u003cdiv class=\"w\">할 가능성이 높다라는 뜻을 같은 의미의 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">depressed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">down\u003c/span>\u003cspan class=\"y-eq\">depressed = down\u003c/span>\u003cdiv class=\"w\">우울한이라는 뜻을 더 구어적인 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Although people today have twice the purchasing power they had in the nineteen fifties, they are ten times as likely to suffer from depression.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"오늘날 사람들이 예전보다 두 배 많은 구매력을 가졌지만 우울해질 가능성은 열 배 더 높다는 뜻이에요. 물질적으로 풍요로워졌다고 해서 정신적으로 더 행복해진 것은 아니라는 점을 보여 주죠.","hl":"mn"},{"n":48,"text":"twice as much spending power as they did는 twice the spending power that they had로 바꿀 수 있어요. ten times more likely to be depressed는 ten times as likely to suffer from depression으로 바꿔 쓸 수 있습니다.","hl":"rw"},{"n":49,"text":"spending power는 purchasing power, be likely to는 be apt to, depressed는 down으로 바꿔 표현할 수 있어요. 시험에서는 같은 뜻의 다른 어구를 고르는 문제가 자주 나옵니다.","hl":"ph"},{"n":50,"text":"전체 문장을 바꿔 말하면 Although people today have twice the purchasing power they had in the nineteen fifties, they are ten times as likely to suffer from depression이라고 할 수 있어요. 물질적 풍요와 정신적 건강의 대조가 잘 드러납니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 A hero can be anyone, even a man doing something \u003cspan class=\"fx\">as simple and reassuring as putting a coat on a young boy's shoulders\u003c/span> to let him know that the world hadn't ended.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A hero can be anyone,\u003c/div>\u003cdiv class=\"k\">영웅은 누구든지 될 수 있다\u003c/div>\u003cdiv class=\"e\">even a man\u003c/div>\u003cdiv class=\"k\">심지어 어떤 남자도\u003c/div>\u003cdiv class=\"e\">doing something as simple and reassuring as\u003c/div>\u003cdiv class=\"k\">만큼 간단하고 안심시키는 무언가를 하는\u003c/div>\u003cdiv class=\"e\">putting a coat on a young boy's shoulders\u003c/div>\u003cdiv class=\"k\">어린 소년의 어깨에 외투를 걸쳐 주는\u003c/div>\u003cdiv class=\"e\">to let him know\u003c/div>\u003cdiv class=\"k\">그에게 알려주기 위해\u003c/div>\u003cdiv class=\"e\">that the world hadn't ended.\u003c/div>\u003cdiv class=\"k\">세상이 끝나지 않았다는 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as + 형용사 + as + 동명사\u003c/b>는 '~하는 것만큼 ...한'을 나타냅니다. simple and reassuring이 as 사이에서 병렬되어 행동의 성격을 설명합니다.\u003c/div>","segs":[{"n":51,"text":"A hero can be anyone, 영웅은 누구든지 될 수 있다. even a man, 심지어 어떤 남자도. doing something as simple and reassuring as, 만큼 간단하고 안심시키는 무언가를 하는. putting a coat on a young boy's shoulders, 어린 소년의 어깨에 외투를 걸쳐 주는. to let him know, 그에게 알려주기 위해. that the world hadn't ended, 세상이 끝나지 않았다는 것을","hl":"ch"},{"n":52,"text":"이 문장은 as simple and reassuring as putting a coat on a young boy's shoulders라는 원급 비교를 사용해요. as 와 as 사이에 simple and reassuring이 들어가고, 뒤에는 동명사 putting이 와서 행동을 비교합니다. 작은 행동이 얼마나 간단하고 안심시키는지 설명하는 구조죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 A hero can be anyone, even a man doing something \u003cspan class=\"fx\">as simple and reassuring as putting a coat on a young boy's shoulders\u003c/span> to let him know that the world hadn't ended.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>영웅은 거창한 사람만이 아니라 작은 친절과 위로를 실천하는 평범한 사람도 될 수 있다는 뜻이에요. 어린 소년을 안심시키는 작은 행동이 영웅적인 의미를 지닌다고 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as simple and reassuring as putting a coat on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as ordinary yet comforting as placing a coat over\u003c/span>\u003cdiv class=\"w\">simple and reassuring을 ordinary yet comforting로 바꾸어 의미를 더 풀어 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">A hero can be anyone\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Anyone can be a hero\u003c/span>\u003cdiv class=\"w\">영웅이 누구든지 될 수 있다는 의미를 주어 중심으로 바꾸어 같은 뜻을 더 직접적으로 전달합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">reassuring\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">comforting\u003c/span>\u003cspan class=\"y-eq\">reassuring = comforting\u003c/span>\u003cdiv class=\"w\">안심시키는이라는 뜻을 위로가 되는이라는 동의어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">let him know\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">remind him\u003c/span>\u003cspan class=\"y-eq\">let him know = remind him\u003c/span>\u003cdiv class=\"w\">알게 하다라는 표현을 상기시키다라는 뜻으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">hadn't ended\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">still existed\u003c/span>\u003cspan class=\"y-eq\">hadn't ended = still existed\u003c/span>\u003cdiv class=\"w\">끝나지 않았다는 표현을 여전히 존재한다는 뜻으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Anyone can be a hero, even someone who does something as ordinary and comforting as placing a coat over a young boy's shoulders to remind him that the world still existed.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"영웅은 거창한 사람만이 아니라 작은 친절과 위로를 실천하는 평범한 사람도 될 수 있다는 뜻이에요. 어린 소년에게 외투를 걸쳐 주며 세상이 끝나지 않았다고 안심시키는 작은 행동도 영웅적인 의미를 지닌다고 강조합니다.","hl":"mn"},{"n":54,"text":"as simple and reassuring as putting a coat on은 as ordinary yet comforting as placing a coat over로 바꿀 수 있어요. A hero can be anyone은 Anyone can be a hero로 바꾸어 같은 뜻을 더 직접적으로 표현할 수 있습니다.","hl":"rw"},{"n":55,"text":"reassuring은 comforting, let him know는 remind him, hadn't ended는 still existed로 바꿔 표현할 수 있어요. 원급 비교에서는 as 사이의 형용사와 as 뒤의 동명사가 자연스럽게 연결되는지 확인해야 합니다.","hl":"ph"},{"n":56,"text":"전체 문장을 바꿔 말하면 Anyone can be a hero, even someone who does something as ordinary and comforting as placing a coat over a young boy's shoulders to remind him that the world still existed라고 할 수 있어요. 작은 친절도 영웅적인 행동이 될 수 있다는 의미가 잘 살아 있습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 The consequences of interaction can be difficult to foresee because they \u003cspan class=\"fx\">depend as much on the behavior of others as on oneself\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The consequences of interaction\u003c/div>\u003cdiv class=\"k\">상호작용의 결과는\u003c/div>\u003cdiv class=\"e\">can be difficult to foresee\u003c/div>\u003cdiv class=\"k\">예측하기 어려울 수 있다\u003c/div>\u003cdiv class=\"e\">because they depend\u003c/div>\u003cdiv class=\"k\">왜냐하면 그것들은 달려 있기 때문이다\u003c/div>\u003cdiv class=\"e\">as much on the behavior of others\u003c/div>\u003cdiv class=\"k\">타인의 행동에 많이\u003c/div>\u003cdiv class=\"e\">as on oneself.\u003c/div>\u003cdiv class=\"k\">자기 자신에 달려 있는 만큼\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">depend as much on A as on B\u003c/b>는 'B에 달려 있는 만큼 A에도 달려 있다'입니다. as much가 depend on의 정도를 비교하고, 전치사 on이 반복되어 대상을 병렬합니다.\u003c/div>","segs":[{"n":57,"text":"The consequences of interaction, 상호작용의 결과는. can be difficult to foresee, 예측하기 어려울 수 있다. because they depend, 왜냐하면 그것들은 달려 있기 때문이다. as much on the behavior of others, 타인의 행동에 많이. as on oneself, 자기 자신에 달려 있는 만큼","hl":"ch"},{"n":58,"text":"이 문장은 depend as much on A as on B 구조를 사용해요. 상호작용의 결과가 타인의 행동에 달려 있는 정도를, 자기 자신의 행동에 달려 있는 정도와 비교하죠. as much가 depend on의 정도를 꾸미고, on이 두 번 반복되어 대상을 병렬합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 The consequences of interaction can be difficult to foresee because they \u003cspan class=\"fx\">depend as much on the behavior of others as on oneself\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>상호작용의 결과는 나 자신의 행동만큼 다른 사람의 행동에도 좌우되기 때문에 예측하기 어렵다는 뜻이에요. 관계의 결과는 혼자서 통제하기 어렵다는 뉘앙스입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">depend as much on the behavior of others as on oneself\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">depend on the behavior of others just as much as on one's own\u003c/span>\u003cdiv class=\"w\">as much를 just as much로 바꾸고 oneself를 one's own로 풀어 써서 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">can be difficult to foresee\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can be hard to predict\u003c/span>\u003cdiv class=\"w\">difficult to foresee를 hard to predict로 바꾸어 더 일상적인 표현으로 만들었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">consequences\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">results\u003c/span>\u003cspan class=\"y-eq\">consequences = results\u003c/span>\u003cdiv class=\"w\">결과라는 뜻을 같은 의미의 명사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">foresee\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">predict\u003c/span>\u003cspan class=\"y-eq\">foresee = predict\u003c/span>\u003cdiv class=\"w\">예측하다라는 뜻을 더 일반적인 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the behavior of others\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">other people's actions\u003c/span>\u003cspan class=\"y-eq\">behavior = actions\u003c/span>\u003cdiv class=\"w\">타인의 행동이라는 표현을 더 직접적인 명사구로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The results of interaction may be hard to predict because they depend on other people's behavior just as much as on one's own.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"상호작용의 결과는 나 자신의 행동만큼 다른 사람의 행동에도 좌우되기 때문에 예측하기 어렵다는 뜻이에요. 관계의 결과는 혼자서 통제하기 어렵다는 뉘앙스를 담고 있습니다.","hl":"mn"},{"n":60,"text":"depend as much on the behavior of others as on oneself는 depend on the behavior of others just as much as on one's own로 바꿀 수 있어요. can be difficult to foresee는 can be hard to predict로 바꾸어 더 쉽게 표현할 수 있습니다.","hl":"rw"},{"n":61,"text":"consequences는 results, foresee는 predict, the behavior of others는 other people's actions로 바꿔 표현할 수 있어요. as much on A as on B에서는 on 뒤에 오는 대상을 정확히 비교하는 것이 핵심입니다.","hl":"ph"},{"n":62,"text":"전체 문장을 바꿔 말하면 The results of interaction may be hard to predict because they depend on other people's behavior just as much as on one's own이라고 할 수 있어요. 상호작용의 결과가 나와 타인 모두에게 달려 있다는 의미가 잘 드러납니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 Singapore has nearly 8,000 people per km2, and is \u003cspan class=\"fx\">more than 200 times as dense as\u003c/span> the U.S.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Singapore has\u003c/div>\u003cdiv class=\"k\">싱가포르는 가지고 있다\u003c/div>\u003cdiv class=\"e\">nearly 8,000 people per km2,\u003c/div>\u003cdiv class=\"k\">평방킬로미터당 거의 8,000명의 사람을\u003c/div>\u003cdiv class=\"e\">and is more than 200 times as dense as\u003c/div>\u003cdiv class=\"k\">그리고 200배 이상만큼 밀집되어 있다\u003c/div>\u003cdiv class=\"e\">the U.S.\u003c/div>\u003cdiv class=\"k\">미국보다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">more than + 배수 + as + 형용사 + as\u003c/b>는 '~보다 몇 배 이상 ...한'을 뜻합니다. more than이 200 times 전체를 꾸며 밀도 차이를 강조합니다.\u003c/div>","segs":[{"n":63,"text":"Singapore has, 싱가포르는 가지고 있다. nearly 8,000 people per km2, 평방킬로미터당 거의 8,000명의 사람을. and is more than 200 times as dense as, 그리고 200배 이상만큼 밀집되어 있다. the U.S, 미국보다","hl":"ch"},{"n":64,"text":"이 문장은 more than과 배수, as dense as를 결합한 표현이에요. more than two hundred times as dense as는 미국보다 이백 배 이상 밀집되어 있다는 뜻이죠. more than이 배수 전체를 꾸며서 정도를 더 강하게 만듭니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 Singapore has nearly 8,000 people per km2, and is \u003cspan class=\"fx\">more than 200 times as dense as\u003c/span> the U.S.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>싱가포르가 미국보다 200배 이상 인구 밀도가 높다는 뜻이에요. 수치를 통해 매우 높은 밀집도를 강하게 보여 주는 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">more than 200 times as dense as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">over 200 times denser than\u003c/span>\u003cdiv class=\"w\">more than을 over로 바꾸고 배수 원급 비교를 배수 비교급으로 바꾸어 같은 의미를 더 직접적으로 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nearly 8,000 people per km2\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">almost 8,000 people per square kilometer\u003c/span>\u003cdiv class=\"w\">nearly를 almost로 바꾸고 km2를 풀어 써서 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nearly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">almost\u003c/span>\u003cspan class=\"y-eq\">nearly = almost\u003c/span>\u003cdiv class=\"w\">거의라는 뜻을 같은 의미의 부사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">per km2\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">per square kilometer\u003c/span>\u003cspan class=\"y-eq\">per km2 = per square kilometer\u003c/span>\u003cdiv class=\"w\">평방킬로미터당이라는 단위 표현을 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dense\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">crowded\u003c/span>\u003cspan class=\"y-eq\">dense = crowded\u003c/span>\u003cdiv class=\"w\">밀집된이라는 뜻을 붐비는이라는 의미로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Singapore has almost eight thousand people per square kilometer and is over two hundred times denser than the United States.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"싱가포르가 미국보다 이백 배 이상 인구 밀도가 높다는 뜻이에요. 수치를 통해 매우 높은 밀집도를 강하게 보여 주는 문장입니다.","hl":"mn"},{"n":66,"text":"more than two hundred times as dense as는 over two hundred times denser than으로 바꿀 수 있어요. nearly eight thousand people per square kilometer는 almost eight thousand people per square kilometer처럼 더 쉽게 표현할 수 있습니다.","hl":"rw"},{"n":67,"text":"nearly는 almost, per square kilometer는 평방킬로미터당, dense는 crowded로 바꿔 표현할 수 있어요. 배수 비교에서 more than이 어디까지 꾸미는지도 함께 기억해 두세요.","hl":"ph"},{"n":68,"text":"전체 문장을 바꿔 말하면 Singapore has almost eight thousand people per square kilometer and is over two hundred times denser than the United States라고 할 수 있어요. 싱가포르의 높은 인구 밀도가 수치와 배수로 분명하게 드러납니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Most insomnia is \u003cspan class=\"fx\">not an illness or a physical condition so much as a  symptom\u003c/span> of another problem that may simply be a reaction to certain medications, anxiety about travel, or stress before a job interview.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Most insomnia is\u003c/div>\u003cdiv class=\"k\">대부분의 불면증은\u003c/div>\u003cdiv class=\"e\">not an illness or a physical condition\u003c/div>\u003cdiv class=\"k\">질환이나 신체적 상태가 아니라\u003c/div>\u003cdiv class=\"e\">so much as a  symptom of another problem\u003c/div>\u003cdiv class=\"k\">오히려 다른 문제의 증상이다\u003c/div>\u003cdiv class=\"e\">that may simply be a reaction to certain medications,\u003c/div>\u003cdiv class=\"k\">그 문제는 단순히 특정 약물에 대한 반응일 수 있다\u003c/div>\u003cdiv class=\"e\">anxiety about travel,\u003c/div>\u003cdiv class=\"k\">여행에 대한 불안\u003c/div>\u003cdiv class=\"e\">or stress before a job interview.\u003c/div>\u003cdiv class=\"k\">또는 취업 면접 전의 스트레스\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">not A so much as B\u003c/b>는 'A라기보다는 오히려 B'라는 뜻입니다. not이 A를 부정하고 so much as가 B를 강조해, 불면증의 정체를 질환이 아닌 증상으로 규정합니다.\u003c/div>","segs":[{"n":69,"text":"Most insomnia is, 대부분의 불면증은. not an illness or a physical condition, 질환이나 신체적 상태가 아니라. so much as a symptom of another problem, 오히려 다른 문제의 증상이다. that may simply be a reaction to certain medications, 그 문제는 단순히 특정 약물에 대한 반응일 수 있다. anxiety about travel, 여행에 대한 불안. or stress before a job interview, 또는 취업 면접 전의 스트레스","hl":"ch"},{"n":70,"text":"이 문장은 not A so much as B 구조를 사용해요. A는 질환이나 신체적 상태이고, B는 다른 문제의 증상이죠. not이 A를 부정하고 so much as가 B를 강조해서 불면증의 정체를 증상 쪽으로 규정합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Most insomnia is \u003cspan class=\"fx\">not an illness or a physical condition so much as a  symptom\u003c/span> of another problem that may simply be a reaction to certain medications, anxiety about travel, or stress before a job interview.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>대부분의 불면증은 그 자체의 질환이라기보다 다른 문제의 증상이라는 뜻이에요. 약물 반응, 여행에 대한 불안, 면접 전 스트레스 같은 원인이 있을 수 있다고 말합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not an illness or a physical condition so much as a symptom\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a symptom rather than an illness or a physical condition\u003c/span>\u003cdiv class=\"w\">not A so much as B 구조를 B rather than A 구조로 바꾸어 강조점을 앞으로 이동했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">may simply be a reaction to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">might just be a response to\u003c/span>\u003cdiv class=\"w\">may simply be를 might just be로 바꾸고 reaction을 response로 바꾸어 같은 의미를 더 자연스럽게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">insomnia\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">sleeplessness\u003c/span>\u003cspan class=\"y-eq\">insomnia = sleeplessness\u003c/span>\u003cdiv class=\"w\">불면증이라는 뜻을 같은 의미의 일반적인 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">physical condition\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">medical condition\u003c/span>\u003cspan class=\"y-eq\">physical condition = medical condition\u003c/span>\u003cdiv class=\"w\">신체적 상태라는 표현을 의학적 상태라는 뜻으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">anxiety about\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">worry about\u003c/span>\u003cspan class=\"y-eq\">anxiety = worry\u003c/span>\u003cdiv class=\"w\">불안이라는 뜻을 더 일상적인 worry로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Most insomnia is less an illness or physical condition than a symptom of another problem, which may simply be a reaction to certain medications, anxiety about travel, or stress before a job interview.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"대부분의 불면증은 그 자체의 질환이라기보다 다른 문제의 증상이라는 뜻이에요. 특정 약물에 대한 반응, 여행에 대한 불안, 면접 전 스트레스 같은 원인이 있을 수 있다고 말합니다.","hl":"mn"},{"n":72,"text":"not an illness or a physical condition so much as a symptom은 a symptom rather than an illness or a physical condition으로 바꿀 수 있어요. may simply be a reaction to는 might just be a response to로 바꾸어 더 자연스럽게 표현할 수 있습니다.","hl":"rw"},{"n":73,"text":"insomnia는 sleeplessness, physical condition은 medical condition, anxiety about은 worry about으로 바꿔 표현할 수 있어요. not A so much as B 구조에서는 A와 B가 각각 무엇인지 표시하며 읽는 것이 중요합니다.","hl":"ph"},{"n":74,"text":"전체 문장을 바꿔 말하면 Most insomnia is less an illness or physical condition than a symptom of another problem, which may simply be a reaction to certain medications, anxiety about travel, or stress before a job interview라고 할 수 있어요. 불면증이 질환보다 다른 문제의 증상이라는 의미가 잘 드러납니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">as ... as\u003c/b>는 두 대상의 정도가 같음을 비교하는 원급 비교입니다.\u003c/li>\u003cli>\u003cb class=\"key\">배수 + as ... as\u003c/b>는 '~보다 몇 배 더 ...한'을 나타내며, almost나 about이 배수를 꾸밀 수 있습니다.\u003c/li>\u003cli>\u003cb class=\"key\">not so much A as B\u003c/b>와 \u003cb class=\"key\">not A so much as B\u003c/b>는 모두 'A라기보다는 오히려 B'로 해석합니다.\u003c/li>\u003cli>\u003cb class=\"key\">as much on A as on B\u003c/b>처럼 전치사구를 병렬하면 'B만큼 A에'라는 의미를 만듭니다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 마블레드 유닛에서 비교 표현을 집중적으로 봤어요. as 와 as 사이에 형용사나 부사를 넣는 원급 비교, 배수 표현, not so much A as B까지 모두 독해에서 자주 만나는 형태죠. 핵심은 앞뒤 대상의 무게를 비교하며 의미를 잡는 거예요. 다음 시간에도 다양한 문장으로 비교 표현을 꼭 복습해 봅시다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
