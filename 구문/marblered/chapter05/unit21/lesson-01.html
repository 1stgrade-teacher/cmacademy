  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

  a.onloadeddata=function(){okBase=true;};

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};

  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"unit21","title":"명사 뒤 수식 블록으로 긴 문장 꿰뚫기","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편 Unit 21 명사 + (형용사 +) 전치사구\u003c/div>\u003ch1>명사 뒤 수식 블록으로 긴 문장 꿰뚫기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>명사 뒤에 붙는 형용사구와 전치사구를 블록으로 잡아 문장 구조와 수식을 정확히 파악한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마법같은 블록구문 실전편에서 명사 뒤에 붙는 수식 블록을 배워 볼 거예요. 영어 문장에서 명사 뒤에 형용사구나 전치사구가 붙으면 그 명사를 꾸미는 하나의 블록이 됩니다. 이 구조를 잡으면 긴 문장도 훨씬 쉽게 읽을 수 있어요. 오늘도 차근차근 같이 연습해 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 Unit 21 명사 + (형용사 +) 전치사구\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">영어에서는 명사 뒤에 \u003cb class=\"key\">형용사구\u003c/b>나 \u003cb class=\"key\">전치사구\u003c/b>가 붙어 앞의 명사를 수식할 수 있습니다. 특히 \u003cb class=\"key\">명사 + 형용사 + 전치사구\u003c/b> 구조에서는 형용사와 전치사구를 한 덩어리로 묶어 해석해야 합니다. 긴 수식어에 흔들리지 말고 \u003cb class=\"key\">주어의 핵심 명사\u003c/b>와 \u003cb class=\"key\">동사\u003c/b>를 찾는 것이 중요합니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Now the Internet has become a well-integrated technology \u003cspan class=\"fx\">essential to global business and culture\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 All people have \u003cspan class=\"fx\">the right to medical care\u003c/span> regardless of race, religion, creed or political affiliation.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 A small blue car \u003cspan class=\"fx\">with an unknown driver at the wheel\u003c/span> was following close behind my car.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 The greatest scientific discoveries are \u003cspan class=\"fx\">the product of imagination, curiosity, and years of careful research\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 A global network of non-government organizations works toward eliminating \u003cspan class=\"fx\">the production and use of toxic chemicals harmful to human health and the environment\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Read \u003cspan class=\"fx\">the instructions on the front cover of each test\u003c/span> carefully.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 Microsoft Excel is a flexible and user-friendly software \u003cspan class=\"fx\">suitable for beginners and advanced users alike\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">Empathy in the sense of adopting someone's viewpoint\u003c/span> is not the same as empathy in the sense of feeling compassion toward the person, but the first can lead to the second by a natural route.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 Love is the only force \u003cspan class=\"fx\">capable of transforming an enemy into a friend\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 The particular strategies \u003cspan class=\"fx\">appropriate to an organization\u003c/span> depend to a large extent on the political and financial circumstances of the organization.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">Challenges to new ideas\u003c/span> are the legitimate business of science in building valid knowledge.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Often \u003cspan class=\"fx\">the difference between feeling fulfilled at work and feeling empty, lost, annoyed, and burned out\u003c/span> is all about whether or not you're learning anything.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘의 핵심은 명사 뒤에 붙은 형용사구나 전치사구를 앞의 명사와 함께 한 블록으로 읽는 거예요. 특히 명사 뒤에 형용사가 오고 그 뒤에 전치사구가 이어지면 끝까지 붙여서 해석해야 합니다. 긴 수식어가 동사 앞에 있어도 주어의 핵심 명사와 동사를 먼저 찾으면 문장이 훨씬 선명해져요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Now the Internet has become a well-integrated technology \u003cspan class=\"fx\">essential to global business and culture\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Now the Internet\u003c/div>\u003cdiv class=\"k\">이제 인터넷은\u003c/div>\u003cdiv class=\"e\">has become\u003c/div>\u003cdiv class=\"k\">되어 왔다\u003c/div>\u003cdiv class=\"e\">a well-integrated technology\u003c/div>\u003cdiv class=\"k\">잘 통합된 기술이\u003c/div>\u003cdiv class=\"e\">essential to global business and culture.\u003c/div>\u003cdiv class=\"k\">[전 세계적 사업과 문화에 필수적인]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">essential to global business and culture\u003c/b>는 앞의 명사 \u003cb class=\"key\">a well-integrated technology\u003c/b>를 뒤에서 수식하는 형용사구입니다. 명사 + 형용사 + 전치사구 블록으로 묶어 읽습니다.\u003c/div>","segs":[{"n":3,"text":"Now the Internet, 이제 인터넷은. has become, 되어 왔다. a well-integrated technology, 잘 통합된 기술이. essential to global business and culture, [전 세계적 사업과 문화에 필수적인]","hl":"ch"},{"n":4,"text":"첫 번째 문장에서 핵심은 essential to global business and culture예요. 이 덩어리가 앞에 있는 a well-integrated technology를 뒤에서 꾸며 주죠. 그래서 인터넷이 어떤 기술인지 끝까지 읽으면서 이해해야 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Now the Internet has become a well-integrated technology \u003cspan class=\"fx\">essential to global business and culture\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인터넷이 이제 세계 사업과 문화에 꼭 필요한 기술이 되었다는 뜻입니다. ‘잘 통합된’은 생활 깊숙이 자연스럽게 자리 잡았다는 뉘앙스예요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">has become a well-integrated technology essential to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has grown into an indispensable technology for\u003c/span>\u003cdiv class=\"w\">become 대신 grow into를 쓰면 변화와 성장의 느낌이 살고, indispensable는 essential보다 필요성을 강하게 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">global business and culture\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">business and culture around the world\u003c/span>\u003cdiv class=\"w\">global을 풀어 쓴 표현으로, 뜻은 같지만 더 일상적인 문장이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">essential to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">indispensable to\u003c/span>\u003cspan class=\"y-eq\">essential to = indispensable to\u003c/span>\u003cdiv class=\"w\">필수적인이라는 뜻을 더 강한 어감으로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">well-integrated\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">well-established\u003c/span>\u003cspan class=\"y-eq\">well-integrated = well-established\u003c/span>\u003cdiv class=\"w\">잘 자리 잡은 상태라는 의미로 바꾸어 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">global business and culture\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">worldwide commerce and culture\u003c/span>\u003cspan class=\"y-eq\">global = worldwide\u003c/span>\u003cdiv class=\"w\">global을 worldwide로 풀고 business를 commerce로 바꾼 격식 있는 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The Internet is now a fully integrated technology that is indispensable to business and culture around the world.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 인터넷이 이제 전 세계 사업과 문화에 꼭 필요한 기술이 되었다는 뜻이에요. well-integrated는 단순히 널리 쓰인다는 느낌보다 생활과 산업에 자연스럽게 깊이 자리 잡았다는 뉘앙스를 줘요.","hl":"mn"},{"n":6,"text":"표현을 바꿀 때는 has become a well-integrated technology essential to를 has grown into an indispensable technology for로 바꿔 볼 수 있어요. 뜻은 거의 같지만 indispensable를 쓰면 필요성이 더 강하게 느껴져요.","hl":"rw"},{"n":7,"text":"essential to는 indispensable to로 바꿀 수 있고 well-integrated는 well-established로 바꿀 수 있어요. global business and culture는 worldwide commerce and culture처럼 표현할 수 있습니다.","hl":"ph"},{"n":8,"text":"이제 같은 뜻을 다른 문장으로 읽어 볼게요. The Internet is now a fully integrated technology that is indispensable to business and culture around the world. 앞에서 배운 수식 구조가 자연스럽게 살아 있는 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 All people have \u003cspan class=\"fx\">the right to medical care\u003c/span> regardless of race, religion, creed or political affiliation.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">All people\u003c/div>\u003cdiv class=\"k\">모든 사람들은\u003c/div>\u003cdiv class=\"e\">have the right\u003c/div>\u003cdiv class=\"k\">권리를 가지고 있다\u003c/div>\u003cdiv class=\"e\">to medical care\u003c/div>\u003cdiv class=\"k\">[의료에 대한]\u003c/div>\u003cdiv class=\"e\">regardless of race, religion, creed or political affiliation.\u003c/div>\u003cdiv class=\"k\">인종, 종교, 신조 또는 정치적 소속에 관계없이\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">to medical care\u003c/b>가 앞의 명사 \u003cb class=\"key\">the right\u003c/b>를 수식하는 전치사구입니다. \u003cb class=\"key\">regardless of\u003c/b> 뒤에는 race, religion, creed, political affiliation이 or로 병렬 연결되어 있습니다.\u003c/div>","segs":[{"n":9,"text":"All people, 모든 사람들은. have the right, 권리를 가지고 있다. to medical care, [의료에 대한]. regardless of race, religion, creed or political affiliation, 인종, 종교, 신조 또는 정치적 소속에 관계없이","hl":"ch"},{"n":10,"text":"두 번째 문장에서는 to medical care가 앞의 the right를 꾸미는 전치사구예요. 또 regardless of 뒤에는 race, religion, creed, political affiliation이 or로 나란히 연결되어 있죠. 이 병렬 구조를 한 덩어리로 읽는 것이 중요해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 All people have \u003cspan class=\"fx\">the right to medical care\u003c/span> regardless of race, religion, creed or political affiliation.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>모든 사람이 인종이나 종교, 신념, 정치적 소속과 상관없이 의료 서비스를 받을 권리가 있다는 뜻입니다. 평등한 의료 접근을 강조하는 표현이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have the right to medical care\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are entitled to medical care\u003c/span>\u003cdiv class=\"w\">have the right to보다 are entitled to가 권리 보장의 의미를 더 공식적으로 드러냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">regardless of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">irrespective of\u003c/span>\u003cdiv class=\"w\">뜻은 같지만 irrespective of가 더 격식 있는 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">regardless of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">irrespective of\u003c/span>\u003cspan class=\"y-eq\">regardless of = irrespective of\u003c/span>\u003cdiv class=\"w\">관계없이라는 뜻을 격식 있는 어구로 바꾼 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">medical care\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan cl span>\u003cspan class=\"t\">adaptable and easy to use\u003c/span>\u003cdiv class=\"w\">유연하고 사용하기 쉽다는 뜻을 더 일상적인 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">suitable for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">appropriate for\u003c/span>\u003cspan class=\"y-eq\">suitable for = appropriate for\u003c/span>\u003cdiv class=\"w\">적합하다는 뜻을 비슷한 격식 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">user-friendly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">easy to use\u003c/span>\u003cspan class=\"y-eq\">user-friendly = easy to use\u003c/span>\u003cdiv class=\"w\">사용자 친화적이라는 뜻을 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">alike\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">equally\u003c/span>\u003cspan class=\"y-eq\">alike = equally\u003c/span>\u003cdiv class=\"w\">양쪽 모두 똑같이 적합하다는 의미를 equally로 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Microsoft Excel is adaptable and easy to use, making it appropriate for both beginners and advanced users.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"엑셀은 초보자와 숙련자 모두에게 알맞은 유연하고 사용하기 쉬운 소프트웨어라는 뜻이에요. 다양한 사용자 층을 아우른다는 장점을 강조합니다.","hl":"mn"},{"n":42,"text":"suitable for beginners and advanced users alike는 appropriate for both novices and experts로 바꿀 수 있어요. flexible and user-friendly는 adaptable and easy to use로 바꾸면 뜻이 더 쉽게 다가옵니다.","hl":"rw"},{"n":43,"text":"suitable for는 appropriate for로, user-friendly는 easy to use로 바꿀 수 있어요. alike는 equally나 both의 느낌으로 정리해 두면 좋습니다.","hl":"ph"},{"n":44,"text":"같은 뜻을 이렇게 말할 수 있어요. Microsoft Excel is adaptable and easy to use, making it appropriate for both beginners and advanced users. 대상이 넓다는 느낌이 잘 살아 있죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 \u003cspan class=\"fx\">Empathy in the sense of adopting someone's viewpoint\u003c/span> is not the same as empathy in the sense of feeling compassion toward the person, but the first can lead to the second by a natural route.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Empathy in the sense of adopting someone's viewpoint\u003c/div>\u003cdiv class=\"k\">다른 사람의 관점을 취한다는 의미에서의 공감은\u003c/div>\u003cdiv class=\"e\">is not the same as\u003c/div>\u003cdiv class=\"k\">동일하지 않다\u003c/div>\u003cdiv class=\"e\">empathy in the sense of feeling compassion toward the person,\u003c/div>\u003cdiv class=\"k\">그 사람을 향해 동정심을 느낀다는 의미에서의 공감과\u003c/div>\u003cdiv class=\"e\">but the first can lead to the second\u003c/div>\u003cdiv class=\"k\">그러나 전자는 후자로 이어질 수 있다\u003c/div>\u003cdiv class=\"e\">by a natural route.\u003c/div>\u003cdiv class=\"k\">자연스러운 경로를 통해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">in the sense of adopting someone's viewpoint\u003c/b>와 \u003cb class=\"key\">in the sense of feeling compassion toward the person\u003c/b>가 각각 앞의 명사 \u003cb class=\"key\">empathy\u003c/b>를 수식합니다. 명사 empathy 뒤에 전치사구가 길게 붙어 의미를 구체화하는 구조입니다.\u003c/div>","segs":[{"n":45,"text":"Empathy in the sense of adopting someone's viewpoint, 다른 사람의 관점을 취한다는 의미에서의 공감은. is not the same as, 동일하지 않다. empathy in the sense of feeling compassion toward the person, 그 사람을 향해 동정심을 느낀다는 의미에서의 공감과. but the first can lead to the second, 그러나 전자는 후자로 이어질 수 있다. by a natural route, 자연스러운 경로를 통해","hl":"ch"},{"n":46,"text":"여덟 번째 문장에서는 in the sense of adopting someone's viewpoint와 in the sense of feeling compassion toward the person가 각각 앞의 empathy를 꾸며요. 긴 전치사구가 명사 뒤에 붙어 공감의 두 가지 의미를 구분하는 구조입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 \u003cspan class=\"fx\">Empathy in the sense of adopting someone's viewpoint\u003c/span> is not the same as empathy in the sense of feeling compassion toward the person, but the first can lead to the second by a natural route.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>상대의 관점을 받아들이는 공감과 불쌍히 여기는 동정심은 같지 않지만, 관점을 이해하는 첫 번째 공감이 자연스럽게 두 번째 동정심으로 이어질 수 있다는 뜻입니다. 공감의 두 층을 구분해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is not the same as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is different from\u003c/span>\u003cdiv class=\"w\">not the same as보다 is different from이 차이를 더 직접적으로 말해 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by a natural route\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in a natural way\u003c/span>\u003cdiv class=\"w\">자연스러운 경로라는 표현을 자연스러운 방식이라는 더 일상적인 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in the sense of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in the meaning of\u003c/span>\u003cspan class=\"y-eq\">in the sense of = in the meaning of\u003c/span>\u003cdiv class=\"w\">어떤 의미에서라는 뜻을 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">lead to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">result in\u003c/span>\u003cspan class=\"y-eq\">lead to = result in\u003c/span>\u003cdiv class=\"w\">이어지다, 초래하다는 뜻을 결과를 낳는다는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">compassion\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">sympathy\u003c/span>\u003cspan class=\"y-eq\">compassion = sympathy\u003c/span>\u003cdiv class=\"w\">동정심이라는 뜻을 비슷한 어휘로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Empathy as understanding another person's viewpoint differs from empathy as feeling sympathy for that person, but the former can naturally develop into the latter.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"상대의 관점을 받아들이는 공감과 그 사람을 불쌍히 여기는 동정심은 같지 않아요. 하지만 관점을 이해하는 공감이 자연스럽게 동정심으로 이어질 수 있다는 뜻입니다.","hl":"mn"},{"n":48,"text":"is not the same as는 is different from으로 바꿀 수 있어요. by a natural route는 in a natural way로 바꾸면 더 일상적인 표현이 됩니다.","hl":"rw"},{"n":49,"text":"lead to는 result in으로, compassion은 sympathy로 바꿀 수 있어요. in the sense of는 in the meaning of의 느낌으로 정리해 둘 수 있습니다.","hl":"ph"},{"n":50,"text":"패러프레이징 문장은 Empathy as understanding another person's viewpoint differs from empathy as feeling sympathy for that person, but the former can naturally develop into the latter예요. the former와 the latter가 앞의 두 공감을 깔끔하게 받아 줍니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 Love is the only force \u003cspan class=\"fx\">capable of transforming an enemy into a friend\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Love\u003c/div>\u003cdiv class=\"k\">사랑은\u003c/div>\u003cdiv class=\"e\">is the only force\u003c/div>\u003cdiv class=\"k\">유일한 힘이다\u003c/div>\u003cdiv class=\"e\">capable of transforming an enemy into a friend.\u003c/div>\u003cdiv class=\"k\">[적을 친구로 바꿀 수 있는]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">capable of transforming an enemy into a friend\u003c/b>가 앞의 명사 \u003cb class=\"key\">the only force\u003c/b>를 수식하는 형용사구입니다. capable of 뒤에는 동명사구 transforming A into B가 이어집니다.\u003c/div>","segs":[{"n":51,"text":"Love, 사랑은. is the only force, 유일한 힘이다. capable of transforming an enemy into a friend, [적을 친구로 바꿀 수 있는]","hl":"ch"},{"n":52,"text":"아홉 번째 문장에서는 capable of transforming an enemy into a friend가 앞의 the only force를 꾸며요. capable of 뒤에 동명사구가 와서 그 힘이 어떤 힘인지 설명하는 구조죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 Love is the only force \u003cspan class=\"fx\">capable of transforming an enemy into a friend\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사랑만이 적을 친구로 바꿀 수 있는 힘이라는 뜻입니다. 사랑의 변화시키는 힘을 강조하는 명언이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">capable of transforming\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">able to turn\u003c/span>\u003cdiv class=\"w\">capable of transforming보다 able to turn이 더 간결하고 일상적인 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">an enemy into a friend\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a foe into a friend\u003c/span>\u003cdiv class=\"w\">enemy를 foe로 바꾸면 더 문학적이고 힘 있는 느낌이 납니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">capable of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">able to\u003c/span>\u003cspan class=\"y-eq\">capable of = able to\u003c/span>\u003cdiv class=\"w\">할 수 있다는 뜻을 더 간단한 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">transform A into B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">turn A into B\u003c/span>\u003cspan class=\"y-eq\">transform A into B = turn A into B\u003c/span>\u003cdiv class=\"w\">바꾸다라는 뜻을 더 일상적인 동사로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">enemy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">foe\u003c/span>\u003cspan class=\"y-eq\">enemy = foe\u003c/span>\u003cdiv class=\"w\">적이라는 뜻을 문학적인 어휘로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Love is the only power that can turn an enemy into a friend.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"사랑만이 적을 친구로 바꿀 수 있는 힘이라는 뜻이에요. 사랑이 사람과 관계를 변화시키는 힘을 강조하는 명언입니다.","hl":"mn"},{"n":54,"text":"capable of transforming은 able to turn으로 바꿀 수 있어요. an enemy into a friend는 a foe into a friend로 바꾸면 더 문학적인 느낌이 납니다.","hl":"rw"},{"n":55,"text":"capable of는 able to로, transform A into B는 turn A into B로 바꿀 수 있어요. enemy는 foe로 정리해 둘 수 있습니다.","hl":"ph"},{"n":56,"text":"같은 뜻을 이렇게 말할 수 있어요. Love is the only power that can turn an enemy into a friend. 관계절로 바꾸어도 사랑의 유일한 힘이라는 핵심은 그대로입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 The particular strategies \u003cspan class=\"fx\">appropriate to an organization\u003c/span> depend to a large extent on the political and financial circumstances of the organization.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The particular strategies\u003c/div>\u003cdiv class=\"k\">특정 전략들은\u003c/div>\u003cdiv class=\"e\">appropriate to an organization\u003c/div>\u003cdiv class=\"k\">[어떤 조직에 적합한]\u003c/div>\u003cdiv class=\"e\">depend\u003c/div>\u003cdiv class=\"k\">달려 있다\u003c/div>\u003cdiv class=\"e\">to a large extent\u003c/div>\u003cdiv class=\"k\">크게\u003c/div>\u003cdiv class=\"e\">on the political and financial circumstances\u003c/div>\u003cdiv class=\"k\">정치적, 재정적 상황에\u003c/div>\u003cdiv class=\"e\">of the organization.\u003c/div>\u003cdiv class=\"k\">[그 조직의]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">appropriate to an organization\u003c/b>은 주어인 \u003cb class=\"key\">The particular strategies\u003c/b>를 뒤에서 수식하는 형용사구입니다. 주어의 핵심 명사가 복수 strategies이므로 동사는 \u003cb class=\"key\">depend\u003c/b>가 됩니다.\u003c/div>","segs":[{"n":57,"text":"The particular strategies, 특정 전략들은. appropriate to an organization, [어떤 조직에 적합한]. depend, 달려 있다. to a large extent, 크게. on the political and financial circumstances, 정치적, 재정적 상황에. of the organization, [그 조직의]","hl":"ch"},{"n":58,"text":"열 번째 문장에서는 appropriate to an organization이 주어인 The particular strategies를 뒤에서 꾸며요. 주어의 핵심 명사가 복수 strategies이기 때문에 동사는 depend가 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 The particular strategies \u003cspan class=\"fx\">appropriate to an organization\u003c/span> depend to a large extent on the political and financial circumstances of the organization.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>조직에 맞는 전략은 그 조직의 정치적·재정적 상황에 크게 좌우된다는 뜻입니다. 전략은 조직의 환경을 떠나 존재할 수 없다는 점을 말해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">depend to a large extent on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are largely determined by\u003c/span>\u003cdiv class=\"w\">달려 있다는 능동 표현을 좌우된다는 수동 표현으로 바꾸어 원인과 결과를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">appropriate to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">suitable for\u003c/span>\u003cdiv class=\"w\">적합한이라는 뜻을 더 익숙한 suitable for로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">depend on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">hinge on\u003c/span>\u003cspan class=\"y-eq\">depend on = hinge on\u003c/span>\u003cdiv class=\"w\">달려 있다는 뜻을 더 강조하는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to a large extent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to a great degree\u003c/span>\u003cspan class=\"y-eq\">to a large extent = to a great degree\u003c/span>\u003cdiv class=\"w\">크게라는 뜻을 정도 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">circumstances\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">conditions\u003c/span>\u003cspan class=\"y-eq\">circumstances = conditions\u003c/span>\u003cdiv class=\"w\">상황이라는 뜻을 condition으로 바꾸어 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The strategies that suit an organization are largely determined by its political and financial conditions.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"조직에 맞는 전략은 그 조직의 정치적이고 재정적인 상황에 크게 좌우된다는 뜻이에요. 전략은 조직의 환경을 떠나서 존재할 수 없다는 점을 말합니다.","hl":"mn"},{"n":60,"text":"depend to a large extent on은 are largely determined by로 바꿀 수 있어요. appropriate to는 suitable for로 바꾸면 더 익숙하게 들립니다.","hl":"rw"},{"n":61,"text":"depend on은 hinge on으로, to a large extent는 to a great degree로 바꿀 수 있어요. circumstances는 conditions로 정리해 둘 수 있습니다.","hl":"ph"},{"n":62,"text":"패러프레이징 문장은 The strategies that suit an organization are largely determined by its political and financial conditions예요. that suit가 appropriate to의 의미를 자연스럽게 살려 줍니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 \u003cspan class=\"fx\">Challenges to new ideas\u003c/span> are the legitimate business of science in building valid knowledge.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Challenges\u003c/div>\u003cdiv class=\"k\">도전들은\u003c/div>\u003cdiv class=\"e\">to new ideas\u003c/div>\u003cdiv class=\"k\">[새로운 아이디어에 대한]\u003c/div>\u003cdiv class=\"e\">are the legitimate business of science\u003c/div>\u003cdiv class=\"k\">과학의 타당한 일이다\u003c/div>\u003cdiv class=\"e\">in building valid knowledge.\u003c/div>\u003cdiv class=\"k\">확실한 지식을 쌓는 데 있어서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>동사 바로 앞의 \u003cb class=\"key\">to new ideas\u003c/b>는 주어인 \u003cb class=\"key\">Challenges\u003c/b>를 수식하는 전치사구입니다. 주어의 핵심 명사가 복수 Challenges이므로 복수 동사 \u003cb class=\"key\">are\u003c/b>가 적절합니다.\u003c/div>","segs":[{"n":63,"text":"Challenges, 도전들은. to new ideas, [새로운 아이디어에 대한]. are the legitimate business of science, 과학의 타당한 일이다. in building valid knowledge, 확실한 지식을 쌓는 데 있어서","hl":"ch"},{"n":64,"text":"열한 번째 문장에서는 동사 바로 앞의 to new ideas가 주어인 Challenges를 꾸며요. 주어의 핵심 명사가 복수 Challenges이므로 동사는 are가 적절합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 \u003cspan class=\"fx\">Challenges to new ideas\u003c/span> are the legitimate business of science in building valid knowledge.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>새로운 아이디어에 대한 도전과 반론은 과학이 타당한 지식을 쌓는 과정에서 당연하고 정당한 일이라는 뜻입니다. 비판을 과학의 일부로 받아들이는 태도를 강조해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Challenges to new ideas\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Objections to new ideas\u003c/span>\u003cdiv class=\"w\">도전이라는 말을 반론이라는 뜻의 objections로 바꾸어 비판의 의미를 더 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">legitimate business\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">proper part\u003c/span>\u003cdiv class=\"w\">정당한 일이라는 표현을 적절한 부분이라는 더 쉬운 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">challenge to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">objection to\u003c/span>\u003cspan class=\"y-eq\">challenge to = objection to\u003c/span>\u003cdiv class=\"w\">도전이라는 뜻을 반론이라는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">legitimate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">valid\u003c/span>\u003cspan class=\"y-eq\">legitimate = valid\u003c/span>\u003cdiv class=\"w\">타당한이라는 뜻을 비슷한 어휘로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">build knowledge\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">construct knowledge\u003c/span>\u003cspan class=\"y-eq\">build knowledge = construct knowledge\u003c/span>\u003cdiv class=\"w\">지식을 쌓는다는 뜻을 construct로 격식 있게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Questioning new ideas is a proper part of science when it seeks to build reliable knowledge.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"새로운 아이디어에 대한 도전과 반론은 과학이 타당한 지식을 쌓는 과정에서 당연하고 정당한 일이라는 뜻이에요. 비판을 과학의 일부로 받아들이는 태도를 보여 줍니다.","hl":"mn"},{"n":66,"text":"Challenges to new ideas는 Objections to new ideas로 바꿀 수 있어요. legitimate business는 proper part로 바꾸면 더 쉬운 표현이 됩니다.","hl":"rw"},{"n":67,"text":"challenge to는 objection to로, legitimate은 valid로 바꿀 수 있어요. build knowledge는 construct knowledge로 정리해 둘 수 있습니다.","hl":"ph"},{"n":68,"text":"같은 뜻을 이렇게 표현할 수 있어요. Questioning new ideas is a proper part of science when it seeks to build reliable knowledge. questioning이 challenges의 동작 느낌을 잘 살려 줍니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Often \u003cspan class=\"fx\">the difference between feeling fulfilled at work and feeling empty, lost, annoyed, and burned out\u003c/span> is all about whether or not you're learning anything.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Often\u003c/div>\u003cdiv class=\"k\">종종\u003c/div>\u003cdiv class=\"e\">the difference\u003c/div>\u003cdiv class=\"k\">차이는\u003c/div>\u003cdiv class=\"e\">between feeling fulfilled at work and feeling empty, lost, annoyed, and burned out\u003c/div>\u003cdiv class=\"k\">[일에서 성취감을 느끼는 것과 공허하고 어찌할 바를 모르고 짜증이 나고 녹초가 되었다고 느끼는 것 사이의]\u003c/div>\u003cdiv class=\"e\">is all about\u003c/div>\u003cdiv class=\"k\">모두 ~에 관한 것이다\u003c/div>\u003cdiv class=\"e\">whether or not you're learning anything.\u003c/div>\u003cdiv class=\"k\">당신이 어떤 것을 배우고 있느냐 아니냐에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">between A and B\u003c/b>가 주어인 \u003cb class=\"key\">the difference\u003c/b>를 수식하는 전치사구입니다. between의 목적어로 동명사구 feeling fulfilled ...와 feeling empty ...가 and로 연결되어 있고, 주어 핵심이 단수 difference이므로 동사는 \u003cb class=\"key\">is\u003c/b>입니다.\u003c/div>","segs":[{"n":69,"text":"Often, 종종. the difference, 차이는. between feeling fulfilled at work and feeling empty, lost, annoyed, and burned out, [일에서 성취감을 느끼는 것과 공허하고 어찌할 바를 모르고 짜증이 나고 녹초가 되었다고 느끼는 것 사이의]. is all about, 모두 ~에 관한 것이다. whether or not you're learning anything, 당신이 어떤 것을 배우고 있느냐 아니냐에","hl":"ch"},{"n":70,"text":"열두 번째 문장에서는 between feeling fulfilled at work and feeling empty, lost, annoyed, and burned out이 주어인 the difference를 꾸며요. 주어의 핵심이 단수 difference이므로 동사는 is가 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Often \u003cspan class=\"fx\">the difference between feeling fulfilled at work and feeling empty, lost, annoyed, and burned out\u003c/span> is all about whether or not you're learning anything.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>일에서 충만함을 느끼는지 공허하고 지친 상태인지의 차이는 결국 무엇인가를 배우고 있는지에 달려 있다는 뜻입니다. 배움의 지속이 일의 만족을 좌우한다는 메시지예요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is all about whether or not you're learning anything\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">depends entirely on whether you are learning something\u003c/span>\u003cdiv class=\"w\">모두 무엇에 관한 것이다라는 표현을 전적으로 달려 있다는 뜻으로 바꾸어 인과 관계를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">feeling fulfilled\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">feeling a sense of fulfillment\u003c/span>\u003cdiv class=\"w\">성취감을 느끼는 상태를 명사구로 풀어 쓴 더 격식 있는 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be all about\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">depend entirely on\u003c/span>\u003cspan class=\"y-eq\">be all about = depend entirely on\u003c/span>\u003cdiv class=\"w\">핵심이 무엇에 달려 있다는 뜻을 더 직접적으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">burned out\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">exhausted\u003c/span>\u003cspan class=\"y-eq\">burned out = exhausted\u003c/span>\u003cdiv class=\"w\">녹초가 된 상태를 exhausted로 간결하게 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fulfilled\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">satisfied\u003c/span>\u003cspan class=\"y-eq\">fulfilled = satisfied\u003c/span>\u003cdiv class=\"w\">성취감을 느끼는 상태를 만족하는 상태로 바꾸어 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The difference between feeling satisfied at work and feeling empty, lost, irritated, and exhausted often depends entirely on whether you are learning something.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"일에서 충만함을 느끼는지 공허하고 지친 상태인지의 차이는 결국 무엇인가를 배우고 있는지에 달려 있다는 뜻이에요. 배움이 일의 만족을 좌우한다는 메시지입니다.","hl":"mn"},{"n":72,"text":"is all about whether or not you're learning anything은 depends entirely on whether you are learning something으로 바꿀 수 있어요. feeling fulfilled는 feeling a sense of fulfillment로 바꾸면 더 격식 있게 들립니다.","hl":"rw"},{"n":73,"text":"be all about은 depend entirely on으로, burned out은 exhausted로 바꿀 수 있어요. fulfilled는 satisfied로 정리해 둘 수 있습니다.","hl":"ph"},{"n":74,"text":"패러프레이징 문장은 The difference between feeling satisfied at work and feeling empty, lost, irritated, and exhausted often depends entirely on whether you are learning something예요. 배움 여부가 만족의 차이를 만든다는 뜻이 잘 드러납니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 Unit 21 명사 + (형용사 +) 전치사구\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>명사 뒤의 \u003cb class=\"key\">전치사구\u003c/b>는 앞 명사를 수식하는 대표적인 블록이다.\u003c/li>\u003cli>\u003cb class=\"key\">명사 + 형용사 + 전치사구\u003c/b>는 한 덩어리로 묶어 직독직해한다.\u003c/li>\u003cli>긴 수식어에 흔들리지 말고 \u003cb class=\"key\">주어의 핵심 명사\u003c/b>와 \u003cb class=\"key\">동사\u003c/b>의 수 일치를 확인한다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 명사 뒤에 붙는 형용사구와 전치사구를 블록으로 잡는 방법을 배웠어요. 전치사구가 연달아 나오면 바로 앞 명사와 먼저 묶고, 명사 뒤 형용사와 전치사구는 끝까지 한 덩어리로 읽으면 됩니다. 긴 수식어에 흔들리지 말고 주어의 핵심 명사와 동사를 찾는 습관을 꼭 기억해 주세요. 오늘 수업 수고 많았고, 다음 시간에 또 만나요.","hl":"sum"}]}]});</script></body></html>
