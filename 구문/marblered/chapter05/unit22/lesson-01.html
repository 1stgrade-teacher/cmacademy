  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;

  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"unit22","title":"명사 뒤에 붙는 to부정사와 분사 블록","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>명사 뒤에 붙는 to부정사와 분사 블록\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>명사 뒤에 오는 to부정사와 현재분사, 과거분사가 명사를 꾸미는 구조를 이해하고 직독직해와 패러프레이징에 적용한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"오늘은 명사 뒤에 to 부정사나 현재분사, 과거분사가 붙어서 명사를 꾸며 주는 구문을 배워요. 이런 구조는 긴 문장을 만드는 핵심 블록이죠. 명사와 뒤에 붙은 꾸밈말을 한 덩어리로 묶어 읽는 연습을 해 봐요. 직독직해부터 패러프레이징까지 차근차근 같이 가요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">\u003cb class=\"key\">명사 + to-v\u003c/b>는 '~하는 명사'로, \u003cb class=\"key\">명사 + v-ing\u003c/b>는 명사가 직접 하는 능동의 행동으로, \u003cb class=\"key\">명사 + v-ed\u003c/b>는 명사가 당하는 수동의 상태로 이해합니다. 이 블록은 명사 바로 뒤에서 명사를 꾸미므로 끊어 읽을 때 명사와 꾸밈말을 한 덩어리로 묶습니다. to부정사와 분사의 의미상 주어가 누구인지 확인해 능동과 수동을 구별합니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 The human species is unique in \u003cspan class=\"fx\">its ability to expand its functionality\u003c/span> by inventing new cultural tools.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 Climate is the total sum of \u003cspan class=\"fx\">the weather experienced over a long enough time period for the pattern to be established\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 Robots are not equipped with \u003cspan class=\"fx\">capabilities like humans to solve problems\u003c/span> as they arise.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 The common idea of \u003cspan class=\"fx\">a creative individual coming up with great insights, discoveries, works, or inventions in isolation\u003c/span> is wrong.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 The story called The Strange Case of Dr. Jekyll and Mr. Hyde is the famous story of \u003cspan class=\"fx\">a good man sometimes turning into a horrible monster\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">People judged to be functionally illiterate\u003c/span> lack the basic reading and writing skills required in everyday life.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 \u003cspan class=\"fx\">Yeast cells growing on a grape skin\u003c/span> obtain energy from nutrient molecules originally processed within the grape leaves and stored within the fruit.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 You must pay the past-due balance by \u003cspan class=\"fx\">the date written on the front page of your bill\u003c/span> to avoid the late fee.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 On February 9th, 2020, South Korean movie Parasite became \u003cspan class=\"fx\">the first foreign-language film to be crowned Best Picture\u003c/span> at the Academy Awards.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 The order to abandon ship automatically assumes two rules : women and children are first, and the captain is \u003cspan class=\"fx\">the last to leave\u003c/span> or goes down with his vessel.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 The company has decided to launch \u003cspan class=\"fx\">a new campaign targeting  inexperienced college graduates preparing to enter the job market\u003c/span> for the first time.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 The desire to fly is \u003cspan class=\"fx\">an idea handed down to us by our ancestors who looked enviously on the birds soaring freely through space\u003c/span> on the infinite highway of the air.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"명사 뒤에 to 부정사가 오면 그 명사가 무엇을 하는지, 무엇을 할 수 있는지 설명해 줘요. 현재분사가 오면 명사가 직접 어떤 행동을 하는 능동의 느낌을 살려 주고, 과거분사가 오면 명사가 어떤 일을 당하는 수동의 느낌을 살려 줘요. 그래서 명사와 뒤에 붙은 말을 하나의 블록으로 묶어서 읽는 게 중요해요. 능동인지 수동인지도 꼭 확인해 보세요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 The human species is unique in \u003cspan class=\"fx\">its ability to expand its functionality\u003c/span> by inventing new cultural tools.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The human species \u003c/div>\u003cdiv class=\"k\">인간 종은\u003c/div>\u003cdiv class=\"e\">is unique \u003c/div>\u003cdiv class=\"k\">독특하다\u003c/div>\u003cdiv class=\"e\">in its ability \u003c/div>\u003cdiv class=\"k\">그것의 능력에 있어서\u003c/div>\u003cdiv class=\"e\">to expand its functionality \u003c/div>\u003cdiv class=\"k\">[그것의 기능을 확장하는\u003c/div>\u003cdiv class=\"e\">by inventing new cultural tools.\u003c/div>\u003cdiv class=\"k\">새로운 문화적 도구를 발명함으로써]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>to expand 이하는 its ability를 수식하는 형용사적 to부정사입니다. \u003cb class=\"key\">명사 + to-v\u003c/b> 블록이 '그것의 기능을 확장하는 능력'이라는 의미를 만듭니다.\u003c/div>","segs":[{"n":3,"text":"The human species, 인간 종은. is unique, 독특하다. in its ability, 그것의 능력에 있어서. to expand its functionality, [그것의 기능을 확장하는. by inventing new cultural tools, 새로운 문화적 도구를 발명함으로써]","hl":"ch"},{"n":4,"text":"이 문장에서는 its ability to expand its functionality를 하나의 블록으로 봐요. to expand 이하는 its ability를 꾸며 주는 형용사적 to 부정사예요. 그래서 그것의 기능을 확장하는 능력이라는 의미가 된답니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 The human species is unique in \u003cspan class=\"fx\">its ability to expand its functionality\u003c/span> by inventing new cultural tools.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인간은 새로운 문화적 도구를 발명해 자신의 기능을 확장하는 능력이 있어 다른 동물과 구별된다는 뜻입니다. 인간의 특징을 도구 발명과 연결해 이해하면 됩니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unique in its ability to expand\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">distinctive because it can extend\u003c/span>\u003cdiv class=\"w\">unique in its ability to를 because it can으로 바꾸어 이유를 직접 드러낸 표현입니다. 의미는 비슷하지만 문장 구조가 더 쉽게 느껴집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by inventing new cultural tools\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">through the invention of new cultural tools\u003c/span>\u003cdiv class=\"w\">동명사 inventing을 명사 invention으로 바꾼 표현입니다. 격식 있는 문어체 느낌이 납니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be unique in\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be distinctive in\u003c/span>\u003cspan class=\"y-eq\">be unique in = be distinctive in\u003c/span>\u003cdiv class=\"w\">'~에서 독특하다'를 '~에서 구별되는 특징이 있다'로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">expand\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">extend\u003c/span>\u003cspan class=\"y-eq\">expand = extend\u003c/span>\u003cdiv class=\"w\">기능이나 범위를 넓힌다는 뜻을 extend로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">invent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">create\u003c/span>\u003cspan class=\"y-eq\">invent = create\u003c/span>\u003cdiv class=\"w\">새로운 것을 만들어 낸다는 뜻을 create로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Humans are special because they can broaden what they can do by creating new cultural tools.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 인간이 새로운 문화적 도구를 발명해서 자신의 기능을 넓혀 간다는 뜻이에요. 그래서 인간 종은 다른 동물과 구별되는 독특한 능력을 가진 존재라는 점을 강조하죠. 도구를 만드는 힘이 인간의 특징이라는 정도로 이해하면 돼요.","hl":"mn"},{"n":6,"text":"unique in its ability to expand는 distinctive because it can extend로 바꿔 말할 수 있어요. by inventing은 through the invention of로 바꾸면 조금 더 격식 있게 들려요.","hl":"rw"},{"n":7,"text":"be unique in은 be distinctive in으로 바꿀 수 있고 expand는 extend로 바꿀 수 있어요. invent는 create로 바꿔도 자연스럽답니다.","hl":"ph"},{"n":8,"text":"전체 문장을 다시 말하면 Humans are special because they can broaden what they can do by creating new cultural tools라고 할 수 있어요. 뜻은 같지만 표현이 더 쉽고 자연스럽죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 Climate is the total sum of \u003cspan class=\"fx\">the weather experienced over a long enough time period for the pattern to be established\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Climate \u003c/div>\u003cdiv class=\"k\">기후는\u003c/div>\u003cdiv class=\"e\">is the total sum \u003c/div>\u003cdiv class=\"k\">총합이다\u003c/div>\u003cdiv class=\"e\">of the weather \u003c/div>\u003cdiv class=\"k\">날씨의\u003c/div>\u003cdiv class=\"e\">experienced over a long enough time period \u003c/div>\u003cdiv class=\"k\">[충분히 오랜 기간 동안에 걸쳐 경험되는\u003c/div>\u003cdiv class=\"e\">for the pattern to be established.\u003c/div>\u003cdiv class=\"k\">경향이 자리를 잡을 정도로]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>과거분사 experienced가 이끄는 어구가 the weather를 수식하고, \u003cb class=\"key\">명사 + v-ed\u003c/b> 블록을 이룹니다. for the pattern은 to be established의 의미상 주어를 나타냅니다.\u003c/div>","segs":[{"n":9,"text":"Climate, 기후는. is the total sum, 총합이다. of the weather, 날씨의. experienced over a long enough time period, [충분히 오랜 기간 동안에 걸쳐 경험되는. for the pattern to be established, 경향이 자리를 잡을 정도로]","hl":"ch"},{"n":10,"text":"이 문장에서는 the weather experienced over a long enough time period를 하나의 명사 블록으로 읽어요. 과거분사 experienced가 the weather를 뒤에서 꾸며 주고 있어요. for the pattern은 to be established의 의미상 주어라는 점도 기억해 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 Climate is the total sum of \u003cspan class=\"fx\">the weather experienced over a long enough time period for the pattern to be established\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>기후는 단순한 오늘 날씨가 아니라 오랜 기간 동안 반복되어 하나의 경향이 자리 잡을 만큼 충분히 경험된 날씨 전체의 합이라는 뜻입니다. 단기간 날씨와 기후를 구별하는 설명입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the total sum of the weather experienced\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the overall accumulation of weather recorded\u003c/span>\u003cdiv class=\"w\">total sum을 overall accumulation으로 바꾸어 전체적으로 쌓인 양이라는 느낌을 살렸습니다. experienced는 recorded로 바꾸어 관측의 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">over a long enough time period for the pattern to be established\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">across a period long enough to reveal a pattern\u003c/span>\u003cdiv class=\"w\">for the pattern to be established를 to reveal a pattern으로 풀어 쓴 표현입니다. 경향이 드러날 정도로 길다는 뜻을 쉽게 전달합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">total sum\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">overall total\u003c/span>\u003cspan class=\"y-eq\">total sum = overall total\u003c/span>\u003cdiv class=\"w\">전체를 모두 더한 합이라는 뜻을 overall total로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be established\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">take hold\u003c/span>\u003cspan class=\"y-eq\">be established = take hold\u003c/span>\u003cdiv class=\"w\">기록이나 습관이 자리를 잡는다는 뜻을 take hold로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">experienced\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">recorded\u003c/span>\u003cspan class=\"y-eq\">experienced = recorded\u003c/span>\u003cdiv class=\"w\">날씨가 경험되었다는 표현을 관측되어 기록되었다는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Climate is the overall total of weather recorded over a period long enough for a pattern to take hold.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"기후는 오늘의 날씨가 아니라 아주 오랜 기간 동안 경험된 날씨 전체의 합이라는 뜻이에요. 그 기간이 충분히 길어서 하나의 경향이 자리 잡을 정도라는 점이 핵심이죠. 그래서 기후는 단기간 날씨와 구별된답니다.","hl":"mn"},{"n":12,"text":"the total sum of the weather experienced는 the overall accumulation of weather recorded로 바꿀 수 있어요. over a long enough time period for the pattern to be established는 across a period long enough to reveal a pattern처럼 풀어 쓸 수 있답니다.","hl":"rw"},{"n":13,"text":"total sum은 overall total로, be established는 take hold로 바꿀 수 있어요. experienced는 recorded나 observed로 바꾸면 뜻이 잘 통해요.","hl":"ph"},{"n":14,"text":"전체 문장은 Climate is the overall total of weather recorded over a period long enough for a pattern to take hold라고 바꿔 말할 수 있어요. 뜻은 그대로이면서 표현이 더 간결하죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 Robots are not equipped with \u003cspan class=\"fx\">capabilities like humans to solve problems\u003c/span> as they arise.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Robots \u003c/div>\u003cdiv class=\"k\">로봇은\u003c/div>\u003cdiv class=\"e\">are not equipped with \u003c/div>\u003cdiv class=\"k\">갖추고 있지 않다\u003c/div>\u003cdiv class=\"e\">capabilities like humans \u003c/div>\u003cdiv class=\"k\">인간과 같은 능력을\u003c/div>\u003cdiv class=\"e\">to solve problems \u003c/div>\u003cdiv class=\"k\">[문제를 해결할]\u003c/div>\u003cdiv class=\"e\">as they arise.\u003c/div>\u003cdiv class=\"k\">그것들이 발생할 때\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>to solve problems가 capabilities를 수식하는 형용사적 to부정사입니다. \u003cb class=\"key\">명사 + to-v\u003c/b> 블록이 '문제를 해결할 능력'이라는 의미를 만듭니다.\u003c/div>","segs":[{"n":15,"text":"Robots, 로봇은. are not equipped with, 갖추고 있지 않다. capabilities like humans, 인간과 같은 능력을. to solve problems, [문제를 해결할]. as they arise, 그것들이 발생할 때","hl":"ch"},{"n":16,"text":"이 문장에서는 capabilities like humans to solve problems를 한 덩어리로 봐요. to solve problems가 capabilities를 꾸며 주는 형용사적 to 부정사예요. 그래서 문제를 해결할 인간과 같은 능력이라는 의미가 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 Robots are not equipped with \u003cspan class=\"fx\">capabilities like humans to solve problems\u003c/span> as they arise.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>로봇은 문제가 생길 때마다 인간처럼 즉시 해결하는 능력을 갖고 있지 않다는 뜻입니다. 인간의 즉각적 문제 해결 능력과 로봇의 한계를 대비시키는 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are not equipped with capabilities\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">do not have the ability\u003c/span>\u003cdiv class=\"w\">be equipped with를 have the ability로 바꾸어 더 일상적인 표현으로 만들었습니다. 뜻은 '능력을 갖추지 못하다'로 같습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as they arise\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">when they occur\u003c/span>\u003cdiv class=\"w\">as를 when으로, arise를 occur로 바꾼 표현입니다. 문제가 생기는 시점을 더 분명히 보여 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be equipped with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have\u003c/span>\u003cspan class=\"y-eq\">be equipped with = have\u003c/span>\u003cdiv class=\"w\">장비나 능력을 갖추고 있다는 표현을 have로 간단히 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">arise\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">occur\u003c/span>\u003cspan class=\"y-eq\">arise = occur\u003c/span>\u003cdiv class=\"w\">문제나 상황이 발생한다는 뜻을 occur로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">capability\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ability\u003c/span>\u003cspan class=\"y-eq\">capability = ability\u003c/span>\u003cdiv class=\"w\">능력을 뜻하는 capability를 더 일반적인 ability로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Robots do not have human-like abilities to solve problems when they occur.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"로봇은 문제가 생길 때마다 인간처럼 바로 해결하는 능력을 갖고 있지 않다는 뜻이에요. 인간의 즉각적인 문제 해결 능력과 로봇의 한계를 비교하는 문장이죠.","hl":"mn"},{"n":18,"text":"are not equipped with capabilities는 do not have the ability로 바꿀 수 있어요. as they arise는 when they occur로 바꾸면 더 쉬운 표현이 됩니다.","hl":"rw"},{"n":19,"text":"be equipped with는 have나 possess로 바꿀 수 있고 arise는 occur로 바꿀 수 있어요. capability는 ability로 바꾸면 자연스럽답니다.","hl":"ph"},{"n":20,"text":"전체 문장은 Robots do not have human-like abilities to solve problems when they occur라고 바꿔 말할 수 있어요. 원문의 뜻을 그대로 살린 자연스러운 표현이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 The common idea of \u003cspan class=\"fx\">a creative individual coming up with great insights, discoveries, works, or inventions in isolation\u003c/span> is wrong.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The common idea \u003c/div>\u003cdiv class=\"k\">통념은\u003c/div>\u003cdiv class=\"e\">of a creative individual \u003c/div>\u003cdiv class=\"k\">창의적인 개인에 대한\u003c/div>\u003cdiv class=\"e\">coming up with great insights, discoveries, works, or inventions \u003c/div>\u003cdiv class=\"k\">[대단한 통찰력, 발견, 작품 또는 발명을 생각해내는\u003c/div>\u003cdiv class=\"e\">in isolation \u003c/div>\u003cdiv class=\"k\">홀로]\u003c/div>\u003cdiv class=\"e\">is wrong.\u003c/div>\u003cdiv class=\"k\">잘못된 것이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>현재분사구 coming ~ isolation이 a creative individual을 뒤에서 수식합니다. \u003cb class=\"key\">명사 + v-ing\u003c/b> 블록이 '홀로 대단한 것을 생각해내는 창의적인 개인'이라는 의미를 만듭니다.\u003c/div>","segs":[{"n":21,"text":"The common idea, 통념은. of a creative individual, 창의적인 개인에 대한. coming up with great insights, discoveries, works, or inventions, [대단한 통찰력, 발견, 작품 또는 발명을 생각해내는. in isolation, 홀로]. is wrong, 잘못된 것이다","hl":"ch"},{"n":22,"text":"이 문장에서는 a creative individual coming up with great insights를 하나의 명사 블록으로 읽어요. 현재분사구 coming up with가 a creative individual을 뒤에서 꾸며 주죠. in isolation은 그 행동이 홀로 이루어진다는 뜻을 더해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 The common idea of \u003cspan class=\"fx\">a creative individual coming up with great insights, discoveries, works, or inventions in isolation\u003c/span> is wrong.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>창의성은 혼자서 위대한 아이디어를 떠올리는 사람만의 것이라는 흔한 생각이 틀렸다는 뜻입니다. 창의성은 협력과 환경 속에서도 나온다는 암시가 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The common idea of a creative individual coming up with great insights, discoveries, works, or inventions in isolation is wrong\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">It is a misconception that a creative individual produces great insights, discoveries, works, or inventions alone\u003c/span>\u003cdiv class=\"w\">The common idea is wrong을 It is a misconception that으로 바꾸어 같은 뜻을 더 자연스럽게 전달했습니다. in isolation은 alone으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in isolation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">on their own\u003c/span>\u003cdiv class=\"w\">'홀로, 고립되어'라는 뜻을 on their own으로 바꾼 표현입니다. 일상적인 느낌을 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">common idea\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">widespread belief\u003c/span>\u003cspan class=\"y-eq\">common idea = widespread belief\u003c/span>\u003cdiv class=\"w\">많이 퍼진 생각이라는 뜻을 widespread belief로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">come up with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">produce\u003c/span>\u003cspan class=\"y-eq\">come up with = produce\u003c/span>\u003cdiv class=\"w\">아이디어나 작품을 생각해내다라는 뜻을 produce로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in isolation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">alone\u003c/span>\u003cspan class=\"y-eq\">in isolation = alone\u003c/span>\u003cdiv class=\"w\">홀로 고립되어 있다는 뜻을 간단히 alone으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">It is a misconception that a creative person produces great insights, discoveries, works, or inventions alone.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"창의적인 사람은 혼자서 위대한 생각을 떠올린다는 흔한 통념이 틀렸다는 뜻이에요. 창의성은 고립된 천재 한 사람만의 것이 아니라 여러 환경과 협력 속에서도 나온다는 점을 암시하죠.","hl":"mn"},{"n":24,"text":"The common idea는 It is a misconception that으로 바꿔 말할 수 있어요. in isolation은 on their own으로 바꾸면 더 쉬운 표현이 됩니다.","hl":"rw"},{"n":25,"text":"common idea는 widespread belief로, come up with는 produce나 devise로 바꿀 수 있어요. in isolation은 alone으로 바꾸면 뜻이 잘 통해요.","hl":"ph"},{"n":26,"text":"전체 문장은 It is a misconception that a creative person produces great insights, discoveries, works, or inventions alone라고 바꿔 말할 수 있어요. 같은 뜻을 더 쉽게 풀어 쓴 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 The story called The Strange Case of Dr. Jekyll and Mr. Hyde is the famous story of \u003cspan class=\"fx\">a good man sometimes turning into a horrible monster\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The story called The Strange Case of Dr. Jekyll and Mr. Hyde \u003c/div>\u003cdiv class=\"k\">'지킬 박사와 하이드 씨의 이상한 사건'이라 불리는 이야기는\u003c/div>\u003cdiv class=\"e\">is the famous story \u003c/div>\u003cdiv class=\"k\">유명한 이야기이다\u003c/div>\u003cdiv class=\"e\">of a good man sometimes turning into a horrible monster.\u003c/div>\u003cdiv class=\"k\">[때때로 끔찍한 괴물로 변하는 선량한 남성에 관한]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>과거분사 called가 The story를 수식하고, 현재분사구 sometimes ~ monster가 a good man을 수식합니다. \u003cb class=\"key\">명사 + v-ed\u003c/b>와 \u003cb class=\"key\">명사 + v-ing\u003c/b> 블록이 겹쳐 쓰인 문장입니다.\u003c/div>","segs":[{"n":27,"text":"The story called The Strange Case of Dr. Jekyll and Mr. Hyde, '지킬 박사와 하이드 씨의 이상한 사건'이라 불리는 이야기는. is the famous story, 유명한 이야기이다. of a good man sometimes turning into a horrible monster, [때때로 끔찍한 괴물로 변하는 선량한 남성에 관한]","hl":"ch"},{"n":28,"text":"이 문장에서는 The story called The Strange Case of Dr. Jekyll and Mr. Hyde를 한 덩어리로 읽어요. 과거분사 called가 The story를 꾸며 주고, 현재분사 turning이 a good man을 꾸며 줍니다. 두 분사 블록이 겹쳐 쓰인 구조예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 The story called The Strange Case of Dr. Jekyll and Mr. Hyde is the famous story of \u003cspan class=\"fx\">a good man sometimes turning into a horrible monster\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 유명한 이야기는 선한 사람이 때때로 괴물로 변한다는 내용을 담고 있다는 뜻입니다. 인간 내면에 선과 악이 함께 있다는 상징으로 자주 읽힙니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sometimes turning into a horrible monster\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who sometimes turns into a terrifying monster\u003c/span>\u003cdiv class=\"w\">현재분사구를 who 절로 풀어 쓴 표현입니다. 선량한 남성이 괴물로 변하는 주체임을 더 분명히 보여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The story called The Strange Case of Dr. Jekyll and Mr. Hyde\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The story titled The Strange Case of Dr. Jekyll and Mr. Hyde\u003c/span>\u003cdiv class=\"w\">called를 titled로 바꾼 표현입니다. 작품의 제목을 말할 때 자연스럽습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">called\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">titled\u003c/span>\u003cspan class=\"y-eq\">called = titled\u003c/span>\u003cdiv class=\"w\">작품이나 책의 제목이 ~라고 불리는이라는 뜻을 titled로 바꿨습 ss=\"y-pair\">\u003cspan class=\"f\">required in everyday life\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">needed for daily life\u003c/span>\u003cdiv class=\"w\">required를 needed로, in everyday life를 for daily life로 바꾼 쉬운 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">judged to be\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">considered\u003c/span>\u003cspan class=\"y-eq\">judged to be = considered\u003c/span>\u003cdiv class=\"w\">~라고 판정되다라는 뜻을 considered로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">lack\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">do not have\u003c/span>\u003cspan class=\"y-eq\">lack = do not have\u003c/span>\u003cdiv class=\"w\">부족하다, 없다라는 뜻을 do not have로 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">required\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">needed\u003c/span>\u003cspan class=\"y-eq\">required = needed\u003c/span>\u003cdiv class=\"w\">요구되는이라는 뜻을 needed로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">People who are considered functionally illiterate do not have the basic reading and writing skills needed for daily life.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"일상생활에서 필요한 기본적인 읽기와 쓰기 능력이 없는 사람들을 기능적 문맹이라고 판정한다는 뜻이에요. 글자를 전혀 모르는 것이 아니라 생활 속 문서를 제대로 읽고 쓸 수 없는 상태를 강조하죠.","hl":"mn"},{"n":36,"text":"People judged to be functionally illiterate는 People who are considered functionally illiterate로 바꿀 수 있어요. required in everyday life는 needed for daily life로 바꾸면 더 쉽습니다.","hl":"rw"},{"n":37,"text":"judged to be는 considered로, lack은 do not have로 바꿀 수 있어요. required는 needed로 바꾸면 자연스럽답니다.","hl":"ph"},{"n":38,"text":"전체 문장은 People who are considered functionally illiterate do not have the basic reading and writing skills needed for daily life라고 바꿔 말할 수 있어요. 뜻이 분명하게 드러나는 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 \u003cspan class=\"fx\">Yeast cells growing on a grape skin\u003c/span> obtain energy from nutrient molecules originally processed within the grape leaves and stored within the fruit.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Yeast cells \u003c/div>\u003cdiv class=\"k\">효모균 세포들은\u003c/div>\u003cdiv class=\"e\">growing on a grape skin \u003c/div>\u003cdiv class=\"k\">[포도 껍질에서 자라는]\u003c/div>\u003cdiv class=\"e\">obtain energy \u003c/div>\u003cdiv class=\"k\">에너지를 얻는다\u003c/div>\u003cdiv class=\"e\">from nutrient molecules \u003c/div>\u003cdiv class=\"k\">영양소 분자들로부터\u003c/div>\u003cdiv class=\"e\">originally processed within the grape leaves \u003c/div>\u003cdiv class=\"k\">[원래 포도나무 잎 안에서 가공되고\u003c/div>\u003cdiv class=\"e\">and stored within the fruit.\u003c/div>\u003cdiv class=\"k\">그리고 열매 안에 저장되는]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>현재분사구 growing on a grape skin이 주어인 Yeast cells를 수식합니다. 또한 originally 이하의 과거분사구 processed와 stored가 nutrient molecules를 수식하며 \u003cb class=\"key\">명사 + v-ed\u003c/b> 블록을 이룹니다.\u003c/div>","segs":[{"n":39,"text":"Yeast cells, 효모균 세포들은. growing on a grape skin, [포도 껍질에서 자라는]. obtain energy, 에너지를 얻는다. from nutrient molecules, 영양소 분자들로부터. originally processed within the grape leaves, [원래 포도나무 잎 안에서 가공되고. and stored within the fruit, 그리고 열매 안에 저장되는]","hl":"ch"},{"n":40,"text":"이 문장에서는 Yeast cells growing on a grape skin을 한 덩어리로 읽어요. 현재분사구 growing on a grape skin이 주어인 Yeast cells를 꾸며 주죠. nutrient molecules 뒤에서는 processed와 stored라는 과거분사가 분자를 꾸며 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 \u003cspan class=\"fx\">Yeast cells growing on a grape skin\u003c/span> obtain energy from nutrient molecules originally processed within the grape leaves and stored within the fruit.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>포도 껍질에서 자라는 효모균이 포도잎에서 가공되어 열매에 저장된 영양소 분자로부터 에너지를 얻는다는 뜻입니다. 효모의 에너지원이 포도 열매 안에 이미 준비되어 있음을 보여 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Yeast cells growing on a grape skin\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Yeast cells that grow on a grape skin\u003c/span>\u003cdiv class=\"w\">현재분사구를 that 절로 풀어 쓴 표현입니다. 효모균이 포도 껍질에서 자란다는 능동의 의미가 분명해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nutrient molecules originally processed within the grape leaves and stored within the fruit\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">nutrient molecules that were first processed in the grape leaves and stored in the fruit\u003c/span>\u003cdiv class=\"w\">과거분사구를 that were 절로 풀어 쓴 표현입니다. 분자들이 가공되고 저장되는 수동의 의미가 드러납니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">obtain\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">get\u003c/span>\u003cspan class=\"y-eq\">obtain = get\u003c/span>\u003cdiv class=\"w\">에너지를 얻는다는 뜻을 더 쉬운 get으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">processed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">broken down\u003c/span>\u003cspan class=\"y-eq\">processed = broken down\u003c/span>\u003cdiv class=\"w\">영양소가 처리되고 분해된다는 뜻을 broken down으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stored\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">kept\u003c/span>\u003cspan class=\"y-eq\">stored = kept\u003c/span>\u003cdiv class=\"w\">저장된다는 뜻을 kept로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Yeast cells that grow on a grape skin get energy from nutrient molecules that were first processed in the grape leaves and kept in the fruit.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"포도 껍질에서 자라는 효모균이 포도잎에서 가공되어 열매에 저장된 영양소 분자로부터 에너지를 얻는다는 뜻이에요. 효모의 에너지원이 이미 포도 열매 안에 준비되어 있음을 보여 주죠.","hl":"mn"},{"n":42,"text":"Yeast cells growing on a grape skin은 Yeast cells that grow on a grape skin으로 바꿀 수 있어요. nutrient molecules originally processed and stored는 nutrient molecules that were first processed and kept처럼 풀어 쓸 수 있습니다.","hl":"rw"},{"n":43,"text":"obtain은 get으로, processed는 broken down으로 바꿀 수 있어요. stored는 kept로 바꾸면 뜻이 잘 통해요.","hl":"ph"},{"n":44,"text":"전체 문장은 Yeast cells that grow on a grape skin get energy from nutrient molecules that were first processed in the grape leaves and kept in the fruit라고 바꿔 말할 수 있어요. 원문의 수동 의미를 살린 표현이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 You must pay the past-due balance by \u003cspan class=\"fx\">the date written on the front page of your bill\u003c/span> to avoid the late fee.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">You must pay \u003c/div>\u003cdiv class=\"k\">당신은 지불해야 한다\u003c/div>\u003cdiv class=\"e\">the past-due balance \u003c/div>\u003cdiv class=\"k\">기일을 넘긴 잔금을\u003c/div>\u003cdiv class=\"e\">by the date \u003c/div>\u003cdiv class=\"k\">날짜까지\u003c/div>\u003cdiv class=\"e\">written on the front page of your bill \u003c/div>\u003cdiv class=\"k\">[당신의 청구서 앞면에 적혀 있는]\u003c/div>\u003cdiv class=\"e\">to avoid the late fee.\u003c/div>\u003cdiv class=\"k\">연체를 피하기 위해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>과거분사구 written ~ bill이 the date를 수식합니다. \u003cb class=\"key\">명사 + v-ed\u003c/b> 블록이 '청구서 앞면에 적힌 날짜'라는 의미를 만듭니다.\u003c/div>","segs":[{"n":45,"text":"You must pay, 당신은 지불해야 한다. the past-due balance, 기일을 넘긴 잔금을. by the date, 날짜까지. written on the front page of your bill, [당신의 청구서 앞면에 적혀 있는]. to avoid the late fee, 연체를 피하기 위해","hl":"ch"},{"n":46,"text":"이 문장에서는 the date written on the front page of your bill을 한 덩어리로 읽어요. 과거분사구 written이 the date를 뒤에서 꾸며 주죠. to avoid the late fee는 지불하는 목적을 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 You must pay the past-due balance by \u003cspan class=\"fx\">the date written on the front page of your bill\u003c/span> to avoid the late fee.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>청구서에 적힌 날짜까지 밀린 잔금을 내야 연체료를 피할 수 있다는 뜻입니다. 기한을 넘기면 추가 비용이 생긴다는 경고입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by the date written on the front page of your bill\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">by the date shown on the front of your bill\u003c/span>\u003cdiv class=\"w\">written on the front page를 shown on the front로 바꾼 표현입니다. 청구서에 표시된 날짜라는 뜻을 쉽게 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to avoid the late fee\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so that you do not have to pay a late fee\u003c/span>\u003cdiv class=\"w\">목적의 to부정사를 so that 절로 풀어 쓴 표현입니다. 연체료를 내지 않기 위한 목적이 분명해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">past-due\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">overdue\u003c/span>\u003cspan class=\"y-eq\">past-due = overdue\u003c/span>\u003cdiv class=\"w\">기일이 지난이라는 뜻을 overdue로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">balance\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">amount owed\u003c/span>\u003cspan class=\"y-eq\">balance = amount owed\u003c/span>\u003cdiv class=\"w\">잔금, 지불 잔액이라는 뜻을 amount owed로 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">late fee\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">penalty charge\u003c/span>\u003cspan class=\"y-eq\">late fee = penalty charge\u003c/span>\u003cdiv class=\"w\">연체료라는 뜻을 penalty charge로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">You have to pay the overdue amount by the date shown on the front of your bill so that you do not have to pay a late fee.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"청구서 앞면에 적힌 날짜까지 밀린 잔금을 내야 연체료를 피할 수 있다는 뜻이에요. 기한을 넘기면 추가 비용이 생긴다는 경고를 담고 있죠.","hl":"mn"},{"n":48,"text":"by the date written on the front page of your bill은 by the date shown on the front of your bill로 바꿀 수 있어요. to avoid the late fee는 so that you do not have to pay a late fee로 풀어 쓸 수 있습니다.","hl":"rw"},{"n":49,"text":"past due는 overdue로, balance는 amount owed로 바꿀 수 있어요. late fee는 penalty charge로 바꾸면 뜻이 분명해집니다.","hl":"ph"},{"n":50,"text":"전체 문장은 You have to pay the overdue amount by the date shown on the front of your bill so that you do not have to pay a late fee라고 바꿔 말할 수 있어요. 목적이 더 분명하게 드러나죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 On February 9th, 2020, South Korean movie Parasite became \u003cspan class=\"fx\">the first foreign-language film to be crowned Best Picture\u003c/span> at the Academy Awards.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">On February 9th, 2020, \u003c/div>\u003cdiv class=\"k\">2020년 2월 9일에\u003c/div>\u003cdiv class=\"e\">South Korean movie Parasite \u003c/div>\u003cdiv class=\"k\">남한의 영화 '기생충'은\u003c/div>\u003cdiv class=\"e\">became the first foreign-language film \u003c/div>\u003cdiv class=\"k\">최초의 외국어 영화가 되었다\u003c/div>\u003cdiv class=\"e\">to be crowned Best Picture at the Academy Awards.\u003c/div>\u003cdiv class=\"k\">[아카데미 시상식에서 최고 작품상을 수상한]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>to be crowned 이하는 the first foreign-language film을 수식하는 형용사적 to부정사입니다. \u003cb class=\"key\">명사 + to-v\u003c/b> 블록이 '최고 작품상을 수상한 최초의 외국어 영화'라는 의미를 만듭니다.\u003c/div>","segs":[{"n":51,"text":"On February 9th, 2020, 2020년 2월 9일에. South Korean movie Parasite, 남한의 영화 '기생충'은. became the first foreign-language film, 최초의 외국어 영화가 되었다. to be crowned Best Picture at the Academy Awards, [아카데미 시상식에서 최고 작품상을 수상한]","hl":"ch"},{"n":52,"text":"이 문장에서는 the first foreign language film to be crowned Best Picture를 한 덩어리로 읽어요. to be crowned 이하는 the first foreign language film을 꾸며 주는 형용사적 to 부정사예요. 수동의 to be crowned가 쓰여 영화가 상을 받는 대상임을 보여 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 On February 9th, 2020, South Korean movie Parasite became \u003cspan class=\"fx\">the first foreign-language film to be crowned Best Picture\u003c/span> at the Academy Awards.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>기생충이 아카데미 시상식에서 최고 작품상을 받은 최초의 외국어 영화가 되었다는 뜻입니다. 외국어 영화가 최고상의 주인공이 된 역사적 사건을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">became the first foreign-language film to be crowned Best Picture\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">was the first foreign-language film to win Best Picture\u003c/span>\u003cdiv class=\"w\">became을 was로, be crowned를 win으로 바꾼 표현입니다. 상을 받았다는 뜻을 더 직접적으로 보여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to be crowned Best Picture\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to receive the Best Picture award\u003c/span>\u003cdiv class=\"w\">crowned를 receive the award로 풀어 쓴 표현입니다. 수상했다는 의미가 분명해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be crowned\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be awarded\u003c/span>\u003cspan class=\"y-eq\">be crowned = be awarded\u003c/span>\u003cdiv class=\"w\">상을 받는다는 뜻을 be awarded로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">foreign-language film\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">non-English-language film\u003c/span>\u003cspan class=\"y-eq\">foreign-language film = non-English-language film\u003c/span>\u003cdiv class=\"w\">외국어 영화를 영어가 아닌 언어의 영화로 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Best Picture\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">top film award\u003c/span>\u003cspan class=\"y-eq\">Best Picture = top film award\u003c/span>\u003cdiv class=\"w\">최고 작품상이라는 뜻을 top film award로 설명했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">On February 9th, 2020, the South Korean movie Parasite became the first non-English-language film to win Best Picture at the Academy Awards.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"기생충이 아카데미 시상식에서 최고 작품상을 받은 최초의 외국어 영화가 되었다는 뜻이에요. 외국어 영화가 최고상의 주인공이 된 역사적인 사건을 강조하는 문장이죠.","hl":"mn"},{"n":54,"text":"to be crowned Best Picture는 to win Best Picture나 to receive the Best Picture award로 바꿀 수 있어요. became the first foreign language film은 was the first foreign language film to로 바꿔 말할 수 있습니다.","hl":"rw"},{"n":55,"text":"be crowned는 be awarded로 바꿀 수 있고 Best Picture는 top film award로 풀어 쓸 수 있어요. foreign language film은 a film in a language other than English로 바꿔 말할 수 있습니다.","hl":"ph"},{"n":56,"text":"전체 문장은 the South Korean movie Parasite became the first film in a language other than English to win Best Picture at the Academy Awards라고 바꿔 말할 수 있어요. 날짜를 빼고 말해도 핵심 뜻은 그대로 전달됩니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 The order to abandon ship automatically assumes two rules : women and children are first, and the captain is \u003cspan class=\"fx\">the last to leave\u003c/span> or goes down with his vessel.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The order \u003c/div>\u003cdiv class=\"k\">명령은\u003c/div>\u003cdiv class=\"e\">to abandon ship \u003c/div>\u003cdiv class=\"k\">[배를 버리라는]\u003c/div>\u003cdiv class=\"e\">automatically assumes two rules : \u003c/div>\u003cdiv class=\"k\">자동으로 두 개의 규칙을 취한다\u003c/div>\u003cdiv class=\"e\">women and children are first, \u003c/div>\u003cdiv class=\"k\">여성과 아이들이 먼저이다\u003c/div>\u003cdiv class=\"e\">and the captain is the last to leave \u003c/div>\u003cdiv class=\"k\">그리고 선장은 떠나는 마지막 사람이다\u003c/div>\u003cdiv class=\"e\">or goes down with his vessel.\u003c/div>\u003cdiv class=\"k\">또는 자신의 배와 함께 침몰한다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>to abandon ship이 The order를 수식하고, to leave가 the last를 수식합니다. 주어인 선장이 떠나는 주체이므로 \u003cb class=\"key\">명사 + to-v\u003c/b>의 능동 의미를 지닌 to leave가 적절하며 수동의 left는 적절하지 않습니다.\u003c/div>","segs":[{"n":57,"text":"The order, 명령은. to abandon ship, [배를 버리라는]. automatically assumes two rules, 자동으로 두 개의 규칙을 취한다. women and children are first, 여성과 아이들이 먼저이다. and the captain is the last to leave, 그리고 선장은 떠나는 마지막 사람이다. or goes down with his vessel, 또는 자신의 배와 함께 침몰한다","hl":"ch"},{"n":58,"text":"이 문장에서는 The order to abandon ship과 the last to leave를 눈여겨봐요. to abandon ship은 The order를 꾸며 주고 to leave는 the last를 꾸며 주는 형용사적 to 부정사죠. 선장이 떠나는 주체이므로 수동의 left가 아니라 능동의 to leave가 적절합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 The order to abandon ship automatically assumes two rules : women and children are first, and the captain is \u003cspan class=\"fx\">the last to leave\u003c/span> or goes down with his vessel.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>배를 버리라는 명령에는 자동으로 두 규칙이 따른다는 뜻입니다. 여성과 아이들이 먼저이고 선장은 마지막으로 배를 떠나거나 배와 함께 침몰해야 한다는 규범을 말합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the captain is the last to leave\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the captain leaves last\u003c/span>\u003cdiv class=\"w\">the last to leave를 leaves last로 바꾼 표현입니다. 선장이 마지막에 떠난다는 뜻을 더 직접적으로 보여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">goes down with his vessel\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">sinks with the ship\u003c/span>\u003cdiv class=\"w\">goes down with를 sinks with로, vessel을 ship으로 바꾼 쉬운 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">abandon\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">leave\u003c/span>\u003cspan class=\"y-eq\">abandon = leave\u003c/span>\u003cdiv class=\"w\">배를 버린다는 뜻을 leave로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">assume\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">take on\u003c/span>\u003cspan class=\"y-eq\">assume = take on\u003c/span>\u003cdiv class=\"w\">규칙이나 태도를 취한다는 뜻을 take on으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">vessel\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ship\u003c/span>\u003cspan class=\"y-eq\">vessel = ship\u003c/span>\u003cdiv class=\"w\">배, 선박이라는 뜻을 더 일반적인 ship으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The order to abandon ship automatically implies two rules: women and children go first, and the captain either leaves last or sinks with the ship.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"배를 버리라는 명령에는 두 가지 규칙이 자동으로 따른다는 뜻이에요. 여성과 아이들이 먼저이고 선장은 마지막으로 배를 떠나거나 배와 함께 침몰해야 한다는 규범이죠.","hl":"mn"},{"n":60,"text":"the captain is the last to leave는 the captain leaves last로 바꿀 수 있어요. goes down with his vessel은 sinks with the ship으로 바꾸면 더 쉬운 표현이 됩니다.","hl":"rw"},{"n":61,"text":"abandon은 leave나 give up으로, assume은 take on으로 바꿀 수 있어요. vessel은 ship으로 바꾸면 자연스럽답니다.","hl":"ph"},{"n":62,"text":"전체 문장은 The order to abandon ship automatically implies two rules. Women and children go first, and the captain either leaves last or sinks with the ship라고 바꿔 말할 수 있어요. 두 규칙의 의미가 분명하게 드러나죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 The company has decided to launch \u003cspan class=\"fx\">a new campaign targeting  inexperienced college graduates preparing to enter the job market\u003c/span> for the first time.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The company \u003c/div>\u003cdiv class=\"k\">그 회사는\u003c/div>\u003cdiv class=\"e\">has decided to launch a new campaign \u003c/div>\u003cdiv class=\"k\">새로운 캠페인을 시작하기로 결정했다\u003c/div>\u003cdiv class=\"e\">targeting  inexperienced college graduates \u003c/div>\u003cdiv class=\"k\">[경험이 없는 대학 졸업생을 겨냥하는\u003c/div>\u003cdiv class=\"e\">preparing to enter the job market \u003c/div>\u003cdiv class=\"k\">[처음으로 취업 시장에 들어가려고 준비하고 있는]\u003c/div>\u003cdiv class=\"e\">for the first time.\u003c/div>\u003cdiv class=\"k\">\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>targeting은 새로운 캠페인이 졸업생을 겨냥하는 주체이므로 능동의 현재분사가 적절합니다. preparing은 대학 졸업생들이 준비하는 주체이므로 \u003cb class=\"key\">명사 + v-ing\u003c/b>의 능동 의미를 지닌 현재분사가 적절합니다.\u003c/div>","segs":[{"n":63,"text":"The company, 그 회사는. has decided to launch a new campaign, 새로운 캠페인을 시작하기로 결정했다. targeting inexperienced college graduates, [경험이 없는 대학 졸업생을 겨냥하는. preparing to enter the job market, [처음으로 취업 시장에 들어가려고 준비하고 있는]. for the first time","hl":"ch"},{"n":64,"text":"이 문장에서는 a new campaign targeting inexperienced college graduates를 한 덩어리로 읽어요. targeting은 새로운 캠페인이 졸업생을 겨냥하는 주체이므로 능동의 현재분사가 적절하죠. preparing도 대학 졸업생들이 준비하는 주체이므로 능동의 현재분사가 적절합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 The company has decided to launch \u003cspan class=\"fx\">a new campaign targeting  inexperienced college graduates preparing to enter the job market\u003c/span> for the first time.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>회사가 처음 취업 시장에 들어가려는 경험 없는 대학 졸업생들을 대상으로 하는 새 캠페인을 시작하기로 했다는 뜻입니다. 캠페인의 목표 집단이 누구인지 분명히 밝히는 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">targeting inexperienced college graduates\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">aimed at inexperienced college graduates\u003c/span>\u003cdiv class=\"w\">현재분사 targeting을 aimed at으로 바꾼 표현입니다. 캠페인이 특정 집단을 대상으로 한다는 뜻이 분명해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">preparing to enter the job market for the first time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who are preparing to enter the job market for the first time\u003c/span>\u003cdiv class=\"w\">현재분사구를 who are preparing 절로 풀어 쓴 표현입니다. 졸업생들이 준비하는 주체임을 보여 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">launch\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">start\u003c/span>\u003cspan class=\"y-eq\">launch = start\u003c/span>\u003cdiv class=\"w\">캠페인을 시작한다는 뜻을 start로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">targeting\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">aimed at\u003c/span>\u003cspan class=\"y-eq\">targeting = aimed at\u003c/span>\u003cdiv class=\"w\">~을 겨냥하는이라는 뜻을 aimed at으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">inexperienced\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lacking experience\u003c/span>\u003cspan class=\"y-eq\">inexperienced = lacking experience\u003c/span>\u003cdiv class=\"w\">경험이 없는이라는 뜻을 lacking experience로 풀어 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The company has decided to start a new campaign aimed at inexperienced college graduates who are preparing to enter the job market for the first time.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"회사가 처음 취업 시장에 들어가려는 경험 없는 대학 졸업생들을 대상으로 새 캠페인을 시작하기로 했다는 뜻이에요. 캠페인의 목표 집단이 누구인지 분명히 밝히는 문장이죠.","hl":"mn"},{"n":66,"text":"targeting inexperienced college graduates는 aimed at inexperienced college graduates로 바꿀 수 있어요. preparing to enter the job market는 who are preparing to enter the job market로 풀어 쓸 수 있습니다.","hl":"rw"},{"n":67,"text":"launch는 start로, targeting은 aimed at으로 바꿀 수 있어요. inexperienced는 lacking experience로 바꾸면 뜻이 분명해집니다.","hl":"ph"},{"n":68,"text":"전체 문장은 The company has decided to start a new campaign aimed at inexperienced college graduates who are preparing to enter the job market for the first time라고 바꿔 말할 수 있어요. 원문의 의미를 자연스럽게 풀어 쓴 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 The desire to fly is \u003cspan class=\"fx\">an idea handed down to us by our ancestors who looked enviously on the birds soaring freely through space\u003c/span> on the infinite highway of the air.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The desire to fly \u003c/div>\u003cdiv class=\"k\">날고자 하는 욕망은\u003c/div>\u003cdiv class=\"e\">is an idea \u003c/div>\u003cdiv class=\"k\">생각이다\u003c/div>\u003cdiv class=\"e\">handed down to us by our ancestors \u003c/div>\u003cdiv class=\"k\">[우리에게 전해져 내려오는 우리 조상에 의해서]\u003c/div>\u003cdiv class=\"e\">who looked enviously on the birds \u003c/div>\u003cdiv class=\"k\">[새들을 부러운 듯 바라보았던]\u003c/div>\u003cdiv class=\"e\">soaring freely through space \u003c/div>\u003cdiv class=\"k\">[자유롭게 공간을 날아오르는\u003c/div>\u003cdiv class=\"e\">on the infinite highway of the air.\u003c/div>\u003cdiv class=\"k\">하늘이라는 무한한 고속도로 위에서]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>생각은 전해져 내려오는 대상이므로 수동의 의미를 나타내는 과거분사 handed가 적절하고, 새들이 날아오르는 주체이므로 능동의 의미를 나타내는 현재분사 soaring이 적절합니다. \u003cb class=\"key\">명사 + v-ed\u003c/b>와 \u003cb class=\"key\">명사 + v-ing\u003c/b> 블록이 이어지며, the infinite highway of the air는 동격의 of로 '하늘이라는 무한한 고속도로'를 뜻합니다.\u003c/div>","segs":[{"n":69,"text":"The desire to fly, 날고자 하는 욕망은. is an idea, 생각이다. handed down to us by our ancestors, [우리에게 전해져 내려오는 우리 조상에 의해서]. who looked enviously on the birds, [새들을 부러운 듯 바라보았던]. soaring freely through space, [자유롭게 공간을 날아오르는. on the infinite highway of the air, 하늘이라는 무한한 고속도로 위에서]","hl":"ch"},{"n":70,"text":"이 문장에서는 an idea handed down to us by our ancestors를 한 덩어리로 읽어요. 생각은 전해져 내려오는 대상이므로 수동의 과거분사 handed가 적절하죠. 새들이 날아오르는 주체이므로 soaring은 능동의 현재분사가 적절합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 The desire to fly is \u003cspan class=\"fx\">an idea handed down to us by our ancestors who looked enviously on the birds soaring freely through space\u003c/span> on the infinite highway of the air.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>날고자 하는 욕망은 하늘을 자유롭게 나는 새들을 부러워한 조상들이 우리에게 물려준 생각이라는 뜻입니다. 인간의 비행 욕망이 오래된 유산임을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">an idea handed down to us by our ancestors\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">an idea that our ancestors passed down to us\u003c/span>\u003cdiv class=\"w\">과거분사구 handed down을 that our ancestors passed down 절로 풀어 쓴 표현입니다. 조상이 물려주었다는 능동의 의미가 분명해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the birds soaring freely through space\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the birds that soar freely through space\u003c/span>\u003cdiv class=\"w\">현재분사구 soaring을 that 절로 풀어 쓴 표현입니다. 새들이 자유롭게 난다는 능동의 의미를 보여 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">hand down\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pass down\u003c/span>\u003cspan class=\"y-eq\">hand down = pass down\u003c/span>\u003cdiv class=\"w\">후손에게 전해 준다는 뜻을 pass down으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">enviously\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">with envy\u003c/span>\u003cspan class=\"y-eq\">enviously = with envy\u003c/span>\u003cdiv class=\"w\">부러운 듯이라는 부사를 with envy로 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">soar\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fly high\u003c/span>\u003cspan class=\"y-eq\">soar = fly high\u003c/span>\u003cdiv class=\"w\">높이 날아오른다는 뜻을 fly high로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The desire to fly is an idea that our ancestors passed down to us after watching birds soar freely through the sky on the air's infinite highway.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"날고자 하는 욕망은 하늘을 자유롭게 나는 새들을 부러워한 조상들이 우리에게 물려준 생각이라는 뜻이에요. 인간의 비행 욕망이 아주 오래된 유산임을 강조하죠.","hl":"mn"},{"n":72,"text":"an idea handed down to us by our ancestors는 an idea that our ancestors passed down to us로 바꿀 수 있어요. the birds soaring freely through space는 the birds that soar freely through space로 풀어 쓸 수 있습니다.","hl":"rw"},{"n":73,"text":"hand down은 pass down으로, enviously는 with envy로 바꿀 수 있어요. soar는 fly high로 바꾸면 뜻이 잘 통해요.","hl":"ph"},{"n":74,"text":"전체 문장은 The desire to fly is an idea that our ancestors passed down to us after watching birds soar freely through the sky on the air's infinite highway라고 바꿔 말할 수 있어요. 원문의 이미지를 살린 자연스러운 표현이죠.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">명사 + to-v\u003c/b>는 '~하는 명사', \u003cb class=\"key\">명사 + v-ing\u003c/b>는 명사가 직접 하는 능동 행동, \u003cb class=\"key\">명사 + v-ed\u003c/b>는 명사가 당하는 수동 상태로 읽습니다.\u003c/li>\u003cli>명사 바로 뒤에 붙은 to부정사와 분사는 명사를 꾸미는 블록이므로 명사와 함께 끊어 읽습니다.\u003c/li>\u003cli>to부정사와 분사의 의미상 주어를 찾아 능동과 수동을 구별하는 것이 핵심입니다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 명사 뒤에 to 부정사와 현재분사, 과거분사가 붙어 명사를 꾸며 주는 구조를 배웠어요. to 부정사는 명사가 무엇을 하는지 설명하고, 현재분사는 능동의 느낌, 과거분사는 수동의 느낌을 살려 준다고 정리할 수 있죠. 문장을 읽을 때는 명사와 뒤에 붙은 꾸밈말을 한 블록으로 묶어서 읽어 보세요. 오늘 배운 블록을 활용하면 긴 문장도 훨씬 쉽게 분석할 수 있을 거예요. 수고했어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
