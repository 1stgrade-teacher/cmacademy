  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}

  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});

lecturePlayer(document.getElementById("app"),{"brand":"unit42","title":"마블레드 구문분석: 가정법과 조건문의 완전 정복","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마블레드\u003c/div>\u003ch1>마블레드 구문분석: 가정법과 조건문의 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>가정법 과거완료와 도치된 조건문을 읽고, 과거 사실의 반대와 혼합 가정의 의미를 정확히 파악한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마블레드 유닛의 예문으로 가정법과 조건문을 함께 정리해 볼게요. 특히 if가 있는 조건문뿐 아니라 if가 사라지고 had가 앞으로 나온 도치 표현까지 다룹니다. 이 표현들이 왜 시험에 자주 나오는지, 문장 속에서 어떻게 의미를 만드는지 차근차근 살펴봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">이 유닛의 중심은 \u003cb class=\"key\">If + 주어 + had p.p., 주어 + would/could/might have p.p.\u003c/b>로 과거 사실의 반대를 표현하는 가정법 과거완료입니다. 여기에 \u003cb class=\"key\">Had + 주어 + p.p.\u003c/b>처럼 if를 빼고 had를 주어 앞으로 보내는 도치가 자주 쓰입니다. 또한 \u003cb class=\"key\">If ... had p.p. ..., would ... now/today\u003c/b>처럼 과거의 가정이 현재 결과로 이어지는 혼합 가정법도 구별해야 합니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 He wouldn't have stopped smoking \u003cspan class=\"fx\">if his doctor hadn't told him about the condition of his lungs\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 In my own travels, \u003cspan class=\"fx\">had I taken packaged tours\u003c/span> I never would have had any eye-opening experiences.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 \u003cspan class=\"fx\">If the truck driver had only taken a few minutes to get the nail removed\u003c/span>, he most likely would not have had a flat tire yesterday.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 As a firefighter, I have seen many people die in fires. Most could have saved themselves \u003cspan class=\"fx\">had they been prepared\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Can you imagine what the world today would be like \u003cspan class=\"fx\">if Leonardo da Vinci had become a farmer or Wolfgang Amadeus Mozart a banker\u003c/span>?\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 If I am a great man, it is all thanks to my mother. \u003cspan class=\"fx\">Hadn't she devoted herself to supporting me\u003c/span>, I could never have become what I am.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 We must assume that we had one chance each for The Divine Comedy and King Lear. \u003cspan class=\"fx\">If Dante and Shakespeare had died before they wrote those works\u003c/span>, nobody ever would have written them.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Some economists discovered that gym goers would have been better off, financially, \u003cspan class=\"fx\">had they chosen to pay per workout rather than signing up for monthly or annual memberships\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">If Louise had not learned the effective parenting skills taught in the seminars\u003c/span>, she would probably be using similarly ineffective threatening techniques with her own children today.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">If our ancestors hadn't agonized over losses and instead had taken too many chances in going after the big gains\u003c/span>, they'd have been more likely to lose out and never become anyone's ancestor.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">Had it not been for Newton\u003c/span>, Einstein might never have had his own miracle year that completely revolutionized our view of gravity, space, matter, and time.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Copernicus doubted that the earth was the center of the universe. \u003cspan class=\"fx\">If it had not been for doubt\u003c/span>, we should be now even more ignorant than we really are.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 핵심 규칙부터 볼게요. 과거 사실의 반대를 말할 때는 if 다음에 주어와 had 과거분사가 오고, 주절에는 would have 과거분사가 옵니다. 이때 if를 없애고 had를 주어 앞으로 보내면 같은 뜻을 더 강조하는 도치 조건문이 됩니다. 또 과거의 가정이 현재의 결과로 이어질 때는 주절에 would be나 would be using처럼 현재 표현이 올 수 있다는 점도 기억해 주세요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 He wouldn't have stopped smoking \u003cspan class=\"fx\">if his doctor hadn't told him about the condition of his lungs\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">He wouldn't have stopped smoking\u003c/div>\u003cdiv class=\"k\">그는 흡연을 중단하지 않았을 텐데\u003c/div>\u003cdiv class=\"e\"> if his doctor hadn't told him\u003c/div>\u003cdiv class=\"k\">만약 그의 의사가 그에게 말해주지 않았더라면\u003c/div>\u003cdiv class=\"e\"> about the condition of his lungs.\u003c/div>\u003cdiv class=\"k\">그의 폐 상태에 대해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + had p.p.\u003c/b>로 과거 사실의 반대를 가정하고, 주절의 \u003cb class=\"key\">wouldn't have p.p.\u003c/b>가 그 결과를 나타내는 가정법 과거완료입니다. 실제로는 의사가 폐 상태를 말해 주었기 때문에 금연했다는 과거 사실을 뒤집어 상상한 문장입니다.\u003c/div>","segs":[{"n":3,"text":"He wouldn't have stopped smoking, 그는 흡연을 중단하지 않았을 텐데. if his doctor hadn't told him, 만약 그의 의사가 그에게 말해주지 않았더라면. about the condition of his lungs, 그의 폐 상태에 대해","hl":"ch"},{"n":4,"text":"첫 번째 문장은 과거 사실의 반대를 말하는 가정법 과거완료예요. if his doctor hadn't told him처럼 if 다음에 주어와 had 과거분사가 오고, 주절에는 wouldn't have stopped smoking이 와서 과거의 결과를 나타냅니다. 실제로는 의사가 말해 주었기 때문에 금연했다는 사실을 반대로 상상한 문장이라고 보면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 He wouldn't have stopped smoking \u003cspan class=\"fx\">if his doctor hadn't told him about the condition of his lungs\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>실제로는 의사가 폐 상태를 알려 주었고, 그래서 그는 담배를 끊었습니다. 만약 그 조언이 없었다면 그는 계속 흡연했을 것이라는 뜻으로, 현재의 결과를 과거의 가정으로 되돌려 설명합니다. '금연하지 않았을 텐데'가 핵심입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">if his doctor hadn't told him\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Had his doctor not told him\u003c/span>\u003cdiv class=\"w\">if절의 if를 없애고 had를 주어 앞으로 도치한 표현입니다. 같은 가정법 과거완료를 더 문어적이고 강조된 어조로 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">wouldn't have stopped smoking\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">would have continued smoking\u003c/span>\u003cdiv class=\"w\">부정 표현을 반대 의미의 긍정 표현으로 바꾸어 뜻을 자연스럽게 유지했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stop smoking\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">quit smoking\u003c/span>\u003cspan class=\"y-eq\">stop = quit\u003c/span>\u003cdiv class=\"w\">흡연을 끊는다는 뜻을 같은 의미의 quit으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the condition of his lungs\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">his lung condition\u003c/span>\u003cspan class=\"y-eq\">the condition of his lungs = his lung condition\u003c/span>\u003cdiv class=\"w\">of 전치사구를 명사 앞 수식으로 바꾸어 더 간결하게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">told him about\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">informed him of\u003c/span>\u003cspan class=\"y-eq\">tell about = inform of\u003c/span>\u003cdiv class=\"w\">알려 주다라는 뜻을 격식 있는 inform of로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Had his doctor not informed him of his lung condition, he would have continued smoking.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장의 핵심은 의사의 조언이 없었다면 그는 담배를 끊지 않았을 것이라는 점이에요. 즉 실제로는 의사의 말이 금연에 결정적인 영향을 주었다는 뜻을 담고 있습니다. 그래서 wouldn't have stopped smoking을 would have continued smoking으로 바꾸어 이해해도 좋아요.","hl":"mn"},{"n":6,"text":"표현을 바꿔 볼까요. if his doctor hadn't told him은 Had his doctor not told him으로 도치할 수 있고, 뜻은 같지만 더 강조된 느낌을 줍니다. 또한 wouldn't have stopped smoking은 would have continued smoking으로 바꾸면 의미가 더 분명해집니다.","hl":"rw"},{"n":7,"text":"어구도 정리해 볼게요. stop smoking은 quit smoking과 같은 뜻이고, the condition of his lungs는 his lung condition으로 간결하게 말할 수 있습니다. told him about은 informed him of로 바꾸면 더 격식 있는 표현이 됩니다.","hl":"ph"},{"n":8,"text":"이제 같은 뜻의 문장을 소리 내어 읽어 볼게요. Had his doctor not informed him of his lung condition, he would have continued smoking. 의사의 조언이 없었다면 계속 흡연했을 것이라는 뜻이 잘 드러나죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 In my own travels, \u003cspan class=\"fx\">had I taken packaged tours\u003c/span> I never would have had any eye-opening experiences.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">In my own travels,\u003c/div>\u003cdiv class=\"k\">내 자신의 여행에서\u003c/div>\u003cdiv class=\"e\"> had I taken packaged tours\u003c/div>\u003cdiv class=\"k\">내가 패키지여행을 했다면\u003c/div>\u003cdiv class=\"e\"> I never would have had\u003c/div>\u003cdiv class=\"k\">나는 결코 가질 수 없었을 텐데\u003c/div>\u003cdiv class=\"e\"> any eye-opening experiences.\u003c/div>\u003cdiv class=\"k\">어떤 놀랄 만한 경험도\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Had + 주어 + p.p.\u003c/b>는 if를 생략한 가정법 과거완료 도치입니다. 여기서는 If I had taken packaged tours의 뜻으로, 주절의 \u003cb class=\"key\">would never have had\u003c/b>와 함께 과거 사실의 반대를 나타냅니다.\u003c/div>","segs":[{"n":9,"text":"In my own travels, 내 자신의 여행에서. had I taken packaged tours, 내가 패키지여행을 했다면. I never would have had, 나는 결코 가질 수 없었을 텐데. any eye-opening experiences, 어떤 놀랄 만한 경험도","hl":"ch"},{"n":10,"text":"두 번째 문장은 if가 사라지고 had가 앞으로 나온 도치 조건문이에요. had I taken packaged tours는 If I had taken packaged tours와 같은 뜻이고, 주절의 never would have had가 과거의 반대 결과를 나타냅니다. 이런 도치가 나오면 if가 생략되었다는 점을 바로 알아차려야 합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 In my own travels, \u003cspan class=\"fx\">had I taken packaged tours\u003c/span> I never would have had any eye-opening experiences.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>실제로는 패키지여행을 하지 않았고, 그래서 눈을 뜨게 하는 경험을 했다는 뜻입니다. 만약 패키지여행을 선택했다면 그런 경험은 없었을 것이라고 상상하는 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">had I taken packaged tours\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">if I had taken packaged tours\u003c/span>\u003cdiv class=\"w\">도치된 had를 if절로 풀어 쓴 표현입니다. 뜻은 같지만 if가 드러나서 구조가 더 분명해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">never would have had any eye-opening experiences\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">would have missed all eye-opening experiences\u003c/span>\u003cdiv class=\"w\">부정 표현을 missed all로 바꾸어 같은 의미를 더 자연스럽게 전달했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">packaged tours\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">organized package tours\u003c/span>\u003cspan class=\"y-eq\">packaged tours = organized package tours\u003c/span>\u003cdiv class=\"w\">패키지여행을 조금 더 설명적으로 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">eye-opening experiences\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">enlightening experiences\u003c/span>\u003cspan class=\"y-eq\">eye-opening = enlightening\u003c/span>\u003cdiv class=\"w\">눈을 뜨게 하는 경험을 깨달음을 주는 경험으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">In my own travels\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">During my own travels\u003c/span>\u003cspan class=\"y-eq\">in = during\u003c/span>\u003cdiv class=\"w\">여행 중이라는 의미를 during으로 더 자연스럽게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">During my own travels, if I had chosen organized package tours, I would have had no eye-opening experiences.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 실제로는 패키지여행을 하지 않았다는 사실을 전제로 해요. 만약 패키지여행을 했다면 눈을 뜨게 하는 경험을 전혀 하지 못했을 것이라는 뜻입니다. 자유 여행을 통해 값진 경험을 했다는 뉘앙스가 담겨 있습니다.","hl":"mn"},{"n":12,"text":"had I taken packaged tours는 if I had taken packaged tours로 풀어 쓸 수 있어요. 그리고 never would have had any eye-opening experiences는 would have missed all eye-opening experiences처럼 바꾸면 의미가 더 쉽게 다가옵니다.","hl":"rw"},{"n":13,"text":"packaged tours는 organized package tours라고도 할 수 있고, eye-opening experiences는 enlightening experiences로 바꿀 수 있어요. In my own travels는 During my own travels로 표현해도 자연스럽습니다.","hl":"ph"},{"n":14,"text":"같은 뜻의 문장을 들어 볼게요. During my own travels, if I had chosen organized package tours, I would have had no eye-opening experiences. 패키지여행을 선택했다면 놀라운 경험을 하지 못했을 것이라는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 \u003cspan class=\"fx\">If the truck driver had only taken a few minutes to get the nail removed\u003c/span>, he most likely would not have had a flat tire yesterday.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If the truck driver\u003c/div>\u003cdiv class=\"k\">만약 그 트럭 운전사가\u003c/div>\u003cdiv class=\"e\"> had only taken a few minutes\u003c/div>\u003cdiv class=\"k\">단 몇 분을 들였더라면\u003c/div>\u003cdiv class=\"e\"> to get the nail removed,\u003c/div>\u003cdiv class=\"k\">그 못을 제거하기 위해서\u003c/div>\u003cdiv class=\"e\"> he most likely\u003c/div>\u003cdiv class=\"k\">그는 아마도\u003c/div>\u003cdiv class=\"e\"> would not have had a flat tire yesterday.\u003c/div>\u003cdiv class=\"k\">어제 타이어 펑크를 겪지 않았을 텐데\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + had p.p.\u003c/b>로 과거 사실의 반대를 가정하고, 주절의 \u003cb class=\"key\">would not have p.p.\u003c/b>가 그 결과를 나타냅니다. only는 if절 안에서 '단지 ~만 했더라면'의 아쉬움을 강조합니다.\u003c/div>","segs":[{"n":15,"text":"If the truck driver, 만약 그 트럭 운전사가. had only taken a few minutes, 단 몇 분을 들였더라면. to get the nail removed, 그 못을 제거하기 위해서. he most likely, 그는 아마도. would not have had a flat tire yesterday, 어제 타이어 펑크를 겪지 않았을 텐데","hl":"ch"},{"n":16,"text":"세 번째 문장도 과거 사실의 반대를 말하는 가정법 과거완료예요. If the truck driver had only taken처럼 if절에 had 과거분사가 오고, 주절에는 would not have had가 와서 과거의 결과를 나타냅니다. only는 단지 몇 분만 들였더라면이라는 아쉬움을 더해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 \u003cspan class=\"fx\">If the truck driver had only taken a few minutes to get the nail removed\u003c/span>, he most likely would not have had a flat tire yesterday.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>실제로는 운전사가 못을 제거하는 데 시간을 들이지 않았고, 그래서 어제 타이어 펑크를 겪었습니다. 몇 분만 투자했더라면 펑크를 피했을 것이라는 후회와 아쉬움이 담겨 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">If the truck driver had only taken\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Had the truck driver only taken\u003c/span>\u003cdiv class=\"w\">if를 생략하고 had를 주어 앞으로 보낸 도치 표현입니다. 같은 가정법 과거완료를 더 강조된 어조로 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">would not have had a flat tire\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">would have avoided a flat tire\u003c/span>\u003cdiv class=\"w\">부정 표현을 avoid라는 긍정 동사로 바꾸어 뜻을 자연스럽게 유지했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">taken a few minutes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">spent a few minutes\u003c/span>\u003cspan class=\"y-eq\">take time = spend time\u003c/span>\u003cdiv class=\"w\">시간을 들인다는 뜻을 spend로 바꾸어 더 자연스럽게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">get the nail removed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have the nail taken out\u003c/span>\u003cspan class=\"y-eq\">get + p.p. = have + p.p.\u003c/span>\u003cdiv class=\"w\">사역의 get을 have로 바꾸고 removed를 taken out으로 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">most likely\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">probably\u003c/span>\u003cspan class=\"y-eq\">most likely = probably\u003c/span>\u003cdiv class=\"w\">가능성이 높다는 뜻을 같은 의미의 부사로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Had the truck driver spent just a few minutes having the nail removed, he probably would have avoided a flat tire yesterday.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"실제로는 운전사가 못을 빼는 일을 하지 않았기 때문에 어제 타이어 펑크를 겪었어요. 몇 분만 시간을 들였더라면 펑크를 피할 수 있었을 것이라는 후회가 담긴 문장입니다. 그래서 would not have had a flat tire를 would have avoided a flat tire로 이해하면 쉬워요.","hl":"mn"},{"n":18,"text":"If the truck driver had only taken은 Had the truck driver only taken으로 도치할 수 있습니다. would not have had a flat tire는 would have avoided a flat tire로 바꾸면 뜻이 더 분명해집니다.","hl":"rw"},{"n":19,"text":"taken a few minutes는 spent a few minutes로 바꿀 수 있고, get the nail removed는 have the nail taken out처럼 사역 표현으로 바꿀 수 있어요. most likely는 probably와 같은 뜻으로 정리해 두세요.","hl":"ph"},{"n":20,"text":"이제 같은 뜻의 문장을 읽어 볼게요. Had the truck driver spent just a few minutes having the nail removed, he probably would have avoided a flat tire yesterday. 몇 분만 들였더라면 펑크를 피했을 것이라는 의미가 잘 보이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 As a firefighter, I have seen many people die in fires. Most could have saved themselves \u003cspan class=\"fx\">had they been prepared\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">As a firefighter,\u003c/div>\u003cdiv class=\"k\">소방관으로서\u003c/div>\u003cdiv class=\"e\"> I have seen many people die in fires.\u003c/div>\u003cdiv class=\"k\">나는 많은 사람들이 화재 속에서 죽는 것을 봐왔다.\u003c/div>\u003cdiv class=\"e\"> Most could have saved themselves\u003c/div>\u003cdiv class=\"k\">대부분은 자신을 구할 수 있었을 텐데\u003c/div>\u003cdiv class=\"e\"> had they been prepared.\u003c/div>\u003cdiv class=\"k\">그들이 준비되어 있었더라면\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Had + 주어 + p.p.\u003c/b>는 if they had been prepared에서 if가 생략된 도치 표현입니다. 주절의 \u003cb class=\"key\">could have saved\u003c/b>와 함께 과거에 가능했지만 일어나지 않은 일을 나타냅니다.\u003c/div>","segs":[{"n":21,"text":"As a firefighter, 소방관으로서. I have seen many people die in fires, 나는 많은 사람들이 화재 속에서 죽는 것을 봐왔다.. Most could have saved themselves, 대부분은 자신을 구할 수 있었을 텐데. had they been prepared, 그들이 준비되어 있었더라면","hl":"ch"},{"n":22,"text":"네 번째 문장에서는 had they been prepared가 핵심이에요. 이는 If they had been prepared에서 if가 빠지고 had가 앞으로 나온 도치 조건문입니다. 주절의 could have saved themselves와 함께 과거에 가능했던 일을 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 As a firefighter, I have seen many people die in fires. Most could have saved themselves \u003cspan class=\"fx\">had they been prepared\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>많은 사람들이 화재로 죽었지만, 준비되어 있었다면 스스로를 구할 수 있었을 것입니다. 실제로는 준비가 부족했다는 안타까움과 교훈을 담고 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">had they been prepared\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">if they had been prepared\u003c/span>\u003cdiv class=\"w\">도치된 조건문을 if절로 풀어 쓴 표현입니다. 같은 뜻을 더 기본 구조로 보여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Most could have saved themselves\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Most would have been able to save themselves\u003c/span>\u003cdiv class=\"w\">could have를 would have been able to로 바꾸어 가능성의 의미를 더 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">As a firefighter\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">In my role as a firefighter\u003c/span>\u003cspan class=\"y-eq\">as = in my role as\u003c/span>\u003cdiv class=\"w\">소방관이라는 신분을 더 설명적으로 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">saved themselves\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rescued themselves\u003c/span>\u003cspan class=\"y-eq\">save = rescue\u003c/span>\u003cdiv class=\"w\">구하다라는 뜻을 rescue로 바꾸어 뜻을 살렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">been prepared\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">been ready\u003c/span>\u003cspan class=\"y-eq\">prepared = ready\u003c/span>\u003cdiv class=\"w\">준비되어 있다는 뜻을 더 쉬운 ready로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">As a firefighter, I have seen many people die in fires. Most would have been able to rescue themselves if they had been ready.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"소방관인 화자가 많은 사람이 화재로 죽는 것을 보았다는 경험을 말하고 있어요. 그리고 대부분은 준비만 되어 있었더라면 스스로를 구할 수 있었을 것이라고 안타까워합니다. 실제로는 준비가 부족했다는 점을 강조하는 문장입니다.","hl":"mn"},{"n":24,"text":"had they been prepared는 if they had been prepared로 풀어 쓸 수 있어요. Most could have saved themselves는 Most would have been able to save themselves로 바꾸면 가능성의 의미가 더 분명해집니다.","hl":"rw"},{"n":25,"text":"As a firefighter는 In my role as a firefighter로 바꿀 수 있고, saved themselves는 rescued themselves로 표현할 수 있어요. been prepared는 been ready와 같은 뜻으로 정리할 수 있습니다.","hl":"ph"},{"n":26,"text":"같은 뜻을 가진 문장을 들어 볼게요. As a firefighter, I have seen many people die in fires. Most would have been able to rescue themselves if they had been ready. 준비되어 있었다면 스스로를 구할 수 있었을 것이라는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Can you imagine what the world today would be like \u003cspan class=\"fx\">if Leonardo da Vinci had become a farmer or Wolfgang Amadeus Mozart a banker\u003c/span>?\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Can you imagine\u003c/div>\u003cdiv class=\"k\">너는 상상할 수 있니\u003c/div>\u003cdiv class=\"e\"> what the world today would be like\u003c/div>\u003cdiv class=\"k\">오늘날 세상이 어떠할까를\u003c/div>\u003cdiv class=\"e\"> if Leonardo da Vinci had become a farmer\u003c/div>\u003cdiv class=\"k\">만약 레오나르도 다빈치가 농부가 되었다면\u003c/div>\u003cdiv class=\"e\"> or Wolfgang Amadeus Mozart a banker?\u003c/div>\u003cdiv class=\"k\">또는 볼프강 아마데우스 모차르트가 은행원이 되었다면?\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + had p.p.\u003c/b>로 과거 사실의 반대를 가정하고, 주절의 \u003cb class=\"key\">would be like\u003c/b>가 그 가정이 현재에 미칠 영향을 묻습니다. Mozart 뒤에는 had become이 생략된 \u003cb class=\"key\">반복 어구의 생략\u003c/b>이 있습니다.\u003c/div>","segs":[{"n":27,"text":"Can you imagine, 너는 상상할 수 있니. what the world today would be like, 오늘날 세상이 어떠할까를. if Leonardo da Vinci had become a farmer, 만약 레오나르도 다빈치가 농부가 되었다면. or Wolfgang Amadeus Mozart a banker?, 또는 볼프강 아마데우스 모차르트가 은행원이 되었다면?","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 과거의 가정이 현재의 모습에 어떤 영향을 주는지 묻는 혼합 가정법이에요. if Leonardo da Vinci had become a farmer처럼 과거의 가정을 말하고, what the world today would be like처럼 현재의 결과를 상상합니다. Mozart a banker 뒤에는 had become이 반복되지 않고 생략되어 있다는 점도 꼭 기억해 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Can you imagine what the world today would be like \u003cspan class=\"fx\">if Leonardo da Vinci had become a farmer or Wolfgang Amadeus Mozart a banker\u003c/span>?\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>다빈치와 모차르트가 예술가가 아니라 다른 직업을 가졌다면 오늘날 세상이 어땠을지 상상해 보라는 뜻입니다. 두 천재의 선택이 인류 역사에 얼마나 큰 영향을 주었는지 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">or Wolfgang Amadeus Mozart a banker\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">or if Wolfgang Amadeus Mozart had become a banker\u003c/span>\u003cdiv class=\"w\">생략된 had become을 복원한 표현입니다. 두 번째 가정의 구조가 분명해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Can you imagine what the world today would be like\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Can you picture how the world today would be\u003c/span>\u003cdiv class=\"w\">imagine을 picture로, what ... would be like를 how ... would be로 바꾸어 같은 뜻을 전달했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Can you imagine\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Can you picture\u003c/span>\u003cspan class=\"y-eq\">imagine = picture\u003c/span>\u003cdiv class=\"w\">머릿속에 그려 보라는 뜻을 picture로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">what the world today would be like\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">how the world today would be\u003c/span>\u003cspan class=\"y-eq\">what ... would be like = how ... would be\u003c/span>\u003cdiv class=\"w\">상태를 묻는 표현을 how절로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">had become a farmer\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">had chosen farming\u003c/span>\u003cspan class=\"y-eq\">become a farmer = choose farming\u003c/span>\u003cdiv class=\"w\">농부가 되다라는 말을 농사를 선택하다로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Can you picture how the world today would be if Leonardo da Vinci had chosen farming or Wolfgang Amadeus Mozart had become a banker?\u003c/div>\u003c/div>","segs":[{"n":29,"text":"다빈치와 모차르트가 각각 농부와 은행원이 되었다면 오늘날 세상이 어땠을지 상상해 보라는 뜻이에요. 두 사람이 예술가로 남은 선택이 역사에 얼마나 큰 영향을 주었는지 강조하는 문장입니다.","hl":"mn"},{"n":30,"text":"Mozart a banker는 if Wolfgang Amadeus Mozart had become a banker로 풀어 쓸 수 있어요. Can you imagine은 Can you picture로 바꿔도 같은 뜻을 전달할 수 있습니다.","hl":"rw"},{"n":31,"text":"Can you imagine은 Can you picture와 같고, what the world today would be like는 how the world today would be로 바꿀 수 있어요. had become a farmer는 had chosen farming처럼 표현해도 자연스럽습니다.","hl":"ph"},{"n":32,"text":"같은 뜻의 문장을 읽어 볼게요. Can you picture how the world today would be if Leonardo da Vinci had chosen farming or Wolfgang Amadeus Mozart had become a banker? 두 천재의 다른 선택을 상상해 보라는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 If I am a great man, it is all thanks to my mother. \u003cspan class=\"fx\">Hadn't she devoted herself to supporting me\u003c/span>, I could never have become what I am.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If I am a great man,\u003c/div>\u003cdiv class=\"k\">만약 내가 위대한 인물이라면\u003c/div>\u003cdiv class=\"e\"> it is all thanks to my mother.\u003c/div>\u003cdiv class=\"k\">그것은 모두 나의 어머니 덕분이다.\u003c/div>\u003cdiv class=\"e\"> Hadn't she devoted herself\u003c/div>\u003cdiv class=\"k\">그녀가 헌신하지 않았더라면\u003c/div>\u003cdiv class=\"e\"> to supporting me,\u003c/div>\u003cdiv class=\"k\">나를 부양하는 데\u003c/div>\u003cdiv class=\"e\"> I could never have become\u003c/div>\u003cdiv class=\"k\">나는 결코 될 수 없었을 것이다\u003c/div>\u003cdiv class=\"e\"> what I am.\u003c/div>\u003cdiv class=\"k\">현재의 내가\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Hadn't + 주어 + p.p.\u003c/b>는 If she hadn't devoted herself to ...에서 if가 생략되고 부정어 not이 had와 함께 앞으로 나온 도치입니다. 주절의 \u003cb class=\"key\">could never have become\u003c/b>과 함께 과거 사실의 반대를 나타냅니다.\u003c/div>","segs":[{"n":33,"text":"If I am a great man, 만약 내가 위대한 인물이라면. it is all thanks to my mother, 그것은 모두 나의 어머니 덕분이다.. Hadn't she devoted herself, 그녀가 헌신하지 않았더라면. to supporting me, 나를 부양하는 데. I could never have become, 나는 결코 될 수 없었을 것이다. what I am, 현재의 내가","hl":"ch"},{"n":34,"text":"여섯 번째 문장에는 Hadn't she devoted herself to supporting me가 나와요. 이는 If she hadn't devoted herself to supporting me에서 if가 빠지고 not이 had와 함께 앞으로 나온 도치 표현입니다. 주절의 could never have become과 함께 어머니의 헌신이 없었다면 현재의 내가 될 수 없었다는 뜻을 만듭니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 If I am a great man, it is all thanks to my mother. \u003cspan class=\"fx\">Hadn't she devoted herself to supporting me\u003c/span>, I could never have become what I am.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>내가 위대한 사람이라면 그것은 어머니가 나를 지원하는 데 헌신했기 때문입니다. 어머니의 헌신이 없었다면 지금의 내가 될 수 없었다는 감사와 겸손의 뜻이 담겨 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Hadn't she devoted herself to supporting me\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If she hadn't devoted herself to supporting me\u003c/span>\u003cdiv class=\"w\">도치된 부정 조건문을 if절로 풀어 쓴 표현입니다. 같은 뜻을 기본 어순으로 보여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">could never have become what I am\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">would never have become the person I am\u003c/span>\u003cdiv class=\"w\">could never have become을 would never have become으로, what I am을 the person I am으로 바꾸어 뜻을 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">devoted herself to supporting me\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">committed herself to supporting me\u003c/span>\u003cspan class=\"y-eq\">devote oneself to = commit oneself to\u003c/span>\u003cdiv class=\"w\">헌신하다라는 뜻을 commit으로 바꾸어 같은 의미를 전달했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">thanks to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">because of\u003c/span>\u003cspan class=\"y-eq\">thanks to = because of\u003c/span>\u003cdiv class=\"w\">덕분에라는 표현을 보다 중립적인 because of로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">what I am\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the person I am\u003c/span>\u003cspan class=\"y-eq\">what I am = the person I am\u003c/span>\u003cdiv class=\"w\">현재의 나라는 뜻을 명사구로 풀어 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If I am a great man, it is all because of my mother. If she had not committed herself to supporting me, I would never have become the person I am.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"화자는 자신이 위대한 사람이라면 그것은 모두 어머니 덕분이라고 말해요. 어머니가 나를 지원하는 데 헌신하지 않았다면 지금의 내가 될 수 없었을 것이라는 감사의 마음이 담겨 있습니다. what I am은 현재의 나라는 뜻으로 이해하면 됩니다.","hl":"mn"},{"n":36,"text":"Hadn't she devoted herself to supporting me는 If she hadn't devoted herself to supporting me로 풀어 쓸 수 있어요. could never have become what I am은 would never have become the person I am으로 바꾸면 의미가 더 선명해집니다.","hl":"rw"},{"n":37,"text":"devoted herself to supporting me는 committed herself to supporting me로 바꿀 수 있고, thanks to는 because of와 같은 뜻이에요. what I am은 the person I am으로 표현할 수 있습니다.","hl":"ph"},{"n":38,"text":"같은 뜻의 문장을 들어 볼게요. If I am a great man, it is all because of my mother. If she had not committed herself to supporting me, I would never have become the person I am. 어머니의 헌신에 대한 감사가 잘 드러나죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 We must assume that we had one chance each for The Divine Comedy and King Lear. \u003cspan class=\"fx\">If Dante and Shakespeare had died before they wrote those works\u003c/span>, nobody ever would have written them.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We must assume\u003c/div>\u003cdiv class=\"k\">우리는 생각해야 한다\u003c/div>\u003cdiv class=\"e\"> that we had one chance each\u003c/div>\u003cdiv class=\"k\">우리가 각각 한 번의 기회가 있었다고\u003c/div>\u003cdiv class=\"e\"> for The Divine Comedy and King Lear.\u003c/div>\u003cdiv class=\"k\">「신곡」과 「리어 왕」에 대해\u003c/div>\u003cdiv class=\"e\"> If Dante and Shakespeare had died\u003c/div>\u003cdiv class=\"k\">만약 단테와 셰익스피어가 사망했다면\u003c/div>\u003cdiv class=\"e\"> before they wrote those works,\u003c/div>\u003cdiv class=\"k\">그들이 그 작품들을 쓰기 전에\u003c/div>\u003cdiv class=\"e\"> nobody ever would have written them.\u003c/div>\u003cdiv class=\"k\">아무도 지금까지 그것들을 쓰지 않았을 것이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + had p.p.\u003c/b>로 과거 사실의 반대를 가정하고, 주절의 \u003cb class=\"key\">would ever have written\u003c/b>이 그 결과를 나타냅니다. 여기서 ever는 '한 번이라도'의 뜻으로 부정의 범위를 강조합니다.\u003c/div>","segs":[{"n":39,"text":"We must assume, 우리는 생각해야 한다. that we had one chance each, 우리가 각각 한 번의 기회가 있었다고. for The Divine Comedy and King Lear, 「신곡」과 「리어 왕」에 대해. If Dante and Shakespeare had died, 만약 단테와 셰익스피어가 사망했다면. before they wrote those works, 그들이 그 작품들을 쓰기 전에. nobody ever would have written them, 아무도 지금까지 그것들을 쓰지 않았을 것이다","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 If Dante and Shakespeare had died before they wrote those works처럼 과거 사실의 반대를 가정해요. 주절의 nobody ever would have written them은 그 가정의 결과를 나타내고, ever는 한 번이라도라는 뜻으로 부정의 느낌을 강조합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 We must assume that we had one chance each for The Divine Comedy and King Lear. \u003cspan class=\"fx\">If Dante and Shakespeare had died before they wrote those works\u003c/span>, nobody ever would have written them.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>단테와 셰익스피어가 작품을 쓰기 전에 죽었다면 아무도 그 작품을 쓰지 못했을 것입니다. 즉 위대한 작품은 그들이 살아서 한 번의 기회를 잡았기 때문에 존재한다는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">If Dante and Shakespeare had died\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Had Dante and Shakespeare died\u003c/span>\u003cdiv class=\"w\">if를 생략하고 had를 주어 앞으로 보낸 도치 표현입니다. 같은 가정법 과거완료를 더 강조된 어조로 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nobody ever would have written them\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">they would never have been written by anyone\u003c/span>\u003cdiv class=\"w\">능동문을 수동문으로 바꾸어 같은 뜻을 다른 구조로 보여 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">one chance each\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">one opportunity each\u003c/span>\u003cspan class=\"y-eq\">chance = opportunity\u003c/span>\u003cdiv class=\"w\">기회라는 뜻을 opportunity로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">before they wrote those works\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">prior to writing those works\u003c/span>\u003cspan class=\"y-eq\">before = prior to\u003c/span>\u003cdiv class=\"w\">before절을 전치사구로 바꾸어 더 간결하게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nobody ever would have written them\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">they would never have been written\u003c/span>\u003cspan class=\"y-eq\">nobody would have written them = they would never have been written\u003c/span>\u003cdiv class=\"w\">능동 표현을 수동 표현으로 바꾸어 뜻을 유지했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We must assume that we had one chance each for The Divine Comedy and King Lear. Had Dante and Shakespeare died before writing those works, they would never have been written by anyone.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"단테와 셰익스피어가 작품을 쓰기 전에 죽었다면 아무도 그 작품을 쓰지 못했을 거예요. 다시 말해 위대한 작품은 그들이 살아서 기회를 잡았기 때문에 탄생했다는 뜻입니다. 한 번의 기회가 얼마나 소중한지 보여 주는 문장이죠.","hl":"mn"},{"n":42,"text":"If Dante and Shakespeare had died는 Had Dante and Shakespeare died로 도치할 수 있어요. nobody ever would have written them은 they would never have been written by anyone처럼 수동태로 바꿀 수 있습니다.","hl":"rw"},{"n":43,"text":"one chance each는 one opportunity each로 바꿀 수 있고, before they wrote those works는 prior to writing those works로 표현할 수 있어요. nobody ever would have written them은 they would never have been written으로 정리해 두세요.","hl":"ph"},{"n":44,"text":"같은 뜻의 문장을 읽어 볼게요. We must assume that we had one chance each for The Divine Comedy and King Lear. Had Dante and Shakespeare died before writing those works, they would never have been written by anyone. 작품을 쓰기 전에 죽었다면 존재하지 못했을 것이라는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 Some economists discovered that gym goers would have been better off, financially, \u003cspan class=\"fx\">had they chosen to pay per workout rather than signing up for monthly or annual memberships\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Some economists discovered\u003c/div>\u003cdiv class=\"k\">어떤 경제학자들은 발견했다\u003c/div>\u003cdiv class=\"e\"> that gym goers would have been better off,\u003c/div>\u003cdiv class=\"k\">헬스클럽에 가는 사람들은 더 나았을 것이라는 것을\u003c/div>\u003cdiv class=\"e\"> financially,\u003c/div>\u003cdiv class=\"k\">금전적으로\u003c/div>\u003cdiv class=\"e\"> had they chosen to pay per workout\u003c/div>\u003cdiv class=\"k\">만약 그들이 운동할 때마다 지불하는 것을 선택했더라면\u003c/div>\u003cdiv class=\"e\"> rather than signing up\u003c/div>\u003cdiv class=\"k\">신청하는 대신에\u003c/div>\u003cdiv class=\"e\"> for monthly or annual memberships.\u003c/div>\u003cdiv class=\"k\">월 또는 연 단위의 회원권을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Had + 주어 + p.p.\u003c/b>는 if they had chosen의 도치입니다. 주절의 \u003cb class=\"key\">would have been better off\u003c/b>와 함께 과거 선택의 반대 결과를 나타내며, better off는 '더 나은 상태인'이라는 뜻입니다.\u003c/div>","segs":[{"n":45,"text":"Some economists discovered, 어떤 경제학자들은 발견했다. that gym goers would have been better off, 헬스클럽에 가는 사람들은 더 나았을 것이라는 것을. financially, 금전적으로. had they chosen to pay per workout, 만약 그들이 운동할 때마다 지불하는 것을 선택했더라면. rather than signing up, 신청하는 대신에. for monthly or annual memberships, 월 또는 연 단위의 회원권을","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 had they chosen to pay per workout처럼 had가 앞으로 나온 도치 조건문이에요. 이는 if they had chosen to pay per workout과 같은 뜻이고, 주절의 would have been better off가 과거 선택의 반대 결과를 나타냅니다. better off는 더 나은 상태라는 뜻으로 기억해 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 Some economists discovered that gym goers would have been better off, financially, \u003cspan class=\"fx\">had they chosen to pay per workout rather than signing up for monthly or annual memberships\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>월간이나 연간 회원권을 끊는 대신 운동할 때마다 돈을 냈다면 재정적으로 더 유리했을 것이라는 연구 결과입니다. 실제로는 회원권을 선택했고, 그 선택이 금전적으로 덜 좋았을 수 있음을 시사합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">had they chosen to pay per workout\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">if they had chosen to pay per workout\u003c/span>\u003cdiv class=\"w\">도치된 조건문을 if절로 풀어 쓴 표현입니다. 같은 뜻을 기본 어순으로 보여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">would have been better off, financially\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">would have been in a better financial position\u003c/span>\u003cdiv class=\"w\">better off를 더 설명적인 표현으로 바꾸어 금전적 이점을 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">better off\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in a better position\u003c/span>\u003cspan class=\"y-eq\">better off = in a better position\u003c/span>\u003cdiv class=\"w\">더 나은 상태라는 뜻을 위치나 상황 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pay per workout\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pay each time they worked out\u003c/span>\u003cspan class=\"y-eq\">per workout = each time they worked out\u003c/span>\u003cdiv class=\"w\">운동할 때마다 지불한다는 뜻을 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">signing up for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">registering for\u003c/span>\u003cspan class=\"y-eq\">sign up for = register for\u003c/span>\u003cdiv class=\"w\">회원권을 신청한다는 뜻을 register for로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Some economists found that gym goers would have been in a better financial position if they had paid each time they worked out instead of registering for monthly or annual memberships.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"경제학자들은 헬스클럽에 가는 사람들이 운동할 때마다 돈을 냈다면 금전적으로 더 나았을 것이라고 발견했어요. 실제로는 월간이나 연간 회원권을 선택했고, 그 선택이 재정적으로 덜 유리했을 수 있다는 뜻입니다. better off, financially를 금전적으로 더 나은 상태로 이해하면 됩니다.","hl":"mn"},{"n":48,"text":"had they chosen to pay per workout은 if they had chosen to pay per workout으로 풀어 쓸 수 있어요. would have been better off, financially는 would have been in a better financial position으로 바꾸면 더 분명해집니다.","hl":"rw"},{"n":49,"text":"better off는 in a better position과 같고, pay per workout은 pay each time they worked out으로 바꿀 수 있어요. signing up for는 registering for로 표현해도 좋습니다.","hl":"ph"},{"n":50,"text":"같은 뜻의 문장을 들어 볼게요. Some economists found that gym goers would have been in a better financial position if they had paid each time they worked out instead of registering for monthly or annual memberships. 금전적으로 더 나았을 것이라는 뜻이 잘 드러나죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 \u003cspan class=\"fx\">If Louise had not learned the effective parenting skills taught in the seminars\u003c/span>, she would probably be using similarly ineffective threatening techniques with her own children today.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If Louise had not learned\u003c/div>\u003cdiv class=\"k\">만약 Louise가 배우지 않았더라면\u003c/div>\u003cdiv class=\"e\"> the effective parenting skills\u003c/div>\u003cdiv class=\"k\">효과적인 양육 기술을\u003c/div>\u003cdiv class=\"e\"> taught in the seminars,\u003c/div>\u003cdiv class=\"k\">세미나에서 교수 받은\u003c/div>\u003cdiv class=\"e\"> she would probably be using\u003c/div>\u003cdiv class=\"k\">그녀는 아마도 사용하고 있을 것이다\u003c/div>\u003cdiv class=\"e\"> similarly ineffective threatening techniques\u003c/div>\u003cdiv class=\"k\">비슷하게 비효율적인 위협하는 기술을\u003c/div>\u003cdiv class=\"e\"> with her own children today.\u003c/div>\u003cdiv class=\"k\">오늘날 자신의 자녀들에게\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + had p.p.\u003c/b>로 과거의 가정을 말하고, 주절의 \u003cb class=\"key\">would probably be using\u003c/b>이 그 가정이 현재에 미치는 결과를 나타냅니다. 과거의 조건과 현재의 결과가 결합된 \u003cb class=\"key\">혼합 가정법\u003c/b>입니다.\u003c/div>","segs":[{"n":51,"text":"If Louise had not learned, 만약 Louise가 배우지 않았더라면. the effective parenting skills, 효과적인 양육 기술을. taught in the seminars, 세미나에서 교수 받은. she would probably be using, 그녀는 아마도 사용하고 있을 것이다. similarly ineffective threatening techniques, 비슷하게 비효율적인 위협하는 기술을. with her own children today, 오늘날 자신의 자녀들에게","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 과거의 가정과 현재의 결과가 섞인 혼합 가정법이에요. If Louise had not learned처럼 과거의 일을 가정하고, she would probably be using처럼 현재 진행 중인 결과를 말합니다. 그래서 과거에 배우지 않았다면 오늘날에도 쓰고 있을 것이라는 뜻이 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 \u003cspan class=\"fx\">If Louise had not learned the effective parenting skills taught in the seminars\u003c/span>, she would probably be using similarly ineffective threatening techniques with her own children today.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>루이스가 세미나에서 효과적인 양육 기술을 배웠기 때문에 지금은 그 기술을 사용하고 있습니다. 만약 배우지 않았다면 오늘날에도 비효율적인 위협 방식을 쓰고 있을 것이라는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">If Louise had not learned\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Had Louise not learned\u003c/span>\u003cdiv class=\"w\">if를 생략하고 had를 주어 앞으로 보낸 도치 표현입니다. 같은 가정법 과거완료를 더 강조된 어조로 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">she would probably be using\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">she would likely be using\u003c/span>\u003cdiv class=\"w\">probably를 likely로 바꾸어 같은 의미를 더 자연스럽게 전달했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">effective parenting skills\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">useful child-rearing skills\u003c/span>\u003cspan class=\"y-eq\">parenting = child-rearing\u003c/span>\u003cdiv class=\"w\">양육 기술을 child-rearing skills로 풀어 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">taught in the seminars\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">provided in the seminars\u003c/span>\u003cspan class=\"y-eq\">taught = provided\u003c/span>\u003cdiv class=\"w\">세미나에서 가르친 기술을 제공된 기술로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">threatening techniques\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">intimidating methods\u003c/span>\u003cspan class=\"y-eq\">threatening = intimidating\u003c/span>\u003cdiv class=\"w\">위협하는 기술을 intimidating methods로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Had Louise not learned the useful child-rearing skills provided in the seminars, she would likely be using similarly ineffective intimidating methods with her own children today.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"루이스는 세미나에서 효과적인 양육 기술을 배웠기 때문에 지금은 그 기술을 사용하고 있어요. 만약 배우지 않았다면 오늘날에도 비슷하게 비효율적인 위협 방식을 자녀에게 쓰고 있을 것이라는 뜻입니다. 과거의 배움이 현재의 양육 방식을 바꾸었다는 점이 핵심입니다.","hl":"mn"},{"n":54,"text":"If Louise had not learned는 Had Louise not learned로 도치할 수 있어요. she would probably be using은 she would likely be using으로 바꾸면 같은 뜻을 더 자연스럽게 전달할 수 있습니다.","hl":"rw"},{"n":55,"text":"effective parenting skills는 useful child-rearing skills로 바꿀 수 있고, taught in the seminars는 provided in the seminars로 표현할 수 있어요. threatening techniques는 intimidating methods와 같은 뜻입니다.","hl":"ph"},{"n":56,"text":"같은 뜻의 문장을 읽어 볼게요. Had Louise not learned the useful child-rearing skills provided in the seminars, she would likely be using similarly ineffective intimidating methods with her own children today. 과거의 배움이 현재를 바꾼다는 의미가 잘 보이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 \u003cspan class=\"fx\">If our ancestors hadn't agonized over losses and instead had taken too many chances in going after the big gains\u003c/span>, they'd have been more likely to lose out and never become anyone's ancestor.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If our ancestors hadn't agonized over losses\u003c/div>\u003cdiv class=\"k\">만약 우리의 조상들이 손실에 대해 고심하지 않았다면\u003c/div>\u003cdiv class=\"e\"> and instead had taken too many chances\u003c/div>\u003cdiv class=\"k\">그리고 대신에 너무나 많은 위험을 무릅썼다면\u003c/div>\u003cdiv class=\"e\"> in going after the big gains,\u003c/div>\u003cdiv class=\"k\">큰 이익을 추구하면서\u003c/div>\u003cdiv class=\"e\"> they'd have been more likely to lose out\u003c/div>\u003cdiv class=\"k\">그들은 실패했을 가능성이 더욱 컸을 것이다\u003c/div>\u003cdiv class=\"e\"> and never become anyone's ancestor.\u003c/div>\u003cdiv class=\"k\">그리고 결코 어떤 사람의 조상이 되지 못했을 것이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + had p.p.\u003c/b>가 두 개의 과거 가정을 and로 연결하고, 주절의 \u003cb class=\"key\">would have been more likely to\u003c/b>가 그 결과의 가능성을 나타냅니다. instead는 앞의 행동과 반대되는 선택을 강조합니다.\u003c/div>","segs":[{"n":57,"text":"If our ancestors hadn't agonized over losses, 만약 우리의 조상들이 손실에 대해 고심하지 않았다면. and instead had taken too many chances, 그리고 대신에 너무나 많은 위험을 무릅썼다면. in going after the big gains, 큰 이익을 추구하면서. they'd have been more likely to lose out, 그들은 실패했을 가능성이 더욱 컸을 것이다. and never become anyone's ancestor, 그리고 결코 어떤 사람의 조상이 되지 못했을 것이다","hl":"ch"},{"n":58,"text":"열 번째 문장은 과거 사실의 반대를 길게 가정하는 문장이에요. If our ancestors hadn't agonized over losses and instead had taken too many chances처럼 if절 안에 두 가지 가정이 and로 연결되어 있습니다. 주절의 they'd have been more likely to lose out이 그 결과의 가능성을 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 \u003cspan class=\"fx\">If our ancestors hadn't agonized over losses and instead had taken too many chances in going after the big gains\u003c/span>, they'd have been more likely to lose out and never become anyone's ancestor.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>조상들이 손실을 걱정하지 않고 큰 이익만 좇아 위험을 많이 감수했다면, 살아남지 못하고 후손을 남기지 못했을 가능성이 컸다는 뜻입니다. 신중함이 인류 생존에 중요했다는 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">If our ancestors hadn't agonized over losses\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Had our ancestors not agonized over losses\u003c/span>\u003cdiv class=\"w\">if를 생략하고 had를 주어 앞으로 보낸 도치 표현입니다. 같은 가정법 과거완료를 더 강조된 어조로 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">they'd have been more likely to lose out\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">they would probably have failed\u003c/span>\u003cdiv class=\"w\">more likely to lose out을 probably have failed로 바꾸어 뜻을 더 쉽게 전달했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">agonized over losses\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">worried excessively about losses\u003c/span>\u003cspan class=\"y-eq\">agonize over = worry excessively about\u003c/span>\u003cdiv class=\"w\">고심하다라는 뜻을 지나치게 걱정하다로 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">taken too many chances\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">taken too many risks\u003c/span>\u003cspan class=\"y-eq\">take chances = take risks\u003c/span>\u003cdiv class=\"w\">위험을 무릅쓰다는 뜻을 take risks로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">going after the big gains\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pursuing major profits\u003c/span>\u003cspan class=\"y-eq\">go after = pursue\u003c/span>\u003cdiv class=\"w\">큰 이익을 추구한다는 뜻을 pursue로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Had our ancestors not worried excessively about losses and instead taken too many risks while pursuing major profits, they would probably have failed and never become anyone's ancestor.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"조상들이 손실을 걱정하지 않고 큰 이익만 좇아 위험을 많이 감수했다면 살아남지 못했을 가능성이 커요. 그리고 아무도 후손을 남기지 못했을 수 있다는 뜻입니다. 신중함이 생존에 중요했다는 메시지를 담고 있습니다.","hl":"mn"},{"n":60,"text":"If our ancestors hadn't agonized over losses는 Had our ancestors not agonized over losses로 도치할 수 있어요. they'd have been more likely to lose out은 they would probably have failed로 바꾸면 의미가 더 쉽게 다가옵니다.","hl":"rw"},{"n":61,"text":"agonized over losses는 worried excessively about losses로 바꿀 수 있고, taken too many chances는 taken too many risks와 같아요. going after the big gains는 pursuing major profits로 표현할 수 있습니다.","hl":"ph"},{"n":62,"text":"같은 뜻의 문장을 들어 볼게요. Had our ancestors not worried excessively about losses and instead taken too many risks while pursuing major profits, they would probably have failed and never become anyone's ancestor. 신중하지 않았다면 후손을 남기지 못했을 수 있다는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 \u003cspan class=\"fx\">Had it not been for Newton\u003c/span>, Einstein might never have had his own miracle year that completely revolutionized our view of gravity, space, matter, and time.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Had it not been for Newton,\u003c/div>\u003cdiv class=\"k\">만약 뉴턴이 없었더라면\u003c/div>\u003cdiv class=\"e\"> Einstein might never have had\u003c/div>\u003cdiv class=\"k\">아인슈타인은 결코 갖지 못했을 것이다\u003c/div>\u003cdiv class=\"e\"> his own miracle year\u003c/div>\u003cdiv class=\"k\">자신의 기적의 해를\u003c/div>\u003cdiv class=\"e\"> that completely revolutionized\u003c/div>\u003cdiv class=\"k\">완전히 근본적으로 바꾼\u003c/div>\u003cdiv class=\"e\"> our view of gravity, space, matter, and time.\u003c/div>\u003cdiv class=\"k\">중력, 공간, 물질 그리고 시간에 대한 우리의 시각을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Had it not been for + 명사\u003c/b>는 '만약 ~이 없었다면'이라는 가정법 과거완료 도치 표현입니다. 주절의 \u003cb class=\"key\">might never have had\u003c/b>와 함께 뉴턴이 없었다면 아인슈타인의 업적도 없었을 것이라는 과거의 반대를 나타냅니다.\u003c/div>","segs":[{"n":63,"text":"Had it not been for Newton, 만약 뉴턴이 없었더라면. Einstein might never have had, 아인슈타인은 결코 갖지 못했을 것이다. his own miracle year, 자신의 기적의 해를. that completely revolutionized, 완전히 근본적으로 바꾼. our view of gravity, space, matter, and time, 중력, 공간, 물질 그리고 시간에 대한 우리의 시각을","hl":"ch"},{"n":64,"text":"열한 번째 문장의 핵심은 Had it not been for Newton이에요. 이는 If it had not been for Newton과 같은 뜻으로, 만약 뉴턴이 없었다면이라는 가정법 과거완료 도치입니다. 주절의 might never have had와 함께 과거의 반대 결과를 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 \u003cspan class=\"fx\">Had it not been for Newton\u003c/span>, Einstein might never have had his own miracle year that completely revolutionized our view of gravity, space, matter, and time.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>뉴턴이 없었다면 아인슈타인은 중력, 공간, 물질, 시간에 대한 우리의 관점을 완전히 바꾼 기적의 해를 갖지 못했을 것입니다. 뉴턴의 선행 업적이 아인슈타인의 혁명적 성과에 결정적이었다는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Had it not been for Newton\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If it had not been for Newton\u003c/span>\u003cdiv class=\"w\">도치된 조건문을 if절로 풀어 쓴 표현입니다. 같은 뜻을 기본 어순으로 보여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">might never have had\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">might not have experienced\u003c/span>\u003cdiv class=\"w\">have had를 experienced로 바꾸어 경험의 의미를 더 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Had it not been for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Without\u003c/span>\u003cspan class=\"y-eq\">Had it not been for = Without\u003c/span>\u003cdiv class=\"w\">만약 없었다면이라는 표현을 전치사 Without으로 간결하게 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">completely revolutionized\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">radically transformed\u003c/span>\u003cspan class=\"y-eq\">revolutionize = radically transform\u003c/span>\u003cdiv class=\"w\">완전히 바꾸다라는 뜻을 radically transform으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">our view of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">our perspective on\u003c/span>\u003cspan class=\"y-eq\">view of = perspective on\u003c/span>\u003cdiv class=\"w\">관점이라는 뜻을 perspective로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Without Newton, Einstein might not have experienced his own miracle year that radically transformed our perspective on gravity, space, matter, and time.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"뉴턴이 없었다면 아인슈타인은 중력과 공간과 물질과 시간에 대한 우리의 관점을 완전히 바꾼 기적의 해를 갖지 못했을 거예요. 뉴턴의 업적이 아인슈타인의 혁명적 성과에 결정적인 바탕이 되었다는 뜻입니다. might never have had는 가능성이 없었을 것이라는 뉘앙스를 줍니다.","hl":"mn"},{"n":66,"text":"Had it not been for Newton은 If it had not been for Newton으로 풀어 쓸 수 있어요. might never have had는 might not have experienced로 바꾸면 의미가 더 쉽게 전달됩니다.","hl":"rw"},{"n":67,"text":"Had it not been for는 Without과 같은 뜻으로 정리할 수 있어요. completely revolutionized는 radically transformed로 바꿀 수 있고, our view of는 our perspective on으로 표현할 수 있습니다.","hl":"ph"},{"n":68,"text":"같은 뜻의 문장을 읽어 볼게요. Without Newton, Einstein might not have experienced his own miracle year that radically transformed our perspective on gravity, space, matter, and time. 뉴턴이 없었다면 아인슈타인의 기적의 해도 없었을 수 있다는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Copernicus doubted that the earth was the center of the universe. \u003cspan class=\"fx\">If it had not been for doubt\u003c/span>, we should be now even more ignorant than we really are.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Copernicus doubted\u003c/div>\u003cdiv class=\"k\">코페르니쿠스는 의심했다\u003c/div>\u003cdiv class=\"e\"> that the earth was the center of the universe.\u003c/div>\u003cdiv class=\"k\">지구가 우주의 중심이라는 것을\u003c/div>\u003cdiv class=\"e\"> If it had not been for doubt,\u003c/div>\u003cdiv class=\"k\">만약 의심이 없었더라면\u003c/div>\u003cdiv class=\"e\"> we should be now even more ignorant\u003c/div>\u003cdiv class=\"k\">우리는 지금 훨씬 더 무지할 것이다\u003c/div>\u003cdiv class=\"e\"> than we really are.\u003c/div>\u003cdiv class=\"k\">실제의 우리보다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If it had not been for + 명사\u003c/b>는 '만약 ~이 없었더라면'이라는 가정법 과거완료 표현입니다. 주절의 \u003cb class=\"key\">should be now\u003c/b>는 과거의 가정이 현재 결과로 이어지는 혼합 가정법으로, should는 여기서 would와 비슷하게 쓰였습니다.\u003c/div>","segs":[{"n":69,"text":"Copernicus doubted, 코페르니쿠스는 의심했다. that the earth was the center of the universe, 지구가 우주의 중심이라는 것을. If it had not been for doubt, 만약 의심이 없었더라면. we should be now even more ignorant, 우리는 지금 훨씬 더 무지할 것이다. than we really are, 실제의 우리보다","hl":"ch"},{"n":70,"text":"열두 번째 문장에는 If it had not been for doubt가 나와요. 이는 만약 의심이 없었더라면이라는 가정법 과거완료 표현이고, 주절의 we should be now는 과거의 가정이 현재 결과로 이어지는 혼합 가정법입니다. 여기서 should는 would와 비슷한 역할을 합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Copernicus doubted that the earth was the center of the universe. \u003cspan class=\"fx\">If it had not been for doubt\u003c/span>, we should be now even more ignorant than we really are.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>코페르니쿠스가 지구가 우주의 중심이라는 생각을 의심했기 때문에 우리의 인식이 발전했습니다. 의심이 없었다면 우리는 지금보다 훨씬 더 무지했을 것이라는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">If it had not been for doubt\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Had it not been for doubt\u003c/span>\u003cdiv class=\"w\">if를 생략하고 had를 주어 앞으로 보낸 도치 표현입니다. 같은 가정법 과거완료를 더 강조된 어조로 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">we should be now even more ignorant\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">we would be even more ignorant now\u003c/span>\u003cdiv class=\"w\">should be now를 would be now로 바꾸어 현대 영어에 더 익숙한 표현으로 만들었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">doubted that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">questioned whether\u003c/span>\u003cspan class=\"y-eq\">doubt that = question whether\u003c/span>\u003cdiv class=\"w\">의심했다는 뜻을 questioned whether로 바꾸어 의문의 의미를 살렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">had not been for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">without\u003c/span>\u003cspan class=\"y-eq\">had not been for = without\u003c/span>\u003cdiv class=\"w\">없었더라면이라는 표현을 Without으로 간결하게 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">even more ignorant\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">far more ignorant\u003c/span>\u003cspan class=\"y-eq\">even more = far more\u003c/span>\u003cdiv class=\"w\">훨씬 더라는 강조를 far more로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Copernicus questioned whether the earth was the center of the universe. Without doubt, we would be even more ignorant now than we really are.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"코페르니쿠스가 지구가 우주의 중심이라는 생각을 의심했기 때문에 우리의 인식이 발전할 수 있었어요. 만약 의심이 없었다면 우리는 지금보다 훨씬 더 무지했을 것이라는 뜻입니다. 의심이 지식의 출발점이라는 메시지를 담고 있습니다.","hl":"mn"},{"n":72,"text":"If it had not been for doubt는 Had it not been for doubt로 도치할 수 있어요. we should be now even more ignorant는 we would be even more ignorant now로 바꾸면 현대 영어에 더 익숙한 표현이 됩니다.","hl":"rw"},{"n":73,"text":"doubted that은 questioned whether로 바꿀 수 있고, had not been for는 without과 같은 뜻이에요. even more ignorant는 far more ignorant로 강조할 수 있습니다.","hl":"ph"},{"n":74,"text":"같은 뜻의 문장을 들어 볼게요. Copernicus questioned whether the earth was the center of the universe. Without doubt, we would be even more ignorant now than we really are. 의심이 없었다면 지금보다 더 무지했을 것이라는 뜻이에요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>과거 사실의 반대는 \u003cb class=\"key\">If + 주어 + had p.p., 주어 + would/could/might have p.p.\u003c/b>로 표현합니다.\u003c/li>\u003cli>if를 생략할 때는 \u003cb class=\"key\">Had + 주어 + p.p.\u003c/b>로 도치합니다.\u003c/li>\u003cli>과거의 가정이 현재 결과로 이어지면 \u003cb class=\"key\">would be / would be using\u003c/b> 같은 현재 표현을 씁니다.\u003c/li>\u003cli>\u003cb class=\"key\">Had it not been for + 명사\u003c/b>는 '만약 ~이 없었다면'입니다.\u003c/li>\u003cli>\u003cb class=\"key\">better off\u003c/b>, \u003cb class=\"key\">eye-opening\u003c/b>, \u003cb class=\"key\">agonize over\u003c/b> 같은 어구도 함께 익혀 둡니다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 마블레드 유닛에서 가정법 과거완료와 도치 조건문을 집중적으로 살펴봤어요. if절에는 had 과거분사, 주절에는 would have 과거분사가 기본이고, if가 사라지면 had가 주어 앞으로 나온다는 점을 꼭 기억해 주세요. 과거의 가정이 현재로 이어질 때는 would be 같은 현재 표현이 올 수 있고, Had it not been for는 만약 없었다면이라는 뜻으로 통째로 익혀 두면 좋아요. 오늘 배운 표현들을 예문과 함께 다시 읽어 보면서 꼭 자기 것으로 만들어 보세요. 수고 많았습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
