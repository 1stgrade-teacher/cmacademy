  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};

  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};

  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 42 if 가정법 과거완료 구문","title":"후회와 아쉬움을 표현하는 고난도 가정법 마스터하기","audioDir":"preview_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 9 Unit 42\u003c/div>\u003ch1>후회와 아쉬움을 표현하는 고난도 가정법 마스터하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>과거 사실의 반대를 가정하는 if 가정법 과거완료와 다양한 도치, 혼합 가정법 구문 완벽하게 이해하기\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 챕터 구 유닛 사십이에서 영어의 꽃이라고 불리는 가정법 구문 중에서도 아주 중요한 if 가정법 과거완료를 배워볼 거예요. 고등학교 시험에 정말 자주 나오는 단골 문법이니까 오늘 저와 함께 확실하게 정리해 봐요. 자, 그럼 첫 번째 개념부터 차근차근 시작해 볼까요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">if 가정법 과거완료 기본 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거 사실의 반대를 가정할 때는 \u003cb class=\"key\">If + S + had p.p. ~, S + would/could/might have p.p.\u003c/b> 형태를 사용해요. 과거에 일어났던 일과 반대되는 상황을 상상하며 말할 때 쓰는 \u003cb class=\"key\">가정법 과거완료\u003c/b> 구문이에요.\u003cdiv>\u003cspan class=\"g-formula\">If + S + had p.p. ~, S + would/could/might have p.p.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If I had left earlier, I would have caught the train.\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">내가 더 일찍 떠났다면 기차를 탈 수 있었을 텐데.\u003c/div>\u003cdiv class=\"g-note\">과거에 일어난 사실과 반대되는 상황을 가정하는 대표적인 예문이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주절의 조동사 뒤에는 반드시 \u003cb class=\"key\">have p.p.\u003c/b>가 온다는 것을 잊지 마세요.\u003c/div>","segs":[{"n":2,"text":"첫 번째로 배워볼 핵심은 과거 사실의 반대를 가정하는 구문이에요. 만약 주어가 과거에 과거분사를 했었다면 주어가 조동사의 과거형 뒤에 해브 피피를 했을 텐데라고 해석하면 된답니다. 이 공식을 머릿속에 꼭 넣어 두세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 같이 읽어 볼게요. If I had left earlier, I would have caught the train. 뜻은 내가 더 일찍 떠났다면 기차를 탈 수 있었을 텐데 라는 뜻이에요. 실제로 일찍 떠나지 못해서 기차를 놓친 과거의 아쉬움을 표현하고 있죠.","hl":"ex-0"},{"n":4,"text":"주절에 조동사만 쓰고 have p.p.를 빼먹는 실수를 정말 많이 해요. 조동사 뒤에는 꼭 have p.p.가 와야 한다는 점을 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">if의 생략과 도치 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">if가 생략되면 \u003cb class=\"key\">had\u003c/b>가 주어 앞으로 도치되어 \u003cb class=\"key\">Had + S + p.p. ~, S + would have p.p.\u003c/b> 형태가 돼요.\u003cdiv>\u003cspan class=\"g-formula\">Had + S + p.p. ~, S + would have p.p.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Had she known the truth, she would have helped him.\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">그녀가 진실을 알았다면 그를 도왔을 것이다.\u003c/div>\u003cdiv class=\"g-note\">if she had known에서 if가 생략되고 Had가 앞으로 도치된 문장이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">She would have gotten lost had she not used GPS.\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">그녀가 GPS를 쓰지 않았다면 길을 잃었을 것이다.\u003c/div>\u003cdiv class=\"g-note\">if절이 뒤에 오는 형태에서도 if를 생략하고 도치할 수 있음을 보여주는 문장이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>도치 구문에서 부정어 not은 \u003cb class=\"key\">had 바로 뒤가 아니라 주어 뒤\u003c/b>에 위치해요.\u003c/div>","segs":[{"n":5,"text":"두 번째 개념은 조금 특별한 형태예요. 문장 맨 앞에 if를 쓰지 않는 대신에 해브를 주어 앞으로 보내서 도치시킬 수 있답니다. 해석은 if가 있을 때와 똑같이 해주시면 돼요.","hl":"rule"},{"n":6,"text":"예문을 함께 소리 내어 읽어 볼까요. Had she known the truth, she would have helped him. 그녀가 진실을 알았다면 그를 도왔을 것이다 라는 뜻이에요. 맨 앞에 해브로 시작한다고 해서 의문문으로 착각하시면 안 돼요.","hl":"ex-0"},{"n":7,"text":"이번에는 if절이 뒤에 있는 문장을 볼게요. She would have gotten lost had she not used GPS. 그녀가 지피에스를 쓰지 않았다면 길을 잃었을 것이다 라는 뜻이에요. 주절이 앞에 오고 뒤에 해브로 시작하는 도치절이 올 수도 있다는 점 기억해 주세요.","hl":"ex-1"},{"n":8,"text":"헤드가 앞으로 나갔다고 해서 낫을 무작정 같이 앞으로 보내면 안 돼요. 낫은 항상 주어 바로 뒤에 쓴다는 것을 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">혼합 가정법\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거의 일이 현재에 미치는 영향을 나타낼 때는 \u003cb class=\"key\">혼합 가정법\u003c/b>을 써요. \u003cb class=\"key\">If + had p.p. ~, S + would + 동사원형\u003c/b> 형태로, \u003cb class=\"key\">now\u003c/b> 같은 현재 시점 단서가 자주 쓰여요.\u003cdiv>\u003cspan class=\"g-formula\">If + S + had p.p. ~, S + would + 동사원형 ~ (now)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If he had saved money, he would be rich now.\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">그가 저축을 했다면 지금 부자일 텐데.\u003c/div>\u003cdiv class=\"g-note\">과거에 저축을 하지 않은 일이 현재 부자가 아니라는 상태로 이어지는 혼합 가정법 예문이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>시간의 힌트가 되는 \u003cb class=\"key\">now\u003c/b> 같은 부사가 있는지 문장 끝을 잘 살펴보세요.\u003c/div>","segs":[{"n":9,"text":"세 번째는 아주 중요한 혼합 가정법이에요. 과거에 일어난 일이 현재까지 영향을 미칠 때 쓰는데요, if절은 과거완료를 쓰고 주절에는 조동사 과거형 뒤에 동사원형을 쓴답니다. 문장 끝에 나우 같은 현재를 나타내는 부사가 자주 힌트로 나와요.","hl":"rule"},{"n":10,"text":"예문을 들어 볼까요. If he had saved money, he would be rich now. 그가 저축을 했다면 지금 부자일 텐데 라는 뜻이에요. 앞쪽은 해드 피피로 과거를 가정하고 뒤쪽은 우드 뒤에 동사원형을 써서 현재의 상태를 말하고 있어요.","hl":"ex-0"},{"n":11,"text":"혼합 가정법인지 아닌지 구별하고 싶을 때는 문장 끝에 있는 시간 부사를 찾는 게 가장 빠른 방법이에요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">if it had not been for 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">(구체적 대상)이 없었다면\u003c/b>이라는 의미로 \u003cb class=\"key\">Had it not been for ~\u003c/b> 또는 \u003cb class=\"key\">If it had not been for ~\u003c/b>를 써요. 이는 \u003cb class=\"key\">without\u003c/b>이나 \u003cb class=\"key\">but for\u003c/b>와 바꿔 쓸 수 있어요.\u003cdiv>\u003cspan class=\"g-formula\">Had it not been for ~ / If it had not been for ~ = Without ~ = But for ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Had it not been for your advice, I would have failed.\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">네 조언이 없었다면 나는 실패했을 것이다.\u003c/div>\u003cdiv class=\"g-note\">if가 생략되고 도치된 형태의 'what if' 대신 쓰인 'Had it not been for' 구문이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>if를 살려서 \u003cb class=\"key\">If it had not been for\u003c/b>로 쓸 수도 있고 도치해서 \u003cb class=\"key\">Had it not been for\u003c/b>로 쓸 수도 있어요.\u003c/div>","segs":[{"n":12,"text":"네 번째 개념은 무엇무엇이 없었다면 이라는 뜻을 가진 아주 유용한 표현이에요. 해드 잇 낫 빈 포나 이프 잇 해드 낫 빈 포를 사용해서 나타내죠. 위드아웃이나 뱃 포와 완전히 같은 뜻이라서 서로 바꿔 쓸 수 있어요.","hl":"rule"},{"n":13,"text":"예문으로 확인해 볼게요. Had it not been for your advice, I would have failed. 네 조언이 없었다면 나는 실패했을 것이다 라는 뜻이에요. 이 문장은 위드아웃 유어 어드바이스나 뱃 포 유어 어드바이스로 바꿔 쓸 수 있답니다.","hl":"ex-0"},{"n":14,"text":"이 구문은 다양한 형태로 변형되어서 시험에 자주 출제돼요. 이프를 쓰는 형태와 해드로 도치하는 형태 모두 눈에 익혀 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If I had studied hard, I would pass the exam.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ If I had studied hard, I would have passed the exam.\u003c/div>\u003cdiv class=\"g-why\">if절이 과거완료(had p.p.)이므로 주절에도 단순 과거가 아니라 would have p.p.를 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If had I known the truth, I would have helped him.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Had I known the truth, I would have helped him.\u003c/div>\u003cdiv class=\"g-why\">if를 생략하고 도치할 때는 if를 지우고 주어와 동사 위치를 바꾸어야 하므로 if와 had를 동시에 쓰면 틀려요.\u003c/div>\u003c/div>","segs":[{"n":15,"text":"학생들이 가장 많이 하는 실수를 짚어 볼게요. 첫 번째 절에 해드 스터디드가 왔다고 해서 주절에 그냥 패스를 쓰면 안 돼요. 가정법 과거완료 짝을 맞춰서 우드 해브 패스트를 써야 맞답니다.","hl":"mk-0"},{"n":16,"text":"두 번째 실수예요. 도치를 배운 후에 if를 지우는 걸 깜빡하고 이프 해드 아이 노운이라고 쓰는 친구들이 정말 많아요. 이프를 쓰면 도치할 수 없고 도치하려면 이프를 반드시 없애야 한다는 점 기억하세요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 말을 쓰시오.\u003c/div>\u003cdiv class=\"g-qs\">If I ____ left earlier, I would have caught the train.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">had\u003c/span>\u003cdiv class=\"g-exp\">주절이 would have caught이므로 if절에는 과거완료 시제인 had가 들어가야 해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"첫 번째 문제입니다. 빈칸에 들어갈 알맞은 말을 채워 넣는 문제예요. 문장을 잘 읽고 화면을 멈춘 뒤에 직접 풀어 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":6},{"n":19,"text":"정답은 해드예요. 주절에 우드 해브 컷이 있으므로 앞에는 가정법 과거완료 공식에 맞춰서 해드를 써야 완벽한 문장이 된답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 어법상 틀린 부분을 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"g-qs\">Had she known the truth, she will have helped him.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">would\u003c/span>\u003cdiv class=\"g-exp\">had she known으로 시작하는 가정법 과거완료 구문의 주절에는 will have가 아니라 would have가 와야 해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"두 번째 문제입니다. 주어진 문장에서 어법상 틀린 곳을 찾아 고치는 문제예요. 잠시 멈추고 어디가 틀렸는지 찾아보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 윌을 우드로 고치는 거예요. 도치된 가정법 과거완료 구문이므로 주절에는 조동사의 과거형인 우드와 해브 피피가 짝을 이뤄야 하기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안의 단어들을 바르게 배열하시오.\u003c/div>\u003cdiv class=\"g-qs\">If he had saved money, he (rich, be, would, now) ______.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">would be rich now\u003c/span>\u003cdiv class=\"g-exp\">과거의 일이 현재에 영향을 미치는 혼합 가정법이므로 'would + 동사원형 + now' 순서로 배열해야 해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"세 번째 문제입니다. 괄호 안에 흩어져 있는 단어들을 혼합 가정법 규칙에 맞게 순서대로 배열해 보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":6},{"n":25,"text":"정답은 우드 비 리치 나우예요. 문장 끝에 나우라는 현재 힌트가 있으므로 주절에는 조동사 과거형 뒤에 동사원형을 쓰는 혼합 가정법 형태로 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 밑줄 친 부분과 바꿔 쓸 수 없는 표현을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">Had it not been for your advice, I would have failed.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>If it had not been for your advice\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Without your advice\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>But for your advice\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>④\u003c/b>With your advice\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">With your advice\u003c/span>\u003cdiv class=\"g-exp\">~이 없었다면 이라는 의미의 구문은 if it had not been for, without, but for이며 with는 '~가 있다면'이라는 뜻이므로 바꿔 쓸 수 없어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"네 번째 객관식 문제입니다. 밑줄 친 구문과 바꿔 쓸 수 없는 것을 네 가지 보기 중에서 골라 보세요.","hl":"q"},{"n":27,"text":"","hl":"q","pause":6},{"n":28,"text":"정답은 네 번째 보기인 위드 유어 어드바이스예요. 위드 아웃이나 뱃 포는 무엇이 없었다면 이라는 뜻이지만 위드는 무엇이 있다면 이라는 뜻이라 의미가 반대가 되거든요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 한국어 뜻에 맞게 영어 문장을 완성하시오.\u003c/div>\u003cdiv class=\"g-qs\">그녀가 GPS를 쓰지 않았다면 길을 잃었을 것이다. (if를 생략하고 도치할 것)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">She would have gotten lost had she not used GPS.\u003c/span>\u003cdiv class=\"g-exp\">if를 생략하고 도치하는 가정법 과거완료 구문으로 주절을 앞에 쓰고 had she not used GPS를 뒤에 이어야 해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":29,"text":"다섯 번째 영작 문제입니다. 제시된 한국어 뜻을 보고 이프를 생략하는 도치 구문을 이용해 영어 문장으로 완성해 보세요.","hl":"q"},{"n":30,"text":"","hl":"q","pause":6},{"n":31,"text":"정답은 She would have gotten lost had she not used GPS예요. 주절을 먼저 쓰고 뒤에 Had she not used GPS로 도치된 조건절을 연결해 주면 된답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 어법상 가장 알맞은 문장을 고르시오.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>If I had left earlier, I would catch the train.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Had known she the truth, she would have helped him.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>If he had saved money, he would be rich now.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Had it not been your advice, I would have failed.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">If he had saved money, he would be rich now.\u003c/span>\u003cdiv class=\"g-exp\">첫 번째는 주절 시제가 틀렸고, 두 번째는 도치 시 주어가 동사 앞으로 가야 하므로 틀렸으며, 네 번째는 for가 빠져서 틀렸어요. 세 번째 혼합 가정법 문장이 올바릅니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":32,"text":"마지막 여섯 번째 객관식 문제입니다. 네 개의 보기 중에서 문법적으로 완벽하게 맞는 문장을 골라 보세요.","hl":"q"},{"n":33,"text":"","hl":"q","pause":6},{"n":34,"text":"정답은 세 번째 보기예요. 이프 히 해드 세이프드 머니, 히 우드 비 리치 나우는 과거완료와 현재의 동사원형이 바르게 쓰인 혼합 가정법 문장이랍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 9 Unit 42\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>과거 사실의 반대를 가정할 때는 \u003cb class=\"key\">If + S + had p.p. ~, S + would/could/might have p.p.\u003c/b> 구문을 써요.\u003c/li>\u003cli>if가 생략되면 \u003cb class=\"key\">had\u003c/b>가 주어 앞으로 도치되어 \u003cb class=\"key\">Had + S + p.p.\u003c/b> 형태가 돼요.\u003c/li>\u003cli>과거의 일이 현재에 미치는 영향을 나타낼 때는 \u003cb class=\"key\">now\u003c/b> 같은 단서와 함께 \u003cb class=\"key\">혼합 가정법\u003c/b>을 사용해요.\u003c/li>\u003cli>~이 없었다면 이라는 의미는 \u003cb class=\"key\">Had it not been for\u003c/b>와 \u003cb class=\"key\">without\u003c/b> 및 \u003cb class=\"key\">but for\u003c/b>로 표현해요.\u003c/li>\u003c/ul>","segs":[{"n":35,"text":"오늘 우리는 챕터 구 유닛 사십이를 통해 가정법 과거완료의 기본 공식부터 도치와 혼합 가정법까지 아주 중요한 내용들을 함께 공부했어요. 오늘 배운 공식들과 팁들을 반복해서 복습하면서 내 것으로 만들어 봐요. 오늘 강의는 여기서 마칠게요. 수고하셨어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
