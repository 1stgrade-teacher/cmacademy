  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"unit41","title":"가정법, 구조만 잡으면 끝! 마블레드 구문 분석","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마블레드\u003c/div>\u003ch1>가정법, 구조만 잡으면 끝! 마블레드 구문 분석\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>가정법 과거와 가정법 미래, 그리고 if 생략 도치 표현을 익혀 실제 문장에서 정확히 해석하고 바꿔 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마블레드 유닛의 가정법 표현들을 함께 분석해 볼 거예요. 가정법은 조건을 상상하는 문장이라서 처음에는 어렵게 느껴질 수 있지만, 구조만 익히면 해석이 아주 쉬워집니다. 오늘 배운 표현을 실제 독해와 작문에 바로 써먹을 수 있도록 하나씩 짚어 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">가정법 과거는 \u003cb class=\"key\">If + 주어 + 과거동사, 주어 + would + 동사원형\u003c/b>으로 현재 사실의 반대를 가정합니다. 가정법 미래는 \u003cb class=\"key\">If + 주어 + should/were to + 동사원형\u003c/b>으로 미래의 불확실한 상황을 가정합니다. if를 생략하면 \u003cb class=\"key\">Should + 주어 + 동사원형\u003c/b>이나 \u003cb class=\"key\">Were + 주어 + to + 동사원형\u003c/b>으로 도치되고, \u003cb class=\"key\">were it not for\u003c/b>는 '~이 없다면'을 뜻합니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">If people knew how hard I had to work to gain my mastery, it would not seem\u003c/span> so wonderful at all.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">If thunder should occur, it would be better\u003c/span> to find a shelter as soon as possible and avoid dangerous places.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 I heard a young boy on television say, &quot;\u003cspan class=\"fx\">If I were President, I'd give\u003c/span> everybody enough money to buy whatever they want.&quot;\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 \u003cspan class=\"fx\">If an asteroid with a diameter of 30 km were to collide with the Earth, it would probably\u003c/span> bring an end to human civilization.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">Should you meet\u003c/span> a jaguar in the jungle, just turn slowly, walk away, and never look back.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">If young people understood how doing well in school makes the rest of their life so much interesting, they would be more motivated.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 Many species of animals could not survive \u003cspan class=\"fx\">were it not for the strong maternal instinct to protect the young\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">If the universe were to rewind back to the beginning and the laws of nature were the same, would everything happen\u003c/span> in the exact same way?\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">Should you find our service useful\u003c/span>, further information can be obtained by contacting our office.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 When Stephen Douglas, Abraham Lincoln's opponent in the presidential election, accused Lincoln of being two-faced during a debate, Lincoln self-deprecatingly responded like this. &quot;Honestly, \u003cspan class=\"fx\">if I were two-faced, would I be wearing\u003c/span> this one?&quot;\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Delicious autumn! My very soul is wedded to it, and \u003cspan class=\"fx\">if I were a bird I would fly\u003c/span> about the earth seeking the successive autumns.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">If a man were to come back from the past\u003c/span> and watch the modern world, he would note any number of things that would intoxicate him with wonder and delight.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"가정법 과거는 현재 사실의 반대를 상상할 때 써요. If절에는 과거동사가 오고 주절에는 would와 동사원형이 온다는 점을 먼저 기억하세요. 가정법 미래는 should나 were to를 써서 미래의 불확실한 상황을 가정하고, if를 생략하면 Should나 Were가 문장 앞으로 나옵니다. were it not for는 if it were not for에서 if를 생략한 도치 표현이에요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">If people knew how hard I had to work to gain my mastery, it would not seem\u003c/span> so wonderful at all.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If people knew\u003c/div>\u003cdiv class=\"k\">만약 사람들이 안다면\u003c/div>\u003cdiv class=\"e\">how hard I had to work\u003c/div>\u003cdiv class=\"k\">내가 얼마나 열심히 일해야 했는지\u003c/div>\u003cdiv class=\"e\">to gain my mastery,\u003c/div>\u003cdiv class=\"k\">나의 숙련된 솜씨를 얻기 위해\u003c/div>\u003cdiv class=\"e\">it would not seem so wonderful at all.\u003c/div>\u003cdiv class=\"k\">그것은 전혀 그렇게 놀랍게 보이지 않을 텐데.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + 과거동사\u003c/b>로 현재 사실의 반대를 가정하는 \u003cb class=\"key\">가정법 과거\u003c/b>입니다. 주절은 \u003cb class=\"key\">would + 동사원형\u003c/b>으로 받아 '~라면 ...할 텐데'로 해석합니다.\u003c/div>","segs":[{"n":3,"text":"If people knew, 만약 사람들이 안다면. how hard I had to work, 내가 얼마나 열심히 일해야 했는지. to gain my mastery, 나의 숙련된 솜씨를 얻기 위해. it would not seem so wonderful at all, 그것은 전혀 그렇게 놀랍게 보이지 않을 텐데.","hl":"ch"},{"n":4,"text":"첫 번째 문장은 가정법 과거예요. If절에는 과거동사 knew가 오고 주절에는 would not seem이 와서 현재 사실의 반대를 가정하죠. 사람들이 지금 모르기 때문에 만약 안다면이라는 상상을 하는 구조예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">If people knew how hard I had to work to gain my mastery, it would not seem\u003c/span> so wonderful at all.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사람들이 에디슨의 노력을 알면 천재성은 그렇게 신비롭게 보이지 않는다는 뜻이에요. 결국 위대한 성취 뒤에는 보이지 않는 엄청난 노력이 있다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">If people knew\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Were people to know\u003c/span>\u003cdiv class=\"w\">if를 생략하고 were를 앞으로 보낸 도치 표현으로, 같은 가정법 과거의 뜻을 더 격식 있게 전합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">would not seem so wonderful at all\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">would seem far less wonderful\u003c/span>\u003cdiv class=\"w\">부정형을 비교급으로 바꿔 '훨씬 덜 놀랍게 보일 것'이라는 뜻을 자연스럽게 살립니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">gain my mastery\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">achieve mastery\u003c/span>\u003cspan class=\"y-eq\">gain = achieve\u003c/span>\u003cdiv class=\"w\">숙련을 얻는다는 뜻을 achieve로 바꿔 더 격식 있게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at all\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in the least\u003c/span>\u003cspan class=\"y-eq\">at all = in the least\u003c/span>\u003cdiv class=\"w\">부정문에서 '전혀'라는 강조를 같은 뜻의 격식 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">how hard I had to work\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the extent of my effort\u003c/span>\u003cspan class=\"y-eq\">how hard I had to work = the extent of my effort\u003c/span>\u003cdiv class=\"w\">의문사절을 명사구로 바꿔 노력의 정도를 가리킵니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If people were aware of the tremendous effort I needed to achieve mastery, it would appear far less remarkable.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 말은 천재성 뒤에 숨은 엄청난 노력을 강조해요. 사람들이 그 노력을 알면 결과가 그렇게 신비롭게만 보이지 않을 거라는 뜻이죠. 노력 없는 천재는 없다는 메시지예요.","hl":"mn"},{"n":6,"text":"If people knew를 Were people to know로 바꾸면 if를 생략한 도치가 되어 더 격식 있게 들려요. would not seem so wonderful at all은 would seem far less wonderful로 바꿔 훨씬 덜 놀랍게 보일 것이라는 뜻을 살릴 수 있어요.","hl":"rw"},{"n":7,"text":"gain my mastery는 achieve mastery로 바꿔 숙련을 얻는다는 뜻을 격식 있게 표현할 수 있어요. at all은 in the least로 바꿔 전혀라는 강조를 살리고, how hard I had to work는 the extent of my effort로 명사구처럼 바꿀 수 있죠.","hl":"ph"},{"n":8,"text":"전체를 바꾸면 If people were aware of the tremendous effort I needed to achieve mastery, it would appear far less remarkable가 돼요. 뜻은 같지만 aware of와 tremendous effort로 조금 더 격식 있는 표현이 되었어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">If thunder should occur, it would be better\u003c/span> to find a shelter as soon as possible and avoid dangerous places.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If thunder should occur,\u003c/div>\u003cdiv class=\"k\">혹시라도 천둥이 친다면\u003c/div>\u003cdiv class=\"e\">it would be better\u003c/div>\u003cdiv class=\"k\">그것이 더 나을 것이다\u003c/div>\u003cdiv class=\"e\">to find a shelter\u003c/div>\u003cdiv class=\"k\">대피소를 찾는 것이\u003c/div>\u003cdiv class=\"e\">as soon as possible\u003c/div>\u003cdiv class=\"k\">가능한 한 빨리\u003c/div>\u003cdiv class=\"e\">and avoid dangerous places.\u003c/div>\u003cdiv class=\"k\">그리고 위험한 장소를 피하는 것이\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + should + 동사원형\u003c/b>은 '혹시라도 ~한다면'이라는 \u003cb class=\"key\">가정법 미래\u003c/b> 표현입니다. 주절에는 \u003cb class=\"key\">would + 동사원형\u003c/b>이 와서 '~하는 것이 나을 것이다'로 해석합니다.\u003c/div>","segs":[{"n":9,"text":"If thunder should occur, 혹시라도 천둥이 친다면. it would be better, 그것이 더 나을 것이다. to find a shelter, 대피소를 찾는 것이. as soon as possible, 가능한 한 빨리. and avoid dangerous places, 그리고 위험한 장소를 피하는 것이","hl":"ch"},{"n":10,"text":"두 번째 문장은 가정법 미래예요. If절에 should와 동사원형 occur가 와서 혹시라도 천둥이 친다면이라는 뜻을 만들어요. 주절의 it would be better to는 그렇게 하는 것이 더 낫다는 조언으로 이어지죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 \u003cspan class=\"fx\">If thunder should occur, it would be better\u003c/span> to find a shelter as soon as possible and avoid dangerous places.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>천둥이 칠 가능성은 낮지만, 혹시 그런 일이 생기면 즉시 안전한 곳으로 피하라는 뜻이에요. 미래의 불확실한 상황에 대비하라는 조언입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">If thunder should occur\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Should thunder occur\u003c/span>\u003cdiv class=\"w\">if를 생략하고 Should를 문장 앞으로 보낸 도치로, 같은 뜻을 더 격식 있게 전합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as soon as possible\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at the earliest opportunity\u003c/span>\u003cdiv class=\"w\">'가능한 한 빨리'를 같은 뜻의 격식 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">occur\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">take place\u003c/span>\u003cspan class=\"y-eq\">occur = take place\u003c/span>\u003cdiv class=\"w\">일어나다라는 뜻을 같은 의미의 구동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">find a shelter\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">seek shelter\u003c/span>\u003cspan class=\"y-eq\">find a shelter = seek shelter\u003c/span>\u003cdiv class=\"w\">대피소를 찾는다는 뜻을 더 간결한 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">avoid\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stay away from\u003c/span>\u003cspan class=\"y-eq\">avoid = stay away from\u003c/span>\u003cdiv class=\"w\">피하다라는 동사를 같은 뜻의 구동사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Should thunder happen, you had better locate shelter promptly and stay away from hazardous areas.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"천둥이 칠 가능성은 낮지만, 혹시 그런 일이 생기면 즉시 안전한 곳으로 피하라는 뜻이에요. 미래의 불확실한 상황에 대비하라는 조언입니다.","hl":"mn"},{"n":12,"text":"If thunder should occur는 Should thunder occur로 바꿀 수 있어요. if를 생략하고 Should를 앞으로 보내면 더 격식 있는 도치 문장이 됩니다. as soon as possible은 at the earliest opportunity로 바꿔 같은 뜻을 격식 있게 표현할 수 있어요.","hl":"rw"},{"n":13,"text":"occur는 take place로, find a shelter는 seek shelter로 바꿀 수 있어요. avoid는 stay away from으로 바꿔 위험한 곳에서 떨어져 있으라는 느낌을 살릴 수 있습니다.","hl":"ph"},{"n":14,"text":"전체 문장은 Should thunder happen, you had better locate shelter promptly and stay away from hazardous areas로 바꿀 수 있어요. had better와 promptly를 써서 조언의 느낌을 살렸습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 I heard a young boy on television say, &quot;\u003cspan class=\"fx\">If I were President, I'd give\u003c/span> everybody enough money to buy whatever they want.&quot;\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I heard a young boy on television say,\u003c/div>\u003cdiv class=\"k\">나는 텔레비전에서 어린 남자아이가 말하는 것을 들었다,\u003c/div>\u003cdiv class=\"e\">&quot;If I were President,\u003c/div>\u003cdiv class=\"k\">만약 내가 대통령이라면\u003c/div>\u003cdiv class=\"e\">I'd give everybody enough money\u003c/div>\u003cdiv class=\"k\">나는 모든 사람에게 충분한 돈을 줄 것이다\u003c/div>\u003cdiv class=\"e\">to buy whatever they want.&quot;\u003c/div>\u003cdiv class=\"k\">그들이 원하는 무엇이든 사기에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>인용문 안에 \u003cb class=\"key\">If + 주어 + were\u003c/b>가 쓰인 \u003cb class=\"key\">가정법 과거\u003c/b>입니다. I'd는 I would의 축약형으로, 주절에서 \u003cb class=\"key\">would + 동사원형\u003c/b>을 이룹니다.\u003c/div>","segs":[{"n":15,"text":"I heard a young boy on television say, 나는 텔레비전에서 어린 남자아이가 말하는 것을 들었다. \"If I were President, 만약 내가 대통령이라면. I'd give everybody enough money, 나는 모든 사람에게 충분한 돈을 줄 것이다. to buy whatever they want.\", 그들이 원하는 무엇이든 사기에","hl":"ch"},{"n":16,"text":"세 번째 문장은 인용문 안에 가정법 과거가 들어 있어요. If I were President에서 were를 써서 현재 사실의 반대를 가정하고, I'd give는 I would give의 축약형이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 I heard a young boy on television say, &quot;\u003cspan class=\"fx\">If I were President, I'd give\u003c/span> everybody enough money to buy whatever they want.&quot;\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>어린아이가 대통령이 된다면 모든 사람에게 원하는 것을 살 돈을 주겠다고 말한 거예요. 현실과 다른 상상을 통해 순수한 바람을 표현합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">If I were President\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Were I President\u003c/span>\u003cdiv class=\"w\">if를 생략하고 were를 앞으로 보낸 도치로, 같은 가정법 과거를 더 격식 있게 표현합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whatever they want\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">anything they want\u003c/span>\u003cdiv class=\"w\">whatever는 '무엇이든'이라는 뜻으로, anything과 의미가 거의 같습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">say\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">remark\u003c/span>\u003cspan class=\"y-eq\">say = remark\u003c/span>\u003cdiv class=\"w\">말하다라는 뜻을 더 격식 있는 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">enough money\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">sufficient money\u003c/span>\u003cspan class=\"y-eq\">enough = sufficient\u003c/span>\u003cdiv class=\"w\">충분한이라는 뜻을 격식 있는 형용사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whatever they want\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">anything they desire\u003c/span>\u003cspan class=\"y-eq\">want = desire\u003c/span>\u003cdiv class=\"w\">원하다라는 뜻을 더 격식 있는 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">On television, I heard a boy remark, 'Were I the President, I would give everyone sufficient funds to purchase anything they desire.'\u003c/div>\u003c/div>","segs":[{"n":17,"text":"어린아이가 대통령이 된다면 모든 사람에게 원하는 것을 살 돈을 주겠다고 말한 거예요. 현실과 다른 상상을 통해 순수한 바람을 표현합니다.","hl":"mn"},{"n":18,"text":"If I were President는 Were I President로 바꿀 수 있어요. if를 생략하고 were를 앞으로 보내면 더 격식 있는 도치 문장이 됩니다. whatever they want는 anything they want로 바꿔도 뜻은 거의 같아요.","hl":"rw"},{"n":19,"text":"say는 remark로, enough money는 sufficient money로 바꿔 더 격식 있게 표현할 수 있어요. whatever they want는 anything they desire로 바꿔 원하는 것을 뜻하는 표현을 살릴 수 있습니다.","hl":"ph"},{"n":20,"text":"전체를 바꾸면 On television, I heard a boy remark, Were I the President, I would give everyone sufficient funds to purchase anything they desire가 돼요. 인용문 안의 가정법 구조는 그대로 유지했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 \u003cspan class=\"fx\">If an asteroid with a diameter of 30 km were to collide with the Earth, it would probably\u003c/span> bring an end to human civilization.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If an asteroid\u003c/div>\u003cdiv class=\"k\">만약 소행성이\u003c/div>\u003cdiv class=\"e\">with a diameter of 30 km\u003c/div>\u003cdiv class=\"k\">직경 30km의\u003c/div>\u003cdiv class=\"e\">were to collide with the Earth,\u003c/div>\u003cdiv class=\"k\">지구와 충돌한다면\u003c/div>\u003cdiv class=\"e\">it would probably bring an end\u003c/div>\u003cdiv class=\"k\">그것은 아마 종말을 초래할 것이다\u003c/div>\u003cdiv class=\"e\">to human civilization.\u003c/div>\u003cdiv class=\"k\">인간 문명에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + were to + 동사원형\u003c/b>은 실현 가능성이 희박한 미래 상황을 가정하는 \u003cb class=\"key\">가정법 미래\u003c/b>입니다. 주절에는 \u003cb class=\"key\">would + 동사원형\u003c/b>이 와서 그 결과를 상상합니다.\u003c/div>","segs":[{"n":21,"text":"If an asteroid, 만약 소행성이. with a diameter of 30 km, 직경 30km의. were to collide with the Earth, 지구와 충돌한다면. it would probably bring an end, 그것은 아마 종말을 초래할 것이다. to human civilization, 인간 문명에","hl":"ch"},{"n":22,"text":"네 번째 문장은 were to를 쓴 가정법 미래예요. were to collide는 실제로 일어날 가능성이 희박한 미래의 상황을 가정하죠. 주절의 would probably bring은 그 결과를 상상해서 말하는 부분이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 \u003cspan class=\"fx\">If an asteroid with a diameter of 30 km were to collide with the Earth, it would probably\u003c/span> bring an end to human civilization.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>직경 30킬로미터의 거대한 소행성이 지구와 충돌한다면 인류 문명이 끝날 수도 있다는 뜻이에요. 실제로 일어날 가능성은 낮지만 그 결과가 얼마나 심각한지를 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">were to collide with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">should collide with\u003c/span>\u003cdiv class=\"w\">were to 대신 should를 써도 미래의 불확실한 가정을 나타낼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">bring an end to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">put an end to\u003c/span>\u003cdiv class=\"w\">'~에 종말을 가져오다'라는 뜻을 같은 의미의 관용 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">collide with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">crash into\u003c/span>\u003cspan class=\"y-eq\">collide with = crash into\u003c/span>\u003cdiv class=\"w\">충돌하다라는 뜻을 더 구체적인 구동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">bring an end to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cause the end of\u003c/span>\u003cspan class=\"y-eq\">bring an end to = cause the end of\u003c/span>\u003cdiv class=\"w\">종말을 초래한다는 뜻을 풀어서 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">probably\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">likely\u003c/span>\u003cspan class=\"y-eq\">probably = likely\u003c/span>\u003cdiv class=\"w\">아마도라는 뜻을 같은 의미의 부사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Should an asteroid measuring 30 km across crash into the Earth, it would likely end human civilization.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"직경 삼십 킬로미터의 거대한 소행성이 지구와 충돌한다면 인류 문명이 끝날 수도 있다는 뜻이에요. 가능성은 낮지만 결과가 얼마나 심각한지를 강조하는 문장입니다.","hl":"mn"},{"n":24,"text":"were to collide with는 should collide with로 바꿔도 미래의 불확실한 가정을 나타낼 수 있어요. bring an end to는 put an end to로 바꿔 같은 뜻을 관용 표현으로 전할 수 있습니다.","hl":"rw"},{"n":25,"text":"collide with는 crash into로, bring an end to는 cause the end of로 바꿀 수 있어요. probably는 likely로 바꿔 아마도라는 뜻을 자연스럽게 살릴 수 있습니다.","hl":"ph"},{"n":26,"text":"전체 문장은 Should an asteroid measuring thirty kilometers across crash into the Earth, it would likely end human civilization으로 바꿀 수 있어요. Should를 문장 앞에 두어 가정의 느낌을 더했습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 \u003cspan class=\"fx\">Should you meet\u003c/span> a jaguar in the jungle, just turn slowly, walk away, and never look back.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Should you meet\u003c/div>\u003cdiv class=\"k\">만약 당신이 만난다면\u003c/div>\u003cdiv class=\"e\">a jaguar in the jungle,\u003c/div>\u003cdiv class=\"k\">정글에서 재규어를\u003c/div>\u003cdiv class=\"e\">just turn slowly,\u003c/div>\u003cdiv class=\"k\">그저 천천히 돌아서고\u003c/div>\u003cdiv class=\"e\">walk away,\u003c/div>\u003cdiv class=\"k\">걸어가고\u003c/div>\u003cdiv class=\"e\">and never look back.\u003c/div>\u003cdiv class=\"k\">그리고 결코 뒤돌아보지 마라.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Should + 주어 + 동사원형\u003c/b>은 if를 생략한 \u003cb class=\"key\">가정법 미래\u003c/b> 도치 표현으로 '만약 ~한다면'을 뜻합니다. 뒤에는 명령문이 이어져 조언을 전합니다.\u003c/div>","segs":[{"n":27,"text":"Should you meet, 만약 당신이 만난다면. a jaguar in the jungle, 정글에서 재규어를. just turn slowly, 그저 천천히 돌아서고. walk away, 걸어가고. and never look back, 그리고 결코 뒤돌아보지 마라.","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 Should가 문장 앞에 나온 도치 가정법이에요. Should you meet은 If you should meet과 같은 뜻으로, 만약 만난다면이라는 가정을 만듭니다. 뒤에는 turn, walk, look 같은 동사원형이 이어져 조언을 전해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 \u003cspan class=\"fx\">Should you meet\u003c/span> a jaguar in the jungle, just turn slowly, walk away, and never look back.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>정글에서 재규어를 만나면 천천히 돌아서서 걸어가고 절대 뒤돌아보지 말라는 뜻이에요. 재규어를 자극하지 말고 침착하게 빠져나가라는 조언입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Should you meet\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If you should meet\u003c/span>\u003cdiv class=\"w\">도치된 Should를 if절로 풀어 쓴 표현으로, 같은 가정의 뜻을 전합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">walk away\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">move away\u003c/span>\u003cdiv class=\"w\">걸어서 멀어지라는 뜻을 더 일반적인 구동사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">meet\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">encounter\u003c/span>\u003cspan class=\"y-eq\">meet = encounter\u003c/span>\u003cdiv class=\"w\">만나다라는 뜻을 더 격식 있는 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">walk away\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">back away\u003c/span>\u003cspan class=\"y-eq\">walk away = back away\u003c/span>\u003cdiv class=\"w\">뒤로 물러나며 멀어진다는 뉘앙스를 살린 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">never look back\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">do not turn around\u003c/span>\u003cspan class=\"y-eq\">never look back = do not turn around\u003c/span>\u003cdiv class=\"w\">뒤돌아보지 말라는 뜻을 풀어서 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If you happen to encounter a jaguar in the jungle, simply turn slowly, move away, and do not turn around.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"정글에서 재규어를 만나면 천천히 돌아서서 걸어가고 절대 뒤돌아보지 말라는 뜻이에요. 재규어를 자극하지 말고 침착하게 빠져나가라는 조언입니다.","hl":"mn"},{"n":30,"text":"Should you meet은 If you should meet으로 풀어 쓸 수 있어요. walk away는 move away로 바꿔 걸어서 멀어진다는 뜻을 더 일반적으로 표현할 수 있습니다.","hl":"rw"},{"n":31,"text":"meet은 encounter로 바꿔 더 격식 있게 말할 수 있어요. walk away는 back away로 바꿔 뒤로 물러나며 멀어진다는 느낌을 살리고, never look back은 do not turn around로 풀어 쓸 수 있습니다.","hl":"ph"},{"n":32,"text":"전체를 바꾸면 If you happen to encounter a jaguar in the jungle, simply turn slowly, move away, and do not turn around가 돼요. encounter와 do not turn around를 써서 같은 뜻을 조금 더 격식 있게 전했습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 \u003cspan class=\"fx\">If young people understood how doing well in school makes the rest of their life so much interesting, they would be more motivated.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If young people understood\u003c/div>\u003cdiv class=\"k\">만약 젊은이들이 이해한다면\u003c/div>\u003cdiv class=\"e\">how doing well in school\u003c/div>\u003cdiv class=\"k\">학교에서 잘하는 것이 어떻게\u003c/div>\u003cdiv class=\"e\">makes the rest of their life\u003c/div>\u003cdiv class=\"k\">그들의 여생을 만드는지를\u003c/div>\u003cdiv class=\"e\">so much interesting,\u003c/div>\u003cdiv class=\"k\">정말 흥미롭게\u003c/div>\u003cdiv class=\"e\">they would be more motivated.\u003c/div>\u003cdiv class=\"k\">그들은 더욱 동기부여가 될 텐데.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + 과거동사\u003c/b>로 현재 사실의 반대를 가정하는 \u003cb class=\"key\">가정법 과거\u003c/b>입니다. 주절의 \u003cb class=\"key\">would be more motivated\u003c/b>는 그 가정이 실현될 때의 결과를 나타냅니다.\u003c/div>","segs":[{"n":33,"text":"If young people understood, 만약 젊은이들이 이해한다면. how doing well in school, 학교에서 잘하는 것이 어떻게. makes the rest of their life, 그들의 여생을 만드는지를. so much interesting, 정말 흥미롭게. they would be more motivated, 그들은 더욱 동기부여가 될 텐데.","hl":"ch"},{"n":34,"text":"여섯 번째 문장은 가정법 과거예요. If절에 understood가 오고 주절에 would be가 와서 현재 사실의 반대를 가정하죠. how doing well in school은 학교에서 잘하는 일이 어떻게 작용하는지를 이끄는 의문사절이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 \u003cspan class=\"fx\">If young people understood how doing well in school makes the rest of their life so much interesting, they would be more motivated.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>젊은이들이 학교에서 잘하는 일이 여생을 얼마나 흥미롭게 만드는지 깨닫는다면 더 동기부여가 될 것이라는 뜻이에요. 즉 지금은 그 중요성을 충분히 이해하지 못한다는 아쉬움이 담겨 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">If young people understood\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Were young people to understand\u003c/span>\u003cdiv class=\"w\">if를 생략하고 were를 앞으로 보낸 도치로, 같은 가정법 과거를 더 격식 있게 표현합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so much interesting\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">far more interesting\u003c/span>\u003cdiv class=\"w\">원문의 어색한 so much를 비교급 far more로 바꿔 '훨씬 더 흥미롭게'라는 뜻을 자연스럽게 살립니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">doing well in school\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">academic success\u003c/span>\u003cspan class=\"y-eq\">doing well in school = academic success\u003c/span>\u003cdiv class=\"w\">학교에서 잘하는 것을 명사구로 바꿔 더 간결하게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the rest of their life\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the remainder of their lives\u003c/span>\u003cspan class=\"y-eq\">the rest of their life = the remainder of their lives\u003c/span>\u003cdiv class=\"w\">여생이라는 뜻을 같은 의미의 격식 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">motivated\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">driven\u003c/span>\u003cspan class=\"y-eq\">motivated = driven\u003c/span>\u003cdiv class=\"w\">동기부여가 된 상태를 더 강한 뉘앙스의 형용사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Were young people to grasp how academic success makes the remainder of their lives far more interesting, they would be more driven.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"젊은이들이 학교에서 잘하는 일이 여생을 얼마나 흥미롭게 만드는지 깨닫는다면 더 동기부여가 될 것이라는 뜻이에요. 지금은 그 중요성을 충분히 이해하지 못한다는 아쉬움이 담겨 있습니다.","hl":"mn"},{"n":36,"text":"If young people understood는 Were young people to understand로 바꿔 더 격식 있는 도치 표현을 만들 수 있어요. so much interesting은 far more interesting으로 바꾸면 훨씬 더 흥미롭게라는 뜻이 자연스러워집니다.","hl":"rw"},{"n":37,"text":"doing well in school은 academic success로 바꿔 명사구처럼 표현할 수 있어요. the rest of their life는 the remainder of their lives로, motivated는 driven으로 바꿔 같은 뜻을 더 강하게 전할 수 있습니다.","hl":"ph"},{"n":38,"text":"전체를 바꾸면 Were young people to grasp how academic success makes the remainder of their lives far more interesting, they would be more driven이 돼요. grasp와 driven을 써서 뜻을 유지하면서 표현을 다듬었습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"se ","hl":"rw"},{"n":43,"text":"species는 kinds로 바꿔 더 쉽게 표현할 수 있어요. maternal instinct는 motherly instinct로 바꿀 수 있고, protect the young은 guard their offspring으로 바꿔 같은 뜻을 더 구체적으로 전할 수 있습니다.","hl":"ph"},{"n":44,"text":"전체를 바꾸면 Many kinds of animals would not be able to survive without the powerful motherly instinct to guard their offspring가 돼요. without을 써서 were it not for와 같은 뜻을 풀어냈습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 \u003cspan class=\"fx\">If the universe were to rewind back to the beginning and the laws of nature were the same, would everything happen\u003c/span> in the exact same way?\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If the universe were to rewind back\u003c/div>\u003cdiv class=\"k\">만약 우주가 되돌아간다면\u003c/div>\u003cdiv class=\"e\">to the beginning\u003c/div>\u003cdiv class=\"k\">처음으로\u003c/div>\u003cdiv class=\"e\">and the laws of nature were the same,\u003c/div>\u003cdiv class=\"k\">그리고 자연의 법칙이 동일하다면\u003c/div>\u003cdiv class=\"e\">would everything happen\u003c/div>\u003cdiv class=\"k\">모든 것이 일어날까\u003c/div>\u003cdiv class=\"e\">in the exact same way?\u003c/div>\u003cdiv class=\"k\">정확히 같은 방식으로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + were to + 동사원형\u003c/b>으로 미래의 가설적 상황을 가정하는 \u003cb class=\"key\">가정법 미래\u003c/b>입니다. 주절은 \u003cb class=\"key\">would + 주어 + 동사원형\u003c/b>의 의문문 형태로 결과를 묻고 있습니다.\u003c/div>","segs":[{"n":45,"text":"If the universe were to rewind back, 만약 우주가 되돌아간다면. to the beginning, 처음으로. and the laws of nature were the same, 그리고 자연의 법칙이 동일하다면. would everything happen, 모든 것이 일어날까. in the exact same way?, 정확히 같은 방식으로","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 were to가 들어간 가정법 미래예요. If절에서 were to rewind와 were the same이 나란히 쓰여 두 가지 조건을 제시하죠. 주절은 would everything happen으로 시작하는 의문문이라 결과를 묻고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 \u003cspan class=\"fx\">If the universe were to rewind back to the beginning and the laws of nature were the same, would everything happen\u003c/span> in the exact same way?\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우주가 처음으로 되돌아가고 자연 법칙이 같다면 모든 일이 똑같이 반복될까라는 질문이에요. 결정론과 우연에 대한 철학적 궁금증을 담고 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">were to rewind back\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">should rewind\u003c/span>\u003cdiv class=\"w\">were to 대신 should를 써도 미래의 가설적 상황을 나타낼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in the exact same way\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in precisely the same manner\u003c/span>\u003cdiv class=\"w\">'정확히 같은 방식으로'를 같은 뜻의 격식 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rewind back to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">return to\u003c/span>\u003cspan class=\"y-eq\">rewind back to = return to\u003c/span>\u003cdiv class=\"w\">되돌아가다라는 뜻을 더 일반적인 동사구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the laws of nature\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">natural laws\u003c/span>\u003cspan class=\"y-eq\">the laws of nature = natural laws\u003c/span>\u003cdiv class=\"w\">자연의 법칙이라는 뜻을 같은 의미의 명사구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the exact same way\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003 \"ch\">\u003cdiv class=\"e\">When Stephen Douglas,\u003c/div>\u003cdiv class=\"k\">스티븐 더글러스가\u003c/div>\u003cdiv class=\"e\">Abraham Lincoln's opponent\u003c/div>\u003cdiv class=\"k\">에이브러햄 링컨의 경쟁자였던\u003c/div>\u003cdiv class=\"e\">in the presidential election,\u003c/div>\u003cdiv class=\"k\">대통령 선거에서\u003c/div>\u003cdiv class=\"e\">accused Lincoln of being two-faced\u003c/div>\u003cdiv class=\"k\">링컨을 위선적이라고 비난했을 때\u003c/div>\u003cdiv class=\"e\">during a debate,\u003c/div>\u003cdiv class=\"k\">토론 중에\u003c/div>\u003cdiv class=\"e\">Lincoln self-deprecatingly responded like this.\u003c/div>\u003cdiv class=\"k\">링컨은 자조적으로 이렇게 응답했다.\u003c/div>\u003cdiv class=\"e\">&quot;Honestly,\u003c/div>\u003cdiv class=\"k\">솔직히 말해서\u003c/div>\u003cdiv class=\"e\">if I were two-faced,\u003c/div>\u003cdiv class=\"k\">만약 내가 얼굴이 두 개라면\u003c/div>\u003cdiv class=\"e\">would I be wearing this one?&quot;\u003c/div>\u003cdiv class=\"k\">내가 이 얼굴을 하고 있겠는가?\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + were\u003c/b>로 현재 사실의 반대를 가정한 \u003cb class=\"key\">가정법 과거\u003c/b>이고, 주절은 \u003cb class=\"key\">would + 주어 + 동사원형\u003c/b>의 의문문입니다. 두 얼굴이라는 표현을 재치 있게 되받아치는 구조입니다.\u003c/div>","segs":[{"n":57,"text":"When Stephen Douglas, 스티븐 더글러스가. Abraham Lincoln's opponent, 에이브러햄 링컨의 경쟁자였던. in the presidential election, 대통령 선거에서. accused Lincoln of being two-faced, 링컨을 위선적이라고 비난했을 때. during a debate, 토론 중에. Lincoln self-deprecatingly responded like this, 링컨은 자조적으로 이렇게 응답했다.. \"Honestly, 솔직히 말해서. if I were two-faced, 만약 내가 얼굴이 두 개라면. would I be wearing this one?\", 내가 이 얼굴을 하고 있겠는가?","hl":"ch"},{"n":58,"text":"열 번째 문장은 인용문 안에 가정법 과거 의문문이 들어 있어요. if I were two-faced에서 were를 써서 현재 사실의 반대를 가정하고, would I be wearing으로 결과를 되묻습니다. 링컨의 재치 있는 반박을 담은 구조예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 When Stephen Douglas, Abraham Lincoln's opponent in the presidential election, accused Lincoln of being two-faced during a debate, Lincoln self-deprecatingly responded like this. &quot;Honestly, \u003cspan class=\"fx\">if I were two-faced, would I be wearing\u003c/span> this one?&quot;\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>링컨은 자신이 위선적이라는 비난에 대해, 정말 얼굴이 두 개라면 이런 얼굴을 하고 있겠냐고 되묻는 거예요. 자조적인 유머로 비난을 부드럽게 반박하는 표현입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">if I were two-faced\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">were I two-faced\u003c/span>\u003cdiv class=\"w\">if를 생략하고 were를 앞으로 보낸 도치로, 같은 가정법 과거를 더 격식 있게 표현합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Honestly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">To be frank\u003c/span>\u003cdiv class=\"w\">솔직히 말해서라는 뜻을 같은 의미의 격식 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">accused Lincoln of being two-faced\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">called Lincoln hypocritical\u003c/span>\u003cspan class=\"y-eq\">accused of being two-faced = called hypocritical\u003c/span>\u003cdiv class=\"w\">위선적이라고 비난했다는 뜻을 더 직접적인 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">responded\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">replied\u003c/span>\u003cspan class=\"y-eq\">responded = replied\u003c/span>\u003cdiv class=\"w\">응답했다는 뜻을 같은 의미의 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">self-deprecatingly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in a self-mocking way\u003c/span>\u003cspan class=\"y-eq\">self-deprecatingly = in a self-mocking way\u003c/span>\u003cdiv class=\"w\">자조적으로라는 부사를 같은 뜻의 구로 풀어 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">When Stephen Douglas, Lincoln's rival in the presidential election, called Lincoln hypocritical during a debate, Lincoln replied in a self-mocking way, 'To be frank, were I two-faced, would I be wearing this one?'\u003c/div>\u003c/div>","segs":[{"n":59,"text":"링컨은 자신이 위선적이라는 비난에 대해, 정말 얼굴이 두 개라면 이런 얼굴을 하고 있겠냐고 되묻는 거예요. 자조적인 유머로 비난을 부드럽게 반박하는 표현입니다.","hl":"mn"},{"n":60,"text":"if I were two-faced는 were I two-faced로 바꿔 더 격식 있는 도치 표현을 만들 수 있어요. Honestly는 To be frank로 바꿔 솔직히 말해서라는 뜻을 살릴 수 있습니다.","hl":"rw"},{"n":61,"text":"accused Lincoln of being two-faced는 called Lincoln hypocritical로 바꿀 수 있어요. responded는 replied로 바꾸고, self-deprecatingly는 in a self-mocking way로 풀어 표현할 수 있습니다.","hl":"ph"},{"n":62,"text":"전체를 바꾸면 When Stephen Douglas, Lincoln's rival in the presidential election, called Lincoln hypocritical during a debate, Lincoln replied in a self-mocking way, To be frank, were I two-faced, would I be wearing this one이 돼요. 같은 뜻을 유지하면서 도치와 격식 표현을 더했습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 Delicious autumn! My very soul is wedded to it, and \u003cspan class=\"fx\">if I were a bird I would fly\u003c/span> about the earth seeking the successive autumns.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Delicious autumn!\u003c/div>\u003cdiv class=\"k\">달콤한 가을!\u003c/div>\u003cdiv class=\"e\">My very soul\u003c/div>\u003cdiv class=\"k\">나의 영혼은 바로\u003c/div>\u003cdiv class=\"e\">is wedded to it,\u003c/div>\u003cdiv class=\"k\">가을과 결혼했다,\u003c/div>\u003cdiv class=\"e\">and if I were a bird\u003c/div>\u003cdiv class=\"k\">그리고 만약 내가 새라면\u003c/div>\u003cdiv class=\"e\">I would fly about the earth\u003c/div>\u003cdiv class=\"k\">나는 지구 여기저기를 날아다닐 텐데\u003c/div>\u003cdiv class=\"e\">seeking the successive autumns.\u003c/div>\u003cdiv class=\"k\">이어지는 가을을 찾아서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + were\u003c/b>로 현재 사실의 반대를 가정하는 \u003cb class=\"key\">가정법 과거\u003c/b>이고, 주절은 \u003cb class=\"key\">would + 동사원형\u003c/b>으로 그 결과를 표현합니다. seeking은 현재분사로 날아다니는 상황을 부연합니다.\u003c/div>","segs":[{"n":63,"text":"Delicious autumn!, 달콤한 가을!. My very soul, 나의 영혼은 바로. is wedded to it, 가을과 결혼했다. and if I were a bird, 그리고 만약 내가 새라면. I would fly about the earth, 나는 지구 여기저기를 날아다닐 텐데. seeking the successive autumns, 이어지는 가을을 찾아서","hl":"ch"},{"n":64,"text":"열한 번째 문장은 if I were a bird가 들어간 가정법 과거예요. were를 써서 현재 사실의 반대를 가정하고, 주절의 would fly로 그 결과를 표현하죠. seeking은 날아다니면서 무엇을 하는지 덧붙여 주는 현재분사입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 Delicious autumn! My very soul is wedded to it, and \u003cspan class=\"fx\">if I were a bird I would fly\u003c/span> about the earth seeking the successive autumns.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>가을을 너무 사랑해서, 자신이 새라면 계속 이어지는 가을을 찾아 지구를 날아다니겠다는 뜻이에요. 가을에 대한 깊은 애정을 감각적으로 표현했습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">if I were a bird\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">were I a bird\u003c/span>\u003cdiv class=\"w\">if를 생략하고 were를 앞으로 보낸 도치로, 같은 가정법 과거를 더 격식 있게 표현합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fly about the earth\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">roam the skies\u003c/span>\u003cdiv class=\"w\">지구를 날아다닌다는 뜻을 더 시적인 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">wedded to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">devoted to\u003c/span>\u003cspan class=\"y-eq\">wedded to = devoted to\u003c/span>\u003cdiv class=\"w\">결혼한 상태라는 비유를 '깊이 헌신하는'이라는 뜻으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">successive\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">consecutive\u003c/span>\u003cspan class=\"y-eq\">successive = consecutive\u003c/span>\u003cdiv class=\"w\">연이은이라는 뜻을 같은 의미의 형용사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">seeking\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">searching for\u003c/span>\u003cspan class=\"y-eq\">seeking = searching for\u003c/span>\u003cdiv class=\"w\">찾아서라는 뜻을 같은 의미의 구로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Delicious autumn! My soul is devoted to it, and were I a bird, I would roam the skies in search of the consecutive autumns.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"가을을 너무 사랑해서, 자신이 새라면 계속 이어지는 가을을 찾아 지구를 날아다니겠다는 뜻이에요. 가을에 대한 깊은 애정을 감각적으로 표현했습니다.","hl":"mn"},{"n":66,"text":"if I were a bird는 were I a bird로 바꿔 더 격식 있는 도치 표현을 만들 수 있어요. fly about the earth는 roam the skies로 바꾸면 더 시적인 느낌이 살아납니다.","hl":"rw"},{"n":67,"text":"wedded to는 devoted to로 바꿔 깊이 헌신한다는 뜻을 전할 수 있어요. successive는 consecutive로, seeking은 searching for로 바꿔 같은 의미를 유지할 수 있습니다.","hl":"ph"},{"n":68,"text":"전체를 바꾸면 Delicious autumn! My soul is devoted to it, and were I a bird, I would roam the skies in search of the consecutive autumns가 돼요. devoted to와 roam the skies로 원문의 시적인 느낌을 살렸습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">If a man were to come back from the past\u003c/span> and watch the modern world, he would note any number of things that would intoxicate him with wonder and delight.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If a man were to come back\u003c/div>\u003cdiv class=\"k\">만약 어떤 남자가 돌아온다면\u003c/div>\u003cdiv class=\"e\">from the past\u003c/div>\u003cdiv class=\"k\">과거로부터\u003c/div>\u003cdiv class=\"e\">and watch the modern world,\u003c/div>\u003cdiv class=\"k\">그리고 현대 세계를 지켜본다면\u003c/div>\u003cdiv class=\"e\">he would note\u003c/div>\u003cdiv class=\"k\">그는 주목하게 될 것이다\u003c/div>\u003cdiv class=\"e\">any number of things\u003c/div>\u003cdiv class=\"k\">꽤 많은 것들을\u003c/div>\u003cdiv class=\"e\">that would intoxicate him\u003c/div>\u003cdiv class=\"k\">그를 열광하게 할\u003c/div>\u003cdiv class=\"e\">with wonder and delight.\u003c/div>\u003cdiv class=\"k\">경이로움과 환희로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If + 주어 + were to + 동사원형\u003c/b>으로 실현 가능성이 희박한 미래 상황을 가정하는 \u003cb class=\"key\">가정법 미래\u003c/b>입니다. 주절의 \u003cb class=\"key\">would note\u003c/b>와 관계절의 \u003cb class=\"key\">would intoxicate\u003c/b>가 그 결과를 이어 줍니다.\u003c/div>","segs":[{"n":69,"text":"If a man were to come back, 만약 어떤 남자가 돌아온다면. from the past, 과거로부터. and watch the modern world, 그리고 현대 세계를 지켜본다면. he would note, 그는 주목하게 될 것이다. any number of things, 꽤 많은 것들을. that would intoxicate him, 그를 열광하게 할. with wonder and delight, 경이로움과 환희로","hl":"ch"},{"n":70,"text":"열두 번째 문장은 were to가 들어간 가정법 미래예요. If a man were to come back에서 과거로부터 돌아온다는 가설적 상황을 만들고, 주절의 would note로 그 결과를 이어 줍니다. 뒤의 that would intoxicate는 그가 발견할 것들을 설명하는 관계절이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">If a man were to come back from the past\u003c/span> and watch the modern world, he would note any number of things that would intoxicate him with wonder and delight.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>과거의 사람이 현대로 돌아와 세상을 본다면 경이로움과 환희에 사로잡힐 만한 것들을 아주 많이 발견할 것이라는 뜻이에요. 현대 세계의 놀라움을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">were to come back\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">should return\u003c/span>\u003cdiv class=\"w\">were to 대신 should를 써도 미래의 가설적 상황을 나타낼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">any number of things\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">many things\u003c/span>\u003cdiv class=\"w\">'꽤 많은'이라는 뜻을 더 간단하고 명확한 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">come back from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">return from\u003c/span>\u003cspan class=\"y-eq\">come back from = return from\u003c/span>\u003cdiv class=\"w\">돌아오다라는 뜻을 같은 의미의 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">note\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">notice\u003c/span>\u003cspan class=\"y-eq\">note = notice\u003c/span>\u003cdiv class=\"w\">주목하다라는 뜻을 더 친숙한 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">intoxicate him with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fill him with\u003c/span>\u003cspan class=\"y-eq\">intoxicate him with = fill him with\u003c/span>\u003cdiv class=\"w\">열광하게 하다는 뜻을 같은 의미의 구로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Should a man return from the past and observe the modern world, he would notice many things that would fill him with wonder and delight.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"과거의 사람이 현대로 돌아와 세상을 본다면 경이로움과 환희에 사로잡힐 만한 것들을 아주 많이 발견할 것이라는 뜻이에요. 현대 세계의 놀라움을 강조합니다.","hl":"mn"},{"n":72,"text":"were to come back은 should return으로 바꿔도 미래의 가설적 상황을 나타낼 수 있어요. any number of things는 many things로 바꿔 더 간단하고 명확하게 표현할 수 있습니다.","hl":"rw"},{"n":73,"text":"come back from은 return from으로 바꿀 수 있어요. note는 notice로, intoxicate him with는 fill him with로 바꿔 같은 뜻을 더 익숙한 표현으로 전할 수 있습니다.","hl":"ph"},{"n":74,"text":"전체를 바꾸면 Should a man return from the past and observe the modern world, he would notice many things that would fill him with wonder and delight가 돼요. Should와 fill him with를 써서 같은 뜻을 자연스럽게 살렸습니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>가정법 과거는 \u003cb class=\"key\">If + 주어 + 과거동사, 주어 + would + 동사원형\u003c/b>으로 현재 사실의 반대를 가정한다.\u003c/li>\u003cli>가정법 미래는 \u003cb class=\"key\">If + 주어 + should/were to + 동사원형\u003c/b>으로 미래의 불확실한 상황을 가정한다.\u003c/li>\u003cli>if를 생략하면 \u003cb class=\"key\">Should + 주어 + 동사원형\u003c/b> 또는 \u003cb class=\"key\">Were + 주어 + to + 동사원형\u003c/b>으로 도치된다.\u003c/li>\u003cli>\u003cb class=\"key\">were it not for\u003c/b>는 '~이 없다면'이라는 뜻의 가정법 과거 도치 표현이다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 마블레드 유닛에서 가정법 과거와 가정법 미래를 함께 정리했어요. 가정법 과거는 현재 사실의 반대를, 가정법 미래는 미래의 불확실한 상황을 가정한다는 점을 기억하세요. if를 생략하면 Should나 Were가 문장 앞으로 나온다는 것도 꼭 챙겨 두시고요. 여러분의 문장 분석 실력이 한층 더 단단해졌기를 바랍니다. 수고했습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
