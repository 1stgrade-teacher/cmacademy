}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 41 if 가정법 과거 구문","title":"가장 확실하게 가정하기, If 가정법 과거와 도치 구문 마스터하기","audioDir":"preview_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 9 Unit 41 if 가정법 과거 구문\u003c/div>\u003ch1>가장 확실하게 가정하기, If 가정법 과거와 도치 구문 마스터하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>현재 사실 반대부터 실현 불가능한 가정, 그리고 if 생략 도치까지 확실하게 이해한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘 우리는 가정법 구문 중에서도 정말 자주 나오는 if 가정법 과거와 다양한 변형 구문들을 함께 공부해 볼 거예요. 가정법은 실제 사실과 반대되는 상황이나 앞으로 일어날 가능성이 낮은 일을 상상해서 말할 때 쓰는 아주 중요한 문법이랍니다. 오늘 선생님과 함께 핵심 공식부터 꼼꼼히 살펴보고 다양한 문제까지 완벽하게 정복해 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">가정법 과거와 실현 가능성이 낮은 미래 가정\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">현재 사실의 반대를 가정할 때는 \u003cb class=\"key\">If\u003c/b> 뒤에 주어와 동사의 \u003cb class=\"key\">과거형\u003c/b>을 쓰고, 주절에는 \u003cb class=\"key\">would, could, might\u003c/b>와 동사원형을 쓴다. if절의 be동사는 주어에 상관없이 were를 쓰는 것이 원칙이다. 또한 \u003cb class=\"key\">if the sun were to\u003c/b>처럼 쓰면 실현 가능성이 매우 낮거나 불가능한 미래를 가정하게 된다.\u003cdiv>\u003cspan class=\"g-formula\">If + S + 과거형 / were to + S + 동사원형 ~, S + would/could/might + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If I knew her number, I would call her.\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">내가 그녀의 번호를 안다면 전화할 텐데.\u003c/div>\u003cdiv class=\"g-note\">현재 사실의 반대를 가정하는 가장 기본적인 가정법 과거 문장이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If the sun were to disappear, life on Earth would end.\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">만약 태양이 사라진다면 지구의 생명은 끝날 것이다.\u003c/div>\u003cdiv class=\"g-note\">실현 가능성이 매우 낮거나 불가능한 미래를 가정하는 구문이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>if 가정법 과거에서 be동사는 주어가 I나 he처럼 단수여도 구어체가 아닐 때는 \u003cb class=\"key\">were\u003c/b>를 쓰는 것이 원칙이다.\u003c/div>","segs":[{"n":2,"text":"첫 번째로 현재 사실의 반대를 가정하는 가정법 과거를 살펴볼게요. If 뒤에 주어와 동사의 과거형을 쓰고 주절에 would, could, might와 동사원형을 쓰면 지금은 그렇지 않지만 만약 그렇다면 이럴 텐데라고 반대로 상상하는 말이 돼요. 여기서 if절의 be동사는 주어가 무엇이든 웬만하면 were를 쓴다는 점도 기억해 주세요. 그리고 실현 가능성이 아주 희박한 미래를 가정할 때는 if S were to 동사원형 구문을 쓴답니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. If I knew her number, I would call her.라고 했죠. 내가 그녀의 번호를 안다면 전화할 텐데라는 뜻으로 지금 번호를 몰라서 전화하지 못한다는 현재 사실의 반대를 나타내요.","hl":"ex-0"},{"n":4,"text":"다음 예문을 볼게요. If the sun were to disappear, life on Earth would end.라고 했어요. 만약 태양이 사라진다면 지구의 생명은 끝날 것이라는 뜻인데 태양이 사라질 일은 거의 없겠죠. 이렇게 실현 가능성이 없는 미래를 가정할 때 were to를 쓴답니다.","hl":"ex-1"},{"n":5,"text":"잠깐 팁을 주자면 if절의 주어가 I나 she 같은 단수 주어라도 가정법에서는 was 대신 were를 쓰는 것이 정석이라는 것을 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">혹시라도 ~라면을 뜻하는 should와 if 생략 도치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">If + S + should + 동사원형은 \u003cb class=\"key\">혹시라도\u003c/b> ~라면이라는 의미를 나타내며, 주절에 \u003cb class=\"key\">명령문이나 직설법\u003c/b>이 올 수 있다. 또한 \u003cb class=\"key\">if가 생략\u003c/b>되면 should가 주어 앞으로 도치되어 \u003cb class=\"key\">Should + S + 동사원형\u003c/b> 형태로 쓰인다.\u003cdiv>\u003cspan class=\"g-formula\">Should + S + 동사원형 ~, S + V ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If you should find my keys, please call me.\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">혹시라도 내 열쇠를 발견하면 전화해 주세요.\u003c/div>\u003cdiv class=\"g-note\">혹시라도 ~라면이라는 의미로 주절에 명령문이 온 형태이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Should you need help, just ask.\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">도움이 필요하면 그냥 말하세요.\u003c/div>\u003cdiv class=\"g-note\">if가 생략되면서 should가 주어 앞으로 도치된 문장이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>if가 생략된 도치 구문에서 동사의 원형을 쓰는 자리에 \u003cb class=\"key\">대동사나 일반동사\u003c/b>를 바로 쓰지 않도록 \u003cb class=\"key\">should\u003c/b>가 반드시 맨 앞에 오는지 확인해야 한다.\u003c/div>","segs":[{"n":6,"text":"두 번째로 혹시라도라는 뜻을 가진 should 가정법과 도치 구문을 알아볼게요. If you should처럼 쓰면 혹시라도 만에 하나 그런 일이 일어난다면이라는 의미가 되고 주절에는 평서문뿐만 아니라 명령문도 올 수 있어요. 이때 접속사 if를 생략하고 조동사 should를 주어 앞으로 보내면 Should you need help처럼 멋진 도치 구문이 완성돼요.","hl":"rule"},{"n":7,"text":"예문을 함께 읽어봐요. If you should find my keys, please call me.라고 했죠. 혹시라도 내 열쇠를 발견하면 전화해 달라는 뜻으로 주절에 please call me라는 명령문이 쓰였어요.","hl":"ex-0"},{"n":8,"text":"다음 예문도 보죠. Should you need help, just ask.라고 했어요. 원래는 If you should need help였는데 if가 생략되면서 should가 앞으로 튀어나온 도치 구문이랍니다.","hl":"ex-1"},{"n":9,"text":"여기서 주의할 점은 if를 지웠다고 해서 아무 단어나 앞으로 보내면 안 되고 반드시 should를 주어 앞으로 도치시켜야 한다는 거예요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">~이 없다면을 뜻하는 if it were not for 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">If it were not for\u003c/b> ~는 현재 ~이 없다면이라는 뜻으로, \u003cb class=\"key\">Were it not for\u003c/b>로 도치할 수 있으며 \u003cb class=\"key\">without이나 but for\u003c/b>와 바꿔 쓸 수 있다.\u003cdiv>\u003cspan class=\"g-formula\">If it were not for ~ = Were it not for ~ = Without ~ = But for ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Were it not for the map, we would be lost.\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">지도가 없다면 우리는 길을 잃을 것이다.\u003c/div>\u003cdiv class=\"g-note\">if가 생략되고 도치된 형태로 ~이 없다면이라는 의미를 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Without your help\u003c/span>, I could not finish this work.\u003c/div>\u003cdiv class=\"g-ko\">너의 도움이 없다면, 나는 이 일을 끝낼 수 없을 텐데.\u003c/div>\u003cdiv class=\"g-note\">if it were not for 구문을 전치사구인 without으로 간단히 나타낸 문장이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>이 구문은 과거 사실의 반대인 \u003cb class=\"key\">If it had not been for\u003c/b>와 헷갈리기 쉬우므로 주절의 조동사 뒤에 동사원형이 오는지 \u003cb class=\"key\">have p.p.\u003c/b>가 오는지 꼭 확인하자.\u003c/div>","segs":[{"n":10,"text":"세 번째로 정말 유용한 표현인 ~이 없다면라는 의미의 구문을 배워볼게요. If it were not for 다음에 명사가 오면 현재 ~이 없다면이라는 뜻이 돼요. 이 표현도 마찬가지로 if를 생략하고 Were it not for 형태로 바꿀 수 있고 간단하게 without이나 but for로 바꿔 쓸 수도 있답니다.","hl":"rule"},{"n":11,"text":"예문을 소리 내어 읽어봐요. Were it not for the map, we would be lost.라고 했죠. 지도가 없다면 우리는 길을 잃을 것이라는 뜻으로 without the map이나 If it were not for the map으로 바꿔 쓸 수 있어요.","hl":"ex-0"},{"n":12,"text":"보충 예문 하나 더 볼게요. Without your help, I could not finish this work.이라고 했어요. 너의 도움이 없다면 이 일을 끝낼 수 없을 텐데라는 뜻으로 without 대신 but for를 써도 똑같은 의미가 돼요.","hl":"ex-1"},{"n":13,"text":"시험에 정말 자주 나오는 팁인데 현재가 아니라 과거에 ~이 없었더라면 일 때는 had를 쓴다는 것을 기억하고 주절의 모양을 꼭 비교해 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If I was you, I would accept the offer.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ If I were you, I would accept the offer.\u003c/div>\u003cdiv class=\"g-why\">가정법 과거의 if절 안에서는 주어가 I라 하더라도 be동사는 was가 아니라 were를 쓰는 것이 원칙이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If you need help, just ask.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Should you need help, just ask.\u003c/div>\u003cdiv class=\"g-why\">도치 구문을 만들 때 if를 생략하면 주어 앞으로 should를 보내야 하는데 접속사만 지우고 도치하지 않으면 틀린다.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"학생들이 가장 많이 틀리는 첫 번째 문장이에요. If I was you라고 쓰면 안 되고 If I were you라고 써야 맞아요. 가정법에서는 I 뒤에도 was가 아니라 were를 쓴다는 걸 잊지 마세요.","hl":"mk-0"},{"n":15,"text":"두 번째로 자주 틀리는 부분이에요. if를 생략하고 도치할 때 그냥 주어 동사를 그대로 두면 안 되고 Should you need help처럼 should를 문장 맨 앞으로 꼭 도치시켜야 한답니다.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 가장 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">If I ____ her number, I would call her.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>know\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>knew\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>had known\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>would know\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">knew\u003c/span>\u003cdiv class=\"g-exp\">주절에 would call이라는 가정법 과거 시제가 쓰였으므로 if절에도 동사의 과거형인 knew가 와야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":16,"text":"첫 번째 문제입니다. 빈칸에 들어갈 가장 알맞은 말을 골라주세요. 화면의 문장을 보면서 직접 풀어보세요.","hl":"q"},{"n":17,"text":"","hl":"q","pause":6},{"n":18,"text":"정답은 두 번째 보기인 knew예요. 주절에 would call이라는 조동사의 과거형이 있으므로 if절에도 과거형인 knew가 와야 현재 사실의 반대를 나타내는 가정법 과거가 완성되죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 어법상 틀린 부분을 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"g-qs\">If the sun were to disappear, life on Earth will end.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">will end -&gt; would end\u003c/span>\u003cdiv class=\"g-exp\">if절에 were to가 쓰인 가정법 미래 구문이므로 주절의 조동사는 과거형인 would, could, might를 써야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"두 번째 문제입니다. 주어진 문장에서 어법상 틀린 부분을 찾아 바르게 고쳐보세요. 잠시
