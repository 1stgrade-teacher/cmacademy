    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 43 wish · as if 가정법 구문","title":"wish와 as if 가정법 제대로 정복하기","audioDir":"preview_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 9 Unit 43 wish · as if 가정법 구문\u003c/div>\u003ch1>wish와 as if 가정법 제대로 정복하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>wish와 as if 가정법의 시제에 따른 의미 차이를 정확히 이해하고 문장에 적용할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 가정법에서 정말 중요하고 시험에 자주 나오는 wish와 as if 구문을 함께 공부할 거예요. 현재 사실에 대한 아쉬움부터 과거에 대한 후회, 그리고 마치 ~인 것처럼 말하는 표현까지 아주 꼼꼼하게 정리해 줄게요. 끝까지 집중해서 선생님이랑 같이 완벽하게 자기 것으로 만들어 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">wish 가정법 (현재와 과거 사실에 대한 아쉬움)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주절의 시점과 같은 \u003cb class=\"key\">현재 사실\u003c/b>에 대한 아쉬움은 \u003cb class=\"key\">과거형\u003c/b>을 쓰고, 주절보다 앞선 \u003cb class=\"key\">과거 사실\u003c/b>에 대한 아쉬움은 \u003cb class=\"key\">had p.p.\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">S + wish + S + 과거형 / had p.p.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I wish I \u003cspan class=\"fx\">could swim\u003c/span> faster.\u003c/div>\u003cdiv class=\"g-ko\">내가 더 빨리 수영할 수 있다면 좋을 텐데.\u003c/div>\u003cdiv class=\"g-note\">현재 사실에 대한 아쉬움으로 동사의 과거형을 사용\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I wish I \u003cspan class=\"fx\">had studied\u003c/span> harder.\u003c/div>\u003cdiv class=\"g-ko\">내가 더 열심히 공부했다면 좋을 텐데.\u003c/div>\u003cdiv class=\"g-note\">과거 사실에 대한 아쉬움으로 had p.p.를 사용\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>wish 다음에 S + would나 could를 쓰면 \u003cb class=\"key\">미래\u003c/b>나 현재에 대한 \u003cb class=\"key\">바람\u003c/b>을 나타낼 수 있어요.\u003c/div>","segs":[{"n":2,"text":"첫 번째로 wish 가정법을 살펴볼게요. 주절의 시점과 같은 현재 사실에 아쉬움을 나타낼 때는 S + wish + S + 과거형을 써서 표현해요. 반대로 과거에 있었던 일에 대한 후회나 아쉬움을 나타낼 때는 S + wish + S + had p.p.를 쓴다는 것을 꼭 기억해 두세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 같이 볼게요. I wish I could swim faster라고 하면 내가 더 빨리 수영할 수 있다면 좋을 텐데라는 뜻이에요. 현재 수영을 빨리 할 수 없는 것에 대한 아쉬움을 could라는 과거형으로 나타내고 있어요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. I wish I had studied harder는 내가 더 열심히 공부했다면 좋을 텐데라는 뜻이죠. 과거에 열심히 공부하지 않았던 것을 후회할 때는 had studied처럼 had p.p.를 쓴답니다.","hl":"ex-1"},{"n":5,"text":"참고로 wish 뒤에 S + would나 could를 쓰면 미래나 현재에 대한 바람을 나타낼 수 있다는 것도 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">as if / as though 가정법 (마치 ~인 것처럼)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">as if 뒤에 \u003cb class=\"key\">과거형\u003c/b>을 쓰면 주절과 같은 시점의 \u003cb class=\"key\">사실과 반대\u003c/b>되는 상황을 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">as if + S + 과거형 = 마치 ~인 것처럼\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He talks as if he \u003cspan class=\"fx\">were\u003c/span> a doctor.\u003c/div>\u003cdiv class=\"g-ko\">그는 마치 의사인 것처럼 말한다.\u003c/div>\u003cdiv class=\"g-note\">주절의 동사 talks와 같은 시점이며 사실과 반대이므로 과거형 were 사용\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>가정법 과거에서 주어가 1인칭 단수나 3인칭 단수일 때도 \u003cb class=\"key\">was\u003c/b> 대신 \u003cb class=\"key\">were\u003c/b>를 주로 씁니다.\u003c/div>","segs":[{"n":6,"text":"두 번째로 as if와 as though 가정법을 살펴볼게요. 이 표현은 마치 ~인 것처럼이라는 뜻으로 주절의 시점과 반대되는 상황을 가정할 때 써요. as if 뒤에 과거형을 쓰면 주절과 같은 시점의 사실과 반대되는 상황을 나타낸답니다.","hl":"rule"},{"n":7,"text":"예문을 소리 내어 읽어 볼게요. He talks as if he were a doctor는 그는 마치 의사인 것처럼 말한다라는 뜻이에요. 실제로 의사는 아니지만 현재 그렇다는 뜻을 나타내기 위해 과거형 were를 썼어요.","hl":"ex-0"},{"n":8,"text":"여기서 중요한 팁 하나 알려줄게요. 가정법 과거에서는 주어가 I나 he처럼 단수여도 was 대신 were를 쓰는 것이 문법의 원칙이에요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">as if / as though 가정법 과거완료 (마치 ~했던 것처럼)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">as if 뒤에 \u003cb class=\"key\">had p.p.\u003c/b>를 쓰면 주절보다 \u003cb class=\"key\">앞선 시점\u003c/b>의 사실과 반대되는 상황을 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">as if + S + had p.p. = 마치 ~했던 것처럼\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She looked as if she \u003cspan class=\"fx\">had seen\u003c/span> a ghost.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 마치 유령을 본 것처럼 보였다.\u003c/div>\u003cdiv class=\"g-note\">주절의 시점보다 앞선 시점의 사실과 반대이므로 had p.p. 사용\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주절의 시점과 as if절의 시점이 \u003cb class=\"key\">일치하는지\u003c/b> 아니면 \u003cb class=\"key\">앞서 있는지\u003c/b>를 항상 비교해 보세요.\u003c/div>","segs":[{"n":9,"text":"세 번째로 as if 가정법 과거완료를 배워볼게요. as if 뒤에 had p.p.를 쓰면 주절의 시점보다 더 앞선 과거의 사실과 반대되는 상황을 나타내요. 우리말로는 마치 ~했던 것처럼이라고 해석한답니다.","hl":"rule"},{"n":10,"text":"예문을 함께 읽어 봅시다. She looked as if she had seen a ghost는 그녀는 마치 유령을 본 것처럼 보였다라는 뜻이에요. 그녀가 보았던 시점보다 유령을 본 시점이 더 앞서 있기 때문에 had seen을 썼어요.","hl":"ex-0"},{"n":11,"text":"문제를 풀 때는 주절의 시점과 as if절의 시점이 같은지 아니면 더 앞서는지를 꼭 확인하는 습관을 들여야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">wish + S + would/could (미래와 현재의 바람)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">wish 뒤에 \u003cb class=\"key\">would\u003c/b>나 \u003cb class=\"key\">could\u003c/b>와 동사원형을 쓰면 미래나 현재에 대한 \u003cb class=\"key\">간절한 바람\u003c/b>을 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">S + wish + S + would/could + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I wish it \u003cspan class=\"fx\">would stop\u003c/span> raining.\u003c/div>\u003cdiv class=\"g-ko\">비가 그쳤으면 좋겠다.\u003c/div>\u003cdiv class=\"g-note\">현재 또는 미래에 비가 그치기를 바라는 마음을 표현\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주절의 주어와 that절의 주어가 \u003cb class=\"key\">같을 때\u003c/b>는 wish 뒤에 \u003cb class=\"key\">would\u003c/b>를 쓸 수 없다는 점을 주의하세요.\u003c/div>","segs":[{"n":12,"text":"마지막 개념이에요. S + wish + S + would나 could 다음에 동사원형을 쓰면 미래나 현재에 대한 바람을 나타낼 수 있어요. 현재의 상황이 바뀌기를 바라는 마음을 표현할 때 아주 유용하답니다.","hl":"rule"},{"n":13,"text":"예문을 소리 내어 읽어 봐요. I wish it would stop raining은 비가 그쳤으면 좋겠다라는 뜻이에요. 지금 내리는 비가 앞으로 그치기를 바라는 마음을 would stop으로 표현했어요.","hl":"ex-0"},{"n":14,"text":"주의할 점으로 wish 앞뒤의 주어가 같을 때는 would를 쓸 수 없다는 것을 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I wish I study harder.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I wish I studied harder.\u003c/div>\u003cdiv class=\"g-why\">현재 사실에 대한 아쉬움을 나타낼 때는 동사의 과거형을 써야 하기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He talks as if he is a doctor.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He talks as if he were a doctor.\u003c/div>\u003cdiv class=\"g-why\">as if 가정법에서는 현재 사실과 반대되는 상황을 가정할 때 과거형을 써야 하기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She looked as if she saw a ghost.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She looked as if she had seen a ghost.\u003c/div>\u003cdiv class=\"g-why\">주절의 시점보다 앞선 시점의 사실과 반대되는 상황이므로 had p.p.를 써야 하기 때문입니다.\u003c/div>\u003c/div>","segs":[{"n":15,"text":"학생들이 자주 틀리는 첫 번째 문장이에요. I wish I study harder라고 쓰면 틀려요. 현재 사실에 대한 아쉬움은 과거형인 studied를 써야 맞답니다.","hl":"mk-0"},{"n":16,"text":"두 번째로 자주 틀리는 문장이에요. He talks as if he is a doctor는 틀린 문장이에요. 마치 ~인 것처럼 현재 사실과 반대를 나타낼 때는 현재형 is가 아니라 과거형인 were를 써야 해요.","hl":"mk-1"},{"n":17,"text":"마지막으로 자주 틀리는 문장이에요. She looked as if she saw a ghost라고 하면 안 돼요. 보았던 것보다 유령을 본 시점이 더 앞서 있기 때문에 과거형 saw 대신 had seen을 써야 맞는 문장이 돼요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">I wish I _________ swim faster.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>can\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>could\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>will\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>have\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">could\u003c/span>\u003cdiv class=\"g-exp\">현재 사실에 대한 아쉬움을 나타내는 wish 가정법이므로 조동사의 과거형인 could가 정답입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"첫 번째 문제예요. I wish I 빈칸 swim faster 문장의 빈칸에 알맞은 말을 보기 중에서 골라 보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":6},{"n":20,"text":"정답은 두 번째 보기인 could예요. 현재 사실에 대한 아쉬움을 나타내므로 조동사의 과거형을 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">I wish I _________ studied harder yesterday.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>have\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>had\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>would\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>did\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">had\u003c/span>\u003cdiv class=\"g-exp\">어제 더 열심히 공부하지 못한 과거 사실에 대한 아쉬움이므로 had p.p. 형태가 되어야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-sho 03cdiv class=\"g-exp\">현재 새처럼 날 수 없는 것에 대한 아쉬움을 나타내므로 조동사의 과거형 could가 정답입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"여섯 번째 마지막 문제예요. I wish I 빈칸 fly like a bird now 문장의 빈칸에 들어갈 알맞은 단어를 직접 써 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 could예요. 현재 날 수 없는 것에 대한 아쉬움을 나타내므로 could를 쓰는 것이 정확해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 9 Unit 43 wish · as if 가정법 구문\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>현재 사실에 대한 아쉬움은 wish 뒤에 \u003cb class=\"key\">과거형\u003c/b>을 씁니다.\u003c/li>\u003cli>과거 사실에 대한 아쉬움은 wish 뒤에 \u003cb class=\"key\">had p.p.\u003c/b>를 씁니다.\u003c/li>\u003cli>as if 뒤에 \u003cb class=\"key\">과거형\u003c/b>은 현재 사실과 반대, \u003cb class=\"key\">had p.p.\u003c/b>는 과거 사실과 반대를 나타냅니다.\u003c/li>\u003c/ul>","segs":[{"n":36,"text":"오늘 우리는 wish와 as if 가정법 구문을 아주 자세히 공부해 보았어요. 현재와 과거의 아쉬움을 나타내는 방법과 마치 ~인 것처럼 가정하는 표현을 잘 기억해 두면 시험 문제도 거뜬히 풀 수 있을 거예요. 오늘도 정말 수고 많았어요. 다음 시간에 또 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
