  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}

lecturePlayer(document.getElementById("app"),{"brand":"unit43","title":"I wish와 as if, 마치 ~인 것처럼 말하기","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마블레드\u003c/div>\u003ch1>I wish와 as if, 마치 ~인 것처럼 말하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>가정법을 활용해 현재·과거의 소망과 사실과 다른 가정을 자연스럽게 표현할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마블레드 유닛에서 I wish와 as if, as though가 들어간 문장들을 함께 공부할 거예요. 이 표현들은 시험에도 자주 나오고, 일상에서도 후회나 소망, 상상을 말할 때 정말 유용하죠. 우리는 문장을 끊어 읽으면서 구조를 먼저 잡고, 그다음 의미와 바꿔 쓰기까지 차근차근 익혀 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">\u003cb class=\"key\">I wish\u003c/b> 뒤에는 현재 사실과 반대되는 소망이면 \u003cb class=\"key\">가정법 과거\u003c/b>, 과거 사실에 대한 후회면 \u003cb class=\"key\">가정법 과거완료\u003c/b>를 씁니다. \u003cb class=\"key\">as if\u003c/b>와 \u003cb class=\"key\">as though\u003c/b> 뒤에는 사실과 다른 상황을 가정하는 \u003cb class=\"key\">가정법\u003c/b>이 와서 '마치 ~인 것처럼'이라는 뜻을 만듭니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">I wish I were endowed with\u003c/span> an artistic talent for painting masterpieces like Pablo Picasso's.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 The woman smiled and he felt \u003cspan class=\"fx\">as if she lit up\u003c/span> the world around her.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 \u003cspan class=\"fx\">I wish I had accepted\u003c/span> your invitation, rather than running away with my tail between my legs.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Even though I don't personally believe in the Lord, I try to behave \u003cspan class=\"fx\">as though He was watching\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 He burst into a high-pitched laugh, \u003cspan class=\"fx\">as though he'd said something funny\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">I wish I could turn the clock back\u003c/span> and give Mom a fraction of what she gave to me.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 No one on his deathbed ever said, &quot;\u003cspan class=\"fx\">I wish I had spent\u003c/span> more time on my business.&quot;\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 To achieve great things we must live \u003cspan class=\"fx\">as though we were never going to die\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 Men occasionally stumble over the truth, but most of them pick themselves up and hurry off \u003cspan class=\"fx\">as if nothing had happened\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 I've lived my life taking risks and \u003cspan class=\"fx\">I wish I could tell you\u003c/span> they were all  successful, but they weren't.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Toward the end of their administrations, every president I think I've ever known was disappointed and \u003cspan class=\"fx\">wished they had done\u003c/span> some things differently.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 All told, every second, our senses transmit an estimated 11 million bits of information to our poor brains, \u003cspan class=\"fx\">as if a giant fiber-optic cable were plugged\u003c/span> directly into them, firing information at full speed.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"여러분, 오늘은 I wish와 as if, as though를 함께 배워 볼 거예요. I wish 뒤에는 현재 사실과 반대되는 소망이면 가정법 과거를 쓰고, 과거 사실에 대한 후회면 가정법 과거완료를 써요. as if나 as though 뒤에도 사실과 다른 상황을 가정하는 가정법이 와서 마치 그런 것처럼이라는 뜻을 만들어 줍니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">I wish I were endowed with\u003c/span> an artistic talent for painting masterpieces like Pablo Picasso's.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I wish \u003c/div>\u003cdiv class=\"k\">나는 바란다\u003c/div>\u003cdiv class=\"e\">I were endowed with \u003c/div>\u003cdiv class=\"k\">내가 ~을 타고났다면\u003c/div>\u003cdiv class=\"e\">an artistic talent \u003c/div>\u003cdiv class=\"k\">예술적 재능을\u003c/div>\u003cdiv class=\"e\">for painting masterpieces \u003c/div>\u003cdiv class=\"k\">걸작을 그리기 위한\u003c/div>\u003cdiv class=\"e\">like Pablo Picasso's.\u003c/div>\u003cdiv class=\"k\">파블로 피카소의 것과 같은\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">I wish\u003c/b> 뒤에 \u003cb class=\"key\">가정법 과거\u003c/b>(were)가 와서 현재 사실과 반대되는 소망을 나타냅니다. '내가 예술적 재능을 타고났다면 좋을 텐데'라는 뜻으로, 실제로는 그렇지 않다는 함의가 있습니다.\u003c/div>","segs":[{"n":3,"text":"I wish, 나는 바란다. I were endowed with, 내가 ~을 타고났다면. an artistic talent, 예술적 재능을. for painting masterpieces, 걸작을 그리기 위한. like Pablo Picasso's, 파블로 피카소의 것과 같은","hl":"ch"},{"n":4,"text":"첫 번째 문장은 I wish 뒤에 가정법 과거가 온 구조예요. I wish I were endowed with라고 해서 지금 사실과 반대되는 소망을 나타내죠. 여기서 were는 가정법의 표시이고, be endowed with는 재능을 타고나다는 뜻으로 묶어서 기억하면 좋아요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">I wish I were endowed with\u003c/span> an artistic talent for painting masterpieces like Pablo Picasso's.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>실제로는 피카소 같은 걸작을 그릴 만큼 재능이 없지만, 그런 재능이 있었으면 좋겠다는 아쉬움과 바람을 담고 있습니다. 쉽게 말해 '나도 그런 예술적 재능이 있으면 참 좋겠다'는 뜻이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I wish I were endowed with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If only I were endowed with\u003c/span>\u003cdiv class=\"w\">I wish보다 간절한 소망을 강조할 때 쓸 수 있는 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I were endowed with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">I possessed\u003c/span>\u003cdiv class=\"w\">타고난 재능을 가지고 있다는 뜻을 좀 더 중립적으로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be endowed with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be gifted with\u003c/span>\u003cspan class=\"y-eq\">be endowed with = be gifted with\u003c/span>\u003cdiv class=\"w\">타고난 재능이나 자질을 표현하는 동의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">an artistic talent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">an artistic gift\u003c/span>\u003cspan class=\"y-eq\">talent = gift\u003c/span>\u003cdiv class=\"w\">재능을 뜻하는 명사를 바꿔 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">masterpieces\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">great works\u003c/span>\u003cspan class=\"y-eq\">masterpiece = great work\u003c/span>\u003cdiv class=\"w\">걸작을 뜻하는 어구를 쉬운 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If only I were gifted with the artistic ability to paint masterpieces like Pablo Picasso's.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 피카소 같은 걸작을 그릴 만큼 재능이 실제로는 없지만, 그런 예술적 재능이 있었으면 좋겠다는 아쉬움을 담고 있어요. 쉽게 말하면 나도 그런 재능이 있으면 참 좋겠다는 뜻이죠.","hl":"mn"},{"n":6,"text":"I wish I were endowed with는 If only I were endowed with로 바꿔 말할 수 있어요. If only는 간절함을 더 강조하는 표현이라서 후회나 소망을 더 절실하게 들리게 해 줍니다.","hl":"rw"},{"n":7,"text":"be endowed with는 be gifted with와 같은 뜻으로 볼 수 있어요. an artistic talent는 an artistic gift로 바꿀 수 있고, masterpieces는 great works처럼 쉬운 표현으로 바꿔도 의미가 잘 전달됩니다.","hl":"ph"},{"n":8,"text":"이제 뜻이 같은 문장을 하나 읽어 볼게요. If only I were gifted with the artistic ability to paint masterpieces like Pablo Picasso's. 앞에서 배운 I wish와 같은 소망을 If only로 표현한 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 The woman smiled and he felt \u003cspan class=\"fx\">as if she lit up\u003c/span> the world around her.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The woman smiled \u003c/div>\u003cdiv class=\"k\">그 여자는 미소 지었다\u003c/div>\u003cdiv class=\"e\">and he felt \u003c/div>\u003cdiv class=\"k\">그리고 그는 느꼈다\u003c/div>\u003cdiv class=\"e\">as if she lit up \u003c/div>\u003cdiv class=\"k\">마치 그녀가 밝히는 것처럼\u003c/div>\u003cdiv class=\"e\">the world around her.\u003c/div>\u003cdiv class=\"k\">그녀 주변의 세상을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as if\u003c/b> 뒤에 \u003cb class=\"key\">가정법 과거\u003c/b>(lit)가 와서 '마치 ~인 것처럼'이라는 가정을 나타냅니다. 여기서 lit은 과거형이지만 과거 사실을 말하는 것이 아니라, 현재 상황을 사실과 다르게 상상하는 표현입니다.\u003c/div>","segs":[{"n":9,"text":"The woman smiled, 그 여자는 미소 지었다. and he felt, 그리고 그는 느꼈다. as if she lit up, 마치 그녀가 밝히는 것처럼. the world around her, 그녀 주변의 세상을","hl":"ch"},{"n":10,"text":"두 번째 문장은 as if 뒤에 가정법 과거가 온 구조예요. she lit up이라고 과거형을 썼지만 과거 일을 말하는 게 아니라, 마치 그녀가 세상을 밝히는 것처럼 상상하는 표현이죠. as if는 as though로 바꿔도 거의 같은 뜻이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 The woman smiled and he felt \u003cspan class=\"fx\">as if she lit up\u003c/span> the world around her.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>그 여자가 미소를 지었을 때, 남자는 그 미소가 주변 세상을 환하게 밝히는 것처럼 느꼈다는 뜻입니다. 실제로 세상이 밝아진 것은 아니고, 그만큼 그 미소가 인상적이고 따뜻하게 느껴졌다는 비유예요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as if she lit up the world around her\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as though she brightened everything around her\u003c/span>\u003cdiv class=\"w\">as if와 as though는 거의 같은 뜻이고, lit up은 brightened로 바꿔 표현할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">he felt as if\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">it seemed to him that\u003c/span>\u003cdiv class=\"w\">느낌을 전달하는 표현을 좀 더 문어적인 구조로 바꾼 것입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">lit up\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">brightened\u003c/span>\u003cspan class=\"y-eq\">light up = brighten\u003c/span>\u003cdiv class=\"w\">밝게 하다, 환하게 만들다의 동의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the world around her\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">her surroundings\u003c/span>\u003cspan class=\"y-eq\">the world around her = her surroundings\u003c/span>\u003cdiv class=\"w\">주변 세상을 뜻하는 어구를 간단한 명사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">felt as if\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">had the feeling that\u003c/span>\u003cspan class=\"y-eq\">feel as if = have the feeling that\u003c/span>\u003cdiv class=\"w\">느낌을 표현하는 구를 바꿔 쓴 것입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The woman smiled, and it seemed to him that she brightened everything around her.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"여자가 미소를 지었을 때, 남자는 그 미소가 주변 세상을 환하게 밝히는 것처럼 느꼈어요. 실제로 세상이 밝아진 건 아니고, 그 미소가 그만큼 따뜻하고 인상적이었다는 비유입니다.","hl":"mn"},{"n":12,"text":"he felt as if she lit up the world around her는 he felt as though she brightened the world around her로 바꿔 말할 수 있어요. as if를 as though로 바꾸고 lit up을 brightened로 바꿔도 뜻은 자연스럽게 이어집니다.","hl":"rw"},{"n":13,"text":"lit up은 brightened와 같은 뜻으로 볼 수 있어요. the world around her는 her surroundings로 간단하게 바꿀 수 있고, felt as if는 had the feeling that으로 풀어 쓸 수도 있습니다.","hl":"ph"},{"n":14,"text":"뜻이 같은 문장으로는 The woman smiled, and it seemed to him that she brightened everything around her.라고 말할 수 있어요. as if 대신 it seemed to him that을 써서 같은 느낌을 전달한 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 \u003cspan class=\"fx\">I wish I had accepted\u003c/span> your invitation, rather than running away with my tail between my legs.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I wish \u003c/div>\u003cdiv class=\"k\">나는 바란다\u003c/div>\u003cdiv class=\"e\">I had accepted your invitation, \u003c/div>\u003cdiv class=\"k\">내가 너의 초대를 받아들였었다면\u003c/div>\u003cdiv class=\"e\">rather than running away \u003c/div>\u003cdiv class=\"k\">도망치는 것보다는\u003c/div>\u003cdiv class=\"e\">with my tail between my legs.\u003c/div>\u003cdiv class=\"k\">내 꼬리를 다리 사이에 두고\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">I wish\u003c/b> 뒤에 \u003cb class=\"key\">가정법 과거완료\u003c/b>(had accepted)가 와서 과거 사실에 대한 후회를 나타냅니다. '그때 받아들였더라면 좋았을 텐데'라는 뜻으로, 실제로는 받아들이지 않았다는 사실을 함축합니다.\u003c/div>","segs":[{"n":15,"text":"I wish, 나는 바란다. I had accepted your invitation, 내가 너의 초대를 받아들였었다면. rather than running away, 도망치는 것보다는. with my tail between my legs, 내 꼬리를 다리 사이에 두고","hl":"ch"},{"n":16,"text":"세 번째 문장은 I wish 뒤에 가정법 과거완료가 온 구조예요. I had accepted라고 해서 과거에 하지 않은 일을 후회하는 뜻을 만들어요. rather than은 instead of처럼 두 선택을 비교할 때 쓰는 표현으로 기억하면 좋아요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 \u003cspan class=\"fx\">I wish I had accepted\u003c/span> your invitation, rather than running away with my tail between my legs.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>과거에 초대를 받아들이지 않고 겁을 먹고 도망친 자신을 후회하며, 그때 받아들였더라면 좋았을 텐데라고 말하는 문장입니다. with my tail between my legs는 '겁을 먹고, 기가 죽어서'라는 관용 표현이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I wish I had accepted your invitation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If only I had accepted your invitation\u003c/span>\u003cdiv class=\"w\">If only는 과거의 후회를 더 강하게 강조하는 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">running away with my tail between my legs\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">retreating in embarrassment\u003c/span>\u003cdiv class=\"w\">관용 표현을 풀어서 겁먹고 물러나는 모습을 설명했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">with my tail between my legs\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in fear and embarrassment\u003c/span>\u003cspan class=\"y-eq\">with one's tail between one's legs = in fear and embarrassment\u003c/span>\u003cdiv class=\"w\">겁을 먹고 기가 죽은 상태를 뜻하는 관용 표현을 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rather than\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">instead of\u003c/span>\u003cspan class=\"y-eq\">rather than = instead of\u003c/span>\u003cdiv class=\"w\">둘 중 하나를 선택할 때 쓰는 표현을 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">accepted your invitation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">said yes to your invitation\u003c/span>\u003cspan class=\"y-eq\">accept an invitation = say yes to an invitation\u003c/span>\u003cdiv class=\"w\">초대를 받아들인다는 뜻을 구어적으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If only I had said yes to your invitation instead of running away in fear.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 과거에 초대를 받아들이지 않고 겁을 먹고 도망친 자신을 후회하는 말이에요. with my tail between my legs는 꼬리를 다리 사이에 넣는다는 뜻에서 겁을 먹고 기가 죽었다는 관용 표현입니다.","hl":"mn"},{"n":18,"text":"I wish I had accepted your invitation는 If only I had accepted your invitation로 바꿔 더 간절한 후회를 나타낼 수 있어요. running away with my tail between my legs는 retreating in embarrassment처럼 풀어 쓸 수도 있습니다.","hl":"rw"},{"n":19,"text":"with my tail between my legs는 in fear and embarrassment로 풀어 쓸 수 있어요. rather than은 instead of로 바꿀 수 있고, accepted your invitation은 said yes to your invitation처럼 구어적으로 표현할 수 있습니다.","hl":"ph"},{"n":20,"text":"뜻이 같은 문장으로는 If only I had said yes to your invitation instead of running away in fear.라고 말할 수 있어요. 과거의 후회를 If only로 강조하고, 관용 표현은 풀어서 전달한 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Even though I don't personally believe in the Lord, I try to behave \u003cspan class=\"fx\">as though He was watching\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Even though I don't personally believe in the Lord, \u003c/div>\u003cdiv class=\"k\">비록 내가 개인적으로 하느님을 믿지 않을지라도\u003c/div>\u003cdiv class=\"e\">I try to behave \u003c/div>\u003cdiv class=\"k\">나는 행동하려고 노력한다\u003c/div>\u003cdiv class=\"e\">as though He was watching.\u003c/div>\u003cdiv class=\"k\">마치 그가 지켜보고 있는 것처럼\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as though\u003c/b> 뒤에 \u003cb class=\"key\">가정법 과거\u003c/b>(was watching)가 와서 '마치 ~인 것처럼'이라는 가정을 나타냅니다. 여기서는 구어체에서 were 대신 was를 쓴 형태로, 하느님이 실제로 지켜보는 것은 아니라는 가정이 담겨 있습니다.\u003c/div>","segs":[{"n":21,"text":"Even though I don't personally believe in the Lord, 비록 내가 개인적으로 하느님을 믿지 않을지라도. I try to behave, 나는 행동하려고 노력한다. as though He was watching, 마치 그가 지켜보고 있는 것처럼","hl":"ch"},{"n":22,"text":"네 번째 문장은 as though 뒤에 가정법 과거가 온 구조예요. He was watching이라고 해서 마치 그가 지켜보고 있는 것처럼 가정하는 뜻을 만들어요. 구어체에서는 were 대신 was를 쓰기도 한다는 점도 함께 기억해 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Even though I don't personally believe in the Lord, I try to behave \u003cspan class=\"fx\">as though He was watching\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>나는 하느님을 개인적으로 믿지는 않지만, 마치 하느님이 나를 지켜보고 있는 것처럼 행동하려고 노력한다는 뜻입니다. 종교적 신앙과 별개로, 누군가 보고 있다는 생각이 행동을 바르게 만드는 데 도움을 준다는 의미로 읽을 수 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as though He was watching\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as if He were watching\u003c/span>\u003cdiv class=\"w\">as though를 as if로 바꾸고, 격식 있는 가정법 were를 사용해 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I try to behave\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">I make an effort to act\u003c/span>\u003cdiv class=\"w\">behave를 act로 바꾸고 try를 make an effort로 풀어 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Even though\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Although\u003c/span>\u003cspan class=\"y-eq\">even though = although\u003c/span>\u003cdiv class=\"w\">양보를 나타내는 접속사를 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">believe in\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have faith in\u003c/span>\u003cspan class=\"y-eq\">believe in = have faith in\u003c/span>\u003cdiv class=\"w\">신앙이나 믿음을 나타내는 표현을 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">behave\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">act\u003c/span>\u003cspan class=\"y-eq\">behave = act\u003c/span>\u003cdiv class=\"w\">행동하다는 뜻의 동의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Although I don't personally have faith in the Lord, I make an effort to act as if He were watching me.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 내가 개인적으로 하느님을 믿지는 않지만, 마치 하느님이 나를 지켜보는 것처럼 행동하려고 노력한다는 뜻이에요. 누군가 보고 있다고 생각하면 행동을 더 바르게 하게 된다는 의미로 이해할 수 있습니다.","hl":"mn"},{"n":24,"text":"as though He was watching은 as if He were watching으로 바꿔 더 격식 있는 가정법 표현을 쓸 수 있어요. I try to behave는 I make an effort to act로 바꿔도 같은 뜻이 자연스럽게 전달됩니다.","hl":"rw"},{"n":25,"text":"Even though는 Although로 바꿀 수 있어요. believe in은 have faith in으로 바꿀 수 있고, behave는 act와 같은 뜻으로 볼 수 있습니다.","hl":"ph"},{"n":26,"text":"뜻이 같은 문장으로는 Although I don't personally have faith in the Lord, I make an effort to act as if He were watching me.라고 말할 수 있어요. 양보 접속사와 가정법 표현을 자연스럽게 바꾼 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 He burst into a high-pitched laugh, \u003cspan class=\"fx\">as though he'd said something funny\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">He burst into a high-pitched laugh, \u003c/div>\u003cdiv class=\"k\">그는 갑자기 고음의 웃음을 터뜨렸다\u003c/div>\u003cdiv class=\"e\">as though he'd said something funny.\u003c/div>\u003cdiv class=\"k\">마치 그가 뭔가 웃긴 것을 말했던 것처럼\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as though\u003c/b> 뒤에 \u003cb class=\"key\">가정법 과거완료\u003c/b>(he'd said)가 와서 '마치 ~했던 것처럼'이라는 가정을 나타냅니다. 실제로 그가 웃긴 말을 했다는 뜻이 아니라, 그렇게 말한 것처럼 웃었다는 비유입니다.\u003c/div>","segs":[{"n":27,"text":"He burst into a high-pitched laugh, 그는 갑자기 고음의 웃음을 터뜨렸다. as though he'd said something funny, 마치 그가 뭔가 웃긴 것을 말했던 것처럼","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 as though 뒤에 가정법 과거완료가 온 구조예요. he'd said는 he had said의 줄임말이고, 마치 그가 웃긴 말을 했던 것처럼이라는 가정을 나타냅니다. 실제로 그가 그런 말을 했다는 뜻은 아니에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 He burst into a high-pitched laugh, \u003cspan class=\"fx\">as though he'd said something funny\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>그가 갑자기 고음으로 웃음을 터뜨렸는데, 마치 방금 재미있는 말을 한 사람처럼 웃었다는 뜻입니다. 실제로 웃긴 말을 했는지는 중요하지 않고, 그 웃음의 분위기를 생생하게 전달하는 표현이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as though he'd said something funny\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as if he had said something funny\u003c/span>\u003cdiv class=\"w\">as though를 as if로 바꾸고 축약형 he'd를 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">burst into a high-pitched laugh\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">suddenly laughed in a high voice\u003c/span>\u003cdiv class=\"w\">burst into laughter를 풀어서 갑자기 웃음을 터뜨린 모습을 설명했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">burst into\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">suddenly start\u003c/span>\u003cspan class=\"y-eq\">burst into = suddenly start\u003c/span>\u003cdiv class=\"w\">갑자기 ~을 시작하다는 뜻을 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">high-pitched\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">shrill\u003c/span>\u003cspan class=\"y-eq\">high-pitched = shrill\u003c/span>\u003cdiv class=\"w\">높은 소리의, 귀에 쨍한이라는 뜻의 동의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">something funny\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">something amusing\u003c/span>\u003cspan class=\"y-eq\">funny = amusing\u003c/span>\u003cdiv class=\"w\">재미있는이라는 뜻의 형용사를 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">He suddenly laughed in a high voice, as if he had said something amusing.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"그가 갑자기 고음으로 웃음을 터뜨렸는데, 마치 방금 재미있는 말을 한 사람처럼 웃었다는 뜻이에요. 웃음의 분위기를 생생하게 전달하기 위해 as though를 쓴 표현입니다.","hl":"mn"},{"n":30,"text":"as though he'd said something funny는 as if he had said something funny로 바꿀 수 있어요. burst into a high-pitched laugh는 suddenly laughed in a high voice처럼 풀어 쓸 수도 있습니다.","hl":"rw"},{"n":31,"text":"burst into는 suddenly start로 풀어 쓸 수 있어요. high-pitched는 shrill과 비슷하고, something funny는 something amusing으로 바꿀 수 있습니다.","hl":"ph"},{"n":32,"text":"뜻이 같은 문장으로는 He suddenly laughed in a high voice, as if he had said something amusing.이라고 말할 수 있어요. as though를 as if로 바꾸고 웃음 표현을 풀어 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 \u003cspan class=\"fx\">I wish I could turn the clock back\u003c/span> and give Mom a fraction of what she gave to me.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I wish \u003c/div>\u003cdiv class=\"k\">나는 바란다\u003c/div>\u003cdiv class=\"e\">I could turn the clock back \u003c/div>\u003cdiv class=\"k\">내가 시계를 되돌릴 수 있다면\u003c/div>\u003cdiv class=\"e\">and give Mom \u003c/div>\u003cdiv class=\"k\">그리고 엄마에게 줄 수 있다면\u003c/div>\u003cdiv class=\"e\">a fraction of what she gave to me.\u003c/div>\u003cdiv class=\"k\">그녀가 내게 준 것의 일부를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">I wish\u003c/b> 뒤에 \u003cb class=\"key\">가정법 과거\u003c/b>(could turn)가 와서 현재 할 수 없는 일에 대한 소망을 나타냅니다. could는 can의 과거형이지만 여기서는 현재 사실과 반대되는 능력을 가정하는 표현입니다.\u003c/div>","segs":[{"n":33,"text":"I wish, 나는 바란다. I could turn the clock back, 내가 시계를 되돌릴 수 있다면. and give Mom, 그리고 엄마에게 줄 수 있다면. a fraction of what she gave to me, 그녀가 내게 준 것의 일부를","hl":"ch"},{"n":34,"text":"여섯 번째 문장은 I wish 뒤에 가정법 과거가 온 구조예요. I could turn이라고 해서 지금은 할 수 없는 일을 할 수 있다면 좋겠다는 소망을 나타냅니다. could는 현재 사실과 반대되는 능력을 가정할 때 쓰인다고 이해하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 \u003cspan class=\"fx\">I wish I could turn the clock back\u003c/span> and give Mom a fraction of what she gave to me.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>시간을 되돌려 엄마가 나에게 준 것의 일부라도 다시 돌려드리고 싶다는 간절한 바람을 담고 있습니다. 'turn the clock back'은 시간을 거슬러 올라가다, 과거로 돌아가다라는 관용 표현이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pa cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 No one on his deathbed ever said, &quot;\u003cspan class=\"fx\">I wish I had spent\u003c/span> more time on my business.&quot;\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사람들은 죽음을 앞두고 사업이나 일에 시간을 더 쓰지 못한 것을 후회하지 않는다는 뜻입니다. 오히려 가족이나 소중한 사람과의 시간을 더 갖지 못한 것을 후회한다는 메시지를 담고 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I wish I had spent more time on my business\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If only I had spent more time on my business\u003c/span>\u003cdiv class=\"w\">If only를 써서 과거의 후회를 더 강하게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">No one ever said\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Nobody ever said\u003c/span>\u003cdiv class=\"w\">No one을 Nobody로 바꾼 같은 뜻의 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">on his deathbed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">when he was dying\u003c/span>\u003cspan class=\"y-eq\">on one's deathbed = when one is dying\u003c/span>\u003cdiv class=\"w\">임종에, 죽음을 앞두고라는 뜻을 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">spent more time on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">devoted more time to\u003c/span>\u003cspan class=\"y-eq\">spend time on = devote time to\u003c/span>\u003cdiv class=\"w\">시간을 쓰다라는 표현을 좀 더 격식 있게 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">my business\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">my work\u003c/span>\u003cspan class=\"y-eq\">business = work\u003c/span>\u003cdiv class=\"w\">사업이라는 뜻을 넓게 일이라는 의미로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Nobody ever said on their deathbed, &quot;If only I had devoted more time to my work.&quot;\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 사람들이 죽음을 앞두고 사업에 시간을 더 쓰지 못한 것을 후회하지 않는다는 뜻이에요. 오히려 가족이나 소중한 사람과 보내는 시간을 더 갖지 못한 것을 후회한다는 메시지를 담고 있습니다.","hl":"mn"},{"n":42,"text":"I wish I had spent more time on my business는 If only I had spent more time on my business로 바꿔 후회를 더 강조할 수 있어요. No one ever said는 Nobody ever said로 바꿔도 같은 뜻입니다.","hl":"rw"},{"n":43,"text":"on his deathbed는 when he was dying으로 풀어 쓸 수 있어요. spent more time on은 devoted more time to로 바꿀 수 있고, my business는 my work처럼 넓은 의미로 바꿀 수도 있습니다.","hl":"ph"},{"n":44,"text":"뜻이 같은 문장으로는 No one ever said on their deathbed, If only I had devoted more time to my work.라고 말할 수 있어요. 과거의 후회를 If only로 표현하고 어구를 자연스럽게 바꾼 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 To achieve great things we must live \u003cspan class=\"fx\">as though we were never going to die\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">To achieve great things \u003c/div>\u003cdiv class=\"k\">위대한 것들을 성취하기 위해서\u003c/div>\u003cdiv class=\"e\">we must live \u003c/div>\u003cdiv class=\"k\">우리는 살아야 한다\u003c/div>\u003cdiv class=\"e\">as though we were never going to die.\u003c/div>\u003cdiv class=\"k\">마치 우리가 결코 죽지 않을 것처럼\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as though\u003c/b> 뒤에 \u003cb class=\"key\">가정법 과거\u003c/b>(were never going to die)가 와서 '마치 ~인 것처럼'이라는 가정을 나타냅니다. to achieve는 목적을 나타내는 \u003cb class=\"key\">to부정사\u003c/b>로 '~하기 위해서'라는 뜻을 만듭니다.\u003c/div>","segs":[{"n":45,"text":"To achieve great things, 위대한 것들을 성취하기 위해서. we must live, 우리는 살아야 한다. as though we were never going to die, 마치 우리가 결코 죽지 않을 것처럼","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 as though 뒤에 가정법 과거가 온 구조예요. we were never going to die라고 해서 마치 우리가 절대 죽지 않을 것처럼 가정하는 뜻을 만들어요. 앞에 있는 to achieve는 목적을 나타내는 to부정사로, 위대한 것을 이루기 위해서라는 뜻입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 To achieve great things we must live \u003cspan class=\"fx\">as though we were never going to die\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>위대한 일을 이루려면 마치 죽지 않을 것처럼 긴 안목으로 살아야 한다는 뜻입니다. 죽음이라는 한계를 잊고, 오래 이어질 일을 꾸준히 해 나가라는 격려로 읽을 수 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as though we were never going to die\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as if we would never die\u003c/span>\u003cdiv class=\"w\">as though를 as if로 바꾸고 were going to를 would로 간단히 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">To achieve great things\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">In order to achieve great things\u003c/span>\u003cdiv class=\"w\">목적을 더 분명하게 드러내는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">achieve great things\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">accomplish great things\u003c/span>\u003cspan class=\"y-eq\">achieve = accomplish\u003c/span>\u003cdiv class=\"w\">이루다, 성취하다는 뜻의 동의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be never going to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">will never\u003c/span>\u003cspan class=\"y-eq\">be never going to = will never\u003c/span>\u003cdiv class=\"w\">미래에 절대 그렇게 되지 않는다는 뜻을 간단히 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">live\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lead one's life\u003c/span>\u003cspan class=\"y-eq\">live = lead one's life\u003c/span>\u003cdiv class=\"w\">살다라는 동사를 좀 더 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">In order to accomplish great things, we must live as if we would never die.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"이 문장은 위대한 일을 이루려면 마치 죽지 않을 것처럼 오래 보고 살아야 한다는 뜻이에요. 죽음이라는 한계를 잊고 꾸준히 도전하라는 격려로 이해할 수 있습니다.","hl":"mn"},{"n":48,"text":"as though we were never going to die는 as if we would never die로 바꿔 말할 수 있어요. To achieve great things는 In order to achieve great things로 바꾸면 목적이 더 분명해집니다.","hl":"rw"},{"n":49,"text":"achieve great things는 accomplish great things와 같은 뜻으로 볼 수 있어요. be never going to는 will never로 간단히 바꿀 수 있고, live는 lead one's life처럼 풀어 쓸 수도 있습니다.","hl":"ph"},{"n":50,"text":"뜻이 같은 문장으로는 In order to accomplish great things, we must live as if we would never die.라고 말할 수 있어요. 목적 표현과 가정법 표현을 자연스럽게 바꾼 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 Men occasionally stumble over the truth, but most of them pick themselves up and hurry off \u003cspan class=\"fx\">as if nothing had happened\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Men occasionally stumble over the truth, \u003c/div>\u003cdiv class=\"k\">사람들은 가끔 진실에 발이 걸린다\u003c/div>\u003cdiv class=\"e\">but most of them pick themselves up \u003c/div>\u003cdiv class=\"k\">그러나 그들 대부분은 스스로 일어서고\u003c/div>\u003cdiv class=\"e\">and hurry off \u003c/div>\u003cdiv class=\"k\">그리고 서둘러 떠난다\u003c/div>\u003cdiv class=\"e\">as if nothing had happened.\u003c/div>\u003cdiv class=\"k\">마치 아무 일도 일어나지 않았던 것처럼\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as if\u003c/b> 뒤에 \u003cb class=\"key\">가정법 과거완료\u003c/b>(had happened)가 와서 '마치 ~했던 것처럼'이라는 가정을 나타냅니다. 여기서는 진실을 만난 일이 실제로 일어나지 않은 것처럼 행동한다는 뜻을 만듭니다.\u003c/div>","segs":[{"n":51,"text":"Men occasionally stumble over the truth, 사람들은 가끔 진실에 발이 걸린다. but most of them pick themselves up, 그러나 그들 대부분은 스스로 일어서고. and hurry off, 그리고 서둘러 떠난다. as if nothing had happened, 마치 아무 일도 일어나지 않았던 것처럼","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 as if 뒤에 가정법 과거완료가 온 구조예요. nothing had happened라고 해서 마치 아무 일도 일어나지 않았던 것처럼 행동한다는 뜻을 만들어요. but으로 앞뒤 상황을 대조하고 있다는 점도 함께 봐 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 Men occasionally stumble over the truth, but most of them pick themselves up and hurry off \u003cspan class=\"fx\">as if nothing had happened\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사람들은 가끔 진실을 마주치지만, 대부분은 곧 일어나서 아무 일도 없었던 것처럼 서둘러 자리를 떠난다는 뜻입니다. 불편한 진실을 외면하고 싶은 인간의 습성을 비꼬는 표현이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stumble over the truth\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">come across the truth\u003c/span>\u003cdiv class=\"w\">우연히 진실을 만나다라는 뜻으로 stumble over를 come across로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as if nothing had happened\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as though nothing had occurred\u003c/span>\u003cdiv class=\"w\">as if를 as though로, happened를 occurred로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stumble over\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">trip over\u003c/span>\u003cspan class=\"y-eq\">stumble over = trip over\u003c/span>\u003cdiv class=\"w\">발이 걸리다는 뜻의 동의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pick themselves up\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">get back on their feet\u003c/span>\u003cspan class=\"y-eq\">pick oneself up = get back on one's feet\u003c/span>\u003cdiv class=\"w\">스스로 일어서다라는 뜻을 관용적으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">hurry off\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rush away\u003c/span>\u003cspan class=\"y-eq\">hurry off = rush away\u003c/span>\u003cdiv class=\"w\">서둘러 떠나다라는 뜻의 동의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">People sometimes come across the truth, but most of them get back on their feet and rush away as though nothing had occurred.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"사람들은 가끔 진실을 마주치지만, 대부분은 곧 일어나서 아무 일도 없었던 것처럼 서둘러 떠난다는 뜻이에요. 불편한 진실을 외면하려는 인간의 습성을 비꼬는 표현입니다.","hl":"mn"},{"n":54,"text":"stumble over the truth는 come across the truth로 바꿔 우연히 진실을 만나다라는 뜻을 살릴 수 있어요. as if nothing had happened는 as though nothing had occurred로 바꿔도 같은 의미입니다.","hl":"rw"},{"n":55,"text":"stumble over는 trip over와 비슷한 뜻이에요. pick themselves up은 get back on their feet로 바꿀 수 있고, hurry off는 rush away로 바꿀 수 있습니다.","hl":"ph"},{"n":56,"text":"뜻이 같은 문장으로는 People sometimes come across the truth, but most of them get back on their feet and rush away as though nothing had occurred.라고 말할 수 있어요. 어구를 동의어로 바꾸면서 전체 의미를 그대로 살린 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 I've lived my life taking risks and \u003cspan class=\"fx\">I wish I could tell you\u003c/span> they were all  successful, but they weren't.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I've lived my life \u003c/div>\u003cdiv class=\"k\">나는 내 인생을 살아왔다\u003c/div>\u003cdiv class=\"e\">taking risks \u003c/div>\u003cdiv class=\"k\">위험을 감수하면서\u003c/div>\u003cdiv class=\"e\">and I wish I could tell you \u003c/div>\u003cdiv class=\"k\">그리고 나는 너에게 말할 수 있다면 좋을 텐데\u003c/div>\u003cdiv class=\"e\">they were all  successful, \u003c/div>\u003cdiv class=\"k\">그것들이 모두 성공적이었다고\u003c/div>\u003cdiv class=\"e\">but they weren't.\u003c/div>\u003cdiv class=\"k\">하지만 그것들은 그렇지 않았다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">I wish\u003c/b> 뒤에 \u003cb class=\"key\">가정법 과거\u003c/b>(could tell)가 와서 현재 사실과 반대되는 소망을 나타냅니다. '말할 수 있다면 좋을 텐데'라는 뜻으로, 실제로는 모든 위험이 성공적이었다고 말할 수 없다는 사실을 함축합니다.\u003c/div>","segs":[{"n":57,"text":"I've lived my life, 나는 내 인생을 살아왔다. taking risks, 위험을 감수하면서. and I wish I could tell you, 그리고 나는 너에게 말할 수 있다면 좋을 텐데. they were all successful, 그것들이 모두 성공적이었다고. but they weren't, 하지만 그것들은 그렇지 않았다","hl":"ch"},{"n":58,"text":"열 번째 문장은 I wish 뒤에 가정법 과거가 온 구조예요. I could tell you라고 해서 지금 말할 수 있다면 좋겠다는 소망을 나타내죠. but they weren't에서 실제로는 모두 성공적이지 않았다는 사실을 다시 확인해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 I've lived my life taking risks and \u003cspan class=\"fx\">I wish I could tell you\u003c/span> they were all  successful, but they weren't.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>나는 위험을 감수하며 살아왔고, 모든 도전이 성공적이었다고 말할 수 있으면 좋겠지만 그렇지는 않다는 뜻입니다. 위험을 감수한 삶에는 성공과 실패가 모두 있었고, 솔직하게 인정하는 뉘앙스가 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I wish I could tell you\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">I wish I were able to tell you\u003c/span>\u003cdiv class=\"w\">could를 were able to로 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">taking risks\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">risking it all\u003c/span>\u003cdiv class=\"w\">위험을 감수하다라는 뜻을 좀 더 강조한 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">live my life\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lead my life\u003c/span>\u003cspan class=\"y-eq\">live one's life = lead one's life\u003c/span>\u003cdiv class=\"w\">삶을 살아가다는 뜻의 동의어 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take risks\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">take chances\u003c/span>\u003cspan class=\"y-eq\">take risks = take chances\u003c/span>\u003cdiv class=\"w\">위험을 감수하다라는 뜻의 동의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">successful\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fruitful\u003c/span>\u003cspan class=\"y-eq\">successful = fruitful\u003c/span>\u003cdiv class=\"w\">성공적인, 결실 있는이라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I have lived my life taking chances, and I wish I could say that they were all successful, but they were not.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 내가 위험을 감수하며 살아왔고, 모든 도전이 성공적이었다고 말할 수 있으면 좋겠지만 그렇지는 않다는 뜻이에요. 위험을 감수한 삶에는 성공과 실패가 모두 있었다는 솔직한 고백입니다.","hl":"mn"},{"n":60,"text":"I wish I could tell you는 I wish I were able to tell you로 바꿔 쓸 수 있어요. div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>매 초마다 우리의 감각이 어림잡아 천백만 비트의 정보를 뇌로 전송하는데, 그 모습이 마치 거대한 광섬유 케이블이 뇌에 직접 연결되어 정보를 전속력으로 쏘는 것과 같다는 뜻입니다. 뇌가 처리해야 하는 정보의 양이 엄청나다는 점을 강조하는 비유예요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as if a giant fiber-optic cable were plugged directly into them\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as though a huge fiber-optic cable were connected straight to them\u003c/span>\u003cdiv class=\"w\">as if를 as though로, plugged를 connected로, directly를 straight로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">firing information at full speed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">sending information at top speed\u003c/span>\u003cdiv class=\"w\">firing을 sending으로, at full speed를 at top speed로 바꿔 같은 의미를 전달했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">All told\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">In total\u003c/span>\u003cspan class=\"y-eq\">all told = in total\u003c/span>\u003cdiv class=\"w\">모두 합쳐서, 전체적으로라는 뜻의 동의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">an estimated\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">approximately\u003c/span>\u003cspan class=\"y-eq\">an estimated = approximately\u003c/span>\u003cdiv class=\"w\">어림잡아, 대략이라는 뜻을 부사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at full speed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at top speed\u003c/span>\u003cspan class=\"y-eq\">at full speed = at top speed\u003c/span>\u003cdiv class=\"w\">전속력으로라는 뜻의 동의어 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\
