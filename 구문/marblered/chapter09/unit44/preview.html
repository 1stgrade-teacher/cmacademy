lecturePlayer(document.getElementById("app"),{"brand":"Unit 44 if가 없는 가정법 구문","title":"if가 없는 가정법 구문 정복하기","audioDir":"preview_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 9 Unit 44 if가 없는 가정법 구문\u003c/div>\u003ch1>if가 없는 가정법 구문 정복하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>if절이 없어도 가정법을 나타내는 다양한 표현을 이해하고 정확하게 해석할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 가정법 구문 중에서도 if가 직접 보이지 않지만 가정의 의미를 나타내는 표현들을 배워볼 거예요. 고등학교 영어 시험에서 서술어의 형태를 묻는 단골 문제로 나오니까 오늘 저와 함께 확실하게 정리해 봐요. 자, 그럼 첫 번째 개념부터 차근차근 시작해 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">without / but for + 명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">without\u003c/b>이나 \u003cb class=\"key\">but for\u003c/b> 뒤에 명사가 오면 '~이 없다면' 또는 '~이 없었다면'이라는 가정의 의미를 나타내요. 주절의 동사가 과거형이면 가정법 과거, have p.p. 형태이면 가정법 과거완료가 돼요.\u003cdiv>\u003cspan class=\"g-formula\">Without / But for + 명사, 주절(조동사 과거형 + 동사원형 / have p.p.)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Without water, plants would die.\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">물이 없다면 식물은 죽을 것이다.\u003c/div>\u003cdiv class=\"g-note\">without 명사 형태가 가정법 과거의 조건절 역할을 하는 문장\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">if it were not for\u003c/b>나 \u003cb class=\"key\">had it not been for\u003c/b> 구문으로 풀어서 쓸 수 있다는 점을 꼭 기억하세요.\u003c/div>","segs":[{"n":2,"text":"첫 번째로 배울 내용은 without이나 but for 뒤에 명사가 오는 경우예요. 이 표현들은 '~이 없다면'이나 '~이 없었다면'이라는 뜻을 가지며 if it were not for나 had it not been for와 같은 뜻이에요. 주절의 동사 형태에 따라 가정법 과거인지 과거완료인지 구별하면 된답니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 볼게요. Without water, plants would die.라고 했어요. 물이 없다면 식물은 죽을 것이라는 뜻이며 without water가 if there were no water 대신 쓰인 가정법 과거 문장이에요.","hl":"ex-0"},{"n":4,"text":"참고로 이 표현들은 학교 시험에서 if를 포함한 절로 바꾸어 쓰는 문제로주 자주 출제되니까 원본 형태와 전환하는 연습을 꼭 해두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">otherwise와 부사구에 숨은 가정 의미\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">otherwise\u003c/b>는 '만약 그렇지 않다면'이라는 뜻으로 앞 문장과 반대되는 상황을 가정해요. 또한 주어 앞의 \u003cb class=\"key\">부사구\u003c/b>, \u003cb class=\"key\">to부정사구\u003c/b>, \u003cb class=\"key\">분사구\u003c/b> 등이 조건의 의미를 대신하기도 해요.\u003cdiv>\u003cspan class=\"g-formula\">부사구 / to부정사구 / 분사구 + 주절(would / could / might + 동사원형)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I was tired; \u003cspan class=\"fx\">otherwise I would have joined you.\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">나는 피곤했다. 그렇지 않았다면 너와 함께했을 것이다.\u003c/div>\u003cdiv class=\"g-note\">otherwise가 앞 문장의 상황을 받아 가정하는 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">In your position,\u003c/span> I would accept the offer.\u003c/div>\u003cdiv class=\"g-ko\">네 입장이라면 나는 그 제안을 받아들일 것이다.\u003c/div>\u003cdiv class=\"g-note\">부사구 In your position이 조건절의 역할을 하는 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">To hear him speak,\u003c/span> you would think he was a native.\u003c/div>\u003cdiv class=\"g-ko\">그가 말하는 것을 들으면 너는 그가 원어민이라고 생각할 것이다.\u003c/div>\u003cdiv class=\"g-note\">to부정사구가 조건을 나타내는 가정법 구문\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>부사구나 to부정사구가 문장 맨 앞에 올 때 \u003cb class=\"key\">조건\u003c/b>을 나타내는 해석이 자연스러운지 확인해 보세요.\u003c/div>","segs":[{"n":5,"text":"두 번째 개념은 otherwise와 다양한 부사구에 숨은 가정 의미예요. otherwise는 만약 그렇지 않다면이라는 뜻으로 앞 문장과 반대되는 상황을 가정하고요. 문장 앞의 부사구나 to부정사구, 분사구 역시 if절처럼 조건을 나타내며 주절에는 조동사의 과거형이 온답니다.","hl":"rule"},{"n":6,"text":"첫 번째 예문을 보면 I was tired; otherwise I lants will die.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Without water, plants would die.\u003c/div>\u003cdiv class=\"g-why\">without이 이끄는 가정법 구문에서는 주절에 will이 아니라 would 같은 조동사의 과거형을 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I was tired; otherwise I will have joined you.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I was tired; otherwise I would have joined you.\u003c/div>\u003cdiv class=\"g-why\">otherwise가 과거의 반대 상황을 가정하므로 조동사 과거형과 have p.p.를 써야 해요.\u003c/div>\u003c/div>","segs":[{"n":13,"text":"학생들이 자주 하는 실수 첫 번째를 살펴볼게요. Without water, plants will die라고 쓰면 틀려요. without 뒤에 명사가 왔으므로 가정법 과거 주절의 규칙에 맞게 will을 would로 고쳐야 올바른 문장이 돼요.","hl":"mk-0"},{"n":14,"text":"두 번째 실수는 otherwise가 쓰인 문장에서 조동사 시제를 틀리는 경우예요. I was tired; otherwise I will have joined you라고 쓰면 시제가 맞지 않아요. 과거의 반대 사실을 가정하는 과거완료 맥락이므로 would have joined라고 써야 맞아요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">________ water, plants would die.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>If\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>Without\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>With\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Unless\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Without\u003c/span>\u003cdiv class=\"g-exp\">주절에 would die라는 가정법 과거 동사가 왔고 뒤에 명사 water가 있으므로 '~이 없다면'을 뜻하는 Without이 정답이다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":15,"text":"첫 번째 문제입니다. 빈칸 water, plants would die라는 문장에서 빈칸에 들어갈 가장 적절한 전치사를 네 개의 보기 중에서 골라보세요. 잠시 멈추고 직접 풀어보세요.","hl":"q"},{"n":16,"text":"","hl":"q","pause":6},{"n":17,"text":"정답은 두 번째 보기인 Without이에요. 주절에 would die가 있고 명사가 이어지므로 without이 정답이랍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 밑줄 친 부분이 가정의 의미를 나타내는 문장으로 가장 적절한 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">In your position, I would accept the offer.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>He is in your position now.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Because you are in your position,\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>If I were in your position,\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Although he was in your position,\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">If I were in your position,\u003c/span>\u003cdiv class=\"g-exp\">부사구 In your position은 '네 입장이라면'이라는 조건을 나타내므로 if절인 If I were in your position으로 바꾸어 쓸 수 있다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"두 번째 문제입니다. In your position, I would accept the offer라는 문장의 밑줄 친 부사구와 의미가 같은 것을 보기에서 골라보세요. 잠시 생각하고 정답을 찾아보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":6},{"n":20,"text":"정답은 세 번째 보기인 If I were in your position이에요. 부사구가 조건절 역할을 하므로 if를 살린 가정법 과거 문장으로 전환할 수 있어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">I was tired; ________ I would have joined you.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>therefore\
