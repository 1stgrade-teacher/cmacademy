lecturePlayer(document.getElementById("app"),{"brand":"unit44","title":"마블레드 구문 강의: 가정의 조건과 would, could, might","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마블레드\u003c/div>\u003ch1>마블레드 구문 강의: 가정의 조건과 would, could, might\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>가정의 조건과 결과를 would, could, might로 연결하고 without, otherwise, but for를 if절처럼 해석하는 힘을 기릅니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마블레드 유닛에서 would와 could, might가 만드는 가정의 문장들을 함께 봅니다. 이 표현들은 현실과 다른 상황을 상상해서 그 결과를 말할 때 정말 자주 쓰여요. 오늘 강의를 끝내면 without이나 otherwise가 보여도 조건과 결과를 바로 찾아낼 수 있을 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">마블레드 유닛의 핵심은 \u003cb class=\"key\">가정의 조건\u003c/b>과 \u003cb class=\"key\">그 결과\u003c/b>를 한 문장 안에서 연결하는 것입니다. 조건이 현재나 미래와 반대이면 \u003cb class=\"key\">would/could/might + 동사원형\u003c/b>, 과거 사실과 반대이면 \u003cb class=\"key\">would/could/might have + 과거분사\u003c/b>를 씁니다. \u003cb class=\"key\">without\u003c/b>, \u003cb class=\"key\">otherwise\u003c/b>, \u003cb class=\"key\">but for\u003c/b>는 if절처럼 조건을 만들므로 뒤따르는 조동사와 반드시 함께 읽습니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Dreams come true. \u003cspan class=\"fx\">Without that possibility, nature would not incite us to have them\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">In different circumstances, I would have enjoyed that journey\u003c/span>. My legs were very tired and sore.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 Coronavirus is a completely different type of virus. \u003cspan class=\"fx\">Otherwise it would be called flu\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 \u003cspan class=\"fx\">Only a fool would ignore his past experience\u003c/span> when confronted with a new situation.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">To see her walking around in her old clothes, you'd never guess she owned a multi-million dollar business\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">We would not have had men on the Moon but for Wells and Verne and the people who write about this and made people think about it\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 All great achievers in past ages possessed singleness of purpose without exception. \u003cspan class=\"fx\">Without it, Columbus wouldn't have started upon the voyage that made his name immortal\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 A hundred years ago \u003cspan class=\"fx\">not a doctor in the world could have assured a patient that an operation would be painless\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">Born in better times, he would have done credit to society\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 In the past it never occurred to me that every casual remark of mine would be snatched up and recorded. \u003cspan class=\"fx\">Otherwise I would have crept further into my shell\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">With the right software, I could help students form a concrete idea of society\u003c/span> by displaying on-screen a version of the city in which they live.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Ironically, while many of us perceive insects as harmful pests—dangerous, ugly, and disease-ridden—in reality, \u003cspan class=\"fx\">without the service of pollination which they provide, humankind might cease to exist\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"마블레드의 핵심은 가정의 조건과 그 결과를 한 문장 안에서 연결하는 거예요. 조건이 현재나 미래와 반대라면 would나 could, might 뒤에 동사원형이 오고, 과거의 반대 상황이라면 would have 다음에 과거분사가 옵니다. without, otherwise, but for는 if절처럼 조건의 역할을 하니까 앞뒤의 would, could, might를 꼭 같이 봐 주세요. 이 짝을 찾는 순간 문장의 의미가 훨씬 선명해집니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Dreams come true. \u003cspan class=\"fx\">Without that possibility, nature would not incite us to have them\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Dreams come true.\u003c/div>\u003cdiv class=\"k\">꿈은 실현된다.\u003c/div>\u003cdiv class=\"e\"> Without that possibility,\u003c/div>\u003cdiv class=\"k\">그런 가능성이 없다면,\u003c/div>\u003cdiv class=\"e\"> nature would not incite us\u003c/div>\u003cdiv class=\"k\">본성은 우리를 자극하지 않을 것이다\u003c/div>\u003cdiv class=\"e\"> to have them.\u003c/div>\u003cdiv class=\"k\">꿈을 가지도록\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Without\u003c/b>은 '만약 ~이 없다면'이라는 가정 조건을 만들고, 그 결과로 \u003cb class=\"key\">would not + 동사원형\u003c/b>이 와서 현실과 다른 결과를 말합니다. 즉 if there were no such possibility를 without으로 간결하게 표현한 \u003cb class=\"key\">가정법\u003c/b> 문장입니다.\u003c/div>","segs":[{"n":3,"text":"Dreams come true, 꿈은 실현된다.. Without that possibility, 그런 가능성이 없다면. nature would not incite us, 본성은 우리를 자극하지 않을 것이다. to have them, 꿈을 가지도록","hl":"ch"},{"n":4,"text":"첫 번째 문장에서는 Without that possibility가 조건의 역할을 해요. 이 표현은 if there were no such possibility처럼 만약 그런 가능성이 없다면이라는 뜻을 담고 있죠. 그래서 뒤에 nature would not incite us가 와서 그 조건의 결과를 말합니다. without이 보이면 뒤의 would를 함께 묶어서 읽어 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Dreams come true. \u003cspan class=\"fx\">Without that possibility, nature would not incite us to have them\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>꿈이 실현될 가능성이 있기 때문에 자연이 우리에게 꿈을 품게 한다는 뜻입니다. 가능성이 없다면 우리는 꿈을 갖도록 자극받지 못했을 거라는 상상입니다. '꿈은 이루어진다'를 믿는 힘을 강조해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Without that possibility\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If that possibility did not exist\u003c/span>\u003cdiv class=\"w\">without을 if절로 풀어 조건을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nature would not incite us to have them\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">nature would not encourage us to dream\u003c/span>\u003cdiv class=\"w\">incite와 have them을 일상어 encourage와 dream으로 바꿔 의미를 쉽게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">come true\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be realized\u003c/span>\u003cspan class=\"y-eq\">come true = be realized\u003c/span>\u003cdiv class=\"w\">꿈이나 소망이 실제로 이루어진다는 뜻을 격식 있는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">incite us to have them\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">prompt us to have them\u003c/span>\u003cspan class=\"y-eq\">incite = prompt\u003c/span>\u003cdiv class=\"w\">자극해 어떤 행동을 하게 한다는 뜻을 prompt로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">that possibility\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">that chance\u003c/span>\u003cspan class=\"y-eq\">possibility = chance\u003c/span>\u003cdiv class=\"w\">가능성을 뜻하는 명사를 더 일상적인 chance로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Dreams are realized. If that chance did not exist, nature would not encourage us to dream.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 꿈이 이루어질 가능성이 있기 때문에 자연이 우리에게 꿈을 갖게 한다는 뜻이에요. 만약 그 가능성이 없다면 우리는 꿈을 품도록 자극받지 못했을 거라는 상상을 담고 있죠. 결국 꿈을 믿는 힘 자체가 우리를 움직인다는 따뜻한 메시지입니다.","hl":"mn"},{"n":6,"text":"Without은 if절로 바꿔 연습하면 이해가 쉬워요. If that possibility did not exist라고 말하면 조건이 더 분명해집니다. 뒤의 incite는 encourage로 바꿔도 자연스럽게 같은 뜻을 전달할 수 있어요.","hl":"rw"},{"n":7,"text":"come true는 be realized로 바꿀 수 있고, possibility는 chance로 바꿔 말할 수 있어요. incite는 prompt처럼 자극하다는 뜻으로 바꿔 주면 문장이 더 쉬워집니다. 이렇게 바꿔도 전체 의미는 그대로 유지돼요.","hl":"ph"},{"n":8,"text":"이제 같은 뜻을 자연스럽게 바꾼 문장을 읽어 볼게요. Dreams are realized. If that chance did not exist, nature would not encourage us to dream. 가능성과 자극이라는 핵심 의미가 그대로 살아 있죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">In different circumstances, I would have enjoyed that journey\u003c/span>. My legs were very tired and sore.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">In different circumstances,\u003c/div>\u003cdiv class=\"k\">다른 상황이었다면,\u003c/div>\u003cdiv class=\"e\"> I would have enjoyed that journey.\u003c/div>\u003cdiv class=\"k\">나는 그 여행을 즐겼을 텐데.\u003c/div>\u003cdiv class=\"e\"> My legs were very tired and sore.\u003c/div>\u003cdiv class=\"k\">내 다리는 매우 피곤하고 아팠다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">In different circumstances\u003c/b>는 if the circumstances had been different의 뜻으로 과거 사실과 반대되는 조건을 만듭니다. 그 결과로 \u003cb class=\"key\">would have + 과거분사\u003c/b>가 와서 과거에 일어나지 않은 일을 상상합니다.\u003c/div>","segs":[{"n":9,"text":"In different circumstances, 다른 상황이었다면. I would have enjoyed that journey, 나는 그 여행을 즐겼을 텐데.. My legs were very tired and sore, 내 다리는 매우 피곤하고 아팠다.","hl":"ch"},{"n":10,"text":"두 번째 문장에서는 In different circumstances가 과거의 조건을 만들어요. 이 말은 if the circumstances had been different처럼 상황이 달랐더라면이라는 뜻이죠. 그래서 I would have enjoyed that journey가 그 조건의 결과로 이어집니다. would have 다음에 과거분사가 오면 과거 사실의 반대를 상상하는 표현이 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 \u003cspan class=\"fx\">In different circumstances, I would have enjoyed that journey\u003c/span>. My legs were very tired and sore.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>실제로는 다리가 너무 아파서 여행을 즐기지 못했다는 뜻이에요. 다른 상황이었다면 즐겼을 텐데라는 아쉬움을 담고 있습니다. 뒤 문장이 가정의 이유를 설명해 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">In different circumstances\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If the circumstances had been different\u003c/span>\u003cdiv class=\"w\">전치사구를 if절로 바꾸어 과거의 가정 조건을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I would have enjoyed that journey\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">I would have had a good time on that trip\u003c/span>\u003cdiv class=\"w\">enjoyed를 일상적인 have a good time으로 바꿔 말투를 부드럽게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">circumstances\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">conditions\u003c/span>\u003cspan class=\"y-eq\">circumstances = conditions\u003c/span>\u003cdiv class=\"w\">상황을 뜻하는 circumstances를 더 익숙한 conditions로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">enjoyed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">had a good time\u003c/span>\u003cspan class=\"y-eq\">enjoy = have a good time\u003c/span>\u003cdiv class=\"w\">즐겼다는 뜻을 회화적인 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">tired and sore\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">exhausted and aching\u003c/span>\u003cspan class=\"y-eq\">tired = exhausted, sore = aching\u003c/span>\u003cdiv class=\"w\">피곤함과 통증을 더 강한 어휘로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If the circumstances had been different, I would have had a good time on that journey. My legs were extremely tired and aching.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"실제로는 다리가 너무 피곤하고 아파서 그 여행을 즐기지 못했다는 뜻이에요. 다른 상황이었다면 분명 즐겼을 텐데라는 아쉬움이 담겨 있죠. 뒤 문장이 왜 그렇게 말하는지 이유를 설명해 줍니다.","hl":"mn"},{"n":12,"text":"In different circumstances는 If the circumstances had been different로 바꿔 쓸 수 있어요. enjoyed는 had a good time으로 바꾸면 더 편한 말투가 됩니다. 두 표현 모두 과거의 아쉬운 상상을 자연스럽게 전달해요.","hl":"rw"},{"n":13,"text":"circumstances는 conditions로 바꿀 수 있고, enjoyed는 had a good time으로 바꿀 수 있어요. tired and sore는 exhausted and aching처럼 더 강하게 표현할 수도 있습니다. 시험에서는 같은 뜻을 다른 어휘로 바꾸는 연습이 중요해요.","hl":"ph"},{"n":14,"text":"같은 뜻의 문장을 다시 읽어 볼게요. If the circumstances had been different, I would have had a good time on that journey. My legs were extremely tired and aching. 상황과 신체 상태의 의미가 그대로 전달되죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 Coronavirus is a completely different type of virus. \u003cspan class=\"fx\">Otherwise it would be called flu\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Coronavirus is a completely different type of virus.\u003c/div>\u003cdiv class=\"k\">코로나바이러스는 완전히 다른 형태의 바이러스이다.\u003c/div>\u003cdiv class=\"e\"> Otherwise it would be called flu.\u003c/div>\u003cdiv class=\"k\">그렇지 않다면 그것은 독감이라고 불릴 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Otherwise\u003c/b>는 '그렇지 않다면'이라는 뜻으로 앞 문장의 내용을 부정하는 가정 조건을 대신합니다. 그 결과 \u003cb class=\"key\">would be called\u003c/b>처럼 조동사 would가 쓰여 현재 사실과 반대되는 상상을 나타냅니다.\u003c/div>","segs":[{"n":15,"text":"Coronavirus is a completely different type of virus, 코로나바이러스는 완전히 다른 형태의 바이러스이다.. Otherwise it would be called flu, 그렇지 않다면 그것은 독감이라고 불릴 것이다.","hl":"ch"},{"n":16,"text":"세 번째 문장의 Otherwise는 그렇지 않다면이라는 뜻으로 앞 문장을 조건처럼 받아요. 그래서 Otherwise it would be called flu는 만약 그렇지 않다면 독감이라고 불렸을 거라는 상상이 됩니다. 여기서 would be called는 현재 사실과 반대되는 결과를 나타내죠. otherwise가 보이면 바로 앞 문장과 반대되는 조건을 떠올려 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 Coronavirus is a completely different type of virus. \u003cspan class=\"fx\">Otherwise it would be called flu\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>코로나는 독감과 완전히 다르기 때문에 독감이라고 불리지 않는다는 뜻입니다. 만약 같다면 독감이라는 이름으로 불렸을 거라는 재치 있는 설명이에요. otherwise가 앞 내용을 반대로 뒤집어 조건을 만들어 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Otherwise it would be called flu\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If it were not a completely different type, it would be called flu\u003c/span>\u003cdiv class=\"w\">otherwise를 if절로 풀어 앞 내용의 반대 조건을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Otherwise\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If that were not the case\u003c/span>\u003cdiv class=\"w\">otherwise의 뜻을 회화적인 if절 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a completely different type\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">an entirely different kind\u003c/span>\u003cspan class=\"y-eq\">completely = entirely, type = kind\u003c/span>\u003cdiv class=\"w\">완전히 다른 종류라는 뜻을 더 자연스러운 어구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be called\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be named\u003c/span>\u003cspan class=\"y-eq\">be called = be named\u003c/span>\u003cdiv class=\"w\">불리다라는 뜻을 이름 지어지다라는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">flu\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">influenza\u003c/span>\u003cspan class=\"y-eq\">flu = influenza\u003c/span>\u003cdiv class=\"w\">일상어 flu를 의학적이고 격식 있는 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Coronavirus is an entirely different kind of virus. If that were not the case, it would be named influenza.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"코로나는 독감과 완전히 다른 바이러스이기 때문에 독감이라고 불리지 않는다는 뜻이에요. 만약 코로나가 독감과 같았다면 독감이라는 이름으로 불렸을 거라는 재치 있는 설명이죠. otherwise가 앞 내용을 반대로 뒤집어 주는 역할을 합니다.","hl":"mn"},{"n":18,"text":"Otherwise는 If that were not the case로 바꿔 말할 수 있어요. 전체 문장은 If it were not a completely different type, it would be called flu처럼 바꿀 수 있죠. 이렇게 하면 조건이 더 또렷하게 보입니다.","hl":"rw"},{"n":19,"text":"a completely different type은 an entirely different kind로 바꿀 수 있어요. be called는 be named로 바꿀 수 있고, flu는 influenza로 격식 있게 바꿀 수도 있습니다. 같은 뜻을 다양한 어휘로 바꾸는 연습이 시험에 도움이 돼요.","hl":"ph"},{"n":20,"text":"이제 바꾼 문장을 읽어 볼게요. Coronavirus is an entirely different kind of virus. If that were not the case, it would be named influenza. 다른 종류라는 조건과 독감이라는 결과가 그대로 살아 있죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 \u003cspan class=\"fx\">Only a fool would ignore his past experience\u003c/span> when confronted with a new situation.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Only a fool\u003c/div>\u003cdiv class=\"k\">오직 바보만이\u003c/div>\u003cdiv class=\"e\"> would ignore his past experience\u003c/div>\u003cdiv class=\"k\">자신의 과거 경험을 무시할 것이다\u003c/div>\u003cdiv class=\"e\"> when confronted with a new situation.\u003c/div>\u003cdiv class=\"k\">새로운 상황에 직면했을 때\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Only a fool would + 동사원형\u003c/b>은 '오직 바보만이 ~할 것이다'라는 뜻으로, 일반적인 상상을 통해 강한 판단을 표현합니다. when confronted with는 when he is confronted with에서 he is가 생략된 \u003cb class=\"key\">분사구문\u003c/b>으로 조건의 상황을 보여 줍니다.\u003c/div>","segs":[{"n":21,"text":"Only a fool, 오직 바보만이. would ignore his past experience, 자신의 과거 경험을 무시할 것이다. when confronted with a new situation, 새로운 상황에 직면했을 때","hl":"ch"},{"n":22,"text":"네 번째 문장은 Only a fool would ignore로 시작해요. 이 표현은 오직 바보만이 무시할 것이라는 뜻으로, 일반적인 판단을 강하게 말하죠. when confronted with는 when he is confronted with에서 he is가 생략된 분사구문이에요. 그래서 새로운 상황에 직면했을 때라는 조건의 의미가 자연스럽게 붙습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 \u003cspan class=\"fx\">Only a fool would ignore his past experience\u003c/span> when confronted with a new situation.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>새로운 상황에서 과거 경험을 무시하는 사람은 바보라는 강한 충고입니다. would는 특정 과거가 아니라 어떤 상황에서도 그럴 것이라는 일반적 상상을 나타내요. 결국 경험을 잘 활용하라는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Only a fool would ignore\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">No sensible person would ignore\u003c/span>\u003cdiv class=\"w\">바보만이 무시할 것이다라는 표현을 반대 방향의 강조로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">when confronted with a new situation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">when facing a new situation\u003c/span>\u003cdiv class=\"w\">분사구문 confronted with를 더 쉬운 facing으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ignore\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">disregard\u003c/span>\u003cspan class=\"y-eq\">ignore = disregard\u003c/span>\u003cdiv class=\"w\">무시하다는 뜻을 더 격식 있는 disregard로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">confronted with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">faced with\u003c/span>\u003cspan class=\"y-eq\">confronted with = faced with\u003c/span>\u003cdiv class=\"w\">직면하다는 뜻을 더 일상적인 faced with로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">past experience\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">previous experience\u003c/span>\u003cspan class=\"y-eq\">past = previous\u003c/span>\u003cdiv class=\"w\">과거 경험을 뜻하는 표현을 previous experience로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">No sensible person would disregard his previous experience when facing a new situation.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"새로운 상황에서 과거 경험을 무시하는 사람은 바보라는 강한 충고예요. would는 어떤 상황에서도 그럴 것이라는 일반적인 상상을 나타냅니다. 결국 경험을 무시하지 말고 잘 활용하라는 뜻이죠.","hl":"mn"},{"n" \u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">We would not have had men on the Moon\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">We would not have sent people to the Moon\u003c/span>\u003cdiv class=\"w\">have had men을 sent people로 바꿔 의미를 더 직접적으로 전달했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">but for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">without\u003c/span>\u003cspan class=\"y-eq\">but for = without\u003c/span>\u003cdiv class=\"w\">만약 없었다면이라는 가정 표현을 without으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">made people think about it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">got people to think about it\u003c/span>\u003cspan class=\"y-eq\">make people think = get people to think\u003c/span>\u003cdiv class=\"w\">사람들이 생각하게 만들었다는 뜻을 get 사람 to think로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">men on the Moon\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">humans on the Moon\u003c/span>\u003cspan class=\"y-eq\">men = humans\u003c/span>\u003cdiv class=\"w\">인간을 뜻하는 men을 성별의 제한이 적은 humans로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If it had not been for Wells and Verne and the people who write about this and got people to think about it, we would not have sent humans to the Moon.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"웰스와 베른, 그리고 이런 이야기를 쓰고 사람들이 생각하게 만든 사람들이 없었다면 달에 인간을 보내지 못했을 거라는 뜻이에요. 상상과 글쓰기가 실제 과학 발전에 큰 힘을 주었다는 점을 강조합니다. but for 뒤의 사람들이 중요한 조건이 되는 거죠.","hl":"mn"},{"n":36,"text":"but for는 if it had not been for로 바꿔 말할 수 있어요. We would not have had men on the Moon은 We would not have sent people to the Moon처럼 더 직접적으로 바꿀 수도 있습니다. 두 표현 모두 과거의 반대 결과를 보여 줍니다.","hl":"rw"},{"n":37,"text":"but for는 without으로 바꿀 수 있어요. made people think about it은 got people to think about it으로 바꿔도 같은 뜻입니다. men on the Moon은 humans on the Moon으로 바꾸면 더 포괄적인 표현이 됩니다.","hl":"ph"},{"n":38,"text":"이제 바꾼 문장을 읽어 볼게요. If it had not been for Wells and Verne and the people who write about this and got people to think about it, we would not have sent humans to the Moon. 조건과 결과의 연결이 분명하죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 All great achievers in past ages possessed singleness of purpose without exception. \u003cspan class=\"fx\">Without it, Columbus wouldn't have started upon the voyage that made his name immortal\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">All great achievers in past ages\u003c/div>\u003cdiv class=\"k\">과거 시대의 모든 위대한 성취자들은\u003c/div>\u003cdiv class=\"e\"> possessed singleness of purpose\u003c/div>\u003cdiv class=\"k\">단일한 목적을 소유했다\u003c/div>\u003cdiv class=\"e\"> without exception.\u003c/div>\u003cdiv class=\"k\">예외 없이.\u003c/div>\u003cdiv class=\"e\"> Without it,\u003c/div>\u003cdiv class=\"k\">그것이 없었다면,\u003c/div>\u003cdiv class=\"e\"> Columbus wouldn't have started\u003c/div>\u003cdiv class=\"k\">콜럼버스는 시작하지 않았을 것이다\u003c/div>\u003cdiv class=\"e\"> upon the voyage\u003c/div>\u003cdiv class=\"k\">그 항해를\u003c/div>\u003cdiv class=\"e\"> that made his name immortal.\u003c/div>\u003cdiv class=\"k\">그의 이름을 불멸하게 만든\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Without it\u003c/b>은 '그것이 없었다면'이라는 가정 조건이고, it은 앞의 singleness of purpose를 가리킵니다. 결과 절에서 \u003cb class=\"key\">wouldn't have + 과거분사\u003c/b>가 쓰여 과거 사실의 반대를 표현합니다.\u003c/div>","segs":[{"n":39,"text":"All great achievers in past ages, 과거 시대의 모든 위대한 성취자들은. possessed singleness of purpose, 단일한 목적을 소유했다. without exception, 예외 없이.. Without it, 그것이 없었다면. Columbus wouldn't have started, 콜럼버스는 시작하지 않았을 것이다. upon the voyage, 그 항해를. that made his name immortal, 그의 이름을 불멸하게 만든","hl":"ch"},{"n":40,"text":"일곱 번째 문장에서는 Without it이 가정 조건을 만들어요. it은 앞에 나온 singleness of purpose, 즉 한 가지 목적에 집중하는 마음을 가리킵니다. 그래서 그것이 없었다면 콜럼버스는 그 항해를 시작하지 못했을 거라는 결과가 이어지죠. wouldn't have started는 과거 사실의 반대를 보여 주는 표현입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 All great achievers in past ages possessed singleness of purpose without exception. \u003cspan class=\"fx\">Without it, Columbus wouldn't have started upon the voyage that made his name immortal\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>위대한 성취자들은 예외 없이 한 가지 목적에 집중했고, 콜럼버스도 그런 집중력이 없었다면 이름을 남긴 항해를 시작하지 못했을 거라는 뜻입니다. 목적의 단일함이 큰 성취의 바탕임을 강조해요. wouldn't have started는 과거에 실제로는 시작했다는 사실을 전제로 합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Without it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If he had not had it\u003c/span>\u003cdiv class=\"w\">without it을 if절로 바꾸어 과거의 가정 조건을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">wouldn't have started upon the voyage\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">would not have set out on the voyage\u003c/span>\u003cdiv class=\"w\">started upon을 set out on으로 바꿔 항해를 시작했다는 뜻을 자연스럽게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">singleness of purpose\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">single-mindedness\u003c/span>\u003cspan class=\"y-eq\">singleness of purpose = single-mindedness\u003c/span>\u003cdiv class=\"w\">한 가지 목적에 집중하는 성질을 한 단어 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">without exception\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">with no exceptions\u003c/span>\u003cspan class=\"y-eq\">without exception = with no exceptions\u003c/span>\u003cdiv class=\"w\">예외 없이라는 뜻을 같은 의미의 구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">started upon\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">set out on\u003c/span>\u003cspan class=\"y-eq\">start upon = set out on\u003c/span>\u003cdiv class=\"w\">여행이나 항해를 시작하다는 뜻을 더 자연스러운 구동사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If he had not had that single-mindedness, Columbus would not have set out on the voyage that made his name immortal.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"위대한 성취자들은 예외 없이 한 가지 목적에 집중했고, 콜럼버스도 그런 집중력이 없었다면 이름을 남긴 항해를 시작하지 못했을 거라는 뜻이에요. 결국 목적의 단일함이 큰 성취의 바탕이라는 메시지죠. 실제로는 그가 항해를 시작했다는 사실을 전제로 합니다.","hl":"mn"},{"n":42,"text":"Without it은 If he had not had it으로 바꿔 과거의 조건을 더 분명히 할 수 있어요. started upon the voyage는 set out on the voyage로 바꾸면 더 자연스럽습니다. 의미는 그대로 유지됩니다.","hl":"rw"},{"n":43,"text":"singleness of purpose는 single-mindedness로 바꿀 수 있어요. without exception은 with no exceptions로 바꿀 수 있고, started upon은 set out on으로 바꿀 수 있습니다. 이런 표현은 독해와 영작 모두에 유용해요.","hl":"ph"},{"n":44,"text":"바꾼 문장을 읽어 볼게요. If he had not had that single-mindedness, Columbus would not have set out on the voyage that made his name immortal. 집중력과 항해의 인과 관계가 잘 드러나죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 A hundred years ago \u003cspan class=\"fx\">not a doctor in the world could have assured a patient that an operation would be painless\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A hundred years ago\u003c/div>\u003cdiv class=\"k\">백 년 전에는\u003c/div>\u003cdiv class=\"e\"> not a doctor in the world\u003c/div>\u003cdiv class=\"k\">세상의 어떤 의사도\u003c/div>\u003cdiv class=\"e\"> could have assured a patient\u003c/div>\u003cdiv class=\"k\">환자에게 장담할 수 없었을 것이다\u003c/div>\u003cdiv class=\"e\"> that an operation would be painless.\u003c/div>\u003cdiv class=\"k\">수술이 고통스럽지 않을 것이라고\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">could have + 과거분사\u003c/b>는 과거에 가능하지 않았던 일을 상상하거나 추측할 때 씁니다. not a doctor는 '어떤 의사도 ~않다'라는 강한 전체 부정이고, that절의 \u003cb class=\"key\">would be\u003c/b>는 수술의 결과에 대한 당시의 상상을 나타냅니다.\u003c/div>","segs":[{"n":45,"text":"A hundred years ago, 백 년 전에는. not a doctor in the world, 세상의 어떤 의사도. could have assured a patient, 환자에게 장담할 수 없었을 것이다. that an operation would be painless, 수술이 고통스럽지 않을 것이라고","hl":"ch"},{"n":46,"text":"여덟 번째 문장에서는 could have assured가 핵심이에요. could have 다음에 과거분사가 오면 과거에 가능하지 않았던 일을 상상하거나 추측하는 표현이 됩니다. not a doctor in the world는 어떤 의사도 없다는 강한 전체 부정이죠. that절의 would be painless는 수술 결과에 대한 당시의 상상을 보여 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 A hundred years ago \u003cspan class=\"fx\">not a doctor in the world could have assured a patient that an operation would be painless\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>백 년 전에는 어떤 의사도 수술이 전혀 아프지 않을 것이라고 환자에게 보장할 수 없었다는 뜻입니다. 당시 의학 수준으로는 그런 확신이 불가능했다는 점을 말해요. could have assured는 과거의 불가능을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not a doctor in the world could have assured\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">no doctor in the world could have guaranteed\u003c/span>\u003cdiv class=\"w\">not a doctor를 no doctor로 바꾸고 assured를 guaranteed로 바꿔 뜻을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">an operation would be painless\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">surgery would be free of pain\u003c/span>\u003cdiv class=\"w\">operation과 painless를 더 쉬운 표현으로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">assured\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">guaranteed\u003c/span>\u003cspan class=\"y-eq\">assure = guarantee\u003c/span>\u003cdiv class=\"w\">장담하다는 뜻을 더 강한 guarantee로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">painless\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">free of pain\u003c/span>\u003cspan class=\"y-eq\">painless = free of pain\u003c/span>\u003cdiv class=\"w\">고통이 없다는 뜻을 구로 풀어 설명했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not a doctor\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">no doctor\u003c/span>\u003cspan class=\"y-eq\">not a doctor = no doctor\u003c/span>\u003cdiv class=\"w\">전체 부정을 더 간결한 no로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A hundred years ago, no doctor in the world could have guaranteed a patient that surgery would be free of pain.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"백 년 전에는 어떤 의사도 수술이 전혀 아프지 않을 것이라고 환자에게 보장할 수 없었다는 뜻이에요. 당시 의학 수준으로는 그런 확신이 불가능했다는 점을 말하죠. could have assured는 과거의 불가능을 강하게 보여 줍니다.","hl":"mn"},{"n":48,"text":"not a doctor는 no doctor로 바꿔 더 간결하게 말할 수 있어요. assured는 guaranteed로 바꾸면 장담하다는 뜻이 더 강해집니다. painless는 free of pain으로 풀어 쓸 수도 있습니다.","hl":"rw"},{"n":49,"text":"assured는 guaranteed로, painless는 free of pain으로 바꿀 수 있어요. not a doctor는 no doctor로 바꾸면 전체 부정이 더 분명해집니다. 이런 표현은 문장 바꿔 쓰기 문제에 잘 나옵니다.","hl":"ph"},{"n":50,"text":"바꾼 문장을 읽어 볼게요. A hundred years ago, no doctor in the world could have guaranteed a patient that surgery would be free of pain. 과거의 불가능이 잘 드러나죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 \u003cspan class=\"fx\">Born in better times, he would have done credit to society\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Born in better times,\u003c/div>\u003cdiv class=\"k\">더 좋은 시대에 태어났더라면,\u003c/div>\u003cdiv class=\"e\"> he would have done credit to society.\u003c/div>\u003cdiv class=\"k\">그는 사회에 명예가 되었을 텐데.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Born in better times\u003c/b>는 If he had been born in better times에서 if와 he had been이 생략된 \u003cb class=\"key\">가정법 분사구문\u003c/b>입니다. 그 결과 \u003cb class=\"key\">would have + 과거분사\u003c/b>가 와서 과거 사실과 반대되는 결과를 나타냅니다.\u003c/div>","segs":[{"n":51,"text":"Born in better times, 더 좋은 시대에 태어났더라면. he would have done credit to society, 그는 사회에 명예가 되었을 텐데.","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 Born in better times로 시작해요. 이 표현은 If he had been born in better times에서 if와 he had been이 생략된 가정법 분사구문입니다. 그래서 더 좋은 시대에 태어났더라면이라는 조건이 됩니다. 뒤의 would have done credit은 그 조건의 결과를 나타내죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 \u003cspan class=\"fx\">Born in better times, he would have done credit to society\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>그가 더 좋은 시대에 태어났더라면 사회에 명예가 되는 사람이 되었을 거라는 뜻입니다. 실제로는 그렇지 못했다는 아쉬움을 담고 있어요. done credit to는 '~의 명예가 되다, 빛내다'라는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Born in better times\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If he had been born in better times\u003c/span>\u003cdiv class=\"w\">분사구문을 if절로 풀어 과거 가정 조건을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">done credit to society\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">brought honor to society\u003c/span>\u003cdiv class=\"w\">사회의 명예가 되다는 뜻을 bring honor to로 바꿔 쉽게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">done credit to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">brought honor to\u003c/span>\u003cspan class=\"y-eq\">do credit to = bring honor to\u003c/span>\u003cdiv class=\"w\">명예가 되다라는 뜻을 더 직관적인 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">better times\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a better era\u003c/span>\u003cspan class=\"y-eq\">better times = a better era\u003c/span>\u003cdiv class=\"w\">더 좋은 시대라는 뜻을 era를 써서 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">society\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the community\u003c/span>\u003cspan class=\"y-eq\">society = the community\u003c/span>\u003cdiv class=\"w\">사회라는 뜻을 공동체라는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If he had been born in a better era, he would have brought honor to society.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"그가 더 좋은 시대에 태어났더라면 사회에 명예가 되는 사람이 되었을 거라는 뜻이에요. 실제로는 그렇지 못했다는 아쉬움이 담겨 있죠. done credit to는 사회를 빛내다, 명예가 되다라는 뜻입니다.","hl":"mn"},{"n":54,"text":"Born in better times는 If he had been born in better times로 바꿔 조건을 분명히 할 수 있어요. done credit to society는 brought honor to society로 바꾸면 더 쉽게 이해됩니다. 두 표현 모두 과거의 아쉬운 상상을 전달합니다.","hl":"rw"},{"n":55,"text":"done credit to는 brought honor to로 바꿀 수 있어요. better times는 a better era로 바꿀 수 있고, society는 the community로 바꿀 수도 있습니다. 같은 뜻을 다양한 어휘로 익혀 두세요.","hl":"ph"},{"n":56,"text":"바꾼 문장을 읽어 볼게요. If he had been born in a better era, he would have brought honor to society. 시대와 명예라는 핵심 의미가 잘 살아 있죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 In the past it never occurred to me that every casual remark of mine would be snatched up and recorded. \u003cspan class=\"fx\">Otherwise I would have crept further into my shell\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">In the past\u003c/div>\u003cdiv class=\"k\">과거에는\u003c/div>\u003cdiv class=\"e\"> it never occurred to me\u003c/div>\u003cdiv class=\"k\">내게 결코 떠오르지 않았다\u003c/div>\u003cdiv class=\"e\"> that every casual remark of mine\u003c/div>\u003cdiv class=\"k\">나의 모든 무심코 한 말이\u003c/div>\u003cdiv class=\"e\"> would be snatched up and recorded.\u003c/div>\u003cdiv class=\"k\">잡아채여지고 기록될 것임이\u003c/div>\u003cdiv class=\"e\"> Otherwise\u003c/div>\u003cdiv class=\"k\">그렇지 않았다면\u003c/div>\u003cdiv class=\"e\"> I would have crept\u003c/div>\u003cdiv class=\"k\">나는 기어갔을 텐데\u003c/div>\u003cdiv class=\"e\"> further into my shell.\u003c/div>\u003cdiv class=\"k\">더 깊이 나의 껍질 속으로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Otherwise\u003c/b>는 앞 문장의 내용을 반대로 가정해 '그렇지 않았다면'이라는 조건을 만듭니다. 결과 절의 \u003cb class=\"key\">would have + 과거분사\u003c/b>는 과거에 실제로는 그렇게 하지 않았다는 사실과 반대되는 상상을 나타냅니다.\u003c/div>","segs":[{"n":57,"text":"In the past, 과거에는. it never occurred to me, 내게 결코 떠오르지 않았다. that every casual remark of mine, 나의 모든 무심코 한 말이. would be snatched up and recorded, 잡아채여지고 기록될 것임이. Otherwise, 그렇지 않았다면. I would have crept, 나는 기어갔을 텐데. further into my shell, 더 깊이 나의 껍질 속으로","hl":"ch"},{"n":58,"text":"열 번째 문장의 Otherwise는 앞 문장의 내용을 반대로 가정해요. 과거에는 내 말이 기록될 거라고 생각하지 못했고, 그렇지 않았다면 즉 그 사실을 알았다면 더 숨어 지냈을 거라는 뜻이죠. would have crept은 과거에 실제로는 그렇게 하지 않았다는 사실과 반대되는 상상을 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 In the past it never occurred to me that every casual remark of mine would be snatched up and recorded. \u003cspan class=\"fx\">Otherwise I would have crept further into my shell\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>과거에는 내 말이 기록될 거라고 전혀 생각하지 못했고, 만약 그걸 알았다면 더욱 숨어 지냈을 거라는 뜻입니다. 말이 기록될 수 있다는 사실에 대한 두려움이나 부담을 보여 줘요. crept into my shell은 '껍질 속으로 숨다'라는 비유입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Otherwise I would have crept further into my shell\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If I had known that, I would have withdrawn even more\u003c/span>\u003cdiv class=\"w\">otherwise를 if절로 풀고 비유 표현을 쉬운 말로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">every casual remark of mine\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">every offhand comment I made\u003c/span>\u003cdiv class=\"w\">무심코 한 말이라는 뜻을 더 자연스러운 회화 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">casual remark\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">offhand comment\u003c/span>\u003cspan class=\"y-eq\">casual remark = offhand comment\u003c/span>\u003cdiv class=\"w\">무심코 한 말이라는 뜻을 비슷한 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">snatched up\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">grabbed up\u003c/span>\u003cspan class=\"y-eq\">snatch up = grab up\u003c/span>\u003cdiv class=\"w\">잡아채다라는 뜻을 더 일상적인 grab up으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">crept into my shell\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">withdrawn into myself\u003c/span>\u003cspan class=\"y-eq\">creep into one's shell = withdraw into oneself\u003c/span>\u003cdiv class=\"w\">껍질 속으로 숨다는 비유를 마음을 닫는다는 뜻으로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">In the past, it never occurred to me that every offhand comment I made would be grabbed up and recorded. If I had known that, I would have withdrawn even more into myself.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"과거에는 내 말이 기록될 거라고 전혀 생각하지 못했어요. 만약 그걸 알았다면 더욱 숨어 지냈을 거라는 뜻이죠. 말이 기록될 수 있다는 사실에 대한 두려움이나 부담이 담겨 있습니다. crept into my shell은 껍질 속으로 숨는다는 비유예요.","hl":"mn"},{"n":60,"text":"Otherwise I would have crept further into my shell은 If I had known that, I would have withdrawn even more로 바꿀 수 있어요. every casual remark of mine은 every offhand comment I made로 바꾸면 더 자연스럽습니다. 비유를 풀어 주면 의미가 쉽게 다가옵니다.","hl":"rw"},{"n":61,"text":"casual remark는 offhand comment로 바꿀 수 있어요. snatched up은 grabbed up으로 바꿀 수 있고, crept into my shell은 withdrawn into myself로 풀어 쓸 수 있습니다. 비유 표현을 직설적으로 바꾸는 연습이 중요해요.","hl":"ph"},{"n":62,"text":"바꾼 문장을 읽어 볼게요. In the past, it never occurred to me that every offhand comment I made would be grabbed up and recorded. If I had known that, I would have withdrawn even more into myself. 두려움과 후회의 느낌이 잘 전달되죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tag 003c/span>\u003cspan class=\"y-eq\">in which = where\u003c/span>\u003cdiv class=\"w\">관계대명사 in which를 관계부사 where로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If I had the right software, I would be able to help students get a clear picture of society by showing on-screen the city where they live.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"좋은 소프트웨어가 있다면 학생들이 사는 도시를 화면에 보여 주어 사회를 더 구체적으로 이해하도록 도울 수 있다는 뜻이에요. could는 가능성이나 상상된 능력을 부드럽게 표현합니다. 실제로는 그 소프트웨어가 없다는 아쉬움이 담길 수도 있죠.","hl":"mn"},{"n":66,"text":"With the right software는 If I had the right software로 바꿔 조건을 분명히 할 수 있어요. I could help students는 I would be able to help students로 바꿔도 같은 뜻입니다. form a concrete idea는 get a clear picture로 바꾸면 더 쉽게 읽힙니다.","hl":"rw"},{"n":67,"text":"form a concrete idea는 get a clear picture로 바꿀 수 있어요. displaying은 showing으로 바꿀 수 있고, the city in which they live는 the city where they live로 바꿀 수 있습니다. 관계대명사와 관계부사의 전환도 함께 익혀 두세요.","hl":"ph"},{"n":68,"text":"바꾼 문장을 읽어 볼게요. If I had the right software, I would be able to help students get a clear picture of society by showing on-screen the city where they live. 조건과 수단이 자연스럽게 연결되죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Ironically, while many of us perceive insects as harmful pests—dangerous, ugly, and disease-ridden—in reality, \u003cspan class=\"fx\">without the service of pollination which they provide, humankind might cease to exist\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Ironically,\u003c/div>\u003cdiv class=\"k\">역설적이게도,\u003c/div>\u003cdiv class=\"e\"> while many of us perceive insects as harmful pests\u003c/div>\u003cdiv class=\"k\">우리 중 많은 사람들이 곤충을 해로운 해충으로 인지하는 반면에\u003c/div>\u003cdiv class=\"e\">—dangerous, ugly, and disease-ridden—\u003c/div>\u003cdiv class=\"k\">위험하고, 흉하고, 질병이 들끓는\u003c/div>\u003cdiv class=\"e\">in reality,\u003c/div>\u003cdiv class=\"k\">실제로는,\u003c/div>\u003cdiv class=\"e\"> without the service of pollination\u003c/div>\u003cdiv class=\"k\">수분의 공로가 없다면\u003c/div>\u003cdiv class=\"e\"> which they provide,\u003c/div>\u003cdiv class=\"k\">그들이 제공하는\u003c/div>\u003cdiv class=\"e\"> humankind might cease to exist.\u003c/div>\u003cdiv class=\"k\">인류는 존재하기를 멈출지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">without the service of pollination\u003c/b>은 '수분의 공로가 없다면'이라는 가정 조건이고, \u003cb class=\"key\">might + 동사원형\u003c/b>은 그 결과로 일어날 수 있는 가능성을 나타냅니다. while은 '~하는 반면에'로 많은 사람의 인식과 실제를 대조합니다.\u003c/div>","segs":[{"n":69,"text":"Ironically, 역설적이게도. while many of us perceive insects as harmful pests, 우리 중 많은 사람들이 곤충을 해로운 해충으로 인지하는 반면에. —dangerous, ugly, and disease-ridden—, 위험하고, 흉하고, 질병이 들끓는. in reality, 실제로는. without the service of pollination, 수분의 공로가 없다면. which they provide, 그들이 제공하는. humankind might cease to exist, 인류는 존재하기를 멈출지도 모른다.","hl":"ch"},{"n":70,"text":"열두 번째 문장은 while로 많은 사람의 인식과 실제를 대조해요. 많은 사람이 곤충을 해충으로 보는 반면에 실제로는 그들이 제공하는 수분이 없다면 인류가 존재하지 못할 수도 있다는 뜻이죠. without the service of pollination이 가정 조건을 만들고, might cease to exist가 그 결과의 가능성을 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Ironically, while many of us perceive insects as harmful pests—dangerous, ugly, and disease-ridden—in reality, \u003cspan class=\"fx\">without the service of pollination which they provide, humankind might cease to exist\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>많은 사람이 곤충을 위험한 해충으로 보지만, 실제로는 곤충이 제공하는 수분이 없으면 인류가 존재하지 못할 수도 있다는 뜻입니다. 곤충의 가치를 반전시켜 강조하는 문장이에요. might는 단정하지 않고 가능성으로 말합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">without the service of pollination which they provide\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">if it were not for the pollination service they provide\u003c/span>\u003cdiv class=\"w\">without 구문을 if it were not for로 풀어 가정 조건을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">humankind might cease to exist\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">humanity might not survive\u003c/span>\u003cdiv class=\"w\">cease to exist를 might not survive로 바꿔 더 직접적으로 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">perceive insects as harmful pests\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regard insects as harmful pests\u003c/span>\u003cspan class=\"y-eq\">perceive as = regard as\u003c/span>\u003cdiv class=\"w\">인지하다는 뜻을 regard as로 바꿔 같은 구조를 유지했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">disease-ridden\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">disease-carrying\u003c/span>\u003cspan class=\"y-eq\">disease-ridden = disease-carrying\u003c/span>\u003cdiv class=\"w\">질병이 들끓는이라는 뜻을 질병을 옮기는이라는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cease to exist\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">die out\u003c/span>\u003cspan class=\"y-eq\">cease to exist = die out\u003c/span>\u003cdiv class=\"w\">존재하기를 멈추다는 뜻을 더 간결한 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Ironically, although many of us regard insects as harmful pests that are dangerous, ugly, and disease-carrying, in fact, if it were not for the pollination service they provide, humanity might not survive.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"많은 사람이 곤충을 위험하고 흉하고 질병이 들끓는 해충으로 보지만, 실제로는 곤충이 제공하는 수분이 없으면 인류가 존재하지 못할 수도 있다는 뜻이에요. 곤충의 가치를 반전시켜 강조하는 문장이죠. might는 단정하지 않고 가능성으로 말합니다.","hl":"mn"},{"n":72,"text":"without the service of pollination은 if it were not for the pollination service로 바꿔 조건을 분명히 할 수 있어요. humankind might cease to exist는 humanity might not survive로 바꾸면 더 직접적입니다. 두 표현 모두 인류의 생존 가능성을 말하고 있죠.","hl":"rw"},{"n":73,"text":"perceive insects as harmful pests는 regard insects as harmful pests로 바꿀 수 있어요. disease-ridden은 disease-carrying으로 바꿀 수 있고, cease to exist는 die out으로 바꿀 수 있습니다. 긴 문장일수록 핵심 어구를 정확히 바꾸는 힘이 중요해요.","hl":"ph"},{"n":74,"text":"바꾼 문장을 읽어 볼게요. Ironically, although many of us regard insects as harmful pests that are dangerous, ugly, and disease-carrying, in fact, if it were not for the pollination service they provide, humanity might not survive. 곤충에 대한 인식과 실제의 대조가 선명하게 드러나죠.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">without\u003c/b>, \u003cb class=\"key\">otherwise\u003c/b>, \u003cb class=\"key\">but for\u003c/b>는 if절처럼 가정의 조건을 만듭니다.\u003c/li>\u003cli>현재나 미래의 반대는 \u003cb class=\"key\">would/could/might + 동사원형\u003c/b>으로 결과를 말합니다.\u003c/li>\u003cli>과거 사실의 반대는 \u003cb class=\"key\">would/could/might have + 과거분사\u003c/b>로 표현합니다.\u003c/li>\u003cli>긴 문장에서는 조건 표지와 \u003cb class=\"key\">조동사 + 동사\u003c/b>의 짝을 먼저 찾으면 구조가 보입니다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 마블레드 유닛에서 가정의 조건과 결과를 연결하는 표현을 배웠어요. without, otherwise, but for가 보이면 뒤에 오는 would, could, might를 함께 읽는 것이 핵심이에요. 현재의 반대는 would 다음 동사원형, 과거의 반대는 would have 다음 과거분사로 기억해 주세요. 이제 긴 문장에서도 조건과 결과를 스스로 찾아낼 수 있을 테니 수고 많았습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
