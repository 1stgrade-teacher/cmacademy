  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"unit07","title":"마법같은 블록구문 실전편 unit07 전치사구와 짝을 이루는 동사구문","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편 Unit 07 전치사구와 짝을 이루는 동사구문\u003c/div>\u003ch1>전치사구와 짝을 이루는 동사구문 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>전치사와 짝을 이루는 동사구문을 한 덩어리로 읽어 긴 문장도 빠르게 해석한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘은 마법같은 블록구문 실전편에서 전치사구와 짝을 이루는 동사구문을 함께 공부합니다. 영어 문장에서 동사와 전치사가 짝을 이루면 특별한 뜻이 되는 경우가 많아요. 오늘 예문 열두 개를 통해 이 구문들을 블록으로 잡는 연습을 해봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 Unit 07 전치사구와 짝을 이루는 동사구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">동사가 특정 전치사와 짝을 이루면 하나의 블록처럼 의미가 정해집니다. \u003cb class=\"key\">think of A as B\u003c/b>, \u003cb class=\"key\">prevent A from ing\u003c/b>, \u003cb class=\"key\">deprive A of B\u003c/b>처럼 전치사까지 한 덩어리로 외워야 해석이 빨라집니다. \u003cb class=\"key\">compare A to B\u003c/b>는 비유, \u003cb class=\"key\">compare A with B\u003c/b>는 비교로 의미가 달라진다는 점도 주의하세요.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Many experts in childhood development \u003cspan class=\"fx\">think of play as the &quot;work of children.&quot;\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 Pride \u003cspan class=\"fx\">prevents individuals from experiencing their true value or the true value of others.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 We can \u003cspan class=\"fx\">compare life to a roller coaster\u003c/span> because it has ups and downs, but it's your choice to scream or enjoy the ride.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Future generations \u003cspan class=\"fx\">may blame us for our wasteful ways\u003c/span>, but they can never collect on our debt to them.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Never \u003cspan class=\"fx\">deprive someone of hope\u003c/span>; it might be all they have.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 The competent, confident, and caring young adults \u003cspan class=\"fx\">saw themselves as the masters of their own fate and viewed negative events not as threats but as challenges and even opportunities\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 Movies \u003cspan class=\"fx\">provide us with the happy endings and the just solutions\u003c/span> that we cherish in our hearts.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 If you feel threatened every time a perceived rival does well, \u003cspan class=\"fx\">remind yourself of your own strengths and successes\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 Throughout history there have been efforts \u003cspan class=\"fx\">to distinguish the guilty from the innocent and to tell the liars from the truthful\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 Nothing can \u003cspan class=\"fx\">stop the man with the right mental attitude from achieving his goal\u003c/span>; nothing on earth can help the man with the wrong mental attitude.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11  Most scientists \u003cspan class=\"fx\">attribute extraordinary memory performance to an enhanced ability\u003c/span> to associate or organize the information to be memorized, rather than true photographic memory.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 When individuals have a true sense of self-worth, they do not need to \u003cspan class=\"fx\">compare themselves with others\u003c/span>, to tear others apart or feel superior.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘은 전치사구와 짝을 이루는 동사구문을 배웁니다. 동사만 보면 뜻이 잘 잡히지 않을 때가 많은데 뒤에 오는 전치사와 함께 하나의 블록으로 보면 됩니다. 예를 들어 think of A as B는 A를 B로 여기다라는 뜻이 되고 prevent A from ing는 누가 무엇 하는 것을 막다라는 뜻이 되죠. 이렇게 동사와 전치사를 묶어서 외워두면 문장이 훨씬 잘 보여요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Many experts in childhood development \u003cspan class=\"fx\">think of play as the &quot;work of children.&quot;\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Many experts in childhood development\u003c/div>\u003cdiv class=\"k\">많은 아동기 발달 전문가들은\u003c/div>\u003cdiv class=\"e\">think of play\u003c/div>\u003cdiv class=\"k\">놀이를 여긴다\u003c/div>\u003cdiv class=\"e\">as the &quot;work of children.&quot;\u003c/div>\u003cdiv class=\"k\">아이들의 일로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>동사 think가 of A as B와 짝을 이루어 \u003cb class=\"key\">think of A as B\u003c/b>는 A를 B로 여기다라는 뜻이 됩니다. 여기서 A는 play, B는 the &quot;work of children&quot;이에요.\u003c/div>","segs":[{"n":3,"text":"Many experts in childhood development, 많은 아동기 발달 전문가들은. think of play, 놀이를 여긴다. as the \"work of children.\", 아이들의 일로","hl":"ch"},{"n":4,"text":"이 문장에서는 think of A as B 구문이 쓰였어요. think of play as the work of children을 보면 A 자리에 play, B 자리에 the work of children이 들어가 있죠. 그래서 놀이를 아이들의 일로 여긴다고 해석하면 됩니다. 동사 think만 보지 말고 of와 as까지 한 덩어리로 보는 게 중요해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Many experts in childhood development \u003cspan class=\"fx\">think of play as the &quot;work of children.&quot;\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>아동 발달 전문가들은 놀이가 단순한 장난이 아니라 아이들의 본업이라고 여깁니다. 놀이를 통해 아이들이 배우고 성장한다는 중요한 의미를 담고 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">think of play as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regard play as\u003c/span>\u003cdiv class=\"w\">think of A as B를 좀 더 격식 있는 regard A as B로 바꾸면 같은 뜻이면서 문어체 느낌이 살아납니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as the &quot;work of children&quot;\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as children's work\u003c/span>\u003cdiv class=\"w\">the &quot;work of children&quot;에서 of 소유격을 children's로 바꾸어 더 자연스럽게 표현할 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">experts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">specialists\u003c/span>\u003cspan class=\"y-eq\">expert = specialist\u003c/span>\u003cdiv class=\"w\">전문가라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">development\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">growth\u003c/span>\u003cspan class=\"y-eq\">development = growth\u003c/span>\u003cdiv class=\"w\">발달과 성장을 뜻하는 말로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">think of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regard\u003c/span>\u003cspan class=\"y-eq\">think of ~ as = regard ~ as\u003c/span>\u003cdiv class=\"w\">~라고 여기다로 전환하는 대표적인 구문입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Many specialists in child development regard play as children's work.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 아동 발달 전문가들이 놀이를 아이들의 본업으로 본다는 뜻이에요. 아이들이 놀 때 그냥 시간을 보내는 것이 아니라 일하듯이 열심히 배우고 성장한다는 거죠. 놀이가 단순한 장난이 아니라 발달에 꼭 필요한 활동이라는 뉘앙스를 담고 있어요.","hl":"mn"},{"n":6,"text":"think of play as를 regard play as로 바꾸면 더 격식 있는 표현이 돼요. 또 the work of children은 children's work로 줄여서 자연스럽게 말할 수 있고요. 뜻은 그대로 놀이를 아이들의 일로 여긴다입니다.","hl":"rw"},{"n":7,"text":"expert는 specialist로, development는 growth로 바꿔 쓸 수 있어요. think of as는 regard as나 view as와 짝을 이루어 같은 의미를 나타내죠. 여기서 work of children은 아이들의 일이라는 뜻이니 children's work로도 표현합니다.","hl":"ph"},{"n":8,"text":"바꿔 쓴 문장을 읽어 볼게요. Many specialists in child development regard play as children's work. 원문보다 조금 더 간결하지만 아동 발달 전문가들이 놀이를 아이들의 일로 여긴다는 뜻은 그대로 잘 전달돼요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 Pride \u003cspan class=\"fx\">prevents individuals from experiencing their true value or the true value of others.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Pride\u003c/div>\u003cdiv class=\"k\">자만심은\u003c/div>\u003cdiv class=\"e\">prevents individuals\u003c/div>\u003cdiv class=\"k\">개인들을 막는다\u003c/div>\u003cdiv class=\"e\">from experiencing\u003c/div>\u003cdiv class=\"k\">경험하는 것으로부터\u003c/div>\u003cdiv class=\"e\">their true value or the true value of others.\u003c/div>\u003cdiv class=\"k\">자신들의 참된 가치 또는 다른 사람들의 참된 가치를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>prevent A from v-ing 구문으로 A가 v-ing 하는 것을 막다라는 뜻입니다. 여기서 A는 individuals이고, v-ing는 experiencing 이에요. \u003cb class=\"key\">prevent A from v-ing\u003c/b>를 한 블록으로 기억하세요.\u003c/div>","segs":[{"n":9,"text":"Pride, 자만심은. prevents individuals, 개인들을 막는다. from experiencing, 경험하는 것으로부터. their true value or the true value of others, 자신들의 참된 가치 또는 다른 사람들의 참된 가치를","hl":"ch"},{"n":10,"text":"여기서 prevent individuals from experiencing이 포인트예요. prevent A from ing 형태인데 A는 individuals, ing는 experiencing이죠. 자만심이 개인들이 경험하는 것을 막는다로 끊어 읽으면 됩니다. 이 구문은 prevent만 보고 흐름을 잡지 말고 from ing까지 함께 봐야 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 Pride \u003cspan class=\"fx\">prevents individuals from experiencing their true value or the true value of others.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자만심은 개인이 자기 자신의 진정한 가치나 타인의 진정한 가치를 경험하지 못하게 가로막습니다. 자신을 과대평가하면 상대의 가치도 제대로 보지 못하게 된다는 뜻이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">prevents individuals from experiencing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">keeps individuals from experiencing\u003c/span>\u003cdiv class=\"w\">prevent A from ing는 keep A from ing로 바꾸어도 거의 같은 뜻입니다. 다만 keep이 조금 더 일상적인 느낌이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">true value\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">real worth\u003c/span>\u003cdiv class=\"w\">true value에서 value 대신 worth를 쓰고 true 대신 real을 쓰면 같은 뜻의 자연스러운 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pride\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">arrogance\u003c/span>\u003cspan class=\"y-eq\">pride = arrogance\u003c/span>\u003cdiv class=\"w\">자만심, 교만을 뜻하는 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">individuals\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">people\u003c/span>\u003cspan class=\"y-eq\">individuals = people\u003c/span>\u003cdiv class=\"w\">개인들을 일반적인 사람들로 바꿔 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">true value\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">real worth\u003c/span>\u003cspan class=\"y-eq\">true value = real worth\u003c/span>\u003cdiv class=\"w\">참된 가치를 뜻하는 명사구입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Arrogance keeps people from realizing their real worth or the real worth of others.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 자만심이 사람들로 하여금 자신의 참된 가치와 다른 사람의 참된 가치를 경험하지 못하게 막는다는 뜻이에요. 자기 자신을 너무 높이면 타인의 진짜 가치도 보이지 않게 된다는 교훈을 담고 있죠.","hl":"mn"},{"n":12,"text":"prevents individuals from experiencing은 keeps individuals from experiencing으로 바꿔도 같은 뜻이에요. true value는 real worth로 바꾸면 참된 가치라는 뜻이 자연스럽게 살아나고요.","hl":"rw"},{"n":13,"text":"pride는 arrogance로, individuals는 people로 바꿔 쓸 수 있어요. true value는 real worth와 짝을 이뤄 참된 가치라는 뜻을 나타냅니다. prevent A from ing 구문은 keep A from ing나 stop A from ing와 함께 묶어 외우세요.","hl":"ph"},{"n":14,"text":"패러프레이징 문장을 읽어 볼게요. Arrogance keeps people from realizing their real worth or the real worth of others. 원문보다 단어가 쉬워졌지만 뜻은 그대로 자만심이 참된 가치를 경험하지 못하게 막는다는 내용이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 We can \u003cspan class=\"fx\">compare life to a roller coaster\u003c/span> because it has ups and downs, but it's your choice to scream or enjoy the ride.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We can compare life\u003c/div>\u003cdiv class=\"k\">우리는 인생을 비유할 수 있다\u003c/div>\u003cdiv class=\"e\">to a roller coaster\u003c/div>\u003cdiv class=\"k\">롤러코스터에\u003c/div>\u003cdiv class=\"e\">because it has ups and downs,\u003c/div>\u003cdiv class=\"k\">왜냐하면 그것은 기복이 있기 때문에\u003c/div>\u003cdiv class=\"e\">but it's your choice\u003c/div>\u003cdiv class=\"k\">그러나 그것은 당신의 선택이다\u003c/div>\u003cdiv class=\"e\">to scream or enjoy the ride.\u003c/div>\u003cdiv class=\"k\">비명을 지르거나 타는 것을 즐기는 것은\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>compare A to B 구문으로 A를 B에 비유하다라는 뜻입니다. A는 life, B는 a roller coaster예요. 첫 번째 it은 life를 가리키고, 두 번째 it은 to scream 이하를 대신하는 가주어입니다. \u003cb class=\"key\">compare A to B\u003c/b>에 주의하세요.\u003c/div>","segs":[{"n":15,"text":"We can compare life, 우리는 인생을 비유할 수 있다. to a roller coaster, 롤러코스터에. because it has ups and downs, 왜냐하면 그것은 기복이 있기 때문에. but it's your choice, 그러나 그것은 당신의 선택이다. to scream or enjoy the ride, 비명을 지르거나 타는 것을 즐기는 것은","hl":"ch"},{"n":16,"text":"이 문장에서는 compare life to a roller coaster가 나오는데 compare A to B 형태로 A를 B에 비유하다라는 뜻이에요. life는 A, a roller coaster는 B에 해당하죠. 뒤에 나오는 첫 번째 it은 life를 가리키고, 두 번째 it은 to scream 이하를 대신하는 가주어입니다. 이렇게 대명사가 가리키는 것을 구분하면서 읽어야 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 We can \u003cspan class=\"fx\">compare life to a roller coaster\u003c/span> because it has ups and downs, but it's your choice to scream or enjoy the ride.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인생을 롤러코스터에 비유한 문장입니다. 인생에는 오르막과 내리막이 있지만, 비명을 지를지 타는 것을 즐길지는 우리의 선택이라는 뜻이에요. 같은 상황도 태도에 따라 달라진다는 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">compare life to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">liken life to\u003c/span>\u003cdiv class=\"w\">비유하다는 뜻에서 compare A to B를 liken A to B로 바꾸면 더 문학적인 표현이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">it's your choice to scream or enjoy the ride\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">you can choose to scream or enjoy the ride\u003c/span>\u003cdiv class=\"w\">가주어 it 구문을 사람 주어 you can choose로 바꾸면 더 직접적이고 쉬운 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ups and downs\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">highs and lows\u003c/span>\u003cspan class=\"y-eq\">ups and downs = highs and lows\u003c/span>\u003cdiv class=\"w\">인생의 기복을 뜻하는 관용적 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">scream\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">yell\u003c/span>\u003cspan class=\"y-eq\">scream = yell\u003c/span>\u003cdiv class=\"w\">비명을 지르다, 소리치다의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">choice\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">option\u003c/span>\u003cspan class=\"y-eq\">choice = option\u003c/span>\u003cdiv class=\"w\">선택이라는 뜻을 가진 명사입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Life can be likened to a roller coaster because it has highs and lows, but you can choose to scream or enjoy the ride.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"인생을 롤러코스터에 비유한 문장이에요. 인생은 오르막과 내리막이 있지만 소리를 지를지 타는 것을 즐길지는 우리 선택이라는 뜻이죠. 똑같은 상황도 어떻게 받아들이느냐에 따라 달라진다는 긍정적인 메시지입니다.","hl":"mn"},{"n":18,"text":"compare life to는 liken life to로 바꾸면 더 문학적인 느낌이 들어요. it's your choice to scream or enjoy the ride는 you can choose to scream or enjoy the ride처럼 사람을 주어로 바꿔 말해도 뜻이 그대로 전달됩니다.","hl":"rw"},{"n":19,"text":"ups and downs는 highs and lows로 바꿔 기복이라는 뜻을 나타낼 수 있어요. scream은 yell과, choice는 option과 유의어 관계입니다. compare A to B는 비유할 때 쓰이고 compare A with B는 구체적인 비교를 할 때 쓰인다는 점도 함께 기억해 두세요.","hl":"ph"},{"n":20,"text":"이 문장을 바꿔 읽어 볼게요. Life can be likened to a roller coaster because it has highs and lows, but you can choose to scream or enjoy the ride. 원문보다 수동태가 들어갔지만 뜻은 자연스럽게 인생을 롤러코스터에 비유한 내용이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Future generations \u003cspan class=\"fx\">may blame us for our wasteful ways\u003c/span>, but they can never collect on our debt to them.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Future generations\u003c/div>\u003cdiv class=\"k\">미래 세대는\u003c/div>\u003cdiv class=\"e\">may blame us\u003c/div>\u003cdiv class=\"k\">우리를 비난할지도 모른다\u003c/div>\u003cdiv class=\"e\">for our wasteful ways,\u003c/div>\u003cdiv class=\"k\">우리의 낭비하는 방식에 대해\u003c/div>\u003cdiv class=\"e\">but they can never collect\u003c/div>\u003cdiv class=\"k\">그러나 그들은 결코 징수할 수 없다\u003c/div>\u003cdiv class=\"e\">on our debt to them.\u003c/div>\u003cdiv class=\"k\">그들에 대한 우리의 빚을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>blame A for B 구문으로 A를 B에 대해 비난하다라는 뜻입니다. A는 us, B는 our wasteful ways예요. \u003cb class=\"key\">blame A for B\u003c/b>를 한 덩어리로 봅니다.\u003c/div>","segs":[{"n":21,"text":"Future generations, 미래 세대는. may blame us, 우리를 비난할지도 모른다. for our wasteful ways, 우리의 낭비하는 방식에 대해. but they can never collect, 그러나 그들은 결코 징수할 수 없다. on our debt to them, 그들에 대한 우리의 빚을","hl":"ch"},{"n":22,"text":"blame us for our wasteful ways 부분에서 blame A for B 구문이 쓰였어요. A는 us, B는 our wasteful ways로 우리를 낭비하는 방식에 대해 비난하다는 뜻이죠. blame만 보지 말고 for와 함께 묶어서 해석해야 자연스러워요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Future generations \u003cspan class=\"fx\">may blame us for our wasteful ways\u003c/span>, but they can never collect on our debt to them.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>미래 세대는 우리의 낭비적인 생활 방식을 비난할 수 있지만, 우리가 그들에게 진 빚을 실제로 받아낼 수는 없습니다. 지금 세대가 환경이나 자원을 낭비한 대가를 미래 세대가 고스란히 떠안게 된다는 의미입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">blame us for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">criticize us for\u003c/span>\u003cdiv class=\"w\">blame A for B는 criticize A for B로 바꾸면 비난하다라는 뜻이 그대로 전달되면서 더 쉬운 동사가 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">wasteful ways\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">extravagant habits\u003c/span>\u003cdiv class=\"w\">낭비하는 방식을 extravagant habits로 바꾸면 사치스러운 습관이라는 뉘앙스가 더해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">generations\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">descendants\u003c/span>\u003cspan class=\"y-eq\">generations = descendants\u003c/span>\u003cdiv class=\"w\">후세대, 후손을 뜻하는 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">wasteful\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">extravagant\u003c/span>\u003cspan class=\"y-eq\">wasteful = extravagant\u003c/span>\u003cdiv class=\"w\">낭비하는, 사치스러운이라는 뜻의 형용사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">debt\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">obligation\u003c/span>\u003cspan class=\"y-eq\">debt = obligation\u003c/span>\u003cdiv class=\"w\">빚, 의무를 뜻하는 명사입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Future descendants may criticize us for our extravagant habits, but they can never recover what we owe them.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 미래 세대가 우리의 낭비적인 방식을 비난할 수는 있지만 우리가 그들에게 진 빚을 실제로 받아낼 수는 없다는 뜻이에요. 지금의 낭비가 미래 세대에게 돌이킬 수 없는 부담이 된다는 경고의 의미가 담겨 있죠.","hl":"mn"},{"n":24,"text":"blame us for는 criticize us for로 바꾸면 더 쉬운 동사로 같은 뜻을 나타낼 수 있어요. wasteful ways는 extravagant habits로 바꾸면 사치스러운 습관이라는 뉘앙스까지 살아나고요.","hl":"rw"},{"n":25,"text":"generation은 descendant로, wasteful은 extravagant로 바꿔 쓸 수 있어요. debt는 obligation과 유의어 관계이고 collect on은 recover로 바꾸면 받아내다라는 뜻이 됩니다. blame A for B는 criticize A for B와 함께 외워두세요.","hl":"ph"},{"n":26,"text":"바꿔 쓴 문장을 읽어 볼게요. Future descendants may criticize us for our extravagant habits, but they can never recover what we owe them. 원문의 빚을 징수하다가 빚을 회수하다로 바뀌었지만 뜻은 그대로 미래 세대가 우리의 낭비에 대한 대가를 받을 수 없다는 내용이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Never \u003cspan class=\"fx\">deprive someone of hope\u003c/span>; it might be all they have.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Never deprive someone of hope;\u003c/div>\u003cdiv class=\"k\">결코 어떤 사람에게서 희망을 빼앗지 마라\u003c/div>\u003cdiv class=\"e\">it might be all\u003c/div>\u003cdiv class=\"k\">그것은 전부일지도 모른다\u003c/div>\u003cdiv class=\"e\">they have.\u003c/div>\u003cdiv class=\"k\">그들이 가진\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>deprive A of B 구문으로 A에게서 B를 빼앗다라는 뜻입니다. A는 someone, B는 hope예요. all 다음에는 목적격 관계대명사 that이 생략되어 있습니다. \u003cb class=\"key\">deprive A of B\u003c/b>를 기억하세요.\u003c/div>","segs":[{"n":27,"text":"Never deprive someone of hope, 결코 어떤 사람에게서 희망을 빼앗지 마라. it might be all, 그것은 전부일지도 모른다. they have, 그들이 가진","hl":"ch"},{"n":28,"text":"여기서 deprive someone of hope가 핵심이에요. deprive A of B 형태로 누구에게서 무엇을 빼앗다라는 뜻인데 A는 someone, B는 hope입니다. all they have에서는 all 다음에 목적격 관계대명사 that이 생략되어 그들이 가진 전부라는 뜻이 돼요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Never \u003cspan class=\"fx\">deprive someone of hope\u003c/span>; it might be all they have.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>누군가에게서 희망을 절대 빼앗지 말라는 뜻입니다. 희망은 그 사람이 가진 전부일 수도 있기 때문에 소중히 다뤄야 한다는 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">deprive someone of hope\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">take hope away from someone\u003c/span>\u003cdiv class=\"w\">deprive A of B를 take B away from A로 바꾸면 더 쉬운 표현이 됩니다. 다만 deprive가 공식적인 느낌이라면 take away는 일상적입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">it might be all they have\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">it may be their only possession\u003c/span>\u003cdiv class=\"w\">all they have를 their only possession으로 바꾸면 유일한 소유물이라는 뜻이 분명해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">deprive someone of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">strip someone of\u003c/span>\u003cspan class=\"y-eq\">deprive A of B = strip A of B\u003c/span>\u003cdiv class=\"w\">빼앗다라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">hope\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">wish\u003c/span>\u003cspan class=\"y-eq\">hope = wish\u003c/span>\u003cdiv class=\"w\">희망, 소망을 뜻하는 명사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">all they have\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">their only possession\u003c/span>\u003cspan class=\"y-eq\">all they have = their only possession\u003c/span>\u003cdiv class=\"w\">그들이 가진 전부라는 뜻의 표현 전환입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Never take away hope from anyone; it may be their only possession.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"누군가에게서 희망을 절대 빼앗지 말라는 문장이에요. 희망이 그 사람이 가진 전부일 수도 있기 때문에 그만큼 소중한 것이라는 뜻이죠. 상대방에게 희망을 주는 것이 얼마나 중요한지 강조하고 있어요.","hl":"mn"},{"n":30,"text":"deprive someone of hope는 take hope away from someone으로 바꾸면 일상적인 표현이 돼요. it might be all they have는 it may be their only possession으로 바꾸면 유일한 소유물이라는 뜻이 더 명확해지고요.","hl":"rw"},{"n":31,"text":"deprive A of B는 strip A of B와 같은 형태로 빼앗다라는 뜻을 나타냅니다. hope는 wish와 유의어이고 all they have는 their only possession으로 전환하면 그들이 가진 전부라는 의미가 분명해져요.","hl":"ph"},{"n":32,"text":"이 문장을 바꿔 볼게요. Never take away hope from anyone; it may be their only possession. 원문의 deprive someone of hope가 take away hope from someone으로 바뀌었지만 누구에게서 희망을 빼앗지 말라는 뜻은 그대로 전달돼요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 The competent, confident, and caring young adults \u003cspan class=\"fx\">saw themselves as the masters of their own fate and viewed negative events not as threats but as challenges and even opportunities\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The competent, confident, and caring young adults\u003c/div>\u003cdiv class=\"k\">유능하고 자신감 있고 배려심 있는 젊은이들은\u003c/div>\u003cdiv class=\"e\">saw themselves as\u003c/div>\u003cdiv class=\"k\">그들 자신을 여겼다\u003c/div>\u003cdiv class=\"e\">the masters of their own fate\u003c/div>\u003cdiv class=\"k\">자기 운명의 주인으로\u003c/div>\u003cdiv class=\"e\">and viewed negative events\u003c/div>\u003cdiv class=\"k\">그리고 부정적인 사건들을 여겼다\u003c/div>\u003cdiv class=\"e\">not as threats\u003c/div>\u003cdiv class=\"k\">위협이 아니라\u003c/div>\u003cdiv class=\"e\">but as challenges and even opportunities.\u003c/div>\u003cdiv class=\"k\">도전과 심지어 기회로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>see A as B와 view A as B 구문으로 A를 B로 여기다라는 뜻입니다. saw themselves as에서 A는 themselves, B는 the masters...이고, viewed negative events에서는 A가 negative events, B가 challenges and even opportunities로 not as threats but as의 상관구문과 함께 쓰였습니다. \u003cb class=\"key\">see/view A as B\u003c/b>를 덩어리로 보세요.\u003c/div>","segs":[{"n":33,"text":"The competent, confident, and caring young adults, 유능하고 자신감 있고 배려심 있는 젊은이들은. saw themselves as, 그들 자신을 여겼다. the masters of their own fate, 자기 운명의 주인으로. and viewed negative events, 그리고 부정적인 사건들을 여겼다. not as threats, 위협이 아니라. but as challenges and even opportunities, 도전과 심지어 기회로","hl":"ch"},{"n":34,"text":"이 문장에는 see A as B와 view A as B 구문이 연달아 나옵니다. saw themselves as the masters of their own fate에서 A는 themselves, B는 the masters of their own fate로 자기 자신을 운명의 주인으로 여겼다는 뜻이에요. viewed negative events not as threats but as challenges and even opportunities에서는 A가 negative events, B가 challenges and even opportunities로 위협이 아니라 도전과 기회로 보았다는 뜻이죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 The competent, confident, and caring young adults \u003cspan class=\"fx\">saw themselves as the masters of their own fate and viewed negative events not as threats but as challenges and even opportunities\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>유능하고 자신감 있고 배려심 있는 젊은이들은 자신을 운명의 주인으로 여기고, 부정적인 사건을 위협이 아니라 도전과 기회로 받아들였습니다. 주체적인 태도와 긍정적 사고를 강조한 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">saw themselves as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regarded themselves as\u003c/span>\u003cdiv class=\"w\">see A as B는 regard A as B로 바꾸면 더 격식 있는 표현이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">viewed negative events not as threats but as challenges and even opportunities\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">considered negative events not as threats but as challenges and even opportunities\u003c/span>\u003cdiv class=\"w\">view A as B를 consider A as B로 바꾸면 같은 뜻이면서 더 많이 쓰는 동사가 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">competent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">capable\u003c/span>\u003cspan class=\"y-eq\">competent = capable\u003c/span>\u003cdiv class=\"w\">유능한이라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">destiny\u003c/span>\u003cspan class=\"y-eq\">fate = destiny\u003c/span>\u003cdiv class=\"w\">운명을 뜻하는 명사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">caring\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">compassionate\u003c/span>\u003cspan class=\"y-eq\">caring = compassionate\u003c/span>\u003cdiv class=\"w\">배려하는, 따뜻한이라는 뜻의 형용사입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The capable, confident, and compassionate young adults regarded themselves as the masters of their own destiny and considered negative events not as threats but as challenges and even opportunities.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"유능하고 자신감 있고 배려심 있는 젊은이들이 자기 운명의 주인은 자기 자신이라고 여겼고 부정적인 일도 위협이 아니라 도전과 기회로 받아들였다는 내용이에요. 주체적인 태도와 긍정적인 마음가짐이 중요하다는 메시지를 담고 있습니다.","hl":"mn"},{"n":36,"text":"saw themselves as는 regarded themselves as로 바꾸면 조금 더 격식 있는 표현이 돼요. viewed negative events not as threats but as challenges and even opportunities는 considered negative events not as threats but as challenges and even opportunities로 바꿔도 같은 뜻이에요.","hl":"rw"},{"n":37,"text":"competent는 capable, caring은 compassionate, fate는 destiny와 유의어 관계예요. see A as B와 view A as B, regard A as B, consider A as B는 모두 여기다라는 뜻으로 함께 외우면 좋습니다.","hl":"ph"},{"n":38,"text":"바꿔 쓴 문장을 읽어 볼게요. The capable, confident, and compassionate young adults regarded themselves as the masters of their own destiny and considered negative events not as threats but as challenges and even opportunities. 원문보다 단어는 다소 바뀌었지만 능력 있고 배려심 있는 젊은이들의 긍정적 태도를 그대로 보여줘요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 Movies \u003cspan class=\"fx\">provide us with the happy endings and the just solutions\u003c/span> that we cherish in our hearts.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Movies provide us with\u003c/div>\u003cdiv class=\"k\">영화는 우리에게 제공한다\u003c/div>\u003cdiv class=\"e\">the happy endings and the just solutions\u003c/div>\u003cdiv class=\"k\">행복한 결말과 정당한 해결책을\u003c/div>\u003cdiv class=\"e\">that we cherish in our hearts.\u003c/div>\u003cdiv class=\"k\">우리가 마음속에 간직하는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>provide A with B 구문으로 A에게 B를 제공하다라는 뜻입니다. A는 us, B는 the happy endings and the just solutions예요. provide B for A나 provide B to A로 바꿔 쓸 수도 있습니다. \u003cb class=\"key\">provide A with B\u003c/b>를 기억하세요.\u003c/div>","segs":[{"n":39,"text":"Movies provide us with, 영화는 우리에게 제공한다. the happy endings and the just solutions, 행복한 결말과 정당한 해결책을. that we cherish in our hearts, 우리가 마음속에 간직하는","hl":"ch"},{"n":40,"text":"provide us with the happy endings and the just solutions에서 provide A with B 구문이 쓰였어요. A는 us, B는 the happy endings and the just solutions로 우리에게 행복한 결말과 정당한 해결책을 제공한다는 뜻이죠. provide B for A나 provide B to A로 바꿔 말할 수 있다는 점도 알고 있으면 좋아요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 Movies \u003cspan class=\"fx\">provide us with the happy endings and the just solutions\u003c/span> that we cherish in our hearts.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>영화는 우리가 마음속에 간직하는 행복한 결말과 정의로운 해결책을 제공합니다. 현실에서는 얻기 어려운 만족을 영화가 대신 채워준다는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">provide us with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">offer us\u003c/span>\u003cdiv class=\"w\">provide A with B를 offer A B로 바꾸면 더 간결하게 제공하다라는 뜻을 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cherish in our hearts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">hold dear\u003c/span>\u003cdiv class=\"w\">마음속에 간직하다를 hold dear로 바꾸면 더 짧고 감정적인 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">happy endings\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">satisfying conclusions\u003c/span>\u003cspan class=\"y-eq\">happy endings = satisfying conclusions\u003c/span>\u003cdiv class=\"w\">행복한 결말을 뜻하는 표현 전환입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">just solutions\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fair resolutions\u003c/span>\u003cspan class=\"y-eq\">just solutions = fair resolutions\u003c/span>\u003cdiv class=\"w\">정당한 해결책을 뜻하는 유의어구입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cherish\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">treasure\u003c/span>\u003cspan class=\"y-eq\">cherish = treasure\u003c/span>\u003cdiv class=\"w\">소중히 여기다, 간직하다의 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Movies offer us the satisfying conclusions and fair resolutions that we treasure in our hearts.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"영화는 우리가 마음속에 품고 있는 행복한 결말과 정의로운 해결책을 제공한다는 뜻이에요. 현실에서는 완벽하게 이루어지기 힘든 것들을 영화가 대신 보여주며 우리에게 만족감을 준다는 의미입니다.","hl":"mn"},{"n":42,"text":"provide us with는 offer us로 바꾸면 더 간결하고 자연스러워요. cherish in our hearts는 hold dear로 바꾸면 마음속에 소중히 간직하다라는 뜻이 짧고 감동적으로 살아납니다.","hl":"rw"},{"n":43,"text":"happy endings는 satisfying conclusions, just solutions는 fair resolutions로 바꿔 쓸 수 있어요. cherish는 treasure와 유의어 관계입니다. provide A with B는 offer A B나 give A B로 바꿔도 뜻이 통하죠.","hl":"ph"},{"n":44,"text":"이 문장을 바꿔 볼게요. Movies offer us the satisfying conclusions and fair resolutions that we treasure in our hearts. 원문의 provide us with가 offer us로 바뀌었지만 영화가 우리에게 행복한 결말과 정의로운 해결책을 준다는 뜻은 그대로입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 If you feel threatened every time a perceived rival does well, \u003cspan class=\"fx\">remind yourself of your own strengths and successes\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If you feel threatened\u003c/div>\u003cdiv class=\"k\">당신이 위협받는다고 느낀다면\u003c/div>\u003cdiv class=\"e\">every time a perceived rival does well,\u003c/div>\u003cdiv class=\"k\">인지된 경쟁 상대가 잘할 때마다\u003c/div>\u003cdiv class=\"e\">remind yourself of\u003c/div>\u003cdiv class=\"k\">스스로에게 상기시켜라\u003c/div>\u003cdiv class=\"e\">your own strengths and successes.\u003c/div>\u003cdiv class=\"k\">당신 자신의 강점과 성공을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>remind A of B 구문으로 A에게 B를 상기시키다라는 뜻입니다. A는 yourself, B는 your own strengths and successes예요. \u003cb class=\"key\">remind A of B\u003c/b>를 블록으로 보면 해석이 빨라집니다.\u003c/div>","segs":[{"n":45,"text":"If you feel threatened, 당신이 위협받는다고 느낀다면. every time a perceived rival does well, 인지된 경쟁 상대가 잘할 때마다. remind yourself of, 스스로에게 상기시켜라. your own strengths and successes, 당신 자신의 강점과 성공을","hl":"ch"},{"n":46,"text":"이 문장에서는 remind yourself of your own strengths and successes가 핵심이에요. remind A of B 형태로 A에게 B를 상기시키다라는 뜻인데 A는 yourself, B는 your own strengths and successes입니다. 동사 remind가 나오면 of와 짝을 이뤄 무언가를 떠올리게 한다는 뜻으로 보세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 If you feel threatened every time a perceived rival does well, \u003cspan class=\"fx\">remind yourself of your own strengths and successes\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>경쟁 상대로 인식한 사람이 잘할 때마다 위협을 느낀다면, 자신의 강점과 성공을 떠올리라는 뜻입니다. 남과 비교하기보다 자기 자신의 좋은 점에 집중하라는 조언입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">remind yourself of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">call to mind\u003c/span>\u003cdiv class=\"w\">remind A of B는 call B to mind로 바꾸면 떠올리다라는 뜻이 더 직접적으로 드러납니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a perceived rival\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a competitor you perceive\u003c/span>\u003cdiv class=\"w\">과거분사 perceived가 포함된 명사구를 관계절 you perceive로 바꾸면 더 쉬운 구조가 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">perceived\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">imagined\u003c/span>\u003cspan class=\"y-eq\">perceived = imagined\u003c/span>\u003cdiv class=\"w\">인지된, 인식된의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rival\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">competitor\u003c/span>\u003cspan class=\"y-eq\">rival = competitor\u003c/span>\u003cdiv class=\"w\">경쟁 상대를 뜻하는 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">strengths\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">strong points\u003c/span>\u003cspan class=\"y-eq\">strengths = strong points\u003c/span>\u003cdiv class=\"w\">강점을 뜻하는 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If you feel threatened whenever a competitor you perceive does well, bring to mind your own abilities and achievements.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"만약 경쟁 상대라고 여기는 사람이 잘할 때마다 위협을 느낀다면 자신의 강점과 성공을 떠올리라는 뜻이에요. 다른 사람과 비교하기보다 자기 자신이 가진 좋은 점에 집중하라는 조언을 담고 있죠.","hl":"mn"},{"n":48,"text":"remind yourself of는 call to mind로 바꾸면 떠올리다라는 뜻이 더 직접적으로 느껴져요. a perceived rival는 a competitor you perceive처럼 관계절로 풀어 쓰면 구조가 더 쉬워집니다.","hl":"rw"},{"n":49,"text":"perceived는 imagined, rival은 competitor, strengths는 strong points로 바꿔 쓸 수 있어요. remind A of B는 bring B to mind와 같은 뜻으로 함께 외우면 좋습니다.","hl":"ph"},{"n":50,"text":"바꿔 쓴 문장을 읽어 볼게요. If you feel threatened whenever a competitor you perceive does well, bring to mind your own abilities and achievements. 원문보다 문장이 조금 더 길어졌지만 뜻은 그대로 자신의 강점과 성공을 떠올리라는 내용이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 Throughout history there have been efforts \u003cspan class=\"fx\">to distinguish the guilty from the innocent and to tell the liars from the truthful\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Throughout history\u003c/div>\u003cdiv class=\"k\">역사를 통틀어\u003c/div>\u003cdiv class=\"e\">there have been efforts\u003c/div>\u003cdiv class=\"k\">노력이 있어 왔다\u003c/div>\u003cdiv class=\"e\">to distinguish the guilty from the innocent\u003c/div>\u003cdiv class=\"k\">유죄인 사람들을 무죄인 사람들과 구별하려는\u003c/div>\u003cdiv class=\"e\">and to tell the liars from the truthful.\u003c/div>\u003cdiv class=\"k\">그리고 거짓말쟁이들을 진실된 사람들과 구별하려는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>distinguish A from B와 tell A from B 구문으로 A를 B와 구별하다라는 뜻입니다. the guilty와 the innocent처럼 the plus 형용사는 사람들을 나타내며, to distinguish 이하는 efforts를 수식하는 형용사구입니다. \u003cb class=\"key\">distinguish/tell A from B\u003c/b>를 묶어 보세요.\u003c/div>","segs":[{"n":51,"text":"Throughout history, 역사를 통틀어. there have been efforts, 노력이 있어 왔다. to distinguish the guilty from the innocent, 유죄인 사람들을 무죄인 사람들과 구별하려는. and to tell the liars from the truthful, 그리고 거짓말쟁이들을 진실된 사람들과 구별하려는","hl":"ch"},{"n":52,"text":"여기서 distinguish A from B와 tell A from B가 함께 쓰였습니다. distinguish the guilty from the innocent에서 A는 the guilty, B는 the innocent로 유죄인 사람들을 무죄인 사람들과 구별하다는 뜻이에요. the plus 형용사는 그런 사람들을 의미하고, to distinguish 이하는 efforts를 수식하는 형용사구로 쓰였습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 Throughout history there have been efforts \u003cspan class=\"fx\">to distinguish the guilty from the innocent and to tell the liars from the truthful\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>역사를 통틀어 유죄인 사람을 무죄인 사람과 구별하고 거짓말하는 사람을 진실한 사람과 구별하려는 노력이 있어 왔습니다. 정의와 진실을 밝히려는 인류의 오랜 노력을 말합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">distinguish A from B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">differentiate A from B\u003c/span>\u003cdiv class=\"w\">구별하다라는 뜻의 격식 있는 표현으로 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">tell the liars from the truthful\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">tell liars from truthful people\u003c/span>\u003cdiv class=\"w\">the plus 형용사를 일반 명사구로 바꾸면 더 명확해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">guilty\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">culpable\u003c/span>\u003cspan class=\"y-eq\">guilty = culpable\u003c/span>\u003cdiv class=\"w\">유죄의, 잘못이 있는이라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">innocent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">blameless\u003c/span>\u003cspan class=\"y-eq\">innocent = blameless\u003c/span>\u003cdiv class=\"w\">무죄의, 흠 없는이라는 뜻의 형용사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">efforts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">attempts\u003c/span>\u003cspan class=\"y-eq\">efforts = attempts\u003c/span>\u003cdiv class=\"w\">노력, 시도를 뜻하는 명사입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">All through history people have attempted to differentiate guilty people from innocent people and to tell liars from truthful people.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"역사를 통틀어 유죄인 사람을 무죄인 사람과 구별하고 거짓말쟁이를 진실한 사람과 구별하려는 노력이 있어 왔다는 뜻이에요. 인류가 정의와 진실을 밝히기 위해 오랫동안 애써 왔다는 의미를 담고 있어요.","hl":"mn"},{"n":54,"text":"distinguish A from B는 differentiate A from B로 바꾸면 더 격식 있는 표현이 돼요. the guilty와 the truthful 같은 the plus 형용사를 guilty people과 truthful people로 바꿔 말하면 뜻이 더 명확해지고요.","hl":"rw"},{"n":55,"text":"guilty는 culpable, innocent는 blameless, efforts는 attempts로 바꿔 쓸 수 있어요. distinguish A from B와 tell A from B, differentiate A from B는 모두 구별하다라는 뜻으로 함께 외우면 좋습니다.","hl":"ph"},{"n":56,"text":"이 문장을 바꿔 볼게요. All through history people have attempted to differentiate guilty people from innocent people and to tell liars from truthful people. 원문의 there have been efforts가 people have attempted로 바뀌었지만 인류의 오랜 구별 노력을 그대로 보여줘요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 Nothing can \u003cspan class=\"fx\">stop the man with the right mental attitude from achieving his goal\u003c/span>; nothing on earth can help the man with the wrong mental attitude.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Nothing can stop\u003c/div>\u003cdiv class=\"k\">어떤 것도 막을 수 없다\u003c/div>\u003cdiv class=\"e\">the man with the right mental attitude\u003c/div>\u003cdiv class=\"k\">올바른 정신적 태도를 가진 사람을\u003c/div>\u003cdiv class=\"e\">from achieving his goal;\u003c/div>\u003cdiv class=\"k\">자신의 목표를 성취하는 것으로부터\u003c/div>\u003cdiv class=\"e\">nothing on earth can help\u003c/div>\u003cdiv class=\"k\">지구상의 어떤 것도 도울 수 없다\u003c/div>\u003cdiv class=\"e\">the man with the wrong mental attitude.\u003c/div>\u003cdiv class=\"k\">잘못된 정신적 태도를 가진 사람을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>stop A from v-ing 구문으로 A가 v-ing 하는 것을 막다라는 뜻입니다. A는 the man with the right mental attitude이고, v-ing는 achieving his goal이에요. \u003cb class=\"key\">stop A from v-ing\u003c/b>를 전치사까지 한 덩어리로 봅니다.\u003c/div>","segs":[{"n":57,"text":"Nothing can stop, 어떤 것도 막을 수 없다. the man with the right mental attitude, 올바른 정신적 태도를 가진 사람을. from achieving his goal, 자신의 목표를 성취하는 것으로부터. nothing on earth can help, 지구상의 어떤 것도 도울 수 없다. the man with the wrong mental attitude, 잘못된 정신적 태도를 가진 사람을","hl":"ch"},{"n":58,"text":"이 문장에서는 stop the man with the right mental attitude from achieving his goal 부분에서 stop A from ing 구문이 쓰였어요. A는 the man with the right mental attitude로 올바른 태도를 가진 사람을 목표를 성취하는 것으로부터 막을 수 없다는 뜻이죠. stop만 보면 막다라는 뜻만 떠오르지만 from ing까지 함께 봐야 자연스럽게 해석됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 Nothing can \u003cspan class=\"fx\">stop the man with the right mental attitude from achieving his goal\u003c/span>; nothing on earth can help the man with the wrong mental attitude.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>올바른 정신적 태도를 가진 사람은 어떤 것도 목표 달성을 막을 수 없지만, 잘못된 태도를 가진 사람은 지구상의 어떤 것도 도울 수 없습니다. 토마스 제퍼슨의 말로 태도의 힘을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stop ... from achieving\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">prevent ... from achieving\u003c/span>\u003cdiv class=\"w\">stop A from ing는 prevent A from ing로 바꾸면 더 격식 있는 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">with the right mental attitude\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">with the right mindset\u003c/span>\u003cdiv class=\"w\">mental attitude를 mindset으로 바꾸면 더 현대적이고 짧은 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">mental attitude\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">mindset\u003c/span>\u003cspan class=\"y-eq\">mental attitude = mindset\u003c/span>\u003cdiv class=\"w\">정신적 태도를 뜻하는 명사구입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">achieve\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">accomplish\u003c/span>\u003cspan class=\"y-eq\">achieve = accomplish\u003c/span>\u003cdiv class=\"w\">성취하다의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">goal\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">aim\u003c/span>\u003cspan class=\"y-eq\">goal = aim\u003c/span>\u003cdiv class=\"w\">목표를 뜻하는 명사입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Nothing can prevent the man with the right mindset from accomplishing his goal; nothing on earth can help the man with the wrong mindset.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"올바른 정신적 태도를 가진 사람은 어느 누구도 목표 달성을 막을 수 없고, 잘못된 태도를 가진 사람은 세상의 어떤 것도 도울 수 없다는 뜻이에요. 토마스 제퍼슨의 말로 태도가 성공을 좌우한다는 강한 메시지를 담고 있죠.","hl":"mn"},{"n":60,"text":"stop A from ing는 prevent A from ing로 바꾸면 더 격식 있는 표현이 돼요. mental attitude는 mindset으로 바꾸면 더 짧고 현대적인 어감이 살아나고요.","hl":"rw"},{"n":61,"text":"mental attitude는 mindset, achieve는 accomplish, goal은 aim과 유의어 관계예요. stop A from ing와 prevent A from ing는 같은 뜻으로 함께 외우면 시험에 바로 쓸 수 있어요.","hl":"ph"},{"n":62,"text":"바꿔 쓴 문장을 읽어 볼게요. Nothing can prevent the man with the right mindset from accomplishing his goal; nothing on earth can help the man with the wrong mindset. 원문의 stop과 attitude가 바뀌었지만 태도가 성공을 좌우한다는 뜻은 그대로 유지돼요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11  Most scientists \u003cspan class=\"fx\">attribute extraordinary memory performance to an enhanced ability\u003c/span> to associate or organize the information to be memorized, rather than true photographic memory.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Most scientists attribute\u003c/div>\u003cdiv class=\"k\">대부분의 과학자들은 돌린다\u003c/div>\u003cdiv class=\"e\">extraordinary memory performance\u003c/div>\u003cdiv class=\"k\">비상한 기억 수행을\u003c/div>\u003cdiv class=\"e\">to an enhanced ability\u003c/div>\u003cdiv class=\"k\">향상된 능력의 덕으로\u003c/div>\u003cdiv class=\"e\">to associate or organize\u003c/div>\u003cdiv class=\"k\">연상하거나 조직화하는\u003c/div>\u003cdiv class=\"e\">the information to be memorized,\u003c/div>\u003cdiv class=\"k\">기억될 정보를\u003c/div>\u003cdiv class=\"e\">rather than true photographic memory.\u003c/div>\u003cdiv class=\"k\">사진처럼 선명한 진정한 기억력이라기보다는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>attribute A to B 구문으로 A를 B의 덕분으로 여기다라는 뜻입니다. A는 extraordinary memory performance, B는 an enhanced ability to associate or organize...이고, to associate 이하는 ability를 수식하는 형용사구입니다. \u003cb class=\"key\">attribute A to B\u003c/b>를 블록으로 보세요.\u003c/div>","segs":[{"n":63,"text":"Most scientists attribute, 대부분의 과학자들은 돌린다. extraordinary memory performance, 비상한 기억 수행을. to an enhanced ability, 향상된 능력의 덕으로. to associate or organize, 연상하거나 조직화하는. the information to be memorized, 기억될 정보를. rather than true photographic memory, 사진처럼 선명한 진정한 기억력이라기보다는","hl":"ch"},{"n":64,"text":"attribute extraordinary memory performance to an enhanced ability 부분에서 attribute A to B 구문이 쓰였어요. A는 extraordinary memory performance, B는 an enhanced ability to associate or organize the information to be memorized입니다. to associate 이하는 ability를 수식하는 형용사구로 기억될 정보를 연상하거나 조직화하는 향상된 능력이라는 뜻이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11  Most scientists \u003cspan class=\"fx\">attribute extraordinary memory performance to an enhanced ability\u003c/span> to associate or organize the information to be memorized, rather than true photographic memory.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>대부분의 과학자들은 비상한 기억력을 진짜 사진 기억력보다 정보를 연상하거나 조직화하는 향상된 능력 덕분으로 봅니다. 뛰어난 기억력은 타고난 사진 기억이 아니라 훈련된 조직화 능력에서 나온다는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">attribute A to B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">credit A to B\u003c/span>\u003cdiv class=\"w\">attribute A to B는 credit A to B로 바꾸면 공로를 돌리다라는 뜻이 더 분명해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">extraordinary memory performance\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">remarkable memory ability\u003c/span>\u003cdiv class=\"w\">extraordinary를 remarkable로, performance를 ability로 바꾸면 비상한 기억 능력이라는 뜻이 더 쉬워집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">extraordinary\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">exceptional\u003c/span>\u003cspan class=\"y-eq\">extraordinary = exceptional\u003c/span>\u003cdiv class=\"w\">비상한, 뛰어난의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">enhance\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">improve\u003c/span>\u003cspan class=\"y-eq\">enhance = improve\u003c/span>\u003cdiv class=\"w\">향상시키다라는 뜻의 동사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">associate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">connect\u003c/span>\u003cspan class=\"y-eq\">associate = connect\u003c/span>\u003cdiv class=\"w\">연상하다, 연결하다의 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Most scientists credit remarkable memory ability to an improved ability to connect or organize the information to be memorized, not to true photographic memory.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"대부분의 과학자들은 비상한 기억력이 진짜 사진 기억력이라기보다 정보를 연상하고 조직화하는 향상된 능력 덕분이라고 봅니다. 뛰어난 기억력이 타고난 사진 기억보다 훈련된 방법에서 나온다는 점을 설명해 주는 문장이에요.","hl":"mn"},{"n":66,"text":"attribute A to B는 credit A to B로 바꾸면 공로를 돌리다라는 뜻이 분명해져요. extraordinary memory performance는 remarkable memory ability로 바꾸면 더 쉬운 단어로 같은 뜻을 나타냅니다.","hl":"rw"},{"n":67,"text":"extraordinary는 exceptional, enhance는 improve, associate는 connect와 유의어 관계예요. photographic memory는 eidetic memory로 바꿔 쓸 수 있습니다. attribute A to B와 credit A to B는 함께 외우세요.","hl":"ph"},{"n":68,"text":"이 문장을 바꿔 볼게요. Most scientists credit remarkable memory ability to an improved ability to connect or organize the information to be memorized, not to true photographic memory. 원문의 attribute가 credit으로 바뀌었지만 기억력의 원인을 연상과 조직화 능력으로 본다는 뜻은 그대로예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 When individuals have a true sense of self-worth, they do not need to \u003cspan class=\"fx\">compare themselves with others\u003c/span>, to tear others apart or feel superior.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">When individuals have\u003c/div>\u003cdiv class=\"k\">개인들이 가질 때\u003c/div>\u003cdiv class=\"e\">a true sense of self-worth,\u003c/div>\u003cdiv class=\"k\">진정한 의미의 자아 존중감을\u003c/div>\u003cdiv class=\"e\">they do not need\u003c/div>\u003cdiv class=\"k\">그들은 필요가 없다\u003c/div>\u003cdiv class=\"e\">to compare themselves with others,\u003c/div>\u003cdiv class=\"k\">스스로를 다른 사람들과 비교할\u003c/div>\u003cdiv class=\"e\">to tear others apart\u003c/div>\u003cdiv class=\"k\">다른 사람들을 헐뜯을\u003c/div>\u003cdiv class=\"e\">or feel superior.\u003c/div>\u003cdiv class=\"k\">또는 우월하다고 느낄\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>compare A with B 구문으로 A를 B와 비교하다라는 뜻입니다. A는 themselves, B는 others예요. compare A to B와 달리 with는 같은 부류를 구체적으로 비교할 때 씁니다. \u003cb class=\"key\">compare A with B\u003c/b>를 기억하세요.\u003c/div>","segs":[{"n":69,"text":"When individuals have, 개인들이 가질 때. a true sense of self-worth, 진정한 의미의 자아 존중감을. they do not need, 그들은 필요가 없다. to compare themselves with others, 스스로를 다른 사람들과 비교할. to tear others apart, 다른 사람들을 헐뜯을. or feel superior, 또는 우월하다고 느낄","hl":"ch"},{"n":70,"text":"이 문장에서는 compare themselves with others 부분에 compare A with B 구문이 쓰였어요. A는 themselves, B는 others로 자신을 다른 사람들과 비교하다는 뜻입니다. compare A with B는 구체적인 비교를 할 때 쓰이고 compare A to B는 비유할 때 쓰인다는 차이도 알아두세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 When individuals have a true sense of self-worth, they do not need to \u003cspan class=\"fx\">compare themselves with others\u003c/span>, to tear others apart or feel superior.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>개인이 진정한 자아 존중감을 가지면 자신을 다른 사람과 비교하거나 상대를 헐뜯거나 우월감을 느낄 필요가 없습니다. 자존감이 높은 사람은 비교와 공격에서 자유롭다는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">compare themselves with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">measure themselves against\u003c/span>\u003cdiv class=\"w\">compare A with B를 measure A against B로 바꾸면 비교 잣대를 든다는 뉘앙스가 살아납니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">tear others apart\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">put others down\u003c/span>\u003cdiv class=\"w\">헐뜯다는 뜻의 tear apart를 put down으로 바꾸면 더 구어적인 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">self-worth\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">self-esteem\u003c/span>\u003cspan class=\"y-eq\">self-worth = self-esteem\u003c/span>\u003cdiv class=\"w\">자아 존중감을 뜻하는 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">tear apart\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rip to pieces\u003c/span>\u003cspan class=\"y-eq\">tear apart = rip to pieces\u003c/span>\u003cdiv class=\"w\">헐뜯다, 찢어 놓다의 유의어구입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">superior\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">better\u003c/span>\u003cspan class=\"y-eq\">superior = better\u003c/span>\u003cdiv class=\"w\">우월한, 더 나은의 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">When people have genuine self-esteem, they do not need to measure themselves against others, to put others down or feel better than others.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"개인이 진정한 자아 존중감을 가지면 자신을 다른 사람과 비교하거나 상대를 헐뜯거나 우월하다고 느낄 필요가 없다는 뜻이에요. 자존감이 높은 사람은 비교와 공격에서 자유롭고 편안한 태도를 가진다는 메시지를 담고 있어요.","hl":"mn"},{"n":72,"text":"compare themselves with는 measure themselves against로 바꾸면 어떤 잣대로 비교하는지가 더 잘 드러나요. tear others apart는 put others down으로 바꾸면 더 구어적이고 자연스러운 표현이 됩니다.","hl":"rw"},{"n":73,"text":"self-worth는 self-esteem, tear apart는 rip to pieces, superior는 better와 유의어 관계예요. compare A with B는 measure A against B와 같은 뜻으로 함께 외우면 좋습니다.","hl":"ph"},{"n":74,"text":"바꿔 쓴 문장을 읽어 볼게요. When people have genuine self-esteem, they do not need to measure themselves against others, to put others down or feel better than others. 원문의 individuals가 people로, self-worth가 self-esteem으로 바뀌었지만 자존감이 높으면 비교와 공격에서 자유롭다는 뜻은 그대로입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 Unit 07 전치사구와 짝을 이루는 동사구문\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">think of A as B\u003c/b>, \u003cb class=\"key\">see/view A as B\u003c/b>, \u003cb class=\"key\">regard A as B\u003c/b>는 A를 B로 여기다.\u003c/li>\u003cli>\u003cb class=\"key\">prevent/stop/keep A from ing\u003c/b>은 A가 ~하는 것을 막다.\u003c/li>\u003cli>\u003cb class=\"key\">deprive A of B\u003c/b>, \u003cb class=\"key\">remind A of B\u003c/b>, \u003cb class=\"key\">provide A with B\u003c/b>는 전치사와 짝을 이뤄 뜻이 정해진다.\u003c/li>\u003cli>\u003cb class=\"key\">compare A to B\u003c/b>는 A를 B에 비유하다, \u003cb class=\"key\">compare A with B\u003c/b>는 A를 B와 비교하다.\u003c/li>\u003cli>\u003cb class=\"key\">distinguish/tell A from B\u003c/b>는 A를 B와 구별하다, \u003cb class=\"key\">attribute A to B\u003c/b>는 A를 B의 덕분으로 여기다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘 전치사와 짝을 이루는 동사구문들을 정리해 볼게요. think of A as B와 see A as B는 무엇을 무엇으로 여기다라는 뜻이고, prevent A from ing와 stop A from ing는 누가 무엇 하는 것을 막다라는 뜻이에요. deprive A of B는 누구에게서 무엇을 빼앗다, remind A of B는 누구에게 무엇을 상기시키다, provide A with B는 누구에게 무엇을 제공하다라는 뜻이죠. 이제 전치사만 봐도 동사와 한 덩어리로 반응하는 연습을 하면 좋아요. 오늘 수고 많았습니다.","hl":"sum"}]}]});</script></body></html>
