    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

lecturePlayer(document.getElementById("app"),{"brand":"unit09","title":"마법같은 블록구문 실전편 Unit 09 수동태 구문","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>마법같은 블록구문 실전편: 수동태를 덩어리로 읽는 12문장\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>수동태 be동사 + 과거분사 블록을 정확히 보고, 조동사·진행형·완료형과 결합한 수동태까지 자연스럽게 해석한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 수동태 구문을 집중적으로 훈련해 보겠습니다. 수동태는 주어가 동작을 당하거나 어떤 상태에 놓이는 표현으로, be동사와 과거분사가 한 블록처럼 붙어 다녀요. 예문 열두 개를 같이 끊어 읽으면서 수동태 블록을 빠르게 찾아내는 힘을 길러 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">수동태의 기본 블록은 \u003cb class=\"key\">be동사 + 과거분사\u003c/b>이다. 조동사가 있으면 \u003cb class=\"key\">조동사 + be + 과거분사\u003c/b>, 진행형은 \u003cb class=\"key\">be being + 과거분사\u003c/b>, 완료형은 \u003cb class=\"key\">have been + 과거분사\u003c/b>처럼 be동사 부분이 변한다. 수동태 뒤에는 행위자 by나 평가·명명을 나타내는 as, 보어가 이어져 주어의 상태와 의미를 완성한다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 We \u003cspan class=\"fx\">are all now connected by the Internet\u003c/span>, like neurons in a giant brain.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 Solar power and wind power \u003cspan class=\"fx\">are considered alternatives\u003c/span> to fossil-fuel-based energy generation.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 The best and most beautiful things in the world \u003cspan class=\"fx\">cannot be seen or even touched. They must be felt with the heart\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Unfortunately, the rain forests \u003cspan class=\"fx\">are being cut down\u003c/span> at a shocking rate to provide humans with lumber, pasture land, and farm land.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Geysers \u003cspan class=\"fx\">have often been compared to volcanoes\u003c/span> because they both emit hot liquids from below the Earth's surface.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Information \u003cspan class=\"fx\">is extracted or learned from sources of data, and this captured information is then transformed into knowledge that is eventually used to trigger actions or decisions\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 Genetic tendencies toward intelligence, sociability, and aggression \u003cspan class=\"fx\">can be stimulated, controlled, or suppressed by parental response and other environmental influences\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Hacking \u003cspan class=\"fx\">is commonly described as the act\u003c/span> of re-designing the configuration of hardware or software systems to alter their intended function.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">It is estimated that we have characterized only one percent of all bacterial species that exist\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 Test papers \u003cspan class=\"fx\">may not be taken out of the examination room\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Don't judge people by their covers. Most of their books \u003cspan class=\"fx\">are still being written\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Confirmed scientific theories \u003cspan class=\"fx\">are often referred to as &quot;laws of nature&quot; or &quot;laws of physics.&quot;\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘 핵심은 수동태입니다. 주어가 어떤 동작을 당하거나 상태에 놓일 때 be동사와 과거분사를 붙여서 씁니다. 조동사나 진행형, 완료형이 오면 be동사의 위치와 형태가 바뀌면서 각각 다른 v>\u003cdiv class=\"y-sen sm\">02 Solar power and wind power \u003cspan class=\"fx\">are considered alternatives\u003c/span> to fossil-fuel-based energy generation.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>태양광과 풍력이 화석연료 기반 발전을 대체할 에너지원으로 여겨진다는 뜻이다. 사람들의 인식이나 평가에 초점을 맞춘 문장이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Solar power and wind power are considered alternatives\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">People consider solar power and wind power alternatives\u003c/span>\u003cdiv class=\"w\">능동태로 바꾸면 판단 주체 people을 넣어 의미를 명확히 한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are considered alternatives\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are regarded as alternatives\u003c/span>\u003cdiv class=\"w\">consider A B와 같은 평가 표현을 regard A as B로 바꿀 수 있다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">solar power\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">solar energy\u003c/span>\u003cspan class=\"y-eq\">solar power = solar energy\u003c/span>\u003cdiv class=\"w\">태양 에너지를 뜻하는 두 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fossil-fuel-based energy generation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">energy generation based on fossil fuels\u003c/span>\u003cspan class=\"y-eq\">fossil-fuel-based = based on fossil fuels\u003c/span>\u003cdiv class=\"w\">전치사구 후치수식으로 바꾼 구조이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">alternatives\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">alternative sources\u003c/span>\u003cspan class=\"y-eq\">alternatives = alternative sources\u003c/span>\u003cdiv class=\"w\">에너지원이라는 의미를 분명히 하는 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Solar power and wind power are regarded as alternatives to energy generation based on fossil fuels.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"태양광과 풍력이 화석 연료 기반 에너지 생산의 대안으로 여겨진다는 뜻이에요. 사람들이 그렇게 생각하고 있다는 평가의 의미가 담겨 있고, 어떤 에너지원이 대안인지 상태를 설명하는 문장이죠.","hl":"mn"},{"n":12,"text":"are considered alternatives를 are regarded as alternatives로 바꿔 쓸 수 있어요. consider 대신 regard를 쓰면 as를 꼭 붙여야 한다는 차이가 있죠. 능동태로 바꾸면 People consider solar power and wind power alternatives가 됩니다.","hl":"rw"},{"n":13,"text":"solar power는 solar energy라고 해도 같은 뜻이에요. fossil-fuel-based energy generation은 energy generation based on fossil fuels로 바꿀 수 있어요. alternatives 대신 alternative sources를 쓰면 에너지원이라는 의미가 더 분명해집니다.","hl":"ph"},{"n":14,"text":"전체를 같은 뜻으로 바꾸면 Solar power and wind power are regarded as alternatives to energy generation based on fossil fuels라고 할 수 있어요. 수동태와 전치사구를 살짝 바꾸었을 뿐 원문의 평가 의미는 그대로입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 The best and most beautiful things in the world \u003cspan class=\"fx\">cannot be seen or even touched. They must be felt with the heart\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The best and most beautiful things in the world\u003c/div>\u003cdiv class=\"k\">세상에서 가장 훌륭하고 아름다운 것들은\u003c/div>\u003cdiv class=\"e\"> cannot be seen\u003c/div>\u003cdiv class=\"k\"> 보여질 수 없다\u003c/div>\u003cdiv class=\"e\"> or even touched.\u003c/div>\u003cdiv class=\"k\"> 심지어 만져질 수도 없다\u003c/div>\u003cdiv class=\"e\"> They\u003c/div>\u003cdiv class=\"k\"> 그것들은\u003c/div>\u003cdiv class=\"e\"> must be felt\u003c/div>\u003cdiv class=\"k\"> 느껴져야 한다\u003c/div>\u003cdiv class=\"e\"> with the heart.\u003c/div>\u003cdiv class=\"k\"> 마음으로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">cannot be seen\u003c/b>과 \u003cb class=\"key\">must be felt\u003c/b>는 조동사가 수동태에 결합한 형태이다. cannot은 부정 조동사, must는 강한 필요를 나타내며 be동사 뒤에 과거분사가 온다.\u003c/div>","segs":[{"n":15,"text":"The best and most beautiful things in the world, 세상에서 가장 훌륭하고 아름다운 것들은. cannot be seen, 보여질 수 없다. or even touched, 심지어 만져질 수도 없다. They, 그것들은. must be felt, 느껴져야 한다. with the heart, 마음으로","hl":"ch"},{"n":16,"text":"세 번째 문장은 조동사와 수동태가 만난 구조입니다. cannot be seen은 볼 수 없다, must be felt는 느껴져야 한다로 해석해요. 조동사가 be동사 앞에 오고 그 뒤에 과거분사가 붙는 순서를 잡아 두면 문장이 술술 읽혀요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 The best and most beautiful things in the world \u003cspan class=\"fx\">cannot be seen or even touched. They must be felt with the heart\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>진짜 소중한 것은 눈으로 보거나 손으로 만질 수 없고 마음으로 느껴야 한다는 뜻이다. 물질보다 감정과 의미의 중요성을 강조하는 문장이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cannot be seen or even touched\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are not able to be seen or even touched\u003c/span>\u003cdiv class=\"w\">cannot을 be able to의 부정으로 바꿔 불가능을 더 격식 있게 표현한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">must be felt with the heart\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have to be felt with the heart\u003c/span>\u003cdiv class=\"w\">must의 필요 의미를 have to로 바꾼 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the best and most beautiful things\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the finest and most beautiful things\u003c/span>\u003cspan class=\"y-eq\">best = finest\u003c/span>\u003cdiv class=\"w\">최상급 동의어로 바꾼 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cannot be seen\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are invisible\u003c/span>\u003cspan class=\"y-eq\">cannot be seen = are invisible\u003c/span>\u003cdiv class=\"w\">수동태를 형용사로 바꿔 상태를 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">even touched\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">even felt by hand\u003c/span>\u003cspan class=\"y-eq\">touched = felt by hand\u003c/span>\u003cdiv class=\"w\">촉각을 강조한 풀이이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The finest and most beautiful things in the world are invisible and cannot be touched; they must be felt with the heart.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"세상에서 가장 아름답고 소중한 것은 눈으로 보거나 손으로 만질 수 없고 마음으로 느껴야 한다는 뜻이에요. 보이는 것보다 보이지 않는 가치가 더 중요하다는 메시지를 담고 있죠.","hl":"mn"},{"n":18,"text":"cannot be seen은 are not able to be seen으로 바꾸면 불가능의 의미가 격식 있게 표현돼요. must be felt는 have to be felt로 바꿔도 필요의 의미가 유지됩니다. 조동사만 바뀌었을 뿐 수동태 구조는 그대로라는 점에 유의하세요.","hl":"rw"},{"n":19,"text":"the best는 the finest로 바꿔 쓸 수 있어요. cannot be seen은 are invisible처럼 형용사로 전환하면 더 짧게 상태를 표현할 수 있습니다. touched는 felt by hand로 풀어서 촉각의 의미를 분명히 할 수 있어요.","hl":"ph"},{"n":20,"text":"같은 뜻으로 바꾸면 The finest and most beautiful things in the world are invisible and cannot be touched, they must be felt with the heart라고 할 수 있습니다. cannot be seen을 invisible로 압축했지만 의미는 그대로예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Unfortunately, the rain forests \u003cspan class=\"fx\">are being cut down\u003c/span> at a shocking rate to provide humans with lumber, pasture land, and farm land.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Unfortunately,\u003c/div>\u003cdiv class=\"k\">불행하게도\u003c/div>\u003cdiv class=\"e\"> the rain forests\u003c/div>\u003cdiv class=\"k\"> 열대 우림은\u003c/div>\u003cdiv class=\"e\"> are being cut down\u003c/div>\u003cdiv class=\"k\"> 벌채되고 있는 중이다\u003c/div>\u003cdiv class=\"e\"> at a shocking rate\u003c/div>\u003cdiv class=\"k\"> 충격적인 속도로\u003c/div>\u003cdiv class=\"e\"> to provide humans\u003c/div>\u003cdiv class=\"k\"> 인간에게 제공하기 위해\u003c/div>\u003cdiv class=\"e\"> with lumber, pasture land, and farm land.\u003c/div>\u003cdiv class=\"k\"> 목재, 목초지, 농지를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">are being cut down\u003c/b>은 be being + 과거분사로 현재 진행 중인 수동태를 나타낸다. 진행형의 be가 being이 되어 수동태 be동사와 결합한 패턴이다.\u003c/div>","segs":[{"n":21,"text":"Unfortunately, 불행하게도. the rain forests, 열대 우림은. are being cut down, 벌채되고 있는 중이다. at a shocking rate, 충격적인 속도로. to provide humans, 인간에게 제공하기 위해. with lumber, pasture land, and farm land, 목재, 목초지, 농지를","hl":"ch"},{"n":22,"text":"네 번째 문장은 진행형과 수동태가 결합된 are being cut down이 핵심이에요. be being 과거분사 형태는 지금도 계속 벌채되고 있다는 뜻을 전달합니다. 뒤에 to provide humans가 이어져서 벌채의 목적을 설명해 주죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Unfortunately, the rain forests \u003cspan class=\"fx\">are being cut down\u003c/span> at a shocking rate to provide humans with lumber, pasture land, and farm land.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>열대우림이 지금도 계속 잘려 나가고 있으며 그 속도가 충격적이라는 뜻이다. 인간에게 목재와 땅을 주기 위해 벌목된다는 목적이 드러나지만 부정적인 어감을 준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are being cut down\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are being destroyed\u003c/span>\u003cdiv class=\"w\">cut down을 destroy로 바꾸면 파괴의 결과를 더 강조한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to provide humans with lumber, pasture land, and farm land\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to give humans lumber, pasture land, and farm land\u003c/span>\u003cdiv class=\"w\">provide A with B를 give A B로 전환한 4형식 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rain forests\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">tropical rain forests\u003c/span>\u003cspan class=\"y-eq\">rain forests = tropical rain forests\u003c/span>\u003cdiv class=\"w\">열대라는 위치 정보를 덧붙인 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at a shocking rate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at an alarming rate\u003c/span>\u003cspan class=\"y-eq\">shocking = alarming\u003c/span>\u003cdiv class=\"w\">충격적이고 우려스러운 속도라는 의미이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">provide A with B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">supply A with B\u003c/span>\u003cspan class=\"y-eq\">provide = supply\u003c/span>\u003cdiv class=\"w\">제공하다는 의미의 격식 있는 유의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Unfortunately, tropical rain forests are being destroyed at an alarming rate to give humans lumber, pasture land, and farm land.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"열대 우림이 놀라울 만큼 빠른 속도로 계속 잘려 나가고 있다는 뜻이에요. 인간에게 목재와 목초지, 농지를 제공하려고 그렇게 한다는 목적이 드러나는데, 불행하게도라는 부사가 안타까운 상황을 강조합니다.","hl":"mn"},{"n":24,"text":"are being cut down은 are being destroyed로 바꾸면 파괴의 의미가 더 강해져요. provide humans with lumber, pasture land, and farm land는 give humans lumber, pasture land, and farm land로 바꿔도 같은 뜻이에요. 전치사 with가 사라지는 구조 차이를 확인하세요.","hl":"rw"},{"n":25,"text":"rain forests는 tropical rain forests라고 해서 열대 우림임을 분명히 할 수 있어요. shocking은 alarming으로 바꾸면 우려스러운 느낌이 강조되고, provide A with B는 supply A with B와 같은 구조로 쓸 수 있어요.","hl":"ph"},{"n":26,"text":"전체를 같은 뜻으로 바꾸면 Unfortunately, tropical rain forests are being destroyed at an alarming rate to give humans lumber, pasture land, and farm land라고 할 수 있어요. 진행형 수동태를 유지하면서 어휘만 바꾼 패러프레이징이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Geysers \u003cspan class=\"fx\">have often been compared to volcanoes\u003c/span> because they both emit hot liquids from below the Earth's surface.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Geysers\u003c/div>\u003cdiv class=\"k\">간헐천은\u003c/div>\u003cdiv class=\"e\"> have often been compared\u003c/div>\u003cdiv class=\"k\"> 종종 비교되어 왔다\u003c/div>\u003cdiv class=\"e\"> to volcanoes\u003c/div>\u003cdiv class=\"k\"> 화산에\u003c/div>\u003cdiv class=\"e\"> because they both emit\u003c/div>\u003cdiv class=\"k\"> 그들이 둘 다 방출하기 때문에\u003c/div>\u003cdiv class=\"e\"> hot liquids\u003c/div>\u003cdiv class=\"k\"> 뜨거운 액체를\u003c/div>\u003cdiv class=\"e\"> from below the Earth's surface.\u003c/div>\u003cdiv class=\"k\"> 지구 표면 아래로부터\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">have been compared\u003c/b>는 현재완료 수동태로 과거부터 현재까지 비교되어 온 경험·지속을 나타낸다. compare A to B의 수동형이어서 전치사 to가 뒤에 온다.\u003c/div>","segs":[{"n":27,"text":"Geysers, 간헐천은. have often been compared, 종종 비교되어 왔다. to volcanoes, 화산에. because they both emit, 그들이 둘 다 방출하기 때문에. hot liquids, 뜨거운 액체를. from below the Earth's surface, 지구 표면 아래로부터","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 have been compared가 현재완료 수동태입니다. 과거부터 지금까지 계속 비교되어 왔다는 의미를 나타내고, compare A to B의 수동태라서 뒤에 to volcanoes가 자연스럽게 이어져요. because절에서 그 이유를 설명하고 있습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Geysers \u003cspan class=\"fx\">have often been compared to volcanoes\u003c/span> because they both emit hot liquids from below the Earth's surface.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>간헐천이 오랫동안 화산에 비유되어 왔다는 뜻이다. 둘 다 지표 아래에서 뜨거운 액체를 뿜어내기 때문에 같은 부류로 묶인 것이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have often been compared to volcanoes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have often been likened to volcanoes\u003c/span>\u003cdiv class=\"w\">compare A to B를 liken A to B로 바꾸어 격식 있는 표현을 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">because they both emit hot liquids\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">because both of them emit hot liquids\u003c/span>\u003cdiv class=\"w\">they both를 both of them으로 바꿔 두 대상을 강조한 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">geysers\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">erupting hot springs\u003c/span>\u003cspan class=\"y-eq\">geysers = erupting hot springs\u003c/span>\u003cdiv class=\"w\">뜨거운 물을 분출하는 샘이라는 뜻이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have often been compared to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have frequently been compared to\u003c/span>\u003cspan class=\"y-eq\">often = frequently\u003c/span>\u003cdiv class=\"w\">빈도를 나타내는 부사 유의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">emit\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">discharge\u003c/span>\u003cspan class=\"y-eq\">emit = discharge\u003c/span>\u003cdiv class=\"w\">방출하다는 뜻의 격식 있는 동의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Geysers have frequently been likened to volcanoes because both of them discharge hot liquids from below the Earth's surface.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"간헐천이 오랫동안 화산에 비유되어 왔다는 뜻이에요. 둘 다 지구 표면 아래에서 뜨거운 액체를 내뿜기 때문에 같은 부류로 묶인 거죠. 완료형을 써서 예전부터 지금까지 이어지는 설명이라는 점이 포인트입니다.","hl":"mn"},{"n":30,"text":"have often been compared to volcanoes는 have often been likened to volcanoes로 바꿔 쓸 수 있어요. compare를 liken으로 바꾸면 더 격식 있는 어감이 됩니다. they both는 both of them으로 바꿔서 두 대상을 좀 더 강조할 수 있어요.","hl":"rw"},{"n":31,"text":"geysers는 erupting hot springs라고 풀어서 뜨거운 물을 분출하는 샘이라는 뜻을 분명히 할 수 있어요. often은 frequently로, emit은 discharge로 바꿔도 의미가 유지됩니다. 이 표현들은 문장 전환 문제에서 자주 볼 수 있어요.","hl":"ph"},{"n":32,"text":"전체를 바꾸면 Geysers have frequently been likened to volcanoes because both of them discharge hot liquids from below the Earth's surface라고 할 수 있어요. 현재완료 수동태 구조는 그대로 두고 표현만 다듬었죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 Information \u003cspan class=\"fx\">is extracted or learned from sources of data, and this captured information is then transformed into knowledge that is eventually used to trigger actions or decisions\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Information\u003c/div>\u003cdiv class=\"k\">정보는\u003c/div>\u003cdiv class=\"e\"> is extracted or learned\u003c/div>\u003cdiv class=\"k\"> 추출되거나 습득된다\u003c/div>\u003cdiv class=\"e\"> from sources of data,\u003c/div>\u003cdiv class=\"k\"> 데이터 출처에서\u003c/div>\u003cdiv class=\"e\"> and this captured information\u003c/div>\u003cdiv class=\"k\"> 그리고 이렇게 획득된 정보는\u003c/div>\u003cdiv class=\"e\"> is then transformed\u003c/div>\u003cdiv class=\"k\"> 그런 다음 변환된다\u003c/div>\u003cdiv class=\"e\"> into knowledge\u003c/div>\u003cdiv class=\"k\"> 지식으로\u003c/div>\u003cdiv class=\"e\"> that is eventually used\u003c/div>\u003cdiv class=\"k\"> 결국 사용되는\u003c/div>\u003cdiv class=\"e\"> to trigger actions or decisions.\u003c/div>\u003cdiv class=\"k\"> 행동이나 결정을 촉발하기 위해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">is extracted or learned\u003c/b>, \u003cb class=\"key\">is then transformed\u003c/b>, \u003cb class=\"key\">is eventually used\u003c/b>가 접속사와 관계사로 연결된 병렬·연쇄 수동태다. 주어 Information에서 시작해 지식의 변환과 사용 단계를 순서대로 나타낸다.\u003c/div>","segs":[{"n":33,"text":"Information, 정보는. is extracted or learned, 추출되거나 습득된다. from sources of data, 데이터 출처에서. and this captured information, 그리고 이렇게 획득된 정보는. is then transformed, 그런 다음 변환된다. into knowledge, 지식으로. that is eventually used, 결국 사용되는. to trigger actions or decisions, 행동이나 결정을 촉발하기 위해","hl":"ch"},{"n":34,"text":"여섯 번째 문장은 수동태가 여럿 연결된 긴 문장입니다. is extracted or learned, is then transformed, is eventually used가 차례로 나오면서 정보가 추출되고 변환되고 사용되는 흐름을 보여 줘요. 과거분사들이 병렬이나 관계절로 이어져 있으니 덩어리로 끊어 읽는 게 중요해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 Information \u003cspan class=\"fx\">is extracted or learned from sources of data, and this captured information is then transformed into knowledge that is eventually used to trigger actions or decisions\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>데이터에서 정보를 뽑아내고, 그것을 지식으로 바꾸며, 그 지식이 행동과 결정을 이끌어낸다는 일련의 과정을 설명한다. 정보 처리의 단계적 흐름을 객관적인 수동태로 강조한 문장이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Information is extracted or learned from sources of data\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">We extract or learn information from sources of data\u003c/span>\u003cdiv class=\"w\">능동태로 바꿔 행위 주체를 일반화한 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is then transformed into knowledge\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is then converted into knowledge\u003c/span>\u003cdiv class=\"w\">transform을 convert로 바꾸어 변환 의미를 유지한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">extracted\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">obtained\u003c/span>\u003cspan class=\"y-eq\">extracted = obtained\u003c/span>\u003cdiv class=\"w\">데이터에서 얻어 낸다는 뜻이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">captured information\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">acquired information\u003c/span>\u003cspan class=\"y-eq\">captured = acquired\u003c/span>\u003cdiv class=\"w\">획득한 정보라는 의미의 유의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">trigger actions or decisions\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cause actions or decisions\u003c/span>\u003cspan class=\"y-eq\">trigger = cause\u003c/span>\u003cdiv class=\"w\">촉발하다는 뜻을 쉬운 동사로 바꾼 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We extract or learn information from sources of data, and this acquired information is then converted into knowledge that is eventually used to cause actions or decisions.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"데이터에서 정보를 얻고, 그 정보를 지식으로 바꾼 다음, 그 지식을 행동이나 결정을 이끌어 내는 데 사용한다는 뜻이에요. 정보가 지식이 되고 지식이 행동을 유발하는 단계적 과정을 수동태로 표현해서 객관적인 느낌을 주고 있습니다.","hl":"mn"},{"n":36,"text":"Information is extracted or learned from sources of data는 능동태로 We extract or learn information from sources of data라고 바꿀 수 있어요. is transformed into knowledge는 is converted into knowledge로 바꿔도 변환의 의미가 그대로예요.","hl":"rw"},{"n":37,"text":"extracted는 obtained로 바꿔서 데이터에서 얻어 낸다는 의미를 표현할 수 있어요. captured information은 acquired information과 같은 뜻이고, trigger는 cause로 바꾸면 촉발하다는 의미가 더 쉬워져요.","hl":"ph"},{"n":38,"text":"같은 뜻으로 바꾸면 We extract or learn information from sources of data, and this acquired information is then converted into knowledge that is eventually used to cause actions or decisions라고 할 수 있어요. 첫 절을 능동태로 바꾸고 유의어를 사용했죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 Genetic tendencies toward intelligence, sociability, and aggression \u003cspan class=\"fx\">can be stimulated, controlled, or suppressed by parental response and other environmental influences\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Genetic tendencies\u003c/div>\u003cdiv class=\"k\">유전적 성향은\u003c/div>\u003cdiv class=\"e\"> toward intelligence, sociability, and aggression\u003c/div>\u003cdiv class=\"k\"> 지능, 사교성, 공격성에 대한\u003c/div>\u003cdiv class=\"e\"> can be stimulated, controlled, or suppressed\u003c/div>\u003cdiv class=\"k\"> 자극되거나, 통제되거나, 억제될 수 있다\u003c/div>\u003cdiv class=\"e\"> by parental response\u003c/div>\u003cdiv class=\"k\"> 부모의 반응에 의해\u003c/div>\u003cdiv class=\"e\"> and other environmental influences.\u003c/div>\u003cdiv class=\"k\"> 그리고 다른 환경적 영향에 의해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>조동사 \u003cb class=\"key\">can be\u003c/b> 뒤에 과거분사 \u003cb class=\"key\">stimulated, controlled, or suppressed\u003c/b>가 병렬로 연결된 수동태다. by 이하가 영향의 주체를 나타낸다.\u003c/div>","segs":[{"n":39,"text":"Genetic tendencies, 유전적 성향은. toward intelligence, sociability, and aggression, 지능, 사교성, 공격성에 대한. can be stimulated, controlled, or suppressed, 자극되거나, 통제되거나, 억제될 수 있다. by parental response, 부모의 반응에 의해. and other environmental influences, 그리고 다른 환경적 영향에 의해","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 can be stimulated, controlled, or suppressed가 핵심 수동태입니다. 조동사 can be 뒤에 과거분사 세 개가 or로 병렬 연결되어 있어요. by parental response and other environmental influences가 그 성향들을 자극하고 통제하는 주체를 설명해 줘요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 Genetic tendencies toward intelligence, sociability, and aggression \u003cspan class=\"fx\">can be stimulated, controlled, or suppressed by parental response and other environmental influences\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>지능, 사교성, 공격성 같은 유전적 성향은 고정된 것이 아니라 부모의 반응과 환경에 따라 발현되거나 조절될 수 있다는 뜻이다. 타고난 성향도 환경의 영향을 받는다는 점을 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">can be stimulated, controlled, or suppressed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can be encouraged, regulated, or inhibited\u003c/span>\u003cdiv class=\"w\">각 과거분사를 유사 의미로 바꾸어 어휘력을 확장한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by parental response and other environmental influences\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">by how parents respond and other influences from the environment\u003c/span>\u003cdiv class=\"w\">명사구를 절과 전치사구로 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">genetic tendencies\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">inherited tendencies\u003c/span>\u003cspan class=\"y-eq\">genetic = inherited\u003c/span>\u003cdiv class=\"w\">유전으로 물려받은 성향이라는 뜻이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sociability\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">social nature\u003c/span>\u003cspan class=\"y-eq\">sociability = social nature\u003c/span>\u003cdiv class=\"w\">사교성을 명사구로 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">suppressed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">restrained\u003c/span>\u003cspan class=\"y-eq\">suppressed = restrained\u003c/span>\u003cdiv class=\"w\">억제하다는 뜻의 유의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Inherited tendencies toward intelligence, social nature, and aggression can be encouraged, regulated, or inhibited by parental response and other environmental influences.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"지능이나 사교성, 공격성 같은 유전적 성향은 부모의 반응과 환경의 영향에 따라 자극되거나 통제되거나 억제될 수 있다는 뜻이에요. 타고난 성향도 환경에 따라 달라질 수 있다는 점을 강조하고 있어요.","hl":"mn"},{"n":42,"text":"can be stimulated, controlled, or suppressed는 can be encouraged, regulated, or inhibited로 바꿔 쓸 수 있어요. 각각 자극하다, 조절하다, 억제하다의 의미가 더 분명해지죠. 수동태 구조를 유지하면서 어휘만 바꾸는 연습을 하면 좋아요.","hl":"rw"},{"n":43,"text":"genetic tendencies는 inherited tendencies로 바꿔 쓸 수 있고, sociability는 social nature로 풀어서 표현할 수 있어요. suppressed는 restrained와 같은 뜻으로 억제하다는 의미를 나타내요.","hl":"ph"},{"n":44,"text":"전체를 바꾸면 Inherited tendencies toward intelligence, social nature, and aggression can be encouraged, regulated, or inhibited by parental response and other environmental influences라고 할 수 있어요. 주어와 과거분사 표현을 유의어로 교체한 패러프레이징이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 Hacking \u003cspan class=\"fx\">is commonly described as the act\u003c/span> of re-designing the configuration of hardware or software systems to alter their intended function.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Hacking\u003c/div>\u003cdiv class=\"k\">해킹은\u003c/div>\u003cdiv class=\"e\"> is commonly described\u003c/div>\u003cdiv class=\"k\"> 흔히 묘사된다\u003c/div>\u003cdiv class=\"e\"> as the act of re-designing the configuration\u003c/div>\u003cdiv class=\"k\"> 구성을 다시 설계하는 행위로\u003c/div>\u003cdiv class=\"e\"> of hardware or software systems\u003c/div>\u003cdiv class=\"k\"> 하드웨어나 소프트웨어 시스템의\u003c/div>\u003cdiv class=\"e\"> to alter their intended function.\u003c/div>\u003cdiv class=\"k\"> 그것들의 의도된 기능을 변경하기 위해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">is commonly described as\u003c/b>는 describe A as B의 수동태로, 해킹이라는 주어를 어떤 행위로 정의·묘사한다. as 뒤에 명사구가 주어를 설명하는 보어 역할을 한다.\u003c/div>","segs":[{"n":45,"text":"Hacking, 해킹은. is commonly described, 흔히 묘사된다. as the act of re-designing the configuration, 구성을 다시 설계하는 행위로. of hardware or software systems, 하드웨어나 소프트웨어 시스템의. to alter their intended function, 그것들의 의도된 기능을 변경하기 위해","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 is commonly described as가 수동태와 전치사 as가 결합된 구조예요. describe A as B의 수동태로, 해킹을 다시 설계하는 행위라고 묘사해 줍니다. as 이하가 주어 해킹의 정의를 설명하는 핵심이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 Hacking \u003cspan class=\"fx\">is commonly described as the act\u003c/span> of re-designing the configuration of hardware or software systems to alter their intended function.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>해킹은 일반적으로 하드웨어나 소프트웨어의 설정을 다시 설계해서 원래 기능을 바꾸는 행위로 설명된다는 뜻이다. 해킹의 개념을 객관적인 수동태로 정의하는 문장이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Hacking is commonly described as the act of re-designing the configuration\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">People commonly describe hacking as the act of re-designing the configuration\u003c/span>\u003cdiv class=\"w\">능동태로 바꿔 행위 주체를 일반적으로 표현한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is commonly described as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is often defined as\u003c/span>\u003cdiv class=\"w\">묘사하다를 정의하다로 바꿔 개념 설명의 의미를 강조한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">configuration\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">settings\u003c/span>\u003cspan class=\"y-eq\">configuration = settings\u003c/span>\u003cdiv class=\"w\">시스템 환경 설정을 뜻하는 쉬운 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">alter\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">change\u003c/span>\u003cspan class=\"y-eq\">alter = change\u003c/span>\u003cdiv class=\"w\">변경하다는 뜻의 쉬운 동사이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">intended function\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">original function\u003c/span>\u003cspan class=\"y-eq\">intended = original\u003c/span>\u003cdiv class=\"w\">원래 의도된 기능이라는 의미이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Hacking is often defined as the act of re-designing the settings of hardware or software systems to change their original function.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"해킹은 하드웨어나 소프트웨어 시스템의 설정을 다시 설계해서 원래의 기능을 바꾸는 행위로 흔히 설명된다는 뜻이에요. 해킹이라는 개념을 객관적인 수동태로 정의한 문장이죠.","hl":"mn"},{"n":48,"text":"Hacking is commonly described as the act를 능동태로 바꾸면 People commonly describe hacking as the act라고 할 수 있어요. is commonly described as는 is often defined as로 바꾸면 정의의 의미가 더 분명해져요.","hl":"rw"},{"n":49,"text":"configuration은 settings로 바꾸면 시스템 설정이라는 뜻이 쉬워져요. alter는 change와 같은 뜻이고, intended function은 original function으로 바꿔서 원래 의도된 기능을 나타낼 수 있어요.","hl":"ph"},{"n":50,"text":"전체를 같은 뜻으로 바꾸면 Hacking is often defined as the act of re-designing the settings of hardware or software systems to change their original function이라고 할 수 있어요. 수동태와 as 구문을 유지하면서 쉬운 어휘로 바꿨죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 \u003cspan class=\"fx\">It is estimated that we have characterized only one percent of all bacterial species that exist\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It is estimated\u003c/div>\u003cdiv class=\"k\">추정된다\u003c/div>\u003cdiv class=\"e\"> that we have characterized\u003c/div>\u003cdiv class=\"k\"> 우리가 규명했다고\u003c/div>\u003cdiv class=\"e\"> only one percent\u003c/div>\u003cdiv class=\"k\"> 단지 1퍼센트만을\u003c/div>\u003cdiv class=\"e\"> of all bacterial species\u003c/div>\u003cdiv class=\"k\"> 모든 박테리아 종 가운데\u003c/div>\u003cdiv class=\"e\"> that exist.\u003c/div>\u003cdiv class=\"k\"> 존재하는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">It is estimated that\u003c/b>은 가주어 it 구문에서 진주어 that절이 주어 역할을 하며, 추정의 내용을 객관적으로 나타내는 수동태 표현이다. that절 안에서는 능동태가 사용되어 추정 내용을 전달한다.\u003c/div>","segs":[{"n":51,"text":"It is estimated, 추정된다. that we have characterized, 우리가 규명했다고. only one percent, 단지 1퍼센트만을. of all bacterial species, 모든 박테리아 종 가운데. that exist, ss=\"y-pair\">\u003cspan class=\"f\">may not\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are not allowed to\u003c/span>\u003cspan class=\"y-eq\">may not = be not allowed to\u003c/span>\u003cdiv class=\"w\">허가의 금지를 나타내는 표현 전환이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">examination room\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">testing room\u003c/span>\u003cspan class=\"y-eq\">examination room = testing room\u003c/span>\u003cdiv class=\"w\">시험장을 뜻하는 유사 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Exam papers are not allowed to be taken out of the testing room.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"시험지는 시험장 밖으로 가져갈 수 없다는 규정을 전달하는 문장이에요. 수동태를 써서 규정의 대상인 시험지에 초점을 맞추고 있어요. 공고문이나 안내문에서 자주 보는 표현이죠.","hl":"mn"},{"n":60,"text":"Test papers may not be taken out of the examination room은 You may not take test papers out of the examination room처럼 능동태로 바꿀 수 있어요. may not be taken out of를 must not be taken out of로 바꾸면 금지의 의미가 더 강해집니다.","hl":"rw"},{"n":61,"text":"test papers는 exam papers로 바꿔 쓸 수 있어요. may not은 are not allowed to로 전환하면 허가하지 않는다는 뜻이 됩니다. examination room은 testing room과 같은 의미로 쓸 수 있어요.","hl":"ph"},{"n":62,"text":"전체를 같은 뜻으로 바꾸면 Exam papers are not allowed to be taken out of the testing room이라고 할 수 있어요. may not을 are not allowed to로 바꾸고 유의어로 어휘를 교체했죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 Don't judge people by their covers. Most of their books \u003cspan class=\"fx\">are still being written\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Don't judge people\u003c/div>\u003cdiv class=\"k\">사람들을 판단하지 마라\u003c/div>\u003cdiv class=\"e\"> by their covers.\u003c/div>\u003cdiv class=\"k\"> 그들의 겉표지로\u003c/div>\u003cdiv class=\"e\"> Most of their books\u003c/div>\u003cdiv class=\"k\"> 그들의 책 대부분은\u003c/div>\u003cdiv class=\"e\"> are still being written.\u003c/div>\u003cdiv class=\"k\"> 여전히 쓰여지고 있는 중이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">are still being written\u003c/b>은 현재진행 수동태로, 책이 지금도 집필되고 있는 중임을 나타낸다. 앞 문장의 명령문과 대비되어 수동태가 은유적 의미의 진행 상태를 표현한다.\u003c/div>","segs":[{"n":63,"text":"Don't judge people, 사람들을 판단하지 마라. by their covers, 그들의 겉표지로. Most of their books, 그들의 책 대부분은. are still being written, 여전히 쓰여지고 있는 중이다","hl":"ch"},{"n":64,"text":"열한 번째 문장의 두 번째 부분 are still being written이 현재진행 수동태입니다. 책이 지금도 쓰여지고 있는 중이라는 뜻으로, be being 과거분사 형태를 그대로 보여 줘요. 앞의 명령문과 함께 비유적인 의미를 만들어 내는 문장이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 Don't judge people by their covers. Most of their books \u003cspan class=\"fx\">are still being written\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>겉모습만으로 사람을 판단하지 말라는 격언이다. 대부분의 책이 아직 쓰이고 있듯 사람도 여전히 변화하고 성장 중이라는 뜻을 담고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Don't judge people by their covers.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">You shouldn't judge people by their covers.\u003c/span>\u003cdiv class=\"w\">명령문을 충고의 서술문으로 바꾼 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Most of their books are still being written.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Most of their books are still in the process of being written.\u003c/span>\u003cdiv class=\"w\">진행 의미를 전치사구로 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">judge people by their covers\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">judge people by their appearance\u003c/span>\u003cspan class=\"y-eq\">covers = appearance\u003c/span>\u003cdiv class=\"w\">겉모습을 뜻하는 직접적 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">covers\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">outsides\u003c/span>\u003cspan class=\"y-eq\">covers = outsides\u003c/span>\u003cdiv class=\"w\">겉표지를 외면으로 바꾼 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are still being written\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are still in progress\u003c/span>\u003cspan class=\"y-eq\">being written = in progress\u003c/span>\u003cdiv class=\"w\">집필 중인 상태를 짧게 표현한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">You shouldn't judge people by their appearance, and most of their books are still in the process of being written.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"겉표지만으로 사람을 판단하지 말라는 뜻이에요. 대부분의 책이 아직 쓰여지고 있듯 사람도 여전히 변화하고 성장하는 과정에 있다는 메시지를 담고 있어요. 겉모습보다 가능성과 과정을 보라는 조언이에요.","hl":"mn"},{"n":66,"text":"Don't judge people by their covers를 You shouldn't judge people by their covers로 바꾸면 명령을 충고의 서술문으로 표현할 수 있어요. Most of their books are still being written은 are still in the process of being written으로 바꿔 진행의 의미를 풀어 쓸 수 있어요.","hl":"rw"},{"n":67,"text":"judge people by their covers에서 covers는 appearance로 바꾸면 겉모습이라는 뜻이 분명해져요. covers는 outsides라고도 할 수 있고요. are still being written은 are still in progress로 짧게 진행 중인 상태를 나타낼 수 있어요.","hl":"ph"},{"n":68,"text":"전체를 같은 뜻으로 바꾸면 You shouldn't judge people by their appearance, and most of their books are still in the process of being written이라고 할 수 있어요. 명령문의 어조를 조금 누그러뜨리고 진행 의미를 전치사구로 풀었죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Confirmed scientific theories \u003cspan class=\"fx\">are often referred to as &quot;laws of nature&quot; or &quot;laws of physics.&quot;\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Confirmed scientific theories\u003c/div>\u003cdiv class=\"k\">입증된 과학 이론들은\u003c/div>\u003cdiv class=\"e\"> are often referred to\u003c/div>\u003cdiv class=\"k\"> 종종 일컬어진다\u003c/div>\u003cdiv class=\"e\"> as &quot;laws of nature&quot;\u003c/div>\u003cdiv class=\"k\"> &quot;자연 법칙&quot;으로\u003c/div>\u003cdiv class=\"e\"> or &quot;laws of physics.&quot;\u003c/div>\u003cdiv class=\"k\"> 또는 &quot;물리 법칙&quot;으로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">are often referred to as\u003c/b>는 refer to A as B의 수동태로, 입증된 과학 이론들이 자연 법칙이나 물리 법칙으로 불린다는 뜻을 나타낸다. as 뒤의 명사구가 주어를 명명하는 보어 역할을 한다.\u003c/div>","segs":[{"n":69,"text":"Confirmed scientific theories, 입증된 과학 이론들은. are often referred to, 종종 일컬어진다. as \"laws of nature\", \"자연 법칙\"으로. or \"laws of physics.\", 또는 \"물리 법칙\"으로","hl":"ch"},{"n":70,"text":"열두 번째 문장은 are often referred to as가 수동태와 전치사 as가 결합한 동사구 수동태입니다. refer to A as B의 수동태로, 과학 이론들이 자연 법칙이나 물리 법칙으로 불린다는 뜻이에요. as 뒤에 오는 이름들이 주어의 명칭을 나타내죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Confirmed scientific theories \u003cspan class=\"fx\">are often referred to as &quot;laws of nature&quot; or &quot;laws of physics.&quot;\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>충분히 입증된 과학 이론은 자연 법칙이나 물리 법칙으로 일컬어진다는 뜻이다. 과학에서 검증된 이론이 법칙의 지위를 얻는다는 객관적인 정보를 전달한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are often referred to as &quot;laws of nature&quot;\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are often called &quot;laws of nature&quot;\u003c/span>\u003cdiv class=\"w\">refer to A as B를 call A B로 바꾼 직접적인 명명 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Confirmed scientific theories\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Scientific theories that have been confirmed\u003c/span>\u003cdiv class=\"w\">과거분사를 관계절로 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">referred to as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">termed\u003c/span>\u003cspan class=\"y-eq\">referred to as = termed\u003c/span>\u003cdiv class=\"w\">일컬어지다는 뜻의 격식 있는 동사이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">confirmed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">proven\u003c/span>\u003cspan class=\"y-eq\">confirmed = proven\u003c/span>\u003cdiv class=\"w\">입증된이라는 뜻의 유의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">laws of nature\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">natural laws\u003c/span>\u003cspan class=\"y-eq\">laws of nature = natural laws\u003c/span>\u003cdiv class=\"w\">자연 법칙을 명사구로 전환한 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Scientific theories that have been proven are often called natural laws or laws of physics.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"충분히 입증된 과학 이론은 흔히 자연 법칙이나 물리 법칙으로 불린다는 뜻이에요. 과학에서 반복적으로 검증된 이론이 법칙이라는 지위를 얻는다는 객관적인 표현입니다.","hl":"mn"},{"n":72,"text":"are often referred to as laws of nature는 are often called laws of nature로 바꿔 쓸 수 있어요. refer to as를 call로 바꾸면 더 직접적으로 부른다는 의미가 됩니다. Confirmed scientific theories는 Scientific theories that have been confirmed처럼 관계절로 풀어 쓸 수 있어요.","hl":"rw"},{"n":73,"text":"referred to as는 termed라는 격식 있는 동사로 바꿀 수 있어요. confirmed는 proven과 같은 뜻이고, laws of nature는 natural laws로 명사구 전환이 가능해요.","hl":"ph"},{"n":74,"text":"같은 뜻으로 바꾸면 Scientific theories that have been proven are often called natural laws or laws of physics라고 할 수 있어요. 과거분사 confirmed를 관계절로 풀고 동사구 수동태를 called로 바꾸었죠.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">be동사 + 과거분사\u003c/b>가 기본 수동태 블록이다.\u003c/li>\u003cli>조동사는 \u003cb class=\"key\">조동사 + be + 과거분사\u003c/b>로, 진행형은 \u003cb class=\"key\">be being + 과거분사\u003c/b>로, 완료형은 \u003cb class=\"key\">have been + 과거분사\u003c/b>로 쓴다.\u003c/li>\u003cli>수동태 뒤의 보어와 by, as는 주어의 상태와 의미를 완성한다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘 배운 수동태 블록을 정리하면, be동사와 과거분사가 기본이고 조동사와 진행형, 완료형을 만나면 be동사가 그에 맞게 변합니다. 수동태 뒤에 by나 as, 보어가 오면 주어의 상태와 의미를 완성해 준다는 점까지 꼭 기억해 두세요. 이제 문장을 읽을 때 수동태 블록이 눈에 들어올 거예요. 다음 시간에는 또 다른 구문으로 만나요.","hl":"sum"}]}]});</script></body></html>
