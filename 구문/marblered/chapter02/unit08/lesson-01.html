lecturePlayer(document.getElementById("app"),{"brand":"unit08","title":"마법같은 블록구문 실전편 unit08 조동사 구문","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 08 조동사 구문\u003c/div>\u003ch1>조동사 과거·후회·추측 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>조동사 과거 표현으로 과거의 후회·추측·불가능·당연함을 말할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 조동사 구문을 정복하는 시간이에요. 조동사는 그냥 뜻만 외우면 끝나는 게 아니라 뒤에 어떤 형태가 오느냐에 따라 의미가 확 달라져요. 특히 조동사와 have 과거분사가 만나면 과거에 대한 후회나 추측을 표현할 수 있게 되죠. 오늘 예문 열두 개를 같이 분석하면서 시험에 자주 나오는 조동사 표현을 완전히 내 것으로 만들어 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">Unit 08 조동사 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">이 유닛의 핵심은 조동사가 과거를 나타내는 have v-ed와 결합할 때 \u003cb class=\"key\">must have v-ed\u003c/b>는 강한 추측, \u003cb class=\"key\">should/ought to have v-ed\u003c/b>는 후회, \u003cb class=\"key\">cannot have v-ed\u003c/b>는 부정적 추측이 된다는 것입니다. 또한 \u003cb class=\"key\">would rather A than B\u003c/b>는 비교 선호, \u003cb class=\"key\">cannot but v\u003c/b>는 불가피함, \u003cb class=\"key\">can hardly + v + too\u003c/b>는 아무리 해도 지나치지 않다는 뜻을 만듭니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 You shouldn't have driven that car with the faulty brakes. You might have had a serious accident.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02  I would rather walk with a friend in the dark, than alone in the light.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 I was never top of the class at school, but my classmates \u003cspan class=\"fx\">must have seen\u003c/span> potential in me, because my nickname was &quot;Einstein.&quot;\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 One's true feelings \u003cspan class=\"fx\">cannot but come through\u003c/span> in what one says and does.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 A man \u003cspan class=\"fx\">may well be condemned\u003c/span>, not for doing something, but for doing nothing.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 It's defeatist to harp on what might have been, and yet, it's hard to resist considering what might have been.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07  The suspect \u003cspan class=\"fx\">can't have committed\u003c/span> the crime as he was in another country at the moment of the murder.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 You might as well expect rivers to run backwards as any man born free to be contented penned up.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 The Brothers Karamazov, one of the peaks in the literature of the world, \u003cspan class=\"fx\">can hardly be valued too highly\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 The universe \u003cspan class=\"fx\">must have originated\u003c/span> from a more compact state that we call the Big Bang.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11  When the epidemic broke out, it claimed many lives. The authorities \u003cspan class=\"fx\">ought to have taken\u003c/span> precautions to prevent the epidemic.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12  I would rather be a ghost, drifting by your side as a condemned soul, than enter  heaven without you.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘 유닛의 핵심은 조동사가 과거와 만나는 형태예요. must have 과거분사는 과거에 대한 강한 추측을, should have 과거분사나 ought to have 과거분사는 과거에 대한 후회를, cannot have 과거분사는 과거에 대한 강한 부정적 추측을 나타내요. 그리고 would rather A than B는 B하느니 차라리 A하겠다는 선호를, cannot but는 하지 않을 수 없다는 불가피함을, can hardly와 too가 만나면 아무리 해도 지나치지 않다는 뜻이 돼요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 You shouldn't have driven that car with the faulty brakes. You might have had a serious accident.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">You shouldn't have driven\u003c/div>\u003cdiv class=\"k\">당신은 운전하지 말았어야 했다\u003c/div>\u003cdiv class=\"e\">that car\u003c/div>\u003cdiv class=\"k\">그 차를\u003c/div>\u003cdiv class=\"e\">with the faulty brakes.\u003c/div>\u003cdiv class=\"k\">브레이크에 결함이 있는\u003c/div>\u003cdiv class=\"e\">You might have had\u003c/div>\u003cdiv class=\"k\">당신은 겪었을지도 모른다\u003c/div>\u003cdiv class=\"e\">a serious accident.\u003c/div>\u003cdiv class=\"k\">심각한 사고를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">should not have v-ed\u003c/b>는 '~하지 말았어야 했다'로 과거의 후회나 비판을, \u003cb class=\"key\">might have v-ed\u003c/b>는 '~했을지도 모른다'로 과거의 가능성을 나타냅니다.\u003c/div>","segs":[{"n":3,"text":"You shouldn't have driven, 당신은 운전하지 말았어야 했다. that car, 그 차를. with the faulty brakes, 브레이크에 결함이 있는. You might have had, 당신은 겪었을지도 모른다. a serious accident, 심각한 사고를","hl":"ch"},{"n":4,"text":"첫 번째 문장은 should not have driven과 might have had라는 두 가지 조동사 과거 표현이 나와요. should not have driven은 이미 한 일을 두고 하지 말았어야 했다고 말할 때 쓰고요, might have had는 그때 그런 일이 있었을지도 모른다고 추측할 때 씁니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 You shouldn't have driven that car with the faulty brakes. You might have had a serious accident.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>운전자는 결함 있는 브레이크를 알고도 운전해서는 안 되었고, 그 결과 심각한 사고가 났을 수도 있었다는 비판과 경고의 의미입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">shouldn't have driven\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ought not to have driven\u003c/span>\u003cdiv class=\"w\">should not have v-ed와 같은 뜻으로, ought to를 쓰면 더 격식 있는 어조가 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">might have had\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">could have had\u003c/span>\u003cdiv class=\"w\">과거의 가능성을 조금 더 가능성 있게 표현할 때 could have v-ed를 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">faulty\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">defective\u003c/span>\u003cspan class=\"y-eq\">faulty = defective\u003c/span>\u003cdiv class=\"w\">둘 다 '결함이 있는'이라는 뜻으로 기계나 제품에 자주 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">serious\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">severe\u003c/span>\u003cspan class=\"y-eq\">serious = severe\u003c/span>\u003cdiv class=\"w\">사고나 부상 등에서 '심각한'이라는 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">had a serious accident\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">was badly hurt\u003c/span>\u003cdiv class=\"w\">사고를 당하다를 피해를 입다로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">You ought not to have driven that car with defective brakes. You could have been badly injured.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"브레이크에 결함이 있는 차를 운전하지 말았어야 했는데 그렇게 했고, 그래서 심각한 사고가 났을 수도 있다는 거예요. 결과는 모르지만 위험한 선택이었다는 비판과 경고가 담겨 있죠.","hl":"mn"},{"n":6,"text":"shouldn't have driven은 ought not to have driven으로 바꿔도 뜻이 같아요. might have had는 could have had로 바꾸면 사고 가능성이 조금 더 컸다는 뉘앙스가 됩니다.","hl":"rw"},{"n":7,"text":"faulty는 defective로 바꿀 수 있고, serious는 severe와 자주 짝을 이뤄요. have a serious accident 대신 be badly hurt처럼 피해를 입었다고 표현할 수도 있습니다.","hl":"ph"},{"n":8,"text":"전체를 바꿔 보면 You ought not to have driven that car with defective brakes. You could have been badly injured. 이렇게 말해도 같은 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02  I would rather walk with a friend in the dark, than alone in the light.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I would rather walk\u003c/div>\u003cdiv class=\"k\">나는 차라리 걷겠다\u003c/div>\u003cdiv class=\"e\">with a friend\u003c/div>\u003cdiv class=\"k\">친구와 함께\u003c/div>\u003cdiv class=\"e\">in the dark,\u003c/div>\u003cdiv class=\"k\">어둠 속에서\u003c/div>\u003cdiv class=\"e\">than alone\u003c/div>\u003cdiv class=\"k\">혼자 걷느니\u003c/div>\u003cdiv class=\"e\">in the light.\u003c/div>\u003cdiv class=\"k\">빛 속에서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">would rather A than B\u003c/b> 구문으로 'B하느니 차라리 A하겠다'는 뜻입니다. than 뒤에는 동사 walk가 생략되어 alone만 남았습니다.\u003c/div>","segs":[{"n":9,"text":"I would rather walk, 나는 차라리 걷겠다. with a friend, 친구와 함께. in the dark, 어둠 속에서. than alone, 혼자 걷느니. in the light, 빛 속에서","hl":"ch"},{"n":10,"text":"두 번째 문장은 would rather A than B 구문이에요. would rather walk가 A에 해당하고 than alone in the light가 B인데, B에는 원래 walk가 있어야 하지만 반복을 피하려고 생략했어요. 이렇게 than 뒤에 동사가 생략되는 경우가 아주 많죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02  I would rather walk with a friend in the dark, than alone in the light.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>비록 어둡고 불안해도 친구와 함께하는 것이 화려하지만 혼자인 삶보다 낫다는 뜻입니다. 인간관계의 가치를 강조한 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">would rather walk ... than ...\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">would sooner walk ... than ...\u003c/span>\u003cdiv class=\"w\">would rather 대신 would sooner를 써도 '차라리 ~하겠다'는 뜻이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">than alone\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">than (walk) alone\u003c/span>\u003cdiv class=\"w\">생략된 동사를 넣어 보면 비교 대상이 분명해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in the dark\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in darkness\u003c/span>\u003cspan class=\"y-eq\">in the dark = in darkness\u003c/span>\u003cdiv class=\"w\">둘 다 어둠 속에서라는 뜻으로 병행 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in the light\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in brightness\u003c/span>\u003cspan class=\"y-eq\">in the light = in brightness\u003c/span>\u003cdiv class=\"w\">빛 속에서를 밝음 속에서로 바꾼 문어적 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I would sooner walk with a friend in darkness than walk by myself in brightness.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"어둠 속이라도 친구와 함께 걷는 게 빛 속에서 혼자 걷는 것보다 낫다는 뜻이에요. 겉으로 보기에 좋아 보여도 곁에 아무도 없는 삶은 외롭다는, 관계의 소중함을 말하는 문장이에요.","hl":"mn"},{"n":12,"text":"would rather는 would sooner로 바꿔도 똑같이 차라리 무언가를 하겠다는 뜻이 돼요. 생략된 walk를 넣어서 than walk alone이라고 해도 문장이 더 분명해질 뿐 뜻은 같습니다.","hl":"rw"},{"n":13,"text":"in the dark는 in darkness로, in the light는 in brightness로 바꿀 수 있어요. 둘 다 시험에서 유의어로 잘 나오는 표현이죠.","hl":"ph"},{"n":14,"text":"전체 패러프레이징은 이렇게 할 수 있어요. I would sooner walk with a friend in darkness than walk by myself in brightness. 같은 의미를 더 문어적으로 다듬은 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 I was never top of the class at school, but my classmates \u003cspan class=\"fx\">must have seen\u003c/span> potential in me, because my nickname was &quot;Einstein.&quot;\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I was never top of the class\u003c/div>\u003cdiv class=\"k\">나는 결코 학급 수석이 아니었다\u003c/div>\u003cdiv class=\"e\">at school,\u003c/div>\u003cdiv class=\"k\">학교에서\u003c/div>\u003cdiv class=\"e\">but my classmates must have seen\u003c/div>\u003cdiv class=\"k\">그러나 내 학우들은 보았음에 틀림없다\u003c/div>\u003cdiv class=\"e\">potential in me,\u003c/div>\u003cdiv class=\"k\">내게서 잠재력을\u003c/div>\u003cdiv class=\"e\">because my nickname was\u003c/div>\u003cdiv class=\"k\">왜냐하면 내 별명은\u003c/div>\u003cdiv class=\"e\">&quot;Einstein.&quot;\u003c/div>\u003cdiv class=\"k\">아인슈타인이었으니까\u003c/div>\u003cdiv class=\"e\">Stephen Hawking\u003c/div>\u003cdiv class=\"k\">스티븐 호킹\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">must have v-ed\u003c/b>는 과거의 일에 대한 강한 추측으로 '~했음에 틀림없다'는 뜻입니다. 여기서는 classmates가 potential을 보았다는 것을 확신하고 있습니다.\u003c/div>","segs":[{"n":15,"text":"I was never top of the class, 나는 결코 학급 수석이 아니었다. at school, 학교에서. but my classmates must have seen, 그러나 내 학우들은 보았음에 틀림없다. potential in me, 내게서 잠재력을. because my nickname was, 왜냐하면 내 별명은. \"Einstein.\", 아인슈타인이었으니까. Stephen Hawking, 스티븐 호킹","hl":"ch"},{"n":16,"text":"세 번째 문장의 핵심은 must have seen이에요. must have seen은 과거의 일을 두고 보았음에 틀림없다, 즉 강하게 추측하는 표현이에요. 주어가 나의 학우들이고 그들이 나에게서 잠재력을 보았다는 걸 확신하고 있죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 I was never top of the class at school, but my classmates \u003cspan class=\"fx\">must have seen\u003c/span> potential in me, because my nickname was &quot;Einstein.&quot;\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>성적은 좋지 않았지만 친구들은 그에게 잠재력을 봤을 것이라는 이야기입니다. 별명이 아인슈타인일 정도로 똑똑함을 인정받았다는 뜻이 담겨 있습니다. 결과적으로 훗날 위대한 과학자가 된 사람의 어린 시절 일화입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">must have seen\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">must have noticed\u003c/span>\u003cdiv class=\"w\">see 대신 notice를 쓰면 '알아차렸다'는 뜻이 더 분명해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">top of the class\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at the top of my class\u003c/span>\u003cdiv class=\"w\">class 앞에 at the를 넣어 '학급에서 최상위'임을 또렷하게 표현한 것입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">top of the class\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">head of the class\u003c/span>\u003cspan class=\"y-eq\">top of the class = head of the class\u003c/span>\u003cdiv class=\"w\">둘 다 학급 수석이라는 뜻으로 미국 영어에서 자주 쓰입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">potential\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">possibility\u003c/span>\u003cspan class=\"y-eq\">potential = possibility\u003c/span>\u003cdiv class=\"w\">가능성이라는 뜻으로 사람에게는 잠재력, 상황에는 가능성으로 해석합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nickname\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pet name\u003c/span>\u003cspan class=\"y-eq\">nickname = pet name\u003c/span>\u003cdiv class=\"w\">애칭이나 별명을 가리키는 유의어지만 pet name은 더 다정한 이름입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I was never the best student in school, but my friends must have noticed my potential, as they called me Einstein.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"학창 시절 성적은 최상위가 아니었는데도 친구들이 별명을 아인슈타인이라고 불렀다는 건, 이미 주변에서 그 친구의 가능성을 알아봤다는 뜻이에요. 지금은 위대한 물리학자가 된 스티븐 호킹의 일화라서 더 의미가 있죠.","hl":"mn"},{"n":18,"text":"must have seen은 must have noticed로 바꿔서 알아차렸다는 의미를 강조할 수 있어요. top of the class는 at the top of my class처럼 바꿔도 자연스럽습니다.","hl":"rw"},{"n":19,"text":"top of the class는 head of the class와 같은 말이고, potential은 possibility와 유사하게 쓰여요. nickname은 pet name과 연결해서 기억해 두면 좋아요.","hl":"ph"},{"n":20,"text":"패러프레이징하면 이렇게 말할 수 있어요. I was never the best student in school, but my friends must have noticed my potential, as they called me Einstein. 뜻은 원래 문장과 같아요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 One's true feelings \u003cspan class=\"fx\">cannot but come through\u003c/span> in what one says and does.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">One's true feelings\u003c/div>\u003cdiv class=\"k\">사람의 진정한 감정은\u003c/div>\u003cdiv class=\"e\">cannot but come through\u003c/div>\u003cdiv class=\"k\">전해지지 않을 수 없다\u003c/div>\u003cdiv class=\"e\">in what one says and does.\u003c/div>\u003cdiv class=\"k\">사람이 말하고 행하는 것 속에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">cannot but v\u003c/b>는 '~하지 않을 수 없다'는 불가피성을 나타냅니다. 주어가 One's true feelings이므로 감정이 드러나지 않을 수 없다는 뜻입니다.\u003c/div>","segs":[{"n":21,"text":"One's true feelings, 사람의 진정한 감정은. cannot but come through, 전해지지 않을 수 없다. in what one says and does, 사람이 말하고 행하는 것 속에","hl":"ch"},{"n":22,"text":"네 번째 문장은 cannot but come through가 핵심이에요. cannot but 다음에 동사원형이 오면 하지 않을 수 없다는 뜻이 되죠. 주어가 진정한 감정이니까, 감정이 드러나지 않을 수 없다는 거예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 One's true feelings \u003cspan class=\"fx\">cannot but come through\u003c/span> in what one says and does.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>아무리 숨기려 해도 진심은 말과 행동에 반드시 드러난다는 뜻입니다. 말과 행동이 곧 마음의 거울이라는 의미를 담고 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cannot but come through\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cannot help but come through\u003c/span>\u003cdiv class=\"w\">cannot but 대신 cannot help but을 써도 같은 뜻이며 구어에서 더 흔합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cannot but come through\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cannot help coming through\u003c/span>\u003cdiv class=\"w\">cannot help v-ing로 바꾸면 동명사를 쓰는 구조가 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">come through\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be revealed\u003c/span>\u003cspan class=\"y-eq\">come through = be revealed\u003c/span>\u003cdiv class=\"w\">전해지다를 드러나다로 바꾼 수동 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">says and does\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">words and deeds\u003c/span>\u003cspan class=\"y-eq\">what one says and does = one's words and deeds\u003c/span>\u003cdiv class=\"w\">말과 행동을 명사구로 압축한 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">What a person truly feels is bound to show in their words and actions.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"사람의 진심은 말과 행동에 반드시 배어 나오기 마련이라는 뜻이에요. 말로 아무리 숨기려 해도 행동에서 결국 드러난다는, 진심은 숨길 수 없다는 의미입니다.","hl":"mn"},{"n":24,"text":"cannot but는 cannot help but으로 바꾸거나 cannot help coming through처럼 cannot help plus 동명사로 바꿔도 똑같이 하지 않을 수 없다는 뜻이 돼요.","hl":"rw"},{"n":25,"text":"come through는 be revealed처럼 드러나다로 바꿀 수 있고, what one says and does는 one's words and deeds로 압축해서 말할 수 있어요.","hl":"ph"},{"n":26,"text":"전체를 바꾸면 What a person truly feels is bound to show in their words and actions. 이렇게 말해도 진심이 말과 행동에 반드시 나타난다는 같은 의미예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 A man \u003cspan class=\"fx\">may well be condemned\u003c/span>, not for doing something, but for doing nothing.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A man may well be condemned,\u003c/div>\u003cdiv class=\"k\">사람은 아마 책망 받을 것이다\u003c/div>\u003cdiv class=\"e\">not for doing something,\u003c/div>\u003cdiv class=\"k\">어떤 일을 해서가 아니라\u003c/div>\u003cdiv class=\"e\">but for doing nothing.\u003c/div>\u003cdiv class=\"k\">아무것도 하지 않기 때문에\u003c/div>\u003cdiv class=\"e\">William Barclay\u003c/div>\u003cdiv class=\"k\">윌리엄 바클레이\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">may well v\u003c/b>는 '아마 ~일 것이다' 또는 '~하는 것은 당연하다'는 뜻입니다. 여기서는 be condemned와 만나 책망받을 만하다, 책망받아도 싸다는 뜻입니다.\u003c/div>","segs":[{"n":27,"text":"A man may well be condemned, 사람은 아마 책망 받을 것이다. not for doing something, 어떤 일을 해서가 아니라. but for doing nothing, 아무것도 하지 않기 때문에. William Barclay, 윌리엄 바클레이","hl":"ch"},{"n":28,"text":"다섯 번째 문장의 핵심은 may well be condemned예요. may well 다음에 동사원형이 오면 아마 그러할 것이다, 혹은 그렇게 되는 것이 당연하다는 뜻이에요. 여기서는 사람이 책망받을 만하다는 뜻으로 쓰였습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 A man \u003cspan class=\"fx\">may well be condemned\u003c/span>, not for doing something, but for doing nothing.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사람이 비난받는 이유는 잘못된 행동 때문이 아니라 아무 행동도 하지 않았기 때문이라는 역설입니다. 침묵과 방관도 책임이 있다는 메시지를 전합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">may well be condemned\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">may rightly be blamed\u003c/span>\u003cdiv class=\"w\">may well의 당연함을 rightly로 바꾸고, condemned를 blamed로 순화한 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not for doing something, but for doing nothing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">not because he does something, but because he does nothing\u003c/span>\u003cdiv class=\"w\">for를 because로 바꾸어 이유를 더 명시적으로 드러낸 문장입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be condemned\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be criticized\u003c/span>\u003cspan class=\"y-eq\">be condemned = be criticized\u003c/span>\u003cdiv class=\"w\">둘 다 비난받다는 뜻이지만 criticized가 더 일반적입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">doing nothing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">inaction\u003c/span>\u003cspan class=\"y-eq\">doing nothing = inaction\u003c/span>\u003cdiv class=\"w\">아무것도 하지 않음을 명사 한 단어로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">may well\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be likely to\u003c/span>\u003cspan class=\"y-eq\">may well = be likely to\u003c/span>\u003cdiv class=\"w\">가능성이 높다는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A person may rightly be blamed not for acting, but for failing to act.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"사람이 오히려 어떤 행동을 했기 때문이 아니라 아무것도 하지 않았기 때문에 비난받을 수 있다는 역설이에요. 해야 할 일을 방관하는 것도 잘못이라는 메시지를 담고 있어요.","hl":"mn"},{"n":30,"text":"may well be condemned는 may rightly be blamed로 바꾸면 당연히 비난받아 마땅하다는 뜻이 더 분명해져요. not for doing something, but for doing nothing은 not because he does something, but because he does nothing으로 이유를 강조할 수도 있습니다.","hl":"rw"},{"n":31,"text":"condemned는 criticized와 유의어이고, doing nothing은 inaction이라는 한 단어로 바꿀 수 있어요. may well은 be likely to와 연결해서 가능성이 높다는 뜻으로 기억하면 좋습니다.","hl":"ph"},{"n":32,"text":"패러프레이징하면 A person may rightly be blamed not for acting, but for failing to act. 이렇게 말해도 행동하지 않은 것이 더 큰 잘못이라는 같은 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 It's defeatist to harp on what might have been, and yet, it's hard to resist considering what might have been.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It's defeatist\u003c/div>\u003cdiv class=\"k\">패배주의적이다\u003c/div>\u003cdiv class=\"e\">to harp on\u003c/div>\u003cdiv class=\"k\">되뇌는 것은\u003c/div>\u003cdiv class=\"e\">what might have been,\u003c/div>\u003cdiv class=\"k\">무슨 일이 있었을지도 모른다고\u003c/div>\u003cdiv class=\"e\">and yet, it's hard\u003c/div>\u003cdiv class=\"k\">그렇다 하더라도 어렵다\u003c/div>\u003cdiv class=\"e\">to resist considering\u003c/div>\u003cdiv class=\"k\">생각하는 것을 참는 것은\u003c/div>\u003cdiv class=\"e\">what might have been.\u003c/div>\u003cdiv class=\"k\">무슨 일이 있었을지도 모른다고\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">might have v-ed\u003c/b>가 두 번 쓰여 과거에 다른 선택을 했다면 어땠을까 하는 가능성을 나타냅니다. It은 가주어이고 to harp on 이하와 to resist considering 이하가 각각 진주어입니다.\u003c/div>","segs":[{"n":33,"text":"It's defeatist, 패배주의적이다. to harp on, 되뇌는 것은. what might have been, 무슨 일이 있었을지도 모른다고. and yet, it's hard, 그렇다 하더라도 어렵다. to resist considering, 생각하는 것을 참는 것은. what might have been, 무슨 일이 있었을지도 모른다고","hl":"ch"},{"n":34,"text":"여섯 번째 문장은 what might have been이 두 번 반복돼요. might have been은 과거의 일에 대해 그때 그렇게 됐을지도 모른다는 가능성을 나타내는 표현이에요. 문장 전체는 가주어 it이 이끌고, to harp on 이하가 첫 번째 진주어, to resist considering 이하가 두 번째 진주어로 쓰였어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 It's defeatist to harp on what might have been, and yet, it's hard to resist considering what might have been.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이미 지나간 일에 대해 계속 되뇌는 것은 패배주의적이지만, 그렇다고 그 가능성을 떠올리지 않기는 어렵다는 인간의 모순을 말합니다. 돌이킬 수 없는 과거에 대한 미련과 아쉬움을 표현합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">harp on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">dwell on\u003c/span>\u003cdiv class=\"w\">harp on과 dwell on은 둘 다 같은 생각을 반복해서 되뇌다는 뜻입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">what might have been\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">what could have happened\u003c/span>\u003cdiv class=\"w\">might have been을 could have happened로 바꾸어 과거의 가능성을 더 구체적으로 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">defeatist\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pessimistic\u003c/span>\u003cspan class=\"y-eq\">defeatist = pessimistic\u003c/span>\u003cdiv class=\"w\">패배주의적인을 비관적인으로 바꾼 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">harp on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">keep talking about\u003c/span>\u003cspan class=\"y-eq\">harp on = keep talking about\u003c/span>\u003cdiv class=\"w\">같은 말을 계속 되풀이하다는 뜻을 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">resist considering\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">refrain from considering\u003c/span>\u003cspan class=\"y-eq\">resist considering = refrain from considering\u003c/span>\u003cdiv class=\"w\">생각하는 것을 삼가다는 뜻으로 더 격식 있는 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">It is pessimistic to keep dwelling on what could have happened, and yet it is difficult to stop wondering about the past.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"과거에 다른 선택을 했더라면 어땠을까를 계속 되뇌는 것은 패배주의적이지만, 그럼에도 그 가능성을 생각하지 않기 어렵다는 뜻이에요. 지나간 일에 대한 아쉬움에서 쉽게 벗어나기 어렵다는 인간의 모순을 말하고 있죠.","hl":"mn"},{"n":36,"text":"harp on은 dwell on으로 바꿔 같은 의미를 나타낼 수 있고, what might have been은 what could have happened로 바꾸면 과거의 가능성이 더 또렷해져요.","hl":"rw"},{"n":37,"text":"defeatist는 pessimistic과 이어서 기억하고, harp on은 keep talking about으로 풀어 쓸 수 있어요. resist considering은 refrain from considering과 같은 뜻이에요.","hl":"ph"},{"n":38,"text":"전체를 바꾸면 It is pessimistic to keep dwelling on what could have happened, and yet it is difficult to stop wondering about the past. 이렇게 말해도 같은 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07  The suspect \u003cspan class=\"fx\">can't have committed\u003c/span> the crime as he was in another country at the moment of the murder.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The suspect\u003c/div>\u003cdiv class=\"k\">그 용의자가\u003c/div>\u003cdiv class=\"e\">can't have committed\u003c/div>\u003cdiv class=\"k\">저질렀을 리가 없다\u003c/div>\u003cdiv class=\"e\">the crime\u003c/div>\u003cdiv class=\"k\">그 범죄를\u003c/div>\u003cdiv class=\"e\">as he was\u003c/div>\u003cdiv class=\"k\">그가 있었기 때문에\u003c/div>\u003cdiv class=\"e\">in another country\u003c/div>\u003cdiv class=\"k\">다른 나라에\u003c/div>\u003cdiv class=\"e\">at the moment of the murder.\u003c/div>\u003cdiv class=\"k\">살인의 순간에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">cannot have v-ed\u003c/b>는 과거의 일에 대한 강한 부정적 추측으로 '~했을 리가 없다'는 뜻입니다. as가 이유를 나타내는 접속사로 쓰였습니다.\u003c/div>","segs":[{"n":39,"text":"The suspect, 그 용의자가. can't have committed, 저질렀을 리가 없다. the crime, 그 범죄를. as he was, 그가 있었기 때문에. in another country, 다른 나라에. at the moment of the murder, 살인의 순간에","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 can't have committed가 핵심이에요. can't have 다음에 과거분사가 오면 그런 일이 있었을 리가 없다는 강한 부정적 추측을 나타내요. as 이하에서는 그렇게 판단하는 이유를 설명하고 있죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07  The suspect \u003cspan class=\"fx\">can't have committed\u003c/span> the crime as he was in another country at the moment of the murder.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>용의자가 범죄를 저지르지 않았을 것이라는 확신을 나타냅니다. 범행 순간에 다른 나라에 있었다는 알리바이를 제시하며 무죄를 주장하는 상황입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">can't have committed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">couldn't have committed\u003c/span>\u003cdiv class=\"w\">can't have v-ed와 couldn't have v-ed는 둘 다 과거의 부정적 추측으로 쓰입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as he was in another country\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">because he was abroad\u003c/span>\u003cdiv class=\"w\">as를 because로, in another country를 abroad로 압축한 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">suspect\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">alleged criminal\u003c/span>\u003cspan class=\"y-eq\">suspect = alleged criminal\u003c/span>\u003cdiv class=\"w\">용의자를 혐의자라는 뜻으로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">commit a crime\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">carry out a crime\u003c/span>\u003cspan class=\"y-eq\">commit a crime = carry out a crime\u003c/span>\u003cdiv class=\"w\">범죄를 저지르다를 수행하다로 바꾼 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at the moment of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at the time of\u003c/span>\u003cspan class=\"y-eq\">at the moment of = at the time of\u003c/span>\u003cdiv class=\"w\">바로 그 순간을 그때로 바꿔 덜 극적인 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The alleged criminal couldn't have carried out the crime because he was abroad at the time of the murder.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"용의자가 범죄를 저질렀을 리가 없다고 단정하는 거예요. 왜냐하면 살인 사건이 일어난 바로 그 순간에 그는 다른 나라에 있었기 때문이죠. 알리바이를 바탕으로 무죄를 주장하는 상황입니다.","hl":"mn"},{"n":42,"text":"can't have committed는 couldn't have committed로 바꿔도 거의 같은 뜻이에요. as he was in another country는 because he was abroad로 압축할 수 있고요.","hl":"rw"},{"n":43,"text":"suspect는 alleged criminal과, commit a crime은 carry out a crime과 연결해 기억하세요. at the moment of는 at the time of로 바꿔 쓸 수 있어요.","hl":"ph"},{"n":44,"text":"패러프레이징하면 The alleged criminal couldn't have carried out the crime because he was abroad at the time of the murder. 이렇게 말해도 같은 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 You might as well expect rivers to run backwards as any man born free to be contented penned up.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">You might as well expect\u003c/div>\u003cdiv class=\"k\">당신은 기대하는 것이 나을 것이다\u003c/div>\u003cdiv class=\"e\">rivers to run backwards\u003c/div>\u003cdiv class=\"k\">강이 거꾸로 흐르는 것을\u003c/div>\u003cdiv class=\"e\">as any man born free\u003c/div>\u003cdiv class=\"k\">자유롭게 태어난 어떤 사람이\u003c/div>\u003cdiv class=\"e\">to be contented penned up.\u003c/div>\u003cdiv class=\"k\">가두어진 채로 만족하는 것을 기대하느니\u003c/div>\u003cdiv class=\"e\">Chief Joseph\u003c/div>\u003cdiv class=\"k\">추장 조셉\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">may/might as well A as B\u003c/b>는 'B하느니 A하는 게 낫다'는 뜻입니다. as 뒤에는 expect가 생략되었고, any man은 born free의 수식을 받습니다.\u003c/div>","segs":[{"n":45,"text":"You might as well expect, 당신은 기대하는 것이 나을 것이다. rivers to run backwards, 강이 거꾸로 흐르는 것을. as any man born free, 자유롭게 태어난 어떤 사람이. to be contented penned up, 가두어진 채로 만족하는 것을 기대하느니. Chief Joseph, 추장 조셉","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 might as well A as B 구문이에요. B하느니 A하는 것이 낫다는 뜻인데, B에는 원래 expect가 있어야 하지만 생략되어 있어요. any man born free는 자유롭게 태어난 어떤 사람이라는 뜻이고, penned up은 갇혀 있다는 의미예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 You might as well expect rivers to run backwards as any man born free to be contented penned up.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>강이 거꾸로 흐르기를 기대하는 것이 자유롭게 태어난 사람이 갇혀서 만족하기를 기대하는 것만큼이나 불가능한 일이라는 뜻입니다. 자유를 빼앗긴 상태에서는 결코 만족할 수 없다는 강한 저항의 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">might as well expect\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">may just as well expect\u003c/span>\u003cdiv class=\"w\">might as well을 may just as well로 바꾸어도 같은 뜻이며 조금 더 강조됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">contented penned up\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">contented while imprisoned\u003c/span>\u003cdiv class=\"w\">penned up을 while imprisoned로 바꾸어 갇혀 있는 상태임을 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">run backwards\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">flow backward\u003c/span>\u003cspan class=\"y-eq\">run backwards = flow backward\u003c/span>\u003cdiv class=\"w\">강이 거꾸로 흐르다를 flow backward로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">born free\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">free by birth\u003c/span>\u003cspan class=\"y-eq\">born free = free by birth\u003c/span>\u003cdiv class=\"w\">태어날 때부터 자유롭다를 전치사구로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">penned up\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">confined\u003c/span>\u003cspan class=\"y-eq\">penned up = confined\u003c/span>\u003cdiv class=\"w\">가두어 두다는 뜻의 동의어로 confined가 더 격식 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">You may just as well expect rivers to flow backward as expect a person born free to be satisfied while confined.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"강이 거꾸로 흐르기를 바라는 것이나 자유롭게 태어난 사람이 갇힌 채 만족하기를 바라는 것이나 똑같이 불가능하다는 뜻이에요. 자유를 억압당하면 결코 만족할 수 없다는 원주민 추장의 강한 메시지가 담겨 있죠.","hl":"mn"},{"n":48,"text":"might as well은 may just as well로 바꿔도 뜻이 같아요. contented penned up은 contented while imprisoned로 바꾸면 갇혀 있는 상태가 더 분명해집니다.","hl":"rw"},{"n":49,"text":"run backwards는 flow backward로, born free는 free by birth로 바꿀 수 있어요. penned up은 confined와 연결해 기억하면 좋아요.","hl":"ph"},{"n":50,"text":"전체를 바꾸면 You may just as well expect rivers to flow backward as expect a person born free to be satisfied while confined. 이렇게 말해도 똑같은 의미예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 The Brothers Karamazov, one of the peaks in the literature of the world, \u003cspan class=\"fx\">can hardly be valued too highly\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The Brothers Karamazov,\u003c/div>\u003cdiv class=\"k\">카라마조프가의 형제들은\u003c/div>\u003cdiv class=\"e\">one of the peaks\u003c/div>\u003cdiv class=\"k\">최고봉 중의 하나인\u003c/div>\u003cdiv class=\"e\">in the literature of the world,\u003c/div>\u003cdiv class=\"k\">세계 문학에서\u003c/div>\u003cdiv class=\"e\">can hardly be valued too highly.\u003c/div>\u003cdiv class=\"k\">아무리 높이 평가되어도 지나치지 않다\u003c/div>\u003cdiv class=\"e\">Sigmund Freud\u003c/div>\u003cdiv class=\"k\">지그문트 프로이트\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">cannot/can hardly + v + too\u003c/b>는 '아무리 ~해도 지나치지 않다'는 뜻입니다. 여기서는 hardly가 can을 부정하여 can hardly be valued too highly가 되었습니다.\u003c/div>","segs":[{"n":51,"text":"The Brothers Karamazov, 카라마조프가의 형제들은. one of the peaks, 최고봉 중의 하나인. in the literature of the world, 세계 문학에서. can hardly be valued too highly, 아무리 높이 평가되어도 지나치지 않다. Sigmund Freud, 지그문트 프로이트","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 can hardly be valued too highly가 핵심이에요. cannot이나 can hardly 다음에 too가 오면 아무리 해도 지나치지 않다는 뜻이에요. 그러니까 이 작품은 아무리 높이 평가해도 부족하지 않다는 거죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 The Brothers Karamazov, one of the peaks in the literature of the world, \u003cspan class=\"fx\">can hardly be valued too highly\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>카라마조프가의 형제들이 세계 문학 최고봉 중 하나이므로 아무리 높게 평가해도 부족하지 않다는 극찬입니다. 프로이트가 이 작품을 얼마나 높이 평가했는지 보여줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">can hardly be valued too highly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cannot be overestimated\u003c/span>\u003cdiv class=\"w\">아무리 높이 평가해도 지나치지 않다를 한 단어 overestimate로 바꾼 간결한 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">one of the peaks\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">one of the masterpieces\u003c/span>\u003cdiv class=\"w\">peaks를 masterpieces로 바꾸면 걸작이라는 뜻이 더 직접적으로 드러납니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">peaks\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">summits\u003c/span>\u003cspan class=\"y-eq\">peaks = summits\u003c/span>\u003cdiv class=\"w\">최고점이라는 뜻의 유의어로 summit은 정상을 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">literature\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">letters\u003c/span>\u003cspan class=\"y-eq\">literature = letters\u003c/span>\u003cdiv class=\"w\">문학을 뜻하는 letters는 문학 분야 전체를 가리키는 격식 있는 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">valued\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">esteemed\u003c/span>\u003cspan class=\"y-eq\">value = esteem\u003c/span>\u003cdiv class=\"w\">평가하다를 존중하다로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The Brothers Karamazov, one of the world's literary masterpieces, cannot be praised too much.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"카라마조프가의 형제들은 세계 문학에서 가장 뛰어난 작품 중 하나이고, 너무 높게 평가할 수가 없다는 뜻이에요. 정신분석학자 프로이트가 이 소설을 극찬한 말이에요.","hl":"mn"},{"n":54,"text":"can hardly be valued too highly는 cannot be overestimated로 바꾸면 아무리 높이 평가해도 지나치지 않다는 뜻이 한 단어로 압축돼요. one of the peaks는 one of the masterpieces로 바꿀 수 있습니다.","hl":"rw"},{"n":55,"text":"peaks는 summits와, literature는 letters와 연결해 기억하세요. valued는 esteemed로 바꿔도 평가하다는 뜻이 유지돼요.","hl":"ph"},{"n":56,"text":"패러프레이징하면 The Brothers Karamazov, one of the world's literary masterpieces, cannot be praised too much. 이렇게 말해도 같은 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 The universe \u003cspan class=\"fx\">must have originated\u003c/span> from a more compact state that we call the Big Bang.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The universe\u003c/div>\u003cdiv class=\"k\">우주는\u003c/div>\u003cdiv class=\"e\">must have originated\u003c/div>\u003cdiv class=\"k\">생겨났음에 틀림없다\u003c/div>\u003cdiv class=\"e\">from a more compact state\u003c/div>\u003cdiv class=\"k\">더 조밀한 상태로부터\u003c/div>\u003cdiv class=\"e\">that we call\u003c/div>\u003cdiv class=\"k\">우리가 부르는\u003c/div>\u003cdiv class=\"e\">the Big Bang.\u003c/div>\u003cdiv class=\"k\">빅뱅이라고\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">must have v-ed\u003c/b>가 과거의 일에 대한 강한 추측으로 쓰였습니다. that 이하는 state를 수식하는 형용사절입니다.\u003c/div>","segs":[{"n":57,"text":"The universe, 우주는. must have originated, 생겨났음에 틀림없다. from a more compact state, 더 조밀한 상태로부터. that we call, 우리가 부르는. the Big Bang, 빅뱅이라고","hl":"ch"},{"n":58,"text":"열 번째 문장의 핵심은 must have originated이에요. must have 다음에 과거분사가 오면 과거의 일에 대해 분명히 그랬을 것이라고 강하게 추측하는 표현이 됩니다. that 이하는 앞에 있는 state를 꾸며 주는 형용사절이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 The universe \u003cspan class=\"fx\">must have originated\u003c/span> from a more compact state that we call the Big Bang.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우주가 빅뱅이라고 불리는 더 조밀한 상태에서 시작되었을 것이라는 과학적 추측입니다. 기원에 대한 강한 확신을 표현합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">must have originated\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is believed to have originated\u003c/span>\u003cdiv class=\"w\">must have v-ed를 수동적 추측 표현으로 바꾸어 같은 의미를 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a more compact state\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a denser state\u003c/span>\u003cdiv class=\"w\">compact를 denser로 바꾸면 밀도가 더 높다는 과학적 뉘앙스가 강해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">originated from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">came from\u003c/span>\u003cspan class=\"y-eq\">originate from = come from\u003c/span>\u003cdiv class=\"w\">~에서 유래하다를 더 쉬운 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">compact\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">dense\u003c/span>\u003cspan class=\"y-eq\">compact = dense\u003c/span>\u003cdiv class=\"w\">조밀한이라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">state\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">condition\u003c/span>\u003cspan class=\"y-eq\">state = condition\u003c/span>\u003cdiv class=\"w\">상태를 뜻하는 두 단어는 자주 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The universe is believed to have come from a denser condition that we call the Big Bang.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"우주는 빅뱅이라고 부르는 더 조밀한 상태에서 생겨났을 것이라는 과학적 설명이에요. 우주의 기원에 대한 강한 확신을 담아 말하고 있죠.","hl":"mn"},{"n":60,"text":"must have originated은 is believed to have originated으로 바꾸면 사람들이 그렇게 믿고 있다는 뜻으로 자연스럽게 전환돼요. a more compact state는 a denser state로 바꿀 수 있습니다.","hl":"rw"},{"n":61,"text":"originated from은 came from으로, compact는 dense로, state는 condition으로 바꿔 쓸 수 있어요.","hl":"ph"},{"n":62,"text":"전체를 바꾸면 The universe is believed to have come from a denser condition that we call the Big Bang. 이렇게 말해도 우주의 기원에 대한 같은 추측을 나타내요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11  When the epidemic broke out, it claimed many lives. The authorities \u003cspan class=\"fx\">ought to have taken\u003c/span> precautions to prevent the epidemic.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">When the epidemic broke out,\u003c/div>\u003cdiv class=\"k\">그 전염병이 발생했을 때\u003c/div>\u003cdiv class=\"e\">it claimed many lives.\u003c/div>\u003cdiv class=\"k\">그것은 많은 생명을 앗아갔다\u003c/div>\u003cdiv class=\"e\">The authorities\u003c/div>\u003cdiv class=\"k\">당국은\u003c/div>\u003cdiv class=\"e\">ought to have taken\u003c/div>\u003cdiv class=\"k\">취했어야 했다\u003c/div>\u003cdiv class=\"e\">precautions\u003c/div>\u003cdiv class=\"k\">예방조치를\u003c/div>\u003cdiv class=\"e\">to prevent the epidemic.\u003c/div>\u003cdiv class=\"k\">그 전염병을 예방하기 위해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">ought to have v-ed\u003c/b>는 '~했어야 했는데 (하지 못했다)'는 과거에 대한 후회를 나타냅니다. to prevent는 목적을 나타내는 부사적 용법입니다.\u003c/div>","segs":[{"n":63,"text":"When the epidemic broke out, 그 전염병이 발생했을 때. it claimed many lives, 그것은 많은 생명을 앗아갔다. The authorities, 당국은. ought to have taken, 취했어야 했다. precautions, 예방조치를. to prevent the epidemic, 그 전염병을 예방하기 위해","hl":"ch"},{"n":64,"text":"열한 번째 문장은 ought to have taken이 핵심이에요. ought to have 다음에 과거분사가 오면 과거에 해야 했지만 실제로는 하지 못한 일을 나타내요. 뒤에 to prevent the epidemic은 방역을 위한 목적을 나타내고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11  When the epidemic broke out, it claimed many lives. The authorities \u003cspan class=\"fx\">ought to have taken\u003c/span> precautions to prevent the epidemic.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>전염병이 발생해 많은 사람이 죽었고, 당국이 미리 예방 조치를 했어야 했다는 비판과 안타까움을 담고 있습니다. 과거의 잘못된 대응을 돌아보는 표현입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ought to have taken\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">should have taken\u003c/span>\u003cdiv class=\"w\">ought to have v-ed와 should have v-ed는 과거의 후회를 나타내는 대표적인 짝입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">claimed many lives\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">caused many deaths\u003c/span>\u003cdiv class=\"w\">생명을 앗아가다를 죽음을 일으키다로 바꾼 더 직접적인 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">broke out\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">erupted\u003c/span>\u003cspan class=\"y-eq\">break out = erupt\u003c/span>\u003cdiv class=\"w\">전염병이나 전쟁이 갑자기 발생하다는 뜻으로 erupted가 더 극적입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">precautions\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">preventive measures\u003c/span>\u003cspan class=\"y-eq\">take precautions = take preventive measures\u003c/span>\u003cdiv class=\"w\">예방 조치를 취하다를 더 격식 있게 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">authorities\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">government officials\u003c/span>\u003cspan class=\"y-eq\">the authorities = government officials\u003c/span>\u003cdiv class=\"w\">당국을 공무원들로 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">When the epidemic erupted, it caused many deaths. The government officials should have taken preventive measures to stop the epidemic.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"전염병이 퍼져서 많은 목숨을 잃었고, 당국은 미리 예방 조치를 했어야 했다는 후회와 비판이 담긴 문장이에요. 이미 벌어진 일에 대한 아쉬움을 표현하고 있죠.","hl":"mn"},{"n":66,"text":"ought to have taken은 should have taken으로 바꾸면 더 일상적인 표현이 돼요. claimed many lives는 caused many deaths로 바꾸면 죽음을 초래했다는 뜻이 더 분명해집니다.","hl":"rw"},{"n":67,"text":"broke out은 erupted와, take precautions는 take preventive measures와 연결해 기억하세요. the authorities는 government officials로 풀어 쓸 수 있어요.","hl":"ph"},{"n":68,"text":"패러프레이징하면 When the epidemic erupted, it caused many deaths. The government officials should have taken preventive measures to stop the epidemic. 이렇게 말해도 같은 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12  I would rather be a ghost, drifting by your side as a condemned soul, than enter  heaven without you.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I would rather be\u003c/div>\u003cdiv class=\"k\">나는 차라리 되고 싶다\u003c/div>\u003cdiv class=\"e\">a ghost,\u003c/div>\u003cdiv class=\"k\">유령이\u003c/div>\u003cdiv class=\"e\">drifting by your side\u003c/div>\u003cdiv class=\"k\">당신 곁을 떠돌면서\u003c/div>\u003cdiv class=\"e\">as a condemned soul,\u003c/div>\u003cdiv class=\"k\">저주받은 영혼으로서\u003c/div>\u003cdiv class=\"e\">than enter heaven\u003c/div>\u003cdiv class=\"k\">천국에 들어가느니\u003c/div>\u003cdiv class=\"e\">without you.\u003c/div>\u003cdiv class=\"k\">당신이 없는\u003c/div>\u003cdiv class=\"e\">the movie &lt;Crouching Dragon Hidden Tiger, 와호장룡&gt;\u003c/div>\u003cdiv class=\"k\">영화 와호장룡\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">would rather A than B\u003c/b>에서 A와 B에는 둘 다 동사원형이 옵니다. 여기서는 be a ghost와 enter heaven이 비교되고, drifting 이하는 분사구문으로 '~하면서'라는 동시 상황을 나타냅니다.\u003c/div>","segs":[{"n":69,"text":"I would rather be, 나는 차라리 되고 싶다. a ghost, 유령이. drifting by your side, 당신 곁을 떠돌면서. as a condemned soul, 저주받은 영혼으로서. than enter heaven, 천국에 들어가느니. without you, 당신이 없는. the movie \u003cCrouching Dragon Hidden Tiger, 와호장룡>, 영화 와호장룡","hl":"ch"},{"n":70,"text":"열두 번째 문장은 would rather A than B 구문이에요. A에는 be a ghost, B에는 enter heaven이 왔고 둘 다 동사원형이죠. 중간에 drifting으로 시작하는 분사구문이 삽입되어 당신 곁을 떠돌면서라는 동시 상황을 표현해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12  I would rather be a ghost, drifting by your side as a condemned soul, than enter  heaven without you.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>천국이라도 사랑하는 사람이 없다면 들어가지 않고, 차라리 저주받은 영혼이 되어 그 사람 곁을 맴돌겠다는 극적인 사랑 고백입니다. 영화 와호장룡의 대사입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">would rather be a ghost\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">would sooner become a ghost\u003c/span>\u003cdiv class=\"w\">would rather를 would sooner로 바꾸고 be를 become으로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">drifting by your side\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">floating beside you\u003c/span>\u003cdiv class=\"w\">drifting을 floating으로 바꾸면 떠다니다는 이미지가 더 구체적입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">drifting\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">wandering\u003c/span>\u003cspan class=\"y-eq\">drift = wander\u003c/span>\u003cdiv class=\"w\">떠돌다를 정처 없이 거닐다로 바꾼 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by your side\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">beside you\u003c/span>\u003cspan class=\"y-eq\">by your side = beside you\u003c/span>\u003cdiv class=\"w\">곁에를 더 간결하게 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">condemned soul\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">damned soul\u003c/span>\u003cspan class=\"y-eq\">condemned soul = damned soul\u003c/span>\u003cdiv class=\"w\">저주받은 영혼을 뜻하는 유의어로 damned가 더 강렬합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I would sooner become a ghost, floating beside you as a damned soul, than go to heaven without you.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"사랑하는 사람이 없다면 천국에 가는 것보다 차라리 저주받은 영혼이 되어 곁을 떠도는 쪽을 택하겠다는 거예요. 죽음 이후에도 사랑하는 사람 곁에 있고 싶다는 강렬한 사랑 고백이에요.","hl":"mn"},{"n":72,"text":"would rather be는 would sooner become으로 바꿔도 뜻이 같고, drifting by your side는 floating beside you로 바꾸면 떠다니는 이미지가 더 선명해져요.","hl":"rw"},{"n":73,"text":"drifting은 wandering과, by your side는 beside you와, condemned soul은 damned soul과 연결해 기억하세요.","hl":"ph"},{"n":74,"text":"전체 패러프레이징은 I would sooner become a ghost, floating beside you as a damned soul, than go to heaven without you. 이렇게 말해도 사랑하는 사람 곁에 있겠다는 같은 뜻이에요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 08 조동사 구문\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>오늘 배운 조동사 과거 구문을 정리하면 \u003cb class=\"key\">must have v-ed\u003c/b>는 강한 추측, \u003cb class=\"key\">should/ought to have v-ed\u003c/b>는 후회, \u003cb class=\"key\">cannot have v-ed\u003c/b>는 부정적 추측입니다.\u003c/li>\u003cli>또한 \u003cb class=\"key\">would rather A than B\u003c/b>는 비교 선호, \u003cb class=\"key\">cannot but v\u003c/b>는 불가피함, \u003cb class=\"key\">may/might as well A as B\u003c/b>는 어차피 마찬가지라는 뜻입니다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 조동사가 과거와 만날 때 어떤 뜻이 되는지 집중해서 배웠어요. must have 과거분사는 강한 추측, should나 ought to have 과거분사는 후회, cannot have 과거분사는 부정적 추측을 나타내고요. would rather A than B는 비교 선호, cannot but는 불가피함, may as well은 어차피 같다는 뜻으로 정리하면 됩니다. 이 표현들은 고등학교 모의고사에서 매번 등장하니까 꼭 소리 내어 읽고 자기 문장으로 만들어 보세요. 오늘 수고했어요.","hl":"sum"}]}]});</script></body></html>
