  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

lecturePlayer(document.getElementById("app"),{"brand":"unit01","title":"마법같은 블록구문 실전편 unit01 명사구 주어","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">명사구 주어\u003c/div>\u003ch1>마법같은 블록구문 레드 Unit 01 명사구 주어 특강\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>주어 자리에 오는 to부정사와 동명사가 만드는 명사구를 익히고, 단수 동사로 받는다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마법같은 블록구문 레드 첫 번째 유닛, 명사구 주어를 함께 공부할 거예요. 주어 자리에 to부정사나 동명사가 오면 문장이 길어 보여도 결국 하나의 명사 덩어리라는 점이 핵심이에요. 예문 열두 개를 통해 주어를 통째로 묶어 읽는 힘을 길러 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">명사구 주어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">주어 자리에는 \u003cb class=\"key\">to-v\u003c/b>나 \u003cb class=\"key\">v-ing\u003c/b>가 이끄는 명사구가 온다. 이 명사구 주어는 길이와 관계없이 \u003cb class=\"key\">단수 취급\u003c/b>하여 단수 동사를 쓴다. and로 연결된 두 주어라도 하나의 의미로 묶이면 단수 동사를 쓴다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">Getting meaningful feedback on your performance\u003c/span> is a powerful strategy for learning anything.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">To love and to be loved\u003c/span> is the greatest happiness of existence.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 \u003cspan class=\"fx\">Knowing how climate has changed over millions of years\u003c/span> is vital to properly assess current global warming trends.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 \u003cspan class=\"fx\">Giving people the latitude and flexibility to use their judgment and apply their talents\u003c/span> rapidly accelerates progress.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">To think that you know something without actually knowing it\u003c/span> is a serious mistake.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">Considering issues in an appropriate context\u003c/span> will help you accurately evaluate the pros and cons of a decision.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 Is \u003cspan class=\"fx\">passing large sums of wealth on to your children\u003c/span> good for them or right for society?\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">Raising awareness of children about the particular characteristics of SNS and the potential long-term impact of a seemingly trivial act\u003c/span> is crucial.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 To conquer oneself is the best and noblest victory; to be vanquished by one's own nature is the worst and most ignoble defeat.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">Investing regularly in learning opportunities\u003c/span> is one of the greatest gifts you can give yourself.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">Having a large vocabulary\u003c/span> makes reading more enjoyable and increases the range of materials that you can explore.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">To say that AI will start doing what it wants for its own purposes\u003c/span> is like saying a calculator will start making its own calculations.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"주어 자리에 to부정사나 동명사가 오면 그 전체를 하나의 명사 덩어리로 봐야 해요. 예를 들어 Knowing yourself is the beginning of all wisdom에서 Knowing yourself 전체가 주어이므로 is를 쓰는 거예요. 주어가 길어도 동사는 단수로 받는다는 점을 꼭 기억하세요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">Getting meaningful feedback on your performance\u003c/span> is a powerful strategy for learning anything.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Getting meaningful feedback on your performance\u003c/div>\u003cdiv class=\"k\">의미 있는 피드백을 얻는 것은\u003c/div>\u003cdiv class=\"e\"> is a powerful strategy\u003c/div>\u003cdiv class=\"k\"> 강력한 전략이다\u003c/div>\u003cdiv class=\"e\"> for learning anything.\u003c/div>\u003cdiv class=\"k\"> 어떤 것을 배우기 위해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 자리에 동명사 \u003cb class=\"key\">Getting\u003c/b>이 이끄는 명사구가 왔다. 동명사 주어는 \u003cb class=\"key\">단수 취급\u003c/b>하므로 단수 동사 is를 썼다.\u003c/div>","segs":[{"n":3,"text":"Getting meaningful feedback on your performance, 의미 있는 피드백을 얻는 것은. is a powerful strategy, 강력한 전략이다. for learning anything, 어떤 것을 배우기 위해","hl":"ch"},{"n":4,"text":"이 문장은 동명사 Getting이 이끄는 긴 주어가 앞에 나오고 단수 동사 is가 바로 이어지는 구조예요. 주어가 아무리 길어도 동명사 주어는 단수로 보니까 is를 쓴다는 점을 기억하세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">Getting meaningful feedback on your performance\u003c/span> is a powerful strategy for learning anything.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>성과에 대한 의미 있는 피드백을 받는 행위 자체가 무엇을 배우든 강력한 전략이 된다는 뜻이다. 피드백을 단순히 듣는 것이 아니라 배움의 방법으로 적극 활용하라는 뉘앙스다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Getting meaningful feedback on your performance\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">To get meaningful feedback on your performance\u003c/span>\u003cdiv class=\"w\">동명사 주어를 to부정사 주어로 바꿔도 의미가 같고, to부정사 쪽이 더 격식 있는 느낌을 준다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a powerful strategy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">an effective method\u003c/span>\u003cdiv class=\"w\">일상적인 표현으로 바꾸면 의미가 더 쉽게 다가온다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">meaningful\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">valuable, useful\u003c/span>\u003cspan class=\"y-eq\">meaningful = valuable\u003c/span>\u003cdiv class=\"w\">가치 있고 쓸모 있다는 의미를 더 분명하게 드러낸다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">performance\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">work, results\u003c/span>\u003cspan class=\"y-eq\">performance = work output\u003c/span>\u003cdiv class=\"w\">성과를 일의 결과로 바꿔 이해하기 쉽게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">strategy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">method, approach\u003c/span>\u003cspan class=\"y-eq\">strategy = method\u003c/span>\u003cdiv class=\"w\">전략을 구체적인 방법이나 접근법으로 풀어 썼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Receiving useful feedback on your performance is a powerful way to learn anything.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"성과에 대한 의미 있는 피드백을 받는 것 자체가 무엇이든 배우기 위한 강력한 전략이라는 뜻이에요. 피드백을 소극적으로 듣는 게 아니라 성장 도구로 적극 활용하라는 뉘앙스가 담겨 있어요.","hl":"mn"},{"n":6,"text":"Getting meaningful feedback을 To get meaningful feedback으로 바꿔 써도 자연스러워요. 동명사 대신 to부정사를 쓰면 조금 더 격식 있는 느낌을 줄 수 있습니다.","hl":"rw"},{"n":7,"text":"meaningful은 valuable이나 useful로, performance는 work나 results로, strategy는 method나 approach로 바꿔 쓸 수 있어요. 모두 시험에 자주 나오는 짝이니까 같이 외워 두세요.","hl":"ph"},{"n":8,"text":"Receiving useful feedback on your performance is a powerful way to learn anything. 이렇게 바꾸면 getting을 receiving으로, strategy를 way로 바꿔서 같은 뜻을 더 쉽게 전달할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">To love and to be loved\u003c/span> is the greatest happiness of existence.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">To love and to be loved\u003c/div>\u003cdiv class=\"k\">사랑하고 사랑받는 것은\u003c/div>\u003cdiv class=\"e\"> is the greatest happiness of existence.\u003c/div>\u003cdiv class=\"k\"> 존재의 가장 큰 행복이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>두 개의 \u003cb class=\"key\">to부정사\u003c/b>가 and로 연결되어 주어로 쓰였다. 원칙적으로 and 연결 주어는 복수지만, 합쳐서 하나의 의미를 나타낼 때는 \u003cb class=\"key\">단수 취급\u003c/b>하여 is를 쓴다.\u003c/div>","segs":[{"n":9,"text":"To love and to be loved, 사랑하고 사랑받는 것은. is the greatest happiness of existence, 존재의 가장 큰 행복이다","hl":"ch"},{"n":10,"text":"이 문장은 To love and to be loved라는 두 개의 to부정사가 and로 연결된 주어를 쓰고 있어요. 보통 and로 연결되면 복수 동사를 쓰지만, 사랑하고 사랑받는 것을 하나의 경험으로 묶었기 때문에 is로 받는 거예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 \u003cspan class=\"fx\">To love and to be loved\u003c/span> is the greatest happiness of existence.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사랑하는 것과 사랑받는 것이 인생에서 누릴 수 있는 가장 큰 행복이라는 뜻이다. 능동과 수동의 사랑을 하나로 묶어 행복의 본질을 말하고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">To love and to be loved\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Loving and being loved\u003c/span>\u003cdiv class=\"w\">to부정사를 동명사로 바꿔도 주어 역할을 하며, 더 일상적인 어감을 준다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the greatest happiness of existence\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">life's greatest joy\u003c/span>\u003cdiv class=\"w\">존재의 가장 큰 행복을 더 짧고 자연스럽게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">existence\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">life, being\u003c/span>\u003cspan class=\"y-eq\">existence = life\u003c/span>\u003cdiv class=\"w\">존재를 삶이나 생명으로 바꿔 더 구체적으로 표현했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the greatest happiness\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the greatest joy\u003c/span>\u003cspan class=\"y-eq\">happiness = joy\u003c/span>\u003cdiv class=\"w\">행복을 기쁨으로 바꿔 감정적인 울림을 살렸다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Loving and being loved is life's greatest joy.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"사랑하는 것과 사랑받는 것이 존재의 가장 큰 행복이라는 뜻이에요. 능동적인 사랑과 수동적인 사랑을 하나로 묶어서 인생의 최고 행복을 말하고 있죠.","hl":"mn"},{"n":12,"text":"To love and to be loved를 Loving and being loved로 바꿔도 똑같이 주어 역할을 해요. to부정사가 격식 있는 느낌이라면 동명사는 더 부드럽고 일상적인 느낌을 줍니다.","hl":"rw"},{"n":13,"text":"existence는 life나 being으로, happiness는 joy로 바꿀 수 있어요. the greatest happiness는 the greatest joy로 바꾸면 더 간결해지죠.","hl":"ph"},{"n":14,"text":"Loving and being loved is life's greatest joy. 이렇게 바꾸면 같은 의미를 훨씬 짧고 리듬감 있게 전달할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 \u003cspan class=\"fx\">Knowing how climate has changed over millions of years\u003c/span> is vital to properly assess current global warming trends.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Knowing how climate has changed over millions of years\u003c/div>\u003cdiv class=\"k\">기후가 수백만 년 동안 어떻게 변했는지를 아는 것은\u003c/div>\u003cdiv class=\"e\"> is vital\u003c/div>\u003cdiv class=\"k\"> 필수적이다\u003c/div>\u003cdiv class=\"e\"> to properly assess current global warming trends.\u003c/div>\u003cdiv class=\"k\"> 현재 지구 온난화 추세를 제대로 판단하기 위해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어로 쓰인 \u003cb class=\"key\">동명사 Knowing\u003c/b>이 목적어로 명사절 how climate has changed over millions of years를 취했다. is가 문장의 동사이고, to-v는 \u003cb class=\"key\">부사적 용법의 목적\u003c/b>으로 쓰였다.\u003c/div>","segs":[{"n":15,"text":"Knowing how climate has changed over millions of years, 기후가 수백만 년 동안 어떻게 변했는지를 아는 것은. is vital, 필수적이다. to properly assess current global warming trends, 현재 지구 온난화 추세를 제대로 판단하기 위해","hl":"ch"},{"n":16,"text":"이 문장은 동명사 Knowing이 주어이고, 그 뒤에 how절이 Knowing의 목적어로 붙어 있어요. 주어가 길지만 전체가 하나의 명사구이므로 동사 is가 바로 옵니다. 마지막의 to properly assess는 목적을 나타내는 to부정사예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 \u003cspan class=\"fx\">Knowing how climate has changed over millions of years\u003c/span> is vital to properly assess current global warming trends.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>수백만 년에 걸친 기후 변화를 아는 것이 현재 지구 온난화 추세를 정확하게 평가하는 데 필수적이라는 뜻이다. 과거 데이터 없이 현재만 보면 판단을 잘못할 수 있다는 의미다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Knowing how climate has changed over millions of years\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Understanding how climate has changed over millions of years\u003c/span>\u003cdiv class=\"w\">knowing보다 understanding이 더 깊이 있게 파악한다는 뉘앙스를 준다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is vital to properly assess\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is essential for properly assessing\u003c/span>\u003cdiv class=\"w\">vital을 essential로, to properly assess를 for properly assessing으로 바꿔 더 자연스럽게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">vital\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">essential, critical\u003c/span>\u003cspan class=\"y-eq\">vital = essential\u003c/span>\u003cdiv class=\"w\">필수적이라는 뜻을 다양한 형용사로 바꿔 쓸 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">assess\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">evaluate, judge\u003c/span>\u003cspan class=\"y-eq\">assess = evaluate\u003c/span>\u003cdiv class=\"w\">판단하다를 평가하다로 바꿔 더 자주 쓰는 단어로 제시했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">current\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">present, existing\u003c/span>\u003cspan class=\"y-eq\">current = present\u003c/span>\u003cdiv class=\"w\">현재의를 현재 존재하는으로 바꿔 의미를 명확히 했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Understanding climate change over millions of years is essential for properly evaluating today's global warming trends.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"수백만 년 동안 기후가 어떻게 변했는지를 아는 것이 오늘날 지구 온난화 추세를 제대로 평가하는 데 필수적이라는 뜻이에요. 과거의 흐름을 알아야 현재를 정확하게 판단할 수 있다는 의미입니다.","hl":"mn"},{"n":18,"text":"Knowing을 Understanding으로 바꾸면 더 깊이 이해한다는 느낌을 줄 수 있어요. is vital to properly assess는 is essential for properly assessing로 바꾸면 더 자연스러운 표현이 됩니다.","hl":"rw"},{"n":19,"text":"vital은 essential이나 critical로, assess는 evaluate로, current는 present로 바꿔 쓸 수 있어요. 특히 vital과 essential은 시험에서 자주 짝으로 나오니까 묶어서 외우세요.","hl":"ph"},{"n":20,"text":"Understanding climate change over millions of years is essential for properly evaluating today's global warming trends. 이렇게 바꾸면 knowing을 understanding으로, vital을 essential로 바꿔 같은 의미를 전달할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 \u003cspan class=\"fx\">Giving people the latitude and flexibility to use their judgment and apply their talents\u003c/span> rapidly accelerates progress.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Giving people the latitude and flexibility\u003c/div>\u003cdiv class=\"k\">사람들에게 자유와 융통성을 주는 것은\u003c/div>\u003cdiv class=\"e\"> to use their judgment\u003c/div>\u003cdiv class=\"k\"> 그들의 판단력을 이용하도록\u003c/div>\u003cdiv class=\"e\"> and apply their talents\u003c/div>\u003cdiv class=\"k\"> 그리고 그들의 재능을 활용하도록\u003c/div>\u003cdiv class=\"e\"> rapidly accelerates progress.\u003c/div>\u003cdiv class=\"k\"> 진보를 빠르게 촉진시킨다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어로 쓰인 \u003cb class=\"key\">동명사 Giving\u003c/b>이 간접목적어 people과 직접목적어 the latitude and flexibility를 취하는 4형식 구조다. to부정사구 to use ~ talents는 the latitude and flexibility를 수식한다.\u003c/div>","segs":[{"n":21,"text":"Giving people the latitude and flexibility, 사람들에게 자유와 융통성을 주는 것은. to use their judgment, 그들의 판단력을 이용하도록. and apply their talents, 그리고 그들의 재능을 활용하도록. rapidly accelerates progress, 진보를 빠르게 촉진시킨다","hl":"ch"},{"n":22,"text":"이 문장은 Giving이 이끄는 동명사구가 주어예요. Giving은 people을 간접 목적어로, the latitude and flexibility를 직접 목적어로 데리고 있고, to use 이하가 그 명사구를 꾸며 줍니다. 주어가 길어도 동사는 accelerates로 단수라는 점에 주의하세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 \u003cspan class=\"fx\">Giving people the latitude and flexibility to use their judgment and apply their talents\u003c/span> rapidly accelerates progress.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사람들에게 자신의 판단력을 쓰고 재능을 발휘할 수 있는 자유와 융통성을 주면 진보가 빠르게 앞당겨진다는 뜻이다. 자율성이 혁신과 성장의 동력이라는 의미를 담고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Giving people the latitude and flexibility\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Allowing people the freedom and flexibility\u003c/span>\u003cdiv class=\"w\">giving보다 allowing이 허용한다는 의미를 더 분명하게 전달하고, latitude를 freedom으로 바꿔 더 쉽게 표현했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rapidly accelerates progress\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">quickly speeds up advancement\u003c/span>\u003cdiv class=\"w\">accelerate를 speed up으로, progress를 advancement로 바꿔 일상적인 표현으로 전환했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">latitude\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">freedom, leeway\u003c/span>\u003cspan class=\"y-eq\">latitude = freedom\u003c/span>\u003cdiv class=\"w\">자유라는 뜻을 더 흔한 단어 freedom으로 바꿔 이해하기 쉽게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">flexibility\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">adaptability\u003c/span>\u003cspan class=\"y-eq\">flexibility = adaptability\u003c/span>\u003cdiv class=\"w\">융통성을 적응력이라는 뜻으로 바꿔 의미를 확장했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">accelerate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">speed up, boost\u003c/span>\u003cspan class=\"y-eq\">accelerate = speed up\u003c/span>\u003cdiv class=\"w\">촉진시키다를 속도를 높이다로 바꿔 자연스럽게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Allowing people the freedom and flexibility to use their judgment and apply their talents quickly speeds up progress.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"사람들에게 판단력을 쓰고 재능을 발휘할 수 있도록 자유와 융통성을 주는 것이 진보를 빠르게 촉진한다는 뜻이에요. 자율성을 보장할수록 성과가 빨라진다는 의미를 담고 있습니다.","hl":"mn"},{"n":24,"text":"Giving을 Allowing으로, latitude를 freedom으로 바꾸면 허용과 자유라는 뜻이 더 분명해져요. rapidly accelerates progress는 quickly speeds up progress로 바꾸면 훨씬 쉬운 표현이 됩니다.","hl":"rw"},{"n":25,"text":"latitude는 freedom이나 leeway로, flexibility는 adaptability로, accelerate는 speed up으로 바꿔 쓸 수 있어요. progress는 advancement로 바꾸면 좀 더 격식 있는 느낌이 나죠.","hl":"ph"},{"n":26,"text":"Allowing people the freedom and flexibility to use their judgment and apply their talents quickly speeds up progress. 이렇게 바꾸면 giving을 allowing으로, accelerates를 speeds up으로 바꿔 같은 뜻을 더 쉽게 전달합니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 \u003cspan class=\"fx\">To think that you know something without actually knowing it\u003c/span> is a serious mistake.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">To think\u003c/div>\u003cdiv class=\"k\">생각하는 것은\u003c/div>\u003cdiv class=\"e\"> that you know something\u003c/div>\u003cdiv class=\"k\"> 당신이 무언가 안다고\u003c/div>\u003cdiv class=\"e\"> without actually knowing it\u003c/div>\u003cdiv class=\"k\"> 실제로는 알지 못하면서\u003c/div>\u003cdiv class=\"e\"> is a serious mistake.\u003c/div>\u003cdiv class=\"k\"> 심각한 실수이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">to부정사\u003c/b> 주어 To think가 목적어로 접속사 that이 이끄는 명사절을 취했다. 전치사 without의 목적어로 \u003cb class=\"key\">동명사구 knowing it\u003c/b>이 쓰였다.\u003c/div>","segs":[{"n":27,"text":"To think, 생각하는 것은. that you know something, 당신이 무언가 안다고. without actually knowing it, 실제로는 알지 못하면서. is a serious mistake, 심각한 실수이다","hl":"ch"},{"n":28,"text":"이 문장은 to부정사 To think가 주어이고, that절이 목적어로 붙은 구조예요. without은 전치사이므로 뒤에 동명사 knowing이 온다는 것도 중요한 포인트입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 \u003cspan class=\"fx\">To think that you know something without actually knowing it\u003c/span> is a serious mistake.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>실제로 알지 못하면서도 안다고 생각하는 태도는 심각한 실수라는 뜻이다. 아는 것과 모르는 것을 구분하지 못하는 착각이 위험하다는 교훈을 담고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">To think that you know something\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Assuming that you know something\u003c/span>\u003cdiv class=\"w\">think보다 assume이 근거 없이 추정한다는 의미를 강조해 착각의 뉘앙스를 살린다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">without actually knowing it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">when you do not really know it\u003c/span>\u003cdiv class=\"w\">전치사구를 부사절로 바꿔 더 명시적으로 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">serious\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">grave, significant\u003c/span>\u003cspan class=\"y-eq\">serious = grave\u003c/span>\u003cdiv class=\"w\">심각한을 더 격식 있는 grave로 바꿔 쓸 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">mistake\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">error, fault\u003c/span>\u003cspan class=\"y-eq\">mistake = error\u003c/span>\u003cdiv class=\"w\">실수를 오류나 잘못으로 바꿔 의미를 확장했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">actually\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in fact, really\u003c/span>\u003cspan class=\"y-eq\">actually = in fact\u003c/span>\u003cdiv class=\"w\">실제로를 사실은으로 바꿔 더 분명히 했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Assuming you know something when you really do not is a grave error.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"실제로는 알지 못하면서 안다고 생각하는 것이 심각한 실수라는 뜻이에요. 무지에 대한 착각이 얼마나 위험한지를 강조하는 문장입니다.","hl":"mn"},{"n":30,"text":"To think를 Assuming으로 바꾸면 추정하는 느낌이 강해져요. without actually knowing it은 when you do not really know it으로 바꾸면 더 풀어 쓴 표현이 됩니다.","hl":"rw"},{"n":31,"text":"serious는 grave나 significant로, mistake는 error로, actually는 in fact나 really로 바꿔 쓸 수 있어요. 시험에서 유의어 짝으로 자주 나옵니다.","hl":"ph"},{"n":32,"text":"Assuming you know something when you really do not is a grave error. 이렇게 바꾸면 to think를 assuming으로 바꾸고 without절을 부사절로 풀어서 같은 의미를 전달합니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 \u003cspan class=\"fx\">Considering issues in an appropriate context\u003c/span> will help you accurately evaluate the pros and cons of a decision.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Considering issues\u003c/div>\u003cdiv class=\"k\">사안을 고려하는 것은\u003c/div>\u003cdiv class=\"e\"> in an appropriate context\u003c/div>\u003cdiv class=\"k\"> 적절한 맥락 속에서\u003c/div>\u003cdiv class=\"e\"> will help you accurately evaluate\u003c/div>\u003cdiv class=\"k\"> 당신이 정확하게 평가하는 것을 도울 것이다\u003c/div>\u003cdiv class=\"e\"> the pros and cons of a decision.\u003c/div>\u003cdiv class=\"k\"> 결정의 찬반양론을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어로 쓰인 \u003cb class=\"key\">동명사 Considering\u003c/b>이 전치사구 in an appropriate context의 수식을 받는다. help는 목적격보어로 동사원형 evaluate를 취해 'O가 ~하는 것을 돕다'로 해석한다.\u003c/div>","segs":[{"n":33,"text":"Considering issues, 사안을 고려하는 것은. in an appropriate context, 적절한 맥락 속에서. will help you accurately evaluate, 당신이 정확하게 평가하는 것을 도울 것이다. the pros and cons of a decision, 결정의 찬반양론을","hl":"ch"},{"n":34,"text":"이 문장은 Considering issues라는 동명사 주어가 in an appropriate context의 수식을 받는 구조예요. help는 목적격 보어로 동사원형 evaluate를 데리고 있으니 help someone do 형태로 해석하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 \u003cspan class=\"fx\">Considering issues in an appropriate context\u003c/span> will help you accurately evaluate the pros and cons of a decision.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사안을 적절한 맥락 속에서 고려하면 결정의 장단점을 정확하게 평가하는 데 도움이 된다는 뜻이다. 상황을 고려하지 않은 판단은 오류를 낳을 수 있다는 의미다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Considering issues\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Examining issues\u003c/span>\u003cdiv class=\"w\">consider를 examine으로 바꾸면 더 꼼꼼히 검토한다는 뉘앙스를 준다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in an appropriate context\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in a proper context\u003c/span>\u003cdiv class=\"w\">appropriate를 proper로 바꿔 더 간단하고 자연스럽게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">appropriate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">proper, suitable\u003c/span>\u003cspan class=\"y-eq\">appropriate = proper\u003c/span>\u003cdiv class=\"w\">적절한을 적합한으로 바꿔 더 쉬운 단어로 제시했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">context\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">situation, background\u003c/span>\u003cspan class=\"y-eq\">context = situation\u003c/span>\u003cdiv class=\"w\">맥락을 상황이나 배경으로 바꿔 의미를 구체화했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pros and cons\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">advantages and disadvantages\u003c/span>\u003cspan class=\"y-eq\">pros and cons = advantages and disadvantages\u003c/span>\u003cdiv class=\"w\">찬반양론을 장단점으로 풀어 썼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Examining matters in a proper context helps you precisely evaluate the advantages and disadvantages of a decision.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"사안을 적절한 맥락 속에서 고려하는 것이 결정의 장단점을 정확하게 평가하는 데 도움이 된다는 뜻이에요. 상황 맥락을 무시하면 판단이 왜곡될 수 있다는 의미를 담고 있습니다.","hl":"mn"},{"n":36,"text":"Considering을 Examining으로 바꾸면 검토한다는 느낌이 더 강해지고, appropriate를 proper로 바꾸면 더 쉬운 표현이 돼요.","hl":"rw"},{"n":37,"text":"appropriate는 proper나 suitable로, context는 situation이나 background로, pros and cons는 advantages and disadvantages로 바꿔 쓸 수 있어요.","hl":"ph"},{"n":38,"text":"Examining matters in a proper context helps you precisely evaluate the advantages and disadvantages of a decision. 이렇게 바꾸면 issues를 matters로, pros and cons를 advantages and disadvantages로 풀어서 같은 뜻을 전달해요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 Is \u003cspan class=\"fx\">passing large sums of wealth on to your children\u003c/span> good for them or right for society?\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Is passing large sums of wealth on to your children\u003c/div>\u003cdiv class=\"k\">당신의 자녀들에게 많은 액수의 재산을 물려주는 것이\u003c/div>\u003cdiv class=\"e\"> good for them\u003c/div>\u003cdiv class=\"k\"> 그들에게 좋은가\u003c/div>\u003cdiv class=\"e\"> or right for society?\u003c/div>\u003cdiv class=\"k\"> 아니면 사회를 위해 옳은가?\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>의문문 어순으로 \u003cb class=\"key\">동명사구 passing large sums of wealth on to your children\u003c/b>이 주어이고 is가 앞에 왔다. 보어로 쓰인 good for them과 right for society가 등위접속사 or로 병렬 연결되었다.\u003c/div>","segs":[{"n":39,"text":"Is passing large sums of wealth on to your children, 당신의 자녀들에게 많은 액수의 재산을 물려주는 것이. good for them, 그들에게 좋은가. or right for society?, 아니면 사회를 위해 옳은가?","hl":"ch"},{"n":40,"text":"의문문이라서 주어 passing large sums of wealth on to your children보다 is가 앞으로 나온 어순이에요. 평서문으로 바꾸면 Passing large sums of wealth on to your children is good for them or right for society가 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 Is \u003cspan class=\"fx\">passing large sums of wealth on to your children\u003c/span> good for them or right for society?\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자녀에게 거액의 재산을 물려주는 것이 자녀 개인에게 좋은지, 사회적으로 옳은지 질문하는 문장이다. 상속이 아이의 성장과 사회 정의에 미치는 영향을 함께 고민하게 만든다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">passing large sums of wealth on to your children\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">leaving great wealth to your children\u003c/span>\u003cdiv class=\"w\">pass on을 leave로, large sums of wealth를 great wealth로 바꿔 더 간결하게 표현했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">good for them or right for society\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">beneficial to them or fair for society\u003c/span>\u003cdiv class=\"w\">good과 right을 beneficial과 fair로 바꿔 의미를 더 정밀하게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sum\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">amount, quantity\u003c/span>\u003cspan class=\"y-eq\">sum = amount\u003c/span>\u003cdiv class=\"w\">액수를 양으로 바꿔 더 일반적인 표현으로 제시했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">wealth\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fortune, assets\u003c/span>\u003cspan class=\"y-eq\">wealth = fortune\u003c/span>\u003cdiv class=\"w\">재산을 부나 자산으로 바꿔 쓸 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pass on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">hand down, leave\u003c/span>\u003cspan class=\"y-eq\">pass on = leave\u003c/span>\u003cdiv class=\"w\">물려주다를 남기다로 바꿔 더 자연스럽게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Is leaving great wealth to your children beneficial to them or fair for society?\u003c/div>\u003c/div>","segs":[{"n":41,"text":"자녀에게 큰 재산을 물려주는 것이 과연 아이에게 좋은지, 사회적으로 바람직한지를 던지는 질문이에요. 단순히 가족만 생각하지 말고 사회 전체의 관점에서도 생각해 보라는 메시지가 담겨 있습니다.","hl":"mn"},{"n":42,"text":"passing large sums of wealth on to your children을 leaving great wealth to your children으로 바꾸면 훨씬 간결해져요. good은 beneficial로, right는 fair로 바꾸면 의미가 더 명확해집니다.","hl":"rw"},{"n":43,"text":"sum은 amount나 quantity로, wealth는 fortune이나 assets로, pass on은 leave나 hand down으로 바꿔 쓸 수 있어요. 문맥에 맞게 선택하면 됩니다.","hl":"ph"},{"n":44,"text":"Is leaving great wealth to your children beneficial to them or fair for society? 이렇게 바꾸면 같은 질문을 더 명확한 어휘로 전달할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 \u003cspan class=\"fx\">Raising awareness of children about the particular characteristics of SNS and the potential long-term impact of a seemingly trivial act\u003c/span> is crucial.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Raising awareness of children\u003c/div>\u003cdiv class=\"k\">아이들의 인식을 높이는 것은\u003c/div>\u003cdiv class=\"e\"> about the particular characteristics of SNS\u003c/div>\u003cdiv class=\"k\"> SNS의 독특한 특성들에 관해\u003c/div>\u003cdiv class=\"e\"> and the potential long-term impact\u003c/div>\u003cdiv class=\"k\"> 그리고 잠재적인 장기적 영향에 관해\u003c/div>\u003cdiv class=\"e\"> of a seemingly trivial act\u003c/div>\u003cdiv class=\"k\"> 겉보기에 사소한 행위의\u003c/div>\u003cdiv class=\"e\"> is crucial.\u003c/div>\u003cdiv class=\"k\"> 매우 중요하다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">동명사 Raising\u003c/b>이 이끄는 명사구가 주어이며 문장의 동사는 is다. 전치사 about 이하가 awareness를 수식하고, and가 두 개의 명사구를 병렬 연결한다.\u003c/div>","segs":[{"n":45,"text":"Raising awareness of children, 아이들의 인식을 높이는 것은. about the particular characteristics of SNS, SNS의 독특한 특성들에 관해. and the potential long-term impact, 그리고 잠재적인 장기적 영향에 관해. of a seemingly trivial act, 겉보기에 사소한 행위의. is crucial, 매우 중요하다","hl":"ch"},{"n":46,"text":"이 문장은 동명사 Raising이 이끄는 주어가 is 앞에 길게 이어지는 구조예요. about 이하의 전치사구가 awareness를 꾸미고, and가 특성과 영향을 병렬로 이어 줍니다. 주어가 길어도 동사는 is로 받아야 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 \u003cspan class=\"fx\">Raising awareness of children about the particular characteristics of SNS and the potential long-term impact of a seemingly trivial act\u003c/span> is crucial.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>SNS 고유의 특성과 겉보기에 사소한 행동이 초래할 수 있는 장기적 영향에 대해 아이들의 인식을 높이는 것이 매우 중요하다는 뜻이다. 작은 행동도 온라인에서는 큰 결과를 낳을 수 있음을 가르쳐야 한다는 의미다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Raising awareness of children\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Increasing children's awareness\u003c/span>\u003cdiv class=\"w\">소유격을 써서 더 자연스럽게 표현하고, raise를 increase로 바꿔 의미를 명확히 했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a seemingly trivial act\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">an apparently minor act\u003c/span>\u003cdiv class=\"w\">seemingly를 apparently, trivial을 minor로 바꿔 같은 뜻을 다른 어휘로 전환했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">awareness\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">consciousness, understanding\u003c/span>\u003cspan class=\"y-eq\">awareness = consciousness\u003c/span>\u003cdiv class=\"w\">인식을 의식이나 이해로 바꿔 유의어를 확장했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">potential\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">possible, prospective\u003c/span>\u003cspan class=\"y-eq\">potential = possible\u003c/span>\u003cdiv class=\"w\">잠재적인을 가능한으로 바꿔 더 쉬운 표현으로 제시했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">trivial\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">minor, insignificant\u003c/span>\u003cspan class=\"y-eq\">trivial = minor\u003c/span>\u003cdiv class=\"w\">사소한을 하찮은으로 바꿔 의미를 분명히 했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Increasing children's awareness of SNS characteristics and the possible long-term effects of a seemingly minor act is crucial.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"아이들이 SNS의 독특한 특성과 겉보기에는 사소한 행동이 장기적으로 미칠 수 있는 영향을 인식하도록 하는 것이 매우 중요하다는 뜻이에요. 작은 행동도 온라인에서는 오래 남을 수 있다는 교훈을 담고 있습니다.","hl":"mn"},{"n":48,"text":"Raising awareness of children을 Increasing children's awareness로 바꾸면 더 자연스러운 소유격 표현이 돼요. seemingly trivial act는 apparently minor act로 바꿔도 뜻이 같습니다.","hl":"rw"},{"n":49,"text":"awareness는 consciousness나 understanding으로, potential은 possible로, trivial은 minor나 insignificant로 바꿔 쓸 수 있어요. 특히 potential은 명사와 형용사 모두로 자주 나오니 잘 익혀 두세요.","hl":"ph"},{"n":50,"text":"Increasing children's awareness of SNS characteristics and the possible long-term effects of a seemingly minor act is crucial. 이렇게 바꾸면 raising을 increasing으로, potential을 possible로 바꿔 같은 의미를 전달해요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 To conquer oneself is the best and noblest victory; to be vanquished by one's own nature is the worst and most ignoble defeat.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">To conquer oneself\u003c/div>\u003cdiv class=\"k\">스스로를 정복하는 것은\u003c/div>\u003cdiv class=\"e\"> is the best and noblest victory;\u003c/div>\u003cdiv class=\"k\"> 최고의 그리고 가장 숭고한 승리이고\u003c/div>\u003cdiv class=\"e\"> to be vanquished by one's own nature\u003c/div>\u003cdiv class=\"k\"> 자신의 본성에 의해 정복당하는 것은\u003c/div>\u003cdiv class=\"e\"> is the worst and most ignoble defeat.\u003c/div>\u003cdiv class=\"k\"> 최악의 그리고 가장 수치스러운 패배이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>두 개의 \u003cb class=\"key\">to부정사\u003c/b> 주어가 세미콜론으로 연결되었다. To conquer oneself는 목적어 oneself를 가진 능동태, to be vanquished는 \u003cb class=\"key\">to부정사의 수동태\u003c/b>로 전치사구 by one's own nature의 수식을 받는다.\u003c/div>","segs":[{"n":51,"text":"To conquer oneself, 스스로를 정복하는 것은. is the best and noblest victory, 최고의 그리고 가장 숭고한 승리이고. to be vanquished by one's own nature, 자신의 본성에 의해 정복당하는 것은. is the worst and most ignoble defeat, 최악의 그리고 가장 수치스러운 패배이다","hl":"ch"},{"n":52,"text":"이 문장은 To conquer oneself와 to be vanquished by one's own nature라는 두 개의 to부정사 주어가 세미콜론으로 연결되어 있어요. 두 번째 주어는 수동태 to부정사라서 to be vanquished 형태를 쓰고, by 이하가 행위자를 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 To conquer oneself is the best and noblest victory; to be vanquished by one's own nature is the worst and most ignoble defeat.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자기 자신을 이기는 것이 가장 고귀한 승리이고, 자기 본성에 지는 것이 가장 수치스러운 패배라는 뜻이다. 인간의 가장 큰 적은 자기 내면의 약함이며, 자기를 다스리는 것이 진정한 승리라는 철학적 교훈이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">To conquer oneself\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Conquering oneself\u003c/span>\u003cdiv class=\"w\">to부정사를 동명사로 바꿔도 주어 역할을 하며, 더 간결한 어감을 준다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to be vanquished by one's own nature\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">being defeated by one's own nature\u003c/span>\u003cdiv class=\"w\">수동태 to부정사를 수동태 동명사로 바꿔 병렬 구조를 맞췄다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">conquer\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">overcome, defeat\u003c/span>\u003cspan class=\"y-eq\">conquer = overcome\u003c/span>\u003cdiv class=\"w\">정복하다를 이겨 내다로 바꿔 더 일상적인 표현으로 제시했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">noblest\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">greatest, finest\u003c/span>\u003cspan class=\"y-eq\">noblest = most excellent\u003c/span>\u003cdiv class=\"w\">가장 숭고한을 가장 훌륭한으로 바꿔 의미를 확장했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ignoble\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">shameful, disgraceful\u003c/span>\u003cspan class=\"y-eq\">ignoble = shameful\u003c/span>\u003cdiv class=\"w\">수치스러운을 부끄러운으로 바꿔 더 이해하기 쉽게 했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Overcoming yourself is the greatest and most noble victory; being defeated by your own nature is the worst and most shameful loss.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"자기 자신을 정복하는 것이 가장 고귀한 승리이고, 자신의 본성에 정복당하는 것이 가장 수치스러운 패배라는 뜻이에요. 결국 인생의 승패는 자기 통제에 달려 있다는 철학적인 메시지를 담고 있습니다.","hl":"mn"},{"n":54,"text":"To conquer oneself를 Conquering oneself로, to be vanquished를 being defeated로 바꾸면 동명사 주어로 통일할 수 있어요. 뜻은 그대로 유지되면서 더 간결해집니다.","hl":"rw"},{"n":55,"text":"conquer는 overcome이나 defeat로, noblest는 greatest나 finest로, ignoble은 shameful이나 disgraceful로 바꿔 쓸 수 있어요. vanquish도 defeat로 바꿔 기억해 두면 좋습니다.","hl":"ph"},{"n":56,"text":"Overcoming yourself is the greatest and most noble victory; being defeated by your own nature is the worst and most shameful loss. 이렇게 바꾸면 같은 의미를 더 쉬운 어휘로 전달할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 \u003cspan class=\"fx\">Investing regularly in learning opportunities\u003c/span> is one of the greatest gifts you can give yourself.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Investing regularly\u003c/div>\u003cdiv class=\"k\">정기적으로 투자하는 것은\u003c/div>\u003cdiv class=\"e\"> in learning opportunities\u003c/div>\u003cdiv class=\"k\"> 학습 기회에\u003c/div>\u003cdiv class=\"e\"> is one of the greatest gifts\u003c/div>\u003cdiv class=\"k\"> 가장 큰 선물 중 하나이다\u003c/div>\u003cdiv class=\"e\"> you can give yourself.\u003c/div>\u003cdiv class=\"k\"> 당신이 스스로에게 줄 수 있는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">동명사 Investing\u003c/b>이 주어이며 부사 regularly의 수식을 받는다. gifts 뒤에는 목적격 관계대명사 that이 생략되어 '당신이 스스로에게 줄 수 있는 선물'의 의미를 만든다.\u003c/div>","segs":[{"n":57,"text":"Investing regularly, 정기적으로 투자하는 것은. in learning opportunities, 학습 기회에. is one of the greatest gifts, 가장 큰 선물 중 하나이다. you can give yourself, 당신이 스스로에게 줄 수 있는","hl":"ch"},{"n":58,"text":"이 문장은 동명사 Investing이 주어이고, 부사 regularly가 Investing을 꾸며 줍니다. gifts 뒤에 목적격 관계대명사 that이 생략되어 you can give yourself가 gifts를 수식하는 구조예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 \u003cspan class=\"fx\">Investing regularly in learning opportunities\u003c/span> is one of the greatest gifts you can give yourself.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>학습 기회에 꾸준히 투자하는 것이 자신에게 줄 수 있는 가장 큰 선물 중 하나라는 뜻이다. 배움에 시간과 노력을 들이는 것이 자기 성장을 위한 최고의 선택이라는 의미다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Investing regularly in learning opportunities\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">To invest regularly in learning opportunities\u003c/span>\u003cdiv class=\"w\">동명사 주어를 to부정사로 바꿔도 자연스럽고 목적의 뉘앙스를 살릴 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">one of the greatest gifts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">among the best presents you can give yourself\u003c/span>\u003cdiv class=\"w\">gifts를 presents로 바꾸고 구조를 풀어서 더 구어적으로 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/ 꿔 인과 관계를 더 분명하게 표현했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">makes reading more enjoyable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">makes reading more fun\u003c/span>\u003cdiv class=\"w\">enjoyable을 fun으로 바꿔 더 일상적이고 짧게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">makes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">renders, causes\u003c/span>\u003cspan class=\"y-eq\">makes = renders\u003c/span>\u003cdiv class=\"w\">만들다를 초래하다나 되게 하다로 바꿔 의미를 확장했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">enjoyable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pleasant, entertaining\u003c/span>\u003cspan class=\"y-eq\">enjoyable = pleasant\u003c/span>\u003cdiv class=\"w\">즐거운을 유쾌한으로 바꿔 유의어를 제시했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">range\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">variety, scope\u003c/span>\u003cspan class=\"y-eq\">range = variety\u003c/span>\u003cdiv class=\"w\">범위를 다양성으로 바꿔 의미를 더 구체화했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A large vocabulary makes reading more fun and broadens the types of materials you can read.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"어휘력이 좋으면 읽기가 더 즐거워지고, 읽을 수 있는 자료의 범위가 넓어진다는 뜻이에요. 어휘가 독서의 즐거움과 선택의 폭을 결정한다는 의미를 담고 있습니다.","hl":"mn"},{"n":66,"text":"Having a large vocabulary를 If you have a large vocabulary로 바꾸면 조건의 의미가 더 분명해져요. enjoyable은 fun으로 바꾸면 더 짧고 구어적인 표현이 됩니다.","hl":"rw"},{"n":67,"text":"makes는 renders나 causes로, enjoyable은 pleasant나 entertaining으로, range는 variety나 scope으로 바꿔 쓸 수 있어요.","hl":"ph"},{"n":68,"text":"A large vocabulary makes reading more fun and broadens the types of materials you can read. 이렇게 바꾸면 having을 a로 바꾸고 range를 types로 바꿔 같은 뜻을 더 쉽게 전달해요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">To say that AI will start doing what it wants for its own purposes\u003c/span> is like saying a calculator will start making its own calculations.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">To say\u003c/div>\u003cdiv class=\"k\">말하는 것은\u003c/div>\u003cdiv class=\"e\"> that AI will start doing\u003c/div>\u003cdiv class=\"k\"> AI가 하기 시작할 것이라고\u003c/div>\u003cdiv class=\"e\"> what it wants\u003c/div>\u003cdiv class=\"k\"> 그것이 원하는 것을\u003c/div>\u003cdiv class=\"e\"> for its own purposes\u003c/div>\u003cdiv class=\"k\"> 자신의 목적을 위해\u003c/div>\u003cdiv class=\"e\"> is like saying\u003c/div>\u003cdiv class=\"k\"> 말하는 것과 같다\u003c/div>\u003cdiv class=\"e\"> a calculator will start making its own calculations.\u003c/div>\u003cdiv class=\"k\"> 계산기가 스스로 계산을 하기 시작할 것이라고\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">to부정사\u003c/b> 주어 To say가 that절을 목적어로 취하고, that절 안에 what절이 포함되었다. to부정사 주어는 \u003cb class=\"key\">단수 취급\u003c/b>하므로 단수 동사 is가 쓰였다. like saying 다음에는 접속사 that이 생략되어 있다.\u003c/div>","segs":[{"n":69,"text":"To say, 말하는 것은. that AI will start doing, AI가 하기 시작할 것이라고. what it wants, 그것이 원하는 것을. for its own purposes, 자신의 목적을 위해. is like saying, 말하는 것과 같다. a calculator will start making its own calculations, 계산기가 스스로 계산을 하기 시작할 것이라고","hl":"ch"},{"n":70,"text":"이 문장은 to부정사 To say가 주어이고, that절이 목적어로 붙은 구조예요. like saying 다음에는 that이 생략되어 있고, 그 뒤에 a calculator will start making its own calculations라는 절이 이어집니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">To say that AI will start doing what it wants for its own purposes\u003c/span> is like saying a calculator will start making its own calculations.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>AI가 자신의 목적을 위해 스스로 원하는 일을 시작할 것이라고 말하는 것은 계산기가 자기 계산을 시작할 것이라고 말하는 것과 같다는 뜻이다. AI의 자율적 의도에 대한 생각이 비현실적이라는 점을 비유로 지적한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">To say that AI will start doing what it wants for its own purposes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Saying that AI will act on its own desires\u003c/span>\u003cdiv class=\"w\">동명사로 바꾸고 want를 desire로, for its own purposes를 on its own으로 압축해 더 간결하게 표현했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is like saying a calculator will start making its own calculations\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is like saying a calculator will do its own math\u003c/span>\u003cdiv class=\"w\">복잡한 표현을 단순화해 같은 비유를 더 쉽게 전달했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">purposes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">aims, intentions\u003c/span>\u003cspan class=\"y-eq\">purposes = aims\u003c/span>\u003cdiv class=\"w\">목적을 의도나 목표로 바꿔 유의어를 제시했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">calculator\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">calculating machine\u003c/span>\u003cspan class=\"y-eq\">calculator = calculating machine\u003c/span>\u003cdiv class=\"w\">계산기를 계산 기계로 바꿔 설명적 표현을 제공했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">calculations\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">computations, arithmetic\u003c/span>\u003cspan class=\"y-eq\">calculations = computations\u003c/span>\u003cdiv class=\"w\">계산을 연산이나 산수로 바꿔 의미를 확장했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Saying that AI will start acting on its own desires is like saying a calculator will start doing its own math.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"AI가 자신의 목적을 위해 원하는 것을 하기 시작할 거라고 말하는 것은 계산기가 스스로 계산을 시작할 거라고 말하는 것과 같다는 뜻이에요. AI에 사람처럼 자율적인 의도가 있다고 보는 시각이 비현실적이라는 점을 비유로 꼬집는 문장입니다.","hl":"mn"},{"n":72,"text":"To say를 Saying으로 바꾸고 what it wants for its own purposes를 on its own desires로 압축하면 더 간결해져요. making its own calculations는 doing its own math로 바꾸면 더 쉬운 표현이 됩니다.","hl":"rw"},{"n":73,"text":"purposes는 aims나 intentions로, calculator는 calculating machine으로, calculations는 computations나 arithmetic으로 바꿔 쓸 수 있어요.","hl":"ph"},{"n":74,"text":"Saying that AI will start acting on its own desires is like saying a calculator will start doing its own math. 이렇게 바꾸면 같은 비유를 더 짧고 쉬운 어휘로 전달할 수 있어요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">명사구 주어\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>명사구 주어는 \u003cb class=\"key\">to-v\u003c/b> 또는 \u003cb class=\"key\">v-ing\u003c/b> 형태로, 주어가 길어도 전체를 하나의 블록으로 묶는다.\u003c/li>\u003cli>이런 주어는 \u003cb class=\"key\">단수 취급\u003c/b>하므로 단수 동사를 쓴다. and로 연결된 두 주어도 하나의 의미를 나타내면 단수 동사를 쓴다.\u003c/li>\u003cli>예문에서 \u003cb class=\"key\">Getting\u003c/b>, \u003cb class=\"key\">Knowing\u003c/b>, \u003cb class=\"key\">To think\u003c/b>, \u003cb class=\"key\">Having\u003c/b> 등이 모두 주어 자리에서 명사 역할을 했다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 명사구 주어를 집중적으로 공부했어요. to부정사나 동명사가 주어 자리에 오면 길이와 상관없이 하나의 명사 덩어리로 보고 단수 동사를 쓴다는 점이 가장 중요합니다. 앞으로 긴 주어가 나와도 통째로 묶어서 해석하는 연습을 해 보세요. 오늘 수고 많았고 다음 시간에 또 만나요.","hl":"sum"}]}]});</script></body></html>
