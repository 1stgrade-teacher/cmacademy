  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"unit04","title":"마법같은 블록구문 실전편 Unit04 주어와 형용사구","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>마법같은 블록구문 실전편 Unit 주어와 형용사구\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>주어 뒤에 붙는 형용사구를 찾아 긴 주어와 본동사를 정확히 구분한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요. 오늘은 마법같은 블록구문 실전편, 주어와 형용사구 유닛을 공부해요. 문장 앞부분이 길어지면 동사를 찾기 어려운데, 이 구문을 익히면 주어와 동사를 빠르게 구분할 수 있어요. 그럼 예문 열두 개로 함께 훈련해 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">주어 뒤에 \u003cb class=\"key\">전치사구\u003c/b>, \u003cb class=\"key\">to부정사구\u003c/b>, \u003cb class=\"key\">현재분사구\u003c/b>, \u003cb class=\"key\">과거분사구\u003c/b>가 오면 주어를 꾸며 주는 \u003cb class=\"key\">형용사구\u003c/b>이다. 형용사구가 붙으면서 주어가 길어져도 핵심 명사와 수식어구를 묶어 주어로 보고 그 뒤에 오는 본동사를 찾는다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">The ability to ask the right question\u003c/span> is more than half the battle of finding the answer.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">The candidates applying for the job\u003c/span> must know the qualifications required for the job.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 \u003cspan class=\"fx\">The simple act of typing a few words into a search engine\u003c/span> will virtually instantaneously produce links related to the topic at hand.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 \u003cspan class=\"fx\">The only way to understand a word fully\u003c/span> is to see it in use in many contexts.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">The microwaves emitted from mobile phones\u003c/span> can interfere with sensitive electronic equipment.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">An outstanding feature in the evolution of modern man\u003c/span> is the growth of the size of the brain.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 \u003cspan class=\"fx\">Many present efforts to guard and maintain human progress, to meet human needs, and to realize human ambitions\u003c/span> are simply unsustainable—in both rich and poor nations.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">Scientists studying genes in yeast cells\u003c/span> recently found a chemical that seems to work with a longevity gene to increase the yeast cell's lifespan.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">Foreign, or alien, species introduced accidentally or intentionally into new territories\u003c/span> often do well in their new homes because conditions may be highly favorable to their growth and reproduction.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">Speculations about the meaning and purpose of prehistoric art\u003c/span> rely heavily on analogies drawn with modern-day hunter-gatherer societies.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">The best way to protect your computer from viruses and spyware\u003c/span> is to install a recommended anti-virus program.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">The carbon dioxide given off when coal and oil are burned\u003c/span> is accumulating in the atmosphere and causing temperatures to rise.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘 배울 구문은 주어 뒤에 형용사구가 붙는 구조입니다. 이 구문에서는 주어가 문장의 처음에 나오지만 바로 동사로 이어지지 않고, 전치사구나 to부정사구, 분사구가 주어를 꾸며 주면서 길어지죠. 그래서 문장 맨 앞에 있는 긴 명사구 전체를 주어로 보고, 뒤에 나오는 진짜 동사를 정확히 찾아야 해요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">The ability to ask the right question\u003c/span> is more than half the battle of finding the answer.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The ability\u003c/div>\u003cdiv class=\"k\">능력은\u003c/div>\u003cdiv class=\"e\"> to ask the right question\u003c/div>\u003cdiv class=\"k\">적절한 질문을 하는\u003c/div>\u003cdiv class=\"e\"> is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\"> more than half the battle\u003c/div>\u003cdiv class=\"k\">전투의 절반 이상이다\u003c/div>\u003cdiv class=\"e\"> of finding the answer.\u003c/div>\u003cdiv class=\"k\">답을 찾는 일의\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The ability가 to부정사구 to ask the right question의 수식을 받는 \u003cb class=\"key\">to부정사 형용사구\u003c/b> 구조입니다. ability는 to부정사의 수식을 받는 대표적인 명사입니다.\u003c/div>","segs":[{"n":3,"text":"The ability, 능력은. to ask the right question, 적절한 질문을 하는. is, ~이다. more than half the battle, 전투의 절반 이상이다. of finding the answer, 답을 찾는 일의","hl":"ch"},{"n":4,"text":"첫 번째 문장에서 주어는 The ability입니다. 여기에 to ask the right question이 붙어서 어떤 능력인지 꾸며 주고 있어요. 결국 The ability to ask the right question 전체가 주어이고, 그다음에 나오는 is가 진짜 동사예요. ability처럼 to부정사로 꾸밀 수 있는 명사는 자주 나오니까 기억해 두세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">The ability to ask the right question\u003c/span> is more than half the battle of finding the answer.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>적절한 질문을 던지는 능력은 답을 찾는 과정의 절반 이상을 차지한다는 뜻이에요. 답을 잘 찾으려면 문제를 정확히 파악하는 질문이 먼저라는 메시지를 담고 있죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">more than half the battle\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the most important part\u003c/span>\u003cdiv class=\"w\">관용적 표현인 전투의 절반 이상을 ‘가장 중요한 부분’으로 직설적으로 바꾸면 뜻이 분명해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">finding the answer\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">solving the problem\u003c/span>\u003cdiv class=\"w\">답을 찾는 행위를 문제 해결로 바꾸어도 자연스럽습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ability\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">capability, capacity\u003c/span>\u003cspan class=\"y-eq\">ability = capability\u003c/span>\u003cdiv class=\"w\">능력이라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ask the right question\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pose the right question\u003c/span>\u003cspan class=\"y-eq\">ask = pose\u003c/span>\u003cdiv class=\"w\">질문하다라는 의미를 더 격식 있게 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">battle\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">struggle\u003c/span>\u003cspan class=\"y-eq\">battle = struggle\u003c/span>\u003cdiv class=\"w\">싸움, 투쟁이라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Asking the right question is the most important part of finding the answer.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 올바른 질문을 하는 능력이 답을 찾는 싸움의 절반 이상이라는 뜻이에요. 즉 답을 찾기 전에 정확한 질문을 던지는 것이 가장 중요하다는 메시지를 담고 있죠. 문제의 핵심을 짚는 질문이 답을 찾는 첫걸음이라는 거예요.","hl":"mn"},{"n":6,"text":"more than half the battle은 가장 중요한 부분이라는 뜻으로 바꿔 쓸 수 있어요. finding the answer도 solving the problem으로 바꾸면 더 간결해지죠. 이렇게 표현을 바꾸면 의미가 더 분명하게 다가와요.","hl":"rw"},{"n":7,"text":"ability는 capability나 capacity로 바꿀 수 있고요, ask the right question은 pose the right question이라고 해도 됩니다. battle은 struggle로 바꾸면 비슷한 뜻이에요. 이 표현들을 같이 외워 두면 좋아요.","hl":"ph"},{"n":8,"text":"이 문장을 통째로 바꾸면 Asking the right question is the most important part of finding the answer라고 할 수 있어요. 원래 문장과 비교하면서 소리 내어 읽어 보세요. 같은 뜻을 다른 구조로 표현해도 자연스럽죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">The candidates applying for the job\u003c/span> must know the qualifications required for the job.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The candidates\u003c/div>\u003cdiv class=\"k\">지원자들은\u003c/div>\u003cdiv class=\"e\"> applying for the job\u003c/div>\u003cdiv class=\"k\">그 일자리에 지원하는\u003c/div>\u003cdiv class=\"e\"> must know\u003c/div>\u003cdiv class=\"k\">알아야 한다\u003c/div>\u003cdiv class=\"e\"> the qualifications\u003c/div>\u003cdiv class=\"k\">자격 요건을\u003c/div>\u003cdiv class=\"e\"> required for the job.\u003c/div>\u003cdiv class=\"k\">그 일자리에 요구되는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The candidates가 현재분사구 applying for the job의 수식을 받는 \u003cb class=\"key\">현재분사 형용사구\u003c/b> 구조입니다. applying은 candidates와 의미상 능동 관계를 이룹니다.\u003c/div>","segs":[{"n":9,"text":"The candidates, 지원자들은. applying for the job, 그 일자리에 지원하는. must know, 알아야 한다. the qualifications, 자격 요건을. required for the job, 그 일자리에 요구되는","hl":"ch"},{"n":10,"text":"두 번째 문장에서는 The candidates가 주어인데, 바로 applying for the job이 붙어서 어떤 지원자인지를 꾸며 줘요. 이렇게 주어 뒤에 붙은 현재분사구는 주어를 수식하는 형용사구입니다. must know가 진짜 동사이고, 그 뒤의 the qualifications는 목적어예요. required for the job은 목적어를 뒤에서 꾸며 주는 과거분사구입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 \u003cspan class=\"fx\">The candidates applying for the job\u003c/span> must know the qualifications required for the job.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>그 일자리에 지원하는 후보자들은 그 일자리에 필요한 자격 요건을 반드시 알아야 한다는 뜻이에요. 지원할 때는 요구 조건을 꼭 확인하라는 실용적인 조언이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">applying for the job\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who apply for the job\u003c/span>\u003cdiv class=\"w\">현재분사구를 관계대명사절로 바꾸면 주어의 의미가 더 명시적으로 드러납니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">qualifications required for the job\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">requirements of the job\u003c/span>\u003cdiv class=\"w\">자격 요건을 requirements of the job으로 바꾸면 더 간결합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">candidates\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">applicants\u003c/span>\u003cspan class=\"y-eq\">candidate = applicant\u003c/span>\u003cdiv class=\"w\">지원자, 후보자라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">qualifications\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">requirements, credentials\u003c/span>\u003cspan class=\"y-eq\">qualifications = requirements\u003c/span>\u003cdiv class=\"w\">자격 요건이라는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">required for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">needed for\u003c/span>\u003cspan class=\"y-eq\">required = needed\u003c/span>\u003cdiv class=\"w\">요구되는이라는 뜻을 가진 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Applicants who apply for the job must be aware of the requirements needed for the position.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 그 일자리에 지원하는 사람들은 그 일자리에서 요구하는 자격 요건을 알아야 한다는 뜻이에요. 지원할 때 채용 공고에 나와 있는 필수 조건을 반드시 확인하라는 실용적인 조언이죠.","hl":"mn"},{"n":12,"text":"applying for the job은 who apply for the job으로 바꿔 쓸 수 있어요. qualifications required for the job은 requirements of the job으로 간단히 할 수도 있고요. 이렇게 바꾸면 문장이 조금 더 쉬워져요.","hl":"rw"},{"n":13,"text":"candidates는 applicants로 바꿔도 되고, qualifications는 requirements나 credentials로 바꿀 수 있어요. required for는 needed for로도 자연스럽게 씁니다. 이 어휘들은 시험에도 자주 나오니까 잘 익혀 두세요.","hl":"ph"},{"n":14,"text":"전체를 바꾸면 Applicants who apply for the job must be aware of the requirements needed for the position이라고 쓸 수 있어요. 원문보다 조금 더 격식 있는 표현이지만 뜻은 같죠. 소리 내어 읽어 보세요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 \u003cspan class=\"fx\">The simple act of typing a few words into a search engine\u003c/span> will virtually instantaneously produce links related to the topic at hand.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The simple act\u003c/div>\u003cdiv class=\"k\">간단한 행위는\u003c/div>\u003cdiv class=\"e\"> of typing a few words\u003c/div>\u003cdiv class=\"k\">몇 개의 단어를 입력하는\u003c/div>\u003cdiv class=\"e\"> into a search engine\u003c/div>\u003cdiv class=\"k\">검색 엔진에\u003c/div>\u003cdiv class=\"e\"> will virtually instantaneously produce\u003c/div>\u003cdiv class=\"k\">거의 당장 만들어낼 것이다\u003c/div>\u003cdiv class=\"e\"> links\u003c/div>\u003cdiv class=\"k\">링크를\u003c/div>\u003cdiv class=\"e\"> related to the topic\u003c/div>\u003cdiv class=\"k\">그 주제와 관련된\u003c/div>\u003cdiv class=\"e\"> at hand.\u003c/div>\u003cdiv class=\"k\">바로 쓸 수 있도록\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The simple act가 전치사구 of typing a few words into a search engine의 수식을 받는 \u003cb class=\"key\">전치사구 형용사구\u003c/b> 구조입니다. of의 목적어로 동명사구 typing a few words가 쓰였습니다.\u003c/div>","segs":[{"n":15,"text":"The simple act, 간단한 행위는. of typing a few words, 몇 개의 단어를 입력하는. into a search engine, 검색 엔진에. will virtually instantaneously produce, 거의 당장 만들어낼 것이다. links, 링크를. related to the topic, 그 주제와 관련된. at hand, 바로 쓸 수 있도록","hl":"ch"},{"n":16,"text":"세 번째 문장에서는 The simple act가 주어이고, of typing a few words into a search engine이 뒤에서 그 행위의 내용을 꾸며 줘요. 주어 전체가 The simple act of typing a few words into a search engine인데, 이렇게 전치사구가 주어를 수식하면 주어가 길어지죠. 동사는 will produce이고 related to the topic at hand은 목적어 links를 꾸며 주는 과거분사구입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 \u003cspan class=\"fx\">The simple act of typing a few words into a search engine\u003c/span> will virtually instantaneously produce links related to the topic at hand.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>검색 엔진에 몇 단어만 입력하는 단순한 행위가 바로 그 주제와 관련된 링크를 거의 즉시 만들어 낸다는 뜻이에요. 인터넷 검색이 매우 빠르고 편리하다는 점을 강조하죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">typing a few words into a search engine\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">entering a few words in a search engine\u003c/span>\u003cdiv class=\"w\">type을 enter로 바꾸고 into를 in으로 바꿔도 자연스럽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">links related to the topic at hand\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">links relevant to the current topic\u003c/span>\u003cdiv class=\"w\">related to를 relevant to로, at hand를 current로 바꾸면 더 격식 있는 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">virtually\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">almost, nearly\u003c/span>\u003cspan class=\"y-eq\">virtually = almost\u003c/span>\u003cdiv class=\"w\">거의라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">instantaneously\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">instantly, immediately\u003c/span>\u003cspan class=\"y-eq\">instantaneously = instantly\u003c/span>\u003cdiv class=\"w\">즉시라는 뜻을 가진 부사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at hand\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">available, ready\u003c/span>\u003cspan class=\"y-eq\">at hand = available\u003c/span>\u003cdiv class=\"w\">바로 쓸 수 있는이라는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Simply typing a few words into a search engine will almost immediately generate links relevant to the topic you are working on.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 검색창에 몇 단어만 쳐도 그 주제와 관련된 링크가 거의 바로 만들어진다는 뜻이에요. 인터넷 검색이 얼마나 빠르고 간편한지 강조하는 문장이죠. at hand는 바로 쓸 수 있도록이라는 의미로 이해하면 됩니다.","hl":"mn"},{"n":18,"text":"typing a few words into a search engine은 entering a few words in a search engine으로 바꿔 쓸 수 있어요. links related to the topic at hand은 links relevant to the current topic으로 바꾸면 조금 더 격식 있는 표현이 됩니다.","hl":"rw"},{"n":19,"text":"virtually는 almost나 nearly로, instantaneously는 instantly나 immediately로 바꿀 수 있어요. at hand는 available이나 ready라는 뜻으로 자주 쓰입니다. 이 부사어들은 속도와 관련된 글에서 자주 나오니까 함께 정리해 두세요.","hl":"ph"},{"n":20,"text":"전체 문장은 Simply typing a few words into a search engine will almost immediately generate links relevant to the topic you are working on이라고 바꿀 수 있어요. 원문과 비교해 보면 주어가 동명사구로 바뀌었지만 뜻은 같죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 \u003cspan class=\"fx\">The only way to understand a word fully\u003c/span> is to see it in use in many contexts.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The only way\u003c/div>\u003cdiv class=\"k\">유일한 방법은\u003c/div>\u003cdiv class=\"e\"> to understand a word fully\u003c/div>\u003cdiv class=\"k\">한 단어를 완전히 이해하는\u003c/div>\u003cdiv class=\"e\"> is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\"> to see it in use\u003c/div>\u003cdiv class=\"k\">그것이 사용되는 것을 보는 것이다\u003c/div>\u003cdiv class=\"e\"> in many contexts.\u003c/div>\u003cdiv class=\"k\">많은 문맥 속에서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The only way가 to부정사구 to understand a word fully의 수식을 받는 \u003cb class=\"key\">to부정사 형용사구\u003c/b> 구조입니다. 보어로 to see it in use in many contexts가 왔습니다.\u003c/div>","segs":[{"n":21,"text":"The only way, 유일한 방법은. to understand a word fully, 한 단어를 완전히 이해하는. is, ~이다. to see it in use, 그것이 사용되는 것을 보는 것이다. in many contexts, 많은 문맥 속에서","hl":"ch"},{"n":22,"text":"네 번째 문장에서 주어는 The only way이고, to understand a word fully가 뒤에서 그 방법을 꾸며 줘요. way는 to부정사로 잘 꾸미는 대표적인 명사라서 이 구조가 아주 흔하게 나옵니다. is가 동사이고, to see it in use in many contexts가 보어 역할을 하는 to부정사구예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 \u003cspan class=\"fx\">The only way to understand a word fully\u003c/span> is to see it in use in many contexts.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>어떤 단어를 완전히 이해하는 유일한 방법은 여러 문맥 속에서 실제로 쓰이는 것을 보는 것입니다. 단어는 단순 암기가 아니라 다양한 예문으로 익혀야 한다는 학습 조언이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The only way to understand a word fully\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The only way to fully understand a word\u003c/span>\u003cdiv class=\"w\">부사 fully를 to부정사 안에 넣어 의미를 강조할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to see it in use\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to observe it being used\u003c/span>\u003cdiv class=\"w\">see를 observe로 바꾸고 수동 진행형을 쓰면 더 구체적입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fully\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">completely, thoroughly\u003c/span>\u003cspan class=\"y-eq\">fully = completely\u003c/span>\u003cdiv class=\"w\">완전히라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in use\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">being used\u003c/span>\u003cspan class=\"y-eq\">in use = being used\u003c/span>\u003cdiv class=\"w\">사용 중인이라는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">contexts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">situations, settings\u003c/span>\u003cspan class=\"y-eq\">context = situation\u003c/span>\u003cdiv class=\"w\">문맥, 상황이라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">You can only understand a word completely by seeing how it is used in various contexts.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 단어를 완전히 이해하는 방법은 하나뿐인데, 그 단어가 여러 문맥에서 실제로 쓰이는 모습을 보는 것이라는 뜻이에요. 단어를 단순히 외우지 말고 다양한 예문과 상황 속에서 익혀야 한다는 중요한 학습 조언이죠.","hl":"mn"},{"n":24,"text":"The only way to understand a word fully는 The only way to fully understand a word로 부사의 위치를 바꿔 쓸 수 있어요. to see it in use는 to observe it being used로 바꾸면 조금 더 격식 있는 표현이 됩니다.","hl":"rw"},{"n":25,"text":"fully는 completely나 thoroughly로, in use는 being used로 바꿀 수 있어요. contexts는 situations나 settings로도 자주 쓰입니다. 이 단어들은 문맥과 쓰임을 설명할 때 유용해요.","hl":"ph"},{"n":26,"text":"전체를 자연스럽게 바꾸면 You can only understand a word completely by seeing how it is used in various contexts라고 할 수 있어요. 문장 구조는 달라졌지만 의미는 원문과 같습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 \u003cspan class=\"fx\">The microwaves emitted from mobile phones\u003c/span> can interfere with sensitive electronic equipment.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The microwaves\u003c/div>\u003cdiv class=\"k\">극초단파는\u003c/div>\u003cdiv class=\"e\"> emitted from mobile phones\u003c/div>\u003cdiv class=\"k\">휴대폰에서 방출되는\u003c/div>\u003cdiv class=\"e\"> can interfere\u003c/div>\u003cdiv class=\"k\">지장을 줄 수 있다\u003c/div>\u003cdiv class=\"e\"> with sensitive electronic equipment.\u003c/div>\u003cdiv class=\"k\">민감한 전자 기기에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The microwaves가 과거분사구 emitted from mobile phones의 수식을 받는 \u003cb class=\"key\">과거분사 형용사구\u003c/b> 구조입니다. microwaves와 emit은 수동 관계입니다.\u003c/div>","segs":[{"n":27,"text":"The microwaves, 극초단파는. emitted from mobile phones, 휴대폰에서 방출되는. can interfere, 지장을 줄 수 있다. with sensitive electronic equipment, 민감한 전자 기기에","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 The microwaves가 주어인데, emitted from mobile phones가 뒤에서 수식해요. emitted는 수동의 의미를 가진 과거분사구라서 주어를 꾸미는 형용사구 역할을 합니다. 동사는 can interfere이고 with sensitive electronic equipment이 뒤에 이어지면서 간섭 대상을 나타내요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 \u003cspan class=\"fx\">The microwaves emitted from mobile phones\u003c/span> can interfere with sensitive electronic equipment.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>휴대폰에서 나오는 극초단파가 민감한 전자 장비에 간섭을 일으킬 수 있다는 뜻이에요. 휴대폰 전파가 기기에 방해가 될 수 있다는 경고를 담고 있죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">emitted from mobile phones\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">released from mobile phones\u003c/span>\u003cdiv class=\"w\">emit을 release로 바꾸어 같은 의미를 나타낼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">can interfere with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can disrupt\u003c/span>\u003cdiv class=\"w\">interfere with를 동사 disrupt 하나로 바꾸면 더 간결해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">emit\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">give off, discharge\u003c/span>\u003cspan class=\"y-eq\">emit = give off\u003c/span>\u003cdiv class=\"w\">방출하다라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">interfere with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">disrupt, disturb\u003c/span>\u003cspan class=\"y-eq\">interfere with = disrupt\u003c/span>\u003cdiv class=\"w\">지장을 주다라는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sensitive\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">delicate, vulnerable\u003c/span>\u003cspan class=\"y-eq\">sensitive = delicate\u003c/span>\u003cdiv class=\"w\">민감한이라는 뜻의 형용사 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The electromagnetic waves given off by cell phones can disrupt sensitive electronic devices.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 휴대폰에서 방출되는 극초단파가 민감한 전자 기기에 지장을 줄 수 있다는 뜻이에요. 병원이나 비행기 같은 곳에서 휴대폰 사용을 제한하는 이유를 연상하면 이해가 쉬워요.","hl":"mn"},{"n":30,"text":"emitted from mobile phones는 released from mobile phones로 바꿔 쓸 수 있어요. can interfere with는 can disrupt로 바꾸면 더 간결하게 표현할 수 있습니다.","hl":"rw"},{"n":31,"text":"emit은 give off나 discharge로 바꿀 수 있고, interfere with는 disrupt나 disturb로 바꿔 쓸 수 있어요. sensitive는 delicate나 vulnerable로 자주 대체됩니다. 이 동사와 형용사 짝을 함께 외워 두면 좋아요.","hl":"ph"},{"n":32,"text":"전체를 바꾸면 The electromagnetic waves given off by cell phones can disrupt sensitive electronic devices라고 할 수 있어요. 같은 의미를 다른 어휘로 표현한 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 \u003cspan class=\"fx\">An outstanding feature in the evolution of modern man\u003c/span> is the growth of the size of the brain.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">An outstanding feature\u003c/div>\u003cdiv class=\"k\">두드러진 특징은\u003c/div>\u003cdiv class=\"e\"> in the evolution\u003c/div>\u003cdiv class=\"k\">진화에서\u003c/div>\u003cdiv class=\"e\"> of modern man\u003c/div>\u003cdiv class=\"k\">현대 인류의\u003c/div>\u003cdiv class=\"e\"> is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\"> the growth\u003c/div>\u003cdiv class=\"k\">증가이다\u003c/div>\u003cdiv class=\"e\"> of the size\u003c/div>\u003cdiv class=\"k\">크기의\u003c/div>\u003cdiv class=\"e\"> of the brain.\u003c/div>\u003cdiv class=\"k\">뇌의\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 An outstanding feature가 전치사구 in the evolution of modern man의 수식을 받는 \u003cb class=\"key\">전치사구 형용사구\u003c/b> 구조입니다. of가 연속으로 이어지며 소유 관계를 나타냅니다.\u003c/div>","segs":[{"n":33,"text":"An outstanding feature, 두드러진 특징은. in the evolution, 진화에서. of modern man, 현대 인류의. is, ~이다. the growth, 증가이다. of the size, 크기의. of the brain, 뇌의","hl":"ch"},{"n":34,"text":"여섯 번째 문장은 An outstanding feature가 주어이고 in the evolution of modern man이 뒤에서 어느 분야의 특징인지 꾸며 줘요. 주어 전체가 An outstanding feature in the evolution of modern man입니다. is가 동사이고 the growth of the size of the brain이 보어예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 \u003cspan class=\"fx\">An outstanding feature in the evolution of modern man\u003c/span> is the growth of the size of the brain.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>현대 인류의 진화에서 두드러진 특징은 뇌 크기의 증가라는 뜻이에요. 인간 진화에서 뇌 용량이 커진 것이 중요한 변화임을 나타내는 문장이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">An outstanding feature in the evolution of modern man\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">A notable characteristic of human evolution\u003c/span>\u003cdiv class=\"w\">outstanding을 notable로, feature를 characteristic으로 바꾸고 of를 사용해 더 간결하게 표현할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the growth of the size of the brain\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the increase in brain size\u003c/span>\u003cdiv class=\"w\">명사 나열을 of 대신 in을 써서 더 자연스럽고 간결하게 바꾼 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">outstanding\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">remarkable, notable\u003c/span>\u003cspan class=\"y-eq\">outstanding = remarkable\u003c/span>\u003cdiv class=\"w\">두드러진, 눈에 띄는이라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">feature\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">characteristic, trait\u003c/span>\u003cspan class=\"y-eq\">feature = characteristic\u003c/span>\u003cdiv class=\"w\">특징이라는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">growth\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">increase, expansion\u003c/span>\u003cspan class=\"y-eq\">growth = increase\u003c/span>\u003cdiv class=\"w\">증가라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A notable characteristic in the evolution of humans is the increase in brain size.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 현대 인류 진화에서 두드러지는 특징이 뇌 크기의 증가라는 뜻이에요. 인류가 진화하면서 뇌가 커지고 지능이 발달했다는 과학적 사실을 간단히 요약한 문장이죠.","hl":"mn"},{"n":36,"text":"An outstanding feature in the evolution of modern man은 A notable characteristic of human evolution으로 바꿀 수 있어요. the growth of the size of the brain은 the increase in brain size로 간결하게 바꿀 수 있습니다.","hl":"rw"},{"n":37,"text":"outstanding은 remarkable이나 notable로, feature는 characteristic이나 trait로 바꿔 쓸 수 있어요. growth는 increase나 expansion과 의미가 비슷합니다. 이 어휘들은 과학 지문에서 자주 나옵니다.","hl":"ph"},{"n":38,"text":"전체 문장은 A notable characteristic in the evolution of humans is the increase in brain size라고 바꿔 쓸 수 있어요. 원래 문장보다 조금 더 간결하지만 뜻은 그대로입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 \u003cspan class=\"fx\">Many present efforts to guard and maintain human progress, to meet human needs, and to realize human ambitions\u003c/span> are simply unsustainable—in both rich and poor nations.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Many present efforts\u003c/div>\u003cdiv class=\"k\">현재의 많은 노력은\u003c/div>\u003cdiv class=\"e\"> to guard and maintain human progress,\u003c/div>\u003cdiv class=\"k\">인류의 발전을 지키고 유지하려는\u003c/div>\u003cdiv class=\"e\"> to meet human needs,\u003c/div>\u003cdiv class=\"k\">인간의 요구를 만족시키려는\u003c/div>\u003cdiv class=\"e\"> and to realize human ambitions\u003c/div>\u003cdiv class=\"k\">그리고 인간의 야망을 실현하려는\u003c/div>\u003cdiv class=\"e\"> are simply unsustainable\u003c/div>\u003cdiv class=\"k\">도저히 지속할 수 없다\u003c/div>\u003cdiv class=\"e\">—in both rich and poor nations.\u003c/div>\u003cdiv class=\"k\">부유한 국가와 가난한 국가 모두에서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 Many present efforts가 등위접속사 and로 연결된 세 개의 to부정사구 to guard..., to meet..., and to realize...의 수식을 받는 \u003cb class=\"key\">to부정사 형용사구 병렬\u003c/b> 구조입니다. 수식어가 길어 동사 are를 찾는 것이 중요합니다.\u003c/div>","segs":[{"n":39,"text":"Many present efforts, 현재의 많은 노력은. to guard and maintain human progress, 인류의 발전을 지키고 유지하려는. to meet human needs, 인간의 요구를 만족시키려는. and to realize human ambitions, 그리고 인간의 야망을 실현하려는. are simply unsustainable, 도저히 지속할 수 없다. —in both rich and poor nations, 부유한 국가와 가난한 국가 모두에서","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 주어가 아주 길어요. Many present efforts가 핵심 주어이고, to guard and maintain human progress, to meet human needs, and to realize human ambitions라는 세 개의 to부정사구가 and로 연결되어 주어를 꾸며 줘요. 이 긴 수식어구 전체가 주어에 포함되므로 동사는 are입니다. are simply unsustainable이 서술부이고, 뒤에 대시 다음에 있는 in both rich and poor nations는 범위를 나타내는 부사구예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 \u003cspan class=\"fx\">Many present efforts to guard and maintain human progress, to meet human needs, and to realize human ambitions\u003c/span> are simply unsustainable—in both rich and poor nations.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인류의 발전을 지키고 유지하며, 인간의 요구를 충족하고, 인간의 야망을 실현하려는 현재의 많은 노력이 부자 나라와 가난한 나라 모두에서 지속 불가능하다는 뜻이에요. 지금의 방식이 한계에 부딪혔다는 비판적 메시지를 담고 있죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Many present efforts to guard and maintain human progress, to meet human needs, and to realize human ambitions\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Many current attempts to protect and sustain human progress, satisfy human needs, and fulfill human ambitions\u003c/span>\u003cdiv class=\"w\">guard를 protect, meet를 satisfy, realize를 fulfill로 바꾸어 유사 의미를 나타낼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">simply unsustainable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">just not sustainable\u003c/span>\u003cdiv class=\"w\">simply가 부정문에서 도저히라는 뜻을 가지는데, just not sustainable으로 바꾸면 더 쉬운 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">efforts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">attempts, endeavors\u003c/span>\u003cspan class=\"y-eq\">effort = attempt\u003c/span>\u003cdiv class=\"w\">노력이라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">guard\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">protect, defend\u003c/span>\u003cspan class=\"y-eq\">guard = protect\u003c/span>\u003cdiv class=\"w\">지키다라는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unsustainable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">not viable, impossible to maintain\u003c/span>\u003cspan class=\"y-eq\">unsustainable = not viable\u003c/span>\u003cdiv class=\"w\">지속할 수 없는이라는 뜻을 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Many of today's attempts to protect and sustain human progress, meet human needs, and fulfill human ambitions are simply not sustainable in both wealthy and poor countries.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 인류의 발전을 지키고 유지하며, 인간의 요구를 충족하고, 인간의 야망을 실현하려는 현재의 많은 노력이 부자 나라와 가난한 나라 모두에서 지속할 수 없다는 뜻이에요. 환경이나 자원 문제처럼 지금의 방식이 한계에 부딪혔다는 비판적 메시지를 담고 있죠.","hl":"mn"},{"n":42,"text":"Many present efforts는 Many current attempts로 바꾸고, guard는 protect, meet는 satisfy, realize는 fulfill로 바꿔 쓸 수 있어요. simply unsustainable은 just not sustainable로 바꾸면 조금 더 쉬운 표현이 됩니다.","hl":"rw"},{"n":43,"text":"efforts는 attempts나 endeavors로, guard는 protect나 defend로 바꿀 수 있어요. unsustainable은 not viable이나 impossible to maintain으로 바꿔도 뜻이 통합니다. 이 어휘들은 환경 관련 지문에서 자주 등장해요.","hl":"ph"},{"n":44,"text":"전체를 바꾸면 Many of today's attempts to protect and sustain human progress, meet human needs, and fulfill human ambitions are simply not sustainable in both wealthy and poor countries라고 쓸 수 있어요. 구조는 길지만 원문과 의미가 같죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 \u003cspan class=\"fx\">Scientists studying genes in yeast cells\u003c/span> recently found a chemical that seems to work with a longevity gene to increase the yeast cell's lifespan.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Scientists\u003c/div>\u003cdiv class=\"k\">과학자들은\u003c/div>\u003cdiv class=\"e\"> studying genes in yeast cells\u003c/div>\u003cdiv class=\"k\">효모 세포 속의 유전자를 연구하는\u003c/div>\u003cdiv class=\"e\"> recently found\u003c/div>\u003cdiv class=\"k\">최근에 발견했다\u003c/div>\u003cdiv class=\"e\"> a chemical\u003c/div>\u003cdiv class=\"k\">화학물질을\u003c/div>\u003cdiv class=\"e\"> that seems to work\u003c/div>\u003cdiv class=\"k\">작동하는 것처럼 보이는\u003c/div>\u003cdiv class=\"e\"> with a longevity gene\u003c/div>\u003cdiv class=\"k\">장수 유전자와 함께\u003c/div>\u003cdiv class=\"e\"> to increase the yeast cell's lifespan.\u003c/div>\u003cdiv class=\"k\">효모 세포의 수명을 늘리기 위해서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 Scientists가 현재분사구 studying genes in yeast cells의 수식을 받는 \u003cb class=\"key\">현재분사 형용사구\u003c/b> 구조입니다. that 이하는 a chemical을 수식하는 관계대명사절입니다.\u003c/div>","segs":[{"n":45,"text":"Scientists, 과학자들은. studying genes in yeast cells, 효모 세포 속의 유전자를 연구하는. recently found, 최근에 발견했다. a chemical, 화학물질을. that seems to work, 작동하는 것처럼 보이는. with a longevity gene, 장수 유전자와 함께. to increase the yeast cell's lifespan, 효모 세포의 수명을 늘리기 위해서","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 Scientists가 주어이고 studying genes in yeast cells가 뒤에서 연구하는 과학자들을 꾸며 줘요. 이 현재분사구가 주어를 수식하는 형용사구예요. recently found가 동사이고 a chemical이 목적어입니다. that 이하는 a chemical을 수식하는 관계대명사절로, seems to work가 절의 동사 역할을 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 \u003cspan class=\"fx\">Scientists studying genes in yeast cells\u003c/span> recently found a chemical that seems to work with a longevity gene to increase the yeast cell's lifespan.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>효모 세포에서 유전자를 연구하는 과학자들이 최근에 장수 유전자와 함께 작용하여 효모 세포의 수명을 늘리는 화학물질을 발견했다는 뜻이에요. 노화 연구에서 수명 연장 가능성을 보여 주는 발견이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Scientists studying genes in yeast cells\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Scientists who study genes in yeast cells\u003c/span>\u003cdiv class=\"w\">현재분사구를 관계대명사절로 바꾸면 연구하는 과학자라는 의미가 더 명확해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">found a chemical that seems to work with a longevity gene\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">discovered a substance that appears to cooperate with a longevity gene\u003c/span>\u003cdiv class=\"w\">found를 discovered, chemical을 substance, seems를 appears로 바꾸어 더 격식 있게 표현한 것입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">studying\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">examining, researching\u003c/span>\u003cspan class=\"y-eq\">study = research\u003c/span>\u003cdiv class=\"w\">연구하다라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">found\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">discovered, identified\u003c/span>\u003cspan class=\"y-eq\">found = discovered\u003c/span>\u003cdiv class=\"w\">발견하다라는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">seems to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">appears to\u003c/span>\u003cspan class=\"y-eq\">seem to = appear to\u003c/span>\u003cdiv class=\"w\">~처럼 보이다라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Researchers who study genes in yeast cells recently identified a substance that appears to work with a longevity gene to extend the yeast cell's lifespan.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"이 문장은 효모 세포에서 유전자를 연구하는 과학자들이 최근에 어떤 화학물질을 발견했는데, 그것이 장수 유전자와 함께 작용해서 효모 세포의 수명을 늘리는 것처럼 보인다는 뜻이에요. 노화 연구에서 수명 연장 가능성을 보여 주는 발견이죠.","hl":"mn"},{"n":48,"text":"Scientists studying genes in yeast cells는 Scientists who study genes in yeast cells로 관계대명사를 써서 바꿀 수 있어요. found a chemical that seems to work with a longevity gene은 discovered a substance that appears to cooperate with a longevity gene으로 격식 있게 바꿀 수 있습니다.","hl":"rw"},{"n":49,"text":"study는 examine이나 research로, found는 discovered나 identified로 바꿔 쓸 수 있어요. seems to는 appears to와 바꿔도 뜻이 같습니다. 과학 지문에서 이런 유의어는 정말 자주 나와요.","hl":"ph"},{"n":50,"text":"전체를 바꾸면 Researchers who study genes in yeast cells recently identified a substance that appears to work with a longevity gene to extend the yeast cell's lifespan이라고 할 수 있어요. 원문보다 조금 길지만 어휘만 바꾼 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 \u003cspan class=\"fx\">Foreign, or alien, species introduced accidentally or intentionally into new territories\u003c/span> often do well in their new homes because conditions may be highly favorable to their growth and reproduction.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Foreign, or alien, species\u003c/div>\u003cdiv class=\"k\">외래에서 온, 즉 외래종은\u003c/div>\u003cdiv class=\"e\"> introduced accidentally or intentionally\u003c/div>\u003cdiv class=\"k\">우연히 또는 의도적으로 도입된\u003c/div>\u003cdiv class=\"e\"> into new territories\u003c/div>\u003cdiv class=\"k\">새로운 영역에\u003c/div>\u003cdiv class=\"e\"> often do well\u003c/div>\u003cdiv class=\"k\">종종 잘 생육한다\u003c/div>\u003cdiv class=\"e\"> in their new homes\u003c/div>\u003cdiv class=\"k\">그들의 새로운 서식지에서\u003c/div>\u003cdiv class=\"e\"> because conditions may be highly favorable\u003c/div>\u003cdiv class=\"k\">여건이 아마 매우 유리하기 때문에\u003c/div>\u003cdiv class=\"e\"> to their growth and reproduction.\u003c/div>\u003cdiv class=\"k\">그들의 성장과 번식에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 Foreign, or alien, species가 과거분사구 introduced accidentally or intentionally into new territories의 수식을 받는 \u003cb class=\"key\">과거분사 형용사구\u003c/b> 구조입니다. introduced는 수동의 의미를 나타냅니다.\u003c/div>","segs":[{"n":51,"text":"Foreign, or alien, species, 외래에서 온, 즉 외래종은. introduced accidentally or intentionally, 우연히 또는 의도적으로 도입된. into new territories, 새로운 영역에. often do well, 종종 잘 생육한다. in their new homes, 그들의 새로운 서식지에서. because conditions may be highly favorable, 여건이 아마 매우 유리하기 때문에. to their growth and reproduction, 그들의 성장과 번식에","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 Foreign, or alien, species가 주어이고 introduced accidentally or intentionally into new territories가 뒤에서 수식해요. introduced는 과거분사로, 외래종이 도입되었다는 수동의 의미를 담아서 주어를 꾸며 줍니다. often do well이 서술부이고 because 이하는 이유를 나타내는 부사절이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 \u003cspan class=\"fx\">Foreign, or alien, species introduced accidentally or intentionally into new territories\u003c/span> often do well in their new homes because conditions may be highly favorable to their growth and reproduction.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우연히 또는 의도적으로 새로운 영토에 유입된 외래종은 새로운 서식지에서 잘 자라는 경우가 많은데, 그 이유는 성장과 번식에 유리한 조건 때문이라는 뜻이에요. 외래종이 새로운 환경에서 번성하는 생태학적 현상을 설명하죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Foreign, or alien, species\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Non-native species\u003c/span>\u003cdiv class=\"w\">alien을 non-native로 바꾸면 더 간단하고 명확하게 외래종을 나타낼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">introduced accidentally or intentionally\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">brought in either by accident or on purpose\u003c/span>\u003cdiv class=\"w\">부사구를 풀어 써서 우연히 또는 의도적으로라는 뜻을 더 분명하게 표현한 것입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">alien\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">exotic, non-native\u003c/span>\u003cspan class=\"y-eq\">alien = non-native\u003c/span>\u003cdiv class=\"w\">외래의라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">introduced\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">brought in, imported\u003c/span>\u003cspan class=\"y-eq\">introduce = bring in\u003c/span>\u003cdiv class=\"w\">도입하다라는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">favorable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">beneficial, advantageous\u003c/span>\u003cspan class=\"y-eq\">favorable = beneficial\u003c/span>\u003cdiv class=\"w\">유리한이라는 뜻의 형용사 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Non-native species that are brought into new territories either by accident or on purpose often thrive there because conditions can be very favorable for their growth and reproduction.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 우연히 또는 일부러 새로운 지역에 들어온 외래종이 그곳에서 잘 자라는 경우가 많다는 뜻이에요. 그 이유는 새로운 환경이 그들의 성장과 번식에 아주 유리할 수 있기 때문이죠. 외래종이 토착 생태계를 교란할 수 있다는 생태학적 배경을 생각하면 이해가 쉬워요.","hl":"mn"},{"n":54,"text":"Foreign, or alien, species는 Non-native species로 간단히 바꿀 수 있어요. introduced accidentally or intentionally는 brought in either by accident or on purpose로 풀어 쓰면 뜻이 더 분명해집니다.","hl":"rw"},{"n":55,"text":"alien은 exotic이나 non-native로, introduced는 brought in이나 imported로 바꿀 수 있어요. favorable는 beneficial이나 advantageous와 유사한 뜻입니다. 생태학 지문에서 자주 쓰이는 어휘들이에요.","hl":"ph"},{"n":56,"text":"전체 문장은 Non-native species that are brought into new territories either by accident or on purpose often thrive there because conditions can be very favorable for their growth and reproduction이라고 바꿀 수 있어요. 원문의 분사구를 관계대명사절로 바꾸고 어휘를 다듬었죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 \u003cspan class=\"fx\">Speculations about the meaning and purpose of prehistoric art\u003c/span> rely heavily on analogies drawn with modern-day hunter-gatherer societies.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Speculations\u003c/div>\u003cdiv class=\"k\">고찰은\u003c/div>\u003cdiv class=\"e\"> about the meaning and purpose\u003c/div>\u003cdiv class=\"k\">의미와 목적에 대한\u003c/div>\u003cdiv class=\"e\"> of prehistoric art\u003c/div>\u003cdiv class=\"k\">선사시대 예술의\u003c/div>\u003cdiv class=\"e\"> rely heavily\u003c/div>\u003cdiv class=\"k\">굉장히 의존한다\u003c/div>\u003cdiv class=\"e\"> on analogies\u003c/div>\u003cdiv class=\"k\">유사성에\u003c/div>\u003cdiv class=\"e\"> drawn with modern-day hunter-gatherer societies.\u003c/div>\u003cdiv class=\"k\">현대의 수렵 채집 사회에서 끌어낸\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 Speculations가 전치사구 about the meaning and purpose of prehistoric art의 수식을 받는 \u003cb class=\"key\">전치사구 형용사구\u003c/b> 구조입니다. 본동사 rely는 복수 주어에 맞춘 형태입니다.\u003c/div>","segs":[{"n":57,"text":"Speculations, 고찰은. about the meaning and purpose, 의미와 목적에 대한. of prehistoric art, 선사시대 예술의. rely heavily, 굉장히 의존한다. on analogies, 유사성에. drawn with modern-day hunter-gatherer societies, 현대의 수렵 채집 사회에서 끌어낸","hl":"ch"},{"n":58,"text":"열 번째 문장은 Speculations가 주어이고 about the meaning and purpose of prehistoric art가 전치사구로 주어를 꾸며 줘요. 주어가 Speculations로 복수이기 때문에 동사도 rely로 쓰였습니다. on analogies는 rely의 전치사 목적어이고 drawn with modern-day hunter-gatherer societies는 analogies를 수식하는 과거분사구예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 \u003cspan class=\"fx\">Speculations about the meaning and purpose of prehistoric art\u003c/span> rely heavily on analogies drawn with modern-day hunter-gatherer societies.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>선사 시대 예술의 의미와 목적에 대한 추측은 현대 수렵 채집 사회와의 유사성에 크게 의존한다는 뜻이에요. 과거의 예술을 이해할 때 현재의 수렵 채집 사회를 비교 자료로 사용한다는 이야기죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Speculations about the meaning and purpose of prehistoric art\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Ideas about what prehistoric art means and what it was for\u003c/span>\u003cdiv class=\"w\">명사구를 의문사절로 풀어 써서 의미와 목적을 더 구체적으로 표현한 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rely heavily on analogies drawn with modern-day hunter-gatherer societies\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">depend strongly on comparisons with contemporary hunter-gatherer groups\u003c/span>\u003cdiv class=\"w\">rely를 depend, analogies를 comparisons, modern-day를 contemporary로 바꾸어 격식 있게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">speculation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">conjecture, hypothesis\u003c/span>\u003cspan class=\"y-eq\">speculation = conjecture\u003c/span>\u003cdiv class=\"w\">추측, 고찰이라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rely on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">depend on, count on\u003c/span>\u003cspan class=\"y-eq\">rely on = depend on\u003c/span>\u003cdiv class=\"w\">의존하다라는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">analogy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">comparison, similarity\u003c/span>\u003cspan class=\"y-eq\">analogy = comparison\u003c/span>\u003cdiv class=\"w\">유사성, 비유라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Ideas about the meaning and purpose of prehistoric art depend heavily on comparisons with modern hunter-gatherer societies.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 선사 시대 예술의 의미와 목적에 대한 추측이 현대 수렵 채집 사회와의 유사성에 크게 의존한다는 뜻이에요. 옛날 사람들의 예술을 이해하기 위해 현재도 수렵과 채집으로 사는 사회를 비교 자료로 사용한다는 이야기죠.","hl":"mn"},{"n":60,"text":"Speculations about the meaning and purpose of prehistoric art는 Ideas about what prehistoric art means and what it was for으로 풀어 쓸 수 있어요. rely heavily on analogies drawn with modern-day hunter-gatherer societies는 depend strongly on comparisons with contemporary hunter-gatherer groups으로 바꿀 수 있습니다.","hl":"rw"},{"n":61,"text":"speculation은 conjecture나 hypothesis로, rely on은 depend on이나 count on으로 바꿔 쓸 수 있어요. analogy는 comparison이나 similarity와 비슷한 뜻입니다. 이 어휘들은 인문학 지문에서 자주 나옵니다.","hl":"ph"},{"n":62,"text":"전체 문장은 Ideas about the meaning and purpose of prehistoric art depend heavily on comparisons with modern hunter-gatherer societies라고 바꿀 수 있어요. 원문보다 덜 격식적이지만 뜻은 명확하게 전달되죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 \u003cspan class=\"fx\">The best way to protect your computer from viruses and spyware\u003c/span> is to install a recommended anti-virus program.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The best way\u003c/div>\u003cdiv class=\"k\">최상의 방법은\u003c/div>\u003cdiv class=\"e\"> to protect your computer\u003c/div>\u003cdiv class=\"k\">당신의 컴퓨터를 보호하기 위한\u003c/div>\u003cdiv class=\"e\"> from viruses and spyware\u003c/div>\u003cdiv class=\"k\">바이러스와 스파이웨어로부터\u003c/div>\u003cdiv class=\"e\"> is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\"> to install\u003c/div>\u003cdiv class=\"k\">설치하는 것이다\u003c/div>\u003cdiv class=\"e\"> a recommended anti-virus program.\u003c/div>\u003cdiv class=\"k\">권장되는 안티바이러스 프로그램을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The best way가 to부정사구 to protect your computer from viruses and spyware의 수식을 받는 \u003cb class=\"key\">to부정사 형용사구\u003c/b> 구조입니다. 단수 주어이므로 동사 is가 쓰였습니다.\u003c/div>","segs":[{"n":63,"text":"The best way, 최상의 방법은. to protect your computer, 당신의 컴퓨터를 보호하기 위한. from viruses and spyware, 바이러스와 스파이웨어로부터. is, ~이다. to install, 설치하는 것이다. a recommended anti-virus program, 권장되는 안티바이러스 프로그램을","hl":"ch"},{"n":64,"text":"열한 번째 문장은 The best way가 주어이고 to protect your computer from viruses and spyware가 뒤에서 그 방법을 꾸며 줘요. way는 to부정사로 잘 수식되는 명사라서 이 구조가 반복 출제됩니다. is가 단수 동사로 쓰였고 to install a recommended anti-virus program이 보어 역할을 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 \u003cspan class=\"fx\">The best way to protect your computer from viruses and spyware\u003c/span> is to install a recommended anti-virus program.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>바이러스와 스파이웨어로부터 컴퓨터를 보호하는 최선의 방법은 권장되는 백신 프로그램을 설치하는 것이라는 뜻이에요. 컴퓨터 보안에 대한 실용적인 조언이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The best way to protect your computer from viruses and spyware\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The most effective method to keep your computer safe from viruses and spyware\u003c/span>\u003cdiv class=\"w\">best way를 most effective method로, protect를 keep safe로 바꾸어 뜻을 더 구체적으로 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">install a recommended anti-virus program\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">set up a trusted anti-virus software\u003c/span>\u003cdiv class=\"w\">install을 set up으로, recommended를 trusted로 바꾸어도 자연스럽습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">protect from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">guard against, shield from\u003c/span>\u003cspan class=\"y-eq\">protect from = guard against\u003c/span>\u003cdiv class=\"w\">보호하다라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">viruses and spyware\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">malware\u003c/span>\u003cspan class=\"y-eq\">viruses and spyware = malware\u003c/span>\u003cdiv class=\"w\">악성 소프트웨어를 통틀어 이르는 말입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">install\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">set up\u003c/span>\u003cspan class=\"y-eq\">install = set up\u003c/span>\u003cdiv class=\"w\">설치하다라는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The most effective way to keep your computer safe from viruses and spyware is to set up a recommended anti-virus program.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 바이러스와 스파이웨어로부터 컴퓨터를 보호하는 가장 좋은 방법은 권장되는 백신 프로그램을 설치하는 것이라는 뜻이에요. 컴퓨터 보안에 대한 실용적인 조언이죠. spyware는 사용자 몰래 정보를 빼가는 악성 프로그램을 말해요.","hl":"mn"},{"n":66,"text":"The best way to protect your computer from viruses and spyware는 The most effective method to keep your computer safe from viruses and spyware로 바꿀 수 있어요. install a recommended anti-virus program은 set up a trusted anti-virus software로 바꿔도 자연스럽습니다.","hl":"rw"},{"n":67,"text":"protect from은 guard against나 shield from으로 바꿀 수 있어요. viruses and spyware는 통틀어 malware라고 할 수도 있고, install은 set up으로 자주 바꿔 씁니다. 컴퓨터 보안 지문에서 이 어휘들은 필수예요.","hl":"ph"},{"n":68,"text":"전체 문장은 The most effective way to keep your computer safe from viruses and spyware is to set up a recommended anti-virus program이라고 바꿀 수 있어요. 원문과 같은 뜻을 더 쉬운 표현으로 전달한 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">The carbon dioxide given off when coal and oil are burned\u003c/span> is accumulating in the atmosphere and causing temperatures to rise.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The carbon dioxide\u003c/div>\u003cdiv class=\"k\">이산화탄소는\u003c/div>\u003cdiv class=\"e\"> given off\u003c/div>\u003cdiv class=\"k\">배출되는\u003c/div>\u003cdiv class=\"e\"> when coal and oil are burned\u003c/div>\u003cdiv class=\"k\">석탄과 석유가 연소될 때\u003c/div>\u003cdiv class=\"e\"> is accumulating\u003c/div>\u003cdiv class=\"k\">축적되고 있다\u003c/div>\u003cdiv class=\"e\"> in the atmosphere\u003c/div>\u003cdiv class=\"k\">대기 중에\u003c/div>\u003cdiv class=\"e\"> and causing temperatures to rise.\u003c/div>\u003cdiv class=\"k\">그리고 기온이 상승하도록 초래하고 있다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The carbon dioxide가 과거분사구 given off when coal and oil are burned의 수식을 받는 \u003cb class=\"key\">과거분사 형용사구\u003c/b> 구조입니다. given off는 수동의 의미이며 when절이 부사 역할을 합니다.\u003c/div>","segs":[{"n":69,"text":"The carbon dioxide, 이산화탄소는. given off, 배출되는. when coal and oil are burned, 석탄과 석유가 연소될 때. is accumulating, 축적되고 있다. in the atmosphere, 대기 중에. and causing temperatures to rise, 그리고 기온이 상승하도록 초래하고 있다","hl":"ch"},{"n":70,"text":"열두 번째 문장은 The carbon dioxide가 주어이고 given off when coal and oil are burned가 뒤에서 수식해요. given off는 수동의 과거분사구라서 주어를 꾸며 주고, when coal and oil are burned는 그 안에서 언제 배출되는지를 나타내는 부사절이에요. 주어 전체가 길지만 단수 명사 carbon dioxide를 핵심으로 보면 동사 is가 맞다는 것을 알 수 있어요. 뒤에 is accumulating과 causing이 and로 연결되어 있습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">The carbon dioxide given off when coal and oil are burned\u003c/span> is accumulating in the atmosphere and causing temperatures to rise.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>석탄과 석유가 연소될 때 배출되는 이산화탄소가 대기 중에 축적되고 있으며 기온 상승을 일으키고 있다는 뜻이에요. 화석 연료 사용과 지구 온난화의 관계를 설명하는 전형적인 문장이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">given off when coal and oil are burned\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">released when coal and oil burn\u003c/span>\u003cdiv class=\"w\">given off를 released로 바꾸고 수동태를 능동으로 바꾸어도 자연스럽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is accumulating in the atmosphere and causing temperatures to rise\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is building up in the atmosphere and making temperatures rise\u003c/span>\u003cdiv class=\"w\">accumulate를 build up으로, cause를 make로 바꾸면 더 쉬운 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">give off\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">emit, release\u003c/span>\u003cspan class=\"y-eq\">give off = emit\u003c/span>\u003cdiv class=\"w\">배출하다라는 뜻의 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">accumulate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">build up, pile up\u003c/span>\u003cspan class=\"y-eq\">accumulate = build up\u003c/span>\u003cdiv class=\"w\">축적하다라는 뜻으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">atmosphere\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">air, environment\u003c/span>\u003cspan class=\"y-eq\">atmosphere = air\u003c/span>\u003cdiv class=\"w\">대기, 환경이라는 뜻의 유사어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Carbon dioxide emitted from burning coal and oil is accumulating in the atmosphere and making temperatures increase.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 석탄과 석유가 탈 때 나오는 이산화탄소가 대기 중에 쌓이고 있고, 그로 인해 기온이 오르고 있다는 뜻이에요. 화석 연료 사용과 지구 온난화의 관계를 설명하는 전형적인 문장이죠. give off는 배출하다라는 뜻으로 꼭 기억해 두세요.","hl":"mn"},{"n":72,"text":"given off when coal and oil are burned는 released when coal and oil burn으로 바꿔 쓸 수 있어요. is accumulating in the atmosphere and causing temperatures to rise는 is building up in the atmosphere and making temperatures rise로 바꾸면 더 쉬운 표현이 됩니다.","hl":"rw"},{"n":73,"text":"give off는 emit이나 release로, accumulate는 build up이나 pile up으로 바꿀 수 있어요. atmosphere는 air나 environment와 문맥에 따라 유사하게 쓰이기도 합니다. 이 어휘들은 환경 지문에서 정말 자주 나와요.","hl":"ph"},{"n":74,"text":"전체 문장은 Carbon dioxide emitted from burning coal and oil is accumulating in the atmosphere and making temperatures increase라고 바꿀 수 있어요. 원문과 같은 의미이면서 주어의 수식 구조를 조금 바꾼 문장이죠.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>주어 뒤에 \u003cb class=\"key\">전치사구\u003c/b>, \u003cb class=\"key\">to부정사구\u003c/b>, \u003cb class=\"key\">현재분사구\u003c/b>, \u003cb class=\"key\">과거분사구\u003c/b>가 오면 주어를 수식하는 \u003cb class=\"key\">형용사구\u003c/b>이다.\u003c/li>\u003cli>긴 주어의 핵심 명사와 \u003cb class=\"key\">수식어구\u003c/b>, 본동사를 구분하여 해석한다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 주어 뒤에 형용사구가 붙어서 주어가 길어지는 구문을 집중적으로 공부했어요. 주어를 꾸미는 전치사구, to부정사구, 현재분사구, 과거분사구를 정확히 찾아내고, 진짜 동사를 빠르게 구분하는 연습을 계속하면 됩니다. 다음 시간에는 더 다양한 실전 문장으로 훈련해요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
