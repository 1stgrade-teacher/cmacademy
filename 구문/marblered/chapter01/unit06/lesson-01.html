  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};

  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"unit06","title":"마법같은 블록구문 실전편 Unit 06 주어 + 형용사절 2","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편 Unit 06 주어 + 형용사절 2\u003c/div>\u003ch1>마법같은 블록구문 실전편 Unit 06 주어 + 형용사절 2\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>주어 뒤에 붙는 명사 수식 절을 블록으로 묶어 진짜 동사를 정확히 찾아 해석한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요. 오늘은 마법같은 블록구문 실전편 여섯 번째 유닛, 주어와 형용사절 두 번째 시간입니다. 주어가 길어 보여도 그 안에 숨은 절을 블록으로 묶으면 문장의 중심 동사를 빠르게 찾을 수 있죠. 예문 열두 개를 함께 보면서 주어 뒤를 수식하는 절의 정체를 정리해 보겠습니다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 Unit 06 주어 + 형용사절 2\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">주어 자리에 \u003cb class=\"key\">명사 + 형용사절\u003c/b>이 오면, \u003cb class=\"key\">접속사 that\u003c/b>이나 \u003cb class=\"key\">관계대명사 목적격\u003c/b>, \u003cb class=\"key\">관계부사 why\u003c/b> 등이 절을 이끈다. 핵심은 긴 주어 속에서 \u003cb class=\"key\">수식어구\u003c/b>를 묶어내고 \u003cb class=\"key\">진짜 동사\u003c/b>를 찾는 것이다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">The fact that a book or publication is popular\u003c/span> does not necessarily make it of value.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">The bodies of flowing ice we call glaciers\u003c/span> are the most spectacular of natural features.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 \u003cspan class=\"fx\">The rule that nouns form their plural by adding &quot;s&quot;\u003c/span> does not apply to the word &quot;mouse.&quot;\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 \u003cspan class=\"fx\">The first impressions we form about someone\u003c/span> often affect our impression of subsequent perceptions of that person.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">One of the most important reasons we need to send humans to Mars\u003c/span> is to determine whether there ever was or even still is life on Mars.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">The announcement that the first stages of human cloning have been achieved\u003c/span> leaves us wondering where it will all end.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 \u003cspan class=\"fx\">The living organisms we now see\u003c/span> all have their structure based upon the element carbon.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">The words you speak to someone\u003c/span> may have the potential to make or break that person, so it is important to choose words carefully.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">The way we wish the world to be\u003c/span> is how, in the movies, it more often than not winds up being.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">The complaint that immigrants take people's jobs\u003c/span> is, like similar complaints about technology, based on an erroneously static view of the world.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">The seemingly impractical knowledge we gain from space probes to other worlds\u003c/span> tells us about our planet and our own role in the scheme of nature.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 The period when humans began growing crops, raising animals for food, and using stone-tool technology is referred to as the Neolithic period.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘 핵심 규칙은 간단해요. 주어 자리에 명사 하나만 오는 게 아니라, 그 명사를 꾸며 주는 절이 뒤에 붙어서 주어 전체가 길어지는 거예요. tha 주어가 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 \u003cspan class=\"fx\">One of the most important reasons we need to send humans to Mars\u003c/span> is to determine whether there ever was or even still is life on Mars.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리가 화성에 인간을 보내야 하는 가장 중요한 이유 중 하나는 화성에 생명체가 있었는지, 혹은 지금도 있는지를 밝히는 것이라는 뜻이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">we need to send humans to Mars\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">why we need to send humans to Mars\u003c/span>\u003cdiv class=\"w\">생략된 관계부사 why를 되살려 이유를 명확하게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whether there ever was or even still is life on Mars\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">whether life ever existed or still exists on Mars\u003c/span>\u003cdiv class=\"w\">there 구문을 없애고 동사 exist를 써서 더 직접적으로 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">determine\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">find out\u003c/span>\u003cspan class=\"y-eq\">determine = find out\u003c/span>\u003cdiv class=\"w\">밝혀내다, 알아내다라는 뜻으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">send humans to Mars\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">send people to Mars\u003c/span>\u003cspan class=\"y-eq\">humans = people\u003c/span>\u003cdiv class=\"w\">인간이라는 뜻의 humans를 people로 바꿔 더 일상적인 표현으로 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ever\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at any time\u003c/span>\u003cspan class=\"y-eq\">ever = at any time\u003c/span>\u003cdiv class=\"w\">지금까지 언제든지라는 의미를 전치사구로 풀었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A key reason we need to send people to Mars is to learn whether life has ever existed or still exists there.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"우리가 화성에 인간을 보내야 하는 가장 중요한 이유 중 하나는, 화성에 과거에 생명체가 있었는지 아니면 지금도 있는지를 밝히기 위해서라는 뜻이에요. 생명 탐사가 화성 유인 탐사의 핵심 목적이라는 걸 강조합니다.","hl":"mn"},{"n":30,"text":"표현을 바꾸면 we need to send humans to Mars는 why we need to send humans to Mars처럼 관계부사를 살려 쓸 수 있어요. whether there ever was or even still is life on Mars는 whether life ever existed or still exists on Mars로 바꾸면 더 간결해집니다.","hl":"rw"},{"n":31,"text":"determine은 find out과 같은 뜻으로 알아내다라는 의미예요. humans는 people로 바꿔도 자연스럽고, ever는 at any time으로 풀이할 수 있습니다.","hl":"ph"},{"n":32,"text":"전체를 바꿔 쓰면 A key reason we need to send people to Mars is to learn whether life has ever existed or still exists there라고 할 수 있어요. there를 써서 화성을 가리키는 표현으로 정리했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 \u003cspan class=\"fx\">The announcement that the first stages of human cloning have been achieved\u003c/span> leaves us wondering where it will all end.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The announcement \u003c/div>\u003cdiv class=\"k\">발표는\u003c/div>\u003cdiv class=\"e\">that the first stages of human cloning have been achieved \u003c/div>\u003cdiv class=\"k\">인간 복제의 첫 단계가 달성되었다는\u003c/div>\u003cdiv class=\"e\">leaves us \u003c/div>\u003cdiv class=\"k\">우리를 남긴다\u003c/div>\u003cdiv class=\"e\">wondering \u003c/div>\u003cdiv class=\"k\">궁금하게\u003c/div>\u003cdiv class=\"e\">where it will all end.\u003c/div>\u003cdi h"},{"n":68,"text":"전체를 바꿔 쓰면 The apparently useless knowledge we get from space probes to other worlds tells us about Earth and our role in the natural order라고 할 수 있어요. impractical을 useless로, planet을 Earth로 풀어 썼어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 The period when humans began growing crops, raising animals for food, and using stone-tool technology is referred to as the Neolithic period.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The reason \u003c/div>\u003cdiv class=\"k\">이유는\u003c/div>\u003cdiv class=\"e\">people give up so quickly \u003c/div>\u003cdiv class=\"k\">사람들이 그렇게 빨리 포기하는\u003c/div>\u003cdiv class=\"e\">is \u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">because \u003c/div>\u003cdiv class=\"k\">왜냐하면\u003c/div>\u003cdiv class=\"e\">they look at \u003c/div>\u003cdiv class=\"k\">그들이 바라보기 때문이다\u003c/div>\u003cdiv class=\"e\">how far they still have to go, \u003c/div>\u003cdiv class=\"k\">그들이 여전히 얼마나 멀리 가야 하는지를\u003c/div>\u003cdiv class=\"e\">instead of \u003c/div>\u003cdiv class=\"k\">그 대신에\u003c/div>\u003cdiv class=\"e\">how far they have come.\u003c/div>\u003cdiv class=\"k\">그들이 얼마나 멀리 왔는지\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어가 \u003cb class=\"key\">관계부사 why\u003c/b>가 생략된 관계사절 people ~ quickly의 수식을 받는 The reason이므로 단수 동사 \u003cb class=\"key\">is\u003c/b>가 적절해요. \u003cb class=\"key\">because\u003c/b>는 보어로 쓰이는 명사절을 이끌고 있고, \u003cb class=\"key\">how far they still have to go\u003c/b>는 at의 목적어, \u003cb class=\"key\">how far they have come\u003c/b>은 instead of의 목적어입니다.\u003c/div>","segs":[{"n":69,"text":"The reason, 이유는. people give up so quickly, 사람들이 그렇게 빨리 포기하는. is, ~이다. because, 왜냐하면. they look at, 그들이 바라보기 때문이다. how far they still have to go, 그들이 여전히 얼마나 멀리 가야 하는지를. instead of, 그 대신에. how far they have come, 그들이 얼마나 멀리 왔는지","hl":"ch"},{"n":70,"text":"열두 번째 문장의 주어는 The reason에 people give up so quickly라는 관계사절이 붙어 있고, people 앞에는 관계부사 why가 생략되어 있어요. 이 주어 덩어리는 단수이므로 동사 is가 쓰였어요. 뒤에 because가 보어로 오는데, 격식 있는 문장에서는 that으로 바꾸기도 합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 The period when humans began growing crops, raising animals for food, and using stone-tool technology is referred to as the Neolithic period.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사람들이 그렇게 빨리 포기하는 이유는, 이미 온 만큼이 아니라 앞으로 가야 할 남은 거리만 보기 때문이라는 뜻. 성취보다 남은 노력에 집중해 좌절한다는 교훈을 담고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">people give up so quickly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">why people give up so quickly\u003c/span>\u003cdiv class=\"w\">생략된 관계부사 why를 살려 the reason과의 연결을 명확히 했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">look at how far they still have to go\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">focus on how far they still have to go\u003c/span>\u003cdiv class=\"w\">look at을 focus on으로 바꿔 집중하다의 의미를 강화했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">give up\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">quit\u003c/span>\u003cspan class=\"y-eq\">give up = quit\u003c/span>\u003cdiv class=\"w\">포기하다라는 뜻의 동의어로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">look at\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">focus on\u003c/span>\u003cspan class=\"y-eq\">look at = focus on\u003c/span>\u003cdiv class=\"w\">바라보다, 주목하다라는 뜻으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">instead of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rather than\u003c/span>\u003cspan class=\"y-eq\">instead of = rather than\u003c/span>\u003cdiv class=\"w\">~대신에라는 뜻의 유의 표현으로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">People give up so quickly because they focus on how far they still have to go, rather than how far they have come.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"사람들이 그렇게 빨리 포기하는 이유는, 지금까지 걸어온 거리를 생각하는 대신 앞으로 가야 할 거리만 바라보기 때문이라는 뜻이에요. 이미 이룬 진전을 보지 못하면 쉽게 지친다는 교훈입니다.","hl":"mn"},{"n":72,"text":"people give up so quickly는 why people give up so quickly처럼 관계부사를 살려 쓸 수 있고, look at은 focus on으로 바꾸면 의미가 더 또렷해져요.","hl":"rw"},{"n":73,"text":"give up은 quit과 같은 뜻이에요. look at은 focus on으로 바꿔 쓸 수 있고, instead of는 rather than과 같은 의미입니다.","hl":"ph"},{"n":74,"text":"전체를 바꿔 쓰면 People give up so quickly because they focus on how far they still have to go, rather than how far they have come이라고 할 수 있어요. The reason을 주어에서 빼고 because절로 직접 연결했어요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 Unit 06 주어 + 형용사절 2\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>주어 자리에 \u003cb class=\"key\">명사 + 형용사절\u003c/b>이 오면 주어 전체를 한 블록으로 묶는다.\u003c/li>\u003cli>that절이 명사 뒤에서 같은 내용을 설명하면 \u003cb class=\"key\">동격절\u003c/b>이고, 관계대명사나 관계부사가 이끌면 \u003cb class=\"key\">형용사절\u003c/b>이다.\u003c/li>\u003cli>긴 주어 속에서 \u003cb class=\"key\">진짜 동사\u003c/b>를 찾아 문장의 뼈대를 잡는다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘 배운 내용을 정리하면, 주어 뒤에 that절이나 관계사절이 붙으면 문장의 시작이 길어져도 겁먹지 말고 그 덩어리를 하나로 묶어야 해요. 주어 블록이 끝난 뒤에 진짜 동사가 오니까 그 동사를 찾는 연습이 중요합니다. 다음 시간에는 더 긴 블록들을 연결해서 읽는 힘을 길러 봐요. 모두 수고했어요.","hl":"sum"}]}]});</script></body></html>
