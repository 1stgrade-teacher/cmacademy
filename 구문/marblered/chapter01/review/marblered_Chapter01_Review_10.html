+P1aZEGTvU49GXjt6/zpdy8cjnpz7f4Ub/16f8DUHf8Ar0X4tWDnIHPAOW49vXPp9e/Snf5/z/h+FM8xckbhgDk5Hv156fh2J7U4Mp7jgAnkdzjv78dP60NW3Dfp0v8Aja/39tBf/r/54/Tv+NNxyOegz157dvTj6deAeaFYMeoHbBI9j3xgjkf1PFIXX1HB747c/wD1+Pb1AIKzvbr2HEgZJIwOvt9aYxVlYEY6d8Z+YEEcZGDz0Y5PvSEqRwU5yOME8cAZA7ZxnjtimnIU5wQRx0OBgHaQcgjOCVI7DnGRRe2t7W118v632LUU4va67eibvpq1G+7sl10P/9k=\" alt=\"\"></div><div class=\"lec-flow\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01원인 발생</div><ul><li>신체 활동이 충분하지 않을 때 우리 몸의 에너지 소비 체계에 문제가 생기기 시작한다.</li><li>신체 활동의 결여 (lack of physical activity)</li><li>운동량 부족으로 인한 에너지 정체</li><li>핵심 키워드: 활동 부족(lack of activity)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02중간 증상</div><ul><li>부족한 활동량은 복부에 지방이 과도하게 쌓이는 구체적인 신체 장애를 유발한다.</li><li>복부 지방 장애 (belly fat disorder)의 발생</li><li>신체 중앙부의 비정상적인 지방 축적</li><li>핵심 키워드: 복부 지방(belly fat)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03최종 결과</div><ul><li>신체 활동 부족과 복부 지방은 결국 몸의 전반적인 에너지 처리 속도를 늦춘다.</li><li>신진대사율 (rate of metabolism)의 감소</li><li>체내 에너지 연소 효율의 저하</li><li>핵심 키워드: 신진대사 저하(decreased metabolism)</li></ul></div></div></div>","<div class=\"lec-section-tag\">단어 정리</div><ul class=\"lec-voca-list\"><li><span class=\"w\">disorder</span> <span class=\"m\">질환, 장애</span></li><li><span class=\"w\">lack</span> <span class=\"m\">부족, 결핍</span></li><li><span class=\"w\">physical activity</span> <span class=\"m\">신체 활동</span></li><li><span class=\"w\">lead to</span> <span class=\"m\">~로 이어지다, ~을 초래하다</span></li><li><span class=\"w\">metabolism</span> <span class=\"m\">신진대사, 대사 작용</span></li><li><span class=\"w\">decrease</span> <span class=\"m\">감소하다, 줄어들다</span></li></ul>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">복부 지방 질환은</span><span class=\"en\"><b>The belly fat disorder</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신체 활동의 부족으로 인한</span><span class=\"en\"><b><span class=\"grammar-hl\">caused by lack of physical activity</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이어진다</span><span class=\"en\"><b><span class=\"grammar-hl\">leads to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신진대사율의 감소로</span><span class=\"en\"><b>a <span class=\"grammar-hl\">decreased rate</span> of metabolism</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 신체의.</span><span class=\"en\"><b>in our body.</b></span></div></div><div class=\"lec-sent-ko\">신체 활동의 부족으로 인한 복부 지방 질환은 우리 신체의 신진대사율의 감소로 이어진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 &#39;신체 활동 부족&#39;이라는 근본적인 원인이 어떻게 &#39;신진대사 저하&#39;라는 결과로 이어지는지를 인과관계로 설명하고 있습니다. 구체적으로는 [운동 부족 -&gt; 복부 비만 발생 -&gt; 신진대사율 감소]라는 단계적 과정을 보여줍니다. 이는 단순한 체중 증가보다 더 심각한 생물학적 기능 저하를 경고하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">caused by lack of physical activity (과거분사(형용사)): 과거분사구인 caused by lack of physical activity가 앞의 명사 The belly fat disorder를 수식한다. N + p.p. 구조로 &#39;p.p.된 N&#39; 또는 &#39;N that was p.p.&#39; 형태의 축약된 관계절로 볼 수 있다.</div><div class=\"lec-gr-item\">leads to (관용표현): lead to는 &#39;~로 이어지다/야기하다&#39;라는 의미의 구동사(숙어)로, 주어(The belly fat disorder)가 결과(a decreased rate of metabolism)를 초래하는 인과 구조를 만든다.</div><div class=\"lec-gr-item\">decreased rate (과거분사(형용사)): 과거분사 decreased가 뒤의 명사 rate를 수식한다. p.p. + N 구조로 &#39;p.p.된 N&#39; 혹은 &#39;감소된 비율&#39;이라는 상태를 나타낸다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">disorder</span> <span class=\"m\">질환, 장애</span></li><li><span class=\"w\">lack</span> <span class=\"m\">부족, 결핍</span></li><li><span class=\"w\">physical activity</span> <span class=\"m\">신체 활동</span></li><li><span class=\"w\">metabolism</span> <span class=\"m\">신진대사, 대사 작용</span></li><li><span class=\"w\">decrease</span> <span class=\"m\">감소하다, 줄어들다</span></li></ul>","<div class=\"lec-section-tag\">최종 정리</div>\n        <div class=\"lec-sum-body\"><div class=\"lec-sum-img\"><img src=\"data:image/png;base64,/9j/4AAQSkZJRgABAQEBLAEsAAD/6xeJSlAAAQAAAAEAABd/anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAF1lqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOjQ1ZjhiNWFmLTAwOTItY2ZkMy05YWRmLTQ1MDFlNjgxNjFjYgAAABMCanVtYgAAAChqdW1kYzJjcwARABCAAACqADibcQNjMnBhLnNpZ25hdHVyZQAAABLSY2JvctKEWQYrogEmGCGCWQM/MIIDOzCCAsCgAwIBAgIUAJ6vFWKBqUkCFltI/1ipbSSYHs4wCgYIKoZIzj0EAwMwUTELMAkGA1UEBhMCVVMxEzARBgNVBAoMCkdvb2dsZSBMTEMxLTArBgNVBAMMJEdvb2dsZSBDMlBBIE1lZGlhIFNlcnZpY2VzIDFQIElDQSBHMzAeFw0yNjAyMTcxNTE3MTJaFw0yNzAyMTIxNTE3MTFaMGsxCzAJBgNVBAYTAlVTMRMwEQYDVQQKEwpHb29nbGUgTExDMRwwGgYDVQQLExNHb29nbGUgU3lzdGVtIDYwMDMyMSkwJwYDVQQDEyBHb29nbGUgTWVkaWEgUHJvY2Vzc2luZyBTZXJ2aWNlczBZMBMGByqGSM49AgEGCCqGSM49AwEHA0IABLBjir7O78duFgwA85LMipPVJpwNGfPRe9uLhP2QbYYvWYLwkqIuwXGpMdIYJ5OtG6kKVtfi3xS50maSO0eJywCjggFaMIIBVjAOBgNVHQ8BAf8EBAMCBsAwHwYDVR0lBBgwFgYIKwYBBQUHAwQGCisGAQQBg+heAgEwDAYDVR0TAQH/BAIwADAdBgNVHQ4EFgQUkG/QOXwhnfJG44eVEH4Wr2aQ5O4wHwYDVR0jBBgwFoAU2nvhvbQsioXgENZrmsdK8frf9jcwbAYIKwYBBQUHAQEEYDBeMCYGCCsGAQUFBzABhhpodHRwOi8vYzJwYS1vY3NwLnBraS5nb29nLzA0BggrBgEFBQcwAoYoaHR0cDovL3BraS5nb29nL2MycGEvbWVkaWEtMXAtaWNhLWczLmNydDAXBgNVHSAEEDAOMAwGCisGAQQBg+heAQEwGQYJKwYBBAGD6F4DBAwGCisGAQQBg+heAwowMwYJKwYBBAGD6F4EBCYMJDAxOWMzNGQzLTczM2YtN2E0Ny1iOTE3LTUwZGQzOGY0MWVjZTAKBggqhkjOPQQDAwNpADBmAjEAk41aMTcCgSsA+aAKV0GYPGVAUzMSnab02y1JhvXYZraq9fLZxPw8G8NcdJnCEndyAjEAvrBQu9UmLza4dENTmz+o32xGSkRJXRQgjFfWVLanodD/bGcbObPJxEvCR0JMirQCWQLgMIIC3DCCAmOgAwIBAgIUQfqlIUd2IVjaf5ss/439Fgke7j4wCgYIKoZIzj0EAwMwQzELMAkGA1UEBhMCVVMxEzARBgNVBAoMCkdvb2dsZSBMTEMxHzAdBgNVBAMMFkdvb2dsZSBDMlBBIFJvb3QgQ0EgRzMwHhcNMjUwNTA4MjIzNjI2WhcNMzAwNTA4MjIzNjI2WjBRMQswCQYDVQQGEwJVUzETMBEGA1UECgwKR29vZ2xlIExMQzEtMCsGA1UEAwwkR29vZ2xlIEMyUEEgTWVkaWEgU2VydmljZXMgMVAgSUNBIEczMHYwEAYHKoZIzj0CAQYFK4EEACIDYgAEuCPlUxSiltqnB2lx2ES7FK+TVZWmAxRzzDjTzKZ8umoqyvCqSLOkZBrOiea
