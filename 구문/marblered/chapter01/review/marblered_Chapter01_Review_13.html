gin:6px 0 16px;line-height:1.45}.lec-hl{background:rgba(255,196,84,.22);box-shadow:0 0 26px 6px rgba(255,178,54,.36);border-radius:10px;transition:background .18s ease,box-shadow .18s ease}@media (max-width:680px){html,body{height:auto;min-height:100%}.stage{width:100vw;height:100vh;height:100dvh;margin:0;border-radius:0;box-shadow:none}.top{padding:9px 14px;font-size:13px}.slide{padding:16px 15px}.bar{padding:9px 11px;gap:7px}button{padding:8px 11px;font-size:13px}.cnt{font-size:12px}.lec-cover-title{font-size:21px;line-height:1.25}.lec-cover-title small{font-size:13.5px;margin-top:4px}.lec-cover-body,.lec-sum-body{flex-direction:column;gap:13px;align-items:stretch}.lec-cover-img,.lec-sum-img{flex:0 0 auto;width:100%;max-width:100%;max-height:30vh;align-self:auto}.lec-flow{overflow:visible}.lec-stage{padding:9px 12px;margin-bottom:7px}.lec-stage-head{font-size:14px}.lec-stage ul{font-size:13px;padding-left:16px;line-height:1.5}.lec-sent-no{font-size:12.5px;margin-bottom:6px}.lec-chunks{gap:13px 12px;margin-bottom:12px}.lec-chunk .en{font-size:18px;line-height:1.3}.lec-chunk .ko{font-size:12.5px}.lec-sent-en{font-size:18px;line-height:1.35;margin-bottom:9px}.lec-sent-ko{font-size:13.5px;margin-bottom:9px}.lec-grammar,.lec-grammar.lec-meaning{font-size:13.5px;padding:8px 11px}.lec-voca-list{columns:1;margin-top:8px}.lec-voca-list li{font-size:14px;line-height:1.45}.lec-section-tag{font-size:12px;margin-bottom:8px}.lec-summary-bullets{font-size:15px;line-height:1.6}.lec-summary-line{font-size:16px;margin:5px 0 12px}}</style></head><body><div class="stage"><div class="top">AI 강의</div><div class="slide" id="s"></div><div class="bar"><div class="tl" id="tl"><i id="fill"></i></div><span class="cnt" id="c"></span><select id="rate" title="재생 속도" style="background:#2b2820;color:#f4f1ea;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:8px 8px;font-weight:700;cursor:pointer;"><option value="1">1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="1.8">1.8x</option><option value="2">2.0x</option></select><button onclick="go(-1)">◀</button><button class="pl" id="pp" onclick="toggle()">▶ 재생</button><button onclick="go(1)">▶</button></div></div><script>var D={"slides":["<div class=\"lec-cover-title\">The Golden Rule of Science: Peer Review Before Publicity<small>과학의 황금률: 대중 공표 전 전문가의 검증</small></div>\n        <div class=\"lec-cover-body\"><div class=\"lec-flow\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01발견의 대중 발표</div><ul><li>과학자가 자신의 연구 성과를 공식적인 검토 없이 언론에 먼저 공개하는 상황이다.</li><li>기자 회견(press conference)을 통한 성급한 공개</li><li>이른바 새로운 발견(so-called discovery)에 대한 일방적 주장</li><li>핵심 키워드: 발표하다(announce)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02필수 검증 절차의 누락</div><ul><li>과학계의 정당한 절차인 동료 전문가들의 사전 검토 과정이 생략되었다.</li><li>전문가 검토자(expert reviewers)의 확인 절차 부재</li><li>주장의 타당성을 조사(examine)할 기회 미비</li><li>핵심 키워드: 허용하다(permitting)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03과학계의 부정적 평가</div><ul><li>절차를 무시한 과학자는 학술적 진실성보다 개인적 명성을 쫓는 것으로 간주된다.</li><li>대중의 관심을 갈구하는 홍보 추구자(publicity seeker)로 낙인찍힘</li><li>과학 공동체로부터 자동으로 비난(castigated)받음</li><li>핵심 키워드: 과학자(scientist)</li></ul></div></div></div>","<div class=\"lec-section-tag\">단어 정리</div><ul class=\"lec-voca-list\"><li><span class=\"w\">announce</span> <span class=\"m\">발표하다, 알리다</span></li><li><span class=\"w\">so-called</span> <span class=\"m\">소위, 이른바</span></li><li><span class=\"w\">press conference</span> <span class=\"m\">기자 회견</span></li><li><span class=\"w\">permit</span> <span class=\"m\">허락하다, 허용하다</span></li><li><span class=\"w\">examine</span> <span class=\"m\">검토하다, 조사하다</span></li><li><span class=\"w\">claim</span> <span class=\"m\">주장</span></li><li><span class=\"w\">castigate</span> <span class=\"m\">혹평하다, 비난하다</span></li><li><span class=\"w\">publicity seeker</span> <span class=\"m\">세간의 주목을 받고 싶어 하는 사람</span></li></ul>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 과학자든</span><span class=\"en\"><b>Any scientist</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소위 발견이라는 것을 발표하는</span><span class=\"en\"><b><span class=\"grammar-hl\">who announces</span> a so-called discovery</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기자 회견에서</span><span class=\"en\"><b>at a press conference</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먼저 허용하지 않고</span><span class=\"en\"><b>without first <span class=\"grammar-hl\">permitting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전문 검토자들이</span><span class=\"en\"><b><span class=\"grammar-hl\">expert reviewers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사람의 주장을 검토하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to examine</span> his or her claims</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자동적으로 혹평된다</span><span class=\"en\"><b><span class=\"grammar-hl\">is automatically castigated</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">명성을 쫓는 사람이라고.</span><span class=\"en\"><b>as a publicity seeker.</b></span></div></div><div class=\"lec-sent-ko\">먼저 전문 검토자들이 그 사람의 주장을 검토하도록 허용하지 않고 기자 회견에서 소위 발견을 발표하는 과학자는 누구든지 명성을 쫓는 사람이라고 자동적으로 혹평된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 과학계에서 연구 결과를 발표할 때 반드시 지켜야 하는 엄격한 절차와 윤리를 다루고 있습니다. 과학적 성취는 대중에게 공개되기 전, 같은 분야의 전문가들로부터 객관적인 검증(Peer Review)을 받는 것이 필수적인 관례입니다. 만약 이 과정을 무시하고 곧바로 언론(기자 회견)에 알리는 행위를 한다면, 그 연구의 진실성을 떠나 해당 과학자는 학문적 성과보다는 개인의 유명세를 얻으려는 파렴치한 인물로 낙인찍히게 된다는 경고의 메시지를 담고 있습니다. 단일 문장이지만, 과학계의 &#39;내부 검증&#39;과 &#39;대중적 홍보&#39; 사이의 우선순위를 명확히 설정하며 학문의 엄중함을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who announces (관계대명사): 주격 관계대명사 who가 이끄는 관계사절이 선행사 Any scientist를 수식하는 구조다.</div><div class=\"lec-gr-item\">permitting (동명사): 전치사 without의 목적어 역할을 하는 명사적 성격으로 쓰였다.</div><div class=\"lec-gr-item\">permitting expert reviewers to examine 5형식(SVOC) 구조: permit은 타동사로 permit + O(expert reviewers) + OC(to examine) 구조를 취하여 &#39;목적어가 ~하는 것을 허용하다&#39;라는 의미를 만든다.</div><div class=\"lec-gr-item\">to examine (to부정사): 5형식 동사 permit의 목적격 보어로 쓰인 명사적 용법의 부정사다.</div><div class=\"lec-gr-item\">is automatically castigated (수동태): be동사(is)+p.p.(castigated) 구조. castigate는 타동사인데 뒤에 목적어가 없어서 수동구조 is castigated 형태로 쓴다. 기본구조: castigate A as B (A를 B라고 비난하다/혹평하다)</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">announce</span> <span class=\"m\">발표하다, 알리다</span></li><li><span class=\"w\">so-called</span> <span class=\"m\">소위, 이른바</span></li><li><span class=\"w\">press conference</span> <span class=\"m\">기자 회견</span></li><li><span class=\"w\">permit</span> <span class=\"m\">허락하다, 허용하다</span></li><li><span class=\"w\">examine</span> <span class=\"m\">검토하다, 조사하다</span></li><li><span class=\"w\">claim</span> <span class=\"m\">주장</span></li><li><span class=\"w\">castigate</span> <span class=\"m\">혹평하다, 비난하다</span></li><li><span class=\"w\">publicity seeker</span> <span class=\"m\">세간의 주목을 받고 싶어 하는 사람</span></li></ul>","<div class=\"lec-section-tag\">최종 정리</div>\n        <div class=\"lec-sum-body\">\n          <div class=\"lec-sum-text\">\n            <div class=\"lec-sent-en\">Scientists should undergo expert examination before announcing discoveries because bypasssing this process leads to being criticized as a publicity seeker.</div>\n            <div class=\"lec-summary-line\">과학적 발견을 발표하기 전 전문가의 검토를 거쳐야 하는데, 이 과정을 건너뛰는 것은 명성만을 쫓는다는 비판을 초래하기 때문이다.</div>\n            \n          </div>\n        </div>"],"segs":[[{"audio":"audio/marblered_Chapter01_Review_13_001.mp3","hl":null},{"audio":"audio/marblered_Chapter01_Review_13_002.mp3","hl":"stage-0"},{"audio":"audio/marblered_Chapter01_Review_13_003.mp3","hl":"stage-1"},{"audio":"audio/marblered_Chapter01_Review_13_004.mp3","hl":"stage-2"}],[{"audio":"audio/marblered_Chapter01_Review_13_005.mp3","hl":null}],[{"audio":"audio/marblered_Chapter01_Review_13_006.mp3","hl":"main"},{"audio":"audio/marblered_Chapter01_Review_13_007.mp3","hl":"meaning"},{"audio":"audio/marblered_Chapter01_Review_13_008.mp3","hl":"grammar"}],[{"audio":"audio/marblered_Chapter01_Review_13_009.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");try{el.scrollIntoView({block:"nearest"});}catch(_){}}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
