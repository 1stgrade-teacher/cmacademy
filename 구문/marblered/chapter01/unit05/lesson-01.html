  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};

  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"unit05","title":"마법같은 블록구문 실전편 Unit 05 주어 + 형용사절 1","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>마법같은 블록구문 실전편 Unit 05 주어 + 형용사절 1\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>주어를 수식하는 형용사절을 블록으로 묶어 문장의 본동사를 정확히 찾아낸다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요. 오늘은 마법같은 블록구문 실전편, 주어와 형용사절 첫 번째 시간입니다. 여러분, 영어 문장에서 주어가 길어지면 동사를 찾기가 어렵죠? 오늘은 주어 뒤에 who나 which 같은 관계사가 붙어 길어진 문장을 블록으로 묶어 읽는 연습을 해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">주어 뒤에 \u003cb class=\"key\">who/which/that\u003c/b> 또는 \u003cb class=\"key\">when/where/why/that\u003c/b>이 이끄는 형용사절이 붙으면 그 덩어리를 주어 수식 블록으로 묶는다. 이 블록 전체가 주어의 일부이므로 문장의 진짜 동사와 혼동하지 않고 \u003cb class=\"key\">주어 + 동사 + 목적어/보어\u003c/b>의 뼈대를 찾는다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">Species which have not been able to survive in changing living conditions\u003c/span> have become extinct.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">The reason why we have two ears and only one mouth\u003c/span> is that we may listen more and talk less.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 \u003cspan class=\"fx\">The creativity that children possess\u003c/span> needs to be cultivated throughout their development.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 \u003cspan class=\"fx\">A person who works on an assembly line\u003c/span> is well aware of the efficiency that can be gained through repetition.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">The one area where the Internet could be considered to be an aid to thinking\u003c/span> is the rapid procurement of new information.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">People who have a high sense of self-efficacy\u003c/span> tend to pursue challenging goals that may be outside the reach of the average person.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 \u003cspan class=\"fx\">The idealism that freed men from most of their ancient fetters\u003c/span> awakened women to a realization of their unequal position in society.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">A classroom where students feel involved and respected\u003c/span> will reduce discipline issues, increase student motivation, and ultimately enhance learning.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">The way that we behave in a given situation\u003c/span> is often influenced by how important one value is to us relative to others.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">Someone who reads only newspapers and books by contemporary authors\u003c/span> looks to me like a near-sighted person.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">The impressions that a child receives from his environment during the first years of life\u003c/span> influence his intellectual development and character very basically.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">The period when humans began growing crops, raising animals for food, and using stone-tool technology\u003c/span> is referred to as the Neolithic period.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"주어가 길어지면 막막하죠? 오늘 핵심은 주어를 수식하는 형용사절을 하나의 블록으로 묶는 겁니다. who, which, that처럼 관계대명사가 오거나 when, where, why처럼 관계부사가 오면 그 뒤는 주어를 꾸며 주는 블록이에요. 이 블록을 묶고 나면 진짜 문장의 동사가 보입니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">Species which have not been able to survive in changing living conditions\u003c/span> have become extinct.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Species\u003c/div>\u003cdiv class=\"k\">종들은\u003c/div>\u003cdiv class=\"e\">which have not been able to survive\u003c/div>\u003cdiv class=\"k\">[생존할 수 없었던]\u003c/div>\u003cdiv class=\"e\">in changing living conditions\u003c/div>\u003cdiv class=\"k\">[변화하는 생활 환경에서]\u003c/div>\u003cdiv class=\"e\">have become extinct\u003c/div>\u003cdiv class=\"k\">[멸종되어 왔다]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 Species는 관계대명사 \u003cb class=\"key\">which\u003c/b>가 이끄는 형용사절 which have not been able to survive in changing living conditions의 수식을 받는다. \u003cb class=\"key\">have become\u003c/b>은 문장의 본동사이다.\u003c/div>","segs":[{"n":3,"text":"Species, 종들은. which have not been able to survive, [생존할 수 없었던]. in changing living conditions, [변화하는 생활 환경에서]. have become extinct, [멸종되어 왔다]","hl":"ch"},{"n":4,"text":"첫 번째 문장은 주어 Species 뒤에 which가 이끄는 형용사절이 붙어 있습니다. which have not been able to survive in changing living conditions 전체가 Species를 꾸며 주는 블록이에요. 이 블록을 묶고 나면 뒤에 have become extinct가 본동사라는 게 바로 보입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">Species which have not been able to survive in changing living conditions\u003c/span> have become extinct.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>변화하는 생활 환경에서 생존하지 못한 종들은 멸종되어 왔다는 뜻이다. 환경 변화에 적응하지 못한 생물은 사라질 수밖에 없다는 진화적 사실을 담고 있다. have not been able to survive는 과거부터 지금까지 생존할 수 없었음을 나타내는 완료형 표현이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have not been able to survive\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have failed to survive\u003c/span>\u003cdiv class=\"w\">실패했다는 뉘앙스를 더 강하게 전달한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have become extinct\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have died out\u003c/span>\u003cdiv class=\"w\">die out은 멸종되다라는 뜻의 구동사로 더 구어적이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">survive\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">remain alive\u003c/span>\u003cspan class=\"y-eq\">survive = remain alive\u003c/span>\u003cdiv class=\"w\">생존하다를 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">changing living conditions\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">changing environments\u003c/span>\u003cspan class=\"y-eq\">living conditions = environments\u003c/span>\u003cdiv class=\"w\">생활 환경을 더 간단히 environment로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">extinct\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">no longer existing\u003c/span>\u003cspan class=\"y-eq\">extinct = no longer existing\u003c/span>\u003cdiv class=\"w\">멸종된 뜻을 풀어서 표현한 것이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Species that could not survive in changing environments have died out.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"변화하는 생활 환경에서 생존하지 못한 종들은 결국 멸종해 왔다는 뜻입니다. 환경이 바뀌는데 적응하지 못하면 살아남기 어렵다는 진화의 원리를 담고 있어요. have not been able to survive처럼 완료형을 써서 지금까지의 결과를 강조한 표현이에요.","hl":"mn"},{"n":6,"text":"have not been able to survive는 have failed to survive로 바꾸면 실패했다는 늬앙스가 더 강해요. have become extinct 대신 have died out을 쓰면 더 구어적이고 간결하게 멸종을 표현할 수 있습니다.","hl":"rw"},{"n":7,"text":"survive는 remain alive로 풀어 쓸 수 있고, living conditions는 environments로 바꿔 말할 수 있습니다. extinct는 no longer existing과 같은 뜻이에요. 모두 시험에 자주 나오는 표현이니 함께 외워 두세요.","hl":"ph"},{"n":8,"text":"전체 문장을 바꿔 말하면 Species that could not survive in changing environments have died out. 이 문장은 원문과 같은 의미로, 생존하지 못한 종들이 멸종했다는 내용을 더 짧은 표현으로 전달합니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">The reason why we have two ears and only one mouth\u003c/span> is that we may listen more and talk less.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The reason\u003c/div>\u003cdiv class=\"k\">이유는\u003c/div>\u003cdiv class=\"e\">why we have two ears and only one mouth\u003c/div>\u003cdiv class=\"k\">[우리가 두 개의 귀와 오직 하나의 입을 가지고 있는]\u003c/div>\u003cdiv class=\"e\">is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">that we may listen more and talk less\u003c/div>\u003cdiv class=\"k\">[우리가 더 많이 듣고 더 적게 말하려는 것]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The reason은 관계부사 \u003cb class=\"key\">why\u003c/b>가 이끄는 형용사절 why we have two ears and only one mouth의 수식을 받는다. \u003cb class=\"key\">is\u003c/b>가 본동사이고, that절은 주격 보어 역할을 하는 명사절이다.\u003c/div>","segs":[{"n":9,"text":"The reason, 이유는. why we have two ears and only one mouth, [우리가 두 개의 귀와 오직 하나의 입을 가지고 있는]. is, ~이다. that we may listen more and talk less, [우리가 더 많이 듣고 더 적게 말하려는 것]","hl":"ch"},{"n":10,"text":"두 번째 문장은 주어 The reason 뒤에 관계부사 why가 붙어서 그 이유가 무엇인지 꾸며 주고 있어요. why we have two ears and only one mouth 전체가 주어 블록입니다. 이 블록을 묶으면 진짜 동사 is가 보이고, 뒤에 that절이 보어로 연결됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 \u003cspan class=\"fx\">The reason why we have two ears and only one mouth\u003c/span> is that we may listen more and talk less.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>귀가 두 개이고 입이 하나인 이유는 더 많이 듣고 더 적게 말하기 위해서라는 뜻이다. 말을 많이 하기보다 상대의 말을 잘 들으라는 격언이다. may는 가능성을 나타내어 그렇게 하기 위한 것이라는 의미를 부드럽게 전달한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">only one mouth\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">just one mouth\u003c/span>\u003cdiv class=\"w\">only와 just는 모두 오직이라는 뜻으로 뉘앙스가 거의 같다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">may listen more and talk less\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">should listen more and talk less\u003c/span>\u003cdiv class=\"w\">should로 바꾸면 더 당위적인 느낌을 준다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The reason why\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The reason that\u003c/span>\u003cspan class=\"y-eq\">The reason why = The reason that\u003c/span>\u003cdiv class=\"w\">why를 that으로 바꾸어도 같은 이유를 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">only one\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">just one\u003c/span>\u003cspan class=\"y-eq\">only one = just one\u003c/span>\u003cdiv class=\"w\">only와 just는 같은 뜻의 부사이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">listen more and talk less\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">listen rather than talk\u003c/span>\u003cspan class=\"y-eq\">listen more and talk less = listen rather than talk\u003c/span>\u003cdiv class=\"w\">더 많이 듣고 더 적게 말하라는 뜻을 간결하게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We have two ears and only one mouth so that we can listen more and talk less.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"귀가 두 개이고 입은 하나뿐인 이유는 더 많이 듣고 더 적게 말하기 위해서라는 뜻이에요. 말을 많이 하기보다 상대의 말을 잘 들으라는 격언이죠. may는 가능성을 나타내서 그렇게 하기 위한 것이라는 의미를 부드럽게 전달합니다.","hl":"mn"},{"n":12,"text":"only one mouth는 just one mouth로 바꿔 쓸 수 있고, may listen more and talk less는 should listen more and talk less로 바꾸면 당위적인 느낌이 강해집니다.","hl":"rw"},{"n":13,"text":"The reason why는 why를 생략하거나 that으로 바꿔 쓸 수 있어요. only one은 just one으로 바꾸면 뜻이 같고, listen more and talk less는 listen rather than talk처럼 간결하게 표현할 수 있습니다.","hl":"ph"},{"n":14,"text":"전체를 바꿔 말하면 We have two ears and only one mouth so that we can listen more and talk less. 이렇게 바꾸면 이유를 나타내는 부사절로 표현하면서도 원문과 같은 교훈을 전달합니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 \u003cspan class=\"fx\">The creativity that children possess\u003c/span> needs to be cultivated throughout their development.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The creativity\u003c/div>\u003cdiv class=\"k\">창의성은\u003c/div>\u003cdiv class=\"e\">that children possess\u003c/div>\u003cdiv class=\"k\">[아이들이 지닌]\u003c/div>\u003cdiv class=\"e\">needs\u003c/div>\u003cdiv class=\"k\">필요가 있다\u003c/div>\u003cdiv class=\"e\">to be cultivated\u003c/div>\u003cdiv class=\"k\">[계발될]\u003c/div>\u003cdiv class=\"e\">throughout their development\u003c/div>\u003cdiv class=\"k\">[그들의 성장 과정 동안]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The creativity는 관계대명사 \u003cb class=\"key\">that\u003c/b>이 이끄는 형용사절 that children possess의 수식을 받는다. \u003cb class=\"key\">needs\u003c/b>가 본동사이고, to be cultivated는 수동의 to부정사이다.\u003c/div>","segs":[{"n":15,"text":"The creativity, 창의성은. that children possess, [아이들이 지닌]. needs, 필요가 있다. to be cultivated, [계발될]. throughout their development, [그들의 성장 과정 동안]","hl":"ch"},{"n":16,"text":"세 번째 문장은 주어 The creativity 뒤에 that children possess가 붙어서 아이들이 지닌 창의성을 꾸며 줍니다. that은 creativity를 대신하는 목적격 관계대명사이고, possess는 소유하다라는 뜻이에요. 이 블록을 묶으면 needs가 본동사로 보이고 to be cultivated는 수동태로 계발되다는 의미입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 \u003cspan class=\"fx\">The creativity that children possess\u003c/span> needs to be cultivated throughout their development.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>아이들이 가진 창의성은 그들의 성장 과정 내내 계발되어야 한다는 뜻이다. 창의성은 그냥 두는 것이 아니라 교육과 경험을 통해 계속 키워 나가야 할 대상이다. to be cultivated는 창의성이 계발되는 대상임을 분명히 보여 준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">needs to be cultivated\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has to be developed\u003c/span>\u003cdiv class=\"w\">has to는 의무의 뉘앙스를 더 강하게 준다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">throughout their development\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as they grow\u003c/span>\u003cdiv class=\"w\">성장하는 동안을 부사절로 더 자연스럽게 전환했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">possess\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have\u003c/span>\u003cspan class=\"y-eq\">possess = have\u003c/span>\u003cdiv class=\"w\">소유하다를 가장 간단한 동사로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cultivated\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">developed\u003c/span>\u003cspan class=\"y-eq\">cultivate = develop\u003c/span>\u003cdiv class=\"w\">계발하다와 발달시키다는 같은 맥락에서 쓰인다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">throughout\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">during\u003c/span>\u003cspan class=\"y-eq\">throughout = during\u003c/span>\u003cdiv class=\"w\">전체 기간 동안이라는 뜻을 유지한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The creativity children have must be developed as they grow.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"아이들이 가지고 있는 창의성은 성장 과정 내내 계발될 필요가 있다는 뜻이에요. 창의성을 그냥 두는 것이 아니라 교육과 경험을 통해 계속 키워 나가야 한다는 메시지입니다. to be cultivated는 수동태라서 창의성이 계발되는 대상이라는 점을 분명히 보여 줍니다.","hl":"mn"},{"n":18,"text":"needs to be cultivated는 has to be developed로 바꾸면 의무의 느낌이 더 강해요. throughout their development는 as they grow로 바꾸면 성장하면서라는 자연스러운 부사절이 됩니다.","hl":"rw"},{"n":19,"text":"possess는 have로 바꿔 쓸 수 있고, cultivate는 develop과 같은 뜻이에요. throughout은 during으로 바꿔도 전체 기간 동안이라는 의미가 유지됩니다.","hl":"ph"},{"n":20,"text":"전체 문장은 The creativity children have must be developed as they grow. 이렇게 바꿔 말할 수 있습니다. 같은 내용을 더 짧고 간결하게 표현한 거예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 \u003cspan class=\"fx\">A person who works on an assembly line\u003c/span> is well aware of the efficiency that can be gained through repetition.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A person\u003c/div>\u003cdiv class=\"k\">사람은\u003c/div>\u003cdiv class=\"e\">who works on an assembly line\u003c/div>\u003cdiv class=\"k\">[조립 라인에서 일하는]\u003c/div>\u003cdiv class=\"e\">is well aware of\u003c/div>\u003cdiv class=\"k\">잘 알고 있다\u003c/div>\u003cdiv class=\"e\">the efficiency\u003c/div>\u003cdiv class=\"k\">효율성에 대해\u003c/div>\u003cdiv class=\"e\">that can be gained through repetition\u003c/div>\u003cdiv class=\"k\">[반복을 통해 얻어질 수 있는]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 A person은 관계대명사 \u003cb class=\"key\">who\u003c/b>가 이끄는 형용사절 who works on an assembly line의 수식을 받는다. \u003cb class=\"key\">is\u003c/b>가 본동사이고, the efficiency를 수식하는 that절이 목적어 내부에 포함되어 있다.\u003c/div>","segs":[{"n":21,"text":"A person, 사람은. who works on an assembly line, [조립 라인에서 일하는]. is well aware of, 잘 알고 있다. the efficiency, 효율성에 대해. that can be gained through repetition, [반복을 통해 얻어질 수 있는]","hl":"ch"},{"n":22,"text":"네 번째 문장에는 형용사절이 두 개 나옵니다. 먼저 주어 A person을 who works on an assembly line이 꾸며 주고, 뒤의 the efficiency를 that can be gained through repetition이 꾸며 줍니다. 앞쪽 블록만 묶어도 주어가 누군지 바로 보이고, is well aware of가 본동사라는 것이 드러나요. 뒤에 나오는 that절은 목적어 efficiency를 수식하는 형용사절입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 \u003cspan class=\"fx\">A person who works on an assembly line\u003c/span> is well aware of the efficiency that can be gained through repetition.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>조립 라인에서 일하는 사람은 반복을 통해 얻을 수 있는 효율성을 잘 알고 있다는 뜻이다. 같은 작업을 반복하면 익숙해져서 더 빠르고 정확해진다는 것을 직접 경험한다는 의미이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is well aware of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">knows well\u003c/span>\u003cdiv class=\"w\">잘 알고 있다는 뜻을 더 간결하게 표현한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">that can be gained through repetition\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">that repetition can produce\u003c/span>\u003cdiv class=\"w\">수동태를 능동태로 바꾸어 의미를 더 직접적으로 전달한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">assembly line\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">production line\u003c/span>\u003cspan class=\"y-eq\">assembly line = production line\u003c/span>\u003cdiv class=\"w\">조립 라인과 생산 라인은 같은 작업 공정을 가리킨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be aware of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">know about\u003c/span>\u003cspan class=\"y-eq\">be aware of = know about\u003c/span>\u003cdiv class=\"w\">~을 알다라는 뜻을 유지하며 더 쉬운 표현으로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">gained\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">obtained\u003c/span>\u003cspan class=\"y-eq\">gain = obtain\u003c/span>\u003cdiv class=\"w\">얻다는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A person who works on an assembly line is fully aware of the efficiency that repetition can produce.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"조립 라인에서 일하는 사람은 반복을 통해 얻을 수 있는 효율성을 잘 알고 있다는 뜻입니다. 같은 작업을 반복하면 익숙해져서 더 빠르고 정확해진다는 것을 직접 경험하기 때문이에요. be well aware of는 단순히 아는 것을 넘어서 잘 알고 있다는 의미입니다.","hl":"mn"},{"n":24,"text":"is well aware of는 knows well로 바꿔 말할 수 있고, that can be gained through repetition은 that repetition can produce처럼 능동태로 바꿔도 자연스럽습니다.","hl":"rw"},{"n":25,"text":"assembly line은 production line으로 바꿔 쓸 수 있고, be aware of는 know about과 뜻이 같아요. gain은 obtain으로 바꿔도 얻다는 의미가 유지됩니다.","hl":"ph"},{"n":26,"text":"전체 문장을 바꿔 말하면 A person who works on an assembly line is fully aware of the efficiency that repetition can produce. 이 문장은 수동태를 능동태로 바꾸고 어휘를 조금 바꾼 것일 뿐 원문과 의미가 같습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 \u003cspan class=\"fx\">The one area where the Internet could be considered to be an aid to thinking\u003c/span> is the rapid procurement of new information.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The one area\u003c/div>\u003cdiv class=\"k\">하나의 영역은\u003c/div>\u003cdiv class=\"e\">where the Internet could be considered\u003c/div>\u003cdiv class=\"k\">[인터넷이 여겨질 수 있는]\u003c/div>\u003cdiv class=\"e\">to be an aid to thinking\u003c/div>\u003cdiv class=\"k\">[사고에 도움이 된다고]\u003c/div>\u003cdiv class=\"e\">is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">the rapid procurement of new information\u003c/div>\u003cdiv class=\"k\">새로운 정보의 신속한 입수이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The one area는 관계부사 \u003cb class=\"key\">where\u003c/b>가 이끄는 형용사절 where the Internet could be considered to be an aid to thinking의 수식을 받는다. \u003cb class=\"key\">is\u003c/b>가 본동사이고, to be an aid to thinking은 consider A to be B의 수동형에서 주격 보어 역할을 한다.\u003c/div>","segs":[{"n":27,"text":"The one area, 하나의 영역은. where the Internet could be considered, [인터넷이 여겨질 수 있는]. to be an aid to thinking, [사고에 도움이 된다고]. is, ~이다. the rapid procurement of new information, 새로운 정보의 신속한 입수이다","hl":"ch"},{"n":28,"text":"다섯 번째 문장의 주어는 The one area이고, 그 뒤에 where절이 붙어 인터넷이 사고에 도움이 된다고 여겨질 수 있는 영역을 꾸며 줍니다. consider A to be B가 수동태로 쓰여 could be considered to be an aid to thinking이 된 것이고, 이 전체가 주어 블록입니다. 블록을 묶으면 본동사 is가 보이고 보어는 the rapid procurement of new information입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 \u003cspan class=\"fx\">The one area where the Internet could be considered to be an aid to thinking\u003c/span> is the rapid procurement of new information.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인터넷이 사고에 도움이 된다고 여겨질 수 있는 유일한 영역은 새로운 정보를 빠르게 입수하는 것이다. 인터넷이 생각의 질을 높여 주는 것은 주로 정보 접근 속도라는 의미이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">could be considered to be\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can be regarded as\u003c/span>\u003cdiv class=\"w\">여겨질 수 있다는 뜻을 더 간결하게 바꾼 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the rapid procurement of new information\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">getting new information quickly\u003c/span>\u003cdiv class=\"w\">명사구를 동명사구로 바꾸어 더 자연스럽게 풀어 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">aid\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">help\u003c/span>\u003cspan class=\"y-eq\">aid = help\u003c/span>\u003cdiv class=\"w\">도움이라는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">procurement\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">acquisition\u003c/span>\u003cspan class=\"y-eq\">procurement = acquisition\u003c/span>\u003cdiv class=\"w\">입수와 획득은 같은 의미로 쓰인다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">considered to be\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regarded as\u003c/span>\u003cspan class=\"y-eq\">considered to be = regarded as\u003c/span>\u003cdiv class=\"w\">~라고 여겨지다는 뜻을 유지하는 동의 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The one area where the Internet can be regarded as helpful to thinking is the rapid acquisition of new information.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"인터넷이 사고에 도움이 된다고 볼 수 있는 단 하나의 영역은 새로운 정보를 신속하게 입수하는 것이라는 뜻입니다. 생각을 깊게 하는 데는 한계가 있지만 정보를 빨리 가져오는 데는 확실히 도움이 된다는 거죠. aid to thinking에서 to는 전치사라서 뒤에 동명사 thinking이 쓰였습니다.","hl":"mn"},{"n":30,"text":"could be considered to be는 can be regarded as로 바꿔 쓰면 더 간결해지고, the rapid procurement of new information은 getting new information quickly처럼 동명사구로 풀어 쓸 수 있습니다.","hl":"rw"},{"n":31,"text":"aid는 help와 같은 뜻이고, procurement는 acquisition으로 바꿔 쓸 수 있어요. considered to be는 regarded as로 바꾸면 여겨지다는 의미가 그대로 유지됩니다.","hl":"ph"},{"n":32,"text":"전체 문장은 The one area where the Internet can be regarded as helpful to thinking is the rapid acquisition of new information. 이렇게 바꿔 말할 수 있습니다. 어휘만 바꿨을 뿐 의미는 같습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 \u003cspan class=\"fx\">People who have a high sense of self-efficacy\u003c/span> tend to pursue challenging goals that may be outside the reach of the average person.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">People\u003c/div>\u003cdiv class=\"k\">사람들은\u003c/div>\u003cdiv class=\"e\">who have a high sense of self-efficacy\u003c/div>\u003cdiv class=\"k\">[높은 자기 효능감을 가진]\u003c/div>\u003cdiv class=\"e\">tend to pursue\u003c/div>\u003cdiv class=\"k\">추구하는 경향이 있다\u003c/div>\u003cdiv class=\"e\">challenging goals\u003c/div>\u003cdiv class=\"k\">도전적인 목표를\u003c/div>\u003cdiv class=\"e\">that may be outside the reach of the average person\u003c/div>\u003cdiv class=\"k\">[아마 보통 사람의 도달 범위를 벗어나 있을]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 People은 관계대명사 \u003cb class=\"key\">who\u003c/b>가 이끄는 형용사절 who have a high sense of self-efficacy의 수식을 받는다. \u003cb class=\"key\">tend\u003c/b>가 본동사이고, that절은 goals를 수식하는 형용사절이다.\u003c/div>","segs":[{"n":33,"text":"People, 사람들은. who have a high sense of self-efficacy, [높은 자기 효능감을 가진]. tend to pursue, 추구하는 경향이 있다. challenging goals, 도전적인 목표를. that may be outside the reach of the average person, [아마 보통 사람의 도달 범위를 벗어나 있을]","hl":"ch"},{"n":34,"text":"여섯 번째 문장은 주어 People을 who have a high sense of self-efficacy가 꾸며 줍니다. 주어 블록을 묶고 나면 tend to pursue가 본동사로 보이죠. 그 뒤에 goals를 꾸미는 that절이 또 나오는데, 이 that절은 목적어 goals를 수식하는 형용사절입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 \u003cspan class=\"fx\">People who have a high sense of self-efficacy\u003c/span> tend to pursue challenging goals that may be outside the reach of the average person.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자기 효능감이 높은 사람들은 보통 사람이 도달하기 어려운 도전적인 목표를 추구하는 경향이 있다. 자신의 능력을 믿는 사람일수록 더 높은 목표에 도전한다는 의미이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">who have a high sense of self-efficacy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who strongly believe in their own abilities\u003c/span>\u003cdiv class=\"w\">자기 효능감을 자신의 능력에 대한 믿음으로 풀어 썼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">outside the reach of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">beyond the reach of\u003c/span>\u003cdiv class=\"w\">beyond를 쓰면 범위를 벗어난 느낌이 더 강해진다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">self-efficacy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">belief in one's own ability\u003c/span>\u003cspan class=\"y-eq\">self-efficacy = belief in one's own ability\u003c/span>\u003cdiv class=\"w\">자기 효능감을 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pursue\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">seek\u003c/span>\u003cspan class=\"y-eq\">pursue = seek\u003c/span>\u003cdiv class=\"w\">추구하다와 찾다는 같은 목표 지향적 의미를 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">outside the reach of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">beyond the reach of\u003c/span>\u003cspan class=\"y-eq\">outside the reach of = beyond the reach of\u003c/span>\u003cdiv class=\"w\">범위 밖이라는 뜻을 유지하며 뉘앙스를 강화했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">People with high self-efficacy tend to seek challenging goals that may be beyond the average person's reach.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"자기 효능감이 높은 사람들은 보통 사람이 도달하기 어려운 도전적인 목표를 추구하는 경향이 있다는 뜻입니다. 자기 효능감이란 자신의 능력에 대한 믿음인데, 그 믿음이 강할수록 더 어려운 목표에 도전한다는 거예요. outside the reach of는 손이 닿지 않는 범위 밖이라는 이미지입니다.","hl":"mn"},{"n":36,"text":"who have a high sense of self-efficacy는 who strongly believe in their own abilities로 풀어 쓸 수 있습니다. outside the reach of는 beyond the reach of로 바꾸면 정도가 더 강한 느낌이 들어요.","hl":"rw"},{"n":37,"text":"self-efficacy는 belief in one's own ability로 풀어 쓸 수 있고, pursue는 seek이나 go after로 바꿀 수 있어요. outside the reach of는 beyond the reach of와 같은 뜻입니다.","hl":"ph"},{"n":38,"text":"전체 문장은 People with high self-efficacy tend to seek challenging goals that may be beyond the average person's reach. 이렇게 바꿔 말할 수 있어요. 형용사절을 전치사구로 줄이고 어휘를 바꾼 것뿐입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 \u003cspan class=\"fx\">The idealism that freed men from most of their ancient fetters\u003c/span> awakened women to a realization of their unequal position in society.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The idealism\u003c/div>\u003cdiv class=\"k\">이상주의는\u003c/div>\u003cdiv class=\"e\">that freed men\u003c/div>\u003cdiv class=\"k\">[남성들을 자유롭게 만든]\u003c/div>\u003cdiv class=\"e\">from most of their ancient fetters\u003c/div>\u003cdiv class=\"k\">[고대의 속박 대부분으로부터]\u003c/div>\u003cdiv class=\"e\">awakened women\u003c/div>\u003cdiv class=\"k\">여성들을 일깨웠다\u003c/div>\u003cdiv class=\"e\">to a realization\u003c/div>\u003cdiv class=\"k\">자각하도록\u003c/div>\u003cdiv class=\"e\">of their unequal position in society\u003c/div>\u003cdiv class=\"k\">[사회에서 그들의 불평등한 위치를]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The idealism은 관계대명사 \u003cb class=\"key\">that\u003c/b>이 이끄는 형용사절 that freed men from most of their ancient fetters의 수식을 받는다. \u003cb class=\"key\">awakened\u003c/b>가 본동사이고, awaken A to B 구문이 A에게 B를 일깨우다로 쓰였다.\u003c/div>","segs":[{"n":39,"text":"The idealism, 이상주의는. that freed men, [남성들을 자유롭게 만든]. from most of their ancient fetters, [고대의 속박 대부분으로부터]. awakened women, 여성들을 일깨웠다. to a realization, 자각하도록. of their unequal position in society, [사회에서 그들의 불평등한 위치를]","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 주어 The idealism 뒤에 that freed men from most of their ancient fetters가 붙어 있습니다. 이 that절은 이상주의가 남성들을 속박에서 해방시켰다는 내용을 덧붙여 주는 형용사절이에요. 이 주어 블록을 묶으면 awakened women이 본동사와 목적어로 보이고, to a realization of their unequal position in society가 여성들을 일깨운 내용으로 연결됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 \u003cspan class=\"fx\">The idealism that freed men from most of their ancient fetters\u003c/span> awakened women to a realization of their unequal position in society.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>남성들을 고대의 속박에서 해방시킨 이상주의는 여성들로 하여금 사회에서 자신들의 불평등한 지위를 자각하게 했다는 뜻이다. 이상주의가 남성에게만 자유를 준 것이 아니라 여성의 권리 의식도 깨웠다는 의미이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">freed men from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">liberated men from\u003c/span>\u003cdiv class=\"w\">free와 liberate는 모두 해방시키다라는 뜻으로 대체 가능하다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">awakened women to a realization of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">made women realize\u003c/span>\u003cdiv class=\"w\">사역동사 made를 써서 더 간결하게 깨닫게 하다를 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">idealism\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">idealistic ideas\u003c/span>\u003cspan class=\"y-eq\">idealism = idealistic ideas\u003c/span>\u003cdiv class=\"w\">이상주의를 구체적인 관념의 표현으로 풀어 썼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fetters\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">restraints\u003c/span>\u003cspan class=\"y-eq\">fetters = restraints\u003c/span>\u003cdiv class=\"w\">속박이라는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">awaken A to B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make A aware of B\u003c/span>\u003cspan class=\"y-eq\">awaken A to B = make A aware of B\u003c/span>\u003cdiv class=\"w\">A에게 B를 깨닫게 하다라는 같은 구조의 의미를 전달한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The idealism that liberated men from most of their ancient restraints made women realize their unequal position in society.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"남성들을 고대의 속박 대부분에서 해방시킨 이상주의가 여성들로 하여금 사회에서 자신들의 불평등한 위치를 자각하게 했다는 뜻입니다. 이상주의가 남성에게만 자유를 준 것이 아니라 여성에게도 권리 의식을 깨우는 계기가 되었다는 거죠. awaken A to B는 A에게 B를 깨닫게 하다라는 구조입니다.","hl":"mn"},{"n":42,"text":"freed men from은 liberated men from으로 바꿀 수 있고, awakened women to a realization of는 made women realize로 바꾸면 사역동사 구문으로 더 간결해집니다.","hl":"rw"},{"n":43,"text":"idealism은 idealistic ideas로 풀어 쓸 수 있고, fetters는 restraints와 같은 뜻이에요. awaken A to B는 make A aware of B로 바꿔 말할 수 있습니다.","hl":"ph"},{"n":44,"text":"전체 문장은 The idealism that liberated men from most of their ancient restraints made women realize their unequal position in society. 이렇게 바꿔 말할 수 있습니다. 어휘와 구조를 살짝 바꾼 같은 뜻의 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 \u003cspan class=\"fx\">A classroom where students feel involved and respected\u003c/span> will reduce discipline issues, increase student motivation, and ultimately enhance learning.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A classroom\u003c/div>\u003cdiv class=\"k\">교실은\u003c/div>\u003cdiv class=\"e\">where students feel\u003c/div>\u003cdiv class=\"k\">[학생들이 느끼는]\u003c/div>\u003cdiv class=\"e\">involved and respected\u003c/div>\u003cdiv class=\"k\">참여하며 존중받는다고\u003c/div>\u003cdiv class=\"e\">will reduce\u003c/div>\u003cdiv class=\"k\">감소시킬 것이다\u003c/div>\u003cdiv class=\"e\">discipline issues,\u003c/div>\u003cdiv class=\"k\">훈육의 문제를\u003c/div>\u003cdiv class=\"e\">increase\u003c/div>\u003cdiv class=\"k\">증가시키고\u003c/div>\u003cdiv class=\"e\">student motivation,\u003c/div>\u003cdiv class=\"k\">학생의 동기 부여를\u003c/div>\u003cdiv class=\"e\">and ultimately enhance\u003c/div>\u003cdiv class=\"k\">그리고 궁극적으로 향상시킬 것이다\u003c/div>\u003cdiv class=\"e\">learning\u003c/div>\u003cdiv class=\"k\">학습을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 A classroom은 관계부사 \u003cb class=\"key\">where\u003c/b>가 이끄는 형용사절 where students feel involved and respected의 수식을 받는다. \u003cb class=\"key\">will reduce\u003c/b>, increase, enhance가 등위접속사 and로 병렬 연결된 본동사이다.\u003c/div>","segs":[{"n":45,"text":"A classroom, 교실은. where students feel, [학생들이 느끼는]. involved and respected, 참여하며 존중받는다고. will reduce, 감소시킬 것이다. discipline issues, 훈육의 문제를. increase, 증가시키고. student motivation, 학생의 동기 부여를. and ultimately enhance, 그리고 궁극적으로 향상시킬 것이다. learning, 학습을","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 주어 A classroom을 where절이 꾸며 줍니다. students feel involved and respected가 교실의 분위기를 설명해 주는 형용사절이에요. 주어 블록을 묶고 나면 will reduce, increase, 그리고 ultimately enhance가 and로 이어진 본동사라는 게 보입니다. 이 문장은 주어가 단수이므로 will reduce처럼 단수 동사가 온 것도 확인해야 합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 \u003cspan class=\"fx\">A classroom where students feel involved and respected\u003c/span> will reduce discipline issues, increase student motivation, and ultimately enhance learning.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>학생들이 참여하고 존중받는다고 느끼는 교실은 훈육 문제를 줄이고 학생의 동기를 높이며 학습을 향상시킨다는 뜻이다. 긍정적인 교실 환경이 학업과 태도에 모두 좋은 영향을 준다는 의미이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">feel involved and respected\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">feel that they are involved and respected\u003c/span>\u003cdiv class=\"w\">명사절을 넣어 학생들이 느끼는 구체적인 내용을 더 분명히 드러낸다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">discipline issues\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">behavioral problems\u003c/span>\u003cdiv class=\"w\">훈육 문제를 행동 문제로 바꾸어 더 구체적으로 표현한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">involved\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">engaged\u003c/span>\u003cspan class=\"y-eq\">involved = engaged\u003c/span>\u003cdiv class=\"w\">참여한이라는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">discipline issues\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">behavior problems\u003c/span>\u003cspan class=\"y-eq\">discipline issues = behavior problems\u003c/span>\u003cdiv class=\"w\">훈육 문제를 행동 문제로 바꾼 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ultimately\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in the end\u003c/span>\u003cspan class=\"y-eq\">ultimately = in the end\u003c/span>\u003cdiv class=\"w\">궁극적으로라는 뜻을 유지하며 더 쉬운 부사구로 바꾸었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A classroom in which students feel engaged and respected will decrease discipline problems, raise student motivation, and in the end improve learning.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"학생들이 참여하고 있다고 느끼고 존중받는다고 느끼는 교실은 훈육 문제를 줄이고 학생의 동기를 높이며 궁극적으로 학습을 향상시킨다는 뜻입니다. 교실 분위기가 좋으면 수업 태도와 성적 모두 좋아진다는 거죠. 세 개의 동사가 나란히 연결되어 긍정적 효과가 점점 커지는 흐름을 보여 줍니다.","hl":"mn"},{"n":48,"text":"feel involved and respected는 feel that they are involved and respected로 바꿔 말할 수 있어요. discipline issues는 behavioral problems로 바꾸면 행동 문제라는 뜻이 더 분명해집니다.","hl":"rw"},{"n":49,"text":"involved는 engaged로 바꿔 쓸 수 있고, discipline issues는 behavior problems와 같은 뜻이에요. ultimately는 in the end로 바꿔도 결국이라는 의미가 유지됩니다.","hl":"ph"},{"n":50,"text":"전체 문장은 A classroom in which students feel engaged and respected will decrease discipline problems, raise student motivation, and in the end improve learning. 이렇게 바꿔 말할 수 있습니다. 어휘를 동의어로 바꾸고, 세 동사의 짝을 맞춘 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 \u003cspan class=\"fx\">The way that we behave in a given situation\u003c/span> is often influenced by how important one value is to us relative to others.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The way\u003c/div>\u003cdiv class=\"k\">방식은\u003c/div>\u003cdiv class=\"e\">that we behave\u003c/div>\u003cdiv class=\"k\">[우리가 행동하는]\u003c/div>\u003cdiv class=\"e\">in a given situation\u003c/div>\u003cdiv class=\"k\">[주어진 상황 속에서]\u003c/div>\u003cdiv class=\"e\">is often influenced\u003c/div>\u003cdiv class=\"k\">종종 영향을 받는다\u003c/div>\u003cdiv class=\"e\">by how important one value is to us\u003c/div>\u003cdiv class=\"k\">하나의 가치가 우리에게 얼마나 중요한가에 의해\u003c/div>\u003cdiv class=\"e\">relative to others\u003c/div>\u003cdiv class=\"k\">[다른 가치들에 비해]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The way는 관계부사 \u003cb class=\"key\">that\u003c/b>이 이끄는 형용사절 that we behave in a given situation의 수식을 받는다. way는 how와 함께 쓸 수 없고 that 또는 in which를 쓴다. \u003cb class=\"key\">by\u003c/b>의 목적어로 how가 이끄는 간접의문문이 쓰였다.\u003c/div>","segs":[{"n":51,"text":"The way, 방식은. that we behave, [우리가 행동하는]. in a given situation, [주어진 상황 속에서]. is often influenced, 종종 영향을 받는다. by how important one value is to us, 하나의 가치가 우리에게 얼마나 중요한가에 의해. relative to others, [다른 가치들에 비해]","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 주어 The way를 that절이 꾸며 줍니다. the way는 how와 함께 쓰지 못하고 that이나 in which로 연결한다는 점이 중요해요. 주어 블록을 묶고 나면 is often influenced가 본동사로 보이고, by 뒤에 how절이 붙어 영향을 주는 요인을 설명합니다. 이 how절은 간접의문문 어순이라 how important one value is to us처럼 주어와 동사가 이어집니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 \u003cspan class=\"fx\">The way that we behave in a given situation\u003c/span> is often influenced by how important one value is to us relative to others.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>주어진 상황에서 우리가 행동하는 방식은 다른 가치와 비교해 한 가치가 우리에게 얼마나 중요한지에 따라 영향을 받는다. 가치의 우선순위가 행동을 결정한다는 의미이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The way that we behave\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">How we behave\u003c/span>\u003cdiv class=\"w\">명사절 how를 주어 자리에 써서 더 간결하게 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is often influenced by\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">often depends on\u003c/span>\u003cdiv class=\"w\">영향을 받는다는 것을 의존한다는 의미로 전환해 더 직접적으로 표현한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in a given situation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in a particular situation\u003c/span>\u003cspan class=\"y-eq\">in a given situation = in a particular situation\u003c/span>\u003cdiv class=\"w\">주어진 상황이라는 뜻을 특정한 상황으로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">relative to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">compared to\u003c/span>\u003cspan class=\"y-eq\">relative to = compared to\u003c/span>\u003cdiv class=\"w\">~에 비해라는 비교의 뜻을 유지하는 동의 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">influenced by\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">affected by\u003c/span>\u003cspan class=\"y-eq\">influenced by = affected by\u003c/span>\u003cdiv class=\"w\">영향을 받는다는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">How we behave in a particular situation is often affected by how important one value is to us compared to others.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"주어진 상황에서 우리가 행동하는 방식은 다른 가치들과 비교하여 한 가치가 우리에게 얼마나 중요한지에 의해 영향을 받는다는 뜻입니다. 사람은 모든 가치를 똑같이 따르는 게 아니라 어떤 가치를 더 중요하게 여기느냐에 따라 행동이 달라진다는 거죠. relative to others는 다른 가치들에 비해라는 비교의 뜻을 나타냅니다.","hl":"mn"},{"n":54,"text":"The way that we behave는 How we behave로 바꿔 주어 자리에 명사절을 쓸 수 있고, is often influenced by는 often depends on으로 바꾸면 의존한다는 뜻으로 더 간결해집니다.","hl":"rw"},{"n":55,"text":"in a given situation은 in a particular situation으로 바꿀 수 있고, relative to는 compared to와 같은 뜻이에요. influenced by는 affected by로 바꿔도 영향을 받는다는 의미가 유지됩니다.","hl":"ph"},{"n":56,"text":"전체 문장은 How we behave in a particular situation is often affected by how important one value is to us compared to others. 이렇게 바꿔 말할 수 있어요. 더 간결한 표현으로 같은 의미를 전달합니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 \u003cspan class=\"fx\">Someone who reads only newspapers and books by contemporary authors\u003c/span> looks to me like a near-sighted person.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Someone\u003c/div>\u003cdiv class=\"k\">사람은\u003c/div>\u003cdiv class=\"e\">who reads only newspapers and books\u003c/div>\u003cdiv class=\"k\">[신문과 책만을 읽는]\u003c/div>\u003cdiv class=\"e\">by contemporary authors\u003c/div>\u003cdiv class=\"k\">[현대 작가가 쓴]\u003c/div>\u003cdiv class=\"e\">looks to me\u003c/div>\u003cdiv class=\"k\">나에게는 보인다\u003c/div>\u003cdiv class=\"e\">like a near-sighted person\u003c/div>\u003cdiv class=\"k\">근시안적인 사람처럼\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어가 관계대명사 \u003cb class=\"key\">who\u003c/b>가 이끄는 절 who reads only newspapers and books by contemporary authors의 수식을 받는 \u003cb class=\"key\">Someone\u003c/b>이므로, 문장 전체의 본동사로 단수 \u003cb class=\"key\">looks\u003c/b>가 온다.\u003c/div>","segs":[{"n":57,"text":"Someone, 사람은. who reads only newspapers and books, [신문과 책만을 읽는]. by contemporary authors, [현대 작가가 쓴]. looks to me, 나에게는 보인다. like a near-sighted person, 근시안적인 사람처럼","hl":"ch"},{"n":58,"text":"열 번째 문장은 주어가 Someone인데, who reads only newspapers and books by contemporary authors가 뒤에서 Someone을 꾸며 주고 있습니다. 이렇게 주어가 길어지면 동사를 찾기 어렵지만, 블록을 묶고 나면 단수 동사 looks가 본동사라는 게 보입니다. Someone이 단수이기 때문에 looks처럼 단수형을 쓴 겁니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 \u003cspan class=\"fx\">Someone who reads only newspapers and books by contemporary authors\u003c/span> looks to me like a near-sighted person.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>신문과 현대 작가의 책만 읽는 사람은 나에게 근시안적인 사람처럼 보인다는 뜻이다. 동시대의 글만 읽으면 시야가 좁아진다는 비판을 담고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">who reads only newspapers and books by contemporary authors\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who reads nothing but contemporary newspapers and books\u003c/span>\u003cdiv class=\"w\">오직 그것만 읽는다는 뜻을 nothing but으로 강조한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">looks to me like\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">seems to me to be\u003c/span>\u003cdiv class=\"w\">보다 부드럽고 공식적인 표현으로 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">contemporary\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">modern\u003c/span>\u003cspan class=\"y-eq\">contemporary = modern\u003c/span>\u003cdiv class=\"w\">현대의라는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">near-sighted\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">short-sighted\u003c/span>\u003cspan class=\"y-eq\">near-sighted = short-sighted\u003c/span>\u003cdiv class=\"w\">근시안이라는 뜻을 유지하는 동의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">looks to me like\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">seems to me like\u003c/span>\u003cspan class=\"y-eq\">looks to me like = seems to me like\u003c/span>\u003cdiv class=\"w\">~처럼 보인다는 뜻을 유지하며 동사를 바꾸었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A person who reads only modern newspapers and books seems to me to be short-sighted.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"신문과 현대 작가의 책만 읽는 사람은 나에게 근시안적인 사람처럼 보인다는 뜻입니다. 옛 고전이나 다양한 분야의 책을 읽지 않고 동시대의 글만 읽으면 시야가 좁아진다는 비판이에요. near-sighted는 시력이 나쁘다는 뜻이지만 여기서는 안목이 좁다는 은유입니다.","hl":"mn"},{"n":60,"text":"who reads only newspapers and books by contemporary authors는 who reads nothing but contemporary newspapers and books로 바꾸면 오직 그것만 읽는다는 뜻이 강조됩니다. looks to me like는 seems to me to be로 바꾸면 더 부드러운 표현이 됩니다.","hl":"rw"},{"n":61,"text":"contemporary는 modern과 같은 뜻이고, near-sighted는 short-sighted로 바꿔 쓸 수 있어요. looks to me like는 seems to me like로 바꿔도 ~처럼 보인다는 의미가 유지됩니다.","hl":"ph"},{"n":62,"text":"전체 문장은 A person who reads only modern newspapers and books seems to me to be short-sighted. 이렇게 바꿔 말할 수 있습니다. Someone을 A person으로 바꾸고 어휘를 동의어로 바꾼 같은 뜻의 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 \u003cspan class=\"fx\">The impressions that a child receives from his environment during the first years of life\u003c/span> influence his intellectual development and character very basically.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The impressions\u003c/div>\u003cdiv class=\"k\">인상은\u003c/div>\u003cdiv class=\"e\">that a child receives\u003c/div>\u003cdiv class=\"k\">[아이가 받는]\u003c/div>\u003cdiv class=\"e\">from his environment\u003c/div>\u003cdiv class=\"k\">[자신의 환경으로부터]\u003c/div>\u003cdiv class=\"e\">during the first years of life\u003c/div>\u003cdiv class=\"k\">[인생의 처음 몇 년 동안에]\u003c/div>\u003cdiv class=\"e\">influence\u003c/div>\u003cdiv class=\"k\">영향을 미친다\u003c/div>\u003cdiv class=\"e\">his intellectual development and character\u003c/div>\u003cdiv class=\"k\">그의 지적 발달과 성격에\u003c/div>\u003cdiv class=\"e\">very basically\u003c/div>\u003cdiv class=\"k\">매우 근본적으로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The impressions가 관계대명사 \u003cb class=\"key\">that\u003c/b>이 이끄는 절 that a child receives from his environment during the first years of life의 수식을 받으므로 복수 동사 \u003cb class=\"key\">influence\u003c/b>가 본동사로 온다.\u003c/div>","segs":[{"n":63,"text":"The impressions, 인상은. that a child receives, [아이가 받는]. from his environment, [자신의 환경으로부터]. during the first years of life, [인생의 처음 몇 년 동안에]. influence, 영향을 미친다. his intellectual development and character, 그의 지적 발달과 성격에. very basically, 매우 근본적으로","hl":"ch"},{"n":64,"text":"열한 번째 문장은 주어 The impressions 뒤에 that a child receives from his environment during the first years of life가 붙어 있습니다. 이 긴 주어 블록을 묶고 나면 복수 동사 influence가 본동사라는 게 보여요. The impressions가 복수이기 때문에 influence로 온 것이 핵심입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 \u003cspan class=\"fx\">The impressions that a child receives from his environment during the first years of life\u003c/span> influence his intellectual development and character very basically.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>생애 첫 몇 년 동안 아이가 환경에서 받는 인상이 지적 발달과 성격에 매우 근본적인 영향을 미친다는 뜻이다. 유아기의 경험이 지능과 인격 형성의 바탕이 된다는 의미이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">during the first years of life\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in early childhood\u003c/span>\u003cdiv class=\"w\">생애 처음 몇 년을 유아기라는 더 간결한 표현으로 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">very basically\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fundamentally\u003c/span>\u003cdiv class=\"w\">근본적으로라는 뜻의 부사로 더 자연스럽게 표현한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">receives from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">gains from\u003c/span>\u003cspan class=\"y-eq\">receives from = gains from\u003c/span>\u003cdiv class=\"w\">받는다는 뜻을 얻는다는 의미로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">environment\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">surroundings\u003c/span>\u003cspan class=\"y-eq\">environment = surroundings\u003c/span>\u003cdiv class=\"w\">환경이라는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">basically\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fundamentally\u003c/span>\u003cspan class=\"y-eq\">basically = fundamentally\u003c/span>\u003cdiv class=\"w\">근본적으로라는 뜻을 유지하는 부사이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The impressions that a child gains from his surroundings in early childhood affect his intellectual development and character fundamentally.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"아이가 생애 첫 몇 년 동안 환경에서 받는 인상이 지적 발달과 성격에 매우 근본적으로 영향을 미친다는 뜻입니다. 어릴 때의 경험이 지능과 인격 형성의 바탕이 된다는 거죠. very basically는 단순히 조금이 아니라 아주 근본적인 수준에서 영향을 준다는 뜻입니다.","hl":"mn"},{"n":66,"text":"during the first years of life는 in early childhood로 바꾸면 유아기에라는 더 간결한 표현이 됩니다. very basically는 fundamentally로 바꿔도 뜻이 같습니다.","hl":"rw"},{"n":67,"text":"receives from은 gains from으로 바꿀 수 있고, environment는 surroundings와 같은 뜻이에요. basically는 fundamentally로 바꿔도 근본적으로라는 의미가 유지됩니다.","hl":"ph"},{"n":68,"text":"전체 문장은 The impressions that a child gains from his surroundings in early childhood affect his intellectual development and character fundamentally. 이렇게 바꿔 말할 수 있습니다. 어휘를 동의어로 바꾼 같은 뜻의 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">The period when humans began growing crops, raising animals for food, and using stone-tool technology\u003c/span> is referred to as the Neolithic period.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The period\u003c/div>\u003cdiv class=\"k\">기간은\u003c/div>\u003cdiv class=\"e\">when humans began growing crops,\u003c/div>\u003cdiv class=\"k\">인간이 농작물을 재배하기 시작한\u003c/div>\u003cdiv class=\"e\">raising animals for food,\u003c/div>\u003cdiv class=\"k\">식량을 위해 동물을 사육하고\u003c/div>\u003cdiv class=\"e\">and using stone-tool technology\u003c/div>\u003cdiv class=\"k\">그리고 석기 기술을 사용하기 시작한\u003c/div>\u003cdiv class=\"e\">is referred to as\u003c/div>\u003cdiv class=\"k\">일컬어진다\u003c/div>\u003cdiv class=\"e\">the Neolithic period\u003c/div>\u003cdiv class=\"k\">신석기 시대로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어 The period가 관계부사 \u003cb class=\"key\">when\u003c/b>이 이끄는 절 when humans began growing crops, raising animals for food, and using stone-tool technology의 수식을 받으므로 단수 동사 \u003cb class=\"key\">is\u003c/b>가 본동사로 온다. \u003cb class=\"key\">refer to A as B\u003c/b>의 수동태인 is referred to as는 ~라고 불린다라는 뜻이다.\u003c/div>","segs":[{"n":69,"text":"The period, 기간은. when humans began growing crops, 인간이 농작물을 재배하기 시작한. raising animals for food, 식량을 위해 동물을 사육하고. and using stone-tool technology, 그리고 석기 기술을 사용하기 시작한. is referred to as, 일컬어진다. the Neolithic period, 신석기 시대로","hl":"ch"},{"n":70,"text":"열두 번째 문장은 주어 The period 뒤에 when절이 붙어 있습니다. when humans began growing crops, raising animals for food, and using stone-tool technology가 그 시기를 설명해 주는 형용사절이에요. 이 주어 블록을 묶으면 단수 동사 is가 보이고 is referred to as the Neolithic period가 서술부로 이어집니다. The period가 단수이므로 is를 쓴 겁니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">The period when humans began growing crops, raising animals for food, and using stone-tool technology\u003c/span> is referred to as the Neolithic period.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인간이 농작물을 재배하고 식량용 동물을 기르고 석기 기술을 사용하기 시작한 시기를 신석기 시대라고 부른다는 뜻이다. 농업과 가축 사육, 석기 사용이 신석기 시대의 기준임을 보여 준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">began growing crops\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">started cultivating crops\u003c/span>\u003cdiv class=\"w\">begin을 start로, grow를 cultivate로 바꾸어 재배하다는 뜻을 더 분명히 표현한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is referred to as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is called\u003c/span>\u003cdiv class=\"w\">~라고 불린다는 뜻을 더 간단한 동사로 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">raising animals\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">breeding animals\u003c/span>\u003cspan class=\"y-eq\">raising animals = breeding animals\u003c/span>\u003cdiv class=\"w\">동물을 기르다는 뜻을 사육하다로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stone-tool technology\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stone tool use\u003c/span>\u003cspan class=\"y-eq\">stone-tool technology = stone tool use\u003c/span>\u003cdiv class=\"w\">석기 기술을 도구 사용으로 더 간단히 표현했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">referred to as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">called\u003c/span>\u003cspan class=\"y-eq\">referred to as = called\u003c/span>\u003cdiv class=\"w\">~라고 불린다는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The period when humans started cultivating crops, breeding animals for food, and using stone tools is called the Neolithic period.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"인간이 농작물을 재배하고 식량을 얻기 위해 동물을 사육하고 석기 기술을 사용하기 시작한 시기를 신석기 시대라고 부른다는 뜻입니다. 신석기 시대의 특징 세 가지를 나열하면서 그 시기를 정의하고 있어요. refer to A as B는 A를 B라고 부르다라는 뜻이고, 수동태 is referred to as로 쓰였습니다.","hl":"mn"},{"n":72,"text":"began growing crops는 started cultivating crops로 바꿀 수 있고, is referred to as는 is called로 바꾸면 더 간단하게 불린다는 뜻이 됩니다.","hl":"rw"},{"n":73,"text":"raising animals는 breeding animals로 바꿔 쓸 수 있고, stone-tool technology는 stone tool use처럼 간단히 표현할 수 있어요. referred to as는 called와 같은 뜻입니다.","hl":"ph"},{"n":74,"text":"전체 문장은 The period when humans started cultivating crops, breeding animals for food, and using stone tools is called the Neolithic period. 이렇게 바꿔 말할 수 있습니다. 어휘를 동의어로 바꾼 같은 뜻의 문장입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>주어를 수식하는 형용사절은 \u003cb class=\"key\">who/which/that\u003c/b>이나 \u003cb class=\"key\">when/where/why/that\u003c/b>으로 시작하며, 주어 블록으로 묶어야 본동사가 보인다.\u003c/li>\u003cli>주어 수식 블록을 제거하면 문장의 뼈대인 \u003cb class=\"key\">주어 + 동사 + 목적어/보어\u003c/b>가 명확해진다.\u003c/li>\u003cli>관계대명사절은 선행사의 사람·사물에 따라, 관계부사절은 시간·장소·이유·방법 등에 따라 선택한다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 주어에 형용사절이 붙은 구문을 집중적으로 연습했습니다. 길어진 주어를 만나면 who, which, that, when, where, why 같은 관계사 이하를 하나의 블록으로 묶고, 문장의 진짜 동사를 찾는 습관이 중요해요. 오늘 배운 문장들을 소리 내어 다시 읽어 보면서 주어 블록을 묶는 연습을 해 보세요. 다음 시간에는 더 재미있는 구문으로 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
