span class=\"ko\">이 세상에서</span><span class=\"en\"><b>in this world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약자가</span><span class=\"en\"><b><span class=\"grammar-hl\">for the weak</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">되는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to become</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강자의 희생양이</span><span class=\"en\"><b>the victim of <span class=\"grammar-hl\">the strong</span>.</b></span></div></div><div class=\"lec-sent-ko\">약자가 강자의 희생양이 되는 것은 이 세상에서 흔하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 가주어(It)와 진주어(for~ to...) 구문을 사용하여, 세상의 냉혹한 원리인 &#39;약육강식&#39;의 논리를 설명하고 있습니다. &#39;the + 형용사&#39; 형태인 &#39;the weak&#39;와 &#39;the strong&#39;을 사용하여 특정 개인이 아닌 &#39;약한 집단&#39;과 &#39;강한 집단&#39;이라는 보편적인 개념으로 대조를 이루고 있습니다. 전체 글의 도입부로서 현실 세계에서 빈번하게 일어나는 지배와 피지배의 관계를 단정적으로 제시하며 독자의 주의를 환기하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is usual ... for the weak to become (가주어): 진주어: It은 형식상의 주어인 가주어로 쓰였으며, to부정사구인 to become the victim of the strong이 문장의 실제 주어인 진주어 역할을 한다.</div><div class=\"lec-gr-item\">for the weak to부정사의 의미상 주어: &#39;for + 목적격(명사구)&#39; 형태로 뒤따르는 to부정사(to become)의 동작을 행하는 주체를 나타낸다.</div><div class=\"lec-gr-item\">to become (to부정사): 문장의 실제 주어 역할을 수행하는 명사적 용법의 to부정사다.</div><div class=\"lec-gr-item\">the weak (관용표현): &#39;the + 형용사&#39; 구조가 하나의 명사구로 기능하며, 복수 보통명사인 &#39;weak people(약자들)&#39;을 의미한다.</div><div class=\"lec-gr-item\">the strong (관용표현): &#39;the + 형용사&#39; 구조가 전치사 of의 목적어인 명사구로 쓰였으며, &#39;strong people(강자들)&#39;을 의미한다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">usual</span> <span class=\"m\">보통의, 흔한</span></li><li><span class=\"w\">the weak</span> <span class=\"m\">약자, 약한 사람들</span></li><li><span class=\"w\">victim</span> <span cl
