  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;

  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};

lecturePlayer(document.getElementById("app"),{"brand":"unit03","title":"마법같은 블록구문 실전편 Unit 03 가주어 it","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>마법같은 블록구문 실전편 Unit 03 가주어 it\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>가주어 it이 이끄는 to부정사, 동명사, that, whether, 의문사절 진주어를 찾아 해석할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마법같은 블록구문 실전편 세 번째 유닛, 가주어 it을 함께 공부해요. 영어 문장은 앞부분이 길어지면 뒤로 보내고 대신 it을 앞에 세우는 경우가 많아요. 이 it이 어떤 덩어리를 대신하는지 정확히 보는 훈련을 하면 긴 문장도 훨씬 빨리 읽힙니다. 예문 열두 개를 하나씩 끊어 읽으면서 it의 정체를 확인해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">가주어 \u003cb class=\"key\">It\u003c/b>은 뒤에 오는 \u003cb class=\"key\">to-v\u003c/b>, \u003cb class=\"key\">v-ing\u003c/b>, \u003cb class=\"key\">that\u003c/b>, \u003cb class=\"key\">whether\u003c/b>, \u003cb class=\"key\">의문사절\u003c/b>을 대신한다. 해석은 진짜 주어인 뒤 덩어리부터 읽으며, 사람의 성질 형용사가 오면 of + 목적어, 그 외에는 for + 목적어로 의미상 주어를 표시한다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">It is usual in this world for the weak to become the victim of the strong\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">It is a common superstition that a black cat crossing your path is bad luck\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 \u003cspan class=\"fx\">It's fine to celebrate success but it is more important to heed the lessons of failure\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 \u003cspan class=\"fx\">It's no use locking the stable door after the horse has bolted\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">It matters not what someone is born, but what they grow to be\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">It is the essence of scientific thinking to propose alternative ideas and then to test them against existing concepts\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 \u003cspan class=\"fx\">It was very careless of her to leave the medicine where the children could reach it\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 With all the passion for being slim, \u003cspan class=\"fx\">it is no wonder that many people view any amount of visible fat on the body as something to get rid of\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">It's amazing how much more you learn when you pause, quiet your mind, and listen to what others say\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 Grown-ups never understand anything by themselves, and \u003cspan class=\"fx\">it is tiresome for children to be always and forever explaining things to them\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 With today's latest virtual reality technologies, \u003cspan class=\"fx\">it is now possible for designers to create real-world situations in a digital environment\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">It's not yet clear whether the Prime Minister's resignation offer is a serious one, or whether it's simply a tactical move\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"이 유닛의 핵심은 문장 맨 앞에 있는 It이 진짜 주어가 아니라 가주어라는 사실이에요. 진짜 주어는 뒤에 오는 to부정사나 동명사, 또는 that, whether, 의문사가 이끄는 명사절이죠. 이때 성질이나 태도를 나타내는 형용사가 나오면 of로 의미상 주어를 쓰고, 그 외에는 for를 씁니다. 예문에서 이 블록이 어떻게 자리 잡는지 확인해 보세요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">It is usual in this world for the weak to become the victim of the strong\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It is usual in this world \u003c/div>\u003cdiv class=\"k\">이 세상에서 흔하다\u003c/div>\u003cdiv class=\"e\">for the weak \u003c/div>\u003cdiv class=\"k\">약자가\u003c/div>\u003cdiv class=\"e\">to become \u003c/div>\u003cdiv class=\"k\">되는 것은\u003c/div>\u003cdiv class=\"e\">the victim of the strong.\u003c/div>\u003cdiv class=\"k\">강자의 희생양이\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>가주어 \u003cb class=\"key\">It\u003c/b>이 진주어 \u003cb class=\"key\">to become\u003c/b> 이하를 대신하며, \u003cb class=\"key\">for the weak\u003c/b>는 to부정사의 의미상 주어이다. \u003cb class=\"key\">the weak\u003c/b>와 \u003cb class=\"key\">the strong\u003c/b>은 the + 형용사로 각각 약한 사람들, 강한 사람들을 뜻한다.\u003c/div>","segs":[{"n":3,"text":"It is usual in this world, 이 세상에서 흔하다. for the weak, 약자가. to become, 되는 것은. the victim of the strong, 강자의 희생양이","hl":"ch"},{"n":4,"text":"첫 번째 문장은 It is usual 이렇게 시작하지만, It은 뒤에 오는 to become 이하를 대신하는 가주어입니다. for the weak는 to become의 의미상 주어예요. the weak와 the strong은 각각 약한 사람들과 강한 사람들이라는 뜻이죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">It is usual in this world for the weak to become the victim of the strong\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 문장은 세상에서 약자가 강자의 희생양이 되는 일이 흔하다는 뜻이에요. 여기서 the weak와 the strong은 특정 개인이 아니라 약자 집단, 강자 집단을 가리키는 표현이죠. 직역하면 약자가 강자의 희생양이 되는 것은 이 세상에서 흔한 일이다가 됩니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">for the weak to become the victim of the strong\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">for weak people to become victims of strong people\u003c/span>\u003cdiv class=\"w\">the weak와 the strong을 풀어서 평이한 표현으로 바꾸면 의미가 더 또렷해져요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">It is usual\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">It is common\u003c/span>\u003cdiv class=\"w\">usual 대신 common을 쓰면 빈도가 높다는 뉘앙스가 살아나요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">usual\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">common, ordinary\u003c/span>\u003cspan class=\"y-eq\">usual = common\u003c/span>\u003cdiv class=\"w\">usual은 common이나 ordinary로 바꾸어 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">victim\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">prey, target\u003c/span>\u003cspan class=\"y-eq\">victim = prey\u003c/span>\u003cdiv class=\"w\">희생양이나 먹잇감의 뜻으로 prey, target이 쓰여요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the weak\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">weak people\u003c/span>\u003cdiv class=\"w\">the + 형용사는 복수 보통명사로 풀어서 쓸 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">In this world, it is common for weak people to become victims of strong people.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 약자가 강자의 희생양이 되는 일이 세상에서 흔하다고 말해요. the weak처럼 the에 형용사를 붙이면 그 성질을 가진 사람들 전체를 가리킵니다. 그래서 특정 인물이 아니라 집단의 이야기로 읽으면 자연스러워요.","hl":"mn"},{"n":6,"text":"for the weak to become the victim of the strong은 for weak people to become victims of strong people처럼 풀어 쓸 수 있어요. It is usual은 It is common으로 바꾸면 빈도가 잦다는 느낌이 더 강해집니다.","hl":"rw"},{"n":7,"text":"usual은 common이나 ordinary와 바꿔 쓸 수 있고요, victim은 prey나 target으로 표현하기도 해요. the weak는 weak people처럼 형용사를 풀어서 읽으면 뜻이 명확해집니다.","hl":"ph"},{"n":8,"text":"전체를 자연스럽게 바꾸면 In this world, it is common for weak people to become victims of strong people로 표현할 수 있어요. 이렇게 바꾸면 원문의 the weak와 the strong이 훨씬 분명하게 다가오죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">It is a common superstition that a black cat crossing your path is bad luck\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It is a common superstition \u003c/div>\u003cdiv class=\"k\">흔한 미신이다\u003c/div>\u003cdiv class=\"e\">that a black cat \u003c/div>\u003cdiv class=\"k\">검은 고양이가\u003c/div>\u003cdiv class=\"e\">crossing your path \u003c/div>\u003cdiv class=\"k\">당신의 길을 가로지르는\u003c/div>\u003cdiv class=\"e\">is bad luck.\u003c/div>\u003cdiv class=\"k\">불운이라는 것은\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>가주어 \u003cb class=\"key\">It\u003c/b>이 명사절 진주어 \u003cb class=\"key\">that\u003c/b> a black cat crossing your path is bad luck을 대신한다. \u003cb class=\"key\">crossing your path\u003c/b>는 a black cat을 수식하는 분사구로, a black cat that crosses your path로 바꿀 수 있다.\u003c/div>","segs":[{"n":9,"text":"It is a common superstition, 흔한 미신이다. that a black cat, 검은 고양이가. crossing your path, 당신의 길을 가로지르는. is bad luck, 불운이라는 것은","hl":"ch"},{"n":10,"text":"두 번째 문장의 It은 that 이하의 명사절을 대신하는 가주어예요. that절 안에서 crossing your path는 a black cat을 수식하는 분사구입니다. 이 부분은 a black cat that crosses your path로 바꿔 읽을 수 있죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 \u003cspan class=\"fx\">It is a common superstition that a black cat crossing your path is bad luck\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>검은 고양이가 사람의 길을 가로지르면 불운이 온다는 것은 흔한 미신이라는 뜻이에요. 서양에서 실제로 퍼져 있는 미신을 문장으로 가져온 것이죠. crossing your path는 검은 고양이가 앞을 가로질러 지나가는 상황을 나타내요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a black cat crossing your path\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a black cat that crosses your path\u003c/span>\u003cdiv class=\"w\">분사구를 관계대명사절로 바꾸면 수식 관계가 명확해져요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">It is a common superstition\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Many people commonly believe\u003c/span>\u003cdiv class=\"w\">미신이라는 표현을 사람들의 믿음으로 전환해도 뜻이 통하죠.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">superstition\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">myth, false belief\u003c/span>\u003cspan class=\"y-eq\">superstition = myth\u003c/span>\u003cdiv class=\"w\">비과학적인 믿음이라는 뜻으로 myth나 false belief가 쓰여요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">path\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">way, road\u003c/span>\u003cspan class=\"y-eq\">path = way\u003c/span>\u003cdiv class=\"w\">길이라는 뜻으로 way나 road로 바꿀 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">bad luck\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">misfortune\u003c/span>\u003cspan class=\"y-eq\">bad luck = misfortune\u003c/span>\u003cdiv class=\"w\">불운은 misfortune이라는 한 단어로 표현할 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Many people commonly believe that a black cat that crosses your path brings bad luck.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"검은 고양이가 길을 가로지르면 불운이 찾아온다는 것은 서양에서 흔히 믿는 미신이에요. 문장은 특정 고양이가 아니라 그런 상황 자체가 나쁜 징조라는 뜻을 담고 있어요.","hl":"mn"},{"n":12,"text":"a black cat crossing your path를 a black cat that crosses your path로 고치면 고양이가 가로지르는 그림이 더 분명해져요. It is a common superstition 대신 Many people commonly believe로 시작해도 같은 의미가 됩니다.","hl":"rw"},{"n":13,"text":"superstition은 myth나 false belief로 바꿔 쓸 수 있고요, path는 way나 road로 표현할 수 있어요. bad luck은 misfortune이라는 한 단어로 정리할 수 있습니다.","hl":"ph"},{"n":14,"text":"전체를 바꾸면 Many people commonly believe that a black cat that crosses your path brings bad luck이 돼요. 미신이라는 표현을 사람들의 믿음으로 바꾸고 분사구를 관계대명사절로 풀어낸 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 \u003cspan class=\"fx\">It's fine to celebrate success but it is more important to heed the lessons of failure\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It's fine \u003c/div>\u003cdiv class=\"k\">좋다\u003c/div>\u003cdiv class=\"e\">to celebrate success \u003c/div>\u003cdiv class=\"k\">성공을 축하하는 것은\u003c/div>\u003cdiv class=\"e\">but it is more important \u003c/div>\u003cdiv class=\"k\">그러나 더 중요하다\u003c/div>\u003cdiv class=\"e\">to heed \u003c/div>\u003cdiv class=\"k\">주의를 기울이는 것은\u003c/div>\u003cdiv class=\"e\">the lessons of failure. \u003c/div>\u003cdiv class=\"k\">실패의 교훈에\u003c/div>\u003cdiv class=\"e\">Bill Gates\u003c/div>\u003cdiv class=\"k\">빌 게이츠\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>첫 번째 가주어 \u003cb class=\"key\">It\u003c/b>은 \u003cb class=\"key\">to celebrate\u003c/b> success를, 두 번째 가주어 \u003cb class=\"key\">it\u003c/b>은 \u003cb class=\"key\">to heed\u003c/b> the lessons of failure를 대신한다. but이 두 문장을 대조하며, heed는 주의를 기울이다라는 뜻의 타동사이다.\u003c/div>","segs":[{"n":15,"text":"It's fine, 좋다. to celebrate success, 성공을 축하하는 것은. but it is more important, 그러나 더 중요하다. to heed, 주의를 기울이는 것은. the lessons of failure, 실패의 교훈에. Bill Gates, 빌 게이츠","hl":"ch"},{"n":16,"text":"세 번째 문장에는 가주어가 두 번 나옵니다. 첫 번째 It's fine에서 It은 to celebrate success를 대신하고, 두 번째 it is more important에서 it은 to heed the lessons of failure를 대신해요. but이 앞뒤를 대조하고 heed는 주의를 기울이다라는 뜻입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 \u003cspan class=\"fx\">It's fine to celebrate success but it is more important to heed the lessons of failure\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>성공을 축하하는 것은 좋지만 실패의 교훈에 주의를 기울이는 것이 더 중요하다는 뜻이에요. 성공의 기쁨보다 실패에서 얻는 배움을 더 가치 있게 여기라는 조언이에요. 빌 게이츠가 한 말로, 성장 관점의 태도를 강조해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">It's fine to celebrate success\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Celebrating success is fine\u003c/span>\u003cdiv class=\"w\">동명사 주어를 앞에 세워 같은 뜻을 만들 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to heed the lessons of failure\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to pay attention to the lessons of failure\u003c/span>\u003cdiv class=\"w\">heed 대신 구동사 pay attention to를 쓰면 더 익숙해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">heed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pay attention to, take note of\u003c/span>\u003cspan class=\"y-eq\">heed = pay attention to\u003c/span>\u003cdiv class=\"w\">heed는 주의를 기울이다라는 뜻으로 구동사로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">failure\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">defeat, lack of success\u003c/span>\u003cspan class=\"y-eq\">failure = lack of success\u003c/span>\u003cdiv class=\"w\">실패는 defeat나 lack of success로 풀어서 표현해요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">celebrate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rejoice over, mark\u003c/span>\u003cspan class=\"y-eq\">celebrate = rejoice over\u003c/span>\u003cdiv class=\"w\">celebrate는 rejoice over나 mark로 바꿀 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Celebrating success is fine, but paying attention to the lessons of failure is more important.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"성공을 축하하는 것은 좋지만 실패의 교훈에 주의를 기울이는 것이 더 중요하다는 말이에요. 성공했을 때의 기쁨보다 실패에서 배우는 것을 더 중요하게 여기라는 빌 게이츠의 조언이죠.","hl":"mn"},{"n":18,"text":"It's fine to celebrate success는 Celebrating success is fine으로 바꿀 수 있어요. to heed는 to pay attention to로 바꾸면 같은 뜻이면서 더 쉬운 표현이 됩니다.","hl":"rw"},{"n":19,"text":"heed는 pay attention to나 take note of로 바꿔 쓸 수 있고요. failure는 defeat나 lack of success로 풀어서 표현해요. celebrate는 rejoice over나 mark로 바꿀 수 있습니다.","hl":"ph"},{"n":20,"text":"전체를 자연스럽게 바꾸면 Celebrating success is fine, but paying attention to the lessons of failure is more important가 돼요. 부정사 주어를 동명사 주어로 바꾸고 heed를 구동사로 풀어낸 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 \u003cspan class=\"fx\">It's no use locking the stable door after the horse has bolted\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It's no use \u003c/div>\u003cdiv class=\"k\">소용없다\u003c/div>\u003cdiv class=\"e\">locking the stable door \u003c/div>\u003cdiv class=\"k\">마구간 문을 잠그는 것은\u003c/div>\u003cdiv class=\"e\">after \u003c/div>\u003cdiv class=\"k\">후에\u003c/div>\u003cdiv class=\"e\">the horse has bolted. \u003c/div>\u003cdiv class=\"k\">말이 달아난\u003c/div>\u003cdiv class=\"e\">Irish Proverb\u003c/div>\u003cdiv class=\"k\">아일랜드 속담\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>가주어 \u003cb class=\"key\">It\u003c/b>이 동명사구 진주어 \u003cb class=\"key\">locking the stable door\u003c/b> after the horse has bolted를 대신한다. It is no use 다음에 동명사구가 오는 패턴이며, after절이 시간 배경을 나타낸다.\u003c/div>","segs":[{"n":21,"text":"It's no use, 소용없다. locking the stable door, 마구간 문을 잠그는 것은. after, 후에. the horse has bolted, 말이 달아난. Irish Proverb, 아일랜드 속담","hl":"ch"},{"n":22,"text":"네 번째 문장은 It's no use로 시작하고, It은 뒤에 오는 locking the stable door 이하를 대신하는 가주어입니다. 여기서 locking은 동명사라서 가주어 진주어 패턴을 이뤄요. after절은 말이 달아난 후라는 시간 배경을 덧붙입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 \u003cspan class=\"fx\">It's no use locking the stable door after the horse has bolted\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>말이 달아난 후에 마구간 문을 잠그는 것은 소용없다는 뜻이에요. 이미 일이 벌어진 뒤에 대비해도 아무 효과가 없다는 아일랜드 속담이에요. 우리말의 소 잃고 외양간 고친다와 통하는 표현이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">It's no use locking the stable door\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Locking the stable door is useless\u003c/span>\u003cdiv class=\"w\">동명사구를 주어로 앞에 세워 같은 뜻을 만들 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">after the horse has bolted\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">after the horse has run away\u003c/span>\u003cdiv class=\"w\">bolt 대신 run away를 쓰면 뜻이 더 쉬워요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">barn, shed\u003c/span>\u003cspan class=\"y-eq\">stable = barn\u003c/span>\u003cdiv class=\"w\">마구간이나 축사를 가리키는 말로 barn이나 shed가 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">bolt\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">run away, escape\u003c/span>\u003cspan class=\"y-eq\">bolt = run away\u003c/span>\u003cdiv class=\"w\">bolt는 도망가다라는 뜻으로 run away나 escape로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">no use\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">useless, pointless\u003c/span>\u003cspan class=\"y-eq\">no use = useless\u003c/span>\u003cdiv class=\"w\">no use는 useless나 pointless로 바꿀 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Locking the stable door after the horse has run away is useless.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"말이 달아난 다음에 마구간 문을 잠가도 소용없다는 속담이에요. 이미 벌어진 일 뒤에 예방 조치를 해도 늦었다는 뜻이죠. 우리말의 소 잃고 외양간 고친다와 비슷한 표현입니다.","hl":"mn"},{"n":24,"text":"It's no use locking the stable door는 Locking the stable door is useless로 바꿀 수 있어요. bolt는 run away로 바꾸면 말이 도망갔다는 뜻이 더 분명해집니다.","hl":"rw"},{"n":25,"text":"stable은 barn이나 shed로 바꿔 쓸 수 있고요, bolt는 run away나 escape로 표현해요. no use는 useless나 pointless로 바꿔도 뜻이 같습니다.","hl":"ph"},{"n":26,"text":"전체를 바꾸면 Locking the stable door after the horse has run away is useless가 돼요. 동명사구를 주어로 내세우고 bolt를 run away로 푼 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 \u003cspan class=\"fx\">It matters not what someone is born, but what they grow to be\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It matters not \u003c/div>\u003cdiv class=\"k\">중요하지 않다\u003c/div>\u003cdiv class=\"e\">what someone is born, \u003c/div>\u003cdiv class=\"k\">누군가가 무엇으로 태어나는지가 아니라\u003c/div>\u003cdiv class=\"e\">but \u003c/div>\u003cdiv class=\"k\">그 대신에\u003c/div>\u003cdiv class=\"e\">what they grow to be. \u003c/div>\u003cdiv class=\"k\">그들이 자라서 무엇이 되는지가\u003c/div>\u003cdiv class=\"e\">the novel\u003c/div>\u003cdiv class=\"k\">소설\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>가주어 \u003cb class=\"key\">It\u003c/b>이 뒤에 오는 \u003cb class=\"key\">what someone is born\u003c/b>과 \u003cb class=\"key\">what they grow to be\u003c/b> 명사절 진주어를 대신한다. \u003cb class=\"key\">not A but B\u003c/b> 구문으로 A가 아니라 B라는 뜻이며, matter가 동사로 중요하다라는 뜻이다.\u003c/div>","segs":[{"n":27,"text":"It matters not, 중요하지 않다. what someone is born, 누군가가 무엇으로 태어나는지가 아니라. but, 그 대신에. what they grow to be, 그들이 자라서 무엇이 되는지가. the novel, 소설","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 It matters not으로 시작하고, It은 what someone is born과 what they grow to be라는 두 개의 명사절을 대신하는 가주어입니다. not A but B 구문이라서 A가 아니라 B라는 뜻으로 읽는 게 핵심이에요. matter는 동사로 중요하다라는 뜻이죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 \u003cspan class=\"fx\">It matters not what someone is born, but what they grow to be\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>누군가가 어떤 존재로 태어나는지가 아니라 자라서 어떤 사람이 되는지가 중요하다는 뜻이에요. 타고난 조건보다 성장 과정과 선택이 더 중요하다는 메시지를 담고 있어요. 이 문장은 소설에서 인용된 문장이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">what someone is born\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the circumstances of someone's birth\u003c/span>\u003cdiv class=\"w\">태어난 조건이라는 뜻을 명사구로 풀어 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">what they grow to be\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the kind of person they become\u003c/span>\u003cdiv class=\"w\">성장해서 어떤 사람이 되는지를 평이하게 표현한 것입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">matter\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be important, count\u003c/span>\u003cspan class=\"y-eq\">matter = be important\u003c/span>\u003cdiv class=\"w\">matter는 중요하다라는 뜻으로 be important나 count로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">grow to be\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">become\u003c/span>\u003cspan class=\"y-eq\">grow to be = become\u003c/span>\u003cdiv class=\"w\">자라서 어떤 상태가 되다는 의미로 become 한 단어로 바꿔요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be born\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">come into the world\u003c/span>\u003cspan class=\"y-eq\">be born = come into the world\u003c/span>\u003cdiv class=\"w\">태어나다는 뜻으로 come into the world로 표현할 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">What someone is born is not important, but what they become is.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"타고난 태생이 무엇인지는 중요하지 않고, 자라서 어떤 사람이 되는지가 중요하다는 말이에요. 부모나 환경 같은 조건보다 자신이 어떻게 성장하느냐가 더 큰 의미를 가진다는 메시지입니다.","hl":"mn"},{"n":30,"text":"what someone is born은 the circumstances of someone's birth로 풀어 쓸 수 있어요. what they grow to be는 the kind of person they become으로 바꾸면 뜻이 분명해집니다.","hl":"rw"},{"n":31,"text":"matter는 be important나 count로 바꿔 쓸 수 있고요, grow to be는 become으로 간단히 표현해요. be born은 come into the world로도 바꿀 수 있습니다.","hl":"ph"},{"n":32,"text":"전체를 바꾸면 What someone is born is not important, but what they become is가 돼요. 가주어와 not A but B를 정리하면서 같은 뜻을 유지한 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 \u003cspan class=\"fx\">It is the essence of scientific thinking to propose alternative ideas and then to test them against existing concepts\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It is the essence \u003c/div>\u003cdiv class=\"k\">본질이다\u003c/div>\u003cdiv class=\"e\">of scientific thinking \u003c/div>\u003cdiv class=\"k\">과학적 사고의\u003c/div>\u003cdiv class=\"e\">to propose alternative ideas \u003c/div>\u003cdiv class=\"k\">대안을 제시하고\u003c/div>\u003cdiv class=\"e\">and then \u003c/div>\u003cdiv class=\"k\">그런 다음에\u003c/div>\u003cdiv class=\"e\">to test them \u003c/div>\u003cdiv class=\"k\">그것을 시험하는 것은\u003c/div>\u003cdiv class=\"e\">against existing concepts.\u003c/div>\u003cdiv class=\"k\">기존 개념과 비교하여\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>가주어 \u003cb class=\"key\">It\u003c/b>이 \u003cb class=\"key\">and\u003c/b>로 이어진 두 개의 진주어 \u003cb class=\"key\">to propose\u003c/b> alternative ideas와 \u003cb class=\"key\">to test\u003c/b> them against existing concepts를 대신한다. to부정사 두 개가 병렬 연결되어 과학적 사고의 본질이 무엇인지 설명한다.\u003c/div>","segs":[{"n":33,"text":"It is the essence, 본질이다. of scientific thinking, 과학적 사고의. to propose alternative ideas, 대안을 제시하고. and then, 그런 다음에. to test them, 그것을 시험하는 것은. against existing concepts, 기존 개념과 비교하여","hl":"ch"},{"n":34,"text":"여섯 번째 문장의 It은 and로 연결된 to propose와 to test 이하를 대신하는 가주어입니다. 꼭 to부정사가 두 개 병렬로 오면서 과학적 사고의 본질이 무엇인지 설명해요. against existing concepts는 기존 개념과 대조하여라는 뜻이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 \u003cspan class=\"fx\">It is the essence of scientific thinking to propose alternative ideas and then to test them against existing concepts\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>과학적 사고의 본질은 대안 아이디어를 제안하고 그것을 기존 개념과 대조하여 시험하는 것이라는 뜻이에요. 과학자는 기존 지식을 그냥 받아들이지 않고 새로운 가능성을 세우고 검증한다는 점을 나타내요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to propose alternative ideas and then to test them against existing concepts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to suggest different ideas and then check them against current concepts\u003c/span>\u003cdiv class=\"w\">propose를 suggest로, alternative를 different로, existing을 current로 평이하게 바꾸었어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the essence of scientific thinking\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the core of scientific thought\u003c/span>\u003cdiv class=\"w\">essence를 core로, thinking을 thought로 바꿔도 같은 뜻이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">essence\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">core, key nature\u003c/span>\u003cspan class=\"y-eq\">essence = core\u003c/span>\u003cdiv class=\"w\">본질이라는 뜻으로 core나 key nature로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">propose\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">suggest, put forward\u003c/span>\u003cspan class=\"y-eq\">propose = suggest\u003c/span>\u003cdiv class=\"w\">제안하다라는 뜻으로 suggest나 put forward가 쓰여요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">alternative\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">different, substitute\u003c/span>\u003cspan class=\"y-eq\">alternative = different\u003c/span>\u003cdiv class=\"w\">대신하는 또는 다른의 뜻으로 different나 substitute로 바꿀 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The core of scientific thinking is to suggest different ideas and then test them against current concepts.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"과학적 사고의 본질은 대안 아이디어를 제안한 뒤 그것을 기존 개념과 비교하며 시험하는 것이라는 뜻이에요. 과학에서는 기존 지식을 의심하고 새로운 가능성을 검증하는 태도가 핵심이죠.","hl":"mn"},{"n":36,"text":"to propose alternative ideas를 to suggest different ideas로 바꾸고, existing concepts를 current concepts로 바꿔도 뜻이 같아요. essence는 core로 바꾸면 더 쉬운 표현이 됩니다.","hl":"rw"},{"n":37,"text":"essence는 core나 key nature로 바꿔 쓸 수 있고요, propose는 suggest나 put forward로 표현해요. alternative는 different나 substitute로 바꿀 수 있습니다.","hl":"ph"},{"n":38,"text":"전체를 바꾸면 The core of scientific thinking is to suggest different ideas and then test them against current concepts가 돼요. 주요 단어를 쉬운 동의어로 바꾸고 to부정사 주어를 그대로 살린 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 \u003cspan class=\"fx\">It was very careless of her to leave the medicine where the children could reach it\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It was very careless \u003c/div>\u003cdiv class=\"k\">아주 조심성이 없었다\u003c/div>\u003cdiv class=\"e\">of her \u003c/div>\u003cdiv class=\"k\">그녀가\u003c/div>\u003cdiv class=\"e\">to leave the medicine \u003c/div>\u003cdiv class=\"k\">약을 둔 것은\u003c/div>\u003cdiv class=\"e\">where \u003c/div>\u003cdiv class=\"k\">곳에\u003c/div>\u003cdiv class=\"e\">the children could reach it.\u003c/div>\u003cdiv class=\"k\">아이들이 그것에 손이 닿을 수 있는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>가주어 \u003cb class=\"key\">It\u003c/b>이 진주어 \u003cb class=\"key\">to leave\u003c/b> the medicine 이하를 대신한다. 앞에 사람의 성질 형용사 \u003cb class=\"key\">careless\u003c/b>가 왔으므로 to부정사의 의미상 주어를 \u003cb class=\"key\">of her\u003c/b>로 나타낸다. where절은 장소를 나타내는 부사절이다.\u003c/div>","segs":[{"n":39,"text":"It was very careless, 아주 조심성이 없었다. of her, 그녀가. to leave the medicine, 약을 둔 것은. where, 곳에. the children could reach it, 아이들이 그것에 손이 닿을 수 있는","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 It was very careless of her로 시작하고, It은 뒤에 오는 to leave 이하를 대신하는 가주어입니다. careless는 사람의 성질이나 태도를 나타내는 형용사라서 의미상 주어를 of her로 표시했어요. where 이하는 아이들이 약에 손이 닿을 수 있는 장소를 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 \u003cspan class=\"fx\">It was very careless of her to leave the medicine where the children could reach it\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>아이들이 약에 손이 닿을 수 있는 곳에 약을 두다니 그녀가 매우 부주의했다는 뜻이에요. careless처럼 사람의 성질이나 태도를 평가하는 형용사가 오면 의미상 주어를 of로 쓴다는 점이 중요해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">It was very careless of her to leave the medicine\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">She was very careless to leave the medicine\u003c/span>\u003cdiv class=\"w\">가주어 없이 의미상 주어를 주어로 내세워도 같은 뜻이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">where the children could reach it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">within the children's reach\u003c/span>\u003cdiv class=\"w\">장소 부사절을 전치사구로 압축하면 더 간결해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">careless\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">thoughtless, negligent\u003c/span>\u003cspan class=\"y-eq\">careless = thoughtless\u003c/span>\u003cdiv class=\"w\">부주의하다는 뜻으로 thoughtless나 negligent로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">leave\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">put, place\u003c/span>\u003cspan class=\"y-eq\">leave = put\u003c/span>\u003cdiv class=\"w\">어떤 장소에 두다라는 뜻으로 put이나 place가 쓰여요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">reach\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">get at, access\u003c/span>\u003cspan class=\"y-eq\">reach = access\u003c/span>\u003cdiv class=\"w\">손이 닿다라는 뜻으로 get at이나 access로 표현해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">She was very careless to put the medicine where the children could reach it.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"아이들이 손에 닿을 수 있는 곳에 약을 둔 그녀의 행동이 매우 부주의했다는 뜻이에요. 이 문장은 단순히 약의 위치가 문제가 아니라 아이가 약을 집을 수 있다는 위험 상황을 지적해요.","hl":"mn"},{"n":42,"text":"It was very careless of her to leave the medicine은 She was very careless to leave the medicine으로 바꿀 수 있어요. where the children could reach it을 within the children's reach로 압축해도 같은 뜻입니다.","hl":"rw"},{"n":43,"text":"careless는 thoughtless나 negligent로 바꿔 쓸 수 있고요, leave는 put이나 place로 표현해요. reach는 get at이나 access로 바꿀 수 있습니다.","hl":"ph"},{"n":44,"text":"전체를 바꾸면 She was very careless to put the medicine where the children could reach it가 돼요. 가주어를 없애고 의미상 주어를 주어로 내세운 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 With all the passion for being slim, \u003cspan class=\"fx\">it is no wonder that many people view any amount of visible fat on the body as something to get rid of\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">With all the passion \u003c/div>\u003cdiv class=\"k\">모든 열정으로\u003c/div>\u003cdiv class=\"e\">for being slim, \u003c/div>\u003cdiv class=\"k\">날씬해지고 싶은\u003c/div>\u003cdiv class=\"e\">it is no wonder \u003c/div>\u003cdiv class=\"k\">놀랄 일이 아니다\u003c/div>\u003cdiv class=\"e\">that many people view \u003c/div>\u003cdiv class=\"k\">많은 사람들이 여기는 것은\u003c/div>\u003cdiv class=\"e\">any amount of visible fat \u003c/div>\u003cdiv class=\"k\">눈에 보이는 지방이 얼마만큼이든\u003c/div>\u003cdiv class=\"e\">on the body \u003c/div>\u003cdiv class=\"k\">몸에 있는\u003c/div>\u003cdiv class=\"e\">as something \u003c/div>\u003cdiv class=\"k\">무언가로\u003c/div>\u003cdiv class=\"e\">to get rid of.\u003c/div>\u003cdiv class=\"k\">제거해야 할\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>가주어 \u003cb class=\"key\">It\u003c/b>이 \u003cb class=\"key\">that\u003c/b> 이하의 명사절 진주어를 대신한다. \u003cb class=\"key\">view A as B\u003c/b>는 A를 B로 여기다라는 뜻이며, \u003cb class=\"key\">to get rid of\u003c/b>는 something을 수식하는 형용사구이다.\u003c/div>","segs":[{"n":45,"text":"With all the passion, 모든 열정으로. for being slim, 날씬해지고 싶은. it is no wonder, 놀랄 일이 아니다. that many people view, 많은 사람들이 여기는 것은. any amount of visible fat, 눈에 보이는 지방이 얼마만큼이든. on the body, 몸에 있는. as something, 무언가로. to get rid of, 제거해야 할","hl":"ch"},{"n":46,"text":"여덟 번째 문장의 It은 that 이하의 명사절을 대신하는 가주어입니다. that절 안에 view A as B 구문이 있어서, 많은 사람들이 몸에 보이는 지방을 제거해야 할 것으로 여긴다는 뜻이 돼요. to get rid of는 something을 수식하는 형용사구예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 With all the passion for being slim, \u003cspan class=\"fx\">it is no wonder that many people view any amount of visible fat on the body as something to get rid of\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>날씬해지고 싶은 열정이 워낙 크다 보니, 많은 사람들이 몸에 보이는 지방을 어떤 양이든 제거해야 할 것으로 여기는 것이 놀랍지 않다는 뜻이에요. 지방에 대한 현대인의 강한 거부감을 나타내는 문장이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">view any amount of visible fat on the body as something to get rid of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regard any visible body fat as something to remove\u003c/span>\u003cdiv class=\"w\">view A as B를 regard A as B로 바꾸고 가운데 수식 표현을 압축했어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">With all the passion for being slim\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Because people are so passionate about being slim\u003c/span>\u003cdiv class=\"w\">with 부대상황을 because 절로 바꾸면 이유가 분명해져요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">no wonder\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">not surprising\u003c/span>\u003cspan class=\"y-eq\">no wonder = not surprising\u003c/span>\u003cdiv class=\"w\">놀랄 일이 아니다라는 뜻으로 not surprising으로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">view A as B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regard A as B, consider A to be B\u003c/span>\u003cspan class=\"y-eq\">view A as B = regard A as B\u003c/span>\u003cdiv class=\"w\">A를 B로 여기다라는 뜻으로 regard A as B나 consider A to be B로 표현해요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">get rid of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">remove, eliminate\u003c/span>\u003cspan class=\"y-eq\">get rid of = remove\u003c/span>\u003cdiv class=\"w\">제거하다라는 뜻으로 remove나 eliminate와 바꿔 est virtual reality technologies\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Using the newest VR technologies\u003c/span>\u003cdiv class=\"w\">with를 using으로 바꾸고 virtual reality를 VR로 축약해 더 간결하게 했어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">it is now possible for designers to create\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">designers can now create\u003c/span>\u003cdiv class=\"w\">가주어 구문을 능동태로 전환해 주어를 분명히 했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">latest\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">newest, most recent\u003c/span>\u003cspan class=\"y-eq\">latest = newest\u003c/span>\u003cdiv class=\"w\">최신이라는 뜻으로 newest나 most recent로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">virtual reality\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">VR, digital simulation\u003c/span>\u003cspan class=\"y-eq\">virtual reality = VR\u003c/span>\u003cdiv class=\"w\">가상현실은 VR로 줄이거나 digital simulation으로 풀어 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">possible\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">feasible, achievable\u003c/span>\u003cspan class=\"y-eq\">possible = feasible\u003c/span>\u003cdiv class=\"w\">가능하다는 뜻으로 feasible이나 achievable이 쓰여요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Using the latest virtual reality technology, designers can now create real-world situations in a digital environment.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"오늘날의 최신 가상현실 기술 덕분에 설계자들이 디지털 환경에서 실제 세계의 상황을 만들어내는 것이 이제 가능하다는 뜻이에요. 기술이 발전하면서 현실과 비슷한 가상 환경을 만들 수 있게 된 상황을 설명하죠.","hl":"mn"},{"n":66,"text":"With today's latest virtual reality technolo ster's, 수상의. resignation offer, 사직 의사가. is a serious one, 진지한 것인지. or, 아니면. whether it's simply, 단순히. a tactical move, 전술적인 조치인지는","hl":"ch"},{"n":70,"text":"열두 번째 문장의 It은 whether절 두 개를 대신하는 가주어예요. whether는 불확실한 내용을 이끄는 접속사이고, that은 확실한 내용을 이끌죠. 이 문장은 수상의 사직 의사가 진심인지 전술인지 불분명한 상황이므로 whether가 쓰였어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">It's not yet clear whether the Prime Minister's resignation offer is a serious one, or whether it's simply a tactical move\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>수상의 사직 의사가 진지한 것인지 아니면 단순히 전술적인 조치인지 아직 분명하지 않다는 뜻이에요. 정치인의 행동이 진심인지 전략인지 판단하기 어렵다는 내용을 가주어 it으로 표현한 문장이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whether the Prime Minister's resignation offer is a serious one\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">whether the Prime Minister seriously intends to resign\u003c/span>\u003cdiv class=\"w\">resignation offer를 동사 intend to resign으로 바꾸면 의도를 직접 드러내요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a tactical move\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a strategic maneuver\u003c/span>\u003cdiv class=\"w\">tactical move를 strategic maneuver로 바꾸면 전략적 행동이라는 뜻이 더 격식 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not yet clear\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">uncertain, still unclear\u003c/span>\u003cspan class=\"y-eq\">not yet clear = uncertain\u003c/span>\u003cdiv class=\"w\">아직 분명하지 않다는 뜻으로 uncertain이나 still unclear로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div
