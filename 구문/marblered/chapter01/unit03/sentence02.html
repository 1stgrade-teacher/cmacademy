 불운의 상징</small></div>\n        <div class=\"lec-cover-body\"><div class=\"lec-flow\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01미신의 정의</div><ul><li>사람들 사이에서 흔히 통용되는 미신의 개념을 소개한다.</li><li>핵심 소재: 미신 (superstition)</li><li>일반적인 믿음: 대중에게 널리 알려진 생각 (common)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02특정 조건의 발생</div><ul><li>미신이 성립하기 위한 구체적인 상황과 대상을 설정한다.</li><li>대상: 검은 고양이 (black cat)</li><li>행동: 누군가의 길을 가로지름 (crossing your path)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결과의 해석</div><ul><li>특정 상황이 발생했을 때 나타날 결과에 대해 정의한다.</li><li>결과의 성격: 불운 (bad luck)</li><li>상황과 운명을 연결 지어 부정적으로 인식함</li></ul></div></div></div>","<div class=\"lec-section-tag\">단어 정리</div><ul class=\"lec-voca-list\"><li><span class=\"w\">superstition</span> <span class=\"m\">미신</span></li><li><span class=\"w\">common</span> <span class=\"m\">흔한, 일반적인</span></li><li><span class=\"w\">cross one&#39;s path</span> <span class=\"m\">~의 앞을 가로지르다, ~와 마주치다</span></li><li><span class=\"w\">path</span> <span class=\"m\">길, 경로</span></li><li><span class=\"w\">bad luck</span> <span class=\"m\">불운</span></li></ul>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 흔한 미신이다</span><span class=\"en\"><b><span class=\"grammar-hl\">It is a common superstition</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">검은 고양이가</span><span class=\"en\"><b><span class=\"grammar-hl\">that a black cat</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 길을 가로지르는</span><span class=\"en\"><b><span class=\"grammar-hl\">crossing your path</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불운이라는 것은.</span><span class=\"en\"><b><span class=\"grammar-hl\">is bad luck</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신의 길을 가로지르는 검은 고양이가 불운이라는 것은 흔한 미신이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 서구 문화권에서 널리 알려진 특정 미신을 소개하며 글의 화두를 던지고 있습니다. 문법적으로는 &#39;It&#39;이 가주어, &#39;that&#39; 이하가 진주어인 구조를 취하고 있으며, &#39;superstition(미신)&#39;이라는 단어를 사용하여 이 믿음이 과학적 근거가 없는 사회적 통념임을 분명히 하고 있습니다. 검은 고양이라는 &#39;징조&#39;와 불운이라는 &#39;결과&#39;를 연결함으로써 사람들 사이에 전해 내려오는 인과관계의 오류를 보여주는 도입부 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is a common superstition that a black cat crossing your path is bad luck (가주어): 진주어: 문장의 실제 주어인 that절이 길어서 문장 끝으로 보내고, 주어 자리에 의미가 없는 가주어 It을 배치한 구조이다.</div><div class=\"lec-gr-item\">superstition that a black cat crossing your path is bad luck 동격의 that: 추상명사인 superstition 뒤에 그 구체적인 내용(검은 고양이가 길을 가로지르는 것은 불운이다)을 설명하는 that절이 이어진 명사 + that절 구조이다.</div><div class=\"lec-gr-item\">crossing your path (현재분사(형용사)): 현재분사구인 crossing your path가 앞의 명사인 a black cat을 수식하여 고양이가 하는 동작을 나타내며, 이는 a black cat that is crossing your path라는 축약 관계절 구조로 이해할 수 있다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">superstition</span> <span class=\"m\">미신</span></li><li><span class=\"w\">common</span> <span class=\"m\">흔한, 일반적인</span></li><li><span class=\"w\">path</span> <span class=\"m\">길, 경로</span></li><li><span class=\"w\">bad luck</span> <span class=\"m\">불운</span></li></ul>","<div class=\"lec-section-tag\">최종 정리</div>\n        <div class=\"lec-sum-body\">\n          <div class=\"lec-sum-text\">\n            <div class=\"lec-sent-en\">Although many people regard a black cat crossing their path as a sign of bad luck, it is merely a common superstition.</div>\n            <div class=\"lec-summary-line\">비록 많은 사람이 길을 가로지르는 검은 고양이를 불운의 징조로 여기지만, 그것은 단지 흔한 미신일 뿐이다.</div>\n            \n          </div>\n        </div>"],"segs":[[{"audio":"audio/sentence02_001.mp3","hl":null},{"audio":"audio/sentence02_002.mp3","hl":"stage-0"},{"audio":"audio/sentence02_003.mp3","hl":"stage-1"},{"audio":"audio/sentence02_004.mp3","hl":"stage-2"}],[{"audio":"audio/sentence02_005.mp3","hl":null}],[{"audio":"audio/sentence02_006.mp3","hl":"main"},{"audio":"audio/sentence02_007.mp3","hl":"meaning"},{"audio":"audio/sentence02_008.mp3","hl":"grammar"}],[{"audio":"audio/sentence02_009.mp3","hl":null}]]};var i=0,j=0,playing=false;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");try{el.scrollIntoView({block:"nearest"});}catch(_){}}}function setSeg(){fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg){a.removeAttribute("src");return;}applyHl(seg.hl);a.src=seg.audio||"";if(playing){a.play().catch(function(){});}}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=function(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{toggle();clearHl();}};show();</script></body></html>
