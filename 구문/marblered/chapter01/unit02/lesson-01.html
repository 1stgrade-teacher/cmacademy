  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"unit02","title":"마법같은 블록구문 실전편 unit02 명사절 주어","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편 Unit 02 명사절 주어\u003c/div>\u003ch1>마법같은 블록구문 실전편 - 명사절 주어\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>명사절 주어를 한 덩어리로 잡아 문장의 뼈대와 동사의 수를 정확히 파악한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"오늘은 명사절 주어 구문을 집중적으로 다룹니다. That, Whether, 의문사, What, Whoever, Whatever로 시작하는 절이 주어 자리에 오면 문장이 길어 보여도 한 덩어리로 묶어서 읽을 수 있어야 해요. 이 구문을 익히면 시험 지문에서 주어와 동사를 빠르게 찾는 힘이 생깁니다. 지금부터 열두 문장을 같이 분석해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 Unit 02 명사절 주어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">명사절 주어는 \u003cb class=\"key\">That/Whether/의문사\u003c/b> + 주어 + 동사 ... + V 형태로 온다. \u003cb class=\"key\">What\u003c/b>은 '~하는 것', \u003cb class=\"key\">Whatever\u003c/b>는 '~하는 것은 무엇이든', \u003cb class=\"key\">Whoever\u003c/b>는 '~하는 사람은 누구나'로 해석한다. 명사절 주어는 단수로 취급해 동사를 결정한다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">That some organisms must starve in nature\u003c/span> is deeply regrettable and sad.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">What works for most job seekers\u003c/span> is to look through their past experiences to help them build for the future.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 \u003cspan class=\"fx\">Whether an object floats on water\u003c/span> depends on the density of both the object and the water.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 When Stonehenge was built is known, but why it was built remains a mystery.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">Whatever is worth doing at all\u003c/span> is worth doing well.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">Whoever acquires knowledge but does not practice it\u003c/span> is as one who ploughs but does not sow.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 What we have done for ourselves alone dies with us; what we have done for others and the world remains and is immortal.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">How the universe began\u003c/span> is a fundamental question which has occupied the minds of men from prehistoric times.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">That witches caused disasters and misfortunes\u003c/span> was widely believed among early American settlers.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">What makes organisms different from the materials that compose them\u003c/span> is their level of organization.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">How successful we are at forming good relationships and how valued we feel by other people\u003c/span> make a big difference in how good we feel about ourselves.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">Whatever we expect with confidence\u003c/span> becomes our own self-fulfilling prophecy.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"명사절 주어는 절 전체를 주어로 보고 문장의 진짜 동사를 찾는 게 핵심입니다. What I dislike is being stuck in a traffic jam처럼 What으로 시작하는 덩어리가 주어 자리에 있으면 그 뒤 is를 찾아 끊어 읽으면 돼요. That이나 Whether, 의문사로 시작하는 경우도 마찬가지로 절 전체를 이름처럼 하나로 묶습니다. 이때 명사절 주어는 단수로 보고 동사를 고르는 연습을 해야 해요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">That some organisms must starve in nature\u003c/span> is deeply regrettable and sad.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">That some organisms \u003c/div>\u003cdiv class=\"k\">일부 유기체가\u003c/div>\u003cdiv class=\"e\">must starve in nature \u003c/div>\u003cdiv class=\"k\">자연에서 굶주려야 한다는 것은\u003c/div>\u003cdiv class=\"e\">is deeply regrettable and sad.\u003c/div>\u003cdiv class=\"k\">정말 유감스럽고 슬프다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">That\u003c/b>이 이끄는 명사절이 주어로 쓰였고, 절 전체가 단수 취급되어 동사 is가 온다. That절 주어는 문어체에서 자주 쓰이며 가주어-진주어로 바꿔 쓸 수 있다.\u003c/div>","segs":[{"n":3,"text":"That some organisms, 일부 유기체가. must starve in nature, 자연에서 굶주려야 한다는 것은. is deeply regrettable and sad, 정말 유감스럽고 슬프다","hl":"ch"},{"n":4,"text":"첫 번째 문장은 That some organisms must starve in nature가 주어입니다. That절 전체가 주어 자리에 있으니 동사 is와 묶어 읽고, 자연에서 일부 유기체가 굶주려야 한다는 것은 정말 유감스럽고 슬프다고 해석하면 돼요. That절 주어는 단수 취급해서 is로 받아야 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">That some organisms must starve in nature\u003c/span> is deeply regrettable and sad.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자연에서 일부 생물이 굶어야 한다는 사실 자체를 안타깝고 슬픈 일로 말하고 있어요. 과학이나 생태계를 다룰 때 반드시 굶어야만 하는 필연성을 강조하는 표현입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">must starve\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have to starve\u003c/span>\u003cdiv class=\"w\">must는 강한 필연성을, have to는 외부적 불가피함을 강조해 거의 같은 뜻으로 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is deeply regrettable and sad\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is very unfortunate and sad\u003c/span>\u003cdiv class=\"w\">regrettable을 unfortunate로 바꾸면 더 쉬운 어휘로 같은 유감의 느낌을 전해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">starve\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">go hungry\u003c/span>\u003cspan class=\"y-eq\">starve = go hungry\u003c/span>\u003cdiv class=\"w\">starve는 굶주리다, go hungry는 굶은 상태가 되다로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">regrettable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">unfortunate\u003c/span>\u003cspan class=\"y-eq\">regrettable = unfortunate\u003c/span>\u003cdiv class=\"w\">regrettable을 unfortunate로 바꾸면 더 쉬운 동의어로 뜻이 같아요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in nature\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in the natural world\u003c/span>\u003cspan class=\"y-eq\">in nature = in the natural world\u003c/span>\u003cdiv class=\"w\">nature를 the natural world로 풀면 자연 환경 전체를 가리켜요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">It is deeply regrettable and sad that some organisms must starve in nature.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 자연에서 일부 생물이 굶어야 하는 현실이 매우 안타깝다는 뜻이에요. 단순히 슬프다가 아니라 피할 수 없는 자연의 냉혹함을 담고 있죠. It is deeply regrettable and sad that 같은 가주어 진주어 구조로 바꿔 쓰면 더 부드러워요.","hl":"mn"},{"n":6,"text":"must starve는 have to starve로 바꿔도 뜻이 거의 같아요. regrettable은 unfortunate로 바꾸면 더 쉬운 단어로 같은 아쉬움을 전할 수 있고요. deeply라는 부사가 슬픔의 정도를 강조해 줘요.","hl":"rw"},{"n":7,"text":"starve는 go hungry로 바꿔 쓸 수 있고, regrettable은 unfortunate와 짝을 이뤄요. in nature는 in the natural world로 풀어 말해도 자연스럽습니다.","hl":"ph"},{"n":8,"text":"이 문장을 통째로 바꾸면 It is very unfortunate and sad that some organisms have to starve in nature라고 할 수 있어요. 뜻은 같지만 주어를 It으로 앞세워 더 자연스러운 영어 문장으로 만들었죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">What works for most job seekers\u003c/span> is to look through their past experiences to help them build for the future.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">What works for most job seekers \u003c/div>\u003cdiv class=\"k\">대부분의 구직자들에게 효과가 있는 것은\u003c/div>\u003cdiv class=\"e\">is to look through their past experiences \u003c/div>\u003cdiv class=\"k\">그들의 과거 경험을 살펴보는 것이다\u003c/div>\u003cdiv class=\"e\">to help them build for the future.\u003c/div>\u003cdiv class=\"k\">그들이 미래를 준비하는 것을 돕기 위해서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">What\u003c/b>이 이끄는 명사절이 주어이다. what은 여기서 '~하는 것'으로 해석되고, 절 전체가 단수이므로 동사 is가 온다.\u003c/div>","segs":[{"n":9,"text":"What works for most job seekers, 대부분의 구직자들에게 효과가 있는 것은. is to look through their past experiences, 그들의 과거 경험을 살펴보는 것이다. to help them build for the future, 그들이 미래를 준비하는 것을 돕기 위해서","hl":"ch"},{"n":10,"text":"두 번째 문장은 What works for most job seekers가 주어입니다. What절이 주어로 오면 우리말로는 ~하는 것이라고 해석하고, 전체를 하나의 이름처럼 취급해요. 그래서 동사 is를 찾아 그 뒤에 진짜 설명이 온다고 보면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 \u003cspan class=\"fx\">What works for most job seekers\u003c/span> is to look through their past experiences to help them build for the future.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>대부분의 구직자에게 통하는 방법은 자신의 과거 경험을 되돌아보는 것이라는 뜻이에요. 미래를 준비하기 위해 과거의 경험을 활용하라는 실용적인 조언입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">works for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is effective for\u003c/span>\u003cdiv class=\"w\">work for는 ~에게 효과가 있다, is effective for는 더 직접적으로 효과적임을 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">look through\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">review\u003c/span>\u003cdiv class=\"w\">look through는 훑어보다, review는 다시 검토하다로 비슷한 의미예요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">job seekers\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">people looking for work\u003c/span>\u003cspan class=\"y-eq\">job seekers = people looking for work\u003c/span>\u003cdiv class=\"w\">job seeker를 풀어 쓰면 구직 중인 사람이라는 뜻이 분명해져요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">look through\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">examine\u003c/span>\u003cspan class=\"y-eq\">look through = examine\u003c/span>\u003cdiv class=\"w\">examine은 좀 더 꼼꼼히 살펴본다는 뉘앙스를 더해요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">build for the future\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">prepare for the future\u003c/span>\u003cspan class=\"y-eq\">build for the future = prepare for the future\u003c/span>\u003cdiv class=\"w\">build for the future를 prepare for the future로 바꾸면 미래를 준비하다로 쉬워져요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">What is effective for most job seekers is to review their past experiences in order to prepare for the future.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 대부분의 구직자에게 효과가 있는 방법은 자기 과거 경험을 다시 살펴보는 것이라는 뜻이에요. 과거 경험이 미래를 준비하는 밑거름이 된다는 실용적인 조언을 담고 있죠.","hl":"mn"},{"n":12,"text":"works for는 is effective for로 바꿔 쓸 수 있어요. look through는 review로 바꾸면 같은 뜻이면서 좀 더 영어다운 표현이 됩니다. to help them build for the future에서 help 뒤에는 원형 부정사 build가 온다는 점도 기억하세요.","hl":"rw"},{"n":13,"text":"job seekers는 people looking for work로 풀어 쓸 수 있고요. look through는 examine로, build for the future는 prepare for the future로 바꿔 쓰면 시험 어휘 대비에 좋아요.","hl":"ph"},{"n":14,"text":"이 문장은 What is effective for most job seekers is to review their past experiences to prepare for the future라고 패러프레이징할 수 있어요. 전체 뜻은 그대로 두고 어휘만 평이하게 바꾼 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 \u003cspan class=\"fx\">Whether an object floats on water\u003c/span> depends on the density of both the object and the water.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Whether an object floats on water \u003c/div>\u003cdiv class=\"k\">어떤 물체가 물에 뜨는지는\u003c/div>\u003cdiv class=\"e\">depends on the density of both the object and the water.\u003c/div>\u003cdiv class=\"k\">그 물체와 물의 밀도에 달려 있다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Whether\u003c/b>가 이끄는 명사절이 주어이다. whether는 '~인지 아닌지'의 뜻으로 절을 이끌며, 명사절 주어로 쓰일 때 단수 동사 depends가 온다.\u003c/div>","segs":[{"n":15,"text":"Whether an object floats on water, 어떤 물체가 물에 뜨는지는. depends on the density of both the object and the water, 그 물체와 물의 밀도에 달려 있다","hl":"ch"},{"n":16,"text":"세 번째 문장은 Whether an object floats on water가 주어 역할을 합니다. Whether절은 ~인지 아닌지라는 뜻으로 명사절 주어가 될 수 있어요. 동사는 depends이고, on the density of both the object and the water가 뒤에서 조건을 설명해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 \u003cspan class=\"fx\">Whether an object floats on water\u003c/span> depends on the density of both the object and the water.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>어떤 물체가 물에 뜨는지 여부는 그 물체의 밀도와 물의 밀도에 달려 있다는 뜻이에요. 과학적 사실을 명사절 주어로 시작해 객관적으로 전달하는 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">floats on water\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stays afloat on water\u003c/span>\u003cdiv class=\"w\">float on water를 stays afloat on water로 바꾸면 같은 상황을 더 구체적으로 묘사해요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">depends on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is determined by\u003c/span>\u003cdiv class=\"w\">depends on이 ~에 달려 있다면, is determined by는 ~에 의해 결정된다로 인과를 더 강조해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">float\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">drift\u003c/span>\u003cspan class=\"y-eq\">float = drift\u003c/span>\u003cdiv class=\"w\">float는 물에 뜨다, drift는 천천히 떠다니다로 비슷한 뜻이지만 움직임이 더 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">depends on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">relies on\u003c/span>\u003cspan class=\"y-eq\">depends on = relies on\u003c/span>\u003cdiv class=\"w\">depend on을 rely on으로 바꾸면 의존하다로 더 강한 뉘앙스가 되어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">density\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">mass per volume\u003c/span>\u003cspan class=\"y-eq\">density = mass per volume\u003c/span>\u003cdiv class=\"w\">density를 mass per volume으로 풀면 밀도의 정의를 알려줘요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Whether an object floats on water is determined by the density of both the object and the water.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 어떤 물체가 물에 뜨는지 여부는 그 물체와 물의 밀도에 달려 있다는 뜻이에요. 과학 시간에 배우는 밀도 개념을 영어 문장으로 표현한 것이죠. Whether절을 주어로 쓰면 문어체에서 자주 보이는 패턴입니다.","hl":"mn"},{"n":18,"text":"float on water는 stays afloat on water로 바꿔 쓸 수 있어요. depends on은 is determined by로 바꾸면 밀도에 의해 결정된다는 뜻이 더 또렷해집니다.","hl":"rw"},{"n":19,"text":"float는 drift와 연결해 기억하면 좋아요. depends on은 relies on과 같은 뜻이고, density는 mass per volume으로 풀어 쓸 수 있어요.","hl":"ph"},{"n":20,"text":"전체 문장은 Whether an object floats on water is determined by the density of both the object and the water라고 바꿔 말할 수 있습니다. depends on을 is determined by로 바꾼 것뿐이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 When Stonehenge was built is known, but why it was built remains a mystery.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">When Stonehenge was built \u003c/div>\u003cdiv class=\"k\">언제 스톤헨지가 건설되었는지는\u003c/div>\u003cdiv class=\"e\">is known, \u003c/div>\u003cdiv class=\"k\">알려져 있다\u003c/div>\u003cdiv class=\"e\">but why it was built \u003c/div>\u003cdiv class=\"k\">그러나 왜 그것이 건설되었는지는\u003c/div>\u003cdiv class=\"e\">remains a mystery.\u003c/div>\u003cdiv class=\"k\">미스터리로 남아있다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>의문사 \u003cb class=\"key\">When\u003c/b>과 \u003cb class=\"key\">why\u003c/b>가 이끄는 간접의문문이 각각 주어 자리에 쓰였다. 간접의문문은 '의문사 + 주어 + 동사' 어순을 지켜야 한다.\u003c/div>","segs":[{"n":21,"text":"When Stonehenge was built, 언제 스톤헨지가 건설되었는지는. is known, 알려져 있다. but why it was built, 그러나 왜 그것이 건설되었는지는. remains a mystery, 미스터리로 남아있다","hl":"ch"},{"n":22,"text":"네 번째 문장은 When Stonehenge was built와 why it was built가 각각 주어로 쓰였어요. 간접의문문은 의문사 다음에 주어와 동사가 오는 어순이 핵심이에요. 앞 절은 is known, 뒤 절은 remains a mystery로 동사를 짝지어 읽으면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 When Stonehenge was built is known, but why it was built remains a mystery.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>스톤헨지가 언제 지어졌는지는 알려져 있지만, 왜 지어졌는지는 아직도 풀리지 않은 미스터리라는 뜻이에요. 건설 시기는 밝혀졌고 목적은 미궁에 빠져 있다는 대조를 보여줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">remains a mystery\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is still unknown\u003c/span>\u003cdiv class=\"w\">remains a mystery는 미스터리로 남아 있다, is still unknown은 아직 알려져 있지 않다로 같은 뜻이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is known\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has been found out\u003c/span>\u003cdiv class=\"w\">is known은 알려져 있다, has been found out은 밝혀졌다로 뜻이 통합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Stonehenge was built\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Stonehenge was constructed\u003c/span>\u003cspan class=\"y-eq\">built = constructed\u003c/span>\u003cdiv class=\"w\">build 대신 construct를 쓰면 더 격식 있는 어휘가 돼요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">remains a mystery\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stays a puzzle\u003c/span>\u003cspan class=\"y-eq\">remains a mystery = stays a puzzle\u003c/span>\u003cdiv class=\"w\">mystery를 puzzle로 바꾸면 수수께끼라는 뜻으로 비슷하게 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is known\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is acknowledged\u003c/span>\u003cspan class=\"y-eq\">is known = is acknowledged\u003c/span>\u003cdiv class=\"w\">known을 acknowledged로 바꾸면 학계에서 인정된 느낌을 더해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">It is known when Stonehenge was built, but the reason why it was built is still a mystery.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 스톤헨지의 건설 시기는 알려져 있지만 건설 목적은 아직도 미스터리라는 뜻이에요. 알려진 것과 알려지지 않은 것을 접속사 but으로 대조하고 있죠. 간접의문문 주어 두 개가 나란히 쓰인 좋은 예문입니다.","hl":"mn"},{"n":24,"text":"remains a mystery는 is still unknown으로 바꾸면 더 직설적으로 표현할 수 있어요. is known은 has been found out으로 바꾸면 밝혀졌다는 뜻이 강조됩니다.","hl":"rw"},{"n":25,"text":"Stonehenge was built에서 built는 constructed로 바꿔 쓸 수 있어요. remains a mystery는 stays a puzzle로, is known은 is acknowledged로 기억하면 어휘가 풍부해집니다.","hl":"ph"},{"n":26,"text":"이 문장을 자연스럽게 바꾸면 It is known when Stonehenge was built, but why it was built is still a mystery라고 할 수 있어요. 간접의문문 주어를 뒤로 보내고 It을 가주어로 쓴 형태입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 \u003cspan class=\"fx\">Whatever is worth doing at all\u003c/span> is worth doing well.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Whatever is worth doing at all \u003c/div>\u003cdiv class=\"k\">어쨌든 할 가치가 있는 것은 무엇이든\u003c/div>\u003cdiv class=\"e\">is worth doing well.\u003c/div>\u003cdiv class=\"k\">잘 할 가치가 있다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Whatever\u003c/b>가 이끄는 명사절이 주어이다. whatever는 '~하는 것은 무엇이든'으로 해석하며, 이 절이 단수 주어가 되어 동사 is를 받는다.\u003c/div>","segs":[{"n":27,"text":"Whatever is worth doing at all, 어쨌든 할 가치가 있는 것은 무엇이든. is worth doing well, 잘 할 가치가 있다","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 Whatever is worth doing at all이 주어입니다. Whatever는 ~하는 것은 무엇이든이라는 뜻으로 절을 이끌죠. 주어가 길어도 is worth doing well까지 오면 문장이 끝나니, 주어와 동사를 빠르게 묶어 읽어야 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 \u003cspan class=\"fx\">Whatever is worth doing at all\u003c/span> is worth doing well.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>어쨌든 한번 할 가치가 있는 일이라면 최선을 다해 잘해야 한다는 뜻이에요. 명언으로, 대충 하지 말고 제대로 하라는 교훈을 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is worth doing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">deserves to be done\u003c/span>\u003cdiv class=\"w\">be worth doing은 ~할 가치가 있다, deserves to be done은 ~할 자격이 있다로 의미가 비슷해요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at all\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in the first place\u003c/span>\u003cdiv class=\"w\">at all은 어쨌든, in the first place는 애당초라는 뜻으로 강조의 뉘앙스가 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">worth doing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">valuable to do\u003c/span>\u003cspan class=\"y-eq\">worth doing = valuable to do\u003c/span>\u003cdiv class=\"w\">be worth doing을 valuable to do로 바꾸면 더 쉬운 어휘로 뜻을 전해요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at all\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in any way\u003c/span>\u003cspan class=\"y-eq\">at all = in any way\u003c/span>\u003cdiv class=\"w\">at all을 in any way로 바꾸면 어떤 식으로든이라는 뜻이 돼요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If something is worth doing at all, it is worth doing well.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 어쨌든 할 가치가 있는 일이라면 제대로 잘해야 한다는 뜻이에요. 뭔가를 대충 하지 말고 최선을 다하라는 명언으로, 주어가 추상적이지만 메시지는 아주 분명해요.","hl":"mn"},{"n":30,"text":"is worth doing은 deserves to be done으로 바꿔 쓸 수 있어요. at all은 in the first place로 바꾸면 애당초라는 뜻이 더 살아납니다.","hl":"rw"},{"n":31,"text":"worth doing은 valuable to do로 풀어 쓸 수 있고요. at all은 in any way와 짝을 지어 기억하면 좋아요.","hl":"ph"},{"n":32,"text":"이 문장은 If something is worth doing at all, it is worth doing well이라고 바꿔 말할 수 있어요. Whatever절을 If 조건절로 전환해도 뜻은 똑같습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 \u003cspan class=\"fx\">Whoever acquires knowledge but does not practice it\u003c/span> is as one who ploughs but does not sow.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Whoever acquires knowledge \u003c/div>\u003cdiv class=\"k\">지식을 습득하지만\u003c/div>\u003cdiv class=\"e\">but does not practice it \u003c/div>\u003cdiv class=\"k\">그것을 실천하지 않는 사람은 누구나\u003c/div>\u003cdiv class=\"e\">is as one \u003c/div>\u003cdiv class=\"k\">사람과 같다\u003c/div>\u003cdiv class=\"e\">who ploughs but does not sow.\u003c/div>\u003cdiv class=\"k\">밭을 갈지만 씨를 뿌리지 않는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Whoever\u003c/b>가 이끄는 절이 주어로 쓰였고, '~하는 사람은 누구나'로 해석한다. as는 전치사로 '~처럼'이며, who 이하가 대명사 one을 수식하는 형용사절이다.\u003c/div>","segs":[{"n":33,"text":"Whoever acquires knowledge, 지식을 습득하지만. but does not practice it, 그것을 실천하지 않는 사람은 누구나. is as one, 사람과 같다. who ploughs but does not sow, 밭을 갈지만 씨를 뿌리지 않는","hl":"ch"},{"n":34,"text":"여섯 번째 문장은 Whoever acquires knowledge but does not practice it이 주어입니다. Whoever는 ~하는 사람은 누구나로 해석하고, 주어 속에 but이 있어도 절 전체를 한 덩어리로 봐야 해요. is as one who 이하가 주격 보어를 이룹니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 \u003cspan class=\"fx\">Whoever acquires knowledge but does not practice it\u003c/span> is as one who ploughs but does not sow.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>지식을 얻기만 하고 실천하지 않는 사람은 밭을 갈고도 씨를 뿌리지 않는 사람과 같다는 뜻이에요. 아는 것을 행동으로 옮기지 않으면 소용없다는 교훈을 비유적으로 전달합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">does not practice it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fails to put it into practice\u003c/span>\u003cdiv class=\"w\">practice를 put into practice로 바꾸면 실행하다는 뜻이 더 분명해져요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is as one who\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is like a person who\u003c/span>\u003cdiv class=\"w\">as one who는 one이 격식체 대명사, like a person who로 바꾸면 더 평이한 말투가 돼요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">acquires knowledge\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">gains knowledge\u003c/span>\u003cspan class=\"y-eq\">acquires = gains\u003c/span>\u003cdiv class=\"w\">acquire와 gain은 모두 얻다 뜻으로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">practices\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">puts into action\u003c/span>\u003cspan class=\"y-eq\">practices = puts into action\u003c/span>\u003cdiv class=\"w\">practice를 put into action으로 풀면 실행하다가 더 생생해져요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ploughs\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">tills\u003c/span>\u003cspan class=\"y-eq\">ploughs = tills\u003c/span>\u003cdiv class=\"w\">plough는 밭을 갈다, till도 밭을 갈다로 같은 뜻이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A person who gains knowledge but does not put it into action is like a farmer who tills the soil but does not plant seeds.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 지식을 얻기만 하고 실천하지 않는 사람은 밭을 갈고도 씨를 뿌리지 않는 사람과 같다는 뜻이에요. 배운 것을 행동으로 옮기지 않으면 아무 소용이 없다는 비유입니다.","hl":"mn"},{"n":36,"text":"does not practice it은 fails to put it into practice로 바꾸면 실행하지 않는다는 뜻이 강해져요. is as one who는 is like a person who로 바꾸면 더 쉬운 표현이 됩니다.","hl":"rw"},{"n":37,"text":"acquire는 gain과, practice는 put into action과 짝을 이뤄요. plough는 till로 바꿔 쓸 수 있고 sow는 씨를 뿌리다는 뜻이에요.","hl":"ph"},{"n":38,"text":"전체 문장은 A person who gains knowledge but does not put it into action is like a farmer who tills the soil but does not plant seeds라고 바꿔 말할 수 있습니다. Whoever 주어를 A person who로 전환해 뜻을 그대로 살렸어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 What we have done for ourselves alone dies with us; what we have done for others and the world remains and is immortal.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">What we have done for ourselves alone \u003c/div>\u003cdiv class=\"k\">우리가 우리 자신만을 위해서 해온 것은\u003c/div>\u003cdiv class=\"e\">dies with us; \u003c/div>\u003cdiv class=\"k\">우리와 함께 사라진다\u003c/div>\u003cdiv class=\"e\">what we have done for others and the world \u003c/div>\u003cdiv class=\"k\">우리가 다른 사람들과 세상을 위해서 해온 것은\u003c/div>\u003cdiv class=\"e\">remains and is immortal.\u003c/div>\u003cdiv class=\"k\">남아있고 영원하다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">What\u003c/b>이 이끄는 명사절이 두 개가 세미콜론으로 연결되어 각각 주어로 쓰였다. what은 '~하는 것'으로 해석하며, 첫 절은 단수 동사 dies, 둘째 절은 단수 동사 remains/is를 받는다.\u003c/div>","segs":[{"n":39,"text":"What we have done for ourselves alone, 우리가 우리 자신만을 위해서 해온 것은. dies with us, 우리와 함께 사라진다. what we have done for others and the world, 우리가 다른 사람들과 세상을 위해서 해온 것은. remains and is immortal, 남아있고 영원하다","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 What we have done for ourselves alone과 what we have done for others and the world가 각각 주어입니다. 세미콜론 앞뒤로 완전한 절이 대조되고 있어요. 첫 주어는 dies를, 둘째 주어는 remains를 받아서 읽으면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 What we have done for ourselves alone dies with us; what we have done for others and the world remains and is immortal.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자기 자신만을 위해 한 일은 죽음과 함께 사라지지만, 다른 사람과 세상을 위해 한 일은 남아 영원하다는 뜻이에요. 이기적인 행동보다 이타적인 행동이 가치 있다는 메시지를 전합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">for ourselves alone\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">only for ourselves\u003c/span>\u003cdiv class=\"w\">alone을 only로 바꾸면 오직의 뜻이 더 분명해져요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dies with us\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">comes to an end when we die\u003c/span>\u003cdiv class=\"w\">dies with us는 우리와 함께 죽는다, comes to an end when we die는 죽을 때 끝난다로 같은 뜻이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">for ourselves alone\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">for our own sake\u003c/span>\u003cspan class=\"y-eq\">for ourselves alone = for our own sake\u003c/span>\u003cdiv class=\"w\">alone을 for our own sake로 바꾸면 자신만을 위한이라는 뜻이 강조돼요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">immortal\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">everlasting\u003c/span>\u003cspan class=\"y-eq\">immortal = everlasting\u003c/span>\u003cdiv class=\"w\">immortal과 everlasting은 모두 영원한으로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">remains\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lasts\u003c/span>\u003cspan class=\"y-eq\">remains = lasts\u003c/span>\u003cdiv class=\"w\">remain을 last로 바꾸면 지속된다는 뜻이 되어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">What we have done only for ourselves disappears when we die, but what we have done for others and the world lasts forever.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 자기만을 위해 한 일은 죽음과 함께 사라지고, 남과 세상을 위해 한 일은 영원히 남는다는 뜻이에요. 이기적인 삶보다 이타적인 삶이 더 오래 가치를 지닌다는 메시지를 담고 있죠.","hl":"mn"},{"n":42,"text":"for ourselves alone은 only for ourselves로 바꿔 쓰면 더 쉽고 자연스러워요. dies with us는 comes to an end when we die로 풀어 말할 수 있습니다.","hl":"rw"},{"n":43,"text":"for ourselves alone은 for our own sake와 뜻이 통하고요. immortal은 everlasting으로, remains는 lasts로 바꿔 쓸 수 있습니다.","hl":"ph"},{"n":44,"text":"이 문장은 What we have done only for ourselves disappears when we die, but what we have done for others and the world lasts forever라고 패러프레이징할 수 있어요. 핵심 대조는 그대로 유지했죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 \u003cspan class=\"fx\">How the universe began\u003c/span> is a fundamental question which has occupied the minds of men from prehistoric times.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">How the universe began \u003c/div>\u003cdiv class=\"k\">우주가 어떻게 시작되었는가는\u003c/div>\u003cdiv class=\"e\">is a fundamental question \u003c/div>\u003cdiv class=\"k\">근본적인 질문이다\u003c/div>\u003cdiv class=\"e\">which has occupied the minds of men \u003c/div>\u003cdiv class=\"k\">사람들의 마음을 사로잡아 온\u003c/div>\u003cdiv class=\"e\">from prehistoric times.\u003c/div>\u003cdiv class=\"k\">선사시대부터\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>의문사 \u003cb class=\"key\">How\u003c/b>가 이끄는 명사절이 주어이다. 간접의문문 '의문사 + 주어 + 동사' 어순이 쓰였고, 관계대명사 which가 이끄는 형용사절이 보어 a fundamental question을 수식한다.\u003c/div>","segs":[{"n":45,"text":"How the universe began, 우주가 어떻게 시작되었는가는. is a fundamental question, 근본적인 질문이다. which has occupied the minds of men, 사람들의 마음을 사로잡아 온. from prehistoric times, 선사시대부터","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 How the universe began이 주어입니다. How는 우주가 어떻게 시작되었는가라는 간접의문문을 이끌죠. is a fundamental question이 주격 보어이고, which 이하가 question을 수식하는 관계대명사절입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 \u003cspan class=\"fx\">How the universe began\u003c/span> is a fundamental question which has occupied the minds of men from prehistoric times.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우주가 어떻게 시작되었는가는 선사시대부터 사람들의 마음을 사로잡아 온 근본적인 질문이라는 뜻이에요. 우주 기원 문제가 인류의 오랜 관심사임을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">has occupied the minds of men\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has fascinated people\u003c/span>\u003cdiv class=\"w\">occupy the minds는 마음을 사로잡다, fascinate는 매혹시키다로 비슷한 의미를 짧게 표현해요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">from prehistoric times\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">since prehistoric times\u003c/span>\u003cdiv class=\"w\">from은 시작 지점, since는 그때부터 지금까지라는 완료형과 어울리는 표현이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">began\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">originated\u003c/span>\u003cspan class=\"y-eq\">began = originated\u003c/span>\u003cdiv class=\"w\">begin 대신 originate를 쓰면 기원하다는 뜻이 더 학술적이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fundamental\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">basic\u003c/span>\u003cspan class=\"y-eq\">fundamental = basic\u003c/span>\u003cdiv class=\"w\">fundamental을 basic으로 바꾸면 더 쉬운 단어로 같은 뜻이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">occupied\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">engaged\u003c/span>\u003cspan class=\"y-eq\">occupied = engaged\u003c/span>\u003cdiv class=\"w\">occupy the mind를 engage the mind로 바꾸면 주의를 끌다가 되어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">How the universe originated is a basic question that has fascinated people since prehistoric times.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"이 문장은 우주의 시작이 선사시대부터 사람들의 마음을 사로잡아 온 근본적인 질문이라는 뜻이에요. 우주 기원에 대한 인간의 오랜 호기심을 간결하게 표현하고 있죠.","hl":"mn"},{"n":48,"text":"has occupied the minds of men은 has fascinated people로 바꾸면 더 짧고 현대적인 표현이 돼요. from prehistoric times는 since prehistoric times로 바꿔 현재완료와 자연스럽게 어울리게 할 수 있어요.","hl":"rw"},{"n":49,"text":"began은 originated로, fundamental은 basic으로, occupied는 engaged로 바꿔 쓸 수 있어요. prehistoric times는 선사시대라는 뜻으로 통째로 기억하면 좋아요.","hl":"ph"},{"n":50,"text":"이 문장을 바꾸면 How the universe originated is a basic question that has fascinated people since prehistoric times가 됩니다. 단어만 바꾸고 구조는 그대로 유지한 패러프레이징이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 \u003cspan class=\"fx\">That witches caused disasters and misfortunes\u003c/span> was widely believed among early American settlers.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">That witches caused disasters and misfortunes \u003c/div>\u003cdiv class=\"k\">마녀들이 재난과 불운을 초래했다는 것은\u003c/div>\u003cdiv class=\"e\">was widely believed \u003c/div>\u003cdiv class=\"k\">널리 믿어졌다\u003c/div>\u003cdiv class=\"e\">among early American settlers.\u003c/div>\u003cdiv class=\"k\">초기 미국 정착민들 사이에서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">That\u003c/b>이 이끄는 명사절이 주어 역할을 한다. 명사절은 단수로 취급하므로 수동태 동사 was believed가 단수로 쓰였다.\u003c/div>","segs":[{"n":51,"text":"That witches caused disasters and misfortunes, 마녀들이 재난과 불운을 초래했다는 것은. was widely believed, 널리 믿어졌다. among early American settlers, 초기 미국 정착민들 사이에서","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 That witches caused disasters and misfortunes가 주어입니다. That절이 주어로 오면 그 절 전체를 하나의 단수 명사로 보고 was believed로 받아야 해요. among early American settlers는 믿음이 퍼진 범위를 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 \u003cspan class=\"fx\">That witches caused disasters and misfortunes\u003c/span> was widely believed among early American settlers.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>초기 미국 정착민들 사이에서는 마녀가 재난과 불운을 일으킨다는 믿음이 널리 퍼져 있었다는 뜻이에요. 역사적 배경과 미신을 서술하는 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">was widely believed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">was a common belief\u003c/span>\u003cdiv class=\"w\">widely believed를 a common belief로 바꾸면 널리 믿는 생각이라는 뜻을 명사로 표현해요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">caused disasters and misfortunes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">brought about disasters and bad luck\u003c/span>\u003cdiv class=\"w\">cause를 bring about으로, misfortunes를 bad luck으로 바꾸면 더 평이한 어휘가 돼요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">caused\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">brought about\u003c/span>\u003cspan class=\"y-eq\">caused = brought about\u003c/span>\u003cdiv class=\"w\">cause를 bring about으로 바꾸면 야기하다의 뜻이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">misfortunes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">bad luck\u003c/span>\u003cspan class=\"y-eq\">misfortunes = bad luck\u003c/span>\u003cdiv class=\"w\">misfortune을 bad luck으로 바꾸면 불운을 더 쉽게 표현해요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">was widely believed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">was commonly thought\u003c/span>\u003cspan class=\"y-eq\">was widely believed = was commonly thought\u003c/span>\u003cdiv class=\"w\">widely believed를 commonly thought로 바꾸면 널리 생각되었다는 뜻이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">It was widely believed among early American settlers that witches brought about disasters and bad luck.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 초기 미국 정착민들 사이에서 마녀가 재난과 불행을 불러온다는 생각이 널리 믿었다는 뜻이에요. 당시 사람들의 미신과 역사적 배경을 보여주는 표현이죠.","hl":"mn"},{"n":54,"text":"was widely believed는 was a common belief로 바꾸면 같은 뜻을 명사형으로 표현할 수 있어요. caused disasters and misfortunes는 brought about disasters and bad luck으로 바꾸면 더 쉬워요.","hl":"rw"},{"n":55,"text":"cause는 bring about로, misfortune은 bad luck으로 바꿔 쓸 수 있고요. widely believed는 commonly thought와 짝을 이루어요.","hl":"ph"},{"n":56,"text":"이 문장은 It was widely believed among early American settlers that witches brought about disasters and bad luck으로 바꿀 수 있습니다. That절을 뒤로 보내고 It을 가주어로 쓴 더 자연스러운 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 \u003cspan class=\"fx\">What makes organisms different from the materials that compose them\u003c/span> is their level of organization.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">What makes organisms different \u003c/div>\u003cdiv class=\"k\">유기체들을 다르게 만드는 것은\u003c/div>\u003cdiv class=\"e\">from the materials that compose them \u003c/div>\u003cdiv class=\"k\">그것들을 구성하는 물질들과\u003c/div>\u003cdiv class=\"e\">is their level of organization.\u003c/div>\u003cdiv class=\"k\">그들의 구성의 수준이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">What\u003c/b>이 이끄는 명사절이 주어이다. what은 'The thing which'의 의미로 쓰였고, 주어 속에 관계대명사 that이 이끄는 형용사절이 포함되어 있다. 주어가 단수이므로 동사 is가 온다.\u003c/div>","segs":[{"n":57,"text":"What makes organisms different, 유기체들을 다르게 만드는 것은. from the materials that compose them, 그것들을 구성하는 물질들과. is their level of organization, 그들의 구성의 수준이다","hl":"ch"},{"n":58,"text":"열 번째 문장은 What makes organisms different from the materials that compose them이 주어입니다. What은 The thing which로 바꿔 생각하면 주어의 뜻이 분명해져요. 주어가 아무리 길어도 단수로 보고 is로 받아야 합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 \u003cspan class=\"fx\">What makes organisms different from the materials that compose them\u003c/span> is their level of organization.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>유기체를 그것을 이루는 물질과 다르게 만드는 것은 그 조직화 수준이라는 뜻이에요. 생명체의 특성이 단순한 물질 조합이 아니라 조직의 복잡성에 있다는 생물학적 통찰을 전달합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">different from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">distinct from\u003c/span>\u003cdiv class=\"w\">different from을 distinct from으로 바꾸면 뚜렷이 구별된다는 뜻이 강조돼요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the materials that compose them\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the substances that make them up\u003c/span>\u003cdiv class=\"w\">compose를 make up으로 바꾸면 구성하다의 뜻을 더 평이하게 표현해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">compose\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make up\u003c/span>\u003cspan class=\"y-eq\">compose = make up\u003c/span>\u003cdiv class=\"w\">compose와 make up은 모두 구성하다로 자주 쓰여요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">level of organization\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">degree of complexity\u003c/span>\u003cspan class=\"y-eq\">level of organization = degree of complexity\u003c/span>\u003cdiv class=\"w\">organization을 complexity로 바꾸면 구성의 복잡성이라는 뜻이 살아나요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">organisms\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">living things\u003c/span>\u003cspan class=\"y-eq\">organisms = living things\u003c/span>\u003cdiv class=\"w\">organism을 living things로 바꾸면 살아 있는 것이라는 쉬운 표현이 돼요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">What makes living things different from the substances that make them up is their degree of complexity.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 유기체를 단순한 물질과 다르게 만드는 것은 조직화 수준이라는 뜻이에요. 같은 원자로 이루어져 있어도 생명체는 고도로 조직되어 있다는 점을 강조하죠.","hl":"mn"},{"n":60,"text":"different from은 distinct from으로 바꾸면 차이가 더 뚜렷하다는 느낌을 줘요. the materials that compose them은 the substances that make them up으로 바꿔 쓰면 더 쉽습니다.","hl":"rw"},{"n":61,"text":"compose는 make up과 혼동 없이 연결해 두고요. level of organization은 degree of complexity로, organisms는 living things로 바꾸면 뜻이 잘 통합니다.","hl":"ph"},{"n":62,"text":"이 문장은 What makes living things different from the substances that make them up is their degree of complexity라고 바꿔 말할 수 있어요. 단어를 쉬운 말로 바꾸면서 구조는 유지한 패러프레이징입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 \u003cspan class=\"fx\">How successful we are at forming good relationships and how valued we feel by other people\u003c/span> make a big difference in how good we feel about ourselves.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">How successful we are at forming good relationships \u003c/div>\u003cdiv class=\"k\">우리가 좋은 관계를 형성하는 데 얼마나 성공적인지\u003c/div>\u003cdiv class=\"e\">and how valued we feel by other people \u003c/div>\u003cdiv class=\"k\">그리고 우리가 다른 사람들에 의해 얼마나 소중하다고 느끼는지는\u003c/div>\u003cdiv class=\"e\">make a big difference \u003c/div>\u003cdiv class=\"k\">큰 차이를 만든다\u003c/div>\u003cdiv class=\"e\">in how good we feel about ourselves.\u003c/div>\u003cdiv class=\"k\">우리가 스스로에 대해 얼마나 훌륭하다고 느끼는지에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>의문사 \u003cb class=\"key\">How\u003c/b>가 이끄는 두 개의 명사절이 등위접속사 and로 연결되어 주어로 쓰였다. 두 주어가 합쳐져 복수 취급되므로 동사 make가 온다. 간접의문문이므로 'How + 주어 + 동사' 어순을 지킨다.\u003c/div>","segs":[{"n":63,"text":"How successful we are at forming good relationships, 우리가 좋은 관계를 형성하는 데 얼마나 성공적인지. and how valued we feel by other people, 그리고 우리가 다른 사람들에 의해 얼마나 소중하다고 느끼는지는. make a big difference, 큰 차이를 만든다. in how good we feel about ourselves, 우리가 스스로에 대해 얼마나 훌륭하다고 느끼는지에","hl":"ch"},{"n":64,"text":"열한 번째 문장은 How successful we are at forming good relationships와 how valued we feel by other people이 and로 연결된 주어입니다. How절 두 개가 합쳐져 복수 주어로 사용됐기 때문에 동사 make가 왔어요. 간접의문문 어순을 잘 지켜야 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 \u003cspan class=\"fx\">How successful we are at forming good relationships and how valued we feel by other people\u003c/span> make a big difference in how good we feel about ourselves.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>좋은 관계를 얼마나 잘 형성하는지, 다른 사람에게 소중한 존재로 느껴지는지가 우리가 자신에 대해 얼마나 긍정적으로 느끼는지에 큰 영향을 준다는 뜻이에요. 관계와 인정이 자존감에 중요하다는 심리학적 내용입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make a big difference\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">greatly affect\u003c/span>\u003cdiv class=\"w\">make a big difference를 greatly affect로 바꾸면 큰 영향을 미치다를 한 단어로 표현해요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">how good we feel about ourselves\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">our self-esteem\u003c/span>\u003cdiv class=\"w\">how good we feel about ourselves를 self-esteem으로 바꾸면 자존감이라는 개념을 간결하게 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">forming good relationships\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">building good relationships\u003c/span>\u003cspan class=\"y-eq\">forming = building\u003c/span>\u003cdiv class=\"w\">form과 build 모두 관계를 만들다라는 뜻으로 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">valued\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">appreciated\u003c/span>\u003cspan class=\"y-eq\">valued = appreciated\u003c/span>\u003cdiv class=\"w\">valued와 appreciated는 소중한, 가치를 인정받는으로 비슷해요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make a big difference\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">matter a lot\u003c/span>\u003cspan class=\"y-eq\">make a big difference = matter a lot\u003c/span>\u003cdiv class=\"w\">make a big difference를 matter a lot으로 바꾸면 중요하다는 뜻이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">How well we build good relationships and how appreciated we feel by other people greatly affect our self-esteem.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 좋은 관계를 잘 맺는 정도와 다른 사람에게 소중하게 느껴지는 정도가 우리 자신을 긍정적으로 보는 데 크게 영향을 준다는 뜻이에요. 대인 관계와 인정이 자존감을 좌우한다는 심리적 통찰이 담겨 있어요.","hl":"mn"},{"n":66,"text":"make a big difference는 greatly affect로 바꾸면 더 간결해져요. how good we feel about ourselves는 our self-esteem으로 바꾸면 자존감이라는 뜻이 명확해집니다.","hl":"rw"},{"n":67,"text":"forming good relationships에서 forming은 building으로 바꿀 수 있고요. valued는 appreciated, make a big difference는 matter a lot으로 바꿔 쓸 수 있어요.","hl":"ph"},{"n":68,"text":"이 문장은 How well we build good relationships and how appreciated we feel by other people greatly affect our self-esteem이라고 패러프레이징할 수 있습니다. 어휘만 바꿔서 같은 의미를 전달하죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">Whatever we expect with confidence\u003c/span> becomes our own self-fulfilling prophecy.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Whatever we expect with confidence \u003c/div>\u003cdiv class=\"k\">자신감을 가지고 우리가 기대하는 것은 무엇이든\u003c/div>\u003cdiv class=\"e\">becomes our own self-fulfilling prophecy.\u003c/div>\u003cdiv class=\"k\">우리 자신의 자기 충족적 예언이 된다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Whatever\u003c/b>가 이끄는 명사절이 주어이다. whatever는 '~하는 것은 무엇이든'으로 해석한다. However는 부사절을 이끌어 주어가 될 수 없으므로 Whatever를 써야 한다.\u003c/div>","segs":[{"n":69,"text":"Whatever we expect with confidence, 자신감을 가지고 우리가 기대하는 것은 무엇이든. becomes our own self-fulfilling prophecy, 우리 자신의 자기 충족적 예언이 된다","hl":"ch"},{"n":70,"text":"열두 번째 문장은 Whatever we expect with confidence가 주어입니다. Whatever가 이끄는 명사절은 주어 역할이 가능하지만 However는 부사절을 이끌기 때문에 주어 자리에 쓸 수 없어요. becomes가 문장의 진짜 동사입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">Whatever we expect with confidence\u003c/span> becomes our own self-fulfilling prophecy.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리가 자신 있게 기대하는 것은 무엇이든 결국 자기 충족적 예언이 된다는 뜻이에요. 긍정적인 기대가 실제 결과를 만든다는 심리학 개념을 설명합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">with confidence\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">confidently\u003c/span>\u003cdiv class=\"w\">with confidence를 confidently로 바꾸면 부사 한 단어로 같은 뜻을 표현해요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">becomes our own self-fulfilling prophecy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">turns into our own self-fulfilling prediction\u003c/span>\u003cdiv class=\"w\">becomes를 turns into로, prophecy를 prediction으로 바꾸면 더 평이한 어휘가 돼요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">expect\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">anticipate\u003c/span>\u003cspan class=\"y-eq\">expect = anticipate\u003c/span>\u003cdiv class=\"w\">expect와 anticipate는 모두 기대하거나 예상하다의 뜻이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">with confidence\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">confidently\u003c/span>\u003cspan class=\"y-eq\">with confidence = confidently\u003c/span>\u003cdiv class=\"w\">with confidence는 confidently로 한 단어 부사로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">self-fulfilling prophecy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">self-created outcome\u003c/span>\u003cspan class=\"y-eq\">self-fulfilling prophecy = self-created outcome\u003c/span>\u003cdiv class=\"w\">self-fulfilling prophecy를 self-created outcome으로 풀면 스스로 만들어 낸 결과라는 뜻이 돼요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Whatever we confidently expect turns into our own self-created prediction.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 자신 있게 기대하는 것은 무엇이든 우리 자신의 자기 충족적 예언이 된다는 뜻이에요. 기대가 행동을 바꾸고 그 행동이 결과를 만들어 낸다는 심리학 개념을 담고 있죠.","hl":"mn"},{"n":72,"text":"with confidence는 confidently로 바꾸면 더 간결합니다. becomes our own self-fulfilling prophecy는 turns into our own self-fulfilling prediction으로 바꿔 쓸 수 있어요.","hl":"rw"},{"n":73,"text":"expect는 anticipate와, with confidence는 confidently와 짝을 이뤄요. self-fulfilling prophecy는 self-created outcome으로 풀어 말하면 뜻이 더 쉬워집니다.","hl":"ph"},{"n":74,"text":"이 문장은 Whatever we confidently expect turns into our own self-created prediction이라고 바꿔 말할 수 있어요. 뜻은 같고 어휘만 평이하게 조정한 문장입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 Unit 02 명사절 주어\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>명사절 주어는 \u003cb class=\"key\">That/Whether/의문사\u003c/b> + 주어 + 동사 ... + V 형태로 한 덩어리로 읽는다.\u003c/li>\u003cli>\u003cb class=\"key\">What\u003c/b>은 '~하는 것', \u003cb class=\"key\">Whatever\u003c/b>는 '~하는 것은 무엇이든', \u003cb class=\"key\">Whoever\u003c/b>는 '~하는 사람은 누구나'로 해석한다.\u003c/li>\u003cli>명사절 주어는 단수 취급이 기본이지만, and로 연결된 두 개의 절은 복수 동사를 받을 수 있다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 명사절 주어를 집중적으로 연습했어요. That, Whether, 의문사로 시작하는 절은 무엇을 말하는지 먼저 묶고 진짜 동사를 찾는 것이 핵심입니다. What은 ~하는 것, Whatever는 ~하는 것은 무엇이든, Whoever는 ~하는 사람은 누구나로 해석하세요. 오늘 배운 열두 문장을 소리 내어 여러 번 읽으면서 주어와 동사의 호흡을 익혀 보세요. 다음 시간에는 더 재미있는 구문으로 돌아올게요.","hl":"sum"}]}]});</script></body></html>
