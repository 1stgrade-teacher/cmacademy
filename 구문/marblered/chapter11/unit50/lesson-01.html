  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

lecturePlayer(document.getElementById("app"),{"brand":"unit50","title":"어순을 뒤집어 강조하는 도치와 전치 구문","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">도치와 강조 어순\u003c/div>\u003ch1>어순을 뒤집어 강조하는 도치와 전치 구문\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>부정어·so·such·목적어가 앞으로 나올 때의 어순을 익혀 긴 문장을 정확히 해석한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 영어 문장에서 어순이 뒤집히는 도치 구문과 목적어가 앞으로 나오는 전치 구문을 함께 배워 볼 거예요. 이런 구문은 시험에서 문장 구조를 묻는 문제로 자주 나오기 때문에 앞부분의 신호어를 빨리 알아차리는 것이 중요해요. 오늘 예문은 모두 같은 원리로 어순이 바뀐 문장들이니 차근차근 끊어 읽으며 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">도치와 강조 어순\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">\u003cb class=\"key\">부정어\u003c/b>나 \u003cb class=\"key\">neither\u003c/b>, \u003cb class=\"key\">nor\u003c/b>, \u003cb class=\"key\">so\u003c/b>, \u003cb class=\"key\">such\u003c/b>가 문장 앞에 오면 조동사나 be동사가 주어 앞으로 이동하는 \u003cb class=\"key\">도치\u003c/b>가 일어납니다. 또한 \u003cb class=\"key\">목적어\u003c/b>를 강조하려고 문장 앞으로 보내면 주어와 동사의 순서가 헷갈릴 수 있으므로, 앞에 나온 목적어를 먼저 잡고 뒤에서 동사를 찾아야 합니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 The present moment does not exist in the equations of physics, and therefore \u003cspan class=\"fx\">neither does the flow of time\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">What the caterpillar calls the end of the world\u003c/span> the world calls a butterfly.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 \u003cspan class=\"fx\">Such was the power of his voice that\u003c/span> even those at the back of the room gazed at the speaker in awe.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Philosophy, which is understood to be the desire to acquire wisdom, is a fundamental part of the human being, \u003cspan class=\"fx\">and so is science\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 The release of atomic energy has not created a new problem. It has merely \u003cspan class=\"fx\">made more urgent the necessity of solving an existing one\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">So closely is sniffing tied to odor perception that\u003c/span> people routinely sniff when they are asked to imagine a smell.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 People often say that motivation doesn't last. Well, \u003cspan class=\"fx\">neither does bathing\u003c/span>— that's why we recommend it daily.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 We carry home what we have bought in some vessel, but \u003cspan class=\"fx\">learning we cannot put in any other vessel but our minds\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 How on earth are you ever going to explain in terms of chemistry and physics \u003cspan class=\"fx\">so important a biological phenomenon as first love\u003c/span>?\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">So quickly did he rush out of the office that\u003c/span> he forgot to lock up and set the alarm.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Unlike animals, plants cannot pick up their roots and race for safety. \u003cspan class=\"fx\">Nor have many plants taken the offensive and become predators\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">The large part of our thoughts and feelings that we do not know and cannot control\u003c/span> Sigmund Freud called the unconscious.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 핵심 규칙부터 볼게요. 부정어나 neither, nor, so, such 같은 표현이 문장 앞에 오면 조동사나 be동사가 주어 앞으로 이동하는 도치가 일어나요. 또 목적어를 강조하려고 문장 앞으로 보내는 경우에는 앞에 나온 덩어리를 목적어로 잡고 뒤에서 주어와 동사를 찾아야 해요. 그래서 이런 문장은 첫 단어를 보는 순간 어순이 바뀌었다는 신호를 알아차리는 것이 가장 중요합니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 The present moment does not exist in the equations of physics, and therefore \u003cspan class=\"fx\">neither does the flow of time\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The present moment \u003c/div>\u003cdiv class=\"k\">현재의 순간은\u003c/div>\u003cdiv class=\"e\">does not exist \u003c/div>\u003cdiv class=\"k\">존재하지 않는다\u003c/div>\u003cdiv class=\"e\">in the equations of physics, \u003c/div>\u003cdiv class=\"k\">물리학의 방정식 안에\u003c/div>\u003cdiv class=\"e\">and therefore \u003c/div>\u003cdiv class=\"k\">그러므로\u003c/div>\u003cdiv class=\"e\">neither does the flow of time.\u003c/div>\u003cdiv class=\"k\">시간의 흐름도 그렇지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">neither\u003c/b>가 문장 앞에 와서 '~도 아니다'를 나타내며, \u003cb class=\"key\">조동사 does\u003c/b>가 주어 \u003cb class=\"key\">the flow of time\u003c/b> 앞으로 이동한 \u003cb class=\"key\">도치\u003c/b>입니다. 앞 절의 부정 내용을 이어받아 시간의 흐름도 존재하지 않는다는 뜻을 만듭니다.\u003c/div>","segs":[{"n":3,"text":"The present moment, 현재의 순간은. does not exist, 존재하지 않는다. in the equations of physics, 물리학의 방정식 안에. and therefore, 그러므로. neither does the flow of time, 시간의 흐름도 그렇지 않다.","hl":"ch"},{"n":4,"text":"첫 번째 문장을 볼게요. 앞 절에서 현재의 순간이 물리학 방정식에 존재하지 않는다고 말하고 therefore 뒤에서 neither does the flow of time으로 이어 줍니다. 여기서 neither가 앞에 나오면서 does가 주어 the flow of time 앞으로 이동한 도치가 일어난 거예요. 해석할 때는 시간의 흐름도 역시 존재하지 않는다고 자연스럽게 연결해 주면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 The present moment does not exist in the equations of physics, and therefore \u003cspan class=\"fx\">neither does the flow of time\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>물리학의 방정식에는 현재라는 순간 자체가 없으므로, 시간이 흐른다는 개념도 방정식 안에서는 자연스럽게 설명되지 않는다는 뜻입니다. 쉽게 말해 현재라는 것도 시간의 흐름도 물리 공식에는 들어 있지 않다는 거예요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">and therefore neither does the flow of time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">and for that reason the flow of time does not exist there either\u003c/span>\u003cdiv class=\"w\">neither 도치를 일반 어순으로 풀어 쓴 표현입니다. therefore는 for that reason으로 바꾸어 이유의 연결을 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The present moment\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the here and now\u003c/span>\u003cspan class=\"y-eq\">the present moment = the here and now\u003c/span>\u003cdiv class=\"w\">현재의 순간을 일상적인 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">does not exist\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is absent\u003c/span>\u003cspan class=\"y-eq\">exist = be present\u003c/span>\u003cdiv class=\"w\">존재하지 않다를 없다, 결여되어 있다는 뜻으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the flow of time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the passage of time\u003c/span>\u003cspan class=\"y-eq\">the flow of time = the passage of time\u003c/span>\u003cdiv class=\"w\">시간이 흐르는 개념을 명사구로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Physics equations contain no present moment, so they also contain no passage of time.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 물리학 공식 안에는 현재라는 순간도 없고 시간이 흐른다는 개념도 없다는 뜻이에요. 조금 어렵게 들리지만 쉽게 말하면 물리 방정식만으로는 시간의 흐름을 설명하기 어렵다는 이야기죠. 그래서 neither 이하를 시간의 흐름도 마찬가지로 존재하지 않는다고 받아들이면 됩니다.","hl":"mn"},{"n":6,"text":"표현을 바꿔 볼까요. neither does the flow of time은 the flow of time does not exist there either로 풀어 쓸 수 있어요. 이렇게 바꾸면 도치를 풀어 일반 어순으로 만들 수 있고 뜻은 그대로 유지됩니다.","hl":"rw"},{"n":7,"text":"어구도 정리해 볼게요. the present moment는 the here and now로 바꿀 수 있고 does not exist는 is absent로 바꿀 수 있어요. the flow of time은 the passage of time과 같은 뜻으로 기억해 두면 좋습니다.","hl":"ph"},{"n":8,"text":"이제 같은 뜻의 문장을 들어 볼게요. Physics equations contain no present moment, so they also contain no passage of time. 물리학 방정식에는 현재의 순간이 없고 따라서 시간의 흐름도 없다는 뜻으로 원문과 같은 내용입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">What the caterpillar calls the end of the world\u003c/span> the world calls a butterfly.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">What the caterpillar calls the end of the world \u003c/div>\u003cdiv class=\"k\">애벌레가 세상의 종말이라고 부르는 것은\u003c/div>\u003cdiv class=\"e\">the world calls \u003c/div>\u003cdiv class=\"k\">세상은 부른다\u003c/div>\u003cdiv class=\"e\">a butterfly.\u003c/div>\u003cdiv class=\"k\">나비라고.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">What\u003c/b>절이 '애벌레가 세상의 종말이라고 부르는 것'이라는 \u003cb class=\"key\">목적어\u003c/b>로 문장 앞에 전치되었고, 뒤의 \u003cb class=\"key\">the world calls\u003c/b>의 목적어로 이어집니다. 원래 어순은 the world calls what the caterpillar calls the end of the world a butterfly입니다.\u003c/div>","segs":[{"n":9,"text":"What the caterpillar calls the end of the world, 애벌레가 세상의 종말이라고 부르는 것은. the world calls, 세상은 부른다. a butterfly, 나비라고.","hl":"ch"},{"n":10,"text":"두 번째 문장을 볼게요. 앞부분의 What the caterpillar calls the end of the world는 애벌레가 세상의 종말이라고 부르는 것이라는 목적어 덩어리예요. 이 목적어가 문장 앞으로 전치되었고 뒤에서 the world calls a butterfly가 세상은 그것을 나비라고 부른다는 뜻을 완성합니다. 그래서 앞의 what절을 먼저 목적어로 잡고 뒤의 주어와 동사를 찾는 것이 핵심입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 \u003cspan class=\"fx\">What the caterpillar calls the end of the world\u003c/span> the world calls a butterfly.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>같은 대상도 보는 관점에 따라 다르게 불린다는 뜻입니다. 애벌레에게는 세상의 종말이지만 세상은 그것을 나비라고 부르는 것이죠. 끝이라고 생각한 것이 다른 관점에서는 새로운 시작이나 아름다운 것으로 보일 수 있다는 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">What the caterpillar calls the end of the world the world calls a butterfly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The world calls a butterfly what the caterpillar calls the end of the world\u003c/span>\u003cdiv class=\"w\">전치된 목적어를 뒤로 보내 일반 어순으로 바꾼 표현입니다. 뜻은 그대로이면서 주어와 동사의 위치가 분명해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">calls the end of the world\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regards as the end of the world\u003c/span>\u003cspan class=\"y-eq\">call A B = regard A as B\u003c/span>\u003cdiv class=\"w\">call 목적어 목적격 보어 구조를 regard as 구조로 바꾸어 같은 판단을 나타냈습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the end of the world\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the end of everything\u003c/span>\u003cspan class=\"y-eq\">the end of the world = the end of everything\u003c/span>\u003cdiv class=\"w\">종말의 의미를 일상적으로 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the world calls\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">others see it as\u003c/span>\u003cspan class=\"y-eq\">the world = others\u003c/span>\u003cdiv class=\"w\">세상이라는 표현을 사람들 일반으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The world calls a butterfly what the caterpillar calls the end of the world.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 같은 대상도 보는 관점에 따라 다르게 불린다는 뜻이에요. 애벌레에게는 세상의 끝이지만 사람이 사는 세상에서는 나비가 되는 것이죠. 쉽게 말해 끝이라고 생각한 것이 다른 관점에서는 새로운 시작이나 아름다운 것으로 보일 수 있다는 메시지입니다.","hl":"mn"},{"n":12,"text":"표현을 바꿔 볼까요. 원문은 목적어를 앞에 두었지만 The world calls a butterfly what the caterpillar calls the end of the world라고 하면 일반 어순이 됩니다. 뜻은 세상은 애벌레가 종말이라고 부르는 것을 나비라고 부른다는 그대로예요.","hl":"rw"},{"n":13,"text":"어구도 정리해 볼게요. calls the end of the world는 regards as the end of the world로 바꿀 수 있고 the end of the world는 the end of everything으로 풀어 쓸 수 있어요. the world calls는 others see it as라는 표현으로 바꾸어 이해할 수 있습니다.","hl":"ph"},{"n":14,"text":"같은 뜻의 문장을 들어 볼게요. The world calls a butterfly what the caterpillar calls the end of the world. 애벌레가 세상의 종말이라고 부르는 것을 세상은 나비라고 부른다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 \u003cspan class=\"fx\">Such was the power of his voice that\u003c/span> even those at the back of the room gazed at the speaker in awe.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Such was the power of his voice \u003c/div>\u003cdiv class=\"k\">그의 목소리의 힘은 너무나 대단해서\u003c/div>\u003cdiv class=\"e\">that even those at the back of the room \u003c/div>\u003cdiv class=\"k\">방 뒤쪽에 있는 사람들조차도\u003c/div>\u003cdiv class=\"e\">gazed at the speaker in awe.\u003c/div>\u003cdiv class=\"k\">그 연사를 경탄하며 응시했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Such\u003c/b>가 보어로 문장 앞에 나와 \u003cb class=\"key\">was\u003c/b>가 주어 \u003cb class=\"key\">the power of his voice\u003c/b> 앞으로 이동한 도치입니다. \u003cb class=\"key\">that\u003c/b>절은 '너무 ~해서 ...했다'라는 결과를 나타냅니다.\u003c/div>","segs":[{"n":15,"text":"Such was the power of his voice, 그의 목소리의 힘은 너무나 대단해서. that even those at the back of the room, 방 뒤쪽에 있는 사람들조차도. gazed at the speaker in awe, 그 연사를 경탄하며 응시했다.","hl":"ch"},{"n":16,"text":"세 번째 문장을 볼게요. Such was the power of his voice에서 Such가 보어로 앞에 나오고 was가 주어 the power of his voice 앞으로 이동했어요. 뒤의 that절은 너무 대단해서 어떤 결과가 일어났는지를 설명합니다. 그래서 Such를 너무나 대단한 정도로 해석하고 that절을 결과로 연결하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 \u003cspan class=\"fx\">Such was the power of his voice that\u003c/span> even those at the back of the room gazed at the speaker in awe.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>그의 목소리의 힘이 너무 대단해서 방 뒤쪽에 있던 사람들까지도 연사를 경탄하며 바라보았다는 뜻입니다. 목소리의 설득력과 존재감이 매우 컸다는 것을 강조하는 표현입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Such was the power of his voice that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">His voice was so powerful that\u003c/span>\u003cdiv class=\"w\">Such 도치를 so 형용사 구문으로 풀어 일반 어순으로 바꾼 표현입니다. 결과를 나타내는 that절은 그대로 유지됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">gazed at\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stared at\u003c/span>\u003cspan class=\"y-eq\">gaze at = stare at\u003c/span>\u003cdiv class=\"w\">응시하다라는 뜻을 같은 의미의 stare at으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in awe\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">with admiration\u003c/span>\u003cspan class=\"y-eq\">in awe = with admiration\u003c/span>\u003cdiv class=\"w\">경탄하며라는 감정을 with admiration으로 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at the back of the room\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in the rear of the room\u003c/span>\u003cspan class=\"y-eq\">at the back of = in the rear of\u003c/span>\u003cdiv class=\"w\">방 뒤쪽이라는 공간 표현을 격식 있는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">His voice was so powerful that even people at the back of the room stared at the speaker with admiration.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 그의 목소리에 엄청난 힘이 있어서 방 뒤쪽 사람들까지도 연사를 경탄하며 바라보았다는 뜻이에요. 단순히 목소리가 컸다는 것이 아니라 사람들을 끌어당길 만큼 설득력과 존재감이 있었다는 뉘앙스입니다.","hl":"mn"},{"n":18,"text":"표현을 바꿔 볼까요. Such was the power of his voice that은 His voice was so powerful that으로 바꿀 수 있어요. 이렇게 하면 도치를 풀어 일반 어순으로 만들고 결과의 의미도 그대로 살릴 수 있습니다.","hl":"rw"},{"n":19,"text":"어구도 정리해 볼게요. gazed at은 stared at으로 바꿀 수 있고 in awe는 with admiration으로 바꿀 수 있어요. at the back of the room은 in the rear of the room과 같은 뜻으로 기억해 두면 좋습니다.","hl":"ph"},{"n":20,"text":"같은 뜻의 문장을 들어 볼게요. His voice was so powerful that even people at the back of the room stared at the speaker with admiration. 그의 목소리가 너무 대단해서 방 뒤쪽 사람들조차 연사를 경탄하며 바라보았다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Philosophy, which is understood to be the desire to acquire wisdom, is a fundamental part of the human being, \u003cspan class=\"fx\">and so is science\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Philosophy, \u003c/div>\u003cdiv class=\"k\">철학은,\u003c/div>\u003cdiv class=\"e\">which is understood to be the desire to acquire wisdom, \u003c/div>\u003cdiv class=\"k\">지혜를 얻으려는 욕망으로 이해되는\u003c/div>\u003cdiv class=\"e\">is a fundamental part of the human being, \u003c/div>\u003cdiv class=\"k\">인간의 근원적인 부분이고,\u003c/div>\u003cdiv class=\"e\">and so is science.\u003c/div>\u003cdiv class=\"k\">과학도 역시 그러하다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">so\u003c/b>가 앞 절의 긍정 내용을 받아 '과학도 그러하다'를 나타내며, \u003cb class=\"key\">is\u003c/b>가 주어 \u003cb class=\"key\">science\u003c/b> 앞으로 이동한 \u003cb class=\"key\">도치\u003c/b>입니다. 앞의 is a fundamental part와 같은 내용을 반복합니다.\u003c/div>","segs":[{"n":21,"text":"Philosophy, 철학은. which is understood to be the desire to acquire wisdom, 지혜를 얻으려는 욕망으로 이해되는. is a fundamental part of the human being, 인간의 근원적인 부분이고. and so is science, 과학도 역시 그러하다.","hl":"ch"},{"n":22,"text":"네 번째 문장을 볼게요. 앞에서 철학이 인간의 근원적인 부분이라고 말한 뒤 and so is science로 이어 줍니다. 여기서 so가 앞의 긍정 내용을 받아 과학도 그러하다는 뜻을 만들고 is가 주어 science 앞으로 이동한 도치가 일어나요. 그래서 과학도 인간의 근원적인 부분이라는 뜻으로 연결하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Philosophy, which is understood to be the desire to acquire wisdom, is a fundamental part of the human being, \u003cspan class=\"fx\">and so is science\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>철학은 지혜를 얻으려는 욕망으로 이해되며 인간의 근원적인 부분이고, 과학도 마찬가지로 인간의 근원적인 부분이라는 뜻입니다. 철학과 과학이 서로 배타적이지 않고 둘 다 인간에게 중요하다는 뉘앙스입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">and so is science\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">and science is a fundamental part of the human being as well\u003c/span>\u003cdiv class=\"w\">so 도치를 풀어 앞 절의 내용을 science에 그대로 적용한 표현입니다. as well이 '역시'의 의미를 담습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is understood to be\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is regarded as\u003c/span>\u003cspan class=\"y-eq\">be understood to be = be regarded as\u003c/span>\u003cdiv class=\"w\">이해되다라는 수동 표현을 여겨지다라는 동의 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">acquire wisdom\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">gain wisdom\u003c/span>\u003cspan class=\"y-eq\">acquire = gain\u003c/span>\u003cdiv class=\"w\">지혜를 얻다라는 뜻을 더 일상적인 gain으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a fundamental part of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">an essential part of\u003c/span>\u003cspan class=\"y-eq\">fundamental = essential\u003c/span>\u003cdiv class=\"w\">근원적인 부분이라는 표현을 필수적인 부분이라는 뜻으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Philosophy, regarded as the desire to gain wisdom, is an essential part of humans, and science is too.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 철학과 과학이 모두 인간에게 근원적인 부분이라는 뜻이에요. 철학은 지혜를 얻으려는 욕망으로 이해되고, 과학도 그에 못지않게 중요하다는 것이죠. 두 학문이 서로 반대가 아니라 함께 인간을 이해하는 중요한 요소라는 뉘앙스입니다.","hl":"mn"},{"n":24,"text":"표현을 바꿔 볼까요. and so is science는 and science is a fundamental part of the human being as well로 풀어 쓸 수 있어요. 이렇게 바꾸면 도치를 풀면서 과학도 역시 그렇다는 뜻을 분명히 살릴 수 있습니다.","hl":"rw"},{"n":25,"text":"어구도 정리해 볼게요. is understood to be는 is regarded as로 바꿀 수 있고 acquire wisdom은 gain wisdom으로 바꿀 수 있어요. a fundamental part of는 an essential part of와 같은 뜻으로 익혀 두세요.","hl":"ph"},{"n":26,"text":"같은 뜻의 문장을 들어 볼게요. Philosophy, regarded as the desire to gain wisdom, is an essential part of humans, and science is too. 철학은 지혜를 얻으려는 욕망으로 여겨지며 인간의 필수적인 부분이고 과학도 그렇다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 The release of atomic energy has not created a new problem. It has merely \u003cspan class=\"fx\">made more urgent the necessity of solving an existing one\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The release of atomic energy \u003c/div>\u003cdiv class=\"k\">원자 에너지의 방출은\u003c/div>\u003cdiv class=\"e\">has not created a new problem. \u003c/div>\u003cdiv class=\"k\">새로운 문제를 만들어 내지 않았다.\u003c/div>\u003cdiv class=\"e\">It has merely made more urgent \u003c/div>\u003cdiv class=\"k\">그것은 단지 더 긴급하게 만들었을 뿐이다\u003c/div>\u003cdiv class=\"e\">the necessity of solving an existing one.\u003c/div>\u003cdiv class=\"k\">기존의 문제를 해결해야 할 필요성을.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">make\u003c/b>의 목적격 보어 \u003cb class=\"key\">more urgent\u003c/b>가 목적어 \u003cb class=\"key\">the necessity ...\u003c/b>보다 먼저 나온 어순입니다. 목적어가 길어서 뒤로 보낸 \u003cb class=\"key\">목적어 후치\u003c/b>이며, '기존 문제를 해결해야 할 필요성을 더 긴급하게 만들었다'로 해석합니다.\u003c/div>","segs":[{"n":27,"text":"The release of atomic energy, 원자 에너지의 방출은. has not created a new problem, 새로운 문제를 만들어 내지 않았다.. It has merely made more urgent, 그것은 단지 더 긴급하게 만들었을 뿐이다. the necessity of solving an existing one, 기존의 문제를 해결해야 할 필요성을.","hl":"ch"},{"n":28,"text":"다섯 번째 문장을 볼게요. made more urgent the necessity of solving an existing one에서 목적격 보어 more urgent가 목적어보다 먼저 나왔어요. 목적어가 길어서 뒤로 보낸 목적어 후치 표현이고, 원래는 made the necessity more urgent의 어순입니다. 해석할 때는 기존 문제를 해결해야 할 필요성을 더 긴급하게 만들었다고 잡으면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 The release of atomic energy has not created a new problem. It has merely \u003cspan class=\"fx\">made more urgent the necessity of solving an existing one\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>원자 에너지의 등장이 완전히 새로운 문제를 만든 것은 아니라는 뜻입니다. 다만 이미 존재하던 문제를 해결해야 할 필요성을 더욱 긴급하게 만들었을 뿐이라는 뉘앙스입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">It has merely made more urgent the necessity of solving an existing one.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">It has merely made the necessity of solving an existing problem more urgent.\u003c/span>\u003cdiv class=\"w\">목적어와 목적격 보어의 순서를 일반 어순으로 바꾼 표현입니다. one은 problem으로 풀어 뜻을 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The release of atomic energy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The unleashing of atomic energy\u003c/span>\u003cspan class=\"y-eq\">release = unleashing\u003c/span>\u003cdiv class=\"w\">방출이라는 표현을 폭발적으로 풀어놓는다는 뉘앙스의 unleashing으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">made more urgent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">heightened the urgency of\u003c/span>\u003cspan class=\"y-eq\">make more urgent = heighten the urgency of\u003c/span>\u003cdiv class=\"w\">더 긴급하게 만들다를 긴급성을 높이다라는 동사구로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">an existing one\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a problem that already exists\u003c/span>\u003cspan class=\"y-eq\">an existing one = a problem that already exists\u003c/span>\u003cdiv class=\"w\">기존의 것이라는 대명사 표현을 완전한 명사구로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Atomic energy has not introduced a new problem; it has only made it more urgent to solve one that already exists.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 원자 에너지가 완전히 새로운 문제를 만든 것이 아니라는 뜻이에요. 이미 있던 문제를 해결해야 할 필요성을 더욱 긴급하게 만들었을 뿐이라는 것이죠. 그래서 원자 에너지의 등장을 새로운 문제 발생보다 기존 문제의 시급성 증가로 보는 표현입니다.","hl":"mn"},{"n":30,"text":"표현을 바꿔 볼까요. 원문은 목적어를 뒤로 보냈지만 It has merely made the necessity of solving an existing problem more urgent라고 하면 일반 어순이 됩니다. one을 problem으로 풀어 쓰면 의미도 더 분명해집니다.","hl":"rw"},{"n":31,"text":"어구도 정리해 볼게요. the release of atomic energy는 the unleashing of atomic energy로 바꿀 수 있고 made more urgent는 heightened the urgency of로 바꿀 수 있어요. an existing one은 a problem that already exists로 풀어 쓸 수 있습니다.","hl":"ph"},{"n":32,"text":"같은 뜻의 문장을 들어 볼게요. Atomic energy has not introduced a new problem; it has only made it more urgent to solve one that already exists. 원자 에너지는 새로운 문제를 만든 것이 아니라 이미 존재하는 문제를 해결하는 일을 더 긴급하게 만들었을 뿐이라는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 \u003cspan class=\"fx\">So closely is sniffing tied to odor perception that\u003c/span> people routinely sniff when they are asked to imagine a smell.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">So closely is sniffing tied \u003c/div>\u003cdiv class=\"k\">코를 킁킁거리는 것은 매우 밀접하게 연관되어 있다\u003c/div>\u003cdiv class=\"e\">to odor perception \u003c/div>\u003cdiv class=\"k\">냄새 지각과\u003c/div>\u003cdiv class=\"e\">that people routinely sniff \u003c/div>\u003cdiv class=\"k\">그래서 사람들은 일상적으로 코를 킁킁거린다\u003c/div>\u003cdiv class=\"e\">when they are asked to imagine a smell.\u003c/div>\u003cdiv class=\"k\">어떤 냄새를 상상해 보라는 요청을 받을 때.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">So\u003c/b>와 부사 \u003cb class=\"key\">closely\u003c/b>가 문장 앞에 나와 \u003cb class=\"key\">is\u003c/b>가 주어 \u003cb class=\"key\">sniffing\u003c/b> 앞으로 이동한 도치입니다. \u003cb class=\"key\">that\u003c/b>절은 '너무 ~해서 ...하다'라는 결과를 나타냅니다.\u003c/div>","segs":[{"n":33,"text":"So closely is sniffing tied, 코를 킁킁거리는 것은 매우 밀접하게 연관되어 있다. to odor perception, 냄새 지각과. that people routinely sniff, 그래서 사람들은 일상적으로 코를 킁킁거린다. when they are asked to imagine a smell, 어떤 냄새를 상상해 보라는 요청을 받을 때.","hl":"ch"},{"n":34,"text":"여섯 번째 문장을 볼게요. So closely is sniffing tied to odor perception that에서 So와 closely가 앞에 나오고 is가 주어 sniffing 앞으로 이동했어요. that절은 코를 킁킁거리는 것이 얼마나 밀접하게 연결되어 있는지 그 결과를 설명합니다. 그래서 너무 밀접하게 연결되어 있어서 사람들이 어떤 행동을 한다고 해석하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 \u003cspan class=\"fx\">So closely is sniffing tied to odor perception that\u003c/span> people routinely sniff when they are asked to imagine a smell.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>냄새를 맡는 행동인 코를 킁킁거리는 것이 냄새를 지각하는 일과 아주 밀접하게 연결되어 있다는 뜻입니다. 그래서 사람들은 실제로 냄새를 맡을 때뿐 아니라 냄새를 상상하라고 할 때도 습관적으로 코를 킁킁거린다는 것입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">So closely is sniffing tied to odor perception that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Sniffing is so closely tied to odor perception that\u003c/span>\u003cdiv class=\"w\">so 도치를 일반 어순으로 풀어 쓴 표현입니다. 결과를 나타내는 that절은 그대로 유지됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is tied to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is linked to\u003c/span>\u003cspan class=\"y-eq\">be tied to = be linked to\u003c/span>\u003cdiv class=\"w\">밀접하게 연결되다라는 뜻을 같은 의미의 linked to로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">odor perception\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the perception of smells\u003c/span>\u003cspan class=\"y-eq\">odor perception = the perception of smells\u003c/span>\u003cdiv class=\"w\">냄새 지각이라는 명사구를 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">routinely\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">habitually\u003c/span>\u003cspan class=\"y-eq\">routinely = habitually\u003c/span>\u003cdiv class=\"w\">일상적으로, 습관적으로라는 뜻을 habitually로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Sniffing is so strongly connected with perceiving smells that people usually sniff when asked to imagine one.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 냄새를 맡는 행동과 냄새를 지각하는 일이 아주 밀접하게 연결되어 있다는 뜻이에요. 그래서 사람들은 실제 냄새가 없어도 냄새를 상상하라고 하면 습관적으로 코를 킁킁거린다는 것이죠. 몸의 반응이 냄새에 대한 생각만으로도 자연스럽게 나타난다는 뉘앙스입니다.","hl":"mn"},{"n":36,"text":"표현을 바꿔 볼까요. 원문의 도치를 풀면 Sniffing is so closely tied to odor perception that이 됩니다. 이렇게 하면 주어 sniffing이 앞에 나오고 뜻은 코를 킁킁거리는 것이 냄새 지각과 너무 밀접하게 연결되어 있다는 그대로입니다.","hl":"rw"},{"n":37,"text":"어구도 정리해 볼게요. is tied to는 is linked to로 바꿀 수 있고 odor perception은 the perception of smells로 풀어 쓸 수 있어요. routinely은 habitually와 같은 뜻으로 기억해 두면 좋습니다.","hl":"ph"},{"n":38,"text":"같은 뜻의 문장을 들어 볼게요. Sniffing is so strongly connected with perceiving smells that people usually sniff when asked to imagine one. 코를 킁킁거리는 일이 냄새 지각과 너무 강하게 연결되어 있어서 사람들이 냄새를 상상하라고 하면 보통 코를 킁킁거린다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 People often say that motivation doesn't last. Well, \u003cspan class=\"fx\">neither does bathing\u003c/span>— that's why we recommend it daily.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">People often say \u003c/div>\u003cdiv class=\"k\">사람들은 종종 말한다\u003c/div>\u003cdiv class=\"e\">that motivation doesn't last. \u003c/div>\u003cdiv class=\"k\">동기 부여는 오래가지 않는다고.\u003c/div>\u003cdiv class=\"e\">Well, \u003c/div>\u003cdiv class=\"k\">음,\u003c/div>\u003cdiv class=\"e\">neither does bathing— \u003c/div>\u003cdiv class=\"k\">목욕하는 것도 역시 그렇지 않다—\u003c/div>\u003cdiv class=\"e\">that's why we recommend it daily.\u003c/div>\u003cdiv class=\"k\">그것이 우리가 그것을 매일 권장하는 이유이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">neither\u003c/b>가 앞 문장의 부정 내용을 받아 '목욕도 오래가지 않는다'를 나타내며, \u003cb class=\"key\">does\u003c/b>가 주어 \u003cb class=\"key\">bathing\u003c/b> 앞으로 이동한 \u003cb class=\"key\">도치\u003c/b>입니다. 앞의 doesn't last를 대신 받습니다.\u003c/div>","segs":[{"n":39,"text":"People often say, 사람들은 종종 말한다. that motivation doesn't last, 동기 부여는 오래가지 않는다고.. Well, 음. neither does bathing—, 목욕하는 것도 역시 그렇지 않다—. that's why we recommend it daily, 그것이 우리가 그것을 매일 권장하는 이유이다.","hl":"ch"},{"n":40,"text":"일곱 번째 문장을 볼게요. 앞 문장에서 동기 부여는 오래가지 않는다고 말한 뒤 Well, neither does bathing이라고 이어 줍니다. 여기서 neither가 앞의 부정 내용을 받고 does가 주어 bathing 앞으로 이동한 도치가 일어나요. 그래서 목욕하는 것도 오래가지 않는다는 뜻으로 연결하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 People often say that motivation doesn't last. Well, \u003cspan class=\"fx\">neither does bathing\u003c/span>— that's why we recommend it daily.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>동기 부여가 오래가지 않는다는 말을 목욕에 빗대어 재치 있게 받아친 표현입니다. 목욕도 한 번 한다고 계속 깨끗한 것이 아니므로 매일 해야 하듯이, 동기 부여도 꾸준히 새로 채워야 한다는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">neither does bathing— that's why we recommend it daily\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">bathing doesn't last either— that's why we recommend it daily\u003c/span>\u003cdiv class=\"w\">neither 도치를 일반 어순으로 풀어 쓴 표현입니다. either를 사용해 '역시 그렇지 않다'는 뜻을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">doesn't last\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">doesn't endure\u003c/span>\u003cspan class=\"y-eq\">last = endure\u003c/span>\u003cdiv class=\"w\">오래가다라는 뜻을 endure로 바꾸어 지속성을 강조했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">motivation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">drive\u003c/span>\u003cspan class=\"y-eq\">motivation = drive\u003c/span>\u003cdiv class=\"w\">동기 부여라는 말을 추진력이라는 뜻의 drive로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">recommend it daily\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">suggest doing it every day\u003c/span>\u003cspan class=\"y-eq\">recommend = suggest\u003c/span>\u003cdiv class=\"w\">권장하다라는 동사를 suggest로 바꾸고 daily를 every day로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">People often say motivation does not last long. Well, bathing does not last either, which is why we suggest doing it every day.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 동기 부여가 오래가지 않는다는 말을 목욕에 빗대어 재치 있게 받아친 표현이에요. 목욕도 한 번 한다고 계속 깨끗한 것이 아니므로 매일 해야 하듯이 동기 부여도 꾸준히 새로 채워야 한다는 뜻이죠. 그래서 우리는 목욕을 매일 권한다는 말로 웃음을 주고 있습니다.","hl":"mn"},{"n":42,"text":"표현을 바꿔 볼까요. neither does bathing은 bathing does not last either로 풀어 쓸 수 있어요. 이렇게 하면 도치를 풀어 일반 어순으로 바꾸면서도 목욕도 역시 오래가지 않는다는 뜻을 그대로 살릴 수 있습니다.","hl":"rw"},{"n":43,"text":"어구도 정리해 볼게요. does not last는 does not endure로 바꿀 수 있고 motivation은 drive라는 말로 이해할 수 있어요. recommend it daily는 suggest doing it every day로 바꾸어 쓸 수 있습니다.","hl":"ph"},{"n":44,"text":"같은 뜻의 문장을 들어 볼게요. People often say motivation does not last long. Well, bathing does not last either, which is why we suggest doing it every day. 동기 부여도 목욕처럼 매일 새로 해야 한다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 We carry home what we have bought in some vessel, but \u003cspan class=\"fx\">learning we cannot put in any other vessel but our minds\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We carry home \u003c/div>\u003cdiv class=\"k\">우리는 집으로 가져간다\u003c/div>\u003cdiv class=\"e\">what we have bought \u003c/div>\u003cdiv class=\"k\">우리가 구매한 것을\u003c/div>\u003cdiv class=\"e\">in some vessel, \u003c/div>\u003cdiv class=\"k\">어떤 용기 안에,\u003c/div>\u003cdiv class=\"e\">but learning \u003c/div>\u003cdiv class=\"k\">그러나 배운 것은\u003c/div>\u003cdiv class=\"e\">we cannot put \u003c/div>\u003cdiv class=\"k\">우리는 둘 수 없다\u003c/div>\u003cdiv class=\"e\">in any other vessel but our minds.\u003c/div>\u003cdiv class=\"k\">우리의 정신 이외의 다른 어떤 용기 속에도.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">learning\u003c/b>이 put의 목적어인데 강조를 위해 문장 앞으로 전치된 \u003cb class=\"key\">목적어 전치\u003c/b>입니다. 원래 어순은 we cannot put learning in any other vessel but our minds입니다.\u003c/div>","segs":[{"n":45,"text":"We carry home, 우리는 집으로 가져간다. what we have bought, 우리가 구매한 것을. in some vessel, 어떤 용기 안에. but learning, 그러나 배운 것은. we cannot put, 우리는 둘 수 없다. in any other vessel but our minds, 우리의 정신 이외의 다른 어떤 용기 속에도.","hl":"ch"},{"n":46,"text":"여덟 번째 문장을 볼게요. but learning we cannot put in any other vessel but our minds에서 learning이 put의 목적어인데 강조를 위해 앞으로 전치되었어요. 원래는 we cannot put learning in any other vessel but our minds의 어순입니다. 그래서 learning을 목적어로 잡고 우리는 배운 것을 다른 용기에 둘 수 없다고 해석하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 We carry home what we have bought in some vessel, but \u003cspan class=\"fx\">learning we cannot put in any other vessel but our minds\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>물건은 용기에 담아 집으로 가져올 수 있지만, 배운 것은 우리의 정신 밖에 다른 어떤 용기에도 담을 수 없다는 뜻입니다. 지식과 배움은 물건처럼 옮기거나 보관할 수 없고 오직 마음속에만 남는다는 뉘앙스입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">but learning we cannot put in any other vessel but our minds\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">but we cannot put learning in any other vessel but our minds\u003c/span>\u003cdiv class=\"w\">전치된 목적어 learning을 동사 뒤로 보내 일반 어순으로 바꾼 표현입니다. 뜻은 그대로입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">carry home\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">bring home\u003c/span>\u003cspan class=\"y-eq\">carry home = bring home\u003c/span>\u003cdiv class=\"w\">집으로 가져가다라는 뜻을 bring home으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in some vessel\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in a container\u003c/span>\u003cspan class=\"y-eq\">vessel = container\u003c/span>\u003cdiv class=\"w\">용기라는 표현을 더 익숙한 container로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">any other vessel but our minds\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">no vessel other than our minds\u003c/span>\u003cspan class=\"y-eq\">any other ... but = no ... other than\u003c/span>\u003cdiv class=\"w\">우리의 정신 이외의 다른 어떤 용기라는 표현을 no other than 구조로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We bring home what we have bought in a container, but we can store learning only in our minds, not in any other container.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"이 문장은 물건은 용기에 담아 집으로 가져올 수 있지만 배운 것은 우리의 정신 말고는 다른 어떤 용기에도 담을 수 없다는 뜻이에요. 지식은 물건처럼 옮기거나 보관할 수 없고 오직 마음속에만 남는다는 것이죠. 배움의 가치와 마음의 역할을 강조하는 표현입니다.","hl":"mn"},{"n":48,"text":"표현을 바꿔 볼까요. learning을 앞에 둔 원문은 but we cannot put learning in any other vessel but our minds로 일반 어순을 만들 수 있어요. 이렇게 하면 목적어가 동사 뒤로 가서 문장 구조가 더 분명해집니다.","hl":"rw"},{"n":49,"text":"어구도 정리해 볼게요. carry home은 bring home으로 바꿀 수 있고 in some vessel은 in a container로 바꿀 수 있어요. any other vessel but our minds는 no vessel other than our minds로 풀어 쓸 수 있습니다.","hl":"ph"},{"n":50,"text":"같은 뜻의 문장을 들어 볼게요. We bring home what we have bought in a container, but we can store learning only in our minds, not in any other container. 우리가 산 물건은 용기에 담아 집으로 가져오지만 배움은 오직 우리의 정신에만 담을 수 있다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 How on earth are you ever going to explain in terms of chemistry and physics \u003cspan class=\"fx\">so important a biological phenomenon as first love\u003c/span>?\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">How on earth \u003c/div>\u003cdiv class=\"k\">도대체 어떻게\u003c/div>\u003cdiv class=\"e\">are you ever going to explain \u003c/div>\u003cdiv class=\"k\">당신은 설명할 것인가\u003c/div>\u003cdiv class=\"e\">in terms of chemistry and physics \u003c/div>\u003cdiv class=\"k\">화학과 물리학의 관점에서\u003c/div>\u003cdiv class=\"e\">so important a biological phenomenon \u003c/div>\u003cdiv class=\"k\">너무나 중요한 생물학적 현상을\u003c/div>\u003cdiv class=\"e\">as first love?\u003c/div>\u003cdiv class=\"k\">첫사랑처럼?\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">so\u003c/b> + 형용사 \u003cb class=\"key\">important\u003c/b> + \u003cb class=\"key\">a\u003c/b> + 명사 \u003cb class=\"key\">biological phenomenon\u003c/b> + \u003cb class=\"key\">as\u003c/b> 구문으로 '첫사랑처럼 중요한 생물학적 현상'을 뜻합니다. 의문문에서 \u003cb class=\"key\">How on earth\u003c/b>는 '도대체 어떻게'라는 강한 의문을 더합니다.\u003c/div>","segs":[{"n":51,"text":"How on earth, 도대체 어떻게. are you ever going to explain, 당신은 설명할 것인가. in terms of chemistry and physics, 화학과 물리학의 관점에서. so important a biological phenomenon, 너무나 중요한 생물학적 현상을. as first love?, 첫사랑처럼?","hl":"ch"},{"n":52,"text":"아홉 번째 문장을 볼게요. so important a biological phenomenon as first love는 so와 형용사 important와 a와 명사 biological phenomenon과 as가 결합한 표현이에요. 첫사랑처럼 중요한 생물학적 현상이라는 뜻을 만들죠. 앞의 How on earth는 도대체 어떻게라는 강한 의문을 더합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 How on earth are you ever going to explain in terms of chemistry and physics \u003cspan class=\"fx\">so important a biological phenomenon as first love\u003c/span>?\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>첫사랑처럼 중요한 생물학적 현상을 화학과 물리학만으로 설명할 수 있겠느냐는 수사적 질문입니다. 사랑은 단순한 화학 반응이나 물리 법칙만으로 설명하기 어렵다는 뉘앙스를 담고 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so important a biological phenomenon as first love\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a biological phenomenon as important as first love\ ortant as와 같은 뜻으로 기억해 두세요.","hl":"ph"},{"n":56,"text":"같은 뜻의 문장을 들어 볼게요. How could you ever explain something as biologically important as first love using only chemistry and physics? 첫사랑처럼 생물학적으로 중요한 것을 화학과 물리학만으로 어떻게 설명할 수 있겠느냐는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 \u003cspan class=\"fx\">So quickly did he rush out of the office that\u003c/span> he forgot to lock up and set the alarm.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">So quickly \u003c/div>\u003cdiv class=\"k\">너무나 빠르게\u003c/div>\u003cdiv class=\"e\">did he rush out of the office \u003c/div>\u003cdiv class=\"k\">그는 사무실 밖으로 달려나갔다\u003c/div>\u003cdiv class=\"e\">that he forgot to lock up \u003c/div>\u003cdiv class=\"k\">그래서 그는 잠그는 것을 잊었다\u003c/div>\u003cdiv class=\"e\">and set the alarm.\u003c/div>\u003cdiv class=\"k\">그리고 경보 장치를 설정하는 것을.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">So\u003c/b>와 부사 \u003cb class=\"key\">quickly\u003c/b>가 문장 앞에 나와 \u003cb class=\"key\">did\u003c/b>가 주어 \u003cb class=\"key\">he\u003c/b> 앞으로 이동한 도치입니다. \u003cb class=\"key\">that\u003c/b>절은 '너무 빨리 ~해서 ...했다'라는 결과를 나타냅니다.\u003c/div>","segs":[{"n":57,"text":"So quickly, 너무나 빠르게. did he rush out of the office, 그는 사무실 밖으로 달려나갔다. that he forgot to lock up, 그래서 그는 잠그는 것을 잊었다. and set the alarm, 그리고 경보 장치를 설정하는 것을.","hl":"ch"},{"n":58,"text":"열 번째 문장을 볼게요. So quickly did he rush out of the office that에서 So와 quickly가 앞에 나오고 did가 주어 he 앞으로 이동했어요. that절은 너무 빨리 달려나간 결과로 어떤 일이 일어났는지 설명합니다. 그래서 너무 빨리 나간 나머지 잠그고 경보 장치를 설정하는 것을 잊었다고 해석하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 \u003cspan class=\"fx\">So quickl :"Unlike animals, 동물과 달리. plants cannot pick up their roots, 식물은 자신의 뿌리를 집어 들 수 없고. and race for safety, 안전을 위해 질주할 수 없다.. Nor have many plants taken the offensive, 많은 식물이 공격 태세를 취한 것도 아니다. and become predators, 그리고 포식자가 된.","hl":"ch"},{"n":64,"text":"열한 번째 문장을 볼게요. Nor have many plants taken the offensive and become predators에서 Nor가 앞 문장의 부정 내용을 이어 줍니다. have가 주어 many plants 앞으로 이동한 도치가 일어났고 뒤에는 have taken과 have become이 현재완료로 이어져요. 그래서 많은 식물이 공격 태세를 취하고 포식자가 된 것도 아니라고 해석합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 Unlike animals, plants cannot pick up their roots and race for safety. \u003cspan class=\"fx\">Nor have many plants taken the offensive and become predators\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>동물과 달리 식물은 스스로 뿌리를 뽑고 안전한 곳으로 달려갈 수 없다는 뜻입니다. 또한 많은 식물이 공격적으로 변해 포식자가 된 것도 아니라는 뉘앙스로, 식물의 수동적인 생존 방식을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Nor have many plants taken the offensive and become predators\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Many plants have not taken the offensive and become predators either\u003c/span>\u003cdiv class=\"w\">Nor 도치를 일반 어순으로 풀어 쓴 표현입니다. either를 사용해 앞 문장의 부정에 이어지는 뜻을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pick up their roots\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">uproot themselves\u003c/span>\u003cspan class=\"y-eq\">pick up their roots = uproot themselves\u003c/span>\u003cdiv class=\"w\">뿌리를 집어 들다라는 표현을 스스로 뿌리째 뽑다라는 뜻으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">race for safety\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">run to safety\u003c/span>\u003cspan class=\"y-eq\">race for safety = run to safety\u003c/span>\u003cdiv class=\"w\">안전을 위해 질주하다를 안전한 곳으로 달려가다라는 자연스러운 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">taken the offensive\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">gone on the attack\u003c/span>\u003cspan class=\"y-eq\">take the offensive = go on the attack\u003c/span>\u003cdiv class=\"w\">공격 태세를 취하다라는 표현을 공격에 나서다라는 뜻으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Plants, unlike animals, cannot uproot themselves and run to safety, and many plants have not gone on the attack and become predators either.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 동물과 달리 식물은 스스로 뿌리를 뽑고 안전한 곳으로 달려갈 수 없다는 뜻이에요. 또한 많은 식물이 공격적으로 변해 포식자가 된 것도 아니라는 뜻을 더합니다. 식물이 움직이지 못하고 대체로 수동적인 방식으로 살아간다는 점을 강조하는 표현입니다.","hl":"mn"},{"n":66,"text":"표현을 바꿔 볼까요. Nor have many plants taken the offensive and become predators는 Many plants have not taken the offensive and become predators either로 풀어 쓸 수 있어요. 이렇게 하면 도치를 풀고 either로 앞 문장과의 부정 연결도 분명히 할 수 있습니다.","hl":"rw"},{"n":67,"text":"어구도 정리해 볼게요. pick up their roots는 uproot themselves로 바꿀 수 있고 race for safety는 run to safety로 바꿀 수 있어요. taken the offensive는 gone on the attack과 같은 뜻으로 기억해 두세요.","hl":"ph"},{"n":68,"text":"같은 뜻의 문장을 들어 볼게요. Plants, unlike animals, cannot uproot themselves and run to safety, and many plants have not gone on the attack and become predators either. 식물은 동물과 달리 스스로 뿌리째 뽑혀 안전한 곳으로 달려갈 수 없고 많은 식물이 공격적으로 변해 포식자가 된 것도 아니라는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">The large part of our thoughts and feelings that we do not know and cannot control\u003c/span> Sigmund Freud called the unconscious.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The large part of our thoughts and feelings \u003c/div>\u003cdiv class=\"k\">우리의 생각과 감정의 커다란 부분을\u003c/div>\u003cdiv class=\"e\">that we do not know and cannot control \u003c/div>\u003cdiv class=\"k\">우리가 알지 못하고 통제할 수 없는\u003c/div>\u003cdiv class=\"e\">Sigmund Freud called \u003c/div>\u003cdiv class=\"k\">지그문트 프로이트는 불렀다\u003c/div>\u003cdiv class=\"e\">the unconscious.\u003c/div>\u003cdiv class=\"k\">무의식이라고.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">The large part ... cannot control\u003c/b>가 called의 \u003cb class=\"key\">목적어\u003c/b>로 문장 앞에 전치되었고, 주어 \u003cb class=\"key\">Sigmund Freud\u003c/b>와 동사 \u003cb class=\"key\">called\u003c/b>가 뒤따릅니다. 원래 어순은 Sigmund Freud called the large part ... the unconscious입니다.\u003c/div>","segs":[{"n":69,"text":"The large part of our thoughts and feelings, 우리의 생각과 감정의 커다란 부분을. that we do not know and cannot control, 우리가 알지 못하고 통제할 수 없는. Sigmund Freud called, 지그문트 프로이트는 불렀다. the unconscious, 무의식이라고.","hl":"ch"},{"n":70,"text":"열두 번째 문장을 볼게요. The large part of our thoughts and feelings that we do not know and cannot control이 called의 목적어인데 문장 앞으로 전치되었어요. 그래서 주어 Sigmund Freud와 동사 called가 뒤에 나오는 구조입니다. 해석할 때는 우리가 알지 못하고 통제할 수 없는 생각과 감정의 큰 부분을 프로이트가 무의식이라고 불렀다고 잡으면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">The large part of our thoughts and feelings that we do not know and cannot control\u003c/span> Sigmund Freud called the unconscious.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리가 알지 못하고 통제할 수 없는 생각과 감정의 큰 부분을 프로이트가 무의식이라고 이름 붙였다는 뜻입니다. 인간의 마음에는 스스로 인식하지 못하는 거대한 영역이 있다는 뉘앙스입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The large part of our thoughts and feelings that we do not know and cannot control Sigmund Freud called the unconscious.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Sigmund Freud called the large part of our thoughts and feelings that we do not know and cannot control the unconscious.\u003c/span>\u003cdiv class=\"w\">전치된 목적어를 동사 뒤로 보내 일반 어순으로 바꾼 표현입니다. 주어 Sigmund Freud와 동사 called의 관계가 분명해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the large part of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the greater part of\u003c/span>\u003cspan class=\"y-eq\">the large part of = the greater part of\u003c/span>\u003cdiv class=\"w\">커다란 부분이라는 표현을 더 큰 부분이라는 뜻으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cannot control\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cannot govern\u003c/span>\u003cspan class=\"y-eq\">control = govern\u003c/span>\u003cdiv class=\"w\">통제하다라는 뜻을 govern으로 바꾸어 같은 의미를 전달했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">called the unconscious\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">named the unconscious\u003c/span>\u003cspan class=\"y-eq\">call = name\u003c/span>\u003cdiv class=\"w\">부르다라는 동사를 이름 붙이다라는 뜻으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Sigmund Freud called the unconscious the large part of our thoughts and feelings that we neither know nor control.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 우리가 알지 못하고 통제할 수 없는 생각과 감정의 큰 부분을 프로이트가 무의식이라고 이름 붙였다는 뜻이에요. 인간의 마음에는 스스로 인식하지 못하는 거대한 영역이 있다는 뉘앙스입니다. 그래서 무의식은 단순히 모르는 마음이 아니라 우리 행동에 영향을 주는 큰 부분이라는 것이죠.","hl":"mn"},{"n":72,"text":"표현을 바꿔 볼까요. 원문은 목적어를 앞에 두었지만 Sigmund Freud called the large part of our thoughts and feelings that we do not know and cannot control the unconscious라고 하면 일반 어순이 됩니다. 이렇게 하면 프로이트가 무엇을 무의식이라고 불렀는지 더 분명하게 보입니다.","hl":"rw"},{"n":73,"text":"어구도 정리해 볼게요. the large part of는 the greater part of로 바꿀 수 있고 cannot control은 cannot govern으로 바꿀 수 있어요. called the unconscious는 named the unconscious와 같은 뜻으로 기억해 두세요.","hl":"ph"},{"n":74,"text":"같은 뜻의 문장을 들어 볼게요. Sigmund Freud called the unconscious the large part of our thoughts and feelings that we neither know nor control. 프로이트가 우리가 알지도 통제하지도 못하는 생각과 감정의 큰 부분을 무의식이라고 불렀다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">도치와 강조 어순\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">neither\u003c/b>와 \u003cb class=\"key\">nor\u003c/b> 뒤에서는 조동사가 주어 앞으로 이동해 '~도 아니다'를 만듭니다.\u003c/li>\u003cli>\u003cb class=\"key\">so\u003c/b>와 \u003cb class=\"key\">such\u003c/b>가 앞에 오면 be동사나 조동사가 주어 앞으로 이동하고, \u003cb class=\"key\">that\u003c/b>절이 결과를 나타냅니다.\u003c/li>\u003cli>목적어를 강조하려고 문장 앞으로 보내는 \u003cb class=\"key\">목적어 전치\u003c/b>와, 긴 목적어를 뒤로 보내는 \u003cb class=\"key\">목적어 후치\u003c/b>를 구분해야 합니다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 부정어와 neither, nor, so, such가 앞에 나올 때 조동사나 be동사가 주어 앞으로 이동하는 도치를 배웠어요. 또한 목적어가 강조를 위해 문장 앞으로 전치되는 경우와 긴 목적어가 뒤로 가는 경우도 확인했습니다. 이런 문장은 앞의 신호어를 먼저 잡고 뒤에서 주어와 동사를 찾는 습관이 중요해요. 오늘 배운 어순 규칙을 다른 지문에서도 꼭 찾아보세요. 수고했습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
