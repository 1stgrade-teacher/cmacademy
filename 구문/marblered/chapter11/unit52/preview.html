lecturePlayer(document.getElementById("app"),{"brand":"Unit 52 동격 구문","title":"Chapter 11 특수 구문 Unit 52 동격 구문","audioDir":"preview_audio","preview":false,"count":31,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">동격 구문\u003c/div>\u003ch1>Chapter 11 특수 구문 Unit 52 동격 구문\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>문장 속에서 앞 명사의 내용을 보충 설명하는 다양한 동격 구문을 완벽하게 이해하고 해석할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 문장에서 앞의 명사를 다른 말로 풀어서 설명해 주는 특수한 구문인 동격 구문을 함께 공부해 볼 거예요. 독해를 하거나 글을 쓸 때 명사 뒤에 쉼표나 that, 오브 같은 표현이 왜 나오는지 그 원리를 확실하게 알게 될 테니까 집중해서 잘 따라오세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 2\u003c/span>\u003ch2 class=\"g-h\">쉼표와 명사구, 그리고 대시·콜론 동격\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">명사 뒤에 쉼표를 찍고 다른 명사구나 명사를 써서 앞 명사를 설명하는 \u003cb class=\"key\">동격\u003c/b> 표현을 만들 수 있어요. 또한 대시나 콜론 뒤에서 앞 내용을 풀어 설명하기도 하며, or, that is, namely, in other words를 써서 즉, 다시 말해서라는 의미를 나타내기도 해요.\u003cdiv>\u003cspan class=\"g-formula\">명사, 명사구(명사), / 명사 + that / 대시(-) / 콜론(:)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">My uncle, \u003cspan class=\"fx\">a pilot\u003c/span>, lives in Busan.\u003c/div>\u003cdiv class=\"g-ko\">내 삼촌은 조종사인데, 부산에 산다.\u003c/div>\u003cdiv class=\"g-note\">쉼표 사이에 명사구를 넣어 앞의 명사를 설명합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He had one goal: \u003cspan class=\"fx\">to win the race\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그에게는 한 가지 목표가 있었다. 경주에서 이기는 것이었다.\u003c/div>\u003cdiv class=\"g-note\">콜론 뒤에서 앞의 내용을 풀어 설명합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Ornithology, or \u003cspan class=\"fx\">the study of birds\u003c/span>, is fun.\u003c/div>\u003cdiv class=\"g-ko\">조류학, 즉 새에 관한 연구는 재미있다.\u003c/div>\u003cdiv class=\"g-note\">or를 사용하여 앞 명사의 뜻을 즉이라고 설명합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>동격의 쉼표는 문장 안에서 괄호처럼 \u003cb class=\"key\">삽입절\u003c/b>이나 \u003cb class=\"key\">삽입구\u003c/b> 역할을 하므로, 해석할 때 주어와 동사의 호응을 흐리지 않도록 주의해야 해요.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념은 쉼표나 대시 그리고 콜론을 활용해서 앞의 명사를 바로 설명해 주는 동격 구문이에요. 쉼표 사이에 명사구를 넣거나 대시와 콜론을 뒤에 붙이면 앞의 내용을 그대로 다시 풀어서 설명해 줄 수 있답니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 볼게요. My uncle, a pilot, lives in Busan이라는 문장이에요. 쉼표 사이에 있는 a pilot이 앞의 My uncle을 설명해 주는 삼촌은 조종사인데 부산에 산다는 뜻이랍니다.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. He had one goal: to win the race라는 문장인데요. 콜론 뒤에 나온 to win the race가 앞의 한 가지 목표가 무엇이었는지 풀어 설명해 주고 있어요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문을 읽어 볼게요. Ornithology, or the study of birds, is fun이에요. 중간에 있는 or가 조류학이 즉 새에 관한 연구라는 것을 친절하게 설명해 주고 있네요.","hl":"ex-2"},{"n":6,"text":"여기서 잠깐 주의할 점이 있어요. 동격의 쉼표는 마치 문장 속의 괄호 같은 역할을 하니까 해석할 때 주어와 동사의 관계가 헷갈리지 않게 조심해야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 2\u003c/span>\u003ch2 class=\"g-h\">that절과 of를 이용한 동격 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">fact, news, belief, idea, rumor, hope, claim 같은 추상명사 뒤에 \u003cb class=\"key\">that절\u003c/b>이 오면 그 명사의 구체적인 내용을 설명하는 동격절이 되며, that 뒤에는 완전한 절이 와요. 또한 \u003cb class=\"key\">명사 + of + 동명사/명사\u003c/b> 형태를 써서 of가 이끄는 구가 앞 명사의 내용을 설명할 수도 있어요.\u003cdiv>\u003cspan class=\"g-formula\">추상명사 + that + 완전한 절 / 명사 + of + 명사(구)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The news \u003cspan class=\"fx\">that he won\u003c/span> surprised us.\u003c/div>\u003cdiv class=\"g-ko\">그가 이겼다는 소식은 우리를 놀라게 했다.\u003c/div>\u003cdiv class=\"g-note\">the news의 구체적인 내용을 that절이 설명합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She has the habit \u003cspan class=\"fx\">of keeping a diary\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 일기를 쓰는 습관이 있다.\u003c/div>\u003cdiv class=\"g-note\">of 뒤의 동명사구가 habit의 내용을 설명합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>동격의 that절은 관계대명사 that과 달리 뒤에 문장이 완전하므로 \u003cb class=\"key\">완전한 절\u003c/b>인지 꼭 확인해야 해요.\u003c/div>","segs":[{"n":7,"text":"두 번째 개념은 댓절과 오브를 활용하는 동격 구문이에요. 팩트나 뉴스 같은 추상명사 뒤에 댓이 나오면 그 내용이 무엇인지 완벽한 문장으로 설명해 줄 수 있고, 명사 뒤에 오브를 써서 내용을 꾸며줄 수도 있어요.","hl":"rule"},{"n":8,"text":"첫 번째 예문을 보죠. The news that he won surprised us라는 문장이에요. 뉴스 뒤에 나온 that he won이 그 소식의 구체적인 내용이 무엇인지 완벽하게 설명해 주고 있답니다.","hl":"ex-0"},{"n":9,"text":"두 번째 예문이에요. She has the habit of keeping a diary라는 문장인데요. habit 뒤에 오브가 이끄는 동명사구가 나와서 어떤 습관인지 자세히 말해 주고 있네요.","hl":"ex-1"},{"n":10,"text":"여기서 중요한 팁을 하나 줄게요. 동격의 댓은 뒤에 주어나 목적어가 빠진 곳이 없는 완벽한 문장이 온다는 점을 절대 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The news which he won surprised us.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The news that he won surprised us.\u003c/div>\u003cdiv class=\"g-why\">동격절을 이끄는 접속사 자리에 관계대명사 which를 쓸 수 없기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>My uncle, who a pilot, lives in Busan.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ My uncle, a pilot, lives in Busan.\u003c/div>\u003cdiv class=\"g-why\">명사구를 동격으로 연결할 때 관계대명사 동사 없이 명사구만 바로 쉼표로 연결해야 하기 때문입니다.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"학생들이 자주 틀리는 첫 번째 문장이에요. 뉴스가 주어인데 뒤에 위치를 쓰면 틀려요. 동격절을 이끌 때는 완벽한 문장을 데려오는 접속사 댓을 써야 하므로 위치 대신에 댓을 써야 맞는 문장이 된답니다.","hl":"mk-0"},{"n":12,"text":"두 번째로 자주 틀리는 문장이에요. 삼촌이 조종사라는 것을 설명할 때 who is를 빼먹었다고 후이즈를 넣거나 후만 쓰면 틀려요. 쉼표 사이에는 명사구만 바로 넣어야 동격이 성립한답니다.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 밑줄 친 부분의 쓰임이 나머지와 다른 하나를 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">① The fact that he was honest is true. \n② She made a promise that she would help. \n③ I know the boy that won the prize. \n④ There is a rumor that she moved.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>첫 번째 보기\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>두 번째 보기\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>세 번째 보기\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>네 번째 보기\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">세 번째 보기\u003c/span>\u003cdiv class=\"g-exp\">①, ②, ④번의 that은 앞 명사의 내용을 설명하는 동격절을 이끌고, ③번의 that은 소년을 꾸미는 주격 관계대명사입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":13,"text":"첫 번째 문제입니다. 화면에 보이는 네 개의 문장 중에서 밑줄 친 댓의 쓰임이 나머지 셋과 완전히 다른 하나를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":14,"text":"","hl":"q","pause":6},{"n":15,"text":"정답은 세 번째 보기예요. 첫 번째와 두 번째 그리고 네 번째 문장의 댓은 앞의 팩트와 프라미스, 루머의 내용을 설명하는 동격절이지만, 세 번째 보기의 댓은 소년을 수식하는 주격 관계대명사이기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">The hope ____ we can win the game keeps us going.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>which\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>that\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>what\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>who\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">that\u003c/span>\u003cdiv class=\"g-exp\">hope의 구체적인 내용인 '우리가 경기에 이길 수 있다는 것'을 설명하는 동격절이므로 접속사 that이 와야 합
