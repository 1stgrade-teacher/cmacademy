  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 49 도치 구문 1","title":"내신과 수능을 잡는 영문법 도치 구문 마스터","audioDir":"preview_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 11 Unit 49\u003c/div>\u003ch1>내신과 수능을 잡는 영문법 도치 구문 마스터\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>문두에 나온 부정어와 다양한 수식어구로 인해 주어와 동사가 도치되는 5가지 핵심 패턴을 정확히 이해하고 적용한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 고등학교 내신과 수능 문법 시험에서 절대 빼놓을 수 없는 아주 중요한 특수 구문인 도치 구문을 함께 공부할 거예요. 도치는 문장의 강조를 위해서 주어와 동사의 자리를 바꾸는 마법 같은 문법이랍니다. 오늘 저와 함께 다섯 가지 핵심 도치 패턴을 완벽하게 내 것으로 만들어 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">부정어(구) 도치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">never, little, hardly, seldom, not only, on no account, under no circumstances 같은 \u003cb class=\"key\">부정어(구)\u003c/b>가 문두에 오면 주어와 동사가 도치되어 \u003cb class=\"key\">조동사 + S + 본동사\u003c/b> 어순이 된다.\u003cdiv>\u003cspan class=\"g-formula\">부정어(구) + 조동사 + S + 본동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Never have I seen\u003c/span> such a beautiful view.\u003c/div>\u003cdiv class=\"g-ko\">나는 그렇게 아름다운 경치를 본 적이 없다.\u003c/div>\u003cdiv class=\"g-note\">부정어 never가 문두에 나와 조동사 have가 주어 I 앞으로 도치됨\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>부정어구 도치에서는 반드시 문장 맨 앞에 나온 부정어가 주어절 전체를 부정하는 의미를 갖는지 \u003cb class=\"key\">부정어구\u003c/b>를 정확히 확인해야 한다.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념이에요. 문장에 부정적인 의미를 담은 표현이 맨 앞으로 튀어나오면 문장의 어순이 바뀌게 돼요. 이때 주어 앞에 조동사나 be동사가 먼저 나오고 그 뒤에 주어가 오는 도치 현상이 일어난답니다. 부정어구와 조동사, 주어와 본동사의 순서가 어떻게 배치되는지 잘 기억해 주세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 볼게요. Never have I seen such a beautiful view.라고 했죠. 부정어인 never가 문장 맨 앞에 와서 조동사 have가 주어 I 앞으로 도치되었어요. 나는 그렇게 아름다운 경치를 본 적이 없다는 뜻이랍니다.","hl":"ex-0"},{"n":4,"text":"여기서 잠깐 팁을 줄게요. 문두에 나온 표현이 진짜 부정어인지 꼼꼼히 확인하는 습관을 들여야 해요. 이 작은 차이가 내신 시험 정답을 갈라놓는답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">Not until ~ 도치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">Not until ~\u003c/b> 표현이 문두에 나오면 주절의 주어와 동사가 \u003cb class=\"key\">도치\u003c/b>된다.\u003cdiv>\u003cspan class=\"g-formula\">Not until ~ + 조동사 + S + 본동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Not until midnight did he come\u003c/span> home.\u003c/div>\u003cdiv class=\"g-ko\">자정이 되어서야 그는 집에 왔다.\u003c/div>\u003cdiv class=\"g-note\">Not until midnight가 문두에 나와 주절의 동사구 did he come이 도치됨\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>Not until 절 자체는 도치되지 않고, 그 바로 다음에 이어지는 \u003cb class=\"key\">주절\u003c/b>만 도치된다는 점을 헷갈리지 말자.\u003c/div>","segs":[{"n":5,"text":"두 번째는 Not until 구문이에요. ~하고서야 비로소 ~하다라는 의미를 가진 Not until이 문장 맨 앞에 올 때의 도치 규칙이랍니다. 이때는 Not until이 이끄는 절이 아니라 그 뒤에 이어지는 주절의 동사와 주어가 도치된다는 점을 꼭 기억해야 해요.","hl":"rule"},{"n":6,"text":"예문을 함께 읽어봐요. Not until midnight did he come home.이라고 했어요. 자정이 되어서야 그는 집에 왔다는 뜻인데, Not until midnight가 문두에 나와서 뒤에 did he come으로 도치된 것을 볼 수 있어요.","hl":"ex-0"},{"n":7,"text":"이 부분에서 학생들이 정말 많이 틀려요. Not until이 있는 절이 아니라 바로 뒤에 따라오는 주절만 도치된다는 걸 절대 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">Only + 부사(구·절) 도치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">Only\u003c/b>가 이끄는 부사 표현이 문두에 오면 강조를 위해 \u003cb class=\"key\">주절\u003c/b>이 도치된다.\u003cdiv>\u003cspan class=\"g-formula\">Only + 부사(구·절) + 조동사 + S + 본동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Only after dinner could we\u003c/span> talk freely.\u003c/div>\u003cdiv class=\"g-ko\">저녁 식사 후에야 우리는 자유롭게 이야기할 수 있었다.\u003c/div>\u003cdiv class=\"g-note\">only가 이끄는 부사구 Only after dinner가 문두에 나와 조동사 could가 주어 we 앞으로 도치됨\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>Only가 단순히 주어를 수식할 때는 도치가 일어나지 않고, \u003cb class=\"key\">부사(구·절)\u003c/b>를 수식하여 문두에 올 때만 도치된다.\u003c/div>","segs":[{"n":8,"text":"세 번째 개념은 오직 ~할 때만 이라는 뜻을 가진 Only가 이끄는 부사 표현이 문두에 올 때예요. Only와 함께 부사나 부사구, 부사절이 문장 맨 앞에 오면 역시 뒤에 오는 주절이 도치되어서 조동사와 주어의 자리가 바뀐답니다.","hl":"rule"},{"n":9,"text":"예문을 소리 내어 읽어볼게요. Only after dinner could we talk freely.예요. 저녁 식사 후에야 우리는 자유롭게 이야기할 수 있었다는 뜻이죠. Only after dinner가 문두에 나와서 조동사 could가 주어 we 앞으로 도치되었어요.","hl":"ex-0"},{"n":10,"text":"주의할 점이 있어요. Only가 주어를 꾸밀 때는 도치하지 않아요. 반드시 부사나 부사구, 부사절을 이끌고 문두에 올 때만 도치된다는 것을 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">장소·방향 부사구 및 보어 도치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">자동사 문장에서는 \u003cb class=\"key\">장소 부사구\u003c/b>가 문두에 오면 [동사 + 주어] 어순이 되고, \u003cb class=\"key\">보어\u003c/b>나 과거분사가 문두에 오면 [be동사 + 주어] 어순으로 도치된다.\u003cdiv>\u003cspan class=\"g-formula\">장소·방향 부사구 + V + S / 보어(과거분사) + be동사 + S\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Under the tree sat an old man\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나무 아래에 한 노인이 앉아 있었다.\u003c/div>\u003cdiv class=\"g-note\">장소 부사구 Under the tree가 문두에 와서 자동사 sat과 주어 an old man이 도치됨\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Written on the wall was\u003c/span> a short message.\u003c/div>\u003cdiv class=\"g-ko\">벽에는 짧은 메시지가 적혀 있었다.\u003c/div>\u003cdiv class=\"g-note\">과거분사구 Written on the wall이 문두에 와서 be동사 was와 주어 a short message가 도치됨\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>장소 부사구 도치 구문에서는 주어가 \u003cb class=\"key\">대명사\u003c/b>일 경우, 동사 뒤로 도치되지 않고 일반적인 주어 동사 어순을 유지한다는 것을 꼭 기억하자.\u003c/div>","segs":[{"n":11,"text":"마지막 네 번째 개념이에요. 이번에는 주어와 동사 자체의 자리가 통째로 바뀌거나 be동사와 주어가 바뀌는 형태랍니다. 문장 맨 앞에 장소나 방향을 나타내는 부사구가 오고 동사가 자동사일 때는 주어와 동사의 순서가 완전히 뒤바뀌어요. 그리고 보어나 과거분사가 문두에 올 때도 be동사와 주어가 도치된답니다.","hl":"rule"},{"n":12,"text":"첫 번째 예문을 봐요. Under the tree sat an old man.이라고 했죠. 장소 부사구인 Under the tree가 문장 맨 앞에 오고 자동사 sat과 주어 an old man의 자리가 그대로 바뀌었어요.","hl":"ex-0"},{"n":13,"text":"두 번째 예문도 볼까요. Written on the wall was a short message.예요. 과거분사구인 Written on the wall이 문두에 오면서 be동사 was와 주어 a short message가 도치되었답니다.","hl":"ex-1"},{"n":14,"text":"여기 아주 중요한 팁이 있어요. 도치 구문이라도 주어가 대명사일 때는 동사 뒤로 가지 않고 원래대로 주어가 앞에 온다는 점을 절대 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Never I have seen such a beautiful view.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Never have I seen such a beautiful view.\u003c/div>\u003cdiv class=\"g-why\">부정어 never가 문두에 오면 주어 앞으로 조동사가 도치되어야 하는데 주어와 조동사의 어순이 바뀌지 않았기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Under the tree an old man sat.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Under the tree sat an old man.\u003c/div>\u003cdiv class=\"g-why\">장소 부사구가 문두에 오면 자동사와 주어가 도치되어 [동사 + 주어] 형태가 되어야 하기 때문이다.\u003c/div>\u003c/div>","segs":[{"n":15,"text":"학생들이 자주 하는 실수예요. Never I have seen이라고 쓰면 틀려요. 부정어구 도치에서는 주어보다 조동사가 먼저 나와야 하므로 Never have I seen으로 써야 맞는 문장이 된답니다.","hl":"mk-0"},{"n":16,"text":"두 번째 자주 틀리는 문장이에요. Under the tree an old man sat처럼 쓰면 도치가 되지 않아서 틀려요. 장소 부사구가 문두에 왔으므로 자동사 sat과 주어 an old man의 자리를 바꿔서 Under the tree sat an old man으로 써야 해요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 어법상 잘못된 부분을 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"g-qs\">Little I knew what would happen next.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Little did I know what would happen next.\u003c/span>\u003cdiv class=\"g-exp\">부정어 little이 문두에 왔으므로 주어 앞에 조동사가 도치되어야 하며 일반동사 knew는 did I know 형태로 고쳐야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"첫 번째 문제입니다. Little I knew what would happen next라는 문장에서 어법상 틀린 부분을 찾아 바르게 고쳐 보세요. 화면을 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":6},{"n":19,"text":"정답은 Little did I know what would happen next예요. 부정어 little이 문두에 왔기 때문에 일반동사 knew는 조동사 did를 활용하여 did I know로 도치시켜야 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 가장 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">Not until midnight ________ come home.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>did he\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>he did\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>does he\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>he does\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">did he\u003c/span>\u003cdiv class=\"g-exp\">Not until ~ 구문이 문두에 오면 주절의 주어와 동사가 도치되며 과거시제이므로 조동사 did가 주어 앞에 온다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"두 번째 문제입니다. Not until midnight 빈칸 come home이라는 문장에서 빈칸에 들어갈 가장 알맞은 보기를 골라보세요. 잠시 멈추고 정답을 생각해보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 첫 번째 보기인 did he예요. Not until 구문이 문두에 오면 주절이 도치되는데, 과거시제이므로 조동사 did가 주어 he 앞으로 와야 하기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 단어들을 올바르게 배열하여 문장을 완성하시오.\u003c/div>\u003cdiv class=\"g-qs\">[ we / could / after / dinner / Only / talk / freely ]\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Only after dinner could we talk freely.\u003c/span>\u003cdiv class=\"g-exp\">Only가 이끄는 부사구가 문두에 오면 주절의 조동사와 주어가 도치되므로 Only after dinner could we talk freely가 된다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"세 번째 문제입니다. 제시된 괄호 안의 단어들을 알맞게 배열해서 문장을 완성해 보세요. 잠시 멈추고 공책에 적어 보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":6},{"n":25,"text":"정답은 Only after dinner could we talk freely예요. Only가 이끄는 부사구가 문두에 왔으므로 조동사 could가 주어 we 앞으로 도치되어야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 도치 구문의 어법이 올바른 것을 고르시오.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>Never I will forget this day.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>Under the tree sat a cute cat.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Only in this way we can solve the problem.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Seldom she visits her grandparents.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Under the tree sat a cute cat.\u003c/span>\u003cdiv class=\"g-exp\">장소 부사구 Under the tree가 문두에 와서 자동사 sat과 주어 a cute cat이 올바르게 도치되었다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"네 번째 문제입니다. 다음 네 개의 보기 중에서 도치 구문의 어법이 올바르게 된 것을 골라보세요. 화면을 멈추고 골라보세요.","hl":"q"},{"n":27,"text":"","hl":"q","pause":6},{"n":28,"text":"정답은 두 번째 보기인 Under the tree sat a cute cat이에요. 장소 부사구 뒤에 자동사와 주어가 올바르게 도치되었죠. 다른 보기들은 도치가 누락되었거나 잘못되었답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말 뜻에 맞게 빈칸을 포함한 영작을 완성하시오. (그는 결코 그 진실을 알지 못했다)\u003c/div>\u003cdiv class=\"g-qs\">Never ________ know the truth.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">did he\u003c/span>\u003cdiv class=\"g-exp\">부정어 never가 문두에 왔으므로 과거시제 주어 앞에 조동사 did가 와서 Never did he know the truth가 된다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":29,"text":"다섯 번째 문제입니다. 그는 결코 그 진실을 알지 못했다라는 우리말에 맞추어 Never 빈칸 know the truth에서 빈칸을 채워 영작해 보세요. 잠시 멈추고 풀어보세요.","hl":"q"},{"n":30,"text":"","hl":"q","pause":6},{"n":31,"text":"정답은 did he예요. 부정어 Never가 문두에 와서 과거시제 조동사 did가 주어 he 앞으로 도치되어 Never did he know the truth가 완성돼요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 도치가 일어난 문장의 문법적 특징으로 옳지 않은 것을 고르시오.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>부정어구가 문두에 오면 조동사와 주어가 도치된다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>장소 부사구가 문두에 오면 자동사와 주어가 도치된다.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>장소 부사구 도치 시 주어가 대명사면 동사 뒤로 도치된다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>보어나 과거분사가 문두에 오면 be동사와 주어가 도치된다.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">장소 부사구 도치 시 주어가 대명사면 동사 뒤로 도치된다.\u003c/span>\u003cdiv class=\"g-exp\">장소 부사구 도치에서 주어가 대명사일 경우에는 주어와 동사가 도치되지 않고 원래의 어순을 유지한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":32,"text":"여섯 번째 마지막 문제입니다. 도치 구문의 문법적 특징으로 옳지 않은 것을 보기에서 골라보세요. 잠시 생각을 정리해 보세요.","hl":"q"},{"n":33,"text":"","hl":"q","pause":6},{"n":34,"text":"정답은 세 번째 보기예요. 장소 부사구 도치 시 주어가 대명사면 동사 뒤로 도치된다고 했지만, 대명사 주어는 도치되지 않고 그대로 주어 동사 순서로 쓴다고 했죠. 그래서 이 보기가 틀린 것이랍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 11 Unit 49\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>부정어구나 \u003cb class=\"key\">Only\u003c/b> 부사 표현이 문두에 오면 주어와 조동사가 \u003cb class=\"key\">도치\u003c/b>된다.\u003c/li>\u003cli>\u003cb class=\"key\">장소 부사구\u003c/b>가 문두에 올 때는 자동사와 주어가 도치되며 주어가 대명사일 때는 도치되지 않는다.\u003c/li>\u003c/ul>","segs":[{"n":35,"text":"오늘 이렇게 해서 도치 구문의 다섯 가지 핵심 패턴을 모두 정리해 보았어요. 부정어구와 Only, 장소 부사구와 보어 도치까지 정말 중요한 내용들이 많았죠. 오늘 배운 내용을 복습하면서 내신과 수능 만점에 한 걸음 더 다가갑 수 있기를 바랄게요. 여러분 수고 많았어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
