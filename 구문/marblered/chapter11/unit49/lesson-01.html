  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

lecturePlayer(document.getElementById("app"),{"brand":"unit49","title":"마블레드 구문 강의: 문두 강조와 도치","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마블레드\u003c/div>\u003ch1>마블레드 구문 강의: 문두 강조와 도치\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>문두에 강조 표현이 올 때 주어와 동사의 위치가 어떻게 바뀌는지 익혀 실전 문장을 해석하고 바꿔 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마블레드 유닛에서 문두 강조와 도치 구문을 함께 공부해요. 문장 앞에 부정어나 전치사구, 보어, 분사구가 오면 주어와 동사의 순서가 달라지는 경우가 많아요. 이 원리를 잡으면 긴 문장도 훨씬 또렷하게 읽을 수 있답니다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">문두에 \u003cb class=\"key\">부정어구·전치사구·보어·분사구\u003c/b>가 오면 강조를 위해 \u003cb class=\"key\">주어와 동사 또는 조동사의 위치가 바뀐다\u003c/b>. 일반동사일 때는 \u003cb class=\"key\">do, does, did\u003c/b>를 앞세워 도치하고, 수동태나 완료형에서는 be동사나 have동사가 주어 앞에 온다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">On no account must you\u003c/span> give your banking details to anyone over the phone or by email.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">Trustworthy are those\u003c/span> who give not only compliments but also bitter advice.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 \u003cspan class=\"fx\">Not until the rise of ecology at the beginning of the twentieth century did people\u003c/span> begin to think seriously of land as a natural system with interconnecting parts.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Every cell is a triumph of natural selection, and we're made of trillions of cells. \u003cspan class=\"fx\">Within us, is a little universe.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Natural ability is necessary to become an expert in anything, but \u003cspan class=\"fx\">no less important is the willingness to study.\u003c/span>\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 For a computer to solve a problem, \u003cspan class=\"fx\">not only must the solution be\u003c/span> very detailed, but it must also be written in a form the computer can understand.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 \u003cspan class=\"fx\">Under no circumstances will anyone's personal information be given out\u003c/span> to any third party without the express permission of the person concerned.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">Out of the fundamentals of elementary algebra evolved\u003c/span> the abstract algebra used today and the concept of an algebraic structure.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">Included in this chapter is a list\u003c/span> of frequently misspelled words, which you may find it helpful to memorize.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">Only in the last few decades, in the primarily industrially developed economies, has food\u003c/span> become so plentiful and easy to obtain as to cause fat-related health problems.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">Fundamental to most moral approaches is the idea\u003c/span> that human life has a special dignity and value that is worth preserving even at the expense of self-interest.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">Laid before me was\u003c/span>, I realized, a scene of almost classical rural beauty—the meadows dotted with contented animals, the woods in the background, a twisting stream threading through it all.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘의 핵심은 문두 강조와 도치예요. 문장 앞에 부정어구나 전치사구, 보어, 분사구가 오면 강조하려는 마음이 생기고, 그때 주어와 동사의 위치가 바뀌어요. 일반동사는 do, does, did를 앞세우고, be동사나 have동사가 있으면 그 동사가 주어 앞으로 나온답니다. 이 순서만 기억해도 긴 문장의 뼈대가 보여요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">On no account must you\u003c/span> give your banking details to anyone over the phone or by email.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">On no account \u003c/div>\u003cdiv class=\"k\">결코\u003c/div>\u003cdiv class=\"e\">must you \u003c/div>\u003cdiv class=\"k\">당신은 ~해야 한다\u003c/div>\u003cdiv class=\"e\">give your banking details \u003c/div>\u003cdiv class=\"k\">당신의 은행 정보를 주다\u003c/div>\u003cdiv class=\"e\">to anyone \u003c/div>\u003cdiv class=\"k\">누군가에게\u003c/div>\u003cdiv class=\"e\">over the phone \u003c/div>\u003cdiv class=\"k\">전화로\u003c/div>\u003cdiv class=\"e\">or by email.\u003c/div>\u003cdiv class=\"k\">또는 이메일로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>부정어구 \u003cb class=\"key\">On no account\u003c/b>가 문두에 오면서 조동사 \u003cb class=\"key\">must\u003c/b>가 주어 \u003cb class=\"key\">you\u003c/b> 앞으로 나온 도치 구문이다. ‘결코 ~해서는 안 된다’라는 강한 금지를 나타낸다.\u003c/div>","segs":[{"n":3,"text":"On no account, 결코. must you, 당신은 ~해야 한다. give your banking details, 당신의 은행 정보를 주다. to anyone, 누군가에게. over the phone, 전화로. or by email, 또는 이메일로","hl":"ch"},{"n":4,"text":"첫 번째 문장을 볼게요. On no account는 결코라는 뜻의 강한 부정어구예요. 이 표현이 문장 앞에 오면 조동사 must가 주어 you보다 먼저 나와서 must you 순서가 된답니다. 즉 부정어구가 앞에 오면 조동사와 주어가 자리를 바꾼다고 기억해 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">On no account must you\u003c/span> give your banking details to anyone over the phone or by email.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>전화나 이메일로 은행 계좌 정보를 절대 알려 주지 말라는 뜻이다. 개인정보 보호를 강조하는 공식적이고 단호한 경고 표현이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">On no account must you give\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">You must never give\u003c/span>\u003cdiv class=\"w\">도치를 풀고 never로 같은 강한 부정을 살린 표현이다. 일상 대화에서 더 자연스럽다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">On no account must you give your banking details\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Under no circumstances should you share your bank information\u003c/span>\u003cdiv class=\"w\">격식 있는 경고를 유지하면서 give를 share로 바꿔 정보 공유의 뉘앙스를 살렸다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">on no account\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">under no circumstances\u003c/span>\u003cspan class=\"y-eq\">on no account = under no circumstances\u003c/span>\u003cdiv class=\"w\">둘 다 ‘결코 ~하지 않다’라는 강한 부정을 만드는 격식 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">banking details\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">bank account information\u003c/span>\u003cspan class=\"y-eq\">banking details = bank account information\u003c/span>\u003cdiv class=\"w\">계좌 관련 정보라는 뜻을 더 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by email\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">via email\u003c/span>\u003cspan class=\"y-eq\">by email = via email\u003c/span>\u003cdiv class=\"w\">수단을 나타내는 전치사를 바꾼 같은 뜻의 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">You should never share your bank information with anyone by phone or email.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 전화나 이메일로 은행 정보를 절대 알려 주지 말라는 경고예요. 상대에게 단호하게 주의를 주는 공식적인 말투라는 느낌을 살펴야 해요. 개인 정보를 소중히 지켜야 한다는 의도가 담겨 있답니다.","hl":"mn"},{"n":6,"text":"도치를 풀면 You must never give your banking details to anyone over the phone or by email이라고 할 수 있어요. never를 써서 결코 안 된다는 강한 금지를 그대로 살린 거예요. 일상 대화에서는 이렇게 쓰면 더 자연스럽답니다.","hl":"rw"},{"n":7,"text":"on no account는 under no circumstances로 바꿔 쓸 수 있어요. banking details는 bank account information처럼 풀어 말할 수 있고요. by email은 via email로 바꿔도 같은 뜻이 된답니다.","hl":"ph"},{"n":8,"text":"이제 같은 뜻의 문장을 소리 내어 읽어 볼게요. You should never share your bank information with anyone by phone or email. 은행 정보를 전화나 이메일로 누구에게도 절대 공유하지 말라는 뜻이에요. should never를 사용해 조언처럼 부드럽게 바꾼 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">Trustworthy are those\u003c/span> who give not only compliments but also bitter advice.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Trustworthy \u003c/div>\u003cdiv class=\"k\">신뢰할 만한\u003c/div>\u003cdiv class=\"e\">are those \u003c/div>\u003cdiv class=\"k\">사람들은 ~이다\u003c/div>\u003cdiv class=\"e\">who give \u003c/div>\u003cdiv class=\"k\">주는\u003c/div>\u003cdiv class=\"e\">not only compliments \u003c/div>\u003cdiv class=\"k\">칭찬뿐만 아니라\u003c/div>\u003cdiv class=\"e\">but also bitter advice.\u003c/div>\u003cdiv class=\"k\">쓴 조언도\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주격 보어 \u003cb class=\"key\">Trustworthy\u003c/b>가 문두로 나가고 주어 \u003cb class=\"key\">those\u003c/b>와 동사 \u003cb class=\"key\">are\u003c/b>의 순서가 바뀐 도치 구문이다. 뒤의 who는 those를 꾸미는 주격 관계대명사이다.\u003c/div>","segs":[{"n":9,"text":"Trustworthy, 신뢰할 만한. are those, 사람들은 ~이다. who give, 주는. not only compliments, 칭찬뿐만 아니라. but also bitter advice, 쓴 조언도","hl":"ch"},{"n":10,"text":"두 번째 문장을 보면 Trustworthy가 문장 앞에 나와 있어요. 이 단어는 주어 those를 설명하는 보어인데, 강조하려고 앞으로 나오면서 are those 순서가 된 거예요. 뒤에 나오는 who는 those를 받아 주는 관계대명사라는 점도 함께 봐 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 \u003cspan class=\"fx\">Trustworthy are those\u003c/span> who give not only compliments but also bitter advice.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>칭찬만 해 주는 사람이 아니라 쓴소리도 해 주는 사람이 진짜 믿을 만하다는 뜻이다. 듣기 좋은 말만 하는 사람보다 필요한 조언을 해 주는 사람을 높이 평가하는 표현이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Trustworthy are those who give not only compliments but also bitter advice.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Those who give not only compliments but also bitter advice are trustworthy.\u003c/span>\u003cdiv class=\"w\">도치를 풀어 주어 those를 문장 앞에 둔 자연스러운 어순이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">give not only compliments but also bitter advice\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">offer both praise and honest criticism\u003c/span>\u003cdiv class=\"w\">not only A but also B를 both A and B로 바꾸고 bitter advice를 honest criticism으로 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">trustworthy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">reliable\u003c/span>\u003cspan class=\"y-eq\">trustworthy = reliable\u003c/span>\u003cdiv class=\"w\">믿을 수 있다는 뜻을 같은 형용사로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">bitter advice\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">candid criticism\u003c/span>\u003cspan class=\"y-eq\">bitter advice = candid criticism\u003c/span>\u003cdiv class=\"w\">듣기 쓴 조언이라는 뜻을 솔직한 비판이라는 말로 풀었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">give compliments\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pay compliments\u003c/span>\u003cspan class=\"y-eq\">give compliments = pay compliments\u003c/span>\u003cdiv class=\"w\">칭찬하다라는 관용적 결합을 사용했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">People who offer both praise and honest criticism are reliable.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 칭찬만 해 주는 사람보다 쓴소리도 해 주는 사람이 더 믿을 만하다는 뜻이에요. 듣기 좋은 말만 하는 사람이 아니라 필요한 조언을 해 주는 사람을 높이 평가하는 표현이죠. 그래서 bitter advice를 부정적으로만 보지 말고 진짜 도움이 되는 조언으로 이해해야 해요.","hl":"mn"},{"n":12,"text":"도치를 풀면 Those who give not only compliments but also bitter advice are trustworthy라고 할 수 있어요. 또는 offer both praise and honest criticism처럼 both를 써서 같은 뜻을 만들 수도 있답니다. 문장의 강조점은 그대로 살아 있어요.","hl":"rw"},{"n":13,"text":"trustworthy는 reliable로 바꿔 쓸 수 있어요. bitter advice는 candid criticism처럼 솔직한 비판이라는 뜻으로 풀 수 있고요. give compliments는 pay compliments라는 관용 표현으로 바꿀 수 있답니다.","hl":"ph"},{"n":14,"text":"같은 뜻의 문장을 읽어 볼게요. People who offer both praise and honest criticism are reliable. 칭찬과 솔직한 비판을 모두 해 주는 사람이 믿을 만하다는 뜻이에요. 관계대명사 who를 사용해 자연스럽게 바꾼 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 \u003cspan class=\"fx\">Not until the rise of ecology at the beginning of the twentieth century did people\u003c/span> begin to think seriously of land as a natural system with interconnecting parts.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Not until \u003c/div>\u003cdiv class=\"k\">~하고 나서야 비로소\u003c/div>\u003cdiv class=\"e\">the rise of ecology \u003c/div>\u003cdiv class=\"k\">생태학의 등장은\u003c/div>\u003cdiv class=\"e\">at the beginning of the twentieth century \u003c/div>\u003cdiv class=\"k\">이십 세기 초에\u003c/div>\u003cdiv class=\"e\">did people \u003c/div>\u003cdiv class=\"k\">사람들은 ~했다\u003c/div>\u003cdiv class=\"e\">begin to think seriously \u003c/div>\u003cdiv class=\"k\">진지하게 생각하기 시작했다\u003c/div>\u003cdiv class=\"e\">of land \u003c/div>\u003cdiv class=\"k\">땅을\u003c/div>\u003cdiv class=\"e\">as a natural system \u003c/div>\u003cdiv class=\"k\">자연계로서\u003c/div>\u003cdiv class=\"e\">with interconnecting parts.\u003c/div>\u003cdiv class=\"k\">서로 연결된 부분들을 가진\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>부정어구 \u003cb class=\"key\">Not until ...\u003c/b>이 문두에 오면서 주절에서 \u003cb class=\"key\">did + 주어 + 동사원형\u003c/b>의 도치가 일어난다. ‘~하고 나서야 비로소 …했다’라는 의미로 시작 시점을 강조한다.\u003c/div>","segs":[{"n":15,"text":"Not until, ~하고 나서야 비로소. the rise of ecology, 생태학의 등장은. at the beginning of the twentieth century, 이십 세기 초에. did people, 사람들은 ~했다. begin to think seriously, 진지하게 생각하기 시작했다. of land, 땅을. as a natural system, 자연계로서. with interconnecting parts, 서로 연결된 부분들을 가진","hl":"ch"},{"n":16,"text":"세 번째 문장은 Not until이 문장 앞에 나온 경우예요. 이때 주절은 did people begin처럼 did가 주어 앞으로 나오는 도치가 된답니다. Not until 이하의 시점이 되어서야 비로소 뒤의 일이 시작된다는 강조 구조로 이해하면 쉬워요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 \u003cspan class=\"fx\">Not until the rise of ecology at the beginning of the twentieth century did people\u003c/span> begin to think seriously of land as a natural system with interconnecting parts.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>생태학이 등장하기 전에는 사람들이 땅을 서로 연결된 부분을 가진 자연계로 진지하게 여기지 않았다는 뜻이다. 생태학의 등장 이후에야 그런 시각이 시작되었다는 점을 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Not until the rise of ecology at the beginning of the twentieth century did people begin to think seriously of land\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">People did not begin to think seriously of land until the rise of ecology at the beginning of the twentieth century\u003c/span>\u003cdiv class=\"w\">Not until 도치를 풀어 부정문과 until 절로 바꾼 자연스러운 어순이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">think seriously of land as a natural system\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regard land as a natural system\u003c/span>\u003cdiv class=\"w\">think of A as B를 regard A as B로 바꾼 같은 뜻의 격식 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the rise of ecology\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the emergence of ecology\u003c/span>\u003cspan class=\"y-eq\">the rise of ecology = the emergence of ecology\u003c/span>\u003cdiv class=\"w\">생태학이 등장한 사건을 emergence로 바꿔 같은 의미를 살렸다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">think seriously of land as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regard land as\u003c/span>\u003cspan class=\"y-eq\">think seriously of A as B = regard A as B\u003c/span>\u003cdiv class=\"w\">A를 B로 진지하게 여기다라는 뜻을 간결한 동사로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">interconnecting parts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">interconnected parts\u003c/span>\u003cspan class=\"y-eq\">interconnecting parts = interconnected parts\u003c/span>\u003cdiv class=\"w\">서로 연결된 부분이라는 뜻을 형용사형으로 바꾼 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">People started to regard land as a natural system made up of interconnected parts only after ecology emerged in the early twentieth century.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 생태학이 등장하기 전에는 땅을 연결된 부분을 가진 자연계로 진지하게 보지 않았다는 뜻이에요. 생태학이 생기고 나서야 사람들의 시각이 바뀌기 시작했다는 점을 강조하고 있죠. 그래서 시간의 흐름과 관점의 변화를 함께 읽어야 해요.","hl":"mn"},{"n":18,"text":"도치를 풀면 People did not begin to think seriously of land until the rise of ecology at the beginning of the twentieth century가 돼요. 또는 think seriously of land as를 regard land as로 바꿔 더 간결하게 말할 수도 있어요. 뜻은 그대로 유지된답니다.","hl":"rw"},{"n":19,"text":"the rise of ecology는 the emergence of ecology로 바꿀 수 있어요. think seriously of land as는 regard land as로 간결하게 표현할 수 있고요. interconnecting parts는 interconnected parts처럼 형용사형으로 바꿔도 같은 뜻이에요.","hl":"ph"},{"n":20,"text":"이제 바꾼 문장을 읽어 볼게요. People started to regard land as a natural system made up of interconnected parts only after ecology emerged in the early twentieth century. 생태학이 이십 세기 초에 등장한 뒤에야 사람들이 땅을 연결된 부분으로 이루어진 자연계로 보기 시작했다는 뜻이에요. only after를 사용해 시작 시점을 분명히 했습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Every cell is a triumph of natural selection, and we're made of trillions of cells. \u003cspan class=\"fx\">Within us, is a little universe.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Every cell \u003c/div>\u003cdiv class=\"k\">모든 세포는\u003c/div>\u003cdiv class=\"e\">is a triumph \u003c/div>\u003cdiv class=\"k\">업적이다\u003c/div>\u003cdiv class=\"e\">of natural selection, \u003c/div>\u003cdiv class=\"k\">자연 선택의\u003c/div>\u003cdiv class=\"e\">and we're made \u003c/div>\u003cdiv class=\"k\">그리고 우리는 만들어졌다\u003c/div>\u003cdiv class=\"e\">of trillions of cells. \u003c/div>\u003cdiv class=\"k\">수조 개의 세포로\u003c/div>\u003cdiv class=\"e\">Within us, \u003c/div>\u003cdiv class=\"k\">우리 안에\u003c/div>\u003cdiv class=\"e\">is a little universe.\u003c/div>\u003cdiv class=\"k\">작은 우주가 있다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>장소 부사구 \u003cb class=\"key\">Within us\u003c/b>가 문두에 오고 동사 \u003cb class=\"key\">is\u003c/b>가 주어 \u003cb class=\"key\">a little universe\u003c/b> 앞에 놓인 도치 구문이다. ‘우리 안에 작은 우주가 있다’라는 뜻으로 장면을 강조한다.\u003c/div>","segs":[{"n":21,"text":"Every cell, 모든 세포는. is a triumph, 업적이다. of natural selection, 자연 선택의. and we're made, 그리고 우리는 만들어졌다. of trillions of cells, 수조 개의 세포로. Within us, 우리 안에. is a little universe, 작은 우주가 있다","hl":"ch"},{"n":22,"text":"네 번째 문장에서는 Within us가 앞에 나오고 is a little universe가 이어져요. 장소를 먼저 말하고 나서 무엇이 있는지를 뒤에 제시하면서 도치가 일어난 거예요. 이때 주어는 a little universe이고 is는 동사라는 점을 꼭 확인해 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Every cell is a triumph of natural selection, and we're made of trillions of cells. \u003cspan class=\"fx\">Within us, is a little universe.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리 몸이 수조 개의 세포로 이루어져 있고 그 내부가 작은 우주처럼 복잡하고 신비롭다는 뜻이다. 과학적 사실을 시적인 이미지로 표현해 감탄과 경이를 담고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Within us, is a little universe.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">A little universe is within us.\u003c/span>\u003cdiv class=\"w\">도치를 풀어 주어 a little universe를 문장 앞에 둔 자연스러운 어순이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">we're made of trillions of cells\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">we consist of trillions of cells\u003c/span>\u003cdiv class=\"w\">be made of를 consist of로 바꾼 같은 뜻의 격식 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be made of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">consist of\u003c/span>\u003cspan class=\"y-eq\">be made of = consist of\u003c/span>\u003cdiv class=\"w\">여러 요소로 구성되다라는 뜻을 동사 consist of로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">trillions of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">countless\u003c/span>\u003cspan class=\"y-eq\">trillions of = countless\u003c/span>\u003cdiv class=\"w\">수조 개라는 큰 수를 셀 수 없이 많은이라는 표현으로 풀었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">within us\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">inside us\u003c/span>\u003cspan class=\"y-eq\">within us = inside us\u003c/span>\u003cdiv class=\"w\">우리 안에라는 장소 의미를 일상적인 inside로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Every cell is a remarkable product of natural selection, and because we consist of trillions of cells, there is a small universe inside us.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 우리 몸이 수조 개의 세포로 이루어져 있고 그 안이 작은 우주처럼 복잡하고 신비롭다는 뜻이에요. 모든 세포가 자연 선택의 업적이라는 과학적 설명에 시적인 느낌을 더한 표현이죠. 그래서 딱딱한 사실을 감성적으로 표현한 문장으로 이해하면 좋아요.","hl":"mn"},{"n":24,"text":"도치를 풀면 A little universe is within us라고 할 수 있어요. 또 we're made of는 we consist of로 바꾸면 더 격식 있는 표현이 된답니다. 두 표현 모두 우리가 세포로 구성되어 있다는 뜻을 담고 있어요.","hl":"rw"},{"n":25,"text":"be made of는 consist of로 바꿔 쓸 수 있어요. trillions of는 countless처럼 셀 수 없이 많은이라는 뜻으로 풀 수 있고요. within us는 inside us로 바꿔도 같은 장소 의미가 된답니다.","hl":"ph"},{"n":26,"text":"같은 뜻의 문장을 읽어 볼게요. Every cell is a remarkable product of natural selection, and because we consist of trillions of cells, there is a small universe inside us. 모든 세포가 자연 선택의 놀라운 결과이고 우리가 수조 개의 세포로 구성되어 있으므로 우리 안에 작은 우주가 있다는 뜻이에요. because를 사용해 원인과 결과를 분명히 했습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Natural ability is necessary to become an expert in anything, but \u003cspan class=\"fx\">no less important is the willingness to study.\u003c/span>\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Natural ability \u003c/div>\u003cdiv class=\"k\">타고난 재능은\u003c/div>\u003cdiv class=\"e\">is necessary \u003c/div>\u003cdiv class=\"k\">필수적이다\u003c/div>\u003cdiv class=\"e\">to become an expert \u003c/div>\u003cdiv class=\"k\">전문가가 되기 위해\u003c/div>\u003cdiv class=\"e\">in anything, \u003c/div>\u003cdiv class=\"k\">어떤 것에서든\u003c/div>\u003cdiv class=\"e\">but \u003c/div>\u003cdiv class=\"k\">그러나\u003c/div>\u003cdiv class=\"e\">no less important \u003c/div>\u003cdiv class=\"k\">못지않게 중요한 것은\u003c/div>\u003cdiv class=\"e\">is the willingness to study.\u003c/div>\u003cdiv class=\"k\">공부하려는 의지이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>보어 \u003cb class=\"key\">no less important\u003c/b>가 문두에 오고 동사 \u003cb class=\"key\">is\u003c/b>가 주어 \u003cb class=\"key\">the willingness to study\u003c/b> 앞에 놓인 도치 구문이다. no less important는 ‘그에 못지않게 중요한’이라는 뜻으로 앞 내용과 대등하게 연결한다.\u003c/div>","segs":[{"n":27,"text":"Natural ability, 타고난 재능은. is necessary, 필수적이다. to become an expert, 전문가가 되기 위해. in anything, 어떤 것에서든. but, 그러나. no less important, 못지않게 중요한 것은. is the willingness to study, 공부하려는 의지이다","hl":"ch"},{"n":28,"text":"다섯 번째 문장에서는 no less important가 앞에 나오고 is the willingness to study가 이어져요. 보어를 강조하려고 앞으로 보내면서 is가 주어 앞에 온 도치예요. no less important는 그에 못지않게 중요하다는 뜻으로 앞의 재능과 비교하는 표현이랍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Natural ability is necessary to become an expert in anything, but \u003cspan class=\"fx\">no less important is the willingness to study.\u003c/span>\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>전문가가 되려면 타고난 재능도 필요하지만 공부하려는 의지가 재능에 못지않게 중요하다는 뜻이다. 재능만 강조하지 말고 꾸준히 배우려는 태도를 보라는 조언이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">no less important is the willingness to study\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the willingness to study is no less important\u003c/span>\u003cdiv class=\"w\">도치를 풀어 주어와 보어를 원래 순서로 되돌린 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">no less important\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">just as important\u003c/span>\u003cdiv class=\"w\">못지않게 중요하다는 뜻을 just as important로 풀어 일상적으로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">natural ability\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">innate talent\u003c/span>\u003cspan class=\"y-eq\">natural ability = innate talent\u003c/span>\u003cdiv class=\"w\">타고난 재능이라는 뜻을 innate talent로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">no less important\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">equally important\u003c/span>\u003cspan class=\"y-eq\">no less important = equally important\u003c/span>\u003cdiv class=\"w\">못지않게 중요하다는 비교 표현을 동등 비교로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">willingness to study\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">readiness to learn\u003c/span>\u003cspan class=\"y-eq\">willingness to study = readiness to learn\u003c/span>\u003cdiv class=\"w\">공부하려는 의지를 배우려는 준비성이라는 말로 풀었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">To become an expert in any field, you need natural talent, but the willingness to study is just as important.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 전문가가 되려면 타고난 재능도 필요하지만 공부하려는 의지가 그에 못지않게 중요하다는 뜻이에요. 재능만 믿지 말고 꾸준히 배우려는 태도를 가지라는 조언으로 읽을 수 있죠. 그래서 두 가지가 대등하게 중요하다는 느낌을 살펴야 해요.","hl":"mn"},{"n":30,"text":"도치를 풀면 the willingness to study is no less important라고 할 수 있어요. 또는 no less important를 just as important로 바꿔 더 쉽게 표현할 수도 있답니다. 뜻은 공부하려는 의지가 재능만큼 중요하다는 거예요.","hl":"rw"},{"n":31,"text":"natural ability는 innate talent로 바꿀 수 있어요. no less important는 equally important로 풀 수 있고요. willingness to study는 readiness to learn처럼 배우려는 준비성이라는 뜻으로 바꿀 수 있답니다.","hl":"ph"},{"n":32,"text":"바꾼 문장을 읽어 볼게요. To become an expert in any field, you need natural talent, but the willingness to study is just as important. 어떤 분야에서든 전문가가 되려면 재능이 필요하지만 공부하려는 의지도 그만큼 중요하다는 뜻이에요. just as important를 사용해 두 요소를 대등하게 연결했습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 For a computer to solve a problem, \u003cspan class=\"fx\">not only must the solution be\u003c/span> very detailed, but it must also be written in a form the computer can understand.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">For a computer \u003c/div>\u003cdiv class=\"k\">컴퓨터가\u003c/div>\u003cdiv class=\"e\">to solve a problem, \u003c/div>\u003cdiv class=\"k\">문제를 해결하기 위해서는\u003c/div>\u003cdiv class=\"e\">not only must the solution \u003c/div>\u003cdiv class=\"k\">해결책은 단지 ~해야 할 뿐만 아니라\u003c/div>\u003cdiv class=\"e\">be very detailed, \u003c/div>\u003cdiv class=\"k\">아주 자세해야 하고\u003c/div>\u003cdiv class=\"e\">but it must also be written \u003c/div>\u003cdiv class=\"k\">그것은 또한 쓰여야 한다\u003c/div>\u003cdiv class=\"e\">in a form \u003c/div>\u003cdiv class=\"k\">형태로\u003c/div>\u003cdiv class=\"e\">the computer can understand.\u003c/div>\u003cdiv class=\"k\">컴퓨터가 이해할 수 있는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">not only\u003c/b>가 문두에 오면서 조동사 \u003cb class=\"key\">must\u003c/b>가 주어 \u003cb class=\"key\">the solution\u003c/b> 앞으로 나온 도치 구문이다. 뒤의 but also와 짝을 이루어 두 조건을 모두 강조한다.\u003c/div>","segs":[{"n":33,"text":"For a computer, 컴퓨터가. to solve a problem, 문제를 해결하기 위해서는. not only must the solution, 해결책은 단지 ~해야 할 뿐만 아니라. be very detailed, 아주 자세해야 하고. but it must also be written, 그것은 또한 쓰여야 한다. in a form, 형태로. the computer can understand, 컴퓨터가 이해할 수 있는","hl":"ch"},{"n":34,"text":"여섯 번째 문장에서는 not only가 앞에 오면서 must the solution 순서가 되었어요. not only가 문두에 오면 조동사가 주어 앞으로 나오는 도치가 일어난답니다. 뒤에는 but also가 나와서 두 번째 조건을 이어 준다는 점도 기억해 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 For a computer to solve a problem, \u003cspan class=\"fx\">not only must the solution be\u003c/span> very detailed, but it must also be written in a form the computer can understand.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>컴퓨터가 문제를 해결하려면 해결 방법이 아주 자세해야 하고, 동시에 컴퓨터가 이해할 수 있는 형태로 쓰여야 한다는 뜻이다. 두 조건이 모두 충족되어야 한다는 점을 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not only must the solution be very detailed, but it must also be written\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the solution must not only be very detailed but also be written\u003c/span>\u003cdiv class=\"w\">not only 도치를 풀어 조동사 must 뒤에 not only를 둔 자연스러운 어순이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in a form the computer can understand\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in a format that the computer can understand\u003c/span>\u003cdiv class=\"w\">form을 format으로 바꾸고 관계대명사 that을 넣어 더 분명하게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">for a computer to solve\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in order for a computer to solve\u003c/span>\u003cspan class=\"y-eq\">for a computer to solve = in order for a computer to solve\u003c/span>\u003cdiv class=\"w\">목적을 더 분명히 드러내는 표현으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">very detailed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">highly specific\u003c/span>\u003cspan class=\"y-eq\">very detailed = highly specific\u003c/span>\u003cdiv class=\"w\">아주 자세하다는 뜻을 매우 구체적이라는 말로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in a form\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in a format\u003c/span>\u003cspan class=\"y-eq\">in a form = in a format\u003c/span>\u003cdiv class=\"w\">컴퓨터가 다루는 형식이라는 뜻을 format으로 더 정확히 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">In order for a computer to solve a problem, the solution must be highly detailed and also written in a format that the computer can understand.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 컴퓨터가 문제를 해결하려면 해결책이 아주 자세해야 하고 동시에 컴퓨터가 이해할 수 있는 형태로 쓰여야 한다는 뜻이에요. 두 조건 중 하나만으로는 충분하지 않다는 점을 강조하고 있죠. 그래서 not only와 but also가 모두 중요한 문장이에요.","hl":"mn"},{"n":36,"text":"도치를 풀면 the solution must not only be very detailed but also be written in a form the computer can understand라고 할 수 있어요. in a form은 in a format으로 바꾸면 더 분명한 느낌을 줄 수 있답니다. 두 조건을 모두 살린 표현이에요.","hl":"rw"},{"n":37,"text":"for a computer to solve는 in order for a computer to solve로 바꿔 목적을 분명히 할 수 있어요. very detailed는 highly specific으로 바꿀 수 있고요. in a form은 in a format처럼 더 정확한 표현으로 바꿀 수 있답니다.","hl":"ph"},{"n":38,"text":"이제 바꾼 문장을 읽어 볼게요. In order for a computer to solve a problem, the solution must be highly detailed and also written in a format that the computer can understand. 컴퓨터가 문제를 해결하려면 해결책이 매우 구체적이어야 하고 컴퓨터가 이해할 수 있는 형식으로 쓰여야 한다는 뜻이에요. in order for와 format을 사용해 뜻을 분명히 했습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 \u003cspan class=\"fx\">Under no circumstances will anyone's personal information be given out\u003c/span> to any third party without the express permission of the person concerned.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Under no circumstances \u003c/div>\u003cdiv class=\"k\">어떤 상황에서도\u003c/div>\u003cdiv class=\"e\">will anyone's personal information \u003c/div>\u003cdiv class=\"k\">누군가의 개인 정보는 ~되지 않을 것이다\u003c/div>\u003cdiv class=\"e\">be given out \u003c/div>\u003cdiv class=\"k\">배포되다\u003c/div>\u003cdiv class=\"e\">to any third party \u003c/div>\u003cdiv class=\"k\">어떤 제삼자에게\u003c/div>\u003cdiv class=\"e\">without the express permission \u003c/div>\u003cdiv class=\"k\">명시적 허락 없이는\u003c/div>\u003cdiv class=\"e\">of the person concerned.\u003c/div>\u003cdiv class=\"k\">관계자의\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>부정 전치사구 \u003cb class=\"key\">Under no circumstances\u003c/b>가 문두에 오면서 조동사 \u003cb class=\"key\">will\u003c/b>이 주어 앞에 나오고, 수동태 \u003cb class=\"key\">be given out\u003c/b>이 이어진다. ‘어떤 상황에서도 …되지 않을 것이다’라는 강한 금지를 나타낸다.\u003c/div>","segs":[{"n":39,"text":"Under no circumstances, 어떤 상황에서도. will anyone's personal information, 누군가의 개인 정보는 ~되지 않을 것이다. be given out, 배포되다. to any third party, 어떤 제삼자에게. without the express permission, 명시적 허락 없이는. of the person concerned, 관계자의","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 Under no circumstances가 앞에 나온 도치예요. 이 부정어구가 문두에 오면 조동사 will이 주어 앞으로 나오고 be given out이 이어져요. 그래서 will anyone's personal information be given out 순서가 된답니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 \u003cspan class=\"fx\">Under no circumstances will anyone's personal information be given out\u003c/span> to any third party without the express permission of the person concerned.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>당사자의 명시적 허락 없이는 누구의 개인 정보도 제삼자에게 제공되지 않는다는 뜻이다. 개인정보 보호 규정처럼 매우 공식적이고 단호한 문장이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Under no circumstances will anyone's personal information be given out\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">No one's personal information will be given out under any circumstances\u003c/span>\u003cdiv class=\"w\">부정어구를 문미로 보내고 주어를 No one's로 바꾼 자연스러운 어순이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be given out to any third party\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be disclosed to any outside party\u003c/span>\u003cdiv class=\"w\">give out을 disclose로 바꾸고 third party를 outside party로 풀어 공식적인 느낌을 살렸다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">under no circumstances\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in no case\u003c/span>\u003cspan class=\"y-eq\">under no circumstances = in no case\u003c/span>\u003cdiv class=\"w\">어떤 상황에서도 아니라는 강한 부정을 같은 격식 표현으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">give out\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">disclose\u003c/span>\u003cspan class=\"y-eq\">give out = disclose\u003c/span>\u003cdiv class=\"w\">정보를 밖으로 내보낸다는 뜻을 공식적인 동사 disclose로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">express permission\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">explicit consent\u003c/span>\u003cspan class=\"y-eq\">express permission = explicit consent\u003c/span>\u003cdiv class=\"w\">명시적 허락이라는 뜻을 명백한 동의라는 표현으로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">No one's personal information will be disclosed to any outside party under any circumstances without that person's explicit consent.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 당사자의 명시적 허락 없이는 누구의 개인 정보도 제삼자에게 제공되지 않는다는 뜻이에요. 개인정보 보호 규정처럼 매우 공식적이고 단호한 느낌을 담고 있죠. 어떤 예외도 허용하지 않는다는 강한 의지를 읽어야 해요.","hl":"mn"},{"n":42,"text":"도치를 풀면 No one's personal information will be given out under any circumstances without that person's explicit consent라고 할 수 있어요. give out은 disclose로 바꾸면 더 공식적인 표현이 된답니다. 뜻은 개인 정보를 절대 제삼자에게 제공하지 않는다는 거예요.","hl":"rw"},{"n":43,"text":"under no circumstances는 in no case로 바꿀 수 있어요. give out은 disclose로 바꾸면 공식적인 느낌이 살고요. express permission은 explicit consent처럼 명백한 동의라는 뜻으로 바꿀 수 있답니다.","hl":"ph"},{"n":44,"text":"바꾼 문장을 읽어 볼게요. No one's personal information will be disclosed to any outside party under any circumstances without that person's explicit consent. 그 사람의 명백한 동의 없이는 누구의 개인 정보도 어떤 상황에서도 외부에 공개되지 않는다는 뜻이에요. disclose와 explicit consent를 사용해 공식적인 분위기를 살렸습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 \u003cspan class=\"fx\">Out of the fundamentals of elementary algebra evolved\u003c/span> the abstract algebra used today and the concept of an algebraic structure.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Out of the fundamentals \u003c/div>\u003cdiv class=\"k\">원리로부터\u003c/div>\u003cdiv class=\"e\">of elementary algebra \u003c/div>\u003cdiv class=\"k\">기초 대수학의\u003c/div>\u003cdiv class=\"e\">evolved \u003c/div>\u003cdiv class=\"k\">발전했다\u003c/div>\u003cdiv class=\"e\">the abstract algebra \u003c/div>\u003cdiv class=\"k\">추상 대수학과\u003c/div>\u003cdiv class=\"e\">used today \u003c/div>\u003cdiv class=\"k\">오늘날 사용되는\u003c/div>\u003cdiv class=\"e\">and the concept \u003c/div>\u003cdiv class=\"k\">그리고 개념이\u003c/div>\u003cdiv class=\"e\">of an algebraic structure.\u003c/div>\u003cdiv class=\"k\">대수 구조의\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>전치사구 \u003cb class=\"key\">Out of the fundamentals of elementary algebra\u003c/b>가 문두에 오고 동사 \u003cb class=\"key\">evolved\u003c/b>가 주어 앞에 놓인 도치 구문이다. 주어는 the abstract algebra used today and the concept of an algebraic structure라는 긴 명사구이다.\u003c/div>","segs":[{"n":45,"text":"Out of the fundamentals, 원리로부터. of elementary algebra, 기초 대수학의. evolved, 발전했다. the abstract algebra, 추상 대수학과. used today, 오늘날 사용되는. and the concept, 그리고 개념이. of an algebraic structure, 대수 구조의","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 Out of the fundamentals of elementary algebra가 앞에 나온 도치예요. 전치사구가 먼저 나오고 동사 evolved가 주어 앞에 놓였죠. 이때 진짜 주어는 the abstract algebra used today and the concept of an algebraic structure라는 긴 명사구랍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 \u003cspan class=\"fx\">Out of the fundamentals of elementary algebra evolved\u003c/span> the abstract algebra used today and the concept of an algebraic structure.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>오늘날 사용되는 추상 대수학과 대수 구조의 개념이 기초 대수학의 원리에서 발전해 나왔다는 뜻이다. 수학 개념의 역사적 발전을 강조하는 문장이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Out of the fundamentals of elementary algebra evolved the abstract algebra used today and the concept of an algebraic structure.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The abstract algebra used today and the concept of an algebraic structure evolved out of the fundamentals of elementary algebra.\u003c/span>\u003cdiv class=\"w\">도치를 풀어 긴 주어를 문장 앞에 둔 자연스러운 어순이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Out of the fundamentals of elementary algebra evolved\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The fundamentals of elementary algebra gave rise to\u003c/span>\u003cdiv class=\"w\">전치사구 도치를 주어 중심의 능동 표현으로 바꾼 것이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">out of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">from\u003c/span>\u003cspan class=\"y-eq\">out of = from\u003c/span>\u003cdiv class=\"w\">기원이나 출처를 나타내는 out of를 from으로 간단히 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fundamentals\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">basic principles\u003c/span>\u003cspan class=\"y-eq\">fundamentals = basic principles\u003c/span>\u003cdiv class=\"w\">근본 원리라는 뜻을 basic principles로 풀었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">evolve\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">develop\u003c/span>\u003cspan class=\"y-eq\">evolve = develop\u003c/span>\u003cdiv class=\"w\">발전하다라는 뜻을 같은 의미의 동사로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 \u003cspan class=\"fx\">Only in the last few decades, in the primarily industrially developed economies, has food\u003c/span> become so plentiful and easy to obtain as to cause fat-related health problems.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>지난 몇 십 년 동안 주로 산업화된 경제권에서만 음식이 지방 관련 건강 문제를 일으킬 만큼 풍부하고 얻기 쉬워졌다는 뜻이다. 최근의 풍요가 건강 문제로 이어졌다는 점을 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Only in the last few decades, in the primarily industrially developed economies, has food become\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Food has become\u003c/span>\u003cdiv class=\"w\">Only 부사구 도치를 풀어 주어 food를 앞에 둔 자연스러운 어순으로 바꾼 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so plentiful and easy to obtain as to cause\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so abundant and readily available that it causes\u003c/span>\u003cdiv class=\"w\">so as to 결과 표현을 so that 결과절로 바꾼 같은 뜻의 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the last few decades\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">recent decades\u003c/span>\u003cspan class=\"y-eq\">the last few decades = recent decades\u003c/span>\u003cdiv class=\"w\">지난 몇 십 년이라는 뜻을 recent decades로 간결하게 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">plentiful\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">abundant\u003c/span>\u003cspan class=\"y-eq\">plentiful = abundant\u003c/span>\u003cdiv class=\"w\">풍부한이라는 뜻을 같은 의미의 형용사로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">easy to obtain\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">readily available\u003c/span>\u003cspan class=\"y-eq\">easy to obtain = readily available\u003c/span>\u003cdiv class=\"w\">얻기 쉽다는 뜻을 쉽게 이용 가능한이라는 표현으로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Food has become so abundant and readily available in mainly industrialized economies only over recent decades that it causes health problems related to fat.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 지난 몇 십 년 동안 주로 산업화된 경제권에서 음식이 지방 관련 건강 문제를 일으킬 만큼 풍부하고 얻기 쉬워졌다는 뜻이에요. 최근의 풍요가 오히려 건강 문제로 이어졌다는 점을 강조하고 있죠. 그래서 only가 시간과 장소를 강하게 한정한다는 느낌을 살펴야 해요.","hl":"mn"},{"n":60,"text":"도치를 풀면 Food has become so plentiful and easy to obtain as to cause fat-related health problems only in the last few decades, in the primarily industrially developed economies라고 할 수 있어요. so as to는 so that it causes로 바꿔 결과를 더 분명히 할 수도 있답니다.","hl":"rw"},{"n":61,"text":"the last few decades는 recent decades로 바꿀 수 있어요. plentiful은 abundant로 바꿔도 같은 뜻이고요. easy to obtain은 readily available처럼 쉽게 이용 가능한이라는 뜻으로 바꿀 수 있답니다.","hl":"ph"},{"n":62,"text":"바꾼 문장을 읽어 볼게요. Food has become so abundant and readily available in mainly industrialized economies only over recent decades that it causes health problems related to fat. 최근 몇 십 년 동안 주로 산업화된 경제권에서 음식이 너무 풍부하고 쉽게 구할 수 있게 되어 지방 관련 건강 문제를 일으킨다는 뜻이에요. so that 결과 표현을 사용해 인과 관계를 분명히 했습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 \u003cspan class=\"fx\">Fundamental to most moral approaches is the idea\u003c/span> that human life has a special dignity and value that is worth preserving even at the expense of self-interest.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Fundamental to most moral approaches \u003c/div>\u003cdiv class=\"k\">대부분의 도덕적 접근에 근본적인 것은\u003c/div>\u003cdiv class=\"e\">is the idea \u003c/div>\u003cdiv class=\"k\">생각이다\u003c/div>\u003cdiv class=\"e\">that human life has \u003c/div>\u003cdiv class=\"k\">인간의 삶은 가진다\u003c/div>\u003cdiv class=\"e\">a special dignity and value \u003c/div>\u003cdiv class=\"k\">특별한 존엄성과 가치를\u003c/div>\u003cdiv class=\"e\">that is worth preserving \u003c/div>\u003cdiv class=\"k\">보존할 가치가 있는\u003c/div>\u003cdiv class=\"e\">even at the expense of self-interest.\u003c/div>\u003cdiv class=\"k\">심지어 자기 이익을 희생하고서라도\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>보어 \u003cb class=\"key\">Fundamental to most moral approaches\u003c/b>가 문두에 오고 동사 \u003cb class=\"key\">is\u003c/b>가 주어 \u003cb class=\"key\">the idea\u003c/b> 앞에 놓인 도치 구문이다. 뒤의 that절은 the idea의 내용을 설명하는 동격절이다.\u003c/div>","segs":[{"n":63,"text":"Fundamental to most moral approaches, 대부분의 도덕적 접근에 근본적인 것은. is the idea, 생각이다. that human life has, 인간의 삶은 가진다. a special dignity and value, 특별한 존엄성과 가치를. that is worth preserving, 보존할 가치가 있는. even at the expense of self-interest, 심지어 자기 이익을 희생하고서라도","hl":"ch"},{"n":64,"text":"열한 번째 문장은 Fundamental to most moral approaches가 앞에 나온 도치예요. 보어가 먼저 나오고 is the idea가 이어지면서 주어 the idea가 뒤에 놓였죠. 뒤의 that절은 the idea의 내용을 풀어 주는 동격절로 보면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 \u003cspan class=\"fx\">Fundamental to most moral approaches is the idea\u003c/span> that human life has a special dignity and value that is worth preserving even at the expense of self-interest.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>대부분의 도덕적 접근은 인간의 삶이 특별한 존엄성과 가치를 지니며 자기 이익을 희생해서라도 보존할 가치가 있다는 생각을 바탕으로 한다는 뜻이다. 도덕적 판단의 핵심 근거를 제시한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Fundamental to most moral approaches is the idea\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The idea is fundamental to most moral approaches\u003c/span>\u003cdiv class=\"w\">보어 도치를 풀어 주어 the idea를 앞에 둔 자연스러운 어순이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at the expense of self-interest\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at the cost of self-interest\u003c/span>\u003cdiv class=\"w\">자기 이익을 희생하고서라도라는 뜻을 at the cost of로 바꾼 같은 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fundamental to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">central to\u003c/span>\u003cspan class=\"y-eq\">fundamental to = central to\u003c/span>\u003cdiv class=\"w\">근본이 되는이라는 뜻을 중심이 되는이라는 표현으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">moral approaches\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ethical approaches\u003c/span>\u003cspan class=\"y-eq\">moral approaches = ethical approaches\u003c/span>\u003cdiv class=\"w\">도덕적 접근이라는 뜻을 윤리적 접근으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">worth preserving\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">worthy of preservation\u003c/span>\u003cspan class=\"y-eq\">worth preserving = worthy of preservation\u003c/span>\u003cdiv class=\"w\">보존할 가치가 있다는 뜻을 형용사구로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Most moral approaches are based on the idea that human life has a special dignity and value worth preserving even at the cost of self-interest.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 대부분의 도덕적 접근이 인간의 삶은 특별한 존엄성과 가치를 지닌다는 생각을 바탕으로 한다는 뜻이에요. 그 가치는 자기 이익을 희생해서라도 지켜야 한다는 강한 메시지도 담고 있죠. 그래서 도덕적 판단의 핵심 근거를 제시하는 문장으로 이해하면 좋아요.","hl":"mn"},{"n":66,"text":"도치를 풀면 The idea is fundamental to most moral approaches라고 할 수 있어요. at the expense of self-interest는 at the cost of self-interest로 바꿔도 같은 뜻이에요. 중요한 것은 인간의 존엄성과 가치가 어떤 비용을 치르더라도 보존할 만하다는 점이에요.","hl":"rw"},{"n":67,"text":"fundamental to는 central to로 바꿀 수 있어요. moral approaches는 ethical approaches로 바꿔도 같은 뜻이고요. worth preserving은 worthy of preservation처럼 형용사구로 바꿀 수 있답니다.","hl":"ph"},{"n":68,"text":"바꾼 문장을 읽어 볼게요. Most moral approaches are based on the idea that human life has a special dignity and value worth preserving even at the cost of self-interest. 대부분의 도덕적 접근은 인간의 삶이 자기 이익을 희생해서라도 보존할 가치가 있는 특별한 존엄성과 가치를 가진다는 생각에 바탕을 둔다는 뜻이에요. be based on과 at the cost of를 사용해 자연스럽게 바꿨습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">Laid before me was\u003c/span>, I realized, a scene of almost classical rural beauty—the meadows dotted with contented animals, the woods in the background, a twisting stream threading through it all.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Laid before me \u003c/div>\u003cdiv class=\"k\">내 앞에 놓여진 것은\u003c/div>\u003cdiv class=\"e\">was, \u003c/div>\u003cdiv class=\"k\">였다\u003c/div>\u003cdiv class=\"e\">I realized, \u003c/div>\u003cdiv class=\"k\">내가 깨달았듯이\u003c/div>\u003cdiv class=\"e\">a scene \u003c/div>\u003cdiv class=\"k\">장면\u003c/div>\u003cdiv class=\"e\">of almost classical rural beauty—\u003c/div>\u003cdiv class=\"k\">거의 전형적인 시골의 아름다움—\u003c/div>\u003cdiv class=\"e\">the meadows \u003c/div>\u003cdiv class=\"k\">목초지\u003c/div>\u003cdiv class=\"e\">dotted with contented animals, \u003c/div>\u003cdiv class=\"k\">만족한 동물들이 점점이 있는\u003c/div>\u003cdiv class=\"e\">the woods in the background, \u003c/div>\u003cdiv class=\"k\">배경의 숲\u003c/div>\u003cdiv class=\"e\">a twisting stream \u003c/div>\u003cdiv class=\"k\">구불구불 흐르는 시냇물\u003c/div>\u003cdiv class=\"e\">threading through it all.\u003c/div>\u003cdiv class=\"k\">그 모두를 가로지르는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>과거분사구 \u003cb class=\"key\">Laid before me\u003c/b>가 문두에 오고 동사 \u003cb class=\"key\">was\u003c/b>가 주어 \u003cb class=\"key\">a scene\u003c/b> 앞에 놓인 도치 구문이다. I realized는 문장 중간에 삽입된 절로 ‘내가 깨달았듯이’라는 의미를 더한다.\u003c/div>","segs":[{"n":69,"text":"Laid before me, 내 앞에 놓여진 것은. was, 였다. I realized, 내가 깨달았듯이. a scene, 장면. of almost classical rural beauty—, 거의 전형적인 시골의 아름다움—. the meadows, 목초지. dotted with contented animals, 만족한 동물들이 점점이 있는. the woods in the background, 배경의 숲. a twisting stream, 구불구불 흐르는 시냇물. threading through it all, 그 모두를 가로지르는","hl":"ch"},{"n":70,"text":"열두 번째 문장은 Laid before me가 앞에 나온 도치예요. 과거분사구가 먼저 나오고 was가 주어 a scene 앞에 놓였죠. 중간에 I realized가 삽입되어 내가 깨달았다는 화자의 시점을 더해 준답니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">Laid before me was\u003c/span>, I realized, a scene of almost classical rural beauty—the meadows dotted with contented animals, the woods in the background, a twisting stream threading through it all.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>내 앞에 거의 전형적인 시골의 아름다운 장면이 펼쳐져 있었다는 뜻이다. 목초지와 숲과 시냇물을 차례로 묘사하며 감탄과 발견의 느낌을 전한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Laid before me was, I realized, a scene of almost classical rural beauty\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">I realized that a scene of almost classical rural beauty was laid before me\u003c/span>\u003cdiv class=\"w\">도치와 삽입절을 풀어 I realized that절로 바꾼 자연스러운 문장이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dotted with contented animals\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">scattered with satisfied animals\u003c/span>\u003cdiv class=\"w\">dotted with를 scattered with로, contented를 satisfied로 바꾼 같은 뜻의 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">laid before me\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">spread out in front of me\u003c/span>\u003cspan class=\"y-eq\">laid before me = spread out in front of me\u003c/span>\u003cdiv class=\"w\">내 앞에 펼쳐져 있다는 장면의 느낌을 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dotted with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">scattered with\u003c/span>\u003cspan class=\"y-eq\">dotted with = scattered with\u003c/span>\u003cdiv class=\"w\">점점이 흩어져 있다는 뜻을 scattered with로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">contented\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">satisfied\u003c/span>\u003cspan class=\"y-eq\">contented = satisfied\u003c/span>\u003cdiv class=\"w\">만족한이라는 뜻을 같은 의미의 형용사로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I realized that before me lay a scene of almost timeless rural beauty, with meadows dotted with satisfied animals, woods in the background, and a winding stream running through it all.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 내 앞에 거의 전형적인 시골의 아름다운 장면이 펼쳐져 있었다는 뜻이에요. 만족한 동물들이 있는 목초지와 배경의 숲과 구불구불 흐르는 시냇물을 차례로 그려 내고 있죠. 그래서 감탄과 발견의 분위기를 함께 느껴야 해요.","hl":"mn"},{"n":72,"text":"도치를 풀면 I realized that a scene of almost classical rural beauty was laid before me라고 할 수 있어요. dotted with는 scattered with로, contented는 satisfied로 바꿔도 같은 장면이 그려진답니다. 긴 묘사는 앞에서부터 차근차근 따라가면 돼요.","hl":"rw"},{"n":73,"text":"laid before me는 spread out in front of me로 풀 수 있어요. dotted with는 scattered with로 바꿀 수 있고요. contented는 satisfied로 바꿔도 만족한 동물이라는 뜻이 그대로 살아 있답니다.","hl":"ph"},{"n":74,"text":"마지막 문장을 읽어 볼게요. I realized that before me lay a scene of almost timeless rural beauty, with meadows dotted with satisfied animals, woods in the background, and a winding stream running through it all. 내 앞에 만족한 동물들이 있는 목초지와 배경의 숲과 구불구불 흐르는 시냇물이 어우러진 거의 영원한 시골의 아름다운 장면이 펼쳐져 있음을 깨달았다는 뜻이에요. with 구문을 사용해 묘사를 자연스럽게 이어 갔습니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마블레드\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>문두에 \u003cb class=\"key\">부정어구\u003c/b>가 오면 조동사가 주어 앞으로 이동해 강조와 도치가 함께 나타난다.\u003c/li>\u003cli>\u003cb class=\"key\">전치사구\u003c/b>나 \u003cb class=\"key\">보어\u003c/b>가 앞에 오면 동사가 주어 앞에 놓여 장면이나 의미를 강조한다.\u003c/li>\u003cli>\u003cb class=\"key\">과거분사구\u003c/b>가 문두에 오면 be동사가 주어 앞에 오는 도치가 자주 일어난다.\u003c/li>\u003cli>도치를 풀어 일반 어순으로 바꾸는 연습이 해석과 패러프레이징의 핵심이다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 마블레드 유닛에서 문두 강조와 도치를 배웠어요. 부정어구, 전치사구, 보어, 분사구가 앞에 오면 주어와 동사의 순서가 바뀐다는 점이 핵심이었죠. 일반동사는 do, does, did를 활용하고, be동사나 have동사는 그 동사가 직접 주어 앞으로 나온다는 것도 꼭 기억해 주세요. 긴 문장을 만나도 오늘 배운 뼈대를 떠올리면 훨씬 쉽게 읽을 수 있을 거예요. 수고 많았습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
