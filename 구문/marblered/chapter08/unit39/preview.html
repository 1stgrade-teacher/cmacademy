}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 39 반전 · 대조의 부사절","title":"고등 영문법 완성 Chapter 8 Unit 39 반전과 대조의 부사절","audioDir":"preview_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 8 Unit 39 반전과 대조의 부사절\u003c/div>\u003ch1>고등 영문법 완성 Chapter 8 Unit 39 반전과 대조의 부사절\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>비록 ~일지라도를 뜻하는 양보의 부사절과 대조, 그리고 다양한 복합관계사 구문을 정확히 이해하고 문장에 적용한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 Chapter 8의 서른아홉 번째 시간으로 반전과 대조를 나타내는 부사절을 함께 공부해 볼 거예요. 영어 독해나 작문을 할 때 양보나 대조를 나타내는 표현들은 정말 자주 등장하거든요. 오늘 저와 함께 핵심 구문들을 꼼꼼하게 정리하고 문제까지 완벽하게 정복해 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">양보의 부사절: although, though, even though와 even if\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">although\u003c/b>, \u003cb class=\"key\">though\u003c/b>, \u003cb class=\"key\">even though\u003c/b>는 비록 ~이지만이라는 뜻의 양보를 나타내요. \u003cb class=\"key\">even if\u003c/b>는 설령 ~일지라도라는 뜻으로 사실이 아닐 수도 있는 조건을 양보할 때 써요.\u003cdiv>\u003cspan class=\"g-formula\">although / even though / even if + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Although he was tired\u003c/span>, he kept working.\u003c/div>\u003cdiv class=\"g-ko\">그는 피곤했지만 계속 일했다.\u003c/div>\u003cdiv class=\"g-note\">사실인 전제를 바탕으로 한 양보의 의미를 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Even if it rains\u003c/span>, we will go.\u003c/div>\u003cdiv class=\"g-ko\">비가 오더라도 우리는 갈 것이다.\u003c/div>\u003cdiv class=\"g-note\">아직 일어나지 않은 가정을 전제하는 양보의 의미입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">even though\u003c/b> 뒤에는 절대로 \u003cb class=\"key\">but\u003c/b>을 함께 쓰지 않도록 주의해야 해요.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념은 비록 ~이지만이나 설령 ~일지라도를 뜻하는 양보의 부사절이에요. although나 even though는 사실인 내용을 전제하며 비록 ~이지만이라고 해석하고, even if는 사실이 아닐 수도 있는 상황을 가정해서 설령 ~일지라도라고 해석해요. 특히 even though는 강조형이라는 점을 꼭 기억해 두세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 볼게요. Although he was tired, he kept working이라고 하면 그는 피곤했지만 계속 일했다라는 뜻이 돼요. 피곤하다는 사실을 알면서도 계속 일한 상황을 나타내죠.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. Even if it rains, we will go는 비가 오더라도 우리는 갈 것이다라는 뜻이에요. 비가 올지 안 올지 모르는 상황을 가정해서 설령 비가 오더라도 가겠다는 의지를 보여주는 문장이에요.","hl":"ex-1"},{"n":5,"text":"여기서 아주 중요한 팁이 있어요. even though를 썼을 때 뒤에 접속사 but을 또 쓰면 절대 안 된다는 점을 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">대조의 부사절과 however 도치 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">while\u003c/b>과 \u003cb class=\"key\">whereas\u003c/b>는 ~인 반면에라는 뜻으로 \u003cb class=\"key\">대조\u003c/b>를 나타내요. \u003cb class=\"key\">however\u003c/b> 뒤에 \u003cb class=\"key\">형용사나 부사\u003c/b>가 오고 주어와 동사가 오면 아무리 ~하더라도라는 뜻이 돼요.\u003cdiv>\u003cspan class=\"g-formula\">however + 형용사/부사 + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Tom likes tea, \u003cspan class=\"fx\">whereas Ann prefers coffee\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">Tom은 차를 좋아하는 반면 Ann은 커피를 더 좋아한다.\u003c/div>\u003cdiv class=\"g-note\">두 대상의 취향을 대조하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">However hard you try\u003c/span>, you can't please everyone.\u003c/div>\u003cdiv class=\"g-ko\">아무리 노력해도 모두를 만족시킬 수는 없다.\u003c/div>\u003cdiv class=\"g-note\">however 뒤에 부사 hard가 바로 이어져 양보의 의미를 더합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">however\u003c/b> 바로 뒤에는 반드시 \u003cb class=\"key\">형용사나 부사\u003c/b>가 와야 한다는 것을 꼭 기억하세요.\u003c/div>","segs":[{"n":6,"text":"두 번째 개념은 대조를 나타내는 while과 whereas, 그리고 however를 활용한 양보 구문이에요. while이나 whereas는 서로 다른 두 상황을 대조할 때 쓰고요. however 뒤에 형용사나 부사가 바로 붙으면 아무리 ~하더라도라는 뜻의 양보 구문이 완성돼요.","hl":"rule"},{"n":7,"text":"예문을 함께 읽어 볼게요. Tom likes tea, whereas Ann prefers coffee는 Tom은 차를 좋아하는 반면 Ann은 커피를 더 좋아한다라는 뜻이에요. 두 사람의 취향이 대조되는 걸 명확하게 보여주죠.","hl":"ex-0"},{"n":8,"text":"다음 예문이에요. However hard you try, you can't please everyone은 아무리 노력해도 모두를 만족시킬 수는 없다라는 뜻이에요. however 바로 뒤에 부사 hard가 와서 아무리 열심히 노력할지라도라는 의미를 만들어 내고 있어요.","hl":"ex-1"},{"n":9,"text":"여기서 헷갈리기 쉬운 점은 however 뒤에 명사가 아니라 형용사나 부사가 먼저 온다는 점이에요. 이 순서를 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">복합관계사와 형용사 도치 양보 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">whatever\u003c/b>나 \u003cb class=\"key\">no matter what\u003c/b>은 무엇이 ~하더라도라는 뜻의 \u003cb class=\"key\">복합관계사\u003c/b> 구문이에요. 형용사나 부사나 명사가 앞으로 나오고 \u003cb class=\"key\">as\u003c/b>가 오면 비록 ~이지만이라는 뜻의 도치 양보가 돼요.\u003cdiv>\u003cspan class=\"g-formula\">형용사/부사/명사 + as + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Whatever you decide\u003c/span>, I will support you.\u003c/div>\u003cdiv class=\"g-ko\">네가 무엇을 결정하든 나는 지지할 것이다.\u003c/div>\u003cdiv class=\"g-note\">No matter what you decide와 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Young as he is\u003c/span>, he is very wise.\u003c/div>\u003cdiv class=\"g-ko\">그는 어리지만 매우 현명하다.\u003c/div>\u003cdiv class=\"g-note\">Though he is young과 같은 의미의 도치 구문입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">형용사 as 주어 동사\u003c/b> 구문은 \u003cb class=\"key\">Though\u003c/b>를 이용한 절로 바꾸어 쓸 수 있어요.\u003c/div>","segs":[{"n":10,"text":"세 번째 개념은 복합관계사와 독특한 도치 양보 구문이에요. whatever는 no matter what과 바꿔 쓸 수 있어서 무엇이 ~하더라도라고 해석하고요. 형용사나 부사나 명사가 문장 맨 앞으로 나오고 as가 붙으면 비록 ~이지만이라는 뜻의 도치 양보 구문이 돼요.","hl":"rule"},{"n":11,"text":"예문을 보면서 확인해 볼게요. Whatever you decide, I will support you는 네가 무엇을 결정하든 나는 지지할 것이다라는 뜻이에요. whatever 대신 no matter what을 써도 의미가 똑같아요.","hl":"ex-0"},{"n":12,"text":"다음 예문이에요. Young as he is, he is very wise는 그는 어리지만 매우 현명하다라는 뜻이에요. 원래는 Though he is young이지만 형용사 young을 앞으로 보내고 as를 써서 비록 어리지만이라는 뜻의 도치 구문으로 바꾼 형태예요.","hl":"ex-1"},{"n":13,"text":"도치 양보 구문에서 as 앞에는 관사가 없는 명사나 형용사, 부사가 온다는 점을 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">추가 양보와 대조 구문 연습\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">다양한 \u003cb class=\"key\">양보와 대조\u003c/b> 접속사는 문맥의 의미에 맞게 알맞은 것을 골라 써야 해요.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Though it was expensive\u003c/span>, she bought the bag.\u003c/div>\u003cdiv class=\"g-ko\">비록 비쌌지만 그녀는 그 가방을 샀다.\u003c/div>\u003cdiv class=\"g-note\">although, even though와 바꿔 쓸 수 있는 전형적인 양보의 부사절입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>비록 ~이지만을 뜻하는 \u003cb class=\"key\">though\u003c/b>는 구어체에서도 아주 흔하게 쓰여요.\u003c/div>","segs":[{"n":14,"text":"네 번째 개념은 우리가 배운 다양한 양보와 대조 표현들을 문맥에 맞게 정확히 구별해서 사용하는 연습이에요. 접속사마다 담고 있는 뉘앙스가 조금씩 다르기 때문에 문장의 전체 흐름을 잘 살펴봐야 해요.","hl":"rule"},{"n":15,"text":"보충 예문을 하나 더 볼게요. Though it was expensive, she bought the bag은 비록 비쌌지만 그녀는 그 가방을 샀다라는 뜻이에요. 가방이 비싸다는 사실을 알면서도 구매한 상황이므로 양보의 접속사 though가 쓰였어요.","hl":"ex-0"},{"n":16,"text":"though는 문장 맨 앞이나 뒤에 모두 자연스럽게 쓰일 수 있다는 점도 알아두면 좋겠어요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Even though he was tired, but he kept working.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Even though he was tired, he kept working.\u003c/div>\u003cdiv class=\"g-why\">even though는 접속사이므로 뒤에 접속사 but을 함께 쓸 수 없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>However you try hard, you can't please everyone.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ However hard you try, you can't please everyone.\u003c/div>\u003cdiv class=\"g-why\">however가 양보를 나타낼 때는 형용사나 부사가 however 바로 뒤에 와야 합니다.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"학생들이 가장 자주 하는 실수 중 하나예요. Even though he was tired, but he kept working이라고 쓰면 틀려요. even though라는 접속사를 썼기 때문에 뒤에 but을 또 쓰면 안 되고 콤마만 찍어주어야 해요.","hl":"mk-0"},{"n":18,"text":"두 번째 자주 틀리는 문장이에요. However you try hard라고 쓰면 틀려요. however가 아무리 ~하더라도라는 뜻으로 쓰일 때는 수식하는 부사 hard가 however 바로 뒤에 붙어야 올바른 문장이 돼요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 어법상 틀린 부분을 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"g-qs\">Even though it started to rain, but we continued the game.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Even though it started to rain, we continued the game.\u003c/span>\u003cdiv class=\"g-exp\">even though가 이끄는 절에는 접속사 but을 함께 쓸 수 없으므로 but을 삭제해야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"첫 번째 문제는 오류 수정 문제예요. Even though it started to rain, but we continued the game이라는 문장에서 틀린 부분을 찾아 바르게 고쳐보는 문제인데요. 잠시 화면을 멈추고 직접 풀어 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":6},{"n":21,"text":"정답은 but을 지우고 Even though it started to rain, we continued the game으로 쓰는 것이에요. even though가 이미 접속사 역할을 하므로 but을 또 쓰면 안 되기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv g\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 밑줄 친 부분의 의미가 나머지와 다른 하나를 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">① Although he is rich, he is not happy.\n② Even though it was late, we stayed outside.\n③ Even if you apologize, she won't forgive you.\n④ Though she tried her best, she failed.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>①\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>②\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>③\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>④\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003cdiv class=\"g-exp\">①, ②, ④는 사실인 사실을 전제하는 양보(비록 ~이지만)이고, ③은 사실이 아닐 수도 있는 조건을 가정하는 양보(설령 ~일지라도)입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"네 번째 문제는 객관식 문제예요. 보기 중에서 밑줄 친 부분의 의미가 나머지 셋과 다른 하나를 골라보는 문제인데요. 잠시 화면을 멈추고 직접 풀어 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 세 번째 보기예요. 세 번째 보기는 설령 사과하더라도라는 가정의 의미인 even if이고, 나머지는 모두 실제로 일어난 사실을 전제하는 양보 표현이기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말과 같도록 빈칸을 채워 영작하시오.\u003c/div>\u003cdiv class=\"g-qs\">Tom은 차를 좋아하는 반면 Ann은 커피를 더 좋아한다. -&gt; Tom likes tea, ________ Ann prefers coffee.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">whereas\u003c/span>\u003cdiv class=\"g-exp\">~인 반면에라는 대조를 나타내는 접속사 whereas를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"다섯 번째 문제는 영작 문제예요. Tom은 차를 좋아하는 반면 Ann은 커피를 더 좋아한다라는 우리말에 맞추어 빈칸에 들어갈 대조의 접속사를 써보는 문제인데요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 whereas예요. Tom likes tea, whereas Ann prefers coffee라고 써서 두 사람의 취향을 대조해 주면 완벽해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 어법상 올바른 문장을 고르시오.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>Although he was rich, but he was unhappy.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>Whatever you decide, I will support you.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>However hard try you, you can't win.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Young as is he, he is smart.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Whatever you decide, I will support you.\u003c/span>\u003cdiv class=\"g-exp\">첫 번째는 but을 함께 써서 틀렸고, 세 번째는 주어 동사 어순이 틀렸고, 네 번째는 도치 어순이 틀렸습니다. 두 번째는 복합관계사가 올바르게 쓰였습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"마지막 여섯 번째 문제는 객관식 어법 문제예요. 보기 네 개 중에서 어법상 완전히 올바른 문장을 하나 골라보는 문제인데요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 두 번째 보기인 Whatever you decide, I will support you예요. 첫 번째는 but을 빼야 하고, 세 번째는 try you가 아니라 you try가 되어야 하며, 네 번째는 as is he가 아니라 as he is가 되어야 올바르기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 8 Unit 39 반전과 대조의 부사절\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">Although\u003c/b>, \u003cb class=\"key\">though\u003c/b>, \u003cb class=\"key\">even though\u003c/b>는 비록 ~이지만이라는 \u003cb class=\"key\">양보\u003c/b>를 나타내요.\u003c/li>\u003cli>\u003cb class=\"key\">while\u003c/b>과 \u003cb class=\"key\">whereas\u003c/b>는 ~인 반면에라는 \u003cb class=\"key\">대조\u003c/b>의 의미를 가져요.\u003c/li>\u003cli>\u003cb class=\"key\">however\u003c/b> 뒤에 형용사나 부사가 오면 아무리 ~하더라도라는 뜻이 돼요.\u003c/li>\u003c/ul>","segs":[{"n":37,"text":"오늘 우리는 Chapter 8 Unit 39에서 반전과 대조를 나타내는 다양한 부사절 표현들을 함께 공부해 보았어요. although부터 even if, whereas, 복합관계사, 그리고 도치 구문까지 정말 중요한 내용들이 많았죠. 오늘 배운 핵심 공식들을 꼭 복습하고 문제도 다시 풀어 보면서 완전히 여러분의 것으로 만들어 보세요. 오늘 수업은 여기서 마치겠습니다. 수고하셨어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
