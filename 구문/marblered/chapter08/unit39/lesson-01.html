  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

lecturePlayer(document.getElementById("app"),{"brand":"unit39","title":"양보와 대조, 조건의 복합 구문","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">양보·대조·조건의 복합 구문\u003c/div>\u003ch1>양보와 대조, 조건의 복합 구문\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>양보와 대조, 조건을 나타내는 복합 구문을 정확히 해석하고 같은 뜻으로 바꿔 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 양보와 대조, 조건을 나타내는 복합 구문을 함께 공부해요. 영어 문장은 접속사 하나에 따라 의미의 방향이 크게 달라지죠. 오늘 예문들을 통해 Even though, whereas, whatever 같은 표현이 문장 안에서 어떤 역할을 하는지 차근차근 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">양보·대조·조건의 복합 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">\u003cb class=\"key\">Even though\u003c/b>, \u003cb class=\"key\">Even if\u003c/b>, \u003cb class=\"key\">Though\u003c/b>는 '비록 ~할지라도'의 양보 부사절을 이끌고, \u003cb class=\"key\">whereas\u003c/b>, \u003cb class=\"key\">while\u003c/b>은 두 절을 대조합니다. \u003cb class=\"key\">However\u003c/b> + 형용사·부사, \u003cb class=\"key\">No matter what\u003c/b>, \u003cb class=\"key\">Whatever\u003c/b>는 '아무리 ~해도/무엇이든'의 복합 구문을 만듭니다. \u003cb class=\"key\">Strange as it may sound\u003c/b>처럼 형용사가 \u003cb class=\"key\">as\u003c/b> 앞에 오면 '비록 ~하게 들릴지라도'라는 양보 도치가 됩니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">Even though a speech can be effective\u003c/span>, all the words in the world cannot measure up to the example of a leader.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">However hard you shop for an item\u003c/span>, after you've bought it, it will be on sale somewhere cheaper.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 \u003cspan class=\"fx\">Even if it turns out that time travel is impossible\u003c/span>, it is important that we understand why it is impossible.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Before sound recording, classical music was passed down through written scores, \u003cspan class=\"fx\">whereas early jazz mainly relied on live performance\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">Strange as it may sound\u003c/span>, the diamond, so clear and transparent, is composed of the same material as coal and soot, namely carbon.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">No matter what emotion you're feeling right now\u003c/span>, you can count on one thing—it will change.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 \u003cspan class=\"fx\">If we don't have the power to choose where we come from\u003c/span>, we can still choose where we go from there.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Newton imagined that masses affect each other by exerting a force, \u003cspan class=\"fx\">while in Einstein's theory the effects occur through a bending of space and time and there is no concept of gravity as a force\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 I'll do \u003cspan class=\"fx\">whatever it takes to win games, whether it's sitting on a bench waving a towel, handing a cup of water to a teammate, or hitting the game-winning shot\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">Though most people agree that clothes do not make the person\u003c/span>, they spend considerable time and money dressing themselves in the newest fashion.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">Whereas science is concerned with finding and stating the facts\u003c/span>, poetry's task is to give you the look, the smell, the taste, and the &quot;feel&quot; of those facts.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">Whatever you want to do\u003c/span>, if you want to be great at it, you have to love it and be able to make sacrifices for it.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 양보 구문은 Even though, Even if, Though처럼 비록 그렇더라도의 뜻을 만드는 접속사로 시작해요. 대조 구문은 whereas나 while로 두 절을 나란히 놓고 차이를 보여 줍니다. However hard나 No matter what, Whatever는 아무리 그래도 또는 무엇이든의 뜻으로 조건과 양보를 함께 표현해요. Strange as it may sound처럼 형용사가 as 앞에 나오는 도치도 꼭 기억해 주세요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">Even though a speech can be effective\u003c/span>, all the words in the world cannot measure up to the example of a leader.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Even though a speech can be effective,\u003c/div>\u003cdiv class=\"k\">비록 연설이 효과적일 수 있을지라도,\u003c/div>\u003cdiv class=\"e\">all the words in the world\u003c/div>\u003cdiv class=\"k\">세상의 모든 말은\u003c/div>\u003cdiv class=\"e\">cannot measure up to\u003c/div>\u003cdiv class=\"k\">필적할 수 없다\u003c/div>\u003cdiv class=\"e\">the example of a leader.\u003c/div>\u003cdiv class=\"k\">지도자의 본보기에.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Even though\u003c/b>는 '비록 ~일지라도'의 양보 접속사로, \u003cb class=\"key\">a speech can be effective\u003c/b>라는 절을 이끌어 뒤의 주절과 대조적인 흐름을 만듭니다. 주절의 \u003cb class=\"key\">cannot measure up to\u003c/b>는 '~에 필적하지 못하다'라는 숙어입니다.\u003c/div>","segs":[{"n":3,"text":"Even though a speech can be effective, 비록 연설이 효과적일 수 있을지라도. all the words in the world, 세상의 모든 말은. cannot measure up to, 필적할 수 없다. the example of a leader, 지도자의 본보기에.","hl":"ch"},{"n":4,"text":"이 문장의 핵심은 Even though예요. Even though는 비록 그렇더라도라는 양보의 뜻으로 절과 절을 이어 줍니다. 뒤에는 cannot measure up to가 나오는데 이는 필적하지 못한다는 뜻의 숙어예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">Even though a speech can be effective\u003c/span>, all the words in the world cannot measure up to the example of a leader.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>연설이 아무리 효과적이어도 말만으로는 지도자의 행동 본보기를 따라갈 수 없다는 뜻이에요. 즉 말보다 실천과 모범이 더 중요하다는 메시지를 담고 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Even though a speech can be effective\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Although a speech may be effective\u003c/span>\u003cdiv class=\"w\">Even though를 Although may로 바꾸어 같은 양보의 뜻을 조금 더 격식 있게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cannot measure up to the example of a leader\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cannot match a leader's personal example\u003c/span>\u003cdiv class=\"w\">measure up to를 match로 바꾸고 example을 personal example로 풀어 의미를 선명하게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">effective\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">impactful\u003c/span>\u003cspan class=\"y-eq\">effective = impactful\u003c/span>\u003cdiv class=\"w\">연설의 효과를 나타내는 형용사를 비슷한 강도의 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">measure up to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be equal to\u003c/span>\u003cspan class=\"y-eq\">measure up to = be equal to\u003c/span>\u003cdiv class=\"w\">기준에 미치다라는 숙어를 같은 뜻의 구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">example\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">role model\u003c/span>\u003cspan class=\"y-eq\">example = role model\u003c/span>\u003cdiv class=\"w\">지도자의 본보기라는 문맥을 살려 사람을 가리키는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Although a speech may be powerful, no words can compare to a leader's personal example.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"연설이 효과적일 수는 있지만 세상의 모든 말도 지도자의 본보기에는 못 미친다는 뜻이에요. 결국 말보다 행동과 모범이 더 중요하다는 메시지죠.","hl":"mn"},{"n":6,"text":"Even though a speech can be effective는 Although a speech may be effective로 바꿔도 같은 뜻이에요. cannot measure up to는 cannot match로 바꾸면 더 쉽게 들립니다.","hl":"rw"},{"n":7,"text":"effective는 impactful처럼 효과가 크다는 뜻으로 바꿀 수 있어요. measure up to는 be equal to로, example은 role model로 바꾸면 문맥이 잘 살아납니다.","hl":"ph"},{"n":8,"text":"이제 같은 뜻의 문장을 읽어 볼게요. Although a speech may be powerful, no words can compare to a leader's personal example. 말의 힘보다 지도자의 실제 본보기가 더 크다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">However hard you shop for an item\u003c/span>, after you've bought it, it will be on sale somewhere cheaper.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">However hard you shop for an item,\u003c/div>\u003cdiv class=\"k\">아무리 열심히 당신이 어떤 물품을 사러 가더라도,\u003c/div>\u003cdiv class=\"e\">after you've bought it,\u003c/div>\u003cdiv class=\"k\">당신이 그것을 사고 난 후에,\u003c/div>\u003cdiv class=\"e\">it will be on sale\u003c/div>\u003cdiv class=\"k\">그것은 할인 중일 것이다\u003c/div>\u003cdiv class=\"e\">somewhere cheaper.\u003c/div>\u003cdiv class=\"k\">어딘가에서 더 싸게.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003c \">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">shop for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">look for\u003c/span>\u003cspan class=\"y-eq\">shop for = look for\u003c/span>\u003cdiv class=\"w\">물건을 사러 찾는다는 의미를 같은 뜻의 구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">on sale\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">discounted\u003c/span>\u003cspan class=\"y-eq\">on sale = discounted\u003c/span>\u003cdiv class=\"w\">할인 판매 중이라는 뜻을 형용사 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">somewhere cheaper\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at a lower price elsewhere\u003c/span>\u003cspan class=\"y-eq\">somewhere cheaper = at a lower price elsewhere\u003c/span>\u003cdiv class=\"w\">더 싼 곳이라는 표현을 가격 중심으로 풀어 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">No matter how carefully you search for an item, after buying it you will find it discounted at a lower price somewhere else.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"어떤 물건을 아무리 열심히 찾아 사도 산 뒤에는 다른 곳에서 더 싸게 할인 중일 수 있다는 뜻이에요. 쇼핑 후에 느끼는 아쉬움을 재치 있게 표현한 문장입니다.","hl":"mn"},{"n":12,"text":"However hard you shop for an item은 No matter how hard you shop for an item으로 바꿀 수 있어요. it will be on sale somewhere cheaper는 you will find it discounted for less elsewhere처럼 풀어 쓸 수 있습니다.","hl":"rw"},{"n":13,"text":"shop for는 look for로 바꿔 사러 찾는다는 뜻을 살릴 수 있어요. on sale은 discounted로, somewhere cheaper는 at a lower price elsewhere로 정리해 둡시다.","hl":"ph"},{"n":14,"text":"같은 뜻의 문장을 들어 볼게요. No matter how carefully you search for an item, after buying it you will find it discounted at a lower price somewhere else. 아무리 꼼꼼히 찾아도 산 뒤에는 더 싼 곳이 보인다는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문  뒤의 it will change가 그 한 가지 내용을 설명해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 \u003cspan class=\"fx\">No matter what emotion you're feeling right now\u003c/span>, you can count on one thing—it will change.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>지금 어떤 감정을 느끼고 있든 그것은 반드시 변한다는 사실을 믿을 수 있다는 뜻이에요. 감정은 영원하지 않다는 위로와 통찰을 담고 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">No matter what emotion you're feeling right now\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Whatever emotion you're feeling right now\u003c/span>\u003cdiv class=\"w\">No matter what을 Whatever로 바꾸어 같은 양보의 뜻을 더 간결하게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">you can count on one thing—it will change\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">you can be sure of one thing, it will change\u003c/span>\u003cdiv class=\"w\">count on을 be sure of로 바꾸고 대시를 쉼표로 풀어 자연스럽게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">no matter what\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">whatever\u003c/span>\u003cspan class=\"y-eq\">no matter what = whatever\u003c/span>\u003cdiv class=\"w\">복합관계사로 바꾸어 같은 양보의 의미를 전달했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">count on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rely on\u003c/span>\u003cspan class=\"y-eq\">count on = rely on\u003c/span>\u003cdiv class=\"w\">믿고 의지하다라는 뜻을 동의어 구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">change\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">shift\u003c/span>\u003cspan class=\"y-eq\">change = shift\u003c/span>\u003cdiv class=\"w\">감정이 바뀐다는 뜻을 비슷한 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Whatever emotion you are feeling right now, you can be sure of one thing: it will change.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"지금 어떤 감정을 느끼고 있든 그 감정은 반드시 변한다는 뜻이에요. 힘든 감정도 영원하지 않다는 위로를 담은 문장입니다.","hl":"mn"},{"n":36,"text":"No matter what emotion you're feeling right now는 Whatever emotion you're feeling right now로 바꿀 수 있어요. you can count on one thing은 you can be sure of one thing으로 바꾸면 더 쉽게 들립니다.","hl":"rw"},{"n":37,"text":"no matter what은 whatever로, count on은 rely on으로 바꿀 수 있어요. change는 shift처럼 비슷한 동사로 정리해 둡시다.","hl":"ph"},{"n":38,"text":"같은 뜻의 문장을 읽어 볼게요. Whatever emotion you are feeling right now, you can be sure of one thing, it will change. 어떤 감정이든 결국 변한다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 \u003cspan class=\"fx\">If we don't have the power to choose where we come from\u003c/span>, we can still choose where we go from there.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If we don't have the power\u003c/div>\u003cdiv class=\"k\">만약 우리에게 힘이 없다면\u003c/div>\u003cdiv class=\"e\">to choose where we come from,\u003c/div>\u003cdiv class=\"k\">우리가 어디서 오는지를 선택할\u003c/div>\u003cdiv class=\"e\">we can still choose\u003c/div>\u003cdiv class=\"k\">우리는 여전히 선택할 수 있다\u003c/div>\u003cdiv class=\"e\">where we go from there.\u003c/div>\u003cdiv class=\"k\">우리가 거기에서 어디로 갈지.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If\u003c/b>는 조건 부사절을 이끌고, \u003cb class=\"key\">have the power to\u003c/b>는 '~할 힘·권한이 있다'라는 표현입니다. \u003cb class=\"key\">where we come from\u003c/b>과 \u003cb class=\"key\">where we go from there\u003c/b>는 의문사가 이끄는 간접의문문입니다.\u003c/div>","segs":[{"n":39,"text":"If we don't have the power, 만약 우리에게 힘이 없다면. to choose where we come from, 우리가 어디서 오는지를 선택할. we can still choose, 우리는 여전히 선택할 수 있다. where we go from there, 우리가 거기에서 어디로 갈지.","hl":"ch"},{"n":40,"text":"이 문장은 If we don't have the power to choose where we come from으로 시작해요. If는 조건을 나타내고 have the power to는 할 힘이 있다는 뜻이에요. where we come from과 where we go from there는 의문사가 이끄는 간접의문문으로 각각 출신지와 앞으로의 방향을 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 \u003cspan class=\"fx\">If we don't have the power to choose where we come from\u003c/span>, we can still choose where we go from there.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리가 태어난 곳이나 출발점을 선택할 힘은 없어도, 그곳에서 어디로 나아갈지는 여전히 선택할 수 있다는 뜻이에요. 환경보다 앞으로의 방향을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">If we don't have the power to choose where we come from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Even if we cannot choose our origins\u003c/span>\u003cdiv class=\"w\">조건절을 양보의 Even if절로 바꾸고 where we come from을 origins로 간결하게 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">we can still choose where we go from there\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">we can still decide our direction from that point\u003c/span>\u003cdiv class=\"w\">choose where we go를 decide our direction으로 풀어 방향 선택의 의미를 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have the power to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be able to\u003c/span>\u003cspan class=\"y-eq\">have the power to = be able to\u003c/span>\u003cdiv class=\"w\">힘이 있다는 표현을 능력의 의미로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">come from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">originate from\u003c/span>\u003cspan class=\"y-eq\">come from = originate from\u003c/span>\u003cdiv class=\"w\">출신이나 기원을 나타내는 더 격식 있는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">go from there\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">move forward from that point\u003c/span>\u003cspan class=\"y-eq\">go from there = move forward from that point\u003c/span>\u003cdiv class=\"w\">거기서 나아가다라는 뜻을 풀어 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Although we cannot choose our origins, we can still decide where we go from there.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"우리가 어디서 왔는지를 선택할 힘은 없어도 거기서 어디로 갈지는 여전히 선택할 수 있다는 뜻이에요. 출발점보다 앞으로의 방향이 중요하다는 메시지입니다.","hl":"mn"},{"n":42,"text":"If we don't have the power to choose where we come from은 Even if we cannot choose our origins로 바꿀 수 있어요. we can still choose where we go from there는 we can still decide our direction from that point로 풀어 쓸 수 있습니다.","hl":"rw"},{"n":43,"text":"have the power to는 be able to로, come from은 originate from으로 바꿀 수 있어요. go from there는 move forward from that point로 정리해 둡시다.","hl":"ph"},{"n":44,"text":"같은 뜻의 문장을 읽어 볼게요. Although we cannot choose our origins, we can still decide where we go from there. 출신은 선택할 수 없어도 방향은 선택할 수 있다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 Newton imagined that masses affect each other by exerting a force, \u003cspan class=\"fx\">while in Einstein's theory the effects occur through a bending of space and time and there is no concept of gravity as a force\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Newton imagined\u003c/div>\u003cdiv class=\"k\">뉴턴은 상상했다\u003c/div>\u003cdiv class=\"e\">that masses affect each other\u003c/div>\u003cdiv class=\"k\">질량이 서로 영향을 미친다고\u003c/div>\u003cdiv class=\"e\">by exerting a force,\u003c/div>\u003cdiv class=\"k\">힘을 씀으로써,\u003c/div>\u003cdiv class=\"e\">while in Einstein's theory\u003c/div>\u003cdiv class=\"k\">반면에 아인슈타인의 이론에서는\u003c/div>\u003cdiv class=\"e\">the effects occur\u003c/div>\u003cdiv class=\"k\">그 영향이 일어난다\u003c/div>\u003cdiv class=\"e\">through a bending of space and time\u003c/div>\u003cdiv class=\"k\">공간과 시간의 휘어짐을 통해\u003c/div>\u003cdiv class=\"e\">and there is no concept\u003c/div>\u003cdiv class=\"k\">그리고 개념은 없다\u003c/div>\u003cdiv class=\"e\">of gravity as a force.\u003c/div>\u003cdiv class=\"k\">힘으로서의 중력에 대한.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">while\u003c/b>은 앞의 뉴턴 설명과 뒤의 아인슈타인 설명을 대조하는 접속사입니다. \u003cb class=\"key\">that masses affect each other\u003c/b>는 imagined의 목적어절이고, \u003cb class=\"key\">by exerting a force\u003c/b>는 수단을 나타냅니다. \u003cb class=\"key\">there is no concept of\u003c/b>는 '~라는 개념이 없다'라는 존재 구문입니다.\u003c/div>","segs":[{"n":45,"text":"Newton imagined, 뉴턴은 상상했다. that masses affect each other, 질량이 서로 영향을 미친다고. by exerting a force, 힘을 씀으로써. while in Einstein's theory, 반면에 아인슈타인의 이론에서는. the effects occur, 그 영향이 일어난다. through a bending of space and time, 공간과 시간의 휘어짐을 통해. and there is no concept, 그리고 개념은 없다. of gravity as a force, 힘으로서의 중력에 대한.","hl":"ch"},{"n":46,"text":"이 문장은 while이 뉴턴의 설명과 아인슈타인의 설명을 대조해요. Newton imagined that 뒤에는 질량이 서로 영향을 준다는 내용이 오고 by exerting a force는 힘을 씀으로써라는 수단을 나타냅니다. while 뒤에서는 공간과 시간의 휘어짐을 통해 영향이 일어나며 힘으로서의 중력 개념은 없다고 말해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 Newton imagined that masses affect each other by exerting a force, \u003cspan class=\"fx\">while in Einstein's theory the effects occur through a bending of space and time and there is no concept of gravity as a force\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>뉴턴은 질량이 힘을 통해 서로 영향을 준다고 보았지만, 아인슈타인은 시공간의 휘어짐으로 설명하며 중력을 힘으로 보지 않는다는 뜻이에요. 같은 현상을 설명하는 두 관점의 차이를 보여 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">while in Einstein's theory\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">whereas in Einstein's theory\u003c/span>\u003cdiv class=\"w\">while을 whereas로 바꾸어 대조의 의미를 더 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by exerting a force\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">by applying a force\u003c/span>\u003cdiv class=\"w\">exerting을 applying으로 바꾸어 힘을 가한다는 뜻을 쉽게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">affect\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">influence\u003c/span>\u003cspan class=\"y-eq\">affect = influence\u003c/span>\u003cdiv class=\"w\">영향을 미치다라는 뜻을 동의어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">exert\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">apply\u003c/span>\u003cspan class=\"y-eq\">exert = apply\u003c/span>\u003cdiv class=\"w\">힘을 쓰다라는 뜻을 더 일상적인 동사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">concept\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">idea\u003c/span>\u003cspan class=\"y-eq\">concept = idea\u003c/span>\u003cdiv class=\"w\">개념이라는 뜻을 쉬운 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Newton imagined that masses influence each other by applying a force, whereas in Einstein's theory the effects happen through the bending of space and time, and gravity is not conceived of as a force.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"뉴턴은 질량이 힘을 통해 서로 영향을 준다고 보았지만 아인슈타인은 시공간의 휘어짐으로 설명한다는 뜻이에요. 중력을 힘으로 보지 않는 관점의 차이를 보여 주는 문장입니다.","hl":"mn"},{"n":48,"text":"while in Einstein's theory는 whereas in Einstein's theory로 바꿔 대조를 더 분명히 할 수 있어요. by exerting a force는 by applying a force로 바꿔도 같은 뜻입니다.","hl":"rw"},{"n":49,"text":"affect는 influence로, exert는 apply로 바꿀 수 있어요. concept는 idea로 정리하면 이해가 쉽습니다.","hl":"ph"},{"n":50,"text":"같은 뜻의 문장을 읽어 볼게요. Newton imagined that masses influence each other by applying a force, whereas in Einstein's theory the effects happen through the bending of space and time, and gravity is not conceived of as a force. 두 과학자의 설명 방식이 어떻게 다른지 잘 들리시죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 I'll do \u003cspan class=\"fx\">whatever it takes to win games, whether it's sitting on a bench waving a towel, handing a cup of water to a teammate, or hitting the game-winning shot\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I'll do\u003c/div>\u003cdiv class=\"k\">나는 할 것이다\u003c/div>\u003cdiv class=\"e\">whatever it takes\u003c/div>\u003cdiv class=\"k\">필요로 하는 것은 무엇이든\u003c/div>\u003cdiv class=\"e\">to win games,\u003c/div>\u003cdiv class=\"k\">게임을 이기기 위해,\u003c/div>\u003cdiv class=\"e\">whether it's\u003c/div>\u003cdiv class=\"k\">그것이 ~이든\u003c/div>\u003cdiv class=\"e\">sitting on a bench\u003c/div>\u003cdiv class=\"k\">벤치에 앉아 있는 것\u003c/div>\u003cdiv class=\"e\">waving a towel,\u003c/div>\u003cdiv class=\"k\">수건을 흔들면서,\u003c/div>\u003cdiv class=\"e\">handing a cup of water to a teammate,\u003c/div>\u003cdiv class=\"k\">팀 동료에게 물 한 잔을 건네는 것,\u003c/div>\u003cdiv class=\"e\">or hitting the game-winning shot.\u003c/div>\u003cdiv class=\"k\">또는 결승 슛을 하는 것.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">whatever it takes\u003c/b>는 '필요한 것은 무엇이든'이라는 명사절이고, \u003cb class=\"key\">to win games\u003c/b>는 그 목적을 나타냅니다. \u003cb class=\"key\">whether it's A or B\u003c/b>는 '그것이 A이든 B이든'의 양보·선택 구문으로 여러 행동을 나열합니다.\u003c/div>","segs":[{"n":51,"text":"I'll do, 나는 할 것이다. whatever it takes, 필요로 하는 것은 무엇이든. to win games, 게임을 이기기 위해. whether it's, 그것이 ~이든. sitting on a bench, 벤치에 앉아 있는 것. waving a towel, 수건을 흔들면서. handing a cup of water to a teammate, 팀 동료에게 물 한 잔을 건네는 것. or hitting the game-winning shot, 또는 결승 슛을 하는 것.","hl":"ch"},{"n":52,"text":"이 문장의 핵심은 whatever it takes예요. 이는 게임을 이기는 데 필요한 것은 무엇이든이라는 뜻을 만들어요. whether it's는 그것이 무엇이든이라는 양보의 흐름으로 여러 행동을 이어 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 I'll do \u003cspan class=\"fx\">whatever it takes to win games, whether it's sitting on a bench waving a towel, handing a cup of water to a teammate, or hitting the game-winning shot\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>게임에서 이기기 위해 필요한 일이라면 벤치에서 수건을 흔드는 일부터 팀 동료에게 물을 건네는 일, 결승 슛을 넣는 일까지 무엇이든 하겠다는 뜻이에요. 역할의 크고 작음을 가리지 않는 태도를 보여 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whatever it takes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">anything necessary\u003c/span>\u003cdiv class=\"w\">whatever it takes를 anything necessary로 바꾸어 필요한 것은 무엇이든이라는 뜻을 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">hitting the game-winning shot\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">making the winning shot\u003c/span>\u003cdiv class=\"w\">game-winning shot을 winning shot으로 간결하게 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">do whatever it takes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">do anything necessary\u003c/span>\u003cspan class=\"y-eq\">do whatever it takes = do anything necessary\u003c/span>\u003cdiv class=\"w\">필요한 것은 무엇이든 하다라는 뜻을 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">wave a towel\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cheer with a towel\u003c/span>\u003cspan class=\"y-eq\">wave a towel = cheer with a towel\u003c/span>\u003cdiv class=\"w\">수건을 흔들다라는 행동을 응원의 의미로 설명했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">game-winning shot\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">winning shot\u003c/span>\u003cspan class=\"y-eq\">game-winning shot = winning shot\u003c/span>\u003cdiv class=\"w\">경기를 이기는 슛이라는 뜻을 간결하게 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I will do anything necessary to win games, whether that means sitting on a bench waving a towel, handing a cup of water to a teammate, or making the winning shot.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"게임에서 이기기 위해 필요한 일이라면 벤치에서 수건을 흔드는 일부터 팀 동료에게 물을 건네는 일, 결승 슛을 넣는 일까지 무엇이든 하겠다는 뜻이에요. 역할의 크고 작음을 가리지 않는 태도가 드러납니다.","hl":"mn"},{"n":54,"text":"whatever it takes는 anything necessary로 바꿀 수 있어요. hitting the game-winning shot은 making the winning shot으로 바꾸면 더 간결합니다.","hl":"rw"},{"n":55,"text":"do whatever it takes는 do anything necessary로 바꿀 수 있어요. wave a towel은 cheer with a towel로, game-winning shot은 winning shot으로 정리해 둡시다.","hl":"ph"},{"n":56,"text":"같은 뜻의 문장을 읽어 볼게요. I will do anything necessary to win games, whether that means sitting on a bench waving a towel, handing a cup of water to a teammate, or making the winning shot. 작은 역할도 마다하지 않겠다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 \u003cspan class=\"fx\">Though most people agree that clothes do not make the person\u003c/span>, they spend considerable time and money dressing themselves in the newest fashion.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Though most people agree\u003c/div>\u003cdiv class=\"k\">비록 대부분의 사람들이 동의할지라도\u003c/div>\u003cdiv class=\"e\">that clothes do not make the person,\u003c/div>\u003cdiv class=\"k\">옷이 사람을 만들지 않는다는 것에,\u003c/div>\u003cdiv class=\"e\">they spend considerable time and money\u003c/div>\u003cdiv class=\"k\">그들은 상당한 시간과 돈을 쓴다\u003c/div>\u003cdiv class=\"e\">dressing themselves\u003c/div>\u003cdiv class=\"k\">스스로 옷을 차려 입는 데\u003c/div>\u003cdiv class=\"e\">in the newest fashion.\u003c/div>\u003cdiv class=\"k\">최신 패션으로.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Though\u003c/b>는 '비록 ~일지라도'의 양보 접속사이고, \u003cb class=\"key\">agree that\u003c/b>은 '~라는 것에 동의하다'라는 구문입니다. 뒤의 \u003cb class=\"key\">spend time and money -ing\u003c/b>는 '~하는 데 시간과 돈을 쓰다'라는 표현입니다.\u003c/div>","segs":[{"n":57,"text":"Though most people agree, 비록 대부분의 사람들이 동의할지라도. that clothes do not make the person, 옷이 사람을 만들지 않는다는 것에. they spend considerable time and money, 그들은 상당한 시간과 돈을 쓴다. dressing themselves, 스스로 옷을 차려 입는 데. in the newest fashion, 최신 패션으로.","hl":"ch"},{"n":58,"text":"이 문장은 Though most people agree that clothes do not make the person으로 시작해요. Though는 비록 그렇더라도라는 양보의 뜻이고 agree that은 뒤의 내용에 동의한다는 구문이에요. they spend considerable time and money dressing themselves에서는 시간과 돈을 어디에 쓰는지가 이어집니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 \u003cspan class=\"fx\">Though most people agree that clothes do not make the person\u003c/span>, they spend considerable time and money dressing themselves in the newest fashion.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>대부분의 사람들이 옷이 사람을 결정하지 않는다고 말하면서도 최신 패션을 갖추는 데 많은 시간과 돈을 쓴다는 뜻이에요. 생각과 행동이 모순되는 모습을 꼬집습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Though most people agree that clothes do not make the person\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Although most people agree that appearance does not define a person\u003c/span>\u003cdiv class=\"w\">clothes do not make the person을 appearance does not define a person으로 풀어 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">spend considerable time and money dressing themselves in the newest fashion\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">devote a lot of time and money to wearing the latest fashion\u003c/span>\u003cdiv class=\"w\">spend를 devote로 바꾸고 newest fashion을 latest fashion으로 바꾸어 자연스럽게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">clothes do not make the person\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">appearance is not everything\u003c/span>\u003cspan class=\"y-eq\">clothes do not make the person = appearance is not everything\u003c/span>\u003cdiv class=\"w\">옷이 사람을 만들지 않는다는 속뜻을 쉬운 문장으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">considerable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">significant\u003c/span>\u003cspan class=\"y-eq\">considerable = significant\u003c/span>\u003cdiv class=\"w\">상당한이라는 뜻을 동의어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">newest fashion\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">latest style\u003c/span>\u003cspan class=\"y-eq\">newest fashion = latest style\u003c/span>\u003cdiv class=\"w\">최신 유행이라는 뜻을 같은 의미의 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Although most people agree that appearance does not define a person, they devote a lot of time and money to wearing the latest fashion.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"대부분의 사람들이 옷이 사람을 결정하지 않는다고 말하면서도 최신 패션을 갖추는 데 많은 시간과 돈을 쓴다는 뜻이에요. 말과 행동이 모순되는 모습을 보여 줍니다.","hl":"mn"},{"n":60,"text":"Though most people agree that clothes do not make the person은 Although most people agree that appearance does not define a person으로 바꿀 수 있어요. spend considerable time and money는 devote a lot of time and money로 바꿔도 뜻이 통합니다.","hl":"rw"},{"n":61,"text":"clothes do not make the person은 appearance is not everything으로 풀어 쓸 수 있어요. considerable은 significant로, newest fashion은 latest style로 바꿀 수 있습니다.","hl":"ph"},{"n":62,"text":"같은 뜻의 문장을 읽어 볼게요. Although most people agree that appearance does not define a person, they devote a lot of time and money to wearing the latest fashion. 겉모습이 전부는 아니라고 말하면서도 유행을 좇는 모순을 담고 있습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 \u003cspan class=\"fx\">Whereas science is concerned with finding and stating the facts\u003c/span>, poetry's task is to give you the look, the smell, the taste, and the &quot;feel&quot; of those facts.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Whereas science is concerned with\u003c/div>\u003cdiv class=\"k\">과학은 ~와 관련이 있는 반면에\u003c/div>\u003cdiv class=\"e\">finding and stating the facts,\u003c/div>\u003cdiv class=\"k\">사실들을 찾고 진술하는 것과,\u003c/div>\u003cdiv class=\"e\">poetry's task is\u003c/div>\u003cdiv class=\"k\">시의 과제는 ~이다\u003c/div>\u003cdiv class=\"e\">to give you the look, the smell, the taste,\u003c/div>\u003cdiv class=\"k\">당신에게 모양, 냄새, 맛을 주는 것\u003c/div>\u003cdiv class=\"e\">and the &quot;feel&quot; of those facts.\u003c/div>\u003cdiv class=\"k\">그리고 그러한 사실들의 ‘느낌’을.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Whereas\u003c/b>는 두 절을 연결해 '~인 반면에'라는 대조를 나타내는 접속사입니다. \u003cb class=\"key\">be concerned with\u003c/b>는 '~와 관련이 있다, ~에 관심이 있다'라는 표현이고, \u003cb class=\"key\">to give you\u003c/b>는 poetry's task의 내용을 설명하는 to부정사입니다.\u003c/div>","segs":[{"n":63,"text":"Whereas science is concerned with, 과학은 ~와 관련이 있는 반면에. finding and stating the facts, 사실들을 찾고 진술하는 것과. poetry's task is, 시의 과제는 ~이다. to give you the look, the smell, the taste, 당신에게 모양, 냄새, 맛을 주는 것. and the \"feel\" of those facts, 그리고 그러한 사실들의 ‘느낌’을.","hl":"ch"},{"n":64,"text":"이 문장에서는 Whereas가 과학과 시의 역할을 대조해요. science is concerned with는 과학이 어떤 일과 관련이 있다는 뜻이고 finding and stating the facts가 그 내용입니다. poetry's task is to give you에서는 시의 과제가 감각적 경험을 전하는 일임을 보여 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 \u003cspan class=\"fx\">Whereas science is concerned with finding and stating the facts\u003c/span>, poetry's task is to give you the look, the smell, the taste, and the &quot;feel&quot; of those facts.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>과학은 사실을 찾아 진술하는 일에 관심이 있지만, 시는 그 사실을 눈으로 보고 냄새 맡고 맛보고 느끼는 감각적 경험으로 전해 준다는 뜻이에요. 과학과 시의 역할 차이를 보여 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Whereas science is concerned with finding and stating the facts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">While science focuses on discovering and expressing facts\u003c/span>\u003cdiv class=\"w\">Whereas를 While로 바꾸고 be concerned with를 focuses on으로 풀어 대조를 자연스럽게 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">poetry's task is to give you\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">poetry's job is to convey\u003c/span>\u003cdiv class=\"w\">task를 job으로 바꾸고 give you를 convey로 바꾸어 전달의 의미를 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be concerned with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">deal with\u003c/span>\u003cspan class=\"y-eq\">be concerned with = deal with\u003c/span>\u003cdiv class=\"w\">관련이 있다는 뜻을 다루다라는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">state\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">express\u003c/span>\u003cspan class=\"y-eq\">state = express\u003c/span>\u003cdiv class=\"w\">진술하다라는 뜻을 표현하다라는 동의어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">feel\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">impression\u003c/span>\u003cspan class=\"y-eq\">feel = impression\u003c/span>\u003cdiv class=\"w\">느낌이라는 뜻을 명사 impression으로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">While science focuses on discovering and expressing facts, poetry's job is to give you the look, smell, taste, and feel of those facts.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"과학은 사실을 찾아 진술하는 일에 관심이 있지만 시는 그 사실의 모양과 냄새와 맛과 느낌을 전해 준다는 뜻이에요. 과학과 시가 사실을 다루는 방식의 차이를 보여 줍니다.","hl":"mn"},{"n":66,"text":"Whereas science is concerned with finding and stating the facts는 While science focuses on discovering and expressing facts로 바꿀 수 있어요. poetry's task is to give you는 poetry's job is to convey로 바꾸면 전달의 느낌이 살아납니다.","hl":"rw"},{"n":67,"text":"be concerned with는 deal with로, state는 express로 바꿀 수 있어요. feel은 impression처럼 명사로 풀어 쓸 수 있습니다.","hl":"ph"},{"n":68,"text":"같은 뜻의 문장을 읽어 볼게요. While science focuses on discovering and expressing facts, poetry's job is to give you the look, smell, taste, and feel of those facts. 과학과 시가 사실을 다루는 방식이 대조된다는 점이 잘 드러납니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">Whatever you want to do\u003c/span>, if you want to be great at it, you have to love it and be able to make sacrifices for it.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Whatever you want to do,\u003c/div>\u003cdiv class=\"k\">당신이 무엇을 하고 싶든지 간에,\u003c/div>\u003cdiv class=\"e\">if you want to be great at it,\u003c/div>\u003cdiv class=\"k\">만약 당신이 그것에 뛰어나길 원한다면,\u003c/div>\u003cdiv class=\"e\">you have to love it\u003c/div>\u003cdiv class=\"k\">당신은 그것을 사랑해야 한다\u003c/div>\u003cdiv class=\"e\">and be able to make sacrifices for it.\u003c/div>\u003cdiv class=\"k\">그리고 그것을 위해서 희생할 수 있어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Whatever\u003c/b>는 '무엇을 하든'의 뜻을 만드는 복합관계사로, \u003cb class=\"key\">you want to do\u003c/b>와 함께 명사절을 이룹니다. 뒤의 \u003cb class=\"key\">if\u003c/b>는 조건을 나타내고, \u003cb class=\"key\">be able to\u003c/b>는 '~할 수 있다'라는 표현입니다.\u003c/div>","segs":[{"n":69,"text":"Whatever you want to do, 당신이 무엇을 하고 싶든지 간에. if you want to be great at it, 만약 당신이 그것에 뛰어나길 원한다면. you have to love it, 당신은 그것을 사랑해야 한다. and be able to make sacrifices for it, 그리고 그것을 위해서 희생할 수 있어야 한다.","hl":"ch"},{"n":70,"text":"이 문장은 Whatever you want to do로 시작해요. Whatever는 무엇을 하든이라는 뜻을 만드는 복합관계사예요. if you want to be great at it은 조건을 나타내고 you have to love it and be able to make sacrifices for it이 주절의 핵심입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">Whatever you want to do\u003c/span>, if you want to be great at it, you have to love it and be able to make sacrifices for it.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>무엇을 하든 그것에 뛰어나고 싶다면 그 일을 사랑해야 하고 기꺼이 희생할 수 있어야 한다는 뜻이에요. 재능보다 애정과 헌신이 중요하다는 메시지를 담고 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Whatever you want to do\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">No matter what you want to do\u003c/span>\u003cdiv class=\"w\">Whatever를 No matter what으로 바꾸어 같은 양보의 뜻을 풀어 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be able to make sacrifices for it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be willing to sacrifice for it\u003c/span>\u003cdiv class=\"w\">be able to를 be willing to로 바꾸어 기꺼이 하려는 태도를 강조했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be great at\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">excel at\u003c/span>\u003cspan class=\"y-eq\">be great at = excel at\u003c/span>\u003cdiv class=\"w\">뛰어나다는 뜻을 같은 의미의 동사구로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make sacrifices\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">give up something valuable\u003c/span>\u003cspan class=\"y-eq\">make sacrifices = give up something valuable\u003c/span>\u003cdiv class=\"w\">희생하다라는 뜻을 풀어 설명했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whatever\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">no matter what\u003c/span>\u003cspan class=\"y-eq\">whatever = no matter what\u003c/span>\u003cdiv class=\"w\">복합관계사를 양보의 구로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">No matter what you want to do, if you want to excel at it, you must love it and be willing to make sacrifices for it.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"무엇을 하든 그것에 뛰어나고 싶다면 그 일을 사랑해야 하고 기꺼이 희생할 수 있어야 한다는 뜻이에요. 좋아하는 마음과 헌신이 중요하다는 메시지입니다.","hl":"mn"},{"n":72,"text":"Whatever you want to do는 No matter what you want to do로 바꿀 수 있어요. be able to make sacrifices for it은 be willing to sacrifice for it으로 바꾸면 태도가 더 강조됩니다.","hl":"rw"},{"n":73,"text":"be great at은 excel at으로, make sacrifices는 give up something valuable로 바꿀 수 있어요. whatever는 no matter what으로 정리해 둡시다.","hl":"ph"},{"n":74,"text":"같은 뜻의 문장을 읽어 볼게요. No matter what you want to do, if you want to excel at it, you must love it and be willing to make sacrifices for it. 무엇을 하든 사랑과 헌신이 필요하다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">양보·대조·조건의 복합 구문\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">Even though\u003c/b>, \u003cb class=\"key\">Even if\u003c/b>, \u003cb class=\"key\">Though\u003c/b>는 양보의 부사절을 이끈다.\u003c/li>\u003cli>\u003cb class=\"key\">whereas\u003c/b>, \u003cb class=\"key\">while\u003c/b>은 두 절을 대조한다.\u003c/li>\u003cli>\u003cb class=\"key\">However\u003c/b> + 형용사·부사와 \u003cb class=\"key\">No matter what\u003c/b>, \u003cb class=\"key\">Whatever\u003c/b>는 '아무리 ~해도/무엇이든'을 만든다.\u003c/li>\u003cli>\u003cb class=\"key\">Strange as it may sound\u003c/b>처럼 형용사가 \u003cb class=\"key\">as\u003c/b> 앞에 오면 양보 도치가 된다.\u003c/li>\u003cli>복합 구문은 접속사와 절의 역할을 먼저 잡고 같은 뜻으로 바꿔 쓰는 연습이 중요하다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 양보와 대조, 조건을 나타내는 복합 구문을 살펴봤어요. Even though, whereas, whatever 같은 표현은 문장의 논리 방향을 결정하니까 앞뒤 절을 함께 읽는 습관이 중요합니다. 같은 뜻을 다른 표현으로 바꿔 보는 연습도 꼭 해 보세요. 다음 시간에도 더 정교한 문장 구조로 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
