  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}

lecturePlayer(document.getElementById("app"),{"brand":"unit38","title":"목적과 결과를 연결하는 so that과 so·such 결과 구문 완전 정복","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">목적·결과를 나타내는 so that과 so·such 결과 구문\u003c/div>\u003ch1>목적과 결과를 연결하는 so that과 so·such 결과 구문 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>목적과 결과를 연결하는 so that, so that 결과, such that 구문을 끊어 읽고 의미를 정확히 파악한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 목적을 나타내는 so that과 결과를 나타내는 so that, 그리고 so와 such가 만드는 that 구문을 함께 공부해요. 문장을 끊어 읽으면서 목적과 결과가 어떻게 이어지는지 살펴보겠습니다. 어렵게 느껴져도 의미 단위로 나누면 훨씬 쉬워질 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">목적·결과를 나타내는 so that과 so·such 결과 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">이 유닛은 \u003cb class=\"key\">so that\u003c/b>으로 목적이나 결과를 연결하고, \u003cb class=\"key\">so + 형용사/부사 + that\u003c/b>과 \u003cb class=\"key\">such + (형용사) + 명사 + that\u003c/b>으로 정도와 결과를 나타내는 구문이다. \u003cb class=\"key\">that\u003c/b>절에는 주어와 조동사가 오며, '~하도록' 또는 '너무 ~해서 ...하다'로 해석한다. 목적의 so that은 to부정사로, 결과의 so that은 enough to나 so that 결과 구문으로 바꿔 쓸 수 있다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 We do what we have to do \u003cspan class=\"fx\">so that we can do what we want to do\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 It was \u003cspan class=\"fx\">so quiet in the room that I could hear the leaves being blown off the trees outside\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 A scientific understanding of emotional intelligence may allow us to train our emotional skills \u003cspan class=\"fx\">so that we can live more fulfilling and productive lives\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 The personal computer becomes far smaller and much more portable, \u003cspan class=\"fx\">so that some people such as writers or stock dealers are able to work wherever they are\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Some people are making \u003cspan class=\"fx\">such thorough preparation for rainy days that they aren't enjoying today's sunshine\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 In 1936, King Edward VIII became the very first British monarch to voluntarily give up his throne when he abdicated \u003cspan class=\"fx\">so that he could marry Mrs. Simpson, a divorced American woman\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 Her eyes are nothing but a pure emerald shining in the rays of the sun and the moon \u003cspan class=\"fx\">so that you can't take your eyes off her\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 When one door of happiness closes, another opens; but often we look \u003cspan class=\"fx\">so long at the closed door that we do not see the one which has been opened for us\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 The witness described the suspect \u003cspan class=\"fx\">in such detail that the police were able to locate him in no time\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 Rights and obligations should be \u003cspan class=\"fx\">so inseparable that a demand for one is always accompanied by a statement of the other\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 If you live to be a hundred, I want to live to be a hundred minus one day \u003cspan class=\"fx\">so I never have to live without you\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 When you are reading for study purposes, it is critical to read systematically, \u003cspan class=\"fx\">so you are able to integrate the new knowledge you acquire with what you already know\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"이 유닛의 핵심은 두 가지 연결 방식이에요. so that은 목적이나 결과를 이어 주고, so나 such 뒤에 형용사나 명사가 온 뒤 that이 나오면 정도와 결과를 나타내요. 해석할 때는 너무 그래서 어떻게 되었다는 흐름을 잡는 것이 중요해요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 We do what we have to do \u003cspan class=\"fx\">so that we can do what we want to do\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We do\u003c/div>\u003cdiv class=\"k\">우리는 한다\u003c/div>\u003cdiv class=\"e\">what we have to do\u003c/div>\u003cdiv class=\"k\">우리가 해야 하는 것을\u003c/div>\u003cdiv class=\"e\">so that\u003c/div>\u003cdiv class=\"k\">그렇게 함으로써\u003c/div>\u003cdiv class=\"e\">we can do\u003c/div>\u003cdiv class=\"k\">우리가 할 수 있다\u003c/div>\u003cdiv class=\"e\">what we want to do.\u003c/div>\u003cdiv class=\"k\">우리가 하고 싶은 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">so that\u003c/b>은 앞의 행동이 이루어지는 목적을 뒤 절로 연결한다. 여기서는 해야 할 일을 먼저 함으로써 원하는 일을 할 수 있다는 목적 관계를 만든다.\u003c/div>","segs":[{"n":3,"text":"We do, 우리는 한다. what we have to do, 우리가 해야 하는 것을. so that, 그렇게 함으로써. we can do, 우리가 할 수 있다. what we want to do, 우리가 하고 싶은 것을","hl":"ch"},{"n":4,"text":"첫 번째 문장은 목적을 나타내는 so that 구문이에요. 우리가 해야 하는 일을 먼저 하고, 그렇게 해서 하고 싶은 일을 할 수 있다는 목적 관계를 이어 주죠. so that 뒤에는 주어와 조동사가 오고, 여기서는 we can do가 이어져요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 We do what we have to do \u003cspan class=\"fx\">so that we can do what we want to do\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 문장은 해야 할 일과 하고 싶은 일을 단순히 나열하지 않고, 의무를 다하는 것이 원하는 일을 가능하게 하는 과정임을 강조한다. 그래서 책임을 먼저 인정하는 성숙한 태도가 느껴진다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so that we can do\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so as to do\u003c/span>\u003cdiv class=\"w\">같은 주어가 반복될 때 목적을 to부정사로 간결하게 표현한다. 격식 있는 문어체에서 자주 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have to do\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">must do\u003c/span>\u003cdiv class=\"w\">의무의 강도를 살짝 높인 표현이다. 일상적인 have to보다 단호하게 들린다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have to do\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">must do\u003c/span>\u003cspan class=\"y-eq\">have to = must\u003c/span>\u003cdiv class=\"w\">의무를 나타내는 조동사를 바꾼 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">want to do\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">would like to do\u003c/span>\u003cspan class=\"y-eq\">want = would like\u003c/span>\u003cdiv class=\"w\">원함을 더 공손하고 부드럽게 표현한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in order that\u003c/span>\u003cspan class=\"y-eq\">so that = in order that\u003c/span>\u003cdiv class=\"w\">목적을 나타내는 접속사로 격식 있는 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We first fulfill our obligations so that we may eventually do what we desire.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 해야 할 일과 하고 싶은 일을 그냥 나열한 것이 아니에요. 의무를 다하는 일이 원하는 일을 가능하게 하는 과정이라는 점을 강조하죠. 그래서 책임을 먼저 생각하는 성숙한 태도가 느껴져요.","hl":"mn"},{"n":6,"text":"so that we can do는 so as to do나 in order to do로 바꿔 쓸 수 있어요. 같은 주어가 반복될 때는 to부정사가 더 간결하죠. 시험에서는 목적을 나타내는 표현끼리 바꿔 쓰는 문제가 자주 나와요.","hl":"rw"},{"n":7,"text":"have to do는 must do로 바꿀 수 있고, want to do는 would like to do로 바꿀 수 있어요. so that은 in order that과 비슷한 목적 표현이에요. 이런 표현은 의미는 같지만 문장의 격식이 조금 달라져요.","hl":"ph"},{"n":8,"text":"전체 문장을 바꿔 말하면 We first fulfill our obligations so that we may eventually do what we desire.라고 할 수 있어요. 먼저 의무를 다한 뒤 원하는 일을 할 수 있다는 흐름이 그대로 담겨 있죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 It was \u003cspan class=\"fx\">so quiet in the room that I could hear the leaves being blown off the trees outside\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It was\u003c/div>\u003cdiv class=\"k\">그것은 ...였다\u003c/div>\u003cdiv class=\"e\">so quiet in the room\u003c/div>\u003cdiv class=\"k\">방 안에서 아주 조용해서\u003c/div>\u003cdiv class=\"e\">that\u003c/div>\u003cdiv class=\"k\">그 결과\u003c/div>\u003cdiv class=\"e\">I could hear\u003c/div>\u003cdiv class=\"k\">나는 들을 수 있었다\u003c/div>\u003cdiv class=\"e\">the leaves\u003c/div>\u003cdiv class=\"k\">나뭇잎들이\u003c/div>\u003cdiv class=\"e\">being blown off the trees outside.\u003c/div>\u003cdiv class=\"k\">바깥의 나무들로부터 날리고 있는 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">so + 형용사 + that\u003c/b>은 '너무 ~해서 ...하다'라는 정도와 결과를 나타낸다. 여기서는 quiet의 정도가 커서 나뭇잎이 날리는 소리까지 들릴 정도라는 결과로 이어진다.\u003c/div>","segs":[{"n":9,"text":"It was, 그것은 ...였다. so quiet in the room, 방 안에서 아주 조용해서. that, 그 결과. I could hear, 나는 들을 수 있었다. the leaves, 나뭇잎들이. being blown off the trees outside, 바깥의 나무들로부터 날리고 있는 것을","hl":"ch"},{"n":10,"text":"두 번째 문장은 so와 형용사, 그리고 that이 함께 쓰인 결과 구문이에요. 방 안이 아주 조용하다는 정도가 커서 나뭇잎 소리까지 들린다는 결과로 이어지죠. 이때 that절은 so quiet의 결과를 설명해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 It was \u003cspan class=\"fx\">so quiet in the room that I could hear the leaves being blown off the trees outside\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>방 안이 아주 조용했기 때문에 바깥에서 나뭇잎이 날리는 소리까지 들을 수 있었다는 뜻이다. 고요함을 감각적으로 강조하는 문장이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so quiet in the room that I could hear\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">quiet enough in the room for me to hear\u003c/span>\u003cdiv class=\"w\">so that 결과를 enough to 구조로 바꾸어 정도의 충분함을 강조한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the leaves being blown off the trees\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the leaves blown off the trees\u003c/span>\u003cdiv class=\"w\">being을 빼면 진행의 느낌이 줄고 결과 상태에 초점이 간다. 원문은 날리고 있는 진행 상황을 살린다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so quiet\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">extremely quiet\u003c/span>\u003cspan class=\"y-eq\">so = extremely\u003c/span>\u003cdiv class=\"w\">정도를 강조하는 부사로 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">could hear\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">was able to hear\u003c/span>\u003cspan class=\"y-eq\">could = was able to\u003c/span>\u003cdiv class=\"w\">능력을 명시적으로 표현한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">blown off\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">blown away from\u003c/span>\u003cspan class=\"y-eq\">off = away from\u003c/span>\u003cdiv class=\"w\">나무에서 떨어져 나가는 방향성을 더 분명히 한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The room was quiet enough for me to hear the leaves being blown off the trees outside.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 방 안이 얼마나 조용한지를 직접 말하지 않고, 바깥 나뭇잎 소리까지 들린다는 사실로 보여 줘요. 아주 고요하고 집중이 잘 되는 분위기가 느껴지죠.","hl":"mn"},{"n":12,"text":"so quiet that I could hear는 quiet enough for me to hear로 바꿔 쓸 수 있어요. enough to 구문은 정도가 충분해서 어떤 일이 가능하다는 느낌을 줘요. 진행의 느낌을 살릴 때는 being blown을 그대로 두면 좋아요.","hl":"rw"},{"n":13,"text":"so quiet은 extremely quiet로 바꿀 수 있고, could hear는 was able to hear로 바꿀 수 있어요. blown off는 blown away from으로 방향을 더 분명하게 표현할 수 있죠. 이런 표현들은 독해에서 정도와 결과를 놓치지 않게 도와줘요.","hl":"ph"},{"n":14,"text":"전체 문장은 The room was quiet enough for me to hear the leaves being blown off the trees outside.라고 바꿔 말할 수 있어요. 조용함의 정도가 나뭇잎 소리를 들을 만큼 컸다는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 A scientific understanding of emotional intelligence may allow us to train our emotional skills \u003cspan class=\"fx\">so that we can live more fulfilling and productive lives\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A scientific understanding\u003c/div>\u003cdiv class=\"k\">과학적 이해는\u003c/div>\u003cdiv class=\"e\">of emotional intelligence\u003c/div>\u003cdiv class=\"k\">정서 지능에 대한\u003c/div>\u003cdiv class=\"e\">may allow us\u003c/div>\u003cdiv class=\"k\">우리에게 허락할지도 모른다\u003c/div>\u003cdiv class=\"e\">to train our emotional skills\u003c/div>\u003cdiv class=\"k\">우리의 감정 기술을 훈련하도록\u003c/div>\u003cdiv class=\"e\">so that\u003c/div>\u003cdiv class=\"k\">그렇게 함으로써\u003c/div>\u003cdiv class=\"e\">we can live\u003c/div>\u003cdiv class=\"k\">우리가 살 수 있다\u003c/div>\u003cdiv class=\"e\">more fulfilling and productive lives.\u003c/div>\u003cdiv class=\"k\">더 충만하고 생산적인 삶을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">so that\u003c/b>은 앞 절의 행동이 목적하는 바를 뒤 절로 연결한다. 여기서는 정서 기술 훈련이 더 충만하고 생산적인 삶을 살기 위한 목적임을 나타낸다.\u003c/div>","segs":[{"n":15,"text":"A scientific understanding, 과학적 이해는. of emotional intelligence, 정서 지능에 대한. may allow us, 우리에게 허락할지도 모른다. to train our emotional skills, 우리의 감정 기술을 훈련하도록. so that, 그렇게 함으로써. we can live, 우리가 살 수 있다. more fulfilling and productive lives, 더 충만하고 생산적인 삶을","hl":"ch"},{"n":16,"text":"세 번째 문장도 목적을 나타내는 so that 구문이에요. 앞에서는 정서 지능을 과학적으로 이해하는 이야기가 나오고, 뒤에서는 우리가 더 충만하고 생산적인 삶을 살기 위한 목적이 제시되죠. so that 뒤의 we can live가 그 목적을 구체화해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 A scientific understanding of emotional intelligence may allow us to train our emotional skills \u003cspan class=\"fx\">so that we can live more fulfilling and productive lives\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>정서 지능을 과학적으로 이해하면 감정 기술을 훈련할 수 있고, 그 결과 더 만족스럽고 생산적인 삶을 살 수 있다는 가능성을 말한다. 가능성을 나타내는 may가 붙어 조심스러운 제안의 느낌을 준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so that we can live\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so as to live\u003c/span>\u003cdiv class=\"w\">주어가 같을 때 목적을 to부정사로 간결하게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">may allow us to train\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can enable us to train\u003c/span>\u003cdiv class=\"w\">가능성과 허용의 의미를 enable로 바꿔 원인 제공을 강조한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">allow us to train\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">enable us to train\u003c/span>\u003cspan class=\"y-eq\">allow = enable\u003c/span>\u003cdiv class=\"w\">가능하게 한다는 의미를 더 직접적으로 표현한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fulfilling\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rewarding\u003c/span>\u003cspan class=\"y-eq\">fulfilling = rewarding\u003c/span>\u003cdiv class=\"w\">성취감을 주는 느낌을 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">productive lives\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">efficient and fruitful lives\u003c/span>\u003cspan class=\"y-eq\">productive = fruitful\u003c/span>\u003cdiv class=\"w\">생산적인 삶을 더 풍부한 뉘앙스로 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Understanding emotional intelligence scientifically can help us develop our emotional skills so that we may enjoy more rewarding and productive lives.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 정서 지능을 이해하는 것이 단순한 지식에 그치지 않고 실제 감정 기술 훈련으로 이어질 수 있다고 말해요. may가 들어 있어서 조심스럽게 가능성을 제안하는 느낌도 있죠.","hl":"mn"},{"n":18,"text":"so that we can live는 so as to live로 간결하게 바꿀 수 있어요. allow us to train은 enable us to train으로 바꾸면 가능하게 한다는 의미가 더 분명해져요. 뜻은 유지하면서 문장의 초점을 조금 바꾸는 방식이에요.","hl":"rw"},{"n":19,"text":"fulfilling은 rewarding으로, productive는 fruitful로 바꿔 쓸 수 있어요. allow는 enable과 자주 비교되는데, enable은 가능성을 더 직접적으로 열어 준다는 느낌이 있어요. 이런 유의어는 독해의 뉘앙스 차이를 잡는 데 도움이 돼요.","hl":"ph"},{"n":20,"text":"전체 문장은 Understanding emotional intelligence scientifically can help us develop our emotional skills so that we may enjoy more rewarding and productive lives.라고 바꿔 말할 수 있어요. 과학적 이해가 감정 기술 훈련과 더 나은 삶으로 이어진다는 흐름이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 The personal computer becomes far smaller and much more portable, \u003cspan class=\"fx\">so that some people such as writers or stock dealers are able to work wherever they are\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The personal computer\u003c/div>\u003cdiv class=\"k\">개인용 컴퓨터는\u003c/div>\u003cdiv class=\"e\">becomes far smaller\u003c/div>\u003cdiv class=\"k\">훨씬 더 작아진다\u003c/div>\u003cdiv class=\"e\">and much more portable,\u003c/div>\u003cdiv class=\"k\">그리고 훨씬 더 휴대하기 쉬워진다\u003c/div>\u003cdiv class=\"e\">so that\u003c/div>\u003cdiv class=\"k\">그리하여\u003c/div>\u003cdiv class=\"e\">some people such as writers or stock dealers\u003c/div>\u003cdiv class=\"k\">작가나 증권 중개인 같은 일부 사람들은\u003c/div>\u003cdiv class=\"e\">are able to work\u003c/div>\u003cdiv class=\"k\">일할 수 있다\u003c/div>\u003cdiv class=\"e\">wherever they are.\u003c/div>\u003cdiv class=\"k\">그들이 있는 어디서든\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">so that\u003c/b>은 앞절의 변화가 뒤절의 결과나 목적을 가능하게 함을 나타낸다. 여기서는 컴퓨터가 작아지고 휴대성이 높아진 결과, 특정 직업인들이 장소에 구애받지 않고 일할 수 있게 됨을 연결한다.\u003c/div>","segs":[{"n":21,"text":"The personal computer, 개인용 컴퓨터는. becomes far smaller, 훨씬 더 작아진다. and much more portable, 그리고 훨씬 더 휴대하기 쉬워진다. so that, 그리하여. some people such as writers or stock dealers, 작가나 증권 중개인 같은 일부 사람들은. are able to work, 일할 수 있다. wherever they are, 그들이 있는 어디서든","hl":"ch"},{"n":22,"text":"네 번째 문장은 so that이 앞의 변화와 뒤의 결과를 이어 주는 구문이에요. 컴퓨터가 더 작고 휴대하기 쉬워진 결과, 작가나 증권 중개인 같은 사람들이 어디서든 일할 수 있게 되었다는 뜻이죠. 여기서 so that은 결과를 자연스럽게 연결해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 The personal computer becomes far smaller and much more portable, \u003cspan class=\"fx\">so that some people such as writers or stock dealers are able to work wherever they are\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>개인용 컴퓨터의 발전으로 작가나 증권 중개인 같은 사람들이 어디서든 일할 수 있게 되었다는 뜻이다. 기술 변화가 일하는 방식과 장소를 바꾼다는 점을 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so that some people are able to work\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">enabling some people to work\u003c/span>\u003cdiv class=\"w\">so that절을 분사구문으로 바꿔 앞 변화의 결과를 간결하게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">wherever they are\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">no matter where they are\u003c/span>\u003cdiv class=\"w\">장소의 양보를 더 분명하게 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">becomes far smaller\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">becomes much smaller\u003c/span>\u003cspan class=\"y-eq\">far = much\u003c/span>\u003cdiv class=\"w\">비교급 강조 부사를 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">portable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">easy to carry\u003c/span>\u003cspan class=\"y-eq\">portable = easy to carry\u003c/span>\u003cdiv class=\"w\">휴대 가능성을 쉬운 말로 풀어 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are able to work\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can work\u003c/span>\u003cspan class=\"y-eq\">be able to = can\u003c/span>\u003cdiv class=\"w\">능력 표현을 조동사로 간결하게 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The personal computer has become much smaller and far more portable, enabling people like writers or stock dealers to work no matter where they are.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 기술의 변화가 일하는 장소를 어떻게 바꾸는지 보여 줘요. 개인용 컴퓨터가 작아지고 들고 다니기 쉬워지면서 직업의 공간 제약이 줄어든 거죠. 그래서 일하는 방식이 더 자유로워졌다는 느낌이 들어요.","hl":"mn"},{"n":24,"text":"so that some people are able to work는 enabling some people to work로 바꿔 쓸 수 있어요. wherever they are는 no matter where they are로 풀어 쓸 수 있고요. 이렇게 바꾸면 결과의 흐름이 더 간결해져요.","hl":"rw"},{"n":25,"text":"far smaller는 much smaller로 바꿀 수 있고, portable은 easy to carry로 설명할 수 있어요. are able to work는 can work로 간결하게 바꿀 수 있죠. 비교급 강조와 능력 표현을 함께 익혀 두면 좋아요.","hl":"ph"},{"n":26,"text":"전체 문장은 The personal computer has become much smaller and far more portable, enabling people like writers or stock dealers to work no matter where they are.라고 바꿔 말할 수 있어요. 기술 변화가 일의 공간을 넓혔다는 뜻이 담겨 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Some people are making \u003cspan class=\"fx\">such thorough preparation for rainy days that they aren't enjoying today's sunshine\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Some people\u003c/div>\u003cdiv class=\"k\">어떤 사람들은\u003c/div>\u003cdiv class=\"e\">are making\u003c/div>\u003cdiv class=\"k\">하고 있다\u003c/div>\u003cdiv class=\"e\">such thorough preparation\u003c/div>\u003cdiv class=\"k\">그러한 철저한 준비를\u003c/div>\u003cdiv class=\"e\">for rainy days\u003c/div>\u003cdiv class=\"k\">비 오는 날을 위해\u003c/div>\u003cdiv class=\"e\">that\u003c/div>\u003cdiv class=\"k\">그 결과\u003c/div>\u003cdiv class=\"e\">they aren't enjoying\u003c/div>\u003cdiv class=\"k\">그들은 즐기지 못하고 있다\u003c/div>\u003cdiv class=\"e\">today's sunshine.\u003c/div>\u003cdiv class=\"k\">오늘의 햇빛을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">such + 형용사 + 명사 + that\u003c/b>은 '너무 ~한 ...해서 ...하다'라는 정도와 결과를 나타낸다. 여기서는 철저한 준비의 정도가 커서 오늘의 햇빛을 즐기지 못하는 결과로 이어진다.\u003c/div>","segs":[{"n":27,"text":"Some people, 어떤 사람들은. are making, 하고 있다. such thorough preparation, 그러한 철저한 준비를. for rainy days, 비 오는 날을 위해. that, 그 결과. they aren't enjoying, 그들은 즐기지 못하고 있다. today's sunshine, 오늘의 햇빛을","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 such와 명사, 그리고 that이 함께 쓰인 결과 구문이에요. 비 오는 날을 위한 아주 철저한 준비가, 오늘의 햇빛을 즐기지 못하는 결과로 이어지죠. such 뒤에는 형용사와 명사가 함께 온다는 점을 기억해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Some people are making \u003cspan class=\"fx\">such thorough preparation for rainy days that they aren't enjoying today's sunshine\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>어떤 사람들은 미래의 비 오는 날을 너무 철저히 대비한 나머지 지금 주어진 좋은 순간을 즐기지 못한다는 뜻이다. 지나친 준비가 현재의 행복을 놓치게 할 수 있음을 경계한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">such thorough preparation for rainy days that they aren't enjoying\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so thoroughly prepared for rainy days that they aren't enjoying\u003c/span>\u003cdiv class=\"w\">such 명사 구문을 so 부사 구문으로 바꿔 준비의 정도를 강조한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rainy days\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">future hardships\u003c/span>\u003cdiv class=\"w\">비 오는 날을 미래의 어려움이라는 비유로 풀어 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make preparation for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">prepare for\u003c/span>\u003cspan class=\"y-eq\">make preparation for = prepare for\u003c/span>\u003cdiv class=\"w\">명사구를 동사로 간결하게 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">thorough\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">careful and complete\u003c/span>\u003cspan class=\"y-eq\">thorough = careful and complete\u003c/span>\u003cdiv class=\"w\">철저함을 풀어 설명한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">aren't enjoying\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fail to enjoy\u003c/span>\u003cspan class=\"y-eq\">not enjoy = fail to enjoy\u003c/span>\u003cdiv class=\"w\">즐기지 못하는 결과를 더 분명히 한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Some people prepare so thoroughly for future rainy days that they fail to enjoy today's sunshine.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 미래를 대비하는 마음이 지나치면 현재의 좋은 순간을 놓칠 수 있다는 것을 말해요. 비 오는 날은 앞으로 닥칠 어려움을 비유하고, 오늘의 햇빛은 지금 누릴 수 있는 행복을 뜻하죠. 그래서 균형 잡힌 태도가 필요하다는 메시지가 느껴져요.","hl":"mn"},{"n":30,"text":"such thorough preparation that they aren't enjoying은 so thoroughly prepared that they aren't enjoying으로 바꿀 수 있어요. 명사 중심 표현을 형용사 중심 표현으로 바꾸는 방식이죠. rainy days는 future hardships처럼 비유를 풀어 쓸 수도 있어요.","hl":"rw"},{"n":31,"text":"make preparation for는 prepare for로 간결하게 바꿀 수 있어요. thorough는 careful and complete로 풀어 쓸 수 있고, aren't enjoying은 fail to enjoy로 바꿀 수 있죠. 이런 표현은 글의 태도와 뉘앙스를 잡는 데 도움이 돼요.","hl":"ph"},{"n":32,"text":"전체 문장은 Some people prepare so thoroughly for future rainy days that they fail to enjoy today's sunshine.라고 바꿔 말할 수 있어요. 미래 준비에 지나치게 몰두해 현재를 놓친다는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 In 1936, King Edward VIII became the very first British monarch to voluntarily give up his throne when he abdicated \u003cspan class=\"fx\">so that he could marry Mrs. Simpson, a divorced American woman\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">In 1936,\u003c/div>\u003cdiv class=\"k\">1936년에\u003c/div>\u003cdiv class=\"e\">King Edward VIII\u003c/div>\u003cdiv class=\"k\">에드워드 8세 국왕은\u003c/div>\u003cdiv class=\"e\">became\u003c/div>\u003cdiv class=\"k\">되었다\u003c/div>\u003cdiv class=\"e\">the very first British monarch\u003c/div>\u003cdiv class=\"k\">바로 최초의 영국 군주가\u003c/div>\u003cdiv class=\"e\">to voluntarily give up his throne\u003c/div>\u003cdiv class=\"k\">자발적으로 자신의 왕위를 포기한\u003c/div>\u003cdiv class=\"e\">when he abdicated\u003c/div>\u003cdiv class=\"k\">그가 퇴위했을 때\u003c/div>\u003cdiv class=\"e\">so that\u003c/div>\u003cdiv class=\"k\">~하기 위해\u003c/div>\u003cdiv class=\"e\">he could marry Mrs. Simpson,\u003c/div>\u003cdiv class=\"k\">그는 심슨 부인과 결혼할 수 있었다\u003c/div>\u003cdiv class=\"e\">a divorced American woman.\u003c/div>\u003cdiv class=\"k\">이혼한 미국인 여성인\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">so that\u003c/b>은 퇴위라는 행동의 목적을 뒤 절로 연결한다. 여기서는 왕위를 포기한 이유가 Simpson 부인과 결혼하기 위해서였음을 분명히 한다.\u003c/div>","segs":[{"n":33,"text":"In 1936, 1936년에. King Edward VIII, 에드워드 8세 국왕은. became, 되었다. the very first British monarch, 바로 최초의 영국 군주가. to voluntarily give up his throne, 자발적으로 자신의 왕위를 포기한. when he abdicated, 그가 퇴위했을 때. so that, ~하기 위해. he could marry Mrs. Simpson, 그는 심슨 부인과 결혼할 수 있었다. a divorced American woman, 이혼한 미국인 여성인","hl":"ch"},{"n":34,"text":"육 번째 문장은 퇴위라는 행동의 목적을 so that으로 이어 준 구문이에요. 왕위를 포기한 이유가 Simpson 부인과 결혼하기 위해서였다는 점을 뒤 절이 설명하죠. so that 뒤에는 he could marry가 와서 목적을 분명히 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 In 1936, King Edward VIII became the very first British monarch to voluntarily give up his throne when he abdicated \u003cspan class=\"fx\">so that he could marry Mrs. Simpson, a divorced American woman\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>에드워드 팔세는 이혼한 미국 여성인 Simpson 부인과 결혼하려고 자발적으로 왕위를 포기한 최초의 영국 군주가 되었다는 뜻이다. 사랑을 위해 왕권을 내려놓은 역사적 사건을 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so that he could marry\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in order to marry\u003c/span>\u003cdiv class=\"w\">주어가 같을 때 목적을 to부정사로 간결하게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a divorced American woman\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">an American woman who had been divorced\u003c/span>\u003cdiv class=\"w\">명사구를 관계절로 풀어 이혼한 상태를 설명한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">give up his throne\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">abdicate\u003c/span>\u003cspan class=\"y-eq\">give up his throne = abdicate\u003c/span>\u003cdiv class=\"w\">왕위 포기를 한 단어로 압축한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">voluntarily\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">of his own free will\u003c/span>\u003cspan class=\"y-eq\">voluntarily = of his own free will\u003c/span>\u003cdiv class=\"w\">자발성을 풀어 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the very first\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the first ever\u003c/span>\u003cspan class=\"y-eq\">very first = first ever\u003c/span>\u003cdiv class=\"w\">최초임을 강조하는 표현을 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">In 1936, King Edward the Eighth became the first British monarch ever to give up his throne voluntarily when he abdicated in order to marry Mrs. Simpson, an American woman who had been divorced.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 사랑을 위해 왕권을 내려놓은 역사적 선택을 보여 줘요. 에드워드 팔세는 이혼한 미국인 여성과 결혼하기 위해 자발적으로 왕위를 포기했죠. 그래서 개인적인 사랑과 공적인 의무가 충돌한 사건으로 기억돼요.","hl":"mn"},{"n":36,"text":"so that he could marry는 in order to marry로 간결하게 바꿀 수 있어요. a divorced American woman은 an American woman who had been divorced처럼 풀어 쓸 수 있고요. 명사구를 관계절로 바꾸면 정보가 더 천천히 설명돼요.","hl":"rw"},{"n":37,"text":"give up his throne은 abdicate로 바꿀 수 있어요. voluntarily는 of his own free will로 풀어 쓸 수 있고, the very first는 the first ever로 바꿀 수 있죠. 이런 표현은 역사 지문에서 자주 만나요.","hl":"ph"},{"n":38,"text":"전체 문장은 King Edward the Eighth became the first British monarch ever to give up his throne voluntarily in order to marry the woman he loved.라고 바꿔 말할 수 있어요. 왕위를 포기한 이유가 사랑이었다는 핵심이 그대로 담겨 있죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 Her eyes are nothing but a pure emerald shining in the rays of the sun and the moon \u003cspan class=\"fx\">so that you can't take your eyes off her\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Her eyes\u003c/div>\u003cdiv class=\"k\">그녀의 눈은\u003c/div>\u003cdiv class=\"e\">are nothing but a pure emerald\u003c/div>\u003cdiv class=\"k\">순수한 에메랄드일 뿐이다\u003c/div>\u003cdiv class=\"e\">shining\u003c/div>\u003cdiv class=\"k\">빛나고 있는\u003c/div>\u003cdiv class=\"e\">in the rays of the sun and the moon\u003c/div>\u003cdiv class=\"k\">해와 달의 빛줄기 속에서\u003c/div>\u003cdiv class=\"e\">so that\u003c/div>\u003cdiv class=\"k\">그리하여\u003c/div>\u003cdiv class=\"e\">you can't take your eyes off her.\u003c/div>\u003cdiv class=\"k\">당신은 그녀에게서 눈을 뗄 수 없다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">so that\u003c/b>이 앞의 상태로 인한 결과를 뒤 절로 연결한다. 여기서는 눈이 순수한 에메랄드처럼 빛나는 상태 때문에 시선을 떼기 어렵다는 결과를 나타낸다.\u003c/div>","segs":[{"n":39,"text":"Her eyes, 그녀의 눈은. are nothing but a pure emerald, 순수한 에메랄드일 뿐이다. shining, 빛나고 있는. in the rays of the sun and the moon, 해와 달의 빛줄기 속에서. so that, 그리하여. you can't take your eyes off her, 당신은 그녀에게서 눈을 뗄 수 없다","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 so that이 앞의 상태 때문에 생기는 결과를 이어 주는 구문이에요. 그녀의 눈이 빛나는 에메랄드 같아서 시선을 떼기 어렵다는 결과로 이어지죠. 여기서 so that은 목적보다 결과의 느낌이 강해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 Her eyes are nothing but a pure emerald shining in the rays of the sun and the moon \u003cspan class=\"fx\">so that you can't take your eyes off her\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>그녀의 눈이 해와 달빛 속에서 빛나는 순수한 에메랄드 같아서 보는 사람이 눈을 뗄 수 없다는 뜻이다. 그녀의 눈에 대한 강한 매혹과 경외감을 표현한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so that you can't take your eyes off her\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">making it impossible for you to look away from her\u003c/span>\u003cdiv class=\"w\">so that 결과를 분사구문으로 바꾸어 인과 관계를 자연스럽게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nothing but a pure emerald\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">only a pure emerald\u003c/span>\u003cdiv class=\"w\">nothing but을 only로 바꾸어 강조를 유지한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nothing but\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">only\u003c/span>\u003cspan class=\"y-eq\">nothing but = only\u003c/span>\u003cdiv class=\"w\">배타적 강조를 간단히 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take your eyes off\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">look away from\u003c/span>\u003cspan class=\"y-eq\">take one's eyes off = look away from\u003c/span>\u003cdiv class=\"w\">시선을 떼는 행동을 자연스럽게 표현한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in the rays of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in the light of\u003c/span>\u003cspan class=\"y-eq\">rays = light\u003c/span>\u003cdiv class=\"w\">빛줄기라는 표현을 일반적인 빛으로 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Her eyes are only a pure emerald shining in the light of the sun and the moon, making it impossible for you to look away from her.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 그녀의 눈을 아주 강렬하게 묘사해요. 순수한 에메랄드가 해와 달빛 속에서 빛난다고 말하면서, 보는 사람이 눈을 뗄 수 없다는 반응을 보여 주죠. 그래서 매혹적이고 신비로운 분위기가 느껴져요.","hl":"mn"},{"n":42,"text":"so that you can't take your eyes off her는 making it impossible for you to look away from her로 바꿀 수 있어요. nothing but a pure emerald는 only a pure emerald로 바꿀 수 있고요. 이렇게 바꾸면 강조는 유지하면서 문장이 조금 더 매끄러워져요.","hl":"rw"},{"n":43,"text":"nothing but은 only로 바꿀 수 있어요. take your eyes off는 look away from으로 바꿀 수 있고, in the rays of는 in the light of로 풀어 쓸 수 있죠. 시적인 표현을 일상적인 표현으로 바꿔 보면 의미가 더 분명해져요.","hl":"ph"},{"n":44,"text":"전체 문장은 Her eyes are only a pure emerald shining in the light of the sun and the moon, making it impossible for you to look away from her.라고 바꿔 말할 수 있어요. 빛나는 눈 때문에 시선을 떼기 어렵다는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 When one door of happiness closes, another opens; but often we look \u003cspan class=\"fx\">so long at the closed door that we do not see the one which has been opened for us\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">When one door of happiness closes,\u003c/div>\u003cdiv class=\"k\">행복의 한 문이 닫힐 때,\u003c/div>\u003cdiv class=\"e\">another opens;\u003c/div>\u003cdiv class=\"k\">또 다른 문이 열린다;\u003c/div>\u003cdiv class=\"e\">but often\u003c/div>\u003cdiv class=\"k\">그러나 종종\u003c/div>\u003cdiv class=\"e\">we look\u003c/div>\u003cdiv class=\"k\">우리는 본다\u003c/div>\u003cdiv class=\"e\">so long at the closed door\u003c/div>\u003cdiv class=\"k\">닫힌 문을 너무 오래\u003c/div>\u003cdiv class=\"e\">that\u003c/div>\u003cdiv class=\"k\">그 결과\u003c/div>\u003cdiv class=\"e\">we do not see\u003c/div>\u003cdiv class=\"k\">우리는 보지 못한다\u003c/div>\u003cdiv class=\"e\">the one which has been opened for us.\u003c/div>\u003cdiv class=\"k\">우리를 위해 열려 온 문을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">so + 부사 + that\u003c/b>은 '너무 오래 ~해서 ...하다'라는 정도와 결과를 나타낸다. 여기서는 닫힌 문을 오래 바라본 결과, 열린 문을 보지 못하게 됨을 연결한다.\u003c/div>","segs":[{"n":45,"text":"When one door of happiness closes, 행복의 한 문이 닫힐 때. another opens, 또 다른 문이 열린다;. but often, 그러나 종종. we look, 우리는 본다. so long at the closed door, 닫힌 문을 너무 오래. that, 그 결과. we do not see, 우리는 보지 못한다. the one which has been opened for us, 우리를 위해 열려 온 문을","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 so와 부사 long, 그리고 that이 함께 쓰인 결과 구문이에요. 닫힌 문을 아주 오래 바라본 결과, 우리를 위해 열린 문을 보지 못한다는 뜻이죠. so long at the closed door가 정도를 만들고 that절이 결과를 설명해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 When one door of happiness closes, another opens; but often we look \u003cspan class=\"fx\">so long at the closed door that we do not see the one which has been opened for us\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>행복의 한 문이 닫히면 다른 문이 열리지만, 우리는 닫힌 문에 너무 오래 집중한 나머지 새로 열린 기회를 보지 못한다는 뜻이다. 상실에 매몰되어 새로운 가능성을 놓치는 인간의 습성을 경고한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">look so long at the closed door that we do not see\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">look at the closed door for so long that we fail to see\u003c/span>\u003cdiv class=\"w\">so long을 for so long으로 풀어 시간의 정도를 분명히 한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the one which has been opened for us\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the door that has opened for us\u003c/span>\u003cdiv class=\"w\">관계절을 간결한 표현으로 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">look long at\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stare at for a long time\u003c/span>\u003cspan class=\"y-eq\">look long at = stare at for a long time\u003c/span>\u003cdiv class=\"w\">응시하는 느낌을 더 분명히 한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">do not see\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fail to see\u003c/span>\u003cspan class=\"y-eq\">not see = fail to see\u003c/span>\u003cdiv class=\"w\">보지 못하는 결과를 강조한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">another opens\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">another opportunity appears\u003c/span>\u003cspan class=\"y-eq\">another = another opportunity\u003c/span>\u003cdiv class=\"w\">문의 비유를 기회로 풀어 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">When one door of happiness closes, another opens, but we often stare at the closed door for so long that we fail to see the one that has opened for us.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"이 문장은 상실에 너무 집중하면 새로운 기회를 놓칠 수 있다는 것을 말해요. 행복의 문이라는 비유를 통해 닫힌 것과 열린 것을 대비시키죠. 그래서 지나간 일보다 앞에 열린 가능성을 봐야 한다는 메시지가 느껴져요.","hl":"mn"},{"n":48,"text":"look so long at the closed door that we do not see는 look at the closed door for so long that we fail to see로 바꿀 수 있어요. the one which has been opened for us는 the door that has opened for us로 간결하게 바꿀 수 있고요. 긴 문장을 의미 단위로 나누면 훨씬 쉽게 읽혀요.","hl":"rw"},{"n":49,"text":"look long at은 stare at for a long time으로 바꿀 수 있어요. do not see는 fail to see로 바꿀 수 있고, another opens는 another opportunity appears처럼 비유를 풀어 쓸 수 있죠. 시적인 문장일수록 핵심 비유를 찾는 것이 중요해요.","hl":"ph"},{"n":50,"text":"전체 문장은 When one door of happiness closes, another opens, but we often stare at the closed door for so long that we fail to see the one that has opened for us.라고 바꿔 말할 수 있어요. 닫힌 문에 매몰되어 열린 기회를 놓친다는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 The witness described the suspect \u003cspan class=\"fx\">in such detail that the police were able to locate him in no time\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The witness\u003c/div>\u003cdiv class=\"k\">목격자는\u003c/div>\u003cdiv class=\"e\">described the suspect\u003c/div>\u003cdiv class=\"k\">용의자를 묘사했다\u003c/div>\u003cdiv class=\"e\">in such detail\u003c/div>\u003cdiv class=\"k\">그러한 세부 사항으로\u003c/div>\u003cdiv class=\"e\">that\u003c/div>\u003cdiv class=\"k\">그 결과\u003c/div>\u003cdiv class=\"e\">the police were able to locate him\u003c/div>\u003cdiv class=\"k\">경찰은 그의 위치를 알아낼 수 있었다\u003c/div>\u003cdiv class=\"e\">in no time.\u003c/div>\u003cdiv class=\"k\">즉시\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">such + 명사 + that\u003c/b>은 '너무 ~한 ...해서 ...하다'라는 정도와 결과를 나타낸다. 여기서는 묘사의 세부성이 커서 경찰이 즉시 위치를 찾을 수 있었다는 결과로 이어진다.\u003c/div>","segs":[{"n":51,"text":"The witness, 목격자는. described the suspect, 용의자를 묘사했다. in such detail, 그러한 세부 사항으로. that, 그 결과. the police were able to locate him, 경찰은 그의 위치를 알아낼 수 있었다. in no time, 즉시","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 such와 명사 detail, 그리고 that이 함께 쓰인 결과 구문이에요. 목격자가 아주 자세하게 묘사한 결과, 경찰이 즉시 위치를 찾을 수 있었다는 뜻이죠. such 뒤에 명사가 오고 that절이 결과를 설명해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 The witness described the suspect \u003cspan class=\"fx\">in such detail that the police were able to locate him in no time\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>목격자가 용의자를 아주 구체적으로 설명한 덕분에 경찰이 곧바로 그의 위치를 파악할 수 있었다는 뜻이다. 상세한 정보가 실제 수사 성과로 이어졌음을 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in such detail that the police were able to locate him\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so specifically that the police could locate him\u003c/span>\u003cdiv class=\"w\">such 명사 구문을 so 부사 구문으로 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">were able to locate him in no time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">could locate him immediately\u003c/span>\u003cdiv class=\"w\">어구를 조동사와 부사로 간결하게 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in no time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">immediately\u003c/span>\u003cspan class=\"y-eq\">in no time = immediately\u003c/span>\u003cdiv class=\"w\">즉시성을 같은 뜻의 부사로 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">locate him\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">find out where he was\u003c/span>\u003cspan class=\"y-eq\">locate = find the location of\u003c/span>\u003cdiv class=\"w\">위치를 찾는다는 뜻을 풀어 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in such detail\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so specifically\u003c/span>\u003cspan class=\"y-eq\">in such detail = so specifically\u003c/span>\u003cdiv class=\"w\">명사구를 부사구로 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The witness described the suspect so specifically that the police could locate him immediately.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 정보의 구체성이 실제 결과를 만든 사례를 보여 줘요. 목격자의 상세한 설명 덕분에 경찰이 빠르게 움직일 수 있었다는 점이 핵심이죠. 그래서 정확하고 자세한 말의 힘이 느껴져요.","hl":"mn"},{"n":54,"text":"in such detail that the police were able to locate him은 so specifically that the police could locate him으로 바꿀 수 있어요. in no time은 immediately로 바꿀 수 있고요. such 명사 구문을 so 부사 구문으로 바꾸는 전환은 시험에서 자주 나와요.","hl":"rw"},{"n":55,"text":"in no time은 immediately로 바꿀 수 있어요. locate him은 find out where he was로 풀어 쓸 수 있고, in such detail은 so specifically로 바꿀 수 있죠. 이런 어구는 사건 설명 지문에서 자주 등장해요.","hl":"ph"},{"n":56,"text":"전체 문장은 The witness described the suspect so specifically that the police could locate him immediately.라고 바꿔 말할 수 있어요. 자세한 묘사가 즉각적인 수사로 이어졌다는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 Rights and obligations should be \u003cspan class=\"fx\">so inseparable that a demand for one is always accompanied by a statement of the other\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Rights and obligations\u003c/div>\u003cdiv class=\"k\">권리와 의무는\u003c/div>\u003cdiv class=\"e\">should be so inseparable\u003c/div>\u003cdiv class=\"k\">너무나 불가분적이어야 한다\u003c/div>\u003cdiv class=\"e\">that\u003c/div>\u003cdiv class=\"k\">그 결과\u003c/div>\u003cdiv class=\"e\">a demand for one\u003c/div>\u003cdiv class=\"k\">하나에 대한 요구는\u003c/div>\u003cdiv class=\"e\">is always accompanied by\u003c/div>\u003cdiv class=\"k\">항상 동반된다\u003c/div>\u003cdiv class=\"e\">a statement of the other.\u003c/div>\u003cdiv class=\"k\">다른 하나의 표명에 의해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">so + 형용사 + that\u003c/b>은 '너무 ~해서 ...하다'라는 정도와 결과를 나타낸다. 여기서는 권리와 의무가 불가분적이라는 정도가 커서 하나를 요구하면 다른 하나가 항상 따라온다는 결과로 이어진다.\u003c/div>","segs":[{"n":57,"text":"Rights and obligations, 권리와 의무는. should be so inseparable, 너무나 불가분적이어야 한다. that, 그 결과. a demand for one, 하나에 대한 요구는. is always accompanied by, 항상 동반된다. a statement of the other, 다른 하나의 표명에 의해","hl":"ch"},{"n":58,"text":"열 번째 문장은 so와 형용사 inseparable, 그리고 that이 함께 쓰인 결과 구문이에요. 권리와 의무가 아주 떨어질 수 없을 만큼 긴밀해서, 하나를 요구하면 다른 하나도 함께 언급된다는 뜻이죠. so inseparable이 정도를 만들고 that절이 결과를 설명해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 Rights and obligations should be \u003cspan class=\"fx\">so inseparable that a demand for one is always accompanied by a statement of the other\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>권리와 의무는 분리될 수 없을 만큼 긴밀해서, 한쪽을 주장하면 다른 쪽도 함께 언급되어야 한다는 뜻이다. 권리만 강조하고 의무를 외면해서는 안 된다는 점을 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">should be so inseparable that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">should be inseparable enough that\u003c/span>\u003cdiv class=\"w\">so that 결과를 enough that으로 바꾸어 충분한 정도를 강조한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a demand for one is always accompanied by a statement of the other\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">demanding one always requires stating the other\u003c/span>\u003cdiv class=\"w\">수동태를 능동태로 바꾸어 관계를 더 직접적으로 보여 준다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">inseparable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">impossible to separate\u003c/span>\u003cspan class=\"y-eq\">inseparable = impossible to separate\u003c/span>\u003cdiv class=\"w\">형용사를 풀어 설명한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is accompanied by\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">comes with\u003c/span>\u003cspan class=\"y-eq\">be accompanied by = come with\u003c/span>\u003cdiv class=\"w\">수반됨을 일상적인 표현으로 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a demand for one\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">claiming one\u003c/span>\u003cspan class=\"y-eq\">a demand for = claiming\u003c/span>\u003cdiv class=\"w\">명사구를 동명사구로 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Rights and obligations should be so closely connected that whenever one is demanded, the other must also be stated.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 권리만 주장하고 의무를 잊으면 안 된다는 메시지를 담고 있어요. 권리와 의무는 서로 떼어 놓을 수 없는 한 쌍이라는 거죠. 그래서 한쪽을 말할 때 다른 쪽도 함께 책임져야 한다는 느낌이 들어요.","hl":"mn"},{"n":60,"text":"should be so inseparable that은 should be inseparable enough that으로 바꿀 수 있어요. is accompanied by는 comes with로 바꾸면 더 일상적인 표현이 되고요. 수동태를 능동태로 바꾸면 누가 무엇을 하는지 더 분명해져요.","hl":"rw"},{"n":61,"text":"inseparable은 impossible to separate로 풀어 쓸 수 있어요. be accompanied by는 come with로 바꿀 수 있고, a demand for one은 claiming one처럼 동명사 표현으로 바꿀 수 있죠. 추상적인 문장일수록 쉬운 말로 바꿔 보는 연습이 중요해요.","hl":"ph"},{"n":62,"text":"전체 문장은 Rights and obligations should be so closely connected that whenever one is demanded, the other must also be stated.라고 바꿔 말할 수 있어요. 권리와 의무가 함께 가야 한다는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 If you live to be a hundred, I want to live to be a hundred minus one day \u003cspan class=\"fx\">so I never have to live without you\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If you live\u003c/div>\u003cdiv class=\"k\">만약 당신이 산다면\u003c/div>\u003cdiv class=\"e\">to be a hundred,\u003c/div>\u003cdiv class=\"k\">백 살까지\u003c/div>\u003cdiv class=\"e\">I want to live\u003c/div>\u003cdiv class=\"k\">나는 살고 싶다\u003c/div>\u003cdiv class=\"e\">to be a hundred minus one day\u003c/div>\u003cdiv class=\"k\">백 살에서 하루를 뺀 날까지\u003c/div>\u003cdiv class=\"e\">so\u003c/div>\u003cdiv class=\"k\">그래서\u003c/div>\u003cdiv class=\"e\">I never have to live\u003c/div>\u003cdiv class=\"k\">나는 결코 살 필요가 없다\u003c/div>\u003cdiv class=\"e\">without you.\u003c/div>\u003cdiv class=\"k\">당신 없이\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">so (that)\u003c/b>에서 that이 생략된 형태로, 앞의 바람이 뒤 절의 목적이나 결과로 이어진다. 여기서는 당신보다 하루 먼저 살아서 당신 없이 사는 일이 없도록 하겠다는 목적을 나타낸다.\u003c/div>","segs":[{"n":63,"text":"If you live, 만약 당신이 산다면. to be a hundred, 백 살까지. I want to live, 나는 살고 싶다. to be a hundred minus one day, 백 살에서 하루를 뺀 날까지. so, 그래서. I never have to live, 나는 결코 살 필요가 없다. without you, 당신 없이","hl":"ch"},{"n":64,"text":"열한 번째 문장은 so 뒤에 목적이나 결과의 절이 이어지는 구문이에요. 여기서는 so that에서 that이 생략된 형태로 볼 수 있고, 당신 없이 살지 않기 위한 바람을 나타내죠. so I never have to live without you가 그 목적을 설명해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 If you live to be a hundred, I want to live to be a hundred minus one day \u003cspan class=\"fx\">so I never have to live without you\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>당신이 백 살까지 산다면 나는 백 살에서 하루를 뺀 날까지 살고 싶다는 뜻이다. 사랑하는 사람보다 하루만 먼저 세상을 떠나 당신 없이 사는 슬픔을 피하고 싶은 마음을 담고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so I never have to live without you\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so that I never have to live without you\u003c/span>\u003cdiv class=\"w\">목적을 나타내는 so that에서 that을 생략한 형태임을 분명히 한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I want to live to be a hundred minus one day\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">I would like to live one day less than a hundred years\u003c/span>\u003cdiv class=\"w\">숫자 표현을 풀어 자연스럽게 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">live to be a hundred\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">live to a hundred years old\u003c/span>\u003cspan class=\"y-eq\">live to be = live to\u003c/span>\u003cdiv class=\"w\">나이 도달 표현을 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">minus one day\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">one day less\u003c/span>\u003cspan class=\"y-eq\">minus = less\u003c/span>\u003cdiv class=\"w\">뺄셈 표현을 일상어로 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">never have to live without you\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">never need to live without you\u003c/span>\u003cspan class=\"y-eq\">have to = need to\u003c/span>\u003cdiv class=\"w\">필요의 의미로 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If you live to be a hundred, I would like to live one day less so that I never need to live without you.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 사랑하는 사람보다 하루만 먼저 살고 싶다는 애틋한 마음을 담고 있어요. 당신이 백 살까지 산다면 나는 하루 덜 살아서 당신 없이 사는 시간을 피하고 싶은 거죠. 그래서 슬프면서도 깊은 사랑이 느껴져요.","hl":"mn"},{"n":66,"text":"so I never have to live without you는 so that I never have to live without you로 바꿔 쓸 수 있어요. a hundred minus one day는 one day less than a hundred years처럼 풀어 쓸 수 있고요. that을 넣으면 목적이 더 분명해져요.","hl":"rw"},{"n":67,"text":"live to be a hundred는 live to a hundred years old로 바꿀 수 있어요. minus one day는 one day less로 바꿀 수 있고, have to는 need to로 바꿀 수 있죠. 숫자 표현을 말로 풀어 쓰는 연습도 중요해요.","hl":"ph"},{"n":68,"text":"전체 문장은 If you live to be a hundred, I would like to live one day less so that I never need to live without you.라고 바꿔 말할 수 있어요. 사랑하는 사람 없이 사는 시간을 피하고 싶다는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 When you are reading for study purposes, it is critical to read systematically, \u003cspan class=\"fx\">so you are able to integrate the new knowledge you acquire with what you already know\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">When you are reading\u003c/div>\u003cdiv class=\"k\">당신이 읽고 있을 때\u003c/div>\u003cdiv class=\"e\">for study purposes,\u003c/div>\u003cdiv class=\"k\">학습 목적으로\u003c/div>\u003cdiv class=\"e\">it is critical\u003c/div>\u003cdiv class=\"k\">그것은 중요하다\u003c/div>\u003cdiv class=\"e\">to read systematically,\u003c/div>\u003cdiv class=\"k\">체계적으로 읽는 것이\u003c/div>\u003cdiv class=\"e\">so\u003c/div>\u003cdiv class=\"k\">그래서\u003c/div>\u003cdiv class=\"e\">you are able to integrate\u003c/div>\u003cdiv class=\"k\">당신은 통합할 수 있다\u003c/div>\u003cdiv class=\"e\">the new knowledge you acquire\u003c/div>\u003cdiv class=\"k\">당신이 습득하는 새로운 지식을\u003c/div>\u003cdiv class=\"e\">with what you already know.\u003c/div>\u003cdiv class=\"k\">당신이 이미 알고 있는 것과\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">so (that)\u003c/b>에서 that이 생략된 형태로, 앞의 행동이 목적하는 바를 뒤 절로 연결한다. 여기서는 체계적으로 읽는 것이 새 지식과 기존 지식을 통합할 수 있게 하려는 목적임을 나타낸다.\u003c/div>","segs":[{"n":69,"text":"When you are reading, 당신이 읽고 있을 때. for study purposes, 학습 목적으로. it is critical, 그것은 중요하다. to read systematically, 체계적으로 읽는 것이. so, 그래서. you are able to integrate, 당신은 통합할 수 있다. the new knowledge you acquire, 당신이 습득하는 새로운 지식을. with what you already know, 당신이 이미 알고 있는 것과","hl":"ch"},{"n":70,"text":"열두 번째 문장은 so 뒤에 목적의 절이 이어지는 구문이에요. 학습 목적으로 읽을 때 체계적으로 읽어야 새 지식과 기존 지식을 통합할 수 있다는 뜻이죠. 여기서 so는 so that에서 that이 생략된 형태로 이해할 수 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 When you are reading for study purposes, it is critical to read systematically, \u003cspan class=\"fx\">so you are able to integrate the new knowledge you acquire with what you already know\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>학습 목적으로 읽을 때에는 새로 얻은 지식을 이미 알고 있는 것과 연결할 수 있도록 체계적으로 읽는 것이 중요하다는 뜻이다. 단순히 많이 읽는 것보다 조직적으로 읽어야 한다는 조언이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so you are able to integrate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so that you can integrate\u003c/span>\u003cdiv class=\"w\">생략된 that을 넣고 be able to를 can으로 간결하게 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">it is critical to read systematically\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">reading systematically is essential\u003c/span>\u003cdiv class=\"w\">가주어 구문을 동명사 주어로 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">critical\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">essential\u003c/span>\u003cspan class=\"y-eq\">critical = essential\u003c/span>\u003cdiv class=\"w\">중요성을 강조하는 형용사를 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">integrate A with B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">combine A with B\u003c/span>\u003cspan class=\"y-eq\">integrate = combine\u003c/span>\u003cdiv class=\"w\">통합의 의미를 쉬운 동사로 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">acquire\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">gain\u003c/span>\u003cspan class=\"y-eq\">acquire = gain\u003c/span>\u003cdiv class=\"w\">획득한다는 뜻을 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">When you read for study, it is essential to read systematically so that you can combine the new knowledge you gain with what you already know.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 공부할 때 읽는 방식이 중요하다는 조언을 담고 있어요. 새로 배운 내용을 이미 아는 내용과 연결하려면 체계적으로 읽어야 한다는 거죠. 그래서 무작정 읽기보다 정리하며 읽는 태도가 필요해요.","hl":"mn"},{"n":72,"text":"so you are able to integrate는 so that you can integrate로 바꿀 수 있어요. it is critical to read systematically는 reading systematically is essential로 바꿀 수 있고요. 가주어 구문을 동명사 주어로 바꾸는 전환은 시험에서 자주 나와요.","hl":"rw"},{"n":73,"text":"critical은 essential로 바꿀 수 있어요. integrate A with B는 combine A with B로 바꿀 수 있고, acquire는 gain으로 바꿀 수 있죠. 이런 유의어는 글의 핵심 조언을 정확히 잡게 해 줘요.","hl":"ph"},{"n":74,"text":"전체 문장은 When you read for study, it is essential to read systematically so that you can combine the new knowledge you gain with what you already know.라고 바꿔 말할 수 있어요. 체계적인 읽기가 지식의 연결을 가능하게 한다는 뜻이에요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">목적·결과를 나타내는 so that과 so·such 결과 구문\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">so that\u003c/b>은 목적이나 결과를 나타내는 절을 이끈다.\u003c/li>\u003cli>\u003cb class=\"key\">so + 형용사/부사 + that\u003c/b>은 '너무 ~해서 ...하다'라는 정도와 결과를 나타낸다.\u003c/li>\u003cli>\u003cb class=\"key\">such + (형용사) + 명사 + that\u003c/b>은 명사구의 정도가 커서 생기는 결과를 나타낸다.\u003c/li>\u003cli>\u003cb class=\"key\">so (that)\u003c/b>에서 that이 생략되면 so만으로 목적이나 결과를 연결할 수 있다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 so that과 so that 결과 구문, 그리고 so와 such가 만드는 that 구문을 배웠어요. 목적을 말할 때는 so that을, 정도와 결과를 말할 때는 so 형용사 that이나 such 명사 that을 떠올리면 됩니다. that이 생략된 so도 목적이나 결과를 이어 줄 수 있다는 점을 기억해요. 오늘 배운 표현을 문장에서 직접 찾아보며 복습해 보세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
