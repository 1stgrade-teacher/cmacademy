    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

lecturePlayer(document.getElementById("app"),{"brand":"Unit 38 목적 · 결과의 부사절","title":"고등 영문법 마스터: 목적과 결과를 나타내는 부사절","audioDir":"preview_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 8 Unit 38 목적 · 결과의 부사절\u003c/div>\u003ch1>고등 영문법 마스터: 목적과 결과를 나타내는 부사절\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>so that과 such that을 활용하여 목적과 결과를 정확하게 표현할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 부사절 중에서 아주 자주 쓰이는 목적과 결과의 표현을 공부할 거예요. 독해와 서술형 시험에서 단골로 나오는 부분이니까 집중해서 잘 들어 보세요. 끝까지 함께하면서 확실하게 내 것으로 만들어 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 2\u003c/span>\u003ch2 class=\"g-h\">목적의 부사절: so that ... can/may/will\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주절의 동작이 일어난 \u003cb class=\"key\">목적\u003c/b>을 나타낼 때 \u003cb class=\"key\">so that + 주어 + can/may/will\u003c/b> 구문을 사용하며, ~하기 위해서라고 해석합니다. 이는 in order that과 같은 뜻이며 조동사를 함께 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">주절 + so that + 주어 + can/may/will + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I saved money \u003cspan class=\"fx\">so that I could buy a bike\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 자전거를 사기 위해 돈을 모았다.\u003c/div>\u003cdiv class=\"g-note\">목적을 나타내는 so that 구문과 조동사 could의 사용\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>구어체에서는 \u003cb class=\"key\">that\u003c/b>을 생략하여 so만 쓸 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념은 목적을 나타내는 부사절이에요. 어떤 행동을 한 목적이 무엇인지 말할 때 so that 주어 조동사 형태로 쓰며 ~하기 위해서라고 해석하죠. 이때 조동사 can이나 may, will을 반드시 함께 쓴다는 점을 꼭 기억해 두세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 볼게요. I saved money so that I could buy a bike라고 하면, 나는 자전거를 사기 위해 돈을 모았다라는 뜻이에요. 돈을 모은 목적이 자전거를 사기 위해서라는 걸 잘 보여주고 있죠.","hl":"ex-0"},{"n":4,"text":"잠깐 팁을 줄게요. 말하기나 일상 대화인 구어체에서는 that을 생략하고 so만 쓰기도 한답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 2\u003c/span>\u003ch2 class=\"g-h\">결과의 부사절: 쉼표가 있는 so that과 so/such that\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">문장 끝에 \u003cb class=\"key\">쉼표(,)가 있는 so that\u003c/b>은 그리고 그래서 ~하다라는 \u003cb class=\"key\">결과\u003c/b>를 나타냅니다. 또한 \u003cb class=\"key\">so + 형용사/부사 + that\u003c/b>과 \u003cb class=\"key\">such + 명사 + that\u003c/b>은 너무 ~해서 ...하다라는 의미의 결과 구문입니다.\u003cdiv>\u003cspan class=\"g-formula\">, so that ~ / so + 형용사/부사 + that / such + a/an + 형용사 + 명사 + that\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He spoke slowly, \u003cspan class=\"fx\">so that we understood him\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 천천히 말했고 그래서 우리는 그를 이해했다.\u003c/div>\u003cdiv class=\"g-note\">쉼표 뒤에 쓰여 결과를 나타내는 so that\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The box was \u003cspan class=\"fx\">so heavy that I couldn't lift it\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">상자가 너무 무거워서 나는 들 수 없었다.\u003c/div>\u003cdiv class=\"g-note\">so 형용사 that 구문\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">It was \u003cspan class=\"fx\">such a good movie that I watched it twice\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">아주 좋은 영화여서 나는 두 번 봤다.\u003c/div>\u003cdiv class=\"g-note\">such 명사 that 구문\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>명사가 수식받는 경우 \u003cb class=\"key\">such\u003c/b>를 쓰고, 형용사나 부사만 올 때는 \u003cb class=\"key\">so\u003c/b>를 씁니다.\u003c/div>","segs":[{"n":5,"text":"두 번째 개념은 결과를 나타내는 표현들이에요. so 앞에 쉼표가 오면 그래서 ~하다라는 결과로 해석하고, so 형용사나 부사 that 혹은 such 명사 that을 쓰면 너무 ~해서 ...하다라는 결과를 나타내요. 명사가 있을 때는 such를 쓴다는 것도 잊지 마세요.","hl":"rule"},{"n":6,"text":"첫 번째 예문을 들어볼게요. He spoke slowly, so that we understood him은 그는 천천히 말했고 그래서 우리는 그를 이해했다라는 뜻이에요. 쉼표 뒤에 so that이 오면 결과로 해석한다는 것을 기억하세요.","hl":"ex-0"},{"n":7,"text":"두 번째 예문이에요. The box was so heavy that I couldn't lift it은 상자가 너무 무거워서 나는 들 수 없었다라는 뜻이에요. so와 that 사이에 형용사 heavy가 쓰였죠.","hl":"ex-1"},{"n":8,"text":"세 번째 예문을 보죠. It was such a good movie that I watched it twice는 아주 좋은 영화여서 나는 두 번 봤다라는 뜻이에요. 여기서는 good movie라는 명사구가 있어서 such를 썼어요.","hl":"ex-2"},{"n":9,"text":"주의할 점은 명사가 포함되어 있으면 such를 쓰고 형용사나 부사만 있으면 so를 써야 한다는 거예요. 시험에 자주 나오니 꼭 구분해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The box was such heavy that I couldn't lift it.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The box was so heavy that I couldn't lift it.\u003c/div>\u003cdiv class=\"g-why\">heavy는 형용사이므로 such가 아니라 so를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>It was so good movie that I watched it twice.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ It was such a good movie that I watched it twice.\u003c/div>\u003cdiv class=\"g-why\">movie라는 명사가 있으므로 so가 아니라 such a를 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":10,"text":"첫 번째 자주 하는 실수를 볼게요. The box was such heavy that I couldn't lift it이라고 쓰면 틀려요. heavy는 형용사이므로 such가 아니라 so를 써야 올바른 문장이 돼요.","hl":"mk-0"},{"n":11,"text":"두 번째 실수예요. It was so good movie that라고 하면 안 돼요. movie라는 명사가 뒤에 있으므로 so가 아니라 such a를 써야 맞는 표현이랍니다.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">I saved money ____ I could buy a bike.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>so that\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>such that\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>because\u003c/button>\u003cbutton class=\"g-opt\">\u hl":"q"},{"n":22,"text":"","hl":"q","pause":6},{"n":23,"text":"정답은 두 번째 보기인 such예요. 뒤에 명사구가 있으므로 such a 명사 that 구문을 써야 하기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 어법상 틀린 부분을 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"g-qs\">Speak clearly so everyone can hear you.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">오류 없음\u003c/span>\u003cdiv class=\"g-exp\">so that에서 that이 생략된 문장으로 어법상 올바릅니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"다섯 번째 문제입니다. Speak clearly so everyone can hear you라는 문장에 어법상 틀린 곳이 있는지 확인해 보세요. 잠시 생각하고 풀어보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 오류 없음이에요. 구어체에서는 so that에서 that을 생략할 수 있으므로 이 문장은 아주 올바른 문장이랍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말 뜻에 맞게 보기의 단어를 바르게 배열하시오. (그녀는 너무 피곤해서 일찍 잠자리에 들었다.)\u003c/div>\u003cdiv class=\"g-qs\">She was so tired that she went to bed early.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>tired\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>that\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>she\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>so\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">She was so tired that she went to bed early.\u003c/span>\u003cdiv class=\"g-exp\">so 형용사 that 구문을 사용하여 그녀가 너무 피곤해서 일찍 잠자리에 들었다는 결과를 나타냅니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"마지막 여섯 번째 문제입니다. 주어진 우리말 뜻에 맞게 so와 형용사, that을 활용해서 문장을 완성해 보세요. 잠시 멈추고 직접 배열해 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":6},{"n":29,"text":"정답은 She was so tired that she went to bed early예요. so 형용사 that 구문을 정확히 활용한 문장이죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 8 Unit 38 목적 · 결과의 부사절\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>목적을 나타낼 때는 \u003cb class=\"key\">so that + 주어 + can/may/will\u003c/b>을 사용합니다.\u003c/li>\u003cli>쉼표 뒤의 \u003cb class=\"key\">so that\u003c/b>과 \u003cb class=\"key\">so/such + 형용사/부사/명사 + that\u003c/b>은 결과를 나타냅니다.\u003c/li>\u003c/ul>","segs":[{"n":30,"text":"오늘 우리는 목적과 결과를 나타내는 부사절을 공부했어요. so that이 목적을 나타낼 때와 결과를 나타낼 때의 차이를 잘 정리해 두세요. 오늘 배운 내용을 바탕으로 복습도 꼭 하고 다음 시간에 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
