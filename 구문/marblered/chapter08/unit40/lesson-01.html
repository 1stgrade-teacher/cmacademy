lecturePlayer(document.getElementById("app"),{"brand":"unit40","title":"as 하나로 비교와 가정을 꿰뚫는 구문 특강","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">as / as if / as though / just as ~ so 비교·가정 구문\u003c/div>\u003ch1>as 하나로 비교와 가정을 꿰뚫는 구문 특강\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>as 계열 표현이 만드는 비교와 가정의 뼈대를 익혀 긴 문장을 정확히 읽고 바꿔 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘도 함께 영어 구문을 정복해 볼까요? 오늘은 as가 들어간 비교 표현을 한 묶음으로 배웁니다. as, as if, as though, just as가 문장 속에서 어떤 짝을 이루는지 차근차근 살펴볼 거예요. 이 표현들을 잡으면 긴 문장의 뼈대가 훨씬 또렷하게 보일 겁니다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">as / as if / as though / just as ~ so 비교·가정 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">\u003cb class=\"key\">as\u003c/b>는 두 대상의 방식이나 정도를 '~하는 것처럼, ~대로'로 비교하는 접속사입니다. \u003cb class=\"key\">as if\u003c/b>와 \u003cb class=\"key\">as though\u003c/b>는 '마치 ~인 것처럼'의 가정적 비교를 만들고, \u003cb class=\"key\">just as A, so B\u003c/b>는 'A가 ~하듯이 B도 또한 ~하다'의 대응 구조를 만듭니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 A mind needs books \u003cspan class=\"fx\">as a sword needs a whetstone\u003c/span>, if it is to keep its edge.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 Most textbooks are written \u003cspan class=\"fx\">as if science is a set of truths to be memorized\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 The horse-drawn carriage was itself a technological innovation, \u003cspan class=\"fx\">as were the horseless carriage and later automobiles\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 \u003cspan class=\"fx\">Just as a flesh-and-blood beast influences and is influenced by its environment, so too do science and society mutually influence one another\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Live \u003cspan class=\"fx\">as though you intend to live forever, and work as though your strength were limitless\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 We need to see people \u003cspan class=\"fx\">as they are, not as we would like them to be\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07  \u003cspan class=\"fx\">Just as darkness comes at the end of each day, so also comes the dawn to spread light across the land.\u003c/span> Just as plants must die at the end of their life cycle, the seeds they have produced will emerge as new plants in the spring.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Act \u003cspan class=\"fx\">as if what you do makes a difference\u003c/span>. It does.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 Even when you feel \u003cspan class=\"fx\">as though there isn't a lot you can do to change unhappiness or problems\u003c/span>, you can always do a little—and a little at a time eventually makes a big difference.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">As there are differing tastes and preferences among different peoples and regions of the world, so do tastes and preferences evolve over the course of centuries\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 We usually take for granted our ability to produce and understand speech, \u003cspan class=\"fx\">just as we are not particularly aware of the action of our hearts, brains, or other essential organs\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Once you have listened to the gossip for some time, \u003cspan class=\"fx\">you will soon feel as if you know everyone\u003c/span>, even if you have never met them.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘의 핵심은 as가 혼자 쓰일 때와 다른 말과 붙을 때의 차이를 구분하는 거예요. as는 두 장면을 나란히 놓고 방식이나 정도를 비교할 때 쓰고, as if와 as though는 사실이 아닐 수도 있는 상황을 마치 그런 것처럼 말할 때 씁니다. just as가 앞에서 시작되면 so가 뒤에서 짝을 이루며 또한 그렇다는 뜻을 만들어요. 이 뼈대를 잡으면 문장이 길어져도 비교 대상과 결론이 보입니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 A mind needs books \u003cspan class=\"fx\">as a sword needs a whetstone\u003c/span>, if it is to keep its edge.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A mind \u003c/div>\u003cdiv class=\"k\">정신은\u003c/div>\u003cdiv class=\"e\">needs books \u003c/div>\u003cdiv class=\"k\">책을 필요로 한다\u003c/div>\u003cdiv class=\"e\">as a sword \u003c/div>\u003cdiv class=\"k\">칼이\u003c/div>\u003cdiv class=\"e\">needs a whetstone, \u003c/div>\u003cdiv class=\"k\">숫돌을 필요로 하는 것처럼\u003c/div>\u003cdiv class=\"e\">if it is to keep its edge.\u003c/div>\u003cdiv class=\"k\">만약 그것이 날을 유지하려면\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as\u003c/b>는 '~하는 것처럼'의 비교 접속사로, 앞의 A mind needs books와 뒤의 a sword needs a whetstone을 방식 면에서 연결합니다. 뒤의 if it is to keep its edge는 '날을 유지하려면'이라는 조건을 더해 줍니다.\u003c/div>","segs":[{"n":3,"text":"A mind, 정신은. needs books, 책을 필요로 한다. as a sword, 칼이. needs a whetstone, 숫돌을 필요로 하는 것처럼. if it is to keep its edge, 만약 그것이 날을 유지하려면","hl":"ch"},{"n":4,"text":"첫 번째 문장에서는 as가 두 장면을 나란히 비교합니다. 정신이 책을 필요로 하는 것과 칼이 숫돌을 필요로 하는 것을 같은 방식으로 연결하죠. 뒤에 붙은 if it is to keep its edge는 날을 유지하려면이라는 조건을 더해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 A mind needs books \u003cspan class=\"fx\">as a sword needs a whetstone\u003c/span>, if it is to keep its edge.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>정신이 책을 필요로 하는 이유를 칼과 숫돌의 관계에 빗대어 설명합니다. 칼이 날을 세우려면 숫돌이 필요하듯, 정신도 예리함을 유지하려면 책이 필요하다는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as a sword needs a whetstone\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the way a sword needs a whetstone\u003c/span>\u003cdiv class=\"w\">as를 the way로 바꾸어 비교의 의미를 더 일상적으로 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">if it is to keep its edge\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">if it is to stay sharp\u003c/span>\u003cdiv class=\"w\">keep its edge를 stay sharp로 바꾸어 같은 뜻을 쉽게 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">needs\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">requires\u003c/span>\u003cspan class=\"y-eq\">need = require\u003c/span>\u003cdiv class=\"w\">일반 동사 need를 더 격식 있는 require로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">keep its edge\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stay sharp\u003c/span>\u003cspan class=\"y-eq\">keep an edge = stay sharp\u003c/span>\u003cdiv class=\"w\">날이 서 있다는 표현을 형용사 sharp로 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whetstone\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">sharpening stone\u003c/span>\u003cspan class=\"y-eq\">whetstone = sharpening stone\u003c/span>\u003cdiv class=\"w\">숫돌을 뜻을 드러내는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A mind needs books the way a sword needs a whetstone if it is to stay sharp.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 책이 정신을 예리하게 만든다는 생각을 칼에 빗대어 말합니다. 칼도 날이 무디면 숫돌이 필요하듯, 정신도 계속 날카롭게 살아 있으려면 책이 필요하다는 거예요. 그래서 책을 단순한 정보가 아니라 정신을 벼리는 도구로 보게 합니다.","hl":"mn"},{"n":6,"text":"as a sword needs a whetstone은 the way a sword needs a whetstone으로 바꿔도 자연스럽습니다. 또 keep its edge는 stay sharp로 바꾸면 학생들이 뜻을 더 쉽게 잡을 수 있어요. 둘 다 비교와 조건의 핵심은 그대로 유지합니다.","hl":"rw"},{"n":7,"text":"needs는 requires로 바꿀 수 있고, whetstone은 sharpening stone이라고 풀어 말할 수 있습니다. keep its edge는 stay sharp로 바꾸면 날카로움을 유지한다는 뜻이 분명해집니다. 시험에서는 require나 sharpening stone 같은 동의 표현이 자주 나오니 같이 기억해 두세요.","hl":"ph"},{"n":8,"text":"전체 뜻을 바꾸면 A mind needs books the way a sword needs a whetstone if it is to stay sharp가 됩니다. 정신이 책을 필요로 하는 것을 칼이 숫돌을 필요로 하는 방식에 빗댄 문장이에요. 비교의 뼈대는 그대로 살아 있습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 Most textbooks are written \u003cspan class=\"fx\">as if science is a set of truths to be memorized\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Most textbooks \u003c/div>\u003cdiv class=\"k\">대부분의 교과서는\u003c/div>\u003cdiv class=\"e\">are written \u003c/div>\u003cdiv class=\"k\">쓰여 있다\u003c/div>\u003cdiv class=\"e\">as if \u003c/div>\u003cdiv class=\"k\">마치 ~인 것처럼\u003c/div>\u003cdiv class=\"e\">science is a set of truths \u003c/div>\u003cdiv class=\"k\">과학이 일련의 사실들이다\u003c/div>\u003cdiv class=\"e\">to be memorized.\u003c/div>\u003cdiv class=\"k\">암기되어야 할\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as if\u003c/b>는 '마치 ~인 것처럼'이라는 가정적 비교를 나타내며, are written이라는 수동태 동사를 꾸며 science is a set of truths라는 내용을 이끕니다. to be memorized는 truths를 뒤에서 수식하는 to부정사 수동형입니다.\u003c/div>","segs":[{"n":9,"text":"Most textbooks, 대부분의 교과서는. are written, 쓰여 있다. as if, 마치 ~인 것처럼. science is a set of truths, 과학이 일련의 사실들이다. to be memorized, 암기되어야 할","hl":"ch"},{"n":10,"text":"두 번째 문장에서는 as if가 are written 뒤에서 마치 그런 것처럼이라는 가정을 만듭니다. science is a set of truths to be memorized가 그 가정의 내용이고, to be memorized는 truths를 꾸며 줍니다. 즉 과학이 암기 대상인 사실들의 묶음이라는 인상을 준다는 구조예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 Most textbooks are written \u003cspan class=\"fx\">as if science is a set of truths to be memorized\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>교과서가 과학을 이미 정해진 사실의 목록처럼 제시한다는 비판적 의미입니다. 그래서 과학이 외워야 할 지식이라는 인상을 줄 수 있다는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as if science is a set of truths to be memorized\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as though science is a list of facts to memorize\u003c/span>\u003cdiv class=\"w\">as if를 as though로 바꾸고 set of truths를 list of facts로 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a set of truths to be memorized\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a body of facts to memorize\u003c/span>\u003cdiv class=\"w\">set of truths를 body of facts로 바꾸어 같은 뜻을 더 자연스럽게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as if\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as though\u003c/span>\u003cspan class=\"y-eq\">as if = as though\u003c/span>\u003cdiv class=\"w\">가정적 비교를 나타내는 접속사 표현을 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a set of truths\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a body of facts\u003c/span>\u003cspan class=\"y-eq\">set of truths = body of facts\u003c/span>\u003cdiv class=\"w\">진리들의 집합이라는 표현을 사실들의 묶음으로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to be memorized\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to learn by heart\u003c/span>\u003cspan class=\"y-eq\">memorize = learn by heart\u003c/span>\u003cdiv class=\"w\">암기하다라는 뜻을 영어 관용 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Most textbooks are written as though science is a list of facts to memorize.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 교과서가 과학을 이미 정답이 정해진 사실 목록처럼 보여 준다고 말합니다. 그래서 학생들이 과학을 탐구 대상이 아니라 외워야 할 지식으로 받아들일 수 있다는 비판이 담겨 있어요. 과학의 본질은 질문과 검증인데 교과서가 그것을 단순 암기처럼 만들 수 있다는 뜻입니다.","hl":"mn"},{"n":12,"text":"as if science is a set of truths to be memorized는 as though science is a list of facts to memorize로 바꿀 수 있습니다. as if와 as though는 거의 같은 뜻이고, list of facts는 학생들이 더 쉽게 이해하는 표현이에요. 문장의 비판적 어조는 그대로 살아 있습니다.","hl":"rw"},{"n":13,"text":"as if는 as though로 바꿀 수 있고, a set of truths는 a body of facts로 풀 수 있습니다. to be memorized는 to learn by heart와 연결해서 기억해 두세요. 시험에서는 memorize의 동의 표현으로 learn by heart가 자주 등장합니다.","hl":"ph"},{"n":14,"text":"전체 문장은 Most textbooks are written as though science is a list of facts to memorize로 바꿀 수 있어요. 교과서가 과학을 암기용 사실 목록처럼 쓴다는 뜻은 그대로입니다. as though를 써도 가정의 느낌은 유지됩니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 The horse-drawn carriage was itself a technological innovation, \u003cspan class=\"fx\">as were the horseless carriage and later automobiles\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The horse-drawn carriage \u003c/div>\u003cdiv class=\"k\">말이 끄는 마차는\u003c/div>\u003cdiv class=\"e\">was itself \u003c/div>\u003cdiv class=\"k\">그 자체로\u003c/div>\u003cdiv class=\"e\">a technological innovation, \u003c/div>\u003cdiv class=\"k\">기술적 혁신이었다\u003c/div>\u003cdiv class=\"e\">as were \u003c/div>\u003cdiv class=\"k\">~도 그랬다\u003c/div>\u003cdiv class=\"e\">the horseless carriage \u003c/div>\u003cdiv class=\"k\">말이 없는 마차도\u003c/div>\u003cdiv class=\"e\">and later automobiles.\u003c/div>\u003cdiv class=\"k\">그리고 나중의 자동차도\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as were\u003c/b>는 앞 문장의 was itself a technological innovation을 뒤 주어에 연결하는 도치 비교 표현입니다. the horseless carriage and later automobiles were also a technological innovation의 뜻을 간결하게 만든 구조입니다.\u003c/div>","segs":[{"n":15,"text":"The horse-drawn carriage, 말이 끄는 마차는. was itself, 그 자체로. a technological innovation, 기술적 혁신이었다. as were, ~도 그랬다. the horseless carriage, 말이 없는 마차도. and later automobiles, 그리고 나중의 자동차도","hl":"ch"},{"n":16,"text":"세 번째 문장의 핵심은 as were입니다. 앞에서 마차가 기술 혁신이라고 말한 뒤, as were를 사용해 말이 없는 마차와 나중의 자동차도 마찬가지였다고 이어 줍니다. were가 앞의 was a technological innovation을 대신 받는 구조예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 The horse-drawn carriage was itself a technological innovation, \u003cspan class=\"fx\">as were the horseless carriage and later automobiles\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>마차뿐 아니라 그 뒤의 자동차들도 기술 혁신이었다는 점을 강조합니다. 역사 속 발명품이 서로 다른 시대에 이어서 혁신적이었다는 의미입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as were the horseless carriage and later automobiles\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">and so were the horseless carriage and later automobiles\u003c/span>\u003cdiv class=\"w\">as were를 and so were로 바꾸어 앞 내용에 동의하며 추가하는 느낌을 살렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">was itself a technological innovation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">was in itself a technological innovation\u003c/span>\u003cdiv class=\"w\">itself를 in itself로 바꾸어 그 자체로라는 의미를 더 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">horse-drawn carriage\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">carriage pulled by horses\u003c/span>\u003cspan class=\"y-eq\">horse-drawn = pulled by horses\u003c/span>\u003cdiv class=\"w\">합성어 horse-drawn을 풀어서 설명했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">technological innovation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">technological breakthrough\u003c/span>\u003cspan class=\"y-eq\">innovation = breakthrough\u003c/span>\u003cdiv class=\"w\">혁신을 돌파구라는 뉘앙스로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">later automobiles\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">automobiles that came later\u003c/span>\u003cspan class=\"y-eq\">later = that came later\u003c/span>\u003cdiv class=\"w\">later를 관계절로 풀어 시간적 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The horse-drawn carriage was itself a technological innovation, just like the horseless carriage and automobiles that came later.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 말이 끄는 마차만 혁신이 아니라 그다음에 나온 자동차들도 혁신이었다고 말합니다. 기술의 발전이 한 시대에 갑자기 끝난 것이 아니라 계속 이어졌다는 뜻이에요. 그래서 과거의 발명도 당시에는 놀라운 혁신이었음을 강조합니다.","hl":"mn"},{"n":18,"text":"as were the horseless carriage and later automobiles는 and so were the horseless carriage and later automobiles로 바꿀 수 있습니다. was itself는 was in itself로 바꾸면 그 자체로라는 의미가 더 또렷해져요. 두 표현 모두 앞 내용에 다른 대상도 포함한다는 핵심을 유지합니다.","hl":"rw"},{"n":19,"text":"horse-drawn carriage는 carriage pulled by horses로 풀 수 있고, technological innovation은 technological breakthrough로 바꿀 수 있습니다. later automobiles는 automobiles that came later라고 풀면 시간 관계가 분명해집니다. 이런 동의 표현은 독해와 어휘 문제에서 모두 유용합니다.","hl":"ph"},{"n":20,"text":"전체를 바꾸면 The horse-drawn carriage was itself a technological innovation, just like the horseless carriage and automobiles that came later가 됩니다. 마차와 이후 자동차가 모두 기술 혁신이었다는 뜻이에요. just like를 써도 as were의 비교 의미가 잘 살아납니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 \u003cspan class=\"fx\">Just as a flesh-and-blood beast influences and is influenced by its environment, so too do science and society mutually influence one another\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Just as \u003c/div>\u003cdiv class=\"k\">꼭 ~하는 것처럼\u003c/div>\u003cdiv class=\"e\">a flesh-and-blood beast \u003c/div>\u003cdiv class=\"k\">살아 있는 짐승은\u003c/div>\u003cdiv class=\"e\">influences and is influenced by \u003c/div>\u003cdiv class=\"k\">영향을 주고 영향을 받는다\u003c/div>\u003cdiv class=\"e\">its environment, \u003c/div>\u003cdiv class=\"k\">그 환경에 의해\u003c/div>\u003cdiv class=\"e\">so too do \u003c/div>\u003cdiv class=\"k\">또한 그렇다\u003c/div>\u003cdiv class=\"e\">science and society \u003c/div>\u003cdiv class=\"k\">과학과 사회는\u003c/div>\u003cdiv class=\"e\">mutually influence one another.\u003c/div>\u003cdiv class=\"k\">서로에게 상호 영향을 미친다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Just as A, so B\u003c/b>는 'A가 ~하듯이 B도 또한 ~하다'라는 대응 비교 구문입니다. so too do는 B 부분에서 동사를 도치해 'B도 마찬가지로 그렇게 한다'는 뜻을 강조합니다.\u003c/div>","segs":[{"n":21,"text":"Just as, 꼭 ~하는 것처럼. a flesh-and-blood beast, 살아 있는 짐승은. influences and is influenced by, 영향을 주고 영향을 받는다. its environment, 그 환경에 의해. so too do, 또한 그렇다. science and society, 과학과 사회는. mutually influence one another, 서로에게 상호 영향을 미친다","hl":"ch"},{"n":22,"text":"네 번째 문장은 just as와 so too가 짝을 이루는 대표적인 대응 비교 구문입니다. 앞에서는 살아 있는 짐승이 환경에 영향을 주고받는다고 말하고, 뒤에서는 과학과 사회도 서로 영향을 주고받는다고 이어 갑니다. so too do에서 do가 뒤의 동사구를 받쳐 주는 점도 눈여겨보세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 \u003cspan class=\"fx\">Just as a flesh-and-blood beast influences and is influenced by its environment, so too do science and society mutually influence one another\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>살아 있는 짐승과 환경의 상호 작용을 과학과 사회의 관계에 빗댑니다. 과학도 사회에 영향을 주고, 사회도 과학에 영향을 준다는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Just as a flesh-and-blood beast influences and is influenced by its environment\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">In the same way that a living beast affects and is affected by its environment\u003c/span>\u003cdiv class=\"w\">Just as를 In the same way that으로 풀고 flesh-and-blood를 living으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">mutually influence one another\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">influence each other\u003c/span>\u003cdiv class=\"w\">mutually와 one another를 each other로 간결하게 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">flesh-and-blood\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">living\u003c/span>\u003cspan class=\"y-eq\">flesh-and-blood = living\u003c/span>\u003cdiv class=\"w\">살과 피가 있다는 표현을 살아 있는이라는 뜻으로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">influences\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">affects\u003c/span>\u003cspan class=\"y-eq\">influence = affect\u003c/span>\u003cdiv class=\"w\">영향을 준다는 동사를 더 직접적인 affect로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">mutually\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">each other\u003c/span>\u003cspan class=\"y-eq\">mutually = each other\u003c/span>\u003cdiv class=\"w\">상호적으로라는 부사를 서로라는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">In the same way that a living beast affects and is affected by its environment, science and society also affect each other.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 짐승과 환경의 관계를 과학과 사회의 관계에 빗댑니다. 짐승이 환경을 바꾸고 환경도 짐승을 바꾸듯, 과학과 사회도 서로를 계속 바꾼다는 뜻이에요. 어느 한쪽만 일방적으로 영향을 준다고 보지 않는 시각이 담겨 있습니다.","hl":"mn"},{"n":24,"text":"just as는 in the same way that으로 바꿀 수 있고, flesh-and-blood beast는 living beast로 풀 수 있습니다. mutually influence one another는 influence each other로 간결하게 바꿔도 뜻이 통합니다. 시험에서는 mutually와 each other의 연결을 자주 확인합니다.","hl":"rw"},{"n":25,"text":"flesh-and-blood는 living으로, influences는 affects로 바꿀 수 있습니다. mutually는 each other와 연결해서 상호적이라는 의미를 기억해 두세요. influence와 affect는 둘 다 영향을 주다라는 뜻이지만 affect가 조금 더 직접적인 느낌을 줍니다.","hl":"ph"},{"n":26,"text":"전체 문장은 In the same way that a living beast affects and is affected by its environment, science and society also affect each other로 바꿀 수 있습니다. 살아 있는 짐승과 환경의 상호 작용을 과학과 사회에 빗댄 뜻은 그대로예요. also와 each other를 사용해 대응과 상호성을 살렸습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Live \u003cspan class=\"fx\">as though you intend to live forever, and work as though your strength were limitless\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Live \u003c/div>\u003cdiv class=\"k\">살아라\u003c/div>\u003cdiv class=\"e\">as though \u003c/div>\u003cdiv class=\"k\">마치 ~인 것처럼\u003c/div>\u003cdiv class=\"e\">you intend to live forever, \u003c/div>\u003cdiv class=\"k\">당신이 영원히 살고자 한다면\u003c/div>\u003cdiv class=\"e\">and work \u003c/div>\u003cdiv class=\"k\">그리고 일하라\u003c/div>\u003cdiv class=\"e\">as though \u003c/div>\u003cdiv class=\"k\">마치 ~인 것처럼\u003c/div>\u003cdiv class=\"e\">your strength were limitless.\u003c/div>\u003cdiv class=\"k\">당신의 힘이 무한하다면\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as though\u003c/b>는 '마치 ~인 것처럼'의 가정 비교 접속사로, Live와 work라는 명령문의 방식을 설명합니다. 두 번째 as though 뒤에는 were가 쓰여 사실과 다른 가정의 느낌을 살립니다.\u003c/div>","segs":[{"n":27,"text":"Live, 살아라. as though, 마치 ~인 것처럼. you intend to live forever, 당신이 영원히 살고자 한다면. and work, 그리고 일하라. as though, 마치 ~인 것처럼. your strength were limitless, 당신의 힘이 무한하다면","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 명령문 Live와 work 뒤에 as though가 붙어 행동의 방식을 설명합니다. as though는 as if와 같은 뜻으로 마치 그런 것처럼이라는 가정을 만들어요. 두 번째 as though 뒤의 were는 현실과 다른 가정을 살리는 표현입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Live \u003cspan class=\"fx\">as though you intend to live forever, and work as though your strength were limitless\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>영원히 살 것처럼, 힘이 무한한 것처럼 행동하라는 권유입니다. 현실의 한계에 지나치게 매이지 말고 크게 꿈꾸며 살라는 의미입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as though you intend to live forever\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as if you intend to live forever\u003c/span>\u003cdiv class=\"w\">as though를 as if로 바꾸어 같은 가정 비교를 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">your strength were limitless\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">your strength had no limits\u003c/span>\u003cdiv class=\"w\">limitless를 had no limits로 풀어 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">intend to live\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">plan to live\u003c/span>\u003cspan class=\"y-eq\">intend = plan\u003c/span>\u003cdiv class=\"w\">의도하다라는 뜻을 계획하다로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">limitless\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">unlimited\u003c/span>\u003cspan class=\"y-eq\">limitless = unlimited\u003c/span>\u003cdiv class=\"w\">한계가 없다는 형용사를 동의 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as though\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as if\u003c/span>\u003cspan class=\"y-eq\">as though = as if\u003c/span>\u003cdiv class=\"w\">가정 비교 접속사를 같은 뜻의 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Live as if you plan to live forever, and work as if your strength had no limits.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 영원히 살 것처럼 살고, 힘이 무한한 것처럼 일하라고 권합니다. 현실의 한계를 지나치게 의식하지 말고 큰 가능성을 믿으며 살라는 격려예요. 다만 무모하라는 뜻이라기보다 태도의 크기를 강조하는 표현입니다.","hl":"mn"},{"n":30,"text":"as though는 as if로 바꿀 수 있습니다. limitless는 had no limits로 풀면 학생들이 뜻을 더 쉽게 잡을 수 있어요. 두 표현 모두 한계가 없다는 가정의 느낌을 유지합니다.","hl":"rw"},{"n":31,"text":"intend to live는 plan to live로 바꿀 수 있고, limitless는 unlimited와 같은 뜻입니다. as though는 as if로 바꿔도 자연스럽습니다. 시험에서는 as though와 as if를 같은 의미로 묶어 묻는 경우가 많아요.","hl":"ph"},{"n":32,"text":"전체를 바꾸면 Live as if you plan to live forever, and work as if your strength had no limits가 됩니다. 영원히 살 것처럼 살고 힘이 무한한 것처럼 일하라는 뜻은 그대로예요. as if와 had no limits를 써도 가정의 분위기가 잘 살아납니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 We need to see people \u003cspan class=\"fx\">as they are, not as we would like them to be\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We need to see people \u003c/div>\u003cdiv class=\"k\">우리는 사람들을 볼 필요가 있다\u003c/div>\u003cdiv class=\"e\">as they are, \u003c/div>\u003cdiv class=\"k\">있는 그대로\u003c/div>\u003cdiv class=\"e\">not as \u003c/div>\u003cdiv class=\"k\">~가 아니라\u003c/div>\u003cdiv class=\"e\">we would like them to be.\u003c/div>\u003cdiv class=\"k\">우리가 그들이 되길 바라는 대로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as they are\u003c/b>는 '그들이 실제로 있는 그대로'라는 뜻의 as절이고, \u003cb class=\"key\">not as we would like them to be\u003c/b>와 대조를 이룹니다. as는 여기서 '~한 방식대로, ~한 그대로'의 의미입니다.\u003c/div>","segs":[{"n":33,"text":"We need to see people, 우리는 사람들을 볼 필요가 있다. as they are, 있는 그대로. not as, ~가 아니라. we would like them to be, 우리가 그들이 되길 바라는 대로","hl":"ch"},{"n":34,"text":"여섯 번째 문장은 as they are와 not as we would like them to be가 대조를 이룹니다. as they are는 있는 그대로라는 뜻이고, 뒤의 as절은 우리가 바라는 모습을 나타내요. see people 뒤에 두 as절이 붙어 어떤 시각으로 사람을 볼지 설명합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 We need to see people \u003cspan class=\"fx\">as they are, not as we would like them to be\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사람을 이상화하거나 바꾸려 하지 말고 현실의 모습 그대로 받아들이라는 뜻입니다. 상대에게 우리가 원하는 모습을 강요하지 말자는 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as they are\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the way they really are\u003c/span>\u003cdiv class=\"w\">as they are를 the way they really are로 풀어 실제 모습이라는 뜻을 강조했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not as we would like them to be\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">not the way we wish they were\u003c/span>\u003cdiv class=\"w\">would like를 wish로 바꾸고 가정의 느낌을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">see people as they are\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">accept people for who they are\u003c/span>\u003cspan class=\"y-eq\">see people as they are = accept people as they are\u003c/span>\u003cdiv class=\"w\">보는 행위를 받아들이는 의미로 확장했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">would like\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">wish\u003c/span>\u003cspan class=\"y-eq\">would like = wish\u003c/span>\u003cdiv class=\"w\">바라다라는 뜻을 더 간결한 wish로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rather than as\u003c/span>\u003cspan class=\"y-eq\">not as = rather than as\u003c/span>\u003cdiv class=\"w\">대조를 더 분명히 드러내는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We need to see people the way they really are, not the way we wish they were.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 사람을 우리가 원하는 모습으로 바꾸려 하지 말고 실제 모습 그대로 보라는 뜻입니다. 상대에게 우리의 기대를 강요하지 말자는 메시지가 담겨 있어요. 있는 그대로의 사람을 인정하는 태도가 중요하다는 겁니다.","hl":"mn"},{"n":36,"text":"as they are는 the way they really are로 바꿀 수 있고, not as we would like them to be는 not the way we wish they were로 바꿀 수 있습니다. would like를 wish로 바꾸면 바라는 마음이 더 간결하게 드러나요. 대조 구조는 그대로 유지됩니다.","hl":"rw"},{"n":37,"text":"see people as they are는 accept people for who they are와 연결해 기억해 두세요. would like는 wish로 바꿀 수 있고, not as는 rather than as로 풀 수 있습니다. 대조 표현을 바꿔도 문장의 핵심은 실제 모습과 바라는 모습의 차이입니다.","hl":"ph"},{"n":38,"text":"전체 문장은 We need to see people the way they really are, not the way we wish they were로 바꿀 수 있습니다. 사람을 있는 그대로 보아야 한다는 뜻이에요. the way와 wish를 사용해 대조를 자연스럽게 살렸습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07  \u003cspan class=\"fx\">Just as darkness comes at the end of each day, so also comes the dawn to spread light across the land.\u003c/span> Just as plants must die at the end of their life cycle, the seeds they have produced will emerge as new plants in the spring.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Just as \u003c/div>\u003cdiv class=\"k\">꼭 ~하듯이\u003c/div>\u003cdiv class=\"e\">darkness comes \u003c/div>\u003cdiv class=\"k\">어둠이 온다\u003c/div>\u003cdiv class=\"e\">at the end of each day, \u003c/div>\u003cdiv class=\"k\">매일의 끝에\u003c/div>\u003cdiv class=\"e\">so also comes \u003c/div>\u003cdiv class=\"k\">또한 온다\u003c/div>\u003cdiv class=\"e\">the dawn \u003c/div>\u003cdiv class=\"k\">새벽이\u003c/div>\u003cdiv class=\"e\">to spread light across the land. \u003c/div>\u003cdiv class=\"k\">땅 전체에 빛을 퍼뜨리기 위해\u003c/div>\u003cdiv class=\"e\">Just as \u003c/div>\u003cdiv class=\"k\">꼭 ~하듯이\u003c/div>\u003cdiv class=\"e\">plants must die \u003c/div>\u003cdiv class=\"k\">식물들이 죽어야 한다\u003c/div>\u003cdiv class=\"e\">at the end of their life cycle, \u003c/div>\u003cdiv class=\"k\">생명 주기의 끝에\u003c/div>\u003cdiv class=\"e\">the seeds they have produced \u003c/div>\u003cdiv class=\"k\">그들이 만들어 낸 씨들은\u003c/div>\u003cdiv class=\"e\">will emerge \u003c/div>\u003cdiv class=\"k\">나타날 것이다\u003c/div>\u003cdiv class=\"e\">as new plants \u003c/div>\u003cdiv class=\"k\">새로운 식물로\u003c/div>\u003cdiv class=\"e\">in the spring.\u003c/div>\u003cdiv class=\"k\">봄에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Just as A, so B\u003c/b>는 'A가 ~하듯이 B도 또한 ~하다'의 대응 비교 구문입니다. so also comes에서 동사가 주어 the dawn 앞에 도치되어 새벽이 또한 온다는 뜻을 강조합니다.\u003c/div>","segs":[{"n":39,"text":"Just as, 꼭 ~하듯이. darkness comes, 어둠이 온다. at the end of each day, 매일의 끝에. so also comes, 또한 온다. the dawn, 새벽이. to spread light across the land, 땅 전체에 빛을 퍼뜨리기 위해. Just as, 꼭 ~하듯이. plants must die, 식물들이 죽어야 한다. at the end of their life cycle, 생명 주기의 끝에. the seeds they have produced, 그들이 만들어 낸 씨들은. will emerge, 나타날 것이다. as new plants, 새로운 식물로. in the spring, 봄에","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 just as와 so also가 짝을 이루는 대응 비교입니다. 앞에서는 어둠이 오면 새벽도 온다고 말하고, 뒤에서는 식물이 죽으면 씨앗이 새 식물로 나타난다고 이어 가요. so also comes에서 동사가 주어 앞에 나오는 도치도 함께 익혀 두세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07  \u003cspan class=\"fx\">Just as darkness comes at the end of each day, so also comes the dawn to spread light across the land.\u003c/span> Just as plants must die at the end of their life cycle, the seeds they have produced will emerge as new plants in the spring.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>어둠 뒤에 새벽이 오는 자연의 순환을 통해, 끝과 시작이 이어진다는 의미를 전합니다. 식물이 죽어도 씨앗이 봄에 새 생명으로 나타나듯, 끝은 새로운 시작으로 이어진다는 뜻입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Just as darkness comes at the end of each day, so also comes the dawn\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Just as night falls at the end of each day, so dawn comes\u003c/span>\u003cdiv class=\"w\">darkness comes를 night falls로, so also comes the dawn을 so dawn comes로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">must die at the end of their life cycle\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have to die when their life cycle ends\u003c/span>\u003cdiv class=\"w\">must die를 have to die로 바꾸고 at the end of를 when절로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">comes at the end of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">arrives at the end of\u003c/span>\u003cspan class=\"y-eq\">come = arrive\u003c/span>\u003cdiv class=\"w\">오다라는 동사를 도착하다라는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">spread light across the land\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">light up the whole land\u003c/span>\u003cspan class=\"y-eq\">spread light across = light up\u003c/span>\u003cdiv class=\"w\">빛을 퍼뜨리다를 밝히다로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">emerge as new plants\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">appear as new plants\u003c/span>\u003cspan class=\"y-eq\">emerge = appear\u003c/span>\u003cdiv class=\"w\">나타나다라는 뜻을 더 쉬운 appear로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Just as darkness falls at the end of every day, dawn also comes to spread light over the land. Just as plants must die when their life cycle ends, the seeds they have produced will come up as new plants in spring.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 자연의 순환을 통해 끝과 시작이 이어진다고 말합니다. 어둠이 하루를 끝내지만 새벽이 다시 빛을 가져오듯, 식물이 죽어도 씨앗은 봄에 새 생명으로 나타난다는 뜻이에요. 그래서 끝을 절망이 아니라 다음 시작의 준비로 보게 합니다.","hl":"mn"},{"n":42,"text":"darkness comes는 night falls로, so also comes the dawn은 so dawn comes로 바꿀 수 있습니다. must die at the end of their life cycle은 have to die when their life cycle ends로 풀 수 있어요. 두 바꾸기 모두 순환과 대응의 뜻을 유지합니다.","hl":"rw"},{"n":43,"text":"comes at the end of는 arrives at the end of로 바꿀 수 있고, spread light across the land는 light up the whole land로 풀 수 있습니다. emerge as new plants는 appear as new plants와 연결해 기억하세요. 시험에서는 emerge를 appear나 come out으로 바꾸는 문제가 자주 나옵니다.","hl":"ph"},{"n":44,"text":"전체를 바꾸면 Just as darkness falls at the end of every day, dawn also comes to spread light over the land. Just as plants must die when their life cycle ends, the seeds they have produced will come up as new plants in spring이 됩니다. 끝과 시작이 이어진다는 뜻은 그대로예요. fall과 come up을 써도 자연의 순환이 잘 드러납니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 Act \u003cspan class=\"fx\">as if what you do makes a difference\u003c/span>. It does.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Act \u003c/div>\u003cdiv class=\"k\">행동하라\u003c/div>\u003cdiv class=\"e\">as if \u003c/div>\u003cdiv class=\"k\">마치 ~인 것처럼\u003c/div>\u003cdiv class=\"e\">what you do \u003c/div>\u003cdiv class=\"k\">당신이 하는 일이\u003c/div>\u003cdiv class=\"e\">makes a difference. \u003c/div>\u003cdiv class=\"k\">차이를 만든다면\u003c/div>\u003cdiv class=\"e\">It does.\u003c/div>\u003cdiv class=\"k\">그것은 정말 그렇다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as if\u003c/b>는 '마치 ~인 것처럼'이라는 가정 비교로, 명령문 Act의 태도와 방식을 설명합니다. as if 뒤에는 what you do라는 관계대명사절이 주어로 오고 makes a difference가 동사구로 이어집니다.\u003c/div>","segs":[{"n":45,"text":"Act, 행동하라. as if, 마치 ~인 것처럼. what you do, 당신이 하는 일이. makes a difference, 차이를 만든다면. It does, 그것은 정말 그렇다","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 Act 뒤에 as if가 붙어 어떤 태도로 행동할지 말해 줍니다. as if절 안에서는 what you do가 주어이고 makes a difference가 동사구예요. 뒤의 It does는 앞의 makes a difference를 받아 정말 그렇다고 강조합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 Act \u003cspan class=\"fx\">as if what you do makes a difference\u003c/span>. It does.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자신의 행동이 변화를 만든다고 믿고 행동하라는 뜻입니다. 이어지는 It does는 그 믿음이 사실이라는 강한 확언입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Act as if what you do makes a difference\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Act as though what you do matters\u003c/span>\u003cdiv class=\"w\">as if를 as though로 바꾸고 makes a difference를 matters로 간결하게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">It does\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">It really does\u003c/span>\u003cdiv class=\"w\">does에 really를 더해 확언의 강도를 높였습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make a difference\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">matter\u003c/span>\u003cspan class=\"y-eq\">make a difference = matter\u003c/span>\u003cdiv class=\"w\">차이를 만든다는 표현을 중요하다라는 동사로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Act\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Behave\u003c/span>\u003cspan class=\"y-eq\">act = behave\u003c/span>\u003cdiv class=\"w\">행동하라는 동사를 behave로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">what you do\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">your actions\u003c/span>\u003cspan class=\"y-eq\">what you do = your actions\u003c/span>\u003cdiv class=\"w\">관계대명사절을 명사구로 간결하게 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Behave as though your actions matter. They really do.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"이 문장은 자신의 행동이 변화를 만든다고 믿고 행동하라고 말합니다. 이어지는 It does는 그 변화가 실제로 일어난다는 강한 확신을 보여 줘요. 작은 행동도 의미가 있다는 태도를 가지라는 격려입니다.","hl":"mn"},{"n":48,"text":"Act as if what you do makes a difference는 Act as though what you do matters로 바꿀 수 있습니다. It does는 It really does로 바꾸면 강조가 더 살아나요. as if와 as though, make a difference와 matter의 연결을 함께 기억해 두세요.","hl":"rw"},{"n":49,"text":"make a difference는 matter와 같은 뜻으로 자주 바뀝니다. Act는 Behave로, what you do는 your actions로 풀 수 있습니다. 시험에서는 make a difference를 matter나 have an effect로 바꾸는 표현이 자주 나옵니다.","hl":"ph"},{"n":50,"text":"전체 문장은 Behave as though your actions matter. They really do로 바꿀 수 있습니다. 당신의 행동이 중요하다고 믿고 행동하라는 뜻이에요. as though와 really를 써서 가정과 확언의 느낌을 살렸습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 Even when you feel \u003cspan class=\"fx\">as though there isn't a lot you can do to change unhappiness or problems\u003c/span>, you can always do a little—and a little at a time eventually makes a big difference.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Even when \u003c/div>\u003cdiv class=\"k\">심지어 ~할 때에도\u003c/div>\u003cdiv class=\"e\">you feel \u003c/div>\u003cdiv class=\"k\">당신은 느낀다\u003c/div>\u003cdiv class=\"e\">as though \u003c/div>\u003cdiv class=\"k\">마치 ~인 것처럼\u003c/div>\u003cdiv class=\"e\">there isn't a lot \u003c/div>\u003cdiv class=\"k\">많지 않다\u003c/div>\u003cdiv class=\"e\">you can do \u003c/div>\u003cdiv class=\"k\">당신이 할 수 있는 일이\u003c/div>\u003cdiv class=\"e\">to change unhappiness or problems, \u003c/div>\u003cdiv class=\"k\">불행이나 문제를 바꾸기 위해\u003c/div>\u003cdiv class=\"e\">you can always do a little—\u003c/div>\u003cdiv class=\"k\">당신은 항상 작은 일을 할 수 있다—\u003c/div>\u003cdiv class=\"e\">and a little at a time \u003c/div>\u003cdiv class=\"k\">그리고 한 번에 조금씩\u003c/div>\u003cdiv class=\"e\">eventually makes a big difference.\u003c/div>\u003cdiv class=\"k\">결국 큰 변화를 만든다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as though\u003c/b>는 '마치 ~인 것처럼'의 가정 비교로, feel 뒤에서 you feel의 내용을 이끕니다. as though절 안에는 there isn't a lot이라는 주어부와 you can do to change...라는 수식 구조가 들어 있습니다.\u003c/div>","segs":[{"n":51,"text":"Even when, 심지어 ~할 때에도. you feel, 당신은 느낀다. as though, 마치 ~인 것처럼. there isn't a lot, 많지 않다. you can do, 당신이 할 수 있는 일이. to change unhappiness or problems, 불행이나 문제를 바꾸기 위해. you can always do a little—, 당신은 항상 작은 일을 할 수 있다—. and a little at a time, 그리고 한 번에 조금씩. eventually makes a big difference, 결국 큰 변화를 만든다","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 feel 뒤에 as though가 붙어 마치 그런 것처럼 느낀다는 내용을 만듭니다. as though절 안에는 there isn't a lot you can do to change라는 긴 구조가 들어 있어요. 뒤에서는 작은 일을 하면 결국 큰 변화가 생긴다고 이어 갑니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 Even when you feel \u003cspan class=\"fx\">as though there isn't a lot you can do to change unhappiness or problems\u003c/span>, you can always do a little—and a little at a time eventually makes a big difference.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>문제를 바꾸기 위해 할 수 있는 일이 별로 없게 느껴져도, 작은 행동을 계속하면 결국 큰 변화가 생긴다는 격려입니다. 작은 실천의 누적을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">feel as though there isn't a lot you can do\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">feel as if there is not much you can do\u003c/span>\u003cdiv class=\"w\">as though를 as if로 바꾸고 a lot을 not much로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a little at a time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">little by little\u003c/span>\u003cdiv class=\"w\">조금씩이라는 뜻을 관용 표현 little by little로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Even when\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Even if\u003c/span>\u003cspan class=\"y-eq\">even when = even if\u003c/span>\u003cdiv class=\"w\">상황을 강조하는 접속 표현을 조건의 느낌으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make a big difference\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have a big effect\u003c/span>\u003cspan class=\"y-eq\">make a difference = have an effect\u003c/span>\u003cdiv class=\"w\">변화를 만든다는 표현을 영향을 주다로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">eventually\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in the end\u003c/span>\u003cspan class=\"y-eq\">eventually = in the end\u003c/span>\u003cdiv class=\"w\">결국이라는 부사를 더 쉬운 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Even if you feel as if there is not much you can do to change unhappiness or problems, you can always do something small, and little by little it eventually makes a big difference.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 문제를 바꾸기 위해 할 수 있는 일이 별로 없게 느껴져도 작은 행동을 계속하라고 격려합니다. 한 번에 큰일을 하지 못해도 조금씩 쌓이면 결국 큰 변화가 된다는 뜻이에요. 작은 실천의 힘을 믿으라는 메시지입니다.","hl":"mn"},{"n":54,"text":"feel as though there isn't a lot you can do는 feel as if there is not much you can do로 바꿀 수 있습니다. a little at a time은 little by little로 바꾸면 더 자연스러워요. 두 표현 모두 조금씩 꾸준히라는 뜻을 유지합니다.","hl":"rw"},{"n":55,"text":"Even when은 Even if로 바꿀 수 있고, make a big difference는 have a big effect로 풀 수 있습니다. eventually는 in the end와 연결해 기억하세요. 작은 변화가 큰 결과로 이어진다는 흐름을 함께 잡으면 좋습니다.","hl":"ph"},{"n":56,"text":"전체를 바꾸면 Even if you feel as if there is not much you can do to change unhappiness or problems, you can always do something small, and little by little it eventually makes a big difference가 됩니다. 작은 실천이 큰 변화를 만든다는 뜻은 그대로예요. little by little과 something small이 핵심을 살려 줍니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 \u003cspan class=\"fx\">As there are differing tastes and preferences among different peoples and regions of the world, so do tastes and preferences evolve over the course of centuries\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">As \u003c/div>\u003cdiv class=\"k\">~하는 것처럼\u003c/div>\u003cdiv class=\"e\">there are \u003c/div>\u003cdiv class=\"k\">존재한다\u003c/div>\u003cdiv class=\"e\">differing tastes and preferences \u003c/div>\u003cdiv class=\"k\">다양한 취향과 선호가\u003c/div>\u003cdiv class=\"e\">among different peoples and regions of the world, \u003c/div>\u003cdiv class=\"k\">세상의 여러 민족과 지역 사이에\u003c/div>\u003cdiv class=\"e\">so do \u003c/div>\u003cdiv class=\"k\">또한 그렇게\u003c/div>\u003cdiv class=\"e\">tastes and preferences \u003c/div>\u003cdiv class=\"k\">취향과 선호는\u003c/div>\u003cdiv class=\"e\">evolve \u003c/div>\u003cdiv class=\"k\">진화한다\u003c/div>\u003cdiv class=\"e\">over the course of centuries.\u003c/div>\u003cdiv class=\"k\">수 세기에 걸쳐\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">As A, so B\u003c/b>는 'A인 것처럼, B도 또한 …하다'의 대응 비교 구문입니다. so do는 뒤 절에서 동사를 도치해 tastes and preferences가 evolve한다는 점을 강조합니다.\u003c/div>","segs":[{"n":57,"text":"As, ~하는 것처럼. there are, 존재한다. differing tastes and preferences, 다양한 취향과 선호가. among different peoples and regions of the world, 세상의 여러 민족과 지역 사이에. so do, 또한 그렇게. tastes and preferences, 취향과 선호는. evolve, 진화한다. over the course of centuries, 수 세기에 걸쳐","hl":"ch"},{"n":58,"text":"열 번째 문장은 as와 so do가 짝을 이루는 대응 비교입니다. 앞에서는 세계 여러 민족과 지역 사이에 취향 차이가 있다고 말하고, 뒤에서는 취향과 선호가 수 세기에 걸쳐 변한다고 이어 가요. so do에서 do가 evolve를 받쳐 주는 구조도 확인해 보세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 \u003cspan class=\"fx\">As there are differing tastes and preferences among different peoples and regions of the world, so do tastes and preferences evolve over the course of centuries\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>세계 여러 민족과 지역에 취향 차이가 있듯이, 취향과 선호는 시간이 지나면서도 변한다는 뜻입니다. 공간적 다양성과 시간적 변화를 나란히 연결합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">As there are differing tastes and preferences among different peoples and regions of the world\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Just as different peoples and regions of the world have different tastes and preferences\u003c/span>\u003cdiv class=\"w\">As there are 구조를 Just as절로 바꾸어 비교의 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">over the course of centuries\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">over centuries\u003c/span>\u003cdiv class=\"w\">over the course of centuries를 더 간결한 over centuries로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">differing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">various\u003c/span>\u003cspan class=\"y-eq\">differing = various\u003c/span>\u003cdiv class=\"w\">서로 다른이라는 뜻을 다양한이라는 형용사로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">peoples\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ethnic groups\u003c/span>\u003cspan class=\"y-eq\">peoples = ethnic groups\u003c/span>\u003cdiv class=\"w\">people의 복수형이 민족들을 뜻함을 풀어 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">evolve\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">change gradually\u003c/span>\u003cspan class=\"y-eq\">evolve = change gradually\u003c/span>\u003cdiv class=\"w\">진화하다라는 동사를 점진적으로 변하다로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Just as different peoples and regions of the world have different tastes and preferences, tastes and preferences also change gradually over centuries.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 공간에 따라 취향이 다르듯 시간에 따라서도 취향이 변한다고 말합니다. 세계 여러 지역의 차이와 수 세기에 걸친 변화를 나란히 놓은 거예요. 취향과 선호가 고정된 것이 아니라 계속 진화한다는 뜻입니다.","hl":"mn"},{"n":60,"text":"as there are differing tastes and preferences는 just as different peoples and regions of the world have different tastes and preferences로 바꿀 수 있습니다. over the course of centuries는 over centuries로 간결하게 바꿀 수 있어요. 비교와 시간의 흐름은 그대로 유지됩니다.","hl":"rw"},{"n":61,"text":"differing은 various로 바꿀 수 있고, peoples는 ethnic groups로 풀 수 있습니다. evolve는 change gradually와 연결해 기억하세요. 시험에서는 evolve를 develop이나 change over time으로 바꾸는 표현도 자주 나옵니다.","hl":"ph"},{"n":62,"text":"전체 문장은 Just as different peoples and regions of the world have different tastes and preferences, tastes and preferences also change gradually over centuries로 바꿀 수 있습니다. 공간적 차이와 시간적 변화를 나란히 비교한 뜻이에요. change gradually가 evolve의 의미를 잘 살려 줍니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 We usually take for granted our ability to produce and understand speech, \u003cspan class=\"fx\">just as we are not particularly aware of the action of our hearts, brains, or other essential organs\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We usually \u003c/div>\u003cdiv class=\"k\">우리는 대개\u003c/div>\u003cdiv class=\"e\">take for granted \u003c/div>\u003cdiv class=\"k\">당연하게 여긴다\u003c/div>\u003cdiv class=\"e\">our ability \u003c/div>\u003cdiv class=\"k\">우리의 능력을\u003c/div>\u003cdiv class=\"e\">to produce and understand speech, \u003c/div>\u003cdiv class=\"k\">말을 만들어 내고 이해하는\u003c/div>\u003cdiv class=\"e\">just as \u003c/div>\u003cdiv class=\"k\">꼭 ~하는 것처럼\u003c/div>\u003cdiv class=\"e\">we are not particularly aware \u003c/div>\u003cdiv class=\"k\">우리는 특히 알아차리지 못한다\u003c/div>\u003cdiv class=\"e\">of the action \u003c/div>\u003cdiv class=\"k\">작동을\u003c/div>\u003cdiv class=\"e\">of our hearts, brains, or other essential organs.\u003c/div>\u003cdiv class=\"k\">우리의 심장, 뇌, 또는 다른 필수 기관의\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">just as\u003c/b>는 '꼭 ~하는 것처럼'의 비교 접속사로, 앞의 take for granted our ability와 뒤의 are not particularly aware of the action을 나란히 비교합니다. 앞의 take for granted의 목적어 our ability가 동사구 뒤에 길게 이어지는 구조입니다.\u003c/div>","segs":[{"n":63,"text":"We usually, 우리는 대개. take for granted, 당연하게 여긴다. our ability, 우리의 능력을. to produce and understand speech, 말을 만들어 내고 이해하는. just as, 꼭 ~하는 것처럼. we are not particularly aware, 우리는 특히 알아차리지 못한다. of the action, 작동을. of our hearts, brains, or other essential organs, 우리의 심장, 뇌, 또는 다른 필수 기관의","hl":"ch"},{"n":64,"text":"열한 번째 문장은 just as가 앞의 take for granted our ability와 뒤의 are not particularly aware of the action을 비교합니다. take for granted의 목적어 our ability to produce and understand speech가 동사구 뒤에 길게 이어지는 점을 주의하세요. just as 이하는 앞 내용과 같은 태도를 반복해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 We usually take for granted our ability to produce and understand speech, \u003cspan class=\"fx\">just as we are not particularly aware of the action of our hearts, brains, or other essential organs\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리가 말을 만들고 이해하는 능력을 당연하게 여기듯, 심장이나 뇌의 작동도 별로 의식하지 못한다는 뜻입니다. 몸과 마음의 중요한 기능이 늘 자연스럽게 작동하기 때문이라는 의미입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take for granted\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fail to appreciate\u003c/span>\u003cdiv class=\"w\">당연하게 여긴다는 표현을 고마움을 느끼지 못한다는 뜻으로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">just as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in the same way that\u003c/span>\u003cdiv class=\"w\">just as를 in the same way that으로 바꾸어 비교의 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take for granted\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fail to appreciate\u003c/span>\u003cspan class=\"y-eq\">take for granted = fail to appreciate\u003c/span>\u003cdiv class=\"w\">당연시하다라는 관용 표현을 가치를 알아차리지 못하다로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be aware of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">notice\u003c/span>\u003cspan class=\"y-eq\">be aware of = notice\u003c/span>\u003cdiv class=\"w\">알아차리다라는 표현을 더 직접적인 동사로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">essential organs\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">vital organs\u003c/span>\u003cspan class=\"y-eq\">essential = vital\u003c/span>\u003cdiv class=\"w\">필수적인 기관을 생명에 중요한 기관이라는 뜻으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We usually fail to appreciate our ability to produce and understand speech, just as we do not really notice the work of our hearts, brains, or other vital organs.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 우리가 말을 만들고 이해하는 능력을 당연하게 여긴다고 말합니다. 심장이나 뇌가 쉬지 않고 일해도 잘 의식하지 못하듯, 언어 능력도 너무 자연스러워서 고맙게 느끼지 못한다는 뜻이에요. 몸과 마음의 중요한 기능일수록 오히려 당연하게 여기기 쉽다는 겁니다.","hl":"mn"},{"n":66,"text":"take for granted는 fail to appreciate로 바꿀 수 있고, just as는 in the same way that으로 풀 수 있습니다. be aware of는 notice로 바꾸면 뜻이 더 쉽게 다가와요. 비교 구조와 당연시한다는 의미는 그대로 유지됩니다.","hl":"rw"},{"n":67,"text":"take for granted는 fail to appreciate와 연결해 기억해 두세요. be aware of는 notice로, essential organs는 vital organs로 바꿀 수 있습니다. 시험에서는 take for granted의 의미를 묻는 문제가 자주 나오니 꼭 익혀 두세요.","hl":"ph"},{"n":68,"text":"전체 문장은 We usually fail to appreciate our ability to produce and understand speech, just as we do not really notice the work of our hearts, brains, or other vital organs로 바꿀 수 있습니다. 언어 능력과 몸의 기능을 당연하게 여긴다는 뜻이에요. fail to appreciate와 notice가 핵심 의미를 잘 살려 줍니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Once you have listened to the gossip for some time, \u003cspan class=\"fx\">you will soon feel as if you know everyone\u003c/span>, even if you have never met them.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Once \u003c/div>\u003cdiv class=\"k\">일단 ~하면\u003c/div>\u003cdiv class=\"e\">you have listened to the gossip \u003c/div>\u003cdiv class=\"k\">당신이 소문에 귀를 기울여 왔다면\u003c/div>\u003cdiv class=\"e\">for some time, \u003c/div>\u003cdiv class=\"k\">얼마간\u003c/div>\u003cdiv class=\"e\">you will soon feel \u003c/div>\u003cdiv class=\"k\">당신은 곧 느낄 것이다\u003c/div>\u003cdiv class=\"e\">as if \u003c/div>\u003cdiv class=\"k\">마치 ~인 것처럼\u003c/div>\u003cdiv class=\"e\">you know everyone, \u003c/div>\u003cdiv class=\"k\">당신이 모두를 아는 것처럼\u003c/div>\u003cdiv class=\"e\">even if \u003c/div>\u003cdiv class=\"k\">비록 ~일지라도\u003c/div>\u003cdiv class=\"e\">you have never met them.\u003c/div>\u003cdiv class=\"k\">당신이 그들을 만난 적이 없다고 해도\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as if\u003c/b>는 '마치 ~인 것처럼'의 가정 비교로, feel 뒤에서 느낌의 내용을 이끕니다. 뒤의 even if는 '비록 ~일지라도'라는 양보의 조건을 더합니다.\u003c/div>","segs":[{"n":69,"text":"Once, 일단 ~하면. you have listened to the gossip, 당신이 소문에 귀를 기울여 왔다면. for some time, 얼마간. you will soon feel, 당신은 곧 느낄 것이다. as if, 마치 ~인 것처럼. you know everyone, 당신이 모두를 아는 것처럼. even if, 비록 ~일지라도. you have never met them, 당신이 그들을 만난 적이 없다고 해도","hl":"ch"},{"n":70,"text":"열두 번째 문장은 feel 뒤에 as if가 붙어 마치 모두를 아는 것처럼 느낀다는 내용을 만듭니다. 앞의 once절은 소문을 얼마간 들은 뒤라는 시간 조건을 나타내요. 뒤의 even if는 만난 적이 없다는 양보의 상황을 더해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Once you have listened to the gossip for some time, \u003cspan class=\"fx\">you will soon feel as if you know everyone\u003c/span>, even if you have never met them.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>소문을 오래 들으면 직접 만난 적 없는 사람들까지 다 아는 것처럼 착각하게 된다는 뜻입니다. 정보가 친밀감을 만들어 내는 효과를 흥미롭게 표현합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">feel as if you know everyone\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">feel as though you know everyone\u003c/span>\u003cdiv class=\"w\">as if를 as though로 바꾸어 같은 가정 비교를 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Once you have listened to the gossip for some time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">After listening to gossip for a while\u003c/span>\u003cdiv class=\"w\">Once절을 After 동명사구로 바꾸어 시간 관계를 간결하게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">listened to the gossip\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">heard gossip\u003c/span>\u003cspan class=\"y-eq\">listen to gossip = hear gossip\u003c/span>\u003cdiv class=\"w\">소문에 귀를 기울이다라는 표현을 소문을 듣다로 간결하게 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">for some time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">for a while\u003c/span>\u003cspan class=\"y-eq\">for some time = for a while\u003c/span>\u003cdiv class=\"w\">얼마간이라는 시간 표현을 더 일상적인 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">even if\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">even though\u003c/span>\u003cspan class=\"y-eq\">even if = even though\u003c/span>\u003cdiv class=\"w\">양보의 의미를 살리는 접속 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">After you have heard gossip for a while, you will soon feel as though you know everyone, even though you have never met them.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 소문을 오래 들으면 직접 만난 적 없는 사람들까지 다 아는 것처럼 느끼게 된다고 말합니다. 소문이 사람들에 대한 친밀감을 만들어 내는 효과를 흥미롭게 보여 주는 거예요. 실제로 만난 것과 아는 느낌은 다를 수 있다는 점도 담겨 있습니다.","hl":"mn"},{"n":72,"text":"feel as if you know everyone은 feel as though you know everyone으로 바꿀 수 있습니다. once you have listened to the gossip for some time은 after listening to gossip for a while로 풀 수 있어요. 시간 조건과 가정의 느낌은 그대로 유지됩니다.","hl":"rw"},{"n":73,"text":"listened to the gossip은 heard gossip으로 바꿀 수 있고, for some time은 for a while과 같은 뜻입니다. even if는 even though로 바꿔 양보의 의미를 살릴 수 있어요. 시험에서는 even if와 even though의 미묘한 차이도 함께 확인해 두세요.","hl":"ph"},{"n":74,"text":"전체를 바꾸면 After you have heard gossip for a while, you will soon feel as though you know everyone, even though you have never met them이 됩니다. 소문을 들으면 만난 적 없는 사람도 아는 것처럼 느낀다는 뜻이에요. as though와 even though를 써도 원문의 분위기가 잘 살아납니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">as / as if / as though / just as ~ so 비교·가정 구문\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">as\u003c/b>는 '~하는 것처럼, ~대로'의 비교 접속사로 두 장면을 연결한다.\u003c/li>\u003cli>\u003cb class=\"key\">as if\u003c/b>와 \u003cb class=\"key\">as though\u003c/b>는 '마치 ~인 것처럼'의 가정적 비교를 만든다.\u003c/li>\u003cli>\u003cb class=\"key\">just as A, so B\u003c/b>는 'A가 ~하듯이 B도 또한 ~하다'의 대응 구조다.\u003c/li>\u003cli>\u003cb class=\"key\">as were\u003c/b>와 \u003cb class=\"key\">so do\u003c/b> 같은 도치 표현은 앞 내용을 뒤 주어에 간결하게 연결한다.\u003c/li>\u003cli>as절 안에서도 \u003cb class=\"key\">to부정사\u003c/b>, \u003cb class=\"key\">관계대명사절\u003c/b>, \u003cb class=\"key\">even if\u003c/b> 같은 요소가 함께 쓰일 수 있으므로 뼈대부터 찾는다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 as 하나로 비교와 가정을 어떻게 표현하는지 살펴봤어요. as는 장면을 나란히 비교하고, as if와 as though는 마치 그런 것처럼이라는 가정을 만듭니다. just as와 so가 짝을 이루면 앞뒤 내용이 같은 방식으로 이어진다는 점도 꼭 기억해 주세요. 긴 문장을 만나면 먼저 비교의 뼈대를 찾고, 그다음 수식어를 붙여 읽으면 됩니다. 오늘 배운 표현을 예문으로 소리 내어 반복해 보세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
