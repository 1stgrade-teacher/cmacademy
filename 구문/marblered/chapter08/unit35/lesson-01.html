lecturePlayer(document.getElementById("app"),{"brand":"unit35","title":"시간과 조건을 여는 접속사 블록 — once, as soon as, until, no sooner ~ than","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>시간과 조건을 여는 접속사 블록 — once, as soon as, until, no sooner ~ than\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>시간·조건을 나타내는 접속사 블록과 부정어 도치 구문을 찾아 문장을 끊어 읽고 의미를 파악한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘도 함께 구문 공부 시작해 볼게요. 오늘은 마법같은 블록구문 실전편에서 시간과 조건을 알려 주는 접속사 블록들을 집중적으로 봅니다. 첫 번째 문장부터 열두 번째 문장까지, 앞에서 흐름을 잡아 주는 블록만 제대로 알아도 문장이 훨씬 쉽게 읽히실 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">이 유닛의 핵심은 \u003cb class=\"key\">시간·조건의 접속사 블록\u003c/b>이에요. once, as soon as, until, each time, the moment, since, by the time, whenever 같은 연결어가 \u003cb class=\"key\">주어+동사를 갖춘 절\u003c/b>을 이끌면서 언제, 어떤 조건에서 일이 일어나는지를 정해 줍니다. 그리고 \u003cb class=\"key\">No sooner\u003c/b>, \u003cb class=\"key\">Hardly\u003c/b>처럼 부정어가 문장 앞에 오면 had가 주어 앞으로 나오는 \u003cb class=\"key\">도치\u003c/b>가 일어나고, 뒤에는 than이나 when이 짝을 이뤄요.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">Once you replace negative thoughts with positive ones\u003c/span>, you'll start having positive results.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 \u003cspan class=\"fx\">You never really understand a person until you consider things from his point of view\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 We must be ready to abandon or modify our hypothesis \u003cspan class=\"fx\">as soon as it is shown to be inconsistent with the facts\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Lunar eclipses occur \u003cspan class=\"fx\">each time the Earth blocks the sun's light from the moon\u003c/span> during the moon's full phase.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">No sooner had I spoken the words than\u003c/span> I felt an icy chill creep to my heart.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">The moment you doubt whether you can fly\u003c/span>, you cease forever to be able to do it.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 \u003cspan class=\"fx\">Since the Industrial Revolution began in the eighteenth century,\u003c/span> CO2 released during industrial processes has greatly increased the proportion of carbon in the atmosphere.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Each player must accept the cards life deals him or her; \u003cspan class=\"fx\">but once they are in hand\u003c/span>, he or she alone must decide how to play the cards in order to win the game.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 You can't just ask customers what they want and then try to give that to them. \u003cspan class=\"fx\">By the time you get it built\u003c/span>, they'll want something new.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 Art does not come to life \u003cspan class=\"fx\">until a spectator, a listener, or an audience breathes life into it\u003c/span> by experiencing it.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">Hardly had everybody taken their seats when\u003c/span> the professor began his lecture.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">Whenever a geneticist unlocks new secrets of the DNA molecule\u003c/span>, it adds to our knowledge base and enables us to better the human condition.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘의 핵심은 시간과 조건을 알려 주는 접속사 블록이에요. once나 as soon as, until, the moment, each time, whenever 같은 표현이 절을 이끌면서 언제, 어떤 조건에서 일이 일어나는지를 정해 주죠. 그리고 no sooner나 hardly가 문장 앞에 나오면 had가 주어 앞으로 나오는 도치가 일어나고, 뒤에는 than이나 when이 따라온다는 것도 꼭 기억해 두세요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">Once you replace negative thoughts with positive ones\u003c/span>, you'll start having positive results.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Once you replace negative thoughts\u003c/div>\u003cdiv class=\"k\">일단 당신이 부정적인 생각을 대체하면\u003c/div>\u003cdiv class=\"e\">with positive ones,\u003c/div>\u003cdiv class=\"k\">긍정적인 생각으로,\u003c/div>\u003cdiv class=\"e\">you'll start having positive results.\u003c/div>\u003cdiv class=\"k\">당신은 긍정적인 결과를 가지기 시작할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Once\u003c/b>는 '일단 ~하면'이라는 조건을 여는 부사절 접속사로, 뒤에 주어 you와 동사 replace가 있는 \u003cb class=\"key\">완전한 절\u003c/b>을 이끌어요. 이 접속사 블록이 문장 앞에 와서 조건을 먼저 제시하고, 쉼표 뒤 주절 you'll start having positive results가 그 결과를 받아 줍니다.\u003c/div>","segs":[{"n":3,"text":"Once you replace negative thoughts, 일단 당신이 부정적인 생각을 대체하면. with positive ones, 긍정적인 생각으로. you'll start having positive results, 당신은 긍정적인 결과를 가지기 시작할 것이다.","hl":"ch"},{"n":4,"text":"첫 번째 문장부터 볼게요. Once you replace negative thoughts with positive ones, you'll start having positive results. 여기서 Once는 일단 무언가를 하면이라는 조건을 여는 접속사예요. Once가 이끄는 블록 안에는 주어 you와 동사 replace가 들어 있는 온전한 절이 들어가고, 쉼표 뒤에는 그 조건의 결과가 오죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">Once you replace negative thoughts with positive ones\u003c/span>, you'll start having positive results.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>부정적인 생각을 긍정적인 생각으로 바꿔 끼우는 순간부터 결과도 달라진다는 뜻이에요. 상황이나 남을 탓하기 전에 내 생각부터 바꾸라는 출발점에 대한 조언이죠. replace A with B는 A를 B로 대체한다는 뜻이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">replace negative thoughts with positive ones\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">swap negative thoughts for positive ones\u003c/span>\u003cdiv class=\"w\">swap A for B는 'A를 B로 맞바꾸다'로, replace A with B보다 입말 느낌이 나고 교체의 즉각성이 살아나요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">you'll start having positive results\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">positive results will start to follow\u003c/span>\u003cdiv class=\"w\">결과가 내 뒤를 따라온다는 표현으로 바꾸면 인과의 흐름이 더 자연스럽게 느껴져요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">replace A with B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">substitute B for A\u003c/span>\u003cspan class=\"y-eq\">replace A with B = substitute B for A\u003c/span>\u003cdiv class=\"w\">강조점만 A에서 B로 옮긴 같은 뜻의 짝 표현이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">start having\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">begin to have\u003c/span>\u003cspan class=\"y-eq\">start -ing = begin to\u003c/span>\u003cdiv class=\"w\">동명사 목적어를 to부정사로 바꾼 격식체 표현이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">negative thoughts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pessimistic thoughts\u003c/span>\u003cdiv class=\"w\">부정적인을 뜻하는 형용사를 좀 더 어휘 수준 높은 말로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">As soon as you swap your negative thoughts for positive ones, you will begin to get positive results.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 생각을 바꾸는 것이 결과를 바꾸는 출발점이라는 이야기예요. 부정적인 생각을 긍정적인 생각으로 갈아 끼우면 긍정적인 결과가 따라오기 시작한다는 뜻이죠. 그래서 남을 탓하기 전에 내 생각부터 바꾸라는 따뜻한 조언으로 읽으면 좋아요.","hl":"mn"},{"n":6,"text":"replace negative thoughts with positive ones는 swap negative thoughts for positive ones로 바꿔 쓸 수 있어요. 뜻은 같지만 swap이 조금 더 입말 느낌이고, start having은 begin to have로 바꾸면 조금 더 격식 있는 표현이 됩니다.","hl":"rw"},{"n":7,"text":"시험에 자주 나오는 표현부터 정리해 볼게요. replace A with B는 A를 B로 대체하다라는 뜻이고 substitute B for A와 짝을 이뤄요. start having은 begin to have로 바꿀 수 있고, negative thoughts는 pessimistic thoughts로 바꿔도 같은 느낌이에요.","hl":"ph"},{"n":8,"text":"이제 같은 뜻의 문장을 하나 읽어 볼게요. As soon as you swap your negative thoughts for positive ones, you will begin to get positive results. As soon as를 써서 조건을 더 분명하게 만들었고, 결과 부분도 positive results will start to follow처럼 쓸 수 있다는 점 기억해 두세요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 \u003cspan class=\"fx\">You never really understand a person until you consider things from his point of view\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">You never really understand a person\u003c/div>\u003cdiv class=\"k\">당신은 결코 정말로 한 사람을 이해하지 못한다\u003c/div>\u003cdiv class=\"e\">until you consider things\u003c/div>\u003cdiv class=\"k\">당신이 상황을 고려할 때까지는\u003c/div>\u003cdiv class=\"e\">from his point of view.\u003c/div>\u003cdiv class=\"k\">그의 관점으로부터.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">not ~ until\u003c/b> 구문으로 '~할 때까지는 결코 …하지 않는다'라는 뜻이에요. 여기서는 never가 not의 역할을 하고, \u003cb class=\"key\">until\u003c/b>이 이끄는 절 you consider things from his point of view가 이해가 시작되는 시점을 정해 줍니다.\u003c/div>","segs":[{"n":9,"text":"You never really understand a person, 당신은 결코 정말로 한 사람을 이해하지 못한다. until you consider things, 당신이 상황을 고려할 때까지는. from his point of view, 그의 관점으로부터.","hl":"ch"},{"n":10,"text":"두 번째 문장은 not until 구문이에요. You never really understand a person until you consider things from his point of view. 여기서 never가 not의 역할을 하고, until이 이끄는 절이 이해가 시작되는 시점을 정해 준다고 보시면 돼요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 \u003cspan class=\"fx\">You never really understand a person until you consider things from his point of view\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>다른 사람을 이해하는 일은 쉽게 되지 않고, 그 사람의 관점에서 생각해 보는 순간에야 비로소 가능해진다는 뜻이에요. 상대의 자리에서 보지 않으면 이해는 시작되지 않는다는 이야기죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">You never really understand a person\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">You don't truly get to know someone\u003c/span>\u003cdiv class=\"w\">never really를 don't truly로 풀어 부정의 강도를 조금 부드럽게 했어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">consider things from his point of view\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">put yourself in his shoes\u003c/span>\u003cdiv class=\"w\">관점에서 고려한다는 말을 관용 표현으로 바꿔 훨씬 자연스럽게 들려요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">from his point of view\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">from where he stands\u003c/span>\u003cspan class=\"y-eq\">point of view = perspective\u003c/span>\u003cdiv class=\"w\">관점을 뜻하는 표현을 공간 이미지로 바꾼 유의 표현이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">consider\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">take into account\u003c/span>\u003cspan class=\"y-eq\">consider = take into account\u003c/span>\u003cdiv class=\"w\">고려한다는 동사를 구동사 표현으로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">never really understand\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can never truly comprehend\u003c/span>\u003cdiv class=\"w\">조동사를 더해 불가능의 뉘앙스를 강조하고 동사를 격식체로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">You don't truly understand someone until you put yourself in their shoes.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 상대를 이해하는 일이 그 사람의 자리에서 생각해 볼 때에야 시작된다는 뜻이에요. 쉽게 판단하지 말고 한 번쯤 그 사람의 눈으로 세상을 보라는 이야기죠.","hl":"mn"},{"n":12,"text":"consider things from his point of view는 put yourself in his shoes로 바꿔 쓸 수 있어요. 신발에 발을 넣어 본다는 이미지라 훨씬 생생하게 들리죠. You never really understand는 You don't truly get to know someone처럼 부드럽게 바꿀 수도 있어요.","hl":"rw"},{"n":13,"text":"from his point of view는 from where he stands나 from his perspective로 바꿀 수 있고, consider는 take into account로 바꿔 쓸 수 있어요. 시험에서는 not until을 강조 구문인 It is not until that으로 바꾸는 문제도 자주 나오니 함께 기억해 두세요.","hl":"ph"},{"n":14,"text":"같은 뜻의 문장을 읽어 볼게요. You don't truly understand someone until you put yourself in their shoes. 관용 표현을 써서 의미는 그대로 두고 표현만 훨씬 자연스럽게 바꾼 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 We must be ready to abandon or modify our hypothesis \u003cspan class=\"fx\">as soon as it is shown to be inconsistent with the facts\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We must be ready to abandon or modify our hypothesis\u003c/div>\u003cdiv class=\"k\">우리는 우리의 가설을 폐기하거나 수정할 준비가 되어 있어야 한다\u003c/div>\u003cdiv class=\"e\">as soon as it is shown\u003c/div>\u003cdiv class=\"k\">그것이 증명되자마자\u003c/div>\u003cdiv class=\"e\">to be inconsistent with the facts.\u003c/div>\u003cdiv class=\"k\">사실과 일치하지 않는다는 것으로.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as soon as\u003c/b>는 '~하자마자'를 뜻하는 시간의 부사절 접속사로, 뒤에 \u003cb class=\"key\">절\u003c/b>이 와요. 그 안에는 수동태 it is shown이 쓰여 '가설이 …라는 것으로 증명되자마자'라는 의미를 만들어 냅니다.\u003c/div>","segs":[{"n":15,"text":"We must be ready to abandon or modify our hypothesis, 우리는 우리의 가설을 폐기하거나 수정할 준비가 되어 있어야 한다. as soon as it is shown, 그것이 증명되자마자. to be inconsistent with the facts, 사실과 일치하지 않는다는 것으로.","hl":"ch"},{"n":16,"text":"세 번째 문장에서는 as soon as가 핵심이에요. We must be ready to abandon or modify our hypothesis as soon as it is shown to be inconsistent with the facts. as soon as 뒤에는 주어와 동사를 갖춘 절이 오고, 그 안에 수동태가 들어 있어서 증명되자마자라는 뜻이 만들어져요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 We must be ready to abandon or modify our hypothesis \u003cspan class=\"fx\">as soon as it is shown to be inconsistent with the facts\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>가설은 내가 만든 것이라도 사실과 어긋나면 미련 없이 버리거나 고칠 준비가 되어 있어야 한다는 뜻이에요. 과학은 자기 생각을 검증하고 고쳐 나가는 태도에서 출발한다는 이야기죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as soon as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the moment\u003c/span>\u003cdiv class=\"w\">접속사 as soon as를 명사구 접속사 the moment로 바꿔 즉각성을 더 살렸어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be ready to abandon or modify\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be willing to give up or revise\u003c/span>\u003cdiv class=\"w\">준비되어 있다를 기꺼이 하겠다는 태도 표현으로 바꿔 자세를 강조했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be inconsistent with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be at odds with\u003c/span>\u003cspan class=\"y-eq\">inconsistent with = at odds with\u003c/span>\u003cdiv class=\"w\">일치하지 않는다는 뜻을 관용 표현으로 바꾼 유의어 짝이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be ready to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be prepared to\u003c/span>\u003cspan class=\"y-eq\">ready to = prepared to\u003c/span>\u003cdiv class=\"w\">준비의 의미를 그대로 살린 격식체 교체예요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">abandon a hypothesis\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">discard a hypothesis\u003c/span>\u003cdiv class=\"w\">버린다는 동사를 폐기 이미지가 강한 단어로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We have to be prepared to throw away or revise our hypothesis the moment it turns out not to fit the facts.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"가설은 내 것이더라도 사실과 어긋나면 바로 버리거나 고칠 준비가 되어 있어야 한다는 뜻이에요. 자기 생각을 검증하고 고치는 태도가 과학의 출발점이라는 이야기죠.","hl":"mn"},{"n":18,"text":"as soon as는 the moment로 바꿔 쓸 수 있어요. 훨씬 짧고 즉각적인 느낌이 나죠. be ready to abandon or modify는 be willing to give up or revise로 바꾸면 태도가 더 분명하게 드러납니다.","hl":"rw"},{"n":19,"text":"be inconsistent with는 be at odds with로 바꿀 수 있고, be ready to는 be prepared to로 바꿀 수 있어요. abandon은 discard로 바꾸면 폐기한다는 이미지가 더 강해집니다.","hl":"ph"},{"n":20,"text":"이제 같은 뜻의 문장을 읽어 볼게요. We have to be prepared to throw away or revise our hypothesis the moment it turns out not to fit the facts. the moment와 turn out to를 써서 뜻은 그대로 두고 표현만 새로 구성한 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Lunar eclipses occur \u003cspan class=\"fx\">each time the Earth blocks the sun's light from the moon\u003c/span> during the moon's full phase.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Lunar eclipses occur\u003c/div>\u003cdiv class=\"k\">월식은 일어난다\u003c/div>\u003cdiv class=\"e\">each time the Earth blocks the sun's light from the moon\u003c/div>\u003cdiv class=\"k\">지구가 달로부터 태양의 빛을 막을 때마다\u003c/div>\u003cdiv class=\"e\">during the moon's full phase.\u003c/div>\u003cdiv class=\"k\">달의 만월 단계 동안에.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">each time\u003c/b>은 명사구이지만 접속사처럼 \u003cb class=\"key\">절\u003c/b>을 이끌어 '~할 때마다'라는 뜻을 만들어요. 그래서 뒤에 주어 the Earth와 동사 blocks가 있는 절이 그대로 붙습니다.\u003c/div>","segs":[{"n":21,"text":"Lunar eclipses occur, 월식은 일어난다. each time the Earth blocks the sun's light from the moon, 지구가 달로부터 태양의 빛을 막을 때마다. during the moon's full phase, 달의 만월 단계 동안에.","hl":"ch"},{"n":22,"text":"네 번째 문장에서는 each time이 접속사처럼 쓰였어요. 명사구인데도 뒤에 주어와 동사가 있는 절을 데리고 와서 언제마다라는 뜻을 만들어 주죠. 이렇게 명사구가 접속사 역할을 하는 블록은 시험에도 자주 나옵니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Lunar eclipses occur \u003cspan class=\"fx\">each time the Earth blocks the sun's light from the moon\u003c/span> during the moon's full phase.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>월식은 특별한 사건이 아니라 달이 보름달이 되는 단계에서 지구가 햇빛을 가릴 때마다 규칙적으로 일어난다는 뜻이에요. 반복되는 자연 현상이라는 점을 알려 주는 문장이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv ep A away from B로 바꿔도 같은 의미를 전달합니다.","hl":"ph"},{"n":26,"text":"같은 뜻의 문장을 읽어 볼게요. A lunar eclipse takes place every time the Earth blocks sunlight from reaching the moon while the moon is full. every time과 while을 활용해 의미는 그대로 살린 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 \u003cspan class=\"fx\">No sooner had I spoken the words than\u003c/span> I felt an icy chill creep to my heart.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">No sooner had I spoken the words\u003c/div>\u003cdiv class=\"k\">내가 그 말을 내뱉자마자\u003c/div>\u003cdiv class=\"e\">than I felt an icy chill\u003c/div>\u003cdiv class=\"k\">나는 얼음 같은 냉기가 느껴졌다\u003c/div>\u003cdiv class=\"e\">creep to my heart.\u003c/div>\u003cdiv class=\"k\">나의 심장으로 서서히 다가오는 것을.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">No sooner ~ than\u003c/b>은 '~하자마자 …했다'를 뜻하는 구문이에요. No sooner가 문장 앞에 오면 주어와 조동사의 순서가 바뀌는 \u003cb class=\"key\">도치\u003c/b>가 일어나서 had I spoken처럼 had가 주어 I 앞으로 나오고, than 뒤에 결과가 이어집니다.\u003c/div>","segs":[{"n":27,"text":"No sooner had I spoken the words, 내가 그 말을 내뱉자마자. than I felt an icy chill, 나는 얼음 같은 냉기가 느껴졌다. creep to my heart, 나의 심장으로 서서히 다가오는 것을.","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 도치 구문이에요. No sooner had I spoken the words than I felt an icy chill creep to my heart. No sooner가 앞에 나오면 had가 주어 앞으로 나와야 하죠. 그리고 than 뒤에는 곧바로 이어진 사건이 옵니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 \u003cspan class=\"fx\">No sooner had I spoken the words than\u003c/span> I felt an icy chill creep to my heart.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>그 말을 꺼내자마자 등골이 서늘해질 만큼 두려움이 밀려왔다는 뜻이에요. 후회나 두려움이 아주 짧은 순간에 찾아왔다는 느낌을 강조하죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">No sooner had I spoken the words than\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">As soon as I said those words\u003c/span>\u003cdiv class=\"w\">도치 구문을 평서문 접속사로 풀어 쓰면 훨씬 읽기 쉽고 뜻도 분명해져요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I felt an icy chill creep to my heart\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a chill ran down my spine\u003c/span>\u003cdiv class=\"w\">심장으로 스며드는 냉기를 등골이 서늘하다는 관용 표현으로 바꿔 생생함을 살렸어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">No sooner ~ than\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Hardly ~ when\u003c/span>\u003cspan class=\"y-eq\">No sooner ~ than = Hardly ~ when\u003c/span>\u003cdiv class=\"w\">같은 뜻을 가진 도치 구문 짝으로, 시험에 단골로 나오는 교체예요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">creep to my heart\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">spread through my heart\u003c/span>\u003cdiv class=\"w\">서서히 다가온다는 동작을 퍼져 나간다는 이미지로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">icy chill\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cold shiver\u003c/span>\u003cdiv class=\"w\">냉기라는 표현을 오싹함이라는 감각어로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">As soon as I said those words, I felt a cold shiver running into my heart.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"그 말을 꺼내자마자 등골이 서늘할 만큼 두려움이 밀려왔다는 뜻이에요. 두 사건이 거의 동시에 일어났고, 감정이 아주 빠르게 덮쳤다는 느낌을 강조합니다.","hl":"mn"},{"n":30,"text":"No sooner had I spoken the words than은 As soon as I said those words로 풀어 쓸 수 있어요. 도치를 없애면 훨씬 편하게 읽히죠. 마지막 부분은 a chill ran down my spine으로 바꾸면 훨씬 생생한 표현이 됩니다.","hl":"rw"},{"n":31,"text":"No sooner than은 Hardly when과 짝을 이루는 표현이에요. 시험에서는 이 둘을 서로 바꾸는 문제가 정말 자주 나옵니다. icy chill은 cold shiver로 바꿀 수 있다는 점도 기억해 두세요.","hl":"ph"},{"n":32,"text":"같은 뜻의 문장을 읽어 볼게요. As soon as I said those words, I felt a cold shiver running into my heart. 도치를 풀고 관용 표현을 살려서 뜻은 그대로 전달하는 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 \u003cspan class=\"fx\">The moment you doubt whether you can fly\u003c/span>, you cease forever to be able to do it.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The moment you doubt\u003c/div>\u003cdiv class=\"k\">당신이 의심하는 그 순간\u003c/div>\u003cdiv class=\"e\">whether you can fly,\u003c/div>\u003cdiv class=\"k\">당신이 날 수 있는지를,\u003c/div>\u003cdiv class=\"e\">you cease forever to be able to do it.\u003c/div>\u003cdiv class=\"k\">당신은 그것을 할 수 있는 것을 영원히 멈춘다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">The moment\u003c/b>는 명사구가 접속사 역할을 해서 '~하는 순간'이라는 뜻으로 \u003cb class=\"key\">절\u003c/b>을 이끌어요. 동사 doubt 뒤에는 whether you can fly라는 \u003cb class=\"key\">간접의문문\u003c/b>이 목적어로 들어가 있습니다.\u003c/div>","segs":[{"n":33,"text":"The moment you doubt, 당신이 의심하는 그 순간. whether you can fly, 당신이 날 수 있는지를. you cease forever to be able to do it, 당신은 그것을 할 수 있는 것을 영원히 멈춘다.","hl":"ch"},{"n":34,"text":"여섯 번째 문장에서는 The moment가 접속사 역할을 해요. 명사구인데도 뒤에 절을 데리고 와서 하는 순간이라는 뜻을 만들어 주죠. 그리고 doubt 뒤에는 whether you can fly라는 간접의문문이 목적어로 들어가 있습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 \u003cspan class=\"fx\">The moment you doubt whether yo ased during industrial processes, 산업 공정 중에 배출된 이산화탄소는. has greatly increased the proportion of carbon in the atmosphere, 대기 중 탄소의 비율을 크게 증가시켰다.","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 since가 절을 이끄는 경우예요. Since the Industrial Revolution began in the eighteenth century, CO2 released during industrial processes has greatly increased the proportion of carbon in the atmosphere. since가 이래로라는 뜻으로 절을 이끌면 주절은 현재완료와 짝을 이룬다는 점이 핵심이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 \u003cspan class=\"fx\">Since the Industrial Revolution began in the eighteenth century,\u003c/span> CO2 released during industrial processes has greatly increased the proportion of carbon in the atmosphere.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>산업혁명이 시작된 뒤로 산업 공정에서 나온 이산화탄소가 대기 중 탄소 비율을 크게 끌어올렸다는 뜻이에요. 시간의 흐름 속에서 원인과 결과를 보여 주는 문장이죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Since the Industrial Revolution began\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Ever since the Industrial Revolution started\u003c/span>\u003cdiv class=\"w\">Ever since를 쓰면 그 시점부터 지금까지 이어진다는 느낌이 더 강해져요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">has greatly increased\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has sharply raised\u003c/span>\u003cdiv class=\"w\">증가 폭이 컸다는 인상을 sharply raised로 더 선명하게 살렸어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">since\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ever since\u003c/span>\u003cspan class=\"y-eq\">since = ever since\u003c/span>\u003cdiv class=\"w\">이래로라는 의미를 강조 iv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the cards life deals him or her\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the hand that life has dealt\u003c/span>\u003cdiv class=\"w\">카드를 나눠 준다는 표현을 포커의 hand 이미지로 바꿔 훨씬 자연스럽게 만들었어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">he or she alone must decide\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the decision is entirely up to him or her\u003c/span>\u003cdiv class=\"w\">결정은 전적으로 본인 몫이라는 표현으로 바꿔 책임의 강조를 살렸어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in hand\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in one's possession\u003c/span>\u003cspan class=\"y-eq\">in hand = in one's possession\u003c/span>\u003cdiv class=\"w\">손에 있다는 말을 소유의 뜻으로 풀어 쓴 짝이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">decide how to play the cards\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">choose how to play one's hand\u003c/span>\u003cdiv class=\"w\">카드를 어떻게 쓸지 결정한다를 선택한다는 동사로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in order to win\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so as to win\u003c/span>\u003cspan class=\"y-eq\">in order to = so as to\u003c/span>\u003cdiv class=\"w\">목적을 나타내는 부사구를 같은 뜻의 다른 형태로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Every player has to accept the hand that life deals, but once the cards are in hand, only the player can choose how to play them so as to win the game.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"인생이 나눠 준 카드는 고를 수 없지만, 그 카드를 어떻게 쓸지는 내가 결정한다는 뜻이에요. 주어진 조건보다 선택과 태도가 결과를 바꾼다는 메시지죠.","hl":"mn"},{"n":48,"text":"the cards life deals him or her는 the hand that life has dealt로 바꿔 쓸 수 있어요. he or she alone must decide는 the decision is entirely up to him or her로 바꾸면 책임의 강조가 더 분명해집니다.","hl":"rw"},{"n":49,"text":"in hand는 in one's possession으로 바꿀 수 있고, in order to win은 so as to win으로 바꿀 수 있어요. decide how to play the cards는 choose how to play one's hand로 바꾸면 훨씬 자연스럽습니다.","hl":"ph"},{"n":50,"text":"이제 같은 뜻의 문장을 읽어 볼게요. Every player has to accept the hand that life deals, but once the cards are in hand, only the player can choose how to play them so as to win the game. once 절의 구조를 그대로 살린 패러프레이징이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 You can't just ask customers what they want and then try to give that to them. \u003cspan class=\"fx\">By the time you get it built\u003c/span>, they'll want something new.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">You can't just ask customers what they want\u003c/div>\u003cdiv class=\"k\">당신은 그저 고객들에게 무엇을 원하는지 묻기만 할 수는 없다\u003c/div>\u003cdiv class=\"e\">and then try to give that to them.\u003c/div>\u003cdiv class=\"k\">그리고 나서 그것을 그들에게 주려고 애쓸 수는 없다.\u003c/div>\u003cdiv class=\"e\">By the time you get it built,\u003c/div>\u003cdiv class=\"k\">당신이 그것을 만들어 낼 무렵에는,\u003c/div>\u003cdiv class=\"e\">they'll want something new.\u003c/div>\u003cdiv class=\"k\">그들은 새로운 것을 원할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">By the time\u003c/b>은 명사구가 접속사처럼 \u003cb class=\"key\">절\u003c/b>을 이끌어 '~할 무렵에는'이라는 뜻을 만들어요. 이때 주절은 보통 will이나 미래완료 형태로 그 시점에 벌어질 결과를 나타냅니다.\u003c/div>","segs":[{"n":51,"text":"You can't just ask customers what they want, 당신은 그저 고객들에게 무엇을 원하는지 묻기만 할 수는 없다. and then try to give that to them, 그리고 나서 그것을 그들에게 주려고 애쓸 수는 없다.. By the time you get it built, 당신이 그것을 만들어 낼 무렵에는. they'll want something new, 그들은 새로운 것을 원할 것이다.","hl":"ch"},{"n":52,"text":"아홉 번째 문장에서는 By the time이 접속사처럼 절을 이끌어요. By the time you get it built처럼 뒤에 주어와 동사가 오고, 주절에는 will이 와서 그 시점의 결과를 보여 주죠. get it built는 get something p.p. 형태라는 것도 함께 기억해 두세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 You can't just ask customers what they want and then try to give that to them. \u003cspan class=\"fx\">By the time you get it built\u003c/span>, they'll want something new.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>고객이 원하는 것을 물어서 그대로 만들어 주면, 완성될 무렵에는 이미 새로운 것을 원한다는 뜻이에요. 요구를 뒤따라가기만 해서는 앞설 수 없다는 이야기죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">By the time you get it built\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">By the time it is finally built\u003c/span>\u003cdiv class=\"w\">get it built를 수동태로 바꿔 완성되는 시점이라는 의미를 더 분명히 했어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ask customers what they want\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ask customers what they are looking for\u003c/span>\u003cdiv class=\"w\">원한다는 표현을 찾고 있다는 표현으로 바꿔 요구의 현재성을 살렸어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">get it built\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have it built\u003c/span>\u003cspan class=\"y-eq\">get + p.p. = have + p.p.\u003c/span>\u003cdiv class=\"w\">사역 의미의 get과 have를 서로 바꾼 대표적인 짝이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">By the time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">By then, when\u003c/span>\u003cdiv class=\"w\">무렵이라는 시점 표현을 풀어 같은 의미를 전달했어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">something new\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">something else entirely\u003c/span>\u003cdiv class=\"w\">새로운 것을 완전히 다른 것이라는 표현으로 바꿔 의미를 강조했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">You can't simply ask customers what they want and then hand it to them, because by the time you have it built, they will be looking for something new.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"고객이 원하는 것을 물어서 그대로 만들어 주면, 완성될 무렵에는 이미 새로운 것을 원한다는 뜻이에요. 요구를 뒤따라가기만 해서는 시장을 앞서 갈 수 없다는 이야기죠.","hl":"mn"},{"n":54,"text":"By the time you get it built는 By the time it is finally built로 바꿀 수 있어요. ask customers what they want는 ask customers what they are looking for로 바꾸면 요구의 현재성이 살아납니다.","hl":"rw"},{"n":55,"text":"get it built는 have it built와 같은 구조예요. 시험에 정말 자주 나오는 짝이니 꼭 외워 두세요. something new는 something else entirely로 바꿔 강조할 수 있습니다.","hl":"ph"},{"n":56,"text":"같은 뜻의 문장을 읽어 볼게요. You can't simply ask customers what they want and then hand it to them, because by the time you have it built, they will be looking for something new. 접속사와 동사를 바꿔도 의미는 그대로 전달돼요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 Art does not come to life \u003cspan class=\"fx\">until a spectator, a listener, or an audience breathes life into it\u003c/span> by experiencing it.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Art does not come to life\u003c/div>\u003cdiv class=\"k\">예술은 살아 움직이지 않는다\u003c/div>\u003cdiv class=\"e\">until a spectator, a listener, or an audience\u003c/div>\u003cdiv class=\"k\">관객, 청취자, 혹은 청중이\u003c/div>\u003cdiv class=\"e\">breathes life into it by experiencing it.\u003c/div>\u003cdiv class=\"k\">그것을 경험함으로써 그것에 생명을 불어넣을 때까지는.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">not ~ until\u003c/b> 구문으로 '~할 때까지는 …하지 않는다'라는 뜻이에요. \u003cb class=\"key\">until\u003c/b> 뒤에는 주어 a spectator, a listener, or an audience와 동사 breathes가 있는 절이 와서 살아나는 시점을 정해 줍니다.\u003c/div>","segs":[{"n":57,"text":"Art does not come to life, 예술은 살아 움직이지 않는다. until a spectator, a listener, or an audience, 관객, 청취자, 혹은 청중이. breathes life into it by experiencing it, 그것을 경험함으로써 그것에 생명을 불어넣을 때까지는.","hl":"ch"},{"n":58,"text":"열 번째 문장은 not until 구문이에요. Art does not come to life until a spectator, a listener, or an audience breathes life into it by experiencing it. until 뒤에 주어와 동사가 있는 절이 와서 언제 살아나는지를 정해 준다고 보시면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 Art does not come to life \u003cspan class=\"fx\">until a spectator, a listener, or an audience breathes life into it\u003c/span> by experiencing it.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>예술 작품은 감상자가 직접 경험해 줄 때 비로소 살아 있는 것이 된다는 뜻이에요. 작품을 완성하는 것은 결국 관객의 경험이라는 이야기죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">does not come to life until\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">only comes alive when\u003c/span>\u003cdiv class=\"w\">not until을 only when으로 바꾸면 조건이 훨씬 분명하고 강조되어 들려요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">breathes life into it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">brings it to life\u003c/span>\u003cdiv class=\"w\">생명을 불어넣는다는 표현을 같은 뜻의 더 짧은 관용구로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">come to life\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">come alive\u003c/span>\u003cspan class=\"y-eq\">come to life = come alive\u003c/span>\u003cdiv class=\"w\">살아 움직이다를 뜻하는 같은 의미의 두 표현이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">breathe life into\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">bring life to\u003c/span>\u003cspan class=\"y-eq\">breathe life into = bring life to\u003c/span>\u003cdiv class=\"w\">생명을 불어넣는다는 동사를 같은 뜻의 다른 동사구로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">spectator\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">viewer\u003c/span>\u003cdiv class=\"w\">관객을 뜻하는 단어를 더 익숙한 단어로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Art only comes alive when a viewer, a listener, or an audience brings life to it by experiencing it.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"예술 작품은 감상자가 직접 경험해 줄 때 비로소 살아 움직인다는 뜻이에요. 작품을 완성하는 것은 결국 관객의 경험이라는 이야기죠.","hl":"mn"},{"n":60,"text":"does not come to life until은 only comes alive when으로 바꿀 수 있어요. 뜻은 같지만 조건이 더 또렷하게 들리죠. breathes life into it은 brings it to life로 바꾸면 훨씬 짧고 자연스럽습니다.","hl":"rw"},{"n":61,"text":"come to life는 come alive로 바꿀 수 있고, breathe life into는 bring life to로 바꿀 수 있어요. spectator는 viewer로 바꿔도 같은 뜻을 전달합니다.","hl":"ph"},{"n":62,"text":"같은 뜻의 문장을 읽어 볼게요. Art only comes alive when a viewer, a listener, or an audience brings life to it by experiencing it. not until을 only when으로 바꿔 의미를 그대로 살린 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 \u003cspan class=\"fx\">Hardly had everybody taken their seats when\u003c/span> the professor began his lecture.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Hardly had everybody taken their seats\u003c/div>\u003cdiv class=\"k\">모든 사람이 자기 자리에 앉자마자\u003c/div>\u003cdiv class=\"e\">when the professor began his lecture.\u003c/div>\u003cdiv class=\"k\">교수는 자신의 강의를 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Hardly ~ when\u003c/b>은 '~하자마자 …했다'를 뜻하고, Hardly가 문장 앞에 오면 \u003cb class=\"key\">도치\u003c/b>가 일어나 had가 주어 everybody 앞으로 나와요. when 뒤에는 곧바로 이어진 사건이 옵니다.\u003c/div>","segs":[{"n":63,"text":"Hardly had everybody taken their seats, 모든 사람이 자기 자리에 앉자마자. when the professor began his lecture, 교수는 자신의 강의를 시작했다.","hl":"ch"},{"n":64,"text":"열한 번째 문장도 도치 구문이에요. Hardly had everybody taken their seats when the professor began his lecture. Hardly가 앞에 오면 had가 주어 everybody 앞으로 나오고, when 뒤에 이어진 사건이 오죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 \u003cspan class=\"fx\">Hardly had everybody taken their seats when\u003c/span> the professor began his lecture.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>모두가 앉자마자 곧바로 강의가 시작되었다는 뜻이에요. 두 사건이 거의 동시에 일어났음을 강조할 때 쓰는 표현이죠. 주로 과거 이야기에서 긴장감을 살릴 때 사용해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Hardly had everybody taken their seats when\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">As soon as everyone sat down\u003c/span>\u003cdiv class=\"w\">도치 구문을 평서문 접속사로 풀어 뜻을 분명하게 했어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the professor began his lecture\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the professor started lecturing\u003c/span>\u003cdiv class=\"w\">강의를 시작한다는 표현을 동사 하나로 간결하게 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Hardly ~ when\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">No sooner ~ than\u003c/span>\u003cspan class=\"y-eq\">Hardly ~ when = No sooner ~ than\u003c/span>\u003cdiv class=\"w\">같은 뜻을 가진 도치 짝으로 시험에 단골로 나와요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take one's seat\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">sit down\u003c/span>\u003cspan class=\"y-eq\">take one's seat = sit down\u003c/span>\u003cdiv class=\"w\">자리에 앉는다는 뜻을 가장 기본 동사로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">begin one's lecture\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">start one's class\u003c/span>\u003cdiv class=\"w\">강의를 시작한다는 표현을 수업 시작으로 바꿔 자연스럽게 만들었어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">As soon as everyone had taken their seats, the professor started his lecture.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"모두가 앉자마자 곧바로 강의가 시작되었다는 뜻이에요. 두 사건이 거의 동시에 일어났다는 것을 강조하는 표현이죠.","hl":"mn"},{"n":66,"text":"Hardly had everybody taken their seats when은 As soon as everyone sat down으로 풀어 쓸 수 있어요. 도치를 없애면 훨씬 읽기 편해지죠. began his lecture는 started lecturing으로 바꾸면 더 간결합니다.","hl":"rw"},{"n":67,"text":"Hardly when은 No sooner than과 짝을 이루는 표현이에요. 시험에서 서로 바꾸는 문제가 자주 나옵니다. take one's seat는 sit down으로 바꿀 수 있다는 점도 기억해 두세요.","hl":"ph"},{"n":68,"text":"같은 뜻의 문장을 읽어 볼게요. As soon as everyone had taken their seats, the professor started his lecture. 도치를 풀고 시제만 살짝 다듬어 뜻을 그대로 전달한 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">Whenever a geneticist unlocks new secrets of the DNA molecule\u003c/span>, it adds to our knowledge base and enables us to better the human condition.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Whenever a geneticist unlocks new secrets of the DNA molecule,\u003c/div>\u003cdiv class=\"k\">유전학자가 DNA 분자의 새로운 비밀들을 밝힐 때마다,\u003c/div>\u003cdiv class=\"e\">it adds to our knowledge base\u003c/div>\u003cdiv class=\"k\">그것은 우리의 지식 기반에 더해지고\u003c/div>\u003cdiv class=\"e\">and enables us to better the human condition.\u003c/div>\u003cdiv class=\"k\">우리가 인간의 여건을 개선하는 것을 가능하게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Whenever\u003c/b>는 '~할 때마다'를 뜻하는 복합 관계부사로, 뒤에 \u003cb class=\"key\">완전한 절\u003c/b>이 와요. 주절의 it은 앞 절 전체, 즉 유전학자가 비밀을 밝히는 일을 받아 주는 대명사입니다.\u003c/div>","segs":[{"n":69,"text":"Whenever a geneticist unlocks new secrets of the DNA molecule, 유전학자가 DNA 분자의 새로운 비밀들을 밝힐 때마다. it adds to our knowledge base, 그것은 우리의 지식 기반에 더해지고. and enables us to better the human condition, 우리가 인간의 여건을 개선하는 것을 가능하게 한다.","hl":"ch"},{"n":70,"text":"마지막 열두 번째 문장에서는 Whenever가 절을 이끌어요. 뒤에 주어와 동사가 있는 완전한 절이 오고, 주절의 it은 앞에서 말한 일 전체를 받아 준다는 점이 중요합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">Whenever a geneticist unlocks new secrets of the DNA molecule\u003c/span>, it adds to our knowledge base and enables us to better the human condition.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>DNA의 비밀이 하나씩 밝혀질 때마다 우리 지식이 쌓이고, 그 덕분에 인간의 삶이 나아진다는 뜻이에요. 과학적 발견이 곧 인류의 발전으로 이어진다는 이야기죠.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Whenever a geneticist unlocks new secrets\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Every time a geneticist reveals new secrets\u003c/span>\u003cdiv class=\"w\">복합 관계부사를 명사구 접속사로 바꾸고 unlock을 reveal로 풀어 썼어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">enables us to better the human condition\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">makes it possible for us to improve human life\u003c/span>\u003cdiv class=\"w\">enable 목적어 to부정사를 make it possible for 목적어 to로 바꿔 뜻을 풀어 설명했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unlock secrets\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">reveal secrets\u003c/span>\u003cspan class=\"y-eq\">unlock = reveal\u003c/span>\u003cdiv class=\"w\">비밀을 연다를 비밀을 드러낸다로 바꾼 유의어 짝이에요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">add to our knowledge base\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">expand our body of knowledge\u003c/span>\u003cspan class=\"y-eq\">knowledge base = body of knowledge\u003c/span>\u003cdiv class=\"w\">지식 기반이라는 표현을 같은 뜻의 관용구로 바꿨어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">better the human condition\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">improve the human condition\u003c/span>\u003cspan class=\"y-eq\">better = improve\u003c/span>\u003cdiv class=\"w\">동사 better를 가장 기본적인 유의어로 바꿨어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Every time a geneticist reveals new secrets of the DNA molecule, our knowledge base grows and we are able to improve human life.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"DNA의 비밀이 하나씩 밝혀질 때마다 우리 지식이 쌓이고, 그 덕분에 인간의 삶이 나아진다는 뜻이에요. 과학적 발견이 인류의 발전으로 이어진다는 이야기죠.","hl":"mn"},{"n":72,"text":"Whenever a geneticist unlocks new secrets는 Every time a geneticist reveals new secrets로 바꿀 수 있어요. enables us to better the human condition은 makes it possible for us to improve human life로 풀어 쓰면 훨씬 이해하기 쉽습니다.","hl":"rw"},{"n":73,"text":"unlock secrets는 reveal secrets로, better the human condition은 improve the human condition으로 바꿀 수 있어요. add to our knowledge base는 expand our body of knowledge로 바꿔도 같은 뜻입니다.","hl":"ph"},{"n":74,"text":"마지막으로 같은 뜻의 문장을 읽어 볼게요. Every time a geneticist reveals new secrets of the DNA molecule, our knowledge base grows and we are able to improve human life. Whenever를 Every time으로 바꾸고 동사들을 쉬운 말로 바꾼 문장이에요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">once\u003c/b>, \u003cb class=\"key\">as soon as\u003c/b>는 조건과 즉시성을 나타내는 접속사 블록으로, 뒤에 주어와 동사가 있는 절이 온다.\u003c/li>\u003cli>\u003cb class=\"key\">each time\u003c/b>, \u003cb class=\"key\">the moment\u003c/b>, \u003cb class=\"key\">by the time\u003c/b>, \u003cb class=\"key\">whenever\u003c/b>는 명사구이지만 접속사처럼 절을 이끌어 시간의 의미를 만든다.\u003c/li>\u003cli>\u003cb class=\"key\">not ~ until\u003c/b>은 '~할 때까지는 …하지 않는다'로, until 뒤 절이 사건이 시작되는 시점을 정해 준다.\u003c/li>\u003cli>\u003cb class=\"key\">Hardly ~ when\u003c/b>, \u003cb class=\"key\">No sooner ~ than\u003c/b>은 부정어가 앞에 오면 had가 주어 앞으로 나오는 도치 구문이며, since 절은 주절의 현재완료와 짝을 이룬다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 시간과 조건을 알려 주는 접속사 블록들을 열두 문장으로 정리했어요. once와 as soon as, until, the moment, each time, by the time, whenever, 그리고 hardly와 no sooner가 이끄는 도치 구문까지 모두 우리 것이 되었죠. 특히 접속사 뒤에는 주어와 동사가 있는 온전한 절이 온다는 점, 부정어가 앞에 오면 조동사가 주어 앞으로 나온다는 점을 꼭 기억하세요. 오늘도 수고 많았고요, 다음 시간에 또 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
