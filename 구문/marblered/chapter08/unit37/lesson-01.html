lecturePlayer(document.getElementById("app"),{"brand":"unit37","title":"조건과 한정을 말하는 접속사","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">조건·한정 부사절: if, unless, as long as, provided that, in so far as, as far as, while\u003c/div>\u003ch1>조건과 한정을 말하는 접속사\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>조건과 한정을 나타내는 부사절 접속사의 의미와 역할을 익혀 문장을 정확히 해석하고 자연스럽게 바꿔 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 조건과 한정을 나타내는 부사절 접속사를 배워 볼 거예요. if, unless, as long as, provided that, in so far as, as far as, while이 문장에서 어떤 역할을 하는지 차근차근 살펴보겠습니다. 예문 열두 개를 통해 해석부터 패러프레이징까지 함께 연습해 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">조건·한정 부사절: if, unless, as long as, provided that, in so far as, as far as, while\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">조건·한정 부사절은 주절의 내용이 성립하는 \u003cb class=\"key\">조건\u003c/b>이나 \u003cb class=\"key\">범위\u003c/b>를 제시한다. \u003cb class=\"key\">if\u003c/b>는 '만약 ~라면', \u003cb class=\"key\">unless\u003c/b>는 '만약 ~하지 않는다면', \u003cb class=\"key\">as long as\u003c/b>와 \u003cb class=\"key\">provided that\u003c/b>은 '~하는 한'으로 조건을 나타낸다. \u003cb class=\"key\">in so far as\u003c/b>와 \u003cb class=\"key\">as far as\u003c/b>는 '~하는 한/정도에서'로 범위를 한정하고, \u003cb class=\"key\">while\u003c/b>은 '~하는 동안' 또는 '반면에'로 시간이나 대조를 나타낸다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Differences of habit and language are nothing at all \u003cspan class=\"fx\">if our aims are identical and our hearts are open\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 A life devoted to the acquisition of wealth is useless, \u003cspan class=\"fx\">unless we know how to turn it into joy\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 \u003cspan class=\"fx\">In so far as changes in interest rates affect expectations\u003c/span>, lower interest rates may still contribute to higher investment.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 I don't care who you are, where you're from or what you did \u003cspan class=\"fx\">as long as you love me\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 A motion may be withdrawn by its proposer at any time before voting on it has commenced, \u003cspan class=\"fx\">provided that the motion has not been amended\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 \u003cspan class=\"fx\">If you wait for the mango fruits to fall\u003c/span>, you'd be wasting your time while others are learning how to climb the tree.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 You can't think creatively about information \u003cspan class=\"fx\">unless you have information in your head to think about\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">As far as we can discern\u003c/span>, the sole purpose of human existence is to kindle a light in the darkness of mere being.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 Mediation parallels advocacy \u003cspan class=\"fx\">in so far as it tends to involve a process of negotiation\u003c/span>, but differs in so far as mediation involves adopting a neutral role between two opposing parties rather than taking up the case of one party against another.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 An object that is moving at constant speed will eventually slow down and come to a stop \u003cspan class=\"fx\">unless there is something to keep it moving at constant speed\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Change may hurt us a little when it occurs, but \u003cspan class=\"fx\">if we accept it as a growth process\u003c/span>, it will bring benefits in the long run.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 There is no fee for the card and no interest is charged \u003cspan class=\"fx\">provided that the account is settled in full every month\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘의 핵심은 조건과 한정을 나타내는 부사절이 주절의 내용을 어떻게 제한하느냐예요. if는 만약이라는 조건을, unless는 만약 그렇지 않다면이라는 조건을 만들어 줍니다. as long as와 provided that은 하는 한 또는 라면이라는 조건을, in so far as와 as far as는 어떤 범위까지라는 한정을 나타내죠. while은 동안이라는 시간이나 반면에라는 대조를 나타낼 때 쓸 수 있습니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Differences of habit and language are nothing at all \u003cspan class=\"fx\">if our aims are identical and our hearts are open\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Differences of habit and language \u003c/div>\u003cdiv class=\"k\">습관과 언어의 차이는\u003c/div>\u003cdiv class=\"e\">are nothing at all \u003c/div>\u003cdiv class=\"k\">전혀 아무것도 아니다\u003c/div>\u003cdiv class=\"e\">if our aims are identical \u003c/div>\u003cdiv class=\"k\">만약 우리의 목표가 동일하다면\u003c/div>\u003cdiv class=\"e\">and our hearts are open.\u003c/div>\u003cdiv class=\"k\">그리고 우리의 마음이 열려 있다면\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">if\u003c/b>가 이끄는 조건 부사절이 주절의 are nothing at all에 '목표가 같고 마음이 열려 있다'는 조건을 붙입니다. 즉 주절의 의미가 성립하는 조건을 제시하는 구조입니다.\u003c/div>","segs":[{"n":3,"text":"Differences of habit and language, 습관과 언어의 차이는. are nothing at all, 전혀 아무것도 아니다. if our aims are identical, 만약 우리의 목표가 동일하다면. and our hearts are open, 그리고 우리의 마음이 열려 있다면","hl":"ch"},{"n":4,"text":"첫 번째 문장에서는 if가 조건을 이끌고 있어요. if our aims are identical and our hearts are open이 주절의 are nothing at all에 조건을 붙여 주는 거죠. 즉 목표가 같고 마음이 열려 있다는 조건 아래에서 차이는 아무것도 아니라는 구조예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Differences of habit and language are nothing at all \u003cspan class=\"fx\">if our aims are identical and our hearts are open\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>습관과 언어가 달라도 목표와 마음이 같으면 그 차이는 문제가 되지 않는다는 뜻입니다. 겉의 차이보다 공통된 목표와 열린 마음이 중요하다는 함축이 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are nothing at all\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">do not matter at all\u003c/span>\u003cdiv class=\"w\">'전혀 아무것도 아니다'를 '전혀 문제가 되지 않는다'로 바꾸어 의미를 자연스럽게 살렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">if our aims are identical\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as long as our aims are identical\u003c/span>\u003cdiv class=\"w\">if 대신 as long as를 쓰면 같은 목표라는 조건을 더 강조하는 뉘앙스가 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nothing at all\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">not important at all\u003c/span>\u003cspan class=\"y-eq\">be nothing = not matter\u003c/span>\u003cdiv class=\"w\">존재 가치가 없다는 표현을 중요하지 않다는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">identical\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the same\u003c/span>\u003cspan class=\"y-eq\">identical = the same\u003c/span>\u003cdiv class=\"w\">같은이라는 뜻의 쉬운 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">our hearts are open\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">we are open-minded\u003c/span>\u003cspan class=\"y-eq\">hearts are open = be open-minded\u003c/span>\u003cdiv class=\"w\">마음이 열려 있다는 표현을 열린 사고를 가진다는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Differences in habits and language do not matter at all as long as we share the same goals and keep our hearts open.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 겉으로 보이는 습관과 언어의 차이보다 공통된 목표와 열린 마음이 더 중요하다는 뜻이에요. 그래서 서로 다르게 보여도 마음이 통하면 그 차이는 문제가 되지 않는다고 말하는 거죠.","hl":"mn"},{"n":6,"text":"are nothing at all은 do not matter at all로 바꿔 쓸 수 있어요. if 대신 as long as를 쓰면 같은 목표와 열린 마음이라는 조건을 더 강조하는 느낌을 줄 수 있습니다.","hl":"rw"},{"n":7,"text":"nothing at all은 not important at all로 이해하면 자연스러워요. identical은 the same으로 바꿀 수 있고, hearts are open은 we are open-minded처럼 표현할 수 있습니다.","hl":"ph"},{"n":8,"text":"전체 뜻을 바꿔 말하면 Differences in habits and language do not matter at all as long as we share the same goals and keep our hearts open이라고 할 수 있어요. 같은 조건과 같은 의미를 자연스러운 영어로 다시 말한 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 A life devoted to the acquisition of wealth is useless, \u003cspan class=\"fx\">unless we know how to turn it into joy\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A life devoted to the acquisition of wealth \u003c/div>\u003cdiv class=\"k\">부의 획득에 바쳐진 인생은\u003c/div>\u003cdiv class=\"e\">is useless, \u003c/div>\u003cdiv class=\"k\">쓸모없다\u003c/div>\u003cdiv class=\"e\">unless we know how to turn it into joy.\u003c/div>\u003cdiv class=\"k\">만약 우리가 그것을 즐거움으로 바꾸는 방법을 알지 못한다면\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">unless\u003c/b>가 이끄는 조건 부사절이 '그것을 즐거움으로 바꾸는 방법을 모른다면'이라는 부정 조건을 제시합니다. 주절의 is useless가 성립하는 조건을 한정합니다.\u003c/div>","segs":[{"n":9,"text":"A life devoted to the acquisition of wealth, 부의 획득에 바쳐진 인생은. is useless, 쓸모없다. unless we know how to turn it into joy, 만약 우리가 그것을 즐거움으로 바꾸는 방법을 알지 못한다면","hl":"ch"},{"n":10,"text":"두 번째 문장에서는 unless가 부정 조건을 이끌고 있어요. unless we know how to turn it into joy는 우리가 그것을 즐거움으로 바꾸는 방법을 모른다면이라는 조건을 만들어 주죠. 그래서 주절의 is useless가 어떤 경우에 성립하는지 한정해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 A life devoted to the acquisition of wealth is useless, \u003cspan class=\"fx\">unless we know how to turn it into joy\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>부를 모으는 데만 바친 삶은 그것을 기쁨으로 바꾸지 못하면 쓸모없다는 뜻입니다. 돈 자체보다 돈을 행복으로 전환하는 능력이 중요하다는 함축이 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unless we know how to turn it into joy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">if we do not know how to turn it into joy\u003c/span>\u003cdiv class=\"w\">unless를 if not으로 풀어 조건을 분명하게 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">A life devoted to the acquisition of wealth\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">A life spent only on gaining wealth\u003c/span>\u003cdiv class=\"w\">부를 얻는 데 바친 삶이라는 뜻을 더 쉬운 말로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">devoted to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">dedicated to\u003c/span>\u003cspan class=\"y-eq\">devoted to = dedicated to\u003c/span>\u003cdiv class=\"w\">바쳐진이라는 뜻을 비슷한 dedicate to로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">acquisition of wealth\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">gaining wealth\u003c/span>\u003cspan class=\"y-eq\">acquisition = gaining\u003c/span>\u003cdiv class=\"w\">획득이라는 명사 표현을 동사 표현으로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">turn it into joy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">convert it into happiness\u003c/span>\u003cspan class=\"y-eq\">turn into = convert into\u003c/span>\u003cdiv class=\"w\">바꾸다라는 뜻을 convert into로 바꾸고 joy를 happiness로 쉽게 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A life spent only on gaining wealth is worthless if we do not know how to turn that wealth into happiness.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 부를 모으는 데만 바친 삶은 그것을 기쁨으로 바꾸지 못하면 쓸모없다는 뜻이에요. 결국 중요한 것은 돈을 많이 모으는 것보다 돈을 행복으로 바꾸는 능력이라는 걸 말해 줍니다.","hl":"mn"},{"n":12,"text":"unless we know how to turn it into joy는 if we do not know how to turn it into joy로 바꿔 쓸 수 있어요. A life devoted to the acquisition of wealth는 A life spent only on gaining wealth처럼 더 쉬운 표현으로 바꿀 수 있습니다.","hl":"rw"},{"n":13,"text":"devoted to는 dedicated to로 바꿀 수 있고, acquisition of wealth는 gaining wealth로 풀어 쓸 수 있어요. turn it into joy는 convert it into happiness처럼 표현할 수 있습니다.","hl":"ph"},{"n":14,"text":"전체 문장을 바꾸면 A life spent only on gaining wealth is worthless if we do not know how to turn that wealth into happiness라고 말할 수 있어요. 같은 뜻을 더 쉬운 어구로 다시 구성한 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 \u003cspan class=\"fx\">In so far as changes in interest rates affect expectations\u003c/span>, lower interest rates may still contribute to higher investment.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">In so far as changes in interest rates affect expectations, \u003c/div>\u003cdiv class=\"k\">이자율의 변화가 기대에 영향을 미치는 한에서\u003c/div>\u003cdiv class=\"e\">lower interest rates may still contribute \u003c/div>\u003cdiv class=\"k\">더 낮은 이자율은 여전히 기여할 수 있다\u003c/div>\u003cdiv class=\"e\">to higher investment.\u003c/div>\u003cdiv class=\"k\">더 높은 투자에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">In so far as\u003c/b>가 '이자율의 변화가 기대에 영향을 미치는 정도까지'라는 범위를 한정합니다. 주절의 may still contribute가 어느 범위에서 성립하는지 제시합니다.\u003c/div>","segs":[{"n":15,"text":"In so far as changes in interest rates affect expectations, 이자율의 변화가 기대에 영향을 미치는 한에서. lower interest rates may still contribute, 더 낮은 이자율은 여전히 기여할 수 있다. to higher investment, 더 높은 투자에","hl":"ch"},{"n":16,"text":"세 번째 문장에서는 In so far as가 범위를 한정하고 있어요. 이자율의 변화가 기대에 영향을 미치는 한에서라는 뜻으로 주절의 내용이 어디까지 성립하는지 알려 주죠. 그래서 lower interest rates may still contribute to higher investment가 그 범위 안에서 가능하다는 구조예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 \u003cspan class=\"fx\">In so far as changes in interest rates affect expectations\u003c/span>, lower interest rates may still contribute to higher investment.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이자율 변화가 사람들의 기대에 영향을 주는 범위 안에서는 낮은 이자율이 투자를 늘리는 데 도움이 될 수 있다는 뜻입니다. 모든 경우가 아니라 기대에 영향을 줄 때로 범위를 좁힌 표현입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">In so far as changes in interest rates affect expectations\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">To the extent that changes in interest rates influence expectations\u003c/span>\u003cdiv class=\"w\">In so far as를 To the extent that으로 습니다.","hl":"rw"},{"n":19,"text":"affect expectations는 influence expectations로 바꿀 수 있고, contribute to는 lead to로 이해할 수 있어요. higher investment는 increased investment처럼 더 쉬운 표현으로 바꿀 수 있습니다.","hl":"ph"},{"n":20,"text":"전체 문장을 바꾸면 To the extent that changes in interest rates influence expectations, lower rates can still lead to more investment라고 말할 수 있어요. 범위 한정의 뜻을 살려 자연스럽게 다시 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 I don't care who you are, where you're from or what you did \u003cspan class=\"fx\">as long as you love me\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I don't care \u003c/div>\u003cdiv class=\"k\">나는 상관하지 않는다\u003c/div>\u003cdiv class=\"e\">who you are, \u003c/div>\u003cdiv class=\"k\">당신이 누구인지\u003c/div>\u003cdiv class=\"e\">where you're from \u003c/div>\u003cdiv class=\"k\">당신이 어디 출신인지\u003c/div>\u003cdiv class=\"e\">or what you did \u003c/div>\u003cdiv class=\"k\">또는 당신이 무엇을 했는지\u003c/div>\u003cdiv class=\"e\">as long as you love me.\u003c/div>\u003cdiv class=\"k\">당신이 나를 사랑하는 한\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">as long as\u003c/b>가 '네가 나를 사랑하는 한'이라는 조건을 이끕니다. 주절 I don't care의 내용이 성립하는 조건을 제시합니다.\u003c/div>","segs":[{"n":21,"text":"I don't care, 나는 상관하지 않는다. who you are, 당신이 누구인지. where you're from, 당신이 어디 출신인지. or what you did, 또는 당신이 무엇을 했는지. as long as you love me, 당신이 나를 사랑하는 한","hl":"ch"},{"n":22,"text":"네 번째 문장에서는 as long as가 조건을 이끌고 있어요. as long as you love me는 네가 나를 사랑하는 한이라는 조건을 만들어서 I don't care의 내용이 성립하는 범위를 정해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 I don't care who you are, where you're from or what you did \u003cspan class=\"fx\">as long as you love me\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>상대가 누구인지, 어디서 왔는지, 무엇을 했는지는 중요하지 않고 사랑한다는 조건만 중요하다는 뜻입니다. 조건 없는 사랑처럼 들리지만 실제로는 사랑이라는 조건이 붙어 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as long as you love me\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">provided that you love me\u003c/span>\u003cdiv class=\"w\">as long as와 같은 조건 표현 provided that으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I don't care who you are, where you're from or what you did\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">It doesn't matter to me who you are, where you come from, or what you have done\u003c/span>\u003cdiv class=\"w\">I don't care를 It doesn't matter to me로 풀어 더 공손하게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">don't care\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">don't mind\u003c/span>\u003cspan class=\"y-eq\">don't care = don't mind\u003c/span>\u003cdiv class=\"w\">상관하지 않는다는 표현을 꺼리지 않는다는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">where you're from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">your background\u003c/span>\u003cspan class=\"y-eq\">where you're from = your background\u003c/span>\u003cdiv class=\"w\">출신지를 묻는 표현을 배경이라는 명사 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as long as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so long as\u003c/span>\u003cspan class=\"y-eq\">as long as = so long as\u003c/span>\u003cdiv class=\"w\">같은 조건을 나타내는 so long as로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">It doesn't matter to me who you are, where you come from, or what you have done, provided that you love me.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 상대가 누구인지, 어디 출신인지, 무엇을 했는지는 중요하지 않고 사랑한다는 조건만 중요하다는 뜻이에요. 그래서 사랑이 있으면 나머지는 상관없다는 뉘앙스를 줍니다.","hl":"mn"},{"n":24,"text":"as long as you love me는 provided that you love me로 바꿀 수 있어요. I don't care는 It doesn't matter to me로 바꾸면 조금 더 공손하고 자연스러운 느낌이 납니다.","hl":"rw"},{"n":25,"text":"don't care는 don't mind로 바꿀 수 있고, where you're from은 your background로 표현할 수 있어요. as long as는 so long as로도 바꿀 수 있습니다.","hl":"ph"},{"n":26,"text":"전체 문장을 바꾸면 It doesn't matter to me who you are, where you come from, or what you have done, provided that you love me라고 할 수 있어요. 같은 뜻을 조건 표현 provided that을 사용해 다시 말한 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 A motion may be withdrawn by its proposer at any time before voting on it has commenced, \u003cspan class=\"fx\">provided that the motion has not been amended\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A motion may be withdrawn \u003c/div>\u003cdiv class=\"k\">발의는 철회될 수 있다\u003c/div>\u003cdiv class=\"e\">by its proposer \u003c/div>\u003cdiv class=\"k\">그 제안자에 의해\u003c/div>\u003cdiv class=\"e\">at any time \u003c/div>\u003cdiv class=\"k\">언제라도\u003c/div>\u003cdiv class=\"e\">before voting on it has commenced, \u003c/div>\u003cdiv class=\"k\">그것에 대한 투표가 시작되기 전에\u003c/div>\u003cdiv class=\"e\">provided that the motion has not been amended.\u003c/div>\u003cdiv class=\"k\">그 발의가 수정되지 않았다면\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">provided that\u003c/b>이 '그 발의가 수정되지 않았다면'이라는 조건을 이끕니다. 앞의 may be withdrawn이라는 허가의 내용이 성립할 조건을 붙입니다.\u003c/div>","segs":[{"n":27,"text":"A motion may be withdrawn, 발의는 철회될 수 있다. by its proposer, 그 제안자에 의해. at any time, 언제라도. before voting on it has commenced, 그것에 대한 투표가 시작되기 전에. provided that the motion has not been amended, 그 발의가 수정되지 않았다면","hl":"ch"},{"n":28,"text":"다섯 번째 문장에서는 provided that이 조건을 이끌고 있어요. provided that the motion has not been amended는 그 발의가 수정되지 않았다면이라는 조건을 붙여서 앞의 may be withdrawn이 성립할 조건을 정해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 A motion may be withdrawn by its proposer at any time before voting on it has commenced, \u003cspan class=\"fx\">provided that the motion has not been amended\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>발의자는 투표가 시작되기 전이면 언제든지 발의를 철회할 수 있지만, 발의가 수정되지 않았다는 조건이 붙는다는 뜻입니다. 법이나 규정 문장에서 조건을 정확히 밝히는 표현입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">provided that the motion has not been amended\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">on condition that the motion has not been amended\u003c/span>\u003cdiv class=\"w\">provided that과 같은 조건 표현 on condition that으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">may be withdrawn\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can be withdrawn\u003c/span>\u003cdiv class=\"w\">규정상 허용되는 의미를 can으로 자연스럽게 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at any time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">whenever\u003c/span>\u003cspan class=\"y-eq\">at any time = whenever\u003c/span>\u003cdiv class=\"w\">언제라도라는 표현을 whenever로 간단히 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">commenced\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">begun\u003c/span>\u003cspan class=\"y-eq\">commenced = begun\u003c/span>\u003cdiv class=\"w\">시작되다라는 뜻의 어려운 단어를 쉬운 begin의 과거분사로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">amended\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">changed\u003c/span>\u003cspan class=\"y-eq\">amended = changed\u003c/span>\u003cdiv class=\"w\">수정되다라는 뜻을 일반적인 changed로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Its proposer can withdraw a motion at any time before voting on it begins, as long as the motion has not been changed.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 발의자가 투표가 시작되기 전이면 언제든지 발의를 철회할 수 있다는 뜻이에요. 단, 그 발의가 수정되지 않았다는 조건이 꼭 필요하다는 규정 문장입니다.","hl":"mn"},{"n":30,"text":"provided that the motion has not been amended는 on condition that the motion has not been amended로 바꿀 수 있어요. may be withdrawn은 can be withdrawn처럼 자연스럽게 바꿀 수 있습니다.","hl":"rw"},{"n":31,"text":"at any time은 whenever로 바꿀 수 있고, commenced는 begun으로, amended는 changed로 쉽게 풀 수 있어요. 그래서 규정 문장의 뜻을 더 분명하게 이해할 수 있습니다.","hl":"ph"},{"n":32,"text":"전체 문장을 바꾸면 Its proposer can withdraw a motion at any time before voting on it begins, as long as the motion has not been changed라고 말할 수 있어요. 조건과 허용의 의미를 살려 다시 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 \u003cspan class=\"fx\">If you wait for the mango fruits to fall\u003c/span>, you'd be wasting your time while others are learning how to climb the tree.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If you wait for the mango fruits to fall, \u003c/div>\u003cdiv class=\"k\">만약 당신이 망고 열매가 떨어지기를 기다린다면\u003c/div>\u003cdiv class=\"e\">you'd be wasting your time \u003c/div>\u003cdiv class=\"k\">당신은 당신의 시간을 낭비하고 있는 것이다\u003c/div>\u003cdiv class=\"e\">while others are learning \u003c/div>\u003cdiv class=\"k\">다른 사람들이 배우고 있는 동안에\u003c/div>\u003cdiv class=\"e\">how to climb the tree.\u003c/div>\u003cdiv class=\"k\">어떻게 그 나무에 올라갈지를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If\u003c/b>가 '망고 열매가 떨어지기를 기다린다면'이라는 조건을 이끌고, \u003cb class=\"key\">while\u003c/b>은 '다른 사람들이 나무에 오르는 방법을 배우고 있는 동안'이라는 시간을 나타냅니다. 두 부사절이 주절의 wasting your time을 상황에 맞게 한정합니다.\u003c/div>","segs":[{"n":33,"text":"If you wait for the mango fruits to fall, 만약 당신이 망고 열매가 떨어지기를 기다린다면. you'd be wasting your time, 당신은 당신의 시간을 낭비하고 있는 것이다. while others are learning, 다른 사람들이 배우고 있는 동안에. how to climb the tree, 어떻게 그 나무에 올라갈지를","hl":"ch"},{"n":34,"text":"여섯 번째 문장에서는 if가 조건을 이끌고 있어요. If you wait for the mango fruits to fall은 망고 열매가 떨어지기를 기다린다면이라는 조건을 만들어 주죠. 또 while은 다른 사람들이 나무에 오르는 방법을 배우고 있는 동안이라는 시간 상황을 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 \u003cspan class=\"fx\">If you wait for the mango fruits to fall\u003c/span>, you'd be wasting your time while others are learning how to climb the tree.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>가만히 기다리기만 하면 다른 사람들이 기술을 배우는 동안 시간을 낭비하게 된다는 뜻입니다. 기회를 기다리기보다 먼저 배우고 행동해야 한다는 함축이 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">If you wait for the mango fruits to fall\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If you just wait for the mangoes to fall\u003c/span>\u003cdiv class=\"w\">wait for에 just를 넣어 수동적으로 기다린다는 뉘 y-pair\">\u003cspan class=\"f\">sole\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">only\u003c/span>\u003cspan class=\"y-eq\">sole = only\u003c/span>\u003cdiv class=\"w\">유일한이라는 뜻을 쉬운 only로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">kindle a light\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">light a flame\u003c/span>\u003cspan class=\"y-eq\">kindle a light = light a flame\u003c/span>\u003cdiv class=\"w\">불을 밝히다라는 비유적 표현을 비슷한 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">To the best of our knowledge, the only purpose of human existence is to light a flame in the darkness of mere existence.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"이 문장은 우리가 알 수 있는 범위 안에서 인간 존재의 유일한 목적은 단순한 존재의 어둠 속에 빛을 밝히는 것이라는 뜻이에요. 삶의 의미를 어둠 속의 빛에 비유한 철학적인 문장입니다.","hl":"mn"},{"n":48,"text":"As far as we can discern은 To the best of our knowledge로 바꿀 수 있어요. the sole purpose of human existence는 the only purpose of human existence처럼 더 쉬운 표현으로 바꿀 수 있습니다.","hl":"rw"},{"n":49,"text":"discern은 perceive로 바꿀 수 있고, sole은 only로 바꿀 수 있어요. kindle a light는 light a flame처럼 비슷한 표현으로 바꿀 수 있습니다.","hl":"ph"},{"n":50,"text":"전체 문장을 바꾸면 To the best of our knowledge, the only purpose of human existence is to light a flame in the darkness of mere existence라고 말할 수 있어요. 범위 한정과 문학적인 느낌을 살려 다시 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 Mediation parallels advocacy \u003cspan class=\"fx\">in so far as it tends to involve a process of negotiation\u003c/span>, but differs in so far as mediation involves adopting a neutral role between two opposing parties rather than taking up the case of one party against another.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Mediation parallels advocacy \u003c/div>\u003cdiv class=\"k\">중재는 옹호와 유사하다\u003c/div>\u003cdiv class=\"e\">in so far as it tends to involve \u003c/div>\u003cdiv class=\"k\">그것이 수반하는 경향이 있다는 점에서\u003c/div>\u003cdiv class=\"e\">a process of negotiation, \u003c/div>\u003cdiv class=\"k\">협상의 과정을\u003c/div>\u003cdiv class=\"e\">but differs \u003c/div>\u003cdiv class=\"k\">그러나 다르다\u003c/div>\u003cdiv class=\"e\">in so far as mediation involves adopting \u003c/div>\u003cdiv class=\"k\">중재가 채택하는 것을 수반한다는 점에서\u003c/div>\u003cdiv class=\"e\">a neutral role \u003c/div>\u003cdiv class=\"k\">중립적인 역할을\u003c/div>\u003cdiv class=\"e\">between two opposing parties \u003c/div>\u003cdiv class=\"k\">대립하는 두 당사자들 사이에서\u003c/div>\u003cdiv class=\"e\">rather than taking up the case \u003c/div>\u003cdiv class=\"k\">한쪽 편의 입장을 취하기보다는\u003c/div>\u003cdiv class=\"e\">of one party against another.\u003c/div>\u003cdiv class=\"k\">다른 편에 반대하여\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">in so far as\u003c/b>가 두 번 쓰여 각각 '협상 과정을 수반하는 점에서'와 '중립적 역할을 취하는 점에서'라는 범위를 제시합니다. 유사점과 차이점을 같은 구문으로 대조합니다.\u003c/div>","segs":[{"n":51,"text":"Mediation parallels advocacy, 중재는 옹호와 유사하다. in so far as it tends to involve, 그것이 수반하는 경향이 있다는 점에서. a process of negotiation, 협상의 과정을. but differs, 그러나 다르다. in so far as mediation involves adopting, 중재가 채택하는 것을 수반한다는 점에서. a neutral role, 중립적인 역할을. between two opposing parties, 대립하는 두 당사자들 사이에서. rather than taking up the case, 한쪽 편의 입장을 취하기보다는. of one party against another, 다른 편에 반대하여","hl":"ch"},{"n":52,"text":"아홉 번째 문장에서는 in so far as가 두 번 나와요. 처음에는 협상의 과정을 수반하는 점에서라는 범위를, 두 번째에는 중립적인 역할을 취하는 점에서라는 범위를 나타내죠. 그래서 중재가 옹호와 비슷한 점과 다른 점을 같은 구문으로 대조해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 Mediation parallels advocacy \u003cspan cla of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">supporting\u003c/span>\u003cspan class=\"y-eq\">take up the case of = support\u003c/span>\u003cdiv class=\"w\">한쪽 편의 입장을 취한다는 표현을 support로 간단히 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Mediation is similar to advocacy in that it tends to involve negotiation, but it differs in that mediation means taking a neutral role between two opposing parties instead of supporting one party against the other.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 중재가 협상을 수반한다는 점에서는 옹호와 비슷하지만, 두 당사자 사이에서 중립적인 역할을 한다는 점에서는 다르다는 뜻이에요. 한쪽 편을 드는 옹호와 중립을 지키는 중재를 대조하고 있습니다.","hl":"mn"},{"n":54,"text":"in so far as it tends to involve a process of negotiation은 to the extent that it tends to involve a process of negotiation로 바꿀 수 있어요. rather than taking up the case of one party against another는 instead of supporting one party against another처럼 표현할 수 있습니다.","hl":"rw"},{"n":55,"text":"parallels는 is similar to로 풀 수 있고, opposing parties는 parties in conflict로 바꿀 수 있어요. taking up the case of는 supporting으로 간단히 표현할 수 있습니다.","hl":"ph"},{"n":56,"text":"전체 문장을 바꾸면 Mediation is similar to advocacy in that it tends to involve negotiation, but it differs in that mediation means taking a neutral role between two opposing parties instead of supporting one party against the other라고 말할 수 있어요. 유사점과 차이점을 자연스럽게 다시 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 An object that is moving at constant speed will eventually slow down and come to a stop \u003cspan class=\"fx\">unless there is something to keep it moving at constant speed\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">An object that is moving at constant speed \u003c/div>\u003cdiv class=\"k\">일정한 속도로 움직이고 있는 물체는\u003c/div>\u003cdiv class=\"e\">will eventually slow down \u003c/div>\u003cdiv class=\"k\">마침내 느려질 것이다\u003c/div>\u003cdiv class=\"e\">and come to a stop \u003c/div>\u003cdiv class=\"k\">그리고 멈추게 될 것이다\u003c/div>\u003cdiv class=\"e\">unless there is something \u003c/div>\u003cdiv class=\"k\">만약 어떤 것이 없다면\u003c/div>\u003cdiv class=\"e\">to keep it moving at constant speed.\u003c/div>\u003cdiv class=\"k\">그것을 일정한 속도로 계속 움직이게 하는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">unless\u003c/b>가 '그것을 일정한 속도로 계속 움직이게 하는 어떤 것이 없다면'이라는 부정 조건을 이끕니다. 주절의 slow down and come to a stop이 성립하는 조건을 제시합니다.\u003c/div>","segs":[{"n":57,"text":"An object that is moving at constant speed, 일정한 속도로 움직이고 있는 물체는. will eventually slow down, 마침내 느려질 것이다. and come to a stop, 그리고 멈추게 될 것이다. unless there is something, 만약 어떤 것이 없다면. to keep it moving at constant speed, 그것을 일정한 속도로 계속 움직이게 하는","hl":"ch"},{"n":58,"text":"열 번째 문장에서는 unless가 부정 조건을 이끌고 있어요. unless there is something to keep it moving at constant speed는 그것을 일정한 속도로 계속 움직이게 하는 어떤 것이 없다면이라는 조건을 만들어 줍니다. 그래서 앞의 slow down and come to a stop이 어떤 경우에 일어나는지 알려 주죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 An object that is moving at constant speed will eventually slow down and come to a stop \u003cspan class=\"fx\">unless there is something to keep it moving at constant speed\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>일정한 속도로 움직이는 물체도 계속 움직이게 하는 것이 없으면 결국 느려져 멈춘다는 뜻입니다. 관성이나 외부 힘의 필요성을 설명하는 과학 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unless there is something to keep it moving at constant speed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">if there is nothing to keep it moving at a constant speed\u003c/span>\u003cdiv class=\"w\">unless를 if nothing으로 풀어 부정 조건을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">come to a stop\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stop\u003c/span>\u003cdiv class=\"w\">멈추게 되다는 표현을 간단한 stop으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at constant speed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at a steady speed\u003c/span>\u003cspan class=\"y-eq\">constant = steady\u003c/span>\u003cdiv class=\"w\">일정한 속도라는 표현을 꾸준한 속도라는 쉬운 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">slow down\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">decelerate\u003c/span>\u003cspan class=\"y-eq\">slow down = decelerate\u003c/span>\u003cdiv class=\"w\">느려지다라는 표현을 과학 문맥의 decelerate로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">keep it moving\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">keep it in motion\u003c/span>\u003cspan class=\"y-eq\">keep moving = keep in motion\u003c/span>\u003cdiv class=\"w\">계속 움직이게 하다는 표현을 in motion을 써서 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">An object moving at a constant speed will eventually slow down and stop if nothing keeps it moving at that speed.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 일정한 속도로 움직이는 물체도 계속 움직이게 하는 것이 없으면 결국 느려져 멈춘다는 뜻이에요. 물체의 운동을 유지하려면 외부의 힘이나 조건이 필요하다는 점을 설명합니다.","hl":"mn"},{"n":60,"text":"unless there is something to keep it moving at constant speed는 if there is nothing to keep it moving at a constant speed로 바꿀 수 있어요. come to a stop은 stop으로 간단히 바꿀 수 있습니다.","hl":"rw"},{"n":61,"text":"at constant speed는 at a steady speed로 바꿀 수 있고, slow down은 decelerate로 표현할 수 있어요. keep it moving은 keep it in motion처럼 바꿀 수 있습니다.","hl":"ph"},{"n":62,"text":"전체 문장을 바꾸면 An object moving at a constant speed will eventually slow down and stop if nothing keeps it moving at that speed라고 말할 수 있어요. 부정 조건의 뜻을 살려 자연스럽게 다시 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 Change may hurt us a little when it occurs, but \u003cspan class=\"fx\">if we accept it as a growth process\u003c/span>, it will bring benefits in the long run.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Change may hurt us a little \u003c/div>\u003cdiv class=\"k\">변화는 우리를 약간 아프게 할 수도 있다\u003c/div>\u003cdiv class=\"e\">when it occurs, \u003c/div>\u003cdiv class=\"k\">그것이 일어날 때\u003c/div>\u003cdiv class=\"e\">but if we accept it \u003c/div>\u003cdiv class=\"k\">그러나 만약 우리가 그것을 받아들인다면\u003c/div>\u003cdiv class=\"e\">as a growth process, \u003c/div>\u003cdiv class=\"k\">성장 과정으로\u003c/div>\u003cdiv class=\"e\">it will bring benefits \u003c/div>\u003cdiv class=\"k\">그것은 이익을 가져다줄 것이다\u003c/div>\u003cdiv class=\"e\">in the long run.\u003c/div>\u003cdiv class=\"k\">결국에는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">if\u003c/b>가 '우리가 그것을 성장 과정으로 받아들인다면'이라는 조건을 이끕니다. 앞의 when절과 함께 변화가 일어날 때와 우리가 받아들이는 조건을 구분해 줍니다.\u003c/div>","segs":[{"n":63,"text":"Change may hurt us a little, 변화는 우리를 약간 아프게 할 수도 있다. when it occurs, 그것이 일어날 때. but if we accept it, 그러나 만약 우리가 그것을 받아들인다면. as a growth process, 성장 과정으로. it will bring benefits, 그것은 이익을 가져다줄 것이다. in the long run, 결국에는","hl":"ch"},{"n":64,"text":"열한 번째 문장에서는 if가 조건을 이끌고 있어요. if we accept it as a growth process는 우리가 그것을 성장 과정으로 받아들인다면이라는 조건을 만들어 줍니다. 앞의 when it occurs는 변화가 일어날 때라는 시간 상황을 나타내죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 Change may hurt us a little when it occurs, but \u003cspan class=\"fx\">if we accept it as a growth process\u003c/span>, it will bring benefits in the long run.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>변화는 일어날 때 약간 힘들 수 있지만 성장 과정으로 받아들이면 결국 이익이 된다는 뜻입니다. 변화에 대한 태도가 결과를 바꾼다는 함축이 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">if we accept it as a growth process\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">if we regard it as a growth process\u003c/span>\u003cdiv class=\"w\">accept as를 regard as로 바꾸어 '여기다'라는 뜻을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in the long run\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">eventually\u003c/span>\u003cdiv class=\"w\">결국에는이라는 뜻을 eventually로 간단히 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">occurs\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">happens\u003c/span>\u003cspan class=\"y-eq\">occur = happen\u003c/span>\u003cdiv class=\"w\">일어나다라는 뜻을 쉬운 happen으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">accept it as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regard it as\u003c/span>\u003cspan class=\"y-eq\">accept as = regard as\u003c/span>\u003cdiv class=\"w\">받아들이다라는 표현을 여기다라는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">bring benefits\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">provide benefits\u003c/span>\u003cspan class=\"y-eq\">bring benefits = provide benefits\u003c/span>\u003cdiv class=\"w\">이익을 가져다주다라는 뜻을 provide benefits로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Change can cause us a little pain when it happens, but if we see it as a part of growth, it will benefit us in the long run.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 변화가 일어날 때는 우리를 약간 아프게 할 수 있지만, 그것을 성장 과정으로 받아들이면 결국 이익을 가져다준다는 뜻이에요. 변화 자체보다 변화를 대하는 태도가 중요하다는 점을 말해 줍니다.","hl":"mn"},{"n":66,"text":"if we accept it as a growth process는 if we regard it as a growth process로 바꿀 수 있어요. in the long run은 eventually로 간단히 바꿀 수 있습니다.","hl":"rw"},{"n":67,"text":"occurs는 happens로 바꿀 수 있고, accept it as는 regard it as로 바꿀 수 있어요. bring benefits는 provide benefits처럼 표현할 수 있습니다.","hl":"ph"},{"n":68,"text":"전체 문장을 바꾸면 Change can cause us a little pain when it happens, but if we see it as a part of growth, it will benefit us in the long run이라고 말할 수 있어요. 조건과 결론의 흐름을 살려 다시 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 There is no fee for the card and no interest is charged \u003cspan class=\"fx\">provided that the account is settled in full every month\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">There is no fee for the card \u003c/div>\u003cdiv class=\"k\">카드에 대한 수수료가 없다\u003c/div>\u003cdiv class=\"e\">and no interest is charged \u003c/div>\u003cdiv class=\"k\">그리고 이자는 청구되지 않는다\u003c/div>\u003cdiv class=\"e\">provided that the account is settled \u003c/div>\u003cdiv class=\"k\">만약 그 계좌가 결제된다면\u003c/div>\u003cdiv class=\"e\">in full \u003c/div>\u003cdiv class=\"k\">전액\u003c/div>\u003cdiv class=\"e\">every month.\u003c/div>\u003cdiv class=\"k\">매월\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">provided that\u003c/b>이 '그 계좌가 매월 전액 결제된다면'이라는 조건을 이끕니다. 앞의 no fee와 no interest is charged라는 내용이 성립할 조건을 제시합니다.\u003c/div>","segs":[{"n":69,"text":"There is no fee for the card, 카드에 대한 수수료가 없다. and no interest is charged, 그리고 이자는 청구되지 않는다. provided that the account is settled, 만약 그 계좌가 결제된다면. in full, 전액. every month, 매월","hl":"ch"},{"n":70,"text":"열두 번째 문장에서는 provided that이 조건을 이끌고 있어요. provided that the account is settled in full every month는 그 계좌가 매월 전액 결제된다면이라는 조건을 만들어 줍니다. 그래서 앞의 no fee와 no interest is charged가 성립할 조건을 정해 주죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 There is no fee for the card and no interest is charged \u003cspan class=\"fx\">provided that the account is settled in full every month\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>카드 수수료가 없고 이자도 청구되지 않는다는 뜻이지만, 매달 계좌가 전액 결제되어야 한다는 조건이 붙습니다. 혜택에는 조건이 따른다는 함축이 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">provided that the account is settled in full every month\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as long as the account is paid in full each month\u003c/span>\u003cdiv class=\"w\">provided that을 as long as로, settled를 paid로 바꿔 더 자연스럽게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">no interest is charged\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">no interest is billed\u003c/span>\u003cdiv class=\"w\">이자가 청구된다는 표현을 billed로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">no fee\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">no charge\u003c/span>\u003cspan class=\"y-eq\">fee = charge\u003c/span>\u003cdiv class=\"w\">수수료라는 뜻을 비슷한 charge로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">settled in full\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">paid in full\u003c/span>\u003cspan class=\"y-eq\">settle = pay\u003c/span>\u003cdiv class=\"w\">결제하다라는 뜻을 쉬운 pay로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">every month\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">each month\u003c/span>\u003cspan class=\"y-eq\">every = each\u003c/span>\u003cdiv class=\"w\">매월이라는 표현을 each month로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The card has no fee and no interest is charged as long as the account is paid in full each month.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 카드에 수수료가 없고 이자도 청구되지 않는다는 뜻이에요. 하지만 매달 계좌가 전액 결제되어야 한다는 조건이 꼭 붙는다는 점을 기억해야 합니다.","hl":"mn"},{"n":72,"text":"provided that the account is settled in full every month는 as long as the account is paid in full each month로 바꿀 수 있어요. no interest is charged는 no interest is billed처럼 표현할 수 있습니다.","hl":"rw"},{"n":73,"text":"no fee는 no charge로 바꿀 수 있고, settled in full은 paid in full로 풀 수 있어요. every month는 each month로 바꿔도 같은 뜻입니다.","hl":"ph"},{"n":74,"text":"전체 문장을 바꾸면 The card has no fee and no interest is charged as long as the account is paid in full each month라고 말할 수 있어요. 혜택과 조건의 관계를 자연스럽게 다시 쓴 문장입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">조건·한정 부사절: if, unless, as long as, provided that, in so far as, as far as, while\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">if\u003c/b>와 \u003cb class=\"key\">unless\u003c/b>는 각각 긍정 조건과 부정 조건을 이끈다.\u003c/li>\u003cli>\u003cb class=\"key\">as long as\u003c/b>와 \u003cb class=\"key\">provided that\u003c/b>은 '~하는 한'이라는 조건을 나타낸다.\u003c/li>\u003cli>\u003cb class=\"key\">in so far as\u003c/b>와 \u003cb class=\"key\">as far as\u003c/b>는 '~하는 한/정도에서'로 범위를 한정한다.\u003c/li>\u003cli>\u003cb class=\"key\">while\u003c/b>은 시간이나 대조를 나타내며, 조건 부사절은 주절의 의미를 제한한다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 조건과 한정을 나타내는 부사절 접속사를 배웠어요. if와 unless는 긍정 조건과 부정 조건을 만들어 주고, as long as와 provided that은 하는 한이라는 조건을 나타냅니다. in so far as와 as far as는 어떤 범위까지를 한정하고, while은 동안이나 반면에의 느낌을 줍니다. 이 접속사들이 주절의 의미를 어떻게 제한하는지 생각하면서 예문을 다시 읽어 보세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
