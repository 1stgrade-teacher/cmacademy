words for Online Security<small>온라인 보안을 위한 고유한 비밀번호의 중요성</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 온라인 세상에서 비밀번호를 하나로만 통일해서 쓰는 습관이 얼마나 위험한지 들어본 적 있나요? 정보보안(Information Security) 분야에서는 이를 &#39;비밀번호 재사용(Password Reuse)&#39;이라고 부르는데, 해커들이 한 곳의 사이트만 뚫어도 여러분의 모든 계정을 쉽게 탈취할 수 있다는 치명적인 단점이 있어요. 마치 도둑이 집에 들어왔을 때, 현관문 열쇠 하나로 안방, 옷장, 금고까지 다 열 수 있게 만드는 것과 비슷하죠. 그래서 보안 전문가들은 사이트마다 서로 다른 비밀번호를 사용하는 것이 가장 기본적인 개인정보 보호 수칙이라고 항상 강조합니다. 만약 한 사이트에서 개인정보 유출 사고가 발생한다면, 피해 확산을 막기 위해 즉시 다른 곳의 비밀번호까지 변경하는 &#39;도미노 피해 방지&#39; 전략이 반드시 필요하답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 파악</div><ul><li>다른 웹사이트에서 동일한 비밀번호를 사용하는 상황을 가정합니다.</li><li>현재 사용 중인 비밀번호(password)를 다른 사이트에서도 사용 중일 때</li><li>보안(security) 측면에서 취약점이 발생할 수 있음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02권고 사항</div><ul><li>사용자에게 다른 사이트의 비밀번호도 변경할 것을 권장합니다.</li><li>비밀번호를 즉시 변경(change)하도록 유도</li><li>사용 중인 모든 사이트에 대해 동일한 보안 조치 적용</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03기대 효과</div><ul><li>비밀번호 변경을 통해 개인정보 유출을 예방합니다.</li><li>계정 탈취(account theft) 및 정보 유출 위험 감소</li><li>다중 사이트 보안 강화(strengthen security)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">password</td><td class=\"m\">비밀번호</td></tr><tr><td class=\"w\">site</td><td class=\"m\">사이트, 웹사이트</td></tr><tr><td class=\"w\">encourage</td><td class=\"m\">권장하다, 장려하다</td></tr><tr><td class=\"w\">as well</td><td class=\"m\">또한, 마찬가지로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 사용했다면</span><span class=\"en\"><b><span class=\"grammar-hl\">If you used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같은 비밀번호를</span><span class=\"en\"><b>the same password</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 다른 사이트에서라도,</span><span class=\"en\"><b>on any other site,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 당신이 바꾸기를 권장한다</span><span class=\"en\"><b>we <span class=\"grammar-hl\">encourage you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 비밀번호를</span><span class=\"en\"><b><span class=\"grammar-hl\">to change</span> your password</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거기서도 또한</span><span class=\"en\"><b>there as well.</b></span></div></div><div class=\"lec-sent-ko\">만약 당신이 어떤 다른 사이트에서 같은 비밀번호를 사용했다면 우리는 당신이 거기서도 또한 당신의 비밀번호를 바꾸기를 권장한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 계정이 해킹되었거나 보안 문제가 발생했을 가능성을 염두에 두고, 사용자가 가진 다른 계정들도 위험에 노출되지 않도록 조치하라는 경고성 조언입니다. 여기서 encourage는 사전적으로 &#39;격려하다, 용기를 북돋우다&#39;라는 뜻이지만, 여기서는 보안을 위해 사용자가 스스로 행동을 취하도록 강력하게 &#39;권고하거나 재촉한다&#39;는 의미로 쓰였습니다. 단순히 응원하는 것이 아니라, 보안 사고를 예방하기 위해 반드시 해야 할 일을 안내하고 있음을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If you used (분사구문(가정)): &#39;If + 주어(you) + 동사(used) ...&#39;의 구조로, 문맥상 조건을 나타내는 가정법 과거 절이다.</div><div class=\"lec-gr-item\">encourage you to change 5형식(SVOC) 구조: encourage(V) + you(O) + to change(OC) 형태이며, 목적어인 you가 to부정사(to change)를 하도록 독려한다는 의미의 구조이다.</div><div class=\"lec-gr-item\">to change (to부정사): 5형식 구조의 목적보어로 사용되어, 목적어가 수행할 동작(변경하는 것)을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">password</td><td class=\"m\">비밀번호</td></tr><tr><td class=\"w\">site</td><td class=\"m\">사이트, 웹사이트</td></tr><tr><td class=\"w\">encourage</td><td class=\"m\">권장하다, 장려하다</td></tr><tr><td class=\"w\">as well</td><td class=\"m\">또한, 마찬가지로</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>보안상의 이유로 현재 사이트의 비밀번호를 변경해야 한다.</li><li>만약 다른 사이트에서도 같은 비밀번호를 썼다면, 그곳의 비밀번호도 즉시 변경해야 한다.</li><li>동일한 비밀번호 사용은 해킹 위험을 높이므로 모두 다르게 설정하는 것이 안전하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">You should change your passwords on other sites because reusing the same password across multiple platforms poses a security risk.</div>\n              <div class=\"lec-final-sum-ko\">여러 플랫폼에서 동일한 비밀번호를 재사용하는 것은 보안상 위험하므로, 다른 사이트에서도 비밀번호를 변경해야 한다.</div></div></div>"],"segs":[[{"audio":"./unit17_03_강의_audio/1.mp3","hl":null}],[{"audio":"./unit17_03_강의_audio/2.mp3","hl":null}],[{"audio":"./unit17_03_강의_audio/3.mp3","hl":null},{"audio":"./unit17_03_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit17_03_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit17_03_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit17_03_강의_audio/7.mp3","hl":null}],[{"audio":"./unit17_03_강의_audio/8.mp3","hl":"main"},{"audio":"./unit17_03_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit17_03_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit17_03_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);
