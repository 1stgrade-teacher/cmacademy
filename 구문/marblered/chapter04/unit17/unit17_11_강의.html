인격(character)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">marry</td><td class=\"m\">결혼하다</td></tr><tr><td class=\"w\">person</td><td class=\"m\">사람</td></tr><tr><td class=\"w\">make</td><td class=\"m\">~하게 시키다 (사역동사)</td></tr><tr><td class=\"w\">service</td><td class=\"m\">서비스, 공급</td></tr><tr><td class=\"w\">see</td><td class=\"m\">알다, 확인하다</td></tr><tr><td class=\"w\">really</td><td class=\"m\">실제로, 진정으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 결혼하기 전에</span><span class=\"en\"><b>Before you marry</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람과,</span><span class=\"en\"><b>a person,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 먼저 해야 한다</span><span class=\"en\"><b>you should first</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 사용하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">make them use</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">컴퓨터를</span><span class=\"en\"><b>a computer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">느린 인터넷 서비스가 있는</span><span class=\"en\"><b>with slow Internet service</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알아보기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 정말 누구인지</span><span class=\"en\"><b><span class=\"grammar-hl\">who they really are</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신이 어떤 사람과 결혼하기 전에 당신은 먼저 그들이 정말 어떤 사람인지 보기 위해서 그들이 느린 인터넷 서비스로 컴퓨터를 사용하게 시켜야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 결혼이라는 중요한 결정을 내리기 전에 상대방의 본모습을 확인하는 방법으로 &#39;느린 인터넷&#39;이라는 상황을 제시합니다. 여기서 make는 사전적으로 &#39;만들다&#39;이지만, 여기서는 상대방에게 특정 상황을 경험하게끔 유도하거나 시험해 본다는 의미로 쓰였습니다. 필자는 인터넷이 느려 답답한 상황에서 사람이 보이는 반응(짜증, 인내심 등)이 그 사람의 실체를 가장 잘 드러낸다는 점을 강조하려고 이 단어를 골랐습니다. 또한 see는 눈으로 보는 것을 넘어 상대의 인격이나 성품을 &#39;파악하다&#39;는 의미로 확장되어 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make them use 5형식(SVOC) 구조: make(사역동사) + 목적어(them) + 목적보어(use, 동사원형) 구조로, 목적어가 ~하게 만들다라는 의미를 가집니다.</div><div class=\"lec-gr-item\">to see to부정사(부사적 용법): 목적(~하기 위해서)을 나타내며, 앞의 make them use라는 행위의 의도를 설명합니다.</div><div class=\"lec-gr-item\">who they really are (간접의문문): 의문사(who) + 주어(they) + 동사(are) 어순으로, see의 목적어 역할을 하는 명사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">marry</td><td class=\"m\">결혼하다</td></tr><tr><td class=\"w\">person</td><td class=\"m\">사람</td></tr><tr><td class=\"w\">make</td><td class=\"m\">~하게 시키다 (사역동사)</td></tr><tr><td class=\"w\">service</td><td class=\"m\">서비스, 공급</td></tr><tr><td class=\"w\">see</td><td class=\"m\">알다, 확인하다</td></tr><tr><td class=\"w\">really</td><td class=\"m\">실제로, 진정으로</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>결혼과 같은 중대한 결정을 내리기 전에는 상대방의 본성을 확인해야 한다.</li><li>인터넷이 느린 상황은 사람의 인내심과 태도를 시험해 볼 수 있는 좋은 도구이다.</li><li>평소의 모습이 아닌, 곤란하거나 답답한 상황에서 드러나는 행동이 그 사람의 진짜 모습이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">You should observe how a person handles the frustration of slow internet, as this reveals their true character before you commit to marriage.</div>\n              <div class=\"lec-final-sum-ko\">결혼을 결심하기 전에 상대방이 인터넷 속도가 느린 상황에서 겪는 답답함을 어떻게 처리하는지 관찰하여 그들의 본성을 파악해야 한다.</div></div></div>"],"segs":[[{"audio":"./unit17_11_강의_audio/1.mp3","hl":null}],[{"audio":"./unit17_11_강의_audio/2.mp3","hl":null}],[{
