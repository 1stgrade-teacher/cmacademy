와 같은 실존적 질문(Existential questions)을 던지게 됩니다. 이는 철학에서 말하는 실존주의(Existentialism)와 깊은 관련이 있는데, 이는 인간이 세상에 던져진 존재로서 삶의 의미를 스스로 찾아가야 한다고 보는 관점이에요. 마치 끝이 정해진 게임을 할 때 그 시간을 어떻게 보낼지 고민하는 것과 비슷한 이치죠. 이처럼 시간의 한계(Finitude)를 깨닫는 과정은 우리를 불안하게 만들기도 하지만, 역설적으로 남은 시간을 더 가치 있게 보내도록 만드는 원동력이 되기도 한답니다. 이러한 고민은 심리학에서 말하는 노년기 발달 과업인 자아 통합(Ego integrity)을 이루기 위해 꼭 거쳐야 하는 성숙한 과정이라고 할 수 있어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01삶의 변화 인식</div><ul><li>나이가 들면서 우리는 시간의 흐름을 체감하고 인생을 돌아보게 된다.</li><li>노화(growing older)에 따른 현실 자각</li><li>남은 시간의 짧음(brevity)을 인식함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02존재에 대한 질문</div><ul><li>삶이 유한하다는 사실은 우리에게 인생의 본질적인 목적을 생각하게 만든다.</li><li>개인의 삶(our own lives)에 대한 성찰</li><li>존재(existence)의 의미를 의문시함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03철학적 탐구</div><ul><li>삶의 유한함은 우리가 스스로에게 삶의 이유를 묻는 근본적인 계기가 된다.</li><li>생애 주기에 따른 의식의 변화</li><li>삶의 의미(meaning)를 찾으려는 인간의 본성</li><li>핵심 키워드: 노화(aging), 유한함(brevity), 존재(existence)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reality</td><td class=\"m\">현실, 실재</td></tr><tr><td class=\"w\">grow older</td><td class=\"m\">나이가 들다</td></tr><tr><td class=\"w\">sense</td><td class=\"m\">감각, 느낌, 의식</td></tr><tr><td class=\"w\">brevity</td><td class=\"m\">짧음, 간결함 (시간의 짧음)</td></tr><tr><td class=\"w\">question</td><td class=\"m\">의문을 가지다, 질문하다</td></tr><tr><td class=\"w\">existence</td><td class=\"m\">존재, 실재</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">늙어간다는 현실은</span><span class=\"en\"><b>The realities of <span class=\"grammar-hl\">growing older</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 덧없음에 대한 의식은</span><span class=\"en\"><b>and the sense of brevity</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 자신의 삶의</span><span class=\"en\"><b>of our own lives</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 우리에게 묻게 시킨다</span><span class=\"en\"><b>often <span class=\"grammar-hl\">make us question</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 존재의 의미를</span><span class=\"en\"><b>the meaning of our existence.</b></span></div></div><div class=\"lec-sent-ko\">늙어간다는 현실 그리고 자신의 인생의 덧없음에 대한 의식은 종종 우리가 우리 존재의 의미를 묻게 시킨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 나이가 들며 신체적, 환경적 변화를 겪는 &#39;현실&#39;과 인생이 길지 않다는 &#39;감각&#39;이 결합하여, 인간은 스스로가 왜 사는지에 대해 깊게 고민하게 된다는 내용입니다. 여기서 brevity는 사전적으로 &#39;짧음, 간결함&#39;인데, 여기서는 인생이라는 시간이 영원하지 않고 &#39;찰나와 같이 짧음&#39;을 의미합니다. 필자는 인생의 유한함을 강조하기 위해 이 단어를 선택하여, 독자가 느끼는 허무함이나 숙연함을 효과적으로 전달하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">growing older (현재분사): growing이 older와 함께 쓰여 &#39;나이가 들어가는&#39; 상태를 나타내며, 전치사 of의 목적어 역할을 하는 동명사구(growing older)의 일부임</div><div class=\"lec-gr-item\">make us question 5형식(SVOC) 구조: make(사역동사) + us(목적어) + question(목적보어: 동사원형). 사역동사 make는 목적보어 자리에 동사원형을 취함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sense</td><td class=\"m\">감각, 느낌, 의식</td></tr><tr><td class=\"w\">brevity</td><td class=\"m\">짧음, 간결함 (시간의 짧음)</td></tr><tr><td class=\"w\">question</td><td class=\"m\">의문을 가지다, 질문하다</td></tr><tr><td class=\"w\">existence</td><td class=\"m\">존재, 실재</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>나이가 들면서 겪는 현실적인 변화와 인생의 짧음을 느끼는 감각은 자연스럽게 삶의 의미를 고민하게 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">As people grow older and realize their limited time, they start questioning the fundamental meaning of their existence.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 나이가 들면서 시간이 제한되어 있다는 것을 깨닫고, 자신의 삶이 갖는 근본적인 의미를 질문하기 시작한다.</div></div></div>"],"segs":[[{"audio":"./unit17_04_강의_audio/1.mp3","hl":null}],[{"audio":"./unit17_04_강의_audio/2.mp3","hl":null}],[{"audio":"./unit17_04_강의_audio/3.mp3","hl":null},{"audio":"./unit17_04_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit17_04_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit17_04_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit17_04_강의_audio/7.mp3","hl":null}],[{"audio":"./unit17_04_강의_audio/8.mp3","hl":"main"},{"audio":"./unit17_04_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit17_04_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit17_04_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-
