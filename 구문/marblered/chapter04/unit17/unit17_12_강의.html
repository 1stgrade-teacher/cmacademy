q+nzP/Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Building Lasting Bonds Beyond Cultural and Religious Differences<small>문화적·종교적 차이를 넘어 지속적인 유대 관계 형성하기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 서로 다른 문화적 배경을 가진 사람들이 어떻게 깊은 유대감을 형성하는지에 대해 다루고 있어요. 먼저 다문화주의(Multiculturalism)는 서로 다른 인종이나 민족이 각자의 고유한 문화를 유지하면서도 하나의 공동체 안에서 어우러져 사는 것을 의미하는데, 이는 현대 사회에서 매우 중요한 가치로 여겨져요. 또한 사람들은 흔히 자신과 비슷한 환경에서 자란 사람에게 끌리기 마련이지만, 상호문화적 관계(Intercultural relationship)를 통해 서로 다른 가치관을 공유하면 오히려 관계가 더욱 단단해질 수 있어요. 마치 다양한 재료가 어우러져 맛을 내는 비빔밥처럼, 서로 다른 배경을 가진 사람들이 차이를 존중하고 이해하려는 노력은 관계의 성숙도를 높이는 핵심 열쇠가 된답니다. 이러한 과정을 통해 두 사람은 서로의 세계를 넓혀가며 더욱 깊은 신뢰를 쌓게 되는 것이죠.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문화적 다양성과 관계</div><ul><li>서로 다른 민족적 배경을 가진 커플들도 조화로운 관계를 형성할 수 있음을 보여준다.</li><li>다양한 민족(different ethnic groups)의 결합</li><li>조화롭고 원만한 관계(harmonious relationships) 형성</li><li>핵심 키워드: 민족적 배경(ethnic groups)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02종교적 차이와 유대감</div><ul><li>종교가 다른 사람들 역시 이를 극복하고 굳건한 관계를 유지할 수 있다.</li><li>서로 다른 종교(different religions)를 가진 사람들의 만남</li><li>강력하고 지속적인 유대(strong, lasting bond) 구축</li><li>핵심 키워드: 종교(religions), 유대(bond)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결론적 의미</div><ul><li>관계의 성공은 배경의 일치보다는 서로 간의 결합에 달려 있다.</li><li>외부적 차이는 관계의 걸림돌이 아님</li><li>화합과 유대는 충분히 달성 가능한 가치임</li><li>핵심 키워드: 화합(harmonious), 결합(merge)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">couple</td><td class=\"m\">커플, 두 사람</td></tr><tr><td class=\"w\">ethnic</td><td class=\"m\">민족의, 인종의</td></tr><tr><td class=\"w\">group</td><td class=\"m\">집단, 그룹</td></tr><tr><td class=\"w\">merge</td><td class=\"m\">합쳐지다, 융합되다</td></tr><tr><td class=\"w\">harmonious</td><td class=\"m\">조화로운, 원만한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relationship</td><td class=\"m\">관계</td></tr><tr><td class=\"w\">religion</td><td class=\"m\">종교</td></tr><tr><td class=\"w\">come together</td><td class=\"m\">함께 모이다, 화합하다</td></tr><tr><td class=\"w\">lasting</td><td class=\"m\">지속되는, 오래가는</td></tr><tr><td class=\"w\">bond</td><td class=\"m\">유대, 결속</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 보아왔는데</span><span class=\"en\"><b><span class=\"grammar-hl\">I’ve seen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 인종 집단의 커플들이</span><span class=\"en\"><b>couples from <span class=\"grammar-hl\">different ethnic groups</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조화로운 관계로 어우러지는 것을</span><span class=\"en\"><b>merge into harmonious relationships,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 나는 보아왔고</span><span class=\"en\"><b>and <span class=\"grammar-hl\">I’ve seen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 종교의 사람들이</span><span class=\"en\"><b>people from different religions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연합하는 것을</span><span class=\"en\"><b>come together</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강하고 지속적인 유대를 위해.</span><span class=\"en\"><b>for a strong, <span class=\"grammar-hl\">lasting</span> bond.</b></span></div></div><div class=\"lec-sent-ko\">나는 다른 인종 집단의 커플들이 조화로운 관계로 어우러지는 것을 보아왔다. 그리고 나는 다른 종교의 사람들이 강하고 지속적인 유대를 위해 연합하는 것을 보아왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 필자는 자신의 경험을 바탕으로 서로 다른 문화적, 종교적 배경을 가진 사람들이 어떻게 화합하는지를 예시로 듭니다. 여기서 merge는 사전적으로 &#39;합치다, 녹아들다&#39;라는 뜻인데, 여기서는 단순히 섞이는 것을 넘어 서로 다른 배경을 가진 두 사람이 하나의 관계 안에서 자연스럽게 조화를 이루는 과정을 강조하기 위해 이 단어를 선택했습니다. 또한 bond는 사전적으로는 &#39;결속, 유대&#39;를 의미하지만, 여기서는 단순한 친분을 넘어 서로를 단단히 이어주는 깊고 신뢰할 수 있는 관계를 나타내기 위해 사용되었습니다. 이는 앞서 언급된 조화로운 관계를 좀 더 구체적이고 강한 표현으로 확장한 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’ve seen 현재완료(have+p.p.): have seen은 현재완료 시제로, 과거부터 현재까지의 경험이나 상태를 나타낼 때 쓰는 구조입니다.</div><div class=\"lec-gr-item\">seen couples ... merge into 5형식(SVOC) 구조: see는 지각동사로 &#39;see + 목적어(couples) + 목적격보어(merge)&#39; 형태를 취합니다. 목적격보어 자리에 동사원형 merge를 사용하여 목적어의 동작을 직접 나타냅니다.</div><div class=\"lec-gr-item\">seen people ... come together 5형식(SVOC) 구조: 지각동사 see가 &#39;see + 목적어(people) + 목적격보어(come)&#39; 구조로 쓰였습니다. 여기서 come은 목적어인 people의 행위를 설명하는 원형부정사(목적격보어)입니다.</div><div class=\"lec-gr-item\">different ethnic groups 형용사 수식: different가 뒤의 명사구 ethnic groups를 수식하여 &#39;서로 다른 인종적 집단&#39;이라는 의미를 형성합니다.</div><div class=\"lec-gr-item\">lasting (현재분사(형용사)): lasting이 뒤의 명사 bond를 수식하며, &#39;지속되는&#39;이라는 상태를 나타내는 형용사적 기능을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">couple</td><td class=\"m\">커플, 두 사람</td></tr><tr><td class=\"w\">ethnic</td><td class=\"m\">민족의, 인종의</td></tr><tr><td class=\"w\">group</td><td class=\"m\">집단, 그룹</td></tr><tr><td class=\"w\">merge</td><td class=\"m\">합쳐지다, 융합되다</td></tr><tr><td class=\"w\">harmonious</td><td class=\"m\">조화로운, 원만한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relationship</td><td class=\"m\">관계</td></tr><tr><td class=\"w\">religion</td><td class=\"m\">종교</td></tr><tr><td class=\"w\">come together</td><td class=\"m\">함께 모이다, 화합하다</td></tr><tr><td class=\"w\">lasting</td><td class=\"m\">지속되는, 오래가는</td></tr><tr><td class=\"w\">bond</td><td class=\"m\">유대, 결속</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>서로 다른 인종적 배경을 가진 커플이 조화롭게 결합하는 것을 보았다.</li><li>또한, 종교가 다른 사람들이 서로 강하고 지속적인 관계를 맺는 것도 목격했다.</li><li>즉, 인간은 서로 다른 배경을 가지고 있어도 충분히 깊고 조화로운 관계를 만들 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People from diverse ethnic and religious backgrounds can successfully come together, and they are capable of building strong and lasting bonds.</div>\n              <div class=\"lec-final-sum-ko\">다양한 인종적·종교적 배경을 가진 사람들은 성공적으로 하나가 될 수 있으며, 그들은 강력하고 지속적인 유대 관계를 형성할 수 있다.</div></div></div>"],"segs":[[{"audio":"./unit17_12_강의_audio/1.mp3","hl":null}],[{"audio":"./unit17_12_강의_audio/2.mp3","hl":null}],[{"audio":"./unit17_12_강의_audio/3.mp3","hl":null},{"audio":"./unit17_12_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit17_12_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit17_12_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit17_12_강의_audio/7.mp3","hl":null}],[{"audio":"./unit17_12_강의_audio/8.mp3","hl":"main"},{"audio":"./unit17_12_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit17_12_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit17_12_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12
