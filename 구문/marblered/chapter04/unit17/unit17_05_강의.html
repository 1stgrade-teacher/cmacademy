l Care and Growth<small>생명의 순환을 목격하다: 어미의 돌봄과 성장</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 야생의 세계에서 부모 새가 갓 태어난 새끼에게 먹이를 주는 모습은 단순히 본능적인 행동처럼 보이지만, 사실 여기에는 부모의 투자(Parental Investment)라는 중요한 생물학적 개념이 담겨 있어요. 이는 자손의 생존 확률을 높이기 위해 부모가 자신의 에너지와 자원을 희생하는 전략을 말하는데, 특히 조류의 육아(Avian Parental Care)는 새끼가 독립할 수 있을 때까지 먹이를 구하고 보호하는 집중적인 과정이죠. 마치 여러분의 부모님이 여러분이 스스로 자립할 수 있을 때까지 아낌없이 지원해주시는 것과 비슷하답니다. 이러한 과정은 자연 선택의 결과로, 종의 번영을 위해 생존과 번식(Survival and Reproduction)이라는 관점에서 매우 정교하게 설계된 행동이라고 볼 수 있어요. 이 지문을 읽을 때 단순히 먹이를 주는 행위를 넘어, 부모 새와 새끼 사이의 진화론적 연결 고리를 생각하며 읽어보면 훨씬 흥미로울 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01관찰의 시작</div><ul><li>매일 반복되는 어미 새의 활동을 꾸준히 지켜보았다.</li><li>매일 반복되는 관찰 (Day after day)</li><li>어미 새가 새끼를 돌보는 모습 관찰</li><li>핵심 키워드: 관찰(observation), 어미 새(parent birds)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02먹이 활동</div><ul><li>어미 새는 갓 부화한 새끼들에게 끊임없이 먹이를 공급했다.</li><li>갓 태어난 새끼들의 상태 (newly hatched chicks)</li><li>먹이를 주어 기르는 행위 (feed)</li><li>핵심 키워드: 부화(hatching), 먹이 공급(feeding)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03성장 확인</div><ul><li>시간이 흐름에 따라 새끼 새들이 무럭무럭 자라는 것을 목격했다.</li><li>점진적인 변화와 성장 과정 (grow)</li><li>육아의 결실 확인</li><li>핵심 키워드: 성장(growth), 변화(change)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">day after day</td><td class=\"m\">매일같이, 날마다</td></tr><tr><td class=\"w\">watch</td><td class=\"m\">지켜보다</td></tr><tr><td class=\"w\">parent</td><td class=\"m\">어미(새)</td></tr><tr><td class=\"w\">feed</td><td class=\"m\">먹이를 주다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">newly</td><td class=\"m\">갓, 최근에</td></tr><tr><td class=\"w\">hatch</td><td class=\"m\">부화하다</td></tr><tr><td class=\"w\">chick</td><td class=\"m\">새끼 새</td></tr><tr><td class=\"w\">grow</td><td class=\"m\">자라다, 성장하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">날마다</span><span class=\"en\"><b>Day after day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 지켜봤다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">watched</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어미 새들이</span><span class=\"en\"><b><span class=\"grammar-hl\">the parent birds</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹이를 주는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">feed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신들의 갓 부화한 새끼들에게</span><span class=\"en\"><b><span class=\"grammar-hl\">their newly hatched chicks</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 나는 지켜봤다</span><span class=\"en\"><b>and I <span class=\"grammar-hl\">watched</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 새끼들이</span><span class=\"en\"><b><span class=\"grammar-hl\">the chicks</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자라는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">grow</span>.</b></span></div></div><div class=\"lec-sent-ko\">매일 나는 어미 새들이 자신들의 갓 부화한 새끼들에게 먹이를 주는 것을 지켜봤다, 그리고 나는 그 새끼들이 자라는 것을 지켜봤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 매일 반복적으로 관찰한 경험을 서술합니다. &#39;Day after day&#39;는 사전적으로 &#39;날마다&#39;라는 뜻이지만, 여기서는 단순히 매일이라는 의미를 넘어, 관찰자가 꽤 오랜 시간 동안 끈기 있게 인내심을 가지고 지켜보았다는 느낌을 줍니다. 필자는 이 표현을 통해 자신이 단순히 스쳐 지나가며 본 것이 아니라, 성장의 과정을 온전히 목격했음을 강조하려고 선택했습니다. 이 문장은 이어질 관찰 일기나 자연 관찰에 대한 글의 도입부 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">watched the parent birds feed their newly hatched chicks (5형식(SVOC)): watch는 지각동사로 &#39;지각동사(watch) + 목적어(the parent birds) + 목적격보어(feed)&#39; 구조를 취하며, 목적격보어 자리에 동사원형(feed)을 써서 목적어가 동작하는 것을 직접 보는 의미를 나타냄</div><div class=\"lec-gr-item\">newly hatched (과거분사(형용사)): hatched가 chicks를 수식하며 &#39;부화된 병아리&#39;라는 의미를 가짐. 과거분사 + N 구조로, N이 수동의 상태(부화됨)에 있음을 나타냄</div><div class=\"lec-gr-item\">watched the chicks grow (5형식(SVOC)): 지각동사(watch) + 목적어(the chicks) + 목적격보어(grow) 구조로, 목적어가 성장하는 동작을 관찰함을 의미함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">day after day</td><td class=\"m\">매일같이, 날마다</td></tr><tr><td class=\"w\">watch</td><td class=\"m\">지켜보다</td></tr><tr><td class=\"w\">parent</td><td class=\"m\">어미(새)</td></tr><tr><td class=\"w\">feed</td><td class=\"m\">먹이를 주다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">newly</td><td class=\"m\">갓, 최근에</td></tr><tr><td class=\"w\">hatch</td><td class=\"m\">부화하다</td></tr><tr><td class=\"w\">chick</td><td class=\"m\">새끼 새</td></tr><tr><td class=\"w\">grow</td><td class=\"m\">자라다, 성장하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>화자는 매일 어미 새가 새끼를 돌보는 모습을 관찰했다.</li><li>관찰을 통해 새끼 새들이 자라나는 생명의 과정을 직접 확인했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The author observes the parent birds feeding their young, and witnesses the chicks growing day by day.</div>\n              <div class=\"lec-final-sum-ko\">필자는 어미 새가 새끼에게 먹이를 주는 모습을 관찰하며, 새끼 새들이 날마다 성장하는 과정을 지켜본다.</div></div></div>"],"segs":[[{"audio":"./unit17_05_강의_audio/1.mp3","hl":null}],[{"audio":"./unit17_05_강의_audio/2.mp3","hl":null}],[{"audio":"./unit17_05_강의_audio/3.mp3","hl":null},{"audio":"./unit17_05_강의_audio/4.mp3","hl":"stage-0"},{"audio
