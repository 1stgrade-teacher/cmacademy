  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;

lecturePlayer(document.getElementById("app"),{"brand":"unit17","title":"목적격보어 1 — O가 ~하도록 만드는 다섯 형식 블록","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편 — 목적격보어 1 (S + V + O + to-v / 동사원형)\u003c/div>\u003ch1>목적격보어 1 — O가 ~하도록 만드는 다섯 형식 블록\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>동사 뒤에 목적어와 목적격보어가 이어지는 블록을 잡아, to부정사를 쓰는 동사와 동사원형을 쓰는 동사를 구별하며 문장을 정확히 읽고 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘도 구문 블록 하나로 영어 문장을 시원하게 뚫어 볼게요. 오늘 배울 블록은 목적격보어, 그중에서도 동사 뒤에 목적어가 오고 바로 to부정사나 동사원형이 붙는 모양입니다. 이 블록 하나만 손에 익히면 오늘 준비한 열두 문장이 한 번에 정리돼요. 자, 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 — 목적격보어 1 (S + V + O + to-v / 동사원형)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">동사 + 목적어 + 목적격보어 순서에서 목적격보어 자리에 \u003cb class=\"key\">to부정사\u003c/b>를 쓰는 동사(allow, encourage, force, cause)와 \u003cb class=\"key\">동사원형\u003c/b>을 쓰는 동사(let, make, have, watch, hear, see)를 구별하는 것이 핵심입니다. \u003cb class=\"key\">help\u003c/b>는 to부정사와 동사원형을 모두 취합니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Internet social networking \u003cspan class=\"fx\">allows us to expand\u003c/span> our circle of friends.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 We must not \u003cspan class=\"fx\">let the virtual world take us away\u003c/span> from the real world that doesn't go away with a power outage.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 If you used the same password on any other site, we \u003cspan class=\"fx\">encourage you to change\u003c/span> your password there as well.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 The realities of growing older and the sense of brevity of our own lives often \u003cspan class=\"fx\">make us question\u003c/span> the meaning of our existence.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Day after day, I \u003cspan class=\"fx\">watched the parent birds feed\u003c/span> their newly hatched chicks, and I watched the chicks grow.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 You can \u003cspan class=\"fx\">force the horse to go\u003c/span> to the river but you cannot force the horse to drink from it.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 When you read, focusing on the main idea \u003cspan class=\"fx\">helps you understand\u003c/span> the details better.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Most universities \u003cspan class=\"fx\">have students fill out\u003c/span> an evaluation of every course they take.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 When the clock said ten minutes to five, punctually as always, she \u003cspan class=\"fx\">heard the car approach and stop\u003c/span> outside.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 To improve their own chances of survival, some parasites \u003cspan class=\"fx\">cause their hosts to act\u003c/span> in ways that are very different from their normal behavior.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Before you marry a person, you should first \u003cspan class=\"fx\">make them use\u003c/span> a computer with slow Internet service to see who they really are.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 I've \u003cspan class=\"fx\">seen couples from different ethnic groups merge\u003c/span> into harmonious relationships, and I've seen people from different religions come together for a strong, lasting bond.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 큰 그림부터 볼게요. 동사 뒤에 목적어가 오고, 그 목적어를 설명해 주는 보어가 따라오는 구조를 목적격보어 구문이라고 불러요. 이때 보어 자리에 to부정사를 데리고 오는 동사가 있고, to 없이 동사원형만 데리고 오는 동사가 있습니다. allow, encourage, force, cause는 to부정사를 부르고, let, make, have, watch, hear, see는 동사원형을 부릅니다. 그래서 시험에서는 늘 to가 있느냐 없느냐를 물어요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Internet social networking \u003cspan class=\"fx\">allows us to expand\u003c/span> our circle of friends.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Internet social networking\u003c/div>\u003cdiv class=\"k\">인터넷 소셜 네트워킹은\u003c/div>\u003cdiv class=\"e\">allows us\u003c/div>\u003cdiv class=\"k\">우리가 ~하는 것을 가능하게 한다\u003c/div>\u003cdiv class=\"e\">to expand our circle of friends.\u003c/div>\u003cdiv class=\"k\">우리의 친구 범위를 넓히도록\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">allow + O + to-v\u003c/b> 구조로, 목적어 us 뒤에 to expand가 목적격보어로 붙어 'us가 expand하도록 가능하게 하다'라는 다섯 형식 문장을 만든다. allow는 to부정사를 데리고 오는 대표 동사이므로 us to expand를 한 블록으로 읽는다.\u003c/div>","segs":[{"n":3,"text":"Internet social networking, 인터넷 소셜 네트워킹은. allows us, 우리가 ~하는 것을 가능하게 한다. to expand our circle of friends, 우리의 친구 범위를 넓히도록","hl":"ch"},{"n":4,"text":"첫 번째 문장입니다. Internet social networking allows us to expand our circle of friends. 여기서 allows 뒤에 목적어 us가 오고, 이어서 to expand가 목적격보어로 붙어요. allow는 to부정사를 데리고 오는 대표 동사라서 us to expand를 한 덩어리로 묶어 읽어 주시면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Internet social networking \u003cspan class=\"fx\">allows us to expand\u003c/span> our circle of friends.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>소셜 네트워킹이 우리의 인맥을 넓혀 준다는 뜻이다. 오프라인에서는 만나기 어려운 사람까지 온라인에서 연결해 준다는 긍정적인 뉘앙스가 담겨 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">allows us to expand\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">makes it possible for us to expand\u003c/span>\u003cdiv class=\"w\">allow + O + to-v를 make it possible for O to-v로 바꾸면 '가능하게 하다'는 의미가 더 또렷해진다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">circle of friends\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">social circle\u003c/span>\u003cdiv class=\"w\">'친구 범위'를 '인맥, 교우 범위'라는 조금 더 포괄적인 표현으로 바꾼 것이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">expand\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">broaden / widen\u003c/span>\u003cspan class=\"y-eq\">expand = broaden\u003c/span>\u003cdiv class=\"w\">범위를 넓힌다는 뜻이 같아 문장 안에서 그대로 바꿔 쓸 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">circle of friends\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">network of friends\u003c/span>\u003cspan class=\"y-eq\">circle of friends = social network\u003c/span>\u003cdiv class=\"w\">'친구 집단'을 '인맥망'이라는 의미로 바꾼 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">allows us to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">enables us to\u003c/span>\u003cspan class=\"y-eq\">allow O to-v = enable O to-v\u003c/span>\u003cdiv class=\"w\">'가능하게 하다'라는 뜻의 동의 표현으로, 구조도 to부정사로 같다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Online social networking makes it possible for us to broaden our social circle.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 소셜 네트워킹이 우리의 친구 범위를 넓혀 준다는 뜻이에요. 오프라인에서는 만나기 어려운 사람까지 온라인에서 연결된다는 긍정적인 느낌이 담겨 있죠.","hl":"mn"},{"n":6,"text":"조금 바꿔 볼까요. allows us to expand를 makes it possible for us to expand로 바꾸면 가능하게 한다는 뜻이 더 분명해집니다.","hl":"rw"},{"n":7,"text":"단어도 같이 정리해요. expand는 broaden이나 widen으로 바꿀 수 있고, circle of friends는 social circle이라고도 합니다.","hl":"ph"},{"n":8,"text":"같은 뜻으로 다시 말하면, Online social networking makes it possible for us to broaden our social circle. 입니다. 구조만 바뀌고 의미는 그대로죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 We must not \u003cspan class=\"fx\">let the virtual world take us away\u003c/span> from the real world that doesn't go away with a power outage.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We must not let\u003c/div>\u003cdiv class=\"k\">우리는 허용해서는 안 된다\u003c/div>\u003cdiv class=\"e\">the virtual world\u003c/div>\u003cdiv class=\"k\">가상 세계가\u003c/div>\u003cdiv class=\"e\">take us away\u003c/div>\u003cdiv class=\"k\">우리를 데려가게\u003c/div>\u003cdiv class=\"e\">from the real world\u003c/div>\u003cdiv class=\"k\">실제 세계로부터\u003c/div>\u003cdiv class=\"e\">that doesn't go away\u003c/div>\u003cdiv class=\"k\">사라지지 않는\u003c/div>\u003cdiv class=\"e\">with a power outage.\u003c/div>\u003cdiv class=\"k\">정전과 함께\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">let + O + 동사원형\u003c/b> 구조로, 목적격보어 자리에 to 없이 동사원형 take가 온다. 뒤의 that doesn't go away with a power outage는 관계대명사 that이 이끄는 절로 the real world를 수식한다.\u003c/div>","segs":[{"n":9,"text":"We must not let, 우리는 허용해서는 안 된다. the virtual world, 가상 세계가. take us away, 우리를 데려가게. from the real world, 실제 세계로부터. that doesn't go away, 사라지지 않는. with a power outage, 정전과 함께","hl":"ch"},{"n":10,"text":"두 번째 문장입니다. We must not let the virtual world take us away from the real world that doesn't go away with a power outage. let 뒤에 목적어 the virtual world가 오고, 보어 자리에 to 없이 동사원형 take가 왔어요. 그리고 that doesn't go away 이하는 the real world를 꾸며 주는 관계대명사절입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 We must not \u003cspan class=\"fx\">let the virtual world take us away\u003c/span> from the real world that doesn't go away with a power outage.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>가상 세계에 너무 빠져 실제 세계를 잃지 말라는 경고다. 정전이 나면 사라지는 것이 가상 세계이고, 정전과 상관없이 그대로 남는 것이 실제 세계라는 대비가 핵심이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">let the virtual world take us away\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">allow the virtual world to take us away\u003c/span>\u003cdiv class=\"w\">allow는 to부정사를 쓰기 때문에 to를 넣어야 한다. let과 allow의 결정적인 차이를 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">doesn't go away\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">doesn't disappear\u003c/span>\u003cdiv class=\"w\">'사라지지 않는다'는 뜻을 더 직접적인 동의어로 바꾼 것이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">virtual\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">online / simulated\u003c/span>\u003cspan class=\"y-eq\">virtual = online\u003c/span>\u003cdiv class=\"w\">'가상의'를 '온라인의, 모의의'라는 표현으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">power outage\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">blackout\u003c/span>\u003cspan class=\"y-eq\">power outage = blackout\u003c/span>\u003cdiv class=\"w\">'정전'을 뜻하는 같은 의미의 어구다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take us away from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pull us away from / distract us from\u003c/span>\u003cspan class=\"y-eq\">take away from = pull away from\u003c/span>\u003cdiv class=\"w\">물리적으로 떼어 낸다는 뜻을 '끌어당겨 떼어 놓다'로 바꿔 뉘앙스를 살렸다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We must not allow the virtual world to pull us away from the real world, which does not disappear when the power goes out.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 가상 세계에 빠져 진짜 세계를 놓치지 말라는 경고예요. 정전이 나면 사라지는 건 가상 세계이고, 정전과 상관없이 남는 건 실제 세계라는 대비를 기억하세요.","hl":"mn"},{"n":12,"text":"let the virtual world take를 allow the virtual world to take로 바꾸면 to가 새로 생기죠. 이 차이가 바로 시험에 나오는 포인트입니다.","hl":"rw"},{"n":13,"text":"어휘도 챙겨요. virtual은 online으로, power outage는 blackout으로 바꿔 쓸 수 있습니다.","hl":"ph"},{"n":14,"text":"다시 말하면, We must not allow the virtual world to pull us away from the real world, which does not disappear when the power goes out. 입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 If you used the same password on any other site, we \u003cspan class=\"fx\">encourage you to change\u003c/span> your password there as well.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If you used the same password\u003c/div>\u003cdiv class=\"k\">만약 당신이 같은 비밀번호를 사용했다면\u003c/div>\u003cdiv class=\"e\">on any other site,\u003c/div>\u003cdiv class=\"k\">어떤 다른 사이트에서\u003c/div>\u003cdiv class=\"e\">we encourage you\u003c/div>\u003cdiv class=\"k\">우리는 당신이 ~하기를 권장한다\u003c/div>\u003cdiv class=\"e\">to change your password\u003c/div>\u003cdiv class=\"k\">당신의 비밀번호를 바꾸도록\u003c/div>\u003cdiv class=\"e\">there as well.\u003c/div>\u003cdiv class=\"k\">거기서도 또한\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">encourage + O + to-v\u003c/b> 구조로, 목적어 you 뒤에 to change가 목적격보어로 온다. If절은 과거형 used이지만 주절은 현재형 encourage로, 지금 권고하는 뉘앙스를 살린다.\u003c/div>","segs":[{"n":15,"text":"If you used the same password, 만약 당신이 같은 비밀번호를 사용했다면. on any other site, 어떤 다른 사이트에서. we encourage you, 우리는 당신이 ~하기를 권장한다. to change your password, 당신의 비밀번호를 바꾸도록. there as well, 거기서도 또한","hl":"ch"},{"n":16,"text":"세 번째 문장입니다. If you used the same password on any other site, we encourage you to change your password there as well. encourage 뒤에 목적어 you가 오고 to change가 목적격보어로 붙었어요. encourage는 to부정사를 부르는 동사라서 you to change를 한 블록으로 읽습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 If you used the same password on any other site, we \u003cspan class=\"fx\">encourage you to change\u003c/span> your password there as well.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>비밀번호를 여러 사이트에서 재사용하는 것이 얼마나 위험한지를 알리며 즉시 바꾸라고 권하는 안내문이다. '꼭 하세요'보다 부드러운 '하시는 게 좋겠어요'에 가깝다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">we encourage you to change\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">we recommend that you change\u003c/span>\u003cdiv class=\"w\">encourage + O + to-v를 recommend that + S + 동사로 바꾸면 권고의 뜻이 그대로 살아난다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">there as well\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">on that site too\u003c/span>\u003cdiv class=\"w\">'거기서도 또한'이라는 뜻을 사이트를 가리키는 표현으로 풀어 쓴 것이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">encourage\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">urge / recommend\u003c/span>\u003cspan class=\"y-eq\">encourage = urge\u003c/span>\u003cdiv class=\"w\">'권장하다, 장려하다'를 '촉구하다, 추천하다'로 바꿔 같은 기능을 한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">as well\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">too / in addition\u003c/span>\u003cspan class=\"y-eq\">as well = too\u003c/span>\u003cdiv class=\"w\">'또한'이라는 의미의 동의 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">password\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">passcode / login credentials\u003c/span>\u003cdiv class=\"w\">'비밀번호'를 뜻하는 실용적인 대체 어구다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If you have reused that password anywhere else, we recommend changing it on that site too.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 비밀번호를 여러 사이트에서 똑같이 쓰는 게 위험하다는 걸 알리면서 지금 바로 바꾸라고 권하는 안내문이에요. 강요가 아니라 권유의 말투라는 점이 중요합니다.","hl":"mn"},{"n":18,"text":"encourage you to change를 recommend that you change로 바꿔도 권하는 뜻은 그대로예요.","hl":"rw"},{"n":19,"text":"단어도 정리해요. encourage는 urge나 recommend로, as well은 too로 바꿀 수 있습니다.","hl":"ph"},{"n":20,"text":"같은 뜻으로 다시 말하면, If you have reused that password anywhere else, we recommend changing it on that site too. 입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 The realities of growing older and the sense of brevity of our own lives often \u003cspan class=\"fx\">make us question\u003c/span> the meaning of our existence.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The realities of growing older\u003c/div>\u003cdiv class=\"k\">늙어 간다는 현실과\u003c/div>\u003cdiv class=\"e\">and the sense of brevity of our own lives\u003c/div>\u003cdiv class=\"k\">자신의 인생이 덧없다는 느낌은\u003c/div>\u003cdiv class=\"e\">often make us\u003c/div>\u003cdiv class=\"k\">종종 우리를 ~하게 만든다\u003c/div>\u003cdiv class=\"e\">question the meaning\u003c/div>\u003cdiv class=\"k\">의문을 품게\u003c/div>\u003cdiv class=\"e\">of our existence.\u003c/div>\u003cdiv class=\"k\">우리 존재의 의미에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">make + O + 동사원형\u003c/b> 구조로, 목적격보어 자리에 to 없는 동사원형 question이 온다. 주어는 The realities ~ and the sense ~로 두 개가 and로 묶인 긴 주어이다.\u003c/div>","segs":[{"n":21,"text":"The realities of growing older, 늙어 간다는 현실과. and the sense of brevity of our own lives, 자신의 인생이 덧없다는 느낌은. often make us, 종종 우리를 ~하게 만든다. question the meaning, 의문을 품게. of our existence, 우리 존재의 의미에","hl":"ch"},{"n":22,"text":"네 번째 문장입니다. The realities of growing older and the sense of brevity of our own lives often make us question the meaning of our existence. make 뒤에 목적어 us가 오고, 보어 자리에 to 없이 동사원형 question이 왔어요. 주어가 and로 길게 이어진 문장이라 주어 덩어리를 먼저 잡는 게 중요합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 The realities of growing older and the sense of brevity of our own lives often \u003cspan class=\"fx\">make us question\u003c/span> the meaning of our existence.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>나이가 들어 가는 현실과 인생이 짧다는 느낌이 우리로 하여금 삶의 의미를 되묻게 만든다는 뜻이다. 덧없음이 오히려 성찰을 불러일으킨다는 뉘앙스다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make us question\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cause us to question\u003c/span>\u003cdiv class=\"w\">cause는 to부정사를 쓰기 때문에 to가 새로 들어간다. make와의 차이를 보여 주는 전환이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">often make us question\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">often lead us to question\u003c/span>\u003cdiv class=\"w\">'~하게 만들다'를 '이끌다'라는 동사로 바꿔 의미를 부드럽게 전달한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">brevity\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">shortness / fleeting nature\u003c/span>\u003cspan class=\"y-eq\">brevity = shortness\u003c/span>\u003cdiv class=\"w\">'짧음, 덧없음'을 뜻을 풀어 쓴 동의 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">existence\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">being / life\u003c/span>\u003cspan class=\"y-eq\">existence = being\u003c/span>\u003cdiv class=\"w\">'존재'를 '있음, 삶'으로 바꿔 같은 의미를 전한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">question\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">doubt / wonder about\u003c/span>\u003cspan class=\"y-eq\">question = wonder about\u003c/span>\u003cdiv class=\"w\">'의문을 품다'를 '궁금해하다'로 바꾼 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Aging and the feeling that our lives are short often lead us to ask what our existence means.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 늙어 가는 현실과 인생이 짧다는 느낌이 우리로 하여금 존재의 의미를 되묻게 만든다는 뜻이에요. 덧없다는 감정이 오히려 깊은 성찰로 이어진다는 점이 포인트죠.","hl":"mn"},{"n":24,"text":"make us question을 cause us to question으로 바꾸면 to가 새로 붙습니다. 이 차이를 꼭 비교해 두세요.","hl":"rw"},{"n":25,"text":"brevity는 shortness로, existence는 being으로 바꿔 쓸 수 있습니다.","hl":"ph"},{"n":26,"text":"다시 말하면, Aging and the feeling that our lives are short often lead us to ask what our existence means. 입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Day after day, I \u003cspan class=\"fx\">watched the parent birds feed\u003c/span> their newly hatched chicks, and I watched the chicks grow.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Day after day,\u003c/div>\u003cdiv class=\"k\">매일\u003c/div>\u003cdiv class=\"e\">I watched the parent birds\u003c/div>\u003cdiv class=\"k\">나는 어미 새들이 ~하는 것을 지켜보았다\u003c/div>\u003cdiv class=\"e\">feed their newly hatched chicks,\u003c/div>\u003cdiv class=\"k\">갓 부화한 새끼들에게 먹이를 주는 것을\u003c/div>\u003cdiv class=\"e\">and I watched the chicks\u003c/div>\u003cdiv class=\"k\">그리고 나는 그 새끼들이 ~하는 것을 지켜보았다\u003c/div>\u003cdiv class=\"e\">grow.\u003c/div>\u003cdiv class=\"k\">자라는 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">watch + O + 동사원형\u003c/b> 구조로, 지각동사 watch는 목적어와 목적격보어가 능동 관계일 때 동사원형이나 현재분사를 취한다. 뒤의 watched the chicks grow도 같은 블록이 and로 병렬 연결된 것이다.\u003c/div>","segs":[{"n":27,"text":"Day after day, 매일. I watched the parent birds, 나는 어미 새들이 ~하는 것을 지켜보았다. feed their newly hatched chicks, 갓 부화한 새끼들에게 먹이를 주는 것을. and I watched the chicks, 그리고 나는 그 새끼들이 ~하는 것을 지켜보았다. grow, 자라는 것을","hl":"ch"},{"n":28,"text":"다섯 번째 문장입니다. Day after day, I watched the parent birds feed their newly hatched chicks, and I watched the chicks grow. watch는 지각동사라서 목적어 뒤에 동사원형이 옵니다. feed와 grow가 모두 to 없이 쓰였다는 점을 눈여겨보세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Day after day, I \u003cspan class=\"fx\">watched the parent birds feed\u003c/span> their newly hatched chicks, and I watched the chicks grow.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>매일 반복해서 그 장면을 지켜보았다는 뜻으로, 관찰의 지속성이 느껴진다. feed는 '먹이를 주다'라는 뜻으로 목적어 chicks를 데리고 쓰였다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">watched the parent birds feed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">saw the parent birds feeding\u003c/span>\u003cdiv class=\"w\">지각동사는 능동 관계에서 현재분사도 취할 수 있어 진행의 느낌을 더할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Day after day\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Every single day\u003c/span>\u003cdiv class=\"w\">'매일'이라는 반복의 뜻을 강조한 표현으로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">day after day\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">every day / repeatedly\u003c/span>\u003cspan class=\"y-eq\">day after day = every day\u003c/span>\u003cdiv class=\"w\">반복을 나타내는 같은 의미의 부사구다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">newly hatched\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">just born / freshly hatched\u003c/span>\u003cspan class=\"y-eq\">newly hatched = just born\u003c/span>\u003cdiv class=\"w\">'갓 부화한'을 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">feed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">give food to\u003c/span>\u003cspan class=\"y-eq\">feed = give food to\u003c/span>\u003cdiv class=\"w\">동사를 풀어 써서 의미를 분명히 한 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Every day I observed the parent birds feeding their just-hatched chicks, and I watched those chicks grow.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"매일 어미 새가 새끼에게 먹이를 주는 모습과 새끼가 자라는 모습을 계속 지켜보았다는 뜻이에요. 반복해서 관찰했다는 점이 이 문장의 정서를 만들어 줍니다.","hl":"mn"},{"n":30,"text":"watched the parent birds feed를 saw the parent birds feeding으로 바꾸면 그 장면이 진행되는 느낌이 살아나요.","hl":"rw"},{"n":31,"text":"day after day는 every day로, newly hatched는 just born으로 바꿔 쓸 수 있습니다.","hl":"ph"},{"n":32,"text":"같은 뜻으로 다시 말하면, Every day I observed the parent birds feeding their just-hatched chicks, and I watched those chicks grow. 입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 You can \u003cspan class=\"fx\">force the horse to go\u003c/span> to the river but you cannot force the horse to drink from it.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">You can force the horse\u003c/div>\u003cdiv class=\"k\">당신은 말에게 강요할 수 있다\u003c/div>\u003cdiv class=\"e\">to go to the river\u003c/div>\u003cdiv class=\"k\">강으로 가도록\u003c/div>\u003cdiv class=\"e\">but you cannot force the horse\u003c/div>\u003cdiv class=\"k\">그러나 당신은 말에게 강요할 수 없다\u003c/div>\u003cdiv class=\"e\">to drink from it.\u003c/div>\u003cdiv class=\"k\">그것에서 마시도록\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">force + O + to-v\u003c/b> 구조로, 목적어 the horse 뒤에 to go와 to drink가 각각 목적격보어로 온다. but으로 두 절이 대조를 이루며 같은 블록이 반복된다.\u003c/div>","segs":[{"n":33,"text":"You can force the horse, 당신은 말에게 강요할 수 있다. to go to the river, 강으로 가도록. but you cannot force the horse, 그러나 당신은 말에게 강요할 수 없다. to drink from it, 그것에서 마시도록","hl":"ch"},{"n":34,"text":"여섯 번째 문장입니다. You can force the horse to go to the river but you cannot force the horse to drink from it. force는 to부정사를 데리고 오는 동사라서 the horse to go, the horse to drink처럼 목적어와 to부정사가 붙어 다녀요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 You can \u003cspan class=\"fx\">force the horse to go\u003c/span> to the river but you cannot force the horse to drink from it.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>끌고 갈 수는 있어도 마시게 할 수는 없다는 뜻으로, 겉모습은 강제할 수 있어도 속마음은 강제할 수 없다는 속담이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">force the horse to drink\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make the horse drink\u003c/span>\u003cdiv class=\"w\">make는 동사원형을 쓰므로 to가 사라진다. force와 make의 결정적 차이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cannot force the horse to drink from it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can't make the horse drink the water\u003c/span>\u003cdiv class=\"w\">같은 속담을 더 일상적인 표현으로 바꾼 것이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">force\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">compel / make\u003c/span>\u003cspan class=\"y-eq\">force = compel\u003c/span>\u003cdiv class=\"w\">'강요하다'를 뜻하는 동의어로, compel은 to부정사를 함께 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">go to the river\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be led to water\u003c/span>\u003cdiv class=\"w\">'강으로 가다'를 '물가로 끌려가다'로 바꿔 수동의 뉘앙스를 살렸다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">drink from it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">take a drink of it\u003c/span>\u003cdiv class=\"w\">'그것에서 마시다'를 조금 더 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">You can lead a horse to water, but you can't make it drink.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 속담이에요. 끌고 갈 수는 있어도 마시게 할 수는 없다, 즉 겉모습은 강제해도 마음은 강제할 수 없다는 뜻입니다.","hl":"mn"},{"n":36,"text":"force the horse to drink를 make the horse drink로 바꾸면 to가 사라지죠. 이 차이가 바로 핵심입니다."," 신들의 생존 가능성을 높이기 위해서. some parasites cause their hosts, 어떤 기생충들은 숙주들이 ~하게 만든다. to act in ways, 방식으로 행동하도록. that are very different, 아주 다른. from their normal behavior, 그들의 정상적인 행동과는","hl":"ch"},{"n":58,"text":"열 번째 문장입니다. To improve their own chances of survival, some parasites cause their hosts to act in ways that are very different from their normal behavior. cause는 to부정사를 데리고 오는 동사라서 their hosts to act가 한 덩어리예요. 뒤의 that절은 ways를 꾸며 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 To improve their own chances of survival, some parasites \u003cspan class=\"fx\">cause their hosts to act\u003c/span> in ways that are very different from their normal behavior.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>기생충이 숙주를 조종해 평소와 전혀 다른 행동을 하게 만든다는 뜻이다. 기생충의 생존 전략을 설명하는 과학 지문의 전형적인 문장이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cause their hosts to act\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make their hosts act\u003c/span>\u003cdiv class=\"w\">cause는 to부정사를, make는 동사원형을 쓰므로 to가 사라진다. 두 동사의 차이를 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">To improve\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">In order to improve\u003c/span>\u003cdiv class=\"w\">목적을 나타내는 to부정사임을 더 분명히 밝힌 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">chances of survival\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">odds of survival\u003c/span>\u003cspan class=\"y-eq\">chances of survival = odds of survival\u003c/span>\u003cdiv class=\"w\">'생존 가능성'을 뜻하는 같은 의미의 어구다.\u003c/div>\u003c/div 게 해야 한다\u003c/div>\u003cdiv class=\"e\">use a computer\u003c/div>\u003cdiv class=\"k\">컴퓨터를 사용하게\u003c/div>\u003cdiv class=\"e\">with slow Internet service\u003c/div>\u003cdiv class=\"k\">느린 인터넷 서비스가 있는\u003c/div>\u003cdiv class=\"e\">to see who they really are.\u003c/div>\u003cdiv class=\"k\">그들이 정말 어떤 사람인지 보기 위해서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">make + O + 동사원형\u003c/b> 구조로, 목적어 them 뒤에 동사원형 use가 온다. to see 이하는 '~하기 위해서'를 뜻하는 목적의 부사적 용법이다.\u003c/div>","segs":[{"n":63,"text":"Before you marry a person, 당신이 어떤 사람과 결혼하기 전에. you should first make them, 당신은 먼저 그들이 ~하게 해야 한다. use a computer, 컴퓨터를 사용하게. with slow Internet service, 느린 인터넷 서비스가 있는. to see who they really are, 그들이 정말 어떤 사람인지 보기 위해서","hl":"ch"},{"n":64,"text":"열한 번째 문장입니다. Before you marry a person, you should first make them use a computer with slow Internet service to see who they really are. make 뒤에 목적어 them이 오고 동사원형 use가 붙었어요. 맨 뒤의 to see는 목적을 나타내는 부사적 용법입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 Before you marry a person, you should first \u003cspan class=\"fx\">make them use\u003c/span> a computer with slow Internet service to see who they really are.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>느린 인터넷 앞에서 참을성을 시험해 보면 그 사람의 진짜 성격이 드러난다는 유머 섞인 조언이다. 짧은 문장 안에 위트가 숨어 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make them use\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have them use\u003c/span>\u003cdiv class=\"w\">have도 사역동사로 동사원형을 취하므로 to 없이 그대로 바꿔 쓸 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to see who they really are\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in order to find out their true character\u003c/span>\u003cdiv class=\"w\">목적의 to부정사를 in order to로 풀고 의미도 구체화한 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">marry a person\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">get married to a person\u003c/span>\u003cspan class=\"y-eq\">marry = get married to\u003c/span>\u003cdiv class=\"w\">'결혼하다'를 전치사가 필요한 표현으로 바꾼 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">slow Internet service\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a slow Internet connection\u003c/span>\u003cspan class=\"y-eq\">Internet service = Internet connection\u003c/span>\u003cdiv class=\"w\">'인터넷 서비스'를 '인터넷 연결'로 바꾼 자연스러운 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">really\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">truly\u003c/span>\u003cspan class=\"y-eq\">really = truly\u003c/span>\u003cdiv class=\"w\">'정말로'를 뜻하는 동의 부사다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Before you get married to someone, you should first have them use a computer with a slow Internet connection so that you can find out who they truly are.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"느린 인터넷 앞에서 그 사람이 어떻게 참는지 보면 진짜 성격이 드러난다는 유머 섞인 조언이에요. 웃으면서도 공감 가는 문장이죠.","hl":"mn"},{"n":66,"text":"make them use를 have them use로 바꿔도 뜻은 같아요. 둘 다 동사원형을 데리고 오니까요.","hl":"rw"},{"n":67,"text":"marry a person은 get married to a person으로, really는 truly로 바꿔 쓸 수 있습니다.","hl":"ph"},{"n":68,"text":"다시 말하면, Before you get married to someone, you should first have them use a computer with a slow Internet connection so that you can find out who they truly are. 입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 I've \u003cspan class=\"fx\">seen couples from different ethnic groups merge\u003c/span> into harmonious relationships, and I've seen people from different religions come together for a strong, lasting bond.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I've seen couples\u003c/div>\u003cdiv class=\"k\">나는 커플들이 ~하는 것을 보아왔다\u003c/div>\u003cdiv class=\"e\">from different ethnic groups\u003c/div>\u003cdiv class=\"k\">서로 다른 인종 집단 출신의\u003c/div>\u003cdiv class=\"e\">merge into harmonious relationships,\u003c/div>\u003cdiv class=\"k\">조화로운 관계로 어우러지는 것을,\u003c/div>\u003cdiv class=\"e\">and I've seen people\u003c/div>\u003cdiv class=\"k\">그리고 나는 사람들이 ~하는 것을 보아왔다\u003c/div>\u003cdiv class=\"e\">from different religions\u003c/div>\u003cdiv class=\"k\">서로 다른 종교를 가진\u003c/div>\u003cdiv class=\"e\">come together\u003c/div>\u003cdiv class=\"k\">하나로 모이는 것을\u003c/div>\u003cdiv class=\"e\">for a strong, lasting bond.\u003c/div>\u003cdiv class=\"k\">강하고 지속적인 유대를 위해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">see + O + 동사원형\u003c/b> 구조로, 목적어 couples 뒤에 동사원형 merge가 오고, 뒤의 seen people come together도 같은 블록이 and로 병렬 연결된 것이다. 현재완료 have seen은 '보아왔다'는 경험의 의미다.\u003c/div>","segs":[{"n":69,"text":"I've seen couples, 나는 커플들이 ~하는 것을 보아왔다. from different ethnic groups, 서로 다른 인종 집단 출신의. merge into harmonious relationships, 조화로운 관계로 어우러지는 것을. and I've seen people, 그리고 나는 사람들이 ~하는 것을 보아왔다. from different religions, 서로 다른 종교를 가진. come together, 하나로 모이는 것을. for a strong, lasting bond, 강하고 지속적인 유대를 위해","hl":"ch"},{"n":70,"text":"마지막 문장입니다. I've seen couples from different ethnic groups merge into harmonious relationships, and I've seen people from different religions come together for a strong, lasting bond. see도 지각동사라서 목적어 뒤에 동사원형 merge와 come together가 왔어요. and로 같은 블록이 한 번 더 반복됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 I've \u003cspan class=\"fx\">seen couples from different ethnic groups merge\u003c/span> into harmonious relationships, and I've seen people from different religions come together for a strong, lasting bond.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인종과 종교가 다른 사람들이 조화롭고 지속적인 관계를 이루는 모습을 여러 번 목격했다는 뜻이다. 서로 다른 배경을 넘어선 연대에 대한 긍정적 시선이 담겨 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">merge into harmonious relationships\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">blend into harmonious relationships\u003c/span>\u003cdiv class=\"w\">merge를 blend로 바꿔 '어우러지다'는 뜻을 더 부드럽게 전한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a strong, lasting bond\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a strong, enduring bond\u003c/span>\u003cdiv class=\"w\">lasting을 enduring으로 바꿔 '오래 견디는'이라는 뉘앙스를 더했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ethnic group\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">racial group\u003c/span>\u003cspan class=\"y-eq\">ethnic group = racial group\u003c/span>\u003cdiv class=\"w\">'인종 집단'을 뜻하는 같은 의미의 어구다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">merge\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">blend / unite\u003c/span>\u003cspan class=\"y-eq\">merge = blend\u003c/span>\u003cdiv class=\"w\">'어우러지다, 합쳐지다'를 뜻하는 동의어다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">lasting\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">enduring / long-lasting\u003c/span>\u003cspan class=\"y-eq\">lasting = enduring\u003c/span>\u003cdiv class=\"w\">'지속적인'을 뜻하는 동의 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I have seen couples of different ethnic backgrounds blend into harmonious relationships, and I have seen people of different faiths unite for a strong, enduring bond.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"서로 다른 인종과 종교를 가진 사람들이 조화롭고 오래가는 관계를 이루는 모습을 여러 번 보아 왔다는 뜻이에요. 서로 다른 배경을 넘어선 연대를 긍정적으로 바라보는 시선이 담겨 있습니다.","hl":"mn"},{"n":72,"text":"merge into harmonious relationships를 blend into harmonious relationships로 바꾸면 어우러진다는 느낌이 더 부드러워져요.","hl":"rw"},{"n":73,"text":"ethnic group은 racial group으로, lasting은 enduring으로 바꿔 쓸 수 있습니다.","hl":"ph"},{"n":74,"text":"같은 뜻으로 다시 말하면, I have seen couples of different ethnic backgrounds blend into harmonious relationships, and I have seen people of different faiths unite for a strong, enduring bond. 입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편 — 목적격보어 1 (S + V + O + to-v / 동사원형)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">allow / encourage / force / cause + O + to-v\u003c/b>는 'O가 ~하도록'이라는 뜻으로 목적격보어 자리에 to부정사가 온다.\u003c/li>\u003cli>\u003cb class=\"key\">let / make / have / watch / hear / see + O + 동사원형\u003c/b>은 to 없이 동사원형이 목적격보어로 온다.\u003c/li>\u003cli>\u003cb class=\"key\">help + O + (to)동사원형\u003c/b>은 to가 있어도 없어도 되며, 지각동사는 능동 관계에서 현재분사도 취할 수 있다.\u003c/li>\u003cli>목적격보어 구문은 '동사 + 목적어 + 보어'를 한 블록으로 묶어 앞에서부터 직독직해한다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 목적격보어 블록을 정리했어요. allow, encourage, force, cause는 to부정사를 데리고 오고, let, make, have, watch, hear, see는 동사원형을 데리고 온다는 점, 꼭 기억하세요. help는 to가 있어도 없어도 된다는 것도 함께 챙겨 두시고요. 오늘 배운 열두 문장은 소리 내서 세 번씩 읽어 보세요. 수고했어요, 다음 시간에 만나요.","hl":"sum"}]}]});</script></body></html>
