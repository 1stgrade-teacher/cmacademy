위해 숙주의 행동을 변화시킨다.</li><li>기생충(parasite)의 주된 목적은 자신의 생존(survival)</li><li>숙주(host)의 기존 행동 패턴을 변화시킴</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02행동의 변화</div><ul><li>숙주는 평소와는 완전히 다른 방식으로 행동하게 된다.</li><li>평소 행동(normal behavior)과 완전히 다른 방식</li><li>기생충의 영향을 받아 비정상적 행동을 보임</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03조종의 결과</div><ul><li>이러한 행동 변화는 기생충이 번식하거나 퍼지는 데 유리하게 작용한다.</li><li>숙주의 행동을 조종하여 이득을 취함</li><li>핵심 키워드: 숙주 조종(host manipulation)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">improve</td><td class=\"m\">개선하다, 향상시키다</td></tr><tr><td class=\"w\">chance</td><td class=\"m\">가능성, 기회</td></tr><tr><td class=\"w\">survival</td><td class=\"m\">생존</td></tr><tr><td class=\"w\">parasite</td><td class=\"m\">기생 생물</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">host</td><td class=\"m\">숙주</td></tr><tr><td class=\"w\">behave</td><td class=\"m\">행동하다</td></tr><tr><td class=\"w\">normal</td><td class=\"m\">정상적인, 보통의</td></tr><tr><td class=\"w\">behavior</td><td class=\"m\">행동, 태도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">높이기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">To improve</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 자신의 가능성을</span><span class=\"en\"><b>their own chances</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생존의,</span><span class=\"en\"><b>of survival,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 기생충들은</span><span class=\"en\"><b>some parasites</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시킨다</span><span class=\"en\"><b><span class=\"grammar-hl\">cause</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 숙주들이</span><span class=\"en\"><b><span class=\"grammar-hl\">their hosts</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행동하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to act</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 방식들로</span><span class=\"en\"><b>in ways</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 다른</span><span class=\"en\"><b><span class=\"grammar-hl\">that are very different</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 보통 행동과는</span><span class=\"en\"><b>from their normal behavior.</b></span></div></div><div class=\"lec-sent-ko\">그들 자신의 생존 가능성을 높이기 위해서 어떤 기생충들은 그들의 숙주들이 그들의 보통 행동과는 아주 다른 방식으로 행동하게 시킨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기생충이 숙주를 조종하는 이유와 그 결과를 설명하는 문장입니다. 여기서 improve는 사전적으로는 &#39;개선하다&#39;라는 뜻이지만, 여기서는 생존할 확률을 더 높게 만든다는 의미로 쓰였습니다. 필자는 기생충이 단순히 살아남는 것을 넘어 생존 가능성을 극대화하기 위해 적극적으로 숙주를 변화시킨다는 점을 강조하려고 이 단어를 골랐습니다. 이 문장은 기생충과 숙주의 관계에서 기생충이 주도권을 쥐고 상황을 통제하고 있음을 나타내며, 이후 글의 전개에서 기생충이 숙주를 어떻게 변화시키는지에 대한 구체적인 예시가 이어질 것임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To improve (to부정사): 문장 맨 앞에서 목적(~하기 위해서)을 나타내는 부사적 용법으로 쓰였습니다.</div><div class=\"lec-gr-item\">cause their hosts to act 5형식(SVOC) 구조: cause(동사) + their hosts(목적어) + to act(목적보어) 형태입니다. 목적보어로 to부정사를 취하는 5형식 문장입니다.</div><div class=\"lec-gr-item\">that are very different (관계대명사): 선행사 ways를 수식하며, 관계대명사 that 뒤에 주어가 없는 주격 관계대명사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">improve</td><td class=\"m\">개선하다, 향상시키다</td></tr><tr><td class=\"w\">chance</td><td class=\"m\">가능성, 기회</td></tr><tr><td class=\"w\">survival</td><td class=\"m\">생존</td></tr><tr><td class=\"w\">parasite</td><td class=\"m\">기생 생물</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">host</td><td class=\"m\">숙주</td></tr><tr><td class=\"w\">normal</td><td class=\"m\">정상적인, 보통의</td></tr><tr><td class=\"w\">behavior</td><td class=\"m\">행동, 태도</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>일부 기생충은 자신의 생존을 위해 숙주의 행동을 평소와 다르게 조종한다.</li><li>숙주는 기생충의 목적을 달성하기 위한 도구로 이용되어 원래의 본능과는 다른 행동을 하게 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Parasites alter host behavior to survive, so they force their hosts to act differently from their normal patterns.</div>\n              <div class=\"lec-final-sum-ko\">기생충은 생존을 위해 숙주의 행동을 바꾸며, 숙주가 평소와 다르게 행동하도록 강제한다.</div></div></div>"],"segs":[[{"audio":"./unit17_10_강의_audio/1.mp3","hl":null}],[{"audio":"./unit17_10_강의_audio/2.mp3","hl":null}],[{"audio":"./unit17_10_강의_audio/3.mp3","hl":null},{"audio":"./unit17_10_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit17_10_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit17_10_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit17_10_강의_audio/7.mp3","hl":null}],[{"audio":"./unit17_10_강의_audio/8.mp3","hl":"main"},{"audio":"./unit17_10_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit17_10_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit17_10_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")
