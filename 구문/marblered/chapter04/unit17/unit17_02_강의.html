/QU0kkAg45xgcenT16H88djQH3A4K9R36Ajn06f447Uu9f7w/PPTjP9eucc0LRrS/k13t6/L/g2AUNkkdgM5OM/l/Xp+dO/zx9ff/PXFMDJ0BGCc/5zx24HHTilLKAORycf55+vb8+xa+zWvn3t/n+DDVvZvRtvT8db/h87ikHIPXqMHjGe+evp/wDqzSYPc8EcjAznv06Z79e+MUF14JcfmOc4P1OM/wD18UFkGMEc9Mcdfb8c+nB68GnZu211217PZXT3e3Z3EnfpJaJ6ra9t/v19GOpJPlQ5xkLuAOcnA+736fTsM8cU0uozlwfqw4PcnAJ5+n49BTXOMgnAwdpPI5yO24nrkD65x0raLj7tn1ira/3dtPPXV27sxaaezVm7W306q9/k2rd1uf/Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Reality Matters: Why We Must Stay Grounded Beyond the Virtual World<small>현실의 중요성: 우리가 왜 가상 세계 너머에 발을 붙이고 살아야 하는가</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 우리가 흔히 겪는 가상 세계(virtual world)와 현실 세계(real world)의 관계에 대해 다루고 있어요. 여기서 말하는 가상 세계는 우리가 매일 사용하는 스마트폰 속의 SNS나 게임 같은 디지털 공간을 의미하는데, 가끔 우리는 이 가상 공간에 너무 몰입한 나머지 눈앞에 있는 진짜 현실을 잊어버리곤 하죠. 하지만 전기가 나가면 디지털 기기는 바로 멈추지만, 우리가 살고 있는 지구와 주변 사람들은 그대로 남아 있다는 점을 기억해야 해요. 즉, 디지털 세상이 우리 삶의 전부는 아니며, 그보다 훨씬 중요하고 단단한 현실 기반의 삶이 존재한다는 것을 강조하는 내용이니, 앞으로 읽을 글에서 기술과 현실 사이의 균형에 대해 깊이 생각해 보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01가상 세계의 위험성</div><ul><li>디지털 세상에 지나치게 몰입하면 현실을 소홀히 할 수 있다.</li><li>가상 세계(virtual world)로의 도피 경계</li><li>현실과 단절되는 상황에 대한 경고</li><li>핵심 키워드: 가상 세계(virtual world)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02현실 세계의 지속성</div><ul><li>현실 세계는 전자기기나 가상 환경과 달리 일시적이지 않다.</li><li>전력 차단(power outage)에도 변함없이 존재</li><li>사라지지 않는 실제 환경의 중요성</li><li>핵심 키워드: 현실 세계(real world), 전력 차단(power outage)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03균형 잡힌 시각</div><ul><li>기술에 의존하기보다 변치 않는 현실의 가치를 기억해야 한다.</li><li>가상 공간과 현실의 분리</li><li>실재하는 세계에 대한 책임감 유지</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">virtual</td><td class=\"m\">가상의</td></tr><tr><td class=\"w\">take away</td><td class=\"m\">떼어놓다, 멀어지게 하다</td></tr><tr><td class=\"w\">power outage</td><td class=\"m\">정전</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 허용해서는 안 된다</span><span class=\"en\"><b>We must not <span class=\"grammar-hl\">let</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가상세계가</span><span class=\"en\"><b><span class=\"grammar-hl\">the virtual world</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리를 데리고 떠나도록</span><span class=\"en\"><b><span class=\"grammar-hl\">take us away</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실세계로부터</span><span class=\"en\"><b>from the real world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사라지지 않는</span><span class=\"en\"><b><span class=\"grammar-hl\">that doesn’t go away</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정전과 함께</span><span class=\"en\"><b>with a power outage.</b></span></div></div><div class=\"lec-sent-ko\">우리는 가상세계가 정전과 함께 사라지지 않는 실세계로부터 우리를 데리고 떠나게 허용해서는 안 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 **take us away**는 사전적으로는 &#39;우리를 데리고 멀리 가다&#39;라는 뜻이지만, 여기서는 가상 세계에 너무 몰입한 나머지 현실 감각을 잃고 현실 세계와의 연결 고리가 끊어지는 상태를 의미합니다. 필자는 우리가 가상 세계에 잠식당하지 말고 현실의 중요성을 잊지 말아야 한다는 경고를 하기 위해 이 표현을 사용했습니다. 또한, **power outage**(정전)라는 구체적인 상황을 예로 들어, 전기가 없으면 작동하지 않는 가상 세계와 달리 현실 세계는 영속적임을 강조하며 두 세계의 결정적인 차이를 대조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let the virtual world take us away 5형식(SVOC) 구조: let(사역동사) + 목적어(the virtual world) + 목적보어(원형부정사 take). 사역동사 let은 목적어가 동작을 하도록 허용하거나 시키는 구조이며, 보어 자리에 동사원형을 취한다.</div><div class=\"lec-gr-item\">that doesn’t go away (관계대명사): 선행사(the real world)를 수식하는 주격 관계대명사절. that 뒤에 주어가 없는 불완전한 문장이 오며, 해당 절이 앞의 명사를 구체적으로 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">virtual</td><td class=\"m\">가상의</td></tr><tr><td class=\"w\">power outage</td><td class=\"m\">정전</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>가상 세계는 전기가 끊기면 사라지지만, 현실 세계는 변함없이 존재한다.</li><li>가상 세계에 지나치게 몰입하여 현실 세계를 외면해서는 안 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">We should not allow the virtual world to distract us from reality, because the physical world remains even when technology stops working.</div>\n              <div class=\"lec-final-sum-ko\">우리는 가상 세계가 현실로부터 우리를 멀어지게 해서는 안 되는데, 그 이유는 기술이 멈춰도 물리적 세계는 그대로 남아 있기 때문이다.</div></div></div>"],"segs":[[{"audio":"./unit17_02_강의_audio/1.mp3","hl":null}],[{"audio":"./unit17_02_강의_audio/2.mp3","hl":null}],[{"audio":"./unit17_02_강의_audio/3.mp3","hl":null},{"audio":"./unit17_02_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit17_02_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit17_02_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit17_02_강의_audio/7.mp3","hl":null}],[{"audio":"./unit17_02_강의_audio/8.mp3","hl":"main"},{"audio":"./unit17_02_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit17_02_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit17_02_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=e
