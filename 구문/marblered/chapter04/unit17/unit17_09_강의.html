떻게 인물 간의 관계를 드러내는지 집중해서 읽어보면 글의 내용을 훨씬 깊이 있게 이해할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 설정</div><ul><li>주인공은 남편이 도착하는 정확한 시간을 알고 있다.</li><li>시각: 4시 50분 (ten minutes to five)</li><li>항상 시간을 엄수함 (punctually as always)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02청각적 인지</div><ul><li>집 밖에서 차가 멈추는 소리가 들린다.</li><li>자동차의 접근 (approach)</li><li>차가 멈추는 소리를 들음 (stop outside)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">clock</td><td class=\"m\">시계</td></tr><tr><td class=\"w\">punctually</td><td class=\"m\">시간을 엄수하여, 정확한 시간에</td></tr><tr><td class=\"w\">as always</td><td class=\"m\">늘 그렇듯이, 언제나처럼</td></tr><tr><td class=\"w\">approach</td><td class=\"m\">다가오다, 접근하다</td></tr><tr><td class=\"w\">outside</td><td class=\"m\">밖에, 외부에서</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시계가</span><span class=\"en\"><b><span class=\"grammar-hl\">When the clock</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">10분을 가리켰을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">said ten minutes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">5시까지의,</span><span class=\"en\"><b><span class=\"grammar-hl\">to five,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">늘 그렇듯 정확하게,</span><span class=\"en\"><b><span class=\"grammar-hl\">punctually as always,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 들었다</span><span class=\"en\"><b><span class=\"grammar-hl\">she heard</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 자동차가 가까이 오는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">the car approach</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 밖에 멈추는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">and stop outside.</span></b></span></div></div><div class=\"lec-sent-ko\">시계가 5시 10분 전을 가리켰을 때 늘 그렇듯 정확하게, 그녀는 그 자동차가 가까이 와서 밖에 멈추는 것을 들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시계가 특정 시각을 가리키는 순간을 묘사하며 이야기가 시작됩니다. 여기서 punctually는 사전적으로 &#39;시간을 엄수하여&#39;라는 뜻인데, 여기서는 그만큼 반복적이고 규칙적인 일상이 이어지고 있음을 강조합니다. 필자는 이 단어를 통해 등장인물의 삶이 매우 정돈되어 있고 예측 가능한 상태임을 한 단어로 압축해 표현했습니다. 이 문장은 뒤이어 나올 사건의 배경이 되는 평온한 일상의 규칙성을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When the clock said ten minutes to five, punctually as always, (분사구문): When + it(the clock) + was (생략된 주어와 be동사) 구조로, 시간을 나타내는 부사절의 역할을 함. punctually as always는 &#39;항상 그랬듯 시간을 엄수하여&#39;라는 의미의 부사구로 문장의 시점을 수식함.</div><div class=\"lec-gr-item\">she heard the car approach and stop outside. 5형식(SVOC) 구조: &#39;지각동사(heard) + 목적어(the car) + 목적보어(approach and stop)&#39; 형태임. 목적어인 car가 스스로 동작을 수행하므로 목적보어 자리에 동사원형(approach, stop)이 쓰임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">clock</td><td class=\"m\">시계</td></tr><tr><td class=\"w\">punctually</td><td class=\"m\">시간을 엄수하여, 정확한 시간에</td></tr><tr><td class=\"w\">as always</td><td class=\"m\">늘 그렇듯이, 언제나처럼</td></tr><tr><td class=\"w\">approach</td><td class=\"m\">다가오다, 접근하다</td></tr><tr><td class=\"w\">outside</td><td class=\"m\">밖에, 외부에서</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>오후 4시 50분, 변함없이 규칙적인 시간에 차가 도착하는 소리가 들린다.</li><li>주인공은 일상의 정해진 흐름 속에서 외부의 움직임을 감지한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The woman consistently hears the car arrive at a specific time, which reveals the precise and repetitive nature of her daily life.</div>\n              <div class=\"lec-final-sum-ko\">그 여자는 특정 시간에 차가 도착하는 소리를 한결같이 듣는데, 이는 그녀의 일상이 매우 정확하고 반복적임을 보여준다.</div></div></div>"],"segs":[[{"audio":"./unit17_09_강의_audio/1.mp3","hl":null}],[{"audio":"./unit17_09_강의_audio/2.mp3","hl":null}],[{"audio":"./unit17_09_강의_audio/3.mp3","hl":null},{"audio":"./unit17_09_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit17_09_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit17_09_강의_audio/6.mp3","hl":null}],[{"audio":"./unit17_09_강의_audio/7.mp3","hl":"main"},{"audio":"./unit17_09_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit17_09_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit17_09_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.s
