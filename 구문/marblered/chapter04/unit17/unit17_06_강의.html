요. 결국 어떤 일을 성공적으로 수행하게 하려면 겉으로 보이는 강압보다는 스스로 움직이게 만드는 자기 결정권(Self-determination)을 존중하는 것이 훨씬 중요하다는 점을 강조하는 개념이랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 설정</div><ul><li>말을 강제로 물가까지 끌고 갈 수는 있는 상황을 제시합니다.</li><li>외부의 힘으로 대상을 특정 장소로 이동시키는 것(force)</li><li>물리적 강제력의 작용 범위</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02한계 지점</div><ul><li>대상이 스스로 원하지 않는다면 본질적인 행동은 강제할 수 없음을 보여줍니다.</li><li>물을 마시는 행위는 주체의 의지에 달려 있음(drink)</li><li>강제력(force)이 미치지 못하는 영역의 존재</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03교훈</div><ul><li>진정한 변화를 위해서는 외부의 강제보다 내부의 동기가 중요함을 강조합니다.</li><li>강요된 행동과 자발적 행동의 차이</li><li>자발성(willingness)의 중요성</li><li>핵심 키워드: 자율성(autonomy)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">force</td><td class=\"m\">강요하다</td></tr><tr><td class=\"w\">horse</td><td class=\"m\">말</td></tr><tr><td class=\"w\">river</td><td class=\"m\">강</td></tr><tr><td class=\"w\">drink</td><td class=\"m\">마시다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 말을 강요할 수 있다</span><span class=\"en\"><b>You can <span class=\"grammar-hl\">force the horse</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to go</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강으로</span><span class=\"en\"><b>to the river</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 당신은 말을 강요할 수 없다</span><span class=\"en\"><b>but you cannot <span class=\"grammar-hl\">force the horse</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마시도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to drink</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것으로부터</span><span class=\"en\"><b>from it.</b></span></div></div><div class=\"lec-sent-ko\">당신은 말이 강으로 가도록 강요할 수 있지만 당신은 말이 그것에서 마시도록 강요할 수 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 동기 부여의 한계를 나타내는 유명한 속담입니다. force는 사전적으로 &#39;물리적인 힘으로 강제로 시키다&#39;라는 뜻인데, 여기서는 상대방에게 어떤 행동을 억지로 하게 만드는 외적인 &#39;통제&#39;를 의미합니다. 필자가 이 단어를 고른 이유는 외부적 압력만으로는 상대의 내적인 의지까지 바꿀 수 없다는 사실을 강조하기 위해서입니다. 앞부분에서 강제로 시킬 수 있는 것(강가로 이동)과 뒷부분에서 결코 강요할 수 없는 것(스스로 물을 마시는 것)을 대조하여, 타인의 태도를 바꾸는 것이 얼마나 어려운 일인지 논리적으로 보여주고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">force the horse to go 5형식(SVOC) 구조: force(V) + the horse(O) + to go(OC). force는 타동사로서 목적어에게 목적보어로 to부정사를 취하도록 강요하는 구조를 가진다.</div><div class=\"lec-gr-item\">to go (to부정사): 5형식 문장에서 force의 목적보어로 사용되어, 목적어(the horse)가 수행하는 동작의 내용을 설명한다.</div><div class=\"lec-gr-item\">force the horse to drink 5형식(SVOC) 구조: force(V) + the horse(O) + to drink(OC). 앞선 구문과 동일하게 목적보어로 to부정사를 취하는 5형식 구조이다.</div><div class=\"lec-gr-item\">to drink (to부정사): 5형식 문장에서 force의 목적보어로 사용되어, 목적어(the horse)가 수행해야 하는 동작을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">force</td><td class=\"m\">강요하다</td></tr><tr><td class=\"w\">horse</td><td class=\"m\">말</td></tr><tr><td class=\"w\">river</td><td class=\"m\">강</td></tr><tr><td class=\"w\">drink</td><td class=\"m\">마시다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>타인에게 어떤 행동을 억지로 시키는 것은 가능할 수 있다.</li><li>하지만 타인의 마음이나 의지가 담긴 행동까지 강요하는 것은 불가능하다.</li><li>즉, 강요보다는 상대방이 스스로 원하게 만드는 것이 더 중요하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">External pressure can lead someone to a situation, but it cannot compel them to take action without their own inner motivation.</div>\n              <div class=\"lec-final-sum-ko\">외부의 압력으로 누군가를 어떤 상황으로 이끌 수는 있지만, 내적인 동기 없이는 그들이 행동하도록 강요할 수는 없다.</div></div></div>"],"segs":[[{"audio":"./unit17_06_강의_audio/1.mp3","hl":null}],[{"audio":"./unit17_06_강의_audio/2.mp3","hl":null}],[{"audio":"./unit17_06_강의_audio/3.mp3","hl":null},{"audio":"./unit17_06_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit17_06_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit17_06_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit17_06_강의_audio/7.mp3","hl":null}],[{"audio":"./unit17_06_강의_audio/8.mp3","hl":"main"},{"audio":"./unit17_06_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit17_06_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit17_06_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+
