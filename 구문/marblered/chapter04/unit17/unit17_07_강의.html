/td><td class=\"m\">세부 사항</td></tr><tr><td class=\"w\">well</td><td class=\"m\">잘</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 읽을 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When you read</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">요지에 초점을 맞추는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">focusing on the main idea</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 이해하도록 돕는다</span><span class=\"en\"><b><span class=\"grammar-hl\">helps you understand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세부사항들을 더 잘</span><span class=\"en\"><b>the details better.</b></span></div></div><div class=\"lec-sent-ko\">당신이 글을 읽을 때 요지에 초점을 맞추는 것은 당신이 세부사항들을 더 잘 이해하도록 돕는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글을 읽는 효율적인 전략을 제시합니다. focusing은 사전적으로 &#39;초점을 맞추다&#39;라는 뜻인데, 여기서는 글의 여러 정보 중에서 가장 중요한 줄기를 골라내어 정신을 집중하는 행위를 의미합니다. 단순히 읽는 것을 넘어, &#39;핵심(main idea)&#39;이라는 기준점을 잡아야 뒤에 나오는 &#39;세부 내용(details)&#39;들이 그 체계 안에서 명확하게 해석될 수 있음을 강조하기 위해 이 단어를 선택했습니다. 글 전체의 논리적 시작점으로서, 글을 읽는 올바른 태도를 알려주는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When you read (분사구문): 접속사(When) + 주어(you) + 동사(read) 구조의 부사절이다.</div><div class=\"lec-gr-item\">focusing on the main idea (동명사): -ing가 문장에서 주어 역할을 하는 명사구 구조이다.</div><div class=\"lec-gr-item\">helps you understand 5형식(SVOC) 구조: help + 목적어(you) + 목적격보어(understand)의 구조이며, 이때 목적격보어는 동사원형을 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">focus</td><td class=\"m\">집중하다</td></tr><tr><td class=\"w\">main</td><td class=\"m\">주요한</td></tr><tr><td class=\"w\">idea</td><td class=\"m\">생각, 개념</td></tr><tr><td class=\"w\">help</td><td class=\"m\">돕다</td></tr><tr><td class=\"w\">understand</td><td class=\"m\">이해하다</td></tr><tr><td class=\"w\">detail</td><td class=\"m\">세부 사항</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>글을 읽을 때 핵심 내용을 먼저 파악하는 것이 중요하다.</li><li>핵심을 중심으로 읽으면 세부적인 정보들도 더 정확하게 이해할 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Identifying the main idea serves as a foundation, so readers can comprehend the supporting details more clearly.</div>\n              <div class=\"lec-final-sum-ko\">중심 내용을 파악하는 것은 기반이 되므로, 독자는 뒷받침하는 세부 내용을 더 명확하게 이해할 수 있다.</div></div></div>"],"segs":[[{"audio":"./unit17_07_강의_audio/1.mp3","hl":null}],[{"audio":"./unit17_07_강의_audio/2.mp3","hl":null}],[{"audio":"./unit17_07_강의_audio/3.mp3","hl":null},{"audio":"./unit17_07_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit17_07_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit17_07_강의_audio/6.mp3","hl":null}],[{"audio":"./unit17_07_강의_audio/7.mp3","hl":"main"},{"audio":"./unit17_07_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit17_07_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit17_07_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf
