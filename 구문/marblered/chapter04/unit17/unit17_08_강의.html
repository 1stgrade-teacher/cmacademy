th:100vw;height:100vh;height:100dvh;margin:0;border-radius:0;box-shadow:none}.top{padding:9px 14px;font-size:13px}.slide{padding:16px 15px}.bar{padding:9px 11px;gap:7px}button{padding:8px 11px;font-size:13px}.cnt{font-size:12px}.lec-cover-title{font-size:21px;line-height:1.25}.lec-cover-title small{font-size:13.5px;margin-top:4px}.lec-cover-body,.lec-sum-body{flex-direction:column;gap:13px;align-items:stretch}.lec-cover-img,.lec-sum-img{flex:0 0 auto;width:100%;max-width:100%;max-height:30vh;align-self:auto}.lec-flow{overflow:visible}.lec-stage{padding:9px 12px;margin-bottom:7px}.lec-stage-head{font-size:14px}.lec-stage ul{font-size:13px;padding-left:16px;line-height:1.5}.lec-flow-only .lec-stage{padding:9px 12px;margin-bottom:7px}.lec-flow-only .lec-stage-head{font-size:14px}.lec-flow-only .lec-stage ul{font-size:13px;padding-left:16px;line-height:1.5}.lec-sent-no{font-size:12.5px;margin-bottom:6px}.lec-chunks{gap:13px 12px;margin-bottom:12px}.lec-chunk .en{font-size:18px;line-height:1.3}.lec-chunk .ko{font-size:12.5px}.lec-sent-en{font-size:18px;line-height:1.35;margin-bottom:9px}.lec-sent-ko{font-size:13.5px;margin-bottom:9px}.lec-grammar,.lec-grammar.lec-meaning{font-size:13.5px;padding:8px 11px}.lec-voca-wrap{flex-direction:column;gap:0;margin-top:8px}.lec-voca-tbl td{font-size:15px;line-height:1.4;padding:4px 6px}.lec-section-tag{font-size:12px;margin-bottom:8px}.lec-summary-bullets{font-size:13.5px;line-height:1.45}.lec-summary-line{font-size:14.5px;margin:4px 0 10px}}</style></head><body><div class="stage"><div class="top"><span class="brand">AI 강의</span><span class="pname">unit17_08</span></div><div class="slide" id="s"></div><div class="bar"><div class="tl" id="tl"><i id="fill"></i></div><span class="cnt" id="c"></span><select id="rate" title="재생 속도" style="background:#2b2820;color:#f4f1ea;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:8px 8px;font-weight:700;cursor:pointer;"><option value="1">1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="1.8">1.8x</option><option value="2">2.0x</option></select><button onclick="go(-1)">◀</button><button class="pl" id="pp" onclick="toggle()">▶ 재생</button><button onclick="go(1)">▶</button></div></div><script>var D={"slides":["<div class=\"lec-cover-title lec-cover-center\">Student Course Evaluations: Feedback for Improvement or Just a Routine?<small>학생들의 강의 평가: 개선을 위한 피드백인가, 아니면 그저 관례인가?</small></div>","<div class=\"lec-cover-title\">Student Course Evaluations: Feedback for Improvement or Just a Routine?<small>학생들의 강의 평가: 개선을 위한 피드백인가, 아니면 그저 관례인가?</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 대학에서 강의를 듣고 나면 교수님의 수업 방식이나 강의 내용에 대해 평가하는 &#39;강의 평가(Course Evaluation)&#39;를 해본 적 있나요? 이 제도는 학생들이 직접 자신의 학습 경험을 피드백함으로써 교육의 질을 개선하고 대학의 운영 방향을 결정하는 중요한 지표로 활용됩니다. 마치 우리가 배달 음식이나 쇼핑몰 이용 후에 남기는 &#39;리뷰&#39;처럼, 강의 평가는 수업이 효과적이었는지 학생들의 만족도는 어땠는지 확인하는 일종의 품질 보증 시스템이라고 할 수 있어요. 대학은 이러한 익명의 데이터를 모아 교수법을 수정하거나 커리큘럼을 보완하는 데 사용하는데, 이는 교육 현장에서 학생들의 목소리를 반영하여 수업 환경을 민주적으로 발전시키려는 목적이 담겨 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01강의 평가 시행</div><ul><li>대부분의 대학교에서는 학생들이 수강한 모든 강의에 대해 평가하도록 하고 있다.</li><li>모든 수강 과목 대상 (every course)</li><li>학생들의 의무적인 평가 작성 (fill out an evaluation)</li><li>핵심 키워드: 강의 평가(course evaluation)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02제도적 목적</div><ul><li>대학은 강의 평가를 통해 교육의 질을 관리하고 개선하고자 한다.</li><li>수업 방식 개선을 위한 데이터 수집</li><li>교육의 질적 향상 도모</li><li>핵심 키워드: 대학(universities), 피드백(feedback)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">university</td><td class=\"m\">대학</td></tr><tr><td class=\"w\">fill out</td><td class=\"m\">(서류 등을) 작성하다</td></tr><tr><td class=\"w\">evaluation</td><td class=\"m\">평가</td></tr><tr><td class=\"w\">course</td><td class=\"m\">강좌, 수업</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대부분의 대학들은</span><span class=\"en\"><b>Most universities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들이 ~하게 시킨다</span><span class=\"en\"><b><span class=\"grammar-hl\">have students</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작성하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">fill out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">평가서를</span><span class=\"en\"><b>an evaluation</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 강좌의</span><span class=\"en\"><b>of <span class=\"grammar-hl\">every course</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 수강하는</span><span class=\"en\"><b><span class=\"grammar-hl\">they take</span>.</b></span></div></div><div class=\"lec-sent-ko\">대부분의 대학들은 학생들이 그들이 수강하는 모든 강좌의 평가서를 작성하게 시킨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로서, 대학에서 강의 평가가 보편적으로 이루어지고 있다는 사실을 설명합니다. 여기서 have는 사전적으로 &#39;가지다&#39;라는 뜻이지만, 여기서는 사역동사로 쓰여 학생들에게 평가서 작성을 &#39;시키다&#39; 혹은 &#39;하도록 하다&#39;라는 의미를 가집니다. 필자가 굳이 이 단어를 선택한 이유는 대학이라는 교육 기관에서 학생들에게 평가 과정이 일종의 공식적인 절차이자 당연한 의무로 주어짐을 나타내기 위해서입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have students fill out 5형식(SVOC) 구조: &#39;have + 목적어(students) + 목적보어(동사원형 fill out)&#39; 형태의 사역동사 구문이다. 주어가 목적어에게 동작을 시키거나 하게 함을 나타낸다.</div><div class=\"lec-gr-item\">every course they take (관계대명사): course와 they 사이에 목적격 관계대명사(that 또는 which)가 생략되어 있다. 뒤의 they take에서 타동사 take의 목적어 자리가 비어 있는 불완전한 문장이며, 앞의 명사 course를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fill out</td><td class=\"m\">(서류 등을) 작성하다</td></tr><tr><td class=\"w\">evaluation</td><td class=\"m\">평가</td></tr><tr><td class=\"w\">course</td><td class=\"m\">강좌, 수업</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>대다수 대학은 학생들이 수강한 모든 강의를 평가하도록 제도화하고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Universities collect course evaluations from students to assess teaching quality, yet the impact of these reviews on enhancing academic instruction is often questioned.</div>\n              <div class=\"lec-final-sum-ko\">대학은 수업의 질을 평가하기 위해 학생들로부터 강의 평가를 수집하지만, 이러한 평가가 수업 개선에 미치는 영향에 대해서는 의문이 제기되기도 한다.</div></div></div>"],"segs":[[{"audio":"./unit17_08_강의_audio/1.mp3","hl":null}],[{"audio":"./unit17_08_강의_audio/2.mp3","hl":null}],[{"audio":"./unit17_08_강의_audio/3.mp3","hl":null},{"audio":"./unit17_08_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit17_08_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit17_08_강의_audio/6.mp3","hl":null}],[{"audio":"./unit17_08_강의_audio/7.mp3","hl":"main"},{"audio":"./unit17_08_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit17_08_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit17_08_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
