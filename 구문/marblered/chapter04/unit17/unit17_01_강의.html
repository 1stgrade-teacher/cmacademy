vBPBBP1z/n/AOufU0AL/n/P+fXn1P8AP6/h7f1927hxz1z+GOue/GefTvxS7h6j0oAWj/P+f0pu5fUdCeo7dc/T/HNLuHcjk4Hv+H1z+WelAC0hI9D69MHv649On9DSZGfvDA3Z5HbGfy7+lLuHHI5Gev8Akfr9M0BvsA7emP8A9X6ehx9etL/9f/PGP/rUgYMOPcdfTg9D2P4ikLLg88cjjB+v5e9ADvpRTdy4ySMex9MZ6eh4P60FlHUj/P8AKgB1J+PQ4Oe/0/Hj8++KMjGc/wCe/wBcAE/gaMj1H/6/8/lzQAvHT8fzprZ2nHUClyOOnPTp/n06e1B4U9sA++OP1oYf16/16f8AB//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">How Online Social Networking Widens Our Circle of Friends<small>온라인 소셜 네트워킹이 친구 범위를 넓히는 방법</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">인터넷 소셜 네트워크(Internet Social Networking)란 온라인 공간에서 개인 간의 관계를 맺고 소통하는 서비스를 의미해요. 우리가 흔히 사용하는 SNS나 커뮤니티가 대표적인데, 이는 물리적인 거리의 제약을 넘어 전 세계 사람들과 교류할 수 있는 환경을 만들어 주죠. 과거에는 친구를 사귈 때 주로 학교나 동네처럼 직접 만날 수 있는 범위 내로 한정되었지만, 이제는 공통의 관심사나 취미를 중심으로 훨씬 넓은 인적 네트워크(Human Network)를 형성할 수 있게 되었답니다. 마치 전 세계가 하나의 큰 마을처럼 연결되는 셈인데, 이러한 변화가 우리의 인간관계와 사회적 소통 방식을 어떻게 바꾸고 있는지 이번 지문을 통해 함께 살펴보면 좋을 것 같아요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01관계의 확장</div><ul><li>인터넷 기반의 사회적 연결망은 우리의 대인 관계 범위를 넓혀줍니다.</li><li>소셜 네트워크(social networking)의 활용</li><li>물리적 거리를 넘어선 친구 관계(circle of friends) 형성</li><li>핵심 키워드: 확장(expand)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02소통의 변화</div><ul><li>디지털 환경은 이전보다 훨씬 더 쉽게 타인과 소통할 수 있는 기반을 제공합니다.</li><li>시공간의 제약을 받지 않는 연결</li><li>새로운 사람들과 교류할 기회 증가</li><li>핵심 키워드: 연결망(networking)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">Internet</td><td class=\"m\">인터넷</td></tr><tr><td class=\"w\">social</td><td class=\"m\">사회의, 사교적인</td></tr><tr><td class=\"w\">networking</td><td class=\"m\">네트워크 형성, 인맥 쌓기</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">가능하게 하다, 허락하다</td></tr><tr><td class=\"w\">expand</td><td class=\"m\">확장하다, 넓히다</td></tr><tr><td class=\"w\">circle of friends</td><td class=\"m\">친구 관계, 친구 집단</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인터넷 소셜 네트워킹은</span><span class=\"en\"><b>Internet social networking</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리를 가능하게 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">allows us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확장하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to expand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 친구 범위를</span><span class=\"en\"><b>our circle of friends.</b></span></div></div><div class=\"lec-sent-ko\">인터넷 소셜 네트워킹은 우리가 우리의 친구 범위를 확장하는 것을 가능하게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 circle of friends는 사전적으로는 &#39;친구들의 원&#39;이지만, 문맥상 &#39;나와 친밀하게 교류하는 인간관계의 영역&#39;을 의미합니다. 필자는 인간관계를 평면적인 목록이 아니라 내가 중심이 되어 뻗어 나가는 하나의 &#39;영역&#39;으로 시각화하기 위해 이 표현을 사용했습니다. 이 문장은 인터넷을 통해 인간관계가 물리적 거리를 넘어 어떻게 변화할 수 있는지를 보여주는 도입부 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">allows us to expand 5형식(SVOC) 구조: allow + O(us) + 목적보어(to expand) 형태입니다. 목적어가 보어로 to부정사를 취하는 구조로, &#39;우리가 확장할 수 있게 하다&#39;라는 의미를 가집니다.</div><div class=\"lec-gr-item\">to expand (to부정사): 5형식 구조에서 목적보어(OC) 역할을 하는 명사적 용법의 to부정사입니다. allow의 목적어인 us의 동작을 보충 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">Internet</td><td class=\"m\">인터넷</td></tr><tr><td class=\"w\">social</td><td class=\"m\">사회의, 사교적인</td></tr><tr><td class=\"w\">networking</td><td class=\"m\">네트워크 형성, 인맥 쌓기</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">가능하게 하다, 허락하다</td></tr><tr><td class=\"w\">expand</td><td class=\"m\">확장하다, 넓히다</td></tr><tr><td class=\"w\">circle of friends</td><td class=\"m\">친구 관계, 친구 집단</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인터넷 소셜 네트워크 서비스는 우리가 기존에 가졌던 인간관계의 틀을 깨고 더 넓은 범위로 친구를 사귈 수 있게 돕는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Internet social networking enables individuals to interact with others, and it serves as a tool for enlarging their social network.</div>\n              <div class=\"lec-final-sum-ko\">인터넷 소셜 네트워킹은 개인이 타인과 교류할 수 있게 하며, 사회적 관계망을 넓히는 도구 역할을 한다.</div></div></div>"],"segs":[[{"audio":"./unit17_01_강의_audio/1.mp3","hl":null}],[{"audio":"./unit17_01_강의_audio/2.mp3","hl":null}],[{"audio":"./unit17_01_강의_audio/3.mp3","hl":null},{"audio":"./unit17_01_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit17_01_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit17_01_강의_audio/6.mp3","hl":null}],[{"audio":"./unit17_01_강의_audio/7.mp3","hl":"main"},{"audio":"./unit17_01_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit17_01_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit17_01_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var t
