<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01우정의 부재</div><ul><li>친구 없이 보내는 하루는 공허함으로 가득 차 있음을 나타낸다.</li><li>꿀이 한 방울도 남지 않은 단지에 비유</li><li>친구가 없는 외로운 상태를 시각적으로 묘사</li><li>핵심 키워드: 친구 없는 날 (a day without a friend), 꿀(honey)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02우정의 가치</div><ul><li>우정은 삶을 풍요롭게 만드는 필수적인 요소이다.</li><li>꿀처럼 삶에 달콤함과 활력을 주는 존재</li><li>친구와 함께하는 시간의 중요성 강조</li><li>핵심 키워드: 비유(metaphor), 가치(value)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">friend</td><td class=\"m\">친구</td></tr><tr><td class=\"w\">pot</td><td class=\"m\">단지, 냄비</td></tr><tr><td class=\"w\">single</td><td class=\"m\">단 하나의</td></tr><tr><td class=\"w\">drop</td><td class=\"m\">방울</td></tr><tr><td class=\"w\">honey</td><td class=\"m\">꿀</td></tr><tr><td class=\"w\">leave</td><td class=\"m\">남기다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하루는</span><span class=\"en\"><b>A day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친구가 없는</span><span class=\"en\"><b>without a friend</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~와 같다 단지와</span><span class=\"en\"><b>is like a pot</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꿀이 단 한 방울도 없는</span><span class=\"en\"><b>without a single drop of honey</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안에 남아 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">left</span> inside.</b></span></div></div><div class=\"lec-sent-ko\">친구가 없는 하루는 안에 남아 있는 꿀이 단 한 방울도 없는 단지와 같다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 친구가 없는 삶의 허전함과 외로움을 비유를 통해 강조하고 있습니다. 여기서 pot은 사전적으로 &#39;항아리&#39;를 의미하지만, 여기서는 &#39;나의 일상이나 마음&#39;을 빗댄 표현입니다. 또한 honey는 &#39;꿀&#39;이라는 사전적 의미를 넘어, 삶에서 느끼는 &#39;기쁨, 행복, 또는 활력&#39;을 상징합니다. 필자는 단순히 &quot;친구가 없으면 슬프다&quot;라고 말하는 대신, 텅 빈 항아리라는 시각적인 이미지를 사용하여 친구의 부재가 가져오는 삶의 공허함을 독자가 더 생생하게 느끼도록 이 단어들을 골랐습니다. 앞부분의 &#39;친구가 없는 하루&#39;라는 상황을 뒷부분의 &#39;꿀 없는 항아리&#39;라는 상황과 유기적으로 연결하여, 친구가 없는 상태가 얼마나 결핍된 상태인지를 극명하게 대비시켰습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">left (과거분사): left가 앞의 명사구 &#39;a single drop of honey&#39;를 수식하는 구조. &#39;p.p. + N&#39; 혹은 &#39;N + p.p.&#39;는 &#39;p.p.된 N&#39;의 의미를 가지며, 여기서는 &#39;남겨진 꿀 한 방울&#39;이라는 의미로 꿀이 남겨진 상태를 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">friend</td><td class=\"m\">친구</td></tr><tr><td class=\"w\">pot</td><td class=\"m\">단지, 냄비</td></tr><tr><td class=\"w\">single</td><td class=\"m\">단 하나의</td></tr><tr><td class=\"w\">drop</td><td class=\"m\">방울</td></tr><tr><td class=\"w\">honey</td><td class=\"m\">꿀</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>친구가 없는 하루는 마치 꿀이 텅 빈 항아리처럼 아무런 즐거움이나 의미가 없는 상태이다.</li><li>삶에서 친구라는 존재는 마치 꿀처럼 달콤한 기쁨을 채워주는 필수적인 요소이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Friendship brings essential happiness to our lives, so living without a friend makes our daily existence feel empty.</div>\n              <div class=\"lec-final-sum-ko\">우정은 우리 삶에 필수적인 행복을 가져다주며, 친구 없이 살아가는 것은 우리의 일상을 공허하게 만든다.</div></div></div>"],"segs":[[{"audio":"./unit19_09_강의_audio/1.mp3","hl":null}],[{"audio":"./unit19_09_강의_audio/2.mp3","hl":null}],[{"audio":"./unit19_09_강의_audio/3.mp3","hl":null},{"audio":"./unit19_09_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit19_09_강의_audio/
