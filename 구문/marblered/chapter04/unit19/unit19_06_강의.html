01교통수단의 개선</div><ul><li>기술 발전에 따른 교통의 발전이 기존의 물리적 제약을 무너뜨리고 있다.</li><li>이동 방식의 획기적인 개선 (Improved methods of transportation)</li><li>시간과 비용의 효율성 증대</li><li>핵심 키워드: 교통(transportation), 개선(improved)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02거리 개념의 소멸</div><ul><li>과거 사람들이 서로 떨어져 있게 만들었던 거리의 의미가 사라지고 있다.</li><li>거리에 대한 기존 관념 폐기 (discard the concept of distance)</li><li>과거의 물리적 거리 개념이 더 이상 유효하지 않음</li><li>핵심 키워드: 거리(distance), 개념(concept)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03인간 관계의 변화</div><ul><li>사람들을 고립시켰던 장벽이 사라지면서 상호작용이 더욱 쉬워지고 있다.</li><li>과거의 분리 현상 해소 (keeping people separated)</li><li>사람 간의 물리적 장벽 제거</li><li>핵심 키워드: 분리(separated), 인간(man)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">improve</td><td class=\"m\">개선하다, 향상시키다</td></tr><tr><td class=\"w\">method</td><td class=\"m\">방법, 방식</td></tr><tr><td class=\"w\">transportation</td><td class=\"m\">수송, 운송</td></tr><tr><td class=\"w\">force</td><td class=\"m\">강요하다, ~하게 만들다</td></tr><tr><td class=\"w\">discard</td><td class=\"m\">버리다, 폐기하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">concept</td><td class=\"m\">개념</td></tr><tr><td class=\"w\">distance</td><td class=\"m\">거리</td></tr><tr><td class=\"w\">responsible</td><td class=\"m\">책임이 있는, 원인이 되는</td></tr><tr><td class=\"w\">separate</td><td class=\"m\">분리하다, 떨어뜨려 놓다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">개선된 수단들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Improved methods</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교통의</span><span class=\"en\"><b>of transportation</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람에게 강요하고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are forcing</span> man</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개념을 버리라고</span><span class=\"en\"><b><span class=\"grammar-hl\">to discard</span> the concept</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거리의</span><span class=\"en\"><b>of distance</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과거에</span><span class=\"en\"><b>in the past</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">원인이었던</span><span class=\"en\"><b><span class=\"grammar-hl\">responsible for</span> <span class=\"grammar-hl\">keeping</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 떨어져 있게 하는</span><span class=\"en\"><b><span class=\"grammar-hl\">people separated</span>.</b></span></div></div><div class=\"lec-sent-ko\">개선된 교통수단은 사람들에게 과거에 사람들이 따로 떨어지게 한 원인인 거리 개념을 버리도록 강요하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 교통의 발달이 사람들을 물리적으로 갈라놓았던 &#39;거리&#39;라는 과거의 인식을 현대 사회에서는 더 이상 유효하지 않은 것으로 만들고 있다는 뜻입니다. 여기서 discard는 사전적으로 &#39;버리다&#39;라는 뜻인데, 여기서는 단순히 물건을 버리는 것이 아니라 더 이상 필요 없어진 과거의 낡은 사고방식을 &#39;청산하다&#39;는 의미로 쓰였습니다. 저자는 교통의 비약적인 발전으로 인해 물리적 거리의 장벽이 완전히 무너졌음을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Improved methods (과거분사(형용사)): improved가 methods를 수식하며 &#39;개선된 방법들&#39;이라는 의미를 형성함. 과거분사 + N 구조로, &#39;N that is/was p.p.&#39;의 축약 관계절임.</div><div class=\"lec-gr-item\">are forcing (현재진행): are + -ing 구조로, &#39;강요하고 있다&#39;는 동작의 진행 상태를 나타냄.</div><div class=\"lec-gr-item\">forcing man to discard 5형식(SVOC) 구조: force + 목적어(man) + 목적보어(to부정사) 형태. 목적어인 man이 목적보어인 to부정사 동작(버리는 것)을 하도록 강요하다는 구조임.</div><div class=\"lec-gr-item\">to discard (to부정사): force 동사의 목적보어로 쓰여, 문장에서 &#39;버리는 것&#39;이라는 동작적 의미를 보충함.</div><div class=\"lec-gr-item\">responsible for (과거분사(형용사)): responsible이 분사처럼 쓰여 앞의 the concept를 수식하며 &#39;책임이 있는&#39;이라는 상태를 나타냄.</div><div class=\"lec-gr-item\">keeping people separated 5형식(SVOC) 구조: keep + 목적어(people) + 목적보어(과거분사 separated) 구조. 사람들을 분리된 상태로 유지한다는 의미이며, keep은 여기서 5형식으로 쓰임.</div><div class=\"lec-gr-item\">separated (과거분사(형용사)): keep의 목적보어로 쓰여, 사람들이 &#39;분리된&#39; 상태임을 나타내는 형용사적 역할을 함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">improve</td><td class=\"m\">개선하다, 향상시키다</td></tr><tr><td class=\"w\">method</td><td class=\"m\">방법, 방식</td></tr><tr><td class=\"w\">transportation</td><td class=\"m\">수송, 운송</td></tr><tr><td class=\"w\">discard</td><td class=\"m\">버리다, 폐기하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">concept</td><td class=\"m\">개념</td></tr><tr><td class=\"w\">distance</td><td class=\"m\">거리</td></tr><tr><td class=\"w\">responsible</td><td class=\"m\">책임이 있는, 원인이 되는</td></tr><tr><td class=\"w\">separate</td><td class=\"m\">분리하다, 떨어뜨려 놓다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>교통 수단이 발달하면서 예전에는 큰 장애물이었던 &#39;거리&#39;의 개념이 무의미해졌다.</li><li>기술의 발전이 인간으로 하여금 과거의 공간적 제약에서 벗어나도록 강요하고 있다.</li><li>이제 사람들은 물리적 거리에 구애받지 않고 서로 연결될 수 있는 환경에 놓이게 되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Improved transportation has rendered the traditional concept of distance obsolete, and it has enabled people to overcome previous physical separations.</div>\n              <div class=\"lec-final-sum-ko\">교통수단의 발달은 전통적인 거리의 개념을 쓸모없게 만들었으며, 사람들이 이전의 물리적 분리를 극복할 수 있게 했다.</div></div></div>"],"segs":[[{"audio":"./unit19_06_강의_audio/1.mp3","hl":null}],[{"audio":"./unit19_06_강의_audio/2.mp3","hl":null}],[{"audio":"./unit19_06_강의_audio/3.mp3","hl":null},{"audio":"./unit19_06_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit19_06_강의_audio/5.mp3","hl":"sta
