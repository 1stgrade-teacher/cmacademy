er-title\">How Human Evolution Transcends Genetics: The Power of Ancestral Knowledge<small>인간의 진화가 유전자를 뛰어넘는 방법: 조상 지식의 힘</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">사람은 단순히 유전자에 새겨진 본능대로만 사는 동물이 아니라, 조상들이 쌓아온 지혜와 경험을 전수받아 삶의 방식을 결정하는 특별한 존재예요. 이를 전문 용어로 문화적 진화(Cultural Evolution)라고 하는데, 마치 우리가 스마트폰 사용법을 스스로 발명하는 대신 매뉴얼을 읽고 배우는 것과 같은 원리죠. 유전자는 생물학적으로만 전달되지만, 문화는 언어와 교육을 통해 세대 간에 축적된 지식(Accumulated Knowledge)으로 이어집니다. 이런 능력이 있었기에 인류는 짧은 시간 안에 지구상의 다른 생명체들과는 차원이 다른 문명 발전(Civilization Development)을 이룰 수 있었던 거예요. 즉, 우리는 조상들의 뇌를 빌려 세상을 살아가는 셈인데, 이 과정을 이해하면 인간만이 왜 독보적으로 진화했는지 그 이유를 쉽게 알 수 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01인간의 독특한 생존 방식</div><ul><li>인간은 다른 종과 달리 유전 정보만으로 살지 않고 조상의 지식을 활용하는 유일한 존재이다.</li><li>유전자에만 의존하지 않는 생존 전략</li><li>축적된 지식(accumulated knowledge)을 생활의 지침으로 삼음</li><li>핵심 키워드: 조상의 지식(ancestors&#39; knowledge)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02문화적 진화의 시작</div><ul><li>인간은 조상들이 남긴 가르침을 통해 삶의 방식을 습득한다.</li><li>유전적 본능(DNA)을 넘어선 학습 과정</li><li>세대를 거쳐 쌓인 경험이 생활 안내서가 됨</li><li>핵심 키워드: 지침(guidance)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03인간만이 가진 특별함</div><ul><li>지식을 전달하고 공유하는 능력은 인간을 특별한 종으로 만들었다.</li><li>생존 방법을 스스로 개척하는 독자성</li><li>정보의 축적을 통해 생존 확률을 높임</li><li>핵심 키워드: 유일한 종(the only species)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">species</td><td class=\"m\">종(생물 분류 단위)</td></tr><tr><td class=\"w\">acquire</td><td class=\"m\">얻다, 습득하다</td></tr><tr><td class=\"w\">guidance</td><td class=\"m\">지도, 안내, 지침</td></tr><tr><td class=\"w\">accumulate</td><td class=\"m\">축적하다, 쌓다</td></tr><tr><td class=\"w\">ancestor</td><td class=\"m\">조상</td></tr><tr><td class=\"w\">rather than</td><td class=\"m\">~이 아니라, ~ 대신에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인간은 되었다</span><span class=\"en\"><b>Humans became</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유일한 종이</span><span class=\"en\"><b>the only species</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지침을 획득한</span><span class=\"en\"><b><span class=\"grammar-hl\">to acquire</span> guidance</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 살 것인가에 관한</span><span class=\"en\"><b><span class=\"grammar-hl\">on how to live</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">축적된 지식으로부터</span><span class=\"en\"><b>from the <span class=\"grammar-hl\">accumulated knowledge</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 조상들의</span><span class=\"en\"><b>of their ancestors,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~라기보다는</span><span class=\"en\"><b>rather than</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 그들의 DNA로부터</span><span class=\"en\"><b>just from their DNA.</b></span></div></div><div class=\"lec-sent-ko\">인간은 단지 자신들의 DNA로부터라기보다는 그들의 조상들의 축적된 지식으로부터 살아가는 방법에 관한 지침을 획득한 유일한 종이 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인간이 다른 생명체와 구별되는 결정적인 차이점을 제시하는 문장입니다. 여기서 acquire는 사전적으로 &#39;얻다, 획득하다&#39;인데, 여기서는 지식이나 지혜를 내 것으로 만들어 삶의 나침반으로 삼는다는 능동적인 의미를 담고 있습니다. 필자는 단순히 본능(DNA)에 의존하는 동물과 달리, 학습을 통해 삶의 방식을 선택하는 인간만의 고유성을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to acquire (to부정사): the only species를 수식하는 형용사적 용법으로, 앞에 나온 명사를 보충 설명하며 ‘~하는(획득할)’의 의미를 가짐</div><div class=\"lec-gr-item\">on how to live (간접의문문): 의문사(how) + to부정사 구조로, 전치사 on의 목적어 역할을 수행하며 ‘어떻게 살아야 하는지’라는 명사적 의미를 가짐</div><div class=\"lec-gr-item\">accumulated knowledge (과거분사): accumulated가 knowledge를 수식하며, ‘축적된 지식’이라는 의미를 형성함. N + p.p. 구조로 ‘N이/가 p.p.된’의 관계로 이해함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">species</td><td class=\"m\">종(생물 분류 단위)</td></tr><tr><td class=\"w\">acquire</td><td class=\"m\">얻다, 습득하다</td></tr><tr><td class=\"w\">guidance</td><td class=\"m\">지도, 안내, 지침</td></tr><tr><td class=\"w\">accumulate</td><td class=\"m\">축적하다, 쌓다</td></tr><tr><td class=\"w\">ancestor</td><td class=\"m\">조상</td></tr><tr><td class=\"w\">rather than</td><td class=\"m\">~이 아니라, ~ 대신에</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간은 생물학적 유전 정보인 DNA만으로 살아가는 다른 동물들과 다르다.</li><li>인간은 조상들이 쌓아온 지식을 학습함으로써 삶의 방향을 결정한다.</li><li>이러한 특성 덕분에 인간은 유전자에 얽매이지 않고 지식을 계승하며 살아가는 유일한 종이 되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Humans are the only species that utilize the accumulated wisdom of their ancestors, and they use this knowledge to guide their way of life instead of depending only on DNA.</div>\n              <div class=\"lec-final-sum-ko\">인간은 조상의 축적된 지혜를 활용하는 유일한 종이며, DNA에만 의존하지 않고 이 지식을 삶의 지침으로 삼는다.</div></div></div>"],"segs":[[{"audio":"./unit19_07_강의_audio/1.mp3","hl":null}],[{"audio":"./unit19_07_강의_audio/2.mp3","hl":null}],[{"audio":"./unit19_07_강의_audio/3.mp3","hl":null},{"audio":"./unit19_07_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit19_07_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit19_07_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit19_07_강의_audio/7.mp3","hl":null}],[{"audio":"./unit19_07_강의_audio/8.mp3","hl":"main"},{"audio":"./unit19_07_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit19_07_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit19_07_강의_audi e=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
