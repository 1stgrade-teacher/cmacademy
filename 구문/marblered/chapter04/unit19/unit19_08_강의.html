HPU+nfq3QnPfg0+q9P6089fuDT8PK72v8vPX0uxC24k4+vv+ftjnoaYxODt6qB6fX/JIPp1pcruxuXJHqMDoMkg/rzjn8FAHJAzkHHHXg9eDngE46YAz8vNJPbom0l21t5aK+moL79rfhvfouv59T//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Understanding the Global Village: Connectivity Through Communication and Trade<small>지구촌의 이해: 통신과 무역을 통한 연결성</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">지구촌(Global village)이란 현대적인 통신 기술과 무역의 발달로 인해 전 세계가 마치 하나의 마을처럼 밀접하게 연결되어 있다는 개념을 말해요. 과거에는 물리적인 거리가 멀면 교류하기 힘들었지만, 지금은 인터넷이나 스마트폰을 통해 지구 반대편의 소식을 실시간으로 확인하고, 해외 직구로 외국 물건을 손쉽게 구매할 수 있게 되었죠. 이러한 상호 연결성(Interconnectivity) 덕분에 우리는 이제 한 국가의 문제가 곧 전 세계의 문제로 이어지는 공동체 의식을 갖게 되었습니다. 마치 옆집에 사는 이웃과 소통하듯 전 세계 사람들과 교류하는 이 현상은 현대 사회를 이해하는 데 아주 중요한 핵심 키워드랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01지구촌의 정의</div><ul><li>현대 사회는 통신과 무역을 통해 전 세계가 하나의 공동체처럼 연결되어 있습니다.</li><li>전 세계 국가들을 하나로 묶어서 생각하는 개념</li><li>현대 사회의 핵심 특징: 긴밀한 연결 (closely connected)</li><li>핵심 키워드: 지구촌(global village)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02연결의 수단</div><ul><li>국가 간의 긴밀한 관계는 현대적인 기술과 경제 활동을 바탕으로 이루어집니다.</li><li>정보와 소식을 빠르게 주고받는 통신(communication)의 발달</li><li>국가 간의 물자와 서비스 이동을 의미하는 무역(trade)</li><li>지리적 거리를 극복하고 하나로 이어주는 기반이 됨</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">global</td><td class=\"m\">세계적인, 지구의</td></tr><tr><td class=\"w\">village</td><td class=\"m\">마을</td></tr><tr><td class=\"w\">country</td><td class=\"m\">나라, 국가</td></tr><tr><td class=\"w\">think of A as B</td><td class=\"m\">A를 B라고 생각하다</td></tr><tr><td class=\"w\">closely</td><td class=\"m\">긴밀하게, 면밀히</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">connect</td><td class=\"m\">연결하다</td></tr><tr><td class=\"w\">modern</td><td class=\"m\">현대의</td></tr><tr><td class=\"w\">communication</td><td class=\"m\">의사소통, 통신</td></tr><tr><td class=\"w\">trade</td><td class=\"m\">무역, 거래</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지구촌은</span><span class=\"en\"><b>The global village</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 나라들이다</span><span class=\"en\"><b>is all the countries</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계의</span><span class=\"en\"><b>of the world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~로 여겨지는</span><span class=\"en\"><b><span class=\"grammar-hl\">thought of</span> <span class=\"grammar-hl\">as being</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밀접하게 연결된</span><span class=\"en\"><b><span class=\"grammar-hl\">closely connected</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현대의 통신과 무역으로</span><span class=\"en\"><b>by modern communication and trade.</b></span></div></div><div class=\"lec-sent-ko\">지구촌은 현대의 통신과 무역으로 밀접하게 연결된 것으로 여겨지는 세계의 모든 나라들이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 &#39;지구촌(global village)&#39;이라는 용어의 정의를 설명하며 글의 도입부 역할을 합니다. 여기서 global village는 사전적으로는 &#39;지구적인 마을&#39;이지만, 실제로는 국가 간의 물리적 거리감이 사라지고 서로 긴밀한 영향을 주고받는 현대 사회를 비유합니다. 필자는 현대 사회가 마치 하나의 작은 마을처럼 촘촘히 얽혀 있다는 점을 강조하기 위해 &#39;마을&#39;이라는 단어를 선택하여, 세계화된 현대 문명의 특성을 한눈에 보여주고자 했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thought of (과거분사(형용사)): thought of이 the countries를 수식하며 &#39;생각되는/간주되는&#39;의 의미를 가짐. N + p.p. 구조로 &#39;p.p.된 N&#39;(= the countries that are thought of)을 의미함.</div><div class=\"lec-gr-item\">as being closely connected (동명사): 전치사 as의 목적어로 쓰임. being은 전치사 뒤에 위치하여 명사적 기능을 수행함.</div><div class=\"lec-gr-item\">being closely connected (현재진행(수동)): being + p.p. 형태. &#39;연결되는 중인&#39;이라는 진행의 수동 의미를 나타냄. connect는 타동사인데 목적어가 없어서 수동구조 being connected를 사용함. 기본구조: connect A (A를 연결하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">global</td><td class=\"m\">세계적인, 지구의</td></tr><tr><td class=\"w\">village</td><td class=\"m\">마을</td></tr><tr><td class=\"w\">closely</td><td class=\"m\">긴밀하게, 면밀히</td></tr><tr><td class=\"w\">connect</td><td class=\"m\">연결하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">modern</td><td class=\"m\">현대의</td></tr><tr><td class=\"w\">communication</td><td class=\"m\">의사소통, 통신</td></tr><tr><td class=\"w\">trade</td><td class=\"m\">무역, 거래</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>지구촌은 현대의 통신과 무역 기술을 바탕으로 전 세계가 하나의 공동체처럼 연결된 상태를 의미한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The global village represents all countries linked together by modern communication, and it is defined by their close trade relationships.</div>\n              <div class=\"lec-final-sum-ko\">지구촌은 현대 통신으로 연결된 모든 국가를 의미하며, 이는 밀접한 무역 관계로 정의된다.</div></div></div>"],"segs":[[{"audio":"./unit19_08_강의_audio/1.mp3","hl":null}],[{"audio":"./unit19_08_강의_audio/2.mp3","hl":null}],[{"audio":"./unit19_08_강의_audio/3.mp3","hl":null},{"audio":"./unit19_08_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit19_08_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit19_08_강의_audio/6.mp3","hl":null}],[{"audio":"./unit19_08_강의_audio/7.mp3","hl":"main"},{"audio":"./unit19_08_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit19_08_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit19_08_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new
