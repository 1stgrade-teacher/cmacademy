lass=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 항공 역사에서 기념비적인 기록을 세운 재클린 코크런(Jacqueline Cochran)에 관한 이야기예요. 여기서 핵심 개념인 음속 돌파(breaking the sound barrier)란 비행기가 소리의 속도와 같거나 더 빠르게 날아갈 때 발생하는 물리적 현상을 말하는데, 과거에는 비행기가 공기의 벽에 부딪혀 부서질 것이라고 믿었기에 이를 극복하는 것이 비행 기술의 가장 큰 도전 과제 중 하나였죠. 마치 빠르게 달리는 자동차가 공기 저항을 뚫고 나가는 것과 비슷한 원리로, 당시 조종사들은 엄청난 속도에서 기체가 흔들리는 위험을 감수해야 했답니다. 또한, 대서양 횡단(transatlantic crossing) 비행은 넓은 바다 위에서 기상 변화와 연료 문제를 해결해야 하는 고난도 임무였기에, 여성이 이러한 기록을 세웠다는 것은 당시 사회적으로나 기술적으로 매우 혁신적인 성과로 평가받아요. 이 지문을 읽기 전에, 당시 항공 기술이 급격히 발전하던 시대적 배경을 떠올려 보면 조종사들이 느꼈을 도전 정신을 훨씬 더 잘 이해할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01음속 돌파</div><ul><li>재클린 코크란은 여성 조종사로서 최초로 음속의 벽을 넘어서는 기록을 세웠다.</li><li>1953년 최초의 여성 음속 돌파 조종사 기록 (sound barrier)</li><li>항공 역사에서 여성의 한계를 뛰어넘음</li><li>핵심 키워드: 음속 돌파(sound barrier)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02대서양 횡단</div><ul><li>그녀는 제트기를 조종하여 대서양을 건넌 첫 번째 여성이기도 했다.</li><li>제트기를 이용한 대서양 횡단 성공 (pilot a jet)</li><li>여성으로서 최초로 달성한 기록</li><li>핵심 키워드: 대서양 횡단(across the Atlantic)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pilot</td><td class=\"m\">조종사</td></tr><tr><td class=\"w\">break</td><td class=\"m\">돌파하다, 깨뜨리다</td></tr><tr><td class=\"w\">sound barrier</td><td class=\"m\">음속 장벽</td></tr><tr><td class=\"w\">additionally</td><td class=\"m\">게다가, 추가적으로</td></tr><tr><td class=\"w\">female</td><td class=\"m\">여성</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pilot</td><td class=\"m\">조종하다</td></tr><tr><td class=\"w\">jet</td><td class=\"m\">제트기</td></tr><tr><td class=\"w\">across</td><td class=\"m\">~을 가로질러, 횡단하여</td></tr><tr><td class=\"w\">Atlantic</td><td class=\"m\">대서양</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1953년에,</span><span class=\"en\"><b>In 1953,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잭클린 콕크란은</span><span class=\"en\"><b>Jacqueline Cochran</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">되었다</span><span class=\"en\"><b>became</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">첫 번째 여성 조종사가</span><span class=\"en\"><b>the first woman pilot</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">깨뜨린</span><span class=\"en\"><b><span class=\"grammar-hl\">to break</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음속 장벽을</span><span class=\"en\"><b>the sound barrier.</b></span></div></div><div class=\"lec-sent-ko\">1953년에, Jacqueline Cochran[잭클린 콕크란]은 음속 장벽을 깬 최초의 여성 조종사가 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1953년이라는 특정 시점을 제시하며 그녀의 첫 번째 업적을 소개합니다. 여기서 **break**는 사전적으로 &#39;부수다&#39;라는 뜻이지만, 여기서는 &#39;속도의 한계를 돌파하다&#39;라는 의미로 쓰였습니다. 단순히 벽을 깨는 것이 아니라, 인간이 넘을 수 없다고 여겨지던 물리적 한계를 정면으로 뚫고 지나갔다는 성취감을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to break (to부정사): 앞의 명사(woman pilot)를 수식하는 형용사적 용법으로, ‘~하는’이라는 의미로 명사의 내용을 보충 설명함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pilot</td><td class=\"m\">조종사</td></tr><tr><td class=\"w\">break</td><td class=\"m\">돌파하다, 깨뜨리다</td></tr><tr><td class=\"w\">sound barrier</td><td class=\"m\">음속 장벽</td></tr><tr><td class=\"w\">pilot</td><td class=\"m\">조종하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">게다가,</span><span class=\"en\"><b>Additionally,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b>she</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었다</span><span class=\"en\"><b>was</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">첫 번째 여성이</span><span class=\"en\"><b>the first female</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조종한</span><span class=\"en\"><b><span class=\"grammar-hl\">to pilot</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제트기를</span><span class=\"en\"><b>a jet</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대서양을 가로질러</span><span class=\"en\"><b>across the Atlantic.</b></span></div></div><div class=\"lec-sent-ko\">게다가, 그녀는 대서양을 횡단하여 제트기를 조종한 최초의 여성이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 소개한 첫 번째 업적에 이어, 그녀가 이룩한 또 다른 업적을 추가하며 그녀의 선구자적인 면모를 부각합니다. &#39;Additionally(게다가)&#39;를 통해 그녀가 단 하나의 기록에 그치지 않고, 계속해서 여성으로서 새로운 역사를 써 내려갔음을 논리적으로 연결하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to pilot (to부정사): 앞의 명사(female)를 수식하는 형용사적 용법으로, ‘~하는’이라는 의미로 명사의 내용을 구체화함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pilot</td><td class=\"m\">조종사</td></tr><tr><td class=\"w\">additionally</td><td class=\"m\">게다가, 추가적으로</td></tr><tr><td class=\"w\">female</td><td class=\"m\">여성</td></tr><tr><td class=\"w\">pilot</td><td class=\"m\">조종하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">jet</td><td class=\"m\">제트기</td></tr><tr><td class=\"w\">across</td><td class=\"m\">~을 가로질러, 횡단하여</td></tr><tr><td class=\"w\">Atlantic</td><td class=\"m\">대서양</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>재클린 코크란은 1953년 음속의 장벽을 넘은 첫 번째 여성 비행사이다.</li><li>그녀는 제트기로 대서양을 건넌 최초의 여성이라는 기록도 세웠다.</li><li>두 기록을 통해 그녀가 항공 역사에서 여성의 한계를 넓힌 선구자였음을 보여준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Jacqueline Cochran achieved historic milestones in aviation by breaking the sound barrier and piloting a jet across the Atlantic.</div>\n              <div class=\"lec-final-sum-ko\">재클린 코크란은 음속을 돌파하고 제트기를 조종해 대서양을 횡단하며 항공 분야에서 역사적인 이정표를 세웠다.</div></div></div>"],"segs":[[{"audio":"./unit19_04_강의_audio/1.mp3","hl":null}],[{"audio":"./unit19_04_강의_audio/2.mp3","hl":null}],[{"audio":"./unit19_04_강의_audio/3.mp3","hl":null},{"audio":"./unit19_04_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit19_04_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit19_04_강의_audio/6.mp3","hl":null}],[{"audio":"./unit19_04_강의_audio/7.mp3","hl":"main"},{"audio":"./unit19_04_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit19_04_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit19_04_강의_audio/10.mp3","hl":"main"},{"audio":"./unit19_04_강의_audio/11.mp3","hl":"meaning"},{"audio":"./unit19_04_강의_audio/12.mp3","hl":"grammar"}],[{"audio":"./unit19_04_강의_audio/13.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBou
