/rn/PNJ3+uccHj6H07c5/MU3en95cexGePqR1PbOO/0N6DksCPqPy4z7fmPWjf8h2a0tqO/z9evv/nmk6devfGcYz354/P8gDSBlOMuvJPcduR0P6d8jOM8m5ckZUfVh2H17gfr064PULfP0+TfTtf/AIYXr/n/ACP50HsexxjqOf8APX264AJKB0P8a+vUf5+gPfPvQZFHG4dD/EOg+meDxz7jAOeD0F3XZa99/wAPwH9h+I79uf60DOPX3HbP48Z9D+HWmb1x94YHHUH+X1/WkMiL1Izjjlc9R7/Tj3HocA0m9kPx3/z/AIc/09hSevoOPx+n9fpxzkm9Ou5cdMbhwO+CfTOfxHWk3rj7wHIHzEdeccZH4Drz054BX6XX+SdtfTVd/i01Y716YHTpnJyefXp/OmMdyvz0BOOh7568DoORjHfFIT8wzs64A3enOR83oDkA7vwpQuAeh4YDnouOGzyTx6ngdT2qtF12S0euul9P+G102TJbu1o7pbpaq6hZXTVmr7Wesfmv/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Painting: A Bridge Connecting Two Minds<small>회화: 두 마음을 잇는 가교</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">예술 작품을 감상할 때 단순히 눈에 보이는 형태나 색채만을 보는 것이 아니라, 작가의 의도와 관람자의 해석이 만나는 지점을 이해하는 것이 중요합니다. 이를 의사소통(Communication) 관점에서 바라보면, 그림은 작가의 머릿속에 있는 추상적인 생각이나 감정을 관람자에게 전달하기 위한 하나의 매개체(Medium) 역할을 하죠. 마치 우리가 언어를 통해 대화하듯, 화가는 붓과 물감이라는 도구를 사용하여 자신의 내면세계를 캔버스에 투영하고 관람자는 이를 각자의 경험을 통해 재해석합니다. 즉, 예술은 단순히 결과물을 보여주는 것이 아니라 서로의 인지적 세계(Cognitive world)를 연결하는 다리라고 볼 수 있습니다. 이처럼 예술을 소통의 과정으로 이해한다면, 작품 속 숨겨진 의미를 찾아내는 감상의 즐거움을 훨씬 더 깊이 있게 느낄 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01회화의 본질</div><ul><li>그림은 단순히 물감이 칠해진 종이가 아니라 화가와 관객을 연결하는 매개체입니다.</li><li>예술적 소통의 시작 (artistic communication)</li><li>화가의 생각과 감정을 전달함</li><li>핵심 키워드: 다리(bridge)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02관계의 형성</div><ul><li>화가가 그림을 통해 자신의 내면을 표현하면 관객은 그것을 받아들이며 소통이 완성됩니다.</li><li>화가의 마음(painter&#39;s mind)을 표현함</li><li>관객(viewer)이 그림을 감상하며 화가와 교감함</li><li>핵심 키워드: 연결(linking)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">painting</td><td class=\"m\">회화, 그림 그리기</td></tr><tr><td class=\"w\">bridge</td><td class=\"m\">다리, 가교</td></tr><tr><td class=\"w\">link</td><td class=\"m\">연결하다, 잇다</td></tr><tr><td class=\"w\">painter</td><td class=\"m\">화가</td></tr><tr><td class=\"w\">viewer</td><td class=\"m\">보는 사람, 관객</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그림은</span><span class=\"en\"><b>Painting</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다리일 뿐이다</span><span class=\"en\"><b>is only a bridge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화가의 마음을 연결하는</span><span class=\"en\"><b><span class=\"grammar-hl\">linking</span> the painter’s mind</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보는 사람의 그것과</span><span class=\"en\"><b>with <span class=\"grammar-hl\">that of the viewer</span>.</b></span></div></div><div class=\"lec-sent-ko\">그림은 화가의 마음을 보는 사람의 마음과 연결하는 다리일 뿐이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 회화의 핵심적인 역할을 비유를 통해 정의하고 있습니다. 여기서 bridge는 사전적으로 &#39;강이나 골짜기를 건너게 해주는 구조물&#39;을 뜻하지만, 여기서는 &#39;화가의 생각과 감정을 관람자에게 전달하는 매개체&#39;라는 문맥상 의미로 쓰였습니다. 필자는 그림이라는 시각 매체가 단순히 예쁜 이미지를 보여주는 것이 아니라, 보이지 않는 &#39;마음&#39;을 연결해 주는 통로임을 강조하기 위해 이 낱말을 골랐습니다. 앞부분의 &#39;only&#39;는 그림 자체가 목적이 아니라 소통을 위한 도구임을 나타내며, 문장 전체적으로 화가와 관람자라는 두 대상을 이어주는 논리적 연결 고리 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">linking (현재분사): linking이 앞에 있는 명사 a bridge를 수식하는 구조. a bridge that links ~로 풀이 가능하며, 다리(bridge)가 마음을 연결하는 동작을 하고 있으므로 현재분사를 사용함.</div><div class=\"lec-gr-item\">that of the viewer (관용표현): that은 앞서 언급된 명사 &#39;the painter&#39;s mind&#39;를 지칭하는 대명사로, 반복을 피하기 위해 사용됨. &#39;that of the viewer&#39;는 &#39;the mind of the viewer&#39;를 의미함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">painting</td><td class=\"m\">회화, 그림 그리기</td></tr><tr><td class=\"w\">bridge</td><td class=\"m\">다리, 가교</td></tr><tr><td class=\"w\">link</td><td class=\"m\">연결하다, 잇다</td></tr><tr><td class=\"w\">painter</td><td class=\"m\">화가</td></tr><tr><td class=\"w\">viewer</td><td class=\"m\">보는 사람, 관객</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>회화는 화가의 예술적 의도와 관람자의 감상을 연결하는 매개체이다.</li><li>그림은 화가와 관람자가 서로의 마음을 공유하게 만드는 소통의 도구이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Painting acts as a connecting bridge, and it allows the viewer to communicate with the artist&#39;s mind.</div>\n              <div class=\"lec-final-sum-ko\">회화는 연결하는 다리 역할을 하며, 관람객이 화가의 마음과 소통할 수 있게 해준다.</div></div></div>"],"segs":[[{"audio":"./unit19_01_강의_audio/1.mp3","hl":null}],[{"audio":"./unit19_01_강의_audio/2.mp3","hl":null}],[{"audio":"./unit19_01_강의_audio/3.mp3","hl":null},{"audio":"./unit19_01_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit19_01_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit19_01_강의_audio/6.mp3","hl":null}],[{"audio":"./unit19_01_강의_audio/7.mp3","hl":"main"},{"audio":"./unit19_01_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit19_01_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit19_01_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(
