class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01후회 편향의 정의</div><ul><li>이미 일어난 일을 마치 예상했던 것처럼 생각하는 심리적 경향을 말한다.</li><li>핵심 개념: 후회 편향 (hindsight bias)</li><li>결과가 나온 뒤에 예견할 수 있었다고 과대평가(overestimate)함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02편향의 특징</div><ul><li>실제로는 예측이 불가능했던 상황임에도 불구하고 자신이 그것을 맞힐 수 있었다고 믿는다.</li><li>예측이 불가능한(could not possibly have been predicted) 결과에 대한 착각</li><li>자신의 능력(ability)을 실제보다 높게 평가함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03심리학적 관점</div><ul><li>심리학(psychology)에서는 이러한 인간의 인지적 오류를 설명하기 위해 이 용어를 사용한다.</li><li>현상을 분석하는 심리학적 용어 (term)</li><li>과거를 돌아보며 현재의 지식을 과거에 투영함</li><li>핵심 키워드: 후회 편향(hindsight bias), 과대평가(overestimate)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hindsight</td><td class=\"m\">뒤늦은 깨달음, 사후 약방문</td></tr><tr><td class=\"w\">bias</td><td class=\"m\">편향, 선입견</td></tr><tr><td class=\"w\">psychology</td><td class=\"m\">심리학</td></tr><tr><td class=\"w\">explain</td><td class=\"m\">설명하다</td></tr><tr><td class=\"w\">tendency</td><td class=\"m\">경향, 성향</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">overestimate</td><td class=\"m\">과대평가하다</td></tr><tr><td class=\"w\">ability</td><td class=\"m\">능력</td></tr><tr><td class=\"w\">predict</td><td class=\"m\">예측하다, 예견하다</td></tr><tr><td class=\"w\">outcome</td><td class=\"m\">결과</td></tr><tr><td class=\"w\">possibly</td><td class=\"m\">아마, 도저히(부정문에서 강조)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사후인지 편향은</span><span class=\"en\"><b>Hindsight bias</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">용어이다</span><span class=\"en\"><b>is a term</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심리학에서 사용되는</span><span class=\"en\"><b><span class=\"grammar-hl\">used</span> in psychology</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">설명하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to explain</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들의 경향을</span><span class=\"en\"><b>the tendency of people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 능력을 과대평가하려는</span><span class=\"en\"><b><span class=\"grammar-hl\">to overestimate</span> their ability</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결과를 예측했던</span><span class=\"en\"><b><span class=\"grammar-hl\">to have predicted</span> an outcome</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결코 ~할 수 없었던</span><span class=\"en\"><b><span class=\"grammar-hl\">that could not possibly</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예측될 수 없었던</span><span class=\"en\"><b><span class=\"grammar-hl\">have been predicted</span>.</b></span></div></div><div class=\"lec-sent-ko\">사후인지 편향은 아마도 예측될 수 없었던 어떤 결과를 예측했던 자신들의 능력을 과대평가하는 사람들의 경향을 설명하기 위해 심리학에서 사용되는 용어이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 소재인 &#39;사후 확신 편향&#39;의 정의를 내리고 있습니다. 여기서 overestimate는 사전적으로 &#39;과대평가하다&#39;라는 뜻인데, 여기서는 실제로 자신이 결과를 맞힐 수 없었음에도 불구하고, 이미 결과를 알고 난 뒤 마치 자신이 다 알고 있었다고 착각하는 사람들의 심리를 꼬집기 위해 사용되었습니다. 필자는 이 단어를 통해 사람들이 자신의 예측력을 실제보다 부풀려서 생각하는 오류를 강조하고 있습니다. 또한 hindsight는 &#39;뒤늦은 깨달음&#39;이라는 뜻으로, 사건이 벌어진 &#39;후(hind)&#39;에야 비로소 모든 게 분명해 보인다고 느끼는 인간의 인지적 특성을 나타내기 위해 이 용어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">used (과거분사): used가 앞의 명사 term을 수식(= ~에 사용되는 용어). &#39;p.p. + N&#39; 구조로, 명사 term이 지칭하는 대상이 심리학에서 사용됨을 나타낸다.</div><div class=\"lec-gr-item\">to explain (to부정사): 부사적 용법(목적)으로 쓰여, 용어(term)의 목적이나 기능을 나타낸다.</div><div class=\"lec-gr-item\">to overestimate (to부정사): 명사 tendency를 수식하는 형용사적 용법으로, &#39;overestimate하는 경향&#39;이라는 의미를 형성한다.</div><div class=\"lec-gr-item\">to have predicted (to부정사): 완료부정사(to have p.p.) 형태로, 문장의 본동사(overestimate)보다 앞선 시점의 일을 나타낸다.</div><div class=\"lec-gr-item\">that could not possibly have been predicted (관계대명사): 주격 관계대명사 that이 선행사 outcome을 수식하며, 절 내부에서 주어 역할을 한다. 뒤에 수동태(could not have been predicted)가 포함된 절이 이어진다.</div><div class=\"lec-gr-item\">could not possibly have been predicted (수동태): 조동사(could)+have+been+p.p.(predicted) 구조. predict는 타동사인데 목적어가 없어서 수동구조로 쓴다. 기본구조: predict + O(목적어)를 취하며, 결과(outcome)를 예측하는 능동의 관계를 상정한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hindsight</td><td class=\"m\">뒤늦은 깨달음, 사후 약방문</td></tr><tr><td class=\"w\">bias</td><td class=\"m\">편향, 선입견</td></tr><tr><td class=\"w\">psychology</td><td class=\"m\">심리학</td></tr><tr><td class=\"w\">explain</td><td class=\"m\">설명하다</td></tr><tr><td class=\"w\">tendency</td><td class=\"m\">경향, 성향</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">overestimate</td><td class=\"m\">과대평가하다</td></tr><tr><td class=\"w\">ability</td><td class=\"m\">능력</td></tr><tr><td class=\"w\">predict</td><td class=\"m\">예측하다, 예견하다</td></tr><tr><td class=\"w\">outcome</td><td class=\"m\">결과</td></tr><tr><td class=\"w\">possibly</td><td class=\"m\">아마, 도저히(부정문에서 강조)</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사후 확신 편향은 결과가 나온 뒤에 자신이 그것을 예측할 수 있었다고 착각하는 심리 현상이다.</li><li>예측 불가능한 일을 마치 당연한 일처럼 생각하는 인간의 인지적 오류를 설명하는 개념이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Hindsight bias causes people to overestimate their predictive power, even though the actual outcomes were impossible to foresee.</div>\n              <div class=\"lec-final-sum-ko\">사후확신편향은 실제 결과가 예견 불가능했음에도 사람들이 자신의 예측 능력을 과대평가하게 만든다.</div></div></div>"],"segs":[[{"audio":"./unit19_11_강의_audio/1.mp3","hl":null}],[{"audio":"./unit19_11_강의_audio/2.mp3","hl":null}],[{"audio":"./unit19_11_강의_audio/3.mp3","hl":null},{"audio":"./unit19_11_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit19_11_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit19_11_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit19_11_강의_audio/7.mp3","hl":null}],[{"audio":"./unit19_11_강의_audio/8.mp3","hl":"main"},{"audio":"./unit19_11_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit19_11_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit19_11_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
