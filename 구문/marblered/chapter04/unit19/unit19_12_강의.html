to succeed)을 통한 국가적 위상 제고</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03기대 효과</div><ul><li>성공적인 개발은 보건 위기 극복과 국가 경쟁력 강화의 핵심이 되었다.</li><li>보건 안보를 위한 필수적 대응</li><li>제약 산업의 기술적 우위 확보(industrial leadership)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pharmaceutical</td><td class=\"m\">제약의, 약학의</td></tr><tr><td class=\"w\">succeed</td><td class=\"m\">성공하다</td></tr><tr><td class=\"w\">develop</td><td class=\"m\">개발하다</td></tr><tr><td class=\"w\">vaccine</td><td class=\"m\">백신</td></tr><tr><td class=\"w\">treatment</td><td class=\"m\">치료(법)</td></tr><tr><td class=\"w\">coronavirus</td><td class=\"m\">코로나바이러스</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 나라들은</span><span class=\"en\"><b>Lots of countries</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 제약회사들이 원했다</span><span class=\"en\"><b><span class=\"grammar-hl\">wanted their pharmaceutical companies</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최초가 되기를</span><span class=\"en\"><b><span class=\"grammar-hl\">to be</span> the first</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">성공하는 데 있어서 개발하는 것에</span><span class=\"en\"><b><span class=\"grammar-hl\">to succeed</span> in <span class=\"grammar-hl\">developing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">백신과 치료제를</span><span class=\"en\"><b>vaccines and treatments</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">코로나바이러스에 대한</span><span class=\"en\"><b>for coronavirus.</b></span></div></div><div class=\"lec-sent-ko\">많은 나라들은 자신의 제약회사들이 코로나바이러스에 대한 백신과 치료제 개발에 성공하는 최초가 되길 바랐다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 코로나19 팬데믹 상황에서 각 국가가 자국의 제약사를 통해 주도권을 잡으려 했던 치열한 경쟁의 시작을 설명합니다. 여기서 **succeed**는 사전적으로는 &#39;성공하다&#39;이지만, 문맥상으로는 전 세계가 주목하는 백신 개발이라는 &#39;치열한 경쟁에서 승리하다&#39;는 의미를 담고 있습니다. 필자는 단순히 성공을 넘어 국가 간 경쟁에서의 우위를 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wanted their pharmaceutical companies to be 5형식(SVOC) 구조: want + O + toV(목적격보어). want는 5형식 동사로 목적어(their pharmaceutical companies)가 to부정사(to be)라는 행위를 하기를 원한다는 구조입니다.</div><div class=\"lec-gr-item\">to be the first (to부정사): 앞선 5형식 구조에서 want의 목적격보어로 쓰인 명사적 용법의 to부정사구입니다.</div><div class=\"lec-gr-item\">to succeed (to부정사): the first를 수식하는 형용사적 용법으로, 첫 번째가 되는 대상의 범위를 한정합니다.</div><div class=\"lec-gr-item\">developing (동명사): 전치사 in의 목적어로 쓰인 명사적 역할의 동명사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pharmaceutical</td><td class=\"m\">제약의, 약학의</td></tr><tr><td class=\"w\">succeed</td><td class=\"m\">성공하다</td></tr><tr><td class=\"w\">develop</td><td class=\"m\">개발하다</td></tr><tr><td class=\"w\">vaccine</td><td class=\"m\">백신</td></tr><tr><td class=\"w\">treatment</td><td class=\"m\">치료(법)</td></tr><tr><td class=\"w\">coronavirus</td><td class=\"m\">코로나바이러스</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>코로나19가 발생했을 때 여러 국가가 자국 제약사의 백신·치료제 조기 개발을 간절히 원했다.</li><li>이는 국가적 자존심과 방역 주도권을 차지하기 위한 전 세계적인 경쟁 국면을 보여준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Countries are striving to be the pioneers in developing medical solutions, as they aim to secure their national pharmaceutical success during the pandemic.</div>\n              <div class=\"lec-final-sum-ko\">각국은 팬데믹 상황에서 제약 분야의 국가적 성과를 확보하기 위해, 의료 솔루션 개발의 선두 주자가 되려고 노력하고 있다.</div></div></div>"],"segs":[[{"audio":
