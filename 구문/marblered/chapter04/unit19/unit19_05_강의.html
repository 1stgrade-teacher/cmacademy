uiding Your Life: The Role of Beliefs and Values<small>삶의 이정표: 신념과 가치의 역할</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 살아가면서 내리는 모든 결정의 기준이 되는 것은 바로 자신의 신념(Beliefs)과 가치관(Values)인데, 이는 마치 항해하는 배가 길을 잃지 않도록 방향을 잡아주는 나침반과 같은 역할을 합니다. 여기서 신념이란 어떤 것이 사실이거나 옳다고 믿는 마음을 뜻하고, 가치관은 삶에서 무엇이 중요하고 소중한지를 판단하는 개인적인 척도를 의미해요. 심리학적으로 사람들은 자신의 행동과 신념이 일치할 때 정서적인 안정감을 느끼는데, 이를 인지 부조화(Cognitive Dissonance) 이론의 관점에서 보면 자신의 가치와 반대되는 행동을 할 때 느끼는 불편함을 해소하기 위해서라도 우리는 가치관에 따라 선택하는 것이 매우 중요합니다. 즉, 남들의 시선을 따르는 대신 내면의 기준을 확립하는 것은 더 행복하고 만족스러운 삶을 살아가기 위한 필수적인 과정이라고 할 수 있어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01신념과 가치의 중요성</div><ul><li>우리가 살아가는 방식을 결정할 때 우리의 신념과 가치가 기준이 되어야 합니다.</li><li>삶의 방향성(direction of life) 설정</li><li>내면의 믿음(beliefs)과 소중히 여기는 가치(values)</li><li>핵심 키워드: 신념(beliefs), 가치(values)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02의사결정의 지침</div><ul><li>삶에서 내리는 모든 선택은 개인의 신념과 가치라는 틀 안에서 이루어져야 합니다.</li><li>일상적인 결정(decisions)의 기준점</li><li>개인적인 삶의 방식(how to live)을 구성하는 근거</li><li>핵심 키워드: 의사결정(decisions), 삶의 방식(how to live)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가치 중심적인 삶</div><ul><li>자신의 신념을 바탕으로 삶을 이끌어 나가는 것은 주체적인 삶을 살기 위한 필수 요소입니다.</li><li>외부의 영향보다 내면의 기준을 우선시함</li><li>삶의 일관성(consistency)과 의미 유지</li><li>핵심 키워드: 인도하다(guide), 주체성(autonomy)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">belief</td><td class=\"m\">신념</td></tr><tr><td class=\"w\">value</td><td class=\"m\">가치관</td></tr><tr><td class=\"w\">guide</td><td class=\"m\">이끌다, 안내하다</td></tr><tr><td class=\"w\">decision</td><td class=\"m\">결정</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 허용해야 한다</span><span class=\"en\"><b>We should <span class=\"grammar-hl\">let</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 신념과 가치관이</span><span class=\"en\"><b><span class=\"grammar-hl\">our beliefs and values</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이끌도록</span><span class=\"en\"><b><span class=\"grammar-hl\">guide</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 결정을</span><span class=\"en\"><b>our decisions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 살지에 관한</span><span class=\"en\"><b>about <span class=\"grammar-hl\">how to live</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 삶을</span><span class=\"en\"><b><span class=\"grammar-hl\">our life</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 우리의 신념과 가치관이 우리의 삶을 어떻게 살아야 할지에 관한 우리의 결정을 이끌도록 허용해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우리는 삶을 살아가는 방식에 관해 스스로 내리는 선택들이, 단순히 외부의 자극이나 충동에 휘둘리는 것이 아니라 자신이 평소 지니고 있던 근본적인 생각과 소중히 여기는 가치들에 의해 결정되도록 해야 한다는 의미입니다. 여기서 guide는 사전적으로 &#39;길을 안내하다&#39;라는 뜻이지만, 여기서는 우리의 결정이 올바른 방향으로 나아가도록 &#39;결정에 영향력을 행사하게 하라&#39;는 의미로 쓰였습니다. 자신의 삶을 주도적으로 살아가기 위해서는 외부 기준이 아닌 내면의 기준이 결정의 중심이 되어야 한다는 필자의 강조 의도가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let our beliefs and values guide 5형식(SVOC) 구조: &#39;let(사역동사) + 목적어(our beliefs and values) + 목적보어(guide)&#39; 형태입니다. 사역동사 let은 목적보어로 동사원형을 취합니다.</div><div class=\"lec-gr-item\">how to live our life (간접의문문(명사구)): &#39;의문사(how) + to부정사&#39; 구조입니다. 문장에서 전치사 about의 목적어 역할을 하는 명사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">belief</td><td class=\"m\">신념</td></tr><tr><td class=\"w\">value</td><td class=\"m\">가치관</td></tr><tr><td class=\"w\">guide</td><td class=\"m\">이끌다, 안내하다</td></tr><tr><td class=\"w\">decision</td><td class=\"m\">결정</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우리는 인생의 여러 선택을 할 때 자신의 신념과 가치관을 중심에 두어야 한다.</li><li>외부 상황이나 타인의 기준이 아니라, 자신의 내면적 가치가 삶의 방향을 결정하게 만들어야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">We ought to allow our internal beliefs and values to direct the decisions we make about how to live.</div>\n              <div class=\"lec-final-sum-ko\">우리는 삶을 살아가는 방식에 대한 결정을 내릴 때 자신의 내면적 신념과 가치가 길잡이가 되도록 해야 한다.</div></div></div>"],"segs":[[{"audio":"./unit19_05_강의_audio/1.mp3","hl":null}],[{"audio":"./unit19_05_강의_audio/2.mp3","hl":null}],[{"audio":"./unit19_05_강의_audio/3.mp3","hl":null},{"audio":"./unit19_05_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit19_05_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit19_05_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit19_05_강의_audio/7.mp3","hl":null}],[{"audio":"./unit19_05_강의_audio/8.mp3","hl":"main"},{"audio":"./unit19_05_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit19_05_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit19_05_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s
