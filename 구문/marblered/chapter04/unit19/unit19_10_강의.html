d class=\"w\">select</td><td class=\"m\">선택하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">different</td><td class=\"m\">다른</td></tr><tr><td class=\"w\">option</td><td class=\"m\">선택 사항</td></tr><tr><td class=\"w\">computer</td><td class=\"m\">컴퓨터</td></tr><tr><td class=\"w\">menu</td><td class=\"m\">메뉴</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마우스는</span><span class=\"en\"><b>A mouse</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기구이다</span><span class=\"en\"><b>is a device</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 쉽게 만드는</span><span class=\"en\"><b><span class=\"grammar-hl\">making it easier</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선택하는 것을 여러 선택 사항들을</span><span class=\"en\"><b><span class=\"grammar-hl\">to select</span> different options</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">컴퓨터 메뉴로부터</span><span class=\"en\"><b>from computer menus.</b></span></div></div><div class=\"lec-sent-ko\">마우스는 컴퓨터 메뉴에서 여러 선택 사항들을 고르는 것을 더 쉽게 만드는 기구이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 주제인 &#39;마우스&#39;의 정의를 내리고 있습니다. 여기서 device는 사전적으로 &#39;장치, 기구&#39;를 뜻하며, 문맥상 컴퓨터를 조작하기 위한 물리적인 도구를 의미합니다. 필자는 마우스가 단순히 &#39;물건&#39;이 아니라 인간의 작업을 돕는 &#39;도구&#39;라는 점을 강조하기 위해 이 단어를 선택했습니다. 이 문장은 마우스가 무엇인지 처음 밝히며, 이어질 내용에서 마우스의 기능이나 중요성을 설명하기 위한 기초가 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">making (현재분사): making이 뒤의 목적보어구(it easier to select...)를 이끌며 앞의 명사(a device)를 수식하는 구조임. &#39;…하는 (장치)&#39;라는 의미로 이해할 수 있음.</div><div class=\"lec-gr-item\">making it easier to select 5형식(SVOC) 구조: make(동사) + it(가목적어) + easier(목적보어/형용사) + to select(진목적어/to부정사) 구조임. 목적어 자리에 to부정사가 길게 올 때 가목적어 it을 사용하는 패턴임.</div><div class=\"lec-gr-item\">to select (to부정사): 5형식 구조에서 make의 진목적어 역할을 하는 명사적 용법임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">device</td><td class=\"m\">장치</td></tr><tr><td class=\"w\">select</td><td class=\"m\">선택하다</td></tr><tr><td class=\"w\">different</td><td class=\"m\">다른</td></tr><tr><td class=\"w\">option</td><td class=\"m\">선택 사항</td></tr><tr><td class=\"w\">computer</td><td class=\"m\">컴퓨터</td></tr><tr><td class=\"w\">menu</td><td class=\"m\">메뉴</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>마우스는 컴퓨터 화면상의 여러 메뉴를 간편하게 선택하도록 돕는 도구이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">A computer mouse functions as a hardware device that makes it easier for users to select various options from computer menus.</div>\n              <div class=\"lec-final-sum-ko\">컴퓨터 마우스는 사용자가 컴퓨터 메뉴에서 다양한 옵션을 더 쉽게 선택할 수 있도록 돕는 하드웨어 장치이다.</div></div></div>"],"segs":[[{"audio":"./unit19_10_강의_audio/1.mp3","hl":null}],[{"audio":"./unit19_10_강의_audio/2.mp3","hl":null}],[{"audio":"./unit19_10_강의_audio/3.mp3","hl":null},{"audio":"./unit19_10_강의_audio/4.mp3","hl":"stage-0"}],[{"audio":"./unit19_10_강의_audio/5.mp3","hl":null}],[{"audio":"./unit19_10_강의_audio/6.mp3","hl":"main"},{"audio":"./unit19_10_강의_audio/7.mp3","hl":"meaning"},{"audio":"./unit19_10_강의_audio/8.mp3","hl":"grammar"}],[{"audio":"./unit19_10_강의_audio/9.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++
