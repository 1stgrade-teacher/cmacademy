정은 실수를 줄여줌</li><li>전달하려는 내용의 질을 높이는 방법</li><li>핵심 키워드: 의사소통(Communication)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rehearse</td><td class=\"m\">예행연습하다</td></tr><tr><td class=\"w\">help</td><td class=\"m\">도움이 되다</td></tr><tr><td class=\"w\">find</td><td class=\"m\">찾다, 발견하다</td></tr><tr><td class=\"w\">way</td><td class=\"m\">방법</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">연습하는 것은 네가 말하고 싶은 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">Rehearsing</span> <span class=\"grammar-hl\">what you want to say</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도울 수 있다 네가</span><span class=\"en\"><b>can help you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찾는 것을 더 나은 방법을</span><span class=\"en\"><b>find <span class=\"grammar-hl\">a better way</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 말할</span><span class=\"en\"><b><span class=\"grammar-hl\">to say it</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신이 말하고 싶은 것을 연습하는 것은 당신이 그것을 말하는 더 나은 방법을 찾는 것을 도울 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 말하기 전의 준비 과정이 주는 유익함을 설명하며 글의 핵심 주제를 제시합니다. 여기서 Rehearsing은 사전적으로 &#39;리허설(연습)하다&#39;인데, 여기서는 단순히 말을 읊조리는 것을 넘어 머릿속으로 내용을 정리하고 다듬어보는 &#39;사전 준비 과정&#39;을 의미합니다. 필자는 효율적인 의사소통을 위해서는 즉흥적인 표현보다 체계적인 준비가 필요하다는 것을 강조하기 위해 이 단어를 선택했습니다. 또한 find는 단순히 &#39;발견하다&#39;라는 뜻을 넘어, 더 나은 표현을 스스로의 노력으로 &#39;발굴해 내거나 완성해 나가는 과정&#39;을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Rehearsing (동명사): 문장에서 주어 역할을 하며 &#39;~하는 것은&#39;으로 해석되는 동명사 구문입니다.</div><div class=\"lec-gr-item\">what you want to say (간접의문문): &#39;what + S + V&#39; 구조로, 문장에서 동사 Rehearsing의 목적어 역할을 합니다.</div><div class=\"lec-gr-item\">to say (to부정사): want의 목적어로 쓰인 명사적 용법의 to부정사입니다.</div><div class=\"lec-gr-item\">a better way to say it (to부정사): &#39;to say&#39;가 앞의 명사 &#39;way&#39;를 수식하는 형용사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">help</td><td class=\"m\">도움이 되다</td></tr><tr><td class=\"w\">find</td><td class=\"m\">찾다, 발견하다</td></tr><tr><td class=\"w\">way</td><td class=\"m\">방법</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>말을 하기 전에 미리 연습해보는 것은 의사소통의 질을 높여준다.</li><li>준비를 통해 자신의 생각을 더 효과적이고 세련된 방식으로 표현할 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Rehearsing helps you organize your thoughts, so you can communicate your message more effectively.</div>\n              <div class=\"lec-final-sum-ko\">연습은 생각을 정리하도록 도와주며, 이를 통해 메시지를 더 효과적으로 전달할 수 있다.</div></div></div>"],"segs":[[{"audio":"./unit19_02_강의_audio/1.mp3","hl":null}],[{"audio":"./unit19_02_강의_audio/2.mp3","hl":null}],[{"audio":"./unit19_02_강의_audio/3.mp3","hl":null},{"audio":"./unit19_02_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit19_02_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit19_02_강의_audio/6.mp3","hl":null}],[{"audio":"./unit19_02_강의_audio/7.mp3","hl":"main"},{"audio":"./unit19_02_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit19_02_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit19_02_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-h
