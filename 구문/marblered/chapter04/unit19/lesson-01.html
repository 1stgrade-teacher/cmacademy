  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;

  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};

  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"unit19","title":"보어를 꾸미는 형용사구와 to부정사구 — 직독직해에서 패러프레이징까지","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>보어를 꾸미는 형용사구와 to부정사구 — 직독직해에서 패러프레이징까지\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>보어 뒤에 붙는 형용사구와 to부정사구를 블록 단위로 읽고, 문장의 의미와 표현을 정확히 바꿔 말할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 보어 뒤에 형용사구나 to 부정사구가 붙는 구문을 공부하겠습니다. 이 구문은 문장의 보어를 길게 꾸며 주기 때문에 직독직해에서 끊어 읽는 힘이 아주 중요해요. 예문을 통해 블록을 잡고, 뜻을 해석하고, 마지막에는 같은 뜻을 다른 영어로 말해 보겠습니다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">이 유닛의 핵심은 \u003cb class=\"key\">보어 + 형용사구\u003c/b> 또는 \u003cb class=\"key\">보어 + to부정사구\u003c/b> 구조입니다. 보어가 \u003cb class=\"key\">형용사구\u003c/b>의 수식을 받으면 앞의 명사와 뒤의 수식어를 한 블록으로 읽고, \u003cb class=\"key\">to부정사구\u003c/b>가 붙으면 '~하는 최초의/유일한/~할 책임이 있는'처럼 보어의 내용을 구체화합니다. 수식어 안의 \u003cb class=\"key\">전치사 + 목적어\u003c/b>와 \u003cb class=\"key\">분사구\u003c/b>까지 함께 묶어 해석하는 것이 중요합니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Painting is only \u003cspan class=\"fx\">a bridge linking the painter's mind with that of the viewer\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 Rehearsing what you want to say can \u003cspan class=\"fx\">help you find a better way to say it\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 Knowledge workers are the ones responsible for keeping the hightech economy running.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 In 1953, Jacqueline Cochran became \u003cspan class=\"fx\">the first woman pilot to break the sound barrier\u003c/span>. Additionally, she was the first female to pilot a jet across the Atlantic.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 We should let our beliefs and values guide \u003cspan class=\"fx\">our decisions about how to live our life\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Improved methods of transportation are forcing man to discard \u003cspan class=\"fx\">the concept of distance in the past responsible for keeping people separated\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 Humans became \u003cspan class=\"fx\">the only species to acquire guidance on how to live from the accumulated knowledge of their ancestors, rather than just from their DNA\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 The global village is \u003cspan class=\"fx\">all the countries of the world thought of as being closely connected by modern communication and trade\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 A day without a friend is like \u003cspan class=\"fx\">a pot without a single drop of honey left inside\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 A mouse is \u003cspan class=\"fx\">a device making it easier to select different options from computer menus\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Hindsight bias is \u003cspan class=\"fx\">a term used in psychology to explain the tendency of people to overestimate their ability to have predicted an outcome that could not possibly have been predicted\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Lots of countries wanted their pharmaceutical companies to be \u003cspan class=\"fx\">the first to succeed in developing vaccines and treatments for coronavirus\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘의 핵심은 주어와 동사 뒤에 오는 보어를 그냥 명사 하나로 끝내지 않는 거예요. 보어 뒤에 형용사구가 붙으면 그 형용사구가 보어를 꾸미는 하나의 블록이 되고, to 부정사구가 붙으면 보어가 어떤 일을 하는지 구체적으로 설명해 줍니다. 그래서 앞의 보어와 뒤의 수식어를 따로 떼지 말고 한 덩어리로 읽어야 해요. 이 감각을 잡으면 긴 문장도 훨씬 안정적으로 해석할 수 있습니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Painting is only \u003cspan class=\"fx\">a bridge linking the painter's mind with that of the viewer\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Painting \u003c/div>\u003cdiv class=\"k\">그림은 \u003c/div>\u003cdiv class=\"e\">is only a bridge \u003c/div>\u003cdiv class=\"k\">다리일 뿐이다 \u003c/div>\u003cdiv class=\"e\">linking the painter's mind \u003c/div>\u003cdiv class=\"k\">화가의 마음을 연결하는 \u003c/div>\u003cdiv class=\"e\">with that of the viewer.\u003c/div>\u003cdiv class=\"k\">보는 사람의 마음과\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>보어 \u003cb class=\"key\">a bridge\u003c/b>를 현재분사구 \u003cb class=\"key\">linking the painter's mind with that of the viewer\u003c/b>가 뒤에서 수식합니다. 즉 S + V + C 구조에서 \u003cb class=\"key\">보어 + 형용사구\u003c/b> 블록이 만들어진 문장입니다.\u003c/div>","segs":[{"n":3,"text":"Painting, 그림은. is only a bridge, 다리일 뿐이다. linking the painter's mind, 화가의 마음을 연결하는. with that of the viewer, 보는 사람의 마음과","hl":"ch"},{"n":4,"text":"첫 번째 문장을 보면, Painting is only a bridge까지가 주어 동사 보어의 기본 뼈대예요. 그 뒤에 linking the painter's mind with that of the viewer가 붙으면서 bridge를 꾸미는 하나의 블록이 됩니다. 여기서 that은 앞에 나온 mind를 받는다는 점도 꼭 기억해 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Painting is only \u003cspan class=\"fx\">a bridge linking the painter's mind with that of the viewer\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>그림은 화가의 생각과 감정을 관람자의 마음과 이어 주는 통로라는 뜻입니다. 그림을 단순한 물체가 아니라 사람과 사람 사이를 연결하는 다리로 비유한 표현이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is only a bridge linking\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">serves merely as a bridge connecting\u003c/span>\u003cdiv class=\"w\">only와 linking을 각각 merely와 connecting으로 바꾸어 뜻을 유지하면서 조금 더 설명적인 표현으로 만들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">that of the viewer\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the viewer's mind\u003c/span>\u003cdiv class=\"w\">that이 앞의 mind를 가리키므로 소유격 표현으로 풀어 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">only\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">merely / just\u003c/span>\u003cspan class=\"y-eq\">only = merely\u003c/span>\u003cdiv class=\"w\">only의 제한 의미를 merely나 just로 바꿔 같은 뉘앙스를 냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">linking A with B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">connecting A with B\u003c/span>\u003cspan class=\"y-eq\">link = connect\u003c/span>\u003cdiv class=\"w\">연결의 의미를 같은 계열의 동사 connect로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">that of the viewer\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the viewer's mind\u003c/span>\u003cspan class=\"y-eq\">that of = the ... of\u003c/span>\u003cdiv class=\"w\">반복을 피하는 that of 표현을 구체적인 소유격으로 풀어 쓴 것입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A painting merely acts as a bridge that connects the painter's mind with the viewer's mind.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 그림을 단순한 물건이 아니라 사람과 사람을 이어 주는 다리로 본 거예요. 화가의 마음과 작품을 보는 사람의 마음이 그림을 통해 연결된다는 뜻입니다. 그래서 only a bridge라는 표현에 그림의 역할을 강조하는 뉘앙스가 담겨 있어요.","hl":"mn"},{"n":6,"text":"표현을 바꿔 말할 때는 linking을 connecting으로 바꾸면 뜻이 그대로 살아납니다. 또한 that of the viewer는 the viewer's mind로 풀어 쓸 수 있어요. 이렇게 바꾸면 조금 더 쉽고 직접적인 문장이 됩니다.","hl":"rw"},{"n":7,"text":"only는 merely나 just로 바꿔 쓸 수 있고, link A with B는 connect A with B로 바꿀 수 있어요. that of the viewer는 앞의 mind를 반복하지 않기 위한 표현이라서 the viewer's mind로 풀어 이해하면 좋습니다. 이런 어구를 함께 익혀 두면 paraphrasing이 훨씬 자연스러워집니다.","hl":"ph"},{"n":8,"text":"이제 같은 뜻의 문장을 읽어 볼게요. A painting merely acts as a bridge that connects the painter's mind with the viewer's mind. 그림이 화가의 마음과 보는 사람의 마음을 이어 주는 다리 역할을 한다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 Rehearsing what you want to say can \u003cspan class=\"fx\">help you find a better way to say it\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Rehearsing \u003c/div>\u003cdiv class=\"k\">연습하는 것은 \u003c/div>\u003cdiv class=\"e\">what you want to say \u003c/div>\u003cdiv class=\"k\">당신이 말하고 싶은 것을 \u003c/div>\u003cdiv class=\"e\">can help you \u003c/div>\u003cdiv class=\"k\">도울 수 있다 \u003c/div>\u003cdiv class=\"e\">find a better way \u003c/div>\u003cdiv class=\"k\">더 나은 방법을 찾는 것을 \u003c/div>\u003cdiv class=\"e\">to say it.\u003c/div>\u003cdiv class=\"k\">그것을 말하는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>동명사구 주어 \u003cb class=\"key\">Rehearsing what you want to say\u003c/b> 뒤에 동사 \u003cb class=\"key\">can help\u003c/b>가 오고, 목적격보어로 원형부정사 \u003cb class=\"key\">find\u003c/b>가 이어집니다. \u003cb class=\"key\">a better way\u003c/b>는 to say it이 수식하는 \u003cb class=\"key\">보어 + to부정사구\u003c/b> 블록으로 읽습니다.\u003c/div>","segs":[{"n":9,"text":"Rehearsing, 연습하는 것은. what you want to say, 당신이 말하고 싶은 것을. can help you, 도울 수 있다. find a better way, 더 나은 방법을 찾는 것을. to say it, 그것을 말하는","hl":"ch"},{"n":10,"text":"두 번째 문장은 Rehearsing what you want to say가 주어인 긴 문장이에요. 동사 can help 뒤에 you가 오고, 이어서 find가 목적격보어로 붙습니다. 그리고 a better way를 to say it이 뒤에서 꾸며 주는 구조예요. 이때 help you find는 help you to find로 이해해도 좋습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 Rehearsing what you want to say can \u003cspan class=\"fx\">help you find a better way to say it\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>말하고 싶은 내용을 미리 연습하면 실제로 말할 때 더 좋은 표현을 찾을 수 있다는 뜻입니다. 준비와 연습이 표현력을 높인다는 실용적인 조언이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Rehearsing what you want to say\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Practicing what you want to say\u003c/span>\u003cdiv class=\"w\">rehearse를 일상적인 practice로 바꾸어 같은 의미를 더 쉽게 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">find a better way to say it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">come up with a better way of saying it\u003c/span>\u003cdiv class=\"w\">find를 come up with로 바꾸어 더 회화적인 표현으로 만들었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rehearse\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">practice\u003c/span>\u003cspan class=\"y-eq\">rehearse = practice\u003c/span>\u003cdiv class=\"w\">미리 연습한다는 뜻을 일상어 practice로 바꾼 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a better way to say it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a better way of saying it\u003c/span>\u003cdiv class=\"w\">to부정사 표현을 전치사구 표현으로 바꾼 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">help you find\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">assist you in finding\u003c/span>\u003cspan class=\"y-eq\">help = assist\u003c/span>\u003cdiv class=\"w\">help를 조금 더 격식 있는 assist로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Practicing what you want to say can help you discover a better way of expressing it.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 말하고 싶은 내용을 미리 연습하면 실제 말하기에서 더 좋은 표현을 찾을 수 있다는 뜻이에요. 준비가 말의 질을 높여 준다는 조언으로 볼 수 있습니다. 그래서 rehearsing을 단순한 암기가 아니라 표현을 다듬는 연습으로 이해하면 좋아요.","hl":"mn"},{"n":12,"text":"Rehearsing은 Practicing으로 바꿔도 자연스럽고, find a better way to say it은 come up with a better way of saying it으로 바꿀 수 있어요. 이렇게 바꾸면 같은 뜻을 조금 더 회화적인 표현으로 전달할 수 있습니다.","hl":"rw"},{"n":13,"text":"rehearse는 practice와 가까운 뜻이고, a better way to say it은 a better way of saying it으로 바꿀 수 있어요. help you find는 assist you in finding처럼 조금 더 격식 있게 표현할 수도 있습니다. 시험에서는 help 뒤에 동사원형이 오는 구조도 함께 기억해 주세요.","hl":"ph"},{"n":14,"text":"같은 뜻을 이렇게 말할 수 있어요. Practicing what you want to say can help you discover a better way of expressing it. 말하고 싶은 것을 연습하는 일이 더 나은 표현을 찾도록 돕는다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 Knowledge workers are the ones responsible for keeping the hightech economy running.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Knowledge workers \u003c/div>\u003cdiv class=\"k\">지식 근로자들은 \u003c/div>\u003cdiv class=\"e\">are the ones \u003c/div>\u003cdiv class=\"k\">사람들이다 \u003c/div>\u003cdiv class=\"e\">responsible for keeping \u003c/div>\u003cdiv class=\"k\">책임이 있는 \u003c/div>\u003cdiv class=\"e\">the high-tech economy \u003c/div>\u003cdiv class=\"k\">첨단 기술 경제를 \u003c/div>\u003cdiv class=\"e\">running.\u003c/div>\u003cdiv class=\"k\">계속 돌아가게 하는 데\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>보어 \u003cb class=\"key\">the ones\u003c/b>를 형용사구 \u003cb class=\"key\">responsible for keeping the high-tech economy running\u003c/b>이 뒤에서 수식합니다. 이 안에서 \u003cb class=\"key\">keep + O + v-ing\u003c/b>가 'O가 계속 ~하게 하다'라는 블록을 만듭니다.\u003c/div>","segs":[{"n":15,"text":"Knowledge workers, 지식 근로자들은. are the ones, 사람들이다. responsible for keeping, 책임이 있는. the high-tech economy, 첨단 기술 경제를. running, 계속 돌아가게 하는 데","hl":"ch"},{"n":16,"text":"세 번째 문장은 Knowledge workers are the ones까지가 주어 동사 보어예요. 그 뒤에 responsible for keeping the high tech economy running이 붙으면서 the ones를 꾸밉니다. 이때 keep the economy running은 경제가 계속 돌아가게 한다는 뜻의 중요한 덩어리입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 Knowledge workers are the ones responsible for keeping the hightech economy running.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>지식 근로자들은 첨단 기술 경제가 계속 작동하도록 책임지는 사람들이라는 뜻입니다. 현대 경제에서 정보와 지식이 얼마나 중요한 역할을 하는지 보여 주는 표현이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the ones responsible for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the people who are responsible for\u003c/span>\u003cdiv class=\"w\">the ones를 the people who로 풀어 써서 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">keeping the high-tech economy running\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">keeping the high-tech economy going\u003c/span>\u003cdiv class=\"w\">running을 going으로 바꾸어 같은 '계속 움직이게 하다'의 뜻을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">responsible for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in charge of\u003c/span>\u003cspan class=\"y-eq\">responsible for = in charge of\u003c/span>\u003cdiv class=\"w\">책임을 맡는다는 의미를 in charge of로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">keep + O + running\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">keep + O + going\u003c/span>\u003cspan class=\"y-eq\">keep running = keep going\u003c/span>\u003cdiv class=\"w\">계속 작동하게 한다는 뜻을 going으로 바꾼 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">high-tech\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">advanced technology\u003c/span>\u003cspan class=\"y-eq\">high-tech = advanced technology\u003c/span>\u003cdiv class=\"w\">첨단 기술이라는 뜻을 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Knowledge workers are the people who are in charge of keeping the advanced technology economy going.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 지식 근로자들이 첨단 기술 경제를 계속 움직이게 하는 책임을 맡은 사람들이라는 뜻이에요. 다시 말해 정보와 지식을 다루는 사람들이 현대 경제를 유지하는 데 중요한 역할을 한다는 겁니다. responsible for는 단순히 책임이 있다기보다 그 일을 맡아 수행한다는 느낌을 줍니다.","hl":"mn"},{"n":18,"text":"the ones responsible for는 the people who are responsible for로 풀어 쓸 수 있어요. keeping the economy running은 keeping the economy going으로 바꿔도 자연스럽습니다. 이렇게 바꾸면 문장이 조금 더 설명적으로 들립니다.","hl":"rw"},{"n":19,"text":"responsible for는 in charge of와 비슷하고, keep something running은 keep something going으로 바꿀 수 있어요. high tech는 advanced technology라는 뜻으로 이해하면 됩니다. 이런 표현은 경제나 기술 지문에서 자주 나오니 묶어서 익혀 두세요.","hl":"ph"},{"n":20,"text":"같은 뜻의 문장은 이렇게 말할 수 있습니다. Knowledge workers are the people who are in charge of keeping the advance Jacqueline Cochran became the first woman pilot까지가 기본 뼈대이고, 뒤의 to break the sound barrier가 the first woman pilot을 꾸밉니다. 뒤 문장에서도 the first female를 to pilot a jet across the Atlantic이 꾸미고 있습니다. the first 뒤에는 to 부정사가 와서 최초로 그 일을 한 사람이라는 뜻을 만든다고 기억해 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 In 1953, Jacqueline Cochran became \u003cspan class=\"fx\">the first woman pilot to break the sound barrier\u003c/span>. Additionally, she was the first female to pilot a jet across the Atlantic.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>재클린 코크런은 음속 장벽을 깬 최초의 여성 조종사이자 대서양을 제트기로 횡단한 최초의 여성이었다는 뜻입니다. 두 업적을 나란히 제시해 그녀의 선구자적 역할을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the first woman pilot to break\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the first female pilot who broke\u003c/span>\u003cdiv class=\"w\">to부정사 수식을 관계절로 풀어 써서 의미를 더 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Additionally, she was\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">She was also\u003c/span>\u003cdiv class=\"w\">문장 연결 부사 additionally를 also로 바꾸어 더 간결하게 만들었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sound barrier\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">sonic barrier\u003c/span>\u003cspan class=\"y-eq\">sound barrier = sonic barrier\u003c/span>\u003cdiv class=\"w\">음속 장벽을 같은 의미의 sonic barrier로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the first female\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the first woman\u003c/span>\u003cspan class=\"y-eq\">female = woman\u003c/span>\u003cdiv class=\"w\">female을 woman으로 바꾸어 더 자연스러운 표현으로 만들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pilot a jet\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fly a jet\u003c/span>\u003cspan class=\"y-eq\">pilot = fly\u003c/span>\u003cdiv class=\"w\">조종하다의 뜻을 fly로 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">In 1953, Jacqueline Cochran became the first female pilot who broke the sound barrier. She was also the first woman to fly a jet across the Atlantic.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 재클린 코크런이 음속 장벽을 깬 최초의 여성 조종사였고, 대서양을 제트기로 횡단한 최초의 여성이었다는 뜻이에요. 두 가지 최초 기록을 함께 말하면서 그녀가 얼마나 선구적인 인물이었는지 강조합니다. additionally는 앞의 업적에 하나를 더 보태는 말로 쓰였습니다.","hl":"mn"},{"n":24,"text":"the first woman pilot to break는 the first female pilot who broke로 풀어 쓸 수 있어요. additionally는 also나 moreover로 바꿀 수 있습니다. 이렇게 바꾸면 문장이 조금 더 설명적이거나 격식 있게 들립니다.","hl":"rw"},{"n":25,"text":"sound barrier는 sonic barrier로도 표현할 수 있고, the first female는 the first woman으로 바꿀 수 있어요. pilot a jet은 fly a jet으로 풀어 쓸 수 있습니다. 최초라는 의미를 살릴 때는 the first 뒤에 명사와 to 부정사가 함께 온다는 점을 기억하세요.","hl":"ph"},{"n":26,"text":"같은 뜻을 이렇게 말해 볼게요. In nineteen fifty three, Jacqueline Cochran became the first female pilot who broke the sound barrier. She was also the first woman to fly a jet across the Atlantic. 두 최초 기록을 같은 뜻으로 다시 말한 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 We should let our beliefs and values guide \u003cspan class=\"fx\">our decisions about how to live our life\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We \u003c/div>\u003cdiv class=\"k\">우리는 \u003c/div>\u003cdiv class=\"e\">should let \u003c/div>\u003cdiv class=\"k\">허용해야 한다 \u003c/div>\u003cdiv class=\"e\">our beliefs and values \u003c/div>\u003cdiv class=\"k\">우리의 신념과 가치관이 \u003c/div>\u003cdiv class=\"e\">guide our decisions \u003c/div>\u003cdiv class=\"k\">우리의 결정을 이끌도록 \u003c/div>\u003cdiv class=\"e\">about how to live our life.\u003c/div>\u003cdiv class=\"k\">우리의 삶을 어떻게 살지에 관한\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>동사 \u003cb class=\"key\">let\u003c/b>의 목적격보어로 원형부정사 \u003cb class=\"key\">guide\u003c/b>가 오고, 목적어 \u003cb class=\"key\">our decisions\u003c/b>를 전치사구 \u003cb class=\"key\">about how to live our life\u003c/b>가 수식합니다. \u003cb class=\"key\">형용사구 + 전치사 + 목적어\u003c/b> 블록이 결정의 내용을 구체화합니다.\u003c/div>","segs":[{"n":27,"text":"We, 우리는. should let, 허용해야 한다. our beliefs and values, 우리의 신념과 가치관이. guide our decisions, 우리의 결정을 이끌도록. about how to live our life, 우리의 삶을 어떻게 살지에 관한","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 We should let까지가 주어와 조동사와 동사예요. let 뒤에는 our beliefs and values가 목적어로 오고, guide가 목적격보어로 이어집니다. 그리고 our decisions를 about how to live our life가 뒤에서 꾸며 주고 있어요. let 뒤의 목적격보어는 동사원형으로 쓴다는 점이 중요합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 We should let our beliefs and values guide \u003cspan class=\"fx\">our decisions about how to live our life\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리의 신념과 가치관이 삶의 방식을 결정할 때 기준이 되어야 한다는 뜻입니다. 즉 중요한 선택을 할 때 가치관의 안내를 받으라는 조언이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">let our beliefs and values guide\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">allow our beliefs and values to guide\u003c/span>\u003cdiv class=\"w\">let + 목적어 + 동사원형을 allow + 목적어 + to부정사로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">decisions about how to live our life\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">decisions on how to live our lives\u003c/span>\u003cdiv class=\"w\">about을 on으로 바꾸고 life를 lives로 바꾸어 더 자연스럽게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">values\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">principles\u003c/span>\u003cspan class=\"y-eq\">values = principles\u003c/span>\u003cdiv class=\"w\">가치관을 원칙이라는 뜻의 principles로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">guide\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lead\u003c/span>\u003cspan class=\"y-eq\">guide = lead\u003c/span>\u003cdiv class=\"w\">이끌다의 뜻을 lead로 바꾼 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">decisions about\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">choices regarding\u003c/span>\u003cspan class=\"y-eq\">decisions about = choices regarding\u003c/span>\u003cdiv class=\"w\">결정에 관한이라는 뜻을 조금 더 격식 있는 표현으로 바꾼 것입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We should allow our beliefs and values to guide the choices we make about how to live our lives.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 우리가 삶을 어떻게 살지 결정할 때 신념과 가치관이 기준이 되어야 한다는 뜻이에요. 다시 말해 중요한 선택을 할 때 자신의 가치관이 이끌도록 하라는 조언입니다. beliefs and values는 단순한 생각이 아니라 삶의 방향을 잡아 주는 원칙으로 이해하면 좋아요.","hl":"mn"},{"n":30,"text":"let our beliefs and values guide는 allow our beliefs and values to guide로 바꿀 수 있어요. decisions about은 choices regarding로 바꾸면 조금 더 격식 있는 표현이 됩니다. 이렇게 바꿔도 삶의 선택에 관한 조언이라는 뜻은 그대로입니다.","hl":"rw"},{"n":31,"text":"values는 principles로, guide는 lead로 바꿔 이해할 수 있어요. decisions about은 choices regarding와 비슷합니다. let 뒤에 목적어와 동사원형이 오는 구조도 함께 익혀 두세요.","hl":"ph"},{"n":32,"text":"같은 뜻의 문장을 읽어 볼게요. We should allow our beliefs and values to guide the choices we make about how to live our lives. 우리의 신념과 가치관이 삶의 방식에 관한 선택을 이끌게 하라는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 Improved methods of transportation are forcing man to discard \u003cspan class=\"fx\">the concept of distance in the past responsible for keeping people separated\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Improved methods of transportation \u003c/div>\u003cdiv class=\"k\">개선된 교통수단은 \u003c/div>\u003cdiv class=\"e\">are forcing man \u003c/div>\u003cdiv class=\"k\">사람들에게 강요하고 있다 \u003c/div>\u003cdiv class=\"e\">to discard the concept of distance \u003c/div>\u003cdiv class=\"k\">거리 개념을 버리도록 \u003c/div>\u003cdiv class=\"e\">in the past \u003c/div>\u003cdiv class=\"k\">과거에 \u003c/div>\u003cdiv class=\"e\">responsible for keeping people separated.\u003c/div>\u003cdiv class=\"k\">사람들이 떨어져 있게 한 원인이던\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적격보어 \u003cb class=\"key\">to discard the concept of distance in the past responsible for keeping people separated\u003c/b> 안에서 \u003cb class=\"key\">the concept of distance\u003c/b>를 형용사구 \u003cb class=\"key\">in the past responsible for keeping people separated\u003c/b>가 수식합니다. \u003cb class=\"key\">responsible for\u003c/b>는 앞의 거리 개념이 사람들을 분리시키는 원인이었음을 설명합니다.\u003c/div>","segs":[{"n":33,"text":"Improved methods of transportation, 개선된 교통수단은. are forcing man, 사람들에게 강요하고 있다. to discard the concept of distance, 거리 개념을 버리도록. in the past, 과거에. responsible for keeping people separated, 사람들이 떨어져 있게 한 원인이던","hl":"ch"},{"n":34,"text":"여섯 번째 문장은 are forcing man to discard까지가 동사와 목적어와 목적격보어의 흐름이에요. to discard 뒤에 the concept of distance가 오고, 그 뒤의 in the past responsible for keeping people separated가 distance를 꾸밉니다. responsible for는 앞의 거리 개념이 사람들을 떨어져 있게 한 원인이었다는 뜻을 더해 줘요. 그래서 수식어가 길어져도 the concept of distance를 중심으로 읽어야 합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 Improved methods of transportation are forcing man to discard \u003cspan class=\"fx\">the concept of distance in the past responsible for keeping people separated\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>교통수단이 발달하면서 과거에 사람들을 떨어뜨려 놓았던 거리라는 개념을 버리게 된다는 뜻입니다. 즉 거리가 더 이상 사람들을 분리하는 장벽이 아니라는 의미예요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are forcing man to discard\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are making people abandon\u003c/span>\u003cdiv class=\"w\">force를 make로 바꾸고 man을 people로 풀어 써서 현대적인 표현으로 만들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">responsible for keeping people separated\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">that used to keep people apart\u003c/span>\u003cdiv class=\"w\">responsible for를 used to로 풀어 과거의 원인이라는 의미를 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">discard\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">abandon / get rid of\u003c/span>\u003cspan class=\"y-eq\">discard = abandon\u003c/span>\u003cdiv class=\"w\">버리다의 뜻을 abandon이나 get rid of로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">separated\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">apart\u003c/span>\u003cspan class=\"y-eq\">separated = apart\u003c/span>\u003cdiv class=\"w\">떨어져 있는 상태를 apart로 간결하게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">responsible for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">causing\u003c/span>\u003cspan class=\"y-eq\">responsible for = causing\u003c/span>\u003cdiv class=\"w\">여기서는 원인이 되는 의미이므로 causing으로 풀어 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Improved transportation is making people abandon the old concept of distance that used to keep people apart.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 교통수단이 발달하면서 과거에 사람들을 분리시켰던 거리 개념을 버리게 된다는 뜻이에요. 다시 말해 거리가 더 이상 사람들 사이를 가르는 장벽이 아니라는 겁니다. improved methods of transportation은 개선된 교통수단이라는 뜻으로 현대의 이동성을 강조합니다.","hl":"mn"},{"n":36,"text":"are forcing man to discard는 are making people abandon으로 바꿔 쓸 수 있어요. responsible for keeping people separated는 that used to keep people apart로 풀어 쓸 수 있습니다. 이렇게 바꾸면 뜻은 같지만 조금 더 쉬운 표현이 됩니다.","hl":"rw"},{"n":37,"text":"discard는 abandon이나 get rid of로 바꿀 수 있고, separated는 apart로 이해할 수 있어요. responsible for는 여기서 causing과 비슷한 의미로 쓰였습니다. 긴 수식어 속에서도 중심 명사 distance를 놓치지 않는 것이 중요해요.","hl":"ph"},{"n":38,"text":"같은 뜻을 이렇게 말할 수 있습니다. Improved transportation is making people abandon the old concept of distance that used to keep people apart. 교통이 발달하면서 사람들을 떨어뜨리던 거리 개념을 버리게 된다는 뜻이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 Humans became \u003cspan class=\"fx\">the only species to acquire guidance on how to live from the accumulated knowledge of their ancestors, rather than just from their DNA\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Humans \u003c/div>\u003cdiv class=\"k\">인간은 \u003c/div> 뜻입니다. 문화와 지식의 전달이 인간을 다른 종과 구별한다는 점을 강조해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the only species to acquire\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the only species that acquired\u003c/span>\u003cdiv class=\"w\">to부정사 수식을 관계절로 풀어 써서 의미를 더 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rather than just from their DNA\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">not merely from their DNA\u003c/span>\u003cdiv class=\"w\">rather than을 not merely로 바꾸어 대조의 뜻을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">guidance\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">direction / advice\u003c/span>\u003cspan class=\"y-eq\">guidance = direction\u003c/span>\u003cdiv class=\"w\">지침의 뜻을 direction이나 advice로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">accumulated\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">built-up\u003c/span>\u003cspan class=\"y-eq\">accumulated = built-up\u003c/span>\u003cdiv class=\"w\">축적된이라는 뜻을 built-up으로 바꾼 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rather than\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">instead of\u003c/span>\u003cspan class=\"y-eq\">rather than = instead of\u003c/span>\u003cdiv class=\"w\">대조와 선택의 의미를 instead of로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Humans became the only species that acquired guidance on how to live from the accumulated knowledge of their ancestors, not merely from their DNA.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 인간이 조상의 축적된 지식에서 삶의 지침을 얻은 유일한 종이라는 뜻이에요. 단순히 DNA에 새겨진 정보에만 의존한 것이 아니라 문화와 지식을 다음 세대로 전달했다는 점을 강조합니다. rather than은 앞의 내용을 선택하고 뒤의 내용을 덜 강조하는 대조 표현이에요.","hl":"mn"},{"n":42,"text":"the only species to acquire는 the only species that acquired로 바꿀 수 있어요. rather than just from their DNA는 not merely from their DNA로 바꿔 쓸 수 있습니다. 이렇게 바꾸면 대조의 뜻이 더 분명하게 드러납니다.","hl":"rw"},{"n":43,"text":"guidance는 advice나 direction으로 이해할 수 있고, accumulated는 built-up으로 바꿀 수 있어요. rather than은 instead of와 비슷합니다. 이런 표현을 함께 익히면 긴 문장의 논리 관계가 잘 보입니다.","hl":"ph"},{"n":44,"text":"같은 뜻의 문장을 읽어 볼게요. Humans became the only species that acquired guidance on how to live from the accumulated knowledge of their ancestors, not merely from their DNA. 인간이 조상의 지식에서 삶의 지침을 얻은 유일한 종이라는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 The global village is \u003cspan class=\"fx\">all the countries of the world thought of as being closely connected by modern communication and trade\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The global village \u003c/div>\u003cdiv class=\"k\">지구촌은 \u003c/div>\u003cdiv class=\"e\">is all the countries of the world \u003c/div>\u003cdiv class=\"k\">세계의 모든 나라들이다 \u003c/div>\u003cdiv class=\"e\">thought of as being closely connected \u003c/div>\u003cdiv class=\"k\">밀접하게 연결된 것으로 여겨지는 \u003c/div>\u003cdiv class=\"e\">by modern communication and trade.\u003c/div>\u003cdiv class=\"k\">현대의 통신과 무역으로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>보어 \u003cb class=\"key\">all the countries of the world\u003c/b>를 과거분사구 \u003cb class=\"key\">thought of as being closely connected by modern communication and trade\u003c/b>가 뒤에서 수식합니다. \u003cb class=\"key\">think of A as B\u003c/b>가 수동태로 바뀌어 A is thought of as B의 형태를 이룹니다.\u003c/div>","segs":[{"n":45,"text":"The global village, 지구촌은. is all the countries of the world, 세계의 모든 나라들이다. thought of as being closely connected, 밀접하게 연결된 것으로 여겨지는. by modern communication and trade, 현대의 통신과 무역으로","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 The global village is all the countries of the world까지가 주어 동사 보어예요. 그 뒤에 thought of as being closely connected by modern communication and trade가 붙으면서 all the countries of the world를 꾸밉니다. 여기서 thought of as는 think of A as B의 수동 형태로 이해하면 됩니다. 즉 세계의 모든 나라들이 밀접하게 연결된 것으로 여겨진다는 뜻이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 The global village is \u003cspan class=\"fx\">all the countries of the world thought of as being closely connected by modern communication and trade\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>지구촌은 현대의 통신과 무역으로 서로 밀접하게 연결되어 있다고 여겨지는 세계의 모든 나라들을 뜻합니다. 세계가 하나의 마을처럼 가깝게 연결되었다는 비유적 표현이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">all the countries of the world\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">every country in the world\u003c/span>\u003cdiv class=\"w\">전 세계 모든 나라라는 뜻을 every country로 간결하게 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">thought of as being closely connected\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regarded as being closely connected\u003c/span>\u003cdiv class=\"w\">think of as를 regard as로 바꾸어 같은 의미를 더 격식 있게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">global village\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">interconnected world\u003c/span>\u003cspan class=\"y-eq\">global village = interconnected world\u003c/span>\u003cdiv class=\"w\">지구촌을 서로 연결된 세계라는 뜻으로 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">think of A as B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regard A as B\u003c/span>\u003cspan class=\"y-eq\">think of as = regard as\u003c/span>\u003cdiv class=\"w\">A를 B로 여기다는 뜻을 regard as로 바꾼 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">closely\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">intimately\u003c/span>\u003cspan class=\"y-eq\">closely = intimately\u003c/span>\u003cdiv class=\"w\">밀접하게라는 뜻을 intimately로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The global village refers to every country in the world regarded as being closely connected by modern communication and trade.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"이 문장은 지구촌을 현대의 통신과 무역으로 가깝게 연결된 세계의 모든 나라라고 설명해요. 세계가 하나의 마을처럼 느껴질 만큼 긴밀해졌다는 비유가 담겨 있습니다. global village라는 표현 자체가 이런 연결성을 강조하는 말이에요.","hl":"mn"},{"n":48,"text":"all the countries of the world는 every country in the world로 바꿀 수 있어요. thought of as는 regarded as로 바꿔도 뜻이 비슷합니다. 이렇게 바꾸면 문장이 조금 더 직접적으로 들립니다.","hl":"rw"},{"n":49,"text":"global village는 interconnected world로 풀어 이해할 수 있고, think of A as B는 regard A as B와 비슷해요. closely는 intimately로 바꿀 수 있습니다. 이런 어구는 사회나 문화 지문에서 자주 만나게 됩니다.","hl":"ph"},{"n":50,"text":"같은 뜻을 이렇게 말할 수 있어요. The global village refers to every country in the world regarded as being closely connected by modern communication and trade. 세계의 모든 나라가 현대 통신과 무역으로 긴밀하게 연결된 것으로 여겨진다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 A day without a friend is like \u003cspan class=\"fx\">a pot without a single drop of honey left inside\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A day without a friend \u003c/div>\u003cdiv class=\"k\">친구가 없는 하루는 \u003c/div>\u003cdiv class=\"e\">is like a pot \u003c/div>\u003cdiv class=\"k\">단지와 같다 \u003c/div>\u003cdiv class=\"e\">without a single drop of honey \u003c/div>\u003cdiv class=\"k\">꿀이 단 한 방울도 없는 \u003c/div>\u003cdiv class=\"e\">left inside.\u003c/div>\u003cdiv class=\"k\">안에 남아 있는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>보어 \u003cb class=\"key\">like a pot\u003c/b> 안에서 \u003cb class=\"key\">a pot\u003c/b>을 전치사구 \u003cb class=\"key\">without a single drop of honey left inside\u003c/b>가 수식합니다. \u003cb class=\"key\">left inside\u003c/b>는 과거분사구로 honey를 뒤에서 꾸밉니다.\u003c/div>","segs":[{"n":51,"text":"A day without a friend, 친구가 없는 하루는. is like a pot, 단지와 같다. without a single drop of honey, 꿀이 단 한 방울도 없는. left inside, 안에 남아 있는","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 A day without a friend is like a pot까지가 주어 동사 보어의 흐름이에요. like a pot 뒤에 without a single drop of honey left inside가 붙으면서 pot을 꾸밉니다. 이때 left inside는 honey를 뒤에서 꾸며 주는 과거분사구예요. 그래서 단지 안에 꿀이 남아 있지 않다는 이미지를 한 블록으로 잡으면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 A day without a friend is like \u003cspan class=\"fx\">a pot without a single drop of honey left inside\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>친구가 없는 하루는 꿀이 한 방울도 남지 않은 단지처럼 허전하고 달콤함이 없다는 뜻입니다. 우정이 삶에 주는 즐거움과 충만함을 비유한 표현이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is like a pot\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is comparable to a pot\u003c/span>\u003cdiv class=\"w\">like를 comparable to로 바꾸어 비유를 조금 더 격식 있게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">without a single drop of honey left inside\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">with no honey left inside at all\u003c/span>\u003cdiv class=\"w\">without a single drop을 with no at all로 바꾸어 강조의 뜻을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a single drop\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">even one drop\u003c/span>\u003cspan class=\"y-eq\">a single drop = even one drop\u003c/span>\u003cdiv class=\"w\">단 한 방울도 없다는 강조를 even one drop으로 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">left inside\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">remaining inside\u003c/span>\u003cspan class=\"y-eq\">left = remaining\u003c/span>\u003cdiv class=\"w\">남아 있는 상태를 remaining으로 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">like\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">similar to\u003c/span>\u003cspan class=\"y-eq\">like = similar to\u003c/span>\u003cdiv class=\"w\">비유의 like를 similar to로 바꾼 것입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A day without a friend is comparable to a pot with no honey left inside at all.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 친구가 없는 하루를 꿀이 한 방울도 남지 않은 단지에 비유해요. 즉 우정이 없으면 삶이 허전하고 달콤함을 잃는다는 뜻입니다. without a single drop은 단 한 방울도 없다는 강조 표현입니다.","hl":"mn"},{"n":54,"text":"is like a pot은 is comparable to a pot으로 바꿀 수 있어요. without a single drop of honey left inside는 with no honey left inside at all로 바꿀 수 있습니다. 이렇게 바꾸면 비유의 뜻은 그대로면서 표현이 조금 더 설명적으로 됩니다.","hl":"rw"},{"n":55,"text":"a single drop은 even one drop으로 강조해 이해할 수 있고, left inside는 remaining inside와 비슷해요. like는 similar to로 바꿀 수 있습니다. 비유 문장에서는 like 뒤의 명사구를 하나의 이미지로 읽는 것이 중요합니다.","hl":"ph"},{"n":56,"text":"같은 뜻의 문장은 이렇게 말할 수 있어요. A day without a friend is comparable to a pot with no honey left inside at all. 친구가 없는 하루가 꿀이 전혀 남지 않은 단지와 같다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 A mouse is \u003cspan class=\"fx\">a device making it easier to select different options from computer menus\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A mouse \u003c/div>\u003cdiv class=\"k\">마우스는 \u003c/div>\u003cdiv class=\"e\">is a device \u003c/div>\u003cdiv class=\"k\">기구이다 \u003c/div>\u003cdiv class=\"e\">making it easier \u003c/div>\u003cdiv class=\"k\">더 쉽게 만드는 \u003c/div>\u003cdiv class=\"e\">to select different options \u003c/div>\u003cdiv class=\"k\">여러 선택 사항들을 고르는 것을 \u003c/div>\u003cdiv class=\"e\">from computer menus.\u003c/div>\u003cdiv class=\"k\">컴퓨터 메뉴에서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>보어 \u003cb class=\"key\">a device\u003c/b>를 현재분사구 \u003cb class=\"key\">making it easier to select different options from computer menus\u003c/b>가 뒤에서 수식합니다. \u003cb class=\"key\">make it easier to-v\u003c/b>는 '~하는 것을 더 쉽게 만들다'라는 블록입니다.\u003c/div>","segs":[{"n":57,"text":"A mouse, 마우스는. is a device, 기구이다. making it easier, 더 쉽게 만드는. to select different options, 여러 선택 사항들을 고르는 것을. from computer menus, 컴퓨터 메뉴에서","hl":"ch"},{"n":58,"text":"열 번째 문장은 A mouse is a device까지가 주어 동사 보어예요. 여기서 접속사 없이 makes를 쓰면 동사가 두 개처럼 보이기 때문에 a device를 꾸미는 현재분사 making이 필요합니다. making it easier to select different options from computer menus가 a device를 뒤에서 꾸며 주는 거죠. make it easier to do는 doing something is easier하게 만든다는 뜻으로 익혀 두세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 A mouse is \u003cspan class=\"fx\">a device making it easier to select different options from computer menus\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>마우스는 컴퓨터 메뉴에서 여러 선택 사항을 고르는 일을 더 쉽게 해 주는 장치라는 뜻입니다. 마우스의 기능을 간결하게 정의한 문장이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a device making it easier\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a device that makes it easier\u003c/span>\u003cdiv class=\"w\">현재분사 수식을 관계절로 풀어 써서 의미를 더 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">select different options\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">choose various options\u003c/span>\u003cdiv class=\"w\">select와 different를 choose와 various로 바꾸어 자연스럽게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">device\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">tool / instrument\u003c/span>\u003cspan class=\"y-eq\">device = tool\u003c/span>\u003cdiv class=\"w\">장치라는 뜻을 tool이나 instrument로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">select\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">choose\u003c/span>\u003cspan class=\"y-eq\">select = choose\u003c/span>\u003cdiv class=\"w\">고르다의 뜻을 choose로 바꾼 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">options\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">choices\u003c/span>\u003cspan class=\"y-eq\">options = choices\u003c/span>\u003cdiv class=\"w\">선택 사항이라는 뜻을 choices로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A mouse is a device that makes it easier to choose various options from computer menus.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 마우스가 컴퓨터 메뉴에서 여러 선택 사항을 고르는 일을 더 쉽게 해 주는 장치라는 뜻이에요. 즉 마우스의 기능을 정의하는 문장입니다. It은 to select 이하를 가리키는 가목적어로 이해하면 됩니다.","hl":"mn"},{"n":60,"text":"a device making it easier는 a device that makes it easier로 바꿀 수 있어요. select different options는 choose various options로 바꿀 수 있습니다. 이렇게 바꾸면 뜻은 같지만 문장이 조금 더 풀어 쓴 느낌이 됩니다.","hl":"rw"},{"n":61,"text":"device는 tool이나 instrument로, select는 choose로 바꿀 수 있어요. options는 choices와 비슷합니다. make it easier to do 구문은 시험에도 자주 나오니 통째로 기억해 두세요.","hl":"ph"},{"n":62,"text":"같은 뜻의 문장을 읽어 볼게요. A mouse is a device that makes it easier to choose various options from computer menus. 마우스가 컴퓨터 메뉴에서 여러 선택을 더 쉽게 해 주는 장치라는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 Hindsight bias is \u003cspan class=\"fx\">a term used in psychology to explain the tendency of people to overestimate their ability to have predicted an outcome that could not possibly have been predicted\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Hindsight bias \u003c/div>\u003cdiv class=\"k\">사후확신 편향은 \u003c/div>\u003cdiv class=\"e\">is a term \u003c/div>\u003cdiv class=\"k\">용어이다 \u003c/div>\u003cdiv class=\"e\">used in psychology \u003c/div>\u003cdiv class=\"k\">심리학에서 사용되는 \u003c/div>\u003cdiv class=\"e\">to explain the tendency of people \u003c/div>\u003cdiv class=\"k\">사람들의 경향을 설명하기 위해 \u003c/div>\u003cdiv class=\"e\">to overestimate their ability \u003c/div>\u003cdiv class=\"k\">자신들의 능력을 과대평가하는 \u003c/div>\u003cdiv class=\"e\">to have predicted an outcome \u003c/div>\u003cdiv class=\"k\">어떤 결과를 예측했던 \u003c/div>\u003cdiv class=\"e\">that could not possibly have been predicted.\u003c/div>\u003cdiv class=\"k\">아마도 예측할 수 없었던\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>보어 \u003cb class=\"key\">a term\u003c/b>을 과거분사구 \u003cb class=\"key\">used in psychology\u003c/b>가 수식하고, 그 뒤의 to부정사구 \u003cb class=\"key\">to explain the tendency ...\u003c/b>가 용도를 설명합니다. \u003cb class=\"key\">the tendency of people to overestimate\u003c/b>와 \u003cb class=\"key\">their ability to have predicted\u003c/b>처럼 명사 뒤에 to부정사구가 이어지는 블록을 차례로 잡습니다.\u003c/div>","segs":[{"n":63,"text":"Hindsight bias, 사후확신 편향은. is a term, 용어이다. used in psychology, 심리학에서 사용되는. to explain the tendency of people, 사람들의 경향을 설명하기 위해. to overestimate their ability, 자신들의 능력을 과대평가하는. to have predicted an outcome, 어떤 결과를 예측했던. that could not possibly have been predicted, 아마도 예측할 수 없었던","hl":"ch"},{"n":64,"text":"열한 번째 문장은 Hindsight bias is a term까지가 주어 동사 보어예요. a term 뒤에 used in psychology가 붙고, 이어서 to explain the tendency of people이 용도를 설명합니다. 그 안에서 to overestimate their ability와 to have predicted an outcome이 차례로 명사를 꾸미는 긴 블록을 만듭니다. a term은 심리학에서 사용되는 용어이므로 과거분사 used가 알맞습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 Hindsight bias is \u003cspan class=\"fx\">a term used in psychology to explain the tendency of people to overestimate their ability to have predicted an outcome that could not possibly have been predicted\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사후확신 편향은 실제로는 예측이 불가능했던 결과를 사람들이 예측할 수 있었다고 과대평가하는 경향을 설명하는 심리학 용어입니다. 일이 끝난 뒤에 '그걸 예상할 수 있었는데'라고 생각하는 인지 편향을 말해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the tendency of people to overestimate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">people's tendency to overestimate\u003c/span>\u003cdiv class=\"w\">of people을 소유격 people's로 바꾸어 더 간결하게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">could not possibly have been predicted\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">was impossible to predict\u003c/span>\u003cdiv class=\"w\">긴 수동 완료 표현을 impossible to predict로 풀어 써서 뜻을 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">hindsight bias\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">after the fact bias\u003c/span>\u003cspan class=\"y-eq\">hindsight bias = after the fact bias\u003c/span>\u003cdiv class=\"w\">일이 끝난 뒤에 판단하는 편향이라는 뜻을 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">overestimate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">exaggerate\u003c/span>\u003cspan class=\"y-eq\">overestimate = exaggerate\u003c/span>\u003cdiv class=\"w\">과대평가하다의 뜻을 exaggerate로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">outcome\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">result\u003c/span>\u003cspan class=\"y-eq\">outcome = result\u003c/span>\u003cdiv class=\"w\">결과라는 뜻을 result로 바꾼 것입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Hindsight bias is a psychology term that explains people's tendency to overestimate their ability to have predicted an outcome that was impossible to predict.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 사후확신 편향을 설명하는 심리학 용어의 정의예요. 사람들이 실제로는 예측하기 어려웠던 결과를 일이 끝난 뒤에 예측할 수 있었다고 과대평가하는 경향을 말합니다. could not possibly have been predicted는 예측이 불가능했을 정도라는 강한 뜻을 담고 있어요.","hl":"mn"},{"n":66,"text":"the tendency of people to overestimate는 people's tendency to overestimate로 바꿀 수 있어요. could not possibly have been predicted는 was impossible to predict로 풀어 쓸 수 있습니다. 이렇게 바꾸면 긴 문장이 조금 더 읽기 쉬워집니다.","hl":"rw"},{"n":67,"text":"hindsight bias는 뒤늦게 판단하는 편향으로 이해할 수 있고, overestimate는 exaggerate와 가까워요. outcome은 result로 바꿀 수 있습니다. 명사 뒤에 to 부정사가 이어지는 구조를 차근차근 따라가는 연습이 필요합니다.","hl":"ph"},{"n":68,"text":"같은 뜻의 문장을 이렇게 말할 수 있어요. Hindsight bias is a psychology term that explains people's tendency to overestimate their ability to have predicted an outcome that was impossible to predict. 사후확신 편향이 예측 불가능한 결과를 예측했다고 과대평가하는 경향을 설명한다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Lots of countries wanted their pharmaceutical companies to be \u003cspan class=\"fx\">the first to succeed in developing vaccines and treatments for coronavirus\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Lots of countries \u003c/div>\u003cdiv class=\"k\">많은 나라들은 \u003c/div>\u003cdiv class=\"e\">wanted their pharmaceutical companies \u003c/div>\u003cdiv class=\"k\">자신들의 제약회사들이 되길 바랐다 \u003c/div>\u003cdiv class=\"e\">to be the first \u003c/div>\u003cdiv class=\"k\">최초가 \u003c/div>\u003cdiv class=\"e\">to succeed in developing \u003c/div>\u003cdiv class=\"k\">성공하는 \u003c/div>\u003cdiv class=\"e\">vaccines and treatments for coronavirus.\u003c/div>\u003cdiv class=\"k\">코로나바이러스에 대한 백신과 치료제 개발에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적격보어 \u003cb class=\"key\">to be the first\u003c/b> 안에서 보어 \u003cb class=\"key\">the first\u003c/b>를 to부정사구 \u003cb class=\"key\">to succeed in developing vaccines and treatments for coronavirus\u003c/b>가 수식합니다. 문맥상 미래 지향의 의미를 살려 \u003cb class=\"key\">to succeed\u003c/b>가 오며, 접속사 없이 동사 succeed가 올 수 없습니다.\u003c/div>","segs":[{"n":69,"text":"Lots of countries, 많은 나라들은. wanted their pharmaceutical companies, 자신들의 제약회사들이 되길 바랐다. to be the first, 최초가. to succeed in developing, 성공하는. vaccines and treatments for coronavirus, 코로나바이러스에 대한 백신과 치료제 개발에","hl":"ch"},{"n":70,"text":"열두 번째 문장은 Lots of countries wanted their pharmaceutical companies까지가 주어 동사 목적어의 흐름이에요. 그 뒤에 to be the first가 목적격보어로 오고, the first를 to succeed in developing vaccines and treatments for coronavirus가 꾸밉니다. 여기서는 미래에 성공할 가능성을 말하므로 to succeed가 자연스럽고, 접속사 없이 succeed만 쓰면 동사가 겹쳐서 어색해집니다. the first 뒤에 to 부정사가 오는 구조를 다시 확인해 보세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Lots of countries wanted their pharmaceutical companies to be \u003cspan class=\"fx\">the first to succeed in developing vaccines and treatments for coronavirus\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>많은 나라가 자국 제약회사가 코로나바이러스 백신과 치료제 개발에 가장 먼저 성공하는 회사가 되기를 바랐다는 뜻입니다. 개발 경쟁과 국가적 기대를 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">wanted their pharmaceutical companies to be the first\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">wanted their pharmaceutical companies to become the first\u003c/span>\u003cdiv class=\"w\">be를 become으로 바꾸어 변화와 도달의 의미를 더 살렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">succeed in developing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">manage to develop\u003c/span>\u003cdiv class=\"w\">succeed in을 manage to로 바꾸어 성공의 의미를 풀어 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pharmaceutical company\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">drug company\u003c/span>\u003cspan class=\"y-eq\">pharmaceutical company = drug company\u003c/span>\u003cdiv class=\"w\">제약회사를 더 쉬운 drug company로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">vaccines\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">immunizations\u003c/span>\u003cspan class=\"y-eq\">vaccines = immunizations\u003c/span>\u003cdiv class=\"w\">백신을 면역 관련 표현으로 바꾼 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">treatments\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">therapies\u003c/span>\u003cspan class=\"y-eq\">treatments = therapies\u003c/span>\u003cdiv class=\"w\">치료제라는 뜻을 therapies로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Many countries wanted their pharmaceutical companies to be the first to develop vaccines and treatments for coronavirus.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 많은 나라가 자국 제약회사가 코로나바이러스 백신과 치료제 개발에 가장 먼저 성공하기를 바랐다는 뜻이에요. 여기에는 개발 경쟁과 국가적 기대가 함께 담겨 있습니다. the first to succeed는 가장 먼저 성공하는 대상이라는 뜻으로 읽으면 됩니다.","hl":"mn"},{"n":72,"text":"wanted their companies to be the first는 wanted their companies to become the first로 바꿀 수 있어요. succeed in developing은 manage to develop로 바꿀 수 있습니다. 이렇게 바꾸면 뜻은 유지하면서 표현이 조금 더 자연스럽게 들립니다.","hl":"rw"},{"n":73,"text":"pharmaceutical company는 drug company로, vaccines는 immunizations로 이해할 수 있어요. treatments는 therapies로 바꿀 수 있습니다. the first to do 형태는 최초로 그 일을 하는 대상이라는 뜻으로 자주 쓰입니다.","hl":"ph"},{"n":74,"text":"같은 뜻의 문장은 이렇게 말할 수 있습니다. Many countries wanted their pharmaceutical companies to be the first to develop vaccines and treatments for coronavirus. 많은 나라가 자국 제약회사가 코로나바이러스 백신과 치료제를 가장 먼저 개발하기를 바랐다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>보어 뒤에 붙는 \u003cb class=\"key\">형용사구\u003c/b>는 앞의 보어를 꾸미며 하나의 긴 블록을 만든다.\u003c/li>\u003cli>\u003cb class=\"key\">the first/only + 명사 + to부정사\u003c/b>는 '~한 최초의/유일한 명사'로 해석한다.\u003c/li>\u003cli>\u003cb class=\"key\">전치사 + 목적어\u003c/b>와 \u003cb class=\"key\">분사구\u003c/b>가 겹쳐 나와도 중심 명사와 보어를 먼저 찾으면 문장이 안정적으로 읽힌다.\u003c/li>\u003cli>긴 수식어는 직독직해로 끊고, 마지막에는 같은 뜻의 쉬운 영어로 \u003cb class=\"key\">패러프레이징\u003c/b>한다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 보어 뒤에 형용사구나 to 부정사구가 붙는 문장을 집중적으로 보았습니다. 핵심은 보어를 먼저 찾고 뒤에 붙는 수식어를 하나의 블록으로 묶어 읽는 것이었어요. the first나 the only 뒤에 to 부정사가 오면 최초나 유일의 의미를 살려 해석하고, 전치사구와 분사구가 길게 이어져도 중심 명사를 놓치지 않으면 됩니다. 마지막으로 같은 뜻을 쉬운 영어로 바꿔 말하는 연습까지 해 보시고, 오늘 수업 수고하셨습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
