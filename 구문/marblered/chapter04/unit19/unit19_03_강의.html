요리사가 맛있는 음식을 만들기 위해 귀한 식재료를 다루듯, 이들은 정보와 데이터를 정교하게 요리하여 사회를 발전시키는 역할을 한다고 이해하면 글을 훨씬 쉽게 읽으실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01지식 근로자의 정의</div><ul><li>현대 경제 체제에서 핵심적인 역할을 수행하는 사람들을 일컫는 용어입니다.</li><li>고도의 지식을 활용하는 노동자 (knowledge workers)</li><li>경제의 중추적인 기능을 담당하는 주체</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02핵심 임무</div><ul><li>첨단 기술 기반의 경제 구조가 원활히 작동하도록 유지하는 책임을 집니다.</li><li>첨단 기술 경제 (high-tech economy)를 운영하는 힘</li><li>기술 산업의 지속 가능한 발전과 유지 (running)를 주도함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03사회적 기여</div><ul><li>현대 사회의 발전과 효율적인 시스템 운영의 중심에 있습니다.</li><li>경제 시스템의 원동력 역할</li><li>현대 사회의 복잡한 기술적 환경을 지탱하는 기반</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">knowledge worker</td><td class=\"m\">지식 노동자</td></tr><tr><td class=\"w\">be responsible for</td><td class=\"m\">~에 책임이 있는</td></tr><tr><td class=\"w\">keep</td><td class=\"m\">(계속해서) ~하게 하다</td></tr><tr><td class=\"w\">high-tech</td><td class=\"m\">첨단 기술의</td></tr><tr><td class=\"w\">economy</td><td class=\"m\">경제</td></tr><tr><td class=\"w\">run</td><td class=\"m\">운영되다, 작동하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지식 근로자들은</span><span class=\"en\"><b>Knowledge workers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이다</span><span class=\"en\"><b><span class=\"grammar-hl\">are</span> the ones</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">책임이 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">responsible for</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">첨단 기술 경제를 유지하는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">keeping</span> <span class=\"grammar-hl\">the hightech economy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계속 돌아가게 (하는)</span><span class=\"en\"><b><span class=\"grammar-hl\">running</span>.</b></span></div></div><div class=\"lec-sent-ko\">지식 근로자들은 첨단 기술 경제를 계속 돌아가게 하는 데 책임이 있는 사람들이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지식 기반 사회에서 기술을 다루는 사람들이 경제를 유지하는 핵심적인 역할을 한다는 점을 설명합니다. 여기서 **responsible**은 사전적으로는 &#39;책임이 있는&#39;이라는 뜻이지만, 여기서는 그들이 경제 시스템의 &#39;동력원&#39;이나 &#39;운영자&#39;라는 점을 강조하기 위해 사용되었습니다. 단순히 일을 맡았다는 차원을 넘어, 그들이 없으면 경제가 멈춘다는 필자의 인식을 보여줍니다. 또한 **running**은 사전적으로는 &#39;달리는&#39;이지만, 여기서는 경제가 중단 없이 &#39;작동하는&#39; 상태를 의미합니다. 경제를 하나의 거대한 기계로 비유하여, 지식 노동자들이 그 기계를 돌리는 핵심 부품임을 나타내고자 이 표현을 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are (be동사): 주어(Knowledge workers)와 보어(the ones)의 상태를 연결하는 연결동사(V)로, 2형식 문장 구조를 이룹니다.</div><div class=\"lec-gr-item\">responsible for (관용표현): 형용사구 &#39;be responsible for(~에 책임이 있는)&#39;로, 앞의 명사(the ones)를 부연 설명하는 보어 역할을 합니다.</div><div class=\"lec-gr-item\">keeping (동명사): 전치사(for)의 목적어 자리에 위치하여 &#39;유지하는 것&#39;이라는 명사적 역할을 수행하며, 이 뒤에 목적어(the hightech economy)와 목적보어(running)를 취하는 5형식 구조의 핵심입니다.</div><div class=\"lec-gr-item\">the hightech economy running 5형식(SVOC) 구조: 동명사 keep이 동사적 성질을 유지하여 목적어(the hightech economy)와 목적보어(running)를 취합니다. &#39;목적어(economy)가 보어(running) 상태로 계속되게 하다&#39;라는 구조입니다.</div><div class=\"lec-gr-item\">running (현재분사): 5형식 문장에서 목적어(the hightech economy)의 동작이나 상태를 설명하는 목적보어(OC)로 쓰였습니다. 경제가 &#39;돌아가는(운영되는) 중인&#39; 상태임을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">knowledge worker</td><td class=\"m\">지식 노동자</td></tr><tr><td class=\"w\">keep</td><td class=\"m\">(계속해서) ~하게 하다</td></tr><tr><td class=\"w\">economy</td><td class=\"m\">경제</td></tr><tr><td class=\"w\">run</td><td class=\"m\">운영되다, 작동하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>현대의 첨단 기술 경제는 지식 노동자들의 활동에 의존한다.</li><li>지식 노동자들은 이 경제 시스템이 멈추지 않고 원활하게 작동하게 만드는 핵심 주체이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Knowledge workers are vital to the modern economy, and they serve as the key drivers behind the operation of high-tech industries.</div>\n              <div class=\"lec-final-sum-ko\">지식 노동자는 현대 경제에 필수적인 존재이며, 이들은 첨단 기술 산업을 운영하는 핵심 동력으로서 역할을 수행한다.</div></div></div>"],"segs":[[{"audio":"./unit19_03_강의_audio/1.mp3","hl":null}],[{"audio":"./unit19_03_강의_audio/2.mp3","hl":null}],[{"audio":"./unit19_03_강의_audio/3.mp3","hl":null},{"audio":"./unit19_03_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit19_03_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit19_03_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit19_03_강의_audio/7.mp3","hl":null}],[{"audio":"./unit19_03_강의_audio/8.mp3","hl":"main"},{"audio":"./unit19_03_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit19_03_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit19_03_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(
