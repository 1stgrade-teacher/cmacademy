voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">goal</td><td class=\"m\">목표</td></tr><tr><td class=\"w\">science</td><td class=\"m\">과학</td></tr><tr><td class=\"w\">learn</td><td class=\"m\">배우다, 알아내다</td></tr><tr><td class=\"w\">nature</td><td class=\"m\">자연</td></tr><tr><td class=\"w\">observe</td><td class=\"m\">관찰하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">physical</td><td class=\"m\">물질적인, 물리적인</td></tr><tr><td class=\"w\">world</td><td class=\"m\">세계, 세상</td></tr><tr><td class=\"w\">understand</td><td class=\"m\">이해하다</td></tr><tr><td class=\"w\">research</td><td class=\"m\">연구</td></tr><tr><td class=\"w\">experimentation</td><td class=\"m\">실험</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">과학의 목적은</span><span class=\"en\"><b>The goal of science</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배우는 것이다</span><span class=\"en\"><b>is <span class=\"grammar-hl\">to learn</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연이 어떻게 작동하는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">how nature works</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물리적 세계를 관찰함으로써,</span><span class=\"en\"><b>by <span class=\"grammar-hl\">observing</span> the physical world,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것을 이해하는 것이다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">to understand</span> it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연구와 실험을 통해서</span><span class=\"en\"><b>through research and experimentation.</b></span></div></div><div class=\"lec-sent-ko\">과학의 목적은 물리적 세계를 관찰함으로써 자연이 어떻게 작동하는지 배우는 것이고 연구와 실험을 통해서 그것을 이해하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 주제를 제시합니다. 여기서 goal은 사전적으로는 &#39;목표&#39;이지만, 문맥상 과학이라는 학문이 존재하는 &#39;궁극적인 이유&#39;나 &#39;지향점&#39;을 의미합니다. 필자는 과학을 단순한 지식의 나열이 아니라, &#39;자연의 작동 원리를 파악하려는 의도적인 과정&#39;으로 정의하기 위해 이 단어를 선택했습니다. 이 문장은 과학이 단순히 관찰에 그치지 않고, 그 관찰을 바탕으로 검증(연구와 실험)까지 나아가야 한다는 논리적 단계를 설정하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to learn (to부정사): 보어 역할을 하는 명사적 용법으로, 주어(The goal)의 상태를 설명하고 있습니다.</div><div class=\"lec-gr-item\">how nature works (간접의문문): 의문사(how) + 주어(nature) + 동사(works)의 어순으로, learn의 목적어 역할을 합니다.</div><div class=\"lec-gr-item\">observing (동명사): 전치사 by의 목적어로 쓰여 ‘~함(관찰함)으로써’라는 수단과 방법을 나타냅니다.</div><div class=\"lec-gr-item\">to understand (to부정사): 앞의 to learn과 병렬 구조를 이루며, 보어 역할을 하는 명사적 용법으로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">goal</td><td class=\"m\">목표</td></tr><tr><td class=\"w\">science</td><td class=\"m\">과학</td></tr><tr><td class=\"w\">learn</td><td class=\"m\">배우다, 알아내다</td></tr><tr><td class=\"w\">nature</td><td class=\"m\">자연</td></tr><tr><td class=\"w\">physical</td><td class=\"m\">물질적인, 물리적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">world</td><td class=\"m\">세계, 세상</td></tr><tr><td class=\"w\">understand</td><td class=\"m\">이해하다</td></tr><tr><td class=\"w\">research</td><td class=\"m\">연구</td></tr><tr><td class=\"w\">experimentation</td><td class=\"m\">실험</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과학은 물리적 세계를 관찰하여 자연의 원리를 깨닫는 것을 목표로 한다.</li><li>단순히 보는 것에 머물지 않고, 연구와 실험을 통해 자연을 깊이 있게 이해하고자 한다.</li><li>관찰과 실험이라는 두 가지 핵심 방법을 통해 과학적 진리에 도달한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Science aims to uncover how nature functions, and it achieves this by observing the physical world through research and experimentation.</div>\n              <div class=\"lec-final-sum-ko\">과학은 자연의 작동 원리를 밝히는 것을 목표로 하며, 연구와 실험을 통해 물리적 세계를 관찰함으로써 이를 성취한다.</div></div></div>"],"segs":[[{"audio":"./sentence07_audio/1.mp3","hl":null}],[{"audio":"./sentence07_audio/2.mp3","hl":null}],[{"audio":"./sentence07_audio/3.mp3","hl":null},{"audio":"./sentence07_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence07_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence07_audio/6.mp3","hl":null}],[{"audio":"./sentence07_audio/7.mp3","hl":"main"},{"audio":"./sentence07_audio/8.mp3","hl":"meaning"},{"audio":"./sentence07_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence07_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+ke
