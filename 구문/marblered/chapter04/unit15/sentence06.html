lass=\"w\">consumer</td><td class=\"m\">소비자</td></tr><tr><td class=\"w\">all over</td><td class=\"m\">~의 도처에, 곳곳에</td></tr><tr><td class=\"w\">remain</td><td class=\"m\">여전히 ~한 상태이다</td></tr><tr><td class=\"w\">unconvinced</td><td class=\"m\">확신하지 못하는, 납득하지 않는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">value</td><td class=\"m\">가치</td></tr><tr><td class=\"w\">usefulness</td><td class=\"m\">유용성</td></tr><tr><td class=\"w\">cryptocurrency</td><td class=\"m\">암호화폐</td></tr><tr><td class=\"w\">such as</td><td class=\"m\">~와 같은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일반 소비자들은</span><span class=\"en\"><b>Average consumers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전 세계의</span><span class=\"en\"><b>all over the world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여전히 ~인 상태로 남아 있다</span><span class=\"en\"><b>still <span class=\"grammar-hl\">remain</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확신하지 못하는</span><span class=\"en\"><b><span class=\"grammar-hl\">unconvinced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가치에 대하여</span><span class=\"en\"><b>of the value</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 유용성에 대하여</span><span class=\"en\"><b>and usefulness</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">암호화폐의</span><span class=\"en\"><b>of cryptocurrencies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비트코인과 같은</span><span class=\"en\"><b><span class=\"grammar-hl\">such as bitcoin</span>.</b></span></div></div><div class=\"lec-sent-ko\">전 세계의 일반 소비자들은 여전히 비트코인과 같은 암호화폐의 가치와 유용성을 확신하지 못하는 상태이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전 세계라는 넓은 범위의 사람들을 지칭하는 Average consumers는 전문가나 특정 투자자가 아닌 &#39;보통 사람들&#39;을 의미합니다. 여기서 remain unconvinced는 사전적으로 &#39;확신하지 않은 상태로 남아있다&#39;인데, 이는 단순히 모르는 것을 넘어 암호화폐에 대한 신뢰가 여전히 낮다는 상태를 강조합니다. 필자는 이 단어를 통해 암호화폐가 아직 대중적인 결제 수단으로 자리 잡지 못한 현재의 한계를 지적하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">remain unconvinced 5형식(SVOC) 구조: remain은 여기서 2형식 동사로 쓰여, unconvinced(과거분사)가 주격보어(C) 역할을 하여 주어의 상태를 설명합니다. unconvinced는 convince(설득하다/납득시키다)라는 타동사의 과거분사 형태로, 주어(consumers)가 설득되지 않은 상태임을 나타냅니다.</div><div class=\"lec-gr-item\">unconvinced (과거분사): convince는 타동사인데, 뒤에 목적어가 없고 보어로 쓰여 &#39;납득하지 못하는&#39;이라는 상태를 설명합니다. 명사 수식이나 수동태 구조가 아닌 보어 역할을 하는 형용사적 용법입니다.</div><div class=\"lec-gr-item\">such as bitcoin (관용표현): &#39;...와 같은&#39;이라는 의미의 전치사구로, 앞의 cryptocurrencies를 예시로 들어 구체화하는 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">average</td><td class=\"m\">보통의, 일반적인</td></tr><tr><td class=\"w\">consumer</td><td class=\"m\">소비자</td></tr><tr><td class=\"w\">all over</td><td class=\"m\">~의 도처에, 곳곳에</td></tr><tr><td class=\"w\">remain</td><td class=\"m\">여전히 ~한 상태이다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unconvinced</td><td class=\"m\">확신하지 못하는, 납득하지 않는</td></tr><tr><td class=\"w\">value</td><td class=\"m\">가치</td></tr><tr><td class=\"w\">usefulness</td><td class=\"m\">유용성</td></tr><tr><td class=\"w\">such as</td><td class=\"m\">~와 같은</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>전 세계 대다수의 일반 소비자는 비트코인 등 암호화폐의 실질적 가치를 신뢰하지 않는다.</li><li>대중들은 암호화폐를 여전히 유용하고 가치 있는 화폐로 받아들이기를 주저하고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Global consumers remain skeptical about cryptocurrencies, because they do not see their clear value or practical benefits.</div>\n              <div class=\"lec-final-sum-ko\">전 세계 소비자들은 암호화폐의 명확한 가치나 실질적인 이점을 발견하지 못해 여전히 회의적인 태도를 보이고 있다.</div></div></div>"],"segs":[[{"audio":"./sentence06_audio/1.mp3","hl":null}],[{"audio":"./sentence06_audio/2.mp3","hl":null}],[{"audio":"./sentence06_audio/3.mp3","hl":null},{"audio":"./sentence06_audio/4.mp3","hl":"stage-0"}],[{"audio":"./sentence06_audio/5.mp3","hl":null}],[{"audio":"./sentence06_audio/6.mp3","hl":"main"},{"audio":"./sentence06_audio/7.mp3","hl":"meaning"},{"audio":"./sentence06_audio/8.mp3","hl":"grammar"}],[{"audio":"./sentence06_audio/9.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=nu
