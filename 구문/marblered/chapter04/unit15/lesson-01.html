lecturePlayer(document.getElementById("app"),{"brand":"unit15","title":"주격보어로 쓰이는 구 완전 정복","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">주격보어: 구\u003c/div>\u003ch1>주격보어로 쓰이는 구 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>be동사 뒤에 명사가 아닌 to부정사구, 동명사구, 전치사구가 주격보어로 오는 구조를 익혀 문장을 빠르게 해석한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 주격보어 자리에 명사가 아니라 to부정사구, 동명사구, 전치사구가 오는 구문을 집중적으로 훈련할 거예요. 문장에서 be동사 뒤가 조금 길어도 주어를 설명하는 보어라는 걸 빠르게 보는 연습을 해볼게요. 예문을 통해 익히고 나면 해석 속도가 훨씬 올라갈 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">주격보어: 구\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">2형식 문장에서 \u003cb class=\"key\">주격보어\u003c/b> 자리에는 명사뿐 아니라 \u003cb class=\"key\">to부정사구\u003c/b>, \u003cb class=\"key\">동명사구\u003c/b>, \u003cb class=\"key\">전치사구\u003c/b> 등이 올 수 있다. 특히 \u003cb class=\"key\">of+추상명사\u003c/b>는 형용사처럼 쓰이고, be동사 뒤에서 주어를 보충 설명한다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 The supreme accomplishment is \u003cspan class=\"fx\">to blur the line between work and play\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 The most popular cyber crimes are \u003cspan class=\"fx\">hacking a person's personal account and spreading a computer virus\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 Knowledge of the world is only \u003cspan class=\"fx\">to be acquired in the world, and not in a closet\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 From the perspective of the individual working person, the key to a great workplace is \u003cspan class=\"fx\">feeling wanted and important\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Disease, action that might produce disease, and recovery from disease are \u003cspan class=\"fx\">of vital concern to the whole primitive community\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Average consumers all over the world still remain \u003cspan class=\"fx\">unconvinced of the value and usefulness of cryptocurrencies such as bitcoin\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 The goal of science is \u003cspan class=\"fx\">to learn how nature works by observing the physical world, and to understand it through research and experimentation\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Faith is \u003cspan class=\"fx\">taking the first step even when you don't see the whole staircase\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 Life isn't \u003cspan class=\"fx\">about waiting for the storm to pass. It's about learning how to dance in the rain\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 The only way to understand a word fully is \u003cspan class=\"fx\">to see it in use in as many contexts as possible\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 What the textbooks do not teach you is \u003cspan class=\"fx\">when to apply the knowledge\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 The most important factor in a happy life is \u003cspan class=\"fx\">having a good social network that you can depend on\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘 핵심은 주격보어 자리에 명사만 오는 게 아니라 다양한 구가 온다는 거예요. be동사 뒤에 to부정사구가 오면 앞의 주어가 무엇인지 설명해 주고, 동명사구가 와도 같은 역할을 합니다. 전치사구 of vital concern 같은 표현이 와도 주어 상태를 보충 설명하는 주격보어로 볼 수 있어요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 The supreme accomplishment is \u003cspan class=\"fx\">to blur the line between work and play\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The supreme accomplishment\u003c/div>\u003cdiv class=\"k\">최고의 성취는\u003c/div>\u003cdiv class=\"e\">is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">to blur the line\u003c/div>\u003cdiv class=\"k\">경계를 흐릿하게 만드는 것\u003c/div>\u003cdiv class=\"e\">between work and play.\u003c/div>\u003cdiv class=\"k\">일과 놀이 사이의\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>be동사 \u003cb class=\"key\">is\u003c/b> 뒤에서 \u003cb class=\"key\">to부정사구\u003c/b>가 \u003cb class=\"key\">주격보어\u003c/b>로 쓰여 주어 The supreme accomplishment를 설명한다. to부정사구 안에서 blur의 목적어는 the line이고, between work and play는 the line을 수식하는 전치사구이다.\u003c/div>","segs":[{"n":3,"text":"The supreme accomplishment, 최고의 성취는. is, ~이다. to blur the line, 경계를 흐릿하게 만드는 것. between work and play, 일과 놀이 사이의","hl":"ch"},{"n":4,"text":"첫 번째 문장에서 is 뒤에 to blur the line between work and play가 통째로 주격보어로 쓰였어요. 주어 최고의 성취가 무엇인지 설명해 주는 to부정사구죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 The supreme accomplishment is \u003cspan class=\"fx\">to blur the line between work and play\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>최고의 성취란 일과 놀이의 경계를 허무는 것이다. 일이 놀이처럼 즐겁고, 놀이가 일처럼 진지해지는 상태를 뜻한다. blur the line은 ‘경계를 흐리다’, 즉 구분을 없애다는 의미다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">blur the line between work and play\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make the boundary between work and play unclear\u003c/span>\u003cdiv class=\"w\">blur the line은 ‘경계를 흐리다’라는 뜻으로, make the boundary unclear로 바꾸면 더 쉬운 표현이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">supreme\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">highest\u003c/span>\u003cdiv class=\"w\">supreme은 ‘최고의’라는 뜻으로, highest로 바꿔 쓸 수 있다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">blur\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make unclear\u003c/span>\u003cspan class=\"y-eq\">blur = make unclear\u003c/span>\u003cdiv class=\"w\">blur의 뜻을 명확하게 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">supreme\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">highest\u003c/span>\u003cspan class=\"y-eq\">supreme = highest\u003c/span>\u003cdiv class=\"w\">최고의라는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The highest achievement is to make the boundary between work and play unclear.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"최고의 성취는 일과 놀이 사이의 경계를 흐리는 것이라는 뜻이에요. 일과 놀이가 따로 갈라지지 않고 몰입해서 즐기는 상태를 말해요. blur the line between work and play는 일과 놀이의 경계를 없앤다는 말이죠.","hl":"mn"},{"n":6,"text":"blur the line은 make the boundary unclear로 바꿀 수 있어요. supreme은 highest로 바꾸면 더 쉬운 단어가 되죠.","hl":"rw"},{"n":7,"text":"blur는 make unclear과 의미가 통하고요. supreme은 highest와 바꿔 쓸 수 있어요. between A and B는 A와 B 사이를 뜻하는 전치사구입니다.","hl":"ph"},{"n":8,"text":"다시 써 보면 The highest achievement is to make the boundary between work and play unclear. 최고의 성취는 일과 놀이의 경계를 흐리게 만드는 것이라는 뜻이 그대로 살아 있죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 The most popular cyber crimes are \u003cspan class=\"fx\">hacking a person's personal account and spreading a computer virus\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The most popular cyber crimes\u003c/div>\u003cdiv class=\"k\">가장 일반적인 사이버 범죄들은\u003c/div>\u003cdiv class=\"e\">are\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">hacking a person's personal account\u003c/div>\u003cdiv class=\"k\">개인 계정을 해킹하는 것\u003c/div>\u003cdiv class=\"e\">and spreading a computer virus.\u003c/div>\u003cdiv class=\"k\">그리고 컴퓨터 바이러스를 유포하는 것\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>be동사 \u003cb class=\"key\">are\u003c/b> 뒤에 \u003cb class=\"key\">동명사구\u003c/b> hacking ~ account와 spreading a computer virus가 \u003cb class=\"key\">등위접속사 and\u003c/b>로 연결되어 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였다. 두 동명사구가 함께 주어를 설명한다.\u003c/div>","segs":[{"n":9,"text":"The most popular cyber crimes, 가장 일반적인 사이버 범죄들은. are, ~이다. hacking a person's personal account, 개인 계정을 해킹하는 것. and spreading a computer virus, 그리고 컴퓨터 바이러스를 유포하는 것","hl":"ch"},{"n":10,"text":"두 번째 문장은 are 뒤에 동명사구 두 개가 and로 연결되어 주격보어로 쓰였어요. hacking a person's personal account와 spreading a computer virus가 사이버 범죄의 대표적인 유형을 설명하죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 The most popular cyber crimes are \u003cspan class=\"fx\">hacking a person's personal account and spreading a computer virus\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>가장 흔한 사이버 범죄가 개인 계정 해킹과 컴퓨터 바이러스 유포라는 것이다. 사이버 범죄의 대표적 유형을 콕 집어 말한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The most popular cyber crimes are\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The most common cyber crimes are\u003c/span>\u003cdiv class=\"w\">popular는 여기서 ‘흔한, 일반적인’ 뜻이므로 common으로 바꾸면 자연스럽다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">hacking a person's personal account\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">breaking into someone's personal account\u003c/span>\u003cdiv class=\"w\">hack은 break into와 의미가 통한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">popular\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">common\u003c/span>\u003cspan class=\"y-eq\">popular = common\u003c/span>\u003cdiv class=\"w\">여기서는 일반적인, 흔한이라는 뜻으로 common과 통한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">hack\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">break into\u003c/span>\u003cspan class=\"y-eq\">hack = break into\u003c/span>\u003cdiv class=\"w\">컴퓨터 계정에 불법 접근하다는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">spread\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">distribute\u003c/span>\u003cspan class=\"y-eq\">spread = distribute\u003c/span>\u003cdiv class=\"w\">바이러스를 퍼뜨리다는 뜻으로 distribute로 바꿀 수 있다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The most common cyber crimes are breaking into someone's personal account and distributing a computer virus.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"가장 일반적인 사이버 범죄가 개인 계정 해킹과 컴퓨터 바이러스 유포라는 뜻이에요. popular가 여기서는 인기 있는이 아니라 흔한이라는 뜻으로 쓰였다는 점을 기억하세요.","hl":"mn"},{"n":12,"text":"popular는 common으로 바꿔 쓸 수 있고요. hack은 break into로도 표현할 수 있어요. spread는 distribute로 바꾸면 격식 있는 어감이 됩니다.","hl":"rw"},{"n":13,"text":"popular는 common과 뜻이 통하고요. hack은 break into, spread는 distribute와 바꿔 쓸 수 있어요. 계정을 해킹하다는 표현은 hack an account 또는 break into an account라고 합니다.","hl":"ph"},{"n":14,"text":"The most common cyber crimes are breaking into someone's personal account and distributing a computer virus. 이렇게 바꿔도 원문의 뜻은 그대로 유지돼요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 Knowledge of the world is only \u003cspan class=\"fx\">to be acquired in the world, and not in a closet\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Knowledge of the world\u003c/div>\u003cdiv class=\"k\">세상의 지식은\u003c/div>\u003cdiv class=\"e\">is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">only to be acquired\u003c/div>\u003cdiv class=\"k\">오로지 획득될 수 있는 것\u003c/div>\u003cdiv class=\"e\">in the world,\u003c/div>\u003cdiv class=\"k\">세상 속에서\u003c/div>\u003cdiv class=\"e\">and not in a closet.\u003c/div>\u003cdiv class=\"k\">그리고 벽장 속에서가 아닌\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>be동사 \u003cb class=\"key\">is\u003c/b> 뒤에서 \u003cb class=\"key\">to부정사구\u003c/b> to be acquired 이하가 \u003cb class=\"key\">주격보어\u003c/b>로 쓰이며, 이때 \u003cb class=\"key\">be + to-v\u003c/b>는 ‘~할 수 있다’의 가능 의미를 나타낸다. 부정어 not과 함께 세상 속에서만 얻어지고 벽장 속에서는 얻어지지 않는다는 뜻을 대조한다.\u003c/div>","segs":[{"n":15,"text":"Knowledge of the world, 세상의 지식은. is, ~이다. only to be acquired, 오로지 획득될 수 있는 것. in the world, 세상 속에서. and not in a closet, 그리고 벽장 속에서가 아닌","hl":"ch"},{"n":16,"text":"세 번째 문장은 is 뒤에 to be acquired 이하가 통째로 주격보어로 쓰였어요. be to-v 형태인데 여기서는 가능의 의미로 해석해서 only to be acquired는 오직 얻어질 수 있다라고 읽으면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 Knowledge of the world is only \u003cspan class=\"fx\">to be acquired in the world, and not in a closet\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>세상에 대한 지식은 오직 세상에 나가서 직접 부딪히며 얻어야 한다는 말이다. 책상이나 방 안에만 틀어박혀서는 얻을 수 없다는 의미로, 경험을 통한 지식을 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is only to be acquired\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can only be acquired\u003c/span>\u003cdiv class=\"w\">be to-v의 가능 뜻을 can으로 바꾸어 더 분명하게 표현한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in the world\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">through real-world experience\u003c/span>\u003cdiv class=\"w\">실제 세상 경험을 통해 얻는다는 의미로 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">acquire\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">obtain\u003c/span>\u003cspan class=\"y-eq\">acquire = obtain\u003c/span>\u003cdiv class=\"w\">획득하다는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">closet\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">wardrobe\u003c/span>\u003cspan class=\"y-eq\">closet = wardrobe\u003c/span>\u003cdiv class=\"w\">벽장이라는 뜻으로, 실내의 닫힌 공간을 뜻한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can\u003c/span>\u003cspan class=\"y-eq\">is to = can\u003c/span>\u003cdiv class=\"w\">be to-v가 가능의 뜻을 가질 때 can으로 바꿀 수 있다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Knowledge of the world can only be acquired in the world, not in a closet.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"세상의 지식은 오직 세상 안에서만 얻어지고 벽장 속에서는 얻어지지 않는다는 뜻이에요. 실제 경험과 현장을 통해서만 지식을 얻을 수 있다는 교훈이죠.","hl":"mn"},{"n":18,"text":"is only to be acquired는 can only be acquired로 바꿀 수 있어요. in the world는 through real-world experience로 바꾸면 실제 세상 경험이라는 의미가 더 선명해져요.","hl":"rw"},{"n":19,"text":"acquire는 obtain과 바꿔 쓸 수 있고요. closet은 wardrobe과 비슷한 의미예요. is to는 can으로 바꿔서 가능의 뜻을 더 분명하게 만들 수 있습니다.","hl":"ph"},{"n":20,"text":"Knowledge of the world can only be acquired in the world, not in a closet. 이렇게 바꾸면 be to-v의 전체 의미를 can으로 전환해 놓은 거예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 From the perspective of the individual working person, the key to a great workplace is \u003cspan class=\"fx\">feeling wanted and important\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">From the perspective of the individual working person,\u003c/div>\u003cdiv class=\"k\">근로자 개인의 관점에서\u003c/div>\u003cdiv class=\"e\">the key to a great workplace\u003c/div>\u003cdiv class=\"k\">훌륭한 직장의 비결은\u003c/div>\u003cdiv class=\"e\">is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">feeling wanted and important.\u003c/div>\u003cdiv class=\"k\">필요로 하고 중요하다고 느끼는 것\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>be동사 \u003cb class=\"key\">is\u003c/b> 뒤에서 \u003cb class=\"key\">동명사구\u003c/b> feeling wanted and important가 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였다. feeling은 사람의 감정을 나타내는 동사로, wanted와 important는 feeling의 보어 역할을 한다.\u003c/div>","segs":[{"n":21,"text":"From the perspective of the individual working person, 근로자 개인의 관점에서. the key to a great workplace, 훌륭한 직장의 비결은. is, ~이다. feeling wanted and important, 필요로 하고 중요하다고 느끼는 것","hl":"ch"},{"n":22,"text":"네 번째 문장은 is 뒤에 feeling wanted and important가 주격보어로 쓰였어요. feeling은 동명사이고, wanted와 important는 feeling의 보어로 붙어서 원한다고 느끼는 상태, 중요하다고 느끼는 상태를 표현하죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 From the perspective of the individual working person, the key to a great workplace is \u003cspan class=\"fx\">feeling wanted and important\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>근로자 개인의 입장에서 훌륭한 일터의 핵심은 자신이 필요로 되고 중요한 존재라고 느끼는 것이다. 구성원이 소속감과 존중을 느낄 때 좋은 직장이 된다는 뜻이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the key to a great workplace\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the most important factor in a great workplace\u003c/span>\u003cdiv class=\"w\">key는 ‘비결, 핵심’이라는 뜻으로 factor로 바꿀 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">feeling wanted and important\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">feeling valued and significant\u003c/span>\u003cdiv class=\"w\">wanted와 important 대신 valued와 significant를 쓰면 더 격식 있는 뉘앙스가 된다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">perspective\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">viewpoint\u003c/span>\u003cspan class=\"y-eq\">perspective = viewpoint\u003c/span>\u003cdiv class=\"w\">관점이라는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">key\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">crucial factor\u003c/span>\u003cspan class=\"y-eq\">key = crucial factor\u003c/span>\u003cdiv class=\"w\">비결이라는 뜻을 형용사 pivotal이 아닌 factor로 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">individual\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">each\u003c/span>\u003cspan class=\"y-eq\">individual = each\u003c/span>\u003cdiv class=\"w\">개인의라는 뜻으로 각각의라는 의미와 통한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">From the viewpoint of each working person, the most important factor in a great workplace is feeling valued and significant.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"근로자 개인의 관점에서 훌륭한 직장의 핵심은 필요하고 중요한 존재라고 느끼는 것이라는 뜻이에요. 사람은 존중받고 쓸모 있다고 느낄 때 직장에 만족한다는 의미를 담고 있죠.","hl":"mn"},{"n":24,"text":"the key to a great workplace는 the most important factor in a great workplace로 바꿀 수 있어요. feeling wanted and important는 feeling valued and significant로 바꾸면 더 격식 있는 표현이 됩니다.","hl":"rw"},{"n":25,"text":"perspective는 viewpoint와 뜻이 통하고요. key는 crucial factor로 풀어 쓸 수 있어요. individual은 each와 같은 의미로 쓰일 수 있습니다.","hl":"ph"},{"n":26,"text":"From the viewpoint of each working person, the most important factor in a great workplace is feeling valued and significant. 이렇게 바꿔도 원문의 뜻이 그대로 살아 있죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Disease, action that might produce disease, and recovery from disease are \u003cspan class=\"fx\">of vital concern to the whole primitive community\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Disease,\u003c/div>\u003cdiv class=\"k\">질병,\u003c/div>\u003cdiv class=\"e\">action that might produce disease,\u003c/div>\u003cdiv class=\"k\">질병을 유발할 수도 있는 행동,\u003c/div>\u003cdiv class=\"e\">and recovery from disease\u003c/div>\u003cdiv class=\"k\">그리고 질병으로부터의 회복은\u003c/div>\u003cdiv class=\"e\">are\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">of vital concern\u003c/div>\u003cdiv class=\"k\">중대한 관심사인\u003c/div>\u003cdiv class=\"e\">to the whole primitive community.\u003c/div>\u003cdiv class=\"k\">원시 공동체 전체에게\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>be동사 \u003cb class=\"key\">are\u003c/b> 뒤에서 \u003cb class=\"key\">전치사구\u003c/b> of vital concern ~ community가 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였다. \u003cb class=\"key\">of+추상명사\u003c/b> concern은 형용사적 역할을 하며, vital이 concern을 수식한다. to the whole primitive community는 concern의 대상을 나타낸다.\u003c/div>","segs":[{"n":27,"text":"Disease, 질병. action that might produce disease, 질병을 유발할 수도 있는 행동. and recovery from disease, 그리고 질병으로부터의 회복은. are, ~이다. of vital concern, 중대한 관심사인. to the whole primitive community, 원시 공동체 전체에게","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 be동사 are 뒤에 of vital concern이라는 전치사구가 주격보어로 쓰였어요. of 뒤에 추상명사 concern이 오면 형용사처럼 해석되어 vital concern 전체가 중대한 관심사인이라는 뜻을 만들죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Disease, action that might produce disease, and recovery from disease are \u003cspan class=\"fx\">of vital concern to the whole primitive community\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>질병, 질병을 일으킬 수 있는 행동, 질병에서 회복하는 일은 원시 공동체 전체에게 매우 중요한 관심사라는 뜻이다. 원시 사회에서 질병은 개인의 문제가 아니라 공동체 전체의 생존을 좌우하는 문제임을 보여 준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are of vital concern to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are vitally important to\u003c/span>\u003cdiv class=\"w\">of+추상명사 구문을 형용사 important로 바꾸고, vital을 부사 vitally로 변환해 자연스럽게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the whole primitive community\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the entire primitive community\u003c/span>\u003cdiv class=\"w\">whole과 entire는 서로 바꿔 쓸 수 있다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">of vital concern\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">vitally important\u003c/span>\u003cspan class=\"y-eq\">of vital concern = vitally important\u003c/span>\u003cdiv class=\"w\">of+추상명사는 형용사구와 같은 의미를 갖는다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">recovery from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">healing from\u003c/span>\u003cspan class=\"y-eq\">recovery from = healing from\u003c/span>\u003cdiv class=\"w\">~로부터 회복이라는 뜻의 유사 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">primitive\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">early\u003c/span>\u003cspan class=\"y-eq\">primitive = early\u003c/span>\u003cdiv class=\"w\">원시의, 초기의라는 뜻으로 early와 통한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Disease, action that might produce disease, and recovery from disease are vitally important to the entire primitive community.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"질병, 질병을 일으킬 수 있는 행동, 질병에서 회복되는 것이 원시 공동체 전체에게 아주 중요한 관심사라는 뜻이에요. 원시 사회에서는 건강과 질병이 공동체 전체의 문제였다는 것을 보여 줍니다.","hl":"mn"},{"n":30,"text":"are of vital concern to는 are vitally important to로 바꿀 수 있어요. the whole primitive community는 the entire primitive community로 바꿔도 같은 뜻이 됩니다.","hl":"rw"},{"n":31,"text":"of vital concern은 vitally important와 같은 의미예요. recovery from은 healing from으로 바꿀 수 있고요. primitive는 early와 바꿔 쓸 수 있습니다.","hl":"ph"},{"n":32,"text":"Disease, action that might produce disease, and recovery from disease are vitally important to the entire primitive community. 이렇게 전치사구를 형용사구로 전환해서 뜻을 그대로 유지했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 Average consumers all over the world still remain \u003cspan class=\"fx\">unconvinced of the value and usefulness of cryptocurrencies such as bitcoin\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Average consumers all over the world\u003c/div>\u003cdiv class=\"k\">전 세계의 일반 소비자들은\u003c/div>\u003cdiv class=\"e\">still remain\u003c/div>\u003cdiv class=\"k\">여전히 남아 있다\u003c/div>\u003cdiv class=\"e\">unconvinced of the value and usefulness\u003c/div>\u003cdiv class=\"k\">가치와 유용성을 확신하지 못하는 상태로\u003c/div>\u003cdiv class=\"e\">of cryptocurrencies such as bitcoin.\u003c/div>\u003cdiv class=\"k\">비트코인과 같은 암호화폐에 대해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>2형식 동사 \u003cb class=\"key\">remain\u003c/b> 뒤에서 \u003cb class=\"key\">형용사구\u003c/b> unconvinced ~ bitcoin이 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였다. ‘~을 확신하지 못하는’ 뜻의 \u003cb class=\"key\">unconvinced of\u003c/b>가 이끄는 어구가 주어의 상태를 설명한다.\u003c/div>","segs":[{"n":33,"text":"Average consumers all over the world, 전 세계의 일반 소비자들은. still remain, 여전히 남아 있다. unconvinced of the value and usefulness, 가치와 유용성을 확신하지 못하는 상태로. of cryptocurrencies such as bitcoin, 비트코인과 같은 암호화폐에 대해","hl":"ch"},{"n":34,"text":"여섯 번째 문장은 remain이라는 이형식 동사 뒤에 unconvinced of 이하가 주격보어로 쓰였어요. 형용사구가 주어 Average consumers의 상태를 설명하면서 still remain과 함께 아직도 확신하지 못하는 상태가 계속된다는 의미를 만듭니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 Average consumers all over the world still remain \u003cspan class=\"fx\">unconvinced of the value and usefulness of cryptocurrencies such as bitcoin\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>전 세계 일반 소비자들은 비트코인 같은 암호화폐의 가치와 유용성을 아직도 확신하지 못하고 있다는 뜻이다. 암호화폐에 대한 대중의 회의적 태도를 나타낸다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">remain unconvinced of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are still not convinced of\u003c/span>\u003cdiv class=\"w\">remain을 be still not convinced로 바꾸면 상태가 이어지고 있음을 더 명확히 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">such as\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">like\u003c/span>\u003cdiv class=\"w\">such as는 like로 바꿔 쓸 수 있는 예시 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">average consumers\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ordinary consumers\u003c/span>\u003cspan class=\"y-eq\">average consumers = ordinary consumers\u003c/span>\u003cdiv class=\"w\">일반 소비자라는 뜻의 유의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unconvinced of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">skeptical about\u003c/span>\u003cspan class=\"y-eq\">unconvinced of = skeptical about\u003c/span>\u003cdiv class=\"w\">확신하지 못하는 것을 회의적이라는 뜻으로 바꾼 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">usefulness\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">utility\u003c/span>\u003cspan class=\"y-eq\">usefulness = utility\u003c/span>\u003cdiv class=\"w\">유용성이라는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Ordinary consumers around the world still remain skeptical about the value and usefulness of cryptocurrencies such as bitcoin.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"전 세계의 일반 소비자들은 비트코인 같은 암호화폐의 가치와 유용성을 아직도 확신하지 못하고 있다는 뜻이에요. 암호화폐가 보편적 신뢰를 얻지 못하고 있다는 현실을 보여 주죠.","hl":"mn"},{"n":36,"text":"remain unconvinced of는 are still not convinced of로 바꿀 수 있어요. such as는 like로 바꾸면 더 쉬운 예시 표현이 됩니다.","hl":"rw"},{"n":37,"text":"average consumers는 ordinary consumers로 바꿔 쓸 수 있고요. unconvinced of는 skeptical about으로 바꾸면 회의적이라는 뉘앙스가 살아요. usefulness는 utility와 같은 뜻입니다.","hl":"ph"},{"n":38,"text":"Ordinary consumers around the world still remain skeptical about the value and usefulness of cryptocurrencies such as bitcoin. 이렇게 바꾸면 어휘만 다를 뿐 원문의 뜻이 그대로 전달돼요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 The goal of science is \u003cspan class=\"fx\">to learn how nature works by observing the physical world, and to understand it through research and experimentation\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The goal of science\u003c/div>\u003cdiv class=\"k\">과학의 목적은\u003c/div>\u003cdiv class=\"e\">is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">to learn how nature works\u003c/div>\u003cdiv class=\"k\">자연이 어떻게 작동하는지 배우는 것\u003c/div>\u003cdiv class=\"e\">by observing the physical world,\u003c/div>\u003cdiv class=\"k\">물리적 세계를 관찰함으로써\u003c/div>\u003cdiv class=\"e\">and to understand it\u003c/div>\u003cdiv class=\"k\">그리고 그것을 이해하는 것\u003c/div>\u003cdiv class=\"e\">through research and experimentation.\u003c/div>\u003cdiv class=\"k\">연구와 실험을 통해서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>be동사 \u003cb class=\"key\">is\u003c/b> 뒤에서 두 개의 \u003cb class=\"key\">to부정사구\u003c/b> to learn ~ world와 to understand ~ experimentation이 \u003cb class=\"key\">and\u003c/b>로 연결되어 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였다. by observing과 through research는 각각 방법을 나타내는 부사구이다.\u003c/div>","segs":[{"n":39,"text":"The goal of science, 과학의 목적은. is, ~이다. to learn how nature works, 자연이 어떻게 작동하는지 배우는 것. by observing the physical world, 물리적 세계를 관찰함으로써. and to understand it, 그리고 그것을 이해하는 것. through research and experimentation, 연구와 실험을 통해서","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 is 뒤에 to learn부터 끝까지 통째로 주격보어로 쓰였어요. to learn과 to understand라는 두 개의 to부정사구가 and로 연결해서 과학의 목적이 무엇인지 설명하죠. by observing은 관찰함으로써라는 방법을, through research and experimentation은 연구와 실험을 통해서라는 방법을 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 The goal of science is \u003cspan class=\"fx\">to learn how nature works by observing the physical world, and to understand it through research and experimentation\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>과학의 목적은 물리적 세계를 관찰하여 자연이 어떻게 작동하는지 배우고, 연구와 실험을 통해 그것을 이해하는 것이다. 관찰과 실험이 과학의 두 축임을 말한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The goal of science is\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Science aims\u003c/span>\u003cdiv class=\"w\">goal is를 동사 aims로 압축하면 더 간결한 문장이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">works\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">functions\u003c/span>\u003cdiv class=\"w\">works는 자연이 기능한다는 의미로 functions로 바꿀 수 있다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">observe\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">watch carefully\u003c/span>\u003cspan class=\"y-eq\">observe = watch carefully\u003c/span>\u003cdiv class=\"w\">관찰하다의 뜻을 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">experimentation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">experiments\u003c/span>\u003cspan class=\"y-eq\">experimentation = experiments\u003c/span>\u003cdiv class=\"w\">실험이라는 뜻의 명사 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">through\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">by means of\u003c/span>\u003cspan class=\"y-eq\">through = by means of\u003c/span>\u003cdiv class=\"w\">~을 통하여라는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Science aims to learn how nature functions by observing the physical world and to understand it through research and experiments.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"과학의 목적은 물리적 세계를 관찰해서 자연이 어떻게 작동하는지 배우고, 연구와 실험을 통해 자연을 이해하는 것이라는 뜻이에요. 관찰과 실험이 과학의 핵심 방법임을 말하고 있죠.","hl":"mn"},{"n":42,"text":"The goal of science is를 Science aims로 바꾸면 과학이 목표한다라는 간결한 문장이 돼요. works는 functions로 바꿔도 자연이 기능한다는 의미가 그대로 유지됩니다.","hl":"rw"},{"n":43,"text":"observe는 watch carefully로 풀어 쓸 수 있고요. experimentation은 experiments와 뜻이 같아요. through는 by means of로 바꿔 쓸 수 있습니다.","hl":"ph"},{"n":44,"text":"Science aims to learn how nature functions by observing the physical world and to understand it through research and experiments. 이렇게 바꾸면 원문의 뜻을 유지하면서 더 간결하게 표현한 문장이 돼요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 Faith is \u003cspan class=\"fx\">taking the first step even when you don't see the whole staircase\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Faith\u003c/div>\u003cdiv class=\"k\">신념은\u003c/div>\u003cdiv class=\"e\">is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">taking the first step\u003c/div>\u003cdiv class=\"k\">첫발을 내딛는 것\u003c/div>\u003cdiv class=\"e\">even when you don't see the whole staircase.\u003c/div>\u003cdiv class=\"k\">당신이 전체 계단을 보지 못할 때조차도\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>be동사 \u003cb class=\"key\">is\u003c/b> 뒤에서 \u003cb class=\"key\">동명사구\u003c/b> taking the first step이 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였다. 이어지는 even when ~ staircase는 양보의 부사절로, 신념이 어떤 상황에서 첫발을 내딛는 것인지 수식한다.\u003c/div>","segs":[{"n":45,"text":"Faith, 신념은. is, ~이다. taking the first step, 첫발을 내딛는 것. even when you don't see the whole staircase, 당신이 전체 계단을 보지 못할 때조차도","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 is 뒤에 taking the first step이 주격보어로 쓰였어요. 뒤에 even when you don't see the whole staircase는 양보의 부사절로, 전체 계단이 보이지 않는 상황에서도 첫발을 내딛는다는 의미를 덧붙입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 Faith is \u003cspan class=\"fx\">taking the first step even when you don't see the whole staircase\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>믿음은 전체 계단이 보이지 않을 때에도 첫발을 내딛는 것이다. 결과를 다 알지 못하더라도 믿음을 가지고 행동하는 용기를 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Faith is taking the first step\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Faith means taking the first step\u003c/span>\u003cdiv class=\"w\">is를 means로 바꾸면 ‘믿음은 ~을 의미한다’는 정의의 뉘앙스가 살아난다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">even when you don't see\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">even though you can't see\u003c/span>\u003cdiv class=\"w\">even when 대신 even though를 쓰면 양보의 뜻이 더 분명해진다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">faith\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">belief\u003c/span>\u003cspan class=\"y-eq\">faith = belief\u003c/span>\u003cdiv class=\"w\">믿음이라는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take the first step\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make the first move\u003c/span>\u003cspan class=\"y-eq\">take the first step = make the first move\u003c/span>\u003cdiv class=\"w\">첫발을 내딛다는 뜻의 관용 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">staircase\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stairs\u003c/span>\u003cspan class=\"y-eq\">staircase = stairs\u003c/span>\u003cdiv class=\"w\">계단이라는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Faith means making the first move even though you cannot see the entire staircase.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"믿음은 전체 계단이 보이지 않더라도 첫발을 내딛는 것이라는 뜻이에요. 결과를 다 알지 못해도 믿음을 갖고 먼저 행동하는 용기를 말하는 명언이죠.","hl":"mn"},{"n":48,"text":"Faith is taking the first step은 Faith means making the first move로 바꿀 수 있어요. even when은 even though로 바꾸면 양보의 뜻이 더 분명해집니다.","hl":"rw"},{"n":49,"text":"faith는 belief와 바꿔 쓸 수 있고요. take the first step은 make the first move와 같은 뜻이에요. staircase는 stairs와 같은 의미입니다.","hl":"ph"},{"n":50,"text":"Faith means making the first move even though you cannot see the entire staircase. 이렇게 바꾸면 믿음의 정의를 다르게 표현하면서도 뜻은 그대로예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 Life isn't \u003cspan class=\"fx\">about waiting for the storm to pass. It's about learning how to dance in the rain\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Life isn't\u003c/div>\u003cdiv class=\"k\">삶은 아니다\u003c/div>\u003cdiv class=\"e\">about waiting for the storm to pass.\u003c/div>\u003cdiv class=\"k\">폭풍이 지나가길 기다리는 것에 관한 것이\u003c/div>\u003cdiv class=\"e\">It's\u003c/div>\u003cdiv class=\"k\">그것은 ~이다\u003c/div>\u003cdiv class=\"e\">about learning how to dance in the rain.\u003c/div>\u003cdiv class=\"k\">빗속에서 춤추는 법을 배우는 것에 관한 것이\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>각 문장에서 \u003cb class=\"key\">전치사구\u003c/b> about waiting ~ pass와 about learning ~ rain이 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였다. 앞 문장은 부정, 뒤 문장은 긍정으로 대조하며, learning의 목적어로 \u003cb class=\"key\">how + to-v\u003c/b> 구문이 쓰였다.\u003c/div>","segs":[{"n":51,"text":"Life isn't, 삶은 아니다. about waiting for the storm to pass, 폭풍이 지나가길 기다리는 것에 관한 것이. It's, 그것은 ~이다. about learning how to dance in the rain, 빗속에서 춤추는 법을 배우는 것에 관한 것이","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 두 문장으로 되어 있는데, 각각 about waiting for the storm to pass와 about learning how to dance in the rain이 주격보어로 쓰였어요. about은 전치사이므로 뒤에 동명사구가 오고요. 두 번째 문장 속에 how to dance라는 의문사와 to부정사 표현도 나옵니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 Life isn't \u003cspan class=\"fx\">about waiting for the storm to pass. It's about learning how to dance in the rain\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>삶은 폭풍이 지나가길 가만히 기다리는 것이 아니라, 폭풍 속에서도 빗속에서 춤추는 법을 배우는 것이다. 어려움이 사라지기를 기다리기보다 그 속에서 대처하고 즐기는 태도를 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">isn't about waiting for the storm to pass\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">isn't just waiting for the storm to pass\u003c/span>\u003cdiv class=\"w\">about 없이 동명사구로 바꾸면 더 단순한 문장이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">learning how to dance in the rain\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">learning to dance in the rain\u003c/span>\u003cdiv class=\"w\">how to dance의 how를 생략해도 학습 내용이 분명하다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">wait for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">await\u003c/span>\u003cspan class=\"y-eq\">wait for = await\u003c/span>\u003cdiv class=\"w\">기다리다는 뜻의 동의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pass\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">go away\u003c/span>\u003cspan class=\"y-eq\">pass = go away\u003c/span>\u003cdiv class=\"w\">지나가다는 뜻의 구동사 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">learn how to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">learn to\u003c/span>\u003cspan class=\"y-eq\">learn how to-v = learn to-v\u003c/span>\u003cdiv class=\"w\">how to-v에서 how를 생략해도 의미가 통한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Life is not about waiting for the storm to pass; it is about learning to dance in the rain.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"삶은 폭풍이 지나가기를 그냥 기다리는 것이 아니라, 비가 오는 상황에서도 춤추는 법을 배우는 것이라는 뜻이에요. 문제가 사라지기만 기다리지 말고 그 안에서 적응하고 즐기는 태도를 강조하죠.","hl":"mn"},{"n":54,"text":"isn't about waiting for the storm to pass는 isn't just waiting for the storm to pass로 바꿔 쓸 수 있어요. learning how to dance in the rain은 learning to dance in the rain으로 how를 생략해도 뜻이 통합니다.","hl":"rw"},{"n":55,"text":"wait for는 await와 바꿀 수 있고요. pass는 go away로 풀어 쓸 수 있어요. learn how to dance는 learn to dance로 바꿔도 의미가 유지됩니다.","hl":"ph"},{"n":56,"text":"Life is not about waiting for the storm to pass; it is about learning to dance in the rain. 이렇게 바꾸면 같은 뜻을 문장 구조만 조금 다르게 표현한 거예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문
