으로 이해하는 방법: 맥락의 힘</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">단어를 제대로 이해한다는 것은 단순히 사전적 의미를 외우는 것을 넘어, 그 단어가 맥락(Context) 속에서 어떻게 쓰이는지 파악하는 과정을 말합니다. 우리가 새로운 친구를 사귈 때 그 사람의 성격을 여러 상황에서 겪어봐야 비로소 잘 알게 되는 것과 비슷하게, 언어 역시 다양한 문장 환경 속에서 노출(Exposure)될수록 더욱 깊이 있게 이해할 수 있죠. 언어학에서는 이를 통계적 학습(Statistical Learning)이라고도 부르는데, 뇌가 수많은 데이터를 통해 단어 간의 결합이나 뉘앙스를 스스로 깨우치는 원리를 의미합니다. 따라서 영어 공부를 할 때 단어장만 보는 것보다, 다양한 글을 읽으며 문맥적 단서(Contextual Clues)를 찾는 훈련을 하는 것이 훨씬 효과적인 학습법이 될 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01단어 이해의 조건</div><ul><li>단어의 진정한 의미를 파악하기 위해서는 단순히 사전적 정의를 외우는 것만으로는 부족하다.</li><li>단어의 완전한 이해(understand fully)를 위한 필수 조건</li><li>단어를 다양한 상황 속에서 직접 확인해야 함</li><li>핵심 키워드: 맥락(contexts)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02학습 방법론</div><ul><li>단어는 고정된 상태가 아니라, 사용되는 환경에 따라 다양한 의미와 뉘앙스를 가진다.</li><li>최대한 많은 문맥(as many contexts as possible)에서 단어를 접할 것</li><li>문장 속에서 실제로 사용되는 모습(in use)을 관찰하는 것이 중요함</li><li>핵심 키워드: 사용(use)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">understand</td><td class=\"m\">이해하다</td></tr><tr><td class=\"w\">fully</td><td class=\"m\">완전히, 충분히</td></tr><tr><td class=\"w\">in use</td><td class=\"m\">사용 중인, 쓰이고 있는</td></tr><tr><td class=\"w\">context</td><td class=\"m\">문맥, 맥락, 상황</td></tr><tr><td class=\"w\">as ~ as possible</td><td class=\"m\">가능한 한 ~하게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">유일한 방법은</span><span class=\"en\"><b>The only way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단어를 완전히 이해하는</span><span class=\"en\"><b><span class=\"grammar-hl\">to understand</span> a word fully</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보는 것이다 그것을</span><span class=\"en\"><b><span class=\"grammar-hl\">is to see</span> it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사용되는 상태로</span><span class=\"en\"><b>in use</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능한 한 많은 문맥 속에서</span><span class=\"en\"><b>in as many contexts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능한 만큼</span><span class=\"en\"><b>as possible.</b></span></div></div><div class=\"lec-sent-ko\">단어를 완전히 이해하는 유일한 방법은 가능한 한 많은 문맥 속에서 사용되는 그것을 보는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 어휘 학습의 핵심 원리를 설명합니다. 여기서 in use는 사전적으로 &#39;사용 중인&#39;이라는 뜻이지만, 여기서는 &#39;실제로 문장 속에서 어떻게 쓰이는지&#39;라는 의미로 쓰였습니다. 단어의 뜻을 사전에서 암기하는 것을 넘어, 다양한 상황에서 그 단어가 어떻게 살아 움직이는지를 직접 확인해야 한다는 점을 강조하기 위해 이 표현을 선택했습니다. 앞 문장은 없지만, 이 문장은 언어 학습에 대한 필자의 기본적인 관점을 제시하며 독자에게 올바른 학습 태도를 권고하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to understand (to부정사): 명사를 수식하는 형용사적 용법으로, 앞의 명사 way를 구체화하여 &#39;…하는 (방법)&#39;이라는 의미를 형성합니다.</div><div class=\"lec-gr-item\">is to see (to부정사): 주어(The only way...)에 대한 보충 설명을 하는 보어 역할을 하는 명사적 용법으로, &#39;…하는 것이다&#39;라고 해석됩니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">understand</td><td class=\"m\">이해하다</td></tr><tr><td class=\"w\">fully</td><td class=\"m\">완전히, 충분히</td></tr><tr><td class=\"w\">in use</td><td class=\"m\">사용 중인, 쓰이고 있는</td></tr><tr><td class=\"w\">context</td><td class=\"m\">문맥, 맥락, 상황</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>단어의 진정한 의미를 파악하려면 단순 암기가 아닌 실제 활용을 보아야 한다.</li><li>최대한 다양한 상황(문맥)에서 해당 단어가 쓰이는 경우를 많이 접해야 한다.</li><li>언어는 고정된 정의가 아니라 문맥 속에서 비로소 온전한 의미를 갖는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">We can fully understand the meaning of a word by observing its usage in various contexts, so we should expose ourselves to as many examples as possible.</div>\n              <div class=\"lec-final-sum-ko\">우리는 다양한 맥락에서 단어의 쓰임을 관찰함으로써 그 의미를 완전히 이해할 수 있으므로, 가능한 한 많은 예시를 접해야 한다.</div></div></div>"],"segs":[[{"audio":"./sentence10_audio/1.mp3","hl":null}],[{"audio":"./sentence10_audio/2.mp3","hl":null}],[{"audio":"./sentence10_audio/3.mp3","hl":null},{"audio":"./sentence10_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence10_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence10_audio/6.mp3","hl":null}],[{"audio":"./sentence10_audio/7.mp3","hl":"main"},{"audio":"./sentence10_audio/8.mp3","hl":"meaning"},{"audio":"./sentence10_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence10_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)
