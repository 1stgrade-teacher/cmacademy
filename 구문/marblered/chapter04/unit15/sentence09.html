09ePTg0ZHqOOvI/Wlz7jn/P60wD/P6d/wDPpRz/AJ7f5/r7U3cOmQSBnr/M9uf/AKwpcjrkfmPr/SgA/wA/5/yTk0v+f88f4fSmllHUjnoMjn/P5e9LuXnkdgeR35H88j9KAFopAwPQjqQORzjrjGaCwAye/T3o/wCB/WlwDHv6n9c/4j6GjPsc9Pf8/Tnrnv68UccEnsfT6nBwD/8AW60ZU9xg+/BHP+c96ADrj88Hj/8AXjI+h9xSnof8/wA+PzpoZSMgj8x/jQWUDOR1x1HXOO2f8fagB1FJuGQM9en0/wA/zxS0AFH/ANf1/wA4/wDrYoyPWij+v6/r1AKKTI9fX9Ov5UMcAn0BPvwPSgD/2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Embracing Challenges: Learning to Thrive Amidst Difficulties<small>도전 받아들이기: 어려움 속에서 성장하는 법 배우기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 삶의 어려움을 &#39;비바람(storm)&#39;과 &#39;빗속에서 추는 춤(dancing in the rain)&#39;이라는 비유를 통해 설명하고 있어요. 여기서 &#39;비바람&#39;은 우리가 피할 수 없는 스트레스나 예기치 못한 문제 상황을 뜻하는데, 이를 단순히 견디거나 회피하는 것이 아니라 어떻게 대응하느냐가 중요하다는 철학적인 태도를 담고 있죠. 심리학에서는 이런 능력을 회복탄력성(Resilience)이라고 부르는데, 이는 힘든 일을 겪어도 다시 원래대로 돌아오거나 오히려 더 나은 방향으로 성장하려는 마음의 힘을 의미해요. 결국 이 문장은 우리가 삶의 힘든 순간을 부정적으로만 보지 않고, 그 상황 속에서도 나름의 즐거움과 배움을 찾아내는 태도가 필요하다는 점을 강조하고 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 인식</div><ul><li>삶에서 겪게 되는 힘든 시기를 어떻게 받아들일지 정의한다.</li><li>인생의 고난을 폭풍(storm)에 비유</li><li>단순히 고난이 지나가기만을 기다리는 소극적 태도를 경계</li><li>핵심 키워드: 고난(storm)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02태도 변화</div><ul><li>피할 수 없는 역경 속에서도 삶을 즐기는 법을 배워야 한다.</li><li>폭풍을 피하지 않고 비 속에서 춤을 추는(dancing in the rain) 적극적인 태도</li><li>외부 상황을 통제하기보다 자신의 반응을 선택함</li><li>핵심 키워드: 태도(attitude)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가치관 확립</div><ul><li>진정한 삶의 의미는 역경을 회피하는 것이 아니라 극복하는 과정에 있다.</li><li>고통을 제거하는 것이 아닌, 함께 살아가는 법을 터득함</li><li>삶을 대하는 유연하고 주도적인 자세 강조</li><li>핵심 키워드: 회복력(resilience)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wait</td><td class=\"m\">기다리다</td></tr><tr><td class=\"w\">storm</td><td class=\"m\">폭풍</td></tr><tr><td class=\"w\">pass</td><td class=\"m\">지나가다, 지나다</td></tr><tr><td class=\"w\">learn</td><td class=\"m\">배우다, 익히다</td></tr><tr><td class=\"w\">dance</td><td class=\"m\">춤추다</td></tr><tr><td class=\"w\">rain</td><td class=\"m\">비</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">삶은</span><span class=\"en\"><b>Life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~에 관한 것이 아니다</span><span class=\"en\"><b>isn’t about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기다리는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">waiting for</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">폭풍이</span><span class=\"en\"><b><span class=\"grammar-hl\">the storm</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지나가기를</span><span class=\"en\"><b><span class=\"grammar-hl\">to pass</span>.</b></span></div></div><div class=\"lec-sent-ko\">삶은 폭풍이 지나가길 기다리는 것에 관한 것이 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인생에서 닥쳐오는 고난(storm)이 저절로 끝나기만을 수동적으로 기다리는 태도는 바람직하지 않다는 점을 강조합니다. 여기서 storm은 사전적으로 &#39;폭풍우&#39;를 의미하지만, 여기서는 우리가 살면서 겪는 통제하기 어려운 역경이나 힘든 시기를 비유합니다. 필자는 인생의 수동적인 태도를 경계하기 위해 이 단어를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">waiting for (동명사): 전치사 for의 목적어 역할을 하는 동명사 구조이며, wait은 자동사로 wait+for+O의 패턴을 가짐</div><div class=\"lec-gr-item\">the storm to pass 5형식(SVOC) 구조: wait은 [wait + O + to V] 구조로 목적어가 to부정사(to pass)하는 것을 기다리다는 의미를 나타냄</div><div class=\"lec-gr-item\">to pass (to부정사): 5형식 구조에서 목적보어 역할을 하는 to부정사로, storm(의미상 주어)이 수행하는 동작을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wait</td><td class=\"m\">기다리다</td></tr><tr><td class=\"w\">storm</td><td class=\"m\">폭풍</td></tr><tr><td class=\"w\">pass</td><td class=\"m\">지나가다, 지나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~에 관한 것이다</span><span class=\"en\"><b>It’s about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배우는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">learning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 춤을 출지를</span><span class=\"en\"><b><span class=\"grammar-hl\">how to dance</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빗속에서</span><span class=\"en\"><b>in the rain.</b></span></div></div><div class=\"lec-sent-ko\">그것은 빗속에서 어떻게 춤을 추어야 할지 배우는 것에 관한 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;수동적인 기다림&#39;과 대비되는 &#39;능동적인 수용&#39;을 말합니다. dance는 사전적으로 &#39;춤을 추다&#39;라는 뜻이지만, 여기서는 피할 수 없는 고난 속에서도 긍정적인 마음가짐으로 그 상황을 즐기고 헤쳐 나가는 태도를 의미합니다. 단순히 참고 견디는 것을 넘어, 힘든 상황을 삶의 일부로 받아들이는 능동성을 강조하기 위해 이 비유를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">learning (동명사): 전치사 about의 목적어 역할을 하는 동명사 구조</div><div class=\"lec-gr-item\">how to dance (간접의문문): &#39;의문사+to부정사&#39; 형태의 명사구로, 동사 learn의 목적어 역할을 함</div><div class=\"lec-gr-item\">to dance (to부정사): 간접의문문(how to V) 구조 안에서 사용된 to부정사 형태</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">learn</td><td class=\"m\">배우다, 익히다</td></tr><tr><td class=\"w\">dance</td><td class=\"m\">춤추다</td></tr><tr><td class=\"w\">rain</td><td class=\"m\">비</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인생의 역경을 피하려 하거나 무작정 끝날 때까지 기다리지 마라.</li><li>오히려 힘든 상황 속에서도 자신만의 즐거움과 해결 방법을 찾아내는 능동적인 태도가 중요하다.</li><li>고난은 피해야 할 대상이 아니라, 삶의 과정 속에서 함께 살아가야 할 일부이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Life is not about waiting for hardships to disappear, but about learning how to thrive while facing them.</div>\n              <div class=\"lec-final-sum-ko\">삶은 고난이 사라지기를 기다리는 것이 아니라, 그것을 마주하며 잘 살아가는 법을 배우는 것이다.</div></div></div>"],"segs":[[{"audio":"./sentence09_audio/1.mp3","hl":null}],[{"audio":"./sentence09_audio/2.mp3","hl":null}],[{"audio":"./sentence09_audio/3.mp3","hl":null},{"audio":"./sentence09_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence09_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence09_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence09_audio/7.mp3","hl":null}],[{"audio":"./sentence09_audio/8.mp3","hl":"main"},{"audio":"./sentence09_audio/9.mp3","hl":"meaning"},{"audio":"./sentence09_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence09_audio/11.mp3","hl":"main"},{"audio":"./sentence09_audio/12.mp3","hl":"meaning"},{"audio":"./sentence09_audio/13.mp3","hl":"grammar"}],[{"audio":"./sentence09_audio/14.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Mat
