결과를 미리 알려고 하기보다 첫발을 내딛는 과정이 중요하다.</li><li>눈앞의 과정(first step)에 집중</li><li>전체적인 구조(whole staircase)를 모두 파악할 필요는 없음</li><li>핵심 키워드: 행동(action)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03태도의 변화</div><ul><li>미래에 대한 두려움을 극복하고 현재의 발걸음에 의미를 둔다.</li><li>끝을 알 수 없어도 나아가는 용기</li><li>보이지 않는 목표를 향한 신뢰</li><li>핵심 키워드: 첫걸음(first step)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">faith</td><td class=\"m\">믿음, 신념</td></tr><tr><td class=\"w\">take</td><td class=\"m\">(조치·행동을) 취하다</td></tr><tr><td class=\"w\">step</td><td class=\"m\">걸음, 단계</td></tr><tr><td class=\"w\">even when</td><td class=\"m\">~할 때조차도, 비록 ~할 때라도</td></tr><tr><td class=\"w\">whole</td><td class=\"m\">전체의, 모든</td></tr><tr><td class=\"w\">staircase</td><td class=\"m\">계단</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">신뢰는</span><span class=\"en\"><b>Faith</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~하는 것이다</span><span class=\"en\"><b>is <span class=\"grammar-hl\">taking</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">첫발을 내딛는</span><span class=\"en\"><b>the first step</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~할 때조차도</span><span class=\"en\"><b><span class=\"grammar-hl\">even when</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 보지 못하는</span><span class=\"en\"><b><span class=\"grammar-hl\">you don’t see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전체의 계단을</span><span class=\"en\"><b><span class=\"grammar-hl\">the whole staircase</span>.</b></span></div></div><div class=\"lec-sent-ko\">신뢰는 당신이 전체의 계단을 보지 못하는 때조차도 첫발을 내딛는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 &#39;믿음&#39;이라는 추상적인 개념을 &#39;계단을 오르는 행위&#39;라는 구체적인 상황에 빗대어 설명하고 있습니다. 여기서 staircase(계단)는 사전적으로 &#39;건물의 층과 층 사이를 연결하는 계단&#39;을 의미하지만, 여기서는 &#39;우리가 가고자 하는 목표를 향한 긴 과정이나 미래의 전체적인 그림&#39;을 상징합니다. 필자는 우리가 인생에서 어디로 가는지, 결과가 어떻게 될지 알 수 없는 불안한 상황을 &#39;계단 전체가 보이지 않는 상태&#39;로 표현하기 위해 이 낱말을 골랐습니다. 또한 taking the first step은 단순히 발을 떼는 행위가 아니라, 확신이 없는 상태에서도 변화를 시작하는 &#39;용기 있는 결단&#39;을 강조하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taking (동명사): 문장에서 주어 &#39;Faith&#39;에 대한 보어 역할을 하고 있으며, &#39;~하는 것&#39;으로 해석되는 명사적 기능의 구조임.</div><div class=\"lec-gr-item\">even when you don’t see the whole staircase (현재분사(분사구문)): &#39;when you don’t see...&#39; 형태로, 부사적 기능을 수행하며 의미적으로는 &#39;비록 ~할 때조차도&#39;라는 시간의 부사절임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">faith</td><td class=\"m\">믿음, 신념</td></tr><tr><td class=\"w\">step</td><td class=\"m\">걸음, 단계</td></tr><tr><td class=\"w\">even when</td><td class=\"m\">~할 때조차도, 비록 ~할 때라도</td></tr><tr><td class=\"w\">whole</td><td class=\"m\">전체의, 모든</td></tr><tr><td class=\"w\">staircase</td><td class=\"m\">계단</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>믿음이란 미래가 불확실하더라도 일단 행동을 시작하는 것이다.</li><li>결과를 완벽히 알 수 없을 때 실천하는 용기가 진정한 믿음의 본질이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Faith requires individuals to take the initial step, even though the entire process remains unseen.</div>\n              <div class=\"lec-final-sum-ko\">믿음은 비록 전체 과정이 보이지 않더라도, 개인이 첫걸음을 내딛도록 요구한다.</div></div></div>"],"segs":[[{"audio":"./sentence08_audio/1.mp3","hl":null}],[{"audio":"./sentence08_audio/2.mp3","hl":null}],[{"audio":"./sentence08_audio/3.mp3","hl":null},{"audio":"./sentence0
