td><td class=\"m\">인기 있는, 대중적인</td></tr><tr><td class=\"w\">cyber crime</td><td class=\"m\">사이버 범죄</td></tr><tr><td class=\"w\">hack</td><td class=\"m\">해킹하다</td></tr><tr><td class=\"w\">personal</td><td class=\"m\">개인의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">account</td><td class=\"m\">계정</td></tr><tr><td class=\"w\">spread</td><td class=\"m\">퍼뜨리다, 유포하다</td></tr><tr><td class=\"w\">computer virus</td><td class=\"m\">컴퓨터 바이러스</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 일반적인 사이버 범죄들은</span><span class=\"en\"><b>The most popular cyber crimes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이다</span><span class=\"en\"><b>are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해킹하는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">hacking</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 사람의 개인 계정을</span><span class=\"en\"><b>a person’s personal account</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 유포하는 것</span><span class=\"en\"><b>and <span class=\"grammar-hl\">spreading</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">컴퓨터 바이러스를</span><span class=\"en\"><b>a computer virus.</b></span></div></div><div class=\"lec-sent-ko\">가장 일반적인 사이버 범죄들은 개인 계좌를 해킹하는 것 그리고 컴퓨터 바이러스를 유포하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 사이버 범죄 중에서도 가장 흔히 발생하는 유형 두 가지를 열거하고 있습니다. 여기서 popular는 사전적으로는 &#39;인기 있는&#39;이라는 뜻이지만, 여기서는 사람들이 좋아한다는 의미가 아니라 사이버 범죄 세계에서 &#39;가장 빈번하게 발생하거나 널리 퍼져 있는&#39; 유형을 지칭합니다. 필자는 일반 대중이 흔히 경험하거나 들어본 범죄를 예시로 들어, 독자가 사이버 범죄를 더 쉽게 이해하도록 이 표현을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hacking (동명사): 문장에서 주격 보어 역할을 하며 &#39;-하는 것&#39;이라는 명사적 의미로 쓰임</div><div class=\"lec-gr-item\">spreading (동명사): 문장에서 주격 보어 역할을 하며 앞에 나온 hacking과 병렬 구조를 이루고 있음</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">popular</td><td class=\"m\">인기 있는, 대중적인</td></tr><tr><td class=\"w\">cyber crime</td><td class=\"m\">사이버 범죄</td></tr><tr><td class=\"w\">hack</td><td class=\"m\">해킹하다</td></tr><tr><td class=\"w\">personal</td><td class=\"m\">개인의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">account</td><td class=\"m\">계정</td></tr><tr><td class=\"w\">spread</td><td class=\"m\">퍼뜨리다, 유포하다</td></tr><tr><td class=\"w\">computer virus</td><td class=\"m\">컴퓨터 바이러스</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사이버 범죄 중 가장 흔하게 일어나는 유형은 개인 계정 해킹과 바이러스 유포이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Cyber criminals frequently target individuals by hacking personal accounts, and they often cause damage by spreading computer viruses.</div>\n              <div class=\"lec-final-sum-ko\">사이버 범죄자들은 개인 계정을 해킹하여 개인을 공격하며, 컴퓨터 바이러스를 유포함으로써 피해를 입힌다.</div></div></div>"],"segs":[[{"audio":"./sentence02_audio/1.mp3","hl":null}],[{"audio":"./sentence02_audio/2.mp3","hl":null}],[{"audio":"./sentence02_audio/3.mp3","hl":null},{"audio":"./sentence02_audio/4.mp3","hl":"stage-0"}],[{"audio":"./sentence02_audio/5.mp3","hl":null}],[{"audio":"./sentence02_audio/6.mp3","hl":"main"},{"audio":"./sentence02_audio/7.mp3","hl":"meaning"},{"audio":"./sentence02_audio/8.mp3","hl":"grammar"}],[{"audio":"./sentence02_audio/9.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getE
