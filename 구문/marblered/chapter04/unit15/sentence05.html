community survival)과 같다고 이해하면 지문을 훨씬 쉽게 읽을 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01질병과 공동체의 관계</div><ul><li>질병의 발생부터 치료까지의 모든 과정은 원시 사회 구성원 전체에게 매우 중요한 문제이다.</li><li>질병(disease)은 개인을 넘어 공동체 전체의 사안임</li><li>질병의 발생 가능성이 있는 모든 행동에 주목함</li><li>핵심 키워드: 원시 공동체(primitive community), 질병(disease)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02회복의 중요성</div><ul><li>병을 앓는 것뿐만 아니라, 병으로부터 회복하는 과정 역시 사회적으로 큰 의미를 지닌다.</li><li>질병으로부터의 회복(recovery)은 공동체의 생존과 직결됨</li><li>건강 상태를 유지하는 것이 공동체의 주요 관심사임</li><li>핵심 키워드: 회복(recovery), 필수적 관심사(vital concern)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">disease</td><td class=\"m\">질병</td></tr><tr><td class=\"w\">action</td><td class=\"m\">행동</td></tr><tr><td class=\"w\">produce</td><td class=\"m\">야기하다, 유발하다</td></tr><tr><td class=\"w\">recovery</td><td class=\"m\">회복</td></tr><tr><td class=\"w\">vital</td><td class=\"m\">매우 중요한, 필수적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">concern</td><td class=\"m\">관심사, 걱정</td></tr><tr><td class=\"w\">whole</td><td class=\"m\">전체의</td></tr><tr><td class=\"w\">primitive</td><td class=\"m\">원시의</td></tr><tr><td class=\"w\">community</td><td class=\"m\">공동체, 사회</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">질병은,</span><span class=\"en\"><b>Disease,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행동은</span><span class=\"en\"><b>action</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">질병을 유발할 수도 있는,</span><span class=\"en\"><b><span class=\"grammar-hl\">that might produce disease</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 질병으로부터의 회복은</span><span class=\"en\"><b>and recovery from disease</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중대한 관심사이다</span><span class=\"en\"><b>are of vital concern</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">원시 공동체 전체에게.</span><span class=\"en\"><b>to the whole primitive community.</b></span></div></div><div class=\"lec-sent-ko\">질병, 질병을 유발할 수도 있는 행동, 그리고 질병으로부터의 회복은 원시 공동체 전체에게 중대한 관심사이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 원시 사회에서 건강과 관련된 요소들이 공동체 구성원 모두에게 생존과 직결된 문제임을 강조합니다. 여기서 vital은 사전적으로 &#39;생명의&#39;라는 뜻인데, 여기서는 단순히 살아있다는 의미를 넘어 &#39;생사를 결정할 만큼 필수적인&#39;이라는 뜻으로 쓰였습니다. 공동체의 안전이 이 문제에 달려있다는 긴박함을 전달하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that might produce disease (관계대명사): that절이 선행사 action을 수식하는 구조이며, 절 내에서 that은 주어 역할을 합니다. &#39;~하는 action&#39;으로 해석합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">disease</td><td class=\"m\">질병</td></tr><tr><td class=\"w\">action</td><td class=\"m\">행동</td></tr><tr><td class=\"w\">produce</td><td class=\"m\">야기하다, 유발하다</td></tr><tr><td class=\"w\">recovery</td><td class=\"m\">회복</td></tr><tr><td class=\"w\">vital</td><td class=\"m\">매우 중요한, 필수적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">concern</td><td class=\"m\">관심사, 걱정</td></tr><tr><td class=\"w\">whole</td><td class=\"m\">전체의</td></tr><tr><td class=\"w\">primitive</td><td class=\"m\">원시의</td></tr><tr><td class=\"w\">community</td><td class=\"m\">공동체, 사회</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>원시 사회에서 질병, 질병의 원인, 치료는 공동체 전체의 생존과 직결되는 매우 중요한 문제입니다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Primitive communities view disease and recovery as vital issues because these factors directly impact the well-being of the whole group.</div>\n              <div class=\"lec-final-sum-ko\">원시 공동체는 질병과 회복이 집단 전체의 안녕에 직접적인 영향을 주기 때문에 이를 매우 중요한 문제로 여긴다.</div></div></div>"],"segs":[[{"audio":"./sentence05_audio/1.mp3","hl":null}],[{"audio":"./sentence05_audio/2.mp3","hl":null}],[{"audio":"./sentence05_audio/3.mp3","hl":null},{"audio":"./sentence05_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence05_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence05_audio/6.mp3","hl":null}],[{"audio":"./sentence05_audio/7.mp3","hl":"main"},{"audio":"./sentence05_audio/8.mp3","hl":"meaning"},{"audio":"./sentence05_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence05_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};r
