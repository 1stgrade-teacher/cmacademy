drXdvK+q0t5IaQfvE8gE/hzk/X68H0oyT06Y9Mc+2T3BOM5APrUhR8cq2MjHynOc9OmcdOOnPPWjY/9xhjP8LdsDnjJ+mCPTqMyoxv72uul9uj2fX3tvW5ShFb69r+X57q7/Aaq54xwWweRzxk85zk8ccZyM9KmHK4QdBgZOQT0xye3Q5PHPXBAcsbnpGx78KecnpjvtPTv6dOZooJWeNVjkJZ1AwpPLMMYwOeTjqQTgY5Ba7K6vZONmrv/AAvr2fV6NfK448ybejirrskuVaWV9bL87X1P/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Knowing vs. Doing: The Challenge of Applying Knowledge<small>지식과 실천: 지식 적용의 어려움</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 학교에서 배운 수학 공식이나 역사적 사실들을 실생활에서 어떻게 써먹어야 할지 막막했던 적 있나요? 이 글은 바로 그런 지식의 활용(Application of knowledge) 문제에 대해 다루고 있어요. 보통 교과서는 &#39;무엇(What)&#39;을 아는 것에 집중하지만, 정작 중요한 것은 그 지식을 언제(When) 써야 하는지 판단하는 상황적 지혜(Contextual wisdom)예요. 마치 요리법을 다 외웠더라도 재료가 신선한지, 손님이 누구인지에 따라 요리 방식이 달라져야 하는 것과 같죠. 그래서 지식을 단순히 머릿속에 넣는 것을 넘어, 적재적소에 활용할 줄 아는 실전적 지능(Practical intelligence)이 왜 중요한지 생각하며 글을 읽어보면 좋겠어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01교과서의 한계</div><ul><li>학교 교과서는 이론적인 지식을 가르치지만, 그것을 언제 사용해야 할지는 알려주지 않습니다.</li><li>이론과 실제의 차이(theory vs. practice)</li><li>교과서가 제공하는 정보의 제한적인 측면</li><li>핵심 키워드: 교과서(textbooks), 지식(knowledge)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02지식 적용의 중요성</div><ul><li>진정한 배움은 알고 있는 지식을 상황에 맞게 활용하는 능력에서 완성됩니다.</li><li>배운 내용을 활용할 정확한 타이밍 파악</li><li>실전에서의 지식 응용력(application)</li><li>핵심 키워드: 적용(apply), 시점(when)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">textbook</td><td class=\"m\">교과서</td></tr><tr><td class=\"w\">teach</td><td class=\"m\">가르치다</td></tr><tr><td class=\"w\">apply</td><td class=\"m\">적용하다</td></tr><tr><td class=\"w\">knowledge</td><td class=\"m\">지식</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">교과서가</span><span class=\"en\"><b><span class=\"grammar-hl\">What the textbooks</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에게 가르쳐 주지 않는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">do not teach you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">언제 적용할지</span><span class=\"en\"><b><span class=\"grammar-hl\">when to apply</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 지식을</span><span class=\"en\"><b>the knowledge.</b></span></div></div><div class=\"lec-sent-ko\">교과서가 당신에게 가르쳐 주지 못하는 것은 그 지식을 언제 적용하느냐이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞부분의 What은 &#39;~하는 것&#39;이라는 뜻의 관계대명사절로, 문장 전체의 주어 역할을 합니다. 필자는 지식을 배우는 것과 그 지식을 실제로 활용하는 타이밍이 다르다는 점을 강조합니다. 여기서 apply는 사전적으로 &#39;적용하다, 지원하다&#39;라는 뜻이지만, 여기서는 배운 지식을 현실 상황에 &#39;실제로 써먹다&#39;라는 의미로 쓰였습니다. 단순히 지식을 쌓는 것(학습)과 그 지식이 필요한 순간을 포착하는 능력(지혜)을 대비하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What the textbooks do not teach you (관계대명사): what은 &#39;the thing(s) that&#39;의 의미를 가진 관계대명사로, 뒤에 &#39;the textbooks do not teach you(주어+동사+간접목적어)&#39;라는 불완전한 문장이 이어져 전체가 문장의 주어 역할을 함.</div><div class=\"lec-gr-item\">do (대동사): 앞의 일반동사 teach를 대신하여 반복을 피하는 대동사임. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.</div><div class=\"lec-gr-item\">when to apply (to부정사): 의문사 + to부정사 구조로, 명사적 용법으로 쓰여 보어 역할을 함. &#39;언제 ~해야 할지&#39;라는 의미를 가짐.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">textbook</td><td class=\"m\">교과서</td></tr><tr><td class=\"w\">teach</td><td class=\"m\">가르치다</td></tr><tr><td class=\"w\">apply</td><td class=\"m\">적용하다</td></tr><tr><td class=\"w\">knowledge</td><td class=\"m\">지식</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>교과서는 지식의 내용은 가르치지만, 그것을 언제 써야 하는지까지는 알려주지 않는다.</li><li>지식 그 자체보다 중요한 것은 지식을 적절한 때에 활용하는 통찰력이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Textbooks provide a wealth of information, but they fail to teach the timing for practical application.</div>\n              <div class=\"lec-final-sum-ko\">교과서는 풍부한 정보를 제공하지만, 그것을 실질적으로 적용할 시기는 가르쳐 주지 않는다.</div></div></div>"],"segs":[[{"audio":"./sentence11_audio/1.mp3","hl":null}],[{"audio":"./sentence11_audio/2.mp3","hl":null}],[{"audio":"./sentence11_audio/3.mp3","hl":null},{"audio":"./sentence11_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence11_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence11_audio/6.mp3","hl":null}],[{"audio":"./sentence11_audio/7.mp3","hl":"main"},{"audio":"./sentence11_audio/8.mp3","hl":"meaning"},{"audio":"./sentence11_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence11_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingC
