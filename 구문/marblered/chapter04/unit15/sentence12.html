><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="1.8">1.8x</option><option value="2">2.0x</option></select><button onclick="go(-1)">◀</button><button class="pl" id="pp" onclick="toggle()">▶ 재생</button><button onclick="go(1)">▶</button></div></div><script>var D={"slides":["<div class=\"lec-cover-title lec-cover-center\">The Essential Role of Social Networks in Happiness<small>행복을 위한 사회적 네트워크의 필수적 역할</small></div>","<div class=\"lec-cover-title\">The Essential Role of Social Networks in Happiness<small>행복을 위한 사회적 네트워크의 필수적 역할</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">행복한 삶을 결정짓는 가장 중요한 요소인 사회적 관계망(Social network)이란, 우리가 살아가면서 만나는 가족, 친구, 직장 동료 등 서로 연결된 사람들의 집합을 의미해요. 심리학에서는 이를 통해 얻는 정서적, 물질적 도움을 사회적 지지(Social support)라고 부르는데, 이는 마치 우리가 힘든 상황에 처했을 때 기댈 수 있는 든든한 안전망과 같은 역할을 합니다. 실제로 많은 연구 결과에 따르면, 주변에 마음을 터놓을 수 있는 사람이 많은 사람일수록 스트레스에 대한 저항력이 높고 전반적인 삶의 만족도가 훨씬 큰 것으로 나타났어요. 즉, 우리가 흔히 말하는 &#39;인맥&#39;은 단순히 명함을 주고받는 관계를 넘어, 정신적인 안정감과 행복을 유지하기 위한 필수적인 토대라고 이해하면 쉬워요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01행복의 필수 조건</div><ul><li>행복한 삶을 유지하는 데 가장 중요한 요소는 신뢰할 수 있는 관계망입니다.</li><li>행복한 삶(happy life)을 위한 가장 중요한 요인</li><li>의지할 수 있는 사람들의 모임(social network)의 필요성</li><li>핵심 키워드: 사회적 관계망(social network)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02관계의 역할</div><ul><li>주변 사람들과 형성한 사회적 관계망은 삶을 지탱하는 기반이 됩니다.</li><li>힘들 때 기댈 수 있는 대상의 중요성</li><li>정서적 안정감과 삶의 질 향상</li><li>핵심 키워드: 의존(depend on)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr><tr><td class=\"w\">factor</td><td class=\"m\">요소, 요인</td></tr><tr><td class=\"w\">social</td><td class=\"m\">사회의, 사회적인</td></tr><tr><td class=\"w\">network</td><td class=\"m\">네트워크, 관계망</td></tr><tr><td class=\"w\">depend on</td><td class=\"m\">~에 의지하다, 신뢰하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 중요한 요소는</span><span class=\"en\"><b>The most important factor</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행복한 삶 속에서의</span><span class=\"en\"><b>in a happy life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갖는 것이다</span><span class=\"en\"><b>is <span class=\"grammar-hl\">having</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 사회적 관계망을</span><span class=\"en\"><b><span class=\"grammar-hl\">a good social network</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 의지할 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that you can depend on</span>.</b></span></div></div><div class=\"lec-sent-ko\">행복한 삶의 가장 중요한 요소는 당신이 의지할 수 있는 좋은 사회적 관계를 갖는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 행복한 삶의 핵심 조건이 무엇인지 정의하며 글을 시작합니다. 여기서 factor는 사전적으로 &#39;요인&#39;이지만, 여기서는 우리가 추구하는 행복이라는 결과를 만들어내기 위해 꼭 필요한 &#39;재료&#39;나 &#39;필수 조건&#39;이라는 어감으로 쓰였습니다. 또한, depend on은 &#39;의지하다&#39;라는 뜻인데, 단순히 기대는 것을 넘어 서로 어려울 때 도와주고 정서적으로 신뢰할 수 있는 깊은 관계를 맺고 있다는 점을 강조하기 위해 이 표현을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">having (동명사): 보어 역할을 하며 &#39;-하는 것&#39;이라는 의미로 해석된다. 문장 전체의 주어인 &#39;The most important factor&#39;를 보충 설명하는 명사적 역할을 수행한다.</div><div class=\"lec-gr-item\">a good social network that you can depend on (관계대명사): that은 선행사 &#39;a good social network&#39;를 수식하며, 관계대명사절 &#39;you can depend on&#39; 내부에서 전치사 on의 목적어 역할을 하는 목적격 관계대명사이다.</div><div class=\"lec-gr-item\">depend on (관용표현): &#39;~에 의존하다&#39;라는 의미의 숙어로, 관계대명사절 내부에서 &#39;you can depend on (a good social network)&#39;의 구조를 이룬다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr><tr><td class=\"w\">factor</td><td class=\"m\">요소, 요인</td></tr><tr><td class=\"w\">social</td><td class=\"m\">사회의, 사회적인</td></tr><tr><td class=\"w\">network</td><td class=\"m\">네트워크, 관계망</td></tr><tr><td class=\"w\">depend on</td><td class=\"m\">~에 의지하다, 신뢰하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>행복한 삶을 결정짓는 핵심은 신뢰할 수 있는 좋은 인간관계이다.</li><li>외부적 조건보다 주변 사람들과의 튼튼한 사회적 연대가 개인의 행복에 가장 큰 영향을 미친다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Social connections serve as the most crucial element, as they provide the support necessary for a happy life.</div>\n              <div class=\"lec-final-sum-ko\">사회적 관계는 행복한 삶에 필요한 지원을 제공하기 때문에, 가장 중요한 요소로 작용한다.</div></div></div>"],"segs":[[{"audio":"./sentence12_audio/1.mp3","hl":null}],[{"audio":"./sentence12_audio/2.mp3","hl":null}],[{"audio":"./sentence12_audio/3.mp3","hl":null},{"audio":"./sentence12_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence12_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence12_audio/6.mp3","hl":null}],[{"audio":"./sentence12_audio/7.mp3","hl":"main"},{"audio":"./sentence12_audio/8.mp3","hl":"meaning"},{"audio":"./sentence12_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence12_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("le uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
