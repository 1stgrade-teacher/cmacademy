 이해할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01지식 습득의 본질</div><ul><li>세상에 관한 진정한 지식은 책상 앞이 아닌 실제 현장에서만 얻을 수 있다.</li><li>지식(knowledge)은 이론이 아닌 실전에서 습득함</li><li>폐쇄적인 공간인 &#39;골방(closet)&#39;의 한계 강조</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02경험의 중요성</div><ul><li>직접 세상을 마주하고 겪는 경험이 학습의 핵심이다.</li><li>세상(world) 속으로 직접 나가는 능동적 태도 필요</li><li>단순히 책을 읽는 것만으로는 부족함</li><li>핵심 키워드: 경험(experience)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실천적 학습</div><ul><li>지식을 내 것으로 만들려면 현실과 부딪히는 과정이 필수적이다.</li><li>이론적 공부(study)와 실질적 세상 이해의 차이</li><li>배움을 완성하는 장소는 &#39;세상(the world)&#39; 그 자체임</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">knowledge</td><td class=\"m\">지식</td></tr><tr><td class=\"w\">acquire</td><td class=\"m\">얻다, 습득하다</td></tr><tr><td class=\"w\">closet</td><td class=\"m\">벽장, 작은 방 (여기서는 세상과 단절된 좁은 공간을 의미)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">세상에 대한 지식은</span><span class=\"en\"><b>Knowledge of the world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오로지 획득될 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is only to be acquired</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상 속에서,</span><span class=\"en\"><b>in the world,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 ~이 아니다</span><span class=\"en\"><b>and not</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">벽장 속에서</span><span class=\"en\"><b>in a closet.</b></span></div></div><div class=\"lec-sent-ko\">세상의 지식은 벽장 속에서가 아니라 오로지 세상 속에서 획득될 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 closet은 사전적으로 &#39;벽장&#39;이나 &#39;작은 방&#39;을 뜻하지만, 여기서는 세상과 단절된 채 혼자 공부하는 폐쇄적인 공간을 의미합니다. 필자는 책상 앞에만 앉아 있는 행위를 closet이라는 좁은 공간에 빗대어 표현함으로써, 실제 경험이 없는 이론 공부의 한계를 강조하고 직접 부딪히며 배우는 현장 학습의 중요성을 효과적으로 전달하고 있습니다. 이 문장은 이론과 실천을 대비시키며, 지식은 삶의 현장에서 체득해야 한다는 글의 핵심 주제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is only to be acquired (수동태): be동사(is)+to부정사(to be acquired) 구조. acquire는 타동사인데 목적어가 없어서 수동구조(be+p.p.)인 to be acquired 형태로 쓴다. 기본구조: acquire O (O를 얻다). 또한 be+to부정사(to be acquired)는 예정/의무/가능 등의 의미를 나타내는 be to 용법(가능/의무)으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">knowledge</td><td class=\"m\">지식</td></tr><tr><td class=\"w\">acquire</td><td class=\"m\">얻다, 습득하다</td></tr><tr><td class=\"w\">closet</td><td class=\"m\">벽장, 작은 방 (여기서는 세상과 단절된 좁은 공간을 의미)</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>세상에 관한 진정한 지식은 책상 앞이 아닌 실제 세상 속에서 경험을 통해 얻을 수 있다.</li><li>이론적인 학습만으로는 세상의 복잡한 이치를 깨닫기에 부족하다.</li><li>직접 경험하며 배우는 것이 지식을 습득하는 가장 올바른 방법이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">True knowledge is gained through direct interaction with the world, and it cannot be acquired by studying in isolation.</div>\n              <div class=\"lec-final-sum-ko\">진정한 지식은 세상과 직접 교류하며 얻어지는 것이며, 혼자 공부하는 것만으로는 얻을 수 없다.</div></div></div>"],"segs":[[{"audio":"./sentence03_audio/1.mp3","hl":null}],[{"audio":"./sentence03_audio/2.mp3","hl":null}],[{"audio":"./sentence03_audio/3.mp3","hl":null},{"audio":"./sentence03_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence03_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence03_audio/6.mp3","h
