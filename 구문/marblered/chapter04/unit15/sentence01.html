tivation)가 극대화되면서 일 자체가 놀이처럼 즐거워지는 현상을 경험하게 되죠. 과거에는 노동과 여가를 엄격히 구분했지만, 오늘날에는 창의적인 성과를 내기 위해 일상과 업무의 경계를 허무는 것이 자기 계발의 핵심 전략으로 주목받고 있답니다. 결국 이 지문은 단순히 일을 열심히 하는 단계를 넘어, 삶의 질을 높이기 위해 일과 삶의 통합(Work-Life Integration)을 지향하는 태도가 가장 높은 차원의 성취라는 점을 강조하고 있어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01궁극적인 목표</div><ul><li>최고의 성취란 일과 놀이를 명확히 구분하지 않는 상태를 의미한다.</li><li>일(work)과 놀이(play)의 이분법적 사고 지양</li><li>경계(line)를 흐릿하게 만드는 것이 중요함</li><li>핵심 키워드: 성취(accomplishment), 경계(line)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02삶의 태도 변화</div><ul><li>자신이 하는 일 자체를 놀이처럼 즐길 수 있는 경지에 이르는 것을 강조한다.</li><li>업무를 의무가 아닌 즐거움으로 인식</li><li>높은 수준의 몰입과 만족감 추구</li><li>핵심 키워드: 태도(attitude), 몰입(immersion)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가치 창출</div><ul><li>두 영역의 통합은 인간의 삶을 더욱 풍요롭고 가치 있게 만든다.</li><li>일과 놀이가 융합될 때 나타나는 효율성</li><li>삶의 질(quality of life) 개선을 위한 전략</li><li>핵심 키워드: 통합(integration), 효율성(efficiency)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">supreme</td><td class=\"m\">최고의, 최상의</td></tr><tr><td class=\"w\">accomplishment</td><td class=\"m\">업적, 성취</td></tr><tr><td class=\"w\">blur</td><td class=\"m\">흐릿하게 만들다, 모호하게 하다</td></tr><tr><td class=\"w\">line</td><td class=\"m\">경계, 선</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">최고의 성취는</span><span class=\"en\"><b>The supreme accomplishment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~이다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흐릿하게 만드는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">to blur</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 경계를</span><span class=\"en\"><b>the line</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일과 놀이 사이의</span><span class=\"en\"><b>between work and play.</b></span></div></div><div class=\"lec-sent-ko\">최고의 성취는 일과 놀이 사이의 경계를 흐릿하게 만드는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 삶에서 가장 가치 있는 성공이 무엇인지 정의하고 있습니다. 여기서 supreme은 사전적으로는 &#39;최고의&#39;라는 뜻이지만, 여기서는 단순히 &#39;높은&#39; 정도가 아니라 &#39;인생의 목표로 삼을 만한 가장 궁극적인&#39;이라는 의미를 강조하기 위해 선택되었습니다. 또한 blur는 사전적으로는 &#39;흐릿하게 하다&#39;이지만, 여기서는 일과 놀이를 억지로 구분 짓던 마음의 장벽을 허물어 두 영역이 조화롭게 섞이게 한다는 뜻입니다. 필자는 일과 놀이를 별개의 것으로 보는 통념을 깨고, 하나처럼 즐겁게 몰입하는 상태야말로 인생의 정점이라는 점을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to blur (to부정사): 문장에서 주격 보어(C) 역할을 하는 명사적 용법의 to부정사 구조입니다. 주어인 &#39;The supreme accomplishment&#39;의 내용을 구체적으로 설명하고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">supreme</td><td class=\"m\">최고의, 최상의</td></tr><tr><td class=\"w\">accomplishment</td><td class=\"m\">업적, 성취</td></tr><tr><td class=\"w\">blur</td><td class=\"m\">흐릿하게 만들다, 모호하게 하다</td></tr><tr><td class=\"w\">line</td><td class=\"m\">경계, 선</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인생에서 가장 위대한 성취는 일과 놀이 사이의 명확한 구분을 없애는 것이다.</li><li>일과 놀이를 분리하지 않고 즐거움 속에서 조화를 찾을 때 비로소 진정한 성취가 이루어진다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">True success is achieved by removing the boundary between work and play, so that professional tasks become as engaging as personal interests.</div>\n              <div class=\"lec-final-sum-ko\">진정한 성공은 업무와 여가의 경계를 없앰으로써 달성되며, 이를 통해 전문적인 과업이 개인적인 취미만큼 흥미롭게 된다.</div></div></div>"],"segs":[[{"audio":"./sentence01_audio/1.mp3","hl":null}],[{"audio":"./sentence01_audio/2.mp3","hl":null}],[{"audio":"./sentence01_audio/3.mp3","hl":null},{"audio":"./sentence01_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence01_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence01_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence01_audio/7.mp3","hl":null}],[{"audio":"./sentence01_audio/8.mp3","hl":"main"},{"audio":"./sentence01_audio/9.mp3","hl":"meaning"},{"audio":"./sentence01_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence01_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr
