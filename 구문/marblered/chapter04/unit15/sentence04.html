ortance)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02구성원의 심리적 욕구</div><ul><li>근로자는 단순히 일을 하는 것을 넘어, 자신이 인정받고 있다는 확인을 원한다.</li><li>존재의 가치를 인정받고자 하는 심리적 욕구</li><li>조직 내에서 환영받고 있다는 인식의 중요성</li><li>핵심 키워드: 인정(recognition)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perspective</td><td class=\"m\">관점</td></tr><tr><td class=\"w\">individual</td><td class=\"m\">개인의</td></tr><tr><td class=\"w\">working person</td><td class=\"m\">직장인, 일하는 사람</td></tr><tr><td class=\"w\">key</td><td class=\"m\">핵심, 비결</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">workplace</td><td class=\"m\">직장, 일터</td></tr><tr><td class=\"w\">want</td><td class=\"m\">필요로 하다, 원하다 (여기서는 수동태 형태로 &#39;필요하다고 느껴지는&#39;)</td></tr><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">관점에서</span><span class=\"en\"><b>From the perspective</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">근로자 개인의</span><span class=\"en\"><b>of the individual <span class=\"grammar-hl\">working person</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">핵심은</span><span class=\"en\"><b>the key</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훌륭한 직장을 향한</span><span class=\"en\"><b>to a great workplace</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">느끼는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is feeling</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">필요로 하고 중요하다고</span><span class=\"en\"><b><span class=\"grammar-hl\">wanted</span> and important.</b></span></div></div><div class=\"lec-sent-ko\">근로자 개인의 관점에서 훌륭한 직장의 비결은 필요로 하고 중요하다고 느끼는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 직장에서 개인이 느끼는 만족감의 본질을 설명하는 도입 문장입니다. 여기서 key는 사전적으로는 &#39;열쇠&#39;라는 뜻이지만, 여기서는 어떤 결과를 얻기 위해 가장 중요한 &#39;핵심 요소&#39;를 의미합니다. 필자는 좋은 직장의 조건이 복잡한 복지나 연봉보다 심리적인 존중감에 있다는 점을 강조하기 위해 이 단어를 선택했습니다. 또한 wanted는 사전적으로 &#39;원해지는&#39;이라는 수동적 의미지만, 직장인에게는 &#39;동료들에게 꼭 필요한 존재로 대우받는다&#39;는 긍정적인 소속감을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">working person (현재분사): working이 person을 수식(= &#39;일하고 있는, 직장에 다니는&#39;이라는 동작/상태를 나타내는 형용사적 기능)하는 구조입니다.</div><div class=\"lec-gr-item\">is feeling (현재진행): be동사(is) + -ing(feeling)의 구조로 &#39;주어(the key)가 ~하는 중이다&#39;라는 상태를 나타냅니다.</div><div class=\"lec-gr-item\">feeling wanted and important (동명사): feeling이 주격 보어(SC) 역할을 하며, &#39;~하는 것&#39;이라는 명사적 의미로 쓰였습니다.</div><div class=\"lec-gr-item\">wanted (과거분사): &#39;want(원하다)&#39;는 타동사인데 뒤에 목적어가 없어서 형용사처럼 보어 자리에 쓰여 수동의 의미(= &#39;사람들에게 필요한, 환영받는&#39;)를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perspective</td><td class=\"m\">관점</td></tr><tr><td class=\"w\">individual</td><td class=\"m\">개인의</td></tr><tr><td class=\"w\">working person</td><td class=\"m\">직장인, 일하는 사람</td></tr><tr><td class=\"w\">key</td><td class=\"m\">핵심, 비결</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">workplace</td><td class=\"m\">직장, 일터</td></tr><tr><td class=\"w\">want</td><td class=\"m\">필요로 하다, 원하다 (여기서는 수동태 형태로 &#39;필요하다고 느껴지는&#39;)</td></tr><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>직장에서 일하는 개개인에게 가장 중요한 것은 보상이 아닌 존중이다.</li><li>훌륭한 직장은 직원들이 자신이 이 조직에서 필요한 존재이며 중요한 사람이라는 느낌을 받게 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Employees feel satisfied when they are treated as important members, and this feeling is the core element of a great workplace.</div>\n              <div class=\"lec-final-sum-ko\">직원들은 자신이 중요한 구성원으로 대우받을 때 만족감을 느끼며, 이러한 감정은 훌륭한 직장을 만드는 핵심 요소이다.</div></div></div>"],"segs":[[{"audio":"./sentence04_audio/1.mp3","hl":null}],[{"audio":"./sentence04_audio/2.mp3","hl":null}],[{"audio":"./sentence04_audio/3.mp3","hl":null},{"audio":"./sentence04_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence04_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence04_audio/6.mp3","hl":null}],[{"audio":"./sentence04_audio/7.mp3","hl":"main"},{"audio":"./sentence04_audio/8.mp3","hl":"meaning"},{"audio":"./sentence04_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence04_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({bloc
