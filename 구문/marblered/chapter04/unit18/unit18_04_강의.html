s=\"lec-stage-head\">01상황 인식</div><ul><li>은행의 많은 채무자들이 현재 매우 어려운 경제적 상황에 처해 있습니다.</li><li>채무자(debtors)들이 겪는 문제</li><li>은행(bank)과 관련된 재정적 문제</li><li>핵심 키워드: 재정적 위치(financial position)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02현실 직면</div><ul><li>채무자들은 스스로가 심각한 상태에 빠졌음을 깨닫게 되었습니다.</li><li>예상치 못한 어려움에 직면함(find themselves caught)</li><li>심각한(serious) 수준의 경제적 위기</li><li>핵심 키워드: 채무자(debtors)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">debtor</td><td class=\"m\">채무자</td></tr><tr><td class=\"w\">bank</td><td class=\"m\">은행</td></tr><tr><td class=\"w\">find</td><td class=\"m\">(~한 상태임을) 알게 되다, 발견하다</td></tr><tr><td class=\"w\">catch</td><td class=\"m\">(곤경 등에) 처하게 하다, 사로잡다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">serious</td><td class=\"m\">심각한</td></tr><tr><td class=\"w\">financial</td><td class=\"m\">재정적인</td></tr><tr><td class=\"w\">position</td><td class=\"m\">상황, 처지</td></tr><tr><td class=\"w\">find oneself</td><td class=\"m\">(어떤 장소나 상황에) 있게 되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 은행 채무자들은</span><span class=\"en\"><b>Many debtors of the bank</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금 자신들이 ~라는 것을 깨닫는다</span><span class=\"en\"><b>now <span class=\"grammar-hl\">find themselves</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빠져 있다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">caught</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심각한 재정 상태에</span><span class=\"en\"><b>in a serious financial position.</b></span></div></div><div class=\"lec-sent-ko\">많은 은행 채무자들은 지금 자신들이 심각한 재정 상태에 빠져 있다는 것을 깨닫는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 은행에서 돈을 빌린 사람들이 현재 경제적으로 매우 어려운 처지에 놓여 있음을 나타냅니다. 여기서 caught는 사전적으로는 &#39;붙잡힌&#39;이라는 뜻이지만, 여기서는 &#39;어쩔 수 없이 꼼짝달싹 못 하는 상태&#39;를 의미합니다. 단순히 돈이 없는 것을 넘어, 채무자가 자신의 힘으로는 빠져나오기 힘든 곤란한 지경에 이르렀음을 강조하기 위해 이 단어를 선택했습니다. 또한 find themselves는 &#39;자신이 ~한 상태임을 발견하다&#39;라는 뜻으로, 상황을 인식하는 순간의 당혹감과 깨달음을 잘 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">find themselves caught 5형식(SVOC) 구조: find + 목적어(themselves) + 목적격보어(caught) 형태입니다. find는 여기서 &#39;알게 되다/발견하다&#39;라는 의미로 쓰였으며, 목적어인 themselves의 상태를 보어인 과거분사(caught)가 보충 설명합니다.</div><div class=\"lec-gr-item\">caught (과거분사(형용사적)): 목적격보어 자리에서 themselves가 &#39;처하게 된(잡히게 된)&#39; 상태를 나타내며, themselves를 수식하는 형용사 역할을 합니다. 수동의 의미를 내포하고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">debtor</td><td class=\"m\">채무자</td></tr><tr><td class=\"w\">bank</td><td class=\"m\">은행</td></tr><tr><td class=\"w\">find</td><td class=\"m\">(~한 상태임을) 알게 되다, 발견하다</td></tr><tr><td class=\"w\">serious</td><td class=\"m\">심각한</td></tr><tr><td class=\"w\">financial</td><td class=\"m\">재정적인</td></tr><tr><td class=\"w\">position</td><td class=\"m\">상황, 처지</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>은행으로부터 돈을 빌린 많은 사람들이 현재 심각한 경제적 어려움을 겪고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Many bank debtors are struggling financially, and they are now facing a very serious situation.</div>\n              <div class=\"lec-final-sum-ko\">많은 은행 채무자들이 재정적으로 어려움을 겪고 있으며, 현재 매우 심각한 상황에 직면해 있다.</div></div></div>"],"segs":[[{"audio":"./unit18_04_강의_audio/1.mp3","hl":null}],[{"audio":"./unit18_04_강의_audio/2.mp3","hl":null}],[{"audio":"./unit18_04_강의_audio/3.m
