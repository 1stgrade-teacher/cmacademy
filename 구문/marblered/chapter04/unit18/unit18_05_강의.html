r-bkg-txt\">우리가 흔히 &#39;틀니&#39;라고 부르는 의치(False teeth)는 자연 치아가 상실되었을 때 그 기능을 대신해주는 인공적인 대체물을 말해요. 치아 관리에 소홀하면 충치나 잇몸 질환으로 인해 치아를 발치(Extraction)해야 하는 상황이 오는데, 이때 저작 활동이나 발음 같은 일상적인 기능을 회복하기 위해 틀니를 사용하게 됩니다. 마치 자동차의 타이어가 닳으면 새것으로 교체하듯, 우리 몸도 자연 치아를 잃으면 인공적인 도구를 통해 본래의 기능을 유지하려는 노력이 필요하다는 점을 이해하면 지문의 내용을 훨씬 쉽게 파악할 수 있을 거예요. 평소에 꼼꼼한 양치질로 치아를 관리하는 것이 왜 중요한지 생각해보면서 글을 읽어보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01치아 관리의 필요성</div><ul><li>평소에 치아를 잘 관리하지 않으면 치아를 모두 잃을 위험이 있다.</li><li>치아를 제대로 돌보지 않음 (take good care of our teeth)</li><li>치아를 모두 뽑아야 하는 상황 발생 가능</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02치아의 상실과 대안</div><ul><li>자연 치아를 잃게 될 경우 이를 대신할 인공적인 방법이 필요하다.</li><li>치아를 모두 뽑아내는 상황 (have them all pulled out)</li><li>빠진 치아를 대신할 인공 치아 (false teeth) 제작</li><li>핵심 키워드: 인공 치아(false teeth), 치아 관리(take care of teeth)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unless</td><td class=\"m\">~하지 않는다면</td></tr><tr><td class=\"w\">take care of</td><td class=\"m\">~을 돌보다, 관리하다</td></tr><tr><td class=\"w\">pull out</td><td class=\"m\">(치아를) 뽑다</td></tr><tr><td class=\"w\">false</td><td class=\"m\">인공의, 가짜의</td></tr><tr><td class=\"w\">replace</td><td class=\"m\">대체하다, 대신하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 우리가 잘 관리하지 않는다면</span><span class=\"en\"><b>Unless we take good care</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 치아를</span><span class=\"en\"><b>of our teeth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 ~하게 될지도 모른다</span><span class=\"en\"><b>we may <span class=\"grammar-hl\">have</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들 모두가 뽑히게</span><span class=\"en\"><b><span class=\"grammar-hl\">them all pulled out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 ~하게 될지도 모른다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">have</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">틀니 세트가 만들어지게</span><span class=\"en\"><b><span class=\"grammar-hl\">a set of false teeth made</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 대신하기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to replace them</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리가 우리의 치아에 신경을 쓰지 않는다면 우리는 그것들이 모두 뽑히게 할지도 모르고 그것들을 대신하기 위해서 틀니 세트가 맞춰지게 할지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 치아 관리의 중요성을 조건문(Unless)을 통해 경고하고 있습니다. 여기서 take good care of는 사전적으로 &#39;잘 돌보다&#39;인데, 치아의 맥락에서는 &#39;충치를 예방하고 청결을 유지하는 습관&#39;을 의미합니다. 또한 pulled out은 사전적으로는 &#39;당겨서 빼다&#39;라는 물리적 동작이지만, 여기서는 치과 의사에 의해 &#39;발치당하다&#39;라는 수동적이고 부정적인 결과를 강조합니다. 필자는 치아 관리를 소홀히 했을 때 겪게 될 회복 불가능한 신체적 상실을 극명하게 보여주기 위해 이러한 표현들을 선택했습니다. 앞부분의 &#39;치아 관리 소홀&#39;이라는 원인이 뒷부분의 &#39;발치 및 틀니 착용&#39;이라는 불쾌한 결과로 이어짐을 논리적으로 연결하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have them all pulled out (5형식(SVOC)): have(사역동사) + O(them) + O.C.(p.p./pulled). 사역동사 have는 목적어와 목적보어의 관계가 수동일 때 p.p.를 취한다. pull은 타동사인데 목적어가 없으므로 수동의 관계를 가진다. 기본구조: have + O + p.p. (~를 ~하게 만들다/시키다)</div><div class=\"lec-gr-item\">have a set of false teeth made (5형식(SVOC)): have(사역동사) + O(a set of false teeth) + O.C.(p.p./made). 목적어인 치아와 그것을 만드는 행위는 수동 관계이므로 p.p.인 made를 쓴다. 기본구조: have + O + p.p. (~를 ~하게 만들다/시키다)</div><div class=\"lec-gr-item\">to replace them (to부정사): 부사적 용법(목적). 가짜 치아를 만드는 목적을 설명하며 ~하기 위해서로 해석된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unless</td><td class=\"m\">~하지 않는다면</td></tr><tr><td class=\"w\">false</td><td class=\"m\">인공의, 가짜의</td></tr><tr><td class=\"w\">replace</td><td class=\"m\">대체하다, 대신하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>치아를 평소에 잘 관리하지 않으면 치아를 모두 뽑아야 하는 상황이 올 수 있다.</li><li>결국 자신의 자연 치아를 잃고 틀니를 사용해야 하는 불상사가 생길 수 있으므로 관리가 필수적이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">We should take diligent care of our teeth to maintain their health, or we will have to face the permanent loss of replacing them with dentures.</div>\n              <div class=\"lec-final-sum-ko\">우리는 치아 건강을 위해 부지런히 관리해야 하며, 그렇지 않으면 의치로 대체해야 하는 영구적인 상실을 겪게 될 것이다.</div></div></div>"],"segs":[[{"audio":"./unit18_05_강의_audio/1.mp3","hl":null}],[{"audio":"./unit18_05_강의_audio/2.mp3","hl":null}],[{"audio":"./unit18_05_강의_audio/3.mp3","hl":null},{"audio":"./unit18_05_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit18_05_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit18_05_강의_audio/6.mp3","hl":null}],[{"audio":"./unit18_05_강의_audio/7.mp3","hl":"main"},{"audio":"./unit18_05_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit18_05_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit18_05_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p
