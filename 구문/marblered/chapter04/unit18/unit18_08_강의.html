를 말합니다. 보통 물류에서는 이 구간이 가장 비용이 많이 들고 시간도 오래 걸리는 &#39;배송의 병목 구간&#39;으로 불려요. 우리도 배달 음식을 시킬 때 따뜻한 음식을 빨리 받고 싶어 하는 것처럼, 배달업계는 이 짧은 거리에서의 효율을 높이기 위해 기술적 최적화와 신속한 배달망 구축에 큰 노력을 기울이고 있답니다. 결국 고객의 만족은 음식이 식기 전에 얼마나 정확하고 빠르게 도착하느냐에 달려 있다는 점을 생각하며 글을 읽어보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01고객의 우선순위</div><ul><li>고객들은 배달 음식을 주문할 때 두 가지 핵심 조건을 중요하게 생각한다.</li><li>음식 배달 속도(fast delivery)에 대한 강한 열망</li><li>음식이 식지 않고 따뜻한(hot) 상태로 도착하기를 기대함</li><li>핵심 키워드: 고객의 요구(customer needs)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02서비스의 핵심 목표</div><ul><li>음식점과 배달 서비스는 고객의 만족을 위해 두 가지 요구를 동시에 충족해야 한다.</li><li>신속성과 온도를 유지하는 효율적인 시스템 구축</li><li>만족스러운 서비스 경험을 통한 고객 유지(customer retention)</li><li>핵심 키워드: 서비스 품질(service quality)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer</td><td class=\"m\">고객</td></tr><tr><td class=\"w\">want</td><td class=\"m\">원하다</td></tr><tr><td class=\"w\">deliver</td><td class=\"m\">배달하다</td></tr><tr><td class=\"w\">fast</td><td class=\"m\">빠르게</td></tr><tr><td class=\"w\">arrive</td><td class=\"m\">도착하다</td></tr><tr><td class=\"w\">hot</td><td class=\"m\">뜨거운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고객들은</span><span class=\"en\"><b>Customers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 음식이</span><span class=\"en\"><b><span class=\"grammar-hl\">want their food</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빨리 배달되기를 원하고,</span><span class=\"en\"><b><span class=\"grammar-hl\">delivered</span> fast,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그들은 그것이</span><span class=\"en\"><b>and they <span class=\"grammar-hl\">want it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">따끈하게 도착하기를 원한다.</span><span class=\"en\"><b><span class=\"grammar-hl\">to arrive</span> hot.</b></span></div></div><div class=\"lec-sent-ko\">고객들은 그들의 음식이 빨리 배달되기를 원하고, 그들은 그것이 따끈하게 도착하기를 원한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서는 고객의 두 가지 핵심 요구사항(속도와 온도)을 나열합니다. 여기에서 delivered는 사전적으로 &#39;배달된&#39;이라는 뜻이지만, 문맥상 &#39;음식의 상태&#39;를 강조하여 고객이 원하는 서비스의 결과물을 구체적으로 나타내기 위해 사용되었습니다. 즉, 단순히 음식이 옮겨지는 과정을 넘어, 고객의 만족을 결정짓는 핵심 가치를 표현하려는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">want their food delivered 5형식(SVOC) 구조: want + 목적어(their food) + 목적보어(delivered, 과거분사) 형태. food가 배달되는 대상이므로 수동적 관계를 나타내는 과거분사가 쓰였다.</div><div class=\"lec-gr-item\">delivered (과거분사): delivered가 food의 상태(배달된)를 설명하며 5형식 목적보어 역할을 한다.</div><div class=\"lec-gr-item\">want it to arrive 5형식(SVOC) 구조: want + 목적어(it) + 목적보어(to arrive, to부정사) 형태. want는 목적보어로 to부정사를 취한다.</div><div class=\"lec-gr-item\">to arrive (to부정사): 5형식 문장에서 want의 목적보어로 쓰여 it이 하는 동작을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer</td><td class=\"m\">고객</td></tr><tr><td class=\"w\">want</td><td class=\"m\">원하다</td></tr><tr><td class=\"w\">deliver</td><td class=\"m\">배달하다</td></tr><tr><td class=\"w\">fast</td><td class=\"m\">빠르게</td></tr><tr><td class=\"w\">arrive</td><td class=\"m\">도착하다</td></tr><tr><td class=\"w\">hot</td><td class=\"m\">뜨거운</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>고객은 음식 배달 서비스에서 &#39;신속함&#39;과 &#39;온도 유지&#39;라는 두 가지 핵심 가치를 중요하게 생각한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Customers expect food to be delivered quickly while maintaining its heat, but these demands often clash with the practical difficulties of the delivery process.</div>\n              <div class=\"lec-final-sum-ko\">고객은 음식이 뜨거운 상태로 빠르게 배달되기를 기대하지만, 이러한 요구는 종종 배달 과정의 현실적인 어려움과 충돌한다.</div></div></div>"],"segs":[[{"audio":"./unit18_08_강의_audio/1.mp3","hl":null}],[{"audio":"./unit18_08_강의_audio/2.mp3","hl":null}],[{"audio":"./unit18_08_강의_audio/3.mp3","hl":null},{"audio":"./unit18_08_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit18_08_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit18_08_강의_audio/6.mp3","hl":null}],[{"audio":"./unit18_08_강의_audio/7.mp3","hl":"main"},{"audio":"./unit18_08_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit18_08_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit18_08_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimat
