  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;

lecturePlayer(document.getElementById("app"),{"brand":"unit18","title":"목적격보어 2: 동명사와 과거분사로 목적어 보충하기","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>목적격보어 2: 동명사와 과거분사로 목적어 보충하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>목적어 뒤에 동명사나 과거분사가 와서 목적어의 동작이나 상태를 보충하는 목적격보어 구조를 익힌다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 목적격보어 두 번째 시간이에요. 목적어 뒤에 동명사나 과거분사가 와서 목적어의 동작이나 상태를 보충하는 구조를 배워 볼 거예요. 지각동사와 사역동사 뒤에서 목적격보어가 어떻게 달라지는지 차근차근 살펴봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">\u003cb class=\"key\">S + V + O + v-ing(v-ed)\u003c/b>는 목적어가 ~하고 있는 중이거나 ~된 상태임을 보충해 줍니다. 지각동사 see, hear, feel과 사역동사 keep, have, make 뒤에서 목적어와 목적격보어의 능동·수동 관계를 먼저 판단합니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 In the downtown area I often \u003cspan class=\"fx\">see homeless people begging\u003c/span> for money all around the stoplights.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 I \u003cspan class=\"fx\">saw a car pulled over\u003c/span> on the side of the road while I was driving home.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03  The front desk clerk was on the phone and \u003cspan class=\"fx\">kept us waiting\u003c/span> to check in for a long time.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Many debtors of the bank now \u003cspan class=\"fx\">find themselves caught\u003c/span> in a serious financial position.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Unless we take good care of our teeth we may \u003cspan class=\"fx\">have them all pulled out and have a set of false teeth made\u003c/span> to replace them.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 The air we breathe in and out \u003cspan class=\"fx\">keeps our hearts beating and our blood moving\u003c/span> along our veins and arteries.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 I \u003cspan class=\"fx\">heard the dogs barking\u003c/span> fiercely late at night, so I came outside to see what was going on.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Customers \u003cspan class=\"fx\">want their food delivered\u003c/span> fast, and they want it to arrive hot.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 Although I have known the judge for a long time, I never \u003cspan class=\"fx\">heard him spoken ill of\u003c/span> by others.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 Winners will \u003cspan class=\"fx\">have their essays posted\u003c/span> on our website. Among the winners, only the first prize winner will have his or her essay published in our magazine.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Up on the green, green shoulder of hill rising to the west I could \u003cspan class=\"fx\">see a small group of cattle grazing\u003c/span>, and, below them on a gentler slope, several dozen chickens wandering down to the meadow.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Being in the spotlight \u003cspan class=\"fx\">made Tom feel tense\u003c/span>. He tried to deliver his lines as best as he could, but he could feel his voice shaking.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘의 핵심은 목적어 뒤에 오는 동명사와 과거분사를 구별하는 거예요. 목적어가 직접 움직이면서 하는 동작이면 동명사를 쓰고, 목적어가 다른 사람이나 사물에 의해서 그렇게 되는 수동 관계면 과거분사를 씁니다. see, hear, feel, keep, have 같은 동사 뒤에서 목적격보어가 목적어와 어떤 관계인지 먼저 보세요. 그리고 make 뒤에서는 동사원형이 오는 것도 함께 기억해 두면 좋아요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 In the downtown area I often \u003cspan class=\"fx\">see homeless people begging\u003c/span> for money all around the stoplights.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">In the downtown area \u003c/div>\u003cdiv class=\"k\">시내에서 \u003c/div>\u003cdiv class=\"e\">I often see \u003c/div>\u003cdiv class=\"k\">나는 종종 본다 \u003c/div>\u003cdiv class=\"e\">homeless people \u003c/div>\u003cdiv class=\"k\">노숙자들이 \u003c/div>\u003cdiv class=\"e\">begging for money \u003c/div>\u003cdiv class=\"k\">돈을 구걸하고 있는 것을 \u003c/div>\u003cdiv class=\"e\">all around the stoplights.\u003c/div>\u003cdiv class=\"k\">모든 신호등 주변에서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">see + O + v-ing\u003c/b> 구조로, 목적어 homeless people과 목적격보어 begging이 능동·진행 관계를 이룹니다. 노숙자들이 돈을 구걸하고 있는 진행 중인 동작을 생생하게 보여 줍니다.\u003c/div>","segs":[{"n":3,"text":"In the downtown area, 시내에서. I often see, 나는 종종 본다. homeless people, 노숙자들이. begging for money, 돈을 구걸하고 있는 것을. all around the stoplights, 모든 신호등 주변에서","hl":"ch"},{"n":4,"text":"첫 번째 문장에서 핵심은 see homeless people begging이에요. see 다음에 목적어 homeless people이 오고, 그 뒤에 begging이 와서 노숙자들이 돈을 구걸하는 진행 중인 동작을 보여 줍니다. 목적어가 직접 구걸하는 능동 관계라서 동명사를 쓴 거예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 In the downtown area I often \u003cspan class=\"fx\">see homeless people begging\u003c/span> for money all around the stoplights.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 문장은 시내에서 흔히 볼 수 있는 장면을 담고 있어요. 노숙자들이 신호등 주변에서 돈을 구걸하는 모습을 종종 본다는 뜻이죠. begging은 단순히 돈을 달라는 말보다 간절하게 구걸하는 느낌을 줍니다. 그래서 문장이 사회적 문제를 조용히 보여 주는 장면처럼 느껴져요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">see homeless people begging\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">watch homeless people beg\u003c/span>\u003cdiv class=\"w\">watch는 의식적으로 지켜본다는 느낌이 있고, 동사원형 beg를 쓰면 구걸하는 동작 전체를 본다는 느낌이 됩니다. 진행감을 살리려면 원래처럼 begging을 쓰는 것이 좋아요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">beg for money\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ask for money\u003c/span>\u003cspan class=\"y-eq\">beg = ask\u003c/span>\u003cdiv class=\"w\">beg는 간절하게 구걸하는 뉘앙스가 강하고, ask는 더 중립적인 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stoplight\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">traffic light\u003c/span>\u003cspan class=\"y-eq\">stoplight = traffic light\u003c/span>\u003cdiv class=\"w\">같은 대상을 가리키지만 traffic light가 더 일반적인 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">around the stoplights\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">near the traffic lights\u003c/span>\u003cspan class=\"y-eq\">around = near\u003c/span>\u003cdiv class=\"w\">주변이라는 뜻을 near로 바꾸어 조금 더 쉽게 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">In the city center, I frequently notice homeless people asking for money near every traffic light.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 시내에서 흔히 볼 수 있는 장면을 담고 있어요. 노숙자들이 신호등 주변에서 돈을 구걸하는 모습을 종종 본다는 뜻이죠. begging은 단순히 돈을 달라는 말보다 간절하게 구걸하는 느낌을 줍니다. 그래서 문장이 사회적 문제를 조용히 보여 주는 장면처럼 느껴져요.","hl":"mn"},{"n":6,"text":"표현을 바꿔 보면 see homeless people begging을 watch homeless people beg로 바꿀 수 있어요. watch는 의식적으로 지켜본다는 느낌이 있고, 동사원형 beg를 쓰면 구걸하는 동작 전체를 본다는 느낌이 됩니다. 진행감을 살리고 싶다면 원래처럼 begging을 쓰는 것이 좋아요.","hl":"rw"},{"n":7,"text":"어구도 정리해 볼게요. beg for money는 ask for money로 바꿀 수 있는데, beg가 훨씬 간절하고 구걸하는 느낌을 줍니다. stoplight는 traffic light와 같은 뜻이고, around the stoplights는 near the traffic lights로 바꿔 말할 수 있어요.","hl":"ph"},{"n":8,"text":"전체 문장을 바꿔 말하면 In the city center, I frequently notice homeless people asking for money near every traffic light.라고 할 수 있어요. see를 notice로, often을 frequently로 바꾸고 around the stoplights를 near every traffic light로 풀어 쓴 표현이에요. 뜻은 그대로이면서 조금 더 설명적인 문장이 되었습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 I \u003cspan class=\"fx\">saw a car pulled over\u003c/span> on the side of the road while I was driving home.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I saw \u003c/div>\u003cdiv class=\"k\">나는 보았다 \u003c/div>\u003cdiv class=\"e\">a car \u003c/div>\u003cdiv class=\"k\">어떤 자동차가 \u003c/div>\u003cdiv class=\"e\">pulled over \u003c/div>\u003cdiv class=\"k\">길가에 세워진 것을 \u003c/div>\u003cdiv class=\"e\">on the side of the road \u003c/div>\u003cdiv class=\"k\">도로 한쪽에 \u003c/div>\u003cdiv class=\"e\">while I was driving home.\u003c/div>\u003cdiv class=\"k\">내가 집으로 운전하는 동안에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">see + O + v-ed\u003c/b> 구조로, 목적어 a car와 목적격보어 pulled over가 수동 관계입니다. 차가 스스로 세워진 것이 아니라 길가에 세워진 상태를 보았다는 뜻을 만듭니다.\u003c/div>","segs":[{"n":9,"text":"I saw, 나는 보았다. a car, 어떤 자동차가. pulled over, 길가에 세워진 것을. on the side of the road, 도로 한쪽에. while I was driving home, 내가 집으로 운전하는 동안에","hl":"ch"},{"n":10,"text":"두 번째 문장에서는 saw a car pulled over를 눈여겨보세요. saw 다음에 목적어 a car가 오고, pulled over가 목적격보어로 와서 자동차가 길가에 세워진 상태를 보여 줍니다. 자동차는 스스로 세워지는 것이 아니라 누군가에 의해 세워진 수동 관계라서 과거분사를 쓴 거예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 I \u003cspan class=\"fx\">saw a car pulled over\u003c/span> on the side of the road while I was driving home.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 문장은 집으로 운전하던 중에 길가에 세워진 차를 보았다는 장면이에요. pulled over는 차가 고장 나거나 신고를 받아 길가에 멈춰 선 느낌을 줍니다. 내가 차를 세운 것이 아니라 차가 세워진 상태를 보았다는 점이 중요해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">saw a car pulled over\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">noticed a car pulled over\u003c/span>\u003cdiv class=\"w\">notice는 우연히 눈에 들어온 것을 알아차린다는 느낌을 줍니다. 같은 수동 상태를 유지하면서 시선을 강조한 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">saw a car pulled over\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">saw that a car was pulled over\u003c/span>\u003cdiv class=\"w\">목적격보어 구조를 that절로 풀어 쓴 표현입니다. 뜻은 같지만 문장이 더 설명적으로 변합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pulled over\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stopped by the road\u003c/span>\u003cspan class=\"y-eq\">pull over = stop by the road\u003c/span>\u003cdiv class=\"w\">차를 길가에 세우거나 멈춘 상태를 쉽게 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">on the side of the road\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">by the roadside\u003c/span>\u003cspan class=\"y-eq\">on the side of the road = by the roadside\u003c/span>\u003cdiv class=\"w\">도로 한쪽이라는 뜻을 더 간결한 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">while\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">as\u003c/span>\u003cspan class=\"y-eq\">while = as\u003c/span>\u003cdiv class=\"w\">두 동 ster로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">for a long time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">for ages\u003c/span>\u003cspan class=\"y-eq\">for a long time = for ages\u003c/span>\u003cdiv class=\"w\">오랫동안이라는 뜻을 조금 더 구어적인 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The receptionist was busy on the phone and made us wait a long time to check in.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 안내 데스크 직원이 통화 중이라서 체크인을 하려는 손님들을 오래 기다리게 했다는 상황이에요. kept us waiting은 단순히 기다리게 한 것이 아니라 계속 기다리는 상태를 유지시켰다는 느낌을 줍니다. 그래서 손님이 답답하고 불편했을 상황이 자연스럽게 그려져요.","hl":"mn"},{"n":18,"text":"kept us waiting은 made us wait로 바꿀 수 있어요. keep은 계속 기다리는 상태를 유지시킨다는 느낌이고, make는 기다리게 만들었다는 결과에 더 초점을 둡니다. 그래서 상황에 따라 미묘한 뉘앙스 차이가 생겨요.","hl":"rw"},{"n":19,"text":"front desk clerk는 receptionist로 바꿔 말할 수 있어요. check in은 register나 sign in으로 바꿀 수 있고, for a long time은 for ages처럼 조금 더 구어적으로 표현할 수 있습니다. 뜻은 같지만 상황에 따라 격식의 차이가 생겨요.","hl":"ph"},{"n":20,"text":"전체 문장은 The receptionist was busy on the phone and made us wait a long time to check in.으로 바꿀 수 있어요. front desk clerk를 receptionist로, kept us waiting을 made us wait로 바꾼 표현이에요. 뜻은 같고 조금 더 일상적인 어휘를 사용했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Many debtors of the bank now \u003cspan class=\"fx\">find themselves caught\u003c/span> in a serious financial position.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Many debtors of the bank \u003c/div>\u003cdiv class=\"k\">많은 은행 채무자들은 \u003c/div>\u003cdiv class=\"e\">now find themselves \u003c/div>\u003cdiv class=\"k\">지금 자신들이 깨닫는다 \u003c/div>\u003cdiv class=\"e\">caught \u003c/div>\u003cdiv class=\"k\">빠져 있는 것을 \u003c/div>\u003cdiv class=\"e\">in a serious financial position.\u003c/div>\u003cdiv class=\"k\">심각한 재정 상태에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">find + O + v-ed\u003c/b> 구조로, 목적어 themselves가 caught라는 상태에 있음을 깨닫는다는 뜻입니다. 목적어가 상황에 의해 잡힌 수동 관계라서 과거분사 caught가 목적격보어로 쓰였습니다.\u003c/div>","segs":[{"n":21,"text":"Many debtors of the bank, 많은 은행 채무자들은. now find themselves, 지금 자신들이 깨닫는다. caught, 빠져 있는 것을. in a serious financial position, 심각한 재정 상태에","hl":"ch"},{"n":22,"text":"네 번째 문장에서는 find themselves caught를 보세요. find 다음에 목적어 themselves가 오고 caught가 와서 그들이 심각한 재정 상태에 빠져 있는 것을 깨닫는다는 뜻을 만듭니다. themselves는 스스로 잡힌 것이 아니라 상황에 의해 빠진 수동 관계라서 과거분사가 왔어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Many debtors of the bank now \u003cspan class=\"fx\">find themselves caught\u003c/span> in a serious financial position.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 문장은 은행에 빚을 진 많은 사람들이 지금 심각한 재정 상태에 빠져 있다는 것을 스스로 깨닫는다는 뜻이에요. caught in은 마치 함정이나 어려운 상황에 갇힌 듯한 느낌을 줍니다. 그래서 단순한 재정 문제보다 꽤 심각하고 답답한 상황임을 알 수 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">find themselves caught\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">realize that they are caught\u003c/span>\u003cdiv class=\"w\">find themselves는 스스로 그런 상태임을 깨닫는다는 뜻을 간결하게 담고 있습니다. that절로 풀면 의미는 같지만 문장이 조금 더 길고 설명적으로 변합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">debtor\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">people who owe money\u003c/span>\u003cspan class=\"y-eq\">debtor = people who owe money\u003c/span>\u003cdiv class=\"w\">빚진 사람이라는 뜻을 풀어서 쉽게 설명한 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">caught in\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stuck in\u003c/span>\u003cspan class=\"y-eq\">caught in = stuck in\u003c/span>\u003cdiv class=\"w\">어려운 상황에 갇힌 느낌을 살린 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">financial position\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">financial situation\u003c/span>\u003cspan class=\"y-eq\">financial position = financial situation\u003c/span>\u003cdiv class=\"w\">재정 상태를 뜻하는 거의 같은 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Many people who owe the bank money now realize that they are in serious financial trouble.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 은행에 빚을 진 많은 사람들이 지금 심각한 재정 상태에 빠져 있다는 것을 스스로 깨닫는다는 뜻이에요. caught in은 마치 함정이나 어려운 상황에 갇힌 듯한 느낌을 줍니다. 그래서 단순한 재정 문제보다 꽤 심각하고 답답한 상황임을 알 수 있어요.","hl":"mn"},{"n":24,"text":"find themselves caught는 realize that they are caught로 바꿀 수 있어요. find themselves는 스스로 그런 상태임을 깨닫는다는 뜻을 간결하게 담고 있어요. that절로 풀면 의미는 같지만 문장이 조금 더 길고 설명적으로 변합니다.","hl":"rw"},{"n":25,"text":"debtor는 people who owe money처럼 풀어 쓸 수 있어요. caught in은 stuck in으로 바꾸면 어려운 상황에 갇힌 느낌을 살릴 수 있습니다. financial position은 financial situation과 거의 같은 뜻으로 쓰여요.","hl":"ph"},{"n":26,"text":"바꿔 말하면 Many people who owe the bank money now realize that they are in serious financial trouble.라고 할 수 있어요. debtors를 people who owe the bank money로 풀고, find themselves caught를 realize that they are in trouble로 바꾼 표현이에요. 그래서 문장이 더 쉽게 이해됩니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Unless we take good care of our teeth we may \u003cspan class=\"fx\">have them all pulled out and have a set of false teeth made\u003c/span> to replace them.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Unless we take good care of our teeth \u003c/div>\u003cdiv class=\"k\">만약 우리가 우리의 치아에 신경을 쓰지 않는다면 \u003c/div>\u003cdiv class=\"e\">we may have them all pulled out \u003c/div>\u003cdiv class=\"k\">우리는 그것들이 모두 뽑히게 될지도 모른다 \u003c/div>\u003cdiv class=\"e\">and have a set of false teeth made \u003c/div>\u003cdiv class=\"k\">그리고 틀니 한 세트가 만들어지게 될지도 모른다 \u003c/div>\u003cdiv class=\"e\">to replace them.\u003c/div>\u003cdiv class=\"k\">그것들을 대신하도록\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">have + O + v-ed\u003c/b>가 두 번 쓰여 목적어가 뽑히고 만들어지는 수동의 의미를 만듭니다. them과 false teeth가 각각 pulled out, made의 대상이므로 과거분사가 목적격보어로 왔습니다.\u003c/div>","segs":[{"n":27,"text":"Unless we take good care of our teeth, 만약 우리가 우리의 치아에 신경을 쓰지 않는다면. we may have them all pulled out, 우리는 그것들이 모두 뽑히게 될지도 모른다. and have a set of false teeth made, 그리고 틀니 한 세트가 만들어지게 될지도 모른다. to replace them, 그것들을 대신하도록","hl":"ch"},{"n":28,"text":"다섯 번째 문장에는 have them all pulled out과 have a set of false teeth made가 나옵니다. have 다음에 목적어가 오고 과거분사가 오면 목적어가 어떤 일을 당하게 된다는 뜻이 돼요. teeth는 뽑히는 대상이고 false teeth는 만들어지는 대상이라서 pulled와 made가 모두 과거분사로 쓰였습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Unless we take good care of our teeth we may \u003cspan class=\"fx\">have them all pulled out and have a set of false teeth made\u003c/span> to replace them.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 문장은 치아 관리를 잘하지 않으면 이를 모두 뽑고 틀니를 맞추게 될 수도 있다는 경고예요. have them all pulled out은 내 의지와 상관없이 그런 일을 겪게 된다는 느낌을 줍니다. 그래서 평소에 이를 잘 관리해야 한다는 메시지가 자연스럽게 전달돼요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have them all pulled out\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">get them all pulled out\u003c/span>\u003cdiv class=\"w\">have와 get은 모두 목적어가 어떤 일을 당하게 된다는 사역의 느낌을 만들 수 있습니다. get은 조금 더 구어적이고 결과를 강조하는 느낌이 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unless\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">if not\u003c/span>\u003cspan class=\"y-eq\">unless = if not\u003c/span>\u003cdiv class=\"w\">조건을 부정문으로 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take good care of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">look after well\u003c/span>\u003cspan class=\"y-eq\">take good care of = look after well\u003c/span>\u003cdiv class=\"w\">잘 돌보다, 신경 쓰다는 뜻을 쉽게 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">false teeth\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">dentures\u003c/span>\u003cspan class=\"y-eq\">false teeth = dentures\u003c/span>\u003cdiv class=\"w\">틀니를 가리키는 더 전문적인 한 단어 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If we do not care for our teeth well, we might have all of them removed and get a set of dentures made to replace them.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 치아 관리를 잘하지 않으면 이를 모두 뽑고 틀니를 맞추게 될 수도 있다는 경고예요. have them all pulled out은 내 의지와 상관없이 그런 일을 겪게 된다는 느낌을 줍니다. 그래서 평소에 이를 잘 관리해야 한다는 메시지가 자연스럽게 전달돼요.","hl":"mn"},{"n":30,"text":"have them all pulled out은 get them all pulled out으로 바꿀 수 있어요. have와 get은 모두 목적어가 어떤 일을 당하게 된다는 사역의 느낌을 만들 수 있습니다. get은 조금 더 구어적이고 결과를 강조하는 느낌이 있어요.","hl":"rw"},{"n":31,"text":"unless는 if not으로 바꿔 이해할 수 있어요. take good care of는 look after well로 바꿀 수 있습니다. false teeth는 dentures라는 한 단어 표현으로 바꿀 수 있어요.","hl":"ph"},{"n":32,"text":"전체 문장은 If we do not care for our teeth well, we might have all of them removed and get a set of dentures made to replace them.으로 바꿀 수 있어요. unless를 if not으로 풀고, false teeth를 dentures로 바꾼 표현이에요. 경고의 뜻은 그대로 유지됩니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 The air we breathe in and out \u003cspan class=\"fx\">keeps our hearts beating and our blood moving\u003c/span> along our veins and arteries.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The air \u003c/div>\u003cdiv class=\"k\">공기는 \u003c/div>\u003cdiv class=\"e\">we breathe in and out \u003c/div>\u003cdiv class=\"k\">우리가 들이마시고 내뱉는 \u003c/div>\u003cdiv class=\"e\">keeps our hearts beating \u003c/div>\u003cdiv class=\"k\">계속 우리의 심장이 뛰게 한다 \u003c/div>\u003cdiv class=\"e\">and our blood moving \u003c/div>\u003cdiv class=\"k\">그리고 우리의 피가 움직이게 한다 \u003c/div>\u003cdiv class=\"e\">along our veins and arteries.\u003c/div>\u003cdiv class=\"k\">우리의 정맥과 동맥을 따라\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">keep + O + v-ing\u003c/b> 구조에서 목적어 our hearts와 our blood가 각각 beating, moving이라는 진행 동작을 계속하게 합니다. 두 목적어와 목적격보어가 and로 병렬 연결되어 있습니다.\u003c/div>","segs":[{"n":33,"text":"The air, 공기는. we breathe in and out, 우리가 들이마시고 내뱉는. keeps our hearts beating, 계속 우리의 심장이 뛰게 한다. and our blood moving, 그리고 우리의 피가 움직이게 한다. along our veins and arteries, 우리의 정맥과 동맥을 따라","hl":"ch"},{"n":34,"text":"여섯 번째 문장의 핵심은 keeps our hearts beating and our blood moving이에요. keep 뒤에 두 개의 목적어와 동명사가 and로 연결되어 있어요. 심장과 피가 직접 뛰고 움직이는 능동 관계라서 beating과 moving을 썼습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 The air we breathe in and out \u003cspan class=\"fx\">keeps our hearts beating and our blood moving\u003c/span> along our veins and arteries.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 문장은 우리가 들이마시고 내쉬는 공기가 심장을 계속 뛰게 하고 피가 혈관을 따라 흐르게 한다는 뜻이에요. keeps our hearts beating은 생명 활동이 멈추지 않고 계속된다는 느낌을 줍니다. 그래서 공기와 호흡이 우리 몸에 얼마나 중요한지 쉽게 이해할 수 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">keeps our hearts beating\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">makes our hearts beat\u003c/span>\u003cdiv class=\"w\">keep은 계속 뛰게 한다는 지속의 느낌이 강하고, make는 뛰게 만든다는 결과에 초점을 둡니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">breathe in and out\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">inhale and exhale\u003c/span>\u003cspan class=\"y-eq\">breathe in and out = inhale and exhale\u003c/span>\u003cdiv class=\"w\">들이마시고 내뱉는다는 뜻을 더 전문적인 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">beating\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pumping\u003c/span>\u003cspan class=\"y-eq\">beating = pumping\u003c/span>\u003cdiv class=\"w\">심장이 피를 보내며 뛰는 느낌을 살린 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">along\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">through\u003c/span>\u003cspan class=\"y-eq\">along = through\u003c/span>\u003cdiv class=\"w\">혈관을 따라 흐르는 느낌을 through로 자연스럽게 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The air that we inhale and exhale keeps our hearts pumping and our blood flowing through our veins and arteries.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 우리가 들이마시고 내쉬는 공기가 심장을 계속 뛰게 하고 피가 혈관을 따라 흐르게 한다는 뜻이에요. keeps our hearts beating은 생명 활동이 멈추지 않고 계속된다는 느낌을 줍니다. 그래서 공기와 호흡이 우리 몸에 얼마나 중요한지 쉽게 이해할 수 있어요.","hl":"mn"},{"n":36,"text":"keeps our hearts beating은 makes our hearts beat로 바꿀 수 있어요. keep은 계속 뛰게 한다는 지속의 느낌이 강하고, make는 뛰게 만든다는 결과에 초점을 둡니다. 그래서 생명 활동이 계속된다는 느낌을 살리려면 keep이 더 잘 어울려요.","hl":"rw"},{"n":37,"text":"breathe in and out은 inhale and exhale로 바꿀 수 있어요. beating은 pumping처럼 심장이 피를 보내는 느낌으로 바꿔 말할 수 있습니다. along은 through로 바꿔도 혈관을 따라 흐르는 느낌을 전달할 수 있어요.","hl":"ph"},{"n":38,"text":"바꿔 말하면 The air that we inhale and exhale keeps our hearts pumping and our blood flowing through our veins and arteries.라고 할 수 있어요. breathe in and out을 inhale and exhale로, beating을 pumping으로 바꾼 표현이에요. 과학적인 설명 느낌이 조금 더 강해집니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 I \u003cspan class=\"fx\">heard the dogs barking\u003c/span> fiercely late at night, so I came outside to see what was going on.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I heard \u003c/div>\u003cdiv class=\"k\">나는 들었다 \u003c/div>\u003cdiv class=\"e\">the dogs barking fiercely \u003c/div>\u003cdiv class=\"k\">개들이 사납게 짖는 것을 \u003c/div>\u003cdiv class=\"e\">late at night, \u003c/div>\u003cdiv class=\"k\">늦은 밤에 \u003c/div>\u003cdiv class=\"e\">so I came outside \u003c/div>\u003cdiv class=\"k\">그래서 나는 밖으로 나왔다 \u003c/div>\u003cdiv class=\"e\">to see \u003c/div>\u003cdiv class=\"k\">보기 위해서 \u003c/div>\u003cdiv class=\"e\">what was going on.\u003c/div>\u003cdiv class=\"k\">무슨 일이 일어나고 있었는지를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">hear + O + v-ing\u003c/b> 구조로, 목적어 the dogs가 barking하는 진행 중인 동작을 들었다는 뜻입니다. 목적어와 목적격보어가 능동 관계이므로 v-ing가 쓰였습니다.\u003c/div>","segs":[{"n":39,"text":"I heard, 나는 들었다. the dogs barking fiercely, 개들이 사납게 짖는 것을. late at night, 늦은 밤에. so I came outside, 그래서 나는 밖으로 나왔다. to see, 보기 위해서. what was going on, 무슨 일이 일어나고 있었는지를","hl":"ch"},{"n":40,"text":"일곱 번째 문장에서는 heard the dogs barking을 보세요. hear 다음에 목적어 the dogs가 오고 barking이 와서 개들이 짖고 있는 진행 중인 소리를 들었다는 뜻이에요. 개들이 직접 짖는 능동 관계라서 동명사를 썼습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 I \u003cspan class=\"fx\">heard the dogs barking\u003c/span> fiercely late at night, so I came outside to see what was going on.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 문장은 늦은 밤에 개들이 사납게 짖는 소리를 듣고 밖에 무슨 일이 있는지 확인하러 나갔다는 장면이에요. barking fiercely는 단순한 짖음보다 격렬하고 불안한 느낌을 줍니다. 그래서 밖으로 나가게 만든 긴장감이 잘 드러나요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">heard the dogs barking\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">heard the dogs bark\u003c/span>\u003cdiv class=\"w\">barking은 짖는 소리가 계속 이어지는 진행감을 주고, bark는 짖는 동작 전체를 들었다는 느낌을 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">barking fiercely\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">barking wildly\u003c/span>\u003cspan class=\"y-eq\">fiercely = wildly\u003c/span>\u003cdiv class=\"w\">사납고 격렬하게 짖는 느낌을 wild하게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">late at night\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">deep into the night\u003c/span>\u003cspan class=\"y-eq\">late at night = deep into the night\u003c/span>\u003cdiv class=\"w\">늦은 밤이라는 시간을 더 강조하는 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">see what was going on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">find out what was happening\u003c/span>\u003cspan class=\"y-eq\">see what was going on = find out what was happening\u003c/span>\u003cdiv class=\"w\">무슨 일이 일어나는지 확인한다는 뜻을 쉽게 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Late at night, I heard dogs barking wildly, so I went outside to find out what was happening.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 늦은 밤에 개들이 사납게 짖는 소리를 듣고 밖에 무슨 일이 있는지 확인하러 나갔다는 장면이에요. barking fiercely는 단순한 짖음보다 격렬하고 불안한 느낌을 줍니다. 그래서 밖으로 나가게 만든 긴장감이 잘 드러나요.","hl":"mn"},{"n":42,"text":"heard the dogs barking은 heard the dogs bark로 바꿀 수 있어요. barking은 짖는 소리가 계속 이어지는 진행감을 주고, bark는 짖는 동작 전체를 들었다는 느낌을 줍니다. 늦은 밤의 긴장감을 살리려면 barking이 더 생생해요.","hl":"rw"},{"n":43,"text":"barking fiercely는 barking wildly로 바꿀 수 있어요. late at night는 deep into the night처럼 늦은 시간을 강조하는 표현으로 바꿀 수 있습니다. see what was going on은 find out what was happening으로 바꿔 말할 수 있어요.","hl":"ph"},{"n":44,"text":"전체 문장은 Late at night, I heard dogs barking wildly, so I went outside to find out what was happening.으로 바꿀 수 있어요. fiercely를 wildly로, see what was going on을 find out what was happening으로 바꾼 표현이에요. 같은 상황을 더 자연스럽게 풀어 쓴 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 Customers \u003cspan class=\"fx\">want their food delivered\u003c/span> fast, and they want it to arrive hot.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Customers want \u003c/div>\u003cdiv class=\"k\">고객들은 원한다 \u003c/div>\u003cdiv class=\"e\">their food delivered fast, \u003c/div>\u003cdiv class=\"k\">그들의 음식이 빨리 배달되기를 \u003c/div>\u003cdiv class=\"e\">and they want \u003c/div>\u003cdiv class=\"k\">그리고 그들은 원한다 \u003c/div>\u003cdiv class=\"e\">it to arrive hot.\u003c/div>\u003c v>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Although I have known the judge for a long time, \u003c/div>\u003cdiv class=\"k\">비록 내가 그 재판관을 오랫동안 알아 왔지만 \u003c/div>\u003cdiv class=\"e\">I never heard \u003c/div>\u003cdiv class=\"k\">나는 전혀 듣지 못했다 \u003c/div>\u003cdiv class=\"e\">him spoken ill of \u003c/div>\u003cdiv class=\"k\">그가 나쁘게 말해지는 것을 \u003c/div>\u003cdiv class=\"e\">by others.\u003c/div>\u003cdiv class=\"k\">타인에 의해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">hear + O + v-ed\u003c/b> 구조로, 목적어 him이 spoken ill of되는 수동 관계를 나타냅니다. 그가 다른 사람들에게 나쁘게 말해지는 것을 듣다라는 뜻을 만듭니다.\u003c/div>","segs":[{"n":51,"text":"Although I have known the judge for a long time, 비록 내가 그 재판관을 오랫동안 알아 왔지만. I never heard, 나는 전혀 듣지 못했다. him spoken ill of, 그가 나쁘게 말해지는 것을. by others, 타인에 의해","hl":"ch"},{"n":52,"text":"아홉 번째 문장의 핵심은 heard him spoken ill of예요. hear 다음에 목적어 him이 오고 spoken ill of가 와서 그가 다른 사람들에게 나쁘게 말해지는 것을 들었다는 뜻입니다. him은 말하는 사람이 아니라 말해지는 대상이라서 과거분사를 쓴 거예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 Although I have known the judge for a long time, I never \u003cspan class=\"fx\">heard him spoken ill of\u003c/span> by others.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 문장은 재판관을 오래 알아 왔지만 그가 다른 사람들에게 나쁘게 말해지는 것은 한 번도 들어 본 적이 없다는 뜻이에요. spoken ill of는 누군가를 헐뜯거나 비난하는 표현이에요. 그래서 그 재판관이 평판이 좋은 사람이라는 점을 간접적으로 보여 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">heard him spoken ill of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">heard people speak ill of him\u003c/span>\u003cdiv class=\"w\">원문은 him이 나쁘게 말해지는 수동 관계를 강조하고, 바꾼 문장은 사람들이 그를 나쁘게 말하는 능동 장면을 보여 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">spoken ill of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">criticized\u003c/span>\u003cspan class=\"y-eq\">speak ill of = criticize\u003c/span>\u003cdiv class=\"w\">헐뜯거나 나쁘게 말한다는 뜻을 criticize로 간결하게 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by others\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">by other people\u003c/span>\u003cspan class=\"y-eq\">others = other people\u003c/span>\u003cdiv class=\"w\">다른 사람들이라는 뜻을 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have known\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have been acquainted with\u003c/span>\u003cspan class=\"y-eq\">know = be acquainted with\u003c/span>\u003cdiv class=\"w\">알고 지낸다는 뜻을 조금 더 격식 있게 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Even though I have known the judge for a long time, I have never heard anyone speak badly of him.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 재판관을 오래 알아 왔지만 그가 다른 사람들에게 나쁘게 말해지는 것은 한 번도 들어 본 적이 없다는 뜻이에요. spoken ill of는 누군가를 헐뜯거나 비난하는 표현이에요. 그래서 그 재판관이 평판이 좋은 사람이라는 점을 간접적으로 보여 줍니다.","hl":"mn"},{"n":54,"text":"heard him spoken ill of는 heard people speak ill of him으로 바꿀 수 있어요. 원문은 him이 나쁘게 말해지는 수동 관계를 강조하고, 바꾼 문장은 사람들이 그를 나쁘게 말하는 능동 장면을 보여 줍니다. 같은 상황을 초점을 바꿔 표현한 거예요.","hl":"rw"},{"n":55,"text":"spoken ill of는 criticized로 바꿀 수 있어요. by others는 by other people로 풀어 쓸 수 있습니다. have known은 have been acquainted with로 바꾸면 조금 더 격식 있는 표현이 돼요.","hl":"ph"},{"n":56,"text":"전체 문장은 Even though I have known the judge for a long time, I have never heard anyone speak badly of him.으로 바꿀 수 있어요. heard him spoken ill of를 heard anyone speak badly of him으로 능동 구조로 바꾼 표현이에요. 같은 뜻을 더 쉽게 전달합니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 Winners will \u003cspan class=\"fx\">have their essays posted\u003c/span> on our website. Among the winners, only the first prize winner will have his or her essay published in our magazine.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Winners will have \u003c/div>\u003cdiv class=\"k\">입상자들은 하게 할 것이다 \u003c/div>\u003cdiv class=\"e\">their essays posted \u003c/div>\u003cdiv class=\"k\">그들의 에세이가 게재되게 \u003c/div>\u003cdiv class=\"e\">on our website. \u003c/div>\u003cdiv class=\"k\">우리의 웹사이트에 \u003c/div>\u003cdiv class=\"e\">Among the winners, \u003c/div>\u003cdiv class=\"k\">입상자들 중에서 \u003c/div>\u003cdiv class=\"e\">only the first prize winner \u003c/div>\u003cdiv class=\"k\">오직 일등 입상자만이 \u003c/div>\u003cdiv class=\"e\">will have \u003c/div>\u003cdiv class=\"k\">하게 할 것이다 \u003c/div>\u003cdiv class=\"e\">his or her essay published \u003c/div>\u003cdiv class=\"k\">자신의 에세이가 실리게 \u003c/div>\u003cdiv class=\"e\">in our magazine.\u003c/div>\u003cdiv class=\"k\">우리의 잡지에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">have + O + v-ed\u003c/b> 구조가 두 문장에 반복됩니다. their essays와 his or her essay가 각각 posted, published되는 대상이므로 과거분사가 목적격보어로 쓰였습니다.\u003c/div>","segs":[{"n":57,"text":"Winners will have, 입상자들은 하게 할 것이다. their essays posted, 그들의 에세이가 게재되게. on our website, 우리의 웹사이트에. Among the winners, 입상자들 중에서. only the first prize winner, 오직 일등 입상자만이. will have, 하게 할 것이다. his or her essay published, 자신의 에세이가 실리게. in our magazine, 우리의 잡지에","hl":"ch"},{"n":58,"text":"열 번째 문장에서는 have their essays posted와 have his or her essay published를 비교해 보세요. have 다음에 목적어가 오고 과거분사가 오면 목적어가 게재되거나 실리게 한다는 뜻이 됩니다. essays와 essay는 모두 게시되고 출판되는 대상이라서 posted와 published가 과거분사로 왔어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 Winners will \u003cspan class=\"fx\">have their essays posted\u003c/span> on our website. Among the winners, only the first prize winner will have his or her essay published in our magazine.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 문장은 입상자들의 에세이가 웹사이트에 게재되고, 그중 일등 입상자의 에세이만 잡지에 실린다는 뜻이에요. have their essays posted는 입상자들이 그런 결과를 갖게 된다는 느낌을 줍니다. 그래서 상을 받은 사람에게 주어지는 특전을 설명하는 문장이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have their essays posted\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">get their essays posted\u003c/span>\u003cdiv class=\"w\">have와 get 모두 목적어가 게시되게 한다는 사역의 느낌을 담을 수 있습니다. get은 결과가 이루어지는 느낌을 조금 더 강조해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">posted on our website\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">uploaded to our website\u003c/span>\u003cspan class=\"y-eq\">posted = uploaded\u003c/span>\u003cdiv class=\"w\">웹사이트에 게재한다는 뜻을 업로드한다는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">published in our magazine\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">featured in our magazine\u003c/span>\u003cspan class=\"y-eq\">published = featured\u003c/span>\u003cdiv class=\"w\">잡지에 실린다는 뜻을 featured로 바꾸어 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">first prize winner\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">winner of the top prize\u003c/span>\u003cspan class=\"y-eq\">first prize winner = winner of the top prize\u003c/span>\u003cdiv class=\"w\">일등 입상자라는 뜻을 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Winners will have their essays uploaded to our website. Of all the winners, only the top prize winner will have his or her essay featured in our magazine.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 입상자들의 에세이가 웹사이트에 게재되고, 그중 일등 입상자의 에세이만 잡지에 실린다는 뜻이에요. have their essays posted는 입상자들이 그런 결과를 갖게 된다는 느낌을 줍니다. 그래서 상을 받은 사람에게 주어지는 특전을 설명하는 문장이에요.","hl":"mn"},{"n":60,"text":"have their essays posted는 get their essays posted로 바꿀 수 있어요. have와 get 모두 목적어가 게시되게 한다는 사역의 느낌을 담을 수 있습니다. get은 결과가 이루어지는 느낌을 조금 더 강조해요.","hl":"rw"},{"n":61,"text":"posted on our website는 uploaded to our website로 바꿀 수 있어요. published in our magazine은 featured in our magazine으로 바꿔 말할 수 있습니다. first prize winner는 winner of the top prize로 풀어 쓸 수 있어요.","hl":"ph"},{"n":62,"text":"바꿔 말하면 Winners will have their essays uploaded to our website. Of all the winners, only the top prize winner will have his or her essay featured in our magazine.라고 할 수 있어요. posted를 uploaded로, published를 featured로 바꾼 표현이에요. 뜻은 그대로이면서 조금 더 현대적인 느낌을 줍니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 Up on the green, green shoulder of hill rising to the west I could \u003cspan class=\"fx\">see a small group of cattle grazing\u003c/span>, and, below them on a gentler slope, several dozen chickens wandering down to the meadow.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Up on the green, green shoulder of hill \u003c/div>\u003cdiv class=\"k\">언덕의 푸르고 푸른 등성이 위에 \u003c/div>\u003cdiv class=\"e\">rising to the west \u003c/div>\u003cdiv class=\"k\">서쪽으로 솟은 \u003c/div>\u003cdiv class=\"e\">I could see \u003c/div>\u003cdiv class=\"k\">나는 볼 수 있었다 \u003c/div>\u003cdiv class=\"e\">a small group of cattle grazing, \u003c/div>\u003cdiv class=\"k\">작은 소 떼 무리가 풀을 뜯고 있는 것을 \u003c/div>\u003cdiv class=\"e\">and, \u003c/div>\u003cdiv class=\"k\">그리고 \u003c/div>\u003cdiv class=\"e\">below them on a gentler slope, \u003c/div>\u003cdiv class=\"k\">그들보다 아래쪽의 보다 완만한 비탈길에 \u003c/div>\u003cdiv class=\"e\">several dozen chickens wandering down to the meadow.\u003c/div>\u003cdiv class=\"k\">수십 마리의 닭들이 아래로 목초지까지 돌아다니고 있는 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">see + O + v-ing\u003c/b> 구조에서 a small group of cattle grazing과 several dozen chickens wandering이 could see의 목적어와 목적격보어로 병렬 연결됩니다. 소 떼와 닭들이 직접 하는 진행 동작을 생생하게 보여 줍니다.\u003c/div>","segs":[{"n":63,"text":"Up on the green, green shoulder of hill, 언덕의 푸르고 푸른 등성이 위에. rising to the west, 서쪽으로 솟은. I could see, 나는 볼 수 있었다. a small group of cattle grazing, 작은 소 떼 무리가 풀을 뜯고 있는 것을. and, 그리고. below them on a gentler slope, 그들보다 아래쪽의 보다 완만한 비탈길에. several dozen chickens wandering down to the meadow, 수십 마리의 닭들이 아래로 목초지까지 돌아다니고 있는 것을","hl":"ch"},{"n":64,"text":"열한 번째 문장에서는 could see a small group of cattle grazing을 먼저 보세요. see 다음에 목적어 a small group of cattle이 오고 grazing이 와서 소 떼가 풀을 뜯고 있는 장면을 보여 줍니다. 뒤에 이어지는 chickens wandering도 같은 구조로, 닭들이 돌아다니고 있는 진행 장면을 나타냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 Up on the green, green shoulder of hill rising to the west I could \u003cspan class=\"fx\">see a small group of cattle grazing\u003c/span>, and, below them on a gentler slope, several dozen chickens wandering down to the meadow.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 문장은 서쪽으로 솟은 푸른 언덕 위에서 소 떼가 풀을 뜯고, 그 아래 완만한 비탈에서 닭들이 목초지로 내려가는 평화로운 풍경을 그려요. grazing과 wandering은 동작이 진행 중인 장면을 생생하게 보여 줍니다. 그래서 마치 그림을 보듯 넓은 자연 풍경이 눈앞에 펼쳐지는 느낌이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">could see a small group of cattle grazing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">could see a small group of cattle graze\u003c/span>\u003cdiv class=\"w\">grazing은 풀을 뜯고 있는 진행 장면을 강조하고, graze는 풀을 뜯는 동작 전체를 본다는 느낌을 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">shoulder of hill\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ridge of the hill\u003c/span>\u003cspan class=\"y-eq\">shoulder = ridge\u003c/span>\u003cdiv class=\"w\">산이나 언덕의 등성이를 ridge로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">grazing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">feeding on grass\u003c/span>\u003cspan class=\"y-eq\">graze = feed on grass\u003c/span>\u003cdiv class=\"w\">풀을 뜯는다는 뜻을 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">wandering down\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">roaming down\u003c/span>\u003cspan class=\"y-eq\">wander = roam\u003c/span>\u003cdiv class=\"w\">돌아다닌다는 뜻을 roam으로 바꾸어 비슷한 느낌을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">On the green ridge of the hill rising to the west, I could see a small herd of cattle feeding, and below them on a gentler slope, dozens of chickens roaming down toward the meadow.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 서쪽으로 솟은 푸른 언덕 위에서 소 떼가 풀을 뜯고, 그 아래 완만한 비탈에서 닭들이 목초지로 내려가는 평화로운 풍경을 그려요. grazing과 wandering은 동작이 진행 중인 장면을 생생하게 보여 줍니다. 그래서 마치 그림을 보듯 넓은 자연 풍경이 눈앞에 펼쳐지는 느낌이에요.","hl":"mn"},{"n":66,"text":"could see a small group of cattle grazing은 could see a small group of cattle graze로 바꿀 수 있어요. grazing은 풀을 뜯고 있는 진행 장면을 강조하고, graze는 풀을 뜯는 동작 전체를 본다는 느낌을 줍니다. 풍경의 생생함을 살리려면 grazing이 더 좋아요.","hl":"rw"},{"n":67,"text":"shoulder of hill은 ridge of the hill로 바꿀 수 있어요. grazing은 feeding on grass로 풀어 쓸 수 있고, wandering down은 roaming down으로 바꿀 수 있습니다. several dozen은 dozens of로 바꿔도 같은 의미를 전달해요.","hl":"ph"},{"n":68,"text":"전체 문장은 On the green ridge of the hill rising to the west, I could see a small herd of cattle feeding, and below them on a gentler slope, dozens of chickens roaming down toward the meadow.으로 바꿀 수 있어요. shoulder of hill을 ridge of the hill로, grazing을 feeding으로 바꾼 표현이에요. 풍경의 의미는 그대로 유지됩니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Being in the spotlight \u003cspan class=\"fx\">made Tom feel tense\u003c/span>. He tried to deliver his lines as best as he could, but he could feel his voice shaking.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Being in the spotlight \u003c/div>\u003cdiv class=\"k\">스포트라이트 속에 있는 것이 \u003c/div>\u003cdiv class=\"e\">made Tom feel tense. \u003c/div>\u003cdiv class=\"k\">Tom이 긴장을 느끼게 만들었다 \u003c/div>\u003cdiv class=\"e\">He tried to deliver his lines \u003c/div>\u003cdiv class=\"k\">그는 자신의 대사를 전달하려고 노력했다 \u003c/div>\u003cdiv class=\"e\">as best as he could, \u003c/div>\u003cdiv class=\"k\">그가 할 수 있는 한 가장 잘 \u003c/div>\u003cdiv class=\"e\">but he could feel \u003c/div>\u003cdiv class=\"k\">그러나 그는 느낄 수 있었다 \u003c/div>\u003cdiv class=\"e\">his voice shaking.\u003c/div>\u003cdiv class=\"k\">자신의 목소리가 떨리고 있는 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">make + O + 동사원형\u003c/b> 구조로 Tom이 tense를 느끼게 만들었다는 뜻을 만듭니다. 이어지는 \u003cb class=\"key\">feel + O + v-ing\u003c/b>에서는 his voice가 shaking하는 진행 상황을 느꼈다는 의미를 나타냅니다.\u003c/div>","segs":[{"n":69,"text":"Being in the spotlight, 스포트라이트 속에 있는 것이. made Tom feel tense, Tom이 긴장을 느끼게 만들었다. He tried to deliver his lines, 그는 자신의 대사를 전달하려고 노력했다. as best as he could, 그가 할 수 있는 한 가장 잘. but he could feel, 그러나 그는 느낄 수 있었다. his voice shaking, 자신의 목소리가 떨리고 있는 것을","hl":"ch"},{"n":70,"text":"열두 번째 문장에는 made Tom feel tense와 could feel his voice shaking이 나옵니다. make 다음에 목적어 Tom과 동사원형 feel이 와서 Tom이 긴장을 느끼게 만들었다는 뜻이에요. feel 다음에는 his voice와 shaking이 와서 목소리가 떨리고 있는 것을 느꼈다는 진행 장면을 보여 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Being in the spotlight \u003cspan class=\"fx\">made Tom feel tense\u003c/span>. He tried to deliver his lines as best as he could, but he could feel his voice shaking.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>이 문장은 스포트라이트를 받는 것이 Tom을 긴장하게 만들었다는 뜻이에요. 대사를 잘 해 보려고 했지만 목소리가 떨리는 것을 느꼈다는 점에서 그의 불안이 잘 드러납니다. made Tom feel tense는 외부 상황이 감정을 만들었다는 느낌을 주고, feel his voice shaking은 긴장이 몸으로 나타나는 장면을 보여 줘요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">made Tom feel tense\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">caused Tom to feel tense\u003c/span>\u003cdiv class=\"w\">make 다음에는 동사원형이 오지만 cause 다음에는 to부정사가 옵니다. 뜻은 비슷하지만 caused to feel이 조금 더 격식 있는 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in the spotlight\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">under public attention\u003c/span>\u003cspan class=\"y-eq\">in the spotlight = under public attention\u003c/span>\u003cdiv class=\"w\">많은 사람의 관심을 받는 상황을 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">deliver his lines\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">say his lines\u003c/span>\u003cspan class=\"y-eq\">deliver lines = say lines\u003c/span>\u003cdiv class=\"w\">대사를 전달하거나 말한다는 뜻을 쉬운 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">feel his voice shaking\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">feel his voice tremble\u003c/span>\u003cspan class=\"y-eq\">shake = tremble\u003c/span>\u003cdiv class=\"w\">목소리가 떨린다는 뜻을 tremble로 바꾸어 비슷한 느낌을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Being in the spotlight caused Tom to feel nervous. He tried to say his lines as well as he could, but he could feel his voice trembling.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 스포트라이트를 받는 것이 Tom을 긴장하게 만들었다는 뜻이에요. 대사를 잘 해 보려고 했지만 목소리가 떨리는 것을 느꼈다는 점에서 그의 불안이 잘 드러납니다. made Tom feel tense는 외부 상황이 감정을 만들었다는 느낌을 주고, feel his voice shaking은 긴장이 몸으로 나타나는 장면을 보여 줘요.","hl":"mn"},{"n":72,"text":"made Tom feel tense는 caused Tom to feel tense로 바꿀 수 있어요. make 다음에는 동사원형이 오지만 cause 다음에는 to부정사가 와요. 뜻은 비슷하지만 caused to feel이 조금 더 격식 있는 표현입니다.","hl":"rw"},{"n":73,"text":"in the spotlight는 under public attention으로 바꿀 수 있어요. deliver his lines는 say his lines로 바꿀 수 있습니다. feel his voice shaking은 feel his voice tremble로 바꾸면 떨리는 느낌을 비슷하게 살릴 수 있어요.","hl":"ph"},{"n":74,"text":"바꿔 말하면 Being in the spotlight caused Tom to feel nervous. He tried to say his lines as well as he could, but he could feel his voice trembling.라고 할 수 있어요. made Tom feel tense를 caused Tom to feel nervous로 바꾸고, shaking을 trembling으로 바꾼 표현이에요. 긴장감은 그대로 전달됩니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">see/hear/feel + O + v-ing\u003c/b>는 목적어가 ~하고 있는 것을 보고 듣고 느낀다는 구조입니다.\u003c/li>\u003cli>\u003cb class=\"key\">have/get + O + v-ed\u003c/b>는 목적어가 ~되게 하다, ~당하다의 의미를 만듭니다.\u003c/li>\u003cli>\u003cb class=\"key\">keep + O + v-ing\u003c/b>는 목적어가 계속 ~하게 하다, \u003cb class=\"key\">make + O + 동사원형\u003c/b>은 목적어가 ~하게 만들다입니다.\u003c/li>\u003cli>목적격보어는 목적어와의 능동·수동 관계를 보고 v-ing와 v-ed를 고릅니다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 목적어 뒤에서 목적어를 보충하는 동명사와 과거분사를 배웠어요. see, hear, feel 뒤에서는 목적어가 하고 있는 동작이면 동명사, 목적어가 당하는 일이면 과거분사를 씁니다. have나 get 뒤에서도 과거분사가 오면 목적어가 어떤 일을 당하거나 완료되는 느낌을 줍니다. 목적어와 목적격보어의 관계만 잘 보면 문장이 훨씬 쉽게 이해될 거예요, 오늘도 수고했어요.","hl":"sum"}]}]});</script></body></html>
