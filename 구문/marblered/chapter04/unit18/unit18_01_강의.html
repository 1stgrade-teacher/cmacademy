ble class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">downtown</td><td class=\"m\">시내의, 도심의</td></tr><tr><td class=\"w\">area</td><td class=\"m\">지역, 구역</td></tr><tr><td class=\"w\">often</td><td class=\"m\">종종, 자주</td></tr><tr><td class=\"w\">homeless</td><td class=\"m\">노숙자의, 집이 없는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">beg</td><td class=\"m\">구걸하다</td></tr><tr><td class=\"w\">money</td><td class=\"m\">돈</td></tr><tr><td class=\"w\">all around</td><td class=\"m\">사방에, 주위에</td></tr><tr><td class=\"w\">stoplight</td><td class=\"m\">신호등</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시내 지역에서</span><span class=\"en\"><b>In the downtown area</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 종종 본다</span><span class=\"en\"><b>I often see</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">노숙자들을</span><span class=\"en\"><b>homeless people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈을 구걸하는</span><span class=\"en\"><b><span class=\"grammar-hl\">begging for money</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 신호등 주변에서</span><span class=\"en\"><b>all around the stoplights.</b></span></div></div><div class=\"lec-sent-ko\">시내에서 나는 종종 모든 신호등 주변에서 노숙자들이 돈을 구걸하고 있는 것을 본다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 도심에서 일상적으로 목격하는 상황을 제시하며 글을 시작합니다. 여기서 stoplights는 사전적으로는 &#39;정지 신호등&#39;을 의미하지만, 여기서는 차량이 잠시 멈춰 서는 &#39;교차로&#39;라는 공간적 배경을 강조합니다. 사람들이 이동을 멈추고 머무는 구체적인 지점을 언급함으로써, 구걸 행위가 일어나는 환경을 생생하게 묘사하려고 이 표현을 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">begging (현재분사): 앞에 있는 명사 homeless people을 수식하며, 그들이 &#39;돈을 구걸하고 있는&#39; 동작 상태를 나타내는 형용사적 기능이다. (명사+ing: …하는 N)</div><div class=\"lec-gr-item\">begging for money (관용표현): beg for(간청하다/구걸하다)는 ~를 구걸한다는 의미의 숙어적 결합이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">downtown</td><td class=\"m\">시내의, 도심의</td></tr><tr><td class=\"w\">area</td><td class=\"m\">지역, 구역</td></tr><tr><td class=\"w\">often</td><td class=\"m\">종종, 자주</td></tr><tr><td class=\"w\">homeless</td><td class=\"m\">노숙자의, 집이 없는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">beg</td><td class=\"m\">구걸하다</td></tr><tr><td class=\"w\">money</td><td class=\"m\">돈</td></tr><tr><td class=\"w\">all around</td><td class=\"m\">사방에, 주위에</td></tr><tr><td class=\"w\">stoplight</td><td class=\"m\">신호등</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>화자는 시내 도심의 신호등 주변에서 돈을 구걸하는 노숙인들을 자주 목격한다.</li><li>이는 현대 도시에서 흔히 볼 수 있는 사회적 풍경을 관찰자의 시점에서 서술한 것이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Homeless individuals often gather at city traffic lights, and they frequently ask passersby for money.</div>\n              <div class=\"lec-final-sum-ko\">노숙인들이 도심 신호등 근처에 자주 모여 있으며, 그들은 지나가는 사람들에게 돈을 요구한다.</div></div></div>"],"segs":[[{"audio":"./unit18_01_강의_audio/1.mp3","hl":null}],[{"audio":"./unit18_01_강의_audio/2.mp3","hl":null}],[{"audio":"./unit18_01_강의_audio/3.mp3","hl":null},{"audio":"./unit18_01_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit18_01_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit18_01_강의_audio/6.mp3","hl":null}],[{"audio":"./unit18_01_강의_audio/7.mp3","hl":"main"},{"audio":"./unit18_01_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit18_01_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit18_01_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=docum
