로 자신의 글이 공식 잡지나 정식 매체에 실리는 것은 가장 뛰어난 성적을 거둔 최우수상(First prize) 수상자에게만 주어지는 아주 특별한 기회랍니다. 쉽게 말해, 웹사이트에 이름이 올라가는 것은 &#39;온라인 전시&#39; 같은 것이라면, 잡지에 글이 실리는 것은 작가로서 &#39;정식 데뷔&#39;를 하는 것과 같은 급이 다른 보상이라고 이해하면 쉽습니다. 이처럼 보상의 범위가 결과에 따라 어떻게 달라지는지를 염두에 두고 글을 읽으면 내용을 훨씬 더 잘 파악할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01전체 수상작 공지</div><ul><li>공모전에서 입상한 모든 학생들의 에세이는 웹사이트를 통해 공개될 예정이다.</li><li>입상자(winners)들의 글은 온라인에 게시됨</li><li>사이트를 통해 수상작(essays) 확인 가능</li><li>핵심 키워드: 웹사이트 게시(posted on our website)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02최우수상 특전</div><ul><li>여러 입상자 중에서 가장 높은 점수를 받은 학생에게는 특별한 혜택이 주어진다.</li><li>오직 1등 수상자(first prize winner)에게만 부여됨</li><li>잡지(magazine)에 글이 실리는 기회 제공</li><li>핵심 키워드: 잡지 게재(published in our magazine)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">winner</td><td class=\"m\">수상자</td></tr><tr><td class=\"w\">essay</td><td class=\"m\">에세이, 과제물</td></tr><tr><td class=\"w\">post</td><td class=\"m\">게시하다</td></tr><tr><td class=\"w\">website</td><td class=\"m\">웹사이트</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">among</td><td class=\"m\">~ 중에서</td></tr><tr><td class=\"w\">prize</td><td class=\"m\">상</td></tr><tr><td class=\"w\">publish</td><td class=\"m\">출판하다, 게재하다</td></tr><tr><td class=\"w\">magazine</td><td class=\"m\">잡지</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">입상자들은</span><span class=\"en\"><b>Winners</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 에세이를</span><span class=\"en\"><b>will <span class=\"grammar-hl\">have their essays</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">게재되게 할 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">posted</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 웹사이트에</span><span class=\"en\"><b>on our website.</b></span></div></div><div class=\"lec-sent-ko\">입상자들은 그들의 에세이가 우리의 웹사이트에 게재되게 할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장은 전체 수상자에게 주어지는 공통적인 혜택을 설명합니다. have는 사역동사로 쓰여 &#39;~가 ~한 상태가 되게 하다&#39;라는 뜻인데, 여기서는 에세이가 웹사이트에 올라가는 결과적인 상태를 강조합니다. 또한, &#39;게시하다&#39;라는 뜻의 posted를 사용하여 온라인 공간에 글을 올리는 구체적인 상황을 잘 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have their essays posted 5형식(SVOC) 구조: have + O + O.C.(p.p.) 구조입니다. have는 사역동사로 쓰여 &#39;O가 O.C.되게 시키다/하게 하다&#39;는 의미를 가집니다. 여기서 essays(O)와 posted(p.p.)의 관계가 수동이므로 과거분사 posted가 목적격 보어로 사용되었습니다.</div><div class=\"lec-gr-item\">posted (과거분사): 목적격 보어 자리에 쓰여, 앞의 목적어인 essays의 상태를 설명합니다. essays(에세이)는 게시되는 대상이므로 수동적 의미의 과거분사 posted를 썼습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">winner</td><td class=\"m\">수상자</td></tr><tr><td class=\"w\">essay</td><td class=\"m\">에세이, 과제물</td></tr><tr><td class=\"w\">post</td><td class=\"m\">게시하다</td></tr><tr><td class=\"w\">website</td><td class=\"m\">웹사이트</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">입상자들 중에서</span><span class=\"en\"><b><span class=\"grammar-hl\">Among the winners</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오직 1등 입상자만이</span><span class=\"en\"><b>only the first prize winner</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 에세이를</span><span class=\"en\"><b>will <span class=\"grammar-hl\">have his or her essay</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실리게 할 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">published</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 잡지에</span><span class=\"en\"><b>in our magazine.</b></span></div></div><div class=\"lec-sent-ko\">입상자들 중에서 오직 1등 입상자만이 자신의 에세이가 우리의 잡지에 실리게 할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞 문장의 일반적인 수상자 혜택에서 &#39;1등&#39;이라는 특별한 대상을 좁혀 더 큰 혜택을 소개합니다. published는 단순히 글을 올리는 것을 넘어, 잡지라는 오프라인 매체에 공식적으로 인쇄되어 세상에 나가는 과정을 뜻합니다. 필자는 웹사이트 게시와 잡지 출판이라는 대비를 통해 1등에게 주어지는 더 큰 영예를 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Among the winners (도치): 문장 성분이 아닌 부사구(전치사구)가 문두로 이동한 도치 구문입니다. 장소나 위치를 나타내는 전치사구가 앞으로 오면서 주어와 동사의 강조를 돕거나 문장의 흐름을 자연스럽게 연결합니다.</div><div class=\"lec-gr-item\">have his or her essay published 5형식(SVOC) 구조: have + O + O.C.(p.p.) 구조입니다. 사역동사 have를 사용하여 &#39;O가 O.C.되게 하다&#39;는 의미를 나타냅니다. essay(O)와 publish(출판하다)의 관계가 수동이므로 목적격 보어 자리에 과거분사 published가 쓰였습니다.</div><div class=\"lec-gr-item\">published (과거분사): 목적격 보어 자리에서 수동의 의미로 쓰여 목적어인 essay를 수식/설명합니다. essay는 출판되는 대상이므로 과거분사를 사용했습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">winner</td><td class=\"m\">수상자</td></tr><tr><td class=\"w\">essay</td><td class=\"m\">에세이, 과제물</td></tr><tr><td class=\"w\">among</td><td class=\"m\">~ 중에서</td></tr><tr><td class=\"w\">prize</td><td class=\"m\">상</td></tr><tr><td class=\"w\">publish</td><td class=\"m\">출판하다, 게재하다</td></tr><tr><td class=\"w\">magazine</td><td class=\"m\">잡지</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>모든 수상자의 에세이는 웹사이트에 게시된다.</li><li>하지만 1등 수상자에게는 잡지에 에세이를 실어주는 추가적인 혜택이 주어진다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Winning essays are posted on the website, while only the first prize entry is published in the magazine.</div>\n              <div class=\"lec-final-sum-ko\">수상작들은 웹사이트에 게시되지만, 최우수상작만 잡지에 출판된다.</div></div></div>"],"segs":[[{"audio":"./unit18_10_강의_audio/1.mp3","hl":null}],[{"audio":"./unit18_10_강의_audio/2.mp3","hl":null}],[{"audio":"./unit18_10_강의_audio/3.mp3","hl":null},{"audio":"./unit18_10_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit18_10_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit18_10_강의_audio/6.mp3","hl":null}],[{"audio":"./unit18_10_강의_audio/7.mp3","hl":"main"},{"audio":"./unit18_10_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit18_10_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit18_10_강의_audio/10.mp3","hl":"main"},{"audio":"./unit18_10_강의_audio/11.mp3","hl":"meaning"},{"audio":"./unit18_10_강의_audio/12.mp3","hl":"grammar"}],[{"audio":"./unit18_10_강의_audio/13.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260)
