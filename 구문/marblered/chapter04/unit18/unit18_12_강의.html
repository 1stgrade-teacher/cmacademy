A8fK2cjopxnvyR0Azz05yeK3w/CuT4evSxFKjV9rRnGpBuvUkoyhKLi+Vuzs0ld7t7psipnGNrU50pzjy1E4StGK916PW2l1fva/lqiAAYHT37npnGehx0IH4kmnbc/dAyRgenTjp2/pSqh4wrEE9lPpn3/AMegOcVNDDI8kaCNyzuuAFZiSXC9uxPA6YyAMDGPpI6yTtpe7v2TTevTb111PLk7pq/TRvS1lulr1s7+R//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Nervous Reality of Being Under the Spotlight<small>무대 위에서 느끼는 긴장된 현실</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 많은 사람 앞에서 공연을 하거나 발표를 할 때 느끼는 무대 공포증(stage fright)이라는 현상을 다루고 있어요. 무대 공포증은 중요한 상황에서 누구나 겪을 수 있는 심리적 긴장(psychological tension)으로, 우리 몸의 자율신경계가 &#39;투쟁-도피 반응(fight-or-flight response)&#39;을 일으키면서 나타나게 돼요. 마치 맹수를 만났을 때처럼 심장이 빨리 뛰고 목소리가 떨리는 등 신체적 변화(physical changes)가 생기는 것인데, 이는 우리 뇌가 그 순간을 아주 위험한 상황으로 인식하고 방어 태세를 갖추기 때문에 발생하는 자연스러운 현상이랍니다. 유명한 배우나 가수들도 무대 뒤에서 겪는 아주 흔한 일이며, 객석의 시선(spotlight)이 집중되는 상황에서 겪는 이러한 불안감은 누구나 한 번쯤 마주할 수 있는 감정이라는 점을 기억하면 도움이 될 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01무대 위의 긴장감</div><ul><li>스포트라이트를 받는 상황은 톰에게 큰 심리적 압박감을 주었다.</li><li>조명을 받는 상황(in the spotlight)에 처함</li><li>긴장함(tense)을 느끼는 톰의 심리 상태</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02연기 시도와 어려움</div><ul><li>톰은 최선을 다해 대사를 전달하려 노력했다.</li><li>연기를 위해 대사(lines)를 전달하려 시도</li><li>할 수 있는 최선(as best as he could)을 다함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03신체적 증상</div><ul><li>긴장 때문에 톰은 자신의 목소리가 떨리는 것을 느꼈다.</li><li>긴장으로 인해 목소리(voice)가 떨림(shaking)</li><li>의지대로 통제되지 않는 신체적 반응</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spotlight</td><td class=\"m\">주목, 관심</td></tr><tr><td class=\"w\">tense</td><td class=\"m\">긴장한</td></tr><tr><td class=\"w\">deliver</td><td class=\"m\">(연설, 대사 등을) 하다, 전하다</td></tr><tr><td class=\"w\">line</td><td class=\"m\">(연극 등의) 대사</td></tr><tr><td class=\"w\">as best as one can</td><td class=\"m\">가능한 한 최선을 다해</td></tr><tr><td class=\"w\">shake</td><td class=\"m\">떨리다, 흔들리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스포트라이트 속에 있는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Being in the spotlight</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Tom을 만들었다</span><span class=\"en\"><b><span class=\"grammar-hl\">made Tom</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">긴장을 느끼게</span><span class=\"en\"><b><span class=\"grammar-hl\">feel</span> tense.</b></span></div></div><div class=\"lec-sent-ko\">스포트라이트 속에 있는 것은 Tom이 긴장을 느끼게 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 spotlight는 사전적으로는 &#39;무대 위의 조명&#39;을 뜻하지만, 문맥상으로는 &#39;사람들의 시선이 집중되는 상황&#39;을 의미합니다. 단순히 빛을 받는 물리적 상태가 아니라, 모두가 자신을 지켜보고 있다는 심리적 압박감을 강조하기 위해 이 단어를 선택했습니다. 이 문장은 톰이 처한 상황과 그로 인한 그의 심리적 상태를 제시하며 글의 도입부를 엽니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Being in the spotlight (동명사): -ing가 문장에서 주어 역할을 수행하고 있다. &#39;Being&#39;이 이끄는 구 전체가 문장의 주어이며, &#39;in the spotlight&#39;는 보어 역할을 한다.</div><div class=\"lec-gr-item\">made Tom feel 5형식(SVOC) 구조: &#39;make + O(Tom) + C(feel)&#39; 형태의 사역동사 구문이다. 목적어인 Tom이 보어인 feel(동사원형)을 하도록 만들었다는 의미를 가진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spotlight</td><td class=\"m\">주목, 관심</td></tr><tr><td class=\"w\">tense</td><td class=\"m\">긴장한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 노력했다</span><span class=\"en\"><b>He tried</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 대사를 전달하려고</span><span class=\"en\"><b><span class=\"grammar-hl\">to deliver</span> his lines</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 할 수 있는 한 가장 잘</span><span class=\"en\"><b><span class=\"grammar-hl\">as best as he could</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 그는 느낄 수 있었다</span><span class=\"en\"><b>but he could <span class=\"grammar-hl\">feel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 목소리가</span><span class=\"en\"><b><span class=\"grammar-hl\">his voice</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">떨리고 있는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">shaking</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 자신의 대사를 그가 할 수 있는 한 가장 잘 전달하려고 노력했지만, 그는 자신의 목소리가 떨리고 있는 것을 느낄 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 &#39;긴장된 상황&#39;이 구체적으로 어떤 결과(목소리 떨림)를 낳았는지 보여주는 인과관계 문장입니다. deliver는 보통 &#39;배달하다&#39;라는 뜻이지만, 여기서는 연극이나 발표에서 &#39;대사를 전달하다&#39;라는 의미로 쓰였습니다. 자신의 감정을 통제하려는 노력(앞부분)과 그럼에도 불구하고 드러나는 신체적 반응(뒷부분)을 but으로 연결하여 주인공의 불안함을 더욱 효과적으로 나타냈습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to deliver (to부정사): try의 목적어 역할을 하는 명사적 용법의 to부정사 구문이다.</div><div class=\"lec-gr-item\">as best as he could (관용표현): &#39;as ~ as possible(가능한 한 ~하게)&#39;의 의미를 담은 비교 구문으로, &#39;그가 할 수 있는 최선만큼&#39;이라는 부사적 역할을 한다.</div><div class=\"lec-gr-item\">feel his voice shaking 5형식(SVOC) 구조: &#39;feel + O(his voice) + C(shaking)&#39;의 구조로, 지각동사 feel 뒤에 목적어인 voice가 흔들리는 상태(분사)를 나타내는 현재분사가 목적보어로 쓰였다.</div><div class=\"lec-gr-item\">shaking (현재분사): 그의 목소리(voice)가 스스로 떨리고 있는 능동적 상태를 묘사하는 형용사적 보어로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">deliver</td><td class=\"m\">(연설, 대사 등을) 하다, 전하다</td></tr><tr><td class=\"w\">line</td><td class=\"m\">(연극 등의) 대사</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들의 주목을 받는 상황 속에서 톰은 긴장을 느낀다.</li><li>톰은 평정심을 유지하며 대사를 하려 애쓰지만, 긴장감은 떨리는 목소리로 드러나고 만다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Tom feels deeply anxious under the spotlight, yet he tries his best to deliver his lines despite his shaking voice.</div>\n              <div class=\"lec-final-sum-ko\">톰은 조명을 받는 상황에서 심한 불안을 느끼지만, 떨리는 목소리에도 불구하고 대사를 전달하기 위해 최선을 다한다.</div></div></div>"],"segs":[[{"audio":"./unit18_12_강의_audio/1.mp3","hl":null}],[{"audio":"./unit18_12_강의_audio/2.mp3","hl":null}],[{"audio":"./unit18_12_강의_audio/3.mp3","hl":null},{"audio":"./unit18_12_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit18_12_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit18_12_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit18_12_강의_audio/7.mp3","hl":null}],[{"audio":"./unit18_12_강의_audio/8.mp3","hl":"main"},{"audio":"./unit18_12_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit18_12_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit18_12_강의_audio/11.mp3","hl":"main"},{"audio":"./unit18_12_강의_audio/12.mp3","hl":"meaning"},{"audio":"./unit18_12_강의_audio/13.mp3","hl":"grammar"}],[{"audio":"./unit18_12_강의_audio/14.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight
