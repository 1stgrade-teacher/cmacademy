, 혹은 도로 위에서 어떤 선택을 내릴지에 집중해서 읽어보면 글의 내용을 훨씬 더 깊이 있게 이해할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 인지</div><ul><li>집으로 돌아가던 길에 도로 옆에 정차된 차량을 보게 됨.</li><li>운전 중(driving home)인 상황</li><li>길가에 멈춰 있는(pulled over) 차를 목격함</li><li>핵심 키워드: 정차(pulled over)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02사건의 발생</div><ul><li>평소와 다름없던 일상적인 주행 중에 예상치 못한 상황을 마주함.</li><li>도로 옆(side of the road)에 위치한 대상 확인</li><li>차량의 상태에 대한 관찰 기록</li><li>핵심 키워드: 운전(driving)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pull over</td><td class=\"m\">길가에 차를 대다</td></tr><tr><td class=\"w\">side</td><td class=\"m\">측면, 길가</td></tr><tr><td class=\"w\">road</td><td class=\"m\">도로</td></tr><tr><td class=\"w\">drive</td><td class=\"m\">운전하다</td></tr><tr><td class=\"w\">home</td><td class=\"m\">집으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 자동차를 보았다</span><span class=\"en\"><b><span class=\"grammar-hl\">saw a car</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">길 한쪽에 세워진</span><span class=\"en\"><b><span class=\"grammar-hl\">pulled over</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">길가에</span><span class=\"en\"><b>on the side of the road</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 운전하는 동안에</span><span class=\"en\"><b><span class=\"grammar-hl\">while I was driving</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집으로</span><span class=\"en\"><b><span class=\"grammar-hl\">home</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 집으로 운전하는 동안에 어떤 자동차가 길 한쪽에 세워진 것을 보았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 필자가 귀가하던 중 길가에 정차된 차를 목격했다는 상황을 설명하는 문장입니다. 여기서 pulled over는 사전적으로는 &#39;차를 길가에 대다&#39;라는 뜻입니다. 여기서는 단순히 서 있는 상태가 아니라, 운전 중이던 차가 어떤 이유(고장이나 사고 등)로 인해 길가로 이동해 멈춰 있는 상황을 구체적으로 묘사하기 위해 이 표현을 썼습니다. 이는 뒤에 이어질 글의 상황(도움을 줄지 말지 결정하는 상황 등)을 암시하는 도입부 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">saw a car pulled over 5형식(SVOC) 구조: see(지각동사) + O(a car) + OC(p.p.)의 구조로, 목적어와 목적격보어의 관계가 수동이므로 과거분사 pulled가 쓰였다.</div><div class=\"lec-gr-item\">pulled over (과거분사(형용사)): pulled가 앞의 a car를 수식하며, &#39;길가에 세워진&#39;이라는 상태를 나타낸다. (p.p. + N ≈ N that is/was p.p. 형태)</div><div class=\"lec-gr-item\">while I was driving home (현재진행): while + S + be동사(was) + -ing(driving) 구조로, 과거의 특정 시점에 진행 중이던 동작을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">side</td><td class=\"m\">측면, 길가</td></tr><tr><td class=\"w\">road</td><td class=\"m\">도로</td></tr><tr><td class=\"w\">home</td><td class=\"m\">집으로</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>집으로 향하던 중 길가에 멈춰 선 차량을 발견했다.</li><li>해당 장면을 목격한 상황을 통해 앞으로 일어날 사건을 예고하고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The narrator noticed a car pulled over on the road, as they were driving back to their home.</div>\n              <div class=\"lec-final-sum-ko\">화자는 집으로 차를 몰고 가던 중에, 길가에 정차된 차량을 발견했다.</div></div></div>"],"segs":[[{"audio":"./unit18_02_강의_audio/1.mp3","hl":null}],[{"audio":"./unit18_02_강의_audio/2.mp3","hl":null}],[{"audio":"./unit18_02_강의_audio/3.mp3","hl":null},{"audio":"./unit18_02_강의_audio/4.mp3","hl
