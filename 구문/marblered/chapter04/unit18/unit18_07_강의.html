-0\"><div class=\"lec-stage-head\">01상황 발생</div><ul><li>늦은 밤에 들려온 개 짖는 소리로 인해 주인공이 반응했다.</li><li>아주 사납게(fiercely) 짖는 개들의 소리</li><li>늦은 밤(late at night)이라는 시간적 배경</li><li>핵심 키워드: 개 짖는 소리(dogs barking)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02주인공의 행동</div><ul><li>무슨 일인지 확인하기 위해 밖으로 나갔다.</li><li>상황 파악을 위한 외부 이동(came outside)</li><li>소리의 원인(what was going on)을 궁금해함</li><li>핵심 키워드: 확인(see what was going on)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hear</td><td class=\"m\">듣다</td></tr><tr><td class=\"w\">bark</td><td class=\"m\">짖다</td></tr><tr><td class=\"w\">fiercely</td><td class=\"m\">사납게</td></tr><tr><td class=\"w\">late</td><td class=\"m\">늦은</td></tr><tr><td class=\"w\">outside</td><td class=\"m\">밖으로</td></tr><tr><td class=\"w\">go on</td><td class=\"m\">일어나다, 벌어지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 들었다</span><span class=\"en\"><b>I heard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개들이</span><span class=\"en\"><b><span class=\"grammar-hl\">the dogs</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사납게 짖는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">barking</span> fiercely</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밤늦게,</span><span class=\"en\"><b>late at night,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 나는 밖으로 나왔다</span><span class=\"en\"><b>so I came outside</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무슨 일이 일어나고 있는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">what was going on</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 늦은 밤에 개들이 사납게 짖는 것을 들었고, 그래서 나는 무슨 일이 일어나고 있는지를 보기 위해서 밖으로 나갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 밤중에 소음을 듣고 상황을 파악하기 위해 행동을 취하는 인과관계를 보여줍니다. 여기서 going on은 사전적으로는 &#39;계속되다&#39;라는 뜻이지만, 여기서는 &#39;어떤 일이 벌어지고 있다&#39;는 진행 상황을 의미합니다. 단순히 &#39;무슨 일이 있나&#39;라고 묻는 것보다, 현재 상황의 흐름이나 사건의 전개를 강조하기 위해 이 관용구를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the dogs barking (현재분사): barking이 the dogs를 수식하는 구조로, &#39;개들이 짖고 있는(동작/상태) 상태&#39;를 의미하는 형용사적 기능을 함. (N + -ing ≈ N that is -ing)</div><div class=\"lec-gr-item\">to see (to부정사): 부사적 용법(목적)으로 쓰여, &#39;밖으로 나온&#39; 이유인 &#39;~하기 위해서&#39;를 나타냄.</div><div class=\"lec-gr-item\">what was going on (간접의문문): &#39;무슨 일이 일어나고 있는지&#39;라는 의미의 명사절로, see의 목적어 역할을 함. (의문사 what + 주어 + 동사 구조)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hear</td><td class=\"m\">듣다</td></tr><tr><td class=\"w\">bark</td><td class=\"m\">짖다</td></tr><tr><td class=\"w\">fiercely</td><td class=\"m\">사납게</td></tr><tr><td class=\"w\">late</td><td class=\"m\">늦은</td></tr><tr><td class=\"w\">outside</td><td class=\"m\">밖으로</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>밤늦게 개들이 사납게 짖는 소리에 화자가 놀라 밖으로 나갔다.</li><li>소음의 원인을 직접 확인하려는 화자의 행동을 다루고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The speaker went outside to investigate the cause of the dogs&#39; fierce barking, as they heard the noise late at night.</div>\n              <div class=\"lec-final-sum-ko\">화자는 밤늦게 개들이 사납게 짖는 소리를 들었기에, 그 원인을 확인하려고 밖으로 나갔다.</div></div></div>"],"segs":[[{"audio":"./unit18_07_강의_audio/1.mp3","hl":null}],[{"audio":".
