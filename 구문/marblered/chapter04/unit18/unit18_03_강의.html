class=\"w\">front desk</td><td class=\"m\">안내 데스크, 접수처</td></tr><tr><td class=\"w\">clerk</td><td class=\"m\">직원, 사무원</td></tr><tr><td class=\"w\">keep</td><td class=\"m\">계속 ~하게 하다, 유지하다</td></tr><tr><td class=\"w\">wait</td><td class=\"m\">기다리다</td></tr><tr><td class=\"w\">check in</td><td class=\"m\">(호텔 등에) 투숙 수속을 밟다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안내 데스크 직원은</span><span class=\"en\"><b>The front desk clerk</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">통화 중이었다</span><span class=\"en\"><b>was on the phone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리를 기다리게 했다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">kept us waiting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">체크인하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to check in</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오랫동안</span><span class=\"en\"><b>for a long time.</b></span></div></div><div class=\"lec-sent-ko\">안내 데스크 직원은 통화중이었고 우리가 체크인하는 것을 오랫동안 계속 기다리게 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 호텔이나 숙소의 안내 직원인 front desk clerk이 손님을 맞이하기보다 전화 업무에 매몰되어 있어, 방문객들이 체크인을 하지 못하고 지체되는 상황을 설명하고 있습니다. 여기서 kept는 &#39;유지했다&#39;라는 뜻을 넘어, 직원이 의도치 않았더라도 결과적으로 손님들을 &#39;계속 대기 상태에 묶어두었다&#39;는 뉘앙스로, 서비스가 원활하지 않았던 불만을 강조하기 위해 선택된 동사입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">kept us waiting 5형식(SVOC) 구조: &#39;keep + 목적어(us) + 목적격보어(waiting)&#39; 형태입니다. 목적어인 우리가 어떤 상태를 유지하게 한다는 구조이며, 목적격보어 자리에 현재분사(waiting)를 사용하여 &#39;계속 ~하게 만들다&#39;라는 의미를 형성합니다.</div><div class=\"lec-gr-item\">waiting (현재분사): 위 5형식 구조에서 목적어(us)가 하는 능동적인 동작을 보충 설명하며, 목적격보어 역할을 수행합니다.</div><div class=\"lec-gr-item\">to check in (to부정사): 앞의 목적격보어인 waiting(기다리는 상태)의 목적을 나타내는 부사적 용법으로, &#39;체크인하기 위해서&#39;라고 해석되는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">front desk</td><td class=\"m\">안내 데스크, 접수처</td></tr><tr><td class=\"w\">clerk</td><td class=\"m\">직원, 사무원</td></tr><tr><td class=\"w\">wait</td><td class=\"m\">기다리다</td></tr><tr><td class=\"w\">check in</td><td class=\"m\">(호텔 등에) 투숙 수속을 밟다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>호텔 프런트 직원이 전화 업무를 우선하느라 손님들의 체크인 시간을 지체시켰다.</li><li>서비스 제공자의 업무 처리로 인해 고객이 불편을 겪는 상황을 나타낸다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The front desk clerk kept the guests waiting for a long time, while they were busy talking on the phone.</div>\n              <div class=\"lec-final-sum-ko\">프론트 데스크 직원은 전화 통화를 하느라 바빠서, 손님들을 오랫동안 기다리게 했다.</div></div></div>"],"segs":[[{"audio":"./unit18_03_강의_audio/1.mp3","hl":null}],[{"audio":"./unit18_03_강의_audio/2.mp3","hl":null}],[{"audio":"./unit18_03_강의_audio/3.mp3","hl":null},{"audio":"./unit18_03_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit18_03_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit18_03_강의_audio/6.mp3","hl":null}],[{"audio":"./unit18_03_강의_audio/7.mp3","hl":"main"},{"audio":"./unit18_03_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit18_03_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit18_03_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrolle
