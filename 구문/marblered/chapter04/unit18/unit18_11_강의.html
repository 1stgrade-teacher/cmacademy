u/pRuUgcgg/55/lQHn939fcO/z6fof/AK9J+nX/APX/ACJ60gZTyCO/cduoP04z6cUuR6jkAj3+nr2/MetAB3/Mfy79umPr+FL/AF/z/n/Cm7l+6GG4g4GQScdTx15OT9eaaXA2/MDng8g5I9Ocn3+n4E3AeOOv5/U8f57cDml/z+X/ANem7l4+Yc5xz1x1x9O+Mj8eKQuOxGfqD7HOM9Mg9v6UAPopNy+o79x26/l39KM+pHt2/rSvfb+unXsAtJ14I/8Ar/h7e9JuXjn17jHy9Sfp19O/pS5HqPzFMA5PTjvyOnt9f5fllfXt/n8P6f1pgdcZyAOR+XXgZxjv6d+tG9fUD0BIH/6h6E/4ZAH0nPOOT7/y/wAM0m4ZxkZIPf06jHqO47UuR1yKP1/EBaOf8/5/zzx0pAwOORyCRyOg6/lnn070ZGCcjA5Jz+Pb/JoD+vy6f1+Ifh/np6+n+c0Hn8OmfX1oyD3Bz79fX8qDgAn0BP5c/wBOnegD/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">A Peaceful Scene in the Countryside<small>시골의 평화로운 풍경</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 전원적인 풍경을 묘사하고 있는데, 여기서 등장하는 방목(Grazing)이라는 개념을 이해하면 좋습니다. 방목은 가축이 울타리 안에 갇혀 사료를 먹는 것이 아니라, 넓은 초지에 풀려나 스스로 풀을 뜯어 먹으며 자유롭게 움직이는 사육 방식을 말해요. 마치 우리가 학교 수업 시간 내내 교실에만 있다가 점심시간에 운동장을 자유롭게 누비는 것과 비슷하다고 보면 됩니다. 이러한 방목 환경은 가축의 스트레스(Stress)를 낮춰주고, 자연스러운 생태계의 흐름 속에 동물이 머물게 함으로써 건강하게 자라도록 돕는 역할을 한답니다. 지문을 읽을 때 가축들이 자연스럽게 풀밭을 거니는 모습을 상상해 보면, 글 속의 평화로운 분위기를 훨씬 더 생생하게 느낄 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01배경 설정</div><ul><li>서쪽으로 솟아오른 언덕의 초록빛 풍경을 묘사하며 시선을 이동함.</li><li>푸른 언덕(green shoulder of hill)이 서쪽에 위치함</li><li>화자의 시선이 낮은 곳에서 높은 곳으로 향함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02가축들의 모습</div><ul><li>언덕 위쪽에서는 소들이 여유롭게 풀을 뜯고 있음.</li><li>언덕 위에서 풀을 뜯고 있는 소들(cattle grazing)</li><li>소들이 위치한 곳: 언덕의 비탈(hill)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03닭들의 이동</div><ul><li>완만한 비탈 아래쪽에서 닭들이 초원을 향해 내려가고 있음.</li><li>소보다 낮은 완만한 경사면(gentler slope)</li><li>초원(meadow)을 향해 움직이는 수십 마리의 닭들</li><li>핵심 키워드: 닭(chickens), 초원(meadow)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shoulder</td><td class=\"m\">산비탈, 산의 어깨 모양 부분</td></tr><tr><td class=\"w\">rise</td><td class=\"m\">솟아오르다, 높이 솟다</td></tr><tr><td class=\"w\">cattle</td><td class=\"m\">소(떼)</td></tr><tr><td class=\"w\">graze</td><td class=\"m\">풀을 뜯다</td></tr><tr><td class=\"w\">gentle</td><td class=\"m\">완만한, 경사가 심하지 않은</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">slope</td><td class=\"m\">경사면, 비탈</td></tr><tr><td class=\"w\">dozen</td><td class=\"m\">12개, 다수</td></tr><tr><td class=\"w\">wander</td><td class=\"m\">거닐다, 돌아다니다</td></tr><tr><td class=\"w\">meadow</td><td class=\"m\">목초지, 초원</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">서쪽으로 솟은 언덕의 푸르고 푸른 등성이 위에,</span><span class=\"en\"><b><span class=\"grammar-hl\">Up on the green, green shoulder of hill</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서쪽으로 솟은</span><span class=\"en\"><b><span class=\"grammar-hl\">rising to the west</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 볼 수 있었다</span><span class=\"en\"><b>I could see</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 소떼 무리가</span><span class=\"en\"><b><span class=\"grammar-hl\">a small group of cattle</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">풀을 뜯고 있는 것과,</span><span class=\"en\"><b><span class=\"grammar-hl\">grazing</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고,</span><span class=\"en\"><b>and,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소 떼보다 아래쪽에 보다 완만한 비탈길에</span><span class=\"en\"><b>below them on a gentler slope,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수십 마리의 닭들이</span><span class=\"en\"><b>several dozen chickens</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아래로 목초지까지 돌아다니고 있는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">wandering</span> down to the meadow.</b></span></div></div><div class=\"lec-sent-ko\">서쪽으로 솟은 언덕의 푸르고 푸른 등성이 위에, 나는 작은 소떼 무리가 풀을 뜯고 있는 것과, 소 떼보다 아래쪽에 보다 완만한 비탈길에 수십 마리의 닭들이 아래로 목초지까지 돌아다니고 있는 것을 볼 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 언덕과 그 아래 풍경을 관찰하며 시야를 위에서 아래로 이동시키고 있습니다. 여기서 shoulder는 사전적으로 &#39;어깨&#39;를 의미하지만, 여기서는 산의 한쪽 옆면이나 경사면을 사람의 어깨 모양에 비유한 것입니다. 지형의 모습을 인간의 신체에 빗대어 독자가 언덕의 완만한 굴곡과 입체감을 더 생생하게 상상하도록 의도적으로 선택한 표현입니다. 이 문장은 이어질 풍경 묘사의 시작점으로, 평화로운 시골 전원 풍경을 설정하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Up on the green, green shoulder of hill rising to the west (도치): 장소의 부사구(Up on the green, green shoulder of hill)가 문두로 나오면서 주어와 동사의 위치가 바뀌는 도치 구문입니다. 본래 문장은 &#39;I could see a small group of cattle grazing up on the...&#39;</div><div class=\"lec-gr-item\">rising to the west (현재분사): &#39;rising&#39;이 앞의 &#39;hill&#39;을 수식하는 형용사적 기능의 현재분사구입니다. &#39;hill&#39;이 서쪽을 향해 솟아 있는 상태를 나타내며, &#39;hill that rises to the west&#39;로 이해할 수 있습니다.</div><div class=\"lec-gr-item\">a small group of cattle grazing 5형식(SVOC) 구조: &#39;see(지각동사) + O(a small group of cattle) + OC(grazing)&#39;의 구조입니다. 목적어인 소들이 풀을 뜯고 있는 능동적 동작을 현재분사(grazing)로 보충 설명하고 있습니다.</div><div class=\"lec-gr-item\">grazing (현재분사): 지각동사 see의 목적격 보어 자리에 쓰여, 목적어인 cattle이 직접 풀을 뜯고 있는 동작을 나타냅니다.</div><div class=\"lec-gr-item\">wandering (현재분사): 앞서 언급된 지각동사 &#39;see&#39;의 영향을 받는 두 번째 목적격 보어로, &#39;chickens&#39;가 스스로 돌아다니는 능동적 동작을 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shoulder</td><td class=\"m\">산비탈, 산의 어깨 모양 부분</td></tr><tr><td class=\"w\">cattle</td><td class=\"m\">소(떼)</td></tr><tr><td class=\"w\">gentle</td><td class=\"m\">완만한, 경사가 심하지 않은</td></tr><tr><td class=\"w\">slope</td><td class=\"m\">경사면, 비탈</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dozen</td><td class=\"m\">12개, 다수</td></tr><tr><td class=\"w\">wander</td><td class=\"m\">거닐다, 돌아다니다</td></tr><tr><td class=\"w\">meadow</td><td class=\"m\">목초지, 초원</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>서쪽 언덕 위에서 풀을 뜯는 소들을 발견했다.</li><li>언덕 아래 완만한 경사면에는 수십 마리의 닭들이 초원을 향해 걸어가고 있다.</li><li>평화롭고 한가로운 시골 마을의 풍경을 묘사하고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The narrator watches a group of cattle grazing on a hill while several chickens roam down toward the meadow below.</div>\n              <div class=\"lec-final-sum-ko\">화자는 언덕에서 풀을 뜯는 소 떼를 바라보며, 아래쪽 초원을 향해 거니는 닭들을 관찰한다.</div></div></div>"],"segs":[[{"audio":"./unit18_11_강의_audio/1.mp3","hl":null}],[{"audio":"./unit18_11_강의_audio/2.mp3","hl":null}],[{"audio":"./unit18_11_강의_audio/3.mp3","hl":null},{"audio":"./unit18_11_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit18_11_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit18_11_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit18_11_강의_audio/7.mp3","hl":null}],[{"audio":"./unit18_11_강의_audio/8.mp3","hl":"main"},{"audio":"./unit18_11_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit18_11_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit18_11_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p
