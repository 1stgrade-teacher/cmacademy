 이 글도 바로 그런 &#39;사회적 평가&#39;의 단면을 보여주고 있어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01배경 설정</div><ul><li>글쓴이는 오랫동안 판사와 알고 지낸 관계임을 밝힌다.</li><li>판사와의 장기간 교류 (long time)</li><li>글쓴이와 판사 사이의 친분 관계</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02평판 관찰</div><ul><li>글쓴이는 주변 사람들로부터 판사에 대한 나쁜 이야기를 들은 적이 없다.</li><li>타인의 험담 부재 (spoken ill of)</li><li>주변 사람들에게서 얻은 판사에 대한 평가</li><li>평판의 긍정적인 측면 강조</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결론</div><ul><li>판사는 주변 사람들에게 오랫동안 좋은 평가를 받아온 인물이다.</li><li>인격에 대한 긍정적인 증거</li><li>핵심 키워드: 평판(reputation), 험담(spoken ill of)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">judge</td><td class=\"m\">판사</td></tr><tr><td class=\"w\">know</td><td class=\"m\">알다</td></tr><tr><td class=\"w\">for a long time</td><td class=\"m\">오랫동안</td></tr><tr><td class=\"w\">speak ill of</td><td class=\"m\">~을 헐뜯다, 비난하다</td></tr><tr><td class=\"w\">other</td><td class=\"m\">다른 사람들</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 내가 알아 왔지만</span><span class=\"en\"><b><span class=\"grammar-hl\">Although I have known</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 재판관을</span><span class=\"en\"><b><span class=\"grammar-hl\">the judge</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오랫동안</span><span class=\"en\"><b>for a long time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 전혀 듣지 못했다</span><span class=\"en\"><b>I never <span class=\"grammar-hl\">heard</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가</span><span class=\"en\"><b><span class=\"grammar-hl\">him</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나쁘게 말해지는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">spoken ill of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">타인에 의해서</span><span class=\"en\"><b>by others.</b></span></div></div><div class=\"lec-sent-ko\">비록 내가 그 재판관을 오랫동안 알아 왔지만, 나는 그가 타인에 의해서 나쁘게 말해지는 것을 전혀 듣지 못했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이가 판사를 오랫동안 개인적으로 알고 지냈다는 사실과, 그럼에도 불구하고 주변에서 그에 대한 험담을 한 번도 듣지 못했다는 사실을 연결하고 있습니다. spoken ill of는 사전적으로 &#39;나쁘게 말해지다&#39;라는 뜻인데, 여기서는 &#39;누군가를 비난하거나 험담하다&#39;를 수동태로 표현한 것입니다. 필자는 판사의 인품이 매우 훌륭하여 주변 사람들에게 전혀 비난을 받지 않는다는 점을 강조하기 위해, 남들의 평가를 듣는 구조를 사용하여 그의 도덕성을 객관적으로 증명하려 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Although I have known the judge (분사구문): Although 뒤에 주어(I)와 동사(have known)가 이어지는 부사절 구조입니다. &#39;Although&#39;는 접속사로 &#39;비록 ~일지라도&#39;라는 양보의 의미를 가집니다.</div><div class=\"lec-gr-item\">heard him spoken ill of 5형식(SVOC) 구조: hear(지각동사) + 목적어(him) + 목적보어(spoken ill of) 형태입니다. speak ill of(험담하다)라는 동사구의 수동 형태인 spoken ill of이 목적보어 자리에 쓰여, 그가 험담을 &#39;듣게&#39; 되는 수동적 상태를 나타냅니다.</div><div class=\"lec-gr-item\">spoken ill of (과거분사): speak ill of(험담하다)라는 타동사구에서 파생되었습니다. 여기서는 목적어(him)의 상태를 설명하는 목적보어 자리에서 수동의 의미를 나타내는 과거분사로 쓰였습니다.</div><div class=\"lec-gr-item\">spoken ill of (수동태): be동사+p.p.의 수동구조가 내포된 형태입니다. 기본구조: speak ill of O (~를 험담하다) 패턴에서 목적어(him)가 5형식 문장의 목적보어 위치로 내려오며 수동의 의미인 &#39;험담당하다(spoken ill of)&#39;로 쓰였습니다.</div><div class=\"lec-gr-item\">ill (관용표현): &#39;speak ill of&#39;는 &#39;~를 나쁘게 말하다/험담하다&#39;라는 의미의 숙어적 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">judge</td><td class=\"m\">판사</td></tr><tr><td class=\"w\">know</td><td class=\"m\">알다</td></tr><tr><td class=\"w\">for a long time</td><td class=\"m\">오랫동안</td></tr><tr><td class=\"w\">other</td><td class=\"m\">다른 사람들</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>글쓴이는 그 판사와 오랜 인연이 있다.</li><li>오랜 기간 지켜봤음에도 주변에서 그를 비난하는 말을 전혀 들은 적이 없다.</li><li>이는 그 판사가 매우 정직하고 훌륭한 인품을 가졌음을 시사한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The speaker has known the judge for many years, yet they have never heard anyone criticize him.</div>\n              <div class=\"lec-final-sum-ko\">화자는 판사를 여러 해 동안 알고 지냈지만, 그 누구도 그를 비판하는 것을 들은 적이 없다.</div></div></div>"],"segs":[[{"audio":"./unit18_09_강의_audio/1.mp3","hl":null}],[{"audio":"./unit18_09_강의_audio/2.mp3","hl":null}],[{"audio":"./unit18_09_강의_audio/3.mp3","hl":null},{"audio":"./unit18_09_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit18_09_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit18_09_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit18_09_강의_audio/7.mp3","hl":null}],[],[{"audio":"./unit18_09_강의_audio/8.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(
