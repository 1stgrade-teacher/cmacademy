li><li>핵심 키워드: 순환(blood moving), 혈관(veins and arteries)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">breathe</td><td class=\"m\">호흡하다, 숨 쉬다</td></tr><tr><td class=\"w\">keep</td><td class=\"m\">계속 ~하게 하다</td></tr><tr><td class=\"w\">beat</td><td class=\"m\">(심장이) 뛰다</td></tr><tr><td class=\"w\">move</td><td class=\"m\">움직이다, 이동시키다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">along</td><td class=\"m\">~을 따라서</td></tr><tr><td class=\"w\">vein</td><td class=\"m\">정맥</td></tr><tr><td class=\"w\">artery</td><td class=\"m\">동맥</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 공기는</span><span class=\"en\"><b><span class=\"grammar-hl\">The air</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 들이마시고 내뱉는</span><span class=\"en\"><b><span class=\"grammar-hl\">we breathe</span> in and out</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유지하게 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">keeps</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 심장이 뛰도록</span><span class=\"en\"><b><span class=\"grammar-hl\">our hearts beating</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리의 피가 움직이도록</span><span class=\"en\"><b>and our blood <span class=\"grammar-hl\">moving</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 정맥과 동맥을 따라</span><span class=\"en\"><b>along our veins and arteries.</b></span></div></div><div class=\"lec-sent-ko\">우리가 들이마시고 내뱉는 공기는 계속 우리의 심장이 뛰게 하고 우리의 피가 우리의 정맥과 동맥을 따라 움직이도록 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 생명 유지의 필수 조건인 &#39;호흡&#39;이 우리 몸의 핵심 기능인 &#39;심장 박동&#39;과 &#39;혈액 순환&#39;을 어떻게 뒷받침하는지 설명하고 있습니다. 여기서 keeps는 사전적으로는 &#39;유지하다&#39;라는 뜻이지만, 문맥상으로는 생명 활동이 중단되지 않고 끊임없이 이어지게 만드는 &#39;지속시키는 원동력&#39;을 강조합니다. 필자는 공기가 단순히 몸속에 들어오는 것에 그치지 않고, 우리 생명 시스템의 &#39;작동 스위치&#39; 역할을 한다는 점을 보여주기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The air we breathe (관계대명사(생략)): the air와 we 사이에는 목적격 관계대명사(which/that)가 생략되어 있으며, 뒤의 &#39;we breathe&#39;가 앞의 선행사 &#39;the air&#39;를 수식하는 구조입니다.</div><div class=\"lec-gr-item\">keeps our hearts beating (5형식(SVOC)): keep은 5형식 동사로, 목적어(our hearts)와 목적보어(beating)를 취합니다. 목적어의 동작을 나타내는 현재분사(beating)가 보어로 쓰인 구조입니다.</div><div class=\"lec-gr-item\">beating (현재분사): 목적보어 자리에서 목적어인 hearts가 능동적으로 &#39;뛰고 있는&#39; 상태를 설명합니다.</div><div class=\"lec-gr-item\">moving (현재분사): 목적보어 자리에서 목적어인 blood가 능동적으로 &#39;흐르고/이동하고 있는&#39; 상태를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">breathe</td><td class=\"m\">호흡하다, 숨 쉬다</td></tr><tr><td class=\"w\">keep</td><td class=\"m\">계속 ~하게 하다</td></tr><tr><td class=\"w\">beat</td><td class=\"m\">(심장이) 뛰다</td></tr><tr><td class=\"w\">along</td><td class=\"m\">~을 따라서</td></tr><tr><td class=\"w\">vein</td><td class=\"m\">정맥</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우리가 숨 쉬는 행위는 생명 유지의 필수적인 과정이다.</li><li>공기는 심장 박동과 혈액 순환을 가능하게 하여 신체 기능을 지속시킨다.</li><li>호흡은 생명 유지라는 근본적인 기능을 수행하는 중요한 생물학적 과정이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Breathing regulates our heartbeats and ensures that blood circulates throughout the body.</div>\n              <div class=\"lec-final-sum-ko\">호흡은 우리의 심장 박동을 조절하며 혈액이 온몸을 순환하도록 한다.</div></div></div>"],"segs":[[{"audio":"./unit18_06_강의_audio/1.mp3","hl":null}],[{"audio":"./unit18_06_강의_audio/2.mp3","hl":null}] r=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
