ec-cover-title\">Why Forcing Children to Eat Can Backfire<small>아이들에게 억지로 음식을 먹이는 것이 역효과를 내는 이유</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 심리학에서 말하는 미각 혐오 학습(Taste Aversion Learning)이라는 흥미로운 개념과 관련이 있어요. 이는 특정 음식을 먹은 뒤 불쾌한 경험을 하게 되면, 우리 뇌가 그 음식과 고통을 강하게 연결 지어 다음부터는 그 음식을 피하게 만드는 일종의 생존 본능이에요. 마치 상한 음식을 먹고 배탈이 나면 그 음식 냄새만 맡아도 속이 메스꺼워지는 것과 비슷하죠. 어린 시절 억지로 먹어야 했던 음식에 대한 거부감은 이런 심리적 방어 기제가 작용한 결과라고 볼 수 있습니다. 결국 억지로 무언가를 강요하는 행위가 오히려 긍정적인 경험을 방해하고, 지속적인 회피 반응을 불러일으킬 수 있다는 점을 이해하면 지문의 내용을 훨씬 쉽게 파악할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 설정</div><ul><li>아이들이 원치 않는 음식을 억지로 먹어야 하는 상황을 묘사합니다.</li><li>양배추(cabbage)를 배가 아플 때까지 억지로 먹음</li><li>아이들이 느끼는 불쾌감과 거부감(feel sick)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02결과 예측</div><ul><li>강압적인 경험은 향후 음식에 대한 아이들의 반응에 부정적인 영향을 미칩니다.</li><li>음식을 다시 보았을 때 즐거워하지 않음(jump for joy)</li><li>강요된 식사 경험이 거부 반응을 유발함(hardly make children)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03핵심 키워드</div><ul><li>강요된 식사(forced eating)</li><li>부정적 연상(negative association)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experience</td><td class=\"m\">경험</td></tr><tr><td class=\"w\">pile</td><td class=\"m\">더미, 무더기</td></tr><tr><td class=\"w\">unwanted</td><td class=\"m\">원치 않는</td></tr><tr><td class=\"w\">sick</td><td class=\"m\">아픈, 메스꺼운</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hardly</td><td class=\"m\">거의 ~하지 않다</td></tr><tr><td class=\"w\">jump for joy</td><td class=\"m\">펄쩍펄쩍 뛰며 기뻐하다</td></tr><tr><td class=\"w\">serve</td><td class=\"m\">제공하다, 내놓다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 경험은</span><span class=\"en\"><b>The experience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹는 것의</span><span class=\"en\"><b>of <span class=\"grammar-hl\">eating a pile</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">원하지 않는 양배추 한 무더기를</span><span class=\"en\"><b><span class=\"grammar-hl\">of unwanted cabbage</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 아플 때까지</span><span class=\"en\"><b>until they feel sick</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이들을 만들지 않을 것이다</span><span class=\"en\"><b>is hardly going <span class=\"grammar-hl\">to make children</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기쁨으로 펄쩍 뛰게</span><span class=\"en\"><b><span class=\"grammar-hl\">jump</span> for joy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다음번에</span><span class=\"en\"><b>the next time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 제공될 때</span><span class=\"en\"><b><span class=\"grammar-hl\">it is served</span>.</b></span></div></div><div class=\"lec-sent-ko\">아이들이 물릴 때까지 원하지 않는 한 무더기의 양배추를 먹는 경험은 다음번에 그것이 제공될 때 좀처럼 아이들이 기쁨으로 펄쩍 뛰게 만들지 않을 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 좋지 않은 경험이 이후의 행동에 부정적인 영향을 미친다는 점을 강조합니다. 여기서 jump for joy는 사전적으로 &#39;기쁨으로 펄쩍 뛰다&#39;라는 뜻인데, 문맥상 &#39;매우 좋아하거나 즐겁게 다시 찾다&#39;라는 의미입니다. 필자는 아이들의 생생한 반응을 묘사하기 위해 &#39;기뻐서 펄쩍 뛰다&#39;라는 관용구를 사용하여, 싫어하는 음식을 먹었을 때의 거부 반응을 반어적으로 더 강렬하게 나타냈습니다. 이 문장은 앞서 언급되었을 &#39;나쁜 경험이 기억에 남는다&#39;는 논리적 상황을 뒷받침하는 구체적인 예시로 쓰였습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">eating a pile of unwanted cabbage (동명사): eating이 문장의 주어 역할을 하며 &#39;먹는 행위&#39;라는 명사적 개념을 전달한다.</div><div class=\"lec-gr-item\">unwanted (과거분사): 과거분사 wanted의 부정형으로, 뒤의 명사 cabbage를 &#39;원치 않는(상태)&#39;이라는 의미로 수식한다.</div><div class=\"lec-gr-item\">to make children jump 5형식(SVOC) 구조: make(사역동사) + 목적어(children) + 목적보어(jump, 동사원형)의 구조로, &#39;아이들이 뛰도록 만들다&#39;라는 의미를 구성한다.</div><div class=\"lec-gr-item\">it is served (수동태): be동사(is)+p.p.(served) 구조. serve는 타동사인데 목적어가 없어서 수동구조 is served 형태로 쓴다. 기본구조: serve + O(음식 등) (음식을 대접하다/제공하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experience</td><td class=\"m\">경험</td></tr><tr><td class=\"w\">pile</td><td class=\"m\">더미, 무더기</td></tr><tr><td class=\"w\">unwanted</td><td class=\"m\">원치 않는</td></tr><tr><td class=\"w\">sick</td><td class=\"m\">아픈, 메스꺼운</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hardly</td><td class=\"m\">거의 ~하지 않다</td></tr><tr><td class=\"w\">jump for joy</td><td class=\"m\">펄쩍펄쩍 뛰며 기뻐하다</td></tr><tr><td class=\"w\">serve</td><td class=\"m\">제공하다, 내놓다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>싫어하는 음식을 억지로 먹어 병이 날 정도로 괴로웠던 경험은 아이들에게 강한 부정적 기억을 남긴다.</li><li>그 결과, 다음에 같은 음식을 마주했을 때 아이들은 결코 즐거워하지 않으며 기피하게 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Forcing children to consume food they dislike creates a bad memory, and it makes them avoid that food when it is served again.</div>\n              <div class=\"lec-final-sum-ko\">아이들에게 싫어하는 음식을 억지로 먹이는 것은 나쁜 기억을 만들며, 그 결과 그들은 그 음식이 다시 나올 때 피하게 된다.</div></div></div>"],"segs":[[{"audio":"./review07_audio/1.mp3","hl":null}],[{"audio":"./review07_audio/2.mp3","hl":null}],[{"audio":"./review07_audio/3.mp3","hl":null},{"audio":"./review07_audio/4.mp3","hl":"stage-0"},{"audio":"./review07_audio/5.mp3","hl":"stage-1"},{"audio":"./review07_audio/6.mp3","hl":"stage-2"}],[{"audio":"./review07_
