alt=\"\"></div>","<div class=\"lec-cover-title\">How Scientific Knowledge Helps Us Control Life&#39;s Risks<small>과학적 지식이 삶의 위험을 통제하는 방법</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 살아가면서 겪는 다양한 위험을 조절할 수 있게 된 데에는 과학적 지식의 발전이 큰 역할을 했어요. 여기서 과학적 지식의 성장(growth of scientific knowledge)이란 단순히 새로운 사실을 아는 것을 넘어, 자연의 법칙을 이해하고 이를 우리의 삶에 적용하는 체계적인 탐구 과정을 의미해요. 예를 들어, 옛날에는 예측할 수 없었던 기상 변화나 전염병 같은 자연재해를 오늘날에는 데이터와 기술을 통해 미리 대비하고 피해를 최소화하는 것이 바로 이런 지식의 힘이죠. 즉, 과학은 우리가 불확실한 세상 속에서 안전한 울타리를 만들 수 있도록 돕는 든든한 도구라고 생각하면 이해하기 쉬워요. 이처럼 과학적 성취는 단순히 편리함을 주는 것을 넘어, 인류가 삶의 주도권을 확보하는 데 결정적인 기여를 해왔답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01과학적 지식의 성장</div><ul><li>과학적 지식은 지속적으로 발전해 왔으며 이는 인류에게 새로운 변화를 가져다주었다.</li><li>지식의 증가(growth of scientific knowledge)가 인류의 삶에 미친 영향</li><li>현대 사회의 기초가 되는 과학적 원리 습득</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02통제 능력의 확보</div><ul><li>지식이 축적됨에 따라 과거에는 어쩔 수 없었던 삶의 위험 요소들을 관리할 수 있게 되었다.</li><li>위험을 다루는 기술의 향상(control the risks)</li><li>예측 불가능했던 자연 및 환경적 위협에 대한 대응 능력 강화</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03과학의 긍정적 역할</div><ul><li>과학적 통제력은 우리가 더 안정적인 환경에서 살아갈 수 있도록 돕는 도구가 된다.</li><li>인류가 삶의 불확실성을 줄이는 과정</li><li>핵심 키워드: 과학적 지식(scientific knowledge), 위험 통제(control of risks)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">growth</td><td class=\"m\">성장, 증가</td></tr><tr><td class=\"w\">scientific</td><td class=\"m\">과학의, 과학적인</td></tr><tr><td class=\"w\">knowledge</td><td class=\"m\">지식</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">허락하다, 가능하게 하다</td></tr><tr><td class=\"w\">control</td><td class=\"m\">통제하다, 제어하다</td></tr><tr><td class=\"w\">risk</td><td class=\"m\">위험</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">성장은</span><span class=\"en\"><b>The growth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학 지식의</span><span class=\"en\"><b>of scientific knowledge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리를 가능하게 했다</span><span class=\"en\"><b><span class=\"grammar-hl\">has allowed us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">통제하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to control</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위험들의 일부를</span><span class=\"en\"><b>some of the risks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">삶의</span><span class=\"en\"><b>of life.</b></span></div></div><div class=\"lec-sent-ko\">과학 지식의 성장은 우리가 삶의 위험들의 일부를 통제하도록 해 주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과학 지식이 발전하면서 과거에는 어쩔 수 없이 받아들여야 했던 삶의 위험 요소들을 우리가 어느 정도 관리하고 다룰 수 있게 되었다는 뜻입니다. 여기서 growth는 사전적으로는 &#39;성장&#39;이나 &#39;발육&#39;을 뜻하지만, 여기서는 지식의 양이 축적되고 수준이 높아지는 &#39;발달&#39; 또는 &#39;진보&#39;의 의미로 쓰였습니다. 필자는 지식이 단순히 커지는 것이 아니라, 생존에 유리한 방향으로 꾸준히 나아가고 있다는 긍정적인 느낌을 강조하기 위해 이 단어를 선택했습니다. 또한 control은 &#39;제어하다&#39;라는 뜻인데, 여기서는 위험을 완전히 없애는 것이 아니라, 우리가 의도한 대로 그 영향력을 조절하여 피해를 최소화한다는 맥락으로 이해해야 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has allowed us to control (5형식(SVOC)): allow는 타동사로 &#39;allow + 목적어(us) + to부정사(to control)&#39; 구조를 취하며, 여기서 목적격 보어로 to부정사가 쓰였습니다.</div><div class=\"lec-gr-item\">to control (to부정사): allow의 목적격 보어로서 &#39;통제할 수 있도록&#39;이라는 의미를 가지며, 구조적으로는 to + 동사원형의 형태를 띱니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">growth</td><td class=\"m\">성장, 증가</td></tr><tr><td class=\"w\">scientific</td><td class=\"m\">과학의, 과학적인</td></tr><tr><td class=\"w\">knowledge</td><td class=\"m\">지식</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">허락하다, 가능하게 하다</td></tr><tr><td class=\"w\">control</td><td class=\"m\">통제하다, 제어하다</td></tr><tr><td class=\"w\">risk</td><td class=\"m\">위험</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과학 지식이 점차 발달해 왔다.</li><li>이 덕분에 인간은 삶에서 마주하는 여러 위험 요소를 더 효과적으로 관리할 수 있게 되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">As scientific knowledge continues to expand, it provides us with the ability to manage and reduce the risks we face.</div>\n              <div class=\"lec-final-sum-ko\">과학적 지식이 계속 확장됨에 따라, 이는 우리가 직면한 위험을 관리하고 줄일 수 있는 능력을 제공한다.</div></div></div>"],"segs":[[{"audio":"./review09_audio/1.mp3","hl":null}],[{"audio":"./review09_audio/2.mp3","hl":null}],[{"audio":"./review09_audio/3.mp3","hl":null},{"audio":"./review09_audio/4.mp3","hl":"stage-0"},{"audio":"./review09_audio/5.mp3","hl":"stage-1"},{"audio":"./review09_audio/6.mp3","hl":"stage-2"}],[{"audio":"./review09_audio/7.mp3","hl":null}],[{"audio":"./review09_audio/8.mp3","hl":"main"},{"audio":"./review09_audio/9.mp3","hl":"meaning"},{"audio":"./review09_audio/10.mp3","hl":"grammar"}],[{"audio":"./review09_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var
