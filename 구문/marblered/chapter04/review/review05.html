문장은 자연이 주는 평온함과 그 속에서 느끼는 심리적 잔상(Psychological afterimage)이 얼마나 깊게 남는지를 보여주고 있어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 전개</div><ul><li>낚시를 마치고 주차된 차로 돌아가는 상황입니다.</li><li>낚시 장소를 떠나 이동 중 (walking up the path)</li><li>차가 있는 곳으로 돌아감 (back to the car)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02청각적 여운</div><ul><li>낚시터의 상황이 마무리되었음에도 소리는 여전히 들려옵니다.</li><li>물고기가 움직이는 소리 (fish splashing)</li><li>여전히 들리는 물소리 (still hear)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03현장감 유지</div><ul><li>물고기의 움직임이 낚시터의 생생함을 강조합니다.</li><li>물속에서 물고기가 튀어 오르는 동작 (splashing)</li><li>장소를 떠나도 잔상처럼 남는 현장의 소리 (in the water)</li><li>핵심 키워드: 물고기 튀는 소리(fish splashing)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">walk</td><td class=\"m\">걷다</td></tr><tr><td class=\"w\">path</td><td class=\"m\">길, 오솔길</td></tr><tr><td class=\"w\">back</td><td class=\"m\">돌아와서</td></tr><tr><td class=\"w\">still</td><td class=\"m\">여전히</td></tr><tr><td class=\"w\">hear</td><td class=\"m\">듣다</td></tr><tr><td class=\"w\">splash</td><td class=\"m\">철벅거리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">길을 걸어 올라가서</span><span class=\"en\"><b><span class=\"grammar-hl\">Walking up the path</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자동차로 다시 돌아왔을 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">and back to the car</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 여전히 들을 수 있었다</span><span class=\"en\"><b>they could still <span class=\"grammar-hl\">hear</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물고기들이 첨벙거리는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">the fish splashing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물속에서</span><span class=\"en\"><b>in the water.</b></span></div></div><div class=\"lec-sent-ko\">그 길을 걸어서 그 자동차로 다시 왔을 때 그들은 여전히 물고기들이 물속에서 첨벙거리는 것을 들을 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 경험한 사건(물고기가 물에서 튀어 오르는 장면)이 끝났음에도 불구하고, 그들이 그 장소를 떠나는 과정에서 여전히 그 소리를 듣고 있다는 상황을 설명합니다. 여기서 splashing은 사전적으로는 &#39;물을 튀기다&#39;라는 뜻이지만, 여기서는 물고기가 움직이며 내는 소리를 생생하게 묘사합니다. 필자는 이 단어를 통해 독자가 마치 현장에 있는 것처럼 생생한 청각적 이미지를 느끼게 하려고 이 표현을 골랐습니다. 앞 문장에서의 사건이 단순한 과거가 아니라, 그들에게 강렬한 인상을 남겨 여운이 지속되고 있음을 보여주는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Walking up the path and back to the car (분사구문): -ing로 시작하는 부사적 구조로, 원래 절로 변환하면 &#39;When they walked up the path and back to the car&#39;의 의미이다.</div><div class=\"lec-gr-item\">hear the fish splashing 5형식(SVOC) 구조: hear(지각동사) + 목적어(the fish) + 목적보어(splashing) 형태로, 목적어와 보어가 능동 관계일 때 목적보어 자리에 현재분사를 사용한다.</div><div class=\"lec-gr-item\">splashing (현재분사): 목적보어 자리에서 목적어인 the fish가 스스로 물장구를 치며 동작을 하는 상태를 수식하며 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">walk</td><td class=\"m\">걷다</td></tr><tr><td class=\"w\">path</td><td class=\"m\">길, 오솔길</td></tr><tr><td class=\"w\">back</td><td class=\"m\">돌아와서</td></tr><tr><td class=\"w\">still</td><td class=\"m\">여전히</td></tr><tr><td class=\"w\">hear</td><td class=\"m\">듣다</td></tr><tr><td class=\"w\">splash</td><td class=\"m\">철벅거리다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>주인공들은 차로 돌아가는 길에도 방금 전 있었던 물고기의 움직임을 생생하게 기억(청각)하고 있다.</li><li>사건이 마무리되는 과정에서도 그 여운이 가시지 않고 이어지고 있음을 보여준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The individuals walked away from the water, yet the sound of the fish continued to resonate in their minds.</div>\n              <div class=\"lec-final-sum-ko\">그들은 물가에서 멀어졌지만, 물고기가 움직이는 소리는 여전히 그들의 기억 속에 생생하게 남았다.</div></div></div>"],"segs":[[{"audio":"./review05_audio/1.mp3","hl":null}],[{"audio":"./review05_audio/2.mp3","hl":null}],[{"audio":"./review05_audio/3.mp3","hl":null},{"audio":"./review05_audio/4.mp3","hl":"stage-0"},{"audio":"./review05_audio/5.mp3","hl":"stage-1"},{"audio":"./review05_audio/6.mp3","hl":"stage-2"}],[{"audio":"./review05_audio/7.mp3","hl":null}],[{"audio":"./review05_audio/8.mp3","hl":"main"},{"audio":"./review05_audio/9.mp3","hl":"meaning"},{"audio":"./review05_audio/10.mp3","hl":"grammar"}],[{"audio":"./review05_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<
