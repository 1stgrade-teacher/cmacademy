\"\"></div>","<div class=\"lec-cover-title\">An Unpleasant Surprise: Returning to a Damaged Vehicle<small>불쾌한 놀라움: 파손된 차량을 마주하다</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 짧은 문장은 범죄 상황이나 예기치 못한 사고를 암시하는 도입부로, 흔히 영미권의 범죄 수사물이나 스릴러 영화에서 볼 수 있는 상황적 맥락(situational context)을 담고 있어요. 특히 깨진 차 유리창은 단순히 유리 조각이 흩어진 상태가 아니라, 누군가 고의로 침입해 물건을 훔쳐 간 차량 절도(car burglary) 사건이 발생했음을 의미하는 결정적인 단서가 되죠. 보통 이런 장면은 주인공이 일상적인 평화 속에서 갑작스러운 혼란에 빠지는 사건의 발단(inciting incident) 역할을 합니다. 여러분이 독해를 할 때 단순히 &#39;유리가 깨졌다&#39;고 읽기보다는, 이 문장을 통해 주인공이 겪게 될 심리적 충격이나 이어질 추리 과정을 미리 짐작해 본다면 글의 흐름을 훨씬 더 흥미롭게 파악할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 발생</div><ul><li>차량으로 돌아온 남성이 자신의 차 상태를 확인하게 됩니다.</li><li>차량(car)으로 되돌아온 남성(man)</li><li>파손된(broken) 상태의 창문(windows)을 발견함</li><li>핵심 키워드: 차량 파손(car damage)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">return</td><td class=\"m\">돌아오다</td></tr><tr><td class=\"w\">find</td><td class=\"m\">알게 되다, 발견하다</td></tr><tr><td class=\"w\">break</td><td class=\"m\">부수다, 깨뜨리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 남자가</span><span class=\"en\"><b><span class=\"grammar-hl\">When the man</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돌아왔을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">returned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 자동차로,</span><span class=\"en\"><b><span class=\"grammar-hl\">to his car</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 발견했다</span><span class=\"en\"><b>he <span class=\"grammar-hl\">found</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">차 유리창들이</span><span class=\"en\"><b><span class=\"grammar-hl\">car windows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">깨진 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">broken</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 남자가 자신의 자동차로 돌아왔을 때 그는 차 유리창들이 깨진 것을 알았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞부분에서 &#39;돌아왔을 때&#39;라는 시간적 상황을 제시하고, 뒷부분에서 &#39;차 유리가 깨졌다&#39;는 사건을 연결하여 남자가 겪은 당혹스러운 상황을 나타냅니다. 여기서 found는 사전적으로 &#39;찾다, 발견하다&#39;라는 뜻이지만, 여기서는 기대하지 않았던 뜻밖의 부정적인 상황을 &#39;마주하게 되었다&#39;는 의미로 쓰였습니다. 필자는 단순히 물건을 찾는 행위가 아니라, 눈앞에 벌어진 상황을 인지했을 때의 충격적인 어감을 전달하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When the man returned to his car (분사구문): 접속사(When) + 주어(the man) + 동사(returned) 형태로, 주절의 동작이 일어난 때를 나타내는 시간의 부사절이다.</div><div class=\"lec-gr-item\">found car windows broken 5형식(SVOC) 구조: find(S) + car windows(O) + broken(OC) 형태이다. 목적어인 창문이 깨진 상태임을 나타내는 과거분사(broken)가 목적격 보어로 쓰였다.</div><div class=\"lec-gr-item\">broken (과거분사(형용사)): broken이 car windows를 수식하며, &#39;창문이 깨진(상태)&#39;이라는 의미를 나타낸다. (broken + N ≈ N that is/was broken)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">return</td><td class=\"m\">돌아오다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>남자가 주차해둔 차로 돌아왔더니 유리창이 파손되어 있었다.</li><li>예기치 못한 피해 상황을 목격한 남자의 상황을 짧게 서술한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The man returned to his car only to find that his windows had been broken by someone.</div>\n              <div class=\"lec-final-sum-ko\">그 남자는 차로 돌아왔지만 누군가에 의해 창문이 깨져 있는 것을 발견했다.</div></div></div>"],"segs":[[{"audio":"./review08_audio/1.mp3","hl":null}],[{"audio":"./review08_audio/2.mp3","hl":null}],[{"audio":"./review08_audio/3.mp3","hl":null},{"audio":"./review08_audio/4.mp3","hl":"stage-0"}],[{"audio":"./review08_audio/5.mp3","hl":null}],[{"audio":"./review08_audio/6.mp3","hl":"main"},{"audio":"./review08_audio/7.mp3","hl":"meaning"},{"audio":"./review08_audio/8.mp3","hl":"grammar"}],[{"audio":"./review08_audio/9.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.remo
