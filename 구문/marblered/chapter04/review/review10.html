     <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 우리가 사용하는 돈이 단순히 물건을 사고파는 수단일 뿐만 아니라 가치 저장의 수단(Store of value)이라는 사실을 알고 있나요? 이는 돈이 시간이 지나도 그 가치를 그대로 유지하면서 필요할 때 언제든 다시 꺼내 쓸 수 있는 성질을 말해요. 과거에는 금이나 곡물처럼 부피가 크고 무거운 것을 가치 저장 수단으로 썼지만, 현대의 돈은 무게가 가볍고 부피가 작아서 아주 먼 곳까지 쉽게 옮길 수 있는 이동성(Portability)을 갖추게 되었죠. 만약 여러분이 금덩이를 짊어지고 여행하는 대신, 가벼운 지폐나 카드를 챙기는 상황을 상상해 보세요. 돈은 바로 이러한 가치의 운반과 보존을 효율적으로 만들어 우리 경제 생활의 핵심적인 기반이 되어준답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01돈의 기본 정의</div><ul><li>돈이 가진 가장 중요하고 기초적인 특징 중 하나를 설명한다.</li><li>돈의 근본적 특성(fundamental characteristics)</li><li>가치를 저장하는 수단(store of value)으로서의 역할</li><li>핵심 키워드: 돈(money), 가치 저장(store of value)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02돈의 주요 기능</div><ul><li>돈은 언제 어디서나 쉽게 옮길 수 있는 가치의 저장고 역할을 수행한다.</li><li>어디로든 쉽게 이동 가능함(transportable)</li><li>미래의 사용을 위해 가치를 보존함</li><li>핵심 키워드: 이동성(transportable), 가치(value)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fundamental</td><td class=\"m\">근본적인, 기초적인</td></tr><tr><td class=\"w\">characteristic</td><td class=\"m\">특징, 특질</td></tr><tr><td class=\"w\">money</td><td class=\"m\">돈, 화폐</td></tr><tr><td class=\"w\">act</td><td class=\"m\">역할을 하다, 행동하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">easily</td><td class=\"m\">쉽게</td></tr><tr><td class=\"w\">transportable</td><td class=\"m\">이동 가능한, 운반할 수 있는</td></tr><tr><td class=\"w\">store of value</td><td class=\"m\">가치 저장 수단</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 근본적인 특징 중 하나는</span><span class=\"en\"><b>One of the most fundamental characteristics</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈의</span><span class=\"en\"><b>of money</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~라는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 ~로서 역할을 한다는</span><span class=\"en\"><b><span class=\"grammar-hl\">it acts as</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쉽게 운반 가능한</span><span class=\"en\"><b>an <span class=\"grammar-hl\">easily transportable</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가치 저장소</span><span class=\"en\"><b>store of value.</b></span></div></div><div class=\"lec-sent-ko\">돈의 가장 근본적인 특징 중 하나는 그것이 쉽게 운반 가능한 가치 저장소로서 역할을 한다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 돈이 가진 핵심적인 기능을 정의하며 글의 서두를 엽니다. 여기서 acts as는 사전적으로는 &#39;~로서 행동하다&#39;이지만, 여기서는 &#39;어떠한 기능이나 역할을 수행하다&#39;라는 의미입니다. 필자는 돈이라는 추상적인 개념이 실질적인 기능을 한다는 점을 강조하기 위해 이 표현을 사용했습니다. 또한, store of value는 직역하면 &#39;가치의 저장소&#39;인데, 경제학적으로는 재산의 가치를 시간의 흐름에 따라 그대로 보존할 수 있는 수단을 뜻합니다. 돈이 단순히 물건이 아니라, 노동의 가치를 보관했다가 나중에 꺼내 쓸 수 있는 도구라는 점을 설명하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is that it acts as 동격의 that: &#39;주어(One) + be동사(is) + that절&#39; 구조로, that절이 주어(One of the most fundamental characteristics of money)의 내용을 구체화하여 설명하는 보어절 역할을 합니다.</div><div class=\"lec-gr-item\">easily transportable (현재분사(분사)): 부사(easily)가 형용사(transportable)를 수식하고, 이 구 전체가 명사(store of value)를 수식하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fundamental</td><td class=\"m\">근본적인, 기초적인</td></tr><tr><td class=\"w\">characteristic</td><td class=\"m\">특징, 특질</td></tr><tr><td class=\"w\">money</td><td class=\"m\">돈, 화폐</td></tr><tr><td class=\"w\">act</td><td class=\"m\">역할을 하다, 행동하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">easily</td><td class=\"m\">쉽게</td></tr><tr><td class=\"w\">transportable</td><td class=\"m\">이동 가능한, 운반할 수 있는</td></tr><tr><td class=\"w\">store of value</td><td class=\"m\">가치 저장 수단</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>돈의 핵심적인 성격은 그 가치를 보관하고 필요한 곳으로 쉽게 옮길 수 있다는 것이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Money functions as a store of value that is easy to move, so it allows individuals to preserve their purchasing power efficiently.</div>\n              <div class=\"lec-final-sum-ko\">돈은 이동하기 쉬운 가치 저장 수단으로 기능하며, 개인들이 자신의 구매력을 효율적으로 보존하게 해준다.</div></div></div>"],"segs":[[{"audio":"./review10_audio/1.mp3","hl":null}],[{"audio":"./review10_audio/2.mp3","hl":null}],[{"audio":"./review10_audio/3.mp3","hl":null},{"audio":"./review10_audio/4.mp3","hl":"stage-0"},{"audio":"./review10_audio/5.mp3","hl":"stage-1"}],[{"audio":"./review10_audio/6.mp3","hl":null}],[{"audio":"./review10_audio/7.mp3","hl":"main"},{"audio":"./review10_audio/8.mp3","hl":"meaning"},{"audio":"./review10_audio/9.mp3","hl":"grammar"}],[{"audio":"./review10_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)bre
