 가지 필수적인 자유가 있다.</li><li>연구 결과를 발표할 자유(freedom to publish)</li><li>기존의 이론에 반박할 자유(freedom to contradict)</li><li>새로운 가설을 검증할 실험의 자유(freedom to experiment)</li><li>핵심 키워드: 발표(publish), 반박(contradict), 실험(experiment)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">central</td><td class=\"m\">중심적인, 중요한</td></tr><tr><td class=\"w\">lesson</td><td class=\"m\">교훈</td></tr><tr><td class=\"w\">free</td><td class=\"m\">자유롭게 하다, 벗어나게 하다</td></tr><tr><td class=\"w\">mind</td><td class=\"m\">마음, 정신</td></tr><tr><td class=\"w\">dogma</td><td class=\"m\">교리, 독단</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">guarantee</td><td class=\"m\">보장하다</td></tr><tr><td class=\"w\">freedom</td><td class=\"m\">자유</td></tr><tr><td class=\"w\">publish</td><td class=\"m\">출판하다, 발표하다</td></tr><tr><td class=\"w\">contradict</td><td class=\"m\">반박하다, 모순되다</td></tr><tr><td class=\"w\">experiment</td><td class=\"m\">실험하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">중심적인 교훈은</span><span class=\"en\"><b>A central lesson</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학의</span><span class=\"en\"><b>of science</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~라는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 노력해야 한다는 것</span><span class=\"en\"><b>we must try</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 정신을 자유롭게 하려고</span><span class=\"en\"><b><span class=\"grammar-hl\">to free</span> our minds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독단으로부터</span><span class=\"en\"><b>of dogma</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 보장하려고</span><span class=\"en\"><b>and <span class=\"grammar-hl\">to guarantee</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자유를</span><span class=\"en\"><b><span class=\"grammar-hl\">the freedom</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">출판할</span><span class=\"en\"><b><span class=\"grammar-hl\">to publish,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반박할</span><span class=\"en\"><b><span class=\"grammar-hl\">to contradict,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 실험할</span><span class=\"en\"><b><span class=\"grammar-hl\">and to experiment</span>.</b></span></div></div><div class=\"lec-sent-ko\">과학의 가장 중요한 교훈은 우리의 정신을 독단으로부터 풀어주도록, 그리고 출판하고, 반박하고 그리고 실험하는 자유를 보장하도록 우리가 노력해야 한다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과학이 우리에게 주는 가장 핵심적인 가르침을 제시합니다. 여기서 dogma는 사전적으로는 &#39;교리&#39;나 &#39;종교적 신념&#39;을 의미하지만, 여기서는 &#39;객관적인 증거 없이 맹목적으로 믿는 고정관념이나 편견&#39;을 뜻합니다. 필자는 과학적 사고를 방해하는 가장 큰 장애물을 강조하기 위해 이 단어를 선택했습니다. 이 문장은 뒤따를 구체적인 과학적 방법론을 위한 전제 조건으로, 과학이 발전하려면 열린 사고와 비판할 자유가 반드시 필요하다는 논리적 흐름을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is that (보어절(명사절)): be동사의 보어 역할을 하는 that절이며, 문장의 핵심 내용을 보충 설명함</div><div class=\"lec-gr-item\">to free (to부정사): 보어 역할을 하는 명사적 용법으로, try의 목적어임</div><div class=\"lec-gr-item\">to guarantee (to부정사): 보어 역할을 하는 명사적 용법으로, 앞의 to free와 병렬 구조를 이룸</div><div class=\"lec-gr-item\">the freedom to publish, to contradict, and to experiment (to부정사): 형용사적 용법으로 앞의 명사 the freedom을 수식하며, 세 개의 to부정사가 병렬로 연결됨</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">central</td><td class=\"m\">중심적인, 중요한</td></tr><tr><td class=\"w\">lesson</td><td class=\"m\">교훈</td></tr><tr><td class=\"w\">free</td><td class=\"m\">자유롭게 하다, 벗어나게 하다</td></tr><tr><td class=\"w\">mind</td><td class=\"m\">마음, 정신</td></tr><tr><td class=\"w\">dogma</td><td class=\"m\">교리, 독단</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">guarantee</td><td class=\"m\">보장하다</td></tr><tr><td class=\"w\">freedom</td><td class=\"m\">자유</td></tr><tr><td class=\"w\">publish</td><td class=\"m\">출판하다, 발표하다</td></tr><tr><td class=\"w\">contradict</td><td class=\"m\">반박하다, 모순되다</td></tr><tr><td class=\"w\">experiment</td><td class=\"m\">실험하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과학의 핵심 가르침은 고정관념에서 벗어나는 것이다.</li><li>과학적 진보를 위해 자유로운 출판과 반박, 실험이 보장되어야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Science requires the absence of dogma and the protection of freedom to explore, because these conditions allow researchers to publish and challenge ideas.</div>\n              <div class=\"lec-final-sum-ko\">과학은 연구자들이 생각을 발표하고 도전할 수 있게 해주기 때문에, 교조주의에서 벗어나 탐구의 자유를 보장해야 한다.</div></div></div>"],"segs":[[{"audio":"./review03_audio/1.mp3","hl":null}],[{"audio":"./review03_audio/2.mp3","hl":null}],[{"audio":"./review03_audio/3.mp3","hl":null},{"audio":"./review03_audio/4.mp3","hl":"stage-0"},{"audio":"./review03_audio/5.mp3","hl":"stage-1"}],[{"audio":"./review03_audio/6.mp3","hl":null}],[{"audio":"./review03_audio/7.mp3","hl":"main"},{"audio":"./review03_audio/8.mp3","hl":"meaning"},{"audio":"./review03_audio/9.mp3","hl":"grammar"}],[{"audio":"./review03_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("
