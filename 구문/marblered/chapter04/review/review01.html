tage-head\">02구성의 유사성</div><ul><li>언어에서 단어가 가지는 역할은 음악에서 음표가 가지는 역할과 같다.</li><li>각 요소는 더 큰 구조를 만드는 필수 재료임</li><li>개별 단위들이 모여 의미나 멜로디를 형성함</li><li>핵심 키워드: 구성 요소(components), 역할(role)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">word</td><td class=\"m\">단어</td></tr><tr><td class=\"w\">language</td><td class=\"m\">언어</td></tr><tr><td class=\"w\">be to A what B is to C</td><td class=\"m\">A와 C의 관계는 B와 C의 관계와 같다</td></tr><tr><td class=\"w\">note</td><td class=\"m\">음표</td></tr><tr><td class=\"w\">music</td><td class=\"m\">음악</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">단어들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Words</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">언어에 대해 그러하다</span><span class=\"en\"><b><span class=\"grammar-hl\">are</span> to language</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마치 ~와 같은</span><span class=\"en\"><b>what</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음표들이</span><span class=\"en\"><b>notes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음악에 대해 그러한 것과</span><span class=\"en\"><b><span class=\"grammar-hl\">are to</span> music.</b></span></div></div><div class=\"lec-sent-ko\">단어와 언어의 관계는 음표와 음악의 관계와 같다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 유추(analogy)의 기법을 사용하여 언어의 구조를 설명합니다. &#39;A is to B what C is to D&#39; 구문은 &#39;A와 B의 관계는 C와 D의 관계와 같다&#39;는 뜻입니다. 여기서 Words(단어)는 언어를 구성하는 가장 기본 단위이고, notes(음표)는 음악을 구성하는 가장 기본 단위입니다. 필자는 언어라는 복잡한 체계를 음악에 비유함으로써, 단어가 모여 언어가 되듯 음표가 모여 음악이 된다는 본질적인 속성을 명확하게 전달하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are to (관용표현): A is to B what C is to D(A와 B의 관계는 C와 D의 관계와 같다) 구문에서 A is to B 형태가 쓰임. 이는 &#39;~와 ~의 관계는 마치 ~와 ~의 관계와 같다&#39;는 비유적 의미를 나타냄</div><div class=\"lec-gr-item\">Words are 5형식(SVOC) 구조: 본 문장은 넓은 의미에서 주어(Words) + 동사(are) + 보어(to language) 구조를 기본으로 하되, what 절을 활용한 관용적 비교 구조를 취하고 있음</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">word</td><td class=\"m\">단어</td></tr><tr><td class=\"w\">language</td><td class=\"m\">언어</td></tr><tr><td class=\"w\">note</td><td class=\"m\">음표</td></tr><tr><td class=\"w\">music</td><td class=\"m\">음악</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>단어는 언어의 가장 기초적인 구성 요소이다.</li><li>언어와 단어의 관계는 음악과 음표의 관계와 동일하다.</li><li>즉, 복잡한 언어 체계도 결국 단어라는 작은 단위들이 모여서 만들어진다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Words function as the basic units of language in the same way that musical notes compose music.</div>\n              <div class=\"lec-final-sum-ko\">단어는 음악의 음표가 음악을 구성하는 것과 같은 방식으로 언어의 기본 단위로서 기능한다.</div></div></div>"],"segs":[[{"audio":"./review01_audio/1.mp3","hl":null}],[{"audio":"./review01_audio/2.mp3","hl":null}],[{"audio":"./review01_audio/3.mp3","hl":null},{"audio":"./review01_audio/4.mp3","hl":"stage-0"},{"audio":"./review01_audio/5.mp3","hl":"stage-1"}],[{"audio":"./review01_audio/6.mp3","hl":null}],[{"audio":"./review01_audio/7.mp3","hl":"main"},{"audio":"./review01_audio/8.mp3","hl":"meaning"},{"audio":"./review01_audio/9.mp3","hl":"grammar"}],[{"audio":"./review01_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k
