을 절약하기 위한 배달 서비스 활용</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 &#39;사역동사(Causative Verb)&#39;라는 문법 개념을 들어본 적 있나요? 이 지문에 등장하는 &#39;have something delivered&#39;는 누군가에게 어떤 일을 시켜서 그 결과가 상태로 남게 될 때 사용하는 아주 유용한 표현이에요. 예를 들어, 머리카락을 직접 자르지 않고 미용실에서 자를 때 &#39;I had my hair cut&#39;이라고 말하는 것과 같은 원리랍니다. 즉, 내가 직접 움직이지 않아도 외부의 서비스나 타인의 도움을 통해 일을 처리하는 상황을 묘사할 때 자주 쓰여요. 현대 사회에서 장보기나 배달처럼 우리의 시간과 노력을 효율적으로 절약해 주는 서비스 문화를 이해하면, 이 문장이 담고 있는 편리한 일상을 훨씬 쉽게 공감할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 발생</div><ul><li>어제 시장에 가서 직접 장을 볼 시간이 없었던 상황입니다.</li><li>시간 부족 (lack of time)</li><li>시장 방문 불가 (couldn&#39;t go to the market)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02문제 해결</div><ul><li>가게에 전화를 걸어 필요한 조치를 취했습니다.</li><li>전화로 주문 (phoned the store)</li><li>구매 요청 (ordered groceries)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결과</div><ul><li>주문한 식료품을 집으로 배달받았습니다.</li><li>배달 서비스 이용 (had the groceries delivered)</li><li>임무 완수 (task completed)</li><li>핵심 키워드: 식료품(groceries), 배달(delivered)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shop</td><td class=\"m\">쇼핑하다, 물건을 사다</td></tr><tr><td class=\"w\">market</td><td class=\"m\">시장</td></tr><tr><td class=\"w\">yesterday</td><td class=\"m\">어제</td></tr><tr><td class=\"w\">phone</td><td class=\"m\">전화하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">store</td><td class=\"m\">가게, 상점</td></tr><tr><td class=\"w\">grocery</td><td class=\"m\">식료품</td></tr><tr><td class=\"w\">deliver</td><td class=\"m\">배달하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 시간이 없었다</span><span class=\"en\"><b>I didn’t have time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시장에서 물건을 살</span><span class=\"en\"><b><span class=\"grammar-hl\">to shop</span> at the market</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어제,</span><span class=\"en\"><b>yesterday,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 나는 가게에 전화했다</span><span class=\"en\"><b>so I phoned the store</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 식료품들이</span><span class=\"en\"><b>and <span class=\"grammar-hl\">had the groceries</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배달되게 시켰다.</span><span class=\"en\"><b><span class=\"grammar-hl\">delivered</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 어제 시장에서 물건을 살 시간이 없어서 가게에 전화했고 식료품들이 배달되게 시켰다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 어제 바쁜 일정으로 인해 직접 장을 보러 갈 수 없었던 상황을 설명합니다. &#39;phoned&#39;와 &#39;had delivered&#39;라는 동사를 통해, 자신이 직접 움직이는 대신 전화라는 수단을 이용해 서비스를 제공받았음을 나타내며 결과적으로 목적(식료품 구매)을 달성했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to shop (to부정사): time(명사)을 뒤에서 수식하는 형용사적 용법으로, &#39;쇼핑할&#39;이라는 의미를 가짐</div><div class=\"lec-gr-item\">had the groceries delivered 5형식(SVOC) 구조: &#39;have + 목적어(the groceries) + 목적보어(delivered)&#39; 형태임. 목적어인 식료품(groceries)과 목적보어인 과거분사(delivered) 사이에는 수동 관계가 성립하며, &#39;식료품이 배달되도록 하다&#39;라는 의미를 나타냄</div><div class=\"lec-gr-item\">delivered (과거분사): 5형식 구조에서 목적보어 역할을 하며, 목적어인 식료품이 배달되는 대상임을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shop</td><td class=\"m\">쇼핑하다, 물건을 사다</td></tr><tr><td class=\"w\">market</td><td class=\"m\">시장</td></tr><tr><td class=\"w\">yesterday</td><td class=\"m\">어제</td></tr><tr><td class=\"w\">phone</td><td class=\"m\">전화하다</td></tr><tr><td class=\"w\">store</td><td class=\"m\">가게, 상점</td></tr><tr><td class=\"w\">deliver</td><td class=\"m\">배달하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>어제 시장에 갈 시간이 부족했던 필자는 전화 주문을 통해 식료품을 집으로 배달받았다.</li><li>직접 방문하는 대신 서비스를 이용하여 상황을 효율적으로 해결했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The author used a phone delivery service because they lacked time to visit the market in person.</div>\n              <div class=\"lec-final-sum-ko\">필자는 매장에 직접 방문할 시간이 부족했기 때문에 전화 배달 서비스를 이용했다.</div></div></div>"],"segs":[[{"audio":"./review06_audio/1.mp3","hl":null}],[{"audio":"./review06_audio/2.mp3","hl":null}],[{"audio":"./review06_audio/3.mp3","hl":null},{"audio":"./review06_audio/4.mp3","hl":"stage-0"},{"audio":"./review06_audio/5.mp3","hl":"stage-1"},{"audio":"./review06_audio/6.mp3","hl":"stage-2"}],[{"audio":"./review06_audio/7.mp3","hl":null}],[{"audio":"./review06_audio/8.mp3","hl":"main"},{"audio":"./review06_audio/9.mp3","hl":"meaning"},{"audio":"./review06_audio/10.mp3","hl":"grammar"}],[{"audio":"./review06_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){t
