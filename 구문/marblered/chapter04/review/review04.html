포함되는데, 이는 마치 카메라로 동작을 찍어 관절의 각도와 힘의 분산을 분석해 효율적인 자세를 찾아내는 과정과 같죠. 또한, 착용형 기술(Wearable Technology)을 통해 심박수나 근육의 피로도를 실시간으로 확인하면서 부상을 방지하고 최상의 컨디션을 유지하는 것도 중요합니다. 이런 기술들은 선수들이 더 빠르고 강하게 움직이도록 돕는 운동 수행 능력 향상(Performance Enhancement)의 도구가 되어, 결과적으로 기록 단축과 같은 놀라운 성과를 만들어냅니다. 여러분이 좋아하는 운동선수들이 최신 장비와 데이터 분석을 통해 매번 새로운 기록을 세우는 것은, 단순히 운이 좋아서가 아니라 이러한 과학적 원리를 십분 활용하기 때문이랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01기술의 발전</div><ul><li>기술적 진보는 운동선수들의 수행 능력을 극적으로 변화시키고 있다.</li><li>과학적 발전(Technological advances)의 도래</li><li>운동선수의 신체적 한계 돌파 가능성</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02구체적인 신체 능력 향상</div><ul><li>다양한 신체 부문에서 경기력이 더욱 강화될 것이다.</li><li>속도(move faster)와 점프력(jump higher)의 증가</li><li>타격의 강도(hit harder)와 정확도 향상</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03일관성 유지</div><ul><li>기술은 단순히 신체 능력뿐만 아니라 경기력의 안정성까지 높여준다.</li><li>지속적인 경기력 유지(consistency)</li><li>기술을 통한 기량의 상향 평준화</li><li>핵심 키워드: 고성능 운동선수(high-performance athletes)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">technological</td><td class=\"m\">기술적인</td></tr><tr><td class=\"w\">advance</td><td class=\"m\">진보, 발전</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">~하게 하다, 허락하다</td></tr><tr><td class=\"w\">high-performance</td><td class=\"m\">고성능의, (운동선수가) 뛰어난 기량을 가진</td></tr><tr><td class=\"w\">athlete</td><td class=\"m\">운동선수</td></tr><tr><td class=\"w\">consistency</td><td class=\"m\">일관성, 지속성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기술적 진보는</span><span class=\"en\"><b>Technological advances</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하게 할 것이다</span><span class=\"en\"><b>will <span class=\"grammar-hl\">allow</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">높은 수준의 운동선수들이</span><span class=\"en\"><b><span class=\"grammar-hl\">high-performance athletes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 빨리 움직이도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to move faster,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 높이 뛰도록</span><span class=\"en\"><b><span class=\"grammar-hl\">jump higher,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 강하게 치도록</span><span class=\"en\"><b><span class=\"grammar-hl\">hit harder,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 향상하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">and improve</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 일관성을</span><span class=\"en\"><b><span class=\"grammar-hl\">their consistency</span>.</b></span></div></div><div class=\"lec-sent-ko\">기술적 진보는 높은 수준의 운동선수들이 더 빨리 움직이도록 더 높이 뛰도록 더 강하게 치도록 그리고 그들의 일관성을 향상하도록 하게 할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기술이 발전함에 따라 운동선수들의 기량이 향상될 것임을 설명하는 문장입니다. 여기서 consistency는 사전적으로는 &#39;일관성&#39;이라는 뜻이지만, 여기서는 운동 경기에서 기복 없이 매번 좋은 성적을 유지하는 능력을 의미합니다. 필자는 단순한 신체 능력의 향상뿐만 아니라, 꾸준히 실력을 발휘하는 능력까지 기술이 보완해 준다는 점을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">allow high-performance athletes to move faster, jump higher, hit harder, and improve their consistency (5형식(SVOC)): allow(동사) + high-performance athletes(목적어) + to move/jump/hit/improve(목적보어인 to부정사들) 구조. allow는 5형식 문형에서 목적어가 to부정사 하도록 허용하다는 의미로 쓰인다.</div><div class=\"lec-gr-item\">to move faster, jump higher, hit harder, and improve (to부정사): allow의 목적보어로 쓰인 to부정사 병렬 구조. 첫 번째 to move 이후의 jump, hit, improve는 to가 생략된 동사원형 형태이며, 모두 부사(faster, higher, harder)의 수식을 받고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">technological</td><td class=\"m\">기술적인</td></tr><tr><td class=\"w\">advance</td><td class=\"m\">진보, 발전</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">~하게 하다, 허락하다</td></tr><tr><td class=\"w\">high-performance</td><td class=\"m\">고성능의, (운동선수가) 뛰어난 기량을 가진</td></tr><tr><td class=\"w\">athlete</td><td class=\"m\">운동선수</td></tr><tr><td class=\"w\">consistency</td><td class=\"m\">일관성, 지속성</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>기술이 발전하면서 운동선수들의 신체적 수행 능력이 비약적으로 향상될 것이다.</li><li>기술은 단순히 속도나 힘뿐만 아니라 경기력의 꾸준함(일관성)까지 개선해 줄 것이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Technological developments help athletes improve their physical speed and power, and they allow for greater consistency in performance.</div>\n              <div class=\"lec-final-sum-ko\">기술 발전은 운동선수의 신체 속도와 힘을 향상시켜 주며, 경기 수행의 일관성을 높여준다.</div></div></div>"],"segs":[[{"audio":"./review04_audio/1.mp3","hl":null}],[{"audio":"./review04_audio/2.mp3","hl":null}],[{"audio":"./review04_audio/3.mp3","hl":null},{"audio":"./review04_audio/4.mp3","hl":"stage-0"},{"audio":"./review04_audio/5.mp3","hl":"stage-1"},{"audio":"./review04_audio/6.mp3","hl":"stage-2"}],[{"audio":"./review04_audio/7.mp3","hl":null}],[{"audio":"./review04_audio/8.mp3","hl":"main"},{"audio":"./review04_audio/9.mp3","hl":"meaning"},{"audio":"./review04_audio/10.mp3","hl":"grammar"}],[{"audio":"./review04_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function se
