로써 스스로의 가능성을 확장해 보는 건 어떨까요?</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01태도 변화</div><ul><li>자신이 할 수 없는 일에 얽매이지 말고, 지금 당장 실천할 수 있는 행동에 집중해야 합니다.</li><li>불가능에 대한 집착 버리기 (what you can’t do)</li><li>자신의 잠재력과 능력 인식하기</li><li>핵심 키워드: 집중(focus), 가능성(possibility)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02행동의 강조</div><ul><li>무엇을 할 수 없는지 고민하는 시간보다 실제 행동을 옮기는 것이 훨씬 중요합니다.</li><li>현재의 능력 범위 내에서 실천하기 (what you can do)</li><li>중단하지 않고 행동을 지속함</li><li>핵심 키워드: 행동(action), 실천(practice)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결론 및 제언</div><ul><li>자신의 한계를 걱정하며 멈춰 서기보다, 가능한 일부터 시작하는 것이 성장을 위한 길입니다.</li><li>성취의 시작은 작은 실천에서 비롯됨</li><li>자기 제한적인 사고방식에서 벗어나기</li><li>핵심 키워드: 성취(achievement), 한계(limit)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">let</td><td class=\"m\">~하게 두다, 허락하다</td></tr><tr><td class=\"w\">stop</td><td class=\"m\">막다, 그만두게 하다</td></tr><tr><td class=\"w\">from</td><td class=\"m\">~가 ...하는 것을 (막다)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내버려 두지 마라</span><span class=\"en\"><b>Don’t <span class=\"grammar-hl\">let</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 할 수 없는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">what you can’t do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신을 막도록</span><span class=\"en\"><b><span class=\"grammar-hl\">stop you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지 못하게</span><span class=\"en\"><b>from doing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 할 수 있는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">what you can do</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신이 할 수 없는 것이 당신이 할 수 있는 것을 하지 못하게 하도록 내버려 두지 마라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 자신의 한계나 부족함에 집중하기보다, 자신이 당장 실천할 수 있는 역량에 집중하라는 조언을 담고 있습니다. let은 사전적으로는 &#39;~하게 두다, 허락하다&#39;라는 뜻이지만, 여기서는 &#39;어떤 상황이 내 행동에 영향을 미치도록 내버려 두지 말라&#39;는 강한 자기 통제 의지를 나타냅니다. 필자는 &#39;못하는 것&#39;과 &#39;할 수 있는 것&#39;을 대조함으로써, 무력감에 빠져 기회를 놓치지 말라는 메시지를 강조하기 위해 이 동사를 선택했습니다. 앞부분의 &#39;할 수 없는 것&#39;이 뒷부분의 &#39;할 수 있는 행동&#39;의 걸림돌이 되어서는 안 된다는 논리적인 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let what you can’t do stop you 5형식(SVOC) 구조: let은 사역동사로 let + 목적어(what you can&#39;t do) + 목적보어(동사원형 stop)의 구조를 취하며, 목적어가 목적보어하는 것을 허용하다는 의미를 가짐.</div><div class=\"lec-gr-item\">what you can’t do (관계대명사): 선행사를 포함한 관계대명사 what은 &#39;~하는 것&#39;으로 해석되며, 문장에서 let의 목적어 역할을 함.</div><div class=\"lec-gr-item\">stop you from doing (관용표현): stop A from B(A가 B하는 것을 막다) 구조가 쓰였으며, 여기서 doing은 전치사 from 뒤에 온 동명사임.</div><div class=\"lec-gr-item\">what you can do (관계대명사): 선행사를 포함한 관계대명사 what은 &#39;~하는 것&#39;으로 해석되며, 전치사 from의 목적어 역할을 함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">let</td><td class=\"m\">~하게 두다, 허락하다</td></tr><tr><td class=\"w\">stop</td><td class=\"m\">막다, 그만두게 하다</td></tr><tr><td class=\"w\">from</td><td class=\"m\">~가 ...하는 것을 (막다)</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>자신의 한계에 얽매여 시간을 낭비하지 마라.</li><li>자신이 지금 당장 할 수 있는 일에 집중하는 것이 중요하다.</li><li>부정적인 제약보다는 긍정적인 실천에 초점을 맞추어야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">One should focus on what is possible, rather than being discouraged by what one cannot achieve.</div>\n              <div class=\"lec-final-sum-ko\">사람은 자신이 성취할 수 없는 것에 낙담하기보다는 할 수 있는 일에 집중해야 한다.</div></div></div>"],"segs":[[{"audio":"./review02_audio/1.mp3","hl":null}],[{"audio":"./review02_audio/2.mp3","hl":null}],[{"audio":"./review02_audio/3.mp3","hl":null},{"audio":"./review02_audio/4.mp3","hl":"stage-0"},{"audio":"./review02_audio/5.mp3","hl":"stage-1"},{"audio":"./review02_audio/6.mp3","hl":"stage-2"}],[{"audio":"./review02_audio/7.mp3","hl":null}],[{"audio":"./review02_audio/8.mp3","hl":"main"},{"audio":"./review02_audio/9.mp3","hl":"meaning"},{"audio":"./review02_audio/10.mp3","hl":"grammar"}],[{"audio":"./review02_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)r
