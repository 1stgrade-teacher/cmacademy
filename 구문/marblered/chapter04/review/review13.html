esolve conflicts)을 위한 새로운 외교적 압박</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nuclear</td><td class=\"m\">핵의</td></tr><tr><td class=\"w\">weapon</td><td class=\"m\">무기</td></tr><tr><td class=\"w\">turn A into B</td><td class=\"m\">A를 B로 바꾸다</td></tr><tr><td class=\"w\">superpower</td><td class=\"m\">초강대국</td></tr><tr><td class=\"w\">mad</td><td class=\"m\">미친, 제정신이 아닌</td></tr><tr><td class=\"w\">collective</td><td class=\"m\">집단적인, 공동의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">suicide</td><td class=\"m\">자살</td></tr><tr><td class=\"w\">force</td><td class=\"m\">강요하다</td></tr><tr><td class=\"w\">peaceful</td><td class=\"m\">평화로운</td></tr><tr><td class=\"w\">resolve</td><td class=\"m\">해결하다</td></tr><tr><td class=\"w\">conflict</td><td class=\"m\">갈등, 충돌</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">핵무기는</span><span class=\"en\"><b>Nuclear weapons</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바꾸어왔고</span><span class=\"en\"><b><span class=\"grammar-hl\">have turned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">초강대국 사이의 전쟁을</span><span class=\"en\"><b>war between superpowers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집단 자살이라는 광기 어린 행위로</span><span class=\"en\"><b>into a mad act of collective suicide,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강요해왔다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">forced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구상의 가장 강력한 국가들이</span><span class=\"en\"><b><span class=\"grammar-hl\">the most powerful nations on earth</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">평화로운 방법을 찾도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to find</span> <span class=\"grammar-hl\">peaceful ways</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분쟁을 해결할</span><span class=\"en\"><b><span class=\"grammar-hl\">to resolve conflicts</span>.</b></span></div></div><div class=\"lec-sent-ko\">핵무기는 초강대국 사이의 전쟁을 집단 자살이라는 광기 어린 행위로 바꾸어왔고 지구상의 가장 강력한 국가들이 분쟁을 해결할 평화로운 방법을 찾도록 강요해왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 핵무기가 등장하면서 강대국끼리의 전쟁은 더 이상 승자를 가리는 수단이 아니라, 모두가 파멸하는 **collective suicide**(집단 자살)라는 극단적인 상황이 되었습니다. 여기서 **turned A into B**는 단순히 &#39;A를 B로 바꾸다&#39;라는 뜻을 넘어, 전쟁의 성격이 과거의 &#39;승패를 겨루는 도구&#39;에서 &#39;모두의 파멸&#39;로 완전히 변질되었음을 강조합니다. 또한 **forced**는 물리적으로 강제로 시키는 것이 아니라, 핵무기라는 위협 때문에 국가들이 전쟁을 선택할 수밖에 없었던 기존의 관행을 버리고 &#39;평화적 해결&#39;을 택할 수밖에 없는 불가항력적인 상황에 처했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have turned (현재완료): 조동사 have와 과거분사(turned)가 결합하여 과거부터 현재까지 지속되거나 완료된 상태를 나타내는 시제 구조입니다.</div><div class=\"lec-gr-item\">forced the most powerful nations on earth to find 5형식(SVOC) 구조: force는 타동사로 force + O(the most powerful nations) + toV(to find)의 구조를 취합니다. 목적어(O)가 to부정사(OC)를 하도록 강제한다는 의미를 가집니다.</div><div class=\"lec-gr-item\">to find (to부정사): 5형식 문장에서 force 동사의 목적보어(OC)로 쓰여, 목적어가 수행해야 할 동작을 나타냅니다.</div><div class=\"lec-gr-item\">peaceful ways to resolve conflicts (to부정사): ways라는 명사를 뒤에서 수식하는 형용사적 용법으로, ~할 방법(resolve의 목적어인 conflicts를 취함)이라는 의미를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nuclear</td><td class=\"m\">핵의</td></tr><tr><td class=\"w\">weapon</td><td class=\"m\">무기</td></tr><tr><td class=\"w\">superpower</td><td class=\"m\">초강대국</td></tr><tr><td class=\"w\">mad</td><td class=\"m\">미친, 제정신이 아닌</td></tr><tr><td class=\"w\">collective</td><td class=\"m\">집단적인, 공동의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">suicide</td><td class=\"m\">자살</td></tr><tr><td class=\"w\">force</td><td class=\"m\">강요하다</td></tr><tr><td class=\"w\">peaceful</td><td class=\"m\">평화로운</td></tr><tr><td class=\"w\">resolve</td><td class=\"m\">해결하다</td></tr><tr><td class=\"w\">conflict</td><td class=\"m\">갈등, 충돌</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>핵무기의 등장은 강대국 간의 전면전을 &#39;집단 자살&#39;과 같은 파멸적 행위로 바꾸었다.</li><li>이 때문에 강력한 국가들은 전쟁 대신 평화적인 갈등 해결 방식을 찾을 수밖에 없게 되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Nuclear weapons transformed war into a suicidal act, and forced superpowers to resolve their conflicts through peaceful means.</div>\n              <div class=\"lec-final-sum-ko\">핵무기는 전쟁을 자살 행위로 바꾸어 놓았으며, 강대국들이 평화적인 방법으로 갈등을 해결하도록 만들었다.</div></div></div>"],"segs":[[{"audio":"./review13_audio/1.mp3","hl":null}],[{"audio":"./review13_audio/2.mp3","hl":null}],[{"audio":"./review13_audio/3.mp3","hl":null},{"audio":"./review13_audio/4.mp3","hl":"stage-0"},{"audio":"./review13_audio/5.mp3","hl":"stage-1"},{"audio":"./review13_audio/6.mp3","hl":"stage-2"}],[{"audio":"./review13_audio/7.mp3","hl":null}],[{"audio":"./review13_audio/8.mp3","hl":"main"},{"audio":"./review13_audio/9.mp3","hl":"meaning"},{"audio":"./review13_audio/10.mp3","hl":"grammar"}],[{"audio":"./review13_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeig
