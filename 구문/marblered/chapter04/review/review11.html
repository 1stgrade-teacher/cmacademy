 나아가기 위해 사용하는 심리적 통제권(Psychological control)의 가장 기본적이면서도 실질적인 수단이라고 할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01두 단어의 중요성</div><ul><li>우리의 인생 항로를 결정하는 가장 핵심적인 요소로 두 단어를 꼽을 수 있다.</li><li>인생의 운명을 좌우하는 결정적 단어</li><li>두 단어: 예(Yes)와 아니오(No)</li><li>핵심 키워드: 운명(destiny)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02선택의 가치</div><ul><li>삶의 방향은 우리가 무엇을 수용하고 무엇을 거절하느냐에 따라 정해진다.</li><li>Yes는 새로운 기회를 받아들이는 수용의 태도</li><li>No는 불필요한 것들을 차단하는 단호함</li><li>핵심 키워드: 결정(determine)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr><tr><td class=\"w\">determine</td><td class=\"m\">결정하다</td></tr><tr><td class=\"w\">destiny</td><td class=\"m\">운명</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&#39;네&#39;와 &#39;아니오&#39;는</span><span class=\"en\"><b>Yes and No</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 개의 가장 중요한 단어들이다</span><span class=\"en\"><b>are the two most important words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결정하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that determine</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 운명을</span><span class=\"en\"><b><span class=\"grammar-hl\">your destiny</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인생에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in life</span>.</b></span></div></div><div class=\"lec-sent-ko\">‘네’와 ‘아니오’는 인생에서 당신의 운명을 결정하는 두 개의 가장 중요한 단어들이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 주제문으로, 우리가 내리는 결정이 곧 인생을 만든다는 점을 강조합니다. 여기서 destiny는 사전적으로 ‘숙명’이나 ‘운명’을 뜻하는데, 여기서는 단순히 정해진 앞날이 아니라 스스로의 선택으로 만들어가는 ‘인생의 결과’를 의미합니다. 필자는 단어의 무게감을 높여 독자로 하여금 선택의 중요성을 깊이 체감하게 하려고 이 단어를 골랐습니다. 앞뒤 문장이 없지만, 이 문장 하나만으로도 앞으로의 글이 ‘선택과 책임’에 관한 것임을 알 수 있는 중심축 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that determine your destiny in life (관계대명사): that이 선행사 two most important words를 수식하는 주격 관계대명사절입니다. 관계대명사 뒤에는 주어가 생략된 불완전한 문장이 오며, 해당 절이 앞의 명사를 수식하는 역할을 합니다.</div><div class=\"lec-gr-item\">determine to부정사/동사 원형: 주격 관계대명사 that이 words를 대신하므로, 선행사 words의 수에 맞춰 복수형 동사(determine)가 사용되었습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr><tr><td class=\"w\">determine</td><td class=\"m\">결정하다</td></tr><tr><td class=\"w\">destiny</td><td class=\"m\">운명</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인생의 성패는 우리가 선택하는 ‘예’와 ‘아니오’라는 두 마디에 달려 있다.</li><li>결정을 내리는 것이 곧 자신의 운명을 설계하는 과정이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The words &#39;Yes&#39; and &#39;No&#39; serve as fundamental choices, and they act as the primary factors that shape your future path.</div>\n              <div class=\"lec-final-sum-ko\">&#39;예&#39;와 &#39;아니오&#39;라는 단어는 근본적인 선택의 역할을 하며, 당신의 미래 경로를 결정하는 주요 요인으로 작용한다.</div></div></div>"],"segs":[[{"audio":"./review11_audio/1.mp3","hl":null}],[{"audio":"./review11_audio/2.mp3","hl":null}],[{"audio":"./review11_audio/3.mp3","hl":null},{"audio":"./review11_audio/4.mp3","hl":"stage-0"},{"audio":"./review11_audio/5.mp3","hl":"stage-1"}],[{"audio":"./review11_audio/6.mp3","hl":null}],[{"audio":"./review11_audio/7.mp3","hl":"main"},{"audio":"./review11_audio/8.mp3","hl":
