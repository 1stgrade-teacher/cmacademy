거대한 우주부터 아주 작은 원자의 세계까지 인식의 범위(range of perception)를 넓혀가고 있는 셈이에요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01과학의 주요 목적</div><ul><li>과학은 인간이 가진 감각의 한계를 넘어서는 것을 목표로 한다.</li><li>인간의 감각 능력은 제한적임 (limited senses)</li><li>과학의 주된 목적 (principal aims) 제시</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02과학적 탐구 방식</div><ul><li>과학은 직접 관찰할 수 없는 현상을 우리가 알 수 있는 형태로 변환한다.</li><li>보이지 않는 현상 (invisible phenomena)</li><li>들리지 않는 현상 (inaudible phenomena)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03감각의 영역 확장</div><ul><li>과학적 과정을 통해 비가시적인 현상을 눈으로 보고 귀로 들을 수 있게 만든다.</li><li>현상을 관찰 가능한 사건으로 변환 (translating)</li><li>감각의 범위 확장 (extend the range)</li><li>핵심 키워드: 변환(translating), 확장(extend)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">principal</td><td class=\"m\">주요한</td></tr><tr><td class=\"w\">aim</td><td class=\"m\">목적</td></tr><tr><td class=\"w\">extend</td><td class=\"m\">확장하다</td></tr><tr><td class=\"w\">range</td><td class=\"m\">범위</td></tr><tr><td class=\"w\">limited</td><td class=\"m\">제한된</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sense</td><td class=\"m\">감각</td></tr><tr><td class=\"w\">translate</td><td class=\"m\">번역하다, 바꾸다</td></tr><tr><td class=\"w\">invisible</td><td class=\"m\">보이지 않는</td></tr><tr><td class=\"w\">inaudible</td><td class=\"m\">들리지 않는</td></tr><tr><td class=\"w\">phenomenon</td><td class=\"m\">현상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">주요한 목표들 중 하나는</span><span class=\"en\"><b>One of the principal aims</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학의</span><span class=\"en\"><b>of the sciences</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연장하는 것이다</span><span class=\"en\"><b>is <span class=\"grammar-hl\">to extend</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 제한된 감각의 범위를</span><span class=\"en\"><b>the range of our limited senses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바꿈으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">translating</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보이지 않고 들리지 않는 현상을</span><span class=\"en\"><b><span class=\"grammar-hl\">invisible and inaudible phenomena</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사건들로</span><span class=\"en\"><b>into events</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보여지거나 들릴 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that can be seen or heard</span>.</b></span></div></div><div class=\"lec-sent-ko\">과학의 주요한 목표 중 하나는 보이지 않고 들리지 않는 현상을 보이거나 들릴 수 있는 사건으로 바꿈으로써 우리의 제한된 감각의 범위를 연장하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과학이 존재하는 핵심 이유를 설명하는 문장입니다. 여기서 principal은 사전적으로 &#39;교장&#39;이나 &#39;주요한&#39;이라는 뜻인데, 여기서는 과학의 수많은 목표 중 &#39;가장 핵심적인&#39; 것을 강조하기 위해 선택되었습니다. 또한 extend는 사전적으로 &#39;길이를 늘리다&#39;는 뜻이지만, 여기서는 인간이 가진 생물학적 감각의 한계를 기술을 통해 &#39;넘어서게 만든다&#39;는 의미로 쓰였습니다. translating은 언어를 번역한다는 뜻을 넘어, 우리가 감지할 수 없는 정보를 시각·청각적 데이터로 &#39;바꾸어 놓는&#39; 과정을 비유적으로 표현한 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to extend (to부정사): be동사(is)의 보어 역할을 하는 명사적 용법으로, &#39;목적&#39;이나 &#39;내용&#39;을 명시하는 구조입니다.</div><div class=\"lec-gr-item\">translating (동명사): 전치사(by)의 목적어 자리에 위치하여 &#39;수단/방법&#39;을 나타내는 명사적 기능입니다.</div><div class=\"lec-gr-item\">invisible and inaudible phenomena (현재분사(형용사)): invisible과 inaudible은 접두사 in-과 -able이 결합하여 명사(phenomena)를 수식하는 형용사적 성격을 띱니다.</div><div class=\"lec-gr-item\">that can be seen or heard (관계대명사): that은 선행사(events)를 수식하는 주격 관계대명사이며, 뒤에 수동태(be+p.p.) 구조가 이어집니다.</div><div class=\"lec-gr-item\">can be seen or heard (수동태): be동사(be)+p.p.(seen/heard) 구조입니다. see와 hear는 타동사인데 목적어가 없어서 수동구조로 씁니다. 기본구조: V + O(목적어) 형태를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">principal</td><td class=\"m\">주요한</td></tr><tr><td class=\"w\">aim</td><td class=\"m\">목적</td></tr><tr><td class=\"w\">extend</td><td class=\"m\">확장하다</td></tr><tr><td class=\"w\">range</td><td class=\"m\">범위</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">limited</td><td class=\"m\">제한된</td></tr><tr><td class=\"w\">sense</td><td class=\"m\">감각</td></tr><tr><td class=\"w\">invisible</td><td class=\"m\">보이지 않는</td></tr><tr><td class=\"w\">inaudible</td><td class=\"m\">들리지 않는</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과학의 주된 목적은 인간의 타고난 감각이 가진 한계를 넓히는 것이다.</li><li>이를 위해 과학은 눈에 보이지 않거나 들리지 않는 현상을 관찰 가능한 형태로 바꾼다.</li><li>즉, 과학은 감각의 물리적 제약을 기술로 극복하게 해주는 도구이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Science translates invisible or inaudible phenomena into observable events, so it extends the limits of our natural senses.</div>\n              <div class=\"lec-final-sum-ko\">과학은 보이지 않거나 들리지 않는 현상을 관찰 가능한 사건으로 바꾸며, 이를 통해 인간의 제한된 감각을 확장한다.</div></div></div>"],"segs":[[{"audio":"./review12_audio/1.mp3","hl":null}],[{"audio":"./review12_audio/2.mp3","hl":null}],[{"audio":"./review12_audio/3.mp3","hl":null},{"audio":"./review12_audio/4.mp3","hl":"stage-0"},{"audio":"./review12_audio/5.mp3","hl":"stage-1"},{"audio":"./review12_audio/6.mp3","hl":"stage-2"}],[{"audio":"./review12_audio/7.mp3","hl":null}],[{"audio":"./review12_audio/8.mp3","hl":"ma
