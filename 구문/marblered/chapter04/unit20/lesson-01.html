  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  if(D.preview){cc.classList.add("on");}

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

lecturePlayer(document.getElementById("app"),{"brand":"unit20","title":"보어 뒤에 붙는 형용사절 — 문장을 풍부하게 만드는 블록","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>보어 뒤에 붙는 형용사절 — 문장을 풍부하게 만드는 블록\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>보어 뒤에 관계대명사나 관계부사가 이끄는 형용사절이 붙는 구조를 이해하고 긴 문장을 정확하게 읽는다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 보어 뒤에 형용사절이 붙어서 문장을 더 자세하고 풍부하게 만드는 구문을 배워 볼 거예요. 명사 하나만으로는 부족할 때 뒤에서 어떤 정보를 덧붙이는지 차근차근 살펴보겠습니다. 오늘 배우는 관계대명사와 관계부사의 블록을 잘 익혀 두면 독해가 훨씬 편해질 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">이 유닛의 핵심은 \u003cb class=\"key\">보어\u003c/b> 뒤에 \u003cb class=\"key\">관계대명사\u003c/b>나 \u003cb class=\"key\">관계부사\u003c/b>가 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 붙어 보어를 자세히 꾸며 주는 구조입니다. 관계사절은 앞의 명사에 대한 정보를 덧붙이고, 관계부사는 장소·시간·이유를 나타내는 전치사구 역할을 합니다. 전치사와 관계대명사가 함께 쓰인 \u003cb class=\"key\">in which\u003c/b>, \u003cb class=\"key\">through which\u003c/b>는 각각 \u003cb class=\"key\">where\u003c/b>나 관계사절 끝의 전치사 구조로 바꿔 이해할 수 있습니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Education is \u003cspan class=\"fx\">the most powerful weapon which you can use to change the world\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 Life is \u003cspan class=\"fx\">a game where there are multiple winners\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 King Arthur was \u003cspan class=\"fx\">a legendary king who brought peace to his kingdom by vanquishing all forms of evil\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 In family life, love is \u003cspan class=\"fx\">the oil that eases friction, the cement that binds closer together, and the music that brings harmony\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Nutrition education in schools can help more students eat \u003cspan class=\"fx\">balanced diets that include more vegetables\u003c/span> and have a healthy life.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 According to one traditional definition, aesthetics is \u003cspan class=\"fx\">the branch of philosophy that deals with beauty, especially beauty in the arts\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 Love is like \u003cspan class=\"fx\">a beautiful flower which I may not touch, but whose fragrance makes the garden a place of delight just the same\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 I consider nature \u003cspan class=\"fx\">a vast chemical laboratory in which all kinds of composition and decompositions are formed\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 At the personal level, competition allows us to become \u003cspan class=\"fx\">the best individual we can be\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 In many situations the boundary between good and bad is \u003cspan class=\"fx\">a reference point that changes over time and depends on the immediate circumstances\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Better keep yourself clean and bright; you are \u003cspan class=\"fx\">the window through which you must see the world\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Every novel is an equal collaboration between the writer and the reader and it is \u003cspan class=\"fx\">the only place in the world where two strangers can meet on terms of absolute intimacy\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘의 핵심은 주어 동사 보어 뒤에 관계사절이 붙는다는 점이에요. 보어인 명사 뒤에서 who, which, that 같은 관계대명사가 이끄는 절이 그 명사를 꾸며 줍니다. where나 when 같은 관계부사는 장소와 시간을 나타내면서 절을 이어 주죠. in which나 through which처럼 전치사가 붙은 표현도 where나 문장 끝 전치사로 바꿔 이해하면 쉬워요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Education is \u003cspan class=\"fx\">the most powerful weapon which you can use to change the world\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Education is the most powerful weapon \u003c/div>\u003cdiv class=\"k\">교육은 가장 강력한 무기이다\u003c/div>\u003cdiv class=\"e\">which you can use \u003c/div>\u003cdiv class=\"k\">당신이 사용할 수 있는\u003c/div>\u003cdiv class=\"e\">to change the world.\u003c/div>\u003cdiv class=\"k\">세상을 바꾸기 위해서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>보어인 \u003cb class=\"key\">the most powerful weapon\u003c/b> 뒤에 관계대명사 \u003cb class=\"key\">which\u003c/b>가 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 붙어 무기의 용도를 설명합니다. which는 선행사 weapon을 받는 목적격 관계대명사입니다.\u003c/div>","segs":[{"n":3,"text":"Education is the most powerful weapon, 교육은 가장 강력한 무기이다. which you can use, 당신이 사용할 수 있는. to change the world, 세상을 바꾸기 위해서","hl":"ch"},{"n":4,"text":"첫 번째 문장을 볼게요. Education is the most powerful weapon which you can use to change the world. 여기서 보어인 the most powerful weapon 뒤에 which가 이끄는 절이 붙어서 어떤 무기인지 설명해 줍니다. which는 앞의 weapon을 받는 목적격 관계대명사이고, to change the world는 그 무기를 사용하는 목적을 나타내요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Education is \u003cspan class=\"fx\">the most powerful weapon which you can use to change the world\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>교육은 세상을 바꾸는 힘을 가진 가장 강한 도구라는 뜻입니다. 여기서 무기 weapon은 물리적 무기가 아니라 변화를 만드는 수단을 비유한 표현이에요. 그래서 교육의 가치와 가능성을 강조하는 문장으로 읽으면 됩니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the most powerful weapon which you can use to change the world\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the most powerful tool you can use to change the world\u003c/span>\u003cdiv class=\"w\">weapon을 tool로 바꾸면 폭력적 뉘앙스가 줄고 수단이라는 뜻이 선명해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">which you can use to change the world\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">that you can use to change the world\u003c/span>\u003cdiv class=\"w\">목적격 관계대명사 which를 that으로 바꿔도 같은 구조로 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">powerful\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">strong\u003c/span>\u003cspan class=\"y-eq\">powerful = strong\u003c/span>\u003cdiv class=\"w\">힘의 정도를 나타내는 형용사를 더 일상적인 strong으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">change the world\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">transform the world\u003c/span>\u003cspan class=\"y-eq\">change = transform\u003c/span>\u003cdiv class=\"w\">change를 transform으로 바꾸면 더 큰 변화와 근본적 전환의 느낌을 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">use to change\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">utilize to change\u003c/span>\u003cspan class=\"y-eq\">use = utilize\u003c/span>\u003cdiv class=\"w\">use를 utilize로 바꾸면 격식 있는 어조가 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Education is the strongest tool you can use to transform the world.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 교육이 세상을 바꾸는 가장 강력한 수단이라는 뜻이에요. 여기서 weapon은 실제 무기가 아니라 변화를 만드는 힘을 비유한 표현이죠. 그래서 교육의 가치와 가능성을 강조하는 문장으로 이해하면 됩니다.","hl":"mn"},{"n":6,"text":"which를 that으로 바꿔도 같은 뜻으로 쓸 수 있어요. 또 weapon을 tool로 바꾸면 폭력적인 느낌은 줄고 수단이라는 의미가 더 선명해집니다.","hl":"rw"},{"n":7,"text":"powerful은 strong으로 바꿔 말할 수 있고, change the world는 transform the world처럼 더 큰 변화의 느낌으로 표현할 수 있어요. use를 utilize로 바꾸면 조금 더 격식 있는 어조가 됩니다.","hl":"ph"},{"n":8,"text":"전체 뜻을 바꿔 말하면 Education is the strongest tool you can use to transform the world. 라고 할 수 있어요. 교육을 세상을 바꾸는 가장 강한 도구로 표현한 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 Life is \u003cspan class=\"fx\">a game where there are multiple winners\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Life is a game \u003c/div>\u003cdiv class=\"k\">인생은 게임이다\u003c/div>\u003cdiv class=\"e\">where there are multiple winners.\u003c/div>\u003cdiv class=\"k\">다수의 승자가 존재하는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>보어인 \u003cb class=\"key\">a game\u003c/b> 뒤에 관계부사 \u003cb class=\"key\">where\u003c/b>가 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 붙어 게임의 성격을 설명합니다. where는 in which로 바꿀 수 있고, 뒤에는 there are 구문이 이어집니다.\u003c/div>","segs":[{"n":9,"text":"Life is a game, 인생은 게임이다. where there are multiple winners, 다수의 승자가 존재하는","hl":"ch"},{"n":10,"text":"두 번째 문장을 볼게요. Life is a game where there are multiple winners. 보어인 a game 뒤에 where가 이끄는 절이 붙어서 어떤 게임인지 설명합니다. 여기서 where는 in which로 바꿔 쓸 수 있고, 뒤에는 there are 구문이 이어져요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 Life is \u003cspan class=\"fx\">a game where there are multiple winners\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인생은 승자가 한 명뿐인 경쟁이 아니라 여러 명이 함께 이길 수 있는 게임이라는 뜻입니다. 경쟁의 결과를 하나로만 보지 말고 다양한 방식의 성취를 인정하자는 메시지로 읽을 수 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a game where there are multiple winners\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a game in which there are multiple winners\u003c/span>\u003cdiv class=\"w\">where를 in which로 바꾸면 더 격식 있는 관계사절 표현이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">multiple winners\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">more than one winner\u003c/span>\u003cdiv class=\"w\">multiple을 풀어 써서 여러 명의 승자라는 뜻을 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">multiple\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">several\u003c/span>\u003cspan class=\"y-eq\">multiple = several\u003c/span>\u003cdiv class=\"w\">여러 개라는 뜻을 더 일상적인 several로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">winners\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">victors\u003c/span>\u003cspan class=\"y-eq\">winners = victors\u003c/span>\u003cdiv class=\"w\">승리자를 뜻하는 더 격식 있고 문어적인 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Life is a game in which more than one person can win.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 인생이 승자 한 명만 남는 게임이 아니라 여러 명이 함께 이길 수 있는 게임이라는 뜻이에요. 경쟁의 결과를 하나로만 보지 말자는 따뜻한 메시지로 읽을 수 있습니다.","hl":"mn"},{"n":12,"text":"where를 in which로 바꾸면 더 격식 있는 표현이 돼요. multiple winners를 more than one winner처럼 풀어 쓰면 뜻이 더 분명해집니다.","hl":"rw"},{"n":13,"text":"multiple은 several로 바꿔 말할 수 있고, winners는 victors처럼 조금 더 문어적인 표현으로 바꿀 수 있어요.","hl":"ph"},{"n":14,"text":"전체 문장을 바꿔 말하면 Life is a game in which more than one person can win. 이라고 할 수 있어요. 여러 사람이 승자가 될 수 있는 게임이라는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 King Arthur was \u003cspan class=\"fx\">a legendary king who brought peace to his kingdom by vanquishing all forms of evil\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">King Arthur was a legendary king \u003c/div>\u003cdiv class=\"k\">아서왕은 전설적인 왕이었다\u003c/div>\u003cdiv class=\"e\">who brought peace to his kingdom \u003c/div>\u003cdiv class=\"k\">자신의 왕국에 평화를 가져다준\u003c/div>\u003cdiv class=\"e\">by vanquishing all forms of evil.\u003c/div>\u003cdiv class=\"k\">모든 형태의 악을 무찌름으로써\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>보어인 \u003cb class=\"key\">a legendary king\u003c/b> 뒤에 관계대명사 \u003cb class=\"key\">who\u003c/b>가 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 붙어 아서왕이 어떤 왕이었는지 설명합니다. who는 선행사 king을 받는 주격 관계대명사이고, by vanquishing은 평화를 가져온 방법을 나타냅니다.\u003c/div>","segs":[{"n":15,"text":"King Arthur was a legendary king, 아서왕은 전설적인 왕이었다. who brought peace to his kingdom, 자신의 왕국에 평화를 가져다준. by vanquishing all forms of evil, 모든 형태의 악을 무찌름으로써","hl":"ch"},{"n":16,"text":"세 번째 문장을 볼게요. King Arthur was a legendary king who brought peace to his kingdom by vanquishing all forms of evil. 보어인 a legendary king 뒤에 who가 이끄는 절이 붙어서 아서왕이 어떤 왕이었는지 설명합니다. who는 king을 받는 주격 관계대명사이고, by vanquishing은 평화를 가져온 방법을 보여 줘요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 King Arthur was \u003cspan class=\"fx\">a legendary king who brought peace to his kingdom by vanquishing all forms of evil\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>아서왕은 모든 형태의 악을 물리쳐 왕국에 평화를 가져온 전설적인 인물이라는 뜻입니다. vanquishing은 단순히 이기는 것을 넘어 악을 완전히 제압하는 강한 이미지를 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">who brought peace to his kingdom\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who established peace in his kingdom\u003c/span>\u003cdiv class=\"w\">brought peace to를 established peace in으로 바꿔 더 격식 있게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by vanquishing all forms of evil\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">by defeating every kind of evil\u003c/span>\u003cdiv class=\"w\">vanquishing을 defeating으로 풀어 써서 의미를 쉽게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">legendary\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fabled\u003c/span>\u003cspan class=\"y-eq\">legendary = fabled\u003c/span>\u003cdiv class=\"w\">전설적인이라는 뜻을 문어적 표현 fabled로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">vanquish\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">defeat\u003c/span>\u003cspan class=\"y-eq\">vanquish = defeat\u003c/span>\u003cdiv class=\"w\">무찌르다라는 뜻을 더 일반적인 defeat로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">all forms of evil\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">every kind of evil\u003c/span>\u003cspan class=\"y-eq\">all forms of = every kind of\u003c/span>\u003cdiv class=\"w\">모든 형태라는 표현을 every kind of로 풀어 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">King Arthur was a legendary king who established peace in his kingdom by defeating every kind of evil.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 아서왕이 모든 형태의 악을 물리쳐 왕국에 평화를 가져온 전설적인 인물이라는 뜻이에요. vanquishing은 단순히 이기는 것을 넘어 악을 완전히 제압하는 강한 느낌을 줍니다.","hl":"mn"},{"n":18,"text":"who brought peace to his kingdom는 who established peace in his kingdom처럼 더 격식 있게 바꿀 수 있어요. by vanquishing all forms of evil은 by defeating every kind of evil로 풀어 쓸 수 있습니다.","hl":"rw"},{"n":19,"text":"legendary는 fabled로 바꿀 수 있고, vanquish는 defeat로 쉽게 바꿀 수 있어요. all forms of evil은 every kind of evil처럼 표현할 수 있습니다.","hl":"ph"},{"n":20,"text":"전체 문장을 바꿔 말하면 King Arthur was a legendary king who established peace in his kingdom by defeating every kind of evil. 이라고 할 수 있어요. 전설적인 왕이 악을 물리치고 평화를 세웠다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 In family life, love is \u003cspan class=\"fx\">the oil that eases friction, the cement that binds closer together, and the music that brings harmony\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">In family life, \u003c/div>\u003cdiv class=\"k\">가정생활에서\u003c/div>\u003cdiv class=\"e\">love is the oil \u003c/div>\u003cdiv class=\"k\">사랑은 기름이다\u003c/div>\u003cdiv class=\"e\">that eases friction, \u003c/div>\u003cdiv class=\"k\">마찰을 완화시켜 주는\u003c/div>\u003cdiv class=\"e\">the cement \u003c/div>\u003cdiv class=\"k\">시멘트이다\u003c/div>\u003cdiv class=\"e\">that binds closer together, \u003c/div>\u003cdiv class=\"k\">더 가깝게 결속시키는\u003c/div>\u003cdiv class=\"e\">and the music \u003c/div>\u003cdiv class=\"k\">그리고 음악이다\u003c/div>\u003cdiv class=\"e\">that brings harmony.\u003c/div>\u003cdiv class=\"k\">조화를 가져다주는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>콤마와 and로 병렬 연결된 보어 \u003cb class=\"key\">the oil\u003c/b>, \u003cb class=\"key\">the cement\u003c/b>, \u003cb class=\"key\">the music\u003c/b>이 각각 관계대명사 \u003cb class=\"key\">that\u003c/b>이 이끄는 \u003cb class=\"key\">형용사절\u003c/b>의 수식을 받습니다. 세 관계사절은 사랑이 가정에서 하는 역할을 하나씩 구체화합니다.\u003c/div>","segs":[{"n":21,"text":"In family life, 가정생활에서. love is the oil, 사랑은 기름이다. that eases friction, 마찰을 완화시켜 주는. the cement, 시멘트이다. that binds closer together, 더 가깝게 결속시키는. and the music, 그리고 음악이다. that brings harmony, 조화를 가져다주는","hl":"ch"},{"n":22,"text":"네 번째 문장을 볼게요. In family life, love is the oil that eases friction, the cement that binds closer together, and the music that brings harmony. 여기서는 the oil, the cement, the music이 and로 병렬 연결되어 있고, 각각 that이 이끄는 절이 뒤에서 꾸며 줍니다. 세 개의 절이 사랑의 역할을 하나씩 구체적으로 설명해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 In family life, love is \u003cspan class=\"fx\">the oil that eases friction, the cement that binds closer together, and the music that brings harmony\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사랑은 가정생활의 마찰을 줄이고 가족을 더 가깝게 묶으며 조화를 만드는 힘이라는 뜻입니다. 기름, 시멘트, 음악이라는 비유를 통해 사랑의 부드러움, 결속력, 조화의 기능을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the oil that eases friction\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the oil that reduces friction\u003c/span>\u003cdiv class=\"w\">eases를 reduces로 바꿔 뜻을 분명하게 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the cement that binds closer together\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the cement that holds people closer together\u003c/span>\u003cdiv class=\"w\">bind를 hold people together로 풀어 써서 의미를 쉽게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ease\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">relieve\u003c/span>\u003cspan class=\"y-eq\">ease = relieve\u003c/span>\u003cdiv class=\"w\">완화하다라는 뜻을 relieve로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">friction\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">conflict\u003c/span>\u003cspan class=\"y-eq\">friction = conflict\u003c/span>\u003cdiv class=\"w\">마찰을 갈등이라는 뜻으로 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">bind\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">unite\u003c/span>\u003cspan class=\"y-eq\">bind = unite\u003c/span>\u003cdiv class=\"w\">결속시키다라는 뜻을 unite로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">In family life, love is the oil that reduces conflict, the cement that unites family members, and the music that creates harmony.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"사랑은 가정에서 마찰을 줄이고 가족을 더 가깝게 묶고 조화를 만드는 힘이라는 뜻이에요. 기름, 시멘트, 음악이라는 비유를 통해 사랑의 부드러움과 결속력과 조화의 기능을 강조합니다.","hl":"mn"},{"n":24,"text":"the oil that eases friction은 the oil that reduces friction으로 바꿀 수 있어요. the cement that binds closer together는 the cement that holds people closer together처럼 풀어 쓸 수 있습니다.","hl":"rw"},{"n":25,"text":"ease는 relieve로 바꿀 수 있고, friction은 conflict로 풀어 쓸 수 있어요. bind는 unite로 바꾸면 결속시키다는 뜻이 잘 드러납니다.","hl":"ph"},{"n":26,"text":"전체 문장을 바꿔 말하면 In family life, love is the oil that reduces conflict, the cement that unites family members, and the music that creates harmony. 라고 할 수 있어요. 사랑이 가정에 평화와 결속과 조화를 준다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Nutrition education in schools can help more students eat \u003cspan class=\"fx\">balanced diets that include more vegetables\u003c/span> and have a healthy life.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Nutrition education in schools \u003c/div>\u003cdiv class=\"k\">학교에서의 영양 교육은\u003c/div>\u003cdiv class=\"e\">can help more students \u003c/div>\u003cdiv class=\"k\">더 많은 학생들이\u003c/div>\u003cdiv class=\"e\">eat balanced diets \u003c/div>\u003cdiv class=\"k\">균형잡힌 식단을 먹도록 도울 수 있다\u003c/div>\u003cdiv class=\"e\">that include more vegetables \u003c/div>\u003cdiv class=\"k\">더 많은 채소를 포함하는\u003c/div>\u003cdiv class=\"e\">and have a healthy life.\u003c/div>\u003cdiv class=\"k\">그리고 건강한 삶을 살도록\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>동사 \u003cb class=\"key\">help\u003c/b> 뒤에 목적어 more students와 동사원형 \u003cb class=\"key\">eat\u003c/b>, \u003cb class=\"key\">have\u003c/b>가 이어지는 \u003cb class=\"key\">help + 목적어 + 동사원형\u003c/b> 구문입니다. 목적어 역할을 하는 \u003cb class=\"key\">balanced diets\u003c/b> 뒤에는 관계대명사 \u003cb class=\"key\">that\u003c/b>이 이끄는 형용사절이 붙어 어떤 식단인지 설명합니다.\u003c/div>","segs":[{"n":27,"text":"Nutrition education in schools, 학교에서의 영양 교육은. can help more students, 더 많은 학생들이. eat balanced diets, 균형잡힌 식단을 먹도록 도울 수 있다. that include more vegetables, 더 많은 채소를 포함하는. and have a healthy life, 그리고 건강한 삶을 살도록","hl":"ch"},{"n":28,"text":"다섯 번째 문장을 볼게요. Nutrition education in schools can help more students eat balanced diets that include more vegetables and have a healthy life. help 다음에 목적어와 동사원형이 오는 구조이고, balanced diets 뒤에는 that이 이끄는 절이 붙어 어떤 식단인지 설명합니다. and have a healthy life는 학생들이 건강한 삶을 살도록 돕는다는 내용을 이어 줘요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Nutrition education in schools can help more students eat \u003cspan class=\"fx\">balanced diets that include more vegetables\u003c/span> and have a healthy life.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>학교 영양 교육은 학생들이 채소가 더 들어간 균형 잡힌 식단을 먹고 건강한 삶을 살도록 도울 수 있다는 뜻입니다. 교육이 식습관과 건강을 함께 개선하는 실천적 역할을 한다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">can help more students eat balanced diets\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can help more students to eat balanced diets\u003c/span>\u003cdiv class=\"w\">help 뒤 목적격보어로 to부정사를 써도 같은 뜻이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">balanced diets that include more vegetables\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">balanced diets containing more vegetables\u003c/span>\u003cdiv class=\"w\">관계사절을 분사구로 간단히 바꾼 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nutrition education\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">dietary education\u003c/span>\u003cspan class=\"y-eq\">nutrition education = dietary education\u003c/span>\u003cdiv class=\"w\">영양 교육을 식이 교육이라는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">balanced diets\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">well-balanced meals\u003c/span>\u003cspan class=\"y-eq\">balanced diets = well-balanced meals\u003c/span>\u003cdiv class=\"w\">균형 잡힌 식단을 더 일상적인 meals로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">include\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">contain\u003c/span>\u003cspan class=\"y-eq\">include = contain\u003c/span>\u003cdiv class=\"w\">포함하다라는 뜻을 contain으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">School nutrition education can help more students eat well-balanced meals containing more vegetables and live healthy lives.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 학교 영양 교육이 학생들에게 채소가 더 들어간 균형 잡힌 식단을 먹게 하고 건강한 삶을 살도록 도울 수 있다는 뜻이에요. 교육이 식습관과 건강을 함께 개선하는 실천적 역할을 한다는 점을 강조합니다.","hl":"mn"},{"n":30,"text":"can help more students eat는 can help more students to eat로 바꿔도 같은 뜻이에요. balanced diets that include more vegetables는 balanced diets containing more vegetables처럼 더 간단히 표현할 수 있습니다.","hl":"rw"},{"n":31,"text":"nutrition education은 dietary education으로 바꿀 수 있고, balanced diets는 well-balanced meals로 바꿀 수 있어요. include는 contain으로 바꿔도 자연스럽습니다.","hl":"ph"},{"n":32,"text":"전체 문장을 바꿔 말하면 School nutrition education can help more students eat well-balanced meals containing more vegetables and live healthy lives. 라고 할 수 있어요. 영양 교육이 식습관과 건강을 함께 돕는다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 According to one traditional definition, aesthetics is \u003cspan class=\"fx\">the branch of philosophy that deals with beauty, especially beauty in the arts\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">According to one traditional definition, \u003c/div>\u003cdiv class=\"k\">하나의 전통적인 정의에 따르면\u003c/div>\u003cdiv class=\"e\">aesthetics is the branch of philosophy \u003c/div>\u003cdiv class=\"k\">미학은 철학의 한 부분이다\u003c/div>\u003cdiv class=\"e\">that deals with beauty, \u003c/div>\u003cdiv class=\"k\">미를 다루는\u003c/div>\u003cdiv class=\"e\">especially beauty in the arts.\u003c/div>\u003cdiv class=\"k\">특히 예술에서의 미를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>보어인 \u003cb class=\"key\">the branch of philosophy\u003c/b>에서 중심 명사 \u003cb class=\"key\">philosophy\u003c/b> 뒤에 관계대명사 \u003cb class=\"key\">that\u003c/b>이 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 붙어 철학의 어떤 부분인지 설명합니다. that은 선행사 philosophy를 받는 주격 관계대명사입니다.\u003c/div>","segs":[{"n":33,"text":"According to one traditional definition, 하나의 전통적인 정의에 따르면. aesthetics is the branch of philosophy, 미학은 철학의 한 부분이다. that deals with beauty, 미를 다루는. especially beauty in the arts, 특히 예술에서의 미를","hl":"ch"},{"n":34,"text":"여섯 번째 문장을 볼게요. According to one traditional definition, aesthetics is the branch of philosophy that deals with beauty, especially beauty in the arts. 보어인 the branch of philosophy에서 philosophy 뒤에 that이 이끄는 절이 붙어서 철학의 어떤 부분인지 설명합니다. that은 philosophy를 받는 주격 관계대명사예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 According to one traditional definition, aesthetics is \u003cspan class=\"fx\">the branch of philosophy that deals with beauty, especially beauty in the arts\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>미학은 아름다움, 특히 예술 속 아름다움을 다루는 철학의 한 분야라는 뜻입니다. branch는 나뭇가지에서 나온 비유로 학문의 한 갈래를 뜻해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the branch of philosophy that deals with beauty\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the area of philosophy that deals with beauty\u003c/span>\u003cdiv class=\"w\">branch를 area로 바꿔 더 쉽게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">deals with beauty\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is concerned with beauty\u003c/span>\u003cdiv class=\"w\">deal with를 be concerned with로 바꾸면 더 격식 있는 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class= n a place of delight just the same\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Love is like a beautiful flower \u003c/div>\u003cdiv class=\"k\">사랑은 아름다운 꽃과 같다\u003c/div>\u003cdiv class=\"e\">which I may not touch, \u003c/div>\u003cdiv class=\"k\">내가 만질 수 없는\u003c/div>\u003cdiv class=\"e\">but whose fragrance makes the garden \u003c/div>\u003cdiv class=\"k\">하지만 그 향기가 정원을 만드는\u003c/div>\u003cdiv class=\"e\">a place of delight just the same.\u003c/div>\u003cdiv class=\"k\">마찬가지로 기쁨의 장소로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>보어인 \u003cb class=\"key\">like a beautiful flower\u003c/b>에서 \u003cb class=\"key\">a beautiful flower\u003c/b>를 관계대명사 \u003cb class=\"key\">which\u003c/b>가 이끄는 절과 소유격 관계대명사 \u003cb class=\"key\">whose\u003c/b>가 이끄는 절이 함께 수식합니다. which절은 만질 수 없다는 내용을, whose절은 향기가 정원을 기쁨의 장소로 만든다는 내용을 덧붙입니다.\u003c/div>","segs":[{"n":39,"text":"Love is like a beautiful flower, 사랑은 아름다운 꽃과 같다. which I may not touch, 내가 만질 수 없는. but whose fragrance makes the garden, 하지만 그 향기가 정원을 만드는. a place of delight just the same, 마찬가지로 기쁨의 장소로","hl":"ch"},{"n":40,"text":"일곱 번째 문장을 볼게요. Love is like a beautiful flower which I may not touch, but whose fragrance makes the garden a place of delight just the same. a beautiful flower 뒤에 which가 이끄는 절과 whose가 이끄는 절이 함께 붙어서 꽃을 자세히 설명합니다. which절은 만질 수 없다는 내용을, whose절은 향기가 정원을 기쁘게 한다는 내용을 덧붙여요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 Love is like \u003cspan class=\"fx\">a beautiful flower which I may not touch, but whose fragrance makes the garden a place of delight just the same\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사랑은 직접 만질 수 없지만 그 향기만으로 주변을 기쁘게 하는 꽃과 같다는 뜻입니다. 눈에 보이지 않아도 존재 자체로 즐거움과 행복을 준다는 함축이 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">which I may not touch\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">that I may not touch\u003c/span>\u003cdiv class=\"w\">목적격 관계대명사 which를 that으로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whose fragrance makes the garden a place of delight\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the fragrance of which makes the garden a place of delight\u003c/span>\u003cdiv class=\"w\">whose를 of which로 바꾼 더 격식 있는 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fragrance\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">scent\u003c/span>\u003cspan class=\"y-eq\">fragrance = scent\u003c/span>\u003cdiv class=\"w\">향기라는 뜻을 scent로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a place of delight\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a delightful place\u003c/span>\u003cspan class=\"y-eq\">a place of delight = a delightful place\u003c/span>\u003cdiv class=\"w\">기쁨의 장소라는 표현을 형용사 delightful로 간단히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">just the same\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">all the same\u003c/span>\u003cspan class=\"y-eq\">just the same = all the same\u003c/span>\u003cdiv class=\"w\">마찬가지로라는 뜻을 all the same으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Love is like a beautiful flower that I may not touch, but the scent of which makes the garden a delightful place all the same.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"사랑은 직접 만질 수 없지만 그 향기만으로 주변을 기쁘게 하는 꽃과 같다는 뜻이에요. 눈에 보이지 않아도 존재 자체로 즐거움과 행복을 준다는 따뜻한 함축이 있습니다.","hl":"mn"},{"n":42,"text":"which I may not touch는 that I may not touch로 바꿀 수 있어요. whose fragrance는 the fragrance of which처럼 더 격식 있게 바꿀 수 있습니다.","hl":"rw"},{"n":43,"text":"fragrance는 scent로 바꿀 수 있고, a place of delight는 a delightful place로 간단히 표현할 수 있어요. just the same은 all the same으로 바꿔도 같은 뜻입니다.","hl":"ph"},{"n":44,"text":"전체 문장을 바꿔 말하면 Love is like a beautiful flower that I may not touch, but the scent of which makes the garden a delightful place all the same. 라고 할 수 있어요. 만질 수 없어도 향기로 기쁨을 주는 사랑의 비유입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 I consider nature \u003cspan class=\"fx\">a vast chemical laboratory in which all kinds of composition and decompositions are formed\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I consider nature \u003c/div>\u003cdiv class=\"k\">나는 자연을 여긴다\u003c/div>\u003cdiv class=\"e\">a vast chemical laboratory \u003c/div>\u003cdiv class=\"k\">광대한 화학 실험실로\u003c/div>\u003cdiv class=\"e\">in which all kinds of composition and decompositions are formed.\u003c/div>\u003cdiv class=\"k\">온갖 종류의 합성과 분해가 이루어지는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적격보어인 \u003cb class=\"key\">a vast chemical laboratory\u003c/b> 뒤에 \u003cb class=\"key\">전치사 + 관계대명사\u003c/b>인 \u003cb class=\"key\">in which\u003c/b>가 이끄는 형용사절이 붙어 실험실의 성격을 설명합니다. in which는 장소를 나타내는 관계부사 \u003cb class=\"key\">where\u003c/b>로 바꿔 쓸 수 있습니다.\u003c/div>","segs":[{"n":45,"text":"I consider nature, 나는 자연을 여긴다. a vast chemical laboratory, 광대한 화학 실험실로. in which all kinds of composition and decompositions are formed, 온갖 종류의 합성과 분해가 이루어지는","hl":"ch"},{"n":46,"text":"여덟 번째 문장을 볼게요. I consider nature a vast chemical laboratory in which all kinds of composition and decompositions are formed. 목적격보어인 a vast chemical laboratory 뒤에 in which가 이끄는 절이 붙어서 실험실의 성격을 설명합니다. in which는 장소를 나타내는 where로 바꿔 쓸 수 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 I consider nature \u003cspan class=\"fx\">a vast chemical laboratory in which all kinds of composition and decompositions are formed\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>나는 자연을 온갖 합성과 분해가 일어나는 거대한 화학 실험실로 생각한다는 뜻입니다. 자연을 관찰과 실험이 가능한 역동적인 공간으로 본 라부아지에의 관점이 드러납니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a vast chemical laboratory in which all kinds of composition and decompositions are formed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a vast chemical laboratory where all kinds of composition and decomposition occur\u003c/span>\u003cdiv class=\"w\">in which를 where로, are formed를 occur로 바꿔 자연스럽게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I consider nature a vast chemical laboratory\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">I regard nature as a vast chemical laboratory\u003c/span>\u003cdiv class=\"w\">consider A B를 regard A as B로 바꾼 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">vast\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">huge\u003c/span>\u003cspan class=\"y-eq\">vast = huge\u003c/span>\u003cdiv class=\"w\">광대한이라는 뜻을 huge로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">composition\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">combination\u003c/span>\u003cspan class=\"y-eq\">composition = combination\u003c/span>\u003cdiv class=\"w\">합성이라는 뜻을 combination으로 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are formed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">take place\u003c/span>\u003cspan class=\"y-eq\">are formed = take place\u003c/span>\u003cdiv class=\"w\">형성되다라는 표현을 일어나다라는 뜻으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I regard nature as a huge chemical laboratory where all kinds of combination and decomposition take place.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"나는 자연을 온갖 합성과 분해가 일어나는 거대한 화학 실험실로 생각한다는 뜻이에요. 자연을 관찰과 실험이 가능한 역동적인 공간으로 본 라부아지에의 관점이 드러납니다.","hl":"mn"},{"n":48,"text":"in which는 where로 바꿀 수 있고, are formed는 occur로 바꾸면 더 자연스러워요. I consider nature a vast chemical laboratory는 I regard nature as a vast chemical laboratory로 바꿀 수 있습니다.","hl":"rw"},{"n":49,"text":"vast는 huge로 바꿀 수 있고, composition은 combination으로 풀어 쓸 수 있어요. are formed는 take place로 바꾸면 일어나다라는 뜻이 잘 드러납니다.","hl":"ph"},{"n":50,"text":"전체 문장을 바꿔 말하면 I regard nature as a huge chemical laboratory where all kinds of combination and decomposition take place. 라고 할 수 있어요. 자연을 거대한 화학 실험실로 본 문장입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 At the personal level, competition allows us to become \u003cspan class=\"fx\">the best individual we can be\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">At the personal level, \u003c/div>\u003cdiv class=\"k\">개인적 수준에서\u003c/div>\u003cdiv class=\"e\">competition allows us \u003c/div>\u003cdiv class=\"k\">경쟁은 우리를 허락한다\u003c/div>\u003cdiv class=\"e\">to become the best individual \u003c/div>\u003cdiv class=\"k\">최고의 개인이 되도록\u003c/div>\u003cdiv class=\"e\">we can be.\u003c/div>\u003cdiv class=\"k\">우리가 될 수 있는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적격보어 \u003cb class=\"key\">to become the best individual\u003c/b>에서 명사 \u003cb class=\"key\">individual\u003c/b> 뒤에 관계대명사 \u003cb class=\"key\">who\u003c/b> 또는 \u003cb class=\"key\">that\u003c/b>이 생략된 형용사절 \u003cb class=\"key\">we can be\u003c/b>가 붙어 있습니다. 생략된 관계대명사는 individual을 받는 목적격 역할을 합니다.\u003c/div>","segs":[{"n":51,"text":"At the personal level, 개인적 수준에서. competition allows us, 경쟁은 우리를 허락한다. to become the best individual, 최고의 개인이 되도록. we can be, 우리가 될 수 있는","hl":"ch"},{"n":52,"text":"아홉 번째 문장을 볼게요. At the personal level, competition allows us to become the best individual we can be. to become 이하가 목적격보어이고, individual 뒤에는 who나 that이 생략된 절이 붙어 있습니다. 그래서 the best individual we can be는 우리가 될 수 있는 최고의 개인이라는 뜻이 돼요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 At the personal level, competition allows us to become \u003cspan class=\"fx\">the best individual we can be\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>경쟁은 우리 각자가 될 수 있는 최고의 모습이 되도록 도와준다는 뜻입니다. 남을 이기는 것보다 자기 잠재력을 최대한 발휘하게 만드는 긍정적 힘으로 경쟁을 설명합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the best individual we can be\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the best person that we can be\u003c/span>\u003cdiv class=\"w\">individual을 person으로 바꾸고 생략된 that을 드러낸 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">competition allows us to become\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">competition enables us to become\u003c/span>\u003cdiv class=\"w\">allow to를 enable to로 바꾼 격식 있는 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">allow\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">enable\u003c/span>\u003cspan class=\"y-eq\">allow = enable\u003c/span>\u003cdiv class=\"w\">가능하게 하다라는 뜻을 enable로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">become\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">grow into\u003c/span>\u003cspan class=\"y-eq\">become = grow into\u003c/span>\u003cdiv class=\"w\">성장해 그렇게 되다라는 뉘앙스를 더합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the best individual\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the best version of ourselves\u003c/span>\u003cspan class=\"y-eq\">the best individual = the best version of ourselves\u003c/span>\u003cdiv class=\"w\">최고의 개인이라는 표현을 더 자연스러운 관용 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">At the personal level, competition enables us to grow into the best version of ourselves that we can be.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"경쟁은 우리 각자가 될 수 있는 최고의 모습이 되도록 도와준다는 뜻이에요. 남을 이기는 것보다 자기 잠재력을 최대한 발휘하게 만드는 긍정적 힘으로 경쟁을 설명합니다.","hl":"mn"},{"n":54,"text":"the best individual we can be는 the best person that we can be로 바꿀 수 있어요. competition allows us to become은 competition enables us to become처럼 더 격식 있게 표현할 수 있습니다.","hl":"rw"},{"n":55,"text":"allow는 enable로 바꿀 수 있고, become은 grow into로 바꾸면 성장의 느낌이 더해져요. the best individual은 the best version of ourselves처럼 자연스럽게 바꿀 수 있습니다.","hl":"ph"},{"n":56,"text":"전체 문장을 바꿔 말하면 At the personal level, competition enables us to grow into the best version of ourselves that we can be. 라고 할 수 있어요. 경쟁이 우리를 더 나은 모습으로 성장하게 한다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/ c/div>\u003cdiv class=\"e\">between the writer and the reader \u003c/div>\u003cdiv class=\"k\">작가와 독자 사이의\u003c/div>\u003cdiv class=\"e\">and it is the only place in the world \u003c/div>\u003cdiv class=\"k\">그리고 그것은 세상에서 유일한 장소이다\u003c/div>\u003cdiv class=\"e\">where two strangers can meet \u003c/div>\u003cdiv class=\"k\">두 명의 낯선 사람이 만날 수 있는\u003c/div>\u003cdiv class=\"e\">on terms of absolute intimacy.\u003c/div>\u003cdiv class=\"k\">절대적인 친밀한 사이로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>and 다음 절에서 보어인 \u003cb class=\"key\">the only place in the world\u003c/b> 뒤에 관계부사 \u003cb class=\"key\">where\u003c/b>가 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 붙어 장소를 설명합니다. 앞 절에서는 보어 \u003cb class=\"key\">an equal collaboration\u003c/b>이 전치사구 \u003cb class=\"key\">between the writer and the reader\u003c/b>의 수식을 받습니다.\u003c/div>","segs":[{"n":69,"text":"Every novel is an equal collaboration, 모든 소설은 동등한 협업이다. between the writer and the reader, 작가와 독자 사이의. and it is the only place in the world, 그리고 그것은 세상에서 유일한 장소이다. where two strangers can meet, 두 명의 낯선 사람이 만날 수 있는. on terms of absolute intimacy, 절대적인 친밀한 사이로","hl":"ch"},{"n":70,"text":"열두 번째 문장을 볼게요. Every novel is an equal collaboration between the writer and the reader and it is the only place in the world where two strangers can meet on terms of absolute intimacy. and 다음 절에서 the only place in the world 뒤에 where가 이끄는 절이 붙어서 장소를 설명합니다. 앞 절에서는 collaboration이 between the writer and the reader의 수식을 받아요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Every novel is an equal collaboration between the writer and the reader and it is \u003cspan class=\"fx\">the only place in the world where two strangers can meet on terms of absolute intimacy\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축
