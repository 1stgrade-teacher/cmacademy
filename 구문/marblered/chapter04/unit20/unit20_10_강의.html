np1z6+5OffqaL6X6bgf/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Fluid Nature of Boundaries: Context Matters<small>변화하는 경계의 속성: 상황이 중요하다</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 흔히 생각하는 선과 악의 기준인 상대적 기준점(Reference point)은 고정되어 있지 않고, 상황이나 시간에 따라 변하는 성질을 가지고 있어요. 마치 10도 정도의 물이 추운 겨울에는 따뜻하게 느껴지지만, 뜨거운 여름에는 차갑게 느껴지는 것과 비슷한 원리죠. 이처럼 판단의 기준이 되는 상대적 기준(Relative standard)은 절대적인 진리가 아니라, 우리 주변의 상황적 맥락(Immediate circumstances)에 따라 유연하게 결정되는 경우가 많답니다. 그래서 어떤 행동이 좋은지 나쁜지를 평가할 때는 단순히 정해진 규칙만 따지기보다, 그 판단이 내려지는 특정한 환경(Specific environment)을 함께 고려하는 것이 중요해요. 이러한 심리적 기제는 우리가 세상을 유연하게 해석하고 결정하는 데 큰 영향을 미치고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상대적인 기준</div><ul><li>좋고 나쁨을 구분하는 경계선은 고정되어 있지 않으며 상황에 따라 바뀔 수 있습니다.</li><li>선과 악의 경계(boundary)는 유동적임</li><li>특정 기준점(reference point)에 의해 결정됨</li><li>핵심 키워드: 기준점(reference point)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02변화하는 요인</div><ul><li>선악을 판단하는 기준은 시간이 흐름에 따라 변화하며, 주변 상황의 영향을 받습니다.</li><li>시간이 지나면서 달라지는 인식(changes over time)</li><li>당면한 주변 환경(immediate circumstances)이 판단에 개입함</li><li>핵심 키워드: 주변 상황(immediate circumstances)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">situation</td><td class=\"m\">상황</td></tr><tr><td class=\"w\">boundary</td><td class=\"m\">경계</td></tr><tr><td class=\"w\">reference point</td><td class=\"m\">기준점</td></tr><tr><td class=\"w\">depend on</td><td class=\"m\">~에 달려 있다, ~에 좌우되다</td></tr><tr><td class=\"w\">immediate</td><td class=\"m\">즉각적인, 당면한</td></tr><tr><td class=\"w\">circumstance</td><td class=\"m\">환경, 상황</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 상황에서</span><span class=\"en\"><b>In many situations</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 경계는</span><span class=\"en\"><b>the boundary</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선과 악 사이의</span><span class=\"en\"><b>between good and bad</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기준점이다</span><span class=\"en\"><b>is <span class=\"grammar-hl\">a reference point</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(그것은) 변하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that changes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간에 따라서</span><span class=\"en\"><b><span class=\"grammar-hl\">over time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 달려있는</span><span class=\"en\"><b><span class=\"grammar-hl\">and depends</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당면한 상황에</span><span class=\"en\"><b><span class=\"grammar-hl\">on the immediate circumstances</span>.</b></span></div></div><div class=\"lec-sent-ko\">많은 상황에서 선과 악 사이의 경계는 시간에 따라서 바뀌고 당면한 상황에 달려있는 기준점이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 주제를 제시합니다. 좋고 나쁨을 나누는 기준이 고정되어 있지 않다는 점을 설명합니다. 여기서 boundary는 사전적으로 &#39;경계선&#39;을 의미하는데, 여기서는 도덕적·판단적 가치 기준이 갈라지는 &#39;판단 지점&#39;을 뜻합니다. 필자는 기준이 고정된 것이 아니라 유동적임을 강조하기 위해 물리적인 선을 뜻하는 이 단어를 선택했습니다. 또한 reference point는 &#39;참조점&#39;이라는 뜻인데, 여기서는 판단을 내릴 때 근거로 삼는 &#39;기준점&#39;을 의미합니다. 상황에 따라 변하는 가치관의 유연함을 표현하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a reference point that changes over time and depends on the immediate circumstances (관계대명사): that은 선행사 a reference point를 수식하는 주격 관계대명사이며, 뒤에 이어지는 절(changes/depends)에서 주어 역할을 합니다.</div><div class=\"lec-gr-item\">that changes (현재분사): 문맥상 관계대명사 that절 내부의 동사로 쓰였으나, 만약 문장이 &#39;a reference point changing over time&#39;으로 축약된다면 이는 뒤의 명사를 수식하는 현재분사로서 &#39;시간에 따라 변하는 기준점&#39;이라는 의미를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">situation</td><td class=\"m\">상황</td></tr><tr><td class=\"w\">boundary</td><td class=\"m\">경계</td></tr><tr><td class=\"w\">reference point</td><td class=\"m\">기준점</td></tr><tr><td class=\"w\">immediate</td><td class=\"m\">즉각적인, 당면한</td></tr><tr><td class=\"w\">circumstance</td><td class=\"m\">환경, 상황</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>좋고 나쁨을 나누는 도덕적·판단적 경계는 고정된 것이 아니다.</li><li>이 기준점은 시간의 흐름에 따라 변화한다.</li><li>또한, 당장 마주한 특정한 상황에 따라 그 판단 기준이 달라질 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The line between good and bad changes over time, and it also depends on the immediate circumstances of a given situation.</div>\n              <div class=\"lec-final-sum-ko\">좋고 나쁨의 경계는 시간이 지나면서 변하며, 또한 주어진 상황의 즉각적인 환경에 따라 달라진다.</div></div></div>"],"segs":[[{"audio":"./unit20_10_강의_audio/1.mp3","hl":null}],[{"audio":"./unit20_10_강의_audio/2.mp3","hl":null}],[{"audio":"./unit20_10_강의_audio/3.mp3","hl":null},{"audio":"./unit20_10_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit20_10_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit20_10_강의_audio/6.mp3","hl":null}],[{"audio":"./unit20_10_강의_audio/7.mp3","hl":"main"},{"audio":"./unit20_10_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit20_10_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit20_10_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");functi
