>핵심 키워드: 윤활유(oil)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02결속력 강화</div><ul><li>사랑은 서로 다른 가족 구성원을 하나로 묶어주는 강력한 연결 고리입니다.</li><li>가족 구성원들을 더 가깝게(closer) 연결함</li><li>흩어지지 않게 결합하는 접착제 역할</li><li>핵심 키워드: 결합(cement)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03조화로운 분위기 조성</div><ul><li>사랑은 가족이라는 공동체에 평화롭고 아름다운 조화를 가져다줍니다.</li><li>관계의 불협화음을 없애고 조화(harmony)를 형성함</li><li>삶에 아름다움을 더하는 음악과 같은 효과</li><li>핵심 키워드: 조화(music)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">family</td><td class=\"m\">가족</td></tr><tr><td class=\"w\">oil</td><td class=\"m\">기름</td></tr><tr><td class=\"w\">ease</td><td class=\"m\">덜어주다, 완화하다</td></tr><tr><td class=\"w\">friction</td><td class=\"m\">마찰, 불화</td></tr><tr><td class=\"w\">cement</td><td class=\"m\">시멘트, 결합제</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bind</td><td class=\"m\">결속시키다, 묶다</td></tr><tr><td class=\"w\">close</td><td class=\"m\">가깝게</td></tr><tr><td class=\"w\">music</td><td class=\"m\">음악</td></tr><tr><td class=\"w\">bring</td><td class=\"m\">가져오다, 초래하다</td></tr><tr><td class=\"w\">harmony</td><td class=\"m\">조화</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가정생활 안에서,</span><span class=\"en\"><b>In family life,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사랑은 ~이다</span><span class=\"en\"><b>love is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">윤활유</span><span class=\"en\"><b>the oil</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마찰을 완화시켜 주는,</span><span class=\"en\"><b><span class=\"grammar-hl\">that eases friction</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">접합제</span><span class=\"en\"><b>the cement</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 가깝게 결속시키는,</span><span class=\"en\"><b><span class=\"grammar-hl\">that binds closer together</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 음악</span><span class=\"en\"><b>and the music</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조화를 가져다주는</span><span class=\"en\"><b><span class=\"grammar-hl\">that brings harmony</span>.</b></span></div></div><div class=\"lec-sent-ko\">가정생활에서 사랑은 마찰을 완화시켜 주는 윤활유, 더 가깝게 결속시키는 접합제, 그리고 조화를 가져다주는 음악이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가정생활을 원만하게 유지하는 데 있어 사랑이 갖는 세 가지 결정적인 역할을 비유적으로 설명하고 있습니다. - oil은 사전적으로 &#39;기름&#39;이지만, 여기서는 부품 사이의 마찰을 줄여 기계가 잘 돌아가게 하는 기능을 의미합니다. 가족 간의 갈등(friction)을 매끄럽게 넘기게 해준다는 점을 강조하려고 이 비유를 선택했습니다. - cement는 &#39;시멘트&#39;를 뜻하는데, 여기서는 흩어진 벽돌을 하나로 고정하는 결합재 역할을 말합니다. 서로 다른 구성원들을 떨어지지 않게 단단히 묶어준다는 점을 강조합니다. - music은 &#39;음악&#39;인데, 여기서는 여러 소리가 어우러져 아름다운 화음을 만드는 특성을 빌려온 것입니다. 가족 구성원들이 모여 화목한 분위기를 조성한다는 것을 시각적인 이미지로 보여주기 위해 선택한 표현입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that eases friction (관계대명사): 주격 관계대명사 that이 선행사 the oil을 수식하며, 절 내부에서 주어 역할을 하여 뒤에 동사 eases가 바로 이어지는 구조입니다.</div><div class=\"lec-gr-item\">that binds closer together (관계대명사): 주격 관계대명사 that이 선행사 the cement를 수식하며, 절 내부에서 주어 역할을 하여 뒤에 동사 binds가 바로 이어지는 구조입니다.</div><div class=\"lec-gr-item\">that brings harmony (관계대명사): 주격 관계대명사 that이 선행사 the music을 수식하며, 절 내부에서 주어 역할을 하여 뒤에 동사 brings가 바로 이어지는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">family</td><td class=\"m\">가족</td></tr><tr><td class=\"w\">oil</td><td class=\"m\">기름</td></tr><tr><td class=\"w\">ease</td><td class=\"m\">덜어주다, 완화하다</td></tr><tr><td class=\"w\">friction</td><td class=\"m\">마찰, 불화</td></tr><tr><td class=\"w\">cement</td><td class=\"m\">시멘트, 결합제</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bind</td><td class=\"m\">결속시키다, 묶다</td></tr><tr><td class=\"w\">close</td><td class=\"m\">가깝게</td></tr><tr><td class=\"w\">music</td><td class=\"m\">음악</td></tr><tr><td class=\"w\">bring</td><td class=\"m\">가져오다, 초래하다</td></tr><tr><td class=\"w\">harmony</td><td class=\"m\">조화</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>가정생활에서 사랑은 갈등을 부드럽게 넘기게 하는 필수적인 윤활유이다.</li><li>또한 사랑은 가족 구성원을 정서적으로 단단히 연결해 주는 접착제이다.</li><li>궁극적으로 사랑은 가족 간의 조화롭고 행복한 분위기를 만들어내는 원동력이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Love serves as a crucial force that minimizes conflict while strengthening the emotional connections within a family.</div>\n              <div class=\"lec-final-sum-ko\">사랑은 가족 내부의 갈등을 최소화하면서 정서적 유대감을 강화하는 결정적인 힘으로 작용한다.</div></div></div>"],"segs":[[{"audio":"./unit20_03_강의_audio/1.mp3","hl":null}],[{"audio":"./unit20_03_강의_audio/2.mp3","hl":null}],[{"audio":"./unit20_03_강의_audio/3.mp3","hl":null},{"audio":"./unit20_03_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit20_03_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit20_03_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit20_03_강의_audio/7.mp3","hl":null}],[{"audio":"./unit20_03_강의_audio/8.mp3","hl":"main"},{"audio":"./unit20_03_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit20_03_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit20_03_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.len
