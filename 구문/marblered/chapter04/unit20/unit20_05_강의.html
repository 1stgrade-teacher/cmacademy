</td><td class=\"m\">바꾸다, 변화시키다</td></tr><tr><td class=\"w\">world</td><td class=\"m\">세계, 세상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">교육은</span><span class=\"en\"><b>Education</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 강력한 무기이다</span><span class=\"en\"><b>is the most powerful weapon</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 사용할 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">which you can use</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바꾸기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to change</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상을</span><span class=\"en\"><b><span class=\"grammar-hl\">the world</span>.</b></span></div></div><div class=\"lec-sent-ko\">교육은 당신이 세상을 바꾸기 위해서 사용할 수 있는 가장 강력한 무기이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 주장으로, 교육의 엄청난 영향력을 강조하고 있습니다. 여기서 weapon은 사전적으로는 전쟁에서 쓰는 &#39;무기&#39;를 의미하지만, 여기서는 사회를 변화시키거나 잘못된 관습을 깨부수는 &#39;수단&#39; 또는 &#39;힘&#39;이라는 의미로 쓰였습니다. 필자는 교육이 단순히 지식을 쌓는 과정이 아니라, 세상을 근본적으로 뒤바꿀 수 있는 강력하고 공격적인 에너지를 가졌음을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">which you can use (관계대명사): 목적격 관계대명사 which가 이끄는 절로, 선행사인 the most powerful weapon을 수식한다. 관계대명사 뒤에는 목적어(use의 대상)가 빠진 불완전한 절이 온다.</div><div class=\"lec-gr-item\">to change the world (to부정사): 부사적 용법(목적)으로, 앞에 있는 동사 use의 목적이나 그 행위의 이유를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">education</td><td class=\"m\">교육</td></tr><tr><td class=\"w\">powerful</td><td class=\"m\">강력한</td></tr><tr><td class=\"w\">weapon</td><td class=\"m\">무기</td></tr><tr><td class=\"w\">change</td><td class=\"m\">바꾸다, 변화시키다</td></tr><tr><td class=\"w\">world</td><td class=\"m\">세계, 세상</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>교육은 세상을 바꾸는 가장 강력한 도구이자 힘이다.</li><li>단순히 배우는 것을 넘어 사회적 변화를 이끌어내는 근본적인 수단이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Education acts as a powerful instrument, and it enables individuals to create meaningful changes in the world.</div>\n              <div class=\"lec-final-sum-ko\">교육은 강력한 도구로 작용하며, 이를 통해 개인은 세상에 의미 있는 변화를 만들어낼 수 있다.</div></div></div>"],"segs":[[{"audio":"./unit20_05_강의_audio/1.mp3","hl":null}],[{"audio":"./unit20_05_강의_audio/2.mp3","hl":null}],[{"audio":"./unit20_05_강의_audio/3.mp3","hl":null},{"audio":"./unit20_05_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit20_05_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit20_05_강의_audio/6.mp3","hl":null}],[{"audio":"./unit20_05_강의_audio/7.mp3","hl":"main"},{"audio":"./unit20_05_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit20_05_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit20_05_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundi
