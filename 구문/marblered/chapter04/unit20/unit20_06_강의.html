COn4jr044HX39KDgBiBk4P44B4/pS6a9vP/AIf9QP/Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Defining Aesthetics: A Philosophical Perspective on Beauty<small>미학의 정의: 아름다움에 대한 철학적 관점</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 철학의 한 분야인 미학(Aesthetics)에 대해 들어본 적 있나요? 미학이란 단순히 예쁜 것을 감상하는 취미를 넘어, 우리가 세상을 보며 느끼는 아름다움의 본질과 가치를 논리적으로 탐구하는 학문이에요. 쉽게 비유하자면, 어떤 풍경이나 예술 작품을 보고 &#39;아, 진짜 멋지다!&#39;라고 느낄 때, 그 느낌이 도대체 왜, 어떤 기준에서 아름답다고 여겨지는지를 따져보는 활동이라고 할 수 있죠. 특히 예술(Arts) 분야에서 미학은 단순히 감각적인 즐거움을 넘어 작품 속에 담긴 의미와 형식을 분석하는 중요한 틀이 되어줍니다. 우리가 예술을 대할 때 무엇이 &#39;아름다운 것&#39;인지를 고민하는 과정 자체가 바로 인간의 예술적 경험을 정의하는 핵심적인 과정임을 기억하며 지문을 읽어보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01미학의 정의</div><ul><li>미학은 철학의 한 분야로서 아름다움에 관해 연구하는 학문이다.</li><li>학문적 분류: 철학의 하위 분야 (branch of philosophy)</li><li>주요 탐구 대상: 아름다움 (beauty)</li><li>핵심 키워드: 미학(aesthetics)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02미학의 적용 범위</div><ul><li>미학은 일반적인 아름다움뿐만 아니라 예술 영역에서의 아름다움을 중점적으로 다룬다.</li><li>전통적인 관점에서의 연구 범위</li><li>특히 예술과 관련된 미적 가치에 주목</li><li>핵심 키워드: 예술(arts)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">according to</td><td class=\"m\">~에 따르면</td></tr><tr><td class=\"w\">traditional</td><td class=\"m\">전통적인</td></tr><tr><td class=\"w\">definition</td><td class=\"m\">정의</td></tr><tr><td class=\"w\">aesthetics</td><td class=\"m\">미학</td></tr><tr><td class=\"w\">branch</td><td class=\"m\">분야, 분과</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">philosophy</td><td class=\"m\">철학</td></tr><tr><td class=\"w\">deal with</td><td class=\"m\">~을 다루다</td></tr><tr><td class=\"w\">beauty</td><td class=\"m\">아름다움</td></tr><tr><td class=\"w\">especially</td><td class=\"m\">특히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">~에 따르면</span><span class=\"en\"><b><span class=\"grammar-hl\">According to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 전통적인 정의</span><span class=\"en\"><b>one traditional definition,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미학은 ~이다</span><span class=\"en\"><b>aesthetics is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">철학의 한 부문</span><span class=\"en\"><b><span class=\"grammar-hl\">the branch of philosophy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다루는</span><span class=\"en\"><b><span class=\"grammar-hl\">that deals with</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미(美)를</span><span class=\"en\"><b><span class=\"grammar-hl\">beauty</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특히 아름다움을</span><span class=\"en\"><b>especially beauty</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술에서의</span><span class=\"en\"><b>in the arts.</b></span></div></div><div class=\"lec-sent-ko\">하나의 전통적인 정의에 따르면 미학은 미(美)를, 특히 예술에서의 미를 다루는 철학의 한 부문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 &#39;미학(aesthetics)&#39;의 사전적 정의를 설명하며 글의 도입부를 엽니다. 여기서 deals with는 사전적으로는 &#39;거래하다, 처리하다&#39;이지만, 여기서는 철학이라는 학문이 특정 주제를 &#39;연구하거나 다룬다&#39;는 의미로 쓰였습니다. 필자는 미학이 단순히 아름다움만을 보는 것이 아니라, 철학이라는 거대한 틀 안에서 그 주제를 심도 있게 고찰한다는 점을 명확히 하려고 이 표현을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the branch of philosophy that deals with beauty (관계대명사): that은 주격 관계대명사로, 선행사 &#39;the branch of philosophy&#39;를 수식하며 뒤에 동사 &#39;deals&#39;가 오는 불완전한 절을 이끕니다.</div><div class=\"lec-gr-item\">According to (관용표현): &#39;~에 따르면&#39;이라는 뜻의 전치사구로, 출처나 근거를 나타낼 때 쓰입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">according to</td><td class=\"m\">~에 따르면</td></tr><tr><td class=\"w\">traditional</td><td class=\"m\">전통적인</td></tr><tr><td class=\"w\">definition</td><td class=\"m\">정의</td></tr><tr><td class=\"w\">aesthetics</td><td class=\"m\">미학</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">branch</td><td class=\"m\">분야, 분과</td></tr><tr><td class=\"w\">philosophy</td><td class=\"m\">철학</td></tr><tr><td class=\"w\">beauty</td><td class=\"m\">아름다움</td></tr><tr><td class=\"w\">especially</td><td class=\"m\">특히</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>미학은 전통적으로 아름다움, 특히 예술적 아름다움을 연구하는 철학의 한 분야로 정의된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Aesthetics is defined as a philosophical field, and it primarily examines the nature of beauty within artistic expressions.</div>\n              <div class=\"lec-final-sum-ko\">미학은 철학의 한 분야로 정의되며, 주로 예술적 표현 속의 아름다움의 본질을 탐구한다.</div></div></div>"],"segs":[[{"audio":"./unit20_06_강의_audio/1.mp3","hl":null}],[{"audio":"./unit20_06_강의_audio/2.mp3","hl":null}],[{"audio":"./unit20_06_강의_audio/3.mp3","hl":null},{"audio":"./unit20_06_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit20_06_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit20_06_강의_audio/6.mp3","hl":null}],[{"audio":"./unit20_06_강의_audio/7.mp3","hl":"main"},{"audio":"./unit20_06_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit20_06_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit20_06_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=
