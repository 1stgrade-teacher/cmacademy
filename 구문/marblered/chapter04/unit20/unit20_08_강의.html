는 실험실 안에서 일어나는 정교한 화학 반응들이죠. 즉, 자연은 단순히 나무나 바위가 있는 공간이 아니라, 원소들이 결합하고 분리되면서 생태계를 유지하는 역동적인 에너지의 장이라고 이해하면 훨씬 쉽게 다가올 거예요. 이런 관점을 가지면 자연 속에서 일어나는 변화들이 마치 과학자가 실험을 하듯 매우 체계적이고 신비롭게 느껴질 것입니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01자연의 정의</div><ul><li>저자는 자연을 다양한 화학 작용이 일어나는 하나의 거대한 장소로 정의합니다.</li><li>자연을 거대한 화학 실험실(vast chemical laboratory)로 비유</li><li>모든 사물이 화학적 원리로 구성되어 있다는 인식</li><li>핵심 키워드: 자연(Nature), 실험실(Laboratory)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02화학적 변화</div><ul><li>자연 속에서는 끊임없이 물질의 결합과 분해가 일어납니다.</li><li>물질이 만들어지는 과정인 결합(composition)</li><li>물질이 나누어지는 과정인 분해(decompositions)</li><li>핵심 키워드: 결합(Composition), 분해(Decompositions)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consider</td><td class=\"m\">~라고 여기다, 생각하다</td></tr><tr><td class=\"w\">nature</td><td class=\"m\">자연</td></tr><tr><td class=\"w\">vast</td><td class=\"m\">거대한, 광대한</td></tr><tr><td class=\"w\">chemical</td><td class=\"m\">화학의, 화학적인</td></tr><tr><td class=\"w\">laboratory</td><td class=\"m\">실험실</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">all kinds of</td><td class=\"m\">모든 종류의</td></tr><tr><td class=\"w\">composition</td><td class=\"m\">합성, 구성</td></tr><tr><td class=\"w\">decomposition</td><td class=\"m\">분해</td></tr><tr><td class=\"w\">form</td><td class=\"m\">형성되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 자연을 여긴다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">consider nature</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">광대한 화학 실험실로</span><span class=\"en\"><b><span class=\"grammar-hl\">a vast chemical laboratory</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 안에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in which</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온갖 종류의 합성이</span><span class=\"en\"><b>all kinds of composition</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 분해가</span><span class=\"en\"><b>and decompositions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이루어지는</span><span class=\"en\"><b><span class=\"grammar-hl\">are formed</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 자연을 온갖 종류의 합성과 분해가 이뤄지는 광대한 화학 실험실로 여긴다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이는 자연이라는 공간을 **laboratory**(사전적 의미: 실험실)에 비유하고 있습니다. 여기서는 단순히 물질을 섞는 공간을 넘어, 생태계 내에서 끊임없이 물질이 합쳐지고(composition) 쪼개지는(decomposition) 역동적인 변화가 일어나는 현상을 설명하기 위해 이 단어를 선택했습니다. 자연을 통제 가능한 ‘실험실’로 규정함으로써, 자연 현상을 관찰 가능한 과학적 과정으로 바라보겠다는 글쓴이의 관점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">consider nature a vast chemical laboratory 5형식(SVOC) 구조: &#39;consider + O + C&#39; 형태이며, nature를 목적어로, a vast chemical laboratory를 목적격 보어로 취하는 구조입니다.</div><div class=\"lec-gr-item\">in which (전치사+관계대명사): 전치사 &#39;in&#39;과 관계대명사 &#39;which&#39;가 결합한 형태입니다. 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절(완전문장)이 옵니다.</div><div class=\"lec-gr-item\">are formed (수동태): be동사(are)+p.p.(formed) 구조입니다. form은 타동사인데 목적어가 없어서 수동구조 are formed 형태로 씁니다. 기본구조: form + O (형성하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consider</td><td class=\"m\">~라고 여기다, 생각하다</td></tr><tr><td class=\"w\">nature</td><td class=\"m\">자연</td></tr><tr><td class=\"w\">vast</td><td class=\"m\">거대한, 광대한</td></tr><tr><td class=\"w\">chemical</td><td class=\"m\">화학의, 화학적인</td></tr><tr><td class=\"w\">laboratory</td><td class=\"m\">실험실</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">all kinds of</td><td class=\"m\">모든 종류의</td></tr><tr><td class=\"w\">composition</td><td class=\"m\">합성, 구성</td></tr><tr><td class=\"w\">decomposition</td><td class=\"m\">분해</td></tr><tr><td class=\"w\">form</td><td class=\"m\">형성되다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>자연은 정지된 상태가 아니라, 끊임없이 물질이 결합하고 분해되는 거대한 화학적 공간이다.</li><li>글쓴이는 자연을 거대한 &#39;화학 실험실&#39;로 간주하며, 그 속에서 일어나는 변화를 분석적인 시각으로 바라본다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Nature acts as an expansive chemical laboratory, and it facilitates the continuous formation and decomposition of diverse substances.</div>\n              <div class=\"lec-final-sum-ko\">자연은 거대한 화학 실험실의 역할을 하며, 그 안에서 다양한 물질의 생성과 분해가 지속적으로 이루어진다.</div></div></div>"],"segs":[[{"audio":"./unit20_08_강의_audio/1.mp3","hl":null}],[{"audio":"./unit20_08_강의_audio/2.mp3","hl":null}],[{"audio":"./unit20_08_강의_audio/3.mp3","hl":null},{"audio":"./unit20_08_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit20_08_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit20_08_강의_audio/6.mp3","hl":null}],[{"audio":"./unit20_08_강의_audio/7.mp3","hl":"main"},{"audio":"./unit20_08_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit20_08_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit20_08_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(
