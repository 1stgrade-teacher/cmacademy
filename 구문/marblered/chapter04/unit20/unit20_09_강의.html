div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">personal</td><td class=\"m\">개인적인</td></tr><tr><td class=\"w\">level</td><td class=\"m\">수준, 단계</td></tr><tr><td class=\"w\">competition</td><td class=\"m\">경쟁</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">허용하다, 가능하게 하다</td></tr><tr><td class=\"w\">individual</td><td class=\"m\">개인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">개인적 수준에서,</span><span class=\"en\"><b>At the personal level,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경쟁은 우리를 ~하게 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">competition allows us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최고의 개인이 되도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to become the best individual</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 될 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">we can be</span>.</b></span></div></div><div class=\"lec-sent-ko\">개인적 수준에서, 경쟁은 우리가 될 수 있는 최고의 개인이 되게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 경쟁이 가진 긍정적인 측면을 제시하며 글의 도입부 역할을 합니다. 여기서 allows는 사전적으로 &#39;허락하다&#39;라는 뜻이지만, 여기서는 경쟁이라는 환경이 우리로 하여금 스스로 잠재력을 발휘할 수 있는 기회를 &#39;제공한다&#39;는 의미로 쓰였습니다. 단순히 허가하는 것이 아니라, 우리가 더 나은 사람이 될 수 있는 여건을 만들어준다는 점을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">competition allows us to become the best individual we can be 5형식(SVOC) 구조: allow는 타동사로 &#39;allow + O + toV(목적보어)&#39; 구조를 취하며, 여기서는 competition이 주어, us가 목적어, to become 이하가 목적보어로 쓰였습니다.</div><div class=\"lec-gr-item\">to become (to부정사): 5형식 문장에서 allow의 목적격 보어 자리에 위치하며, 목적어(us)가 하는 행위(되는 것)를 보충 설명합니다.</div><div class=\"lec-gr-item\">we can be (관계대명사): the best individual와 we can be 사이에 목적격 관계대명사(that 또는 whom)가 생략되어 있으며, 뒤의 절이 앞의 명사를 수식하는 구조입니다. 관계대명사 뒤에는 주어(we)와 동사(can be)가 이어지며, be동사의 보어 자리가 비어 있는 불완전한 문장 형태를 띱니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">personal</td><td class=\"m\">개인적인</td></tr><tr><td class=\"w\">level</td><td class=\"m\">수준, 단계</td></tr><tr><td class=\"w\">competition</td><td class=\"m\">경쟁</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">허용하다, 가능하게 하다</td></tr><tr><td class=\"w\">individual</td><td class=\"m\">개인</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>경쟁은 개인적인 측면에서 우리 자신의 잠재력을 최대한 끌어올려 최상의 상태에 도달하게 돕는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Competition encourages us to work harder, and it ultimately leads us to achieve our greatest personal potential.</div>\n              <div class=\"lec-final-sum-ko\">경쟁은 우리가 더 노력하도록 독려하며, 궁극적으로 우리가 개인의 잠재력을 최대한 발휘하도록 이끈다.</div></div></div>"],"segs":[[{"audio":"./unit20_09_강의_audio/1.mp3","hl":null}],[{"audio":"./unit20_09_강의_audio/2.mp3","hl":null}],[{"audio":"./unit20_09_강의_audio/3.mp3","hl":null},{"audio":"./unit20_09_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit20_09_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit20_09_강의_audio/6.mp3","hl":null}],[{"audio":"./unit20_09_강의_audio/7.mp3","hl":"main"},{"audio":"./unit20_09_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit20_09_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit20_09_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}func
