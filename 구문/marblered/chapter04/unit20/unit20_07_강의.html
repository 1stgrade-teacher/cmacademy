을 아름답게 만드는 꽃에 비유하여, 사랑의 비물질적이고 초월적인 가치(transcendent value)를 강조하고 있어요. 철학적으로 사랑은 단순히 소유하거나 통제하는 대상이 아니라, 그 본질적인 향기(essence)를 통해 우리 삶을 풍요롭게 만드는 긍정적인 힘으로 해석되곤 하죠. 마치 우리가 멀리 있는 아름다운 풍경을 소유하지 못해도 그것을 바라보는 것만으로 마음의 평화를 얻는 것과 같은 이치랍니다. 이러한 관점은 사랑을 대할 때 집착하기보다 존재 그 자체를 존중하는 태도(appreciation of existence)가 얼마나 중요한지 잘 보여줍니다. 여러분도 앞으로 사랑이라는 감정을 무언가를 얻어내는 수단이 아닌, 그 자체로 삶을 가치 있게 만드는 향기 같은 존재로 생각해보면 좋겠어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01사랑의 비유</div><ul><li>사랑을 손으로 직접 만질 수는 없지만 아름다운 꽃에 비유한다.</li><li>사랑은 가까이하기 어려운 꽃(beautiful flower)과 같음</li><li>물리적으로는 만질 수(touch) 없는 대상임</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02사랑의 영향력</div><ul><li>꽃의 향기가 정원을 채우듯, 사랑은 우리 삶에 긍정적인 변화를 준다.</li><li>보이지 않는 향기(fragrance)가 퍼져 나감</li><li>주변 환경을 변화시키는 사랑의 힘</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결론</div><ul><li>사랑은 직접 소유하지 않더라도 그 존재 자체로 우리를 행복하게 만든다.</li><li>정원을 즐거움의 장소(place of delight)로 바꿈</li><li>사랑의 존재만으로 충분한 만족과 기쁨(delight)을 느낌</li><li>핵심 키워드: 향기(fragrance), 즐거움(delight)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">beautiful</td><td class=\"m\">아름다운</td></tr><tr><td class=\"w\">touch</td><td class=\"m\">만지다</td></tr><tr><td class=\"w\">fragrance</td><td class=\"m\">향기</td></tr><tr><td class=\"w\">delight</td><td class=\"m\">기쁨, 즐거움</td></tr><tr><td class=\"w\">just the same</td><td class=\"m\">여전히, 그럼에도 불구하고</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사랑은</span><span class=\"en\"><b>Love</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아름다운 꽃과 같다</span><span class=\"en\"><b>is like a beautiful flower</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 만질 수는 없지만,</span><span class=\"en\"><b><span class=\"grammar-hl\">which I may not touch</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 그 향기가</span><span class=\"en\"><b>but <span class=\"grammar-hl\">whose fragrance</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정원을 만든다</span><span class=\"en\"><b><span class=\"grammar-hl\">makes the garden</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기쁨의 장소로</span><span class=\"en\"><b><span class=\"grammar-hl\">a place of delight</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마찬가지로</span><span class=\"en\"><b>just the same.</b></span></div></div><div class=\"lec-sent-ko\">사랑은 내가 만질 수 없는 아름다운 꽃과 같지만, 그 향기가 정원을 마찬가지로 기쁨의 장소로 만든다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 사랑의 속성을 &#39;꽃&#39;에 비유하여 설명합니다. 여기서 touch는 사전적으로 &#39;만지다&#39;라는 뜻이지만, 여기서는 대상과 직접적인 신체적 접촉이나 소유를 의미합니다. 필자가 이 단어를 쓴 이유는 사랑이 때로는 손에 잡히지 않거나 직접 가질 수 없는 것일지라도, 그 존재 자체만으로 주변을 아름답게 물들이는 긍정적인 힘을 가지고 있음을 강조하기 위해서입니다. 또한 just the same은 &#39;그럼에도 불구하고 여전히&#39;라는 뜻으로, 직접 만지지 못하는 제약이 있어도 사랑의 가치는 변함없다는 점을 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">which I may not touch (관계대명사): 목적격 관계대명사 which가 이끄는 절로, 선행사 &#39;a beautiful flower&#39;를 수식한다. 관계대명사 뒤에는 목적어가 빠진 불완전한 절이 온다.</div><div class=\"lec-gr-item\">whose fragrance (관계대명사): 소유격 관계대명사 whose가 이끄는 절로, 선행사 &#39;a beautiful flower&#39;를 수식한다. 뒤에 명사(fragrance)가 이어지며, &#39;그 꽃의 향기&#39;라는 의미로 절 전체 내에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">makes the garden a place of delight 5형식(SVOC) 구조: make(사역동사) + 목적어(the garden) + 목적격보어(a place of delight) 구조이다. &#39;목적어를 목적격보어한 상태로 만들다&#39;라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">beautiful</td><td class=\"m\">아름다운</td></tr><tr><td class=\"w\">touch</td><td class=\"m\">만지다</td></tr><tr><td class=\"w\">fragrance</td><td class=\"m\">향기</td></tr><tr><td class=\"w\">delight</td><td class=\"m\">기쁨, 즐거움</td></tr><tr><td class=\"w\">just the same</td><td class=\"m\">여전히, 그럼에도 불구하고</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사랑은 직접 소유하거나 만질 수 없는 대상일 수 있다.</li><li>하지만 사랑이 뿜어내는 분위기와 영향력은 그 공간을 아름답게 바꾼다.</li><li>직접적인 접촉 여부와 상관없이 사랑은 그 자체로 충분한 기쁨을 준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Love is compared to a flower that cannot be touched, yet it brings joy through its subtle influence on our lives.</div>\n              <div class=\"lec-final-sum-ko\">사랑은 손댈 수 없는 꽃에 비유되지만, 우리의 삶에 은은한 영향을 주어 기쁨을 가져다준다.</div></div></div>"],"segs":[[{"audio":"./unit20_07_강의_audio/1.mp3","hl":null}],[{"audio":"./unit20_07_강의_audio/2.mp3","hl":null}],[{"audio":"./unit20_07_강의_audio/3.mp3","hl":null},{"audio":"./unit20_07_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit20_07_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit20_07_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit20_07_강의_audio/7.mp3","hl":null}],[{"audio":"./unit20_07_강의_audio/8.mp3","hl":"main"},{"audio":"./unit20_07_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit20_07_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit20_07_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeTyp
