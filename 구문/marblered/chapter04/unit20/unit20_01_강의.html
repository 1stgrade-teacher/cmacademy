all>인생: 다수의 승자가 존재하는 게임</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 인생을 흔히 &#39;게임&#39;에 비유하곤 하죠? 보통 게임이라고 하면 한 명이 이기면 다른 한 명이 지는 &#39;제로섬 게임(Zero-sum game)&#39;을 떠올리기 쉽지만, 실제 우리 삶은 승자가 한 명으로 정해져 있지 않은 넌제로섬 게임(Non-zero-sum game)인 경우가 많아요. 이는 협력(Cooperation)을 통해 참여자 모두가 동시에 이득을 얻거나, 반대로 모두가 손해를 볼 수도 있는 상황을 의미해요. 예를 들어, 서로 돕는 팀 프로젝트처럼 우리가 상호 의존적인 관계 속에서 함께 성장할 수 있다는 점을 이해하면, 경쟁만이 정답이 아니라는 지문의 핵심 내용을 훨씬 쉽게 파악할 수 있을 거예요. 즉, 사회적 상호작용에서는 타인과의 협력이 개인의 성공만큼이나 중요한 전략적 가치를 지닌다는 점을 기억하며 글을 읽어보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01인생의 정의</div><ul><li>인생을 단 한 명의 승자만 존재하는 경쟁적인 대결이 아닌, 여러 명이 성공할 수 있는 게임으로 바라본다.</li><li>인생은 승자가 정해져 있지 않은 열린 게임임</li><li>한 사람의 성공이 다른 사람의 실패를 의미하지 않음</li><li>핵심 키워드: 여러 승자(multiple winners)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02관점의 전환</div><ul><li>경쟁 중심의 사고방식에서 벗어나 다양한 방식의 성공이 공존할 수 있음을 이해해야 한다.</li><li>승패를 나누는 좁은 시각에서 벗어남</li><li>각자의 영역에서 각자가 승자가 될 수 있음</li><li>핵심 키워드: 관점(perspective), 공존(coexistence)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">life</td><td class=\"m\">삶, 인생</td></tr><tr><td class=\"w\">game</td><td class=\"m\">게임, 경기</td></tr><tr><td class=\"w\">multiple</td><td class=\"m\">다수의, 많은</td></tr><tr><td class=\"w\">winner</td><td class=\"m\">승자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인생은</span><span class=\"en\"><b>Life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">게임이다</span><span class=\"en\"><b>is a game</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에는 존재하는</span><span class=\"en\"><b><span class=\"grammar-hl\">where</span> there are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다수의 승자들이</span><span class=\"en\"><b>multiple winners.</b></span></div></div><div class=\"lec-sent-ko\">인생은 다수의 승자가 존재하는 게임이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 삶을 승패가 갈리는 단 하나의 목표를 향한 경쟁이 아니라, 다양한 사람들이 각자의 방식과 목표로 성공을 거둘 수 있는 &#39;게임&#39;에 비유하고 있습니다. 여기서 game은 사전적으로 &#39;놀이, 시합&#39;을 의미하지만, 여기서는 삶이 정해진 규칙 안에서 자신의 능력을 펼치는 과정이라는 점을 강조합니다. 필자는 인생을 단 한 명만 이기는 &#39;제로섬 게임&#39;이 아닌, 누구든 각자의 영역에서 승자가 될 수 있는 다원적인 공간으로 정의하기 위해 이 단어를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">where (관계부사): 선행사 &#39;a game&#39;을 수식하는 관계부사절을 이끈다. 관계부사 뒤에는 주어(there)와 동사(are)를 갖춘 완전한 문장이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">life</td><td class=\"m\">삶, 인생</td></tr><tr><td class=\"w\">game</td><td class=\"m\">게임, 경기</td></tr><tr><td class=\"w\">multiple</td><td class=\"m\">다수의, 많은</td></tr><tr><td class=\"w\">winner</td><td class=\"m\">승자</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인생은 정해진 한 명의 승자만을 뽑는 경쟁이 아니다.</li><li>각자의 삶에서 서로 다른 방식으로 성공을 거둘 수 있는 다원적인 공간이다.</li><li>성공의 기준은 다양하며, 여러 사람이 동시에 승자가 될 수 있는 가능성이 열려 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Life is not a competitive game with a single victor, so it allows multiple people to succeed simultaneously.</div>\n              <div class=\"lec-final-sum-ko\">삶은 단 한 명의 승자만을 위한 경쟁적인 게임이 아니기에, 여러 사람이 동시에 성공할 수 있다.</div></div></div>"],"segs":[[{"audio":"./unit20_01_강의_audio/1.mp3","hl":null}],[{"audio":"./unit20_01_강의_audio/2.mp3","hl":null}],[{"audio":"./unit20_01_강의_audio/3
