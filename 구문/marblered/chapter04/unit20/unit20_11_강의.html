w), 관점(perspective)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03태도의 결과</div><ul><li>자신을 맑게 관리할수록 세상을 더 명확하고 올바르게 볼 수 있다.</li><li>긍정적인 마음가짐으로 세상을 직시할 것</li><li>자기 관리가 곧 세상을 대하는 태도로 이어짐</li><li>핵심 키워드: 세상을 보는 방식(see the world)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">keep</td><td class=\"m\">~한 상태를 유지하다</td></tr><tr><td class=\"w\">clean</td><td class=\"m\">깨끗한</td></tr><tr><td class=\"w\">bright</td><td class=\"m\">밝은, 총명한</td></tr><tr><td class=\"w\">window</td><td class=\"m\">창문</td></tr><tr><td class=\"w\">see</td><td class=\"m\">보다</td></tr><tr><td class=\"w\">world</td><td class=\"m\">세상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신 자신을 깨끗하고 밝게 유지하는 것이 좋으며</span><span class=\"en\"><b><span class=\"grammar-hl\">Better keep</span> yourself clean and bright;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 창문이다</span><span class=\"en\"><b>you are the window</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 통해</span><span class=\"en\"><b><span class=\"grammar-hl\">through which</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 세상을 봐야 하는.</span><span class=\"en\"><b>you <span class=\"grammar-hl\">must see</span> the world.</b></span></div></div><div class=\"lec-sent-ko\">(당신 자신을 깨끗하고 밝게 유지하는 것이 좋다. 당신은 당신이 세상을 봐야 하는 창문이다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 자기 자신을 가꾸고 긍정적인 마음을 가지라는 조언을 담고 있습니다. 여기서 window는 사전적으로는 &#39;창문&#39;이지만, 문맥상으로는 &#39;세상을 인식하는 나의 마음이나 시선&#39;을 의미합니다. 필자는 우리가 세상을 있는 그대로(혹은 긍정적으로) 보려면 우리 내면이라는 창이 맑아야 한다는 점을 강조하기 위해 window라는 비유를 선택했습니다. 앞부분의 &#39;자기 관리&#39;가 뒷부분의 &#39;세상을 보는 방식&#39;을 결정한다는 논리적 인과관계를 나타내고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Better keep (관용표현): &#39;(You had) better + 동사원형&#39; 구문으로, 조언이나 강한 권유를 나타내는 표현입니다.</div><div class=\"lec-gr-item\">keep yourself clean and bright (5형식(SVOC)): &#39;keep + O(yourself) + C(clean and bright)&#39; 구조입니다. 목적어의 상태를 유지하는 보어를 취합니다.</div><div class=\"lec-gr-item\">through which (전치사+관계대명사): &#39;전치사(through) + 관계대명사(which) + S(you) + V(must see)&#39; 구조의 관계대명사절입니다. 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절(완전문장)이 옵니다.</div><div class=\"lec-gr-item\">must see (to부정사): 조동사 must 뒤에 쓰인 동사원형입니다. see는 타동사로 &#39;the world&#39;라는 목적어를 취하고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">keep</td><td class=\"m\">~한 상태를 유지하다</td></tr><tr><td class=\"w\">clean</td><td class=\"m\">깨끗한</td></tr><tr><td class=\"w\">bright</td><td class=\"m\">밝은, 총명한</td></tr><tr><td class=\"w\">window</td><td class=\"m\">창문</td></tr><tr><td class=\"w\">see</td><td class=\"m\">보다</td></tr><tr><td class=\"w\">world</td><td class=\"m\">세상</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>세상을 올바르게 보려면 자기 자신을 먼저 깨끗하고 밝게 가꿔야 한다.</li><li>우리 내면은 세상을 비추는 창문과 같아서, 내 마음 상태에 따라 세상이 다르게 보인다.</li><li>스스로를 긍정적으로 유지하는 것이 곧 세상을 긍정적으로 바라보는 방법이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Since you view the world through the window of your own character, you must keep yourself pure and positive to see the world clearly.</div>\n              <div class=\"lec-final-sum-ko\">당신은 자신의 인격이라는 창문을 통해 세상을 바라보므로, 세상을 올바르게 보기 위해서는 스스로를 깨끗하고 긍정적으로 유지해야 한다.</div></div></div>"],"segs":[[{"audio":"./unit20_11_강의_audio/1.mp3","hl":null}],[{"audio":"./unit20_11_강의_audio/2.mp3","hl":null}],[{"audio":"./unit20_11_강의_audio/3.mp3","hl":null},
