etype of a savior)를 대표하는 인물이라고 이해하면 지문을 훨씬 깊이 있게 감상할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01아서 왕의 등장</div><ul><li>아서 왕은 전설 속의 인물로, 자신의 왕국을 통치한 군주였습니다.</li><li>전설적인 왕(legendary king)으로서의 정체성</li><li>자신의 왕국(kingdom)을 다스림</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02평화의 실현</div><ul><li>그는 왕국에 평화를 가져오기 위해 중요한 역할을 수행했습니다.</li><li>악의 무리를 물리쳐 평화(peace)를 달성함</li><li>모든 형태의 악(evil)을 정복함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03업적의 본질</div><ul><li>아서 왕은 승리를 통해 왕국의 안정을 확립했습니다.</li><li>악을 완전히 정복(vanquishing)하여 평화를 정착시킴</li><li>핵심 키워드: 아서 왕(King Arthur), 평화(peace), 악(evil)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">legendary</td><td class=\"m\">전설적인</td></tr><tr><td class=\"w\">bring</td><td class=\"m\">가져오다, (상태를) 초래하다</td></tr><tr><td class=\"w\">peace</td><td class=\"m\">평화</td></tr><tr><td class=\"w\">kingdom</td><td class=\"m\">왕국</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">vanquish</td><td class=\"m\">정복하다, 완파하다</td></tr><tr><td class=\"w\">form</td><td class=\"m\">형태, 종류</td></tr><tr><td class=\"w\">evil</td><td class=\"m\">악, 악행</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아서왕은</span><span class=\"en\"><b>King Arthur</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전설적인 왕이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span> a legendary king</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">평화를 가져다준</span><span class=\"en\"><b><span class=\"grammar-hl\">who brought peace</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 왕국에</span><span class=\"en\"><b><span class=\"grammar-hl\">to his kingdom</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무찌름으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">by vanquishing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 형태의 악을</span><span class=\"en\"><b>all forms of evil.</b></span></div></div><div class=\"lec-sent-ko\">아서왕은 모든 형태의 악을 무찌름으로써 자신의 왕국에 평화를 가져다준 전설적인 왕이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장이 없으므로 이 글의 주인공인 &#39;아더 왕&#39;이 어떤 인물인지 배경을 설명하며 시작합니다. 여기서 vanquishing은 사전적으로는 &#39;정복하다, 완파하다&#39;라는 뜻이지만, 여기서는 악의 세력을 완전히 뿌리 뽑아 없애버렸다는 의미로 쓰였습니다. 필자는 아더 왕이 단순한 통치자가 아니라 악과 싸워 승리한 강력한 영웅임을 강조하기 위해 이 강렬한 동사를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was 2형식 구조: 주어(King Arthur) + 동사(was) + 보어(a legendary king)의 기본 문장 형태입니다.</div><div class=\"lec-gr-item\">who brought peace to his kingdom (관계대명사): who는 선행사 a legendary king을 수식하는 주격 관계대명사이며, 뒤에 동사(brought)가 바로 이어지는 절을 이끕니다.</div><div class=\"lec-gr-item\">by vanquishing (동명사): 전치사 by의 목적어로 쓰인 명사적 기능이며, &#39;…함으로써&#39;라는 수단이나 방법을 나타내는 관용표현의 일부입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">legendary</td><td class=\"m\">전설적인</td></tr><tr><td class=\"w\">peace</td><td class=\"m\">평화</td></tr><tr><td class=\"w\">kingdom</td><td class=\"m\">왕국</td></tr><tr><td class=\"w\">vanquish</td><td class=\"m\">정복하다, 완파하다</td></tr><tr><td class=\"w\">form</td><td class=\"m\">형태, 종류</td></tr><tr><td class=\"w\">evil</td><td class=\"m\">악, 악행</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>아더 왕은 모든 악을 물리치고 자신의 왕국에 평화를 정착시킨 전설 속의 영웅적인 왕이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">King Arthur is regarded as a legendary figure, and he is known for bringing peace to his land by overcoming all evil.</div>\n              <div class=\"lec-final-sum-ko\">아서 왕은 전설적인 인물로 여겨지며, 모든 악을 물리침으로써 자신의 왕국에 평화를 가져온 것으로 알려져 있다.</div></div></div>"],"segs":[[{"audio":"./unit20_02_강의_audio/1.mp3","hl":null}],[{"audio":"./unit20_02_강의_audio/2.mp3","hl":null}],[{"audio":"./unit20_02_강의_audio/3.mp3","hl":null},{"audio":"./unit20_02_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit20_02_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit20_02_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit20_02_강의_audio/7.mp3","hl":null}],[{"audio":"./unit20_02_강의_audio/8.mp3","hl":"main"},{"audio":"./unit20_02_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit20_02_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit20_02_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.sc
