와 독자의 평등한 협력(collaboration)</li><li>소설이 창조되는 과정의 양방향성</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02특별한 만남</div><ul><li>소설은 서로 모르는 두 사람이 가장 깊은 곳에서 만날 수 있는 유일한 공간입니다.</li><li>생판 남인 타인(stranger)들이 모이는 장소</li><li>물리적 거리를 넘어선 관계의 형성</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03친밀함의 형성</div><ul><li>작품 안에서 작가와 독자는 세상 그 무엇보다 가까운 상태로 교류합니다.</li><li>절대적인 친밀함(absolute intimacy) 유지</li><li>서로의 내면을 공유하는 소설만의 고유한 환경</li><li>핵심 키워드: 협력(collaboration), 낯선 사람(stranger), 친밀함(intimacy)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">novel</td><td class=\"m\">소설</td></tr><tr><td class=\"w\">equal</td><td class=\"m\">동등한</td></tr><tr><td class=\"w\">collaboration</td><td class=\"m\">협력, 합작</td></tr><tr><td class=\"w\">writer</td><td class=\"m\">작가</td></tr><tr><td class=\"w\">reader</td><td class=\"m\">독자</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stranger</td><td class=\"m\">낯선 사람</td></tr><tr><td class=\"w\">meet</td><td class=\"m\">만나다</td></tr><tr><td class=\"w\">on terms of</td><td class=\"m\">~의 조건으로, ~의 관계에서</td></tr><tr><td class=\"w\">absolute</td><td class=\"m\">완전한, 절대적인</td></tr><tr><td class=\"w\">intimacy</td><td class=\"m\">친밀함</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모든 소설은</span><span class=\"en\"><b>Every novel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동등한 합작이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span> an equal collaboration</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작가 사이의</span><span class=\"en\"><b>between the writer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 독자 사이의</span><span class=\"en\"><b>and the reader</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 ~이다</span><span class=\"en\"><b>and it <span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유일한 곳</span><span class=\"en\"><b>the only place</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상에서</span><span class=\"en\"><b>in the world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에서 두 낯선 사람이</span><span class=\"en\"><b><span class=\"grammar-hl\">where two strangers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만날 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">can meet</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조건 위에서</span><span class=\"en\"><b><span class=\"grammar-hl\">on terms</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">절대적인 친밀함의</span><span class=\"en\"><b><span class=\"grammar-hl\">of absolute intimacy</span>.</b></span></div></div><div class=\"lec-sent-ko\">모든 소설은 작가와 독자 사이의 동등한 합작이고, 그것은 두 명의 낯선 사람이 절대적인 친밀한 사이로 만날 수 있는 세상에서 유일한 곳이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 첫 시작으로, 소설을 읽는 행위가 작가 혼자만의 일방적인 전달이 아니라, 읽는 사람과 함께 만들어가는 작업임을 정의합니다. 여기서 collaboration은 사전적으로 &#39;공동 작업&#39;을 뜻하는데, 여기서는 독자가 소설 속 상황을 상상하고 해석하며 작품을 완성한다는 의미로 쓰였습니다. 작가가 쓴 글에 독자의 상상력이 더해져야만 비로소 완전한 소설이 된다는 점을 강조하기 위해 이 단어를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is 2형식 구조: 주어(Every novel) + 동사(is) + 보어(an equal collaboration)의 기본 문장 형태입니다.</div><div class=\"lec-gr-item\">where two strangers can meet on terms of absolute intimacy (관계부사): 선행사(the only place)를 수식합니다. 관계부사 where 뒤에는 주어(two strangers)와 동사(can meet)를 포함한 완전한 절이 이어집니다.</div><div class=\"lec-gr-item\">on terms of (관용표현): &#39;~라는 조건으로&#39; 또는 &#39;~라는 관계에서&#39;라는 의미를 나타내는 숙어적 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">novel</td><td class=\"m\">소설</td></tr><tr><td class=\"w\">equal</td><td class=\"m\">동등한</td></tr><tr><td class=\"w\">collaboration</td><td class=\"m\">협력, 합작</td></tr><tr><td class=\"w\">writer</td><td class=\"m\">작가</td></tr><tr><td class=\"w\">reader</td><td class=\"m\">독자</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stranger</td><td class=\"m\">낯선 사람</td></tr><tr><td class=\"w\">meet</td><td class=\"m\">만나다</td></tr><tr><td class=\"w\">on terms of</td><td class=\"m\">~의 조건으로, ~의 관계에서</td></tr><tr><td class=\"w\">absolute</td><td class=\"m\">완전한, 절대적인</td></tr><tr><td class=\"w\">intimacy</td><td class=\"m\">친밀함</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>소설은 작가의 집필과 독자의 상상력이 합쳐져 완성되는 동등한 작업이다.</li><li>소설 속에서 작가와 독자는 현실에서 본 적 없는 낯선 사이임에도 깊이 교감한다.</li><li>이처럼 소설은 타인과 완벽하게 가까워질 수 있는 세상에서 유일한 공간이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Every novel relies on the cooperation of the writer and reader, and it functions as a unique space where two strangers can share total intimacy.</div>\n              <div class=\"lec-final-sum-ko\">모든 소설은 작가와 독자의 협력을 바탕으로 하며, 두 낯선 사람이 절대적인 친밀함을 나눌 수 있는 독특한 공간의 역할을 한다.</div></div></div>"],"segs":[[{"audio":"./unit20_12_강의_audio/1.mp3","hl":null}],[{"audio":"./unit20_12_강의_audio/2.mp3","hl":null}],[{"audio":"./unit20_12_강의_audio/3.mp3","hl":null},{"audio":"./unit20_12_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit20_12_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit20_12_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit20_12_강의_audio/7.mp3","hl":null}],[{"audio":"./unit20_12_강의_audio/8.mp3","hl":"main"},{"audio":"./unit20_12_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit20_12_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit
