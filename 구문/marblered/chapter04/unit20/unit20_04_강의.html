div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03건강한 생활 방식 형성</div><ul><li>궁극적으로 이러한 식습관의 변화는 학생들의 전반적인 삶의 질을 높여줍니다.</li><li>건강한 삶(healthy life) 영위</li><li>신체적 건강 증진에 기여</li><li>핵심 키워드: 영양 교육(nutrition education), 균형 잡힌 식단(balanced diets)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nutrition</td><td class=\"m\">영양</td></tr><tr><td class=\"w\">education</td><td class=\"m\">교육</td></tr><tr><td class=\"w\">balance</td><td class=\"m\">균형을 잡다</td></tr><tr><td class=\"w\">diet</td><td class=\"m\">식단, 식사</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">include</td><td class=\"m\">포함하다</td></tr><tr><td class=\"w\">vegetable</td><td class=\"m\">채소</td></tr><tr><td class=\"w\">healthy</td><td class=\"m\">건강한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">학교에서의 영양 교육은</span><span class=\"en\"><b>Nutrition education in schools</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도울 수 있다</span><span class=\"en\"><b>can <span class=\"grammar-hl\">help</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 학생들이</span><span class=\"en\"><b><span class=\"grammar-hl\">more students</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">균형 잡힌 식단을 먹도록</span><span class=\"en\"><b><span class=\"grammar-hl\">eat</span> <span class=\"grammar-hl\">balanced</span> diets</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 채소를 포함하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that include more vegetables</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 건강한 삶을 살도록</span><span class=\"en\"><b>and <span class=\"grammar-hl\">have a healthy life</span>.</b></span></div></div><div class=\"lec-sent-ko\">학교에서의 영양 교육은 더 많은 학생들이 더 많은 채소를 포함하는 균형식을 먹도록, 그리고 건강한 삶을 살도록 도울 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학교에서 이루어지는 영양 관련 교육이 학생들의 식습관 개선에 긍정적인 영향을 미친다는 내용을 담고 있습니다. 여기서 balanced는 사전적으로 &#39;균형이 잡힌&#39;이라는 뜻이지만, 문맥상으로는 특정 영양소에 치우치지 않고 골고루 섭취하는 상태를 의미합니다. 단순히 &#39;균형&#39;이라는 단어를 넘어, 성장에 필요한 영양소를 빠짐없이 챙기는 건강한 식단의 상태를 강조하기 위해 이 단어를 선택했습니다. 또한, &#39;도울 수 있다&#39;는 표현을 통해 교육이 학생들의 실질적인 행동 변화를 이끌어내는 유용한 수단임을 제시하며 글을 시작하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">help more students eat 5형식(SVOC) 구조: help는 준사역동사로 help + 목적어(more students) + 목적격보어(동사원형 eat) 구조를 취한다.</div><div class=\"lec-gr-item\">balanced (과거분사(형용사)): balanced가 뒤의 명사 diets를 수식하며, &#39;균형 잡힌 식단&#39;이라는 의미를 가진다. (balanced + N ≈ &#39;균형 잡힌 N&#39; / &#39;N that is balanced&#39;)</div><div class=\"lec-gr-item\">that include more vegetables (관계대명사): that은 선행사 balanced diets를 수식하는 주격 관계대명사이며, 뒤에 동사 include가 바로 이어지는 절 구조를 가진다.</div><div class=\"lec-gr-item\">have a healthy life (to부정사): 앞의 help 5형식 구조에서 목적격보어 자리에 올 수 있는 병렬 구조(eat ... and [to] have)로, 앞의 &#39;to&#39;가 생략된 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nutrition</td><td class=\"m\">영양</td></tr><tr><td class=\"w\">education</td><td class=\"m\">교육</td></tr><tr><td class=\"w\">balance</td><td class=\"m\">균형을 잡다</td></tr><tr><td class=\"w\">diet</td><td class=\"m\">식단, 식사</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">include</td><td class=\"m\">포함하다</td></tr><tr><td class=\"w\">vegetable</td><td class=\"m\">채소</td></tr><tr><td class=\"w\">healthy</td><td class=\"m\">건강한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>학교 영양 교육은 학생들에게 균형 잡힌 식단과 채소 섭취의 중요성을 알린다.</li><li>이를 통해 학생들은 건강한 식습관을 형성하고 더 나은 삶을 영위할 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Nutrition education in schools helps students form balanced eating habits, and it contributes to a healthier life for them.</div>\n              <div class=\"lec-final-sum-ko\">학교에서의 영양 교육은 학생들이 균형 잡힌 식습관을 형성하도록 돕고, 그들의 더 건강한 삶에 기여한다.</div></div></div>"],"segs":[[{"audio":"./unit20_04_강의_audio/1.mp3","hl":null}],[{"audio":"./unit20_04_강의_audio/2.mp3","hl":null}],[{"audio":"./unit20_04_강의_audio/3.mp3","hl":null},{"audio":"./unit20_04_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit20_04_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit20_04_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit20_04_강의_audio/7.mp3","hl":null}],[{"audio":"./unit20_04_강의_audio/8.mp3","hl":"main"},{"audio":"./unit20_04_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit20_04_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit20_04_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0
