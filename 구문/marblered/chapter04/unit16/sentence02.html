의미를 부여하는 이유</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 살면서 마주하는 여러 가지 어려움(challenges)은 우리를 힘들게 하기도 하지만, 사실 우리가 성장할 수 있게 만드는 아주 중요한 원동력이기도 해요. 심리학에서는 이를 &#39;성장 마인드셋(growth mindset)&#39;과 관련 지어 설명하곤 하는데, 어려운 상황을 단순히 피해야 할 고통으로 보는 게 아니라 자신의 능력을 한 단계 더 발전시킬 수 있는 소중한 기회로 인식하는 태도를 말하죠. 마치 근육을 키우기 위해 무거운 덤벨을 드는 과정이 힘들지만 결국 몸을 단단하게 만드는 것처럼, 우리 삶의 문제들도 결국 우리를 더 단단하고 의미 있는 사람으로 다듬어 주는 과정이라고 볼 수 있어요. 그래서 많은 전문가들은 힘든 일을 겪고 그것을 해결해 나가는 과정이 우리 삶을 비로소 가치 있게 만든다고 강조한답니다. 이 글을 읽으면서 여러분이 지금껏 겪어온 도전들이 어떤 의미를 담고 있었는지 한번 생각해보면 좋을 것 같아요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도전의 역할</div><ul><li>우리가 겪는 도전은 삶을 더욱 흥미로운 것으로 변화시킨다.</li><li>삶의 흥미를 유발하는 요소(interesting)</li><li>어려움과 시련(challenges)이 존재하는 이유</li><li>핵심 키워드: 도전(challenges)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02극복의 가치</div><ul><li>도전을 이겨내는 과정 자체가 삶의 의미를 결정짓는 핵심적인 요소이다.</li><li>단순히 겪는 것을 넘어 극복함(overcoming)</li><li>삶에 가치를 부여하는 행위(meaningful)</li><li>핵심 키워드: 극복(overcoming)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결론</div><ul><li>흥미로운 삶과 의미 있는 삶은 도전과 그 극복을 통해 완성된다.</li><li>도전과 극복의 상호관계</li><li>더 나은 삶을 향한 필수 과정</li><li>핵심 키워드: 삶의 의미(meaningful life)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">challenge</td><td class=\"m\">도전, 난제</td></tr><tr><td class=\"w\">interesting</td><td class=\"m\">흥미로운</td></tr><tr><td class=\"w\">overcome</td><td class=\"m\">극복하다</td></tr><tr><td class=\"w\">meaningful</td><td class=\"m\">의미 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">도전들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Challenges</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만드는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">are what make</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인생을 흥미롭게</span><span class=\"en\"><b><span class=\"grammar-hl\">life interesting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것들을 극복하는 것은</span><span class=\"en\"><b>and <span class=\"grammar-hl\">overcoming them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만드는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is what makes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인생을 의미 있게</span><span class=\"en\"><b><span class=\"grammar-hl\">life meaningful</span>.</b></span></div></div><div class=\"lec-sent-ko\">도전은 인생을 흥미롭게 만드는 것이고 도전을 극복하는 것은 인생을 의미 있게 만드는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 삶의 두 가지 본질적인 가치인 &#39;재미&#39;와 &#39;의미&#39;를 각각 &#39;도전&#39;과 &#39;극복&#39;이라는 행위에 연결하고 있습니다. 앞부분에서는 새로운 것을 시도하며 느끼는 흥미를 언급하고, 뒷부분에서는 그 시련을 이겨냈을 때 얻는 삶의 보람을 강조하며 문장을 확장하고 있습니다. 여기서 Challenges는 사전적으로 &#39;도전&#39;이라는 뜻인데, 여기서는 단순히 승부를 겨루는 것이 아니라 우리 삶에서 마주하는 &#39;어려움&#39;이나 &#39;시련&#39;을 뜻합니다. 필자는 이 단어를 통해 우리가 겪는 힘든 상황을 부정적인 고통으로만 보지 않고, 삶을 생동감 있게 만드는 필수적인 과정으로 재정의하려고 이 단어를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Challenges are what make life interesting (강조구문): &#39;be동사(are) + what절&#39; 구조의 명사절 강조 패턴이다. what절 내부의 make는 5형식 동사로, make(V) + life(O) + interesting(OC) 구조를 취한다.</div><div class=\"lec-gr-item\">make life interesting 5형식(SVOC) 구조: make(V) + life(O) + interesting(OC) 형태로, 목적어인 life의 상태를 보어인 interesting이 보충 설명한다.</div><div class=\"lec-gr-item\">overcoming them (동명사): 문장에서 주어 역할을 하고 있다. &#39;그것들을 극복하는 것&#39;이라는 명사적 의미로 쓰였다.</div><div class=\"lec-gr-item\">overcoming them is what makes life meaningful (강조구문): &#39;be동사(is) + what절&#39; 구조를 사용하여 문장의 서술부를 강조하고 있다. what절 내부의 makes는 5형식 동사로, makes(V) + life(O) + meaningful(OC) 구조이다.</div><div class=\"lec-gr-item\">makes life meaningful 5형식(SVOC) 구조: makes(V) + life(O) + meaningful(OC) 형태로, 목적격 보어 자리에 형용사 meaningful이 위치하여 목적어의 상태를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">challenge</td><td class=\"m\">도전, 난제</td></tr><tr><td class=\"w\">interesting</td><td class=\"m\">흥미로운</td></tr><tr><td class=\"w\">meaningful</td><td class=\"m\">의미 있는</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인생의 흥미는 도전하는 과정에서 생겨난다.</li><li>인생의 의미는 그 도전들을 끝내 극복할 때 비로소 완성된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Challenges make our daily lives interesting, and the process of overcoming them makes our existence meaningful.</div>\n              <div class=\"lec-final-sum-ko\">도전은 우리의 일상을 흥미롭게 만들며, 그것을 극복하는 과정이 우리의 존재를 의미 있게 만든다.</div></div></div>"],"segs":[[{"audio":"./sentence02_audio/1.mp3","hl":null}],[{"audio":"./sentence02_audio/2.mp3","hl":null}],[{"audio":"./sentence02_audio/3.mp3","hl":null},{"audio":"./sentence02_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence02_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence02_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence02_audio/7.mp3","hl":null}],[{"audio":"./sentence02_audio/8.mp3","hl":"main"},{"audio":"./sentence02_audio/9.mp3","hl":"meaning"},{"audio":"./sentence02_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence02_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getEle
