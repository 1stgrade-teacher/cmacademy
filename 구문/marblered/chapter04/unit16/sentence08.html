24P09x29BSAg9WBI98D1HHHqOtP+vuAfR6/5/z/AJ98JuX1HfuO3X8u/p3pA6kZyP5//XoTvsA79Oef85/z6UUmR6jqR1HbOfyxyO360hZemRz9D+n+QO/uAO/z/n/P1pD/AFHb0wf16DHOenSjj16Z9Poc/TNJuBJ5AxjuPx4z7cE/h7gf1/X3jqTnPt/nr/8AW/qcJuHIBBPfnnPf8vTPHAOBilyPUfmPT/JoAX8z/n/P5euMn+f8/wCf/rpuGcZHfuOo6/l3x070bhzyODjqO/Pr/nmgL/5/cLRSbhnGR3788Yz+WRnnj0pNw9R1xyR+ff8ADPX8aAHUUnvng4x/n39PqeuMJlcjkZxnr27/AM+f/rcADu/+ff3/AKf/AFj1z/L/ADmkBBAPr0/z3o9R/n8eOOv5UALRSD/9X+falo/r1AKP8/5/z/8AXKP8/l/hQAnfp+P6f4/Tv1paQkDqeucfT/ADqaDwCfQGgD//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">The New Processor: A Benchmark of Superior Speed<small>새로운 프로세서: 탁월한 속도의 기준</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 문장에는 &#39;~와 ~의 관계는 ~와 ~의 관계와 같다&#39;라는 의미로 두 대상의 유사한 관계를 비교할 때 쓰는 유추(Analogy)라는 표현 기법이 담겨 있어요. 여기서 &#39;Ferrari&#39;는 성능이 아주 뛰어난 고성능 자동차의 대명사로 사용되었는데, 이는 어떤 분야에서 최고의 효율을 내는 대상을 비유할 때 자주 등장하는 방식이죠. 즉, 이 글은 최신 프로세서가 기존의 것들보다 압도적으로 빠르다는 사실을 비유(Metaphor)를 통해 아주 직관적으로 설명하고 있는 거예요. 마치 우리가 &#39;스마트폰계의 애플&#39;이나 &#39;축구계의 메시&#39;라고 말하는 것처럼, 특정 대상을 최고 수준의 아이콘에 빗대어 그 우월함을 강조하는 것이죠. 이처럼 글쓴이는 기술적인 복잡한 수치 대신 일상적인 자동차를 예로 들어, 독자가 프로세서의 성능 차이를 즉각적으로 이해할 수 있게 돕고 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01비유적 대상 설정</div><ul><li>신형 프로세서의 성능을 이해하기 쉽게 자동차에 빗대어 설명한다.</li><li>비교 대상: 신형 프로세서와 다른 프로세서들</li><li>비유 대상: 페라리(Ferrari)와 일반 자동차들</li><li>핵심 키워드: 비유(analogy)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02핵심 비교 기준</div><ul><li>두 대상의 공통적인 비교 기준은 바로 속도이다.</li><li>신형 프로세서의 결정적 강점: 속도(faster)</li><li>페라리가 자동차들 사이에서 갖는 위상과 동일함</li><li>핵심 키워드: 속도(speed)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결론적 의미</div><ul><li>비유를 통해 신형 프로세서가 가진 압도적인 성능을 강조한다.</li><li>다른 프로세서들과 차별화되는 탁월한 능력</li><li>논리적 관계: 신형 프로세서 : 다른 프로세서 = 페라리 : 다른 자동차</li><li>핵심 키워드: 성능(performance)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">processor</td><td class=\"m\">프로세서(중앙처리장치)</td></tr><tr><td class=\"w\">be to A what B is to C</td><td class=\"m\">A와 B의 관계는 C와 D의 관계와 같다</td></tr><tr><td class=\"w\">i.e.</td><td class=\"m\">즉, 다시 말해</td></tr><tr><td class=\"w\">fast</td><td class=\"m\">빠른</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">새로운 프로세서는</span><span class=\"en\"><b>The new processor</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 프로세서들에게 ~와 같다</span><span class=\"en\"><b><span class=\"grammar-hl\">is to</span> other processors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">페라리가</span><span class=\"en\"><b>what a Ferrari</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 자동차들에게 그러한 것</span><span class=\"en\"><b><span class=\"grammar-hl\">is to</span> other cars</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">: 즉 더 빠르다.</span><span class=\"en\"><b>: i.e. faster.</b></span></div></div><div class=\"lec-sent-ko\">새로운 프로세서와 다른 프로세서들의 관계는 페라리와 다른 자동차들의 관계와 같다. 즉 더 빠르다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 &#39;~와 ~의 관계는 A와 B의 관계와 같다&#39;는 구조인 &#39;A is to B what C is to D&#39; 구문을 사용하여, 새로운 프로세서의 압도적인 속도를 페라리에 비유하고 있습니다. Ferrari는 사전적으로는 이탈리아의 고급 스포츠카 브랜드이지만, 여기서는 &#39;성능과 속도의 대명사&#39;라는 상징적 의미로 사용되었습니다. 필자는 일반적인 프로세서와 새로운 프로세서의 성능 차이를 자동차 업계의 일반적인 차와 페라리의 차이만큼이나 명확하고 극명하게 보여주기 위해 이 비유를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is to (관용표현): A is to B what C is to D (A와 B의 관계는 C와 D의 관계와 같다) 구문에서 &#39;A is to B&#39;가 사용됨. 비교 대상을 비유적으로 연결하는 구조임.</div><div class=\"lec-gr-item\">is 5형식(SVOC) 구조의 변형: 이 문장은 &#39;The new processor(S) is(V) to other processors(C) what(O/관계대명사절)&#39;의 구조로, 명사절이 보어(C) 역할을 하는 문장임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">processor</td><td class=\"m\">프로세서(중앙처리장치)</td></tr><tr><td class=\"w\">i.e.</td><td class=\"m\">즉, 다시 말해</td></tr><tr><td class=\"w\">fast</td><td class=\"m\">빠른</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>새로운 프로세서의 성능을 일반적인 프로세서와 비교한다.</li><li>페라리가 자동차들 사이에서 갖는 압도적인 속도라는 위상을 빌려온다.</li><li>새로운 프로세서가 기존 제품들에 비해 월등히 빠르다는 것을 강조한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The new processor is compared to a Ferrari to highlight that it possesses superior speed, as it significantly outperforms other processors.</div>\n              <div class=\"lec-final-sum-ko\">새로운 프로세서는 다른 프로세서들보다 월등히 빠르다는 것을 강조하기 위해 페라리에 비유된다.</div></div></div>"],"segs":[[{"audio":"./sentence08_audio/1.mp3","hl":null}],[{"audio":"./sentence08_audio/2.mp3","hl":null}],[{"audio":"./sentence08_audio/3.mp3","hl":null},{"audio":"./sentence08_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence08_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence08_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence08_audio/7.mp3","hl":null}],[{"audio":"./sentence08_audio/8.mp3","hl":"main"},{"audio":"./sentence08_audio/9.mp3","hl":"meaning"},{"audio":"./sentence08_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence08_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelector
