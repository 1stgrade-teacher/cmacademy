OpHf9Dz69Oh9/SlyPUfnTD8v10t/XoL0zntR703eOeRxnuO33u/8PU9Dg9OmQsB1I6eoyf5eox9aP6+X9ML/L1/IUenp+v4duQfb0NHc/keSOTj04zj8enQYJMg/wAQ79COcdfy7+lIWAGSQee3rx0BP0/nQH9f13HUUmR1yO/fsOvft3P50ZHHI56cjn/H8KWn9P0/4H9MF+PW3cWikyB1I7n04HXqe3c8fhSAg4OeeeM/gfrgj9KYC/qP8g/Ud+f17Huf/wBXr646etJuHPIwMnJI7dfwA6nt35zQCDjnO7nGQe3Qf59fegB2fr37en+eP/rjJTdyggZHOQOR/D149u+PxxxQCOuRj6nuT1z6/T8SKA/r+vuY6im71Gckce/0/wAaUEHv2B6j+h/PtQAtFJuHPI4znn+716Z6d/ToeeKTcpwc9fcdv17+4/PkC9/6+f6i9cj+n5exxRgenvzzSbgccjr3Izxyeh7d/pgjnIXI9R+Y/wAf8/lQAvr+X+P+H1BopuVztyO/HX6/iO9BdQM5Hp1FADunp1+nX+v86KbvGSMjjnr1/wA/59gMD3x+I9M/59xigB1H9f8AD9On50mR6jv39Ov5d/SjI7kY7dO39en+A7n9egf1/X/AADH55/zyf0x9KMg5B/UH/P5elJuXjnrkDn09s9uM9/XHZcjOcj8xz1/+v0ovb+vl+oC+n/1/8/n+Xof5/wA/5+tN3LgN69PX3/LHNKSAOT249/ofx/rQAvWim7l4GQeAeoI9uf5fSlDKe4/MUB/X9f1+ItH+fr6Y5ooyPWgAqlqP/IOv+cf6Fdc+n7iTnof5H6GrmR6/r6dfy71R1Q7dM1E+lhdn8reQ0dNPl2A//9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Design: Beyond Aesthetics to Functional Performance<small>디자인: 심미성을 넘어 기능적 성과로</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 흔히 &#39;디자인&#39;이라고 하면 예쁜 색감이나 화려한 모양만을 떠올리기 쉬운데요, 사실 디자인의 본질은 사용자가 제품을 얼마나 편리하게 사용할 수 있는지를 결정하는 &#39;기능성(Functionality)&#39;에 있습니다. 이를 &#39;사용자 경험(User Experience, UX)&#39;이라고 부르는데, 단순히 겉모습만 꾸미는 것이 아니라 사용자의 행동 패턴을 분석해서 문제를 해결하는 과정이 바로 진정한 디자인인 것이죠. 예를 들어, 아무리 예쁜 리모컨이라도 버튼이 누르기 불편하게 되어 있다면 그건 좋은 디자인이라고 할 수 없는 것과 같은 맥락입니다. 결국 디자인은 사용자와 제품 사이의 소통 방식을 설계하는 일종의 &#39;문제 해결 과정(Problem Solving Process)&#39;이라고 이해하면 지문을 훨씬 깊이 있게 읽을 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01디자인에 대한 편견</div><ul><li>사람들은 흔히 디자인을 시각적이고 감각적인 부분으로만 생각하곤 한다.</li><li>눈에 보이는 모습 (looks like)</li><li>느껴지는 감각 (feels like)</li><li>핵심 키워드: 겉모습(appearance)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02디자인의 본질</div><ul><li>진정한 디자인의 가치는 단순한 형태를 넘어 그 결과물이 기능하는 방식에 있다.</li><li>작동 원리 (how it works)</li><li>사용 목적과 기능 중심 (functionality)</li><li>핵심 키워드: 작동 방식(workability)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03통합적 관점</div><ul><li>디자인은 외적인 형태와 내적인 기능이 결합된 총체적인 결과물이다.</li><li>시각과 기능을 모두 포괄함</li><li>디자인의 핵심은 작동 과정에 있음</li><li>핵심 키워드: 설계(design)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">design</td><td class=\"m\">디자인, 설계</td></tr><tr><td class=\"w\">look like</td><td class=\"m\">~처럼 보이다</td></tr><tr><td class=\"w\">feel like</td><td class=\"m\">~하게 느껴지다</td></tr><tr><td class=\"w\">work</td><td class=\"m\">작동하다, 기능하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">디자인은</span><span class=\"en\"><b>Design</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 ~가 아니다</span><span class=\"en\"><b>is not just</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 어떻게 보이는지</span><span class=\"en\"><b><span class=\"grammar-hl\">what it looks like</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 어떻게 느껴지는지</span><span class=\"en\"><b>and <span class=\"grammar-hl\">feels like</span>.</b></span></div></div><div class=\"lec-sent-ko\">디자인은 단지 그것이 어떻게 보이고 느껴지느냐가 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 디자인을 단순히 눈에 보이는 형태나 감각적인 느낌으로만 규정하려는 일반적인 시각을 부정하며, 이 글의 논의를 시작하는 도입부입니다. 여기서 looks like(보이다)와 feels like(느껴지다)는 디자인의 &#39;외적인 요소&#39;를 상징하며, 필자는 우리가 흔히 생각하는 디자인의 정의가 불완전하다는 점을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what it looks like (간접의문문): 의문사(what) + 주어(it) + 동사(looks)로 구성된 명사절이 보어 자리에 쓰여 문장 성분을 형성하고 있습니다.</div><div class=\"lec-gr-item\">feels like (간접의문문): 앞선 what과 병렬 구조로 이어진 절로, 의문사절이 보어 역할을 수행합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">design</td><td class=\"m\">디자인, 설계</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">디자인은</span><span class=\"en\"><b>Design</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~이다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 어떻게 작용하는지</span><span class=\"en\"><b><span class=\"grammar-hl\">how it works</span>.</b></span></div></div><div class=\"lec-sent-ko\">디자인은 그것이 어떻게 작용하느냐이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제기한 &#39;외적 요소&#39;와 대비되는 &#39;내적 기능&#39;을 디자인의 핵심으로 정의합니다. 여기서 works는 사전적으로는 &#39;일하다/작동하다&#39;이지만, 여기서는 제품이나 서비스가 원래 의도한 목적에 맞게 &#39;기능을 효율적으로 수행하는 방식&#39;을 의미합니다. 디자인이 단순한 장식을 넘어 실용적인 문제 해결 과정임을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how it works (간접의문문): 의문사(how) + 주어(it) + 동사(works)로 이루어진 명사절이 보어 자리에 위치하여 주어(Design)의 상태를 설명하고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">design</td><td class=\"m\">디자인, 설계</td></tr><tr><td class=\"w\">work</td><td class=\"m\">작동하다, 기능하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>디자인을 외형이나 느낌만으로 판단하는 것은 잘못되었다.</li><li>디자인의 진정한 본질은 그것이 어떻게 기능을 수행하고 문제를 해결하는지에 있다.</li><li>겉모습보다 실질적인 작동 방식이 디자인의 핵심이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Design encompasses more than just visual appeal, so it should be evaluated based on its practical performance.</div>\n              <div class=\"lec-final-sum-ko\">디자인은 단지 시각적인 매력 이상의 것을 포함하며, 따라서 실질적인 성능을 바탕으로 평가되어야 한다.</div></div></div>"],"segs":[[{"audio":"./sentence04_audio/1.mp3","hl":null}],[{"audio":"./sentence04_audio/2.mp3","hl":null}],[{"audio":"./sentence04_audio/3.mp3","hl":null},{"audio":"./sentence04_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence04_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence04_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence04_audio/7.mp3","hl":null}],[{"audio":"./sentence04_audio/8.mp3","hl":"main"},{"audio":"./sentence04_audio/9.mp3","hl":"meaning"},{"audio":"./sentence04_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence04_audio/11.mp3","hl":"main"},{"audio":"./sentence04_audio/12.mp3","hl":"meaning"},{"audio":"./sentence04_audio/13.mp3","hl":"grammar"}],[{"audio":"./sentence04_audio/14.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5
