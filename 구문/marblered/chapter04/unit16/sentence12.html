c-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 &quot;과학자에게 사실(Fact)은 시인에게 단어(Word)와 같다&quot;는 말을 들어본 적 있나요? 이 문장은 과학자가 세상을 탐구할 때 사실이라는 재료를 어떻게 다루는지를 비유적으로 보여줍니다. 마치 시인이 수많은 단어를 선택하고 배열해서 아름다운 시를 완성하듯, 과학자도 객관적인 사실들을 논리적으로 엮어 우리가 사는 세상에 대한 이론(Theory)이나 법칙(Law)을 구축하게 되죠. 즉, 사실 그 자체는 파편에 불과하지만, 과학자들은 그 파편들을 관찰하고 분석함으로써 세상의 원리를 체계화한다는 점을 이해하면 지문의 핵심을 훨씬 쉽게 파악할 수 있을 거예요. 이 글을 통해 과학적 사고 과정이 예술적인 창작 과정만큼이나 정교하고 중요하다는 사실을 함께 알아가 봐요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01과학자의 관점</div><ul><li>과학자에게 있어 사실은 연구의 기본이 되는 가장 중요한 재료이다.</li><li>사실(Facts)은 과학적 탐구의 출발점</li><li>과학적 지식을 쌓기 위한 필수적인 토대</li><li>핵심 키워드: 사실(Facts), 과학자(Scientist)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02시인의 관점</div><ul><li>시인에게 있어 단어는 자신의 예술적 세계를 표현하는 핵심 수단이다.</li><li>단어(Words)는 시인의 창작을 위한 필수 도구</li><li>언어를 통해 의미와 정서를 전달함</li><li>핵심 키워드: 단어(Words), 시인(Poet)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03두 영역의 유사성</div><ul><li>과학에서의 사실과 문학에서의 단어는 각자의 분야를 구성하는 근본적인 요소이다.</li><li>각 분야의 목적을 달성하기 위한 기본 단위</li><li>사실과 단어가 모여 의미 있는 결과물을 생성</li><li>핵심 키워드: 비유(Analogy), 근본 요소(Fundamental elements)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fact</td><td class=\"m\">사실</td></tr><tr><td class=\"w\">scientist</td><td class=\"m\">과학자</td></tr><tr><td class=\"w\">A be to B what C is to D</td><td class=\"m\">A와 B의 관계는 C와 D의 관계와 같다</td></tr><tr><td class=\"w\">word</td><td class=\"m\">단어, 말</td></tr><tr><td class=\"w\">poet</td><td class=\"m\">시인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실들은</span><span class=\"en\"><b>Facts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학자에게는 그러하다</span><span class=\"en\"><b><span class=\"grammar-hl\">are to</span> the scientist</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단어들이</span><span class=\"en\"><b><span class=\"grammar-hl\">what words</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시인에게 그러한 것과</span><span class=\"en\"><b><span class=\"grammar-hl\">are to the poet</span>.</b></span></div></div><div class=\"lec-sent-ko\">사실들과 과학자의 관계는 단어들과 시인과의 관계와 같다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 과학자에게 &#39;사실&#39;이 얼마나 중요한지를 시인에게 &#39;단어&#39;가 중요한 상황에 빗대어 설명하고 있습니다. 여기서 &#39;A is to B what C is to D&#39; 구문은 &#39;A와 B의 관계는 C와 D의 관계와 같다&#39;는 비유적 구조를 만들기 위해 사용되었습니다. 필자는 과학자가 연구를 할 때 사실이라는 재료를 다루는 방식이, 시인이 시를 쓸 때 단어라는 재료를 선택하고 배치하는 방식과 본질적으로 같다는 점을 강조하기 위해 이 비유를 골랐습니다. 단순히 지식을 나열하는 것이 아니라, 두 전문가가 자신의 도구를 다루는 방식이 얼마나 핵심적인지를 &#39;~is to~&#39;라는 구조로 압축하여 표현한 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are to (관용표현): A be to B (A와 B의 관계는 ~와 ~의 관계와 같다) 구조로, 비유적인 대조 관계를 나타내는 표현입니다.</div><div class=\"lec-gr-item\">what words are to the poet (간접의문문): what은 관계대명사(의문사)로 &#39;the thing(s) that&#39;의 의미를 가집니다. &#39;what words are to the poet&#39;는 전체가 보어 자리에 위치한 명사절 구조를 이루고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fact</td><td class=\"m\">사실</td></tr><tr><td class=\"w\">scientist</td><td class=\"m\">과학자</td></tr><tr><td class=\"w\">word</td><td class=\"m\">단어, 말</td></tr><tr><td class=\"w\">poet</td><td class=\"m\">시인</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과학자에게 사실(Fact)은 연구의 기본 재료이자 필수적인 요소이다.</li><li>시인에게 단어(Word)가 작품을 만드는 필수 재료인 것과 같은 원리이다.</li><li>즉, 각 분야의 전문가들은 자신만의 핵심 도구를 통해 세상을 해석하고 창조한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Facts serve as the primary material for scientists, as they function as the essential foundation for scientific knowledge.</div>\n              <div class=\"lec-final-sum-ko\">사실은 과학적 지식의 필수적인 토대가 되기에, 과학자들에게 가장 중요한 재료 역할을 한다.</div></div></div>"],"segs":[[{"audio":"./sentence12_audio/1.mp3","hl":null}],[{"audio":"./sentence12_audio/2.mp3","hl":null}],[{"audio":"./sentence12_audio/3.mp3","hl":null},{"audio":"./sentence12_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence12_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence12_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence12_audio/7.mp3","hl":null}],[{"audio":"./sentence12_audio/8.mp3","hl":"main"},{"audio":"./sentence12_audio/9.mp3","hl":"meaning"},{"audio":"./sentence12_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence12_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-
