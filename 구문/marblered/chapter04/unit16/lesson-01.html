  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"unit16","title":"주격보어로 쓰이는 절 완전 정복 — that, what, how, whether, whatever","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>주격보어로 쓰이는 절 완전 정복 — that, what, how, whether, whatever\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>that·what·how·whether·whatever가 이끄는 절이 be동사 뒤 주격보어 자리에 오는 구조를 익혀 문장의 핵심 의미를 정확히 잡는다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘도 함께 구문의 블록을 맞춰 볼게요. 오늘 배울 구문은 절이 주격보어 자리에 통째로 들어가는 구조예요. be동사 뒤에 that, what, how, whether, whatever 같은 말이 보이면 반드시 눈이 멈춰야 합니다. 이 자리를 잡으면 긴 문장도 주어와 보어로 깔끔하게 나뉘어 보일 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">be동사 뒤에서 \u003cb class=\"key\">주격보어\u003c/b>는 주어의 정체나 내용을 풀어 설명하는 자리이고, 여기에 접속사 that, 의문사 how, whether, 복합관계대명사 whatever가 이끄는 \u003cb class=\"key\">절\u003c/b>이 통째로 들어갈 수 있습니다. 이때 절은 하나의 명사 덩어리처럼 취급되어 주어의 내용을 그대로 채워 줍니다. 또한 「A is to B what C is to D」처럼 \u003cb class=\"key\">what절\u003c/b>이 관계를 비교하는 보어 역할을 하기도 합니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Life's tragedy is \u003cspan class=\"fx\">that we get old too soon and wise too late\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 Challenges are \u003cspan class=\"fx\">what make life interesting and overcoming them is what makes life meaningful\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 If you don't design your own life plan, \u003cspan class=\"fx\">chances are you'll fall into someone else's plan\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Design is not just what it looks like and feels like. Design is how it works.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 The acid test of a good driver is \u003cspan class=\"fx\">whether he or she remains calm in an emergency\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 A decline of empathy and a rise in narcissism are exactly \u003cspan class=\"fx\">what we would expect to see in children who have little opportunity to play socially\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 The measure of a true champion is not \u003cspan class=\"fx\">how they win. It's how they handle defeat\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 The new processor \u003cspan class=\"fx\">is to other processors what a Ferrari is to other cars\u003c/span> : i.e. faster.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 The meaning of a poem is \u003cspan class=\"fx\">whatever the author intends to communicate to the reader by means of the poem\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 An important lesson to remember is \u003cspan class=\"fx\">that we should try to see the positives in life even while we are stuck in the middle of trouble\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 One key social competence is \u003cspan class=\"fx\">how well or poorly people express their own feelings\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Facts \u003cspan class=\"fx\">are to the scientist what words are to the poet\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 be동사 뒤를 보세요. 주격보어 자리는 주어를 설명하는 자리예요. 그런데 그 자리에 단어 하나가 아니라 that이나 what, how, whether 같은 말로 시작하는 덩어리가 통째로 들어올 수 있습니다. 이 덩어리를 우리는 절이라고 부르고, 절 전체가 명사 하나처럼 주격보어 역할을 하는 거죠. 그러니까 be동사를 기준으로 앞은 주어, 뒤는 보어 절로 크게 두 덩어리만 잡으면 됩니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Life's tragedy is \u003cspan class=\"fx\">that we get old too soon and wise too late\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Life's tragedy\u003c/div>\u003cdiv class=\"k\">인생의 비극은\u003c/div>\u003cdiv class=\"e\">is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">that we get old too soon\u003c/div>\u003cdiv class=\"k\">우리가 너무 일찍 늙는다는 것\u003c/div>\u003cdiv class=\"e\">and wise too late.\u003c/div>\u003cdiv class=\"k\">그리고 너무 늦게 지혜로워진다는 것\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>접속사 \u003cb class=\"key\">that\u003c/b>이 이끄는 절이 be동사 is 뒤에서 \u003cb class=\"key\">주격보어\u003c/b> 역할을 합니다. 주어 Life's tragedy의 내용을 that절 전체가 풀어서 설명하는 구조입니다.\u003c/div>","segs":[{"n":3,"text":"Life's tragedy, 인생의 비극은. is, ~이다. that we get old too soon, 우리가 너무 일찍 늙는다는 것. and wise too late, 그리고 너무 늦게 지혜로워진다는 것","hl":"ch"},{"n":4,"text":"첫 번째 문장을 보면 주어는 Life's tragedy, 동사는 is, 그리고 뒤에 that이 나옵니다. 이 that절이 통째로 주격보어가 되어 주어의 내용을 설명해 줍니다. 즉 인생의 비극이 무엇인지가 that 뒤에 길게 이어지는 구조예요. 그리고 뒤쪽에 and wise too late에서 wise 앞에 we get이 반복된 것으로 보면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Life's tragedy is \u003cspan class=\"fx\">that we get old too soon and wise too late\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>벤저민 프랭클린의 말로, 사람은 경험이 쌓여 지혜로워질 때쯤이면 이미 늙어 버린다는 아쉬움을 담고 있습니다. 늙는 속도와 지혜로워지는 속도의 대조가 이 문장의 핵심입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">we get old too soon and wise too late\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">we grow old before we grow wise\u003c/span>\u003cdiv class=\"w\">get old를 grow old로 바꾸고 too soon과 too late의 대조를 before 하나로 압축해 같은 의미를 더 간결하게 전합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Life's tragedy is that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The sad thing about life is that\u003c/span>\u003cdiv class=\"w\">tragedy를 일상적인 sad thing으로 낮춰 부담 없이 말할 때 쓸 수 있는 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">get old\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">grow old\u003c/span>\u003cspan class=\"y-eq\">get old = grow old\u003c/span>\u003cdiv class=\"w\">get 대신 grow를 써서 서서히 변해 가는 느낌을 살렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">too soon\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">earlier than we wish\u003c/span>\u003cdiv class=\"w\">너무 이르다는 뜻을 우리가 바라는 것보다 이르다로 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">tragedy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">misfortune\u003c/span>\u003cspan class=\"y-eq\">tragedy = misfortune\u003c/span>\u003cdiv class=\"w\">비극이라는 무거운 단어를 개인적인 불운이라는 뉘앙스로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The sad truth about life is that we grow old before we become wise.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 벤저민 프랭클린의 유명한 말이에요. 사람은 나이가 들수록 지혜로워지지만, 정작 지혜로워질 때는 이미 늙어 버린다는 아쉬움을 담고 있죠. 너무 일찍 늙고 너무 늦게 지혜로워진다는 대조를 눈여겨보세요.","hl":"mn"},{"n":6,"text":"이번에는 표현을 바꿔 볼게요. we get old too soon and wise too late는 we grow old before we grow wise라고 말할 수 있습니다. 또 Life's tragedy is that은 The sad thing about life is that으로 부드럽게 바꿀 수 있어요.","hl":"rw"},{"n":7,"text":"어구도 정리해 보죠. get old는 grow old로 바꿔 말할 수 있습니다. too soon은 earlier than we wish처럼 풀어 쓸 수 있고, tragedy는 misfortune으로 바꿔 쓸 수 있어요.","hl":"ph"},{"n":8,"text":"마지막으로 같은 뜻의 문장을 들어 보세요. The sad truth about life is that we grow old before we become wise. 늙는 것이 지혜로워지는 것보다 먼저 온다는 뜻으로, 원문과 같은 의미입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 Challenges are \u003cspan class=\"fx\">what make life interesting and overcoming them is what makes life meaningful\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Challenges\u003c/div>\u003cdiv class=\"k\">도전은\u003c/div>\u003cdiv class=\"e\">are\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">what make life interesting\u003c/div>\u003cdiv class=\"k\">삶을 흥미롭게 만드는 것\u003c/div>\u003cdiv class=\"e\">and\u003c/div>\u003cdiv class=\"k\">그리고\u003c/div>\u003cdiv class=\"e\">overcoming them\u003c/div>\u003cdiv class=\"k\">그것들을 극복하는 것은\u003c/div>\u003cdiv class=\"e\">is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">what makes life meaningful.\u003c/div>\u003cdiv class=\"k\">삶을 의미 있게 만드는 것\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>what이 이끄는 두 개의 절이 각각 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였습니다. 첫 번째 what절은 Challenges의 내용을, 두 번째 what절은 overcoming them의 내용을 설명합니다. 여기서 what은 선행사를 포함한 \u003cb class=\"key\">관계대명사 what\u003c/b>으로 ~하는 것이라는 뜻입니다.\u003c/div>","segs":[{"n":9,"text":"Challenges, 도전은. are, ~이다. what make life interesting, 삶을 흥미롭게 만드는 것. and, 그리고. overcoming them, 그것들을 극복하는 것은. is, ~이다. what makes life meaningful, 삶을 의미 있게 만드는 것","hl":"ch"},{"n":10,"text":"두 번째 문장은 be동사가 두 번 나오는 구조예요. 앞에서는 Challenges are 뒤에 what절이 붙어 주격보어가 되고, 뒤에서는 overcoming them is 뒤에 what절이 붙어 또 한 번 주격보어가 됩니다. 이렇게 what절이 be동사 뒤에 오면 ~하는 것이라는 명사 덩어리로 읽으면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 Challenges are \u003cspan class=\"fx\">what make life interesting and overcoming them is what makes life meaningful\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>도전이 있기 때문에 인생이 흥미로워지고, 그 도전을 이겨 내기 때문에 인생이 의미 있어진다는 말입니다. 어려움 자체가 삶의 재미와 의미의 재료가 된다는 따뜻한 메시지예요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Challenges are what make life interesting\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Challenges make life interesting\u003c/span>\u003cdiv class=\"w\">what절 주격보어 구조를 동사 중심의 단순 문장으로 바꿔 같은 뜻을 더 직접적으로 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">overcoming them\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">getting over them\u003c/span>\u003cdiv class=\"w\">overcome을 일상적인 구동사 get over로 바꿔 회화체 느낌을 냈습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">challenge\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">difficulty to face\u003c/span>\u003cspan class=\"y-eq\">challenge = difficulty\u003c/span>\u003cdiv class=\"w\">도전이라는 말을 마주해야 할 어려움으로 풀어 설명했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">overcome\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">get over\u003c/span>\u003cspan class=\"y-eq\">overcome = get over\u003c/span>\u003cdiv class=\"w\">극복하다를 구동사로 바꿔 더 구어적인 표현으로 만들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">meaningful\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">significant\u003c/span>\u003cspan class=\"y-eq\">meaningful = significant\u003c/span>\u003cdiv class=\"w\">의미 있는을 격식 있는 단어로 바꿔 학술적인 글에도 어울리게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Life becomes interesting because of challenges, and it becomes meaningful when we get over them.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 도전이 있어야 인생이 재미있고, 그 도전을 이겨 내야 인생이 의미 있어진다고 말하고 있어요. 힘든 일이 오히려 삶을 채워 준다는 뜻이죠. 그래서 what절이 두 번 나오는 구조가 메시지를 나란히 대비시켜 줍니다.","hl":"mn"},{"n":12,"text":"표현을 바꿔 보면 Challenges are what make life interesting은 Challenges make life interesting으로 간단히 말할 수 있습니다. 또 overcoming them은 getting over them으로 바꿔도 같은 뜻이에요.","hl":"rw"},{"n":13,"text":"어구를 정리해 보죠. challenge는 difficulty to face로 풀 수 있고, overcome은 get over로 바꿀 수 있습니다. meaningful은 significant로 바꿔 쓸 수 있어요.","hl":"ph"},{"n":14,"text":"같은 뜻의 문장을 들어 보세요. Life becomes interesting because of challenges, and it becomes meaningful when we get over them. 도전 덕분에 재미있어지고 극복 덕분에 의미 있어진다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 If you don't design your own life plan, \u003cspan class=\"fx\">chances are you'll fall into someone else's plan\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If you don't design your own life plan,\u003c/div>\u003cdiv class=\"k\">만약 당신이 자신의 인생 계획을 설계하지 않는다면,\u003c/div>\u003cdiv class=\"e\">chances are\u003c/div>\u003cdiv class=\"k\">가능성이 크다\u003c/div>\u003cdiv class=\"e\">you'll fall into someone else's plan.\u003c/div>\u003cdiv class=\"k\">당신이 다른 누군가의 계획에 빠지게 될 것이라는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>chances are 뒤에 접속사 \u003cb class=\"key\">that\u003c/b>이 생략된 절이 이어지며, 이 절이 \u003cb class=\"key\">주격보어\u003c/b> 역할을 합니다. chances are that ...은 ~할 가능성이 크다는 뜻의 관용 표현입니다.\u003c/div>","segs":[{"n":15,"text":"If you don't design your own life plan, 만약 당신이 자신의 인생 계획을 설계하지 않는다면. chances are, 가능성이 크다. you'll fall into someone else's plan, 당신이 다른 누군가의 계획에 빠지게 될 것이라는","hl":"ch"},{"n":16,"text":"세 번째 문장에서 chances are 뒤를 주목하세요. 원래는 chances are that you'll fall into someone else's plan인데 that이 생략되어 있습니다. 이 that절이 주격보어 자리를 채우면서 ~할 가능성이 크다는 뜻을 만들어 냅니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 If you don't design your own life plan, \u003cspan class=\"fx\">chances are you'll fall into someone else's plan\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자신의 인생 계획을 직접 짜지 않으면 남이 만들어 놓은 계획에 끌려가게 된다는 경고입니다. 주도권을 잡지 않으면 남의 인생을 살게 된다는 뜻이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">chances are you'll fall into someone else's plan\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">you are likely to end up following someone else's plan\u003c/span>\u003cdiv class=\"w\">chances are 구문을 be likely to로 바꿔 같은 가능성의 의미를 더 격식 있게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">design your own life plan\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">map out your own life plan\u003c/span>\u003cdiv class=\"w\">design을 map out으로 바꿔 계획을 구체적으로 그려 낸다는 느낌을 더했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">chances are\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">it is likely that\u003c/span>\u003cspan class=\"y-eq\">chances are = it is likely that\u003c/span>\u003cdiv class=\"w\">가능성이 크다는 표현을 가장 일반적인 형태로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fall into\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">end up in\u003c/span>\u003cspan class=\"y-eq\">fall into = end up in\u003c/span>\u003cdiv class=\"w\">빠지다라는 말을 결국 그렇게 되다라는 의미로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">design\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">plan out\u003c/span>\u003cspan class=\"y-eq\">design = plan out\u003c/span>\u003cdiv class=\"w\">설계하다를 계획을 세우다라는 구동사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Unless you map out your own life, you will probably end up following someone else's plan.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 스스로 계획을 세우지 않으면 남의 계획에 휘말린다고 경고하고 있어요. 인생의 주도권을 잡으라는 메시지가 담겨 있죠. 그래서 조건을 나타내는 If절과 가능성을 나타내는 chances are가 짝을 이루고 있습니다.","hl":"mn"},{"n":18,"text":"표현을 바꿔 볼까요. chances are you'll fall into someone else's plan은 you are likely to end up following someone else's plan으로 바꿀 수 있습니다. design your own life plan은 map out your own life plan으로도 말할 수 있어요.","hl":"rw"},{"n":19,"text":"어구를 정리하면 chances are는 it is likely that으로, fall into는 end up in으로 바꿀 수 있습니다. design은 plan out으로 바꿔 쓸 수 있습니다.","hl":"ph"},{"n":20,"text":"같은 뜻의 문장을 들어 보세요. Unless you map out your own life, you will probably end up following someone else's plan. 스스로 계획하지 않으면 남의 계획을 따르게 된다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Design is not just what it looks like and feels like. Design is how it works.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Design\u003c/div>\u003cdiv class=\"k\">디자인은\u003c/div>\u003cdiv class=\"e\">is not just\u003c/div>\u003cdiv class=\"k\">단지 ~가 아니다\u003c/div>\u003cdiv class=\"e\">what it looks like and feels like.\u003c/div>\u003cdiv class=\"k\">그것이 어떻게 보이고 느껴지는지라는 것\u003c/div>\u003cdiv class=\"e\">Design\u003c/div>\u003cdiv class=\"k\">디자인은\u003c/div>\u003cdiv class=\"e\">is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">how it works.\u003c/div>\u003cdiv class=\"k\">그것이 어떻게 작동하는지\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>첫 문장에서는 what절이, 두 번째 문장에서는 how절이 각각 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였습니다. what은 ~한 것, how는 어떻게 ~하는지라는 뜻으로 주어 Design의 내용을 절로 풀어 줍니다.\u003c/div>","segs":[{"n":21,"text":"Design, 디자인은. is not just, 단지 ~가 아니다. what it looks like and feels like, 그것이 어떻게 보이고 느껴지는지라는 것. Design, 디자인은. is, ~이다. how it works, 그것이 어떻게 작동하는지","hl":"ch"},{"n":22,"text":"네 번째 문장은 두 문장이 나란히 놓여 있어요. 앞 문장에서는 what절이 is not just 뒤에서 주격보어가 되고, 뒷 문장에서는 how절이 is 뒤에서 주격보어가 됩니다. what은 것, how는 어떻게인지로 구분해서 읽으면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Design is not just what it looks like and feels like. Design is how it works.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>디자인의 본질은 겉으로 보이는 모습이 아니라 실제로 어떻게 작동하는가에 있다는 스티브 잡스의 말입니다. 보기 좋은 것과 제대로 기능하는 것 중 후자를 강조하고 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Design is how it works\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">What matters in design is how it functions\u003c/span>\u003cdiv class=\"w\">주격보어 how절을 what matters 구문으로 감싸 강조점을 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">not just what it looks like and feels like\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">not merely its appearance and the way it feels\u003c/span>\u003cdiv class=\"w\">what절을 명사구로 바꿔 겉모습이라는 의미를 더 직접적으로 드러냈습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv cla  뜻의 문장을 들어 보세요. What truly proves a good driver is whether or not he or she stays calm in a crisis. 위기 상황에서 침착한지가 좋은 운전자를 증명한다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 A decline of empathy and a rise in narcissism are exactly \u003cspan class=\"fx\">what we would expect to see in children who have little opportunity to play socially\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A decline of empathy and a rise in narcissism\u003c/div>\u003cdiv class=\"k\">공감 능력의 감소와 자아도취의 증가는\u003c/div>\u003cdiv class=\"e\">are exactly\u003c/div>\u003cdiv class=\"k\">정확히 ~이다\u003c/div>\u003cdiv class=\"e\">what we would expect to see\u003c/div>\u003cdiv class=\"k\">우리가 보리라고 예상하는 것\u003c/div>\u003cdiv class=\"e\">in children\u003c/div>\u003cdiv class=\"k\">아이들에게서\u003c/div>\u003cdiv class=\"e\">who have little opportunity to play socially.\u003c/div>\u003cdiv class=\"k\">사회적으로 놀이할 기회가 거의 없는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>what이 이끄는 절이 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였고, 그 안에서 관계대명사 \u003cb class=\"key\">who\u003c/b>가 이끄는 절이 선행사 children을 수식합니다. 보어절 안에 수식절이 한 겹 더 들어 있는 구조입니다.\u003c/div>","segs":[{"n":33,"text":"A decline of empathy and a rise in narcissism, 공감 능력의 감소와 자아도취의 증가는. are exactly, 정확히 ~이다. what we would expect to see, 우리가 보리라고 예상하는 것. in children, 아이들에게서. who have little opportunity to play socially, 사회적으로 놀이할 기회가 거의 없는","hl":"ch"},{"n":34,"text":"여섯 번째 문장은 주어가 길어요. A decline of empathy and a rise in narcissism까지가 주어이고, are exactly 뒤에 what절이 주격보어로 옵니다. 그 what절 안에서 who가 children을 꾸며 주니까, children 뒤에서 한 번 끊어 읽는 것이 중요합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 A decline of empathy and a rise in narcissism are exactly \u003cspan class=\"fx\">what we would expect to see in children who have little opportunity to play socially\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>공감 능력이 줄고 자아도취가 늘어나는 현상은 사회적으로 어울려 놀 기회가 적은 아이들에게서 당연히 나타나는 결과라는 설명입니다. 놀이 경험이 감정 발달에 중요하다는 점을 시사해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are exactly what we would expect to see in children\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are exactly the results we would predict in children\u003c/span>\u003cdiv class=\"w\">what절을 명사구 the results로 바꿔 예측되는 결과라는 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have little opportunity to play socially\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rarely get a chance to play with others\u003c/span>\u003cdiv class=\"w\">little opportunity를 rarely get a chance로 풀어 구어적으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">decline\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">decrease\u003c/span>\u003cspan class=\"y-eq\">decline = decrease\u003c/span>\u003cdiv class=\"w\">감소를 가장 일반적인 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rise\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">increase\u003c/span>\u003cspan class=\"y-eq\">rise = increase\u003c/span>\u003cdiv class=\"w\">증가를 명사로 같은 뜻의 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have little opportunity\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have few chances\u003c/span>\u003cspan class=\"y-eq\">little opportunity = few chances\u003c/span>\u003cdiv class=\"w\">기회가 거의 없다는 표현을 셀 수 있는 명사 형태로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Children who rarely get a chance to play with others predictably show less empathy and more narcissism.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 공감은 줄고 자아도취는 늘어나는 현상이, 사회적으로 놀 기회가 적은 아이들에게서 자연스럽게 나타난다고 말합니다. 친구들과 어울려 노는 경험이 감정을 키운다는 뜻이 담겨 있어요. exactly가 그 결과가 딱 예상대로라는 느낌을 더해 줍니다.","hl":"mn"},{"n":36,"text":"표현을 바꿔 보면 are exactly what we would expect to see in children은 are exactly the results we would predict in children으로 바꿀 수 있습니다. have little opportunity to play socially는 rarely get a chance to play with others로 풀어 말할 수 있어요.","hl":"rw"},{"n":37,"text":"어구를 정리해 보죠. decline은 decrease로, rise는 increase로 바꿀 수 있습니다. have little opportunity는 have few chances로도 바꿀 수 있어요.","hl":"ph"},{"n":38,"text":"같은 뜻의 문장을 들어 보세요. Children who rarely get a chance to play with others predictably show less empathy and more narcissism. 함께 놀 기회가 적은 아이들에게 공감 감소와 자아도취 증가가 나타난다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 The measure of a true champion is not \u003cspan class=\"fx\">how they win. It's how they handle defeat\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The measure of a true champion\u003c/div>\u003cdiv class=\"k\">진정한 챔피언의 척도는\u003c/div>\u003cdiv class=\"e\">is not\u003c/div>\u003cdiv class=\"k\">~가 아니다\u003c/div>\u003cdiv class=\"e\">how they win.\u003c/div>\u003cdiv class=\"k\">그들이 어떻게 이기는지\u003c/div>\u003cdiv class=\"e\">It's\u003c/div>\u003cdiv class=\"k\">그것은 ~이다\u003c/div>\u003cdiv class=\"e\">how they handle defeat.\u003c/div>\u003cdiv class=\"k\">그들이 패배를 어떻게 다루는지\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>how가 이끄는 두 개의 절이 각각 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였습니다. 앞 절은 is not 뒤에서, 뒤 절은 It's 뒤에서 어떻게 ~하는지라는 내용으로 주어를 설명합니다.\u003c/div>","segs":[{"n":39,"text":"The measure of a true champion, 진정한 챔피언의 척도는. is not, ~가 아니다. how they win, 그들이 어떻게 이기는지. It's, 그것은 ~이다. how they handle defeat, 그들이 패배를 어떻게 다루는지","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 두 문장으로 이루어져 있어요. 앞 문장에서는 how they win이 is not 뒤에서 주격보어가 되고, 뒷 문장에서는 how they handle defeat가 It's 뒤에서 주격보어가 됩니다. how절이 두 번 나와 이기는 방식과 지는 방식을 나란히 비교하는 구조죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 The measure of a true champion is not \u003cspan class=\"fx\">how they win. It's how they handle defeat\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>진짜 챔피언인지는 이기는 방식이 아니라 지는 상황을 받아들이는 방식으로 드러난다는 말입니다. 패배를 대하는 태도가 진짜 실력이라는 뜻이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The measure of a true champion is not how they win\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">What truly shows a champion is not the way they win\u003c/span>\u003cdiv class=\"w\">명사구 주어를 what절로 바꾸고 how절을 the way 명사구로 바꿔 의미를 더 자연스럽게 전했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">handle defeat\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">deal with losing\u003c/span>\u003cdiv class=\"w\">handle을 deal with로, defeat를 losing으로 풀어 구어적으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">measure\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">standard\u003c/span>\u003cspan class=\"y-eq\">measure = standard\u003c/span>\u003cdiv class=\"w\">척도를 판단 기준이라는 뜻의 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">handle\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">deal with\u003c/span>\u003cspan class=\"y-eq\">handle = deal with\u003c/span>\u003cdiv class=\"w\">다루다를 구동사로 바꿔 더 편한 표현으로 만들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">defeat\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">loss\u003c/span>\u003cspan class=\"y-eq\">defeat = loss\u003c/span>\u003cdiv class=\"w\">패배를 같은 뜻의 짧은 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">What truly shows a champion is not the way they win but the way they deal with losing.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 진짜 챔피언은 이기는 모습이 아니라 패배를 받아들이는 태도로 판단된다고 말합니다. 지는 순간에 어떻게 행동하느냐가 진짜 실력이라는 뜻이에요. not이 앞의 이기는 방식을 밀어내고 뒤의 패배 처리를 강조합니다.","hl":"mn"},{"n":42,"text":"표현을 바꿔 보면 The measure of a true champion is not how they win은 What truly shows a champion is not the way they win으로 바꿀 수 있습니다. handle defeat는 deal with losing으로도 말할 수 있어요.","hl":"rw"},{"n":43,"text":"어구를 정리해 보죠. measure는 standard로, handle은 deal with로 바꿀 수 있습니다. defeat는 loss로 바꿔도 같은 뜻입니다.","hl":"ph"},{"n":44,"text":"같은 뜻의 문장을 들어 보세요. What truly shows a champion is not the way they win but the way they deal with losing. 이기는 방식이 아니라 지는 방식을 보라는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 The new processor \u003cspan class=\"fx\">is to other processors what a Ferrari is to other cars\u003c/span> : i.e. faster.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The new processor\u003c/div>\u003cdiv class=\"k\">새로운 프로세서는\u003c/div>\u003cdiv class=\"e\">is to other processors\u003c/div>\u003cdiv class=\"k\">다른 프로세서들에게 ~한 관계이다\u003c/div>\u003cdiv class=\"e\">what a Ferrari is to other cars\u003c/div>\u003cdiv class=\"k\">페라리가 다른 자동차들에게 그러한 것과\u003c/div>\u003cdiv class=\"e\">: i.e. faster.\u003c/div>\u003cdiv class=\"k\">즉, 더 빠르다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「A is to B \u003cb class=\"key\">what\u003c/b> C is to D」 구문으로, what이 이끄는 절이 \u003cb class=\"key\">주격보어\u003c/b> 역할을 하며 A와 B의 관계가 C와 D의 관계와 같다는 것을 나타냅니다.\u003c/div>","segs":[{"n":45,"text":"The new processor, 새로운 프로세서는. is to other processors, 다른 프로세서들에게 ~한 관계이다. what a Ferrari is to other cars, 페라리가 다른 자동차들에게 그러한 것과. : i.e. faster, 즉, 더 빠르다","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 A is to B what C is to D 구문이에요. 새로운 프로세서가 다른 프로세서에게 무엇인지는 페라리가 다른 자동차에게 그러한 것과 같다고 말합니다. 여기서 what절이 주격보어 역할을 하면서 두 관계를 하나로 묶어 주는 거죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 The new processor \u003cspan class=\"fx\">is to other processors what a Ferrari is to other cars\u003c/span> : i.e. faster.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>새 프로세서가 다른 프로세서보다 얼마나 뛰어난지를 페라리에 비유한 문장입니다. 뒤에 붙은 i.e. faster가 그 비유의 핵심, 즉 속도라는 점을 알려 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">The new processor is to other processors what a Ferrari is to other cars\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">The new processor is like a Ferrari among other cars\u003c/span>\u003cdiv class=\"w\">A is to B what C is to D 구문을 like 비유로 바꿔 더 짧고 쉽게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">i.e. faster\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">that is, it is faster\u003c/span>\u003cdiv class=\"w\">약어 i.e.를 풀어 쓰고 주어와 동사를 넣어 문장으로 만들었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">A is to B what C is to D\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">A is like C among B\u003c/span>\u003cspan class=\"y-eq\">A is to B what C is to D = A is like C among B\u003c/span>\u003cdiv class=\"w\">관계 비교 구문을 like를 이용한 비유 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">i.e.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">that is\u003c/span>\u003cspan class=\"y-eq\">i.e. = that is\u003c/span>\u003cdiv class=\"w\">라틴어 약어를 영어 표현으로 풀어 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">processor\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">chip\u003c/span>\u003cspan class=\"y-eq\">processor = chip\u003c/span>\u003cdiv class=\"w\">프로세서를 일상적인 말로 바꿔 의미를 쉽게 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The new processor stands out from other processors the way a Ferrari stands out from other cars, and it is much faster.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"이 문장은 새 프로세서가 다른 프로세서들 사이에서 페라리 같은 존재라는 비유입니다. 뒤에 붙은 i.e. faster가 그 비유의 핵심이 속도라는 것을 알려 줘요. 즉 훨씬 빠르다는 뜻입니다.","hl":"mn"},{"n":48,"text":"표현을 바꿔 보면 통째로 The new processor is like a Ferrari among other cars라고 말할 수 있습니다. i.e. faster는 that is, it is faster로 풀어 쓸 수 있어요.","hl":"rw"},{"n":49,"text":"어구를 정리해 보죠. A is to B what C is to D는 A is like C among B로 바꿔 말할 수 있습니다. i.e.는 that is로 풀고, processor는 chip으로도 바꿀 수 있어요.","hl":"ph"},{"n":50,"text":"같은 뜻의 문장을 들어 보세요. The new processor stands out from other processors the way a Ferrari stands out from other cars, and it is much faster. 새 프로세서가 페라리처럼 두드러진다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 The meaning of a poem is \u003cspan class=\"fx\">whatever the author intends to communicate to the reader by means of the poem\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The meaning of a poem\u003c/div>\u003cdiv class=\"k\">시의 의미는\u003c/div>\u003cdiv class=\"e\">is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">whatever the author intends to communicate to the reader\u003c/div>\u003cdiv class=\"k\">작가가 독자에게 전달하고자 의도하는 무엇이든\u003c/div>\u003cdiv class=\"e\">by means of the poem.\u003c/div>\u003cdiv class=\"k\">시를 통해서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>복합관계대명사 \u003cb class=\"key\">whatever\u003c/b>가 이끄는 명사절이 is 뒤에서 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였습니다. whatever는 ~하는 무엇이든이라는 뜻으로 주어 The meaning of a poem의 내용을 규정합니다.\u003c/div>","segs":[{"n":51,"text":"The meaning of a poem, 시의 의미는. is, ~이다. whatever the author intends to communicate to the reader, 작가가 독자에게 전달하고자 의도하는 무엇이든. by means of the poem, 시를 통해서","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 whatever가 이끄는 명사절이 주격보어로 쓰였어요. whatever는 anything that으로 풀어 생각하면 이해가 빨라요. 주어 The meaning of a poem의 내용을 whatever절 전체가 채워 주는 구조입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 The meaning of a poem is \u003cspan class=\"fx\">whatever the author intends to communicate to the reader by means of the poem\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>시의 의미는 작가가 정해 두는 것이 아니라, 작가가 시를 통해 독자에게 전하려는 것 전부라는 말입니다. by means of the poem이 시라는 수단을 분명히 밝혀 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whatever the author intends to communicate to the reader\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">anything that the author wants to convey to readers\u003c/span>\u003cdiv class=\"w\">whatever절을 anything that절로 바꿔 의미를 그대로 유지하면서 형태만 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by means of the poem\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">through the poem\u003c/span>\u003cdiv class=\"w\">by means of를 더 짧고 흔한 전치사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whatever\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">anything that\u003c/span>\u003cspan class=\"y-eq\">whatever = anything that\u003c/span>\u003cdiv class=\"w\">복합관계대명사를 선행사와 관계대명사로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">intend to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">plan to\u003c/span>\u003cspan class=\"y-eq\">intend to = plan to\u003c/span>\u003cdiv class=\"w\">의도하다를 계획하다라는 쉬운 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by means of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">through\u003c/span>\u003cspan class=\"y-eq\">by means of = through\u003c/span>\u003cdiv class=\"w\">~을 통하여라는 뜻을 한 단어 전치사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A poem means anything its author wants to convey to readers through it.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 시의 의미가 작가가 시를 통해서 독자에게 전하려는 것이라는 뜻이에요. 즉 의미는 고정된 것이 아니라 작가의 의도에 달려 있다는 말이죠. by means of the poem이 시라는 수단을 분명히 짚어 줍니다.","hl":"mn"},{"n":54,"text":"표현을 바꿔 보면 whatever the author intends to communicate to the reader는 anything that the author wants to convey to readers로 바꿀 수 있습니다. by means of the poem은 through the poem으로 간단히 말할 수 있어요.","hl":"rw"},{"n":55,"text":"어구를 정리해 보죠. whatever는 anything that으로 풀 수 있고, intend to는 plan to로 바꿀 수 있습니다. by means of는 through로 바꾸면 됩니다.","hl":"ph"},{"n":56,"text":"같은 뜻의 문장을 들어 보세요. A poem means anything its author wants to convey to readers through it. 시의 의미는 작가가 시를 통해 전하려는 모든 것이라는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 An important lesson to remember is \u003cspan class=\"fx\">that we should try to see the positives in life even while we are stuck in the middle of trouble\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">An important lesson to remember\u003c/div>\u003cdiv class=\"k\">기억해야 할 중요한 교훈은\u003c/div>\u003cdiv class=\"e\">is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">that we should try to see the positives in life\u003c/div>\u003cdiv class=\"k\">우리가 삶에서 긍정적인 면을 보려고 노력해야 한다는 것\u003c/div>\u003cdiv class=\"e\">even while we are stuck in the middle of trouble.\u003c/div>\u003cdiv class=\"k\">심지어 우리가 문제 한가운데에 갇혀 있는 동안에도\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>접속사 \u003cb class=\"key\">that\u003c/b>이 이끄는 절이 is 뒤에서 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였고, 그 절 안에 even while이 이끄는 양보의 부사절이 들어 있습니다. 보어절 안에 부사절이 한 겹 더 있는 구조입니다.\u003c/div>","segs":[{"n":57,"text":"An important lesson to remember, 기억해야 할 중요한 교훈은. is, ~이다. that we should try to see the positives in life, 우리가 삶에서 긍정적인 면을 보려고 노력해야 한다는 것. even while we are stuck in the middle of trouble, 심지어 우리가 문제 한가운데에 갇혀 있는 동안에도","hl":"ch"},{"n":58,"text":"열 번째 문장은 주어 An important lesson to remember 뒤에 is가 나오고, that절이 주격보어로 옵니다. 그 that절 안에서 even while이 이끄는 부사절이 한 번 더 붙어요. 그래서 that절까지만 먼저 읽고 even while에서 한 번 끊어 주면 좋습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 An important lesson to remember is \u003cspan class=\"fx\">that we should try to see the positives in life even while we are stuck in the middle of trouble\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>힘든 상황 한가운데 있을 때일수록 삶의 좋은 면을 찾으려고 노력해야 한다는 교훈입니다. 문제가 없는 때가 아니라 문제 속에서도 긍정을 보라는 뜻이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">see the positives in life\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">look for the good things in life\u003c/span>\u003cdiv class=\"w\">the positives를 good things로 풀어 초보 학습자도 바로 이해할 수 있게 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">even while we are stuck in the middle of trouble\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">even when we are in the middle of difficulty\u003c/span>\u003cdiv class=\"w\">be stuck을 be동사로 단순화하고 trouble을 difficulty로 바꿔 격식을 조금 높였습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">positives\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">good things\u003c/span>\u003cspan class=\"y-eq\">positives = good things\u003c/span>\u003cdiv class=\"w\">긍정적인 것이라는 명사를 쉬운 말로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be stuck\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be trapped\u003c/span>\u003cspan class=\"y-eq\">be stuck = be trapped\u003c/span>\u003cdiv class=\"w\">갇혀 있다는 뜻을 같은 의미의 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in the middle of trouble\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in the midst of difficulty\u003c/span>\u003cspan class=\"y-eq\">in the middle of trouble = in the midst of difficulty\u003c/span>\u003cdiv class=\"w\">문제 한가운데를 조금 더 격식 있는 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">One important lesson is that we should look for the good things in life even when we are in the middle of difficulty.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 힘든 일 한가운데 있을 때일수록 삶의 좋은 면을 보려고 노력해야 한다는 교훈을 전합니다. 문제가 없는 상황이 아니라 문제 속에서도 긍정을 찾으라는 뜻이에요. even while이 그래도라는 뉘앙스를 더해 줍니다.","hl":"mn"},{"n":60,"text":"표현을 바꿔 보면 see the positives in life는 look for the good things in life로 바꿀 수 있습니다. even while we are stuck in the middle of trouble은 even when we are in the middle of difficulty로도 말할 수 있어요.","hl":"rw"},{"n":61,"text":"어구를 정리해 보죠. positives는 good things로, be stuck은 be trapped로 바꿀 수 있습니다. in the middle of trouble은 in the midst of difficulty로 바꿔도 좋습니다.","hl":"ph"},{"n":62,"text":"같은 뜻의 문장을 들어 보세요. One important lesson is that we should look for the good things in life even when we are in the middle of difficulty. 어려움 속에서도 좋은 면을 찾으라는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 One key social competence is \u003cspan class=\"fx\">how well or poorly people express their own feelings\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">One key social competence\u003c/div>\u003cdiv class=\"k\">주요한 사회적 능력 중 하나는\u003c/div>\u003cdiv class=\"e\">is\u003c/div>\u003cdiv class=\"k\">~이다\u003c/div>\u003cdiv class=\"e\">how well or poorly people express their own feelings.\u003c/div>\u003cdiv class=\"k\">사람들이 자신의 감정을 얼마나 잘 또는 형편없이 표현하는지\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>의문사 \u003cb class=\"key\">how\u003c/b>가 이끄는 간접의문문 절이 is 뒤에서 \u003cb class=\"key\">주격보어\u003c/b>로 쓰였습니다. how well or poorly는 얼마나 잘 또는 못하는지를 묻는 표현으로 절 전체가 하나의 명사처럼 쓰입니다.\u003c/div>","segs":[{"n":63,"text":"One key social competence, 주요한 사회적 능력 중 하나는. is, ~이다. how well or poorly people express their own feelings, 사람들이 자신의 감정을 얼마나 잘 또는 형편없이 표현하는지","hl":"ch"},{"n":64,"text":"열한 번째 문장은 how가 이끄는 간접의문문 절이 주격보어로 쓰인 경우예요. how well or poorly people express their own feelings 전체가 하나의 명사 덩어리로 is 뒤에 놓입니다. how 뒤에 well or poorly가 붙어 정도를 묻는 형태라는 점도 기억하세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 One key social competence is \u003cspan class=\"fx\">how well or poorly people express their own feelings\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사회적 능력의 핵심은 자기 감정을 표현하는 정도라는 뜻입니다. 잘 표현하는지 서툴게 표현하는지가 그 사람의 사회적 능력을 보여 준다는 말이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">how well or poorly people express their own feelings\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the degree to which people can express their feelings well or badly\u003c/span>\u003cdiv class=\"w\">how절을 the degree to which 명사구로 바꿔 좀 더 격식 있는 문장으로 만들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">express their own feelings\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">put their own feelings into words\u003c/span>\u003cdiv class=\"w\">감정을 표현하다를 말로 꺼내다라는 구체적인 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">competence\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">ability\u003c/span>\u003cspan class=\"y-eq\">competence = ability\u003c/span>\u003cdiv class=\"w\">능력이라는 뜻을 가장 기본적인 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">express\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">convey\u003c/span>\u003cspan class=\"y-eq\">express = convey\u003c/span>\u003cdiv class=\"w\">표현하다를 전달하다라는 뜻의 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">well or poorly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">skillfully or awkwardly\u003c/span>\u003cspan class=\"y-eq\">well or poorly = skillfully or awkwardly\u003c/span>\u003cdiv class=\"w\">잘 또는 못을 조금 더 구체적인 부사로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A key social skill is the degree to which people can express their feelings well or badly.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 사회적 능력의 핵심이 자기 감정을 얼마나 잘 표현하는가에 달려 있다고 말합니다. 감정을 잘 꺼내는 사람도 있고 서툰 사람도 있다는 뜻이죠. 그 차이가 곧 사회적 능력이라는 겁니다.","hl":"mn"},{"n":66,"text":"표현을 바꿔 보면 how well or poorly people express their own feelings는 the degree to which people can express their feelings well or badly로 바꿀 수 있습니다. express their own feelings는 put their own feelings into words로도 말할 수 있어요.","hl":"rw"},{"n":67,"text":"어구를 정리해 보죠. competence는 ability로, express는 convey로 바꿀 수 있습니다. well or poorly는 skillfully or awkwardly로 바꿔도 좋습니다.","hl":"ph"},{"n":68,"text":"같은 뜻의 문장을 들어 보세요. A key social skill is the degree to which people can express their feelings well or badly. 감정 표현의 정도가 사회적 능력이라는 뜻입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Facts \u003cspan class=\"fx\">are to the scientist what words are to the poet\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Facts\u003c/div>\u003cdiv class=\"k\">사실은\u003c/div>\u003cdiv class=\"e\">are to the scientist\u003c/div>\u003cdiv class=\"k\">과학자에게 ~한 관계이다\u003c/div>\u003cdiv class=\"e\">what words are to the poet.\u003c/div>\u003cdiv class=\"k\">단어가 시인에게 그러한 것과\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>「A is to B \u003cb class=\"key\">what\u003c/b> C is to D」 구조가 쓰였습니다. what이 이끄는 절이 \u003cb class=\"key\">주격보어\u003c/b>가 되어 사실과 과학자의 관계가 단어와 시인의 관계와 같다는 것을 나타냅니다.\u003c/div>","segs":[{"n":69,"text":"Facts, 사실은. are to the scientist, 과학자에게 ~한 관계이다. what words are to the poet, 단어가 시인에게 그러한 것과","hl":"ch"},{"n":70,"text":"열두 번째 문장은 여덟 번째 문장과 똑같은 A is to B what C is to D 구문이에요. Facts가 A, the scientist가 B, words가 C, the poet이 D에 해당합니다. what절이 주격보어로 와서 두 관계를 하나로 묶어 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Facts \u003cspan class=\"fx\">are to the scientist what words are to the poet\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>과학자에게 사실이 하는 역할은 시인에게 단어가 하는 역할과 같다는 말입니다. 둘 다 자신의 작업을 이루는 가장 기본 재료라는 뜻이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Facts are to the scientist what words are to the poet\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Facts are like words to the poet in the case of the scientist\u003c/span>\u003cdiv class=\"w\">A is to B what C is to D 구문을 like 비유로 풀어 더 쉽게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">what words are to the poet\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the way words matter to the poet\u003c/span>\u003cdiv class=\"w\">what절을 the way 명사구로 바꿔 의미를 자연스럽게 전했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">A is to B what C is to D\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">A is like C to D\u003c/span>\u003cspan class=\"y-eq\">A is to B what C is to D = A is like C to D\u003c/span>\u003cdiv class=\"w\">관계 비교 구문을 like 비유 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">facts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">objective truths\u003c/span>\u003cspan class=\"y-eq\">facts = objective truths\u003c/span>\u003cdiv class=\"w\">사실을 객관적인 진실이라는 뜻으로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the scientist\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a researcher\u003c/span>\u003cspan class=\"y-eq\">scientist = researcher\u003c/span>\u003cdiv class=\"w\">과학자를 연구자라는 일반적인 말로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">What words are to a poet, facts are to a scientist.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 과학자에게 사실이 중요한 만큼 시인에게는 단어가 중요하다는 뜻이에요. 둘 다 각자의 작업을 이루는 기본 재료라는 것이죠. 짧지만 두 세계를 나란히 놓은 멋진 비유입니다.","hl":"mn"},{"n":72,"text":"표현을 바꿔 보면 Facts are to the scientist what words are to the poet는 Facts are like words to the poet in the case of the scientist로 풀어 말할 수 있습니다. what words are to the poet은 the way words matter to the poet으로도 바꿀 수 있어요.","hl":"rw"},{"n":73,"text":"어구를 정리해 보죠. A is to B what C is to D는 A is like C to D로 바꿔 말할 수 있습니다. facts는 objective truths로, the scientist는 a researcher로 바꿀 수 있어요.","hl":"ph"},{"n":74,"text":"같은 뜻의 문장을 들어 보세요. What words are to a poet, facts are to a scientist. 단어가 시인에게 그러하듯 사실은 과학자에게 그러하다는 뜻입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>that·what·how·whether·whatever가 이끄는 절은 be동사 뒤에서 \u003cb class=\"key\">주격보어\u003c/b>로 쓰여 주어의 내용을 풀어 설명합니다.\u003c/li>\u003cli>주격보어절 안에 관계대명사절이나 부사절이 들어가면 \u003cb class=\"key\">수식 관계\u003c/b>를 먼저 끊어 읽는 것이 핵심입니다.\u003c/li>\u003cli>「A is to B what C is to D」는 A와 B의 관계가 C와 D의 관계와 같다는 것을 나타내는 \u003cb class=\"key\">관계 비교 구문\u003c/b>입니다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 절이 주격보어 자리에 들어가는 구문을 집중적으로 봤어요. be동사 뒤에 that, what, how, whether, whatever가 보이면 그 절 전체가 주어를 설명하는 보어라는 점을 꼭 기억하세요. 그리고 보어절 안에 who나 even while 같은 수식 덩어리가 또 들어갈 수 있다는 것도 중요합니다. 마지막으로 A is to B what C is to D 구문은 두 관계를 나란히 놓는 비유 표현이라는 것도 잊지 마세요. 오늘 배운 블록으로 긴 문장도 자신 있게 끊어 읽을 수 있을 거예요. 수고 많았습니다.","hl":"sum"}]}]});</script></body></html>
