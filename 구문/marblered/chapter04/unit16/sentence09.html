6Vmendemlr2+Wnrcf8AQfTt/n8vpTG4wfQ+vX6f1Hf8BShlYcEfp2/pj9PSguoAORg8Chbrr+t+n9bD8v6/r+uqFHb6f59vp60vQf5/+uf50wOmMlhj13D1xznHQ8fqTSllHUjn3Hoffv8A54pa/f8AixJbrfX+k++nfdbikcg8ce3PQ9/6Uc5HTHf1/wDr/jSkqBksPfkcZ5H5+386bvXJGR0OeR7Ufp/n/mwv9/br/X4Cg5/P8/cf59qMjBx1Hb8zz0P445/KkyM9VIOMcg89fy/E84pSMbiM5I/p9ev4cduerVk9Xbbv3W/9brS4pK6el9H0v8no9H6M/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Defining Meaning: The Author&#39;s Intention in Poetry<small>의미 정의하기: 시에 담긴 저자의 의도</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">시를 읽을 때 가장 먼저 떠올려야 할 개념은 바로 저자의 의도(Authorial Intent)예요. 이는 작가가 작품을 통해 독자에게 무엇을 전달하려고 했는지를 의미하는데, 때로는 작가가 명확한 메시지를 숨겨두기도 하지만 독자가 이를 해석하는 과정에서 또 다른 의미가 생겨나기도 한답니다. 우리가 문학 작품을 감상할 때 흔히 문학적 해석(Literary Interpretation)이라는 말을 쓰는데, 이는 텍스트 뒤에 숨겨진 작가의 주관적 관점(Subjective Perspective)을 찾아내려는 노력을 뜻해요. 마치 작가가 암호문을 남겨두고 독자가 그 의미를 해독하는 탐정이 되는 과정과 비슷하죠. 따라서 이번 지문을 읽을 때는 작가가 단순히 단어를 배열한 것이 아니라 의도적인 소통(Intentional Communication)을 시도하고 있다는 점을 항상 염두에 두면 좋겠어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01시의 의미 정의</div><ul><li>시의 의미는 작가가 독자에게 전달하고자 하는 바와 일치합니다.</li><li>시의 핵심은 작가의 전달 의도(author&#39;s intention)에 있음</li><li>독자가 읽는 과정에서 드러나는 목적성</li><li>핵심 키워드: 의도(intention)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02의사소통의 수단</div><ul><li>시라는 형식은 작가가 자신의 생각을 표현하기 위한 매개체입니다.</li><li>시(poem)는 작가와 독자를 연결하는 도구</li><li>작품을 통해 이루어지는 상호작용</li><li>핵심 키워드: 전달(communicate)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">meaning</td><td class=\"m\">의미</td></tr><tr><td class=\"w\">poem</td><td class=\"m\">시</td></tr><tr><td class=\"w\">whatever</td><td class=\"m\">무엇이든 (그것이) ~하는 것은</td></tr><tr><td class=\"w\">author</td><td class=\"m\">작가</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intend</td><td class=\"m\">의도하다</td></tr><tr><td class=\"w\">communicate</td><td class=\"m\">전달하다</td></tr><tr><td class=\"w\">reader</td><td class=\"m\">독자</td></tr><tr><td class=\"w\">by means of</td><td class=\"m\">~에 의하여, ~을 사용하여</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시의 의미는</span><span class=\"en\"><b>The meaning of a poem</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇이든지이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is whatever</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작가가 의도하는</span><span class=\"en\"><b><span class=\"grammar-hl\">the author intends</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전달하기를</span><span class=\"en\"><b><span class=\"grammar-hl\">to communicate</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독자에게</span><span class=\"en\"><b>to the reader</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 시를 수단으로 하여</span><span class=\"en\"><b><span class=\"grammar-hl\">by means of</span> the poem.</b></span></div></div><div class=\"lec-sent-ko\">시의 의미는 작가가 시에 의하여 독자에게 전달하려고 의도하는 무엇이든지이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 시의 의미가 무엇인지에 대해 정의를 내리며 글을 시작하고 있습니다. 여기서 whatever는 사전적으로는 &#39;무엇이든지&#39;라는 뜻이지만, 여기서는 &#39;작가가 전달하려는 것이라면 그 어떤 내용이든 곧 시의 의미가 된다&#39;는 의미로 쓰였습니다. 필자는 시의 의미가 고정된 객관적 사실이 아니라, 작가의 &#39;의도&#39;에 달려 있다는 점을 강조하기 위해 이 단어를 선택했습니다. 또한 by means of는 &#39;수단으로&#39;라는 뜻의 관용구인데, 여기서 시는 작가의 생각을 전달하는 하나의 도구(매개체)임을 나타내어, 시가 단순한 글귀가 아닌 의사소통의 창구임을 드러내고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is whatever the author intends to communicate (간접의문문/명사절): whatever(무엇이든 ~하는 것)가 이끄는 명사절이 보어(C) 역할을 하는 구조입니다.</div><div class=\"lec-gr-item\">intends to communicate (to부정사): 동사 intend의 목적어 역할을 하며, 목적어 자리에서 미래지향적 동작을 나타내는 명사적 용법입니다.</div><div class=\"lec-gr-item\">by means of (관용표현): &#39;~을 수단으로 하여&#39; 또는 &#39;~을 사용하여&#39;라는 의미로 쓰이는 전치사구 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">meaning</td><td class=\"m\">의미</td></tr><tr><td class=\"w\">poem</td><td class=\"m\">시</td></tr><tr><td class=\"w\">whatever</td><td class=\"m\">무엇이든 (그것이) ~하는 것은</td></tr><tr><td class=\"w\">author</td><td class=\"m\">작가</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intend</td><td class=\"m\">의도하다</td></tr><tr><td class=\"w\">communicate</td><td class=\"m\">전달하다</td></tr><tr><td class=\"w\">reader</td><td class=\"m\">독자</td></tr><tr><td class=\"w\">by means of</td><td class=\"m\">~에 의하여, ~을 사용하여</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>시의 의미는 작가가 독자에게 무엇을 전달하려고 하는지에 달려 있다.</li><li>시는 작가의 의도를 독자에게 전하는 의사소통의 수단이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">A poem represents the author&#39;s message, as its meaning is determined by what the writer intends to communicate.</div>\n              <div class=\"lec-final-sum-ko\">시는 저자의 메시지를 나타내며, 그 의미는 작가가 전달하고자 하는 의도에 의해 결정된다.</div></div></div>"],"segs":[[{"audio":"./sentence09_audio/1.mp3","hl":null}],[{"audio":"./sentence09_audio/2.mp3","hl":null}],[{"audio":"./sentence09_audio/3.mp3","hl":null},{"audio":"./sentence09_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence09_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence09_audio/6.mp3","hl":null}],[{"audio":"./sentence09_audio/7.mp3","hl":"main"},{"audio":"./sentence09_audio/8.mp3","hl":"meaning"},{"audio":"./sentence09_audio/9.mp3","
