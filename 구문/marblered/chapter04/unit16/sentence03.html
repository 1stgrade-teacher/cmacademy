 의미해요. 마치 내비게이션 없이 남들이 가는 길을 따라가다 보면 목적지를 잃어버리는 것처럼, 우리도 스스로 목표를 설정하지 않으면 타인이 짜놓은 인생의 각본(Life script)대로 살게 될 가능성이 높답니다. 스스로 삶의 핸들을 잡지 않으면 결국 다른 사람의 필요를 채우기 위한 부품(Tool)이 될 수 있다는 점을 기억하면서, 여러분만의 계획을 세우는 것이 왜 중요한지 생각해보면 좋겠어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01삶의 설계</div><ul><li>스스로 삶의 방향을 직접 계획하고 결정하는 것이 필수적이다.</li><li>자신만의 삶의 계획 (life plan) 수립의 필요성</li><li>주도적인 태도로 인생을 설계해야 함</li><li>핵심 키워드: 삶의 계획(life plan)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02외부의 영향</div><ul><li>자신만의 계획이 없다면 의도치 않게 타인의 계획에 따라 살게 된다.</li><li>계획 부재 시 타인의 계획(someone else’s plan)에 휘말림</li><li>수동적인 삶의 태도가 초래하는 결과</li><li>핵심 키워드: 타인의 계획(someone else’s plan)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03선택의 결과</div><ul><li>삶의 주도권을 갖지 못하면 자신의 의지와 상관없이 타인의 방식대로 살게 될 확률이 높다.</li><li>주도권을 놓칠 가능성 (chances are)</li><li>스스로 선택하지 않은 삶을 살게 되는 위험성</li><li>핵심 키워드: 가능성(chances are)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">design</td><td class=\"m\">설계하다, 계획하다</td></tr><tr><td class=\"w\">life plan</td><td class=\"m\">인생 계획</td></tr><tr><td class=\"w\">chance</td><td class=\"m\">가능성 (chances are: ~할 가능성이 높다)</td></tr><tr><td class=\"w\">fall into</td><td class=\"m\">~에 빠지다, ~에 휘말리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 설계하지 않는다면</span><span class=\"en\"><b><span class=\"grammar-hl\">If you don’t design</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신 자신의 인생 계획을,</span><span class=\"en\"><b><span class=\"grammar-hl\">your own life plan</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능성이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">chances are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 빠지게 될</span><span class=\"en\"><b><span class=\"grammar-hl\">you’ll fall into</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람의 계획에.</span><span class=\"en\"><b>someone else’s plan.</b></span></div></div><div class=\"lec-sent-ko\">만약 당신이 자신의 인생 계획을 설계하지 않는다면 당신이 다른 사람의 계획에 빠지게 될 가능성이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 주도적인 삶을 살지 않으면 타인의 의도대로 살게 될 것이라는 경고를 담고 있습니다. 여기서 chances are는 사전적으로는 &#39;가능성이 있다&#39;는 뜻이지만, 여기서는 &#39;거의 ~할 것이다&#39;라는 강한 예측을 나타냅니다. 필자는 단순히 그럴 수도 있다는 가능성을 말하는 것을 넘어, 계획이 없으면 남의 계획에 휩쓸리는 것이 당연한 결과라는 점을 강조하기 위해 이 표현을 선택했습니다. 앞 문장은 &#39;스스로 계획을 세우는 것(능동)&#39;을 조건으로 제시하고, 뒤 문장은 &#39;남의 계획에 빠지는 것(수동)&#39;이라는 부정적 결과를 대조하여 독자에게 경각심을 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If you don’t design your own life plan (분사구문(가정)): &#39;If + 주어(you) + 동사(don&#39;t design)&#39; 구조를 가진 조건절로, 화자의 주장을 뒷받침하기 위해 상황을 가정하고 있다.</div><div class=\"lec-gr-item\">chances are (관용표현): &#39;~할 가능성이 있다&#39;라는 뜻으로, &#39;The chances are that S + V&#39;에서 &#39;The&#39;가 생략된 구문이다.</div><div class=\"lec-gr-item\">you’ll fall into 5형식(SVOC) 구조: 문맥적으로 &#39;fall into&#39;는 목적어 없이 전치사구와 결합하는 자동사구이지만, 주어(you)가 자신의 계획(your own life plan)을 세우지 않으면 남의 계획 속으로 빠지게 된다는 인과관계를 형성하는 핵심 서술부이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">design</td><td class=\"m\">설계하다, 계획하다</td></tr><tr><td class=\"w\">life plan</td><td class=\"m\">인생 계획</td></tr><tr><td class=\"w\">chance</td><td class=\"m\">가능성 (chances are: ~할 가능성이 높다)</td></tr><tr><td class=\"w\">fall into</td><td class=\"m\">~에 빠지다, ~에 휘말리다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>자신의 삶을 스스로 계획하지 않으면, 타인이 세운 계획에 따라 살게 될 가능성이 높다.</li><li>삶의 주도권을 잃지 않기 위해서는 명확한 자기 설계를 하는 것이 필수적이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">You should create your own life plan, or you will likely end up living according to someone else&#39;s intentions.</div>\n              <div class=\"lec-final-sum-ko\">당신만의 인생 계획을 세워야 하며, 그렇지 않으면 타인의 의도대로 살게 될 가능성이 높다.</div></div></div>"],"segs":[[{"audio":"./sentence03_audio/1.mp3","hl":null}],[{"audio":"./sentence03_audio/2.mp3","hl":null}],[{"audio":"./sentence03_audio/3.mp3","hl":null},{"audio":"./sentence03_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence03_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence03_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence03_audio/7.mp3","hl":null}],[{"audio":"./sentence03_audio/8.mp3","hl":"main"},{"audio":"./sentence03_audio/9.mp3","hl":"meaning"},{"audio":"./sentence03_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence03_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||
