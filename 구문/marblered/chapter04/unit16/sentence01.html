역설</div><ul><li>인간은 삶을 살아가는 속도와 지혜를 얻는 속도의 차이 때문에 비극을 겪는다.</li><li>너무 빨리 늙어버리는 유한한 삶 (get old)</li><li>충분한 지혜를 갖추기에는 너무 늦은 시점 (wise too late)</li><li>핵심 키워드: 비극(tragedy), 지혜(wisdom)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02지혜의 뒤늦은 깨달음</div><ul><li>삶의 중요한 가치를 깨닫는 시점과 그것을 실천할 수 있는 시점 사이의 간극이 존재한다.</li><li>인생의 교훈은 경험 후에야 찾아옴</li><li>성숙해졌을 때는 이미 많은 기회가 지나간 뒤임</li><li>핵심 키워드: 깨달음(realization), 시기(timing)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03인간 삶의 본질적 한계</div><ul><li>인간은 시간의 흐름을 통제할 수 없기에 이러한 지혜의 부조리를 안고 살아간다.</li><li>시간의 흐름을 되돌릴 수 없는 한계</li><li>지혜와 시간 사이의 불균형이 주는 상실감</li><li>핵심 키워드: 한계(limitation), 불균형(imbalance)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">life</td><td class=\"m\">삶, 인생</td></tr><tr><td class=\"w\">tragedy</td><td class=\"m\">비극</td></tr><tr><td class=\"w\">old</td><td class=\"m\">나이가 든, 늙은</td></tr><tr><td class=\"w\">soon</td><td class=\"m\">곧, 일찍</td></tr><tr><td class=\"w\">wise</td><td class=\"m\">지혜로운, 현명한</td></tr><tr><td class=\"w\">late</td><td class=\"m\">늦게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인생의 비극은</span><span class=\"en\"><b><span class=\"grammar-hl\">Life’s tragedy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~라는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 너무 빨리 늙고</span><span class=\"en\"><b><span class=\"grammar-hl\">we get old</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 빨리</span><span class=\"en\"><b><span class=\"grammar-hl\">too soon</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 현명해진다는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">and wise</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 늦게</span><span class=\"en\"><b><span class=\"grammar-hl\">too late.</span></b></span></div></div><div class=\"lec-sent-ko\">인생의 비극은 우리가 너무 빨리 늙고 너무 늦게 현명해진다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 인간이 가진 근본적인 한계를 지적하며 글의 핵심 주제를 제시합니다. 여기서 tragedy는 사전적으로 &#39;비극&#39;이나 &#39;참사&#39;를 의미하는데, 여기서는 죽음을 향해가는 인간의 생물학적 시간과 지혜를 얻는 정신적 시간 사이의 &#39;어긋남&#39;을 안타까워하는 의미로 쓰였습니다. 필자는 인생의 본질적인 안타까움을 강조하기 위해 이 낱말을 선택했습니다. 또한, wise는 단순히 &#39;현명한&#39;이라는 형용사지만, 여기서는 뒤에 오는 too late와 결합하여 &#39;삶의 이치를 깨닫는 시점&#39;을 나타냅니다. 필자는 젊음과 지혜가 동시에 존재할 수 없는 안타까운 상황을 대조적인 구조로 표현하여 독자의 공감을 끌어내고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Life’s tragedy is that we get old too soon and wise too late. (보어절(명사절)): &#39;be동사(is) + that절&#39; 구조로, that절이 주어(Life&#39;s tragedy)의 내용을 보충 설명하는 명사 보어 역할을 합니다. 여기서 that은 관계대명사가 아니라 내용을 이끄는 접속사입니다.</div><div class=\"lec-gr-item\">too soon and wise too late (관용표현(병렬구조)): &#39;get(되다) + 형용사&#39; 형태가 &#39;get old&#39;와 &#39;get wise&#39;로 병렬 연결된 구조입니다. 상태의 변화를 나타내는 2형식 동사 get이 사용되었습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">life</td><td class=\"m\">삶, 인생</td></tr><tr><td class=\"w\">tragedy</td><td class=\"m\">비극</td></tr><tr><td class=\"w\">old</td><td class=\"m\">나이가 든, 늙은</td></tr><tr><td class=\"w\">soon</td><td class=\"m\">곧, 일찍</td></tr><tr><td class=\"w\">wise</td><td class=\"m\">지혜로운, 현명한</td></tr><tr><td class=\"w\">late</td><td class=\"m\">늦게</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간은 생물학적으로 늙어가는 속도와 삶의 지혜를 얻는 속도가 서로 맞지 않는다.</li><li>젊은 시절에는 지혜가 부족하고, 지혜가 생길 때쯤에는 이미 노쇠해진다는 점이 인생의 비극이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People grow old rapidly, but they gain wisdom only after it is too late to fully utilize it in their lives.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 빠르게 늙어가지만, 삶에서 그 지혜를 충분히 활용하기에는 너무 늦은 시점이 되어서야 비로소 지혜를 얻게 된다.</div></div></div>"],"segs":[[{"audio":"./sentence01_audio/1.mp3","hl":null}],[{"audio":"./sentence01_audio/2.mp3","hl":null}],[{"audio":"./sentence01_audio/3.mp3","hl":null},{"audio":"./sentence01_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence01_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence01_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence01_audio/7.mp3","hl":null}],[{"audio":"./sentence01_audio/8.mp3","hl":"main"},{"audio":"./sentence01_audio/9.mp3","hl":"meaning"},{"audio":"./sentence01_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence01_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-
