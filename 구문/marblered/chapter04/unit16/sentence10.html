Cognitive Restructuring)라는 개념을 활용해요. 이는 우리가 겪는 사건 자체가 아니라, 그 사건을 해석하는 나의 생각(Perspective)을 긍정적으로 바꾸는 연습을 의미합니다. 마치 흐린 날씨를 보며 &#39;비가 와서 우울해&#39;라고 생각하는 대신, &#39;식물들이 물을 마셔서 건강해지겠네&#39;라고 관점을 살짝 비트는 것과 같죠. 이처럼 어려운 상황 속에서도 긍정적인 면을 찾아내려는 노력은 우리 뇌가 스트레스에 더 잘 대처하도록 돕는 회복탄력성(Resilience)을 길러줍니다. 즉, 이 글은 우리 삶의 태도를 긍정적인 방향으로 훈련하여 더 단단한 마음을 가질 수 있는 방법을 제시하고 있는 셈이에요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 인식</div><ul><li>우리는 인생을 살아가면서 예기치 못한 어려운 상황에 처할 수 있다.</li><li>인생의 굴곡: 문제 상황에 갇힘 (stuck in the middle of trouble)</li><li>어려운 시기(trouble)를 겪는 것은 피할 수 없는 현실임</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02핵심 교훈</div><ul><li>힘든 시기일지라도 그 안에서 긍정적인 부분을 발견하려는 노력이 중요하다.</li><li>관점의 변화: 긍정적인 면 보기 (see the positives)</li><li>삶의 태도(lesson): 어려움 속에서도 희망적인 부분을 찾으려는 의지</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실천의 가치</div><ul><li>어려움을 대하는 태도를 바꾸는 것이 문제 해결의 중요한 밑거름이 된다.</li><li>중요성(important): 태도가 상황을 대하는 방식에 영향을 줌</li><li>핵심 키워드: 긍정적인 면(positives), 어려움(trouble)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr><tr><td class=\"w\">lesson</td><td class=\"m\">교훈</td></tr><tr><td class=\"w\">remember</td><td class=\"m\">기억하다</td></tr><tr><td class=\"w\">positive</td><td class=\"m\">긍정적인 면</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stick</td><td class=\"m\">갇히다, 빠져나오지 못하다</td></tr><tr><td class=\"w\">middle</td><td class=\"m\">한가운데</td></tr><tr><td class=\"w\">trouble</td><td class=\"m\">문제, 어려움</td></tr><tr><td class=\"w\">in the middle of</td><td class=\"m\">~의 한창 중에, ~의 한가운데에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">중요한 교훈은</span><span class=\"en\"><b>An important lesson</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기억해야 할</span><span class=\"en\"><b><span class=\"grammar-hl\">to remember</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~라는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 노력해야 한다는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">we should try</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보려고</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">긍정적인 것들을</span><span class=\"en\"><b><span class=\"grammar-hl\">the positives</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인생에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in life</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 ~하는 동안에도</span><span class=\"en\"><b><span class=\"grammar-hl\">even while</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 꼼짝 못 하는</span><span class=\"en\"><b><span class=\"grammar-hl\">we are stuck</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">곤경의 한가운데에</span><span class=\"en\"><b><span class=\"grammar-hl\">in the middle of trouble</span>.</b></span></div></div><div class=\"lec-sent-ko\">기억해야 할 중요한 교훈은 우리가 곤경의 한 가운데에 빠져 꼼짝 못 할 동안에도 우리가 인생에서 긍정적인 것들을 보려고 노력해야 한다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 주제를 제시합니다. 여기서 stuck은 사전적으로 &#39;갇힌, 꼼짝 못 하는&#39;이라는 뜻인데, 여기서는 문제 상황이 스스로의 힘으로 당장 해결되지 않아 어쩔 수 없이 그 안에 머물러 있는 답답한 상태를 강조합니다. 필자는 단순히 &#39;힘든 상황&#39;이라고 하기보다 &#39;갇혀 있다&#39;라는 표현을 통해 우리가 느끼는 무력감을 더 생생하게 전달하고, 그럼에도 불구하고 &#39;긍정&#39;을 찾아야 한다는 대조적인 태도를 강조하려 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to remember (to부정사): 명사 lesson을 뒤에서 수식하는 형용사적 용법으로, 기억해야 할 교훈이라는 의미를 담고 있음.</div><div class=\"lec-gr-item\">is that we should try to see the positives in life even while we are stuck in the middle of trouble (가주어): 진주어: 문장 전체의 구조상 주어부(An important lesson to remember)가 길어지면서 주어를 수식하는 구조를 포함하고 있으며, be동사 뒤의 that절이 주격 보어 역할을 수행함.</div><div class=\"lec-gr-item\">to see (to부정사): 동사 try의 목적어 역할을 하는 명사적 용법임.</div><div class=\"lec-gr-item\">are stuck (수동태): be동사(are)+p.p.(stuck) 구조. stick(끼우다/꼼짝 못 하게 하다)은 타동사인데 목적어가 없어서 수동구조 are stuck 형태로 쓴다. 기본구조: stick + O (O를 꼼짝 못 하게 하다).</div><div class=\"lec-gr-item\">while we are stuck (현재분사): while은 접속사로 쓰였으나, 뒤의 절(we are stuck)은 상황을 나타내는 부사절임. 분사구문으로 전환하면 &#39;being stuck&#39; 형태가 가능하며, 원래 절로 바꾸면 &#39;while we are stuck&#39;과 같음.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr><tr><td class=\"w\">lesson</td><td class=\"m\">교훈</td></tr><tr><td class=\"w\">remember</td><td class=\"m\">기억하다</td></tr><tr><td class=\"w\">positive</td><td class=\"m\">긍정적인 면</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">middle</td><td class=\"m\">한가운데</td></tr><tr><td class=\"w\">trouble</td><td class=\"m\">문제, 어려움</td></tr><tr><td class=\"w\">in the middle of</td><td class=\"m\">~의 한창 중에, ~의 한가운데에</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우리는 힘든 상황 속에 처해 있을 때조차도 삶의 긍정적인 측면을 찾으려 노력해야 한다.</li><li>어려움은 피할 수 없는 경우가 많지만, 그 안에서 어떤 태도를 취하느냐가 중요하다는 교훈을 담고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">We should remain optimistic despite facing hardships, as finding the silver lining is a crucial lesson for life.</div>\n              <div class=\"lec-final-sum-ko\">우리는 고난에 직면하더라도 낙관적인 태도를 유지해야 하며, 긍정적인 면을 찾는 것은 삶을 위한 중요한 교훈이다.</div></div></div>"],"segs":[[{"audio":"./sentence10_audio/1.mp3","hl":null}],[{"audio":"./sentence10_audio/2.mp3","hl":null}],[{"audio":"./sentence10_audio/3.mp3","hl":null},{"audio":"./sentence10_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence10_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence10_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence10_audio/7.mp3","hl":null}],[{"audio":"./sentence10_audio/8.mp3","hl":"main"},{"audio":"./sentence10_audio/9.mp3","hl":"meaning"},{"audio":"./sentence10_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence10_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.clas
