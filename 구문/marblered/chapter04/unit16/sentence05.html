f8ABMfXn/PGMU7gnAIOBz8y5Iz168dcd+ozzigKSSMds9R7/XPb86RN5/1by18t127+YzGRg9+v/wBbP6elOO3A9R+XPTvx+XNGCPT8x6/Uf4/jRj6ZH+0Ov5+h/Xr2o1en9a2X+Qve7u3r3S7+q9PvEo/z/n/PpSn04/MYyeBzn34BJx16E0EEZ6Y4/iUd8c8+/wCvGaAtLb8H30S+eqQc4A7dh2/z/wDXpCCcHtk5688f/q6/h0pdpwCMEdjuXnHXnPXPHXnv1oAJz0wMZ+Ze/pz/AE/kaP8Ag/ha/wCaCzXldPy0dr7+qT7d+xj/AOt9MHnHOPXrx29mkA9fr3qTHXkcDPUDrwe/GOncevUCmE8HJGM4+8uR7Zz75PTHoDmj0C0u7W2l+9tOu11/mITj3J6D1/w4p3JzgAEA9TjkA8fj6dfp0oA9x19Qe5569umP65oI4ORnhuMjsAffPB6Y5B4z2zk9YtJuSemjvq4vbra2u2jXYuKez210+759X9+up//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Ultimate Test of Driving Proficiency: Staying Calm<small>운전 능력을 판가름하는 궁극의 시험: 침착함 유지하기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글에서 언급된 &#39;산성 시험(acid test)&#39;이라는 표현은 원래 금의 순도를 감별하기 위해 질산을 사용하는 화학 실험에서 유래된 말로, 오늘날에는 어떤 사람이나 사물의 진정한 가치나 능력을 판가름하는 결정적인 시험대를 의미합니다. 운전 상황에 비유하자면, 평소 도로 규정을 잘 지키며 차분하게 운전하는 것보다, 갑자기 튀어나온 장애물이나 예기치 못한 사고 상황에서 그 사람이 얼마나 침착함(calmness)을 유지하느냐가 그 운전자의 실력을 증명하는 진짜 척도가 된다는 것이죠. 우리도 일상에서 시험 기간의 스트레스 상황이나 팀 프로젝트 도중 발생하는 돌발 상황처럼, 위기 관리 능력(crisis management)이 드러나는 순간들이 있는데, 이러한 상황이야말로 바로 누군가의 본모습을 확인하게 되는 &#39;산성 시험&#39;과 같은 순간이라고 할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01운전자의 평가 기준</div><ul><li>운전자의 실력을 판가름하는 가장 결정적인 순간에 대해 언급합니다.</li><li>운전자를 평가하는 가장 확실한 시험대</li><li>핵심 키워드: 결정적 시험(acid test)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02위기 상황 속의 침착함</div><ul><li>진정한 실력은 평상시가 아닌 위기 상황에서 드러납니다.</li><li>예기치 못한 비상사태(emergency) 발생</li><li>당황하지 않고 평정심을 유지하는 능력(remains calm)</li><li>핵심 키워드: 침착함(calm)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">acid test</td><td class=\"m\">진가를 시험하는 척도, 엄밀한 시험</td></tr><tr><td class=\"w\">driver</td><td class=\"m\">운전자</td></tr><tr><td class=\"w\">remain</td><td class=\"m\">~한 상태를 유지하다</td></tr><tr><td class=\"w\">calm</td><td class=\"m\">침착한, 차분한</td></tr><tr><td class=\"w\">emergency</td><td class=\"m\">비상사태, 위급 상황</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">진정한 척도는</span><span class=\"en\"><b>The acid test</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 운전자의</span><span class=\"en\"><b>of a good driver</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~이다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사람이</span><span class=\"en\"><b><span class=\"grammar-hl\">whether he or she</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">침착함을 유지하는지</span><span class=\"en\"><b><span class=\"grammar-hl\">remains calm</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비상시에</span><span class=\"en\"><b><span class=\"grammar-hl\">in an emergency</span>.</b></span></div></div><div class=\"lec-sent-ko\">좋은 운전자를 보여주는 진정한 척도는 비상시에 그 사람이 침착함을 유지하는지 못하는 지다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비상 상황이라는 돌발 변수가 발생했을 때 운전자의 대처 능력을 평가한다는 내용입니다. 여기서 acid test는 사전적으로는 &#39;산성 시험(금의 순도를 측정하는 화학적 검사)&#39;을 뜻하지만, 여기서는 &#39;결정적인 평가 기준&#39;이나 &#39;진가를 확인하는 시험대&#39;라는 의미로 쓰였습니다. 필자는 운전 실력의 본질이 평소 운전 기술이 아니라 위기 상황에서의 통제력에 있음을 강조하기 위해 이 비유적인 표현을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">whether he or she remains calm in an emergency (간접의문문(명사절)): &#39;whether + S + V&#39; 구조로, 문장에서 보어(주격 보어) 역할을 하여 주어(The acid test)의 내용을 보충 설명하고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">acid test</td><td class=\"m\">진가를 시험하는 척도, 엄밀한 시험</td></tr><tr><td class=\"w\">driver</td><td class=\"m\">운전자</td></tr><tr><td class=\"w\">remain</td><td class=\"m\">~한 상태를 유지하다</td></tr><tr><td class=\"w\">calm</td><td class=\"m\">침착한, 차분한</td></tr><tr><td class=\"w\">emergency</td><td class=\"m\">비상사태, 위급 상황</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>운전자의 진짜 실력은 평소 운전이 아닌 비상 상황에서의 대처 능력으로 판가름 난다.</li><li>위기 상황에서 침착함을 유지하는 것이 좋은 운전자의 필수적인 조건이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">True driving skill is measured by the ability to maintain composure, and it is tested when an emergency occurs.</div>\n              <div class=\"lec-final-sum-ko\">진정한 운전 실력은 침착함을 유지하는 능력으로 측정되며, 이는 비상 상황이 발생했을 때 판가름난다.</div></div></div>"],"segs":[[{"audio":"./sentence05_audio/1.mp3","hl":null}],[{"audio":"./sentence05_audio/2.mp3","hl":null}],[{"audio":"./sentence05_audio/3.mp3","hl":null},{"audio":"./sentence05_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence05_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence05_audio/6.mp3","hl":null}],[{"audio":"./sentence05_audio/7.mp3","hl":"main"},{"audio":"./sentence05_audio/8.mp3","hl":"meaning"},{"audio":"./sentence05_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence05_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scro
