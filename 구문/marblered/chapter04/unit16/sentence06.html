이&#39;가 사실은 아이들의 정서적 성장에 필수적인 사회성 훈련 과정이라는 점을 강조하고 있어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01현상의 관찰</div><ul><li>사회적 놀이 기회가 부족한 아이들에게서 나타나는 두 가지 심리적 변화를 제시합니다.</li><li>공감 능력(empathy)의 감소 현상</li><li>자기애(narcissism)의 증가 현상</li><li>핵심 키워드: 공감(empathy), 자기애(narcissism)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02원인 분석</div><ul><li>아이들의 심리적 변화는 사회적 놀이를 충분히 경험하지 못한 환경에서 비롯됩니다.</li><li>또래와 어울리는 사회적 놀이(social play)의 결여</li><li>타인과 상호작용할 기회의 부족</li><li>핵심 키워드: 사회적 놀이(social play)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결론 및 시사점</div><ul><li>놀이의 부재가 결과적으로 아이들의 정서적 발달에 부정적인 영향을 미친다는 점을 시사합니다.</li><li>놀이 부족이 공감 능력과 자기애에 미치는 영향</li><li>사회적 환경이 아동의 성격 형성에 미치는 중요성</li><li>핵심 키워드: 발달(development)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">decline</td><td class=\"m\">감소, 하락</td></tr><tr><td class=\"w\">empathy</td><td class=\"m\">공감, 감정이입</td></tr><tr><td class=\"w\">rise</td><td class=\"m\">증가, 상승</td></tr><tr><td class=\"w\">narcissism</td><td class=\"m\">자기애(자기중심성)</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exactly</td><td class=\"m\">정확히</td></tr><tr><td class=\"w\">expect</td><td class=\"m\">예상하다, 기대하다</td></tr><tr><td class=\"w\">opportunity</td><td class=\"m\">기회</td></tr><tr><td class=\"w\">socially</td><td class=\"m\">사회적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">감정이입의 감소는</span><span class=\"en\"><b>A decline of empathy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 자아도취의 증가는</span><span class=\"en\"><b>and a rise in narcissism</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정확히 우리가 예상하는 것이다</span><span class=\"en\"><b>are exactly <span class=\"grammar-hl\">what</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">볼 것으로</span><span class=\"en\"><b><span class=\"grammar-hl\">we would expect to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이들에게서</span><span class=\"en\"><b>in children</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 기회가 없는</span><span class=\"en\"><b><span class=\"grammar-hl\">who have little opportunity</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사회적으로 놀</span><span class=\"en\"><b><span class=\"grammar-hl\">to play socially</span>.</b></span></div></div><div class=\"lec-sent-ko\">감정이입의 감소와 자아도취의 증가는 정확하게 우리가 사회적으로 놀 기회가 거의 없는 아이들에게서 볼 것으로 예상하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 서두로서, 아이들이 친구들과 어울려 노는 경험이 부족할 때 나타나는 부정적인 결과(공감 능력 부족, 자기중심적 사고)를 제시하고 있습니다. 여기서 decline은 사전적으로 &#39;감소, 하락&#39;인데, 여기서는 아이가 자라면서 당연히 배워야 할 타인에 대한 배려가 제대로 발달하지 못하고 후퇴하는 상황을 나타냅니다. 또한 narcissism은 &#39;자기애&#39;라는 심리학 용어지만, 문맥상으로는 타인을 고려하지 않고 자기 자신에게만 몰두하는 이기적인 태도를 강조하기 위해 필자가 선택한 단어입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what we would expect to see (간접의문문): &#39;의문사(what) + S(we) + V(would expect)&#39; 구조로 문장에서 보어 역할을 합니다. to부정사: &#39;to see&#39;는 expect의 목적보어로서 목적어(what)가 무엇을 하는지 설명하는 5형식 구조(expect + O + toV)의 일부입니다.</div><div class=\"lec-gr-item\">who have little opportunity to play socially (관계대명사): &#39;who&#39;가 선행사(children)를 수식하는 주격 관계대명사절입니다. 뒤에 동사(have)가 바로 이어지므로 who는 절 안에서 주어 역할을 합니다. to부정사: &#39;to play&#39;는 앞의 명사(opportunity)를 꾸며주는 형용사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">decline</td><td class=\"m\">감소, 하락</td></tr><tr><td class=\"w\">empathy</td><td class=\"m\">공감, 감정이입</td></tr><tr><td class=\"w\">rise</td><td class=\"m\">증가, 상승</td></tr><tr><td class=\"w\">narcissism</td><td class=\"m\">자기애(자기중심성)</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exactly</td><td class=\"m\">정확히</td></tr><tr><td class=\"w\">expect</td><td class=\"m\">예상하다, 기대하다</td></tr><tr><td class=\"w\">opportunity</td><td class=\"m\">기회</td></tr><tr><td class=\"w\">socially</td><td class=\"m\">사회적으로</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사회적으로 어울려 노는 기회가 부족한 아이들에게서 공감 능력은 줄고 자기애는 늘어난다.</li><li>이는 아이들이 놀이를 통해 타인과 소통하는 법을 배우지 못하기 때문에 발생하는 결과이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Children show less empathy and more narcissism when they have limited chances to engage in social play.</div>\n              <div class=\"lec-final-sum-ko\">아이들은 사회적 놀이에 참여할 기회가 제한될 때 공감 능력이 낮아지고 자기애가 강해진다.</div></div></div>"],"segs":[[{"audio":"./sentence06_audio/1.mp3","hl":null}],[{"audio":"./sentence06_audio/2.mp3","hl":null}],[{"audio":"./sentence06_audio/3.mp3","hl":null},{"audio":"./sentence06_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence06_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence06_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence06_audio/7.mp3","hl":null}],[{"audio":"./sentence06_audio/8.mp3","hl":"main"},{"audio":"./sentence06_audio/9.mp3","hl":"meaning"},{"audio":"./sentence06_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence06_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorA
