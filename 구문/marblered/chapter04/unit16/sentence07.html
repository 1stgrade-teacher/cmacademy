anship)&#39;과 &#39;회복 탄력성(Resilience)&#39;이라는 개념과 밀접하게 맞닿아 있습니다. 우리가 흔히 성공이나 승리만을 중요하게 생각하기 쉽지만, 사실 진정한 성장은 패배를 대하는 태도에서 시작되곤 하죠. 심리학에서는 이를 역경을 딛고 다시 일어서는 능력인 회복 탄력성이라고 부르는데, 이는 단순히 스포츠뿐만 아니라 우리 인생의 모든 순간에서 꼭 필요한 자질입니다. 마치 오뚝이가 넘어지더라도 다시 중심을 잡고 일어서는 것처럼, 실패를 나를 더 단단하게 만드는 성장의 발판으로 삼는 마음가짐이 왜 중요한지를 이 글은 강조하고 있답니다. 결국, 승패의 결과보다 그 과정에서 자신의 부족함을 인정하고 배우려는 자세야말로 우리가 진정한 승자로 거듭나는 핵심 열쇠가 되는 셈이죠.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01챔피언에 대한 통념</div><ul><li>사람들은 흔히 승리하는 방법으로 챔피언의 가치를 판단하려 한다.</li><li>승패 여부보다 승리 방식에 주목하는 경향</li><li>챔피언의 자질(measure)에 대한 일반적인 기준</li><li>핵심 키워드: 챔피언(champion), 승리(win)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02진정한 챔피언의 기준</div><ul><li>진정한 챔피언의 가치는 승리 그 자체가 아니라 패배를 마주하는 태도에서 드러난다.</li><li>승패를 떠나 패배를 다루는 방식이 중요함</li><li>역경에 대처하는 자세가 곧 인격의 척도</li><li>핵심 키워드: 패배(defeat), 다루다/대처하다(handle)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가치 판단의 핵심</div><ul><li>결국 성숙한 태도는 실패를 대하는 방식 속에서 완성된다.</li><li>결과보다 과정과 태도(attitude)의 가치 강조</li><li>패배의 경험을 성장의 밑거름으로 삼는 능력</li><li>핵심 키워드: 진정한(true), 척도(measure)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">measure</td><td class=\"m\">척도, 기준</td></tr><tr><td class=\"w\">champion</td><td class=\"m\">챔피언, 우승자</td></tr><tr><td class=\"w\">handle</td><td class=\"m\">다루다, 대처하다</td></tr><tr><td class=\"w\">defeat</td><td class=\"m\">패배</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">척도는</span><span class=\"en\"><b>The measure</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진정한 챔피언의</span><span class=\"en\"><b>of a true champion</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~이 아니다</span><span class=\"en\"><b>is not</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 어떻게 이기느냐는</span><span class=\"en\"><b><span class=\"grammar-hl\">how they win</span>.</b></span></div></div><div class=\"lec-sent-ko\">진정한 챔피언의 척도는 그들이 어떻게 이기느냐가 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 measure는 사전적으로 &#39;측정&#39;이나 &#39;척도&#39;를 의미하는데, 문맥상 &#39;누군가가 어떤 사람인지 평가하는 기준&#39;을 뜻합니다. 필자는 단순히 결과(승리)가 그 사람의 가치를 결정하지 않는다는 점을 강조하기 위해 이 단어를 사용하여, 인간의 성숙함이 승패라는 단편적인 기록으로 측정될 수 없음을 시사합니다. 이 문장은 뒤따라올 핵심 주장인 &#39;패배에 대한 태도&#39;를 대조하기 위해 먼저 승리에 대한 통념을 부정하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how they win (간접의문문): 의문사(how) + 주어(they) + 동사(win)의 어순으로 명사절 역할을 하며, is의 보어로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">measure</td><td class=\"m\">척도, 기준</td></tr><tr><td class=\"w\">champion</td><td class=\"m\">챔피언, 우승자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~이다</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 어떻게 다루느냐는</span><span class=\"en\"><b><span class=\"grammar-hl\">how they handle</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">패배를</span><span class=\"en\"><b><span class=\"grammar-hl\">defeat</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 그들이 어떻게 패배를 다루느냐이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 부정했던 &#39;승리 방식&#39;과 대비하여, &#39;패배를 대하는 방식&#39;이 진정한 실력을 판가름하는 기준임을 밝힙니다. handle은 &#39;다루다, 처리하다&#39;라는 뜻인데, 여기서는 닥쳐온 실패라는 감정적·상황적 어려움을 얼마나 의연하게 수용하고 다음을 기약하는지의 &#39;태도(attitude)&#39;를 강조합니다. 즉, 1번 문장의 결과론적 관점을 &#39;태도&#39;라는 과정 중심의 관점으로 전환하며 글의 결론을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s (가주어): 진주어: 문맥상 &#39;It&#39;은 앞 문장의 개념을 가리키는 지시대명사로 쓰였으나, 구조적으로는 뒤에 이어지는 how절(진주어 역할을 하는 명사절)을 이끄는 문장 구조의 시작입니다.</div><div class=\"lec-gr-item\">how they handle defeat (간접의문문): 의문사(how) + 주어(they) + 동사(handle) + 목적어(defeat)의 어순으로 명사절 역할을 하며, 주격 보어로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">handle</td><td class=\"m\">다루다, 대처하다</td></tr><tr><td class=\"w\">defeat</td><td class=\"m\">패배</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>진정한 승자를 가리는 기준은 승리하는 방식이 아니다.</li><li>진정한 챔피언은 패배를 마주하고 다루는 태도에서 결정된다.</li><li>결과보다 실패를 대하는 성숙한 태도가 진정한 실력자의 척도이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">True champions are defined not by their victories but by their attitude toward failure, which reveals their real character and maturity.</div>\n              <div class=\"lec-final-sum-ko\">진정한 챔피언은 승리가 아니라 실패를 대하는 태도로 정의되며, 이는 그들의 진짜 인격과 성숙함을 보여준다.</div></div></div>"],"segs":[[{"audio":"./sentence07_audio/1.mp3","hl":null}],[{"audio":"./sentence07_audio/2.mp3","hl":null}],[{"audio":"./sentence07_audio/3.mp3","hl":null},{"audio":"./sentence07_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence07_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence07_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence07_audio/7.mp3","hl":null}],[{"audio":"./sentence07_audio/8.mp3","hl":"main"},{"audio":"./sentence07_audio/9.mp3","hl":"meaning"},{"audio":"./sentence07_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence07_audio/11.mp3","hl":"main"},{"audio":"./sentence07_audio/12.mp3","hl":"meaning"},{"audio":"./sentence07_audio/13.mp3","hl":"grammar"}],[{"audio":"./sentence07_audio/14.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
