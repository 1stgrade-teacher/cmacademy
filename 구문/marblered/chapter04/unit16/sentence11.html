ss=\"lec-stage-head\">01사회적 능력의 정의</div><ul><li>사람들이 자신의 감정을 얼마나 잘 표현하는지는 중요한 사회적 역량 중 하나입니다.</li><li>사회적 능력의 핵심 요소: 감정 표현(expressing feelings)</li><li>타인과 상호작용할 때 감정을 전달하는 방식이 중요함</li><li>핵심 키워드: 사회적 능력(social competence)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02감정 표현의 질</div><ul><li>감정을 얼마나 적절하게 표현하느냐에 따라 사회적 능력의 수준이 달라집니다.</li><li>감정 표현의 숙련도(how well or poorly) 차이</li><li>자신의 감정을 명확히 표현하는 능력의 중요성</li><li>핵심 키워드: 감정 표현(express feelings)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결론적 의미</div><ul><li>감정 표현 방식은 대인관계의 질을 결정짓는 핵심적인 요소입니다.</li><li>감정 표현 능력과 사회적 적응력의 관련성</li><li>원만한 관계 형성을 위해 필요한 정서적 소통</li><li>핵심 키워드: 대인관계(interpersonal relationship)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">key</td><td class=\"m\">핵심적인, 중요한</td></tr><tr><td class=\"w\">social</td><td class=\"m\">사회의, 사회적인</td></tr><tr><td class=\"w\">competence</td><td class=\"m\">능력, 역량</td></tr><tr><td class=\"w\">express</td><td class=\"m\">표현하다, 나타내다</td></tr><tr><td class=\"w\">feeling</td><td class=\"m\">감정, 기분</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하나의 중요한 사회적 능력은</span><span class=\"en\"><b>One key social competence</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얼마나 잘 또는 형편없이</span><span class=\"en\"><b><span class=\"grammar-hl\">how well or poorly</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 표현하는지</span><span class=\"en\"><b><span class=\"grammar-hl\">people express</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 자신의 감정을</span><span class=\"en\"><b><span class=\"grammar-hl\">their own feelings</span>.</b></span></div></div><div class=\"lec-sent-ko\">하나의 중요한 사회적 능력은 얼마나 잘 또는 형편없이 사람들이 자기 자신의 감정을 표현하느냐이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;사회적 역량&#39;이라는 큰 주제를 던지며 글을 시작합니다. 여기서 competence는 사전적으로 &#39;능력, 자격&#39;이라는 뜻인데, 여기서는 사회생활을 원만하게 하기 위해 필요한 &#39;사회성 기술&#39;이나 &#39;능력&#39;이라는 의미로 쓰였습니다. 단순히 지식을 갖추는 것이 아니라 인간관계에서 어떤 능력을 갖추었는지를 강조하기 위해 이 단어를 선택했습니다. 이 문장은 이어질 내용에서 감정 표현 방식이 인간관계에 미치는 영향에 대해 다룰 것임을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how well or poorly people express their own feelings (간접의문문): 의문사(how)+주어(people)+동사(express)의 어순으로 구성된 명사절이 보어 자리에 위치하여 문장의 핵심을 설명함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">key</td><td class=\"m\">핵심적인, 중요한</td></tr><tr><td class=\"w\">social</td><td class=\"m\">사회의, 사회적인</td></tr><tr><td class=\"w\">competence</td><td class=\"m\">능력, 역량</td></tr><tr><td class=\"w\">express</td><td class=\"m\">표현하다, 나타내다</td></tr><tr><td class=\"w\">feeling</td><td class=\"m\">감정, 기분</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사회적 역량의 핵심 요소 중 하나는 자신의 감정을 얼마나 효과적으로 표현하는가에 달려 있다.</li><li>감정 표현 능력은 타인과의 관계를 맺고 유지하는 사회적 기술의 중요한 척도이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The ability to express personal emotions is a vital social skill, and it significantly influences the quality of human relationships.</div>\n              <div class=\"lec-final-sum-ko\">개인의 감정을 표현하는 능력은 필수적인 사회적 기술이며, 이는 인간관계의 질에 중요한 영향을 미친다.</div></div></div>"],"segs":[[{"audio":"./sentence11_audio/1.mp3","hl":null}],[{"audio":"./sentence11_audio/2.mp3","hl":null}],[{"audio":"./sentence11_audio/3.mp3
