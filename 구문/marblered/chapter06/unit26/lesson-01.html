  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});

  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};

  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};

lecturePlayer(document.getElementById("app"),{"brand":"unit26","title":"unit26 명사 + 관계사가 생략된 수식절","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">unit26 명사 + 관계사가 생략된 수식절\u003c/div>\u003ch1>unit26 명사 + 관계사가 생략된 수식절\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>문장 속에서 생략된 관계대명사와 관계부사를 정확히 찾아내어 긴 문장의 구조를 시원하게 뚫어보자.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 unit26 명사 + 관계사가 생략된 수식절 유닛을 통해 고등 영어의 뼈대를 이루는 핵심 구문들을 확실하게 정복해 볼 거예요. 문장이 아무리 길고 복잡해도 숨어 있는 블록만 잘 찾으면 아주 쉽게 읽을 수 있답니다. 자, 그럼 첫 번째 문장부터 차근차근 시작해 볼까요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">unit26 명사 + 관계사가 생략된 수식절\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">이 유닛의 핵심은 명사 뒤에 목적격 관계대명사나 관계부사가 생략된 구조를 한눈에 알아보고, 문장의 뼈대를 정확하게 파악하는 것입니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 There are \u003cspan class=\"fx\">some among us fortune smiles on, and others she frowns at\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 Scientists can answer when and how the universe began, but cannot calculate \u003cspan class=\"fx\">the reason it began\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 I am writing to you regarding \u003cspan class=\"fx\">a price discrepancy I encountered\u003c/span> between an item offered in your retail store and the same item offered on your website.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 This country imports about two-thirds of the raw materials it needs and exports approximately three-fifths of the machinery it produces.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05  The advent of driverless cars and other vehicles promises to revolutionize \u003cspan class=\"fx\">the way the world transports\u003c/span> itself goods every day.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 One of the most effective ways to calm down from stress is intimate contact with \u003cspan class=\"fx\">people you trust and feel comfortable around\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 Leaders need to safeguard the faith people have in them by acting in accordance with the expectations they have raised themselves.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">One reason most dogs are much happier\u003c/span> than most people is that dogs aren't affected by external circumstances the way we are.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 An instructor should exemplify the things he seeks to teach. It will be of great advantage if you yourself can do all you ask of your students and more.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 Before a job interview, it is a good idea to find out some background information about \u003cspan class=\"fx\">the company you would be working for\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Because of the huge volume of clouds it generates, the Amazon River system plays a major role in the way the sun's heat is distributed around the globe.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Do you think that being able to list \u003cspan class=\"fx\">all the reasons you love a person\u003c/span> enables you to love that person more or differently?\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘 배울 핵심 규칙은 바로 명사 뒤에서 수식어 거품이 튀어나올 때 생략된 장치를 찾아내는 거예요. some이나 others, the reason 같은 선행사 뒤에 관계대명사나 관계부사가 쏙 빠져 있는 경우가 많답니다. 이 숨은 고리를 찾아내는 순간 복잡했던 문장이 눈 녹듯 풀릴 거예요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 There are \u003cspan class=\"fx\">some among us fortune smiles on, and others she frowns at\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">There are some among us \u003c/div>\u003cdiv class=\"k\">우리 중에 몇몇이 있다\u003c/div>\u003cdiv class=\"e\">fortune smiles on, \u003c/div>\u003cdiv class=\"k\">[행운의 여신이 미소 짓는]\u003c/div>\u003cdiv class=\"e\">and others \u003c/div>\u003cdiv class=\"k\">그리고 다른 사람들이 (있다)\u003c/div>\u003cdiv class=\"e\">she frowns at.\u003c/div>\u003cdiv class=\"k\">[그녀가 눈살을 찌푸리는]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>각각의 선행사 some과 others 다음에 목적격 관계대명사 whom 또는 that이 생략되었습니다.\u003c/div>","segs":[{"n":3,"text":"There are some among us, 우리 중에 몇몇이 있다. fortune smiles on, [행운의 여신이 미소 짓는]. and others, 그리고 다른 사람들이 (있다). she frowns at, [그녀가 눈살을 찌푸리는]","hl":"ch"},{"n":4,"text":"첫 번째 문장을 보면 some과 others 뒤에 목적격 관계대명사가 생략되어 있어요. 그래서 fortune smiles on과 she frowns at이 앞의 명사들을 각각 수식하는 구조랍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 There are \u003cspan class=\"fx\">some among us fortune smiles on, and others she frowns at\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>세상에는 행운이 따르는 사람이 있는가 하면, 반대로 시련을 겪는 사람도 있다는 운명의 아이러니를 나타냅니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fortune smiles on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who are favored by fortune\u003c/span>\u003cdiv class=\"w\">수동태 표현을 사용하여 행운의 여신이 미소 짓는 대상을 명확하게 풀어쓰는 방식입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fortune\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">luck\u003c/span>\u003cspan class=\"y-eq\">fortune = luck\u003c/span>\u003cdiv class=\"w\">행운을 뜻하는 명사로 서로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">frown at\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">scowl at\u003c/span>\u003cspan class=\"y-eq\">frown at = scowl at\u003c/span>\u003cdiv class=\"w\">눈살을 찌푸리거나 불쾌해하다는 의미의 동사구입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Some people in this world are blessed with good luck, while others experience hardship.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"여기서는 우리 삶에서 누군가는 행운을 누리고 누군가는 시련을 마주하는 모습을 대비해서 보여주고 있어요.","hl":"mn"},{"n":6,"text":"fortune smiles on 이 표현을 수동태를 활용해서 who are favored by fortune으로 바꿔 쓸 수도 있겠죠.","hl":"rw"},{"n":7,"text":"어휘를 정리해 보면 fortune은 luck으로, frown at은 scowl at으로 바꿔 쓸 수 있다는 점 꼭 기억해 두세요.","hl":"ph"},{"n":8,"text":"이 문장은 Some people in this world are blessed with good luck, while others experience hardship 형태로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 Scientists can answer when and how the universe began, but cannot calculate \u003cspan class=\"fx\">the reason it began\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Scientists can answer \u003c/div>\u003cdiv class=\"k\">과학자들은 답할 수 있다\u003c/div>\u003cdiv class=\"e\">when and how the universe began, \u003c/div>\u003cdiv class=\"k\">언제 그리고 어떻게 우주가 시작되었는지\u003c/div>\u003cdiv class=\"e\">but cannot calculate \u003c/div>\u003cdiv class=\"k\">그러나 추정할 수는 없다\u003c/div>\u003cdiv class=\"e\">the reason it began.\u003c/div>\u003cdiv class=\"k\">이유를 / [그것이 시작된]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 the reason 다음에 관계부사 why가 생략되었으며, answer의 목적어로 간접의문문이 쓰였습니다.\u003c/div>","segs":[{"n":9,"text":"Scientists can answer, 과학자들은 답할 수 있다. when and how the universe began, 언제 그리고 어떻게 우주가 시작되었는지. but cannot calculate, 그러나 추정할 수는 없다. the reason it began, 이유를 / [그것이 시작된]","hl":"ch"},{"n":10,"text":"두 번째 문장에서는 선행사 the reason 뒤에 관계부사 why가 생략되어 있어요. 그리고 answer 뒤에는 의문사 주어 동사 어순의 간접의문문이 목적어로 잘 자리 잡고 있죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 Scientists can answer when and how the universe began, but cannot calculate \u003cspan class=\"fx\">the reason it began\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>과학이 우주의 탄생 시점과 방법은 밝혀냈지만, 그 근본적인 이유까지는 알아내지 못한다는 의미입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the reason it began\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">why the universe came into existence\u003c/span>\u003cdiv class=\"w\">관계부사절을 명확하게 드러내어 우주의 기원이라는 의미를 강조합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">calculate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">estimate\u003c/span>\u003cspan class=\"y-eq\">calculate = estimate\u003c/span>\u003cdiv class=\"w\">추정하거나 계산하다는 의미로 유의관계에 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">universe\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cosmos\u003c/span>\u003cspan class=\"y-eq\">universe = cosmos\u003c/span>\u003cdiv class=\"w\">우주를 가리키는 대표적인 명사입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Researchers are able to explain the timing and mechanism of the cosmic birth, yet they fail to figure out why it happened.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"과학 기술이 아주 발달해서 우주가 어떻게 생겨났는지는 알지만, 왜 하필 시작되었는지 그 깊은 의문은 아직 풀지 못했다는 뜻이에요.","hl":"mn"},{"n":12,"text":"the reason it began 이 부분을 why the universe came into existence로 풀어쓰면 의미가 더욱 명확해져요.","hl":"rw"},{"n":13,"text":"여기서 calculate는 estimate로, universe는 cosmos로 바꾸어 쓸 수 있다는 것을 알아두세요.","hl":"ph"},{"n":14,"text":"이 문장은 Researchers are able to explain the timing and mechanism of the cosmic birth, yet they fail to figure out why it happened로 바꿔 표현할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 I am writing to you regarding \u003cspan class=\"fx\">a price discrepancy I encountered\u003c/span> between an item offered in your retail store and the same item offered on your website.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I am writing to you regarding \u003c/div>\u003cdiv class=\"k\">나는 당신에게 편지를 쓰고 있다 / 관하여\u003c/div>\u003cdiv class=\"e\">a price discrepancy \u003c/div>\u003cdiv class=\"k\">가격 차이에\u003c/div>\u003cdiv class=\"e\">I encountered \u003c/div>\u003cdiv class=\"k\">[내가 맞닥뜨린]\u003c/div>\u003cdiv class=\"e\">between an item offered in your retail store \u003c/div>\u003cdiv class=\"k\">당신의 매장에서 제공되는 물품과\u003c/div>\u003cdiv class=\"e\">and the same item offered on your website.\u003c/div>\u003cdiv class=\"k\">당신의 웹사이트에서 제공되는 동일한 물품 간의\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 a price discrepancy 다음에 목적격 관계대명사 which 또는 that이 생략되었고, 분사구가 명사를 수식합니다.\u003c/div>","segs":[{"n":15,"text":"I am writing to you regarding, 나는 당신에게 편지를 쓰고 있다 / 관하여. a price discrepancy, 가격 차이에. I encountered, [내가 맞닥뜨린]. between an item offered in your retail store, 당신의 매장에서 제공되는 물품과. and the same item offered on your website, 당신의 웹사이트에서 제공되는 동일한 물품 간의","hl":"ch"},{"n":16,"text":"세 번째 문장에서는 a price discrepancy 뒤에 목적격 관계대명사가 빠져 있어요. an item과 the same item은 뒤에서 과거분사 offered가 수식해 주는 구조도 눈여겨봐야 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 I am writing to you regarding \u003cspan class=\"fx\">a price discrepancy I encountered\u003c/span> between an item offered in your retail store and the same item offered on your website.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>오프라인 매장과 온라인 웹사이트 간의 가격 차이에 대해 항의하거나 문의하는 상황을 나타냅니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a price discrepancy I encountered\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a difference in price which I found\u003c/span>\u003cdiv class=\"w\">생략된 관계대명사를 살려 쓰고 단어를 풀어서 표현한 형태입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">discrepancy\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">difference\u003c/span>\u003cspan class=\"y-eq\">discrepancy = difference\u003c/span>\u003cdiv class=\"w\">차이와 불일치를 나타내는 대표적인 어휘입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">encounter\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">come across\u003c/span>\u003cspan class=\"y-eq\">encounter = come across\u003c/span>\u003cdiv class=\"w\">우연히 마주치거나 발견하다는 의미의 동사구입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">retail store\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">offline shop\u003c/span>\u003cspan class=\"y-eq\">retail store = offline shop\u003c/span>\u003cdiv class=\"w\">오프라인 소매 매장을 뜻하는 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I am reaching out to address a cost variation I found between a product sold at your physical shop and the exact same product on your site.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"매장 가격과 홈페이지 가격이 서로 달라서 고객센터에 문의하는 상황을 아주 정중하게 표현한 비즈니스 문장이에요.","hl":"mn"},{"n":18,"text":"a price discrepancy I encountered를 관계대명사를 살려서 a difference in price which I found로 바꾸어 쓸 수도 있어요.","hl":"rw"},{"n":19,"text":"discrepancy는 difference로, encounter는 come across로, retail store는 offline shop으로 바꾸어 쓸 수 있답니다.","hl":"ph"},{"n":20,"text":"이 문장은 I am reaching out to address a cost variation I found between a product sold at your physical shop and the exact same product on your site 형태로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 This country imports about two-thirds of the raw materials it needs and exports approximately three-fifths of the machinery it produces.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">This country imports \u003c/div>\u003cdiv class=\"k\">이 나라는 수입한다\u003c/div>\u003cdiv class=\"e\">about two-thirds of the raw materials \u003c/div>\u003cdiv class=\"k\">원료의 약 2/3를\u003c/div>\u003cdiv class=\"e\">it needs \u003c/div>\u003cdiv class=\"k\">[그 나라가 필요로 하는]\u003c/div>\u003cdiv class=\"e\">and exports \u003c/div>\u003cdiv class=\"k\">그리고 수출한다\u003c/div>\u003cdiv class=\"e\">approximately three-fifths of the machinery \u003c/div>\u003cdiv class=\"k\">기계류의 약 3/5을\u003c/div>\u003cdiv class=\"e\">it produces.\u003c/div>\u003cdiv class=\"k\">[그 나라가 생산하는]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 the raw materials와 the machinery 다음에 각각 목적격 관계대명사가 생략되었습니다.\u003c/div>","segs":[{"n":21,"text":"This country imports, 이 나라는 수입한다. about two-thirds of the raw materials, 원료의 약 2/3를. it needs, [그 나라가 필요로 하는]. and exports, 그리고 수출한다. approximately three-fifths of the machinery, 기계류의 약 3/5을. it produces, [그 나라가 생산하는]","hl":"ch"},{"n":22,"text":"네 번째 문장에서는 선행사 뒤에 목적격 관계대명사가 빠져 있는 구조가 반복되고 있어요. 이 문법을 완벽히 이해했는지 확인하기 위해 주어와 동사의 수일치와 목적격 관계대명사의 생략 여부를 꼼꼼히 따져보는 문제가 시험에 자주 출제되니 주의하세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 This country imports about two-thirds of the raw materials it needs and exports approximately three-fifths of the machinery it produces.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>부존자원이 부족하여 원료를 수입하고, 이를 가공하여 기계류를 수출하는 무역 중심 국가의 경제 구조를 설명합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">it needs\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">which are required by this nation\u003c/span>\u003cdiv class=\"w\">수동태 관계대명사절로 바꾸어 원료가 필요해지는 주체를 명확히 합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">approximately\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">roughly\u003c/span>\u003cspan class=\"y-eq\">approximately = roughly\u003c/span>\u003cdiv class=\"w\">대략, 거의라는 의미를 가진 부사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">import\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">bring in from abroad\u003c/span>\u003cspan class=\"y-eq\">import = bring in from abroad\u003c/span>\u003cdiv class=\"w\">수입하다는 의미를 풀어 쓴 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">export\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">send abroad for sale\u003c/span>\u003cspan class=\"y-eq\">export = send abroad for sale\u003c/span>\u003cdiv class=\"w\">수출하다는 의미의 유의어적 설명입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Roughly 66 percent of required unprocessed supplies are brought into this nation, while about 60 percent of manufactured equipment is shipped overseas.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"필요한 원자재는 외국에서 사들이고, 직접 만든 기계는 해외로 내다 파는 무역 국가의 경제 특징을 잘 보여주고 있죠.","hl":"mn"},{"n":24,"text":"it needs 라는 표현을 수동태인 which are required by this nation으로 바꾸면 또 다른 느낌을 줄 수 있어요.","hl":"rw"},{"n":25,"text":"approximately는 roughly로, import와 export는 각각 해외와의 거래를 나타내는 표현으로 바꿔 쓸 수 있습니다.","hl":"ph"},{"n":26,"text":"이 문장은 Roughly 66 percent of required unprocessed supplies are brought into this nation, while about 60 percent of manufactured equipment is shipped overseas로 바꿔 쓸 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05  The advent of driverless cars and other vehicles promises to revolutionize \u003cspan class=\"fx\">the way the world transports\u003c/span> itself goods every day.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The advent of driverless cars and other vehicles \u003c/div>\u003cdiv class=\"k\">운전자 없는 자동차와 다른 차량의 출현은\u003c/div>\u003cdiv class=\"e\">promises to revolutionize \u003c/div>\u003cdiv class=\"k\">변화시킬 가망이 있다\u003c/div>\u003cdiv class=\"e\">the way \u003c/div>\u003cdiv class=\"k\">방식을\u003c/div>\u003cdiv class=\"e\">the world transports itself goods every day.\u003c/div>\u003cdiv class=\"k\">[세계가 직접 매일 상품을 운송하는]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 the way 다음에 관계부사 how가 생략되었으며, the way와 how는 함께 쓸 수 없습니다.\u003c/div>","segs":[{"n":27,"text":"The advent of driverless cars and other vehicles, 운전자 없는 자동차와 다른 차량의 출현은. promises to revolutionize, 변화시킬 가망이 있다. the way, 방식을. the world transports itself goods every day, [세계가 직접 매일 상품을 운송하는]","hl":"ch"},{"n":28,"text":"다섯 번째 문장에서는 the way 뒤에 관계부사 how가 생략되어 있어요. the way how는 절대 같이 쓰면 안 된다는 문법 규칙 기억하죠? 관계사의 선택 문제로 the way 대신 how를 쓸 수 있는지 묻는 문제가 자주 나온답니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05  The advent of driverless cars and other vehicles promises to revolutionize \u003cspan class=\"fx\">the way the world transports\u003c/span> itself goods every day.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자율주행 차량의 등장이 물류와 운송 시스템 전체에 엄청난 혁신을 가져올 것임을 암시합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the way\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">how\u003c/span>\u003cdiv class=\"w\">the way와 how는 동반 사용이 불가하므로 how 단독으로 바꾸어 쓸 수 있음을 보여줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">advent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">arrival\u003c/span>\u003cspan class=\"y-eq\">advent = arrival\u003c/span>\u003cdiv class=\"w\">출현이나 도래를 뜻하는 명사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">revolutionize\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">completely transform\u003c/span>\u003cspan class=\"y-eq\">revolutionize = completely transform\u003c/span>\u003cdiv class=\"w\">완전히 혁신하다는 의미의 동사구입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">driverless\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">autonomous\u003c/span>\u003cspan class=\"y-eq\">driverless = autonomous\u003c/span>\u003cdiv class=\"w\">운전자가 없는 자율주행의 의미를 가진 형용사입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The arrival of self-driving automobiles and other transport systems is expected to completely change daily global logistics.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"자율주행차가 나오면 매일 이루어지는 사람과 물자의 이동 방식이 완전히 뒤바뀔 것이라는 기대감을 나타내고 있어요.","hl":"mn"},{"n":30,"text":"the way라는 선행사를 관계부사 how로 바꾸어 표현할 수도 있지만 둘을 동시에는 못 쓴다는 점 명심하세요.","hl":"rw"},{"n":31,"text":"advent는 arrival로, revolutionize는 completely transform으로, driverless는 autonomous로 쓸 수 있어요.","hl":"ph"},{"n":32,"text":"이 문장은 The arrival of self-driving automobiles and other transport systems is expected to completely change daily global logistics 형태로 패러프레이징할 수 있습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 One of the most effective ways to calm down from stress is intimate contact with \u003cspan class=\"fx\">people you trust and feel comfortable around\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">One of the most effective ways \u003c/div>\u003cdiv class=\"k\">가장 효과적인 방법 중 하나는\u003c/div>\u003cdiv class=\"e\">to calm down from stress \u003c/div>\u003cdiv class=\"k\">[스트레스로부터 진정하는]\u003c/div>\u003cdiv class=\"e\">is intimate contact \u003c/div>\u003cdiv class=\"k\">친밀한 접촉이다\u003c/div>\u003cdiv class=\"e\">with people \u003c/div>\u003cdiv class=\"k\">사람들과의\u003c/div>\u003cdiv class=\"e\">you trust and feel comfortable around.\u003c/div>\u003cdiv class=\"k\">[주변에 당신이 신뢰하고 그리고 편안하게 느끼는]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 people 다음에 목적격 관계대명사 who(m) 또는 that이 생략되었고, 주어로 쓰인 one of는 단수 취급합니다.\u003c/div>","segs":[{"n":33,"text":"One of the most effective ways, 가장 효과적인 방법 중 하나는. to calm down from stress, [스트레스로부터 진정하는]. is intimate contact, 친밀한 접촉이다. with people, 사람들과의. you trust and feel comfortable around, [주변에 당신이 신뢰하고 그리고 편안하게 느끼는]","hl":"ch"},{"n":34,"text":"여섯 번째 문장에서는 people 뒤에 목적격 관계대명사가 생략되어 있어요. 그리고 문장 주어가 one of 최상급 복수명사 형태라서 단수동사 is를 쓴다는 점이 핵심이에요. 주어동사 수일치를 물어보는 시험 문제의 단골 소재랍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 One of the most effective ways to calm down from stress is intimate contact with \u003cspan class=\"fx\">people you trust and feel comfortable around\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>스트레스를 해소하는 가장 좋은 방법은 마음이 잘 맞는 친밀한 사람들과 어울리는 것이라는 조언입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">you trust and feel comfortable around\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">whom you rely on and feel at ease with\u003c/span>\u003cdiv class=\"w\">생략된 목적격 관계대명사를 살리고 전치사구와 유의어로 풀어쓴 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">intimate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">close\u003c/span>\u003cspan class=\"y-eq\">intimate = close\u003c/span>\u003cdiv class=\"w\">친밀하고 가까운 관계를 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">calm down\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">relax\u003c/span>\u003cspan class=\"y-eq\">calm down = relax\u003c/span>\u003cdiv class=\"w\">진정하고 긴장을 풀다라는 의미의 동사구입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">comfortable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at ease\u003c/span>\u003cspan class=\"y-eq\">comfortable = at ease\u003c/span>\u003cdiv class=\"w\">편안함을 느끼는 상태를 뜻하는 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A great method to relieve tension is having close interactions with individuals in whose company you feel secure and relaxed.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"스트레스 받을 때 혼자 끙끙앓지 말고 마음을 터놓을 수 있는 편안한 사람들과 함께 있는 게 최고라는 따뜻한 조언이죠.","hl":"mn"},{"n":36,"text":"you trust and feel comfortable around를 관계대명사를 살려 whom you rely on 형태로 바꾸어 쓸 수 있어요.","hl":"rw"},{"n":37,"text":"intimate는 close로, calm down은 relax로, comfortable은 at ease로 바꾸어 쓸 수 있답니다.","hl":"ph"},{"n":38,"text":"이 문장은 A great method to relieve tension is having close interactions with individuals in whose company you feel secure and relaxed로 바꿔 표현할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 Leaders need to safeguard the faith people have in them by acting in accordance with the expectations they have raised themselves.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Leaders need to safeguard the faith \u003c/div>\u003cdiv class=\"k\">지도자들은 신념을 보호할 필요가 있다\u003c/div>\u003cdiv class=\"e\">people have in them \u003c/div>\u003cdiv class=\"k\">[사람들이 지도자들에게 갖는]\u003c/div>\u003cdiv class=\"e\">by acting \u003c/div>\u003cdiv class=\"k\">행동함으로써\u003c/div>\u003cdiv class=\"e\">in accordance with the expectations \u003c/div>\u003cdiv class=\"k\">기대에 따라\u003c/div>\u003cdiv class=\"e\">they have raised themselves.\u003c/div>\u003cdiv class=\"k\">[그들이 스스로 고양시킨]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 the faith와 the expectations 다음에 각각 목적격 관계대명사가 생략되었습니다.\u003c/div>","segs":[{"n":39,"text":"Leaders need to safeguard the faith, 지도자들은 신념을 보호할 필요가 있다. people have in them, [사람들이 지도자들에게 갖는]. by acting, 행동함으로써. in accordance with the expectations, 기대에 따라. they have raised themselves, [그들이 스스로 고양시킨]","hl":"ch"},{"n":40,"text":"일곱 번째 문장에서는 the faith 뒤와 the expectations 뒤에 모두 목적격 관계대명사가 생략되어 있어요. 문맥상 적절한 어휘를 고르는 문제나 우리말 해석에 맞게 어구를 배열하는 서술형 문제에서 자주 출제되는 구조랍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 Leaders need to safeguard the faith people have in them by acting in accordance with the expectations they have raised themselves.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>진정한 리더는 대중이 자신에게 갖는 믿음을 지키기 위해 스스로 높여놓은 기대치에 부합하는 행동을 해야 한다는 책임감을 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the expectations they have raised\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the standards which they themselves have set\u003c/span>\u003cdiv class=\"w\">기대를 높였다는 의미를 기준을 세웠다는 명확한 표현으로 풀어썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">safeguard\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">protect\u003c/span>\u003cspan class=\"y-eq\">safeguard = protect\u003c/span>\u003cdiv class=\"w\">보호하고 지키다라는 의미의 동사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in accordance with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">according to\u003c/span>\u003cspan class=\"y-eq\">in accordance with = according to\u003c/span>\u003cdiv class=\"w\">~에 따라라는 뜻의 전치사구입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">raise\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">elevate\u003c/span>\u003cspan class=\"y-eq\">raise = elevate\u003c/span>\u003cdiv class=\"w\">높이거나 고양시키다는 의미의 동사입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Guiding figures must preserve public trust by behaving consistently with the standards they have personally established.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"지도자라면 사람들이 자신을 믿어주는 만큼 스스로 높여놓은 기대에 어긋나지 않게 행동해서 신뢰를 지켜야 한다는 가르침이에요.","hl":"mn"},{"n":42,"text":"the expectations they have raised를 the standards which they themselves have set으로 바꾸면 의미가 더 선명해져요.","hl":"rw"},{"n":43,"text":"safeguard는 protect로, in accordance with는 according to로, raise는 elevate로 바꾸어 쓸 수 있습니다.","hl":"ph"},{"n":44,"text":"이 문장은 Guiding figures must preserve public trust by behaving consistently with the standards they have personally established 형태로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 \u003cspan class=\"fx\">One reason most dogs are much happier\u003c/span> than most people is that dogs aren't affected by external circumstances the way we are.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">One reason \u003c/div>\u003cdiv class=\"k\">하나의 이유는\u003c/div>\u003cdiv class=\"e\">most dogs are much happier than most people \u003c/div>\u003cdiv class=\"k\">[대부분의 개들이 대부분의 사람들보다 훨씬 더 행복한]\u003c/div>\u003cdiv class=\"e\">is that dogs aren't affected by external circumstances \u003c/div>\u003cdiv class=\"k\">개들은 영향을 받지 않기 때문이다 / 외부의 환경에 의해서\u003c/div>\u003cdiv class=\"e\">the way we are.\u003c/div>\u003cdiv class=\"k\">우리가 영향을 받는 것처럼\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 One reason 다음에 관계부사 why가 생략되었으며, 보어절에서 the way는 '~처럼'의 의미를 나타내는 접속사로 쓰였습니다.\u003c/div>","segs":[{"n":45,"text":"One reason, 하나의 이유는. most dogs are much happier than most people, [대부분의 개들이 대부분의 사람들보다 훨씬 더 행복한]. is that dogs aren't affected by external circumstances, 개들은 영향을 받지 않기 때문이다 / 외부의 환경에 의해서. the way we are, 우리가 영향을 받는 것처럼","hl":"ch"},{"n":46,"text":"여덟 번째 문장에서는 One reason 뒤에 관계부사 why가 생략되어 있어요. 그리고 that절 안에서 the way는 '~처럼'이라는 접속사 역할을 한다는 점을 기억해 두세요. 문법 시험에서 대동사 are의 쓰임을 확인하는 문제가 나오기 쉬워요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 \u003cspan class=\"fx\">One reason most dogs are much happier\u003c/span> than most people is that dogs aren't affected by external circumstances the way we are.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인간은 주변 상황이나 남의 시선에 쉽게 휘둘리지만, 개들은 그렇지 않기 때문에 훨씬 단순하고 행복하다는 통찰을 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the way we are\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">just as human beings are affected\u003c/span>\u003cdiv class=\"w\">the way의 접속사적 의미를 명확한 부사절로 풀어쓴 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">external\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">outer\u003c/span>\u003cspan class=\"y-eq\">external = outer\u003c/span>\u003cdiv class=\"w\">외부의라는 의미를 가진 형용사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">circumstances\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">situations\u003c/span>\u003cspan class=\"y-eq\">circumstances = situations\u003c/span>\u003cdiv class=\"w\">환경이나 상황을 뜻하는 명사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">affect\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">influence\u003c/span>\u003cspan class=\"y-eq\">affect = influence\u003c/span>\u003cdiv class=\"w\">영향을 미치다라는 의미의 동사입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Canines tend to experience greater joy than humans largely because they do not let outer conditions sway them the way we do.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"개들은 우리 인간처럼 주변 환경이나 남의 시선에 마음을 다치지 않기 때문에 더 행복하다는 재미있는 비교를 보여주고 있어요.","hl":"mn"},{"n":48,"text":"the way we are를 just as human beings are affected로 풀어쓰면 접속사 역할을 더 쉽게 이해할 수 있답니다.","hl":"rw"},{"n":49,"text":"external은 outer로, circumstances는 situations로, affect는 influence로 바꿔 쓸 수 있어요.","hl":"ph"},{"n":50,"text":"이 문장은 Canines tend to experience greater joy than humans largely because they do not let outer conditions sway them the way we do로 바꿔 표현할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 An instructor should exemplify the things he seeks to teach. It will be of great advantage if you yourself can do all you ask of your students and more.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">An instructor should exemplify the things \u003c/div>\u003cdiv class=\"k\">강사는 일들에 본보기가 되어야 한다\u003c/div>\u003cdiv class=\"e\">he seeks to teach. \u003c/div>\u003cdiv class=\"k\">[그가 가르치려고 하는]\u003c/div>\u003cdiv class=\"e\">It will be of great advantage \u003c/div>\u003cdiv class=\"k\">(...)은 대단한 이점이 될 것이다\u003c/div>\u003cdiv class=\"e\">if you yourself can do all \u003c/div>\u003cdiv class=\"k\">만약 당신 스스로 모든 것을 할 수 있다면\u003c/div>\u003cdiv class=\"e\">you ask of your students and more.\u003c/div>\u003cdiv class=\"k\">[당신이 당신의 학생들 그리고 그 이상의 사람들에게 요구하는]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>첫 문장의 선행사 the things와 두 번째 문장의 all 다음에 각각 목적격 관계대명사가 생략되었고, it은 가주어입니다.\u003c/div>","segs":[{"n":51,"text":"An instructor should exemplify the things, 강사는 일들에 본보기가 되어야 한다. he seeks to teach, [그가 가르치려고 하는]. It will be of great advantage, (...)은 대단한 이점이 될 것이다. if you yourself can do all, 만약 당신 스스로 모든 것을 할 수 있다면. you ask of your students and more, [당신이 당신의 학생들 그리고 그 이상의 사람들에게 요구하는]","hl":"ch"},{"n":52,"text":"아홉 번째 문장에서는 the things 뒤와 all 뒤에 목적격 관계대명사가 생략되어 있어요. 두 번째 문장의 It은 가주어이고 if절이 진주어라는 것도 놓치지 마세요. 가주어와 진주어 구문을 제대로 활용했는지 묻는 어법 문제가 자주 출제된답니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 An instructor should exemplify the things he seeks to teach. It will be of great advantage if you yourself can do all you ask of your students and more.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>가르치는 사람은 말로만 가르치지 말고 자신이 직접 모범을 보여야 하며, 그것이 교육에 엄청난 강점이 된다는 브루스 리의 명언입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">It will be of great advantage\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">It will be extremely beneficial\u003c/span>\u003cdiv class=\"w\">전치사구 형용사보어를 일반 형용사 보어로 바꾸어 직관적인 의미를 전달합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">exemplify\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be a model for\u003c/span>\u003cspan class=\"y-eq\">exemplify = be a model for\u003c/span>\u003cdiv class=\"w\">본보기가 되다라는 의미의 동사구 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">instructor\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">teacher\u003c/span>\u003cspan class=\"y-eq\">instructor = teacher\u003c/span>\u003cdiv class=\"w\">강사이자 가르치는 사람을 뜻하는 유의어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">advantage\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">benefit\u003c/span>\u003cspan class=\"y-eq\">advantage = benefit\u003c/span>\u003cdiv class=\"w\">이점이나 유익함을 나타내는 명사입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Teachers ought to model what they wish to impart, and it proves immensely helpful if you can personally perform everything you demand of learners and beyond.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"가르치는 스승이라면 입으로만 떠들지 말고 자신이 학생들에게 요구하는 것을 직접 실천할 수 있어야 한다는 멋진 가르침이에요.","hl":"mn"},{"n":54,"text":"It will be of great advantage를 일반 형용사를 써서 It will be extremely beneficial로 바꾸어 쓸 수도 있어요.","hl":"rw"},{"n":55,"text":"exemplify는 be a model for로, instructor는 teacher로, advantage는 benefit으로 바꾸어 쓸 수 있답니다.","hl":"ph"},{"n":56,"text":"이 문장은 Teachers ought to model what they wish to impart, and it proves immensely helpful if you can personally perform everything you demand of learners and beyond 형태로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 Before a job interview, it is a good idea to find out some background information about \u003cspan class=\"fx\">the company you would be working for\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Before a job interview, \u003c/div>\u003cdiv class=\"k\">구직 면접 전에\u003c/div>\u003cdiv class=\"e\">it is a good idea \u003c/div>\u003cdiv class=\"k\">(...)은 좋은 생각이다\u003c/div>\u003cdiv class=\"e\">to find out some background information about the company \u003c/div>\u003cdiv class=\"k\">그 회사에 관한 약간의 배경 정보를 알아 보는 것은\u003c/div>\u003cdiv class=\"e\">you would be working for.\u003c/div>\u003cdiv class=\"k\">[당신이 일하고자 하는]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 the company 다음에 목적격 관계대명사가 생략되었으며, it은 가주어이고 to부정사구가 진주어입니다.\u003c/div>","segs":[{"n":57,"text":"Before a job interview, 구직 면접 전에. it is a good idea, (...)은 좋은 생각이다. to find out some background information about the company, 그 회사에 관한 약간의 배경 정보를 알아 보는 것은. you would be working for, [당신이 일하고자 하는]","hl":"ch"},{"n":58,"text":"열 번째 문장에서는 the company 뒤에 목적격 관계대명사가 생략되어 있어요. 가주어 it과 진주어인 to부정사구 구문도 아주 깔끔하게 정리되어 있죠. 전치사 for의 위치를 묻는 어법 문제도 눈여겨봐야 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 Before a job interview, it is a good idea to find out some background information about \u003cspan class=\"fx\">the company you would be working for\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>성공적인 면접을 위해서는 지원하는 회사의 사전 정보를 미리 조사해 두는 것이 현명하다는 조언입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">you would be working for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">for which you might work\u003c/span>\u003cdiv class=\"w\">관계대명사 생략 구조를 전치사 + 관계대명사 형태로 정식 복원하여 격식을 갖춘 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">find out\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">discover\u003c/span>\u003cspan class=\"y-eq\">find out = discover\u003c/span>\u003cdiv class=\"w\">알아내다, 발견하다는 뜻의 동사구입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">background information\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">prior knowledge\u003c/span>\u003cspan class=\"y-eq\">background information = prior knowledge\u003c/span>\u003cdiv class=\"w\">사전에 알아두는 배경지식을 뜻합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">job interview\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">employment interview\u003c/span>\u003cspan class=\"y-eq\">job interview = employment interview\u003c/span>\u003cdiv class=\"w\">일자리를 얻기 위한 면접을 뜻하는 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Prior to an employment meeting, it is wise to gather preliminary details regarding the organization you plan to join.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"취업 면접을 보러 가기 전에 내가 지원한 회사가 어떤 곳인지 미리 공부하고 가는 것이 합격의 비결이라는 뜻이에요.","hl":"mn"},{"n":60,"text":"you would be working for를 전치사 관계대명사 형태인 for which you might work로 바꾸면 격식 있는 문장이 돼요.","hl":"rw"},{"n":61,"text":"find out은 discover로, background information은 prior knowledge로, job interview는 employment interview로 바꿔 쓸 수 있어요.","hl":"ph"},{"n":62,"text":"이 문장은 Prior to an employment meeting, it is wise to gather preliminary details regarding the organization you plan to join으로 바꿔 표현할 수 있답니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 Because of the huge volume of clouds it generates, the Amazon River system plays a major role in the way the sun's heat is distributed around the globe.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Because of the huge volume of clouds \u003c/div>\u003cdiv class=\"k\">막대한 구름의 양 때문에\u003c/div>\u003cdiv class=\"e\">it generates, \u003c/div>\u003cdiv class=\"k\">[그것이 생성하는]\u003c/div>\u003cdiv class=\"e\">the Amazon River system plays a major role \u003c/div>\u003cdiv class=\"k\">아마존 수계는 중대한 역할을 한다\u003c/div>\u003cdiv class=\"e\">in the way \u003c/div>\u003cdiv class=\"k\">방식에 있어서\u003c/div>\u003cdiv class=\"e\">the sun's heat is distributed around the globe.\u003c/div>\u003cdiv class=\"k\">[태양열이 전 지구에 배분되는]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 the huge volume of clouds 다음에 목적격 관계대명사가 생략되었고, the way 다음에는 관계부사 how가 생략되었습니다.\u003c/div>","segs":[{"n":63,"text":"Because of the huge volume of clouds, 막대한 구름의 양 때문에. it generates, [그것이 생성하는]. the Amazon River system plays a major role, 아마존 수계는 중대한 역할을 한다. in the way, 방식에 있어서. the sun's heat is distributed around the globe, [태양열이 전 지구에 배분되는]","hl":"ch"},{"n":64,"text":"열한 번째 문장에서는 clouds 뒤와 the way 뒤에 각각 목적격 관계대명사와 관계부사가 생략되어 있어요. 두 가지 생략 구조가 한 문장에 멋지게 어우러져 있죠. 문맥상 적절한 어휘를 고르는 유형으로 출제될 확률이 높아요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 Because of the huge volume of clouds it generates, the Amazon River system plays a major role in the way the sun's heat is distributed around the globe.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>아마존 강 유역이 만들어내는 엄청난 양의 구름이 지구 전체의 태양열 순환과 기후 조절에 핵심적인 역할을 담당한다는 내용입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">it generates\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">which are produced by the river\u003c/span>\u003cdiv class=\"w\">생략된 관계대명사와 수동태를 이용하여 구름이 만들어지는 주체를 명시했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">huge\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">massive\u003c/span>\u003cspan class=\"y-eq\">huge = massive\u003c/span>\u003cdiv class=\"w\">거대하고 막대한 양을 나타내는 형용사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">distribute\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">spread\u003c/span>\u003cspan class=\"y-eq\">distribute = spread\u003c/span>\u003cdiv class=\"w\">분배하고 퍼뜨리다라는 의미의 동사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">play a major role\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be of great importance\u003c/span>\u003cspan class=\"y-eq\">play a major role = be of great importance\u003c/span>\u003cdiv class=\"w\">중요한 역할을 수행한다는 의미의 주요 구문입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Due to the massive amounts of clouds created by the Amazon basin, this river network is crucial in how solar warmth spreads across the planet.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"아마존 강에서 뿜어져 나오는 어마어마한 구름 덕분에 지구 전체의 뜨거운 열기가 골고루 퍼질 수 있다는 자연의 신비를 말해주고 있어요.","hl":"mn"},{"n":66,"text":"it generates를 수동태 표현인 which are produced by the river로 바꾸면 구름이 만들어지는 과정을 더 자세히 나타낼 수 있어요.","hl":"rw"},{"n":67,"text":"huge는 massive로, distribute는 spread로, play a major role은 be of great importance로 바꾸어 쓸 수 있답니다.","hl":"ph"},{"n":68,"text":"이 문장은 Due to the massive amounts of clouds created by the Amazon basin, this river network is crucial in how solar warmth spreads across the planet 형태로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Do you think that being able to list \u003cspan class=\"fx\">all the reasons you love a person\u003c/span> enables you to love that person more or differently?\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Do you think \u003c/div>\u003cdiv class=\"k\">당신은 생각하는가\u003c/div>\u003cdiv class=\"e\">that being able to list all the reasons \u003c/div>\u003cdiv class=\"k\">모든 이유를 열거할 수 있다는 것이\u003c/div>\u003cdiv class=\"e\">you love a person \u003c/div>\u003cdiv class=\"k\">[당신이 어떤 사람을 사랑하는]\u003c/div>\u003cdiv class=\"e\">enables you to love that person more or differently?\u003c/div>\u003cdiv class=\"k\">당신이 그 사람을 더 많이 또는 다르게 사랑할 수 있게 해 준다고?\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 all the reasons 다음에 관계부사 why가 생략되었으며, 동명사구 being ~ a person이 that절의 주어로 쓰였습니다.\u003c/div>","segs":[{"n":69,"text":"Do you think, 당신은 생각하는가. that being able to list all the reasons, 모든 이유를 열거할 수 있다는 것이. you love a person, [당신이 어떤 사람을 사랑하는]. enables you to love that person more or differently?, 당신이 그 사람을 더 많이 또는 다르게 사랑할 수 있게 해 준다고?","hl":"ch"},{"n":70,"text":"열두 번째 문장에서는 all the reasons 뒤에 관계부사 why가 생략되어 있어요. 그리고 that절의 주어 자리에는 동명사구인 being able to list가 쓰여서 문장을 멋지게 이끌고 있죠. 주어동사 수일치와 동명사 주어의 특징을 파악하는 문제가 시험에 잘 나온답니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Do you think that being able to list \u003cspan class=\"fx\">all the reasons you love a person\u003c/span> enables you to love that person more or differently?\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>어떤 사람을 사랑하는 이유를 말로 다 늘어놓을 수 있다고 해서 그 사람을 더 깊이 혹은 색다르게 사랑하게 되는지에 대한 철학적 질문입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">being able to list\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">having the capacity to enumerate\u003c/span>\u003cdiv class=\"w\">동명사구를 어휘를 확장하여 격식 있는 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">list\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">enumerate\u003c/span>\u003cspan class=\"y-eq\">list = enumerate\u003c/span>\u003cdiv class=\"w\">항목을 열거하고 나열한다는 의미의 고급 어휘입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">enable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">allow\u003c/span>\u003cspan class=\"y-eq\">enable = allow\u003c/span>\u003cdiv class=\"w\">~할 수 있게 하다라는 의미의 동사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">differently\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in another way\u003c/span>\u003cspan class=\"y-eq\">differently = in another way\u003c/span>\u003cdiv class=\"w\">다르게, 색다르게라는 뜻을 가진 부사구입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Would you say that having the ability to name every cause for your affection makes you care for someone more deeply or in a new way?\u003c/div>\u003c/div>","segs":[{"n":71,"text":"누군가를 사랑하는 이유를 줄줄이 읊을 수 있다고 해서 그 사람을 향한 사랑이 더 커지거나 특별해지는지 생각하게 만드는 심오한 질문이에요.","hl":"mn"},{"n":72,"text":"being able to list를 having the capacity to enumerate처럼 바꾸면 훨씬 더 고급스러운 어감을 살릴 수 있어요.","hl":"rw"},{"n":73,"text":"list는 enumerate로, enable은 allow로, differently는 in another way로 바꿔 쓸 수 있답니다.","hl":"ph"},{"n":74,"text":"이 문장은 Would you say that having the ability to name every cause for your affection makes you care for someone more deeply or in a new way로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">unit26 명사 + 관계사가 생략된 수식절\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>우리는 이번 유닛에서 명사 뒤에 숨어 있는 목적격 관계대명사와 관계부사의 생략 구조를 완벽하게 파악했습니다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"자, 이렇게 해서 오늘 unit26 명사 + 관계사가 생략된 수식절 유닛의 모든 문장 분석을 마쳤어요. 문장 속에서 숨어 있는 관계사 블록을 찾아내는 눈이 이제 확실히 생겼을 거예요. 복습 꼼꼼히 하고 다음 유닛에서 또 만나요.","hl":"sum"}]}]});</script></body></html>
