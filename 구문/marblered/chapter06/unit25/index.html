.y-chunks .e{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600;font-size:17px;border-right:1px solid #EEF3F3;background:#FBFEFE}
.y-chunks .k{color:var(--pk-t);font-size:15px;font-weight:600}
.y-box{border-radius:4px;padding:10px 14px;margin-bottom:10px;font-size:15.5px;line-height:1.7}
.y-lb{display:inline-block;font-size:12.5px;font-weight:800;color:var(--pk-t);background:#fff;border:1px solid var(--pk-b,#B5DEDC);border-radius:3px;padding:0 8px;margin-right:8px;vertical-align:1px}
.y-st{background:var(--pk-ll);border-left:4px solid var(--pk)}
.y-mn{background:var(--am-l,#FFF3DC);border:1px solid var(--am-b,#F0D9A5)}
.y-mn .y-lb{color:var(--am-d,#8A5A00);border-color:var(--am-b,#F0D9A5)}
.y-cg{border:1px solid var(--pk-b,#B5DEDC)}
.y-pair{padding:6px 0 4px;border-top:1px dashed #E3E9EE}
.y-pair:first-of-type{border-top:0}
.y-pair .f{font-family:"Noto Serif KR",Georgia,serif;font-weight:600;color:#4A5866}
.y-pair .ar{color:var(--pk);margin:0 8px;font-weight:800}
.y-pair .t{font-family:"Noto Serif KR",Georgia,serif;font-weight:700;color:#1B2733;background:var(--pk-ll);padding:0 4px}
.y-pair .w{font-size:14px;color:#4A5866;margin-top:2px}
.y-eq{display:inline-block;margin-left:10px;font-size:12.5px;font-weight:700;color:#3A4FA3;border:1px solid #AEBBE6;border-radius:3px;padding:0 7px}
.y-pp{background:#F6F8FA;border-left:4px solid #3A4FA3}
.y-pp .y-lb{color:#3A4FA3;border-color:#AEBBE6}
.y-pp .p{font-family:"Noto Serif KR",Georgia,serif;font-size:18px;font-weight:700;margin-top:6px;line-height:1.55}
.y-list{display:grid;gap:6px;margin-top:4px}
.y-li{font-family:"Noto Serif KR",Georgia,serif;font-size:16px;line-height:1.6;display:block;padding-left:32px;text-indent:-32px}
.y-no{display:inline-block;text-indent:0;min-width:22px;height:20px;line-height:20px;text-align:center;border-radius:3px;background:var(--pk);color:#fff;font-family:sans-serif;font-size:12px;font-weight:800;margin-right:10px;vertical-align:1px}
@media (max-width:700px){.y-sen{font-size:18px}.y-chunks{grid-template-columns:1fr}.y-chunks .e{border-right:0}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"마법같은 블록구문 레드","title":"명사 바로 뒤에서 의미를 확장하는 관계부사절 마스터","audioDir":"audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 25 명사 + 관계부사절\u003c/div>\u003ch1>명사 바로 뒤에서 의미를 확장하는 관계부사절 마스터\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>선행사를 뒤에서 수식하는 관계부사절의 구조와 의미를 완벽하게 이해하고 수능 고난도 문장에 적용하기\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘 우리는 수능 독해지문에서 정말 자주 만나는 명사 바로 뒤의 관계부사절을 공부할 거예요. 선행사가 시간이나 장소, 이유, 방법일 때 관계부사들이 어떻게 명사를 꾸며주는지 차근차근 살펴볼게요. 관계부사절이란 문장 속에서 명사 바로 뒤에 위치하여 그 명사의 의미를 구체적으로 확장하고 설명해 주는 역할을 하는 절을 말해요. 선행사의 종류에 따라 when, where, why, how 또는 that을 사용하며, 관계부사 뒤에는 주어와 동사 목적어 등이 모두 갖춰진 완전한 형태의 문장이 온다는 특징이 있죠. 집중해서 끝까지 잘 따라오세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">Unit 25 명사 + 관계부사절\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">선행사 뒤에서 명사를 수식하는 \u003cb class=\"key\">관계부사절\u003c/b>은 완전한 절을 이끌며, 선행사의 종류에 따라 when, where, why, how 또는 that을 사용한다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 We are living in the first century \u003cspan class=\"fx\">when the greatest skills will come from human actions rather than from nature\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02  Competition becomes a zero sum game \u003cspan class=\"fx\">where one organization can only win at the expense of others\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 We are embarking on a time \u003cspan class=\"fx\">when each individual will have all their own medical data and the computing power to process it in the context of their own world\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04  The reason \u003cspan class=\"fx\">why worry kills more people than work\u003c/span> is that more people worry than work.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 The way \u003cspan class=\"fx\">people act\u003c/span> is often influenced by experiences that they had in the past and by the need to fulfill basic human needs.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 We look forward to the time \u003cspan class=\"fx\">when the Power of Love will replace the Love of Power\u003c/span>. Then will our world know the blessings of peace.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 In general, people accept job offers \u003cspan class=\"fx\">where the monetary compensation is near the amount\u003c/span> that they were hoping for.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Possibly, we all have high points and low points in our creative cycles. This may be the reason \u003cspan class=\"fx\">why we have &quot;good days&quot; and &quot;bad days&quot; at work\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 In today's digital environment, appearing in the mainstream news is still an important way \u003cspan class=\"fx\">that citizens can communicate with a broader community about events and issues\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 The best picture books contain words and pictures that complement each other and are dependent upon each other to the point \u003cspan class=\"fx\">that one would be ineffective without the other\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 The food industry has made a fortune because we retain Stone Age bodies that crave sugar but live in a Space Age world \u003cspan class=\"fx\">where sugar is cheap and plentiful\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Friendship is born at that moment \u003cspan class=\"fx\">when one says to another, &quot;What! You too? I thought I was the only one.&quot;\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"관계부사절은 명사 바로 뒤에서 그 명사의 의미를 구체적으로 설명해 주는 역할을 해요. 관계부사 뒤에는 주어, 동사, 목적어 등이 모두 갖춰진 완전한 형태의 문장이 온다는 점을 꼭 기억해 두세요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 We are living in the first century \u003cspan class=\"fx\">when the greatest skills will come from human actions rather than from nature\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We are living in the first century \u003c/div>\u003cdiv class=\"k\">우리는 첫 번째 세기에 살고 있다\u003c/div>\u003cdiv class=\"e\">when the greatest skills will come from human actions \u003c/div>\u003cdiv class=\"k\">가장 위대한 기술들이 인간의 행동에서 생겨날\u003c/div>\u003cdiv class=\"e\">rather than from nature.\u003c/div>\u003cdiv class=\"k\">자연으로부터라기보다는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계부사 when이 이끄는 절 when ~ nature가 선행사 the first century를 수식한다. A rather than B 구문은 B라기보다는 A를 의미한다.\u003c/div>","segs":[{"n":3,"text":"We are living in the first century, 우리는 첫 번째 세기에 살고 있다. when the greatest skills will come from human actions, 가장 위대한 기술들이 인간의 행동에서 생겨날. rather than from nature, 자연으로부터라기보다는","hl":"ch"},{"n":4,"text":"첫 번째 문장을 보면 관계부사 when이 이끄는 절이 앞의 선행사 the first century를 수식하고 있어요. 여기서 rather than은 B라기보다는 A라는 뜻으로 쓰였죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 We are living in the first century \u003cspan class=\"fx\">when the greatest skills will come from human actions rather than from nature\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인간의 기술 발전이 자연의 섭리를 넘어 인간 자체의 행동 양식에 의해 좌우되는 새로운 시대가 도래했음을 보여준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rather than from nature\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">instead of from the natural world\u003c/span>\u003cdiv class=\"w\">rather than을 대신해 전치사구 instead of를 사용하여 의미를 명확히 했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">come from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">originate from\u003c/span>\u003cspan class=\"y-eq\">come from = originate from\u003c/span>\u003cdiv class=\"w\">생겨나다와 유래하다의 의미를 가진 표현으로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rather than\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">instead of\u003c/span>\u003cspan class=\"y-eq\">rather than = instead of\u003c/span>\u003cdiv class=\"w\">~라기보다는 라는 의미의 유의어로 대체했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We currently exist in an initial century where human actions, rather than the natural environment, generate the most supreme skills.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"자연의 힘보다 인간의 주도적인 행동이 위대한 기술을 만들어내는 시대에 우리가 살고 있다는 함축적인 의미를 담고 있어요.","hl":"mn"},{"n":6,"text":"rather than from nature를 instead of from the natural world로 바꾸어 쓸 수 있어요.","hl":"rw"},{"n":7,"text":"come from은 originate from으로, rather than은 instead of로 바꿔 쓸 수 있으니 함께 기억해 주세요.","hl":"ph"},{"n":8,"text":"이 문장을 패러프레이징한 We currently exist in an initial century where human actions, rather than the natural environment, generate the most supreme skills 문장을 통해 의미를 다시 한번 확인해 보세요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02  Competition becomes a zero sum game \u003cspan class=\"fx\">where one organization can only win at the expense of others\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Competition becomes a zero sum game \u003c/div>\u003cdiv class=\"k\">경쟁은 제로섬 게임이 된다\u003c/div>\u003cdiv class=\"e\">where one organization can only win \u003c/div>\u003cdiv class=\"k\">한 조직만 이길 수 있는\u003c/div>\u003cdiv class=\"e\">at the expense of others.\u003c/div>\u003cdiv class=\"k\">다른 조직들의 희생으로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계부사 where가 이끄는 절 where ~ others가 선행사 a zero sum game을 수식한다. 여기서 where는 추상적 상황을 나타내는 선행사에 쓰였다.\u003c/div>","segs":[{"n":9,"text":"Competition becomes a zero sum game, 경쟁은 제로섬 게임이 된다. where one organization can only win, 한 조직만 이길 수 있는. at the expense of others, 다른 조직들의 희생으로","hl":"ch"},{"n":10,"text":"두 번째 문장에서는 관계부사 where가 추상적인 개념인 a zero sum game을 수식하고 있어요. where는 장소뿐만 아니라 이런 추상적 상황에도 쓰인다는 것을 잊지 마세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02  Competition becomes a zero sum game \u003cspan class=\"fx\">where one organization can only win at the expense of others\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>한쪽의 승리가 반드시 다른 쪽의 패배나 손실을 전제로 하는 냉혹한 경쟁 구조를 비판적으로 드러낸다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at the expense of others\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">by sacrificing other organizations\u003c/span>\u003cdiv class=\"w\">전치사구 at the expense of를 동명사 표현으로 풀어서 설명했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">competition\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rivalry\u003c/span>\u003cspan class=\"y-eq\">competition = rivalry\u003c/span>\u003cdiv class=\"w\">경쟁이라는 명사를 유의어로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at the expense of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">at the cost of\u003c/span>\u003cspan class=\"y-eq\">at the expense of = at the cost of\u003c/span>\u003cdiv class=\"w\">~의 희생으로 라는 표현을 동의어로 교체했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Rivalry turns into a situation in which a single entity achieves victory only by sacrificing rival entities.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"누군가 성공하면 다른 누군가는 반드시 피해를 입는 치열한 경쟁의 단면을 잘 보여주는 문장이에요.","hl":"mn"},{"n":12,"text":"at the expense of others를 by sacrificing other organizations로 바꾸면 그 의미가 더 직관적으로 다가오죠.","hl":"rw"},{"n":13,"text":"competition은 rivalry로, at the expense of는 at the cost of로 바꾸어 쓸 수 있어요.","hl":"ph"},{"n":14,"text":"Rivalry turns into a situation in which a single entity achieves victory only by sacrificing rival entities 문장으로 패러프레이징된 내용을 이해해 보세요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 We are embarking on a time \u003cspan class=\"fx\">when each individual will have all their own medical data and the computing power to process it in the context of their own world\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We are embarking on a time \u003c/div>\u003cdiv class=\"k\">우리는 시기에 들어서고 있다\u003c/div>\u003cdiv class=\"e\">when each individual will have all their own medical data \u003c/div>\u003cdiv class=\"k\">개인 각자가 가지게 될 자기 자신의 모든 의료 정보와\u003c/div>\u003cdiv class=\"e\">and the computing power to process it \u003c/div>\u003cdiv class=\"k\">그리고 그것을 처리하는 컴퓨터 사용 능력을\u003c/div>\u003cdiv class=\"e\">in the context of their own world.\u003c/div>\u003cdiv class=\"k\">자기 자신의 세계라는 맥락 속에서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계부사 when이 이끄는 절이 선행사 a time을 수식한다. to process는 명사 the computing power를 수식하는 형용사적 용법의 to부정사이다.\u003c/div>","segs":[{"n":15,"text":"We are embarking on a time, 우리는 시기에 들어서고 있다. when each individual will have all their own medical data, 개인 각자가 가지게 될 자기 자신의 모든 의료 정보와. and the computing power to process it, 그리고 그것을 처리하는 컴퓨터 사용 능력을. in the context of their own world, 자기 자신의 세계라는 맥락 속에서","hl":"ch"},{"n":16,"text":"세 번째 문장에서는 관계부사 when이 a time을 수식하고 있죠. 뒤에 나오는 to부정사 to process는 앞의 the computing power를 꾸며주는 형용사적 용법이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 We are embarking on a time \u003cspan class=\"fx\">when each individual will have all their own medical data and the computing power to process it in the context of their own world\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>개개인이 자신의 건강 정보를 스스로 관리하고 분석할 수 있는 맞춤형 디지털 의료 시대의 도래를 의미한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">embarking on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">entering into\u003c/span>\u003cdiv class=\"w\">embark on의 의미를 풀어서 자연스럽게 교체했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">embark on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">start on\u003c/span>\u003cspan class=\"y-eq\">embar  life events and the drive to satisfy fundamental human requirements 문장으로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 We look forward to the time \u003cspan class=\"fx\">when the Power of Love will replace the Love of Power\u003c/span>. Then will our world know the blessings of peace.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We look forward to the time \u003c/div>\u003cdiv class=\"k\">우리는 때를 기대한다\u003c/div>\u003cdiv class=\"e\">when the Power of Love will replace the Love of Power. \u003c/div>\u003cdiv class=\"k\">사랑의 힘이 힘에 대한 사랑을 대체할\u003c/div>\u003cdiv class=\"e\">Then will our world know the blessings of peace.\u003c/div>\u003cdiv class=\"k\">그때는 우리 세계가 평화의 축복을 알게 될 것이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계부사 when이 이끄는 절이 선행사 the time을 수식한다. 두 번째 문장에서는 부사 Then의 도치로 조동사 will이 주어 앞으로 이동했다.\u003c/div>","segs":[{"n":33,"text":"We look forward to the time, 우리는 때를 기대한다. when the Power of Love will replace the Love of Power, 사랑의 힘이 힘에 대한 사랑을 대체할. Then will our world know the blessings of peace, 그때는 우리 세계가 평화의 축복을 알게 될 것이다","hl":"ch"},{"n":34,"text":"여섯 번째 문장에서는 when이 the time을 수식하고 있고, 두 번째 문장에서는 부사 Then 때문에 조동사 will과 주어 our world가 도치되었어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 We look forward to the time \u003cspan class=\"fx\">when the Power of Love will replace the Love of Power\u003c/span>. Then will our world know the blessings of peace.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>지배하려는 권력욕이 사라지고 이타적인 사랑이 세상을 지배하는 평화로운 미래를 갈망하는 메시지이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb quot;bad days&quot; at work.\u003c/div>\u003cdiv class=\"k\">우리가 근무 중에 '좋은 날'과 '나쁜 날'이 있는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계부사 why가 이끄는 절이 선행사 the reason을 수식한다. 창의적 주기의 기복이 직장 생활의 성취도에 영향을 준다는 인과관계를 나타낸다.\u003c/div>","segs":[{"n":45,"text":"Possibly, we all have high points and low points in our creative cycles, 아마 / 우리 모두는 높은 지점과 낮은 지점을 지니고 있다 / 우리의 창의적인 주기에. This may be the reason, 이것은 이유일 수도 있다. why we have \"good days\" and \"bad days\" at work, 우리가 근무 중에 '좋은 날'과 '나쁜 날'이 있는","hl":"ch"},{"n":46,"text":"여덟 번째 문장에서는 관계부사 why가 앞의 선행사 the reason을 수식하고 있어요. 창의성의 기복이 일터에서의 좋은 날과 나쁜 날을 만든다는 구조죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 Possibly, we all have high points and low points in our creative cycles. This may be the reason \u003cspan class=\"fx\">why we have &quot;good days&quot; and &quot;bad days&quot; at work\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>창의적 영감에도 오르내림이 존재하기 때문에 직장에서 느끼는 성취감이나 만족감 역시 날마다 달라질 수밖에 없음을 설명한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">This may be the reason\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">This could account for the fact\u003c/span>\u003cdiv class=\"w\">표현을 바꾸어 인과관계를 조금 더 세련되게 설명했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">possibly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">perhaps\u003c/span>\u003cspan class=\"y-eq\">possibly = perhaps\u003c/span>\u003cdiv class=\"w\">아마도라는 부사를 유의어로 교체했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cycle\u003 eract\u003c/span>\u003cspan class=\"y-eq\">communicate = interact\u003c/span>\u003cdiv class=\"w\">소통하다라는 동사를 유의어로 바꾸었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Within contemporary digital surroundings, securing a spot in prominent news media remains a vital method for citizens to engage a wider public regarding various matters.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"디지털 세상 속에서도 여전히 주류 언론에 나오는 것은 시민들이 넓은 사회와 의견을 나누는 강력한 방법이라는 뜻이에요.","hl":"mn"},{"n":54,"text":"appearing in the mainstream news를 gaining exposure in major media outlets로 바꾸어 세련미를 더했어요.","hl":"rw"},{"n":55,"text":"environment는 setting으로, communicate는 interact로 바꾸어 쓸 수 있어요.","hl":"ph"},{"n":56,"text":"Within contemporary digital surroundings, securing a spot in prominent news media remains a vital method for citizens to engage a wider public regarding various matters 문장으로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 The best picture books contain words and pictures that complement each other and are dependent upon each other to the point \u003cspan class=\"fx\">that one would be ineffective without the other\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The best picture books contain words and pictures \u003c/div>\u003cdiv class=\"k\">최고의 그림책은 단어와 그림을 담고 있다\u003c/div>\u003cdiv class=\"e\">that complement each other \u003c/div>\u003cdiv class=\"k\">서로를 보완하는\u003c/div>\u003cdiv class=\"e\">and are dependent upon each other \u003c/div>\u003cdiv class=\"k\">그리고 서로에 의존적이다\u003c/div>\u003cdiv class=\"e\">to the point \u003c/div>\u003cdiv class=\"k\">정도로\u003c/div>\u003cdiv class=\"e\">that one would be ineffective without the other.\u003c/div>\u003cdiv class=\"k\">하나가 다른 하나 없이는 효과가 없게 되는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계부사 that이 선행사 the point를 수식한다. 이 자리의 that은 관계부사 where를 대신하여 쓰였으며, 앞의 that은 주격 관계대명사이다.\u003c/div>","segs":[{"n":57,"text":"The best picture books contain words and pictures, 최고의 그림책은 단어와 그림을 담고 있다. that complement each other, 서로를 보완하는. and are dependent upon each other, 그리고 서로에 의존적이다. to the point, 정도로. that one would be ineffective without the other, 하나가 다른 하나 없이는 효과가 없게 되는","hl":"ch"},{"n":58,"text":"열 번째 문장에서는 that이 선행사 the point를 수식하고 있어요. 여기서 that은 where를 대신하는 관계부사이고, 앞의 that은 주격 관계대명사예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 The best picture books contain words and pictures that complement each other and are dependent upon each other to the point \u003cspan class=\"fx\">that one would be ineffective without the other\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>훌륭한 그림책은 글과 그림이 서로를 완벽하게 보완하여 어느 한쪽도 빠지면 그 가치를 잃어버리는 유기적인 결합체임을 뜻한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">complement each other\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">supplement one another\u003c/span>\u003cdiv class=\"w\">상호보완하다라는 표현을 동의어구로 바꾸었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">contain\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">include\u003c/span>\u003cspan class=\"y-eq\">contain = include\u003c/span>\u003cdiv class=\"w\">담고 있다라는 동사를 유의어로 교체했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dependent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">reliant\u003c/span>\u003cspan class=\"y-eq\">dependent = reliant\u003c/span>\u003cdiv class=\"w\">의존적인 이라는 형용사를 동의어로 교체했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Superior picture books feature text and illustrations that mutually enhance one another, relying so heavily on each other that either component alone loses its utility.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"좋은 그림책은 글과 그림이 뗄 수 없이 서로를 채워주어 한쪽만 있으면 의미가 없어지는 밀접한 관계라는 것을 강조해요.","hl":"mn"},{"n":60,"text":"complement each other를 supplement one another로 바꾸면 어휘 수준이 한층 높아져요.","hl":"rw"},{"n":61,"text":"contain은 include로, dependent는 reliant로 바꾸어 쓸 수 있답니다.","hl":"ph"},{"n":62,"text":"Superior picture books feature text and illustrations that mutually enhance one another, relying so heavily on each other that either component alone loses its utility 문장으로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 The food industry has made a fortune because we retain Stone Age bodies that crave sugar but live in a Space Age world \u003cspan class=\"fx\">where sugar is cheap and plentiful\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The food industry has made a fortune \u003c/div>\u003cdiv class=\"k\">식품 산업은 거액을 벌어왔다\u003c/div>\u003cdiv class=\"e\">because we retain Stone Age bodies \u003c/div>\u003cdiv class=\"k\">우리가 석기 시대의 신체를 유지하고 있기 때문에\u003c/div>\u003cdiv class=\"e\">that crave sugar \u003c/div>\u003cdiv class=\"k\">설탕을 간절히 원하는\u003c/div>\u003cdiv class=\"e\">but live in a Space Age world \u003c/div>\u003cdiv class=\"k\">하지만 우주 시대 세계에 살고 있기 때문에\u003c/div>\u003cdiv class=\"e\">where sugar is cheap and plentiful.\u003c/div>\u003cdiv class=\"k\">설탕이 저렴하고 풍부한\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계부사 where가 이끄는 절이 선행사 a Space Age world를 수식한다. 앞의 Stone Age bodies는 주격 관계대명사절의 수식을 받는다.\u003c/div>","segs":[{"n":63,"text":"The food industry has made a fortune, 식품 산업은 거액을 벌어왔다. because we retain Stone Age bodies, 우리가 석기 시대의 신체를 유지하고 있기 때문에. that crave sugar, 설탕을 간절히 원하는. but live in a Space Age world, 하지만 우주 시대 세계에 살고 있기 때문에. where sugar is cheap and plentiful, 설탕이 저렴하고 풍부한","hl":"ch"},{"n":64,"text":"열한 번째 문장에서는 where가 선행사 a Space Age world를 수식하고 있어요. 석기 시대의 몸을 가진 우리가 풍족한 현대 세계에 살고 있다는 구조죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 The food industry has made a fortune because we retain Stone Age bodies that crave sugar but live in a Space Age world \u003cspan class=\"fx\">where sugar is cheap and plentiful\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>원시적인 본능을 가진 우리의 신체와 설탕이 넘쳐나는 현대의 풍요로운 환경 사이의 부조화가 식품 산업의 폭발적인 수익으로 이어졌음을 비판한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">made a fortune\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">amassed enormous wealth\u003c/span>\u003cdiv class=\"w\">거액을 벌다라는 표현을 더 격식 있는 표현으로 바꾸었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">crave\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">desire\u003c/span>\u003cspan class=\"y-eq\">crave = desire\u003c/span>\u003cdiv class=\"w\">갈망하다라는 동사를 일반적인 유의어로 교체했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">plentiful\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">abundant\u003c/span>\u003cspan class=\"y-eq\">plentiful = abundant\u003 s":[{"n":71,"text":"나와 똑같은 마음을 가진 사람을 발견하고 깊은 공감을 나누는 그 순간에 비로소 진짜 우정이 시작된다는 따뜻한 메시지예요.","hl":"mn"},{"n":72,"text":"Friendship is born을 A genuine bond originates로 바꾸면 격식 있는 표현이 돼요.","hl":"rw"},{"n":73,"text":"moment는 instant로, only는 sole로 바꾸어 쓸 수 있답니다.","hl":"ph"},{"n":74,"text":"True companionship emerges precisely at the juncture when an individual remarks to a peer, \"Really? You as well? I believed I stood entirely alone.\" 문장으로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 25 명사 + 관계부사절\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>명사 바로 뒤에서 완전한 절을 이끌며 의미를 확장하는 \u003cb class=\"key\">관계부사절\u003c/b>의 다양한 쓰임과 선행사 수식 구조를 완벽하게 숙지했다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘 우리는 명사 뒤에서 완벽한 문장으로 의미를 더해주는 관계부사절을 마스터했어요. 다양한 선행사와 관계부사의 짝꿍들을 잘 복습해서 수능 시험장에서 실력을 발휘해 보기를 바랄게요. 수고 많았어요.","hl":"sum"}]}]});</script></body></html>
