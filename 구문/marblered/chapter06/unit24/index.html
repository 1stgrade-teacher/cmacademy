.y-chunks .e{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600;font-size:17px;border-right:1px solid #EEF3F3;background:#FBFEFE}
.y-chunks .k{color:var(--pk-t);font-size:15px;font-weight:600}
.y-box{border-radius:4px;padding:10px 14px;margin-bottom:10px;font-size:15.5px;line-height:1.7}
.y-lb{display:inline-block;font-size:12.5px;font-weight:800;color:var(--pk-t);background:#fff;border:1px solid var(--pk-b,#B5DEDC);border-radius:3px;padding:0 8px;margin-right:8px;vertical-align:1px}
.y-st{background:var(--pk-ll);border-left:4px solid var(--pk)}
.y-mn{background:var(--am-l,#FFF3DC);border:1px solid var(--am-b,#F0D9A5)}
.y-mn .y-lb{color:var(--am-d,#8A5A00);border-color:var(--am-b,#F0D9A5)}
.y-cg{border:1px solid var(--pk-b,#B5DEDC)}
.y-pair{padding:6px 0 4px;border-top:1px dashed #E3E9EE}
.y-pair:first-of-type{border-top:0}
.y-pair .f{font-family:"Noto Serif KR",Georgia,serif;font-weight:600;color:#4A5866}
.y-pair .ar{color:var(--pk);margin:0 8px;font-weight:800}
.y-pair .t{font-family:"Noto Serif KR",Georgia,serif;font-weight:700;color:#1B2733;background:var(--pk-ll);padding:0 4px}
.y-pair .w{font-size:14px;color:#4A5866;margin-top:2px}
.y-eq{display:inline-block;margin-left:10px;font-size:12.5px;font-weight:700;color:#3A4FA3;border:1px solid #AEBBE6;border-radius:3px;padding:0 7px}
.y-pp{background:#F6F8FA;border-left:4px solid #3A4FA3}
.y-pp .y-lb{color:#3A4FA3;border-color:#AEBBE6}
.y-pp .p{font-family:"Noto Serif KR",Georgia,serif;font-size:18px;font-weight:700;margin-top:6px;line-height:1.55}
.y-list{display:grid;gap:6px;margin-top:4px}
.y-li{font-family:"Noto Serif KR",Georgia,serif;font-size:16px;line-height:1.6;display:block;padding-left:32px;text-indent:-32px}
.y-no{display:inline-block;text-indent:0;min-width:22px;height:20px;line-height:20px;text-align:center;border-radius:3px;background:var(--pk);color:#fff;font-family:sans-serif;font-size:12px;font-weight:800;margin-right:10px;vertical-align:1px}
@media (max-width:700px){.y-sen{font-size:18px}.y-chunks{grid-template-columns:1fr}.y-chunks .e{border-right:0}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"마법같은 블록구문 레드","title":"Unit 24 명사 + 전치사 + 관계대명사절 구문 분석 특강","audioDir":"audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 24 명사 + 전치사 + 관계대명사절\u003c/div>\u003ch1>Unit 24 명사 + 전치사 + 관계대명사절 구문 분석 특강\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>명사 뒤에서 전치사와 관계대명사가 이끄는 절이 수식하는 구조를 완벽하게 이해하고 수능 독해에 적용한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘 우리는 수능 독해에서 정말 자주 나오는 Unit 24 명사 + 전치사 + 관계대명사절 구조를 공부할 거예요. 명사 바로 뒤에 전치사와 whom이나 which가 나오고 그 뒤에 주어 동사가 이어지는 복잡한 문장 구조를 속시원하게 뚫어 볼 거랍니다. 자, 그럼 핵심 규칙부터 차근차근 함께 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">Unit 24 명사 + 전치사 + 관계대명사절\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">명사 뒤에 \u003cb class=\"key\">전치사 + 관계대명사(whom/which)\u003c/b>가 오면, 관계대명사절이 앞의 명사를 수식한다. 전치사가 관계대명사 바로 앞이나 관계사절의 끝에 올 수 있으며, 관계대명사가 생략되면 전치사는 문장 뒤에 남게 된다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Many authors today are creating fairy stories \u003cspan class=\"fx\">in which the heroines are more active\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 It is often difficult to get books back from people \u003cspan class=\"fx\">to whom you have lent them\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 Sincere apologies are for those that make them, not for those \u003cspan class=\"fx\">to whom they are made\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Even the exact same question can elicit very different responses depending on the context \u003cspan class=\"fx\">in which the question occurs\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 When a seed grows into a tree, it represents only a change in the degree to which its potential, always inherent in its original nature, is realized.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 I have but one lamp \u003cspan class=\"fx\">by which my feet are guided\u003c/span>, and that is the lamp of experience.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07  What makes a study scientific is not the nature of the things with which it is concerned, but the method by which it deals with those things.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 All human societies have economic systems \u003cspan class=\"fx\">within which goods and services are produced, distributed, and consumed\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 Spider-Man was a tremendous hit with readers because it gave millions of teenagers a hero \u003cspan class=\"fx\">with whom they could identify\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 The effectiveness of human society is largely dependent upon the clarity, accuracy, and efficiency \u003cspan class=\"fx\">with which language is used or understood\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Separation anxiety disorder is defined as excessive worry and fear about being apart from individuals \u003cspan class=\"fx\">to whom a child is most attached\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Social influence is the process \u003cspan class=\"fx\">by which individuals adapt their opinion, revise their beliefs, or change their behavior\u003c/span> as a result of social interactions with other people.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"이 유닛의 핵심은 명사를 꾸며주는 전치사 + 관계대명사 구조예요. 관계대명사가 전치사의 목적어로 쓰일 때 전치사는 관계대명사 바로 앞이나 절의 끝에 위치하게 되죠. 전치사가 관계대명사와 떨어져 있으면 관계대명사를 생략할 수도 있다는 점을 꼭 기억해 두세요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Many authors today are creating fairy stories \u003cspan class=\"fx\">in which the heroines are more active\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Many authors today are creating fairy stories\u003c/div>\u003cdiv class=\"k\">많은 작가들이 오늘날 동화를 창작하고 있다\u003c/div>\u003cdiv class=\"e\">in which the heroines are more active.\u003c/div>\u003cdiv class=\"k\">여주인공들이 보다 적극적인\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계대명사 which가 이끄는 절이 전치사 in의 목적어로 쓰였으며, 선행사 \u003cb class=\"key\">fairy stories\u003c/b>를 수식한다.\u003c/div>","segs":[{"n":3,"text":"Many authors today are creating fairy stories, 많은 작가들이 오늘날 동화를 창작하고 있다. in which the heroines are more active, 여주인공들이 보다 적극적인","hl":"ch"},{"n":4,"text":"첫 번째 문장에서는 which가 이끄는 절이 전치사 in과 함께 쓰여서 앞의 fairy stories를 수식하고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Many authors today are creating fairy stories \u003cspan class=\"fx\">in which the heroines are more active\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>현대 작가들이 과거의 수동적인 여성상에서 벗어나 주체적이고 능동적인 여성 캐릭터를 중심에 둔 동화를 많이 쓰고 있음을 나타낸다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in which the heroines are more active\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">where the heroines are more active\u003c/span>\u003cdiv class=\"w\">장소나 추상적인 공간을 나타내는 전치사구 in which는 관계부사 where로 바꾸어 쓸 수 있다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">author\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">writer\u003c/span>\u003cspan class=\"y-eq\">author = writer\u003c/span>\u003cdiv class=\"w\">글을 쓰는 창작자나 저자를 뜻하는 가장 대표적인 유의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fairy story\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fairy tale\u003c/span>\u003cspan class=\"y-eq\">fairy story = fairy tale\u003c/span>\u003cdiv class=\"w\">아이들을 위한 전래 동화나 환상적인 이야기를 뜻하는 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Nowadays, numerous writers are composing children's stories featuring more proactive female protagonists.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"여주인공들이 훨씬 더 적극적으로 움직이는 동화를 창작하고 있다는 뜻으로, 능동적인 인물 변화를 보여주죠.","hl":"mn"},{"n":6,"text":"여기서 in which를 장소를 나타내는 관계부사 where로 바꿔 쓸 수도 있다는 것을 알아두면 좋겠어요.","hl":"rw"},{"n":7,"text":"author는 writer로, fairy story는 fairy tale로 바꾸어 쓸 수 있다는 것도 같이 기억해 두세요.","hl":"ph"},{"n":8,"text":"따라서 이 문장은 현대 작가들이 더욱 주체적인 여성 주인공들이 등장하는 아동용 이야기를 짓고 있다는 의미로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 It is often difficult to get books back from people \u003cspan class=\"fx\">to whom you have lent them\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">It is often difficult to get books back\u003c/div>\u003cdiv class=\"k\">가주어 진주어 구문으로 책들을 돌려받는 것은 종종 어렵다\u003c/div>\u003cdiv class=\"e\">from people\u003c/div>\u003cdiv class=\"k\">사람들에게서\u003c/div>\u003cdiv class=\"e\">to whom you have lent them.\u003c/div>\u003cdiv class=\"k\">당신이 그것들을 빌려준\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계대명사 whom이 이끄는 절이 전치사 to의 목적어로 쓰였으며, 선행사 \u003cb class=\"key\">people\u003c/b>을 수식한다. It은 가주어, to get ~가 진주어이다.\u003c/div>","segs":[{"n":9,"text":"It is often difficult to get books back, 가주어 진주어 구문으로 책들을 돌려받는 것은 종종 어렵다. from people, 사람들에게서. to whom you have lent them, 당신이 그것들을 빌려준","hl":"ch"},{"n":10,"text":"두 번째 문장에서는 It과 to 이하를 연결하는 가주어 진주어 구문 속에 전치사 to와 whom이 쓰여서 people을 수식하고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 It is often difficult to get books back from people \u003cspan class=\"fx\">to whom you have lent them\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>책을 빌려간 사람에게 책을 다시 돌려받는 것이 일상에서 얼마나 번거롭고 어려운 일인지를 보여준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to whom you have lent them\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who you have lent them to\u003c/span>\u003cdiv class=\"w\">전치사 to를 관계사절의 끝으로 보내면서 whom을 who로 바꾸거나 생략할 수 있다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">lend\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">loan\u003c/span>\u003cspan class=\"y-eq\">lend = loan\u003c/span>\u003cdiv class=\"w\">물건이나 돈을 빌려주다라는 의미로 상호 교환 가능하게 쓰인다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">difficult\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">hard\u003c/span>\u003cspan class=\"y-eq\">difficult = hard\u003c/span>\u003cdiv class=\"w\">어렵고 힘든 상황을 나타내는 대표적인 형용사 동의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">It is frequently hard to retrieve books from individuals to whom you gave them on loan.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"내가 빌려준 책을 상대방에게 다시 돌려받는 일이 생각보다 쉽지 않다는 현실적인 경험을 담고 있답니다.","hl":"mn"},{"n":12,"text":"이때 전치사 to를 문장 끝으로 보내고 whom을 who로 바꾸거나 아예 생략할 수도 있다는 점을 잊지 마세요.","hl":"rw"},{"n":13,"text":"lend는 loan으로, difficult는 hard로 바꾸어 표현할 수 있다는 것도 꼭 챙겨 두세요.","hl":"ph"},{"n":14,"text":"결국 이 문장은 책을 빌려 갔던 사람들로부터 책을 회수하기란 종종 까다롭다는 말로 바꿔 쓸 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 Sincere apologies are for those that make them, not for those \u003cspan class=\"fx\">to whom they are made\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Sincere apologies are for those\u003c/div>\u003cdiv class=\"k\">진정한 사과는 사람들을 위한 것이다\u003c/div>\u003cdiv class=\"e\">that make them,\u003c/div>\u003cdiv class=\"k\">그것을 하는\u003c/div>\u003cdiv class=\"e\">not for those\u003c/div>\u003cdiv class=\"k\">사람들을 위한 것이 아니라\u003c/div>\u003cdiv class=\"e\">to whom they are made.\u003c/div>\u003cdiv class=\"k\">그것을 받는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계대명사 whom이 이끄는 절이 전치사 to의 목적어로 쓰였으며, 선행사 \u003cb class=\"key\">those\u003c/b>를 수식한다. 앞의 that make them은 주격 관계대명사절이다.\u003c/div>","segs":[{"n":15,"text":"Sincere apologies are for those, 진정한 사과는 사람들을 위한 것이다. that make them, 그것을 하는. not for those, 사람들을 위한 것이 아니라. to whom they are made, 그것을 받는","hl":"ch"},{"n":16,"text":"세 번째 문장에서는 that이 이끄는 주격 관계대명사절과 to whom이 이끄는 전치사구 절이 각각 앞의 those를 수식하며 대조를 이루고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 Sincere apologies are for those that make them, not for those \u003cspan class=\"fx\">to whom they are made\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>진정한 사과는 단순히 남에게 보여주기 위함이 아니라, 사과하는 사람 스스로의 반성과 책임 의식을 위해 중요하다는 깊은 뜻을 담고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to whom they are made\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who receive them\u003c/span>\u003cdiv class=\"w\">전치사구 수식 구조를 능동태 형태의 관계대명사절로 바꾸어 표현할 수 있다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sincere\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">genuine\u003c/span>\u003cspan class=\"y-eq\">sincere = genuine\u003c/span>\u003cdiv class=\"w\">진심 어린, 진정한이라는 뜻을 가진 대표적인 유의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">apology\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">expression of regret\u003c/span>\u003cspan class=\"y-eq\">apology = expression of regret\u003c/span>\u003cdiv class=\"w\">사과라는 명사를 풀어서 유감의 표현이라는 의미로 확장할 수 있다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Heartfelt apologies exist for the sake of the person offering them, rather than the recipient.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"진정한 사과는 사과를 건네는 주체의 반성을 위한 것이지, 단순히 사과를 받는 상대방만을 위한 게 아니라는 의미예요.","hl":"mn"},{"n":18,"text":"여기서 to whom they are made를 능동 형태인 who receive them으로 바꾸어 표현할 수도 있답니다.","hl":"rw"},{"n":19,"text":"sincere는 genuine으로, apology는 expression of regret이라는 표현으로 바꾸어 쓸 수 있어요.","hl":"ph"},{"n":20,"text":"즉, 진심 어린 사과는 사과를 하는 사람 자신의 내면적 성장을 위해 필요하다는 뜻으로 패러프레이징이 가능해요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Even the exact same question can elicit very different responses depending on the context \u003cspan class=\"fx\">in which the question occurs\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Even the exact same question can elicit very different responses\u003c/div>\u003cdiv class=\"k\">완전히 똑같은 질문조차도 매우 다른 반응을 이끌어 낼 수 있다\u003c/div>\u003cdiv class=\"e\">depending on the context\u003c/div>\u003cdiv class=\"k\">상황에 따라서\u003c/div>\u003cdiv class=\"e\">in which the question occurs.\u003c/div>\u003cdiv class=\"k\">그 질문이 떠오르는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계대명사 which가 이끄는 절이 전치사 in의 목적어로 쓰였으며, 선행사 \u003cb class=\"key\">the context\u003c/b>를 수식한다.\u003c/div>","segs":[{"n":21,"text":"Even the exact same question can elicit very different responses, 완전히 똑같은 질문조차도 매우 다른 반응을 이끌어 낼 수 있다. depending on the context, 상황에 따라서. in which the question occurs, 그 질문이 떠오르는","hl":"ch"},{"n":22,"text":"네 번째 문장에서는 in which가 이끄는 절이 앞의 the context를 꾸며주면서 상황적 맥락의 중요성을 보여주고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Even the exact same question can elicit very different responses depending on the context \u003cspan class=\"fx\">in which the question occurs\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>어떤 질문을 던지느냐보다 어떤 상황과 맥락 속에서 그 질문이 주어지느냐가 반응을 결정하는 핵심 요인임을 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in which the question occurs\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">where the question takes place\u003c/span>\u003cdiv class=\"w\">전치사구 in which를 관계부사 where로 바꾸고 occur를 take place로 동의어 처리한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">elicit\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">draw out\u003c/span>\u003cspan class=\"y-eq\">elicit = draw out\u003c/span>\u003cdiv class=\"w\">반응이나 정보 등을 이끌어 내다라는 의미로 자주 쓰이는 구동사이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">context\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">situation\u003c/span>\u003cspan class=\"y-eq\">context = situation\u003c/span>\u003cdiv class=\"w\">상황이나 전후 맥락을 뜻하는 실생활 빈출 유의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Identical inquiries may provoke completely varying reactions contingent upon the surrounding circumstances.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"똑같은 질문이라도 어떤 상황에서 주어지느냐에 따라 사람들의 반응이 완전히 달라질 수 있다는 뜻이지요.","hl":"mn"},{"n":24,"text":"여기서 in which를 where로 바꾸고 occur를 take place라는 표현으로 바꾸어 쓸 수도 있어요.","hl":"rw"},{"n":25,"text":"elicit은 draw out으로, context는 situation으로 바꾸어 쓸 수 있다는 것을 기억해 주세요.","hl":"ph"},{"n":26,"text":"따라서 이 문장은 주변의 상황적 여건에 따라 똑같은 질문도 전혀 다른 답변을 유발할 수 있다는 말로 바꿀 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 When a seed grows into a tree, it represents only a change in the degree to which its potential, always inherent in its original nature, is realized.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">When a seed grows into a tree,\u003c/div>\u003cdiv class=\"k\">씨앗이 나무로 성장할 때\u003c/div>\u003cdiv class=\"e\">it represents only a change in the degree\u003c/div>\u003cdiv class=\"k\">그것은 단지 변화를 나타낸다 정도에 있어서\u003c/div>\u003cdiv class=\"e\">to which its potential,\u003c/div>\u003cdiv class=\"k\">그것의 잠재력이\u003c/div>\u003cdiv class=\"e\">always inherent in its original nature,\u003c/div>\u003cdiv class=\"k\">늘 그것의 원래의 본성 속에 내재된\u003c/div>\u003cdiv class=\"e\">is realized.\u003c/div>\u003cdiv class=\"k\">실현되는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계대명사 which가 이끄는 절이 전치사 to의 목적어로 쓰였으며, 선행사 \u003cb class=\"key\">the degree\u003c/b>를 수식한다. 주어와 동사 사이에 삽입구가 들어가 있다.\u003c/div>","segs":[{"n":27,"text":"When a seed grows into a tree, 씨앗이 나무로 성장할 때. it represents only a change in the degree, 그것은 단지 변화를 나타낸다 정도에 있어서. to which its potential, 그것의 잠재력이. always inherent in its original nature, 늘 그것의 원래의 본성 속에 내재된. is realized, 실현되는","hl":"ch"},{"n":28,"text":"다섯 번째 문장에서는 to which가 degree를 수식하고 있고, 그 주어와 동사 사이에 항상 내재되어 있다는 수식어가 길게 삽입되어 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 When a seed grows into a tree, it represents only a change in the degree to which its potential, always inherent in its original nature, is realized.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>씨앗이 나무가 되는 과정은 새로운 무언가가 생겨나는 것이 아니라, 본래부터 지니고 있던 잠재력이 어느 정도까지 현실화되었는가의 차이일 뿐임을 의미한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">its potential ... is realized\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">its latent capacity is actualized\u003c/span>\u003cdiv class=\"w\">핵심 명사와 동사를 각각 latent capacity와 actualized라는 고급 어휘로 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">potential\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">capacity\u003c/span>\u003cspan class=\"y-eq\">potential = capacity\u003c/span>\u003cdiv class=\"w\">내재된 잠재력이나 능력을 뜻하는 세련된 유의어 관계이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">inherent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">innate\u003c/span>\u003cspan class=\"y-eq\">inherent = innate\u003c/span>\u003cdiv class=\"w\">타고난, 본래부터 가지고 있는 이라는 의미의 동의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">As a seed develops into a timber, it merely signifies a variation in the extent to which its intrinsic capabilities come to fruition.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"씨앗이 나무로 자라나는 것은 본래 가지고 있던 잠재력이 얼마나 실현되었는가의 정도 차이를 보여줄 뿐이라는 심오한 의미랍니다.","hl":"mn"},{"n":30,"text":"여기서 potential은 latent capacity로, is realized는 is actualized로 바꾸어 표현할 수 있어요.","hl":"rw"},{"n":31,"text":"potential은 capacity로, inherent는 innate라는 단어로 바꾸어 쓸 수 있다는 점을 기억해 두세요.","hl":"ph"},{"n":32,"text":"결국 이 문장은 나무로 자라는 씨앗은 본래의 본성 속 잠재력이 발현되는 정도의 변화를 상징한다는 뜻으로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 I have but one lamp \u003cspan class=\"fx\">by which my feet are guided\u003c/span>, and that is the lamp of experience.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I have but one lamp\u003c/div>\u003cdiv class=\"k\">나는 오직 하나의 램프를 가지고 있다\u003c/div>\u003cdiv class=\"e\">by which my feet are guided,\u003c/div>\u003cdiv class=\"k\">그것으로 나의 발이 인도되는\u003c/div>\u003cdiv class=\"e\">and that is the lamp of experience.\u003c/div>\u003cdiv class=\"k\">그리고 그것은 경험의 램프이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계대명사 which가 이끄는 절이 전치사 by의 목적어로 쓰였으며, 선행사 \u003cb class=\"key\">one lamp\u003c/b>를 수식한다.\u003c/div>","segs":[{"n":33,"text":"I have but one lamp, 나는 오직 하나의 램프를 가지고 있다. by which my feet are guided, 그것으로 나의 발이 인도되는. and that is the lamp of experience, 그리고 그것은 경험의 램프이다","hl":"ch"},{"n":34,"text":"여섯 번째 문장에서는 by which가 one lamp를 수식하면서 나의 발걸음을 이끌어 주는 도구를 설명하고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 I have but one lamp \u003cspan class=\"fx\">by which my feet are guided\u003c/span>, and that is the lamp of experience.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자신의 삶을 이끌어 주는 유일한 길잡이는 이론이나 추측이 아니라 오직 직접 겪고 배운 경험뿐이라는 강한 신념을 표현한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by which my feet are guided\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">which guides my feet\u003c/span>\u003cdiv class=\"w\">수동태 표현인 전치사구 구조를 능동형 관계대명사절로 깔끔하게 전환한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">but\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">only\u003c/span>\u003cspan class=\"y-eq\">but = only\u003c/span>\u003cdiv class=\"w\">단지, 오직이라는 뜻으로 쓰인 한정사의 의미를 명확히 한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">guide\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lead\u003c/span>\u003cspan class=\"y-eq\">guide = lead\u003c/span>\u003cdiv class=\"w\">방향을 이끌고 안내하다라는 의미의 대표적인 유의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I possess a solitary guiding light for my path, which is none other than the light of lived experience.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"내 삶의 걸음을 인도하는 등불은 오직 하나뿐인데, 그게 바로 경험이라는 이름의 등불이라는 뜻의 명문장이죠.","hl":"mn"},{"n":36,"text":"수동태로 된 by which my feet are guided를 능동형인 which guides my feet으로 간단히 바꿀 수도 있어요.","hl":"rw"},{"n":37,"text":"여기서 but은 only로, guide는 lead라는 단어로 바꾸어 쓸 수 있다는 것을 알아두세요.","hl":"ph"},{"n":38,"text":"즉, 이 문장은 나를 인도하는 오직 하나의 길잡이는 살아있는 경험이라는 의미로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07  What makes a study scientific is not the nature of the things with which it is concerned, but the method by which it deals with those things.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">What makes a study scientific\u003c/div>\u003cdiv class=\"k\">어떤 연구를 과학적으로 만드는 것은\u003c/div>\u003cdiv class=\"e\">is not the nature of the things\u003c/div>\u003cdiv class=\"k\">사물의 본성이 아니다\u003c/div>\u003cdiv class=\"e\">with which it is concerned,\u003c/div>\u003cdiv class=\"k\">그것이 관계된\u003c/div>\u003cdiv class=\"e\">but the method\u003c/div>\u003cdiv class=\"k\">방식이다\u003c/div>\u003cdiv class=\"e\">by which it deals with those things.\u003c/div>\u003cdiv class=\"k\">그것이 그러한 사물들을 다루는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>전치사 with의 목적어인 \u003cb class=\"key\">which\u003c/b>절과 전치사 by의 목적어인 \u003cb class=\"key\">which\u003c/b>절이 각각 the things와 the method를 수식한다. not A but B 구문이다.\u003c/div>","segs":[{"n":39,"text":"What makes a study scientific, 어떤 연구를 과학적으로 만드는 것은. is not the nature of the things, 사물의 본성이 아니다. with which it is concerned, 그것이 관계된. but the method, 방식이다. by which it deals with those things, 그것이 그러한 사물들을 다루는","hl":"ch"},{"n":40,"text":"일곱 번째 문장에서는 with which절과 by which절이 각각 the things와 the method를 수식하면서 not A but B로 대조를 이루고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07  What makes a study scientific is not the nature of the things with which it is concerned, but the method by which it deals with those things.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>연구 대상이 무엇인가가 중요한 게 아니라, 그 대상에 접근하고 다루는 방법론이 얼마나 과학적이냐가 진짜 과학을 결정한다는 통찰을 준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is not the nature ... but the method\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">depends not on the subject matter, but on the methodology\u003c/span>\u003cdiv class=\"w\">문장의 핵심 대조 구조를 명사구와 전치사구를 활용해 더욱 학술적으로 표현한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be concerned with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be involved with\u003c/span>\u003cspan class=\"y-eq\">be concerned with = be involved with\u003c/span>\u003cdiv class=\"w\">~와 관계가 있다, 연관되다라는 의미의 유의어 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">deal with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">handle\u003c/span>\u003cspan class=\"y-eq\">deal with = handle\u003c/span>\u003cdiv class=\"w\">문제나 대상을 다루고 처리하다라는 뜻의 빈출 동의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The scientific validity of a study relies not upon its subject matter, but upon its procedural approach.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"연구를 과학적으로 만드는 것은 어떤 대상을 다루느냐가 아니라, 그 대상을 다루는 방법 그 자체라는 뜻이에요.","hl":"mn"},{"n":42,"text":"여기서 not A but B 대조 구조를 활용해 대상이 아니라 방법론에 집중한다는 의미로 세련되게 바꿀 수 있답니다.","hl":"rw"},{"n":43,"text":"be concerned with는 be involved with로, deal with는 handle로 바꾸어 쓸 수 있어요.","hl":"ph"},{"n":44,"text":"따라서 이 문장은 연구의 과학성은 다루는 소재에 달린 것이 아니라 그것을 다루는 연구 방법에 달려 있다는 말로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 All human societies have economic systems \u003cspan class=\"fx\">within which goods and services are produced, distributed, and consumed\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">All human societies have economic systems\u003c/div>\u003cdiv class=\"k\">모든 인간 사회는 경제 체제를 가지고 있다\u003c/div>\u003cdiv class=\"e\">within which goods and services\u003c/div>\u003cdiv class=\"k\">그 안에서 재화와 서비스가\u003c/div>\u003cdiv class=\"e\">are produced, distributed, and consumed.\u003c/div>\u003cdiv class=\"k\">만들어지고 분배되고 그리고 소비되는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>전치사 within의 목적어로 쓰인 관계대명사절 \u003cb class=\"key\">which\u003c/b> ~가 economic systems를 수식한다.\u003c/div>","segs":[{"n":45,"text":"All human societies have economic systems, 모든 인간 사회는 경제 체제를 가지고 있다. within which goods and services, 그 안에서 재화와 서비스가. are produced, distributed, and consumed, 만들어지고 분배되고 그리고 소비되는","hl":"ch"},{"n":46,"text":"여덟 번째 문장에서는 within which가 이끄는 절이 economic systems라는 명사를 뒤에서 멋지게 꾸며주고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 All human societies have economic systems \u003cspan class=\"fx\">within which goods and services are produced, distributed, and consumed\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인간 사회라면 예외 없이 생산, 분배, 소비라는 경제적 활동이 이루어지는 구조적 틀을 지니고 있음을 설명한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">within which\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">where\u003c/span>\u003cdiv class=\"w\">추상적인 체제 내부의 공간적 의미를 나타내므로 관계부사 where로 대체할 수 있다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">produce\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">manufacture\u003c/span>\u003cspan class=\"y-eq\">produce = manufacture\u003c/span>\u003cdiv class=\"w\">상품이나 재화를 생산하고 제조하다라는 의미의 유의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">consume\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">utilize\u003c/span>\u003cspan class=\"y-eq\">consume = utilize\u003c/span>\u003cdiv class=\"w\">자원이나 상품을 소비하고 이용하다라는 뜻을 나타낸다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Every human community features financial frameworks in which commodities are generated, allocated, and used.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"모든 인간 사회에는 물건과 서비스가 만들어지고 나누어지며 쓰이는 경제적 틀이 마련되어 있다는 뜻이지요.","hl":"mn"},{"n":48,"text":"여기서 within which를 관계부사 where로 바꾸어 쓰면 문장이 한결 깔끔해진답니다.","hl":"rw"},{"n":49,"text":"produce는 manufacture로, consume은 utilize나 consume으로 바꾸어 표현할 수 있어요.","hl":"ph"},{"n":50,"text":"즉, 이 문장은 모든 인류 사회는 재화와 용역의 생산 및 소비가 이루어지는 경제 구조를 지닌다는 말로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 Spider-Man was a tremendous hit with readers because it gave millions of teenagers a hero \u003cspan class=\"fx\">with whom they could identify\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Spider-Man was a tremendous hit with readers\u003c/div>\u003cdiv class=\"k\">스파이더맨은 독자들에게 엄청난 히트였다\u003c/div>\u003cdiv class=\"e\">because it gave millions of teenagers\u003c/div>\u003cdiv class=\"k\">그것이 수백만의 십 대들에게 영웅을 선사했기 때문에\u003c/div>\u003cdiv class=\"e\">a hero\u003c/div>\u003cdiv class=\"k\">영웅을\u003c/div>\u003cdiv class=\"e\">with whom they could identify.\u003c/div>\u003cdiv class=\"k\">그들이 동일시할 수 있었던\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>전치사 with의 목적어로 쓰인 관계대명사절 \u003cb class=\"key\">whom\u003c/b> ~가 a hero를 수식한다.\u003c/div>","segs":[{"n":51,"text":"Spider-Man was a tremendous hit with readers, 스파이더맨은 독자들에게 엄청난 히트였다. because it gave millions of teenagers, 그것이 수백만의 십 대들에게 영웅을 선사했기 때문에. a hero, 영웅을. with whom they could identify, 그들이 동일시할 수 있었던","hl":"ch"},{"n":52,"text":"아홉 번째 문장에서는 with whom이 이끄는 절이 a hero를 수식하며 십 대들의 공감대를 강조하고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 Spider-Man was a tremendous hit with readers because it gave millions of teenagers a hero \u003cspan class=\"fx\">with whom they could identify\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>완벽하고 초월적인 영웅이 아니라 우리와 똑같이 고민하고 흔들리는 십 대 영웅의 모습에 독자들이 깊이 공감하고 열광했음을 보여준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">with whom they could identify\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who they could relate to\u003c/span>\u003cdiv class=\"w\">전치사구를 문장 끝으로 보내고 identify with를 relate to라는 구동사로 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">tremendous\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">immense\u003c/span>\u003cspan class=\"y-eq\">tremendous = immense\u003c/span>\u003cdiv class=\"w\">어마어마하고 엄청난 규모나 인기를 나타내는 유의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">identify with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">relate to\u003c/span>\u003cspan class=\"y-eq\">identify with = relate to\u003c/span>\u003cdiv class=\"w\">~와 공감하다, 동일시하다라는 뜻의 실생활 필수 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The Spider-Man franchise achieved massive popularity among audiences by offering countless youths a protagonist with whom they found personal resonance.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"스파이더맨이 독자들에게 대단한 인기를 끌었던 이유는 바로 자신과 똑같이 감정적으로 동질감을 느낄 수 있는 영웅이었기 때문이에요.","hl":"mn"},{"n":54,"text":"여기서 with whom they could identify를 문장 끝에 전치사를 두고 who they could relate to로 바꾸어 쓸 수도 있어요.","hl":"rw"},{"n":55,"text":"tremendous는 immense로, identify with는 relate to라는 표현으로 바꾸어 쓸 수 있다는 것을 기억하세요.","hl":"ph"},{"n":56,"text":"따라서 이 문장은 스파이더맨이 수많은 청소년들에게 자신을 투영할 수 있는 영웅을 안겨주어 폭발적인 사랑을 받았다는 말로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 The effectiveness of human society is largely dependent upon the clarity, accuracy, and efficiency \u003cspan class=\"fx\">with which language is used or understood\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The effectiveness of human society\u003c/div>\u003cdiv class=\"k\">인간 사회의 유효성은\u003c/div>\u003cdiv class=\"e\">is largely dependent upon\u003c/div>\u003cdiv class=\"k\">크게 의존한다\u003c/div>\u003cdiv class=\"e\">the clarity, accuracy, and efficiency\u003c/div>\u003cdiv class=\"k\">명확성, 정확성, 그리고 효율성에\u003c/div>\u003cdiv class=\"e\">with which language is used or understood.\u003c/div>\u003cdiv class=\"k\">언어가 사용되거나 이해되는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>전치사 with의 목적어로 쓰인 관계대명사절 \u003cb class=\"key\">which\u003c/b> ~가 선행사 the clarity, accuracy, and efficiency를 수식한다.\u003c/div>","segs":[{"n":57,"text":"The effectiveness of human society, 인간 사회의 유효성은. is largely dependent upon, 크게 의존한다. the clarity, accuracy, and efficiency, 명확성, 정확성, 그리고 효율성에. with which language is used or understood, 언어가 사용되거나 이해되는","hl":"ch"},{"n":58,"text":"열 번째 문장에서는 with which가 이끄는 절이 명사구인 명확성과 정확성, 효율성을 뒤에서 수식하고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 The effectiveness of human society is largely dependent upon the clarity, accuracy, and efficiency \u003cspan class=\"fx\">with which language is used or understood\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인간 사회가 얼마나 잘 작동하고 발전하는가는 결국 우리가 사용하는 언어가 얼마나 명확하고 정확하며 효율적인가에 달려 있다는 점을 역설한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is largely dependent upon\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">relies heavily on\u003c/span>\u003cdiv class=\"w\">수동태 형용사구 표현을 능동형 동사구로 바꾸어 문장을 간결하게 만든다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dependent upon\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">reliant on\u003c/span>\u003cspan class=\"y-eq\">dependent upon = reliant on\u003c/span>\u003cdiv class=\"w\">~에 의존하는 이라는 뜻의 형용사구 유의어 관계이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">efficiency\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">effectiveness\u003c/span>\u003cspan class=\"y-eq\">efficiency = effectiveness\u003c/span>\u003cdiv class=\"w\">능률과 효과성을 나타내는 밀접한 유의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Human community performance heavily hinges on how clearly, precisely, and effectively communication is conveyed and comprehended.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"인간 사회가 원활하게 기능하는 핵심 비결은 바로 언어가 얼마나 정확하고 명료하게 쓰이고 이해되느냐에 달려 있다는 뜻이지요.","hl":"mn"},{"n":60,"text":"여기서 is largely dependent upon을 relies heavily on이라는 능동형 동사구로 바꾸어 표현할 수도 있답니다.","hl":"rw"},{"n":61,"text":"dependent upon은 reliant on으로 바꾸어 쓸 수 있으며 efficiency도 함께 눈여겨보세요.","hl":"ph"},{"n":62,"text":"즉, 이 문장은 사회의 성패는 언어 사용의 명료성과 정확성, 효율성에 크게 좌우된다는 말로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 Separation anxiety disorder is defined as excessive worry and fear about being apart from individuals \u003cspan class=\"fx\">to whom a child is most attached\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Separation anxiety disorder is defined as excessive worry and fear\u003c/div>\u003cdiv class=\"k\">분리 불안 장애는 과도한 걱정과 두려움으로 정의된다\u003c/div>\u003cdiv class=\"e\">about being apart from individuals\u003c/div>\u003cdiv class=\"k\">사람들과 떨어져 있는 것에 대한\u003c/div>\u003cdiv class=\"e\">to whom a child is most attached.\u003c/div>\u003cdiv class=\"k\">아이가 가장 애착을 가지고 있는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>전치사 to의 목적어로 쓰인 관계대명사절 \u003cb class=\"key\">whom\u003c/b> ~가 선행사 individuals를 수식한다.\u003c/div>","segs":[{"n":63,"text":"Separation anxiety disorder is defined as excessive worry and fear, 분리 불안 장애는 과도한 걱정과 두려움으로 정의된다. about being apart from individuals, 사람들과 떨어져 있는 것에 대한. to whom a child is most attached, 아이가 가장 애착을 가지고 있는","hl":"ch"},{"n":64,"text":"열한 번째 문장에서는 to whom이 이끄는 절이 individuals를 수식하면서 분리불안의 대상을 구체적으로 짚어주고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 Separation anxiety disorder is defined as excessive worry and fear about being apart from individuals \u003cspan class=\"fx\">to whom a child is most attached\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>아이들이 주 양육자나 애착 대상과 떨어지게 될 때 느끼는 비정상적으로 심한 불안과 공포 상태를 심리학적으로 설명하고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to whom a child is most attached\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who the child is closest to\u003c/span>\u003cdiv class=\"w\">전치사를 문장 끝으로 보내고 be attached to를 close to라는 표현으로 바꾼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">separation anxiety\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">detachment distress\u003c/span>\u003cspan class=\"y-eq\">separation anxiety = detachment distress\u003c/span>\u003cdiv class=\"w\">분리될 때 느끼는 불안과 고통을 뜻하는 전문적 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be attached to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be bonded with\u003c/span>\u003cspan class=\"y-eq\">be attached to = be bonded with\u003c/span>\u003cdiv class=\"w\">~에 애착을 느끼고 유대감을 형성하다라는 의미의 유의어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The psychological condition of separation anxiety involves disproportionate dread regarding distancing oneself from primary figures of emotional attachment.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"분리 불안 장애란 아이가 가장 깊게 의존하고 애착을 느끼는 대상과 떨어질 때 겪는 지나친 걱정과 공포를 뜻해요.","hl":"mn"},{"n":66,"text":"여기서 to whom a child is most attached를 문장 끝에 전치사를 두고 who the child is closest to로 바꿀 수 있답니다.","hl":"rw"},{"n":67,"text":"be attached to는 be bonded with라는 표현으로 바꾸어 쓸 수 있어요.","hl":"ph"},{"n":68,"text":"따라서 이 문장은 분리불안장애란 아이가 강한 애착을 가진 사람들로부터 떨어지는 것에 대해 극심한 공포를 느끼는 상태를 말한다는 것으로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Social influence is the process \u003cspan class=\"fx\">by which individuals adapt their opinion, revise their beliefs, or change their behavior\u003c/span> as a result of social interactions with other people.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Social influence is the process\u003c/div>\u003cdiv class=\"k\">사회적 영향은 과정이다\u003c/div>\u003cdiv class=\"e\">by which individuals adapt their opinion,\u003c/div>\u003cdiv class=\"k\">개인들이 그들의 의견을 조정하거나\u003c/div>\u003cdiv class=\"e\">revise their beliefs,\u003c/div>\u003cdiv class=\"k\">그들의 신념을 바꾸거나\u003c/div>\u003cdiv class=\"e\">or change their behavior\u003c/div>\u003cdiv class=\"k\">또는 그들의 행위를 변화시키는\u003c/div>\u003cdiv class=\"e\">as a result of social interactions with other people.\u003c/div>\u003cdiv class=\"k\">다른 사람들과 맺는 사회적 상호작용의 결과로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>전치사 by의 목적어로 쓰인 관계대명사절 \u003cb class=\"key\">which\u003c/b> ~가 선행사 the process를 수식하며, 세 개의 동사가 병렬 연결되어 있다.\u003c/div>","segs":[{"n":69,"text":"Social influence is the process, 사회적 영향은 과정이다. by which individuals adapt their opinion, 개인들이 그들의 의견을 조정하거나. revise their beliefs, 그들의 신념을 바꾸거나. or change their behavior, 또는 그들의 행위를 변화시키는. as a result of social interactions with other people, 다른 사람들과 맺는 사회적 상호작용의 결과로","hl":"ch"},{"n":70,"text":"열두 번째 문장에서는 by which가 the process를 수식하고 있고, 그 안에서 adapt, revise, change라는 세 개의 동사가 나란히 병렬로 연결되어 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Social influence is the process \u003cspan class=\"fx\">by which individuals adapt their opinion, revise their beliefs, or change their behavior\u003c/span> as a result of social interactions with other people.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사람들이 타인과의 상호작용 속에서 자신의 생각과 신념, 행동 방식을 스스로 수정하고 적응해 나가는 사회화의 메커니즘을 설명한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">by which individuals adapt ... revise ... or change\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">whereby people modify their viewpoints, update convictions, and alter actions\u003c/span>\u003cdiv class=\"w\">관계부사 whereby를 쓰고 동사들을 더욱 세련된 어휘로 교체한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">adapt\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">adjust\u003c/span>\u003cspan class=\"y-eq\">adapt = adjust\u003c/span>\u003cdiv class=\"w\">상황이나 의견에 맞게 조정하고 적응하다라는 의미의 유의어이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">interaction\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">engagement\u003c/span>\u003cspan class=\"y-eq\">interaction = engagement\u003c/span>\u003cdiv class=\"w\">서로 소통하고 교류하는 상호작용을 뜻하는 고급 명사이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Interpersonal influence constitutes the mechanism through which people adjust perspectives, modify convictions, and transform conduct stemming from communal engagement.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"사회적 영향이란 타인과의 상호작용을 통해 우리의 생각과 신념, 행동 양식을 끊임없이 수정하고 적응해 나가는 과정이라는 뜻이지요.","hl":"mn"},{"n":72,"text":"여기서 by which를 관계부사 whereby로 바꾸고 동사들을 각각 modify나 update로 바꾸어 쓸 수도 있어요.","hl":"rw"},{"n":73,"text":"adapt는 adjust로, interaction은 engagement라는 단어로 바꾸어 쓸 수 있다는 것을 꼭 기억해 두세요.","hl":"ph"},{"n":74,"text":"즉, 이 문장은 대인 간의 상호작용으로 인해 개인의 의견과 신념, 행동 양식이 수정되는 현상을 사회적 영향이라고 정의한다는 말로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 24 명사 + 전치사 + 관계대명사절\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>명사 뒤에서 \u003cb class=\"key\">전치사 + 관계대명사(whom/which)\u003c/b> 절이 앞에 있는 명사를 수식하는 구조를 완벽하게 내 것으로 만들었다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘 우리는 명사 뒤에서 전치사와 관계대명사가 이끄는 절이 수식을 해주는 Unit 24 구문을 아주 꼼꼼하게 살펴봤어요. 전치사의 위치가 앞으로 오기도 하고 뒤로 가기도 한다는 점, 그리고 다양한 동의어 표현들까지 모두 기억해 준다면 어떤 고난도 수능 문장도 눈감고도 풀 수 있을 거예요. 여러분 정말 수고 많았어요. 다음 유닛에서 만나요!","hl":"sum"}]}]});</script></body></html>
