.y-chunks .e{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600;font-size:17px;border-right:1px solid #EEF3F3;background:#FBFEFE}
.y-chunks .k{color:var(--pk-t);font-size:15px;font-weight:600}
.y-box{border-radius:4px;padding:10px 14px;margin-bottom:10px;font-size:15.5px;line-height:1.7}
.y-lb{display:inline-block;font-size:12.5px;font-weight:800;color:var(--pk-t);background:#fff;border:1px solid var(--pk-b,#B5DEDC);border-radius:3px;padding:0 8px;margin-right:8px;vertical-align:1px}
.y-st{background:var(--pk-ll);border-left:4px solid var(--pk)}
.y-mn{background:var(--am-l,#FFF3DC);border:1px solid var(--am-b,#F0D9A5)}
.y-mn .y-lb{color:var(--am-d,#8A5A00);border-color:var(--am-b,#F0D9A5)}
.y-cg{border:1px solid var(--pk-b,#B5DEDC)}
.y-pair{padding:6px 0 4px;border-top:1px dashed #E3E9EE}
.y-pair:first-of-type{border-top:0}
.y-pair .f{font-family:"Noto Serif KR",Georgia,serif;font-weight:600;color:#4A5866}
.y-pair .ar{color:var(--pk);margin:0 8px;font-weight:800}
.y-pair .t{font-family:"Noto Serif KR",Georgia,serif;font-weight:700;color:#1B2733;background:var(--pk-ll);padding:0 4px}
.y-pair .w{font-size:14px;color:#4A5866;margin-top:2px}
.y-eq{display:inline-block;margin-left:10px;font-size:12.5px;font-weight:700;color:#3A4FA3;border:1px solid #AEBBE6;border-radius:3px;padding:0 7px}
.y-pp{background:#F6F8FA;border-left:4px solid #3A4FA3}
.y-pp .y-lb{color:#3A4FA3;border-color:#AEBBE6}
.y-pp .p{font-family:"Noto Serif KR",Georgia,serif;font-size:18px;font-weight:700;margin-top:6px;line-height:1.55}
.y-list{display:grid;gap:6px;margin-top:4px}
.y-li{font-family:"Noto Serif KR",Georgia,serif;font-size:16px;line-height:1.6;display:block;padding-left:32px;text-indent:-32px}
.y-no{display:inline-block;text-indent:0;min-width:22px;height:20px;line-height:20px;text-align:center;border-radius:3px;background:var(--pk);color:#fff;font-family:sans-serif;font-size:12px;font-weight:800;margin-right:10px;vertical-align:1px}
@media (max-width:700px){.y-sen{font-size:18px}.y-chunks{grid-template-columns:1fr}.y-chunks .e{border-right:0}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"마법같은 블록구문 레드","title":"Unit 23 명사 + 관계대명사절 마스터하기","audioDir":"audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 23 명사 + 관계대명사절\u003c/div>\u003ch1>Unit 23 명사 + 관계대명사절 마스터하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>명사 바로 뒤에 이어지는 관계대명사절의 구조를 완벽히 이해하고 직독직해 능력을 키운다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 명사 바로 뒤에서 그 명사를 수식해 주는 관계대명사절을 함께 공부할 거예요. 독해를 하다가 명사 뒤에 who나 which, that 같은 관계대명사가 나오면 당황하지 말고 수식해 주는 구조를 떠올려야 해요. 오늘 준비한 열두 개의 예문을 통해 확실하게 내 것으로 만들어 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">Unit 23 명사 + 관계대명사절\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">명사 뒤에 이어지는 \u003cb class=\"key\">관계대명사절\u003c/b>은 선행사인 명사를 수식하여 문장의 의미를 구체적으로 확장해 주는 핵심 \u003cb class=\"key\">구문\u003c/b>이다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Social welfare is a set of activities \u003cspan class=\"fx\">which have, in part, been directed\u003c/span> to offset unequal distribution.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 A Korean speaker uses different verb forms depending on his or her relationship to the person \u003cspan class=\"fx\">whom he or she is speaking to\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 Birds \u003cspan class=\"fx\">that in the breeding season fight one another to death over territory\u003c/span> may end up in the same flock during migration.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Culture shock is the feeling of confusion felt by someone visiting a country or place \u003cspan class=\"fx\">whose culture they do not know\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 We define cognitive intrigue as the wonder \u003cspan class=\"fx\">that stimulates and intrinsically motivates an individual\u003c/span> to voluntarily engage in an activity.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Time is too slow for \u003cspan class=\"fx\">those who wait\u003c/span>, too swift for those who fear, too long for those who grieve, too short for those who rejoice, but for those who love, time is eternity.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 The man with a toothache thinks that everyone \u003cspan class=\"fx\">whose teeth are sound\u003c/span> is happy. The poverty-stricken man makes the same mistake about the rich man.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 The term &quot;placebo&quot; is used to describe a &quot;pill&quot; \u003cspan class=\"fx\">which contains no medical ingredients\u003c/span> but which often produces the same effect as genuine medication.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 Flu and colds spread very quickly, especially with the large amount of contact \u003cspan class=\"fx\">that people now have with each other\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 Andy Weir wrote &quot;The Martian&quot; for science fiction readers \u003cspan class=\"fx\">who want their stories firmly grounded in scientific fact\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 A rain forest is a virtually untapped storehouse of evolutionary achievement  \u003cspan class=\"fx\">that will prove increasingly valuable to mankind\u003c/span> as it yields its secrets.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Those people, organizations, and countries \u003cspan class=\"fx\">that possess the highest-quality information\u003c/span> are likely to prosper economically, socially, and politically.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘 배울 핵심 규칙은 명사 뒤에 나오는 관계대명사절이에요. 명사 바로 뒤에 who, which, that 등이 이끄는 절이 오면, 그 절이 앞의 명사를 꾸며준다는 것을 기억해야 해요. 이 관계대명사절 구조를 정확히 파악하면 긴 문장도 쉽게 읽어낼 수 있어요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Social welfare is a set of activities \u003cspan class=\"fx\">which have, in part, been directed\u003c/span> to offset unequal distribution.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Social welfare is a set of activities\u003c/div>\u003cdiv class=\"k\">사회 복지는 일련의 활동이다\u003c/div>\u003cdiv class=\"e\">which have, in part, been directed\u003c/div>\u003cdiv class=\"k\">부분적으로 지향해 온\u003c/div>\u003cdiv class=\"e\">to offset unequal distribution.\u003c/div>\u003cdiv class=\"k\">불공평한 분배의 상쇄를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 a set of activities를 주격 \u003cb class=\"key\">관계대명사\u003c/b> which가 이끄는 절이 뒤에서 수식하는 \u003cb class=\"key\">관계대명사절\u003c/b> 구문이다.\u003c/div>","segs":[{"n":3,"text":"Social welfare is a set of activities, 사회 복지는 일련의 활동이다. which have, in part, been directed, 부분적으로 지향해 온. to offset unequal distribution, 불공평한 분배의 상쇄를","hl":"ch"},{"n":4,"text":"첫 번째 문장에서는 선행사 a set of activities를 주격 관계대명사 which가 이끄는 절이 뒤에서 수식하는 관계대명사절 구문을 살펴보고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Social welfare is a set of activities \u003cspan class=\"fx\">which have, in part, been directed\u003c/span> to offset unequal distribution.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사회 복지가 단순히 자선을 넘어 불평등을 해소하기 위한 제도적 노력임을 설명한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">which have, in part, been directed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">that have partially aimed\u003c/span>\u003cdiv class=\"w\">수동태 표현을 능동형 구조로 바꾸어 간결하게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">offset\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">compensate for\u003c/span>\u003cspan class=\"y-eq\">offset = compensate for\u003c/span>\u003cdiv class=\"w\">상쇄하다, 보상하다라는 의미의 동사구를 동의어로 교체했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unequal distribution\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">disparate allocation\u003c/span>\u003cspan class=\"y-eq\">unequal distribution = disparate allocation\u003c/span>\u003cdiv class=\"w\">불공평한 분배를 의미하는 어구를 고급 어휘로 바꾸었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Public assistance comprises programs partly designed to balance out unequal allocation.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"여기서는 사회 복지가 단순한 지원을 넘어서 불평등한 분배를 바로잡는 역할을 한다는 점을 강조하고 있죠.","hl":"mn"},{"n":6,"text":"수동태로 쓰인 원문을 능동형 표현으로 바꾸어 쓰면 문장이 조금 더 간결해져요.","hl":"rw"},{"n":7,"text":"offset은 compensate for로, unequal distribution은 disparate allocation으로 바꾸어 쓸 수 있어요.","hl":"ph"},{"n":8,"text":"원문과 뜻이 같은 Public assistance comprises programs partly designed to balance out unequal allocation이라는 문장도 함께 알아두세요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 A Korean speaker uses different verb forms depending on his or her relationship to the person \u003cspan class=\"fx\">whom he or she is speaking to\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A Korean speaker uses different verb forms\u003c/div>\u003cdiv class=\"k\">한국어 사용자는 다른 동사의 형태를 사용한다\u003c/div>\u003cdiv class=\"e\">depending on his or her relationship\u003c/div>\u003cdiv class=\"k\">관계에 따라서\u003c/div>\u003cdiv class=\"e\">to the person\u003c/div>\u003cdiv class=\"k\">그 사람에 대한\u003c/div>\u003cdiv class=\"e\">whom he or she is speaking to.\u003c/div>\u003cdiv class=\"k\">그 또는 그녀가 이야기하고 있는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 the person을 목적격 \u003cb class=\"key\">관계대명사\u003c/b> whom이 이끄는 절이 수식하며, 전치사 to의 목적어가 빠진 \u003cb class=\"key\">관계대명사절\u003c/b>이다.\u003c/div>","segs":[{"n":9,"text":"A Korean speaker uses different verb forms, 한국어 사용자는 다른 동사의 형태를 사용한다. depending on his or her relationship, 관계에 따라서. to the person, 그 사람에 대한. whom he or she is speaking to, 그 또는 그녀가 이야기하고 있는","hl":"ch"},{"n":10,"text":"두 번째 문장에서는 선행사 the person을 목적격 관계대명사 whom이 이끄는 절이 수식하는 관계대명사절 구조를 분석하고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 A Korean speaker uses different verb forms depending on his or her relationship to the person \u003cspan class=\"fx\">whom he or she is speaking to\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>한국어에서 대화 상대와의 사회적 관계에 따라 높임법이나 어휘가 달라지는 언어적 특징을 나타낸다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whom he or she is speaking to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to whom he or she is speaking\u003c/span>\u003cdiv class=\"w\">전치사를 관계대명사 앞으로 이동시켜 격식 있는 표현으로 바꾸었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">depending on\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">according to\u003c/span>\u003cspan class=\"y-eq\">depending on = according to\u003c/span>\u003cdiv class=\"w\">~에 따라라는 의미의 전치사구를 동의어로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">relationship\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">connection\u003c/span>\u003cspan class=\"y-eq\">relationship = connection\u003c/span>\u003cdiv class=\"w\">관계라는 명사를 유의어로 대체했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Korean speakers employ various verb endings based on their connection with the listener.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"한국어 화자가 대화 상대와의 관계를 고려하여 알맞은 동사 형태를 선택한다는 점을 잘 보여주는 문장이에요.","hl":"mn"},{"n":12,"text":"전치사 to를 관계대명사 앞으로 옮기면 더욱 격식 있는 문장을 만들 수 있어요.","hl":"rw"},{"n":13,"text":"depending on은 according to로, relationship은 connection으로 바꿔 쓸 수 있다는 점 기억해 두세요.","hl":"ph"},{"n":14,"text":"Korean speakers employ various verb endings based on their connection with the listener라고 패러프레이징할 수도 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 Birds \u003cspan class=\"fx\">that in the breeding season fight one another to death over territory\u003c/span> may end up in the same flock during migration.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Birds\u003c/div>\u003cdiv class=\"k\">새들은\u003c/div>\u003cdiv class=\"e\">that in the breeding season fight one another to death over territory\u003c/div>\u003cdiv class=\"k\">번식기에 영역을 두고 서로 죽을힘을 다해 싸우는\u003c/div>\u003cdiv class=\"e\">may end up in the same flock\u003c/div>\u003cdiv class=\"k\">동일한 무리 속에 결국 있게 될 것이다\u003c/div>\u003cdiv class=\"e\">during migration.\u003c/div>\u003cdiv class=\"k\">이주기에는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 Birds를 주격 \u003cb class=\"key\">관계대명사\u003c/b> that이 이끄는 긴 절이 수식하는 \u003cb class=\"key\">관계대명사절\u003c/b> 구문이다.\u003c/div>","segs":[{"n":15,"text":"Birds, 새들은. that in the breeding season fight one another to death over territory, 번식기에 영역을 두고 서로 죽을힘을 다해 싸우는. may end up in the same flock, 동일한 무리 속에 결국 있게 될 것이다. during migration, 이주기에는","hl":"ch"},{"n":16,"text":"세 번째 문장에서는 선행사 Birds를 주격 관계대명사 that이 이끄는 긴 절이 수식하는 관계대명사절 구조를 다루고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 Birds \u003cspan class=\"fx\">that in the breeding season fight one another to death over territory\u003c/span> may end up in the same flock during migration.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>치열하게 경쟁하던 동물들도 시기가 지나면 평화롭게 어울릴 수 있음을 보여준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fight one another to death\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">engage in fatal combat with each other\u003c/span>\u003cdiv class=\"w\">치열하게 싸운다는 표현을 조금 더 학술적인 어휘로 바꾸었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">end up in\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">wind up in\u003c/span>\u003cspan class=\"y-eq\">end up in = wind up in\u003c/span>\u003cdiv class=\"w\">결국 ~에 처하게 되다라는 의미의 표현을 동의어로 교체했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">migration\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">seasonal movement\u003c/span>\u003cspan class=\"y-eq\">migration = seasonal movement\u003c/span>\u003cdiv class=\"w\">이주라는 명사를 풀어서 설명하는 표현으로 바꾸었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Avian species that fiercely compete for space during mating time might gather in the same group while migrating.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"번식기에는 영역 싸움을 하던 새들이 이주할 때는 같은 무리에 섞여 지낸다는 점이 흥미롭죠.","hl":"mn"},{"n":18,"text":"fight one another to death를 engage in fatal combat with each other로 바꾸어 표현할 수도 있어요.","hl":"rw"},{"n":19,"text":"end up in은 wind up으로, migration은 seasonal movement로 바꿀 수 있어요.","hl":"ph"},{"n":20,"text":"원문과 같은 의미를 가진 Avian species that fiercely compete for space during mating time might gather in the same group while migrating라는 문장도 함께 살펴봤어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Culture shock is the feeling of confusion felt by someone visiting a country or place \u003cspan class=\"fx\">whose culture they do not know\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Culture shock is the feeling of confusion\u003c/div>\u003cdiv class=\"k\">문화 충격은 혼란의 감정이다\u003c/div>\u003cdiv class=\"e\">felt by someone\u003c/div>\u003cdiv class=\"k\">어떤 사람이 느끼는\u003c/div>\u003cdiv class=\"e\">visiting a country or place\u003c/div>\u003cdiv class=\"k\">나라 또는 장소를 방문하는\u003c/div>\u003cdiv class=\"e\">whose culture they do not know.\u003c/div>\u003cdiv class=\"k\">그곳의 문화를 그들이 알지 못하는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 a country or place를 소유격 \u003cb class=\"key\">관계대명사\u003c/b> whose가 이끄는 절이 수식하는 \u003cb class=\"key\">관계대명사절\u003c/b> 구문이다.\u003c/div>","segs":[{"n":21,"text":"Culture shock is the feeling of confusion, 문화 충격은 혼란의 감정이다. felt by someone, 어떤 사람이 느끼는. visiting a country or place, 나라 또는 장소를 방문하는. whose culture they do not know, 그곳의 문화를 그들이 알지 못하는","hl":"ch"},{"n":22,"text":"네 번째 문장에서는 선행사 a country or place를 소유격 관계대명사 whose가 이끄는 절이 수식하는 관계대명사절 구조를 설명하고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Culture shock is the feeling of confusion felt by someone visiting a country or place \u003cspan class=\"fx\">whose culture they do not know\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>낯선 문화 환경에 처했을 때 겪는 심리적 혼란과 당혹감을 정의한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whose culture they do not know\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the culture of which they are unfamiliar with\u003c/span>\u003cdiv class=\"w\">소유격 관계대명사를 전치사 of를 포함한 구조로 풀어썼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">feeling of confusion\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">sense of disorientation\u003c/span>\u003cspan class=\"y-eq\">feeling of confusion = sense of disorientation\u003c/span>\u003cdiv class=\"w\">혼란의 감정이라는 표현을 방향 상실의 느낌이라는 유의어로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">do not know\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are unfamiliar with\u003c/span>\u003cspan class=\"y-eq\">do not know = are unfamiliar with\u003c/span>\u003cdiv class=\"w\">모른다는 표현을 익숙하지 않다라는 표현으로 전환했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Cultural shock is the psychological disorientation experienced by travelers exploring unfamiliar territories.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"익숙하지 않은 문화권에 방문했을 때 겪게 되는 심리적인 혼란 상태를 뜻하는 말이죠.","hl":"mn"},{"n":24,"text":"whose culture를 the culture of which로 바꾸어 쓰면 소유격 관계대명사의 성격을 더 명확히 이해할 수 있어요.","hl":"rw"},{"n":25,"text":"feeling of confusion은 sense of disorientation으로, do not know는 are unfamiliar with로 바꿀 수 있어요.","hl":"ph"},{"n":26,"text":"Cultural shock is the psychological disorientation experienced by travelers exploring unfamiliar territories라는 문장으로 패러프레이징이 가능해요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 We define cognitive intrigue as the wonder \u003cspan class=\"fx\">that stimulates and intrinsically motivates an individual\u003c/span> to voluntarily engage in an activity.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We define cognitive intrigue\u003c/div>\u003cdiv class=\"k\">우리는 인지적 호기심을 정의한다\u003c/div>\u003cdiv class=\"e\">as the wonder\u003c/div>\u003cdiv class=\"k\">경이로움으로\u003c/div>\u003cdiv class=\"e\">that stimulates and intrinsically motivates an individual\u003c/div>\u003cdiv class=\"k\">개인을 자극하고 본질적으로 동기를 부여하는\u003c/div>\u003cdiv class=\"e\">to voluntarily engage in an activity.\u003c/div>\u003cdiv class=\"k\">자발적으로 어떤 활동에 참여하도록\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 the wonder를 주격 \u003cb class=\"key\">관계대명사\u003c/b> that이 이끄는 절이 수식하는 \u003cb class=\"key\">관계대명사절\u003c/b> 구문이다.\u003c/div>","segs":[{"n":27,"text":"We define cognitive intrigue, 우리는 인지적 호기심을 정의한다. as the wonder, 경이로움으로. that stimulates and intrinsically motivates an individual, 개인을 자극하고 본질적으로 동기를 부여하는. to voluntarily engage in an activity, 자발적으로 어떤 활동에 참여하도록","hl":"ch"},{"n":28,"text":"다섯 번째 문장에서는 선행사 the wonder를 주격 관계대명사 that이 이끄는 절이 수식하는 관계대명사절 구조를 살펴보고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 We define cognitive intrigue as the wonder \u003cspan class=\"fx\">that stimulates and intrinsically motivates an individual\u003c/span> to voluntarily engage in an activity.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>외부의 보상 없이도 스스로 무언가를 탐구하고 싶어 하는 내적 동기의 본질을 말한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">intrinsically motivates\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">naturally drives from within\u003c/span>\u003cdiv class=\"w\">내적으로 동기를 부여한다는 의미를 풀어서 설명했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cognitive intrigue\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">intellectual curiosity\u003c/span>\u003cspan class=\"y-eq\">cognitive intrigue = intellectual curiosity\u003c/span>\u003cdiv class=\"w\">인지적 호기심을 지적 호기심이라는 동의어로 교체했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">voluntarily\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">of one's own accord\u003c/span>\u003cspan class=\"y-eq\">voluntarily = of one's own accord\u003c/span>\u003cdiv class=\"w\">자발적으로라는 부사를 전치사구로 바꾸어 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Intellectual curiosity is characterized as the fascination that drives people to take part in tasks willingly.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"배우고 싶어 하는 마음이 스스로 활동에 참여하게 만드는 내적 동기로 작용한다는 것을 뜻해요.","hl":"mn"},{"n":30,"text":"intrinsically motivates를 naturally drives from within으로 바꾸어 쓰면 의미가 더욱 생생하게 다가와요.","hl":"rw"},{"n":31,"text":"cognitive intrigue는 intellectual curiosity로, voluntarily는 of one's own accord로 바꿀 수 있어요.","hl":"ph"},{"n":32,"text":"Intellectual curiosity is characterized as the fascination that drives people to take part in tasks willingly라는 문장으로 바꾸어 쓸 수 있죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 Time is too slow for \u003cspan class=\"fx\">those who wait\u003c/span>, too swift for those who fear, too long for those who grieve, too short for those who rejoice, but for those who love, time is eternity.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Time is too slow for those who wait,\u003c/div>\u003cdiv class=\"k\">기다리는 사람들에게는 시간은 너무 느리고,\u003c/div>\u003cdiv class=\"e\">too swift for those who fear,\u003c/div>\u003cdiv class=\"k\">두려워하는 사람들에게는 너무 빠르고,\u003c/div>\u003cdiv class=\"e\">too long for those who grieve,\u003c/div>\u003cdiv class=\"k\">슬퍼하는 사람들에게는 너무 길고,\u003c/div>\u003cdiv class=\"e\">too short for those who rejoice,\u003c/div>\u003cdiv class=\"k\">기뻐하는 사람들에게는 너무 짧지만,\u003c/div>\u003cdiv class=\"e\">but for those who love,\u003c/div>\u003cdiv class=\"k\">사랑하는 사람들에게는\u003c/div>\u003cdiv class=\"e\">time is eternity.\u003c/div>\u003cdiv class=\"k\">시간은 영원하다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주관대 who가 이끄는 \u003cb class=\"key\">관계대명사절\u003c/b>이 지시대명사 those를 수식하여 '~하는 사람들'이라는 의미를 만드는 구문이다.\u003c/div>","segs":[{"n":33,"text":"Time is too slow for those who wait, 기다리는 사람들에게는 시간은 너무 느리고. too swift for those who fear, 두려워하는 사람들에게는 너무 빠르고. too long for those who grieve, 슬퍼하는 사람들에게는 너무 길고. too short for those who rejoice, 기뻐하는 사람들에게는 너무 짧지만. but for those who love, 사랑하는 사람들에게는. time is eternity, 시간은 영원하다.","hl":"ch"},{"n":34,"text":"여섯 번째 문장에서는 주격 관계대명사 who가 those를 수식하는 관계대명사절이 반복되면서 시간의 주관적 느낌을 강조하고 있는 구문을 보고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 Time is too slow for \u003cspan class=\"fx\">those who wait\u003c/span>, too swift for those who fear, too long for those who grieve, too short for those who rejoice, but for those who love, time is eternity.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>시간의 객관적 속도와는 별개로, 주관적인 감정 상태에 따라 시간의 흐름이 다르게 느껴진다는 인생의 진리를 담고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">those who wait\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">people waiting\u003c/span>\u003cdiv class=\"w\">관계대명사절을 현재분사구로 바꾸어 간결하게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">swift\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rapid\u003c/span>\u003cspan class=\"y-eq\">swift = rapid\u003c/span>\u003cdiv class=\"w\">빠른이라는 의미의 형용사를 유의어로 교체했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">eternity\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">timelessness\u003c/span>\u003cspan class=\"y-eq\">eternity = timelessness\u003c/span>\u003cdiv class=\"w\">영원이라는 명사를 시공간을 초월한다는 의미의 유의어로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The perception of time varies according to our feelings, yet love makes time endless.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"사람의 감정에 따라 시간은 더디게도 흐르고 눈 깜짝할 사이에 지나기도 한다는 깊은 통찰을 담고 있죠.","hl":"mn"},{"n":36,"text":"those who wait 같은 표현을 people waiting처럼 분사 형태로 바꾸어 쓰면 문장이 조금 더 간결해져요.","hl":"rw"},{"n":37,"text":"swift는 rapid로, eternity는 timelessness로 바꾸어 쓸 수 있어요.","hl":"ph"},{"n":38,"text":"The perception of time varies according to our feelings, yet love makes time endless라는 문장으로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 The man with a toothache thinks that everyone \u003cspan class=\"fx\">whose teeth are sound\u003c/span> is happy. The poverty-stricken man makes the same mistake about the rich man.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The man with a toothache thinks\u003c/div>\u003cdiv class=\"k\">치통이 있는 사람은 생각한다\u003c/div>\u003cdiv class=\"e\">that everyone whose teeth are sound is happy.\u003c/div>\u003cdiv class=\"k\">이가 건강한 모든 사람이 행복할 것이라고\u003c/div>\u003cdiv class=\"e\">The poverty-stricken man makes the same mistake\u003c/div>\u003cdiv class=\"k\">가난에 시달리는 사람은 같은 실수를 한다\u003c/div>\u003cdiv class=\"e\">about the rich man.\u003c/div>\u003cdiv class=\"k\">부자에 대해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 everyone을 소유격 \u003cb class=\"key\">관계대명사\u003c/b> whose가 이끄는 절이 수식하는 \u003cb class=\"key\">관계대명사절\u003c/b> 구문이다.\u003c/div>","segs":[{"n":39,"text":"The man with a toothache thinks, 치통이 있는 사람은 생각한다. that everyone whose teeth are sound is happy, 이가 건강한 모든 사람이 행복할 것이라고. The poverty-stricken man makes the same mistake, 가난에 시달리는 사람은 같은 실수를 한다. about the rich man, 부자에 대해","hl":"ch"},{"n":40,"text":"일곱 번째 문장에서는 선행사 everyone을 소유격 관계대명사 whose가 이끄는 절이 수식하는 관계대명사절 구조를 공부하고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 The man with a toothache thinks that everyone \u003cspan class=\"fx\">whose teeth are sound\u003c/span> is happy. The poverty-stricken man makes the same mistake about the rich man.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자신이 겪고 있는 결핍이나 고통이 해소되면 모든 것이 완벽하게 행복해질 것이라고 착각하는 인간의 심리를 꼬집는다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whose teeth are sound\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who have healthy teeth\u003c/span>\u003cdiv class=\"w\">소유격 관계대명사절을 주격 관계대명사와 소유격 표현으로 풀어썼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">poverty-stricken\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">impoverished\u003c/span>\u003cspan class=\"y-eq\">poverty-stricken = impoverished\u003c/span>\u003cdiv class=\"w\">가난에 시달리는이라는 형용사를 한 단어의 동의어로 교체했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sound\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">healthy\u003c/span>\u003cspan class=\"y-eq\">sound = healthy\u003c/span>\u003cdiv class=\"w\">건강한이라는 의미의 형용사를 유의어로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Individuals suffering from physical pain assume everyone without pain is joyful, much like the poor view the wealthy.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"자신이 겪는 아픔이 없으면 세상 모든 것이 다 행복해 보일 것이라는 착각을 꼬집는 흥미로운 문장이에요.","hl":"mn"},{"n":42,"text":"whose teeth are sound를 who have healthy teeth로 바꾸어 쓰면 구조가 더 쉽게 눈에 들어올 거예요.","hl":"rw"},{"n":43,"text":"poverty-stricken은 impoverished로, sound는 healthy로 바꿀 수 있어요.","hl":"ph"},{"n":44,"text":"Individuals suffering from physical pain assume everyone without pain is joyful, much like the poor view the wealthy라는 문장으로 바꾸어 표현할 수 있죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 The term &quot;placebo&quot; is used to describe a &quot;pill&quot; \u003cspan class=\"fx\">which contains no medical ingredients\u003c/span> but which often produces the same effect as genuine medication.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The term &quot;placebo&quot; is used to describe a &quot;pill&quot;\u003c/div>\u003cdiv class=\"k\">‘플라세보’라는 용어는 ‘알약’을 표현하기 위해 사용된다\u003c/div>\u003cdiv class=\"e\">which contains no medical ingredients\u003c/div>\u003cdiv class=\"k\">약 성분을 포함하지 않지만\u003c/div>\u003cdiv class=\"e\">but which often produces the same effect\u003c/div>\u003cdiv class=\"k\">종종 같은 효과를 내는\u003c/div>\u003cdiv class=\"e\">as genuine medication.\u003c/div>\u003cdiv class=\"k\">진짜 약물과 같은\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 a &quot;pill&quot;을 주격 \u003cb class=\"key\">관계대명사\u003c/b> which가 이끄는 두 개의 절이 병렬로 수식하는 \u003cb class=\"key\">관계대명사절\u003c/b> 구문이다.\u003c/div>","segs":[{"n":45,"text":"The term \"placebo\" is used to describe a \"pill\", ‘플라세보’라는 용어는 ‘알약’을 표현하기 위해 사용된다. which contains no medical ingredients, 약 성분을 포함하지 않지만. but which often produces the same effect, 종종 같은 효과를 내는. as genuine medication, 진짜 약물과 같은","hl":"ch"},{"n":46,"text":"여덟 번째 문장에서는 선행사 a pill을 주격 관계대명사 which가 이끄는 두 개의 절이 and나 but으로 연결되어 수식하는 관계대명사절 구조를 다루고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 The term &quot;placebo&quot; is used to describe a &quot;pill&quot; \u003cspan class=\"fx\">which contains no medical ingredients\u003c/span> but which often produces the same effect as genuine medication.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>실제 약 성분이 없어도 심리적 믿음으로 인해 치료 효과를 내는 위약의 특성을 설명한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">which contains no medical ingredients\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">that lacks active pharmaceutical components\u003c/span>\u003cdiv class=\"w\">유효 성분이 없다는 표현을 의학 용어로 바꾸어 명확성을 높였다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">genuine\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">authentic\u003c/span>\u003cspan class=\"y-eq\">genuine = authentic\u003c/span>\u003cdiv class=\"w\">진짜의라는 의미의 형용사를 동의어로 교체했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">produce\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">generate\u003c/span>\u003cspan class=\"y-eq\">produce = generate\u003c/span>\u003cdiv class=\"w\">효과를 내다라는 동사를 유의어로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A placebo refers to a pill lacking active drugs yet yielding outcomes comparable to real medicine.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"가짜 약이라도 진짜 약과 비슷한 치료 효과를 발휘하는 플라세보 효과의 개념을 정의하고 있죠.","hl":"mn"},{"n":48,"text":"contains no medical ingredients를 lacks active pharmaceutical components로 바꾸어 쓰면 전문성이 더 돋보여요.","hl":"rw"},{"n":49,"text":"genuine은 authentic으로, produce는 generate로 바꾸어 쓸 수 있어요.","hl":"ph"},{"n":50,"text":"원문과 뜻이 통하는 A placebo refers to a pill lacking active drugs yet yielding outcomes comparable to real medicine이라는 문장도 기억해 두세요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 Flu and colds spread very quickly, especially with the large amount of contact \u003cspan class=\"fx\">that people now have with each other\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Flu and colds spread very quickly,\u003c/div>\u003cdiv class=\"k\">독감과 감기는 아주 빠르게 퍼진다\u003c/div>\u003cdiv class=\"e\">especially with the large amount of contact\u003c/div>\u003cdiv class=\"k\">많은 접촉으로 인해 특히\u003c/div>\u003cdiv class=\"e\">that people now have with each other.\u003c/div>\u003cdiv class=\"k\">사람들이 지금 서로 갖는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 the large amount of contact를 목적격 \u003cb class=\"key\">관계대명사\u003c/b> that이 이끄는 절이 수식하는 \u003cb class=\"key\">관계대명사절\u003c/b> 구문이다.\u003c/div>","segs":[{"n":51,"text":"Flu and colds spread very quickly, 독감과 감기는 아주 빠르게 퍼진다. especially with the large amount of contact, 많은 접촉으로 인해 특히. that people now have with each other, 사람들이 지금 서로 갖는","hl":"ch"},{"n":52,"text":"아홉 번째 문장에서는 선행사 the large amount of contact를 목적격 관계대명사 that이 이끄는 절이 수식하는 관계대명사절 구조를 살펴보고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 Flu and colds spread very quickly, especially with the large amount of contact \u003cspan class=\"fx\">that people now have with each other\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>현대 사회의 잦은 만남과 활발한 교류가 호흡기 질환의 빠른 확산 원인이 됨을 보여준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">that people now have with each other\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">which people currently share mutually\u003c/span>\u003cdiv class=\"w\">목적격 관계대명사 that을 which로 바꾸고 부사 표현을 더했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">spread\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">transmit\u003c/span>\u003cspan class=\"y-eq\">spread = transmit\u003c/span>\u003cdiv class=\"w\">퍼지다라는 동사를 전파되다라는 유의어로 교체했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">contact\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">interaction\u003c/span>\u003cspan class=\"y-eq\">contact = interaction\u003c/span>\u003cdiv class=\"w\">접촉이라는 명사를 상호작용이라는 의미의 유의어로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Influenza and common colds transmit rapidly due to frequent modern interactions among individuals.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"사람들 간의 접촉이 많아질수록 바이러스성 질환이 더 빠르게 퍼진다는 현실적인 내용을 다루고 있죠.","hl":"mn"},{"n":54,"text":"목적격 관계대명사 that을 which로 바꾸어 써도 의미가 자연스럽게 통해요.","hl":"rw"},{"n":55,"text":"spread는 transmit으로, contact는 interaction으로 바꿀 수 있어요.","hl":"ph"},{"n":56,"text":"Influenza and common colds transmit rapidly due to frequent modern interactions among individuals라는 문장으로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 Andy Weir wrote &quot;The Martian&quot; for science fiction readers \u003cspan class=\"fx\">who want their stories firmly grounded in scientific fact\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Andy Weir wrote “The Martian”\u003c/div>\u003cdiv class=\"k\">앤디 위어는 ‘마션’을 썼다\u003c/div>\u003cdiv class=\"e\">for science fiction readers\u003c/div>\u003cdiv class=\"k\">공상 과학 소설 독자들을 위해\u003c/div>\u003cdiv class=\"e\">who want their stories\u003c/div>\u003cdiv class=\"k\">그들의 이야기가 원하기를\u003c/div>\u003cdiv class=\"e\">firmly grounded in scientific fact.\u003c/div>\u003cdiv class=\ er more precious as they share their mysteries.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"열대우림이 품고 있는 수많은 생태계의 비밀이 드러날수록 인류에게 엄청난 보물로 다가오게 될 것이라는 의미예요.","hl":"mn"},{"n":66,"text":"prove increasingly valuable을 turn out to be progressively more precious로 바꾸어 표현할 수도 있어요.","hl":"rw"},{"n":67,"text":"untapped는 unexploited로, yield는 reveal로 바꿀 수 있어요.","hl":"ph"},{"n":68,"text":"Tropical jungles represent unexplored reservoirs of natural history that will become ever more precious as they share their mysteries라는 문장으로 바꾸어 쓸 수 있죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Those people, organizations, and countries \u003cspan class=\"fx\">that possess the highest-quality information\u003c/span> are likely to prosper economically, socially, and politically.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Those people, organizations, and countries\u003c/div>\u003cdiv class=\"k\">그 사람들, 조직들, 그리고 국가들은\u003c/div>\u003cdiv class=\"e\">that possess the highest-quality information\u003c/div>\u003cdiv class=\"k\">최고급의 정보를 소유하는\u003c/div>\u003cdiv class=\"e\">are likely to prosper\u003c/div>\u003cdiv class=\"k\">번영할 것 같다\u003c/div>\u003cdiv class=\"e\">economically, socially, and politically.\u003c/div>\u003cdiv class=\"k\">경제적으로, 사회적으로, 그리고 정치적으로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>선행사 These people, organizations, and countries를 주격 \u003cb class=\"key\">관계대명사\u003c/b> that이 이끄는 절이 수식하는 \u003cb class=\"key\">관계대명사절\u003c/b> 구문이다.\u003c/div>","segs":[{"n":69,"text":"Those people, organizations, and countries, 그 사람들, 조직들, 그리고 국가들은. that possess the highest-quality information, 최고급의 정보를 소유하는. are likely to prosper, 번영할 것 같다. economically, socially, and politically, 경제적으로, 사회적으로, 그리고 정치적으로","hl":"ch"},{"n":70,"text":"열두 번째 문장에서는 선행사로 여러 명사가 나열되어 있고, 이를 주격 관계대명사 that이 이끄는 절이 수식하는 관계대명사절 구조를 다루고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Those people, organizations, and countries \u003cspan class=\"fx\">that possess the highest-quality information\u003c/span> are likely to prosper economically, socially, and politically.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>정보화 시대에 양질의 정보를 선점하는 주체가 사회 각 분야에서 주도권을 잡고 번영을 누리게 된다는 점을 역설한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">possess the highest-quality information\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">hold superior data\u003c/span>\u003cdiv class=\"w\">최고급 정보를 소유한다는 표현을 간결하게 압축했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are likely to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">tend to\u003c/span>\u003cspan class=\"y-eq\">are likely to = tend to\u003c/span>\u003cdiv class=\"w\">~할 것 같다라는 의미의 조동사 표현을 유의어로 교체했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">prosper\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">thrive\u003c/span>\u003cspan class=\"y-eq\">prosper = thrive\u003c/span>\u003cdiv class=\"w\">번영하다라는 동사를 한 단어의 동의어로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Entities and nations armed with superior knowledge tend to succeed across economic, social, and political domains.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"정보화 시대인 오늘날, 최고급 정보를 쥐고 있는 개인이나 국가가 경제와 정치 등 모든 방면에서 성공을 거두게 된다는 점을 말해주고 있죠.","hl":"mn"},{"n":72,"text":"possess the highest-quality information을 hold superior data처럼 간결한 표현으로 바꾸어 쓸 수도 있어요.","hl":"rw"},{"n":73,"text":"are likely to는 tend to로, prosper는 thrive로 바꿀 수 있어요.","hl":"ph"},{"n":74,"text":"Entities and nations armed with superior knowledge tend to succeed across economic, social, and political domains라는 패러프레이징 문장도 함께 기억해 두세요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 23 명사 + 관계대명사절\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>명사 바로 뒤에서 그 명사를 꾸며주는 \u003cb class=\"key\">관계대명사절\u003c/b>은 선행사와의 수일치와 격에 맞는 관계대명사 선택이 핵심이다.\u003c/li>\u003cli>직독직해 연습을 통해 긴 문장 속에서도 \u003cb class=\"key\">구문\u003c/b>의 뼈대를 정확히 파악하는 능력을 길러야 한다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘 우리는 명사 바로 뒤에서 수식하는 관계대명사절의 다양한 형태와 해석 방법을 꼼꼼히 살펴보았어요. 독해를 하다가 명사 뒤에 who나 which, that이 나오면 당황하지 말고 수식 구조를 떠올리며 직독직해를 연습해 보세요. 복습 열심히 하고 다음 유닛에서 만나요.","hl":"sum"}]}]});</script></body></html>
