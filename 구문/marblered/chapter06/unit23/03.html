</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중 능률(김) 6과 본문3","audioDir":"03_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중 능률(김) 6과\u003c/div>\u003ch1>Pet Sitter Finder: A Perfect App for Pet Owners and Pet Lovers\u003c/h1>\u003ch2>Pet Sitter Finder: 반려동물 주인과 애호가를 위한 완벽한 앱\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Pet Sitter Finder는 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">주인\u003c/b>이 믿을 만한 \u003cb class=\"key\">돌보미\u003c/b>를 찾아 후기를 보고 선택하도록 돕는 앱이에요. 개인 정보 노출 우려에는 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 숨기고 소통하는 \u003cb class=\"key\">시스템\u003c/b>으로 답하고 있으며, 반려동물을 키울 수 없는 사람에게도 \u003cb class=\"key\">강아지 \u003c/b>\u003cb class=\"key\">산책의 \u003c/b>\u003cb class=\"key\">즐거움\u003c/b>을 선물해요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Pet Sitter Finder connects pet owners with reliable pet sitters through posts and reviews, and it also lets pet lovers enjoy walking dogs, while the company works on a system that protects users' personal information.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 Pet Sitter Finder라는 반려동물 돌보미 앱을 소개하는 글이에요. 이 앱은 반려동물 주인과 반려동물 애호가를 이어 주는 역할을 하죠. 지문에는 앱의 이용 절차, 사용자의 우려와 회사의 답변, 그리고 또 다른 사용자의 후기가 담겨 있어요. 요지는 이 앱이 두 종류의 사용자 모두에게 도움이 되지만 개인 정보 보호라는 과제도 안고 있다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">요즘은 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">경제\u003c/b>(sharing economy)라는 말처럼, 내가 가진 것과 필요한 것을 앱으로 연결해 주는 서비스가 많아요. 반려동물을 잠시 맡아야 할 때도 마찬가지죠. 주인(owner)은 앱에 게시물(post)을 올리고, 돌보미(sitter)는 메시지로 응답해요. 이때 서로를 평가하는 \u003cb class=\"key\">후기\u003c/b>(review)가 신뢰를 만들어 줍니다. 마치 택시를 부르는 앱에서 기사 평점을 보고 차를 고르는 것과 같은 원리예요. 다만 전화번호 같은 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b>(personal information)가 드러나는 문제는 늘 따라다니기 마련이죠.\u003c/div>","segs":[{"n":2,"text":"요즘은 공유 경제라는 말처럼 내가 가진 것을 필요로 하는 사람과 앱으로 연결해 주는 서비스가 많아요. 반려동물을 잠시 맡아야 할 때도 마찬가지죠. 주인은 앱에 게시물을 올리고, 돌보미가 메시지를 보내요. 이때 서로를 평가하는 후기가 신뢰를 만들어 줍니다. 마치 택시를 부르는 앱에서 기사 평점을 보고 차를 고르는 것과 같은 원리예요. 다만 전화번호 같은 개인 정보가 드러나는 문제는 늘 따라다니기 마련이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>앱 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 번째 문장은 앱의 이름을 내걸고 I can look after your pet!이라고 외치며 독자의 관심을 끌어요. 두 번째 문장에서 Pet Sitter Finder는 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">애호가\u003c/b>와 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">주인\u003c/b> 모두에게 완벽한 앱이라고 소개하죠. 여기서 제시된 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">종류의 \u003c/b>\u003cb class=\"key\">사용자\u003c/b>가 글 전체를 이끄는 열쇠예요. 즉 이 글은 두 종류의 사용자를 겨냥한 앱 소개이자 후기 모음인 셈이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>이용 절차\u003csmall>근거 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>세 번째 문장은 앱이 \u003cb class=\"key\">믿을 \u003c/b>\u003cb class=\"key\">만한 \u003c/b>\u003cb class=\"key\">사람\u003c/b>을 찾도록 도와준다고 기능을 밝혀요. 네 번째와 다섯 번째 문장에서는 주인이 \u003cb class=\"key\">게시물\u003c/b>을 올리면 돌보미나 강아지 산책시키는 사람이 \u003cb class=\"key\">메시지\u003c/b>를 보내는 순서가 나오죠. 여섯 번째 문장에서 주인은 \u003cb class=\"key\">후기\u003c/b>를 확인하고 가장 마음에 드는 사람을 선택해요. 이렇게 만남에서 선택까지의 절차가 차례대로 제시돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>우려 제기\u003csmall>문제 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>George는 교외로 나갈 때마다 이 앱을 쓴다는 \u003cb class=\"key\">사용 \u003c/b>\u003cb class=\"key\">경험\u003c/b>을 먼저 밝혀요. 그런데 though라는 말과 함께 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b>에 대한 걱정을 꺼내죠. 그리고 전화번호가 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">목적\u003c/b>으로 쓰이면 어쩌냐는 질문으로 우려를 구체화해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>해결 응답\u003csmall>해결 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>회사는 이 문제를 \u003cb class=\"key\">인지하고 \u003c/b>\u003cb class=\"key\">있다\u003c/b>고 먼저 인정해요. 그다음 사용자들이 자신의 개인 정보를 보여 주지 않으면서 \u003cb class=\"key\">자유롭게 \u003c/b>\u003cb class=\"key\">소통\u003c/b>할 수 있는 시스템을 개발하는 중이라고 답하죠. 우려를 무시하지 않고 \u003cb class=\"key\">해결책\u003c/b>을 제시하는 대목이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>새로운 사례\u003csmall>예시 · 문장 12–13\u003c/small>\u003c/h4>\u003cp>Samantha는 아파트에서 동물이 허용되지 않아 반려동물이 없다고 말해요. 하지만 However로 방향을 틀어 앱 덕분에 \u003cb class=\"key\">강아지 \u003c/b>\u003cb class=\"key\">산책의 \u003c/b>\u003cb class=\"key\">즐거움\u003c/b>을 경험한다고 고백하죠. 반려동물 주인이 아니어도 혜택을 누릴 수 있다는 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">애호가\u003c/b> 쪽 사례예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문의 흐름을 다섯 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"먼저 앱 소개예요. 첫 번째 문장은 I can look after your pet 이라고 외치며 독자의 관심을 끌고, 두 번째 문장에서 Pet Sitter Finder가 반려동물 애호가와 반려동물 주인 모두에게 완벽한 앱이라고 소개합니다. 여기서 두 종류의 사용자가 글 전체를 이끄는 열쇠라는 점을 꼭 기억해 두세요.","hl":"f0"},{"n":5,"text":"다음은 이용 절차예요. 세 번째 문장에서 앱이 믿을 만한 사람을 찾도록 도와준다고 밝히고, 네 번째와 다섯 번째 문장에서 주인이 게시물을 올리면 돌보미나 강아지 산책시키는 사람이 메시지를 보낸다고 설명해요. 여섯 번째 문장에서는 주인이 후기를 확인하고 가장 마음에 드는 사람을 선택한다고 하죠. 만남부터 선택까지 순서대로 이어집니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 우려 제기예요. George는 교외로 나갈 때마다 앱을 쓴다고 사용 경험을 먼저 밝혀요. 그런데 though라는 말과 함께 개인 정보에 대한 걱정을 꺼내고, 전화번호가 다른 목적으로 쓰이면 어쩌냐고 묻습니다.","hl":"f2"},{"n":7,"text":"네 번째는 회사의 답변이에요. 회사는 이 문제를 인지하고 있다고 먼저 인정합니다. 그리고 사용자들이 자신의 개인 정보를 보여 주지 않으면서 자유롭게 소통할 수 있는 시스템을 개발하는 중이라고 답하죠. 우려를 흘려듣지 않고 해결책을 제시하는 대목이에요.","hl":"f3"},{"n":8,"text":"마지막은 새로운 사례예요. Samantha는 아파트에서 동물이 허용되지 않아 반려동물이 없다고 말합니다. 하지만 However로 방향을 틀어 앱 덕분에 강아지 산책의 즐거움을 경험한다고 고백해요. 반려동물 주인이 아니어도 혜택을 누릴 수 있다는 반려동물 애호가 쪽 사례입니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제와 해결이 섞인 예시 제시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 Pet Sitter Finder가 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">주인\u003c/b>과 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">애호가\u003c/b> 모두에게 완벽한 앱이라고 두 번째 문장에서 먼저 못 박아요. 그 뒤 주인의 이용 절차를 설명하고, George의 우려와 회사의 답변을 \u003cb class=\"key\">문제와 \u003c/b>\u003cb class=\"key\">해결\u003c/b> 방식으로 보여 주죠. 마지막으로 Samantha라는 또 다른 \u003cb class=\"key\">사례\u003c/b>를 붙여 두 대상 모두에게 유용하다는 점을 확인시켜요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>perfect (2)\u003c/b>\u003cspan>주제 제시\u003c/span>\u003cb>When (4)\u003c/b>\u003cspan>조건·상황 제시\u003c/span>\u003cb>then (5)\u003c/b>\u003cspan>다음 단계\u003c/span>\u003cb>though (8)\u003c/b>\u003cspan>대조·반전\u003c/span>\u003cb>What if (9)\u003c/b>\u003cspan>우려·질문 제기\u003c/span>\u003cb>However (13)\u003c/b>\u003cspan>전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">look after their pets\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pet sitters\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">dog walkers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">concerns\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this issue\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">personal information\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">my phone number\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the joy of walking a dog\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 문제와 해결이 섞인 예시형 글이에요. 두 번째 문장에서 Pet Sitter Finder가 반려동물 주인과 반려동물 애호가 모두에게 완벽한 앱이라고 먼저 못 박아요. 그래서 두괄식 구조로 볼 수 있습니다. 뒤에서는 주인의 이용 절차, George의 우려와 회사의 답변, Samantha의 사례가 차례로 붙으면서 앞의 주제문을 뒷받침해요.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. 두 번째 문장의 perfect는 주제를 던지는 신호이고, 여섯 번째 문장의 choose는 절차의 마무리를 알려 줍니다. 여덟 번째 문장의 though는 대조와 반전을 만들고, 아홉 번째 문장의 What if는 우려를 질문으로 구체화하죠. 마지막 문장의 However는 반려동물이 없다는 사실에서 즐거움이라는 결론으로 방향을 트는 신호예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>look after\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pet sitter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반려동물을 돌봐 주는 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>perfect\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>완벽한\u003c/span>\u003c/div>\u003cdiv>\u003cb>pet lover\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반려동물 애호가\u003c/span>\u003c/div>\u003cdiv>\u003cb>pet owner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반려동물 주인\u003c/span>\u003c/div>\u003cdiv>\u003cb>reliable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>믿을 만한\u003c/span>\u003c/div>\u003cdiv>\u003cb>look for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>구하다, 찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>upload\u003c/b>\u003cem>동사\u003c/em>\u003cspan>올리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>post\u003c/b>\u003cem>명사\u003c/em>\u003cspan>게시물\u003c/span>\u003c/div>\u003cdiv>\u003cb>dog walker\u003c/b>\u003cem>명사\u003c/em>\u003cspan>강아지 산책시키는 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>send\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>message\u003c/b>\u003cem>명사\u003c/em>\u003cspan>메시지, 쪽지\u003c/span>\u003c/div>\u003cdiv>\u003cb>review\u003c/b>\u003cem>명사\u003c/em>\u003cspan>후기, 평가\u003c/span>\u003c/div>\u003cdiv>\u003cb>choose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선택하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>whenever\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~할 때마다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go out of town\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>교외로 나가다, 타지로 가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>concern\u003c/b>\u003cem>명사\u003c/em>\u003cspan>걱정, 우려\u003c/span>\u003c/div>\u003cdiv>\u003cb>personal information\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인 정보\u003c/span>\u003c/div>\u003cdiv>\u003cb>purpose\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목적\u003c/span>\u003c/div>\u003cdiv>\u003cb>be aware of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 인지하고 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>issue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문제, 쟁점\u003c/span>\u003c/div>\u003cdiv>\u003cb>develop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>개발하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>system\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시스템, 체계\u003c/span>\u003c/div>\u003cdiv>\u003cb>allow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>허용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>communicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소통하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>freely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자유롭게\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>joy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>즐거움\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚을게요. look after는 돌보다, reliable은 믿을 만한이라는 뜻이고, be aware of는 인지하고 있다는 의미예요. develop은 개발하다, communicate는 소통하다로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">reliable\u003c/b>\u003cspan class=\"m\">믿을 만한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trustworthy\u003c/span>\u003cspan class=\"s\">dependable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unreliable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">concern\u003c/b>\u003cspan class=\"m\">걱정, 우려\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">worry\u003c/span>\u003cspan class=\"s\">anxiety\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relief\u003c/span>\u003cspan class=\"a\">confidence\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">choose\u003c/b>\u003cspan class=\"m\">선택하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">select\u003c/span>\u003cspan class=\"s\">pick\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">allow\u003c/b>\u003cspan class=\"m\">허용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">permit\u003c/span>\u003cspan class=\"s\">let\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forbid\u003c/span>\u003cspan class=\"a\">ban\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">issue\u003c/b>\u003cspan class=\"m\">문제\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">problem\u003c/span>\u003cspan class=\"s\">matter\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">solution\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">develop\u003c/b>\u003cspan class=\"m\">개발하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">create\u003c/span>\u003cspan class=\"s\">build\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">abandon\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">joy\u003c/b>\u003cspan class=\"m\">즐거움\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">delight\u003c/span>\u003cspan class=\"s\">pleasure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sorrow\u003c/span>\u003cspan class=\"a\">sadness\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. reliable은 trustworthy, dependable와 가깝고 unreliable은 반대말이에요. concern은 worry, anxiety와 비슷하고 relief가 반대쪽이고, choose는 select, pick과 같으며 reject가 반대입니다. allow는 permit, let과 통하고 forbid가 반대말이에요. develop은 create, build와 가깝고 destroy가 반대이며, joy는 delight, pleasure와 같고 sorrow가 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌볼 수 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">after\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 반려동물을!\u003c/span>\u003cspan class=\"en\">your pet!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">제가 당신의 반려동물을 돌볼 수 있어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앱 사용자를 향해 말을 거는 짧은 감탄문으로, 반려동물 주인에게 서비스를 제안하는 첫 문장이에요. \u003cb class=\"key\">can\u003c/b>은 '~할 수 있다'는 능력을, \u003cb class=\"key\">look \u003c/b>\u003cb class=\"key\">after\u003c/b>는 '돌보다, 보살피다'라는 뜻을 담당해요. 딱딱한 안내문 대신 \u003cb class=\"key\">친근한 \u003c/b>\u003cb class=\"key\">목소리\u003c/b>로 앱의 쓰임을 미리 보여 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형(능력)\u003c/span> : [주어] + [[can]] + [동사원형] = [주어]는 ~할 수 있다 : \"돌볼 수 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(이어동사) look after\u003c/span> : look after + [목적어] = [목적어]를 돌보다 : \"돌보다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"I, 나는. can look after, 돌볼 수 있어요. your pet!, 당신의 반려동물을!. 이 문장 전체를 해석하면, 제가 당신의 반려동물을 돌볼 수 있어요!","hl":"m"},{"n":14,"text":"이 문장은 앱 화면에 뜬 광고 문구처럼 반려동물 주인에게 말을 거는 문장이에요. can은 할 수 있다는 뜻이고 look after는 돌보다라는 뜻이에요. 짧게 던지는 감탄문이라서 친근한 목소리가 느껴지죠.","hl":"mn"},{"n":15,"text":"첫 번째로 can look after를 보면 can 뒤에 동사원형이 온다는 규칙이 그대로 지켜졌어요. 조동사가 나오면 뒤에는 동사원형, 이건 꼭 기억해야 해요. 두 번째로 look after는 after가 전치사로 붙어서 돌보다라는 뜻을 만드는 구동사예요. 그래서 목적어인 your pet이 after 뒤에 와야 자연스러운 문장이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Pet Sitter Finder는\u003c/span>\u003cspan class=\"en\">Pet Sitter Finder\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완벽한 앱이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">perfect \u003c/span>\u003cspan class=\"tgt\">app \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반려동물 애호가들을 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">pet \u003c/span>\u003cspan class=\"tgt\">lovers \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 반려동물 주인들을 위한.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">pet \u003c/span>\u003cspan class=\"tgt\">owners\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Pet Sitter Finder는 반려동물 애호가들과 반려동물 주인들을 위한 완벽한 앱이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앱의 이름을 처음 내세우며 어떤 사람을 위한 앱인지 \u003cb class=\"key\">정의\u003c/b>해 주는 문장이에요. for 이하가 명사 app을 뒤에서 꾸며 주면서 \u003cb class=\"key\">사용 \u003c/b>\u003cb class=\"key\">대상\u003c/b>을 분명히 밝혀요. 애호가와 주인이라는 두 집단을 함께 묶어 \u003cb class=\"key\">앱의 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 한 문장으로 제시하는 도입 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 for의 용도·대상 표시\u003c/span> : [명사] + for + [대상] = [대상]을 위한 [명사] : \"…을 위한 완벽한 앱이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조(and로 연결된 명사구)\u003c/span> : [명사구 A] + and + [명사구 B] : \"반려동물 애호가들과 반려동물 주인들\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Pet Sitter Finder, Pet Sitter Finder는. is the perfect app, 완벽한 앱이다. for pet lovers, 반려동물 애호가들을 위한. and pet owners, 그리고 반려동물 주인들을 위한.. 이 문장 전체를 해석하면, Pet Sitter Finder는 반려동물 애호가들과 반려동물 주인들을 위한 완벽한 앱이다.","hl":"m"},{"n":17,"text":"이 문장은 앱 이름을 처음 소개하면서 어떤 사람을 위한 앱인지 정의해 주는 문장이에요. for 이하가 앞의 app을 뒤에서 꾸며 주니까 반려동물 애호가와 주인 모두를 대상으로 삼는다는 게 한눈에 보이죠. 도입부에서 앱의 목적을 한 문장으로 딱 정리해 주는 역할이에요.","hl":"mn"},{"n":18,"text":"첫 번째로 is the perfect app for를 보면 전치사 for가 사용 대상을 한정해 주고 있어요. for 뒤에 오는 말이 곧 이 앱을 쓰는 사람들이라는 뜻이죠. 두 번째로 pet lovers and pet owners는 and로 두 명사구를 대등하게 연결한 병렬 구조예요. 그래서 pet이 두 번 나와도 하나의 덩어리처럼 자연스럽게 읽힌답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 돕는다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">helps \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반려동물 주인들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">pet \u003c/span>\u003cspan class=\"tgt\">owners \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">믿을 만한 사람들을 찾도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">find\u003c/span> reliable people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 반려동물을 돌볼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">pets\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 반려동물 주인들이 그들의 반려동물을 돌봐 줄 믿을 만한 사람들을 찾도록 돕는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> It은 바로 앞의 Pet Sitter Finder를 가리 n":23,"text":"이 문장은 앱 사용 절차의 시작을 알려 줘요. when이 '~할 때'라는 상황을 만들어 주고, 그 상황에서 주인은 앱에 게시물을 올린다고 말하고 있죠. 바로 이 게시물이 시작점이 되어서 다음 문장의 돌보미들 반응으로 이어진답니다.","hl":"mn"},{"n":24,"text":"먼저 when이 이끄는 시간 부사절부터 볼게요. when은 '~할 때'라는 시간을 나타내는 접속사이고 뒤에 주어와 동사가 있는 절이 옵니다. 그리고 시간 부사절 안에서는 미래의 일이라도 현재 시제를 쓴다는 것, 꼭 기억해 두세요. 두 번째로 he or she를 보면, 주인이 남자인지 여자인지 모를 때 단수 대명사 he or she로 받아 줍니다. 마지막으로 uploads는 주어가 단수라서 동사에 -s를 붙인 형태예요. 주어와 동사의 수 일치를 맞춰 주는 것이 핵심입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반려동물을 돌보는 사람들이나 강아지를 산책시키는 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Pet \u003c/span>\u003cspan class=\"tgt\">sitters \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">dog \u003c/span>\u003cspan class=\"tgt\">walkers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 보낼 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">then \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">send \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">메시지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">messages \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주인에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">owner\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 반려동물을 돌보는 사람들이나 강아지를 산책시키는 사람들이 주인에게 메시지를 보낼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 게시물을 본 돌보미들이 주인에게 연락하는 단계예요. or로 두 종류의 사람을 묶어 \u003cb class=\"key\">대상\u003c/b>을 넓히고, can이 '~할 수 있다'는 \u003cb class=\"key\">가능\u003c/b>을 나타냅니다. send messages to로 메시지가 향하는 \u003cb class=\"key\">방향\u003c/b>을 분명히 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 or의 병렬\u003c/span> : [명사 A] or [명사 B] : \"반려동물을 돌보는 사람들이나 강아지를 산책시키는 사람들이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [조동사 can] + [동사원형 send] : \"그러면 보낼 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">send + 목적어 + to + 대상\u003c/span> : send + [목적어 messages] + to + [대상 the owner] : \"주인에게 메시지를 보내다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Pet sitters or dog walkers, 반려동물을 돌보는 사람들이나 강아지를 산책시키는 사람들이. can then send, 그러면 보낼 수 있다. messages, 메시지를. to the owner, 주인에게. 이 문장 전체를 해석하면, 그러면 반려동물을 돌보는 사람들이나 강아지를 산책시키는 사람들이 주인에게 메시지를 보낼 수 있다.","hl":"m"},{"n":26,"text":"이제 게시물을 본 사람들이 움직일 차례예요. or로 반려동물을 돌보는 사람들과 강아지를 산책시키는 사람들을 함께 묶어서 대상의 폭을 넓혔고, can이 '~할 수 있다'는 가능을 나타냅니다. 그리고 send messages to the owner라고 해서 메시지가 주인 쪽으로 향한다는 방향을 분명히 보여 주고 있어요.","hl":"mn"},{"n":27,"text":"먼저 Pet sitters or dog walkers를 보세요. or가 두 명사를 병렬로 이어서 'A 또는 B'라는 선택의 뜻을 만들어 주고, 여기서는 두 종류의 사람을 한 묶음으로 주어 자리에 세웠습니다. 두 번째로 can then send에서는 조동사 뒤에 언제나 동사원형이 온다는 점을 확인하세요. then은 앞 절차에 이어지는 다음 단계라는 걸 알려 주는 부사입니다. 마지막으로 'A에게 B를 보내다'는 send B to A 순서로 쓰고, 여기서 to가 메시지가 향하는 대상을 표시해 준다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주인은\u003c/span>\u003cspan class=\"en\">The owner\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 후기를 확인하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">checks \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">reviews \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 선택한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">chooses\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 마음에 드는 사람을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">person\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">주인은 그들의 후기를 확인하고 가장 마음에 드는 사람을 선택한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인이 후보들의 후기를 살펴보고 최종적으로 한 사람을 고르는 단계예요. checks와 chooses가 and로 \u003cb class=\"key\">병렬\u003c/b>을 이루어 두 행동이 이어짐을 보여 줍니다. their은 앞에 나온 돌보미들을 가리키고, the best person이 선택의 \u003cb class=\"key\">결과\u003c/b>를 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and로 연결된 동사 병렬\u003c/span> : [주어 The owner] + [동사 checks ~] + and + [동사 chooses ~] : \"후기를 확인하고 선택한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급 형용사 the best\u003c/span> : the + [최상급 best] + [명사 person] : \"가장 마음에 드는 사람\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"The owner, 주인은. checks their reviews, 그들의 후기를 확인하고. and chooses, 그리고 선택한다. the best person, 가장 마음에 드는 사람을. 이 문장 전체를 해석하면, 주인은 그들의 후기를 확인하고 가장 마음에 드는 사람을 선택한다.","hl":"m"},{"n":29,"text":"이제 주인이 결정을 내리는 단계예요. checks와 chooses가 and로 병렬을 이루면서 후기를 보고 고르는 두 행동이 자연스럽게 이어진다는 걸 보여 줍니다. their은 앞에 나온 돌보미들을 가리키고, the best person으로 선택의 결과를 깔끔하게 마무리하고 있어요.","hl":"mn"},{"n":30,"text":"여기서 핵심은 checks their reviews and chooses가 and로 병렬로 연결되어 주어 The owner를 함께 공유한다는 점이에요. 주어가 단수이기 때문에 두 동사 모두 -s가 붙은 단수 형태로 쓰였습니다. 그리고 the best person에서는 여러 후보 중 가장 좋은 하나를 고를 때 최상급을 쓰고 앞에 the를 붙인다는 규칙을 확인할 수 있어요. 이 표현이 후보들 중 한 명을 선택한다는 문맥을 완성해 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조지 / 2019년 11월 12일\u003c/span>\u003cspan class=\"en\">George / November 12, 2019\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 이 앱을 사용해요\u003c/span>\u003cspan class=\"en\">I use this app\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교외로 나갈 때마다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">whenever \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">town\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">George / 2019년 11월 12일 저는 교외로 나갈 때마다 이 앱을 사용해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 조지가 이 앱을 언제 쓰는지 소개하는 문장이에요. 'go out of town'은 '\u003cb class=\"key\">교외로 \u003c/b>\u003cb class=\"key\">나가다\u003c/b>', 즉 '타지로 여행 가다'라는 뜻의 \u003cb class=\"key\">숙어\u003c/b>예요. 앞부분에서 앱의 사용법을 설명했으니, 여기서부터는 실제 \u003cb class=\"key\">사용자 \u003c/b>\u003cb class=\"key\">후기\u003c/b>가 시작되는 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복합관계부사 whenever + 시간 부사절\u003c/span> : [whenever + 주어 + 동사] = ~할 때마다 (~하는 모든 때에) : \"교외로 나갈 때마다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형의 미래 표현\u003c/span> : [be동사 + 동사원형-ing] = ~하는 중이다 / ~할 예정이다 : \"나갈 예정이에요\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"George / November 12, 2019, 조지 / 2019년 11월 12일. I use this app, 저는 이 앱을 사용해요. whenever I'm going out of town, 교외로 나갈 때마다. 이 문장 전체를 해석하면, George / 2019년 11월 12일 저는 교외로 나갈 때마다 이 앱을 사용해요.","hl":"m"},{"n":32,"text":"조지가 이 앱을 언제 쓰는지 소개하는 문장이에요. go out of town은 교외로 나가다, 즉 타지로 여행 가다는 뜻의 숙어죠. 앞에서 앱 사용법을 설명했으니 여기서부터는 실제 사용자 후기가 시작된다고 보면 돼요.","hl":"mn"},{"n":33,"text":"첫 번째는 whenever예요. when에 ever가 붙은 복합관계부사로 ~할 때마다라는 시간 부사절을 이끌어요. 부사절 안에서는 미래의 일이라도 현재시제로 쓴다는 것도 꼭 기억해 두세요. 두 번째는 I'm going인데, be동사에 동사원형 ing를 붙인 현재진행형이 가까운 미래의 예정된 행동을 나타내요. 여기서 go out of town은 교외로 나가다는 뜻의 숙어로 여행을 떠난다는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 가지고 있어요\u003c/span>\u003cspan class=\"en\">I have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 걱정이\u003c/span>\u003cspan class=\"en\">some concerns\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 개인 정보에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">personal \u003c/span>\u003cspan class=\"tgt\">information\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">though\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 저는 제 개인 정보에 대한 몇 가지 걱정이 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 앱을 편하게 쓴다고 말한 조지가 이번에는 \u003cb class=\"key\">우려\u003c/b>를 꺼내는 문장이에요. 정보를 다루는 앱이다 보니 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b>가 새지 않을까 걱정된다는 뜻이죠. 문장 끝의 though가 앞 내용과 \u003cb class=\"key\">대조\u003c/b>를 이룬다는 신호예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [concerns + about + 명사] = ~에 대한 걱정 : \"제 개인 정보에 대한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속부사 though (문장 끝)\u003c/span> : [문장 + , + though] = 그렇지만, 그래도 : \"하지만\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"I have, 저는 가지고 있어요. some concerns, 몇 가지 걱정이. about my personal information, 제 개인 정보에 대한. though, 하지만. 이 문장 전체를 해석하면, 하지만 저는 제 개인 정보에 대한 몇 가지 걱정이 있어요.","hl":"m"},{"n":35,"text":"조지는 앱을 편하게 쓴다고 말한 직후에 하지만이라는 말로 분위기를 바꿔요. 개인 정보를 다루는 앱이다 보니 정보가 새지 않을까 하는 우려를 꺼내는 거죠. 그래서 이 문장이 뒤에 이어지는 구체적인 걱정의 출발점이 돼요.","hl":"mn"},{"n":36,"text":"첫 번째는 though인데요, 문장 끝에 오면 접속사가 아니라 그렇지만이라는 뜻의 접속부사가 되어 앞 내용에 역접을 더해요. 앞에서 좋다고 했으니 대조되는 말이 온다는 신호로 봐야 해요. 두 번째는 about my personal information이고요, 전치사구가 앞의 concerns를 뒤에서 꾸며 주면서 개인 정보에 대한 걱정이라고 해석해요. about은 관련의 뜻을 가진 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 ~하면 어쩌죠\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">if\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 제 전화번호를 사용하면\u003c/span>\u003cspan class=\"en\">people use my phone number\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 목적으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">purposes\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 사람들이 제 전화번호를 다른 목적으로 사용하면 어쩌죠?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 조지가 걱정하는 점을 \u003cb class=\"key\">의문문\u003c/b> 형태로 구체적으로 꺼내는 문장이에요. 내 전화번호가 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">목적\u003c/b>으로 쓰이면 어쩌지 하는 우려를 담고 있죠. What if는 답을 요구하는 질문이 아니라 걱정을 드러내는 \u003cb class=\"key\">관용표현\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용표현 What if ~?\u003c/span> : [What if + 주어 + 동사?] = 만약 ~하면 어쩌지? : \"만약 ~하면 어쩌죠?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for의 목적 표현\u003c/span> : [for + 명사] = ~을 위해, ~의 목적으로 : \"다른 목적으로\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"What if, 만약 ~하면 어쩌죠. people use my phone number, 사람들이 제 전화번호를 사용하면. for other purposes?, 다른 목적으로. 이 문장 전체를 해석하면, 만약 사람들이 제 전화번호를 다른 목적으로 사용하면 어쩌죠?","hl":"m"},{"n":38,"text":"조지가 걱정하는 내용을 구체적으로 꺼내는 문장이에요. 내 전화번호가 엉뚱한 곳에 쓰이면 어쩌지 하는 마음을 의문문 형태로 표현한 거죠. 여기서 What if는 대답을 요구하는 질문이 아니라 걱정을 털어놓는 관용표현이에요.","hl":"mn"},{"n":39,"text":"첫 번째는 What if예요. What will happen if가 줄어든 관용표현으로, 만약 그러면 어쩌지라는 걱정과 우려를 나타내는 말이에요. 두 번째는 for other purposes인데, for가 목적을 나타내는 전치사라서 다른 목적으로라고 해석하고, purpose는 목적이라는 뜻이라 복수형 purposes로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">펫 시터 파인더 / 2019년 11월 14일\u003c/span>\u003cspan class=\"en\">Pet Sitter Finder / November 14, 2019\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희는 인지하고 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">We're \u003c/span>\u003cspan class=\"tgt\">aware \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 문제를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">issue\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Pet Sitter Finder / 2019년 11월 14일 저희는 이 문제를 인지하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앱 제작사가 사용자의 개인 정보 우려에 공식적으로 답하는 부분입니다. 앞서 George가 제기한 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b> 걱정에 대해 제작사가 '우리도 \u003cb class=\"key\">인지하고 \u003c/b>\u003cb class=\"key\">있다\u003c/b>'고 짧게 인정하며, 다음 문장에서 해결책을 예고하는 \u003cb class=\"key\">연결\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be aware of + 명사 (숙어 표현)\u003c/span> : [주어] + be aware of + [명사]: ~을 인지하고 있다 : \"저희는 이 문제를 인지하고 있습니다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Pet Sitter Finder / November 14, 2019, 펫 시터 파인더 / 2019년 11월 14일. We're aware, 저희는 인지하고 있습니다. of this issue, 이 문제를. 이 문장 전체를 해석하면, Pet Sitter Finder / 2019년 11월 14일 저희는 이 문제를 인지하고 있습니다.","hl":"m"},{"n":41,"text":"이 문장은 앱 제작사가 답글을 다는 부분이에요. 앞에서 George가 개인 정보가 걱정된다고 했죠. 그 걱정에 대해 저희도 그 문제를 인지하고 있다고 짧게 인정하는 문장이고, 바로 다음 문장에서 해결책을 내놓게 됩니다. 그래서 이 문장은 다음 내용을 이어 주는 연결 역할을 해요.","hl":"mn"},{"n":42,"text":"어법 포인트는 하나예요. 첫 번째, be aware of는 '~을 인지하고 있다'라는 숙어 표현이에요. aware는 인지하고 있는이라는 형용사라서 뒤에 전치사 of를 꼭 붙여서 of this issue처럼 명사를 받아 줍니다. 그리고 We're는 We are의 줄임말인 현재시제라는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희는 현재 개발하는 중입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">We're \u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">developing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시스템을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">system \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용자들이 ~하도록 허용하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">allows \u003c/span>\u003cspan class=\"tgt\">users \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자유롭게 소통하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">communicate\u003c/span> freely\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보여 주지 않으면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">showing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 개인 정보를\u003c/span>\u003cspan class=\"en\">their personal information.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">현재 저희는 사용자분들이 자신의 개인 정보를 보여 주지 않으면서 자유롭게 소통할 수 있게 해 주는 시스템을 개발하는 중입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> now와 developing으로 \u003cb class=\"key\">현재 \u003c/b>\u003cb class=\"key\">진행\u003c/b> 중인 개선 작업을 보여 주며, 개인 정보를 \u003cb class=\"key\">노출\u003c/b>하지 않고 소통할 수 있는 시스템을 만들고 있다고 답합니다. 사용자의 걱정을 실제로 \u003cb class=\"key\">해결\u003c/b>하겠다는 앱의 의지를 밝히는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형 (be + -ing)\u003c/span> : [주어] + be동사 + -ing: 지금 ~하는 중이다 : \"저희는 현재 개발하는 중입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 that (주격)\u003c/span> : [선행사 a system] + that + [동사 allows]: ~하는 시스템 : \"사용자들이 ~하도록 허용하는 시스템\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격보어 to부정사 (allow + 목적어 + to부정사)\u003c/span> : allow + [목적어 users] + [to부정사 to communicate] : \"사용자들이 소통하도록 허용하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 without + 동명사\u003c/span> : without + [동명사 -ing]: ~하지 않고, ~함이 없이 : \"보여 주지 않으면서\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"We're now developing, 저희는 현재 개발하는 중입니다. a system, 시스템을. that allows users, 사용자들이 ~하도록 허용하는. to communicate freely, 자유롭게 소통하도록. without showing, 보여 주지 않으면서. their personal information, 자신의 개인 정보를. 이 문장 전체를 해석하면, 현재 저희는 사용자분들이 자신의 개인 정보를 보여 주지 않으면서 자유롭게 소통할 수 있게 해 주는 시스템을 개발하는 중입니다.","hl":"m"},{"n":44,"text":"여기서는 now와 developing이 함께 쓰여서 지금 개발이 진행 중이라는 점을 보여 줘요. 사용자들이 자신의 개인 정보를 보여 주지 않으면서도 자유롭게 소통할 수 있는 시스템을 만들고 있다는 거죠. 결국 사용자의 걱정을 실제로 해결하겠다는 앱의 의지를 밝히는 문장이에요.","hl":"mn"},{"n":45,"text":"어법 포인트를 순서대로 짚어 볼게요. 첫 번째, We're now developing은 현재진행형이에요. now와 함께 쓰여 지금 개발하는 중이라는 진행을 나타내죠. 두 번째, a system that allows users에서 that은 주격 관계대명사예요. 선행사 a system을 뒤에서 꾸며 주고, 바로 뒤에 동사 allows가 와서 주격임을 알 수 있어요. 세 번째, allow는 목적어 users 뒤에 to부정사 to communicate를 목적격보어로 데려와요. 그래서 사용자들이 소통하도록 허락한다는 뜻이 되죠. 네 번째, without 뒤에는 동명사가 와야 해서 showing이 된 거예요. 보여 줌이 없이, 즉 보여 주지 않으면서라는 부정의 의미를 담고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사만다 / 2020년 2월 22일\u003c/span>\u003cspan class=\"en\">Samantha / February 22, 2020\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물은 허용되지 않아요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Animals \u003c/span>\u003cspan class=\"tgt\">aren't \u003c/span>\u003cspan class=\"tgt\">allowed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 아파트에서는\u003c/span>\u003cspan class=\"en\">in my apartment,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 반려동물을 한 마리도 키우지 않아요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">pets\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Samantha / 2020년 2월 22일 제 아파트에서는 동물이 허용되지 않아서, 저는 반려동물을 한 마리도 키우지 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Samantha가 반려동물을 키울 수 없는 \u003cb class=\"key\">현실\u003c/b>을 먼저 말하고, 앱 덕분에 산책의 \u003cb class=\"key\">즐거움\u003c/b>을 경험한다고 덧붙입니다. 반려동물이 없는 사람에게도 이 앱이 쓸모가 있다는 \u003cb class=\"key\">효용\u003c/b>을 보여 주는 사례 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be + 과거분사)\u003c/span> : [주어 Animals] + be동사 + [과거분사 allowed]: 동물들은 허용되지 않는다 : \"동물은 허용되지 않아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 so + 부정문의 any\u003c/span> : [원인] + so + [결과] / 부정문 + any + 복수명사 : \"그래서 저는 반려동물을 한 마리도 키우지 않아요\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Samantha / February 22, 2020, 사만다 / 2020년 2월 22일. Animals aren't allowed, 동물은 허용되지 않아요. in my apartment, 제 아파트에서는. so, 그래서. I don't have any pets, 저는 반려동물을 한 마리도 키우지 않아요. 이 문장 전체를 해석하면, Samantha / 2020년 2월 22일 제 아파트에서는 동물이 허용되지 않아서, 저는 반려동물을 한 마리도 키우지 않아요.","hl":"m"},{"n":47,"text":"Samantha는 아파트에서 동물을 키울 수 없다는 현실을 먼저 말해요. 그런데 이 앱을 이용하면 강아지 산책의 즐거움을 경험할 수 있다고 덧붙이죠. 반려동물이 없는 사람에게도 이 앱이 쓸모가 있다는 것을 보여 주는 사례예요.","hl":"mn"},{"n":48,"text":"어법 포인트 두 가지를 짚어 볼게요. 첫 번째, Animals aren't allowed는 수동태예요. 동물은 허용하는 주체가 아니라 허용되는 대상이니까 수동태를 써야 하고, be동사 뒤에 과거분사 allowed가 온 거예요. 두 번째, so I don't have any pets에서 so는 앞의 내용을 원인으로 받아 결과를 이어 주는 등위접속사예요. 그리고 부정문이니까 some 대신 any를 써서 반려동물을 한 마리도 키우지 않는다는 뜻을 만든 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan cl 거움을. 이 문장 전체를 해석하면, 하지만 Pet Sitter Finder를 이용함으로써 저는 강아지를 산책시키는 즐거움을 경험할 수 있어요.","hl":"m"},{"n":50,"text":"이 문장은 앞에서 반려동물을 키울 수 없다고 말한 상황을 이어받아요. 직접 키울 수는 없지만 Pet Sitter Finder를 통해 간접적으로 그 즐거움을 누린다는 뜻이죠. 결국 이 앱의 또 다른 장점을 보여 주는 문장이에요.","hl":"mn"},{"n":51,"text":"첫 번째 어법 포인트는 전치사 by 뒤에 동명사가 온다는 점이에요. by using이라고 해서 '이용함으로써'라는 수단을 나타내죠. 두 번째는 조동사 can 뒤에 동사원형이 온다는 것이고, 여기서는 가능의 의미로 '경험할 수 있어요'라고 해석해요. 세 번째는 전치사 of 뒤의 동명사 walking이 목적어 a dog를 데리고 와서 명사처럼 '강아지를 산책시키는 즐거움'이 되는 구조예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Pet Sitter Finder는 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">주인\u003c/b>과 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">애호가\u003c/b> 모두를 위한 완벽한 앱이에요.\u003c/li>\u003cli>주인은 게시물을 올리고 돌보미는 메시지를 보내며, 주인은 \u003cb class=\"key\">후기\u003c/b>를 확인하고 가장 마음에 드는 사람을 선택해요.\u003c/li>\u003cli>George는 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b>가 다른 목적으로 쓰일까 걱정했고, 회사는 개인 정보를 보여 주지 않고 소통하는 \u003cb class=\"key\">시스템\u003c/b>을 개발 중이라고 답했어요.\u003c/li>\u003cli>Samantha는 반려동물을 키울 수 없지만 앱으로 \u003cb class=\"key\">강아지 \u003c/b>\u003cb class=\"key\">산책의 \u003c/b>\u003cb class=\"key\">즐거움\u003c/b>을 경험해요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Pet Sitter Finder connects pet owners with reliable pet sitters through posts and reviews, and it also lets pet lovers enjoy walking dogs, while the company works on a system that protects users' personal information.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Pet Sitter Finder는 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">주인\u003c/b>이 믿을 만한 \u003cb class=\"key\">돌보미\u003c/b>를 찾아 후기를 보고 선택하도록 돕는 앱이에요. 개인 정보 노출 우려에는 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 숨기고 소통하는 \u003cb class=\"key\">시스템\u003c/b>으로 답하고 있으며, 반려동물을 키울 수 없는 사람에게도 \u003cb class=\"key\">강아지 \u003c/b>\u003cb class=\"key\">산책의 \u003c/b>\u003cb class=\"key\">즐거움\u003c/b>을 선물해요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"정리해 볼게요. 이 글은 Pet Sitter Finder가 반려동물 주인과 반려동물 애호가 모두에게 유용하다는 점을 후기 형식으로 보여 줍니다. 동시에 개인 정보 보호라는 과제를 회사가 해결하는 중이라는 점도 놓치지 마세요. 오늘 내용 복습 잘 하시고, 다음 시간에 만나요. 수고했어요!","hl":null}]}]});</script></body></html>
