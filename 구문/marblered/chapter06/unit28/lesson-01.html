  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

lecturePlayer(document.getElementById("app"),{"brand":"unit28","title":"Unit 28 명사, 관계사절","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>Unit 28 명사, 관계사절\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>콤마 뒤 관계사절과 「부정대명사 + of + 관계대명사」를 이용해 명사와 앞 절을 자연스럽게 보충 설명할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 명사와 관계사절을 이어 주는 구문을 집중적으로 연습해 볼 거예요. 콤마 뒤에 who나 which, when이나 where가 나오면 앞의 명사나 앞 절을 덧붙여 설명한다는 느낌으로 읽으면 됩니다. some of which나 each of which처럼 of와 관계대명사가 결합한 표현도 함께 익혀 볼게요. 직독직해부터 뜻, 바꿔 쓰기까지 차근차근 따라와 주세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">콤마 뒤의 \u003cb class=\"key\">주격 관계대명사 who/which\u003c/b>는 앞 명사나 앞 절 전체를 보충 설명하는 계속적 용법으로 쓰인다. \u003cb class=\"key\">관계부사 when/where\u003c/b>는 앞의 시간·장소 명사 뒤에서 and then, and there의 의미로 이어지며, \u003cb class=\"key\">부정대명사 + of + 관계대명사\u003c/b>는 '~중 일부/각각'으로 해석한다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Costa Rica was discovered and named by Christopher Columbus, \u003cspan class=\"fx\">who thought it might be a land rich with gold\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 Change, \u003cspan class=\"fx\">which is an essential part of our life\u003c/span>, can have both positive and negative effects.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 Yesterday is history, tomorrow is a mystery, today is a gift of God, \u003cspan class=\"fx\">which is why we call it the present\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Urbanization has been taking place since the Neolithic Revolution, \u003cspan class=\"fx\">when agriculture enabled food surpluses to create a division of labor in settlements\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Homer's Iliad, \u003cspan class=\"fx\">which contained descriptions of actual places\u003c/span>, was the basis for many early maps.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Cognitive computing is supported by machine learning and deep learning technology, \u003cspan class=\"fx\">which allows computers to autonomously learn from data\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07  Maurice Maeterlinck studied law and worked as a lawyer until 1889, \u003cspan class=\"fx\">when he decided to devote himself to writing. In 1897, he went to Paris, where he met many of the leading symbolist writers of the day\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Jobs may not be permanent, and you may lose your job for countless reasons, \u003cspan class=\"fx\">some of which you may not even be responsible for\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 The spontaneous wish to learn, \u003cspan class=\"fx\">which every normal child has\u003c/span>, as shown in their efforts to walk and talk, should be the driving force in education.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 The bodies of all living creatures are organized into many different systems, \u003cspan class=\"fx\">each of which has a certain function\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 One remarkable aspect of aboriginal culture is the concept of &quot;totemism,&quot; \u003cspan class=\"fx\">where the tribal member at birth assumes the soul and identity of a part of nature\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 The television crime drama isn't such a hit with police officers, \u003cspan class=\"fx\">who have criticized the series for presenting a highly misleading image of how crimes are solved\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 콤마 뒤의 who나 which를 보세요. 이 관계대명사는 앞에 있는 명사나 앞 절 전체를 덧붙여 설명하는 계속적 용법으로 쓰여요. when이나 where는 앞의 시간이나 장소를 and then, and there처럼 이어 주는 관계부사로 이해하면 쉽습니다. 그리고 some of which나 each of which는 부정대명사와 관계대명사가 of로 연결된 형태로, 우리말로는 그것들 중 일부, 각각의 것처럼 해석해요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Costa Rica was discovered and named by Christopher Columbus, \u003cspan class=\"fx\">who thought it might be a land rich with gold\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Costa Rica was discovered and named\u003c/div>\u003cdiv class=\"k\">코스타리카는 발견되고 명명되었다\u003c/div>\u003cdiv class=\"e\">by Christopher Columbus,\u003c/div>\u003cdiv class=\"k\">크리스토퍼 콜럼버스에 의해\u003c/div>\u003cdiv class=\"e\">who thought it might be a land rich with gold.\u003c/div>\u003cdiv class=\"k\">그리고 그는 그것이 금이 풍부한 땅일 것이라고 생각했다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주격 관계대명사 \u003cb class=\"key\">who\u003c/b>가 이끄는 절이 Christopher Columbus를 보충 설명한다. 관계사절 안의 thought 뒤에는 명사절을 이끄는 접속사 \u003cb class=\"key\">that\u003c/b>이 생략되어 thought (that) it might ~의 구조로 이해한다.\u003c/div>","segs":[{"n":3,"text":"Costa Rica was discovered and named, 코스타리카는 발견되고 명명되었다. by Christopher Columbus, 크리스토퍼 콜럼버스에 의해. who thought it might be a land rich with gold, 그리고 그는 그것이 금이 풍부한 땅일 것이라고 생각했다","hl":"ch"},{"n":4,"text":"첫 번째 문장을 보면 Christopher Columbus 뒤에 콤마와 who가 나오죠. 여기서 who는 콜럼버스가 어떤 사람인지 덧붙여 설명하는 주격 관계대명사예요. 그리고 thought 뒤에는 that이 생략되어 있어서, 그는 그것이 금이 풍부한 땅일 수도 있다고 생각했다는 구조로 읽으면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Costa Rica was discovered and named by Christopher Columbus, \u003cspan class=\"fx\">who thought it might be a land rich with gold\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>코스타리카라는 이름은 콜럼버스가 붙였고, 그는 이 땅에 금이 많을 것이라고 기대했다는 뜻이다. 즉 콜럼버스가 발견하고 이름을 지었는데, 그는 그곳이 금이 풍부한 땅이라고 생각했다는 배경 설명을 담고 있다. who 이하는 콜럼버스에 대한 추가 정보이므로 없어도 문장의 뼈대는 유지된다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">who thought it might be a land rich with gold\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">and he thought it might be a land rich with gold\u003c/span>\u003cdiv class=\"w\">계속적 관계사절을 and로 이어 주면 두 문장처럼 쉽게 풀어 쓸 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a land rich with gold\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a land abundant in gold\u003c/span>\u003cdiv class=\"w\">rich with는 '~이 풍부한'이라는 뜻으로 abundant in으로 바꿔 쓸 수 있다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be discovered and named by\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be found and given its name by\u003c/span>\u003cspan class=\"y-eq\">be discovered and named by = be found and given its name by\u003c/span>\u003cdiv class=\"w\">발견과 명명의 의미를 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">rich with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">abundant in\u003c/span>\u003cspan class=\"y-eq\">rich with = abundant in\u003c/span>\u003cdiv class=\"w\">자원이 많다는 뜻을 격식 있는 표현으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">might be\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">could be\u003c/span>\u003cspan class=\"y-eq\">might be = could be\u003c/span>\u003cdiv class=\"w\">가능성을 나타내는 조동사를 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Christopher Columbus discovered Costa Rica and gave it its name, believing that it could be a land abundant in gold.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 콜럼버스가 코스타리카를 발견하고 이름을 붙였으며, 그 땅에 금이 많을 것이라고 기대했다는 뜻이에요. who 이하는 콜럼버스에 대한 덧붙임 설명이라서, 문장의 중심 뼈대는 코스타리카가 발견되고 명명되었다는 부분입니다. 그래서 관계사절을 지워도 큰 줄기는 그대로 남아요.","hl":"mn"},{"n":6,"text":"이때 who thought 부분은 and he thought로 바꿔 두 문장처럼 풀어 쓸 수 있어요. 또 rich with gold는 abundant in gold로 바꾸면 같은 뜻을 조금 더 격식 있게 표현할 수 있습니다.","hl":"rw"},{"n":7,"text":"be discovered and named by는 be found and given its name by처럼 풀어 쓸 수 있어요. rich with는 abundant in으로, might be는 could be로 바꿔도 의미가 잘 통합니다.","hl":"ph"},{"n":8,"text":"이 문장은 Christopher Columbus discovered Costa Rica and gave it its name, believing that it could be a land abundant in gold라고 바꿔 말할 수 있어요. 수동태를 능동태로 바꾸어도 콜럼버스가 발견하고 이름을 붙였다는 뜻은 그대로입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 Change, \u003cspan class=\"fx\">which is an essential part of our life\u003c/span>, can have both positive and negative effects.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Change,\u003c/div>\u003cdiv class=\"k\">변화는\u003c/div>\u003cdiv class=\"e\">which is an essential part of our life,\u003c/div>\u003cdiv class=\"k\">그것은 우리 삶의 필수적인 부분인데\u003c/div>\u003cdiv class=\"e\">can have both positive and negative effects.\u003c/div>\u003cdiv class=\"k\">긍정적인 영향과 부정적인 영향을 둘 다 미칠 수 있다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>관계대명사 \u003cb class=\"key\">which\u003c/b>가 이끄는 절 which is ~ life는 삽입절로, 주어인 Change를 보충 설명한다. 콤마 사이에 들어간 관계사절이므로 \u003cb class=\"key\">계속적 용법\u003c/b>으로 이해하며, which는 Change를 받는다.\u003c/div>","segs":[{"n":9,"text":"Change, 변화는. which is an essential part of our life, 그것은 우리 삶의 필수적인 부분인데. can have both positive and negative effects, 긍정적인 영향과 부정적인 영향을 둘 다 미칠 수 있다","hl":"ch"},{"n":10,"text":"두 번째 문장에서는 Change 뒤에 콤마와 which가 나오죠. 이 which는 변화를 받으면서 우리 삶의 필수적인 부분이라는 설명을 끼워 넣는 삽입절이에요. 그래서 which부터 life까지는 잠깐 덧붙이는 정보로 읽고, 주어 Change의 동사 can have로 돌아오면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 Change, \u003cspan class=\"fx\">which is an essential part of our life\u003c/span>, can have both positive and negative effects.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>변화는 우리 삶에서 빠질 수 없는 요소이며, 좋은 영향과 나쁜 영향을 모두 줄 수 있다는 뜻이다. 관계사절은 '변화란 우리 삶의 필수적인 부분인데'라는 덧붙임 정보를 제공한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">which is an essential part of our life\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">and it is an essential part of our life\u003c/span>\u003cdiv class=\"w\">삽입된 계속적 관계사절을 and로 풀어 주면 의미가 더 분명해진다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">can have both positive and negative effects\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can affect us in both good and bad ways\u003c/span>\u003cdiv class=\"w\">have effects를 동사 affect로 바꿔 자연스럽게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">an essential part of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a necessary part of\u003c/span>\u003cspan class=\"y-eq\">essential = necessary\u003c/span>\u003cdiv class=\"w\">필수적이라는 뜻을 necessary로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have effects\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have an influence\u003c/span>\u003cspan class=\"y-eq\">have effects = have an influence\u003c/span>\u003cdiv class=\"w\">영향을 미친다는 뜻을 명사 influence로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">both positive and negative\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">both good and bad\u003c/span>\u003cspan class=\"y-eq\">positive and negative = good and bad\u003c/span>\u003cdiv class=\"w\">긍정적·부정적이라는 뜻을 쉬운 표현으로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Change, a necessary part of our life, can influence us in both good and bad ways.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 변화가 우리 삶에서 꼭 필요한 부분이지만, 그 영향이 좋을 수도 있고 나쁠 수도 있다는 뜻이에요. 관계사절은 변화에 대한 부가 설명이라서 없어도 문장의 중심은 변화가 긍정적 영향과 부정적 영향을 모두 미칠 수 있다는 것입니다.","hl":"mn"},{"n":12,"text":"which is an essential part of our life는 and it is an essential part of our life로 풀어 쓸 수 있어요. have both positive and negative effects는 affect us in both good and bad ways로 바꾸면 더 자연스럽게 들립니다.","hl":"rw"},{"n":13,"text":"an essential part of는 a necessary part of로 바꿀 수 있고, have effects는 have an influence로 표현할 수 있어요. positive and negative는 good and bad로 바꿔도 같은 뜻을 전달합니다.","hl":"ph"},{"n":14,"text":"전체 문장은 Change, a necessary part of our life, can influence us in both good and bad ways라고 바꿔 말할 수 있어요. 삽입절을 명사구로 줄여도 변화의 두 가지 영향이라는 뜻은 그대로입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 Yesterday is history, tomorrow is a mystery, today is a gift of God, \u003cspan class=\"fx\">which is why we call it the present\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Yesterday is history,\u003c/div>\u003cdiv class=\"k\">어제는 역사이다\u003c/div>\u003cdiv class=\"e\">tomorrow is a mystery,\u003c/div>\u003cdiv class=\"k\">내일은 미스터리이다\u003c/div>\u003cdiv class=\"e\">today is a gift of God,\u003c/div>\u003cdiv class=\"k\">오늘은 신의 선물이다\u003c/div>\u003cdiv class=\"e\">which is why we call it the present.\u003c/div>\u003cdiv class=\"k\">그리고 그것이 우리가 오늘을 present라고 부르는 이유이다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>콤마 뒤의 관계대명사 \u003cb class=\"key\">which\u003c/b>는 앞의 절 today is a gift of God 전체를 대신하며, \u003cb class=\"key\">which is why ~\u003c/b> 구문으로 '그것이 ~인 이유이다'라고 보충 설명한다. 이때 which는 앞 절 내용을 받는 계속적 용법이다.\u003c/div>","segs":[{"n":15,"text":"Yesterday is history, 어제는 역사이다. tomorrow is a mystery, 내일은 미스터리이다. today is a gift of God, 오늘은 신의 선물이다. which is why we call it the present, 그리고 그것이 우리가 오늘을 present라고 부르는 이유이다","hl":"ch"},{"n":16,"text":"세 번째 문장에서는 콤마 뒤의 which가 오늘은 신의 선물이라는 앞 절 전체를 받아요. 그래서 which is why는 그것이 바로 우리가 오늘을 present라고 부르는 이유라는 뜻으로 이어집니다. 앞 절 내용을 한 덩어리로 받는 계속적 관계대명사라고 기억해 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 Yesterday is history, tomorrow is a mystery, today is a gift of God, \u003cspan class=\"fx\">which is why we call it the present\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>어제는 이미 지나간 역사이고, 내일은 아직 알 수 없는 미스터리이며, 오늘은 신이 준 선물이라는 뜻이다. 여기서 present는 '선물'과 '현재'를 동시에 노리는 말장난으로, 오늘을 선물처럼 소중히 여기라는 메시지를 담는다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">which is why we call it the present\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">and that is why we call today the present\u003c/span>\u003cdiv class=\"w\">which를 that으로 풀고 앞 절을 받는 지시어로 바꿔 계속적 관계사절을 쉽게 풀었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a gift of God\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a gift from God\u003c/span>\u003cdiv class=\"w\">of God보다 from God이 '신이 준'이라는 의미를 더 자연스럽게 나타낸다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Yesterday is history\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Yesterday is already past\u003c/span>\u003cspan class=\"y-eq\">history = the past\u003c/span>\u003cdiv class=\"w\">역사라는 표현을 이미 지나간 과거라는 뜻으로 풀었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a mystery\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">an unknown\u003c/span>\u003cspan class=\"y-eq\">mystery = unknown thing\u003c/span>\u003cdiv class=\"w\">알 수 없는 것이라는 뜻으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a gift of God\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a gift from God\u003c/span>\u003cspan class=\"y-eq\">of God = from God\u003c/span>\u003cdiv class=\"w\">신이 준 선물이라는 의미를 더 자연스럽게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Yesterday is already past, tomorrow is unknown, and today is a gift from God, which is why we call it the present.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 어제는 이미 지나간 역사이고 내일은 아직 모르는 것이며 오늘은 신이 준 선물이라는 뜻이에요. 여기서 present는 선물이라는 뜻과 현재라는 뜻을 함께 살린 말장난이죠. 그래서 오늘을 선물처럼 소중히 여기자는 메시지로 읽을 수 있습니다.","hl":"mn"},{"n":18,"text":"which is why we call it the present는 and that is why we call today the present로 풀어 쓸 수 있어요. a gift of God는 a gift from God으로 바꾸면 신이 준 선물이라는 의미가 더 자연스럽게 느껴집니다.","hl":"rw"},{"n":19,"text":"Yesterday is history는 Yesterday is already past로 바꿀 수 있고, a mystery는 an unknown처럼 표현할 수 있어요. a gift of God는 a gift from God로도 자주 씁니다.","hl":"ph"},{"n":20,"text":"전체 문장은 Yesterday is already past, tomorrow is unknown, and today is a gift from God, which is why we call it the present라고 바꿔 말할 수 있어요. 뜻은 그대로이면서 표현이 조금 더 쉽게 풀렸습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Urbanization has been taking place since the Neolithic Revolution, \u003cspan class=\"fx\">when agriculture enabled food surpluses to create a division of labor in settlements\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Urbanization has been taking place\u003c/div>\u003cdiv class=\"k\">도시화는 일어나고 있는 중이다\u003c/div>\u003cdiv class=\"e\">since the Neolithic Revolution,\u003c/div>\u003cdiv class=\"k\">신석기 혁명 이래로\u003c/div>\u003cdiv class=\"e\">when agriculture enabled food surpluses\u003c/div>\u003cdiv class=\"k\">그때 농업은 잉여 식량이\u003c/div>\u003cdiv class=\"e\">to create a division of labor in settlements.\u003c/div>\u003cdiv class=\"k\">정착지에서 분업을 만들도록 가능하게 했다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>콤마 뒤의 관계부사 \u003cb class=\"key\">when\u003c/b>이 이끄는 절이 the Neolithic Revolution에 대한 보충 설명을 한다. 이때 when은 \u003cb class=\"key\">and then\u003c/b>의 의미로 '그리고 그때'라고 이어 주며, 선행사는 시간 명사 the Neolithic Revolution이다.\u003c/div>","segs":[{"n":21,"text":"Urbanization has been taking place, 도시화는 일어나고 있는 중이다. since the Neolithic Revolution, 신석기 혁명 이래로. when agriculture enabled food surpluses, 그때 농업은 잉여 식량이. to create a division of labor in settlements, 정착지에서 분업을 만들도록 가능하게 했다","hl":"ch"},{"n":22,"text":"네 번째 문장에서는 the Neolithic Revolution 뒤에 콤마와 when이 나옵니다. 여기서 when은 신석기 혁명이라는 시간 명사를 받아 and then처럼 그때라는 의미로 이어 주는 관계부사예요. 그래서 when 이하는 신석기 혁명 당시에 어떤 일이 있었는지 덧붙여 설명합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Urbanization has been taking place since the Neolithic Revolution, \u003cspan class=\"fx\">when agriculture enabled food surpluses to create a division of labor in settlements\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>도시화는 신석기 혁명 이후 계속 진행되어 왔으며, 그 혁명 시기에 농업이 잉여 식량을 가능하게 해 정착지에서 분업이 생겨났다는 뜻이다. when 이하는 신석기 혁명이 어떤 시기였는지 설명하는 배경 정보이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">when agriculture enabled food surpluses to create a division of labor in settlements\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">and then agriculture enabled food surpluses to create a division of labor in settlements\u003c/span>\u003cdiv class=\"w\">관계부사 when을 and then으로 풀어 시간의 흐름을 드러냈다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">enabled food surpluses to create\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">made it possible for food surpluses to create\u003c/span>\u003cdiv class=\"w\">enable A to do를 make it possible for A to do로 바꾼 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take place\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">occur\u003c/span>\u003cspan class=\"y-eq\">take place = occur\u003c/span>\u003cdiv class=\"w\">일어나다라는 뜻을 동사 occur로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">food surpluses\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">surplus food\u003c/span>\u003cspan class=\"y-eq\">food surpluses = surplus food\u003c/span>\u003cdiv class=\"w\">잉여 식량이라는 뜻을 자연스러운 명사구로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a division of labor\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the separation of work\u003c/span>\u003cspan class=\"y-eq\">division of labor = separation of work\u003c/span>\u003cdiv class=\"w\">분업이라는 뜻을 풀어 쓴 표현이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Urbanization has occurred since the Neolithic Revolution, when agriculture made it possible for surplus food to create a division of labor in settlements.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 도시화가 신석기 혁명 이후 계속 일어나 왔다는 뜻이에요. 그 시기에 농업 덕분에 잉여 식량이 생겼고, 그것이 정착지에서 분업을 만들어 냈다는 배경을 설명하고 있습니다. when 이하는 혁명이 어떤 변화를 가져왔는지 알려 주는 정보입니다.","hl":"mn"},{"n":24,"text":"when agriculture enabled food surpluses to create는 and then agriculture enabled food surpluses to create로 풀어 쓸 수 있어요. enabled food surpluses to create는 made it possible for food surpluses to create로 바꾸면 가능하게 했다는 뜻이 더 분명해집니다.","hl":"rw"},{"n":25,"text":"take place는 occur로 바꿀 수 있고, food surpluses는 surplus food로 표현할 수 있어요. a division of labor는 the separation of work처럼 풀어 쓸 수 있습니다.","hl":"ph"},{"n":26,"text":"전체 문장은 Urbanization has occurred since the Neolithic Revolution, when agriculture made it possible for surplus food to create a division of labor in settlements라고 바꿔 말할 수 있어요. 시간의 흐름과 원인 결과가 그대로 살아 있습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Homer's Iliad, \u003cspan class=\"fx\">which contained descriptions of actual places\u003c/span>, was the basis for many early maps.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Homer's Iliad,\u003c/div>\u003cdiv class=\"k\">호메로스의 일리아드는\u003c/div>\u003cdiv class=\"e\">which contained descriptions of actual places,\u003c/div>\u003cdiv class=\"k\">그것은 실제 장소에 대한 서술을 포함했는데\u003 03c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">contain\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">include\u003c/span>\u003cspan class=\"y-eq\">contain = include\u003c/span>\u003cdiv class=\"w\">포함하다라는 뜻을 include로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">actual places\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">real places\u003c/span>\u003cspan class=\"y-eq\">actual = real\u003c/span>\u003cdiv class=\"w\">실제 장소라는 뜻을 쉬운 표현으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">the basis for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">the foundation for\u003c/span>\u003cspan class=\"y-eq\">basis = foundation\u003c/span>\u003cdiv class=\"w\">기반이라는 뜻을 foundation으로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Homer's Iliad, which included descriptions of real places, served as the foundation for many early maps.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 일리아드에 실제 장소를 묘사한 내용이 있어서 많은 초기 지도가 그것을 바탕으로 만들어졌다는 뜻이에요. 관계사절은 일리아드가 어떤 점에서 지도에 영향을 주었는지 알려 주는 덧붙임 정보입니다.","hl":"mn"},{"n":30,"text":"which contained descriptions of actual places는 and it contained descriptions of actual places로 풀어 쓸 수 있어요. was the basis for는 served as the foundation for로 바꾸면 더 격식 있는 표현이 됩니다.","hl":"rw"},{"n":31,"text":"contain은 include로 바꿀 수 있고, actual places는 real places로 표현할 수 있어요. the basis for는 the foundation for로 바꿔도 뜻이 잘 통합니다.","hl":"ph"},{"n":32,"text":"전체 문장은 Homer's Iliad, which included descriptions of real places, served as the foundation for many early maps라고 바꿔 말할 수 있어요. 관계사절을 살짝 바꿔도 일리아드가 초기 지도의 바탕이 되었다는 뜻은 그대로입니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 Cognitive computing is supported by machine learning and deep learning technology, \u003cspan class=\"fx\">which allows computers to autonomously learn from data\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Cognitive computing is supported\u003c/div>\u003cdiv class=\"k\">인지 컴퓨팅은 뒷받침된다\u003c/div>\u003cdiv class=\"e\">by machine learning and deep learning technology,\u003c/div>\u003cdiv class=\"k\">기계 학습과 딥 러닝 기술에 의해\u003c/div>\u003cdiv class=\"e\">which allows computers to autonomously learn from data.\u003c/div>\u003cdiv class=\"k\">그리고 그것은 컴퓨터가 자체적으로 데이터로부터 학습할 수 있게 한다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>콤마 뒤의 주격 관계대명사 \u003cb class=\"key\">which\u003c/b>가 이끄는 절은 앞 문장 전체 또는 앞의 기술 내용을 보충 설명한다. 관계사절 안의 \u003cb class=\"key\">to autonomously learn\u003c/b>은 to와 동사 사이에 부사가 들어간 분리부정사로, '자체적으로 학습하다'라는 의미를 강조한다.\u003c/div>","segs":[{"n":33,"text":"Cognitive computing is supported, 인지 컴퓨팅은 뒷받침된다. by machine learning and deep learning technology, 기계 학습과 딥 러닝 기술에 의해. which allows computers to autonomously learn from data, 그리고 그것은 컴퓨터가 자체적으로 데이터로부터 학습할 수 있게 한다","hl":"ch"},{"n":34,"text":"여섯 번째 문장에서는 technology 뒤에 콤마와 which가 나옵니다. 여기서 which는 앞에 나온 기술과 앞 문장 전체 내용을 받아서, 그 기술이 컴퓨터를 어떻게 도와주는지 덧붙여 설명해요. 또 to autonomously learn은 to와 learn 사이에 부사가 들어간 분리부정사로, 자체적으로 학습한다는 점을 강조합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 Cognitive computing is supported by machine learning and deep learning technology, \u003cspan class=\"fx\">which allows computers to autonomously learn from data\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인지 컴퓨팅은 기계 학습과 딥 러닝 기술의 지원을 받는데, 이 기술들은 컴퓨터가 데이터로부터 스스로 학습할 수 있게 해 준다는 뜻이다. which는 앞 내용 전체를 받아 그 기술의 역할을 덧붙여 설명한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">which allows computers to autonomously learn from data\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">and this allows computers to learn from data on their own\u003c/span>\u003cdiv class=\"w\">which를 this로 풀고 autonomously를 on their own으로 바꿔 의미를 쉽게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is supported by\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is backed by\u003c/span>\u003cdiv class=\"w\">be supported by를 be backed by로 바꿔 '뒷받침되다'의 느낌을 살렸다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cognitive\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">related to thinking\u003c/span>\u003cspan class=\"y-eq\">cognitive = related to thinking\u003c/span>\u003cdiv class=\"w\">인지의라는 뜻을 풀어 설명했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">autonomously\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">on their own\u003c/span>\u003cspan class=\"y-eq\">autonomously = on their own\u003c/span>\u003cdiv class=\"w\">자체적으로라는 뜻을 쉬운 표현으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be supported by\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be backed by\u003c/span>\u003cspan class=\"y-eq\">supported = backed\u003c/span>\u003cdiv class=\"w\">뒷받침된다는 뜻을 backed로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Cognitive computing is backed by machine learning and deep learning technology, and this lets computers learn from data on their own.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 인지 컴퓨팅이 기계 u003cb class=\"y-lb\">구문\u003c/b>첫 번째 문장의 관계부사 \u003cb class=\"key\">when\u003c/b>은 시간 명사 1889를 받아 '그리고 그때'라는 의미로 보충 설명한다. 두 번째 문장의 관계부사 \u003cb class=\"key\">where\u003c/b>는 장소 명사 Paris를 받아 '그리고 거기서'라는 의미로 이어 주며, 두 표현 모두 \u003cb class=\"key\">계속적 용법\u003c/b>의 관계부사이다.\u003c/div>","segs":[{"n":39,"text":"Maurice Maeterlinck studied law, 모리스 마테를링크는 법학을 공부했다. and worked as a lawyer, 그리고 변호사로 일했다. until 1889, 1889년까지. when he decided to devote himself to writing, 그때 그는 글쓰기에 전념하기로 결심했다. In 1897, 1897년에. he went to Paris, 그는 파리로 갔다. where he met many of the leading symbolist writers of the day, 그리고 거기서 그는 그 당시의 여러 주요 상징주의 작가들을 만났다","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 두 개의 문장으로 이루어져 있어요. 앞 문장에서는 시간을 나타내는 말 뒤에 when이 나와서 그때 그가 글쓰기에 전념하기로 결심했다는 설명을 이어 줍니다. 뒤 문장에서는 Paris 뒤에 where가 나와서 그곳에서 당대의 주요 상징주의 작가들을 만났다고 덧붙여 설명해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07  Maurice Maeterlinck studied law and worked as a lawyer until 1889, \u003cspan class=\"fx\">when he decided to devote himself to writing. In 1897, he went to Paris, where he met many of the leading symbolist writers of the day\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>마테를링크는 법을 공부하고 변호사로 일하다가 1889년에 글쓰기에 전념하기로 결심했고, 1897년 파리로 가서 당대의 주요 상징주의 작가들을 만났다는 뜻이다. when과 where는 각각 시간과 장소를 덧붙여 설명하며 인생의 전환점을 자연스럽게 이어 준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">until 1889, when he decided to devote himself to writing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">until 1889, and then he decided to devote himself to writing\u003c/span>\u003cdiv class=\"w\">관계부사 when을 and then으로 풀어 시간의 흐름을 드러냈다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">where he met many of the leading symbolist writers of the day\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">and there he met many leading symbolist writers of that time\u003c/span>\u003cdiv class=\"w\">where를 and there로, of the day를 of that time으로 바꿔 쉽게 풀었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">devote oneself to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">dedicate oneself to\u003c/span>\u003cspan class=\"y-eq\">devote oneself to = dedicate oneself to\u003c/span>\u003cdiv class=\"w\">전념하다라는 뜻을 dedicate로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">leading\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">major\u003c/span>\u003cspan class=\"y-eq\">leading = major\u003c/span>\u003cdiv class=\"w\">주요한이라는 뜻을 major로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">of the day\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">of that time\u003c/span>\u003cspan class=\"y-eq\">of the day = of that time\u003c/span>\u003cdiv class=\"w\">그 당시라는 뜻을 쉬운 표현으로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Maurice Maeterlinck studied law and worked as a lawyer until eighteen eighty-nine, when he decided to dedicate himself to writing; in eighteen ninety-seven, he went to Paris, where he met many major symbolist writers of that time.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 마테를링크가 법을 공부하고 변호사로 일하다가 어느 시점에 글쓰기에 전념했고, 나중에 파리로 가서 당대의 주요 상징주의 작가들을 만났다는 뜻이에요. when은 시간의 전환점을, where는 장소에서의 만남을 자연스럽게 이어 줍니다.","hl":"mn"},{"n":42,"text":"until the year, when he decided to devote himself to writing은 and then he decided to devote himself to writing으로 풀어 쓸 수 있어요. where he met many of the leading symbolist writers of the day는 and there he met many leading symbolist writers of that time으로 바꿀 수 있습니다.","hl":"rw"},{"n":43,"text":"devote oneself to는 dedicate oneself to로 바꿀 수 있고, leading은 major로 표현할 수 있어요. of the day는 of that time으로 바꾸면 그 당시라는 뜻이 더 쉽게 드러납니다.","hl":"ph"},{"n":44,"text":"전체 문장은 Maurice Maeterlinck studied law and worked as a lawyer until he decided to dedicate himself to writing, and later in Paris he met many major symbolist writers of that time이라고 바꿔 말할 수 있어요. 시간과 장소를 나타내는 관계부사를 풀어 써도 인생의 흐름은 그대로 전달됩니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 Jobs may not be permanent, and you may lose your job for countless reasons, \u003cspan class=\"fx\">some of which you may not even be responsible for\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Jobs may not be permanent,\u003c/div>\u003cdiv class=\"k\">일자리는 영구적이지 않을 수도 있다\u003c/div>\u003cdiv class=\"e\">and you may lose your job\u003c/div>\u003cdiv class=\"k\">그리고 당신은 당신의 일자리를 잃을 수도 있다\u003c/div>\u003cdiv class=\"e\">for countless reasons,\u003c/div>\u003cdiv class=\"k\">수많은 이유로\u003c/div>\u003cdiv class=\"e\">some of which you may not even be responsible for.\u003c/div>\u003cdiv class=\"k\">그리고 그것들 중의 일부에 대해 당신은 심지어 책임이 없을 수도 있다\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">some of which\u003c/b>는 '그것들 중 일부'로 해석하며, and some of countless reasons로 바꿔 쓸 수 있다. 관계대명사 앞에 부정대명사가 올 때는 \u003cb class=\"key\">부정대명사 + of + 관계대명사\u003c/b> 어순으로 쓴다.\u003c/div>","segs":[{"n":45,"text":"Jobs may not be permanent, 일자리는 영구적이지 않을 수도 있다. and you may lose your job, 그리고 당신은 당신의 일자리를 잃을 수도 있다. for countless reasons, 수많은 이유로. some of which you may not even be responsible for, 그리고 그것들 중의 일부에 대해 당신은 심지어 책임이 없을 수도 있다","hl":"ch"},{"n":46,"text":"여덟 번째 문장에서는 some of which가 나옵니다. 이 표현은 앞에 나온 countless reasons를 받아서 그것들 중 일부라는 뜻을 만들어요. 부정대명사가 관계대명사 앞에 올 때는 some of which처럼 of를 가운데 두는 어순을 쓴다는 점을 기억해 주세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 Jobs may not be permanent, and you may lose your job for countless reasons, \u003cspan class=\"fx\">some of which you may not even be responsible for\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>일자리는 영구적이지 않을 수 있고, 여러 가지 이유로 일자리를 잃을 수 있는데 그 이유 중에는 본인이 책임지지 않아도 되는 것도 있다는 뜻이다. some of which는 앞의 countless reasons를 받아 그중 일부를 가리킨다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">some of which you may not even be responsible for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">and you may not even be responsible for some of them\u003c/span>\u003cdiv class=\"w\">전치사 for의 목적어가 관계대명사 which였으므로 문장 끝에 them으로 풀어 쓸 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">for countless reasons\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">for numerous reasons\u003c/span>\u003cdiv class=\"w\">countless를 numerous로 바꿔 '수많은'의 뜻을 유지했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">countless\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">numerous\u003c/span>\u003cspan class=\"y-eq\">countless = numerous\u003c/span>\u003cdiv class=\"w\">수많은이라는 뜻을 numerous로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">permanent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lasting\u003c/span>\u003cspan class=\"y-eq\">permanent = lasting\u003c/span>\u003cdiv class=\"w\">영구적인이라는 뜻을 lasting으로 바꿨다.\u003c/div>\u es are solved\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>텔레비전 범죄 드라마는 경찰관들에게 그렇게 인기 있는 프로그램이 아니며, 경찰관들은 그 드라마가 범죄 해결 과정을 지나치게 오해하게 만든다고 비판해 왔다는 뜻이다. who 이하는 경찰관들이 왜 이 드라마를 좋아하지 않는지 설명한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">who have criticized the series for presenting a highly misleading image\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">and they have criticized the series because it presents a highly misleading image\u003c/span>\u003cdiv class=\"w\">관계사절을 and로 풀고 for ~ing를 because 절로 바꿔 이유를 분명히 했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">isn't such a hit with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is not very popular with\u003c/span>\u003cdiv class=\"w\">such a hit with를 very popular with로 풀어 '인기가 많다'는 뜻을 쉽게 했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a hit with\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">popular with\u003c/span>\u003cspan class=\"y-eq\">a hit with = popular with\u003c/span>\u003cdiv class=\"w\">인기가 많다는 뜻을 popular with로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">criticize\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">condemn\u003c/span>\u003cspan class=\"y-eq\">criticize = condemn\u003c/span>\u003cdiv class=\"w\">비판하다라는 뜻을 condemn으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">misleading\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">deceptive\u003c/span>\u003cspan class=\"y-eq\">misleading = deceptive\u003c/span>\u003cdiv class=\"w\">오해의 소지가 있는이라는 뜻을 deceptive로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The television crime drama is not very popular with police officers, and they have criticized the series because it presents a highly deceptive picture of how crimes are solved.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 텔레비전 범죄 드라마가 경찰관들에게 그렇게 인기 있는 프로그램이 아니라는 뜻이에요. 경찰관들은 드라마가 범죄 해결 과정을 지나치게 오해하게 만든다고 비판해 왔다는 설명이 who 절에 담겨 있습니다.","hl":"mn"},{"n":72,"text":"who have criticized the series for presenting a highly misleading image는 and they have criticized the series because it presents a highly misleading image로 풀어 쓸 수 있어요. isn't such a hit with는 is not very popular with로 바꾸면 인기가 많지 않다는 뜻이 쉽게 드러납니다.","hl":"rw"},{"n":73,"text":"a hit with는 popular with로 바꿀 수 있고, criticize는 condemn으로 표현할 수 있어요. misleading은 deceptive로 바꾸면 오해를 불러일으키는이라는 뜻이 잘 살아납니다.","hl":"ph"},{"n":74,"text":"전체 문장은 The television crime drama is not very popular with police officers, and they have criticized the series because it presents a highly deceptive picture of how crimes are solved라고 바꿔 말할 수 있어요. 관계사절을 이유를 나타내는 절로 풀어도 뜻은 그대로입니다.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>콤마 뒤의 \u003cb class=\"key\">who/which\u003c/b>는 앞 명사나 앞 절을 덧붙여 설명하는 계속적 관계대명사로 읽는다.\u003c/li>\u003cli>\u003cb class=\"key\">when/where\u003c/b>는 앞의 시간·장소 명사 뒤에서 and then, and there의 의미로 이어 준다.\u003c/li>\u003cli>\u003cb class=\"key\">some of which / each of which\u003c/b>는 부정대명사 + of + 관계대명사 구조로 '~중 일부 / 각각'을 뜻한다.\u003c/li>\u003cli>관계사절 안의 \u003cb class=\"key\">that 생략\u003c/b>과 \u003cb class=\"key\">분리부정사\u003c/b> 같은 세부 구조도 함께 확인한다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 콤마 뒤 관계사절이 앞 명사나 앞 절을 덧붙여 설명하는 구문을 배웠어요. who와 which는 계속적 관계대명사로, when과 where는 and then과 and there의 느낌으로 읽으면 됩니다. some of which와 each of which는 그것들 중 일부, 각각이라는 뜻을 만드는 중요한 표현이에요. 문장을 끊어 읽으면서 관계사절이 어디까지 이어지는지 확인하고 오늘 수업을 마무리해 볼게요.","hl":"sum"}]}]});</scri
