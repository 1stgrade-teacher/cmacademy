/div>","<div class=\"lec-cover-title\">The Nature of Memory: Remembering the Experience, Not the Details<small>기억의 본질: 세부 사항이 아닌 경험을 기억하기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 짧은 글을 읽기 전, 우리의 기억이 시간이 흐름에 따라 어떻게 변하는지 알아보면 좋아요. 우리는 흔히 기억을 녹화된 영상처럼 선명하게 저장한다고 생각하지만(memory accuracy), 실제로는 우리 뇌가 중요한 정보 위주로 재구성해서 저장하기 때문에 사소한 세부 사항은 쉽게 잊히곤 하죠. 이를 심리학에서는 재구성적 기억(reconstructive memory)이라고 부르는데, 마치 오래된 사진첩을 다시 볼 때 사진 속의 주인공은 기억나지만 배경에 무엇이 있었는지는 가물가물한 것과 비슷해요. 이처럼 특정 사건의 구체적인 &#39;내용&#39;은 잊더라도, 그 사건과 관련된 나만의 감정이나 경험(episodic memory)은 더 오랫동안 기억에 남는 현상을 염두에 두고 글을 읽어보세요. 기억이란 완벽한 기록물이 아니라, 우리 뇌가 그때의 경험을 바탕으로 다시 만들어내는 이야기(reconstruction)라는 점을 이해한다면 필자의 기억 방식을 훨씬 더 깊이 있게 공감할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01망각과 기억의 공존</div><ul><li>영화의 구체적인 내용은 잊었지만, 영화를 보기 위해 기다렸던 경험은 여전히 기억한다.</li><li>줄거리(storyline)는 거의 기억나지 않음</li><li>기다림의 경험은 선명하게 남아 있음</li><li>핵심 키워드: 줄거리(storyline), 기억(remember)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02기다림의 시간</div><ul><li>영화 관람을 위해 줄을 서서 기다렸던 상황을 회상한다.</li><li>영화관에서 줄을 서서(waiting in line) 기다림</li><li>영화를 보기(see the movie) 위한 준비 과정</li><li>핵심 키워드: 줄 서기(waiting in line), 관람(see)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">almost</td><td class=\"m\">거의</td></tr><tr><td class=\"w\">forget</td><td class=\"m\">잊다</td></tr><tr><td class=\"w\">storyline</td><td class=\"m\">줄거리</td></tr><tr><td class=\"w\">remember</td><td class=\"m\">기억하다</td></tr><tr><td class=\"w\">wait in line</td><td class=\"m\">줄을 서서 기다리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 잊었다.</span><span class=\"en\"><b>almost forgot</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디즈니 영화 ‘겨울왕국’의 줄거리를</span><span class=\"en\"><b>the storyline of the Disney movie Frozen,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>but</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말 기억한다</span><span class=\"en\"><b><span class=\"grammar-hl\">do remember</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">줄을 서서 기다린 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">waiting in line</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 영화를 보기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span> the movie.</b></span></div></div><div class=\"lec-sent-ko\">나는 디즈니 영화 ‘겨울왕국’의 줄거리를 거의 잊었다. 그러나 나는 그 영화를 보기 위해 줄을 서서 기다린 것을 정말 기억한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 과거의 구체적인 사건(줄거리)보다는 그 당시의 경험(기다렸던 과정)을 더 생생하게 기억하고 있음을 보여줍니다. 여기서 almost는 &#39;거의&#39;라는 사전적 의미로, 줄거리를 완전히 잊은 것은 아니지만 기억이 희미해졌음을 강조하여 뒤에 이어질 &#39;기억나는 사실&#39;과 대비를 이룹니다. 또한 do는 동사 remember 앞에 쓰여 &#39;정말로, 분명히&#39;라는 의미를 더하는데, 앞에서 말한 &#39;잊어버림&#39;과 대조적으로 &#39;확실히 기억한다&#39;는 점을 강조하려는 필자의 의도가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">waiting in line (동명사): 문장에서 remember의 목적어 역할을 하며, 앞서 일어난 과거의 행위인 &#39;줄을 서서 기다렸던 것&#39;을 나타냄.</div><div class=\"lec-gr-item\">do remember (강조구문): 일반동사 remember 앞에 do를 사용하여 서술어의 의미를 강조함. 앞의 동사가 일반동사이면 do[does, did]를 쓴다.</div><div class=\"lec-gr-item\">to see (to부정사): 앞의 동사구(waiting in line)의 목적(의도)을 나타내는 부사적 용법으로 쓰임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">almost</td><td class=\"m\">거의</td></tr><tr><td class=\"w\">storyline</td><td class=\"m\">줄거리</td></tr><tr><td class=\"w\">remember</td><td class=\"m\">기억하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>화자는 영화 &#39;겨울왕국&#39;의 내용은 가물가물하지만, 영화를 보기 위해 줄을 섰던 당시의 경험은 뚜렷하게 기억하고 있다.</li><li>이는 우리가 영화의 내용 같은 정보보다 특정 상황에서의 직접적인 경험을 더 오래 기억할 수 있음을 보여준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The speaker cannot recall the narrative of the movie Frozen, but they vividly remember the process of waiting in line to watch it.</div>\n              <div class=\"lec-final-sum-ko\">화자는 영화 &#39;겨울왕국&#39;의 줄거리는 기억하지 못하지만, 그것을 보기 위해 줄을 섰던 과정은 생생하게 기억한다.</div></div></div>"],"segs":[[{"audio":"./sentence04_audio/1.mp3","hl":null}],[{"audio":"./sentence04_audio/2.mp3","hl":null}],[{"audio":"./sentence04_audio/3.mp3","hl":null},{"audio":"./sentence04_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence04_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence04_audio/6.mp3","hl":null}],[{"audio":"./sentence04_audio/7.mp3","hl":"main"},{"audio":"./sentence04_audio/8.mp3","hl":"meaning"},{"audio":"./sentence04_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence04_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")retu
