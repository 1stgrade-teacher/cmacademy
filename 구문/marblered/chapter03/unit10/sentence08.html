en)</li><li>평범한 일상의 실수에서 시작된 상황</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02가족의 반응</div><ul><li>오븐이 꺼진 것을 깨달은 가족들은 큰 당혹감을 느꼈다.</li><li>음식이 없다는 사실을 직시함 (realized they had nothing to eat)</li><li>가족들의 표정(expression)에서 느껴지는 당혹감</li><li>핵심 키워드: 당혹감(embarrassment)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03기억의 각인</div><ul><li>작성자는 그 당시 가족들의 표정을 결코 잊을 수 없다고 말한다.</li><li>가족들의 반응을 생생하게 기억함 (shall never forget)</li><li>사소한 실수가 가져온 기억에 남는 경험</li><li>핵심 키워드: 기억(memory)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">forget</td><td class=\"m\">잊다</td></tr><tr><td class=\"w\">turn off</td><td class=\"m\">(기기 등을) 끄다</td></tr><tr><td class=\"w\">expression</td><td class=\"m\">표정</td></tr><tr><td class=\"w\">rest</td><td class=\"m\">나머지</td></tr><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예전에</span><span class=\"en\"><b>Once</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 잊어버렸고</span><span class=\"en\"><b>I <span class=\"grammar-hl\">forgot</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오븐을 끄는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to turn off</span> the oven</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 결코 잊지 못할 것이다</span><span class=\"en\"><b>and I shall never <span class=\"grammar-hl\">forget</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">표정을 본 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">seeing</span> <span class=\"grammar-hl\">the expression</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얼굴에 나타난</span><span class=\"en\"><b><span class=\"grammar-hl\">on the faces</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나머지 가족의</span><span class=\"en\"><b><span class=\"grammar-hl\">of the rest of the family</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 깨달았을 때</span><span class=\"en\"><b>when <span class=\"grammar-hl\">they realized</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신들이 먹을 것이 없다는 것을</span><span class=\"en\"><b>they had nothing to eat.</b></span></div></div><div class=\"lec-sent-ko\">예전에 나는 오븐을 끄는 것을 잊어버렸고, 가족들이 자신들이 먹을 것이 없다는 것을 깨달았을 때 나머지 가족의 얼굴 표정을 본 것을 결코 잊지 못할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이가 과거에 오븐을 끄지 않아 저녁 식사를 망쳤던 일화를 소개하며, 그때 가족들이 보여준 실망스러운 반응이 매우 강렬하게 기억에 남아 있음을 강조하고 있습니다. 여기서 forget은 사전적으로 &#39;잊다&#39;라는 뜻인데, 앞의 &#39;forgot&#39;은 &#39;깜빡하다(부주의)&#39;의 의미이고 뒤의 &#39;never forget&#39;은 &#39;기억에 깊이 새겨져 있다&#39;는 의미로 쓰였습니다. 필자는 같은 단어를 반복 배치해 부주의했던 실수와 그로 인한 생생한 기억을 대조적으로 보여주려 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">forgot to turn off (to부정사): forgot의 목적어로 to부정사가 쓰여 &#39;미래에 ~할 것을 잊다&#39;라는 의미를 나타냄</div><div class=\"lec-gr-item\">forget seeing (동명사): forget의 목적어로 -ing가 쓰여 &#39;과거에 ~했던 것을 잊다&#39;라는 의미를 나타냄</div><div class=\"lec-gr-item\">the expression on the faces of the rest of the family (관용표현): &#39;the expression on the faces of ~&#39;는 &#39;~의 표정&#39;을 의미하는 숙어적 표현</div><div class=\"lec-gr-item\">they realized (관계부사): realized 뒤에 when절이 이어지며, when은 시간을 나타내는 관계부사로 앞의 선행사(time)를 수식하는 의미를 내포함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">forget</td><td class=\"m\">잊다</td></tr><tr><td class=\"w\">turn off</td><td class=\"m\">(기기 등을) 끄다</td></tr><tr><td class=\"w\">expression</td><td class=\"m\">표정</td></tr><tr><td class=\"w\">rest</td><td class=\"m\">나머지</td></tr><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>글쓴이는 과거에 오븐을 끄지 않아 가족들의 저녁 식사를 준비하지 못한 실수를 저질렀다.</li><li>그때 가족들이 느낀 당혹감과 실망이 담긴 표정을 평생 잊을 수 없을 정도로 강렬하게 기억하고 있다.</li><li>사소한 실수가 가져온 가족들의 반응이 글쓴이에게는 잊지 못할 경험으로 남았음을 보여준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The author failed to turn off the oven, and they still vividly recall the disappointed expressions of their hungry family.</div>\n              <div class=\"lec-final-sum-ko\">필자는 오븐을 끄는 것을 잊어버렸고, 배고픈 가족들이 보여준 실망스러운 표정을 아직도 생생하게 기억한다.</div></div></div>"],"segs":[[{"audio":"./sentence08_audio/1.mp3","hl":null}],[{"audio":"./sentence08_audio/2.mp3","hl":null}],[{"audio":"./sentence08_audio/3.mp3","hl":null},{"audio":"./sentence08_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence08_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence08_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence08_audio/7.mp3","hl":null}],[{"audio":"./sentence08_audio/8.mp3","hl":"main"},{"audio":"./sentence08_audio/9.mp3","hl":"meaning"},{"audio":"./sentence08_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence08_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientH
