성(Reciprocity)과 사회적 자본(Social Capital)이라는 개념과 깊은 관련이 있습니다. 우리가 누군가에게 친절을 베풀면 그것이 긍정적인 관계의 밑거름이 되어 나중에 나에게 더 큰 보상으로 돌아오는 원리를 말해요. 반대로, 무심코 던진 모진 말은 인간관계라는 신뢰의 계좌에서 잔고를 깎아먹는 것과 같아서, 뒤늦게 후회해도 되돌리기 참 어렵죠. 따라서 이 글은 평소 우리가 타인을 대할 때 보여주는 언행이 장기적으로 자신의 사회적 평판(Reputation)과 정서적 만족감에 어떤 영향을 주는지 성찰해 보게 합니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01과거의 경험 성찰</div><ul><li>저자는 자신의 지난 언행들을 되돌아보며 후회와 만족의 기준을 설정합니다.</li><li>타인에게 건넨 친절한 말(kind word)에 대한 만족</li><li>모질고 나쁜 말과 행동(mean things)에 대한 후회</li><li>핵심 키워드: 후회(regret), 친절(kindness)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02언행의 영향력 인식</div><ul><li>우리가 내뱉는 말과 행동은 우리 자신에게도 영향을 미치며 그 결과를 남깁니다.</li><li>타인을 향한 부정적인 언행은 스스로에게 상처를 남김</li><li>긍정적인 소통이 가지는 정서적 가치</li><li>핵심 키워드: 영향(influence), 언행(words and deeds)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03올바른 선택의 중요성</div><ul><li>지나간 일을 통해 더 나은 미래를 위해 어떤 태도를 지녀야 할지 깨닫습니다.</li><li>후회 없는 삶을 살기 위한 실천적 자세</li><li>타인을 존중하는 태도와 배려의 필요성</li><li>핵심 키워드: 가치 있는 삶(meaningful life), 태도(attitude)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">regret</td><td class=\"m\">후회하다</td></tr><tr><td class=\"w\">kind</td><td class=\"m\">친절한</td></tr><tr><td class=\"w\">plenty of</td><td class=\"m\">많은</td></tr><tr><td class=\"w\">mean</td><td class=\"m\">못된, 심술궂은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 결코 후회하지 않았다</span><span class=\"en\"><b>I’ve never regretted</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다정한 말을 한 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">saying</span> a kind word</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가에게</span><span class=\"en\"><b>to someone,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 나는 후회해왔다</span><span class=\"en\"><b>but <span class=\"grammar-hl\">I have regretted</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 비열한 것들을</span><span class=\"en\"><b>plenty of <span class=\"grammar-hl\">mean things</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 말하고 행한</span><span class=\"en\"><b><span class=\"grammar-hl\">I have said and done</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 누군가에게 다정한 말 한 마디를 한 것을 결코 후회하지 않지만, 내가 말하고 행한 많은 비열한 것들을 후회해왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 필자는 자신의 과거 경험을 대조하며 삶의 교훈을 제시하고 있습니다. 여기서 regretted는 사전적으로 &#39;후회하다&#39;이지만, 문맥상 &#39;나중에 돌이켜보았을 때 마음이 불편하거나 스스로를 탓하게 되는 감정&#39;을 의미합니다. 필자는 친절함이 주는 긍정적인 가치와 무심코 내뱉은 상처 주는 말들이 남기는 부정적인 잔상을 비교하여, 타인을 대할 때 어떤 태도를 가져야 하는지 독자에게 간접적으로 전달하려 이 표현들을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">saying (동명사): regretted의 목적어 역할을 하는 동명사로, &#39;말했던 것&#39;이라는 행위를 나타냄</div><div class=\"lec-gr-item\">I have regretted (현재완료): 과거의 시점부터 현재까지의 경험이나 상태를 나타냄</div><div class=\"lec-gr-item\">mean things I have said and done (관계대명사): &#39;things&#39; 뒤에 목적격 관계대명사(that/which)가 생략되어 있으며, 뒤의 &#39;I have said and done&#39; 절이 앞의 &#39;things&#39;를 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">regret</td><td class=\"m\">후회하다</td></tr><tr><td class=\"w\">kind</td><td class=\"m\">친절한</td></tr><tr><td class=\"w\">plenty of</td><td class=\"m\">많은</td></tr><tr><td class=\"w\">mean</td><td class=\"m\">못된, 심술궂은</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들에게 친절하게 대했던 것은 단 한 번도 후회한 적이 없다.</li><li>반면, 상대에게 모질게 대했던 말과 행동들은 수없이 후회했다.</li><li>결론적으로, 친절은 후회를 남기지 않는 가치 있는 행위임을 강조한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">We never regret being kind to others, but we frequently feel sorry for the unkind things we have said or done.</div>\n              <div class=\"lec-final-sum-ko\">우리는 타인에게 친절하게 대하는 것을 결코 후회하지 않지만, 우리가 말하거나 행한 불친절한 행동에 대해서는 자주 미안함을 느낀다.</div></div></div>"],"segs":[[{"audio":"./sentence11_audio/1.mp3","hl":null}],[{"audio":"./sentence11_audio/2.mp3","hl":null}],[{"audio":"./sentence11_audio/3.mp3","hl":null},{"audio":"./sentence11_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence11_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence11_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence11_audio/7.mp3","hl":null}],[{"audio":"./sentence11_audio/8.mp3","hl":"main"},{"audio":"./sentence11_audio/9.mp3","hl":"meaning"},{"audio":"./sentence11_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence11_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="func
