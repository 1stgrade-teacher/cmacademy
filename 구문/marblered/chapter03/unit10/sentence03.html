<div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01조언의 수용</div><ul><li>자신이 직접 요청한 경우에 한해서는 조언을 듣는 것에 대해 개방적인 태도를 보인다.</li><li>내가 직접 구한 조언(advice that I’ve asked for)은 기꺼이 들음</li><li>상대의 의견을 수용할 의사가 있음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02설교에 대한 거부</div><ul><li>상대방이 일방적으로 가르치려 드는 태도에 대해서는 단호하게 거절한다.</li><li>상대가 나를 가르치려 드는 것(preached at)을 원치 않음</li><li>상대의 독단적인 태도에 대한 반감 표출</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03태도의 차이</div><ul><li>조언을 구하는 것과 일방적인 설교를 듣는 것은 근본적으로 다름을 강조한다.</li><li>자발적인 요청과 강요된 가르침의 구분</li><li>핵심 키워드: 조언(advice), 설교(preach)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mind</td><td class=\"m\">꺼리다, 싫어하다</td></tr><tr><td class=\"w\">listen to</td><td class=\"m\">~을 듣다, 경청하다</td></tr><tr><td class=\"w\">advice</td><td class=\"m\">조언, 충고</td></tr><tr><td class=\"w\">ask for</td><td class=\"m\">~을 요청하다, 구하다</td></tr><tr><td class=\"w\">refuse</td><td class=\"m\">거부하다, 거절하다</td></tr><tr><td class=\"w\">preach at</td><td class=\"m\">설교하듯 말하다, 잔소리하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 꺼리지 않는다</span><span class=\"en\"><b>I don’t mind</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조언을 경청하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">listening</span> to advice</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 요청했던</span><span class=\"en\"><b><span class=\"grammar-hl\">that I’ve asked for</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 나는 거부한다</span><span class=\"en\"><b>but I refuse</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훈계 듣는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to be preached at</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 내가 요청한 조언을 경청하는 것을 싫어하지 않지만 나는 훈계 듣는 것을 거부한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞에서 &#39;내가 원해서 구한 조언&#39;과 뒤에서 &#39;상대방이 일방적으로 하는 설교&#39;를 대조하여 글쓴이의 명확한 선 긋기를 보여줍니다. 여기서 preached at은 사전적으로는 &#39;설교를 듣다&#39;이지만, 문맥상 상대가 자신의 우월함을 내세워 가르치려 드는 &#39;일방적이고 고압적인 훈계&#39;를 의미합니다. 필자는 단순히 조언을 듣는 것과 훈계를 받는 것을 구분하기 위해, 마치 교회에서 설교를 듣듯 수동적으로 강요받는다는 느낌을 주는 이 표현을 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">listening (동명사): mind의 목적어 역할을 하는 동명사(listen + -ing) 구조입니다.</div><div class=\"lec-gr-item\">that I’ve asked for (관계대명사): that절이 앞의 명사 advice를 수식하는 관계대명사절이며, 절 내부에서 전치사 for의 목적어가 빠져 있는 불완전한 문장 구조입니다.</div><div class=\"lec-gr-item\">to be preached at (수동태): to부정사의 수동태(to be p.p.) 구조입니다. 기본구조인 &#39;preach at O(남에게 설교하다)&#39;에서 목적어(O)가 주어로 나가면서 be+p.p.인 be preached at 형태가 되었습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mind</td><td class=\"m\">꺼리다, 싫어하다</td></tr><tr><td class=\"w\">advice</td><td class=\"m\">조언, 충고</td></tr><tr><td class=\"w\">refuse</td><td class=\"m\">거부하다, 거절하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>내가 스스로 요청한 도움은 기꺼이 받아들이지만, 일방적인 훈계는 거부한다.</li><li>조언을 구하는 능동적인 자세와 타인에게 강요당하는 수동적인 상황을 분명히 구분한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People are willing to accept advice when they ask for it, yet they firmly reject being preached at by others.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 조언을 요청할 때는 기꺼이 받아들이지만, 다른 사람에게 설교를 듣는 것은 단호히 거부한다.</div></div></div>"],"segs":[[{"audio":"./sente ";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
