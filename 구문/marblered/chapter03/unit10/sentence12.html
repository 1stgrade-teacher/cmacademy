음의 근력을 의미해요. 마치 바닥에 세게 던져져도 다시 튀어 오르는 고무공처럼, 우리가 좌절했을 때 스스로 다시 일어나겠다고 선택하는 마음가짐이 바로 이 회복 탄력성의 핵심이죠. 긍정 심리학(Positive Psychology) 분야에서는 이러한 태도가 단순히 운이 아니라, 꾸준한 연습을 통해 누구나 기를 수 있는 능력이라고 봅니다. 오늘 지문은 우리가 겪는 고난 자체가 아니라, 그 이후에 스스로 다시 일어서기로 선택하는 주체적인 태도가 삶의 방향을 결정한다는 점을 강조하고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01삶의 시련</div><ul><li>누구에게나 예상치 못한 어려움과 실패는 찾아오기 마련이다.</li><li>삶은 우리를 넘어뜨리는 시련(knock down)을 준다.</li><li>고난은 피할 수 없는 인생의 일부분이다.</li><li>핵심 키워드: 시련(hardship)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02선택의 기회</div><ul><li>넘어진 상태에서 어떻게 할지 결정하는 것은 우리 자신의 몫이다.</li><li>넘어지는 것 자체보다 대응 방식이 중요하다.</li><li>상황에 대한 선택(choose)권은 우리에게 있다.</li><li>핵심 키워드: 선택(choice)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03회복과 의지</div><ul><li>다시 일어서기로 마음먹는 것이 삶을 살아가는 태도이다.</li><li>넘어졌을 때 다시 일어설지(stand back up) 결정할 수 있다.</li><li>능동적인 태도를 통해 역경을 극복할 수 있다.</li><li>핵심 키워드: 회복 탄력성(resilience)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">knock down</td><td class=\"m\">넘어뜨리다, 좌절시키다</td></tr><tr><td class=\"w\">choose</td><td class=\"m\">선택하다</td></tr><tr><td class=\"w\">whether or not</td><td class=\"m\">~인지 아닌지</td></tr><tr><td class=\"w\">stand back up</td><td class=\"m\">다시 일어서다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인생은</span><span class=\"en\"><b>Life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리를 쓰러뜨릴 것이다,</span><span class=\"en\"><b>will knock us down,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 우리는</span><span class=\"en\"><b>but we</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선택할 수 있다</span><span class=\"en\"><b>can choose</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~할지 아닐지를</span><span class=\"en\"><b><span class=\"grammar-hl\">whether or not</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다시 일어설 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to stand back up</span>.</b></span></div></div><div class=\"lec-sent-ko\">인생은 우리를 쓰러뜨릴 것이지만 우리는 우리가 다시 일어설지 말지를 선택할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> knock down은 사전적으로 &#39;때려눕히다&#39;라는 뜻인데, 여기서는 인생에서 겪는 시련이나 실패를 비유합니다. 필자는 인생의 고난을 피할 수 없는 &#39;충격&#39;으로 묘사하기 위해 이 표현을 사용했습니다. 앞부분이 피할 수 없는 시련(원인)을 말한다면, 뒷부분은 그에 대한 우리의 능동적인 태도(결과)를 강조하며 문장을 대조시키고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">whether or not to stand back up (to부정사): whether나 if와 함께 쓰여 명사구 역할을 하며, 문장에서 choose의 목적어로 사용됨. to부정사가 명사구로 쓰일 때 뒤에 동사원형 stand가 결합하는 구조임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">choose</td><td class=\"m\">선택하다</td></tr><tr><td class=\"w\">whether or not</td><td class=\"m\">~인지 아닌지</td></tr><tr><td class=\"w\">stand back up</td><td class=\"m\">다시 일어서다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인생은 살면서 우리를 좌절하게 만드는 시련을 피할 수 없게 한다.</li><li>하지만 그 시련에 굴복할지, 아니면 다시 일어설지는 우리 자신의 선택에 달려 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Life inevitably presents us with difficulties, yet we retain the power to choose whether to rise again after falling.</div>\n              <div class=\"lec-final-sum-ko\">삶은 필연적으로 우리에게 어려움을 주지만, 우리는 넘어졌을 때 다시 일어설지 선택할 힘을 여전히 가지고 있다.</div></div></div>"],"segs":[[{"audio":"./sent
