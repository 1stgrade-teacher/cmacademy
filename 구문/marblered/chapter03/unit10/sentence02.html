ss=\"w\">particularly</td><td class=\"m\">특히</td></tr><tr><td class=\"w\">enjoy</td><td class=\"m\">즐기다</td></tr><tr><td class=\"w\">drive</td><td class=\"m\">운전하다, (차를 타고) 가다</td></tr><tr><td class=\"w\">countryside</td><td class=\"m\">시골 (지역)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특히 즐겼다</span><span class=\"en\"><b>particularly enjoyed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교외를 드라이브하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">driving</span> through the countryside</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신과 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">with you</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 특히 당신과 함께 교외를 드라이브하는 것을 즐겼다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 과거에 상대방과 함께 시골길을 달렸던 경험을 회상하며, 그 시간이 매우 좋았음을 표현하는 문장입니다. 여기서 particularly는 사전적으로는 &#39;특별히&#39;라는 뜻이지만, 여기서는 &#39;여러 가지 즐거웠던 기억들 중에서 그 순간이 가장 기억에 남는다&#39;는 의미로, 상대방과의 경험에 특별한 가치를 부여하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">driving (동명사): enjoyed라는 타동사의 목적어 역할을 하고 있으며, &#39;~하는 것을 즐기다&#39;라는 의미로 동작의 명사적 개념을 나타낸다.</div><div class=\"lec-gr-item\">with you (관용표현): 전치사구로, 동사 enjoyed와 함께 &#39;함께 ~하는 것을 즐겼다&#39;는 행위의 동반 관계를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">particularly</td><td class=\"m\">특히</td></tr><tr><td class=\"w\">enjoy</td><td class=\"m\">즐기다</td></tr><tr><td class=\"w\">countryside</td><td class=\"m\">시골 (지역)</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Driving through the countryside with a companion is a deeply enjoyable experience, and it serves as a meaningful way to share a pleasant time together.</div>\n              <div class=\"lec-final-sum-ko\">함께 시골길을 드라이브하는 것은 매우 즐거운 경험이며, 서로 좋은 시간을 공유하는 의미 있는 방법이다.</div></div></div>"],"segs":[[{"audio":"./sentence02_audio/1.mp3","hl":null}],[{"audio":"./sentence02_audio/2.mp3","hl":null}],[{"audio":"./sentence02_audio/3.mp3","hl":null},{"audio":"./sentence02_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence02_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence02_audio/6.mp3","hl":null}],[{"audio":"./sentence02_audio/7.mp3","hl":"main"},{"audio":"./sentence02_audio/8.mp3","hl":"meaning"},{"audio":"./sentence02_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence02_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFram
