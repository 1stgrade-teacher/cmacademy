r-bkg-txt\">이 글을 이해하기 위해서는 무역에서 아주 중요한 개념인 관세(Tariff)에 대해 알아두면 좋아요. 관세란 국가가 자국 산업을 보호하거나 세금을 거두기 위해 수입품에 부과하는 일종의 통행세 같은 것인데요, 마치 우리 동네 가게에 물건을 팔러 오는 외부 상인에게 &#39;여기서 장사하려면 얼마를 내야 해&#39;라고 요구하는 것과 비슷합니다. 그래서 국가 간에 관세 장벽(Tariff wall)을 없앤다는 것은 서로의 물건을 더 자유롭게 사고팔기 위해 무역의 빗장을 푼다는 뜻이에요. 보통 자유 무역 협정(FTA)을 맺을 때 이러한 합의를 하곤 하는데, 관세가 사라지면 소비자 입장에서는 더 저렴한 가격에 다양한 물건을 살 수 있게 되죠. 즉, 이 지문은 두 나라가 5년이라는 시간을 두고 경제적 교류를 훨씬 더 활발하게 만들겠다는 상호 간의 약속을 담고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01합의 내용</div><ul><li>두 국가는 관세 장벽을 제거하기로 공식적으로 결정했다.</li><li>관세 장벽(tariff walls) 폐지 합의</li><li>양국(both countries) 간의 경제적 협력 도모</li><li>핵심 키워드: 관세(tariff), 철폐(abolish)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02시간 계획</div><ul><li>관세 폐지는 즉시 이루어지는 것이 아니라 5년이라는 기간을 두고 진행된다.</li><li>이행 기간: 5년 이내(within 5 years)</li><li>단계적인 무역 장벽 완화 과정</li><li>핵심 키워드: 기간(period), 기한(limit)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">both</td><td class=\"m\">양쪽의</td></tr><tr><td class=\"w\">country</td><td class=\"m\">국가</td></tr><tr><td class=\"w\">agree</td><td class=\"m\">합의하다, 동의하다</td></tr><tr><td class=\"w\">abolish</td><td class=\"m\">폐지하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tariff</td><td class=\"m\">관세</td></tr><tr><td class=\"w\">wall</td><td class=\"m\">장벽</td></tr><tr><td class=\"w\">within</td><td class=\"m\">~ 이내에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">양국은</span><span class=\"en\"><b>Both countries</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동의했다</span><span class=\"en\"><b>agreed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">철폐하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to abolish</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 관세 장벽을</span><span class=\"en\"><b>their tariff walls</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">5년 내에</span><span class=\"en\"><b>within 5 years.</b></span></div></div><div class=\"lec-sent-ko\">양국은 5년 내에 그들의 관세 장벽을 철폐하는 것을 동의했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 양국이 서로 합의를 통해 무역 장벽을 없애기로 결정했다는 사실을 전달합니다. 여기서 tariff walls는 사전적으로는 &#39;관세 벽&#39;이지만, 문맥상 무역을 제한하는 각종 세금이나 규제를 의미합니다. 실제 물리적인 벽이 아니지만, 마치 벽처럼 무역을 가로막고 있다는 느낌을 강조하기 위해 walls라는 비유적인 표현을 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to abolish (to부정사): agree(동사)의 목적어 역할을 하는 명사적 용법의 to부정사 구조로, &#39;abolish하는 것을 동의했다&#39;라는 의미를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">both</td><td class=\"m\">양쪽의</td></tr><tr><td class=\"w\">agree</td><td class=\"m\">합의하다, 동의하다</td></tr><tr><td class=\"w\">abolish</td><td class=\"m\">폐지하다</td></tr><tr><td class=\"w\">tariff</td><td class=\"m\">관세</td></tr><tr><td class=\"w\">wall</td><td class=\"m\">장벽</td></tr><tr><td class=\"w\">within</td><td class=\"m\">~ 이내에</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>두 나라가 무역 협력을 위해 5년 안에 관세 장벽을 없애기로 했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Both countries have reached an agreement to remove trade barriers, and they will fully implement this plan within five years.</div>\n              <div class=\"lec-final-sum-ko\">두 나라는 무역 장벽을 제거하기로 합의했으며, 5년 이내에 이 계획을 완전히 이행할 것이다.</div></div></div>"],"se
