충분히 검토했다는 신뢰를 먼저 주는 것이 핵심이에요. 마치 친구의 부탁을 거절할 때 &quot;네 생각은 정말 좋지만, 지금 내 상황이 어려워&quot;라고 말하는 것처럼, 전문적인 의사소통(Professional Communication)에서도 이렇게 완곡하게 의사를 표현하는 방식이 관계를 유지하는 데 큰 도움이 된답니다. 이번 지문에서는 상대방의 제안을 신중하게 검토했음에도 불구하고, 결과적으로 수용하기 어렵다는 뜻을 어떻게 세련되게 전달하는지 그 문장 구조를 주목해서 살펴보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 설명</div><ul><li>귀하의 제안서를 신중하게 검토했으나 부정적인 결과를 전달하게 되었습니다.</li><li>제안서(proposal)에 대한 신중한 검토 완료</li><li>제안을 수락할 수 없음을 밝힘</li><li>핵심 키워드: 거절(refuse), 제안(proposal)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02결정 통보</div><ul><li>제안 내용을 받아들일 수 없음을 정중하게 알립니다.</li><li>수락할 수 없는 상태임을 명시(unable to accept)</li><li>유감스러운 마음을 표현함(regret)</li><li>핵심 키워드: 유감(regret), 수락(accept)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">careful</td><td class=\"m\">주의 깊은, 세심한</td></tr><tr><td class=\"w\">consideration</td><td class=\"m\">고려, 숙고</td></tr><tr><td class=\"w\">proposal</td><td class=\"m\">제안, 신청</td></tr><tr><td class=\"w\">regret</td><td class=\"m\">유감스럽게 생각하다, 후회하다</td></tr><tr><td class=\"w\">unable</td><td class=\"m\">~할 수 없는</td></tr><tr><td class=\"w\">accept</td><td class=\"m\">받아들이다, 수락하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">심사숙고한 후에</span><span class=\"en\"><b><span class=\"grammar-hl\">After careful consideration</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 제안에 대해서</span><span class=\"en\"><b><span class=\"grammar-hl\">of your proposal</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 유감입니다</span><span class=\"en\"><b>I regret</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말하게 되어</span><span class=\"en\"><b><span class=\"grammar-hl\">to say</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저희가 ~할 수 없다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that we are unable</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 받아들이는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to accept it</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신의 제안에 대해서 심사숙고한 후에, 저는 저희가 그것을 받아들일 수 없다고 말하게 되어 유감입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞부분의 &#39;제안을 검토했다&#39;는 내용은 거절을 하기 위한 선행 과정을 나타내며, 뒷부분의 &#39;수락할 수 없다&#39;는 거절의 의사를 밝히는 결론과 연결됩니다. 여기서 regret은 사전적으로는 &#39;후회하다&#39;라는 뜻이지만, 여기서는 비즈니스 상황에서 상대방에게 좋지 않은 소식을 전할 때 쓰는 &#39;유감스럽게 생각하다&#39;라는 완곡한 표현으로 쓰였습니다. 상대방의 제안을 존중하지만 거절해야 하는 상황에서 예의를 갖추기 위해 선택된 표현입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">After careful consideration of your proposal (전치사구): &#39;After&#39;는 전치사로서 뒤에 명사구(careful consideration of your proposal)를 취해 시간적 배경을 나타내는 부사구 역할을 합니다.</div><div class=\"lec-gr-item\">to say (to부정사): 부사적 용법(감정의 원인)으로 쓰여, 앞의 형용사 &#39;regret&#39;의 이유를 설명합니다.</div><div class=\"lec-gr-item\">that we are unable to accept it (명사절): 타동사 &#39;say&#39;의 목적어 역할을 하는 that절입니다. &#39;that&#39;은 접속사로 완전한 문장(S+V+O)을 이끕니다.</div><div class=\"lec-gr-item\">to accept (to부정사): 형용사 &#39;unable&#39;의 의미를 보완하는 형용사적 보어 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">careful</td><td class=\"m\">주의 깊은, 세심한</td></tr><tr><td class=\"w\">consideration</td><td class=\"m\">고려, 숙고</td></tr><tr><td class=\"w\">proposal</td><td class=\"m\">제안, 신청</td></tr><tr><td class=\"w\">regret</td><td class=\"m\">유감스럽게 생각하다, 후회하다</td></tr><tr><td class=\"w\">unable</td><td class=\"m\">~할 수 없는</td></tr><tr><td class=\"w\">accept</td><td class=\"m\">받아들이다, 수락하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>제안자를 위해 제안 내용을 진지하게 살펴보았다.</li><li>하지만 최종적으로는 제안을 수락하기 어렵다는 부정적인 결론을 내렸다.</li><li>정중한 표현을 통해 거절의 뜻을 명확히 전달하고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The company carefully reviewed the submitted proposal, yet they ultimately decided to decline it.</div>\n              <div class=\"lec-final-sum-ko\">회사는 제출된 제안서를 신중하게 검토했지만, 결국 그것을 거절하기로 결정했다.</div></div></div>"],"segs":[[{"audio":"./sentence10_audio/1.mp3","hl":null}],[{"audio":"./sentence10_audio/2.mp3","hl":null}],[{"audio":"./sentence10_audio/3.mp3","hl":null},{"audio":"./sentence10_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence10_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence10_audio/6.mp3","hl":null}],[{"audio":"./sentence10_audio/7.mp3","hl":"main"},{"audio":"./sentence10_audio/8.mp3","hl":"meaning"},{"audio":"./sentence10_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence10_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)
