1/mn0XUcEBHzdOMDp/+rORjkE0/apGVHO3C9cE4AwfrgDHboRzmlEZwG2uBnIGxwSR/EcL2B4xxgLk9KmjgkLoixSszsoA2Mc5IA6L3z6/N0FLS61afR67aO/ptqt0HRO76pb23V1e/azenVH//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Empty Promises: The Common Habit of Politicians<small>공허한 약속: 정치인들의 흔한 습관</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 정치인들이 대중의 인기를 얻기 위해 현실성이 없거나 불필요한 공약(Election promises)을 남발하는 행태를 꼬집고 있습니다. 여기서 다루는 핵심 개념인 선심성 공약(Pork barrel politics)은 정치인이 자신의 지역구에 이득이 되는 사업을 무리하게 추진하여 표를 얻으려는 전략을 의미하는데요, 마치 &#39;강이 없는 곳에 다리를 놓겠다&#39;고 말하는 것과 같이 실현 가능성보다 당장 눈앞의 지지를 얻는 것에 급급한 정치적 수사(Political rhetoric)를 비유적으로 표현한 것입니다. 이러한 현상은 합리적인 정책 결정보다는 유권자의 심리를 자극하는 포퓰리즘(Populism)의 전형적인 모습으로, 우리가 뉴스를 볼 때 정치인의 발언이 과연 실질적인 효용성(Practical utility)을 갖춘 것인지 비판적으로 바라봐야 하는 이유를 잘 보여줍니다. 따라서 이 글은 정치인의 말과 행동 뒤에 숨겨진 유권자 표심 확보를 위한 의도를 간파하는 것이 얼마나 중요한지를 일깨워 줍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01정치인의 보편성</div><ul><li>지리적 위치나 문화와 상관없이 정치인들은 전 세계 어디에서나 비슷한 특징을 보인다.</li><li>정치인들의 공통된 모습 (Politicians are the same)</li><li>장소에 구애받지 않는 행태 (all over)</li><li>핵심 키워드: 정치인(Politicians), 공통점(same)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02허구적인 공약</div><ul><li>정치인들은 자신의 성과를 보여주기 위해 실제로는 필요하지 않은 사업까지 추진하겠다고 약속한다.</li><li>강이 없는 곳에 다리 건설을 약속함 (build a bridge)</li><li>비현실적이고 보여주기식인 공약 (promise)</li><li>핵심 키워드: 약속(promise), 다리(bridge)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03비판적 함의</div><ul><li>이 문장은 실질적인 문제 해결보다는 유권자의 환심을 사기 위해 무리한 공약을 내세우는 정치권의 실태를 풍자한다.</li><li>실제 상황을 고려하지 않는 무분별한 정책 (no river)</li><li>정치인의 신뢰성에 대한 의문 제기</li><li>핵심 키워드: 풍자(satire), 신뢰(trust)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">politician</td><td class=\"m\">정치인</td></tr><tr><td class=\"w\">be the same</td><td class=\"m\">똑같다</td></tr><tr><td class=\"w\">all over</td><td class=\"m\">어디에서나, 도처에</td></tr><tr><td class=\"w\">promise</td><td class=\"m\">약속하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">build</td><td class=\"m\">건설하다, 짓다</td></tr><tr><td class=\"w\">bridge</td><td class=\"m\">다리</td></tr><tr><td class=\"w\">even</td><td class=\"m\">~조차도 (강조)</td></tr><tr><td class=\"w\">river</td><td class=\"m\">강</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">정치인들은</span><span class=\"en\"><b>Politicians</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">똑같다</span><span class=\"en\"><b><span class=\"grammar-hl\">are</span> the same</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어디에서나</span><span class=\"en\"><b>all over.</b></span></div></div><div class=\"lec-sent-ko\">정치인들은 어디서나 똑같다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전 세계 어디서든 정치인들이 보여주는 공통된 속성이 있음을 일반화하여 제시하는 문장입니다. 여기서 **same**은 &#39;똑같은&#39;이라는 사전적 의미를 넘어, 국적이나 지역을 불문하고 정치인들이 가진 부정적인 습성을 싸잡아 비판하려는 의도를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are 2형식 구조: 주어(Politicians) + 보어(the same)를 연결하는 be동사. 상태나 성질을 나타내는 2형식 문장이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">politician</td><td class=\"m\">정치인</td></tr><tr><td class=\"w\">all over</td><td class=\"m\">어디에서나, 도처에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약속한다 짓겠다고</span><span class=\"en\"><b>promise <span class=\"grammar-hl\">to build</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다리를</span><span class=\"en\"><b>a bridge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 ~하는 곳에도</span><span class=\"en\"><b>even <span class=\"grammar-hl\">where</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강이 없는</span><span class=\"en\"><b><span class=\"grammar-hl\">there is no river</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 강이 없는 곳에도 다리를 놓을 것을 약속한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 정치인들의 실체 없는 약속을 비유적으로 표현한 문장입니다. 여기서 **bridge**는 사전적으로 &#39;다리&#39;를 뜻하지만, 이 문맥에서는 &#39;실현 불가능한 공약&#39;이나 &#39;허황된 선심성 정책&#39;을 의미합니다. 필자는 다리가 필요 없는 곳에 굳이 다리를 짓겠다는 예시를 통해, 표를 얻기 위해 현실을 무시하고 말뿐인 공약을 남발하는 정치인의 행태를 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to build (to부정사): 동사 promise의 목적어 역할을 하는 명사적 용법의 to부정사 구문이다.</div><div class=\"lec-gr-item\">where there is no river (관계부사): 장소를 나타내는 선행사(place가 생략된 형태)를 수식하며, 뒤에 완전한 문장(there is no river)이 이어지는 관계부사절이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">promise</td><td class=\"m\">약속하다</td></tr><tr><td class=\"w\">build</td><td class=\"m\">건설하다, 짓다</td></tr><tr><td class=\"w\">bridge</td><td class=\"m\">다리</td></tr><tr><td class=\"w\">even</td><td class=\"m\">~조차도 (강조)</td></tr><tr><td class=\"w\">river</td><td class=\"m\">강</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>정치인들은 세계 어디서나 본질적으로 유사한 행태를 보인다.</li><li>그들은 현실적인 필요와 무관하게 허황된 공약을 남발하는 특징이 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Politicians make unrealistic promises everywhere, so they often claim to build infrastructure where it is not even needed.</div>\n              <div class=\"lec-final-sum-ko\">정치인들은 어디에서나 비현실적인 약속을 하며, 때로는 필요하지 않은 곳에 시설을 짓겠다고 주장한다.</div></div></div>"],"segs":[[{"audio":"./sentence05_audio/1.mp3","hl":null}],[{"audio":"./sentence05_audio/2.mp3","hl":null}],[{"audio":"./sentence05_audio/3.mp3","hl":null},{"audio":"./sentence05_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence05_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence05_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence05_audio/7.mp3","hl":null}],[{"audio":"./sentence05_audio/8.mp3","hl":"main"},{"audio":"./sentence05_audio/9.mp3","hl":"meaning"},{"audio":"./sentence05_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence05_audio/11.mp3","hl":"main"},{"audio":"./sentence05_audio/12.mp3","hl":"meaning"},{"audio":"./sentence05_audio/13.mp3","hl":"grammar"}],[{"audio":"./sentence05_audio/14.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){
