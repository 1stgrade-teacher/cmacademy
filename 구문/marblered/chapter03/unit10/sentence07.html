의에 대해서는 다투는 전략을 취하고 있는 것이죠. 마치 시험에서 두 문제를 풀었는데, 한 문제는 맞혔지만 다른 한 문제는 억울하다고 주장하는 상황과 비슷하다고 볼 수 있어요. 이렇게 법정에서는 자신의 혐의를 부분적으로 인정(Partial admission)하거나 부인함으로써 형량을 줄이려는 치열한 논리 싸움이 벌어지곤 한답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01사건의 인정</div><ul><li>취객은 자신이 차량을 훔쳤다는 사실을 인정하였다.</li><li>차량 절도(stealing the car) 사실을 시인함</li><li>범죄 행위 중 일부를 솔직하게 밝힘</li><li>핵심 키워드: 인정(admitted)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02혐의의 부인</div><ul><li>그는 술을 마신 채 차를 운전했다는 사실은 강력히 부인하였다.</li><li>음주 운전(driving under the influence of alcohol) 혐의를 거부함</li><li>절도와 음주 운전을 분리해서 주장함</li><li>핵심 키워드: 부인(denied)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">drunk</td><td class=\"m\">술에 취한</td></tr><tr><td class=\"w\">admit</td><td class=\"m\">인정하다</td></tr><tr><td class=\"w\">steal</td><td class=\"m\">훔치다</td></tr><tr><td class=\"w\">deny</td><td class=\"m\">부인하다</td></tr><tr><td class=\"w\">under the influence of</td><td class=\"m\">~의 영향 하에 (주로 술이나 약물)</td></tr><tr><td class=\"w\">alcohol</td><td class=\"m\">술</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 술 취한 남자는</span><span class=\"en\"><b>The <span class=\"grammar-hl\">drunken</span> man</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시인했다</span><span class=\"en\"><b>admitted</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 차를 훔쳤음을</span><span class=\"en\"><b><span class=\"grammar-hl\">stealing</span> the car,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 부인했다</span><span class=\"en\"><b>but denied</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 운전했음을</span><span class=\"en\"><b><span class=\"grammar-hl\">driving</span> it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">술에 취한 상태로</span><span class=\"en\"><b><span class=\"grammar-hl\">under the influence of alcohol</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 술 취한 남자는 그 차를 훔쳤음을 시인했다. 하지만 그것을 술에 취한 상태로 운전한 것을 부인했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 한 인물의 두 가지 행동에 대한 서로 다른 태도를 대조하고 있습니다. 여기서 **admitted**는 &#39;인정하다&#39;라는 뜻인데, 자신의 잘못을 사실대로 말하며 긍정한다는 의미입니다. 반면 **denied**는 &#39;부인하다&#39;라는 뜻으로, 이어지는 행동에 대해서는 강하게 부정하고 있습니다. 필자는 admitted와 denied를 대조하여, 남자가 일부 잘못은 시인하면서도 더 무거운 죄(음주운전)에 대해서는 책임을 회피하려는 심리를 효과적으로 보여주기 위해 이 단어들을 골랐습니다. 또한, under the influence of alcohol은 직역하면 &#39;알코올의 영향력 아래에 있는&#39;이라는 뜻이지만, 문맥상 &#39;술에 취해(음주 상태로)&#39;라는 관용적 표현으로 쓰였습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">drunken (과거분사(형용사)): drunken이 man을 수식하는 구조로, &#39;술에 취한 상태의 남자&#39;라는 의미를 나타냅니다.</div><div class=\"lec-gr-item\">stealing (동명사): admit의 목적어 역할을 하며, &#39;훔쳤던 행위&#39;라는 명사적 개념을 나타냅니다.</div><div class=\"lec-gr-item\">driving (동명사): deny의 목적어 역할을 하며, &#39;운전했던 행위&#39;라는 명사적 개념을 나타냅니다.</div><div class=\"lec-gr-item\">under the influence of alcohol (관용표현): &#39;음주 상태에서&#39;라는 뜻의 숙어로, 특정 상태에 처해 있음을 나타내는 전치사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">drunk</td><td class=\"m\">술에 취한</td></tr><tr><td class=\"w\">admit</td><td class=\"m\">인정하다</td></tr><tr><td class=\"w\">steal</td><td class=\"m\">훔치다</td></tr><tr><td class=\"w\">under the influence of</td><td class=\"m\">~의 영향 하에 (주로 술이나 약물)</td></tr><tr><td class=\"w\">alcohol</td><td class=\"m\">술</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>술 취한 남자가 차를 훔친 사실은 시인했다.</li><li>하지만 음주운전을 했다는 사실은 강력하게 부정했다.</li><li>자신의 행위 중 일부는 인정하고 일부는 부인하는 인물의 상태를 보여준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The man admitted to the theft of the vehicle, yet he denied the accusation of operating it while under the influence.</div>\n              <div class=\"lec-final-sum-ko\">그 남성은 차량 절도는 인정했으나, 음주 상태로 운전했다는 혐의는 부인했다.</div></div></div>"],"segs":[[{"audio":"./sentence07_audio/1.mp3","hl":null}],[{"audio":"./sentence07_audio/2.mp3","hl":null}],[{"audio":"./sentence07_audio/3.mp3","hl":null},{"audio":"./sentence07_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence07_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence07_audio/6.mp3","hl":null}],[{"audio":"./sentence07_audio/7.mp3","hl":"main"},{"audio":"./sentence07_audio/8.mp3","hl":"meaning"},{"audio":"./sentence07_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence07_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=
