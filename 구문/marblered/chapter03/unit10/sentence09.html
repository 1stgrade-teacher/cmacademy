맞닿아 있습니다. 분석심리학의 대가 칼 융(Carl Jung)은 우리 모두가 타인에게 숨기고 싶어 하는 어두운 면이나 열등감, 파괴적인 본능을 마음속 깊은 곳에 지니고 있다고 보았어요. 우리가 어린 시절 침대 밑의 괴물을 무서워했던 것처럼 어른이 되어서도 외부의 적을 찾으려 하지만, 사실은 우리 자신의 내적 갈등(Internal conflict)이나 억눌린 감정들이 진짜 문제의 원인인 경우가 많다는 점을 시사합니다. 즉, 외부 환경을 탓하기보다 자신의 자아 성찰(Self-reflection)을 통해 내면의 어두운 부분을 직면하고 수용하는 것이 성숙한 어른이 되는 첫걸음이라는 의미를 담고 있는 것이죠.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01어린 시절의 인식</div><ul><li>성장하기 전 우리는 보이지 않는 외부의 존재를 두려워했다.</li><li>침대 밑(under our bed)에 숨은 괴물을 확인하던 시절</li><li>상상 속의 대상에 대한 막연한 공포(fear)</li><li>핵심 키워드: 괴물(monsters)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02성숙을 통한 깨달음</div><ul><li>시간이 지나면서 우리는 진정한 공포의 실체를 알게 된다.</li><li>밖이 아닌 자신의 내면(inside us)을 들여다봄</li><li>더 이상 외부의 괴물을 찾지 않게 됨</li><li>핵심 키워드: 내면(inner self)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03존재론적 변화</div><ul><li>성인이 된 인간은 외부 위협보다 자신의 심리적 상태를 더 중요하게 인식한다.</li><li>통제할 수 없는 내적 갈등이나 본성을 직면함</li><li>실재하는 괴물은 외부의 존재가 아닌 우리의 마음속에 있음을 인정</li><li>핵심 키워드: 자아 성찰(self-reflection)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stop</td><td class=\"m\">멈추다, 그만두다</td></tr><tr><td class=\"w\">check for</td><td class=\"m\">~이 있는지 확인하다</td></tr><tr><td class=\"w\">monster</td><td class=\"m\">괴물</td></tr><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다</td></tr><tr><td class=\"w\">inside</td><td class=\"m\">안쪽에, 내면에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그만두었다</span><span class=\"en\"><b>stopped <span class=\"grammar-hl\">checking</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">괴물들을 살펴보는 것을</span><span class=\"en\"><b>for monsters</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 침대 아래에 있는</span><span class=\"en\"><b>under our bed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 깨달았을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when we realized</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 있다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">they were</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 안에</span><span class=\"en\"><b><span class=\"grammar-hl\">inside us</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 괴물들이 우리 안에 있다는 것을 깨달았을 때 우리의 침대 아래에서 그것들을 살펴보는 것을 그만두었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 우리가 성인이 되면서 겪는 심리적 변화를 비유적으로 표현하고 있습니다. 여기서 monsters는 사전적으로 &#39;괴물&#39;을 의미하지만, 문맥상으로는 우리를 괴롭히는 &#39;내면의 공포, 불안, 혹은 부정적인 생각&#39;을 뜻합니다. 필자는 어린 시절 침대 밑에 실재하는 괴물을 두려워했던 순수한 공포가, 나이가 들면서 자신의 마음속에 도사린 복잡한 고민과 갈등으로 옮겨갔음을 강조하기 위해 이 낱말을 선택했습니다. 즉, 물리적인 위협을 찾던 행동이 이제는 자기 성찰이라는 내적 과정으로 바뀌었음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">checking (동명사): stop은 목적어로 -ing를 취하는 동사로, 여기서 checking은 &#39;점검하는 행위&#39;를 나타내는 명사적 기능의 동명사이다.</div><div class=\"lec-gr-item\">when we realized they were inside us (관계부사(시간)): when은 시간의 부사절을 이끄는 접속사 역할을 하며, &#39;우리가 그들이 우리 안에 있다는 것을 깨달았을 때&#39;라는 의미로 문장 전체를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stop</td><td class=\"m\">멈추다, 그만두다</td></tr><tr><td class=\"w\">monster</td><td class=\"m\">괴물</td></tr><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다</td></tr><tr><td class=\"w\">inside</td><td class=\"m\">안쪽에, 내면에</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>어릴 적에는 침대 밑에 괴물이 있을까 봐 두려워하며 이를 확인하곤 했다.</li><li>하지만 성장하며 진정한 두려움의 근원이 외부가 아닌 내면에 있음을 깨닫게 된다.</li><li>성숙해진 우리는 더 이상 외부의 환상을 확인하지 않고, 자신의 내면을 직면하는 법을 배운다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People stop fearing imaginary external threats as they grow up, but they eventually realize that the true monsters are their own inner conflicts.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 성장하며 가상의 외부 위협을 두려워하는 것을 멈추지만, 결국 진짜 괴물은 자신의 내적 갈등임을 깨닫는다.</div></div></div>"],"segs":[[{"audio":"./sentence09_audio/1.mp3","hl":null}],[{"audio":"./sentence09_audio/2.mp3","hl":null}],[{"audio":"./sentence09_audio/3.mp3","hl":null},{"audio":"./sentence09_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence09_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence09_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence09_audio/7.mp3","hl":null}],[{"audio":"./sentence09_audio/8.mp3","hl":"main"},{"audio":"./sentence09_audio/9.mp3","hl":"meaning"},{"audio":"./sentence09_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence09_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBou
