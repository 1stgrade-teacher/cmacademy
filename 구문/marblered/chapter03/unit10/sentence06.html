고 상황에 따라 신중하게 활용하는 태도가 꼭 필요합니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01직관의 불완전성</div><ul><li>인간의 직관은 항상 옳은 것이 아니며 때때로 오류를 범할 수 있다.</li><li>본능(instincts)이 언제나 정확한 것은 아님</li><li>자신의 판단이 완벽하지 않음을 인식할 필요성</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02의사결정의 딜레마</div><ul><li>직관을 따를지 아니면 무시할지를 선택해야 하는 상황에 직면한다.</li><li>판단의 갈림길: 직관을 따를 것인가(follow) 혹은 무시할 것인가(ignore)</li><li>선택의 기준에 대한 의문 제기</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03올바른 판단을 위한 성찰</div><ul><li>자신의 직관을 무조건 믿지 말고 그 타당성을 검토해야 한다.</li><li>직관의 정당성을 평가하는 비판적 사고의 필요성</li><li>올바른 의사결정을 위한 내면의 성찰(reflection)</li><li>핵심 키워드: 직관(instincts), 판단(judgment)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">instinct</td><td class=\"m\">본능</td></tr><tr><td class=\"w\">correct</td><td class=\"m\">옳은, 정확한</td></tr><tr><td class=\"w\">follow</td><td class=\"m\">따르다</td></tr><tr><td class=\"w\">ignore</td><td class=\"m\">무시하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 누구의 본능도</span><span class=\"en\"><b>No one’s instincts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상 올바르지는 않다</span><span class=\"en\"><b>are always correct;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>so</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 당신은 아는가</span><span class=\"en\"><b>how do you know</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">언제 그것을 따라야 할지를</span><span class=\"en\"><b><span class=\"grammar-hl\">when to follow them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 언제 그것을 무시해야 할지를</span><span class=\"en\"><b>and <span class=\"grammar-hl\">when to ignore them</span>?</b></span></div></div><div class=\"lec-sent-ko\">(어느 누구의 본능도 항상 올바르지는 않다. 그렇다면 당신은 언제 그것을 따라야 할지 그리고 언제 그것을 무시해야 할지를 어떻게 아는가?)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞부분에서 &#39;본능이 항상 옳지는 않다&#39;는 전제를 제시함으로써, 본능을 맹신해서는 안 된다는 문제의식을 던집니다. 여기서 instincts는 사전적으로 &#39;본능&#39;이지만, 여기서는 깊게 생각하지 않고 내리는 &#39;직관적인 판단이나 느낌&#39;을 의미합니다. 필자가 굳이 이 단어를 쓴 이유는 우리가 스스로의 판단을 객관적 사실처럼 믿기 쉽다는 점을 지적하여, 그것이 틀릴 수 있음을 경고하기 위함입니다. 이어지는 뒷부분은 &#39;그렇다면 어떻게 올바른 선택을 할 것인가?&#39;라는 질문을 통해 독자에게 본능을 활용하는 기준이 필요함을 암시하며 논의를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when to follow them (to부정사): 의문사 + to부정사 형태(의문사절의 축약)로, &#39;follow&#39;의 목적어 역할을 하며 &#39;~해야 할지&#39;라는 의미를 나타냄</div><div class=\"lec-gr-item\">when to ignore them (to부정사): 의문사 + to부정사 형태(의문사절의 축약)로, 앞의 &#39;when to follow them&#39;과 병렬 구조를 이루며 &#39;ignore&#39;의 목적어 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">instinct</td><td class=\"m\">본능</td></tr><tr><td class=\"w\">correct</td><td class=\"m\">옳은, 정확한</td></tr><tr><td class=\"w\">follow</td><td class=\"m\">따르다</td></tr><tr><td class=\"w\">ignore</td><td class=\"m\">무시하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>누구의 본능이나 직관도 항상 정답일 수는 없다.</li><li>본능이 틀릴 수 있다는 점을 인정하고, 그것을 따를지 무시할지 판단할 기준이 필요하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Human instincts are not consistently correct, so individuals must determine when to follow or ignore them.</div>\n              <div class=\"lec-final-sum-ko\">인간의 본능은 항상 올바른 것은 아니므로, 사람들은 언제 그것을 따르고 언제 무시할지 판단해야 한다.</div></div></div>"],"segs":[[{"audio":"./sentence06_audio/1.mp3","hl":null}],[{"audio":"./sentence06_audio/2.mp3","hl":null}],[{"audio":"./sentence06_audio/3.mp3","hl":null},{"audio":"./sentence06_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence06_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence06_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence06_audio/7.mp3","hl":null}],[{"audio":"./sentence06_audio/8.mp3","hl":"main"},{"audio":"./sentence06_audio/9.mp3","hl":"meaning"},{"audio":"./sentence06_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence06_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTime
