v class=\"lec-cover-bkg-txt\">사람의 행동은 성격(Personality)뿐만 아니라 그 사람이 처한 사회적 상황(Social situation)에 의해서도 크게 결정되는데, 심리학에서는 이를 상황의 힘(Power of the situation)이라고 불러요. 예를 들어, 평소 성격이 차분한 사람이라도 긴급한 화재 상황에 처하면 밖으로 급하게 뛰쳐나가는 것처럼, 우리 행동은 주변 환경에 따라 180도 달라질 수 있답니다. 초기 성격 심리학자들은 개인의 고유한 성격만으로 행동을 예측하려 했지만, 현대 심리학은 상황이 개인의 선택에 미치는 막대한 영향력을 중요하게 다루고 있어요. 즉, 우리는 &#39;어떤 사람인가&#39;와 동시에 &#39;어디에 놓여 있는가&#39;라는 두 가지 축을 모두 고려해야 인간의 행동을 제대로 이해할 수 있다는 것이죠.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01기존의 인식</div><ul><li>성격 심리학자들은 인간의 행동을 이해할 때 한 가지 측면을 간과해 왔다.</li><li>성격 심리학자(Personality psychologists)들의 편향된 시각</li><li>성격(personality)이 행동을 결정한다는 고정관념</li><li>핵심 키워드: 성격 심리학자(Personality psychologists)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02간과된 요인</div><ul><li>전문가들은 외부 환경이 인간의 행동에 끼치는 강력한 영향력을 충분히 고려하지 않았다.</li><li>사회적 상황(social situation)이 행동 형성에 미치는 역할</li><li>성격과 독립적으로 작용하는 외부 요인</li><li>핵심 키워드: 사회적 상황(social situation)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03재평가의 필요성</div><ul><li>사람의 행동을 결정하는 것은 내면의 성격뿐만 아니라 상황적 맥락이 매우 중요하다.</li><li>성격만으로는 설명할 수 없는 행동의 다양성</li><li>상황이 인간의 행동을 구체적으로 형성함(shapes behavior)</li><li>핵심 키워드: 행동 형성(shapes behavior)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">personality</td><td class=\"m\">성격</td></tr><tr><td class=\"w\">psychologist</td><td class=\"m\">심리학자</td></tr><tr><td class=\"w\">underestimate</td><td class=\"m\">과소평가하다</td></tr><tr><td class=\"w\">extent</td><td class=\"m\">정도, 범위</td></tr><tr><td class=\"w\">social</td><td class=\"m\">사회의, 사회적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">situation</td><td class=\"m\">상황</td></tr><tr><td class=\"w\">shape</td><td class=\"m\">형성하다</td></tr><tr><td class=\"w\">behavior</td><td class=\"m\">행동</td></tr><tr><td class=\"w\">independently of</td><td class=\"m\">~와 독립적으로, ~와 별개로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">성격 심리학자들은</span><span class=\"en\"><b>Personality psychologists</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과소평가했었다</span><span class=\"en\"><b>had underestimated</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정도를</span><span class=\"en\"><b><span class=\"grammar-hl\">the extent</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어느 정도로냐면</span><span class=\"en\"><b><span class=\"grammar-hl\">to which</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사회적 상황이</span><span class=\"en\"><b><span class=\"grammar-hl\">the social situation</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">형성하는</span><span class=\"en\"><b><span class=\"grammar-hl\">shapes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들의 행동을</span><span class=\"en\"><b><span class=\"grammar-hl\">people’s behavior</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~와 관계없이</span><span class=\"en\"><b><span class=\"grammar-hl\">independently of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 성격과</span><span class=\"en\"><b>their personality.</b></span></div></div><div class=\"lec-sent-ko\">성격 심리학자들은 사회적 상황이 그들의 성격과 관계없이 사람들의 행동을 형성하는 정도를 과소평가했었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 underestimated는 사전적으로 &#39;과소평가하다&#39;라는 뜻인데, 여기서는 성격 심리학자들이 성격이라는 요소에만 너무 몰두한 나머지, 상황의 힘을 오랫동안 제대로 인식하지 못했다는 뜻입니다. shapes는 &#39;모양을 만들다&#39;라는 뜻이지만, 여기서는 상황이 사람의 행동을 특정 방향으로 빚어내고 결정짓는다는 것을 강조하기 위해 이 동사를 선택했습니다. 이 문장은 글의 도입부로서, 기존의 심리학 연구가 가진 한계를 지적하며 앞으로 &#39;상황의 힘&#39;에 대해 논의할 것임을 예고하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the extent to which the social situation shapes people’s behavior (전치사+관계대명사): &#39;전치사(to) + 관계대명사(which) + S(the social situation) + V(shapes)&#39; 구조의 관계대명사절입니다. 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절(완전문장)이 옵니다. 전체적으로 앞의 명사 the extent를 수식하는 형용사절 역할을 합니다.</div><div class=\"lec-gr-item\">independently of (관용표현): &#39;~와는 독립적으로, ~와는 별개로&#39;라는 의미의 전치사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">personality</td><td class=\"m\">성격</td></tr><tr><td class=\"w\">psychologist</td><td class=\"m\">심리학자</td></tr><tr><td class=\"w\">underestimate</td><td class=\"m\">과소평가하다</td></tr><tr><td class=\"w\">extent</td><td class=\"m\">정도, 범위</td></tr><tr><td class=\"w\">social</td><td class=\"m\">사회의, 사회적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">situation</td><td class=\"m\">상황</td></tr><tr><td class=\"w\">shape</td><td class=\"m\">형성하다</td></tr><tr><td class=\"w\">behavior</td><td class=\"m\">행동</td></tr><tr><td class=\"w\">independently of</td><td class=\"m\">~와 독립적으로, ~와 별개로</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>성격 심리학자들은 오랫동안 성격이 행동의 핵심이라고 믿어왔다.</li><li>그러나 실제로는 사회적 상황이 개인의 성격과 상관없이 행동에 큰 영향을 미친다.</li><li>심리학계는 그동안 이러한 상황의 영향력을 간과하고 있었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Personality psychologists previously undervalued the impact of social situations, yet these external factors significantly shape human behavior regardless of individual personality.</div>\n              <div class=\"lec-final-sum-ko\">성격 심리학자들은 이전에는 사회적 상황의 영향을 과소평가했지만, 이러한 외부 요인들은 개인의 성격과 관계없이 인간의 행동을 크게 형성한다.</div></div></div>"],"segs":[[{"audio":"./sen
