와는 다르게 메시지가 왜곡되어 전달되는 의사소통의 오류(Communication error)는 인간관계에서 잦은 갈등을 일으키는 주된 원인이 되기도 하죠. 마치 연못에 던진 작은 돌멩이가 큰 파동을 만드는 것처럼, 우리가 가볍게 뱉은 말도 듣는 사람의 심리 상태나 상황에 따라 예상치 못한 나비 효과(Butterfly effect)를 불러올 수 있습니다. 따라서 말을 하기 전에 그 말이 상대방에게 어떤 영향을 줄지 한 번 더 생각하는 신중한 태도(Mindful communication)는 원만한 인간관계를 유지하는 데 매우 중요한 핵심 요소라고 할 수 있어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01말의 영향력</div><ul><li>우리가 무심코 사용하는 말은 때때로 예상하지 못한 결과를 초래하기도 한다.</li><li>생각 없이 내뱉는 말(carelessly used words)의 위험성</li><li>의도와 다르게 나타나는 결과(unexpected results)</li><li>핵심 키워드: 부주의한 사용(careless use)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02말의 파급 효과</div><ul><li>말은 단순히 의사를 전달하는 것을 넘어 상대방이나 상황에 영향을 미친다.</li><li>예상치 못한 상황을 만드는 언어의 힘</li><li>말하기 전 신중함의 중요성</li><li>핵심 키워드: 예상치 못한 결과(unexpected results)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experience</td><td class=\"m\">경험하다, 겪다</td></tr><tr><td class=\"w\">unexpected</td><td class=\"m\">예상치 못한, 뜻밖의</td></tr><tr><td class=\"w\">result</td><td class=\"m\">결과</td></tr><tr><td class=\"w\">bring about</td><td class=\"m\">~을 초래하다, 야기하다</td></tr><tr><td class=\"w\">carelessly</td><td class=\"m\">부주의하게, 경솔하게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 경험한다</span><span class=\"en\"><b>often experience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예상치 못한 결과를</span><span class=\"en\"><b>unexpected results</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">초래되는</span><span class=\"en\"><b>brought about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말에 의해서</span><span class=\"en\"><b>by words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부주의하게 사용된</span><span class=\"en\"><b>carelessly used.</b></span></div></div><div class=\"lec-sent-ko\">우리는 종종 부주의하게 사용된 말에 의해서 초래되는 예상치 못한 결과를 경험한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로서, 우리의 언어 습관이 의도하지 않은 부정적인 결과를 낳을 수 있다는 점을 지적합니다. 여기서 brought about은 사전적으로는 &#39;~을 가져오다&#39;이지만, 여기서는 &#39;어떤 사건이나 상황을 원인으로 하여 발생하게 만들다&#39;라는 인과관계를 강조합니다. 필자가 이 표현을 선택한 이유는 우리가 무심코 뱉은 말이 단순히 공중에 사라지는 것이 아니라, 실제 현실에서 어떤 사건을 &#39;유발하는 원인&#39;이 됨을 강조하기 위해서입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are approaching (현재진행): be동사(are) + 현재분사(approaching) 결합으로, 현재 시점에서 동작이 진행 중임을 나타내는 구조입니다.</div><div class=\"lec-gr-item\">the time when machines will be able to outperform humans (관계부사): 관계부사 when이 선행사 the time을 수식하며, 뒤에 machines(주어) + will be(동사)로 이어지는 완전한 절이 오는 구조입니다.</div><div class=\"lec-gr-item\">be able to (관용표현): can과 같은 의미의 조동사적 표현으로, be동사 + able(형용사) + to부정사 구조로 쓰입니다.</div><div class=\"lec-gr-item\">to outperform (to부정사): be able to 뒤에 결합하여 동사원형 outperform을 취하는 구조로, 문장의 전체적인 능력을 보완하는 명사적/형용사적 보어 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experience</td><td class=\"m\">경험하다, 겪다</td></tr><tr><td class=\"w\">unexpected</td><td class=\"m\">예상치 못한, 뜻밖의</td></tr><tr><td class=\"w\">result</td><td class=\"m\">결과</td></tr><tr><td class=\"w\">carelessly</td><td class=\"m\">부주의하게, 경솔하게</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들은 흔히 아무 생각 없이 내뱉은 말 때문에 예상 밖의 결과를 겪곤 한다.</li><li>무심코 쓴 단어가 현실에서 의도치 않은 사건을 일으키는 원인이 될 수 있다.</li><li>언어 사용에는 책임이 따르며, 무심한 말 한마디가 상황을 바꿀 수 있음을 경계해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People frequently face unexpected outcomes because they use language without enough consideration, so they should be more mindful of their speech.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 충분한 고려 없이 언어를 사용하여 예상치 못한 결과를 자주 마주하게 되므로, 자신의 말에 더 신중해야 한다.</div></div></div>"],"segs":[[{"audio":"./지문 02_강의_audio/1.mp3","hl":null}],[{"audio":"./지문 02_강의_audio/2.mp3","hl":null}],[{"audio":"./지문 02_강의_audio/3.mp3","hl":null},{"audio":"./지문 02_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./지문 02_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./지문 02_강의_audio/6.mp3","hl":null}],[{"audio":"./지문 02_강의_audio/7.mp3","hl":"main"},{"audio":"./지문 02_강의_audio/8.mp3","hl":"meaning"},{"audio":"./지문 02_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./지문 02_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
