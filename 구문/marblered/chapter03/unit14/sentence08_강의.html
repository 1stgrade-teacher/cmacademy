보통 &#39;좋다&#39;라고만 말하기보다는 형용사(Adjective)를 활용해 &#39;멋지다(great)&#39;나 &#39;환상적이다(terrific)&#39;처럼 구체적인 단어를 선택하면, 듣는 사람이 화자의 기분을 훨씬 생생하게 공감할 수 있게 됩니다. 마치 요리할 때 소금만 치는 것보다 다양한 향신료(Spices)를 더해 풍미를 살리는 것과 비슷한 원리라고 할 수 있죠. 언어학에서는 이렇게 상황에 딱 맞는 어휘를 선택하는 능력을 어휘적 정밀성(Lexical Precision)이라고 부르는데, 이를 잘 활용하면 상대방에게 자신의 생각과 감정을 더욱 효과적으로 전달할 수 있답니다. 이 글은 단순히 정보를 전달하는 것을 넘어, 언어를 더 다채롭고 매력적으로 사용하는 방법을 고민해 보게 합니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 설정</div><ul><li>기쁨이나 즐거움을 효과적으로 전달하고 싶은 상황을 가정한다.</li><li>자신이 느끼는 감정을 구체적으로 나타내고 싶음</li><li>단어 선택이 감정 표현의 질을 결정함</li><li>핵심 키워드: 표현적인(expressive), 즐거움(pleasure)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02구체적 제안</div><ul><li>감정을 더 생생하게 전달하기 위해 평범한 단어 대신 강렬한 단어를 사용한다.</li><li>&#39;great&#39;, &#39;terrific&#39;, &#39;wonderful&#39;과 같은 단어 활용</li><li>더 생생하고 힘 있는 어휘를 고르는 연습</li><li>핵심 키워드: 단어 선택(choose words), 감정 표현(express)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03기대 효과</div><ul><li>풍부한 어휘를 사용하여 의사소통의 수준을 높인다.</li><li>상대방에게 자신의 감정을 더 명확히 전달함</li><li>일상적인 대화에서 더 긍정적인 반응을 이끌어냄</li><li>핵심 키워드: 의사소통(communication), 어휘력(vocabulary)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">choose</td><td class=\"m\">선택하다</td></tr><tr><td class=\"w\">expressive</td><td class=\"m\">표현이 풍부한, 의미심장한</td></tr><tr><td class=\"w\">terrific</td><td class=\"m\">아주 좋은, 훌륭한</td></tr><tr><td class=\"w\">wonderful</td><td class=\"m\">아주 멋진, 훌륭한</td></tr><tr><td class=\"w\">express</td><td class=\"m\">표현하다, 나타내다</td></tr><tr><td class=\"w\">pleasure</td><td class=\"m\">기쁨, 즐거움</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">단어들을 선택하라</span><span class=\"en\"><b>Choose words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 표현력이 있는,</span><span class=\"en\"><b><span class=\"grammar-hl\">that are more expressive</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘great’와 같은</span><span class=\"en\"><b>like ‘great’</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 ‘terrific’</span><span class=\"en\"><b>or ‘terrific’</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 ‘wonderful’</span><span class=\"en\"><b>or ‘wonderful’</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 원한다면</span><span class=\"en\"><b><span class=\"grammar-hl\">if you want</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즐거움을 표현하기를.</span><span class=\"en\"><b><span class=\"grammar-hl\">to express pleasure</span>.</b></span></div></div><div class=\"lec-sent-ko\">만약 당신이 즐거움을 표현하고 싶다면 ‘great,’ ‘terrific,’ 또는 ‘wonderful’처럼 더욱 표현력이 있는 단어들을 선택하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 독자에게 구체적인 상황에서 어떤 어휘를 사용해야 하는지 제안하는 조언의 문장입니다. 앞선 문맥이 있다면 그 문맥에서 단순히 &#39;좋다&#39;고 말하는 것보다 더 구체적인 감정을 나타낼 것을 권장하는 흐름일 것입니다. 여기서 expressive는 사전적으로 &#39;표현력이 있는&#39;이라는 뜻인데, 여기서는 단순히 감정을 전달하는 것을 넘어 듣는 사람에게 생생한 느낌을 줄 수 있는 &#39;생동감이 넘치는&#39;이라는 뜻으로 쓰였습니다. 필자가 이 단어를 고른 이유는 막연한 표현보다 구체적인 단어를 선택하는 것이 대화의 질을 높인다는 점을 강조하기 위해서입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that are more expressive (관계대명사): that은 주격 관계대명사로, 선행사 words를 수식하며 관계대명사 뒤에는 주어가 생략된 불완전한 절(동사 are + 보어)이 온다.</div><div class=\"lec-gr-item\">if you want to express pleasure (to부정사): to express는 want(타동사)의 목적어 역할을 하는 명사적 용법의 to부정사 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">choose</td><td class=\"m\">선택하다</td></tr><tr><td class=\"w\">expressive</td><td class=\"m\">표현이 풍부한, 의미심장한</td></tr><tr><td class=\"w\">terrific</td><td class=\"m\">아주 좋은, 훌륭한</td></tr><tr><td class=\"w\">wonderful</td><td class=\"m\">아주 멋진, 훌륭한</td></tr><tr><td class=\"w\">express</td><td class=\"m\">표현하다, 나타내다</td></tr><tr><td class=\"w\">pleasure</td><td class=\"m\">기쁨, 즐거움</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>단순히 &#39;좋다&#39;는 표현보다는 기쁨을 나타내는 더 구체적인 단어를 선택할 것을 권장함.</li><li>더 생생하고 풍부한 어휘를 사용하는 것이 의사소통을 더 효과적으로 만든다는 점을 시사함.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">You should choose vivid and expressive adjectives to share your joy, because they help convey your positive feelings more clearly to others.</div>\n              <div class=\"lec-final-sum-ko\">당신은 기쁨을 나누기 위해 생생하고 표현력이 풍부한 형용사를 선택해야 하는데, 이는 당신의 긍정적인 감정을 다른 사람들에게 더 명확하게 전달하도록 돕기 때문이다.</div></div></div>"],"segs":[[{"audio":"./sentence08_강의_audio/1.mp3","hl":null}],[{"audio":"./sentence08_강의_audio/2.mp3","hl":null}],[{"audio":"./sentence08_강의_audio/3.mp3","hl":null},{"audio":"./sentence08_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence08_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence08_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence08_강의_audio/7.mp3","hl":null}],[{"audio":"./sentence08_강의_audio/8.mp3","hl":"main"},{"audio":"./sentence08_강의_audio/9.mp3","hl":"meaning"},{"audio":"./sentence08_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence08_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++
