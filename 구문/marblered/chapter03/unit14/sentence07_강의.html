iv>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atmosphere</td><td class=\"m\">대기</td></tr><tr><td class=\"w\">supply</td><td class=\"m\">공급하다</td></tr><tr><td class=\"w\">oxygen</td><td class=\"m\">산소</td></tr><tr><td class=\"w\">survive</td><td class=\"m\">살아남다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">as well as</td><td class=\"m\">~뿐만 아니라</td></tr><tr><td class=\"w\">carbon dioxide</td><td class=\"m\">이산화탄소</td></tr><tr><td class=\"w\">need</td><td class=\"m\">필요로 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 대기는</span><span class=\"en\"><b>Our atmosphere</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 산소를 제공한다</span><span class=\"en\"><b>supplies most of the oxygen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물들이 반드시 가져야 하는</span><span class=\"en\"><b><span class=\"grammar-hl\">which animals must have</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생존하기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to survive</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~뿐만 아니라</span><span class=\"en\"><b>as well as</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이산화탄소를</span><span class=\"en\"><b>the carbon dioxide</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식물들에 의해 필요로 되는</span><span class=\"en\"><b><span class=\"grammar-hl\">needed by plants</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리의 대기는 식물이 필요로 하는 이산화탄소뿐만 아니라 생존하기 위해서 동물들이 가져야 하는 대부분의 산소를 제공한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 대기(atmosphere)가 지구상의 생명체 유지에 필수적인 기체들의 &#39;공급원&#39; 역할을 한다는 점을 설명합니다. &#39;supplies&#39;는 사전적으로는 &#39;물자를 제공하다&#39;는 뜻이지만, 여기서는 대기가 생명 유지에 필요한 기체를 자연스럽게 &#39;내어주고 지속적으로 보충해준다&#39;는 맥락입니다. 필자는 지구의 환경이 생명체의 요구에 맞춰 필요한 요소를 즉각적으로 제공하고 있다는 사실을 강조하기 위해 이 단어를 선택했습니다. 또한, &#39;as well as&#39;를 사용하여 산소와 이산화탄소 두 가지 모두 생태계에 없어서는 안 될 요소임을 병렬적으로 나열하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">which animals must have (관계대명사): which가 이끄는 절이 앞의 선행사 oxygen을 수식함. 관계대명사 뒤의 절인 &#39;animals must have ( )&#39;에서 목적어 자리가 비어 있는 불완전한 구조이며, which가 그 목적어 역할을 함</div><div class=\"lec-gr-item\">to survive (to부정사): 부사적 용법(목적)으로, &#39;생존하기 위하여&#39;라는 의미로 동사의 목적을 나타냄</div><div class=\"lec-gr-item\">needed by plants (과거분사(형용사)): needed가 뒤에서 앞의 명사 carbon dioxide를 수식함. &#39;plants that are needed by&#39;라는 의미의 축약된 관계절 구조임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atmosphere</td><td class=\"m\">대기</td></tr><tr><td class=\"w\">oxygen</td><td class=\"m\">산소</td></tr><tr><td class=\"w\">survive</td><td class=\"m\">살아남다</td></tr><tr><td class=\"w\">as well as</td><td class=\"m\">~뿐만 아니라</td></tr><tr><td class=\"w\">carbon dioxide</td><td class=\"m\">이산화탄소</td></tr><tr><td class=\"w\">need</td><td class=\"m\">필요로 하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>지구의 대기는 동물에게 필요한 산소를 공급한다.</li><li>동시에 식물에게 필수적인 이산화탄소도 제공한다.</li><li>즉, 대기는 지구상의 모든 생명체가 살아가는 데 필요한 핵심 자원을 공급하는 역할을 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The atmosphere supports life by providing oxygen for animals and carbon dioxide for plants.</div>\n              <div class=\"lec-final-sum-ko\">대기는 동물을 위한 산소와 식물을 위한 이산화탄소를 제공함으로써 생명을 유지한다.</div></div></div>"],"segs":[[{"audio":"./sentence07_강의_audio/1.mp3","hl":null}],[{"audio":"./sentence07_강의_audio/2.mp3","hl":null}],[{"a
