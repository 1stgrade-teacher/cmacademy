logy)로 변환</li><li>공학(engineering)을 통해 현실적인 문제 해결책을 설계</li><li>핵심 키워드: 원재료(raw materials)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">basic</td><td class=\"m\">기초적인</td></tr><tr><td class=\"w\">scientific</td><td class=\"m\">과학의</td></tr><tr><td class=\"w\">research</td><td class=\"m\">연구</td></tr><tr><td class=\"w\">provide</td><td class=\"m\">제공하다</td></tr><tr><td class=\"w\">raw material</td><td class=\"m\">원재료</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">technology</td><td class=\"m\">기술</td></tr><tr><td class=\"w\">engineering</td><td class=\"m\">공학</td></tr><tr><td class=\"w\">solve</td><td class=\"m\">해결하다</td></tr><tr><td class=\"w\">problem</td><td class=\"m\">문제</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기초 과학 연구는</span><span class=\"en\"><b>Basic scientific research</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">원료를 제공한다</span><span class=\"en\"><b>provides the raw materials</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기술과 공학이 사용하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that technology and engineering use</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문제를 해결하기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to solve problems</span>.</b></span></div></div><div class=\"lec-sent-ko\">기초 과학 연구는 문제를 해결하기 위해서 기술과 공학이 활용하는 원료를 제공한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 과학 연구(기초)와 실용적 분야(기술·공학) 사이의 관계를 설명합니다. 여기서 raw materials는 사전적으로 &#39;가공되지 않은 원자재&#39;를 의미하지만, 여기서는 &#39;아직 실용화되지 않은 초기 과학 지식&#39;을 비유합니다. 필자는 과학적 발견이 기술 발전을 위한 기초가 된다는 점을 강조하기 위해 눈에 보이는 물질을 만드는 재료에 이 단어를 빗대어 표현했습니다. 앞 문장이 없는 첫 문장이므로, 전체 글의 주제인 &#39;기초 과학의 중요성&#39;을 제시하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that technology and engineering use (관계대명사): that은 raw materials를 선행사로 하는 목적격 관계대명사이며, 뒤에 이어지는 절(technology and engineering use)에서 use의 목적어 자리가 비어 있는 불완전한 구조이다.</div><div class=\"lec-gr-item\">to solve problems (to부정사): 목적을 나타내는 부사적 용법으로, 기술과 공학이 사용하는 목적(~하기 위해서)을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">basic</td><td class=\"m\">기초적인</td></tr><tr><td class=\"w\">scientific</td><td class=\"m\">과학의</td></tr><tr><td class=\"w\">research</td><td class=\"m\">연구</td></tr><tr><td class=\"w\">provide</td><td class=\"m\">제공하다</td></tr><tr><td class=\"w\">raw material</td><td class=\"m\">원재료</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">technology</td><td class=\"m\">기술</td></tr><tr><td class=\"w\">engineering</td><td class=\"m\">공학</td></tr><tr><td class=\"w\">solve</td><td class=\"m\">해결하다</td></tr><tr><td class=\"w\">problem</td><td class=\"m\">문제</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>기초 과학 연구는 당장의 실용성보다는 문제 해결을 위한 필수적인 지식의 토대를 마련한다.</li><li>기술과 공학은 이 기초 과학이라는 원재료를 바탕으로 실질적인 결과물을 만들어낸다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Basic scientific research functions as the primary resource, and it enables technology and engineering to solve practical problems effectively.</div>\n              <div class=\"lec-final-sum-ko\">기초 과학 연구는 주요 자원으로서의 기능을 하며, 이를 통해 기술과 공학이 실질적인 문제들을 효과적으로 해결할 수 있게 한다.</div></div></div>"],"segs":[[{"audio":"./sentence03_강의_audio/1.mp3","hl":null}],[{"audio":"./sentence03_강의_audio/2.mp3","hl":null}],[{"audio":"./sentence03_강의_audio/3.mp3","hl":null},{"audio":"./sentence
