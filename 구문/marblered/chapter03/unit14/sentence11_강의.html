\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 이해하기 위해서는 먼저 화학물질의 효율성과 위험성(Efficiency and Risk of Chemicals) 사이의 딜레마를 알 필요가 있습니다. 우리는 일상에서 샴푸, 플라스틱, 가전제품처럼 편리하고 보기 좋은 소비재를 누리지만, 이를 만드는 과정에서는 종종 유해 화학물질(Hazardous chemicals)이 발생하곤 하죠. 마치 맛있는 음식을 먹지만 건강을 걱정해야 하는 상황과 비슷하게, 현대 사회는 편리함을 대가로 환경 오염이나 인체 유해성이라는 잠재적 비용(Potential costs)을 치르고 있는 셈입니다. 이러한 맥락은 우리가 누리는 물질적 풍요 뒤에 숨겨진 환경적 책임(Environmental responsibility)에 대해 다시 한번 생각해보게 합니다. 따라서 이 글은 기술 발전이 가져다주는 눈앞의 이익과 그로 인해 발생하는 장기적인 부작용을 비판적인 시각으로 바라볼 것을 제안하고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01소비재의 유익함</div><ul><li>우리는 유해 화학물질을 통해 만들어진 매력적인 소비재를 사용하며 즉각적인 혜택을 누리고 있다.</li><li>화학물질 제조로 얻는 즉각적 편의 (immediate benefits)</li><li>매력적인 상품(attractive consumer goods)을 생산하고 유통함</li><li>핵심 키워드: 유해 화학물질(hazardous chemicals)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02생산과 소비의 관계</div><ul><li>현대 사회는 편리함을 위해 환경적 위험을 감수하는 생산 체계를 갖추고 있다.</li><li>상품 생산(producing)과 널리 퍼뜨리는 과정(disseminating)</li><li>소비자의 만족과 생산 활동의 밀접한 연관성</li><li>핵심 키워드: 생산 및 유통(producing and disseminating)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thoroughly</td><td class=\"m\">대단히, 완전히</td></tr><tr><td class=\"w\">immediate</td><td class=\"m\">즉각적인</td></tr><tr><td class=\"w\">benefit</td><td class=\"m\">혜택, 이익</td></tr><tr><td class=\"w\">attractive</td><td class=\"m\">매력적인</td></tr><tr><td class=\"w\">consumer goods</td><td class=\"m\">소비재</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">generate</td><td class=\"m\">발생시키다, 만들어내다</td></tr><tr><td class=\"w\">disseminate</td><td class=\"m\">유포하다, 퍼뜨리다</td></tr><tr><td class=\"w\">hazardous</td><td class=\"m\">위험한</td></tr><tr><td class=\"w\">chemical</td><td class=\"m\">화학 물질</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 충분히 누리고 있다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">are thoroughly enjoying</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목전의 혜택을</span><span class=\"en\"><b>the immediate benefits</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매력적인 소비재의</span><span class=\"en\"><b>of attractive <span class=\"grammar-hl\">consumer goods</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 만들어 내는</span><span class=\"en\"><b><span class=\"grammar-hl\">that we generate</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생산하는 것으로부터</span><span class=\"en\"><b>from <span class=\"grammar-hl\">producing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 퍼뜨리는 것으로부터 위험한 화학물질을</span><span class=\"en\"><b><span class=\"grammar-hl\">and disseminating</span> hazardous chemicals.</b></span></div></div><div class=\"lec-sent-ko\">우리는 위험한 화학물질을 생산하고 퍼뜨리는 것으로부터 우리가 만들어 내는 매력적인 소비재의 목전의 혜택을 잘 누리고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 인간이 위험한 화학 물질을 활용해 편리한 제품을 만드는 현실을 지적합니다. 여기서 thoroughly는 사전적으로 &#39;철저히&#39;라는 뜻이지만, 여기서는 우리가 그 이익을 아무런 거리낌 없이 완전히 빠져들어 누리고 있다는 비판적 어감을 강조하기 위해 쓰였습니다. 또한 disseminating은 &#39;퍼뜨리다, 보급하다&#39;라는 뜻인데, 단순히 나눠주는 것을 넘어 그 위험한 물질들이 우리 삶 도처에 널리 퍼져 있게 만들었다는 점을 강조하여, 그만큼 우리의 의존도가 높음을 시사합니다. 이 문장은 이 글의 주제인 &#39;화학 물질의 편리함과 그에 따른 위험성&#39;의 원인을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are thoroughly enjoying (현재진행): be동사(are) + 현재분사(enjoying) 구조로, 현재 지속되고 있는 동작을 나타냄</div><div class=\"lec-gr-item\">consumer goods (동명사(명사적)): &#39;소비하는 데 사용하는&#39;이라는 용도를 나타내는 동명사(consumer)가 명사(goods)를 수식함</div><div class=\"lec-gr-item\">that we generate (관계대명사): that이 목적격 관계대명사로 쓰여 선행사(consumer goods)를 수식하며, 절 내부에서 generate의 목적어 역할을 하므로 뒤에 빠진 자리가 존재함</div><div class=\"lec-gr-item\">producing and disseminating (동명사): 전치사(from)의 목적어 자리에 쓰인 명사적 기능의 동명사로, 병렬 구조로 연결되어 있음</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thoroughly</td><td class=\"m\">대단히, 완전히</td></tr><tr><td class=\"w\">immediate</td><td class=\"m\">즉각적인</td></tr><tr><td class=\"w\">benefit</td><td class=\"m\">혜택, 이익</td></tr><tr><td class=\"w\">attractive</td><td class=\"m\">매력적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consumer goods</td><td class=\"m\">소비재</td></tr><tr><td class=\"w\">generate</td><td class=\"m\">발생시키다, 만들어내다</td></tr><tr><td class=\"w\">hazardous</td><td class=\"m\">위험한</td></tr><tr><td class=\"w\">chemical</td><td class=\"m\">화학 물질</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우리는 위험한 화학 물질을 사용하여 만든 매력적인 상품들로부터 당장의 편리함과 혜택을 누리고 있다.</li><li>하지만 이러한 편리함 뒤에는 화학 물질의 생산과 유포라는 위험이 도사리고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">We enjoy the immediate benefits of modern consumer goods, yet their production involves the use of hazardous chemicals.</div>\n              <div class=\"lec-final-sum-ko\">우리는 현대 소비재의 즉각적인 혜택을 누리고 있지만, 그 생산 과정은 유해 화학 물질의 사용을 포함한다.</div></div></div>"],"segs":[[{"audio":"./sentence11_강의_audio/1.mp3","hl":null}],[{"audio":"./sentence11_강의_audio/2.mp3","hl":null}],[{"audio":"./sentence11_강의_audio/3.mp3","hl":null},{"audio":"./sentence11_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence11_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence11_강의_audio/6.mp3","hl":null}],[{"audio":"./sentence11_강의_audio/7.mp3","hl":"main"},{"audio":"./sentence11_강의_audio/8.mp3","hl":"meaning"},{"
