  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

lecturePlayer(document.getElementById("app"),{"brand":"unit14","title":"마법같은 블록구문 실전편 Unit 12 목적어를 수식하는 관계사절","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>목적어를 수식하는 관계사절 블록 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>목적어를 수식하는 형용사절을 찾아 직독직해로 읽는다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 마법같은 블록구문 실전편에서 목적어를 수식하는 형용사절을 공부합니다. 문장이 길어질 때 목적어 뒤에 who, which, that 같은 말이 붙으면 그 목적어를 꾸며 주는 블록이라는 것을 배우게 됩니다. 이 블록만 정확히 묶어 읽으면 해석이 훨씬 빨라져요. 그럼 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">목적어 뒤에 \u003cb class=\"key\">관계대명사\u003c/b> who, which, that이나 \u003cb class=\"key\">관계부사\u003c/b> when, where, why가 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 오면, 그 절은 앞의 \u003cb class=\"key\">목적어\u003c/b>를 수식한다. 해석은 목적어를 먼저 읽고 뒤에서 꾸며 주는 정보를 이어서 직독직해한다. \u003cb class=\"key\">전치사 + 관계대명사\u003c/b>나 관계사절이 겹친 \u003cb class=\"key\">이중 형용사절\u003c/b>도 같은 블록으로 처리한다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 We trust \u003cspan class=\"fx\">leaders who are real, who walk their talk, who act on their core values, and who tell us the truth\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 We are approaching \u003cspan class=\"fx\">the time when machines will be able to outperform humans at almost any task\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 Basic scientific research provides \u003cspan class=\"fx\">the raw materials that technology and engineering use to solve problems\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Personality psychologists had underestimated \u003cspan class=\"fx\">the extent to which the social situation shapes people's behavior\u003c/span>, independently of their personality.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 The word &quot;fable&quot; frequently denotes \u003cspan class=\"fx\">a brief tale where animals or inanimate objects speak and behave like humans, usually to advance a moral point\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 I fear not \u003cspan class=\"fx\">the man who has practiced 10,000 kicks once, but I fear the man who has practiced one kick 10,000 times\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 Our atmosphere supplies \u003cspan class=\"fx\">most of the oxygen which animals must have to survive\u003c/span>, as well as the carbon dioxide needed by plants.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Choose \u003cspan class=\"fx\">words that are more expressive, like 'great' or 'terrific' or 'wonderful'\u003c/span> if you want to express pleasure.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 We will eventually reach \u003cspan class=\"fx\">a point at which conflict with the finite nature of resources is inevitable\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 'Jack-of-all-trades' means \u003cspan class=\"fx\">those who claim to be proficient at countless tasks but cannot perform a single one of them well\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 We are thoroughly enjoying the immediate benefits of \u003cspan class=\"fx\">attractive consumer goods that we generate from producing and disseminating hazardous chemicals\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 School physical education programs should offer \u003cspan class=\"fx\">a balanced variety of activities that allow young people to develop ability in lifetime activities that are personally meaningful and enjoyable\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘의 핵심은 목적어 뒤에 who, which, that 같은 관계대명사나 when, where 같은 관계부사가 오면 그 뒤는 목적어를 꾸미는 형용사절이라는 것입니다. 영어는 뒤에서 앞을 꾸미는 말이 많아서, 목적어를 먼저 해석하고 이어서 그 목적어가 어떤 대상인지 설명을 덧붙이면 됩니다. 길어져도 블록을 묶어서 보면 문장이 훨씬 단순하게 정리됩니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 We trust \u003cspan class=\"fx\">leaders who are real, who walk their talk, who act on their core values, and who tell us the truth\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We trust\u003c/div>\u003cdiv class=\"k\">우리는 신뢰한다\u003c/div>\u003cdiv class=\"e\"> leaders\u003c/div>\u003cdiv class=\"k\">지도자들을\u003c/div>\u003cdiv class=\"e\"> who are real,\u003c/div>\u003cdiv class=\"k\">진실한\u003c/div>\u003cdiv class=\"e\"> who walk their talk,\u003c/div>\u003cdiv class=\"k\">자기 말을 실천하는\u003c/div>\u003cdiv class=\"e\"> who act on their core values,\u003c/div>\u003cdiv class=\"k\">핵심 가치에 따라 행동하는\u003c/div>\u003cdiv class=\"e\"> and who tell us the truth.\u003c/div>\u003cdiv class=\"k\">그리고 우리에게 진실을 말하는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">leaders\u003c/b>를 뒤에서 \u003cb class=\"key\">관계대명사 who\u003c/b>가 이끄는 네 개의 \u003cb class=\"key\">형용사절\u003c/b>이 병렬로 수식한다. who가 leaders를 받으며, 뒤에 각각 be동사와 동사들이 이어져 지도자의 속성을 설명한다.\u003c/div>","segs":[{"n":3,"text":"We trust, 우리는 신뢰한다. leaders, 지도자들을. who are real, 진실한. who walk their talk, 자기 말을 실천하는. who act on their core values, 핵심 가치에 따라 행동하는. and who tell us the truth, 그리고 우리에게 진실을 말하는","hl":"ch"},{"n":4,"text":"첫 번째 문장은 We trust 다음에 목적어 leaders가 나오고, 그 뒤에 who가 이끄는 절 네 개가 이어집니다. 이 who절들은 모두 leaders를 뒤에서 수식하는 형용사절입니다. 따라서 우리는 지도자들을 신뢰한다고 읽고, 어떤 지도자인지를 뒤에서 네 가지로 설명한다고 보면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 We trust \u003cspan class=\"fx\">leaders who are real, who walk their talk, who act on their core values, and who tell us the truth\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>여러 명의 다른 지도자를 말하는 것이 아니라, 진실하고 신뢰할 수 있는 한 부류의 지도자를 묶어서 표현한다. 리더에 대한 사람들의 기대를 구체적으로 나열한 문장이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">who walk their talk\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who practice what they preach\u003c/span>\u003cdiv class=\"w\">말한 바를 실천한다는 뜻의 관용적 표현을 같은 의미의 쉬운 관용어로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">who are real\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">who are genuine\u003c/span>\u003cdiv class=\"w\">real을 genuine으로 바꾸어 진실된 성품이라는 뜻을 더 분명하게 나타냈다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">walk their talk\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">practice what they preach\u003c/span>\u003cspan class=\"y-eq\">walk the talk = practice what one preaches\u003c/span>\u003cdiv class=\"w\">관용어를 같은 뜻의 관용어로 바꾸어 말한 것을 행동으로 옮긴다는 의미를 살렸다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">core values\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fundamental beliefs\u003c/span>\u003cspan class=\"y-eq\">core values = fundamental beliefs\u003c/span>\u003cdiv class=\"w\">core를 fundamental로 바꾸어 핵심적인 가치라는 뜻을 명확히 했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">tell us the truth\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be honest with us\u003c/span>\u003cspan class=\"y-eq\">tell the truth = be honest\u003c/span>\u003cdiv class=\"w\">진실을 말하다를 더 쉬운 표현으로 바꾸어 정직하다는 뜻을 나타냈다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We trust leaders who are genuine, do what they say, act according to their central principles, and are honest with us.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 그냥 여러 명을 나열한 게 아니라 진실하고 행동이 말과 같은 지도자, 즉 신뢰할 만한 한 부류를 말합니다. 뒤에 나오는 정보가 길수록 지도자가 갖추어야 할 조건이 구체적으로 강조되는 느낌이에요. 우리말로는 진실하고 자기 말을 실천하는 지도자를 신뢰한다고 자연스럽게 앞에서 꾸며 주면 좋습니다.","hl":"mn"},{"n":6,"text":"walk their talk는 practice what they preach로 바꿔 쓸 수 있어요. 두 표현 모두 말한 것을 실천한다는 뜻이에요. core values도 fundamental beliefs로 바꾸면 핵심 가치라는 의미가 그대로 살아 있습니다.","hl":"rw"},{"n":7,"text":"walk the talk는 practice what one preaches와 짝으로 외워 두세요. core values는 fundamental beliefs로 바꿀 수 있고, tell us the truth는 be honest with us로 풀어 쓸 수 있습니다. 모두 사람이나 지도자의 신뢰와 관련된 중요한 표현입니다.","hl":"ph"},{"n":8,"text":"전체를 다시 써 보면 We trust leaders who are genuine, do what they say, act according to their central principles, and are honest with us입니다. 원문의 네 가지 특성을 같은 뜻의 다른 표현으로 정리한 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 We are approaching \u003cspan class=\"fx\">the time when machines will be able to outperform humans at almost any task\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We are approaching\u003c/div>\u003cdiv class=\"k\">우리는 다가가고 있다\u003c/div>\u003cdiv class=\"e\"> the time\u003c/div>\u003cdiv class=\"k\">그 시기에\u003c/div>\u003cdiv class=\"e\"> when machines will be able to outperform humans\u003c/div>\u003cdiv class=\"k\">기계가 인간을 능가할 수 있을\u003c/div>\u003cdiv class=\"e\"> at almost any task.\u003c/div>\u003cdiv class=\"k\">거의 모든 일에서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">the time\u003c/b>을 \u003cb class=\"key\">관계부사 when\u003c/b>이 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 수식한다. when 이하가 '기계가 인간을 능가할 수 있는'이라는 시기의 내용을 설명한다.\u003c/div>","segs":[{"n":9,"text":"We are approaching, 우리는 다가가고 있다. the time, 그 시기에. when machines will be able to outperform humans, 기계가 인간을 능가할 수 있을. at almost any task, 거의 모든 일에서","hl":"ch"},{"n":10,"text":"두 번째 문장은 We are approaching 다음에 목적어 the time이 옵니다. 뒤에 when이 이끄는 절이 the time을 수식합니다. 그래서 우리가 그 시기에 다가가고 있다고 읽고, 어떤 시기인지를 뒤에서 기계가 인간을 능가할 수 있는 때라고 설명합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 We are approaching \u003cspan class=\"fx\">the time when machines will be able to outperform humans at almost any task\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>기계가 인간보다 못하는 일이 거의 없는 시대가 곧 온다는 뜻이다. 거의 모든 일에서라는 말이 성능의 범위를 넓게 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are approaching\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are getting closer to\u003c/span>\u003cdiv class=\"w\">approach를 더 쉬운 동사구로 바꿔 다가가고 있다는 뜻을 분명히 했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">outperform humans\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">do better than humans\u003c/span>\u003cdiv class=\"w\">outperform을 모르는 경우 동사구로 풀어 쓸 수 있게 했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">approach\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">get closer to\u003c/span>\u003cspan class=\"y-eq\">approach = get closer to\u003c/span>\u003cdiv class=\"w\">approach를 동사구로 바꿔 다가간다는 의미를 살렸다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">outperform\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">beat, do better than\u003c/span>\u003cspan class=\"y-eq\">outperform = do better than\u003c/span>\u003cdiv class=\"w\">outperform을 더 쉬운 표현으로 바꾸어 능가하다는 뜻을 나타냈다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">task\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">job\u003c/span>\u003cspan class=\"y-eq\">task = job\u003c/span>\u003cdiv class=\"w\">비교적 쉬운 동의어로 바꿔 업무라는 뜻을 나타냈다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We are getting closer to the time when machines can do better than humans at almost every task.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 기계의 능력이 인간을 거의 모든 일에서 앞지를 날이 가까워지고 있다는 뜻입니다. almost any task라는 표현 때문에 아주 넓은 범위에서의 변화를 강조해요. 앞으로 닥칠 시대 변화를 말하는 문장으로 기억하면 됩니다.","hl":"mn"},{"n":12,"text":"are approaching은 are getting closer to로 바꿔 쓸 수 있어요. outperform humans는 do better than humans로 풀어 쓰면 훨씬 쉽습니다. 이렇게 바꿔도 문장의 뜻은 거의 같습니다.","hl":"rw"},{"n":13,"text":"approach는 get closer to와 짝으로 외우세요. outperform은 beat나 do better than으로 바꾸면 능가하다라는 뜻이 됩니다. task는 job이라는 쉬운 단어로 바꿀 수 있어요.","hl":"ph"},{"n":14,"text":"정리하면 We are getting closer to the time when machines can do better than humans at almost every task가 됩니다. 원문의 approach와 outperform을 쉬운 표현으로 바꾼 문장이죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 Basic scientific research provides \u003cspan class=\"fx\">the raw materials that technology and engineering use to solve problems\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Basic scientific research provides\u003c/div>\u003cdiv class=\"k\">기초 과학 연구는 제공한다\u003c/div>\u003cdiv class=\"e\"> the raw materials\u003c/div>\u003cdiv class=\"k\">원료를\u003c/div>\u003cdiv class=\"e\"> that technology and engineering use\u003c/div>\u003cdiv class=\"k\">기술과 공학이 사용하는\u003c/div>\u003cdiv class=\"e\"> to solve problems.\u003c/div>\u003cdiv class=\"k\">문제를 해결하기 위해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">the raw materials\u003c/b>를 \u003cb class=\"key\">관계대명사 that\u003c/b>이 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 수식한다. that은 raw materials를 받으며, 뒤에 use의 목적어 자리가 비어 있다.\u003c/div>","segs":[{"n":15,"text":"Basic scientific research provides, 기초 과학 연구는 제공한다. the raw materials, 원료를. that technology and engineering use, 기술과 공학이 사용하는. to solve problems, 문제를 해결하기 위해","hl":"ch"},{"n":16,"text":"세 번째 문장은 Basic scientific research provides 다음에 목적어 the raw materials가 옵니다. that 이하가 the raw materials를 뒤에서 수식하는 형용사절이에요. 이때 that은 목적격 관계대명사로, 뒤에 오는 use의 목적어 자리에 raw materials가 들어간다고 이해하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 Basic scientific research provides \u003cspan class=\"fx\">the raw materials that technology and engineering use to solve problems\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>기초 과학 연구는 그 자체로 끝나는 것이 아니라, 기술과 공학이 문제를 해결하는 데 쓰는 바탕 재료를 만든다는 뜻이다. 기초 연구의 실용적 가치를 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">provides\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">supplies\u003c/span>\u003cdiv class=\"w\">제공하다는 뜻의 동의어로 바꾸어 의미를 유지했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Basic scientific research\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Fundamental scientific study\u003c/span>\u003cdiv class=\"w\">기초 과학 연구라는 뜻을 같은 의미의 다른 어휘로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">raw materials\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">basic resources\u003c/span>\u003cspan class=\"y-eq\">raw materials = basic resources\u003c/span>\u003cdiv class=\"w\">raw를 basic으로 바꾸어 원료라는 뜻을 쉽게 풀었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">provides\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">supplies\u003c/span>\u003cspan class=\"y-eq\">provide = supply\u003c/span>\u003cdiv class=\"w\">제공하다는 뜻의 유의어로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to solve problems\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in order to solve problems\u003c/span>\u003cspan class=\"y-eq\">to solve = in order to solve\u003c/span>\u003cdiv class=\"w\">목적을 나타내는 to부정사를 in order to로 바꾸어 의미를 분명히 했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Fundamental scientific research supplies the basic materials that applied science uses to solve problems.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 기초 과학 연구가 마냥 이론적인 것이 아니라, 기술과 공학이 문제를 해결할 때 재료로 쓰는 중요한 바탕을 제공한다는 뜻이에요. to solve problems가 목적을 나타내며 기초 연구가 실생활 문제 해결에 기여한다는 점을 강조합니다.","hl":"mn"},{"n":18,"text":"provides는 supplies로 바꿔 쓸 수 있습니다. Basic scientific research는 Fundamental scientific study로 바꾸면 기초 과학 연구라는 뜻이 그대로 전달돼요. raw materials는 basic materials로 풀어서 말할 수 있습니다.","hl":"rw"},{"n":19,"text":"raw는 basic으로, materials는 resources 정도로 바꿔 보세요. provides는 supplies와 짝입니다. to solve problems는 in order to solve problems로 바꾸면 목적의 의미가 더 분명해집니다.","hl":"ph"},{"n":20,"text":"이 문장을 다시 쓰면 Fundamental scientific research supplies the basic materials that applied science uses to solve problems입니다. 기초 과학이 문제 해결의 재료를 제공한다는 원문의 뜻을 쉬운 어휘로 유지한 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 Personality psychologists had underestimated \u003cspan class=\"fx\">the extent to which the social situation shapes people's behavior\u003c/span>, independently of their personality.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Personality psychologists had underestimated\u003c/div>\u003cdiv class=\"k\">성격 심리학자들은 과소평가했다\u003c/div>\u003cdiv class=\"e\"> the extent\u003c/div>\u003cdiv class=\"k\">그 정도를\u003c/div>\u003cdiv class=\"e\"> to which the social situation shapes people's behavior,\u003c/div>\u003cdiv class=\"k\">사회적 상황이 사람들의 행동을 형성하는\u003c/div>\u003cdiv class=\"e\"> independently of their personality.\u003c/div>\u003cdiv class=\"k\">그들의 성격과는 독립적으로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">the extent\u003c/b>를 \u003cb class=\"key\">전치사 + 관계대명사\u003c/b>인 \u003cb class=\"key\">to which\u003c/b>가 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 수식한다. to which는 the extent를 받아 '그 정도만큼'이라는 의미를 만든다.\u003c/div>","segs":[{"n":21,"text":"Personality psychologists had underestimated, 성격 심리학자들은 과소평가했다. the extent, 그 정도를. to which the social situation shapes people's behavior, 사회적 상황이 사람들의 행동을 형성하는. independently of their personality, 그들의 성격과는 독립적으로","hl":"ch"},{"n":22,"text":"네 번째 문장은 목적어 the extent 뒤에 to which가 나옵니다. to which는 전치사 to와 관계대명사 which가 합쳐진 형태로, 앞의 the extent를 받아서 뒤 절을 형용사절로 연결합니다. 그래서 무엇을 과소평가했는지, 그 정도를 뒤에서 꾸며 준다고 보면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 Personality psychologists had underestimated \u003cspan class=\"fx\">the extent to which the social situation shapes people's behavior\u003c/span>, independently of their personality.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>성격 심리학자들이 사회적 상황이 행동을 좌우하는 힘을 실제보다 낮게 봤다는 뜻이다. 개인의 성격과 별개로 상황이 행동에 미치는 영향을 강조한 문장이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">had underestimated\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">had underrated\u003c/span>\u003cdiv class=\"w\">과소평가했다는 같은 뜻의 동사로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">shapes people's behavior\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">influences how people act\u003c/span>\u003cdiv class=\"w\">행동을 형성한다는 말을 쉽게 풀어 썼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">underestimate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">underrate\u003c/span>\u003cspan class=\"y-eq\">underestimate = underrate\u003c/span>\u003cdiv class=\"w\">과소평가하다의 유의어로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">extent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">degree\u003c/span>\u003cspan class=\"y-eq\">extent = degree\u003c/span>\u003cdiv class=\"w\">정도라는 뜻을 흔한 단어 degree로 풀었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">independently of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">regardless of\u003c/span>\u003cspan class=\"y-eq\">independently of = regardless of\u003c/span>\u003cdiv class=\"w\">~와 관계없이, ~와 별개로라는 뜻의 표현을 유의어로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Personality psychologists had underrated how much social situations influence people's behavior, regardless of their personality.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 성격 심리학자들이 사람의 성격보다 사회적 상황이 행동을 훨씬 많이 바꾼다는 사실을 제대로 보지 못했다는 뜻이에요. 쉬운 말로 하면 사람은 성격만으로 움직이지 않고 상황이 중요하다는 것입니다. independently of their personality는 성격과 별개로 상황이 작용한다는 점을 강조합니다.","hl":"mn"},{"n":24,"text":"had underestimated는 had underrated로 바꿔도 과소평가했다는 뜻이에요. shapes people's behavior는 influences how people act로 풀어 쓰면 더 쉬워집니다. the extent는 the degree로 바꿀 수 있어요.","hl":"rw"},{"n":25,"text":"underestimate는 underrate와 짝으로 외우세요. extent는 degree로, independently of는 regardless of로 바꿔 보세요. 이 단어들은 원인과 영향의 정도를 말할 때 자주 나옵니다.","hl":"ph"},{"n":26,"text":"전체를 다시 쓰면 Personality psychologists had underrated how much social situations influence people's behavior, regardless of their personality입니다. 원문의 the extent to which를 how much로 줄여서 자연스럽게 표현했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 The word &quot;fable&quot; frequently denotes \u003cspan class=\"fx\">a brief tale where animals or inanimate objects speak and behave like humans, usually to advance a moral point\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The word &quot;fable&quot; frequently denotes\u003c/div>\u003cdiv class=\"k\">단어 fable은 자주 뜻한다\u003c/div>\u003cdiv class=\"e\"> a brief tale\u003c/div>\u003cdiv class=\"k\">짧은 이야기를\u003c/div>\u003cdiv class=\"e\"> where animals or inanimate objects speak and behave like humans,\u003c/div>\u003cdiv class=\"k\">동물이나 무생물이 사람처럼 말하고 행동하는\u003c/div>\u003cdiv class=\"e\"> usually to advance a moral point.\u003c/div>\u003cdiv class=\"k\">보통 교훈적인 요점을 제시하기 위해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">a brief tale\u003c/b>을 \u003cb class=\"key\">관계부사 where\u003c/b>가 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 수식한다. where는 tale을 받아 '그 이야기 속에서'라는 장소·배경의 의미를 덧붙인다.\u003c/div>","segs":[{"n":27,"text":"The word \"fable\" frequently denotes, 단어 fable은 자주 뜻한다. a brief tale, 짧은 이야기를. where animals or inanimate objects speak and behave like humans, 동물이나 무생물이 사람처럼 말하고 행동하는. usually to advance a moral point, 보통 교훈적인 요점을 제시하기 위해","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 목적어 a brief tale 뒤에 관계부사 where가 옵니다. where 이하가 a brief tale을 수식하는 형용사절입니다. 우화가 어떤 이야기인지, 그 속에서 동물이나 무생물이 사람처럼 말하고 행동한다는 정보를 덧붙여 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 The word &quot;fable&quot; frequently denotes \u003cspan class=\"fx\">a brief tale where animals or inanimate objects speak and behave like humans, usually to advance a moral point\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>fable이라는 단어는 단순한 짧은 이야기가 아니라 동물이나 사물이 사람처럼 행동하면서 교훈을 주는 이야기라는 뜻이다. 특히 우화의 핵심인 교훈적 성격을 분명히 한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">denotes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">means, refers to\u003c/span>\u003cdiv class=\"w\">단어가 뜻하다는 의미를 쉬운 표현으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">advance a moral point\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make a moral point\u003c/span>\u003cdiv class=\"w\">advance를 make로 바꾸어 교훈을 제시한다는 뜻을 쉽게 나타냈다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">denote\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">mean, refer to\u003c/span>\u003cspan class=\"y-eq\">denote = mean\u003c/span>\u003cdiv class=\"w\">뜻하다, 나타내다를 쉬운 동사로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">brief tale\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">short story\u003c/span>\u003cspan class=\"y-eq\">brief tale = short story\u003c/span>\u003cdiv class=\"w\">짧은 이야기라는 뜻을 일상 어휘로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">advance a moral point\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make a moral lesson\u003c/span>\u003cspan class=\"y-eq\">advance a moral point = make a moral point\u003c/span>\u003cdiv class=\"w\">교훈적 요점을 제시하다는 뜻을 쉽게 풀었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The word fable usually means a short story in which animals or objects talk and act like people in order to teach a moral lesson.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 fable이라는 단어가 그냥 짧은 이야기가 아니라 교훈을 주기 위해 동물이나 사물을 사람처럼 등장시키는 이야기를 뜻한다고 설명합니다. usually to advance a moral point에서 교훈이라는 우화의 목적이 강조돼요. 우리말로는 우화는 동물이나 사물이 사람처럼 말하고 행동하는 짧은 이야기라고 자연스럽게 정리하면 됩니다.","hl":"mn"},{"n":30,"text":"denotes는 means나 refers to로 바꿔 쓸 수 있어요. a brief tale은 a short story로, advance a moral point는 make a moral point로 바꾸면 뜻이 훨씬 쉬워집니다.","hl":"rw"},{"n":31,"text":"denote는 mean과 refer to로 외우세요. brief tale은 short story로, inanimate objects는 lifeless things로 바꿔 볼 수 있어요. advance a moral point는 make a moral lesson이라고 해도 교훈을 제시한다는 뜻이 됩니다.","hl":"ph"},{"n":32,"text":"전체를 정리하면 The word fable usually means a short story in which animals or objects talk and act like people in order to teach a moral lesson입니다. 관계부사 where를 in which로 바꾸고 어휘를 쉬운 말로 바꾼 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 I fear not \u003cspan class=\"fx\">the man who has practiced 10,000 kicks once, but I fear the man who has practiced one kick 10,000 times\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I fear not\u003c/div>\u003cdiv class=\"k\">나는 두려워하지 않는다\u003c/div>\u003cdiv class=\"e\"> the man\u003c/div>\u003cdiv class=\"k\">그 사람을\u003c/div>\u003cdiv class=\"e\"> who has practiced 10,000 kicks once,\u003c/div>\u003cdiv class=\"k\">10,000번의 킥을 한 번씩 연습한\u003c/div>\u003cdiv class=\"e\"> but I fear\u003c/div>\u003cdiv class=\"k\">그러나 나는 두려워한다\u003c/div>\u003cdiv class=\"e\"> the man\u003c/div>\u003cdiv class=\"k\">그 사람을\u003c/div>\u003cdiv class=\"e\"> who has practiced one kick 10,000 times.\u003c/div>\u003cdiv class=\"k\">하나의 킥을 10,000번 연습한\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">the man\u003c/b>을 각각 \u003cb class=\"key\">관계대명사 who\u003c/b>가 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 수식한다. who가 사람 목적어를 받아 어떤 사람인지 구체적으로 한정하며, 앞뒤 두 개의 man을 대비시킨다.\u003c/div>","segs":[{"n":33,"text":"I fear not, 나는 두려워하지 않는다. the man, 그 사람을. who has practiced 10,000 kicks once, 10,000번의 킥을 한 번씩 연습한. but I fear, 그러나 나는 두려워한다. the man, 그 사람을. who has practiced one kick 10,000 times, 하나의 킥을 10,000번 연습한","hl":"ch"},{"n":34,"text":"여섯 번째 문장은 두 개의 목적어가 나옵니다. 앞에서는 the man을, 뒤에서도 the man을 각각 who절이 꾸며 줍니다. 첫 번째 사람은 여러 킥을 한 번씩 연습한 사람이고, 두 번째 사람은 한 가지 킥을 수없이 반복한 사람입니다. who절이 사람을 한정해 주는 구조가 대비를 만듭니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 I fear not \u003cspan class=\"fx\">the man who has practiced 10,000 kicks once, but I fear the man who has practiced one kick 10,000 times\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>기술을 다양하게 조금씩 연습한 사람보다 한 가지 기술을 깊이 연습한 사람이 더 무섭다는 뜻이다. 이소룡의 말로, 꾸준한 반복과 깊이의 중요성을 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">has practiced 10,000 kicks once\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has practiced many different kicks a single time\u003c/span>\u003cdiv class=\"w\">숫자를 완화해 뜻을 더 쉽게 풀었다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">has practiced one kick 10,000 times\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has repeated a single kick ten thousand times\u003c/span>\u003cdiv class=\"w\">한 가지 기술을 무수히 반복했다는 의미를 살렸다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">I fear not\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">I do not fear\u003c/span>\u003cspan class=\"y-eq\">fear not = do not fear\u003c/span>\u003cdiv class=\"w\">옛스러운 어순을 현대적인 부정 형태로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">has practiced\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has trained\u003c/span>\u003cspan class=\"y-eq\">practice = train\u003c/span>\u003cdiv class=\"w\">연습하다라는 뜻의 유의어로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">once\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">one time\u003c/span>\u003cspan class=\"y-eq\">once = one time\u003c/span>\u003cdiv class=\"w\">한 번이라는 뜻을 더 쉬운 표현으로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I am not afraid of the man who has practiced ten thousand different kicks once, but I am afraid of the man who has practiced one kick ten thousand times.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 겉으로는 무섭지 않은지 묻는 것처럼 보이지만, 실제로는 다양한 것보다 한 가지를 깊게 연습한 사람이 더 강한 상대라는 뜻입니다. 이소룡의 유명한 말로, 반복 연습의 가치를 담고 있어요. who절로 두 사람을 대비시켜 마지막에 한 가지 킥을 만 번 연습한 사람이 더 강조됩니다.","hl":"mn"},{"n":36,"text":"I fear not은 I do not fear로 바꾸면 현대적인 표현이 됩니다. has practiced는 has trained로 바꿔도 자연스럽습니다. once는 one time으로 바꿔 쓸 수 있고, 만이라는 숫자를 말할 때는 ten thousand라고 읽으면 됩니다.","hl":"rw"},{"n":37,"text":"fear not은 do not fear로 외워 두세요. practice는 train과 짝이고, once는 one time으로 바꿀 수 있어요. 만약 시험에서 만이라는 숫자를 소리 내 읽어야 한다면 ten thousand라고 말하면 됩니다.","hl":"ph"},{"n":38,"text":"전체를 정리하면 I am not afraid of the man who has practiced ten thousand different kicks once, but I am afraid of the man who has practiced one kick ten thousand times입니다. 원문의 fear not을 do not fear로 바꾸고, 숫자 표현은 영어 단어로 풀어서 읽은 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 Our atmosphere supplies \u003cspan class=\"fx\">most of the oxygen which animals must have to survive\u003c/span>, as well as the carbon dioxide needed by plants.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Our atmosphere supplies\u003c/div>\u003cdiv class=\"k\">우리 대기는 공급한다\u003c/div>\u003cdiv class=\"e\"> most of the oxygen\u003c/div>\u003cdiv class=\"k\">대부분의 산소를\u003c/div>\u003cdiv class=\"e\"> which animals must have\u003c/div>\u003cdiv class=\"k\">동물들이 반드시 가져야 하는\u003c/div>\u003cdiv class=\"e\"> to survive,\u003c/div>\u003cdiv class=\"k\">생존하기 위해\u003c/div>\u003cdiv class=\"e\"> as well as the carbon dioxide\u003c/div>\u003cdiv class=\"k\">이산화탄소도\u003c/div>\u003cdiv class=\"e\"> needed by plants.\u003c/div>\u003cdiv class=\"k\">식물에게 필요한\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">most of the oxygen\u003c/b>을 \u003cb class=\"key\">관계대명사 which\u003c/b>가 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 수식한다. which는 oxygen을 받으며, 뒤에 must have의 목적어 자리가 비어 있는 목적격 관계대명사이다.\u003c/div>","segs":[{"n":39,"text":"Our atmosphere supplies, \"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 We will eventually reach \u003cspan class=\"fx\">a point at which conflict with the finite nature of resources is inevitable\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>한정된 자원 때문에 갈등이 일어날 수밖에 없는 순간에 결국 도달한다는 뜻이다. eventually와 inevitable이 겹쳐 피할 수 없는 미래의 위기를 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">eventually\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in the end\u003c/span>\u003cdiv class=\"w\">결국이라는 뜻의 부사를 더 쉬운 부사구로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is inevitable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cannot be avoided\u003c/span>\u003cdiv class=\"w\">불가피하다는 뜻을 부정과 avoid로 풀어 썼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">eventually\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">finally, in the end\u003c/span>\u003cspan class=\"y-eq\">eventually = in the end\u003c/span>\u003cdiv class=\"w\">결국, 마침내라는 뜻의 유의어로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">finite\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">limited\u003c/span>\u003cspan class=\"y-eq\">finite = limited\u003c/span>\u003cdiv class=\"w\">한정된, 유한한이라는 뜻을 쉬운 형용사로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">inevitable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">unavoidable\u003c/span>\u003cspan class=\"y-eq\">inevitable = unavoidable\u003c/span>\u003cdiv class=\"w\">불가피한이라는 뜻의 동의어로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We will eventually reach a point where conflict with the limited nature of resources cannot be avoided.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 자원이 유한하기 때문에 언젠가는 갈등을 피할 수 없다는 뜻이에요. eventually가 결국이라는 시간의 흐름을, inevitable이 불가피함을 이중으로 강조합니다. 자원의 유한한 성질 자체가 갈등의 원인이라는 논리로 읽으면 됩니다.","hl":"mn"},{"n":54,"text":"eventually는 in the end로 바꿔도 뜻이 같아요. finite는 limited로, inevitable은 unavoidable로 바꾸면 더 쉬워집니다. at which는 where로 바꾸어 a point where라고 쓸 수 있어요.","hl":"rw"},{"n":55,"text":"eventually는 finally나 in the end와 짝으로 외우세요. finite는 limited, inevitable은 unavoidable로 바꾸면 시험 지문에서 자주 보는 어휘가 정리됩니다. at which는 장소가 아닌 시점이나 지점에도 쓰인다는 점을 기억하세요.","hl":"ph"},{"n":56,"text":"이 문장을 다시 쓰면 We will eventually reach a point where conflict with the limited nature of resources cannot be avoided입니다. at which를 where로, finite를 limited로, inevitable을 cannot be avoided로 바꾼 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 'Jack-of-all-trades' means \u003cspan class=\"fx\">those who claim to be proficient at countless tasks but cannot perform a single one of them well\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">'Jack-of-all-trades' means\u003c/div>\u003cdiv class=\"k\">'Jack-of-all-trades'는 의미한다\u003c/div>\u003cdiv class=\"e\"> those\u003c/div>\u003cdiv class=\"k\">그런 사람들을\u003c/div>\u003cdiv class=\"e\"> who claim to be proficient at countless tasks\u003c/div>\u003cdiv class=\"k\">셀 수 없이 많은 일에 능숙하다고 주장하는\u003c/div>\u003cdiv class=\"e\"> but cannot perform a single one of them well.\u003c/div>\u003cdiv class=\"k\">그러나 그것들 중 하나도 제대로 수행하지 못하는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">those\u003c/b>를 \u003cb class=\"key\">관계대명사 who\u003c/b>가 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 수식한다. who절 안에 동사 claim과 cannot perform이 but으로 연결되어 그런 사람들의 속성을 병렬로 설명한다.\u003c/div>","segs":[{"n":57,"text":"'Jack-of-all-trades' means, 'Jack-of-all-trades'는 의미한다. those, 그런 사람들을. who claim to be proficient at countless tasks, 셀 수 없이 많은 일에 능숙하다고 주장하는. but cannot perform a single one of them well, 그러나 그것들 중 하나도 제대로 수행하지 못하는","hl":"ch"},{"n":58,"text":"열 번째 문장은 Jack-of-all-trades means 다음에 목적어 those가 옵니다. 이 those가 곧 사람들을 뜻하는데, who 이하가 그 사람들을 수식합니다. who절 안에서 claim to be proficient와 cannot perform이 but으로 연결되어 다재다능하다고 말하지만 실제로는 그렇지 못하다는 대조를 만듭니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 'Jack-of-all-trades' means \u003cspan class=\"fx\">those who claim to be proficient at countless tasks but cannot perform a single one of them well\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>팔방미인이라는 표현은 여러 가지를 잘한다고 말은 하지만 정작 하나도 제대로 못 하는 사람을 가리킨다. 겉으로는 다재다능해 보여도 실속이 없다는 부정적 뉘앙스를 담고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">claim to be proficient at\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">say they are skilled at\u003c/span>\u003cdiv class=\"w\">주장하다라는 뜻을 더 쉬운 동사 say로 바꾸고 proficient를 skilled로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cannot perform a single one of them well\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are not good at any of them\u003c/span>\u003cdiv class=\"w\">하나도 잘하지 못한다는 말을 더 간단히 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">jack-of-all-trades\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">all-rounder\u003c/span>\u003cspan class=\"y-eq\">jack-of-all-trades = all-rounder\u003c/span>\u003cdiv class=\"w\">팔방미인이라는 뜻을 가진 다른 표현으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">claim\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">assert\u003c/span>\u003cspan class=\"y-eq\">claim = assert\u003c/span>\u003cdiv class=\"w\">주장하다의 유의어로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">proficient\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">skilled, competent\u003c/span>\u003cspan class=\"y-eq\">proficient = skilled\u003c/span>\u003cdiv class=\"w\">능숙한이라는 뜻을 쉬운 형용사로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Jack-of-all-trades refers to people who say they are good at many things but actually cannot do any one of them well.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 팔방미인이라는 말이 그냥 다재다능한 사람을 뜻하는 것 같지만, 사실은 여러 가지를 잘한다고 주장할 뿐 정작 하나도 제대로 못 하는 사람을 가리킵니다. 약간 비꼬는 느낌이 있어요. countless tasks와 a single one이 극단적으로 대비되면서 부정적인 뜻이 살아납니다.","hl":"mn"},{"n":60,"text":"claim to be proficient at은 say they are skilled at으로 바꾸면 쉬워요. cannot perform a single one of them well은 are not good at any of them으로 바꿔도 뜻이 유지됩니다. those who는 people who로 바꿔 쓸 수 있어요.","hl":"rw"},{"n":61,"text":"jack-of-all-trades는 all-rounder로도 표현해요. claim은 assert와 짝이고, proficient는 skilled나 competent로 바꿀 수 있어요. countless는 numerous나 very many로 바꾸면 셀 수 없이 많다는 뜻이 됩니다.","hl":"ph"},{"n":62,"text":"전체를 다시 쓰면 Jack-of-all-trades refers to people who say they are good at many things but actually cannot do any one of them well입니다. 원문의 means를 refers to로, claim을 say로, proficient를 good at으로 바꾸어 이해하기 쉽게 정리했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 We are thoroughly enjoying the immediate benefits of \u003cspan class=\"fx\">attractive consumer goods that we generate from producing and disseminating hazardous chemicals\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We are thoroughly enjoying\u003c/div>\u003cdiv class=\"k\">우리는 철저히 누리고 있다\u003c/div>\u003cdiv class=\"e\"> the immediate benefits\u003c/div>\u003cdiv class=\"k\">즉각적인 혜택을\u003c/div>\u003cdiv class=\"e\"> of attractive consumer goods\u003c/div>\u003cdiv class=\"k\">매력적인 소비재의\u003c/div>\u003cdiv class=\"e\"> that we generate\u003c/div>\u003cdiv class=\"k\">우리가 만들어 내는\u003c/div>\u003cdiv class=\"e\"> from producing and disseminating hazardous chemicals.\u003c/div>\u003cdiv class=\"k\">위험한 화학 물질을 생산하고 퍼뜨림으로써\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">attractive consumer goods\u003c/b>를 \u003cb class=\"key\">관계대명사 that\u003c/b>이 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 수식한다. that은 goods를 받으며, 뒤에 we generate의 목적어 자리가 비어 있다. from 이하는 생성의 원천을 나타낸다.\u003c/div>","segs":[{"n":63,"text":"We are thoroughly enjoying, 우리는 철저히 누리고 있다. the immediate benefits, 즉각적인 혜택을. of attractive consumer goods, 매력적인 소비재의. that we generate, 우리가 만들어 내는. from producing and disseminating hazardous chemicals, 위험한 화학 물질을 생산하고 퍼뜨림으로써","hl":"ch"},{"n":64,"text":"열한 번째 문장은 We are thoroughly enjoying 다음에 목적어 the immediate benefits가 나옵니다. of attractive consumer goods가 어떤 혜택인지 덧붙이고, that 이하가 consumer goods를 수식합니다. that은 목적격 관계대명사로, generate의 목적어 자리에 consumer goods가 들어갑니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 We are thoroughly enjoying the immediate benefits of \u003cspan class=\"fx\">attractive consumer goods that we generate from producing and disseminating hazardous chemicals\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리는 위험한 화학 물질을 만들고 퍼뜨리면서 얻은 예쁜 소비재의 즉각적인 혜택을 누리고 있다는 뜻이다. 즐거움 뒤에 숨은 위험과 아이러니를 담고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">thoroughly enjoying\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">greatly enjoying\u003c/span>\u003cdiv class=\"w\">아주, 완전히라는 뜻의 부사를 쉬운 부사로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">producing and disseminating hazardous chemicals\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">making and spreading dangerous chemicals\u003c/span>\u003cdiv class=\"w\">어려운 단어들을 쉬운 동의어로 풀었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">thoroughly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">completely, greatly\u003c/span>\u003cspan class=\"y-eq\">thoroughly = completely\u003c/span>\u003cdiv class=\"w\">아주, 완전히라는 뜻의 유의어로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">immediate benefits\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">instant advantages\u003c/span>\u003cspan class=\"y-eq\">immediate benefits = instant advantages\u003c/span>\u003cdiv class=\"w\">즉각적인 혜택이라는 뜻을 비슷한 어구로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">hazardous\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">dangerous\u003c/span>\u003cspan class=\"y-eq\">hazardous = dangerous\u003c/span>\u003cdiv class=\"w\">위험한이라는 뜻을 쉬운 형용사로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We are greatly enjoying the instant benefits of attractive consumer products that we create by making and spreading dangerous chemicals.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 우리가 즐기는 소비재의 혜택이 사실은 위험한 화학 물질을 만들고 퍼뜨리는 과정에서 나온 것이라는 뜻이에요. 지금의 즐거움 뒤에 환경이나 건강에 대한 위험이 숨어 있다는 아이러니를 담고 있습니다. thoroughly enjoying이라는 표현으로 현재의 만족감을 강조하면서도 뒤의 위험한 원료가 대비됩니다.","hl":"mn"},{"n":66,"text":"thoroughly enjoying은 greatly enjoying으로 바꿀 수 있어요. attractive consumer goods는 desirable consumer products로, hazardous chemicals는 dangerous chemicals로 바꾸면 뜻이 쉬워집니다. generate는 create나 produce로 바꿔도 됩니다.","hl":"rw"},{"n":67,"text":"thoroughly는 completely나 greatly와 짝이에요. immediate benefits는 instant advantages로, hazardous는 dangerous로 외우세요. disseminate는 spread나 distribute로 바꾸면 퍼뜨리다는 뜻이 됩니다. consumer goods는 consumer products라고도 합니다.","hl":"ph"},{"n":68,"text":"전체를 다시 쓰면 We are greatly enjoying the instant benefits of attractive consumer products that we create by making and spreading dangerous chemicals입니다. 원문의 generate를 create로, producing과 disseminating을 making과 spreading으로 바꾸어 이해하기 쉽게 표현했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 School physical education programs should offer \u003cspan class=\"fx\">a balanced variety of activities that allow young people to develop ability in lifetime activities that are personally meaningful and enjoyable\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">School physical education programs should offer\u003c/div>\u003cdiv class=\"k\">학교 체육 프로그램은 제공해야 한다\u003c/div>\u003cdiv class=\"e\"> a balanced variety of activities\u003c/div>\u003cdiv class=\"k\">균형 잡힌 다양한 활동을\u003c/div>\u003cdiv class=\"e\"> that allow young people to develop ability\u003c/div>\u003cdiv class=\"k\">젊은이들이 능력을 계발하도록 해 주는\u003c/div>\u003cdiv class=\"e\"> in lifetime activities\u003c/div>\u003cdiv class=\"k\">평생 활동에서\u003c/div>\u003cdiv class=\"e\"> that are personally meaningful and enjoyable.\u003c/div>\u003cdiv class=\"k\">개인적으로 의미 있고 즐거운\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">a balanced variety of activities\u003c/b>를 \u003cb class=\"key\">관계대명사 that\u003c/b>이 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 수식하고, 그 절 안의 \u003cb class=\"key\">lifetime activities\u003c/b>를 다시 또 하나의 \u003cb class=\"key\">관계대명사 that\u003c/b>절이 수식한다. 이중으로 겹쳐진 \u003cb class=\"key\">형용사절\u003c/b> 구조이다.\u003c/div>","segs":[{"n":69,"text":"School physical education programs should offer, 학교 체육 프로그램은 제공해야 한다. a balanced variety of activities, 균형 잡힌 다양한 활동을. that allow young people to develop ability, 젊은이들이 능력을 계발하도록 해 주는. in lifetime activities, 평생 활동에서. that are personally meaningful and enjoyable, 개인적으로 의미 있고 즐거운","hl":"ch"},{"n":70,"text":"열두 번째 문장은 School physical education programs should offer 다음에 목적어 a balanced variety of activities가 나옵니다. 그 뒤에 that이 이끄는 절이 activities를 수식하고, 그 절 안에 lifetime activities가 다시 나옵니다. 뒤에 또 that이 나와서 lifetime activities를 수식합니다. 이렇게 관계대명사절이 두 겹으로 겹쳐 있으니, 첫 번째 that절을 읽고 그 안의 목적어를 또 꾸며 주는 두 번째 that절을 순서대로 묶어 읽어야 합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 School physical education programs should offer \u003cspan class=\"fx\">a balanced variety of activities that allow young people to develop ability in lifetime activities that are personally meaningful and enjoyable\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>학교 체육은 여러 활동을 그저 제공하는 데 그치지 않고, 학생들이 평생 즐기고 의미를 느낄 수 있는 활동 능력을 키우도록 해야 한다는 뜻이다. 활동의 균형과 개인의 의미를 함께 강조한다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a balanced variety of activities\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a well-balanced range of activities\u003c/span>\u003cdiv class=\"w\">다양하고 균형 잡힌 활동이라는 뜻을 비슷한 어구로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">personally meaningful and enjoyable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">meaningful and fun to each person\u003c/span>\u003cdiv class=\"w\">개인적으로 의미 있고 즐거운이라는 말을 더 쉬운 표현으로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">offer\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">provide\u003c/span>\u003cspan class=\"y-eq\">offer = provide\u003c/span>\u003cdiv class=\"w\">제공하다라는 뜻의 유의어로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">balanced variety\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">good mix\u003c/span>\u003cspan class=\"y-eq\">balanced variety = good mix\u003c/span>\u003cdiv class=\"w\">균형 잡힌 다양함을 쉬운 어구로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">lifetime activities\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lifelong activities\u003c/span>\u003cspan class=\"y-eq\">lifetime activities = lifelong activities\u003c/span>\u003cdiv class=\"w\">평생 하는 활동이라는 뜻에서 lifetime을 lifelong으로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Physical education programs at school should provide a good mix of activities that help young people build skills in lifelong activities that are personally meaningful and fun.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 학교 체육 프로그램이 균형 잡힌 여러 활동을 제공해야 하고, 그 활동은 학생들이 평생 할 수 있는 활동에서 능력을 키우도록 도와야 한다는 뜻이에요. 그리고 그 평생 활동은 개인적으로 의미 있고 즐거워야 한다는 조건이 붙습니다. 결국 체육 교육이 평생 건강하고 즐거운 생활을 위한 기반이 되어야 한다는 주장입니다.","hl":"mn"},{"n":72,"text":"a balanced variety of activities는 a good mix of activities로 바꾸면 쉬워요. allow young people to develop ability는 help young people build skills로 바꿔도 뜻이 자연스럽습니다. personally meaningful and enjoyable은 meaningful and fun to each person으로 풀어 쓸 수 있어요.","hl":"rw"},{"n":73,"text":"offer는 provide와 짝이고, balanced variety는 good mix로 바꿀 수 있어요. lifetime activities는 lifelong activities라고도 합니다. allow는 enable이나 help로 바꾸면 무언가를 가능하게 한다는 뜻이 유지됩니다.","hl":"ph"},{"n":74,"text":"전체를 다시 쓰면 Physical education programs at school should provide a good mix of activities that help young people build skills in lifelong activities that are personally meaningful and fun입니다. 겹쳐진 관계대명사절을 유지하면서 핵심 어휘를 쉬운 말로 바꾼 문장이에요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>오늘 배운 핵심은 \u003cb class=\"key\">목적어\u003c/b> 뒤에 \u003cb class=\"key\">관계대명사\u003c/b>나 \u003cb class=\"key\">관계부사\u003c/b>가 이끄는 \u003cb class=\"key\">형용사절\u003c/b>이 와서 그 목적어를 뒤에서 수식한다는 것입니다.\u003c/li>\u003cli>\u003cb class=\"key\">who, which, that\u003c/b>은 앞의 목적어를 받아 주고, \u003cb class=\"key\">when, where, why\u003c/b>는 시기, 장소, 이유를 덧붙입니다.\u003c/li>\u003cli>관계사절이 두 겹으로 나오거나 \u003cb class=\"key\">전치사 + 관계대명사\u003c/b>인 to which, at which가 오는 형태도 같은 블록으로 묶어 해석합니다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 목적어 뒤에 who, which, that 같은 관계대명사나 when, where 같은 관계부사가 와서 그 목적어를 수식하는 구조를 연습했어요. 이 블록을 만나면 목적어를 먼저 읽고 뒤에서 꾸며 주는 설명을 이어서 읽는 것이 핵심이에요. 전치사와 관계대명사가 붙은 to which나 at which, 그리고 관계대명사절이 두 겹으로 나오는 문장도 반복해서 소리 내 읽어 보세요. 오늘 수업은 여기까지입니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
