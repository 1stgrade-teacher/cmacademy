>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 명언은 무술가 이소룡(Bruce Lee)이 남긴 말로, 단순히 기술을 많이 아는 것보다 &#39;반복 훈련을 통한 숙달(Mastery through repetition)&#39;의 중요성을 강조합니다. 무언가를 배울 때 여러 가지를 겉핥기식으로 시도하는 것보다, 하나의 핵심 기술을 &#39;근육이 기억할 때까지 반복&#39;하는 것이 훨씬 강력한 힘을 발휘한다는 뜻이죠. 공부에 비유하자면, 문제집 열 권을 한 번씩 푸는 것보다 개념서 한 권을 완벽하게 이해할 때까지 여러 번 반복해서 읽는 것이 실력 향상에 더 큰 도움이 되는 것과 같은 원리입니다. 이처럼 &#39;의도적인 반복 연습(Deliberate practice)&#39;은 단순한 노력을 넘어, 어떤 분야에서 전문가가 되기 위해 반드시 필요한 핵심적인 학습 전략이라고 할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01비교 대상의 설정</div><ul><li>단순히 많은 기술을 한 번씩 해본 사람과 한 가지 기술을 반복한 사람을 대조한다.</li><li>10,000번의 발차기를 각각 한 번씩만 연습한 사람</li><li>단 한 가지의 발차기를 10,000번 반복 연습한 사람</li><li>핵심 키워드: 연습(practice), 발차기(kicks)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02두려움의 대상</div><ul><li>진정한 실력은 다양한 경험보다 깊이 있는 숙달에서 나온다.</li><li>한 번씩만 연습한 사람은 두려움의 대상이 아님</li><li>한 가지를 반복 숙달한 사람이 더 위협적임</li><li>핵심 키워드: 두려움(fear), 숙달(mastery)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03교훈</div><ul><li>무언가를 완벽하게 익히기 위해서는 꾸준한 반복이 필수적이다.</li><li>양보다 질적인 훈련의 중요성 강조</li><li>반복(repetition)을 통해 얻는 기술의 완성도</li><li>핵심 키워드: 반복(repetition), 완성(perfection)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fear</td><td class=\"m\">두려워하다</td></tr><tr><td class=\"w\">practice</td><td class=\"m\">연습하다</td></tr><tr><td class=\"w\">kick</td><td class=\"m\">발차기</td></tr><tr><td class=\"w\">once</td><td class=\"m\">한 번</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 두려워하지 않는데</span><span class=\"en\"><b>I fear</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람을</span><span class=\"en\"><b>not <span class=\"grammar-hl\">the man</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 번에 1만 번의 발차기를 연습한</span><span class=\"en\"><b><span class=\"grammar-hl\">who has practiced 10,000 kicks once</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 나는 두려워한다</span><span class=\"en\"><b>but I fear</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람을</span><span class=\"en\"><b><span class=\"grammar-hl\">the man</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 발차기를 1만 번 연습한</span><span class=\"en\"><b><span class=\"grammar-hl\">who has practiced one kick 10,000 times</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 한 번에 1만 번의 발차기를 연습한 사람을 두려워하지 않지만, 나는 하나의 발차기를 1만 번 연습한 사람을 두려워한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 겉핥기식의 얕은 지식이나 경험보다, 한 분야를 깊게 파고든 숙련된 실력이 훨씬 더 강력한 힘을 가진다는 것을 강조합니다. 여기서 fear는 사전적으로는 &#39;두려워하다&#39;이지만, 여기서는 단순히 무섭다는 감정을 넘어 &#39;상대하기 어렵다&#39; 혹은 &#39;그 실력을 존중할 수밖에 없다&#39;는 뜻으로 쓰였습니다. 필자는 실력의 압도적인 차이를 표현하기 위해 &#39;두려움&#39;이라는 단어를 선택하여, 반복을 통해 얻은 전문성이 얼마나 치명적인 무기가 될 수 있는지를 극적으로 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the man who has practiced 10,000 kicks once (관계대명사): who는 주격 관계대명사로, 선행사 &#39;the man&#39;을 수식하는 절을 이끈다. 절 내부에서 who가 주어 역할을 하며, 뒤에 동사 &#39;has practiced&#39;가 바로 이어지는 구조이다.</div><div class=\"lec-gr-item\">the man who has practiced one kick 10,000 times (관계대명사): who는 주격 관계대명사로, 선행사 &#39;the man&#39;을 수식하는 절을 이끈다. who 뒤에 주격 관계대명사로서 동사 &#39;has practiced&#39;가 바로 이어지는 절의 구조를 가진다.</div><div class=\"lec-gr-item\">not ... but ... (관용표현): A가 아니라 B라는 의미를 나타내는 상관접속사 구조이다. 본 문장에서는 &#39;I fear&#39;라는 동일한 구조를 반복하여 대조되는 대상(the man...)을 강조하고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fear</td><td class=\"m\">두려워하다</td></tr><tr><td class=\"w\">practice</td><td class=\"m\">연습하다</td></tr><tr><td class=\"w\">kick</td><td class=\"m\">발차기</td></tr><tr><td class=\"w\">once</td><td class=\"m\">한 번</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>이것저것 조금씩 다 해보는 넓기만 한 경험은 큰 힘을 발휘하기 어렵다.</li><li>반면, 한 가지를 끝까지 반복하여 완전히 자기 것으로 만든 사람은 누구도 이기기 힘들다.</li><li>깊이 있는 숙련도가 단순히 다양한 경험보다 훨씬 더 강한 경쟁력을 갖는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Superficial experience in many areas is less valuable than deep expertise, because mastering one skill through constant repetition creates true strength.</div>\n              <div class=\"lec-final-sum-ko\">한 가지 기술을 끊임없는 반복으로 완전히 익히는 것이 진정한 강함을 만들어주기 때문에, 여러 분야에서의 얕은 경험보다 깊은 전문성이 더 가치 있다.</div></div></div>"],"segs":[[{"audio":"./sentence06_강의_audio/1.mp3","hl":null}],[{"audio":"./sentence06_강의_audio/2.mp3","hl":null}],[{"audio":"./sentence06_강의_audio/3.mp3","hl":null},{"audio":"./sentence06_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence06_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence06_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence06_강의_audio/7.mp3","hl":null}],[{"audio":"./sentence06_강의_audio/8.mp3","hl":"main"},{"audio":"./sentence06_강의_audio/9.mp3","hl":"meaning"},{"audio":"./sentence06_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence06_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("
