le\">Understanding Fables: Stories That Teach Lessons<small>우화의 이해: 교훈을 주는 이야기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 &#39;우화(Fable)&#39;라는 장르에 대해 들어본 적 있나요? 우화는 동물이나 사물이 사람처럼 말하고 행동하는 짧은 이야기를 통해 교훈(Moral point)을 전달하는 아주 오래된 문학 형식이에요. 대표적으로 우리가 잘 아는 &#39;토끼와 거북이&#39;처럼, 주인공들이 특정한 상황을 겪으며 우리가 살아가면서 꼭 기억해야 할 삶의 지혜나 도덕적 가치를 자연스럽게 깨닫게 해주죠. 이런 이야기는 단순히 재미만을 위한 것이 아니라, 복잡한 세상의 이치를 비유(Metaphor)를 통해 아주 쉽고 강렬하게 전달한다는 특징이 있어요. 그래서 옛날부터 사람들은 우화를 통해 세상을 배우고 올바른 가치관을 형성해 왔답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01우화의 정의</div><ul><li>우화는 동식물이나 사물이 의인화되어 등장하는 짧은 이야기 형식을 의미한다.</li><li>핵심 개념: 우화(fable)</li><li>동식물이나 사물이 인간처럼 행동(behave like humans)함</li><li>짧은 이야기(brief tale)라는 형식적 특징</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02우화의 핵심 목적</div><ul><li>우화는 이야기를 통해 전달하고자 하는 특정한 도덕적 교훈을 담고 있다.</li><li>이야기 전개 이유: 도덕적 가치 전달(advance a moral point)</li><li>교훈을 얻기 위한 수단으로 활용</li><li>핵심 키워드: 교훈(moral point)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fable</td><td class=\"m\">우화</td></tr><tr><td class=\"w\">frequently</td><td class=\"m\">흔히, 자주</td></tr><tr><td class=\"w\">denote</td><td class=\"m\">의미하다, 나타내다</td></tr><tr><td class=\"w\">brief</td><td class=\"m\">짧은</td></tr><tr><td class=\"w\">tale</td><td class=\"m\">이야기</td></tr><tr><td class=\"w\">inanimate</td><td class=\"m\">무생물의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">object</td><td class=\"m\">물건, 사물</td></tr><tr><td class=\"w\">behave</td><td class=\"m\">행동하다</td></tr><tr><td class=\"w\">advance</td><td class=\"m\">제시하다, 내세우다 (목적을 위해)</td></tr><tr><td class=\"w\">moral</td><td class=\"m\">도덕적인, 교훈적인</td></tr><tr><td class=\"w\">point</td><td class=\"m\">요점, 목적</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">‘우화’라는 단어는</span><span class=\"en\"><b>The word “fable”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빈번하게 뜻한다</span><span class=\"en\"><b>frequently denotes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">짧은 이야기를</span><span class=\"en\"><b>a brief tale</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거기에서 동물 또는 무생물이</span><span class=\"en\"><b><span class=\"grammar-hl\">where</span> animals or inanimate objects</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말을 하고 행동하는</span><span class=\"en\"><b>speak and behave</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람처럼,</span><span class=\"en\"><b>like humans,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대개 제시하기 위해서</span><span class=\"en\"><b>usually <span class=\"grammar-hl\">to advance</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교훈적인 의미를</span><span class=\"en\"><b>a moral point.</b></span></div></div><div class=\"lec-sent-ko\">‘우화’라는 단어는 대개 어떤 교훈적인 의미를 제시하기 위해서 빈번하게 동물 또는 무생물이 사람처럼 말을 하고 행동하는 짧은 이야기를 뜻한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 주제인 &#39;우화(fable)&#39;의 정의를 내리고 있습니다. 여기서 denotes는 사전적으로 &#39;나타내다, 의미하다&#39;인데, 여기서는 어떤 단어가 고정적으로 지칭하는 대상을 설명하고 있습니다. 필자는 단순히 &#39;is&#39;라고 하지 않고 이 단어를 선택함으로써, &#39;우화&#39;라는 용어가 가진 명확한 정의를 학술적이고 정확하게 전달하려는 의도를 보입니다. advance는 &#39;전진하다, 앞서다&#39;라는 뜻이지만, 여기서는 의견이나 목적을 &#39;제시하다, 내세우다&#39;라는 의미로 쓰였습니다. 교훈을 이야기의 끝으로 나아가게 한다는 비유적 표현을 통해, 우화의 존재 이유가 단순한 재미가 아닌 가르침을 주는 데 있음을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">where (관계부사): 장소(a brief tale)를 선행사로 받아 뒤에 완전한 문장(animals or inanimate objects speak and behave like humans)이 이어지는 구조입니다.</div><div class=\"lec-gr-item\">to advance (to부정사): 부사적 용법(목적)으로, 앞의 전체 내용이 어떤 의도(~하기 위해서)로 행해지는지를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fable</td><td class=\"m\">우화</td></tr><tr><td class=\"w\">frequently</td><td class=\"m\">흔히, 자주</td></tr><tr><td class=\"w\">denote</td><td class=\"m\">의미하다, 나타내다</td></tr><tr><td class=\"w\">brief</td><td class=\"m\">짧은</td></tr><tr><td class=\"w\">tale</td><td class=\"m\">이야기</td></tr><tr><td class=\"w\">inanimate</td><td class=\"m\">무생물의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">object</td><td class=\"m\">물건, 사물</td></tr><tr><td class=\"w\">behave</td><td class=\"m\">행동하다</td></tr><tr><td class=\"w\">advance</td><td class=\"m\">제시하다, 내세우다 (목적을 위해)</td></tr><tr><td class=\"w\">moral</td><td class=\"m\">도덕적인, 교훈적인</td></tr><tr><td class=\"w\">point</td><td class=\"m\">요점, 목적</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>‘우화’는 동물이나 사물이 의인화되어 등장하는 짧은 이야기이다.</li><li>이러한 이야기의 주된 목적은 독자에게 도덕적인 교훈을 전달하는 것이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Fables typically feature animals or objects acting like humans, and they are used to deliver a clear moral message.</div>\n              <div class=\"lec-final-sum-ko\">우화는 대개 인간처럼 행동하는 동물이나 사물을 다루며, 명확한 도덕적 메시지를 전달하기 위해 사용된다.</div></div></div>"],"segs":[[{"audio":"./sentence05_강의_audio/1.mp3","hl":null}],[{"audio":"./sentence05_강의_audio/2.mp3","hl":null}],[{"audio":"./sentence05_강의_audio/3.mp3","hl":null},{"audio":"./sentence05_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence05_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence05_강의_audio/6.mp3","hl":null}],[{"audio":"./sentence05_강의_audio/7.mp3"
