순히 체력을 기르는 것을 넘어, 스스로 운동의 재미를 느끼는 &#39;자기 주도적 학습(Self-directed learning)&#39;의 관점이 포함되어 있죠. 즉, 학교 체육이 입시 위주의 활동에서 벗어나 개인의 흥미와 신체적 특성에 맞는 활동을 선택할 수 있는 환경을 제공해야 한다는 점이 이 글의 핵심 배경이랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01프로그램의 균형 잡힌 구성</div><ul><li>학교 체육은 학생들이 다양한 활동을 경험할 수 있도록 다채롭게 구성되어야 합니다.</li><li>여러 가지 활동을 조화롭게 제공 (balanced variety of activities)</li><li>특정 종목에 치우치지 않는 운영 필요</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02평생 체육의 기초 마련</div><ul><li>체육 수업은 학생들이 졸업 후에도 계속 즐길 수 있는 운동 능력을 길러주어야 합니다.</li><li>평생 지속 가능한 활동 (lifetime activities)</li><li>신체 능력의 꾸준한 발달 (develop ability)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03개인적 의미와 즐거움의 중요성</div><ul><li>학생들이 운동을 자발적으로 참여하게 하려면 활동 자체가 흥미롭고 가치 있어야 합니다.</li><li>개인에게 의미 있는 활동 (personally meaningful)</li><li>스스로 즐거움을 느끼는 경험 (enjoyable)</li><li>핵심 키워드: 평생 스포츠(lifetime activities), 흥미와 의미(meaningful and enjoyable)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">school</td><td class=\"m\">학교</td></tr><tr><td class=\"w\">physical education</td><td class=\"m\">체육 (교육)</td></tr><tr><td class=\"w\">program</td><td class=\"m\">프로그램, 계획</td></tr><tr><td class=\"w\">offer</td><td class=\"m\">제공하다</td></tr><tr><td class=\"w\">balanced</td><td class=\"m\">균형 잡힌</td></tr><tr><td class=\"w\">variety</td><td class=\"m\">다양성, 여러 가지</td></tr><tr><td class=\"w\">activity</td><td class=\"m\">활동</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">~하게 하다, 허락하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">young people</td><td class=\"m\">젊은이들, 청소년들</td></tr><tr><td class=\"w\">develop</td><td class=\"m\">개발하다, 기르다</td></tr><tr><td class=\"w\">ability</td><td class=\"m\">능력</td></tr><tr><td class=\"w\">lifetime</td><td class=\"m\">평생의, 일생의</td></tr><tr><td class=\"w\">personally</td><td class=\"m\">개인적으로</td></tr><tr><td class=\"w\">meaningful</td><td class=\"m\">의미 있는</td></tr><tr><td class=\"w\">enjoyable</td><td class=\"m\">즐거운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">학교 체육 프로그램은</span><span class=\"en\"><b>School physical education programs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제공해야 한다</span><span class=\"en\"><b>should offer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">균형 잡힌 다양한 활동들을</span><span class=\"en\"><b>a balanced variety of activities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">젊은이들이 ~하도록 하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that allow young people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">능력을 개발하게</span><span class=\"en\"><b><span class=\"grammar-hl\">to develop</span> ability</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">평생 활동 속에서</span><span class=\"en\"><b>in lifetime activities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개인적으로 의미 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that are personally meaningful</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 즐거운</span><span class=\"en\"><b><span class=\"grammar-hl\">and enjoyable</span>.</b></span></div></div><div class=\"lec-sent-ko\">학교 체육 프로그램은 젊은이들이 개인적으로 의미 있고 즐거운 평생 활동 속에서 능력을 개발할 수 있게 하는 균형 잡힌 다양한 활동을 제공해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학교 체육이 단순히 단기적인 운동 기능 향상에 그치지 않고, 학생들이 성인이 되어서도 계속 즐길 수 있는 운동(평생 활동)을 익히게 해야 한다는 주장을 담고 있습니다. 여기서 **balanced**는 사전적으로는 &#39;균형 잡힌&#39;이지만, 여기서는 특정 종목에 치우치지 않고 학생들이 폭넓게 경험할 수 있도록 구성된 교육과정을 의미합니다. 필자가 이 단어를 쓴 이유는 체육 교육의 질적 다양성을 강조하기 위함입니다. 또한 **lifetime**은 &#39;일생의&#39;라는 뜻이지만, 여기서는 &#39;평생 지속 가능한&#39;이라는 의미로 쓰였습니다. 학생들이 체육을 학창 시절의 과목으로 끝내지 않고 인생 전반에 걸쳐 활용하기를 바라는 의도가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that allow young people to develop (관계대명사): that은 앞의 명사 activities를 수식하는 주격 관계대명사이며, 뒤에 동사 allow가 이어지는 절 구조입니다.</div><div class=\"lec-gr-item\">allow young people to develop 5형식(SVOC) 구조: allow + 목적어(young people) + 목적보어(to부정사) 형태입니다. 목적어인 young people이 to develop하는 행동을 하도록 허락한다는 의미를 가집니다.</div><div class=\"lec-gr-item\">to develop (to부정사): 5형식 구조에서 목적보어로 쓰여, 앞의 목적어 young people의 동작을 나타냅니다.</div><div class=\"lec-gr-item\">that are personally meaningful and enjoyable (관계대명사): that은 앞의 명사 lifetime activities를 수식하는 주격 관계대명사이며, that이 절 내부에서 주어 역할을 하므로 뒤에 동사 are가 이어지는 완전하지 않은 절 구조입니다.</div><div class=\"lec-gr-item\">are (수동태): 해당 문장에서 are는 단순히 상태를 나타내는 be동사이며, 뒤의 형용사(meaningful, enjoyable)와 결합하여 보어 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">school</td><td class=\"m\">학교</td></tr><tr><td class=\"w\">physical education</td><td class=\"m\">체육 (교육)</td></tr><tr><td class=\"w\">program</td><td class=\"m\">프로그램, 계획</td></tr><tr><td class=\"w\">offer</td><td class=\"m\">제공하다</td></tr><tr><td class=\"w\">balanced</td><td class=\"m\">균형 잡힌</td></tr><tr><td class=\"w\">variety</td><td class=\"m\">다양성, 여러 가지</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">~하게 하다, 허락하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">young people</td><td class=\"m\">젊은이들, 청소년들</td></tr><tr><td class=\"w\">develop</td><td class=\"m\">개발하다, 기르다</td></tr><tr><td class=\"w\">ability</td><td class=\"m\">능력</td></tr><tr><td class=\"w\">lifetime</td><td class=\"m\">평생의, 일생의</td></tr><tr><td class=\"w\">personally</td><td class=\"m\">개인적으로</td></tr><tr><td class=\"w\">meaningful</td><td class=\"m\">의미 있는</td></tr><tr><td class=\"w\">enjoyable</td><td class=\"m\">즐거운</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>학교 체육 프로그램은 학생들에게 다양한 활동 기회를 제공해야 한다.</li><li>활동은 일회성이 아니라 평생 즐길 수 있는 성격이어야 한다.</li><li>학생 개개인에게 의미와 즐거움을 줄 수 있는 종목 위주로 구성되어야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">School physical education programs must include various activities, so that students can develop skills for lifelong physical engagement.</div>\n              <div class=\"lec-final-sum-ko\">학교 체육 프로그램은 학생들이 평생 동안 신체 활동에 참여할 수 있는 능력을 기를 수 있도록, 다양한 활동을 포함해야 한다.</div></div></div>"],"segs":[[{"audio":"./sentence12_강의_audio/1.mp3","hl":null}],[{"audio":"./sentence12_강의_audio/2.mp3","hl":null}],[{"audio":"./sentence12_강의_audio/3.mp3","hl":null},{"audio":"./sentence12_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence12_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence12_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence12_강의_audio/7.mp3","hl":null}],[{"audio":"./sentence12_강의_audio/8.mp3","hl":"main"},{"audio":"./sentence12_강의_audio/9.mp3","hl":"meaning"},{"audio":"./sentence12_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence12_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrol
