es)의 성질</li><li>자원은 무한하지 않다는 현실적 한계</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02갈등의 발생</div><ul><li>자원이 부족해지는 시점에 도달하면 필연적으로 대립이 일어납니다.</li><li>자원 고갈과 충돌의 불가피성(inevitable)</li><li>한계점에 도달함에 따라 생기는 긴장 상태</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결론적 전망</div><ul><li>결국 자원 부족 문제는 인간이 피할 수 없는 갈등의 핵심 원인이 됩니다.</li><li>자원과 갈등(conflict)의 직접적 연관성</li><li>생존을 위한 자원 경쟁의 필연성</li><li>핵심 키워드: 유한한 자원(finite resources), 불가피한(inevitable), 갈등(conflict)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">eventually</td><td class=\"m\">결국, 마침내</td></tr><tr><td class=\"w\">reach</td><td class=\"m\">(~에) 도달하다, 이르다</td></tr><tr><td class=\"w\">point</td><td class=\"m\">시점, 단계</td></tr><tr><td class=\"w\">conflict</td><td class=\"m\">충돌, 갈등</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">finite</td><td class=\"m\">한정된, 유한한</td></tr><tr><td class=\"w\">nature</td><td class=\"m\">본질, 특성</td></tr><tr><td class=\"w\">resource</td><td class=\"m\">자원</td></tr><tr><td class=\"w\">inevitable</td><td class=\"m\">피할 수 없는, 필연적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 결국 도달할 것이다</span><span class=\"en\"><b>We will eventually reach</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지점에</span><span class=\"en\"><b>a point</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에서 갈등이</span><span class=\"en\"><b><span class=\"grammar-hl\">at which</span> <span class=\"grammar-hl\">conflict</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자원의 한정성과의</span><span class=\"en\"><b><span class=\"grammar-hl\">with the finite nature of resources</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불가피한</span><span class=\"en\"><b><span class=\"grammar-hl\">is inevitable</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 결국 자원의 한정성과의 갈등이 불가피한 지점에 이르게 될 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;자원&#39;이 가진 한계 때문에 미래에 인류가 마주할 피할 수 없는 위기를 경고하는 문장입니다. 여기서 inevitable은 사전적으로 &#39;피할 수 없는&#39;인데, 문맥상 &#39;어떤 선택을 하든 반드시 겪어야만 하는 필연적인 결과&#39;라는 의미로 쓰였습니다. 필자는 앞으로 닥칠 문제의 심각성과 확실성을 강조하기 위해 이 낱말을 선택했습니다. 또한 finite nature는 사전적으로 &#39;유한한 본질/성질&#39;이지만, 문맥상으로는 &#39;자원이 무한하지 않고 언젠가는 고갈된다는 현실적인 특징&#39;을 의미합니다. 자원이 가진 근본적인 한계점을 강조하여 인류의 소비 패턴이 지속 불가능함을 극적으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">at which 전치사+관계대명사 구조: 전치사 at + 관계대명사 which가 point를 수식하며, 뒤에는 &#39;conflict with the finite nature of resources is inevitable&#39;라는 완전한 절이 오는 관계대명사절 구조다. 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절이 온다.</div><div class=\"lec-gr-item\">conflict with the finite nature of resources is inevitable (관계대명사절): 앞의 명사 point를 수식하는 절로, 내부에 주어(conflict)와 동사(is)가 모두 포함된 완전한 문장 구조를 이룬다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">eventually</td><td class=\"m\">결국, 마침내</td></tr><tr><td class=\"w\">reach</td><td class=\"m\">(~에) 도달하다, 이르다</td></tr><tr><td class=\"w\">point</td><td class=\"m\">시점, 단계</td></tr><tr><td class=\"w\">conflict</td><td class=\"m\">충돌, 갈등</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">finite</td><td class=\"m\">한정된, 유한한</td></tr><tr><td class=\"w\">nature</td><td class=\"m\">본질, 특성</td></tr><tr><td class=\"w\">resource</td><td class=\"m\">자원</td></tr><tr><td class=\"w\">inevitable</td><td class=\"m\">피할 수 없는, 필연적인</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인류는 자원이 무한하지 않다는 현실을 계속 무시할 수 없다.</li><li>자원은 정해진 양이 있으므로 언젠가는 소비가 그 한계에 부딪힐 것이다.</li><li>결국 인간의 활동과 자원의 유한성 사이에서 피할 수 없는 갈등이 발생할 것이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People will eventually encounter a situation where they must face the limitations of nature, because resources are finite and cannot satisfy every demand.</div>\n              <div class=\"lec-final-sum-ko\">자원은 유한하여 모든 요구를 충족할 수 없기 때문에, 사람들은 결국 자연의 한계와 마주해야 하는 상황을 겪게 될 것이다.</div></div></div>"],"segs":[[{"audio":"./sentence09_강의_audio/1.mp3","hl":null}],[{"audio":"./sentence09_강의_audio/2.mp3","hl":null}],[{"audio":"./sentence09_강의_audio/3.mp3","hl":null},{"audio":"./sentence09_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence09_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence09_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence09_강의_audio/7.mp3","hl":null}],[{"audio":"./sentence09_강의_audio/8.mp3","hl":"main"},{"audio":"./sentence09_강의_audio/9.mp3","hl":"meaning"},{"audio":"./sentence09_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence09_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
