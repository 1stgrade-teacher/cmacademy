tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">jack-of-all-trades</td><td class=\"m\">팔방미인, 만물박사(여기서는 여러 가지를 조금씩 다 하는 사람)</td></tr><tr><td class=\"w\">mean</td><td class=\"m\">의미하다</td></tr><tr><td class=\"w\">claim</td><td class=\"m\">주장하다</td></tr><tr><td class=\"w\">proficient</td><td class=\"m\">능숙한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">countless</td><td class=\"m\">셀 수 없이 많은</td></tr><tr><td class=\"w\">task</td><td class=\"m\">일, 과업</td></tr><tr><td class=\"w\">perform</td><td class=\"m\">수행하다, 해내다</td></tr><tr><td class=\"w\">single</td><td class=\"m\">단 하나의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&#39;팔방미인&#39;은</span><span class=\"en\"><b>'<span class=\"grammar-hl\">Jack-of-all-trades</span>'</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 의미한다</span><span class=\"en\"><b>means <span class=\"grammar-hl\">those</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">능숙하다고 주장하는</span><span class=\"en\"><b><span class=\"grammar-hl\">who claim to be proficient</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">셀 수 없이 많은 일들에</span><span class=\"en\"><b><span class=\"grammar-hl\">at countless tasks</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 해낼 수 없는</span><span class=\"en\"><b><span class=\"grammar-hl\">but cannot perform</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들 중 단 하나도</span><span class=\"en\"><b><span class=\"grammar-hl\">a single one of them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘</span><span class=\"en\"><b><span class=\"grammar-hl\">well</span>.</b></span></div></div><div class=\"lec-sent-ko\">’팔방미인’은 셀 수 없이 많은 일들에 능숙하다고 주장하지만 그것들 중 단 하나도 잘 해낼 수 없는 사람들을 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 이 글의 핵심 개념인 ‘Jack-of-all-trades’의 정의를 다룹니다. 여기서 proficient는 사전적으로 &#39;숙달된, 능숙한&#39;이라는 뜻이지만, 이 문맥에서는 스스로 실력을 과장하거나 겉핥기식으로 할 줄 아는 상태를 의미합니다. 필자가 이 단어를 고른 이유는 단순히 &#39;잘한다&#39;는 표현 대신, 겉으로는 완벽해 보이고 싶어 하는 심리를 강조하기 위해서입니다. 또한, claim이라는 표현을 통해 실제 실력과 본인이 주장하는 바 사이의 괴리를 드러내며, 뒤에 나오는 cannot perform(수행하지 못한다)과 대조를 이루어 부정적인 뉘앙스를 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Jack-of-all-trades (관용표현): 여러 가지 일을 두루 할 줄 아는 사람을 뜻하는 이디엄(다재다능한 사람 혹은 만물박사)으로, 문장의 주어로 쓰였습니다.</div><div class=\"lec-gr-item\">those who claim to be proficient at countless tasks (관계대명사): &#39;those(선행사) + who(주격 관계대명사) + claim(V) ...&#39; 구조로, 뒤의 관계대명사절이 those를 수식합니다. 관계대명사 who 뒤에는 주어가 없는 불완전한 문장이 이어집니다.</div><div class=\"lec-gr-item\">to be proficient (to부정사): claim의 목적어 역할을 하는 명사적 용법의 to부정사입니다. &#39;claim + to V&#39; 구조로 &#39;~라고 주장하다&#39;라는 의미를 형성합니다.</div><div class=\"lec-gr-item\">but cannot perform a single one of them well (관계대명사): 앞에 언급된 관계대명사절의 병렬 구조로, who가 이끄는 절이 claim(V1)과 cannot perform(V2)을 공통으로 취하고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">jack-of-all-trades</td><td class=\"m\">팔방미인, 만물박사(여기서는 여러 가지를 조금씩 다 하는 사람)</td></tr><tr><td class=\"w\">mean</td><td class=\"m\">의미하다</td></tr><tr><td class=\"w\">claim</td><td class=\"m\">주장하다</td></tr><tr><td class=\"w\">proficient</td><td class=\"m\">능숙한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">countless</td><td class=\"m\">셀 수 없이 많은</td></tr><tr><td class=\"w\">task</td><td class=\"m\">일, 과업</td></tr><tr><td class=\"w\">perform</td><td class=\"m\">수행하다, 해내다</td></tr><tr><td class=\"w\">single</td><td class=\"m\">단 하나의</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>‘팔방미인(Jack-of-all-trades)’이라는 표현은 긍정적인 의미로 쓰이기도 하지만, 실제로는 여러 가지를 얕게 알 뿐 제대로 하는 것은 없는 사람을 비판할 때 쓰인다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The expression &#39;jack-of-all-trades&#39; refers to individuals who claim to be skilled at many things, yet fail to perform any specific task with excellence.</div>\n              <div class=\"lec-final-sum-ko\">&#39;팔방미인&#39;이라는 표현은 많은 것을 잘한다고 주장하지만, 정작 어떤 특정 과업도 탁월하게 수행하지 못하는 사람을 가리킨다.</div></div></div>"],"segs":[[{"audio":"./sentence10_강의_audio/1.mp3","hl":null}],[{"audio":"./sentence10_강의_audio/2.mp3","hl":null}],[{"audio":"./sentence10_강의_audio/3.mp3","hl":null},{"audio":"./sentence10_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence10_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence10_강의_audio/6.mp3","hl":null}],[{"audio":"./sentence10_강의_audio/7.mp3","hl":"main"},{"audio":"./sentence10_강의_audio/8.mp3","hl":"meaning"},{"audio":"./sentence10_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence10_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden
