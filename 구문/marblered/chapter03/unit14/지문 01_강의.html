 훨씬 이해하기 쉬울 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01인체의 방어 본능</div><ul><li>우리 몸은 외부의 위협으로부터 스스로를 보호할 수 있는 타고난 능력을 갖추고 있다.</li><li>질병(diseases)과 세균(bacteria)에 대한 대응 능력</li><li>외부 침입자가 들어왔을 때 자동으로 활성화됨</li><li>핵심 키워드: 방어 능력(natural ability)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02면역 체계의 작동</div><ul><li>외부 세균이 신체 내부에 침입하면 인체는 이를 제거하기 위한 즉각적인 반응을 시작한다.</li><li>신체 내로 유입되는 세균(bacteria) 인식</li><li>해로운 침입자들과 싸우려는(fight off) 생물학적 작용</li><li>핵심 키워드: 면역 반응(immune response)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">natural</td><td class=\"m\">타고난, 자연스러운</td></tr><tr><td class=\"w\">ability</td><td class=\"m\">능력</td></tr><tr><td class=\"w\">fight off</td><td class=\"m\">~을 물리치다, 퇴치하다</td></tr><tr><td class=\"w\">bacteria</td><td class=\"m\">박테리아, 세균</td></tr><tr><td class=\"w\">disease</td><td class=\"m\">질병</td></tr><tr><td class=\"w\">enter</td><td class=\"m\">들어가다, 침입하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 신체는</span><span class=\"en\"><b>Our bodies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">타고난 능력을 가지고 있다</span><span class=\"en\"><b>have the natural ability</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">박테리아와 질병을 물리칠</span><span class=\"en\"><b>to fight off bacteria and diseases</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 들어올 때</span><span class=\"en\"><b>when they enter</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 몸에</span><span class=\"en\"><b>our bodies.</b></span></div></div><div class=\"lec-sent-ko\">우리의 신체는 박테리아와 질병이 우리의 몸에 들어올 때 그것들을 물리칠 타고난 능력을 가지고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 인간의 몸이 가진 기본적인 방어 기제인 &#39;면역 체계&#39;를 소개합니다. 여기서 fight off는 사전적으로는 &#39;싸워서 물리치다&#39;라는 뜻인데, 문맥상으로는 외부의 병원균을 우리 몸의 면역 체계가 &#39;격퇴하여 감염을 막아내는 것&#39;을 의미합니다. 필자는 단순히 병을 막는다는 표현보다 &#39;싸운다&#39;는 능동적인 표현을 사용하여, 우리 몸이 외부의 위협에 대해 얼마나 역동적으로 대응하는지를 강조하기 위해 이 구동사를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who are real, who walk their talk, who act on their core values, and who tell us the truth (관계대명사): who가 이끄는 관계대명사절들이 선행사 leaders를 수식하는 구조. 관계대명사 who 뒤에는 주어가 빠진 불완전한 절이 오며, 여기서는 반복되는 who를 통해 선행사의 속성을 병렬적으로 구체화하고 있음.</div><div class=\"lec-gr-item\">walk their talk (관용표현): &#39;말한 대로 행동하다&#39;라는 의미의 이디엄으로, walk(행동하다)와 talk(말)을 조합하여 언행일치를 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">natural</td><td class=\"m\">타고난, 자연스러운</td></tr><tr><td class=\"w\">ability</td><td class=\"m\">능력</td></tr><tr><td class=\"w\">fight off</td><td class=\"m\">~을 물리치다, 퇴치하다</td></tr><tr><td class=\"w\">bacteria</td><td class=\"m\">박테리아, 세균</td></tr><tr><td class=\"w\">disease</td><td class=\"m\">질병</td></tr><tr><td class=\"w\">enter</td><td class=\"m\">들어가다, 침입하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우리 몸은 외부의 박테리아나 질병이 침입했을 때, 이를 스스로 물리칠 수 있는 자연적인 방어 능력을 가지고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Human bodies possess an inherent biological system, which allows them to effectively combat invading bacteria and illnesses.</div>\n              <div class=\"lec-final-sum-ko\">인체는 타고난 생물학적 체계를 갖추고 있으며, 이를 통해 침입하는 세균과 질병에 효과적으로 맞서 싸운다.</div></div></div>"],"segs":[[{"audio":"./지문 01_강의_audio/1.m
