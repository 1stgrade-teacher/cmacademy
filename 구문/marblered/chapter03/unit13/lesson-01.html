</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"unit13","title":"마법같은 블록구문 실전편 Unit 13 목적어 + 형용사구","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>목적어 + 형용사구로 긴 문장을 블록처럼 묶는 법\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>목적어를 뒤에서 수식하는 to-v, v-ing, v-ed, 전치사구를 한 덩어리로 묶어 정확히 해석한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 긴 영어 문장이 어려운 이유는 목적어 뒤에 꾸며 주는 말이 계속 이어지기 때문이에요. 오늘은 목적어와 그 뒤의 형용사구를 하나의 블록으로 묶어 읽는 법을 연습합니다. 예문 열두 개를 함께 보면서 해석 감각을 키워 봅시다. 이걸 익히면 시험 지문에서 뒷부분이 복잡한 문장도 훨씬 빨리 읽힙니다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">이 구문은 \u003cb class=\"key\">목적어 + 형용사구\u003c/b> 형태로, 목적어를 \u003cb class=\"key\">to-v\u003c/b>, \u003cb class=\"key\">v-ing\u003c/b>, \u003cb class=\"key\">v-ed\u003c/b>, \u003cb class=\"key\">전치사구\u003c/b>가 뒤에서 수식한다. 목적어만 보고 멈추지 말고 뒤에서 꾸며 주는 말까지 하나의 \u003cb class=\"key\">블록\u003c/b>으로 묶어야 해석이 정확하다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Our bodies have \u003cspan class=\"fx\">the natural ability to fight off bacteria and diseases\u003c/span> when they enter our bodies.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 We often experience \u003cspan class=\"fx\">unexpected results brought about by words carelessly used\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 Healthy living in individuals lays \u003cspan class=\"fx\">the foundation for healthy living throughout society and the world\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 You have \u003cspan class=\"fx\">the right to be given a fair trial by a court of law\u003c/span> if you are accused of a crime.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 I have received \u003cspan class=\"fx\">an email offering me a job for an unknown company\u003c/span> that I don't remember applying to.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 The use of words itself yields, upon analysis, \u003cspan class=\"fx\">valuable results illustrative of the various temperaments of authors\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 At times our own light goes out and is rekindled by a spark from another person. Each of us has \u003cspan class=\"fx\">cause to think with deep gratitude of those who have lighted the flame within us\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Regular exercise increases \u003cspan class=\"fx\">the amount of blood flowing through your brain\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 We should reduce \u003cspan class=\"fx\">hazardous and toxic chemicals released into the air and water\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 Certainly, Leonardo da Vinci had \u003cspan class=\"fx\">an unusual mind and an uncanny ability to see what others didn't see\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 Scientists at NASA have spotted \u003cspan class=\"fx\">six asteroids heading in the direction of Earth\u003c/span>, with one of them having a size larger than the Empire State Building.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Google and other carmakers around the world are developing \u003cspan class=\"fx\">technologies applied to currently &quot;manned&quot; vehicles\u003c/span> to permit drivers to take their hands off the wheel and focus on other tasks.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘 배울 블록은 목적어 뒤에서 그 목적어를 꾸며 주는 형용사구입니다. 영어는 명사를 꾸미는 말이 뒤에 오는 경우가 많아요. 목적어 뒤에 to부정사나 분사, 전치사구가 보이면 일단 목적어를 수식하는 블록이라고 생각하고 묶어서 해석하면 됩니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Our bodies have \u003cspan class=\"fx\">the natural ability to fight off bacteria and diseases\u003c/span> when they enter our bodies.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Our bodies have\u003c/div>\u003cdiv class=\"k\">우리 몸은 가진다\u003c/div>\u003cdiv class=\"e\">the natural ability\u003c/div>\u003cdiv class=\"k\">타고난 능력을\u003c/div>\u003cdiv class=\"e\">to fight off bacteria and diseases\u003c/div>\u003cdiv class=\"k\">박테리아와 질병을 물리칠\u003c/div>\u003cdiv class=\"e\">when they enter our bodies.\u003c/div>\u003cdiv class=\"k\">그것들이 우리 몸에 들어올 때\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어인 \u003cb class=\"key\">the natural ability\u003c/b>를 \u003cb class=\"key\">to fight off bacteria and diseases\u003c/b>가 이끄는 형용사구가 수식한다. ability처럼 추상적인 명사는 뒤에 to부정사로 내용을 구체화하는 경우가 많다.\u003c/div>","segs":[{"n":3,"text":"Our bodies have, 우리 몸은 가진다. the natural ability, 타고난 능력을. to fight off bacteria and diseases, 박테리아와 질병을 물리칠. when they enter our bodies, 그것들이 우리 몸에 들어올 때","hl":"ch"},{"n":4,"text":"이 문장의 목적어는 the natural ability입니다. 그 뒤에 나온 to fight off bacteria and diseases가 ability를 꾸며 주는 형용사구예요. 목적어와 그 뒤의 수식어를 한 덩어리로 묶어서 읽어야 해석이 매끄럽습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Our bodies have \u003cspan class=\"fx\">the natural ability to fight off bacteria and diseases\u003c/span> when they enter our bodies.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리 몸은 병원균이 몸에 들어왔을 때 스스로 싸워 물리칠 수 있는 자연적인 능력을 타고났다는 뜻입니다. ability를 to fight off가 구체 to를 써서 더 간단하게 표현했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 We often experience \u003cspan class=\"fx\">unexpected results brought about by words carelessly used\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We often experience\u003c/div>\u003cdiv class=\"k\">우리는 종종 경험한다\u003c/div>\u003cdiv class=\"e\">unexpected results\u003c/div>\u003cdiv class=\"k\">예상치 못한 결과를\u003c/div>\u003cdiv class=\"e\">brought about by words\u003c/div>\u003cdiv class=\"k\">말에 의해 초래된\u003c/div>\u003cdiv class=\"e\">carelessly used.\u003c/div>\u003cdiv class=\"k\">부주의하게 사용된\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어인 \u003cb class=\"key\">unexpected results\u003c/b>를 과거분사 \u003cb class=\"key\">brought\u003c/b>가 이끄는 형용사구가 수식한다. words를 과거분사 \u003cb class=\"key\">carelessly used\u003c/b>가 뒤에서 수식한다.\u003c/div>","segs":[{"n":9,"text":"We often experience, 우리는 종종 경험한다. unexpected results, 예상치 못한 결과를. brought about by words, 말에 의해 초래된. carelessly used, 부주의하게 사용된","hl":"ch"},{"n":10,"text":"이 문장의 목적어는 unexpected results입니다. 그 뒤에 나온 brought about by words가 results를 수식하는 형용사구이고, words 뒤의 carelessly used도 words를 꾸며 주고 있어요. 이렇게 과거분사가 명사를 뒤에서 수식하면 해석은 꾸며 주는 말을 앞으로 보내서 자연스럽게 하면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 We often experience \u003cspan class=\"fx\">unexpected results brought about by words carelessly used\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>부주의하게 사용된 말이 예상하지 못한 결과를 가져오고, 우리는 그런 결과를 자주 겪는다는 뜻입니다. 행동이 아니라 말의 중요성을 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">results brought about by words\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">results caused by words\u003c/span>\u003cdiv class=\"w\">bring about은 cause와 뜻이 같아서 더 쉬운 표현으로 바꿔도 의미가 유지됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">words carelessly used\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">careless words\u003c/span>\u003cdiv class=\"w\">과거분사 수식을 형용사 한 단어로 압축하면 짧고 깔끔해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">bring about\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cause\u003c/span>\u003cspan class=\"y-eq\">bring about = cause\u003c/span>\u003cdiv class=\"w\">어떤 결과를 초래하다는 뜻으로 bring about 대신 cause를 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">carelessly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">thoughtlessly\u003c/span>\u003cspan class=\"y-eq\">carelessly = thoughtlessly\u003c/span>\u003cdiv class=\"w\">신중하지 못하고 아무 생각 없이 행동하는 태도를 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unexpected\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">surprising\u003c/span>\u003cspan class=\"y-eq\">unexpected = surprising\u003c/span>\u003cdiv class=\"w\">예상하지 못했다는 의미를 놀라운이라는 형용사로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We often encounter surprising outcomes caused by careless words.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"부주의하게 사용된 말이 예상하지 못한 결과를 불러온다는 뜻입니다. 우리가 흔히 말을 가볍게 하지만, 그 말이 의외의 큰 결과를 만들 수 있다는 점을 강조하는 문장이에요.","hl":"mn"},{"n":12,"text":"results brought about by words는 results caused by words로 바꿔 쓸 수 있어요. words carelessly used는 careless words로 압축하면 훨씬 간결해지고 뜻도 그대로 살아 있습니다.","hl":"rw"},{"n":13,"text":"bring about은 cause와 같아서 초래하다라는 뜻입니다. carelessly는 thoughtlessly로 바꿀 수 있고, unexpected는 surprising으로도 자주 바꿔 씁니다. 모두 시험에서 유의어 문제로 자주 출제돼요.","hl":"ph"},{"n":14,"text":"이 문장을 바꾸면 We often encounter surprising outcomes caused by careless words라고 할 수 있습니다. encounter는 experience와, outcomes는 results와, careless words는 words carelessly used와 대응해서 같은 뜻을 나타냅니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 Healthy living in individuals lays \u003cspan class=\"fx\">the foundation for healthy living throughout society and the world\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Healthy living in individuals\u003c/div>\u003cdiv class=\"k\">개인들의 건강한 삶은\u003c/div>\u003cdiv class=\"e\">lays the foundation\u003c/div>\u003cdiv class=\"k\">토대를 놓는다\u003c/div>\u003cdiv class=\"e\">for healthy living\u003c/div>\u003cdiv class=\"k\">건강한 삶을 위한\u003c/div>\u003cdiv class=\"e\">throughout society and the world.\u003c/div>\u003cdiv class=\"k\">사회와 세계 전체에 걸쳐\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">the foundation\u003c/b>을 \u003cb class=\"key\">for healthy living throughout society and the world\u003c/b>라는 전치사구가 수식한다. for 이하가 어떤 토대인지 구체적으로 설명해 준다.\u003c/div>","segs":[{"n":15,"text":"Healthy living in individuals, 개인들의 건강한 삶은. lays the foundation, 토대를 놓는다. for healthy living, 건강한 삶을 위한. throughout society and the world, 사회와 세계 전체에 걸쳐","hl":"ch"},{"n":16,"text":"이 문장은 목적어 the foundation 뒤에 for healthy living throughout society and the world가 붙었어요. 이 전치사구가 어떤 토대인지를 설명해 주는 형용사구 역할을 합니다. 목적어만 보지 말고 for 이하를 foundation과 한 덩어리로 묶어서 해석하세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 Healthy living in individuals lays \u003cspan class=\"fx\">the foundation for healthy living throughout society and the world\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>개개인의 건강한 삶이 사회 전체와 세계의 건강한 삶을 만드는 밑바탕이 된다는 뜻입니다. 한 사람의 실천이 공동체 전체로 퍼져 나간다는 의미를 담고 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">lays the foundation for\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">forms the basis for\u003c/span>\u003cdiv class=\"w\">lay the foundation은 form the basis로 바꿔도 기반을 마련한다는 뜻을 유지합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">individual\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">person\u003c/span>\u003cspan class=\"y-eq\">individual = person\u003c/span>\u003cdiv class=\"w\">개인이라는 뜻으로 문맥에 따라 person으로 쉽게 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">foundation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">basis\u003c/span>\u003cspan class=\"y-eq\">foundation = basis\u003c/span>\u003cdiv class=\"w\">토대와 기반이라는 뜻으로 둘 다 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">throughout\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">all over\u003c/span>\u003cspan class=\"y-eq\">throughout = all over\u003c/span>\u003cdiv class=\"w\">전체에 걸쳐라는 뜻으로 범위를 강조할 때 all over로 바꿔 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Healthy living at the individual level creates the basis for healthy living across society and the world.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"개개인의 건강한 삶이 사회와 세계 전체의 건강한 삶을 위한 토대가 된다는 뜻입니다. 결국 작은 실천이 더 큰 공동체의 변화로 이어진다는 메시지를 담고 있어요.","hl":"mn"},{"n":18,"text":"lays the foundation for는 forms the basis for로 바꿔 쓸 수 있어요. 기반을 마련한다는 뜻이 그대로 유지되고, 더 평이한 표현으로 들립니다.","hl":"rw"},{"n":19,"text":"individual은 person, foundation은 basis로 바꿔 쓸 수 있습니다. throughout는 all over와 뜻이 같아서 범위를 나타낼 때 자주 교체해요.","hl":"ph"},{"n":20,"text":"이 문장을 패러프레이징하면 Healthy living at the individual level creates the basis for healthy living across society and the world라고 할 수 있습니다. in individuals를 at the individual level로, lays the foundation for를 creates the basis for로 자연스럽게 바꿨어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 You have \u003cspan class=\"fx\">the right to be given a fair trial by a court of law\u003c/span> if you are accused of a crime.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">You have\u003c/div>\u003cdiv class=\"k\">당신은 가진다\u003c/div>\u003cdiv class=\"e\">the right\u003c/div>\u003cdiv class=\"k\">권리를\u003c/div>\u003cdiv class=\"e\">to be given a fair trial\u003c/div>\u003cdiv class=\"k\">공정한 재판을 받을\u003c/div>\u003cdiv class=\"e\">by a court of law\u003c/div>\u003cdiv class=\"k\">법정에 의해\u003c/div>\u003cdiv class=\"e\">if you are accused of a crime.\u003c/div>\u003cdiv class=\"k\">만약 범죄로 기소된다면\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">the right\u003c/b>를 \u003cb class=\"key\">to be given\u003c/b>이 이끄는 형용사구가 수식한다. to be given은 수동태 to부정사로, right의 내용을 나타낸다.\u003c/div>","segs":[{"n":21,"text":"You have, 당신은 가진다. the right, 권리를. to be given a fair trial, 공정한 재판을 받을. by a court of law, 법정에 의해. if you are accused of a crime, 만약 범죄로 기소된다면","hl":"ch"},{"n":22,"text":"이 문장의 목적어는 the right입니다. 그 뒤에 to be given a fair trial by a court of law가 나와서 권리의 내용을 설명해 주는 형용사구 역할을 해요. to be given은 수동태 부정사라서 재판을 받는다는 수동의 뜻이 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 You have \u003cspan class=\"fx\">the right to be given a fair trial by a court of law\u003c/span> if you are accused of a crime.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>범죄로 기소되더라도 법정에서 공정한 재판을 받을 권리가 있다는 뜻입니다. 법적 권리를 설명할 때 right to be given처럼 to부정사가 자주 쓰입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have the right to be given\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are entitled to receive\u003c/span>\u003cdiv class=\"w\">권리를 가진다는 뜻을 entitled to로 바꾸면 법적·공식적인 맥락에서 자연스럽습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a fair trial\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">an impartial trial\u003c/span>\u003cspan class=\"y-eq\">a fair trial = an impartial trial\u003c/span>\u003cdiv class=\"w\">공정한 재판이라는 뜻으로 fair 대신 impartial을 쓰면 더 격식 있는 표현이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">accuse A of B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">charge A with B\u003c/span>\u003cspan class=\"y-eq\">accuse A of B = charge A with B\u003c/span>\u003cdiv class=\"w\">고발하다와 기소하다의 뜻으로 전치사만 바꿔서 자주 출제됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a court of law\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a court\u003c/span>\u003cspan class=\"y-eq\">a court of law = a court\u003c/span>\u003cdiv class=\"w\">법정이라는 뜻으로 of law를 생략해도 같은 의미를 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">You are entitled to receive an impartial trial in court if you are charged with a crime.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"만약 범죄로 기소되면 법정에서 공정한 재판을 받을 권리를 가진다는 뜻입니다. 단순히 재판이 아니라 공정한 재판을 받을 권리라는 점이 중요해요.","hl":"mn"},{"n":24,"text":"have the right to be given은 are entitled to receive로 바꿔 쓸 수 있습니다. 법적 권리를 말할 때 entitled to를 쓰면 더 격식 있고 정확한 표현이 됩니다.","hl":"rw"},{"n":25,"text":"a fair trial은 an impartial trial로 바꿔 쓸 수 있고, accuse A of B는 charge A with B와 같은 뜻입니다. a court of law도 그냥 a court로 간단히 말할 수 있어요.","hl":"ph"},{"n":26,"text":"이 문장을 바꾸면 You are entitled to receive an impartial trial in court if you are charged with a crime이라고 할 수 있습니다. fair를 impartial로, accused of를 charged with로 바꿔서 같은 의미를 나타냈어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 I have received \u003cspan class=\"fx\">an email offering me a job for an unknown company\u003c/span> that I don't remember applying to.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I have received\u003c/div>\u003cdiv class=\"k\">나는 받았다\u003c/div>\u003cdiv class=\"e\">an email\u003c/div>\u003cdiv class=\"k\">이메일을\u003c/div>\u003cdiv class=\"e\">offering me a job\u003c/div>\u003cdiv class=\"k\">내게 일자리를 제안하는\u003c/div>\u003cdiv class=\"e\">for an unknown company\u003c/div>\u003cdiv class=\"k\">무명의 회사를 위한\u003c/div>\u003cdiv class=\"e\">that I don't remember applying to.\u003c/div>\u003cdiv class=\"k\">내가 지원했는지 기억나지 않는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">an email\u003c/b>을 현재분사 \u003cb class=\"key\">offering\u003c/b>이 이끄는 형용사구가 수식한다. \u003cb class=\"key\">that I don't remember applying to\u003c/b>는 an unknown company를 수식하는 형용사절이다.\u003c/div>","segs":[{"n":27,"text":"I have received, 나는 받았다. an email, 이메일을. offering me a job, 내게 일자리를 제안하는. for an unknown company, 무명의 회사를 위한. that I don't remember applying to, 내가 지원했는지 기억나지 않는","hl":"ch"},{"n":28,"text":"이 문장의 목적어는 an email입니다. 그 뒤에 offering me a job이 이메일을 수식하는 현재분사구예요. for an unknown company는 그 일자리가 어떤 회사인지를 설명하고, that 이하는 company를 다시 꾸며 주는 관계대명사절입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 I have received \u003cspan class=\"fx\">an email offering me a job for an unknown company\u003c/span> that I don't remember applying to.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>기억나지 않는 회사에서 일자리를 제안하는 이메일을 받았다는 뜻입니다. offering 이하가 이메일의 내용을 덧붙여 주는 역할을 해서, 이메일을 열기 전부터 그 성격을 알 수 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">offering me a job\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">that offers me a job\u003c/span>\u003cdiv class=\"w\">현재분사 수식을 관계대명사절로 풀면 더 명시적이고 이해하기 쉽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">for an unknown company\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">from an unknown company\u003c/span>\u003cdiv class=\"w\">이메일의 출처나 소속을 나타낼 때 for보다 from이 더 자연스러울 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">receive\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">get\u003c/span>\u003cspan class=\"y-eq\">receive = get\u003c/span>\u003cdiv class=\"w\">받다는 뜻으로 get이 더 구어적이고 짧습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">apply to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">send in an application to\u003c/span>\u003cspan class=\"y-eq\">apply to = send in an application to\u003c/span>\u003cdiv class=\"w\">지원하다는 뜻을 풀어서 표현하면 더 분명해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unknown\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">unfamiliar\u003c/span>\u003cspan class=\"y-eq\">unknown = unfamiliar\u003c/span>\u003cdiv class=\"w\">알려지지 않은 회사를 익숙하지 않은 회사로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I received an email from a company I don’t remember applying to, offering me a job.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"기억나지 않는 회사에서 일자리를 제안하는 이메일을 받았다는 뜻이에요. 스팸 메일처럼 낯선 회사에서 온 제안이라서 조금 의심스러운 상황을 나타냅니다.","hl":"mn"},{"n":30,"text":"offering me a job은 that offers me a job으로 풀어 쓸 수 있습니다. for an unknown company는 from an unknown company로 바꾸면 이메일이 어디서 왔는지가 더 분명해져요.","hl":"rw"},{"n":31,"text":"receive는 get으로 간단히 바꿀 수 있고, apply to는 send in an application to로 풀어 쓸 수 있습니다. unknown은 unfamiliar로 바꾸면 익숙하지 않다는 느낌이 더 잘 살아납니다.","hl":"ph"},{"n":32,"text":"이 문장을 바꾸면 I received an email from a company I don’t remember applying to, offering me a job이라고 할 수 있습니다. 어순을 조금 바꾸었지만 이메일을 보낸 회사와 제안 내용이 그대로 전달됩니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 The use of words itself yields, upon analysis, \u003cspan class=\"fx\">valuable results illustrative of the various temperaments of authors\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The use of words itself\u003c/div>\u003cdiv class=\"k\">단어 사용 그 자체는\u003c/div>\u003cdiv class=\"e\">yields, upon analysis,\u003c/div>\u003cdiv class=\"k\">분석해 보면 낳는다\u003c/div>\u003cdiv class=\"e\">valuable results\u003c/div>\u003cdiv class=\"k\">가치 있는 결과들을\u003c/div>\u003cdiv class=\"e\">illustrative of the various temperaments\u003c/div>\u003cdiv class=\"k\">다양한 기질을 보여 주는\u003c/div>\u003cdiv class=\"e\">of authors.\u003c/div>\u003cdiv class=\"k\">작가들의\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">valuable results\u003c/b>를 형용사 \u003cb class=\"key\">illustrative\u003c/b>가 이끄는 형용사구가 수식한다. illustrative of가 results의 성격을 설명해 준다.\u003c/div>","segs":[{"n":33,"text":"The use of words itself, 단어 사용 그 자체는. yields, upon analysis, 분석해 보면 낳는다. valuable results, 가치 있는 결과들을. illustrative of the various temperaments, 다양한 기질을 보여 주는. of authors, 작가들의","hl":"ch"},{"n":34,"text":"이 문장의 목적어는 valuable results입니다. 그 뒤에 illustrative of the various temperaments of authors가 results를 꾸며 주는 형용사구예요. 형용사 illustrative가 of 이하를 이끌면서 결과가 어떤 성격인지 설명해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 The use of words itself yields, upon analysis, \u003cspan class=\"fx\">valuable results illustrative of the various temperaments of authors\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>단어 사용을 분석해 보면 작가들의 다양한 기질을 보여 주는 가치 있는 결과가 나온다는 뜻입니다. 글쓴이의 단어 선택이 곧 성격과 기질을 반영한다는 이야기입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">illustrative of\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">that illustrate\u003c/span>\u003cdiv class=\"w\">형용사구를 관계대명사절로 풀어서 더 평이하게 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">yield\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">produce\u003c/span>\u003cspan class=\"y-eq\">yield = produce\u003c/span>\u003cdiv class=\"w\">이익이나 결과를 산출하다는 뜻으로 produce와 자주 교체됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">illustrative\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">descriptive\u003c/span>\u003cspan class=\"y-eq\">illustrative = descriptive\u003c/span>\u003cdiv class=\"w\">무엇을 보여 주거나 설명하는 성격을 나타낼 때 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">temperament\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">disposition\u003c/span>\u003cspan class=\"y-eq\">temperament = disposition\u003c/span>\u003cdiv class=\"w\">기질이나 성향이라는 뜻으로 서로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">When analyzed, the use of words itself produces valuable results that illustrate the various temperaments of authors.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"단어 사용 그 자체를 분석해 보면 작가들의 다양한 기질을 보여 주는 가치 있는 결과가 나온다는 뜻이에요. 즉, 어떤 단어를 선택했는지를 보면 글쓴이의 성향을 알 수 있다는 말입니다.","hl":"mn"},{"n":36,"text":"illustrative of는 that illustrate로 바꿔 쓸 수 있어요. 이렇게 관계대명사절로 풀면 결과가 무엇을 보여 주는지 더 명확하게 읽힙니다.","hl":"rw"},{"n":37,"text":"yield는 produce와 바꿔 쓸 수 있고, 결과를 산출하다라는 뜻입니다. illustrative는 descriptive, temperament는 disposition과 유의어 관계라서 함께 기억해 두면 좋아요.","hl":"ph"},{"n":38,"text":"이 문장을 패러프레이징하면 When analyzed, the use of words itself produces valuable results that illustrate the various temperaments of authors라고 할 수 있습니다. upon analysis를 When analyzed로 바꾸고, illustrative of를 that illustrate로 풀었어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 At times our own light goes out and is rekindled by a spark from another person. Each of us has \u003cspan class=\"fx\">cause to think with deep gratitude of those who have lighted the flame within us\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">At times\u003c/div>\u003cdiv class=\"k\">가끔은\u003c/div>\u003cdiv class=\"e\">our own light goes out\u003c/div>\u003cdiv class=\"k\">우리 자신의 빛이 꺼지고\u003c/div>\u003cdiv class=\"e\">and is rekindled\u003c/div>\u003cdiv class=\"k\">다시 불붙는다\u003c/div>\u003cdiv class=\"e\">by a spark from another person.\u003c/div>\u003cdiv class=\"k\">다른 사람의 불꽃에 의해\u003c/div>\u003cdiv class=\"e\">Each of us has cause\u003c/div>\u003cdiv class=\"k\">우리 각자는 이유를 가진다\u003c/div>\u003cdiv class=\"e\">to think with deep gratitude\u003c/div>\u003cdiv class=\"k\">깊은 감사로 생각할\u003c/div>\u003cdiv class=\"e\">of those\u003c/div>\u003cdiv class=\"k\">그 사람들을\u003c/div>\u003cdiv class=\"e\">who have lighted the flame within us.\u003c/div>\u003cdiv class=\"k\">우리 안의 불꽃을 밝혀 준\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">cause\u003c/b>를 \u003cb class=\"key\">to think\u003c/b>가 이끄는 형용사구가 수식한다. to think with deep gratitude of those...로 묶어 해석하며, who 이하는 those를 수식하는 형용사절이다.\u003c/div>","segs":[{"n":39,"text":"At times, 가끔은. our own light goes out, 우리 자신의 빛이 꺼지고. and is rekindled, 다시 불붙는다. by a spark from another person, 다른 사람의 불꽃에 의해. Each of us has cause, 우리 각자는 이유를 가진다. to think with deep gratitude, 깊은 감사로 생각할. of those, 그 사람들을. who have lighted the flame within us, 우리 안의 불꽃을 밝혀 준","hl":"ch"},{"n":40,"text":"이 문장은 두 문장으로 되어 있지만 두 번째 문장에 오늘 배울 구문이 있어요. Each of us has cause에서 cause가 목적어이고, to think with deep gratitude가 cause를 꾸며 주는 형용사구입니다. who have lighted the flame within us는 those를 수식하는 관계대명사절이에요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 At times our own light goes out and is rekindled by a spark from another person. Each of us has \u003cspan class=\"fx\">cause to think with deep gratitude of those who have lighted the flame within us\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>가끔 우리의 의욕이나 열정이 꺼지지만 다른 사람의 작은 도움으로 다시 살아난다는 뜻입니다. 그래서 우리 안의 불꽃을 밝혀 준 사람들을 깊이 감사하게 생각할 이유가 있다는 말입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">has cause to think\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has reason to think\u003c/span>\u003cdiv class=\"w\">cause는 여기서 이유라는 뜻이므로 reason으로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">at times\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">sometimes\u003c/span>\u003cspan class=\"y-eq\">at times = sometimes\u003c/span>\u003cdiv class=\"w\">가끔이라는 뜻으로 더 쉬운 단어로 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">go out\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be extinguished\u003c/span>\u003cspan class=\"y-eq\">go out = be extinguished\u003c/span>\u003cdiv class=\"w\">불이나 빛이 꺼지다는 뜻으로 수동형으로 바꾸면 더 격식 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">gratitude\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">thankfulness\u003c/span>\u003cspan class=\"y-eq\">gratitude = thankfulness\u003c/span>\u003cdiv class=\"w\">감사하는 마음이라는 뜻으로 서로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Sometimes our own light dies out and is relit by another person’s spark. We should each feel deeply grateful to those who have lit the flame inside us.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"가끔 우리 안의 빛이 꺼지지만 다른 사람의 불꽃으로 다시 살아난다는 뜻입니다. 그래서 우리 안의 불꽃을 지펴 준 사람들을 깊이 감사하는 마음으로 생각할 이유가 있다는 말이에요.","hl":"mn"},{"n":42,"text":"has cause to think는 has reason to think로 바꿔 쓸 수 있습니다. 여기서 cause는 원인이나 이유라는 뜻이라서 reason으로 바꿔도 아주 자연스러워요.","hl":"rw"},{"n":43,"text":"at times는 sometimes로 바꿀 수 있고, go out은 be extinguished로 바꾸면 불이 꺼진다는 뜻이 더 격식 있게 표현됩니다. gratitude는 thankfulness와 같은 말이에요.","hl":"ph"},{"n":44,"text":"이 문장을 바꾸면 Sometimes our own light dies out and is relit by another person’s spark. We should each feel deeply grateful to those who have lit the flame inside us라고 할 수 있습니다. 다소 어려운 표현을 쉬운 표현으로 바꾸면서도 의미는 그대로 살렸습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 Regular exercise increases \u003cspan class=\"fx\">the amount of blood flowing through your brain\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Regular exercise increases\u003c/div>\u003cdiv class=\"k\">규칙적인 운동은 증가시킨다\u003c/div>\u003cdiv class=\"e\">the amount of blood\u003c/div>\u003cdiv class=\"k\">혈액의 양을\u003c/div>\u003cdiv class=\"e\">flowing through your brain.\u003c/div>\u003cdiv class=\"k\">당신의 뇌를 통해 흐르는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">the amount\u003c/b>를 of blood가 수식하고, blood를 현재분사 \u003cb class=\"key\">flowing\u003c/b>이 이끄는 형용사구가 수식한다. 뒤에서 앞의 명사를 순차적으로 꾸며 주는 구조다.\u003c/div>","segs":[{"n":45,"text":"Regular exercise increases, 규칙적인 운동은 증가시킨다. the amount of blood, 혈액의 양을. flowing through your brain, 당신의 뇌를 통해 흐르는","hl":"ch"},{"n":46,"text":"이 문장의 목적어는 the amount입니다. of blood가 amount를 꾸며 주고, 다시 flowing through your brain이 blood를 꾸며 주고 있어요. 이렇게 명사를 뒤에서 순차적으로 수식하는 구조는 블록으로 묶어서 읽으면 아주 쉽게 해석됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 Regular exercise increases \u003cspan class=\"fx\">the amount of blood flowing through your brain\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>규칙적인 운동은 뇌로 흐르는 혈액의 양을 늘린다는 뜻입니다. 운동이 신체뿐 아니라 뇌 기능에도 도움이 된다는 과학적 사실을 말합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">increases the amount of blood flowing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">increases blood flow\u003c/span>\u003cdiv class=\"w\">양을 늘린다는 표현을 blood flow 증가로 압축하면 간결해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">regular\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">consistent\u003c/span>\u003cspan class=\"y-eq\">regular = consistent\u003c/span>\u003cdiv class=\"w\">규칙적이라는 뜻으로 꾸준함을 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">amount\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">quantity\u003c/span>\u003cspan class=\"y-eq\">amount = quantity\u003c/span>\u003cdiv class=\"w\">양이라는 뜻으로 더 격식 있는 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">flow through\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">circulate through\u003c/span>\u003cspan class=\"y-eq\">flow through = circulate through\u003c/span>\u003cdiv class=\"w\">신체 기관을 통해 흐르다는 뜻으로 circulate가 더 의학적입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Exercising regularly boosts blood flow to your brain.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"규칙적인 운동이 뇌를 통과해 흐르는 혈액의 양을 증가시킨다는 뜻이에요. 운동이 뇌에 산소와 영양을 더 잘 공급하게 해 준다는 과학적인 내용입니다.","hl":"mn"},{"n":48,"text":"increases the amount of blood flowing은 increases blood flow로 바꿔 쓸 수 있습니다. 뜻은 같지만 혈류 증가라는 말을 더 짧고 힘 있게 표현했어요.","hl":"rw"},{"n":49,"text":"regular는 consistent, amount는 quantity로 바꿔 쓸 수 있어요. flow through는 circulate through로 바꾸면 신체 기관을 따라 흐른다는 뜻이 더 전문적으로 살아납니다.","hl":"ph"},{"n":50,"text":"이 문장을 패러프레이징하면 Exercising regularly boosts blood flow to your brain이라고 할 수 있습니다. regular exercise를 Exercising regularly로, increases the amount of blood flowing을 boosts blood flow로 짧게 바꿨어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 We should reduce \u003cspan class=\"fx\">hazardous and toxic chemicals released into the air and water\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We should reduce\u003c/div>\u003cdiv class=\"k\">우리는 줄여야 한다\u003c/div>\u003cdiv class=\"e\">hazardous and toxic chemicals\u003c/div>\u003cdiv class=\"k\">위험하고 유독한 화학물질을\u003c/div>\u003cdiv class=\"e\">released into the air and water.\u003c/div>\u003cdiv class=\"k\">대기와 물속으로 방출되는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">hazardous and toxic chemicals\u003c/b>를 과거분사 \u003cb class=\"key\">released\u003c/b>가 이끄는 형용사구가 수식한다. 화학물질이 방출되는 수동 관계라서 v-ed가 쓰였다.\u003c/div>","segs":[{"n":51,"text":"We should reduce, 우리는 줄여야 한다. hazardous and toxic chemicals, 위험하고 유독한 화학물질을. released into the air and water, 대기와 물속으로 방출되는","hl":"ch"},{"n":52,"text":"이 문장의 목적어는 hazardous and toxic chemicals입니다. 그 뒤에 released into the air and water가 화학물질을 꾸며 주는 과거분사구예요. 화학물질이 방출되는 수동 관계이기 때문에 과거분사가 쓰였습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 We should reduce \u003cspan class=\"fx\">hazardous and toxic chemicals released into the air and water\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>대기와 물로 배출되는 위험하고 유독한 화학물질을 줄여야 한다는 뜻입니다. 환경 오염을 줄이자는 실천적인 주장을 담고 있어요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">released into the air and water\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">that are released into the air and water\u003c/span>\u003cdiv class=\"w\">과거분사 수식을 관계대명사절로 풀면 수동 관계가 더 명확해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">hazardous\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">dangerous\u003c/span>\u003cspan class=\"y-eq\">hazardous = dangerous\u003c/span>\u003cdiv class=\"w\">위험하다는 뜻으로 더 일상적인 단어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">toxic\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">poisonous\u003c/span>\u003cspan class=\"y-eq\">toxic = poisonous\u003c/span>\u003cdiv class=\"w\">독성이 있다는 뜻으로 서로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">release\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">discharge\u003c/span>\u003cspan class=\"y-eq\">release = discharge\u003c/span>\u003cdiv class=\"w\">화학물질이나 오염물을 배출하다는 뜻으로 자주 교체됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We should cut down on dangerous, poisonous chemicals that are discharged into the air and water.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"위험하고 독성이 있는 화학물질이 공기와 물로 배출되는 것을 줄여야 한다는 뜻입니다. 환경 보호를 위해 오염 물질을 줄이자는 주장을 담고 있어요.","hl":"mn"},{"n":54,"text":"released into the air and water는 that are released into the air and water로 풀어 쓸 수 있습니다. 관계대명사절로 바꾸면 화학물질이 방출된다는 수동 의미가 더 분명해집니다.","hl":"rw"},{"n":55,"text":"hazardous는 dangerous, toxic은 poisonous로 바꿔 쓸 수 있어요. release는 discharge와 유의어라서 화학물질을 배출하다라는 뜻으로 함께 기억해 두세요.","hl":"ph"},{"n":56,"text":"이 문장을 패러프레이징하면 We should cut down on dangerous, poisonous chemicals that are discharged into the air and water라고 할 수 있습니다. reduce를 cut down on으로, released를 discharged로 바꾸어 같은 뜻을 나타냈습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 Certainly, Leonardo da Vinci had \u003cspan class=\"fx\">an unusual mind and an uncanny ability to see what others didn't see\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Certainly,\u003c/div>\u003cdiv class=\"k\">확실히\u003c/div>\u003cdiv class=\"e\">Leonardo da Vinci had\u003c/div>\u003cdiv class=\"k\">레오나르도 다빈치는 가졌다\u003c/div>\u003cdiv class=\"e\">an unusual mind and an uncanny ability\u003c/div>\u003cdiv class=\"k\">남다른 사고력과 뛰어난 능력을\u003c/div>\u003cdiv class=\"e\">to see\u003c/div>\u003cdiv class=\"k\">보는\u003c/div>\u003cdiv class=\"e\">what others didn't see.\u003c/div>\u003cdiv class=\"k\">다른 사람들이 보지 못한 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">an unusual mind and an uncanny ability\u003c/b>를 \u003cb class=\"key\">to see\u003c/b>가 이끄는 형용사구가 수식한다. see의 목적어로 \u003cb class=\"key\">what others didn't see\u003c/b>가 이어진다.\u003c/div>","segs":[{"n":57,"text":"Certainly, 확실히. Leonardo da Vinci had, 레오나르도 다빈치는 가졌다. an unusual mind and an uncanny ability, 남다른 사고력과 뛰어난 능력을. to see, 보는. what others didn't see, 다른 사람들이 보지 못한 것을","hl":"ch"},{"n":58,"text":"이 문장의 목적어는 an unusual mind and an uncanny ability입니다. to see가 ability를 꾸며 주는 형용사구이고, what others didn't see는 see의 목적어 역할을 하는 명사절이에요. ability와 to see를 한 블록으로 묶어야 자연스럽게 해석됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 Certainly, Leonardo da Vinci had \u003cspan class=\"fx\">an unusual mind and an uncanny ability to see what others didn't see\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>레오나르도 다빈치는 보통 사람과 다른 사고방식과 남들이 보지 못하는 것을 보는 놀라운 능력을 가졌다는 뜻입니다. 그의 천재성을 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ability to see\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">capacity to notice\u003c/span>\u003cdiv class=\"w\">ability를 capacity로, see를 notice로 바꾸면 세심하게 알아본다는 뉘앙스가 더 살아 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">certainly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">undoubtedly\u003c/span>\u003cspan class=\"y-eq\">certainly = undoubtedly\u003c/span>\u003cdiv class=\"w\">확실히라는 뜻으로 더 강한 확신을 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unusual\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">extraordinary\u003c/span>\u003cspan class=\"y-eq\">unusual = extraordinary\u003c/span>\u003cdiv class=\"w\">보통이 아니라는 뜻을 더 강하게 표현합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">uncanny\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">remarkable\u003c/span>\u003cspan class=\"y-eq\">uncanny = remarkable\u003c/span>\u003cdiv class=\"w\">놀라울 정도로 뛰어나다는 뜻으로 자주 바꿔 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Without doubt, Leonardo da Vinci had an extraordinary mind and a remarkable ability to notice what others did not.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"레오나르도 다빈치는 남다른 사고력과 다른 사람들이 보지 못한 것을 보는 뛰어난 능력을 가졌다는 뜻이에요. 그가 얼마나 독창적인 천재였는지를 강조하는 문장입니다.","hl":"mn"},{"n":60,"text":"ability to see는 capacity to notice로 바꿔 쓸 수 있습니다. ability보다 capacity가 잠재된 역량이라는 느낌을 주고, see보다 notice가 세심하게 알아본다는 뜻을 강조해요.","hl":"rw"},{"n":61,"text":"certainly는 undoubtedly, unusual은 extraordinary, uncanny는 remarkable과 유의어입니다. 세 표현 모두 사람의 능력이나 성격을 강조할 때 자주 나와요.","hl":"ph"},{"n":62,"text":"이 문장을 바꾸면 Without doubt, Leonardo da Vinci had an extraordinary mind and a remarkable ability to notice what others did not이라고 할 수 있습니다. certainly를 Without doubt로, uncanny를 remarkable로 바꿨어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 Scientists at NASA have spotted \u003cspan class=\"fx\">six asteroids heading in the direction of Earth\u003c/span>, with one of them having a size larger than the Empire State Building.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Scientists at NASA have spotted\u003c/div>\u003cdiv class=\"k\">NASA의 과학자들은 발견했다\u003c/div>\u003cdiv class=\"e\">six asteroids\u003c/div>\u003cdiv class=\"k\">여섯 개의 소행성을\u003c/div>\u003cdiv class=\"e\">heading in the direction of Earth,\u003c/div>\u003cdiv class=\"k\">지구 방향으로 향하는\u003c/div>\u003cdiv class=\"e\">with one of them having\u003c/div>\u003cdiv class=\"k\">그중 하나는 가진 채\u003c/div>\u003cdiv class=\"e\">a size larger than the Empire State Building.\u003c/div>\u003cdiv class=\"k\">엠파이어 스테이트 빌딩보다 더 큰 크기를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">six asteroids\u003c/b>를 현재분사 \u003cb class=\"key\">heading\u003c/b>이 이끄는 형용사구가 수식한다. \u003cb class=\"key\">with one of them having a size...\u003c/b>는 with + 목적어 + v-ing의 분사구문으로 덧붙여 설명한다.\u003c/div>","segs":[{"n":63,"text":"Scientists at NASA have spotted, NASA의 과학자들은 발견했다. six asteroids, 여섯 개의 소행성을. heading in the direction of Earth, 지구 방향으로 향하는. with one of them having, 그중 하나는 가진 채. a size larger than the Empire State Building, 엠파이어 스테이트 빌딩보다 더 큰 크기를","hl":"ch"},{"n":64,"t move로 간단히 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">larger than\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">bigger than\u003c/span>\u003cspan class=\"y-eq\">larger than = bigger than\u003c/span>\u003cdiv class=\"w\">크기를 비교할 때 두 표현은 서로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">NASA scientists have detected six asteroids moving toward Earth, one of which is larger than the Empire State Building.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"NASA 과학자들이 지구 방향으로 향하는 소행성 여섯 개를 발견했는데, 그중 하나는 엠파이어 스테이트 빌딩보다 더 크다는 뜻입니다. 소행성의 이동 방향과 크기를 함께 알려 주는 문장이에요.","hl":"mn"},{"n":66,"text":"heading in the direction of Earth는 moving toward Earth로 바꿔 쓸 수 있습니다. with one of them having도 one of which has로 바꾸면 크기 정보를 더 깔끔하게 전달할 수 있어요.","hl":"rw"},{"n":67,"text":"spot은 detect로, head는 move로 바꿔 쓸 수 있어요. larger than은 bigger than과 같은 뜻이라서 크기 비교에서 자주 교체됩니다.","hl":"ph"},{"n":68,"text":"이 문장을 패러프레이징하면 NASA scientists have detected six asteroids moving toward Earth, one of which is larger than the Empire State Building이라고 할 수 있습니다. with one of them having을 one of which is larger than으로 바꿔 더 자연스럽게 표현했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Google and other carmakers around the world are developing \u003cspan class=\"fx\">technologies applied to currently &quot;manned&quot; vehicles\u003c/span> to permit drivers to take their hands off the wheel and focus on other tasks.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Google and other carmakers around the world\u003c/div>\u003cdiv class=\"k\">구글과 전 세계의 다른 자동차 제조업체들은\u003c/div>\u003cdiv class=\"e\">are developing technologies\u003c/div>\u003cdiv class=\"k\">기술들을 개발하고 있다\u003c/div>\u003cdiv class=\"e\">applied to currently &quot;manned&quot; vehicles\u003c/div>\u003cdiv class=\"k\">현재 유인 차량에 적용되는\u003c/div>\u003cdiv class=\"e\">to permit drivers to take their hands off the wheel\u003c/div>\u003cdiv class=\"k\">운전자들이 핸들에서 손을 떼는 것을 허용하도록\u003c/div>\u003cdiv class=\"e\">and focus on other tasks.\u003c/div>\u003cdiv class=\"k\">그리고 다른 업무에 집중하도록\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>목적어 \u003cb class=\"key\">technologies\u003c/b>를 과거분사 \u003cb class=\"key\">applied\u003c/b>가 이끄는 형용사구가 수식한다. \u003cb class=\"key\">to permit...\u003c/b>는 목적을 나타내는 to부정사 부사적 용법이다.\u003c/div>","segs":[{"n":69,"text":"Google and other carmakers around the world, 구글과 전 세계의 다른 자동차 제조업체들은. are developing technologies, 기술들을 개발하고 있다. applied to currently \"manned\" vehicles, 현재 유인 차량에 적용되는. to permit drivers to take their hands off the wheel, 운전자들이 핸들에서 손을 떼는 것을 허용하도록. and focus on other tasks, 그리고 다른 업무에 집중하도록","hl":"ch"},{"n":70,"text":"이 문장의 목적어는 technologies입니다. 뒤에 applied to currently manned vehicles가 technologies를 꾸며 주는 과거분사구예요. to permit drivers to take their hands off the wheel은 목적을 나타내는 to부정사로, 기술을 개발하는 이유를 설명해 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Google and other carmakers around the world are developing \u003cspan class=\"fx\">technologies applied to currently &quot;manned&quot; vehicles\u003c/span> to permit drivers to take their hands off the wheel and focus on other tasks.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>구글과 여러 자동차 회사가 현재 운전자가 타는 차량에 적용할 기술을 개발하고 있다는 뜻입니다. 이 기술은 운전자가 핸들에서 손을 떼고 다른 일에 집중할 수 있도록 해 줍니다. 자율주행 기술의 목적을 설명합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">applied to currently &quot;manned&quot; vehicles\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">that are applied to current manned vehicles\u003c/span>\u003cdiv class=\"w\">과거분사 수식을 관계대명사절로 풀어 적용 대상이 더 분명해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">currently\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">now\u003c/span>\u003cspan class=\"y-eq\">currently = now\u003c/span>\u003cdiv class=\"w\">현재라는 뜻으로 더 짧고 쉬운 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">manned\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">occupied\u003c/span>\u003cspan class=\"y-eq\">manned = occupied\u003c/span>\u003cdiv class=\"w\">사람이 탑승한 상태라는 뜻으로 occupied로 바꿀 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">permit\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">allow\u003c/span>\u003cspan class=\"y-eq\">permit = allow\u003c/span>\u003cdiv class=\"w\">허용하다는 뜻으로 서로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Google and other automakers worldwide are creating technologies for current manned vehicles so that drivers can take their hands off the wheel and concentrate on other tasks.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"구글과 전 세계 자동차 회사들이 현재 사람이 운전하는 차량에 적용할 기술을 개발하고 있다는 뜻입니다. 그 기술 덕분에 운전자는 핸들에서 손을 떼고 다른 일에 집중할 수 있어요. 결국 자율주행 기술의 목적을 말하는 문장입니다.","hl":"mn"},{"n":72,"text":"applied to currently manned vehicles는 that are applied to current manned vehicles로 풀어 쓸 수 있습니다. 관계대명사절로 바꾸면 어떤 차량에 적용되는지가 더 분명하게 읽혀요.","hl":"rw"},{"n":73,"text":"currently는 now로, manned는 occupied로, permit은 allow로 바꿔 쓸 수 있어요. 특히 permit과 allow는 시험에서 유의어로 아주 자주 출제됩니다.","hl":"ph"},{"n":74,"text":"이 문장을 패러프레이징하면 Google and other automakers worldwide are creating technologies for current manned vehicles so that drivers can take their hands off the wheel and concentrate on other tasks라고 할 수 있습니다. to permit 이하를 so that drivers can으로 바꿔 목적을 더 명확하게 표현했어요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>오늘 배운 핵심 구문은 \u003cb class=\"key\">목적어 + 형용사구\u003c/b>입니다.\u003c/li>\u003cli>목적어는 \u003cb class=\"key\">to-v\u003c/b>, \u003cb class=\"key\">v-ing\u003c/b>, \u003cb class=\"key\">v-ed\u003c/b>, \u003cb class=\"key\">전치사구\u003c/b>가 뒤에서 수식할 수 있고, 수동이면 \u003cb class=\"key\">v-ed\u003c/b>, 능동이면 \u003cb class=\"key\">v-ing\u003c/b>를 쓴다.\u003c/li>\u003cli>목적어만 해석하지 말고 뒤의 수식어까지 \u003cb class=\"key\">한 블록\u003c/b>으로 묶어야 독해가 빨라진다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 목적어 뒤에서 그 목적어를 꾸며 주는 형용사구를 집중해서 연습했어요. 목적어 뒤에 to부정사나 분사, 전치사구가 보이면 한 덩어리로 묶어서 해석하는 습관이 중요합니다. 앞으로 긴 문장을 만나면 먼저 동사와 목적어를 찾고, 목적어 뒤의 수식어를 블록으로 묶어 보세요. 오늘 배운 문장 열두 개를 소리 내어 다시 읽어 보면 해석 속도가 훨씬 좋아질 거예요.","hl":"sum"}]}]});</script></body></html>
