  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};

lecturePlayer(document.getElementById("app"),{"brand":"unit10","title":"마법같은 블록구문 실전편 Unit07 명사구 목적어","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>명사구 목적어 완전 정복: to부정사 vs 동명사, 그리고 의문사+to부정사\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>동사의 목적어 자리에 오는 to부정사, 동명사, 의문사+to부정사를 구분해 자연스럽게 해석한다!\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마법같은 블록구문 실전편에서 명사구 목적어를 집중적으로 배워 볼게요. 영어 문장에서 목적어 자리에 to부정사가 오는 동사, 동명사가 오는 동사, 그리고 의문사에 to부정사가 붙은 명사구까지 한 번에 정리합니다. 이걸 익히면 독해 속도가 확 올라가요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">to부정사와 동명사는 문장에서 명사처럼 목적어 역할을 하며, 동사마다 목적어로 취하는 형태가 정해져 있다. \u003cb class=\"key\">agree, promise, refuse, decide\u003c/b> 등은 to부정사를, \u003cb class=\"key\">enjoy, mind, admit, deny, stop\u003c/b> 등은 동명사를 목적어로 취한다. \u003cb class=\"key\">forget, remember, regret\u003c/b>은 to부정사와 동명사에 따라 의미가 달라진다. \u003cb class=\"key\">의문사+to부정사\u003c/b>는 명사구로 목적어가 된다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Both countries agreed \u003cspan class=\"fx\">to abolish their tariff walls\u003c/span> within 5 years.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 I particularly enjoyed \u003cspan class=\"fx\">driving through the countryside\u003c/span> with you.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 I don't mind listening to advice that I've asked for, but I refuse to be preached at.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 I almost forgot the storyline of the Disney movie Frozen, but I do remember \u003cspan class=\"fx\">waiting in line\u003c/span> to see the movie.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 Politicians are the same all over. They promise \u003cspan class=\"fx\">to build a bridge\u003c/span> even where there is no river.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 No one's instincts are always correct; so how do you know \u003cspan class=\"fx\">when to follow them and when to ignore them\u003c/span>?\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 The drunken man admitted stealing the car, but denied driving it under the influence of alcohol.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Once I forgot to turn off the oven and I shall never forget seeing the expression on the faces of the rest of the family when they realized they had nothing to eat.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 We stopped \u003cspan class=\"fx\">checking for monsters\u003c/span> under our bed when we realized they were inside us.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 After careful consideration of your proposal, I regret \u003cspan class=\"fx\">to say\u003c/span> that we are unable to accept it.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 I've never regretted \u003cspan class=\"fx\">saying a kind word\u003c/span> to someone, but I have regretted plenty of mean things I have said and done.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Life will knock us down, but we can choose \u003cspan class=\"fx\">whether or not to stand back up\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"이번 유닛의 핵심은 딱 하나예요. 목적어 자리에 오는 명사구를 블록으로 묶어서 읽는 겁니다. to부정사와 동명사는 명사처럼 목적어 역할을 하고, 동사마다 어떤 것을 목적어로 취할지 정해져 있어요. enjoy나 mind 같은 동사는 뒤에 동명사만 오고, agree나 promise 같은 동사는 to부정사만 온다는 걸 기억하세요. forget이나 remember처럼 둘 다 오지만 뜻이 달라지는 동사도 중요합니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Both countries agreed \u003cspan class=\"fx\">to abolish their tariff walls\u003c/span> within 5 years.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Both countries agreed\u003c/div>\u003cdiv class=\"k\">양국은 동의했다\u003c/div>\u003cdiv class=\"e\">to abolish their tariff walls\u003c/div>\u003cdiv class=\"k\">그들의 관세 장벽을 철폐하는 것을\u003c/div>\u003cdiv class=\"e\">within 5 years.\u003c/div>\u003cdiv class=\"k\">5년 내에\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>agree는 to부정사를 목적어로 취하는 동사로, \u003cb class=\"key\">to abolish their tariff walls\u003c/b>가 agreed의 목적어 역할을 하는 명사구이다.\u003c/div>","segs":[{"n":3,"text":"Both countries agreed, 양국은 동의했다. to abolish their tariff walls, 그들의 관세 장벽을 철폐하는 것을. within 5 years, 5년 내에","hl":"ch"},{"n":4,"text":"첫 번째 문장에서는 agree가 to부정사를 목적어로 취하는 동사라는 점이 핵심이에요. to abolish their tariff walls가 agreed의 목적어 덩어리로, 무엇에 동의했는지를 나타냅니다. agree는 뒤에 to부정사가 와야 자연스럽다는 걸 꼭 기억하세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Both countries agreed \u003cspan class=\"fx\">to abolish their tariff walls\u003c/span> within 5 years.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>양국이 5년 안에 관세 장벽을 없애기로 합의했다는 뜻이다. 단순히 동의했다가 아니라 제도나 장벽을 공식적으로 폐지한다는 뉘앙스가 담겨 있다. 무역 장벽을 철폐하는 공식 합의를 나타낸다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">agreed to abolish\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">agreed that they would abolish\u003c/span>\u003cdiv class=\"w\">to부정사 목적어를 that절로 바꿔 같은 의미를 전달하며 더 문어체적인 느낌을 준다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">within 5 years\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in 5 years\u003c/span>\u003cdiv class=\"w\">within은 기간 안에라는 뜻이고 in은 ~후에라는 뜻이지만 문맥상 5년 이내로 해석 가능하다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">abolish\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">eliminate\u003c/span>\u003cspan class=\"y-eq\">abolish = eliminate\u003c/span>\u003cdiv class=\"w\">abolish를 eliminate로 바꾸면 없애다라는 의미가 그대로 전달된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">tariff walls\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">trade barriers\u003c/span>\u003cspan class=\"y-eq\">tariff walls = trade barriers\u003c/span>\u003cdiv class=\"w\">관세 장벽을 더 일반적인 무역 장벽으로 표현했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">agreed to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">consented to\u003c/span>\u003cspan class=\"y-eq\">agree to = consent to\u003c/span>\u003cdiv class=\"w\">agree를 consent로 바꾸면 격식을 갖춘 표현이 된다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Both countries consented to eliminate their trade barriers within five years.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 두 나라가 앞으로 오 년 안에 서로의 관세 장벽을 없애기로 합의했다는 내용이에요. 단순히 동의했다가 아니라 제도나 장벽을 공식적으로 폐지한다는 의미가 담겨 있습니다.","hl":"mn"},{"n":6,"text":"agreed to abolish는 agreed that they would abolish로 바꿔 쓸 수 있어요. to부정사 대신 that절을 쓰면 더 문어체적인 느낌이 되죠. within five years는 in five years로 바꿔도 뜻이 크게 다르지 않습니다.","hl":"rw"},{"n":7,"text":"abolish는 eliminate나 do away with로 바꿀 수 있고, tariff walls는 trade barriers로 표현해도 됩니다. agree to 대신 consent to를 쓰면 더 격식을 갖춘 표현이 돼요.","hl":"ph"},{"n":8,"text":"이 문장 전체를 바꿔 보면 Both countries consented to eliminate their trade barriers within five years. 같은 의미지만 동사와 어구가 한 단계 올라간 표현이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 I particularly enjoyed \u003cspan class=\"fx\">driving through the countryside\u003c/span> with you.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I particularly enjoyed\u003c/div>\u003cdiv class=\"k\">나는 특히 즐겼다\u003c/div>\u003cdiv class=\"e\">driving through the countryside\u003c/div>\u003cdiv class=\"k\">시골을 드라이브하는 것을\u003c/div>\u003cdiv class=\"e\">with you.\u003c/div>\u003cdiv class=\"k\">당신과 함께\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>enjoy는 동명사를 목적어로 취하는 동사로, \u003cb class=\"key\">driving through the countryside\u003c/b>가 enjoyed의 목적어 역할을 하는 명사구이다.\u003c/div>","segs":[{"n":9,"text":"I particularly enjoyed, 나는 특히 즐겼다. driving through the countryside, 시골을 드라이브하는 것을. with you, 당신과 함께","hl":"ch"},{"n":10,"text":"두 번째 문장은 enjoy가 동명사를 목적어로 취하는 대표적인 경우예요. driving through the countryside가 enjoyed의 목적어 자리에 있는 명사구입니다. enjoy는 to부정사를 목적어로 쓰지 않으니 enjoy to drive가 아니라 enjoy driving으로 쓰는 게 맞아요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 I particularly enjoyed \u003cspan class=\"fx\">driving through the countryside\u003c/span> with you.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>특히 당신과 함께 시골을 드라이브한 것을 즐겼다는 뜻이다. 이미 지난 경험을 떠올리며 그 행동 자체를 즐겼다는 뉘앙스가 담겨 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">driving through the countryside\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">going for a drive through the countryside\u003c/span>\u003cdiv class=\"w\">driving을 명사적 표현 going for a drive로 바꿔 더 구어적으로 표현했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">particularly enjoyed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">especially liked\u003c/span>\u003cdiv class=\"w\">particularly와 especially는 유의어이고 enjoyed를 liked로 바꾸면 더 쉬운 표현이 된다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">particularly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">especially\u003c/span>\u003cspan class=\"y-eq\">particularly = especially\u003c/span>\u003cdiv class=\"w\">부사 유의어로 뜻이 같다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">enjoyed\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">liked\u003c/span>\u003cspan class=\"y-eq\">enjoy = like\u003c/span>\u003cdiv class=\"w\">enjoy를 like로 바꾸면 더 일상적인 표현이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">countryside\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rural area\u003c/span>\u003cspan class=\"y-eq\">countryside = rural area\u003c/span>\u003cdiv class=\"w\">시골 지역을 더 공식적으로 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I especially liked taking a drive through the rural area with you.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장은 상대방과 함께 시골길을 드라이브한 일이 특별히 즐거웠다는 뜻이에요. 이미 지난 경험을 떠올리며 그 행동 자체를 즐겼다는 뉘앙스가 담겨 있습니다.","hl":"mn"},{"n":12,"text":"driving through the countryside는 going for a drive through the countryside로 바꿔 쓸 수 있어요. particularly enjoyed는 especially liked로 바꾸면 더 쉬운 표현이 됩니다.","hl":"rw"},{"n":13,"text":"particularly는 especially와 바꿔 쓸 수 있고, enjoyed는 liked로 바꿔도 자연스러워요. countryside는 rural area로 표현하면 시골 지역이라는 뜻이 더 명확해집니다.","hl":"ph"},{"n":14,"text":"전체를 바꾸면 I especially liked taking a drive through the rural area with you. enjoy와 like, countryside와 rural area를 활용해 같은 의미를 좀 더 다양하게 표현한 거예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 I don't mind listening to advice that I've asked for, but I refuse to be preached at.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I don't mind\u003c/div>\u003cdiv class=\"k\">나는 싫어하지 않는다\u003c/div>\u003cdiv class=\"e\">listening to advice\u003c/div>\u003cdiv class=\"k\">조언을 경청하는 것을\u003c/div>\u003cdiv class=\"e\">that I've asked for,\u003c/div>\u003cdiv class=\"k\">[내가 요청한]\u003c/div>\u003cdiv class=\"e\">but I refuse\u003c/div>\u003cdiv class=\"k\">그러나 나는 거부한다\u003c/div>\u003cdiv class=\"e\">to be preached at.\u003c/div>\u003cdiv class=\"k\">훈계 듣는 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>mind는 동명사를 목적어로 취하고, refuse는 to부정사를 목적어로 취한다. \u003cb class=\"key\">listening to advice\u003c/b>는 mind의 목적어, \u003cb class=\"key\">to be preached at\u003c/b>는 refuse의 목적어이며 수동태 to부정사이다. that ~ for는 advice를 수식하는 형용사절이다.\u003c/div>","segs":[{"n":15,"text":"I don't mind, 나는 싫어하지 않는다. listening to advice, 조언을 경청하는 것을. that I've asked for, [내가 요청한]. but I refuse, 그러나 나는 거부한다. to be preached at, 훈계 듣는 것을","hl":"ch"},{"n":16,"text":"세 번째 문장에는 명사구 목적어가 두 개 나와요. mind는 동명사를 목적어로 취하므로 listening to advice가 오고, refuse는 to부정사를 목적어로 취하므로 to be preached at이 왔습니다. 특히 to be preached at은 to부정사의 수동태 형태로, 훈계를 받는 입장이라는 걸 나타내요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 I don't mind listening to advice that I've asked for, but I refuse to be preached at.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>내가 요청한 조언은 기꺼이 듣지만, 일방적으로 훈계받는 것은 거부한다는 뜻이다. 상대방이 내 동의 없이 가르치려 드는 태도를 경계하는 뉘앙스가 담겨 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">don't mind listening to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">am willing to listen to\u003c/span>\u003cdiv class=\"w\">don't mind를 긍정적 willing으로 바꿔 같은 의미를 더 적극적으로 표현했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">refuse to be preached at\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">will not allow myself to be lectured\u003c/span>\u003cdiv class=\"w\">refuse를 allow myself로 바꿔 수동적 거부를 더 명확히 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">mind\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">object to\u003c/span>\u003cspan class=\"y-eq\">don't mind = don't object to\u003c/span>\u003cdiv class=\"w\">mind를 object to로 바꾸면 꺼리다는 의미가 그대로 전달된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">advice\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">counsel\u003c/span>\u003cspan class=\"y-eq\">advice = counsel\u003c/span>\u003cdiv class=\"w\">advice를 counsel로 바꾸면 격식 있는 표현이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">preach at\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">lecture\u003c/span>\u003cspan class=\"y-eq\">preach at = lecture\u003c/span>\u003cdiv class=\"w\">preach at을 lecture로 바꾸면 훈계하다는 뜻이 된다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I am willing to listen to advice I asked for, but I will not allow myself to be lectured.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 내가 먼저 요청한 조언은 잘 듣겠지만, 일방적으로 설교하듯 훈계하는 것은 거부하겠다는 뜻이에요. 상대방이 내 동의 없이 가르치려 드는 태도를 경계하는 뉘앙스입니다.","hl":"mn"},{"n":18,"text":"don't mind listening to는 am willing to listen to로 바꾸면 더 적극적인 표현이 돼요. refuse to be preached at은 will not allow myself to be lectured로 바꿔 쓸 수 있습니다.","hl":"rw"},{"n":19,"text":"mind는 object to로 바꿔 쓸 수 있고, advice는 counsel로 격식 있게 표현할 수 있어요. preach at은 lecture로 바꾸면 훈계하다라는 뜻이 그대로 살아 있습니다.","hl":"ph"},{"n":20,"text":"전체를 바꾸면 I am willing to listen to advice I asked for, but I will not allow myself to be lectured. 핵심은 내가 원한 조언과 원치 않은 훈계를 대비시키는 거예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 I almost forgot the storyline of the Disney movie Frozen, but I do remember \u003cspan class=\"fx\">waiting in line\u003c/span> to see the movie.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I almost forgot\u003c/div>\u003cdiv class=\"k\">나는 거의 잊었다\u003c/div>\u003cdiv class=\"e\">the storyline of the Disney movie Frozen,\u003c/div>\u003cdiv class=\"k\">디즈니 영화 겨울왕국의 줄거리를\u003c/div>\u003cdiv class=\"e\">but I do remember\u003c/div>\u003cdiv class=\"k\">그러나 나는 정말 기억한다\u003c/div>\u003cdiv class=\"e\">waiting in line\u003c/div>\u003cdiv class=\"k\">줄을 서서 기다린 것을\u003c/div>\u003cdiv class=\"e\">to see the movie.\u003c/div>\u003cdiv class=\"k\">그 영화를 보기 위해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>remember는 동명사를 목적어로 취하면 과거의 일을 기억한다는 의미이다. \u003cb class=\"key\">waiting in line\u003c/b>이 remember의 목적어인 동명사구이며, to see the movie는 목적의 to부정사이다. 동사 remember를 강조하기 위해 do가 쓰였다.\u003c/div>","segs":[{"n":21,"text":"I almost forgot, 나는 거의 잊었다. the storyline of the Disney movie Frozen, 디즈니 영화 겨울왕국의 줄거리를. but I do remember, 그러나 나는 정말 기억한다. waiting in line, 줄을 서서 기다린 것을. to see the movie, 그 영화를 보기 위해","hl":"ch"},{"n":22,"text":"네 번째 문장은 remember가 동명사를 목적어로 취하는 경우예요. remember 뒤에 waiting in line이 오면 과거에 줄 서서 기다렸던 일을 기억한다는 뜻입니다. remember to wait으로 쓰면 앞으로 기다릴 일을 기억한다는 뜻이 되니 전혀 달라져요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 I almost forgot the storyline of the Disney movie Frozen, but I do remember \u003cspan class=\"fx\">waiting in line\u003c/span> to see the movie.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>영화 줄거리는 거의 잊었지만, 영화를 보려고 줄 서서 기다렸던 경험은 선명히 기억한다는 뜻이다. 스토리보다 그때의 상황이 더 강하게 기억에 남은 것을 나타낸다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">do remember waiting\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">clearly remember waiting\u003c/span>\u003cdiv class=\"w\">do 강조를 clearly라는 부사로 바꿔 강조의 의미를 더 명시적으로 전달했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">waiting in line to see\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">queuing to see\u003c/span>\u003cdiv class=\"w\">waiting in line을 queuing으로 바꿔 영국식 표현을 사용했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">almost forgot\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">nearly forgot\u003c/span>\u003cspan class=\"y-eq\">almost = nearly\u003c/span>\u003cdiv class=\"w\">almost를 nearly로 바꿔 같은 의미를 전달했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">do remember\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">clearly remember\u003c/span>\u003cspan class=\"y-eq\">do remember = clearly remember\u003c/span>\u003cdiv class=\"w\">do 강조를 명시적인 부사로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">waiting in line\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">standing in line\u003c/span>\u003cspan class=\"y-eq\">wait in line = stand in line\u003c/span>\u003cdiv class=\"w\">줄 서서 기다리다를 stand in line으로 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I nearly forgot the plot of Frozen, but I clearly remember standing in line to see it.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 영화 겨울왕국의 줄거리는 거의 잊었는데, 영화를 보려고 줄 서서 기다렸던 경험은 오히려 또렷이 기억한다는 의미예요. 내용보다 그때의 상황이 더 강하게 남은 거죠.","hl":"mn"},{"n":24,"text":"do remember waiting은 clearly remember waiting으로 바꿔 쓸 수 있어요. do가 동사를 강조하는 역할인데, clearly 같은 부사를 쓰면 같은 의미를 더 명시적으로 전달합니다. waiting in line은 queuing으로 바꿔도 됩니다.","hl":"rw"},{"n":25,"text":"almost forgot은 nearly forgot으로 바꿀 수 있고, waiting in line은 standing in line으로 표현해도 자연스러워요. do remember는 clearly remember로 바꾸면 강조의 의미가 살아 있습니다.","hl":"ph"},{"n":26,"text":"전체를 바꾸면 I nearly forgot the plot of Frozen, but I clearly remember standing in line to see it. storyline을 plot으로, waiting in line을 standing in line으로 바꿔 같은 뜻을 전달했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Politicians are the same all over. They promise \u003cspan class=\"fx\">to build a bridge\u003c/span> even where there is no river.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Politicians are the same all over.\u003c/div>\u003cdiv class=\"k\">정치인들은 어디서나 똑같다\u003c/div>\u003cdiv class=\"e\">They promise\u003c/div>\u003cdiv class=\"k\">그들은 약속한다\u003c/div>\u003cdiv class=\"e\">to build a bridge\u003c/div>\u003cdiv class=\"k\">다리를 놓을 것을\u003c/div>\u003cdiv class=\"e\">even where there is no river.\u003c/div>\u003cdiv class=\"k\">강이 없는 곳에도\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>promise는 to부정사를 목적어로 취하는 동사로, \u003cb class=\"key\">to build a bridge\u003c/b>가 promise의 목적어 역할을 하는 명사구이다.\u003c/div>","segs":[{"n":27,"text":"Politicians are the same all over, 정치인들은 어디서나 똑같다. They promise, 그들은 약속한다. to build a bridge, 다리를 놓을 것을. even where there is no river, 강이 없는 곳에도","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 promise가 to부정사를 목적어로 취한다는 점이 포인트예요. to build a bridge가 promise의 목적어로, 무엇을 약속했는지 나타냅니다. promise는 뒤에 to부정사만 오는 동사라는 걸 기억하세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Politicians are the same all over. They promise \u003cspan class=\"fx\">to build a bridge\u003c/span> even where there is no river.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>정치인들은 어디서나 똑같아서, 강이 없는 곳에도 다리를 놓겠다고 약속한다는 풍자이다. 실제로 필요하지 않은 일을 약속하는 정치인들의 행태를 꼬집은 말이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">promise to build\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make a promise to build\u003c/span>\u003cdiv class=\"w\">promise를 명사형으로 바꿔 같은 의미를 전달하면서 약속의 행위를 부각한다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">even where there is no river\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">even if there is no river\u003c/span>\u003cdiv class=\"w\">where 대신 if를 써서 조건의 느낌을 더 강조했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">all over\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">everywhere\u003c/span>\u003cspan class=\"y-eq\">all over = everywhere\u003c/span>\u003cdiv class=\"w\">all over를 everywhere로 바꿔 더 간단하게 표현했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">promise to build\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">pledge to build\u003c/span>\u003cspan class=\"y-eq\">promise = pledge\u003c/span>\u003cdiv class=\"w\">promise를 pledge로 바꾸면 공식적인 약속의 의미가 강해진다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">build a bridge\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">construct a bridge\u003c/span>\u003cspan class=\"y-eq\">build = construct\u003c/span>\u003cdiv class=\"w\">build를 construct로 바꾸면 격식 있는 표현이 된다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Politicians are the same everywhere. They pledge to construct a bridge even where no river exists.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 정치인들은 어디서나 똑같아서 강이 없는 곳에도 다리를 놓아 주겠다고 약속한다는 풍자예요. 실제로 필요하지 않은 일을 약속하는 정치인들의 모습을 꼬집은 말입니다.","hl":"mn"},{"n":30,"text":"promise to build는 make a promise to build로 바꿔 쓸 수 있어요. even where there is no river는 even if there is no river로 바꾸면 조건의 느낌이 더 강해집니다.","hl":"rw"},{"n":31,"text":"all over는 everywhere로 바꿀 수 있고, promise는 pledge로 바꾸면 더 공식적인 약속이 됩니다. build a bridge는 construct a bridge로 표현해도 좋아요.","hl":"ph"},{"n":32,"text":"전체를 바꾸면 Politicians are the same everywhere. They pledge to construct a bridge even where no river exists. 같은 풍자적 의미를 좀 더 격식 있는 어휘로 전달했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 No one's instincts are always correct; so how do you know \u003cspan class=\"fx\">when to follow them and when to ignore them\u003c/span>?\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">No one's instincts are always correct;\u003c/div>\u003cdiv class=\"k\">어느 누구의 본능도 항상 올바르지는 않다\u003c/div>\u003cdiv class=\"e\">so how do you know\u003c/div>\u003cdiv class=\"k\">그렇다면 당신은 어떻게 아는가\u003c/div>\u003cdiv class=\"e\">when to follow them\u003c/div>\u003cdiv class=\"k\">언제 그것을 따라야 할지\u003c/div>\u003cdiv class=\"e\">and when to ignore them?\u003c/div>\u003cdiv class=\"k\">그리고 언제 그것을 무시해야 할지를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">when to follow them\u003c/b>과 \u003cb class=\"key\">when to ignore them\u003c/b>은 '의문사+to부정사' 형태의 명사구로, 동사 know의 목적어 역할을 한다.\u003c/div>","segs":[{"n":33,"text":"No one's instincts are always correct, 어느 누구의 본능도 항상 올바르지는 않다. so how do you know, 그렇다면 당신은 어떻게 아는가. when to follow them, 언제 그것을 따라야 할지. and when to ignore them?, 그리고 언제 그것을 무시해야 할지를","hl":"ch"},{"n":34,"text":"여섯 번째 문장에는 의문사와 to부정사가 결합한 명사구가 나와요. when to follow them과 when to ignore them이 how do you know의 목적어로 쓰였습니다. 이처럼 의문사에 to부정사가 붙으면 언제 해야 할지, 무엇을 해야 할지 같은 명사 덩어리가 되어 목적어 자리에 올 수 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 No one's instincts are always correct; so how do you know \u003cspan class=\"fx\">when to follow them and when to ignore them\u003c/span>?\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>누구의 본능도 항상 옳지 않으니, 언제 본능을 따르고 무시할지 어떻게 아느냐는 질문이다. 본능을 맹신하지 말고 판단하라는 메시지가 담겨 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">when to follow them\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">when you should follow them\u003c/span>\u003cdiv class=\"w\">의문사+to부정사를 주어를 넣은 절로 바꿔 더 명시적으로 표현했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">how do you know\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">how can you tell\u003c/span>\u003cdiv class=\"w\">know를 tell로 바꿔 구별하다는 뉘앙스를 강조했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">correct\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">right\u003c/span>\u003cspan class=\"y-eq\">correct = right\u003c/span>\u003cdiv class=\"w\">correct를 right로 바꿔 일상적인 표현을 사용했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ignore\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">disregard\u003c/span>\u003cspan class=\"y-eq\">ignore = disregard\u003c/span>\u003cdiv class=\"w\">ignore를 disregard로 바꾸면 더 격식 있는 표현이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">instincts\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">intuition\u003c/span>\u003cspan class=\"y-eq\">instincts = intuition\u003c/span>\u003cdiv class=\"w\">instincts를 intuition으로 바꾸면 직관이라는 뜻이 더 명확해진다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Nobody's intuition is always right; so how can you tell when you should follow it and when you should ignore it?\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 본능이 항상 옳은 건 아니니까, 언제 본능을 따라야 하고 언제 무시해야 하는지 어떻게 알 수 있겠냐는 질문이에요. 본능을 맹신하지 말고 판단하라는 메시지가 담겨 있습니다.","hl":"mn"},{"n":36,"text":"when to follow them은 when you should follow them처럼 주어를 넣어 절로 바꿔 쓸 수 있어요. how do you know는 how can you tell로 바꾸면 구별해서 알다는 뉘앙스가 더 살아납니다.","hl":"rw"},{"n":37,"text":"correct는 right로, ignore는 disregard로 바꿔 쓸 수 있어요. instincts는 intuition으로 표현하면 직관이라는 뜻이 더 명확해집니다.","hl":"ph"},{"n":38,"text":"전체를 바꾸면 Nobody's intuition is always right; so how can you tell when you should follow it and when you should ignore it? 의문사와 to부정사를 절로 풀어서 같은 의미를 전달했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 The drunken man admitted stealing the car, but denied driving it under the influence of alcohol.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The drunken man admitted\u003c/div>\u003cdiv class=\"k\">그 술 취한 남자는 시인했다\u003c/div>\u003cdiv class=\"e\">stealing the car,\u003c/div>\u003cdiv class=\"k\">그 차를 훔쳤음을\u003c/div>\u003cdiv class=\"e\">but denied\u003c/div>\u003cdiv class=\"k\">하지만 부인했다\u003c/div>\u003cdiv class=\"e\">driving it\u003c/div>\u003cdiv class=\"k\">그것을 운전한 것을\u003c/div>\u003cdiv class=\"e\">under the influence of alcohol.\u003c/div>\u003cdiv class=\"k\">술에 취한 상태로\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>admit과 deny는 동명사를 목적어로 취하는 동사로, \u003cb class=\"key\">stealing the car\u003c/b>와 \u003cb class=\"key\">driving it\u003c/b>이 각각 admitted와 denied의 목적어 역할을 하는 동명사구이다.\u003c/div>","segs":[{"n":39,"text":"The drunken man admitted, 그 술 취한 남자는 시인했다. stealing the car, 그 차를 훔쳤음을. but denied, 하지만 부인했다. driving it, 그것을 운전한 것을. under the influence of alcohol, 술에 취한 상태로","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 admit과 deny가 나란히 나오는데, 둘 다 동명사를 목적어로 취하는 동사예요. stealing the car가 admitted의 목적어, driving it이 denied의 목적어로 쓰였습니다. admit to부정사나 deny to부정사는 틀린 표현이니 주의하세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 The drunken man admitted stealing the car, but denied driving it under the influence of alcohol.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>술 취한 남자가 차를 훔친 것은 인정했지만, 술에 취한 상태로 운전한 것은 부인했다는 뜻이다. 자신에게 불리한 부분만 일부 부인하는 모습을 보여 준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">admitted stealing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">admitted that he had stolen\u003c/span>\u003cdiv class=\"w\">동명사 목적어를 that절로 바꿔 시제를 명시적으로 표현했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">denied driving it\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">denied that he had driven it\u003c/span>\u003cdiv class=\"w\">동명사를 that절로 바꿔 더 명확하게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">drunken\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">intoxicated\u003c/span>\u003cspan class=\"y-eq\">drunken = intoxicated\u003c/span>\u003cdiv class=\"w\">drunken을 intoxicated로 바꾸면 격식 있는 표현이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">admitted\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">confessed to\u003c/span>\u003cspan class=\"y-eq\">admit = confess to\u003c/span>\u003cdiv class=\"w\">admit을 confess to로 바꾸면 자백하다는 의미가 강해진다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">under the influence of alcohol\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">drunk\u003c/span>\u003cspan class=\"y-eq\">under the influence of alcohol = drunk\u003c/span>\u003cdiv class=\"w\">법적 표현을 간단히 drunk로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The intoxicated man confessed that he had stolen the car, but denied that he had driven it while drunk.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 술 취한 남자가 차를 훔친 것은 인정했지만 술에 취한 상태로 운전한 것은 부인했다는 뜻이에요. 자신에게 불리한 부분만 일부 부인하는 모습을 보여 줍니다.","hl":"mn"},{"n":42,"text":"admitted stealing은 admitted that he had stolen으로 바꿔 쓸 수 있어요. denied driving it도 denied that he had driven it으로 바꾸면 시제가 더 분명해집니다.","hl":"rw"},{"n":43,"text":"drunken은 intoxicated로 바꾸면 더 격식 있는 표현이 되고, admitted는 confessed to로 바꾸면 자백하다는 의미가 강해져요. under the influence of alcohol은 간단히 drunk로 표현할 수 있습니다.","hl":"ph"},{"n":44,"text":"전체를 바꾸면 The intoxicated man confessed that he had stolen the car, but denied that he had driven it while drunk. 동명사구를 that절로 바꿔 같은 내용을 더 명확하게 전달했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 Once I forgot to turn off the oven and I shall never forget seeing the expression on the faces of the rest of the family when they realized they had nothing to eat.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Once I forgot\u003c/div>\u003cdiv class=\"k\">예전에 나는 잊었다\u003c/div>\u003cdiv class=\"e\">to turn off the oven\u003c/div>\u003cdiv class=\"k\">오븐을 꺼는 것을\u003c/div>\u003cdiv class=\"e\">and I shall never forget\u003c/div>\u003cdiv class=\"k\">그리고 나는 결코 잊지 못할 것이다\u003c/div>\u003cdiv class=\"e\">seeing the expression\u003c/div>\u003cdiv class=\"k\">표정을 본 것을\u003c/div>\u003cdiv class=\"e\">on the faces of the rest of the family\u003c/div>\u003cdiv class=\"k\">나머지 가족의 얼굴에서\u003c/div>\u003cdiv class=\"e\">when they realized\u003c/div>\u003cdiv class=\"k\">그들이 깨달았을 때\u003c/div>\u003cdiv class=\"e\">they had nothing to eat.\u003c/div>\u003cdiv class=\"k\">자신들이 먹을 것이 없다는 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>forget은 to부정사와 동명사 둘 다 목적어로 취하지만 의미가 다르다. \u003cb class=\"key\">to turn off the oven\u003c/b>은 '미래에 해야 할 일을 잊었다'는 뜻이고, \u003cb class=\"key\">seeing the expression\u003c/b>은 '과거에 본 것을 잊지 못한다'는 뜻이다. realized 다음에는 목적어 역할을 하는 명사절을 이끄는 접속사 that이 생략되어 있다.\u003c/div>","segs":[{"n":45,"text":"Once I forgot, 예전에 나는 잊었다. to turn off the oven, 오븐을 꺼는 것을. and I shall never forget, 그리고 나는 결코 잊지 못할 것이다. seeing the expression, 표정을 본 것을. on the faces of the rest of the family, 나머지 가족의 얼굴에서. when they realized, 그들이 깨달았을 때. they had nothing to eat, 자신들이 먹을 것이 없다는 것을","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 forget이 to부정사와 동명사 둘 다를 목적어로 취하지만 뜻이 완전히 달라지는 걸 보여 줘요. forgot to turn off the oven은 오븐 끄는 일을 잊어버린 거고, never forget seeing the expression은 과거에 본 표정을 잊지 못한다는 뜻이에요. 같은 동사인데 목적어 형태에 따라 의미가 갈리는 중요한 포인트입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 Once I forgot to turn off the oven and I shall never forget seeing the expression on the faces of the rest of the family when they realized they had nothing to eat.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>예전에 오븐 끄는 것을 잊어서 가족들이 먹을 것이 없다는 걸 깨달았을 때의 표정을 결코 잊지 못한다는 뜻이다. forget+to-v와 forget+v-ing의 의미 차이를 보여 주는 문장으로, 사소한 실수가 큰 기억으로 남은 상황이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">forgot to turn off\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">forgot that I had to turn off\u003c/span>\u003cdiv class=\"w\">to부정사를 that절로 바꿔 의무의 의미를 강조했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">shall never forget seeing\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">will never forget having seen\u003c/span>\u003cdiv class=\"w\">동명사의 완료형을 써서 시제를 더 선명하게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">forgot to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">neglected to\u003c/span>\u003cspan class=\"y-eq\">forget to = neglect to\u003c/span>\u003cdiv class=\"w\">forget to를 neglect to로 바꾸면 소홀히 하다는 의미가 된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">shall never forget\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">will always remember\u003c/span>\u003cspan class=\"y-eq\">never forget = always remember\u003c/span>\u003cdiv class=\"w\">부정 표현을 긍정 표현으로 전환했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">expression\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">look\u003c/span>\u003cspan class=\"y-eq\">expression = look\u003c/span>\u003cdiv class=\"w\">expression을 look으로 바꾸면 더 구어적인 표현이 된다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Once I neglected to turn off the oven, and I will always remember the look on the faces of the rest of the family when they realized they had nothing to eat.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"이 문장은 예전에 오븐 끄는 것을 깜빡해서 가족들이 먹을 게 없다는 걸 알았을 때의 표정을 평생 잊지 못하겠다는 뜻이에요. 사소한 실수가 큰 기억으로 남은 상황이죠.","hl":"mn"},{"n":48,"text":"forgot to turn off the oven은 forgot that I had to turn off the oven으로 바꿔 쓸 수 있어요. shall never forget seeing은 will never forget having seen으로 바꾸면 과거의 경험이라는 시제가 더 분명하게 드러납니다.","hl":"rw"},{"n":49,"text":"forgot to는 neglected to로 바꾸면 소홀히 했다는 뉘앙스가 생겨요. shall never forget은 will always remember로 바꿔 긍정문으로 표현할 수 있습니다. expression은 look으로 바꾸면 더 쉬운 표현이 돼요.","hl":"ph"},{"n":50,"text":"전체를 바꾸면 Once I neglected to turn off the oven, and I will always remember the look on the faces of the rest of the family when they realized they had nothing to eat. 부정 표현을 긍정으로 바꾸고 어휘를 조정했지만 의미는 같아요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 We stopped \u003cspan class=\"fx\">checking for monsters\u003c/span> under our bed when we realized they were inside us.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We stopped checking\u003c/div>\u003cdiv class=\"k\">우리는 살펴보는 것을 그만두었다\u003c/div>\u003cdiv class=\"e\">for monsters\u003c/div>\u003cdiv class=\"k\">괴물들을\u003c/div>\u003cdiv class=\"e\">under our bed\u003c/div>\u003cdiv class=\"k\">우리의 침대 아래에서\u003c/div>\u003cdiv class=\"e\">when we realized\u003c/div>\u003cdiv class=\"k\">우리가 깨달았을 때\u003c/div>\u003cdiv class=\"e\">they were inside us.\u003c/div>\u003cdiv class=\"k\">그것들이 우리 안에 있다는 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>stop은 동명사를 목적어로 취하면 '~하는 것을 그만두다'라는 의미이다. \u003cb class=\"key\">checking for monsters\u003c/b>가 stopped의 목적어인 동명사구이다. stop 다음에 to부정사가 오면 '~하기 위해 멈추다'의 목적 의미가 된다.\u003c/div>","segs":[{"n":51,"text":"We stopped checking, 우리는 살펴보는 것을 그만두었다. for monsters, 괴물들을. under our bed, 우리의 침대 아래에서. when we realized, 우리가 깨달았을 때. they were inside us, 그것들이 우리 안에 있다는 것을","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 stop이 동명사를 목적어로 취하는 경우예요. checking for monsters가 stopped의 목적어로, 확인하는 행동을 그만두었다는 뜻입니다. stop 뒤에 to부정사가 오면 목적의 의미가 되니 stop checking과 stop to check은 완전히 다르다는 걸 기억하세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 We stopped \u003cspan class=\"fx\">checking for monsters\u003c/span> under our bed when we realized they were inside us.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>침대 밑에 괴물이 있는지 확인하는 것을 그만두었다는 뜻이고, 그 이유는 괴물이 밖이 아니라 우리 내면에 있다는 걸 깨달았기 때문이다. 두려움의 근원이 외부가 아니라 내면임을 깨달은 통찰을 담고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stopped checking\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">stopped looking for\u003c/span>\u003cdiv class=\"w\">checking을 looking for로 바꿔 더 구어적으로 표현했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">when we realized\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">once we realized\u003c/span>\u003cdiv class=\"w\">when을 once로 바꿔 깨달은 순간을 더 강조했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stopped checking\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">quit checking\u003c/span>\u003cspan class=\"y-eq\">stop = quit\u003c/span>\u003cdiv class=\"w\">stop을 quit으로 바꾸면 단념하다는 느낌이 강해진다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">monsters\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">creatures\u003c/span>\u003cspan class=\"y-eq\">monsters = creatures\u003c/span>\u003cdiv class=\"w\">monsters를 creatures로 바꾸면 더 일반적인 표현이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">realized\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">became aware\u003c/span>\u003cspan class=\"y-eq\">realize = become aware\u003c/span>\u003cdiv class=\"w\">realize를 become aware로 바꾸면 알게 되는 과정이 강조된다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We quit looking for monsters under our bed once we became aware that they were inside us.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"이 문장은 침대 밑에 괴물이 있는지 살피는 일을 그만두었다는 뜻인데, 그 이유가 괴물이 밖이 아니라 우리 내면에 있다는 걸 깨달았기 때문이에요. 두려움이 실제 밖에 있는 게 아니라 마음속에 있다는 통찰을 담고 있습니다.","hl":"mn"},{"n":54,"text":"stopped checking for monsters는 stopped looking for monsters로 바꿔 쓸 수 있어요. when we realized는 once we realized로 바꾸면 깨달은 순간을 더 강조할 수 있습니다.","hl":"rw"},{"n":55,"text":"stopped checking은 quit checking으로 바꾸면 그만두었다는 뜻이 더 강해져요. monsters는 creatures로 바꿔 쓸 수 있고, realized는 became aware로 바꾸면 알게 되는 과정이 드러납니다.","hl":"ph"},{"n":56,"text":"전체를 바꾸면 We quit looking for monsters under our bed once we became aware that they were inside us. 어휘를 바꾸고 접속사를 조정했지만 담긴 통찰은 그대로예요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 After careful consideration of your proposal, I regret \u003cspan class=\"fx\">to say\u003c/span> that we are unable to accept it.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">After careful consideration\u003c/div>\u003cdiv class=\"k\">심사숙고한 후에\u003c/div>\u003cdiv class=\"e\">of your proposal,\u003c/div>\u003cdiv class=\"k\">당신의 제안에 대해서\u003c/div>\u003cdiv class=\"e\">I regret to say\u003c/div>\u003cdiv class=\"k\">나는 말하게 되어 유감이다\u003c/div>\u003cdiv class=\"e\">that we are unable to accept it.\u003c/div>\u003cdiv class=\"k\">우리가 그것을 받아들일 수 없다고\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>regret은 to부정사와 동명사 둘 다 목적어로 취하지만 의미가 다르다. \u003cb class=\"key\">to say\u003c/b>는 '말하게 되어 유감이다'라는 의미로, regret to say는 안 좋은 소식을 전할 때 쓰는 관용 표현이다. that절은 say의 목적어이다.\u003c/div>","segs":[{"n":57,"text":"After careful consideration, 심사숙고한 후에. of your proposal, 당신의 제안에 대해서. I regret to say, 나는 말하게 되어 유감이다. that we are unable to accept it, 우리가 그것을 받아들일 수 없다고","hl":"ch"},{"n":58,"text":"열 번째 문장은 regret이 to부정사를 목적어로 취하는 경우예요. regret to say는 앞으로 할 말에 대해 미리 유감을 표하는 표현입니다. 반면 regret 뒤에 동명사가 오면 이미 한 일을 후회한다는 뜻이 되니 구분해야 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 After careful consideration of your proposal, I regret \u003cspan class=\"fx\">to say\u003c/span> that we are unable to accept it.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>제안을 신중히 검토한 후, 받아들일 수 없다고 말하게 되어 유감이라는 공식적 거절의 뜻이다. regret to v는 앞으로 할 말에 대해 미리 유감을 표하는 표현이다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">regret to say\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">am sorry to say\u003c/span>\u003cdiv class=\"w\">regret to say를 be sorry to say로 바꿔 더 일상적인 표현으로 전환했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are unable to accept\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cannot accept\u003c/span>\u003cdiv class=\"w\">be unable to를 cannot으로 바꿔 더 간결하게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">careful consideration\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">thorough review\u003c/span>\u003cspan class=\"y-eq\">careful consideration = thorough review\u003c/span>\u003cdiv class=\"w\">consideration을 review로 바꿔 검토의 의미를 더 명확히 했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">proposal\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">offer\u003c/span>\u003cspan class=\"y-eq\">proposal = offer\u003c/span>\u003cdiv class=\"w\">proposal을 offer로 바꾸면 제안이라는 뜻이 그대로 전달된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unable to accept\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">not in a position to accept\u003c/span>\u003cspan class=\"y-eq\">unable to accept = not in a position to accept\u003c/span>\u003cdiv class=\"w\">완곡한 거절 표현으로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">After thorough review of your offer, I am sorry to say that we cannot accept it.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"이 문장은 상대방의 제안을 신중하게 검토한 후에 받아들일 수 없다고 말하게 되어 유감이라는 뜻이에요. 공식적인 자리에서 정중하게 거절할 때 쓰는 표현입니다.","hl":"mn"},{"n":60,"text":"regret to say는 am sorry to say로 바꿔 쓸 수 있어요. are unable to accept는 cannot accept로 바꾸면 더 간결해집니다.","hl":"rw"},{"n":61,"text":"careful consideration은 thorough review로 바꿔 쓸 수 있고, proposal은 offer로 표현해도 됩니다. unable to accept는 not in a position to accept로 바꾸면 더 완곡한 거절 표현이 돼요.","hl":"ph"},{"n":62,"text":"전체를 바꾸면 After thorough review of your offer, I am sorry to say that we cannot accept it. 공식적 거절의 뉘앙스를 유지하면서 어휘만 바꾼 문장이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 I've never regretted \u003cspan class=\"fx\">saying a kind word\u003c/span> to someone, but I have regretted plenty of mean things I have said and done.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">I've never regretted\u003c/div>\u003cdiv class=\"k\">나는 결코 후회하지 않았다\u003c/div>\u003cdiv class=\"e\">saying a kind word to someone,\u003c/div>\u003cdiv class=\"k\">누군가에게 다정한 말 한마디를 한 것을\u003c/div>\u003cdiv class=\"e\">but I have regretted\u003c/div>\u003cdiv class=\"k\">그러나 나는 후회해왔다\u003c/div>\u003cdiv class=\"e\">plenty of mean things\u003c/div>\u003cdiv class=\"k\">많은 비열한 것들을\u003c/div>\u003cdiv class=\"e\">I have said and done.\u003c/div>\u003cdiv class=\"k\">[내가 말하고 행한]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>regret은 동명사를 목적어로 취하면 과거에 한 일을 후회한다는 의미이다. \u003cb class=\"key\">saying a kind word\u003c/b>가 regretted의 목적어이고, 두 번째 regretted의 목적어는 plenty of mean things이며, things 뒤에 목적격 관계대명사 which/that이 생략된 절이 수식한다.\u003c/div>","segs":[{"n":63,"text":"I've never regretted, 나는 결코 후회하지 않았다. saying a kind word to someone, 누군가에게 다정한 말 한마디를 한 것을. but I have regretted, 그러나 나는 후회해왔다. plenty of mean things, 많은 비열한 것들을. I have said and done, [내가 말하고 행한]","hl":"ch"},{"n":64,"text":"열한 번째 문장은 regret이 동명사를 목적어로 취하는 경우예요. saying a kind word가 regretted의 목적어로 왔고, 이는 과거에 친절한 말을 한 것을 후회한다는 뜻입니다. 두 번째 절에서는 things 뒤에 목적격 관계대명사가 생략되어 mean things를 수식하고 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 I've never regretted \u003cspan class=\"fx\">saying a kind word\u003c/span> to someone, but I have regretted plenty of mean things I have said and done.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>누군가에게 친절한 말을 한 것은 후회한 적 없지만, 내가 말하고 행동한 못된 것들은 많이 후회했다는 뜻이다. 친절은 후회로 남지 않고 나쁜 말과 행동만 후회로 남는다는 교훈을 준다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">regretted saying\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">felt sorry about saying\u003c/span>\u003cdiv class=\"w\">regret을 feel sorry about으로 바꿔 더 구어적인 표현을 사용했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">plenty of mean things\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">many unkind things\u003c/span>\u003cdiv class=\"w\">plenty of를 many로, mean을 unkind로 바꿔 더 쉬운 표현으로 전환했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a kind word\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a warm word\u003c/span>\u003cspan class=\"y-eq\">kind = warm\u003c/span>\u003cdiv class=\"w\">kind를 warm으로 바꾸면 따뜻한 뉘앙스가 더해진다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">regretted\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">felt remorse for\u003c/span>\u003cspan class=\"y-eq\">regret = feel remorse for\u003c/span>\u003cdiv class=\"w\">regret을 feel remorse for로 바꾸면 양심의 가책을 느낀다는 뜻이 강해진다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">mean things\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cruel things\u003c/span>\u003cspan class=\"y-eq\">mean = cruel\u003c/span>\u003cdiv class=\"w\">mean을 cruel로 바꾸면 더 강한 부정적 의미를 전달한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I have never felt sorry about saying a kind word to someone, but I have felt remorse for many cruel things I have said and done.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 다른 사람에게 친절한 말 한마디를 한 것은 한 번도 후회한 적이 없지만, 내가 말하고 행동한 비열한 것들은 많이 후회해 왔다는 뜻이에요. 친절은 후회로 남지 않고, 나쁜 말과 행동만 후회로 남는다는 교훈을 줍니다.","hl":"mn"},{"n":66,"text":"regretted saying은 felt sorry about saying으로 바꿔 쓸 수 있어요. plenty of mean things는 many unkind things로 바꾸면 더 쉬운 표현이 됩니다.","hl":"rw"},{"n":67,"text":"a kind word는 a warm word로 바꿔 쓸 수 있고, regretted는 felt remorse for로 바꾸면 양심의 가책을 느낀다는 뜻이 더 강해져요. mean things는 cruel things로 바꿔도 됩니다.","hl":"ph"},{"n":68,"text":"전체를 바꾸면 I have never felt sorry about saying a kind word to someone, but I have felt remorse for many cruel things I have said and done. regret을 다양한 표현으로 바꾸고 mean을 cruel로 바꿔 같은 메시지를 전달했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 Life will knock us down, but we can choose \u003cspan class=\"fx\">whether or not to stand back up\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Life will knock us down,\u003c/div>\u003cdiv class=\"k\">인생은 우리를 쓰러뜨릴 것이다\u003c/div>\u003cdiv class=\"e\">but we can choose\u003c/div>\u003cdiv class=\"k\">그러나 우리는 선택할 수 있다\u003c/div>\u003cdiv class=\"e\">whether or not to stand back up.\u003c/div>\u003cdiv class=\"k\">우리가 다시 일어설지 말지를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">whether or not to stand back up\u003c/b>은 '의문사+to부정사' 형태의 명사구로, choose의 목적어 역할을 한다. whether or not은 '~할지 말지'의 의미를 나타낸다.\u003c/div>","segs":[{"n":69,"text":"Life will knock us down, 인생은 우리를 쓰러뜨릴 것이다. but we can choose, 그러나 우리는 선택할 수 있다. whether or not to stand back up, 우리가 다시 일어설지 말지를","hl":"ch"},{"n":70,"text":"열두 번째 문장은 의문사와 to부정사가 결합한 명사구가 choose의 목적어로 쓰였어요. whether or not to stand back up은 다시 일어설지 말지라는 뜻으로, 그 자체가 하나의 명사 덩어리입니다. 이처럼 의문사에 to부정사가 붙으면 선택이나 결정의 내용을 목적어로 표현할 수 있어요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 Life will knock us down, but we can choose \u003cspan class=\"fx\">whether or not to stand back up\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인생은 우리를 쓰러뜨릴 것이지만, 다시 일어설지 말지는 우리가 선택할 수 있다는 뜻이다. 결국 중요한 건 상황이 아니라 우리의 선택이라는 회복 탄력성의 메시지를 담고 있다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">choose whether or not to stand back up\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">decide whether to get back up or not\u003c/span>\u003cdiv class=\"w\">choose를 decide로, stand back up을 get back up으로 바꿔 유사한 표현을 사용했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">knock us down\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">bring us down\u003c/span>\u003cdiv class=\"w\">knock down을 bring down으로 바꿔 같은 의미를 전달했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">knock down\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">bring down\u003c/span>\u003cspan class=\"y-eq\">knock down = bring down\u003c/span>\u003cdiv class=\"w\">knock down을 bring down으로 바꿔도 쓰러뜨리다는 뜻이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stand back up\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rise again\u003c/span>\u003cspan class=\"y-eq\">stand back up = rise again\u003c/span>\u003cdiv class=\"w\">stand back up을 rise again으로 바꾸면 다시 일어나다는 뜻이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">choose\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">decide\u003c/span>\u003cspan class=\"y-eq\">choose = decide\u003c/span>\u003cdiv class=\"w\">choose를 decide로 바꾸면 결정하다는 의미가 그대로 전달된다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Life will bring us down, but we can decide whether to rise again or not.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"이 문장은 인생이 우리를 쓰러뜨릴 수는 있지만, 다시 일어설지 말지는 우리가 선택할 수 있다는 뜻이에요. 결국 중요한 건 상황이 아니라 우리의 선택이라는 메시지를 담고 있습니다.","hl":"mn"},{"n":72,"text":"choose whether or not to stand back up은 decide whether to get back up or not으로 바꿔 쓸 수 있어요. knock us down은 bring us down으로 바꿔도 같은 의미입니다.","hl":"rw"},{"n":73,"text":"knock down은 bring down으로 바꿀 수 있고, stand back up은 rise again으로 표현하면 다시 일어나다는 뜻이 됩니다. choose는 decide로 바꿔도 자연스러워요.","hl":"ph"},{"n":74,"text":"전체를 바꾸면 Life will bring us down, but we can decide whether to rise again or not. 어휘만 바꿔 같은 메시지를 담았고, whether or not to부정사 구조는 그대로 유지했어요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>목적어 자리에 \u003cb class=\"key\">to부정사\u003c/b>를 취하는 동사 agree, promise, refuse, decide와 \u003cb class=\"key\">동명사\u003c/b>를 취하는 동사 enjoy, mind, admit, deny, stop을 구분한다.\u003c/li>\u003cli>\u003cb class=\"key\">forget, remember, regret\u003c/b>은 목적어가 to부정사냐 동명사냐에 따라 의미가 달라진다.\u003c/li>\u003cli>\u003cb class=\"key\">의문사+to부정사\u003c/b>는 명사구로 목적어가 될 수 있으며, when to, whether or not to와 같은 형태로 쓰인다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 명사구 목적어를 집중적으로 공부했어요. 동사마다 to부정사나 동명사를 목적어로 취하는 성향이 다르고, forget이나 remember처럼 뜻이 달라지는 경우를 꼭 기억해야 합니다. 의문사에 to부정사가 붙은 명사구도 목적어로 자주 나오니 덩어리로 묶어 읽는 연습을 하세요. 다음 시간에 더 재미있는 구문으로 만나요!","hl":"sum"}]}]});</script></body></html>
