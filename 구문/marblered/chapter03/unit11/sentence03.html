li><li>은하들이 중심으로부터 멀어짐(receding)</li><li>우주의 팽창을 암시하는 현상 발견</li><li>핵심 키워드: 멀어지는(receding), 팽창(expansion)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">astronomer</td><td class=\"m\">천문학자</td></tr><tr><td class=\"w\">discover</td><td class=\"m\">발견하다</td></tr><tr><td class=\"w\">distant</td><td class=\"m\">멀리 떨어진</td></tr><tr><td class=\"w\">galaxy</td><td class=\"m\">은하</td></tr><tr><td class=\"w\">recede</td><td class=\"m\">물러나다, 멀어지다</td></tr><tr><td class=\"w\">Milky Way</td><td class=\"m\">은하계(우리 은하)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">위대한 천문학자인</span><span class=\"en\"><b>The great astronomer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">에드윈 허블은</span><span class=\"en\"><b>Edwin Hubble</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발견했다</span><span class=\"en\"><b>discovered <span class=\"grammar-hl\">that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 먼 은하들이</span><span class=\"en\"><b><span class=\"grammar-hl\">all distant galaxies</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멀어지고 있다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">are receding</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 은하로부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from our Milky Way Galaxy</span>.</b></span></div></div><div class=\"lec-sent-ko\">위대한 천문학자 에드윈 허블은 우리의 은하로부터 모든 먼 은하들이 멀어지고 있다는 것을 발견했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 허블이 우주가 정지해 있는 것이 아니라 팽창하고 있다는 사실을 처음으로 밝혀냈다는 내용입니다. 여기서 receding은 사전적으로 &#39;물러나다, 퇴각하다&#39;라는 뜻이지만, 여기서는 은하들이 중심으로부터 점점 멀어지는 현상을 나타냅니다. 필자는 단순히 &#39;멀어지다(moving away)&#39;라는 평범한 표현 대신, 우주라는 거대한 공간에서 은하들이 뒤로 물러나듯 간격이 벌어지는 역동적인 이미지를 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that all distant galaxies are receding from our Milky Way Galaxy (명사절): discovered의 목적어 역할을 하는 that절입니다. 주어(all distant galaxies)와 동사(are receding)를 갖춘 완전한 문장이 동사 뒤에 이어져 내용을 전달합니다.</div><div class=\"lec-gr-item\">are receding (현재진행): be동사(are) + 현재분사(-ing, receding)가 결합하여 &#39;멀어지고 있는 중이다&#39;라는 동작의 진행을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">astronomer</td><td class=\"m\">천문학자</td></tr><tr><td class=\"w\">discover</td><td class=\"m\">발견하다</td></tr><tr><td class=\"w\">distant</td><td class=\"m\">멀리 떨어진</td></tr><tr><td class=\"w\">galaxy</td><td class=\"m\">은하</td></tr><tr><td class=\"w\">Milky Way</td><td class=\"m\">은하계(우리 은하)</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>천문학자 에드윈 허블은 먼 은하들이 우리 은하로부터 멀어지고 있음을 발견했다.</li><li>이를 통해 우주가 고정된 것이 아니라 계속 팽창하고 있다는 현대 우주론의 기초가 마련되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Edwin Hubble discovered that distant galaxies are receding from our Milky Way, which indicates that the universe is constantly expanding.</div>\n              <div class=\"lec-final-sum-ko\">에드윈 허블은 먼 은하들이 우리 은하로부터 멀어지고 있다는 것을 발견했으며, 이는 우주가 계속해서 팽창하고 있음을 보여준다.</div></div></div>"],"segs":[[{"audio":"./sentence03_audio/1.mp3","hl":null}],[{"audio":"./sentence03_audio/2.mp3","hl":null}],[{"audio":"./sentence03_audio/3.mp3","hl":null},{"audio":"./sentence03_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence03_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence03_audio/6.mp3","hl":null}],[{"audio":"./sentence03_audio/7.mp3","hl":"main"},{"audio":"./sentence03_audio/8.mp3","hl":"meaning"},{"aud
