을 대조해 보는 것과 비슷한 이치라고 생각하면 이해하기 쉬워요. 따라서 해외여행을 갈 때 본인의 신원을 증명할 수 있는 서류를 여러 개 챙겨두는 것은 예기치 못한 상황에 대비하는 아주 현명한 습관이랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 발생</div><ul><li>입국 심사 과정에서 심사관이 주인공에게 추가적인 확인을 요청함.</li><li>장소: 여권 심사대 (passport control)</li><li>대상: 여권 심사관 (the woman who was on passport control)</li><li>핵심 키워드: 신분증(identification)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02요구 사항</div><ul><li>심사관은 본인 확인을 위해 더 구체적인 신분 증명이 가능한지 질문함.</li><li>질문 내용: 여권 이외의 신분증 소지 여부 (further identification)</li><li>목적: 신원 확인의 명확성 확보</li><li>핵심 키워드: 추가적인(further)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">passport</td><td class=\"m\">여권</td></tr><tr><td class=\"w\">control</td><td class=\"m\">통제, 관리</td></tr><tr><td class=\"w\">ask</td><td class=\"m\">물어보다, 질문하다</td></tr><tr><td class=\"w\">further</td><td class=\"m\">추가의</td></tr><tr><td class=\"w\">identification</td><td class=\"m\">신분증</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 여자는</span><span class=\"en\"><b><span class=\"grammar-hl\">The woman</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여권 심사대에 있던</span><span class=\"en\"><b><span class=\"grammar-hl\">who was on passport control</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내게 물었다</span><span class=\"en\"><b><span class=\"grammar-hl\">asked me</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 가졌는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">if I had</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 추가 신분 증명 자료를</span><span class=\"en\"><b>any further identification.</b></span></div></div><div class=\"lec-sent-ko\">여권 심사대에 있던 그 여자는 내게 내가 또 다른 신분 증명 자료를 가졌는지를 물었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 화자가 입국 심사 등 공식적인 상황에서 신분 확인을 요구받는 구체적인 상황을 제시하고 있습니다. 여기서 on은 단순히 &#39;위에&#39;라는 뜻이 아니라 &#39;(업무를) 담당하고 있는&#39;이라는 의미입니다. 심사대라는 업무 공간에 배치되어 책임을 지고 있음을 강조하기 위해 이 전치사를 선택했습니다. 또한 further는 사전적으로는 &#39;더 먼&#39;이라는 거리적 의미를 갖지만, 여기서는 &#39;추가적인(additional)&#39;이라는 뜻으로 쓰였습니다. 서류가 더 필요함을 격식 있게 표현하여 상황의 긴장감을 살리고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The woman who was on passport control (관계대명사): who가 주격 관계대명사로 쓰여 선행사 The woman을 수식하며, 절 내부에서 who가 주어 역할을 함</div><div class=\"lec-gr-item\">asked me if I had 5형식(SVOC) 구조: ask + O + (if절, 목적어) 구조이며, 여기서 if절은 &#39;asked&#39; 동사의 목적어 역할을 하는 간접의문문으로 &#39;~인지 아닌지&#39;라는 의미를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">passport</td><td class=\"m\">여권</td></tr><tr><td class=\"w\">control</td><td class=\"m\">통제, 관리</td></tr><tr><td class=\"w\">ask</td><td class=\"m\">물어보다, 질문하다</td></tr><tr><td class=\"w\">further</td><td class=\"m\">추가의</td></tr><tr><td class=\"w\">identification</td><td class=\"m\">신분증</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>여권 심사대에 있는 직원이 화자에게 추가 신분증 제시를 요구했다.</li><li>공식적인 상황에서 신분을 증명해야 하는 긴장된 순간이 묘사되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">An official at the passport control asked for additional identification, as standard procedures often require travelers to provide extra proof of identity.</div>\n              <div class=\"lec-final-sum-ko\">여권 심사대 담당자가 추가 신분증을 요구했는데, 이는 일반적인 절차상 여행객에게 신원 증명을 추가로 요청하는 경우가 많기 때문이다.</div></div></div>"],"segs":[[{"audio":"./sentence04_audio/1.mp3","hl":null}],[{"audio":"./sentence04_audio/2.mp3","hl":null}],[{"audio":"./sentence04_audio/3.mp3","hl":null},{"audio":"./sentence04_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence04_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence04_audio/6.mp3","hl":null}],[{"audio":"./sentence04_audio/7.mp3","hl":"main"},{"audio":"./sentence04_audio/8.mp3","hl":"meaning"},{"audio":"./sentence04_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence04_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.
