U7iOQAfm4Oen+c5780hK5+8rYHTcuc8c5wce/bpj1oIA3EAYwTuyOnJ7jJODznoARzT5o7trRX1ato19+m41B2SSd/w6Jat9W9b7LXWzt//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Inevitable Risks of Waste Disposal Systems<small>폐기물 처리 시스템이 가진 피할 수 없는 위험</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">환경 보호론자들이 말하는 환경 문제의 핵심은 우리가 아무리 정교한 기술을 사용하더라도 완벽한 쓰레기 처리 시스템(Waste disposal system)을 만드는 것은 사실상 불가능하다는 점이에요. 우리가 일상에서 배출하는 쓰레기는 단순히 사라지는 것이 아니라, 매립지나 소각장을 거치며 토양과 지하수를 오염시키는 잠재적 위험을 항상 품고 있죠. 특히 핵폐기물이나 화학물질처럼 오랜 시간 동안 치명적인 영향력을 유지하는 물질들은 미래 세대에게까지 큰 부담이 될 수 있다는 점에서 지속 가능한 해결책을 찾기가 매우 어렵답니다. 마치 우리가 짐을 어딘가에 숨겨두어도 언젠가는 다시 발견되는 것처럼, 어떤 방식의 처리도 100% 안전하다고 장담할 수 없는 불확실성(Uncertainty)을 안고 있다는 사실을 이번 지문을 통해 깊이 있게 고민해 보면 좋겠습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01환경론자의 주장</div><ul><li>환경 보호론자들은 현재 존재하는 어떤 폐기물 처리 방식도 완벽하게 안전할 수 없다고 주장합니다.</li><li>모든 폐기물 처리 시스템(waste disposal system)의 불완전성</li><li>안전성에 대한 회의적인 시각</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02시간적 범위와 한계</div><ul><li>폐기물 처리의 위험성은 단순히 현재에 국한되지 않고 미래까지 이어집니다.</li><li>현재(now)뿐만 아니라 미래(future)의 잠재적 위험 포함</li><li>절대적인 안전(absolutely safe) 보장의 불가능성</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03핵심 결론</div><ul><li>결과적으로 어떠한 폐기물 처리 방식도 완벽한 해결책이 될 수 없다는 비판적 관점입니다.</li><li>환경 보호론자(environmentalists)의 우려</li><li>폐기물 관리의 영구적인 취약성(vulnerability)</li><li>핵심 키워드: 폐기물 처리(waste disposal), 안전(safe), 환경 보호론자(environmentalists)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">environmentalist</td><td class=\"m\">환경 보호론자</td></tr><tr><td class=\"w\">argue</td><td class=\"m\">주장하다</td></tr><tr><td class=\"w\">system</td><td class=\"m\">체계, 방식</td></tr><tr><td class=\"w\">waste</td><td class=\"m\">폐기물, 쓰레기</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">disposal</td><td class=\"m\">처리, 처분</td></tr><tr><td class=\"w\">absolutely</td><td class=\"m\">완전히, 절대적으로</td></tr><tr><td class=\"w\">safe</td><td class=\"m\">안전한</td></tr><tr><td class=\"w\">in the future</td><td class=\"m\">미래에, 장차</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">환경 운동가들은 주장한다</span><span class=\"en\"><b><span class=\"grammar-hl\">Environmentalists argue</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떠한 쓰레기 처리 시스템도</span><span class=\"en\"><b><span class=\"grammar-hl\">no system of waste disposal</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">절대적으로 안전할 수는 없다고</span><span class=\"en\"><b><span class=\"grammar-hl\">can be absolutely safe</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금이든 혹은 미래든</span><span class=\"en\"><b>either now or in the future.</b></span></div></div><div class=\"lec-sent-ko\">환경 운동가들은 지금이든 미래든 어떠한 쓰레기 처리 시스템도 절대적으로 안전할 수는 없다고 주장한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 주제를 제시합니다. argue는 사전적으로 &#39;논쟁하다&#39;라는 뜻이지만, 여기서는 자신의 확고한 견해를 논리적으로 &#39;주장하다&#39;라는 의미로 쓰였습니다. 자신의 의견을 객관적인 사실처럼 강하게 피력하려는 필자의 의도가 담겨 있습니다. &#39;어떤 시스템도 안전할 수 없다&#39;는 부정적인 전망을 통해, 앞으로 나올 내용이 환경 문제의 위험성에 관한 것임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Environmentalists argue 5형식(SVOC) 구조와 유사한 목적어 절을 취하는 타동사 구조입니다. 주어(Environmentalists)가 동사(argue) 뒤에 생략된 접속사 that이 이끄는 명사절 전체를 목적어로 취하는 구조입니다.</div><div class=\"lec-gr-item\">no system of waste disposal 관용표현 및 어구: &#39;waste disposal&#39;(폐기물 처리)는 &#39;폐기물을 처리하는 행위&#39;라는 용도로 쓰인 동명사(명사적)입니다.</div><div class=\"lec-gr-item\">can be absolutely safe 조동사가 포함된 문형입니다. be동사가 &#39;안전한 상태이다&#39;라는 보어(safe)를 취하는 2형식 구조로, 뒤의 부사(absolutely)가 형용사(safe)를 수식하고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">environmentalist</td><td class=\"m\">환경 보호론자</td></tr><tr><td class=\"w\">argue</td><td class=\"m\">주장하다</td></tr><tr><td class=\"w\">system</td><td class=\"m\">체계, 방식</td></tr><tr><td class=\"w\">waste</td><td class=\"m\">폐기물, 쓰레기</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">disposal</td><td class=\"m\">처리, 처분</td></tr><tr><td class=\"w\">absolutely</td><td class=\"m\">완전히, 절대적으로</td></tr><tr><td class=\"w\">safe</td><td class=\"m\">안전한</td></tr><tr><td class=\"w\">in the future</td><td class=\"m\">미래에, 장차</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>환경론자들은 현재와 미래를 통틀어 100% 안전한 쓰레기 처리 방법은 존재하지 않는다고 경고한다.</li><li>쓰레기 처리는 언제나 환경적 위험 요소를 내포하고 있다는 비관적 관점을 보여준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Environmentalists argue that current waste disposal methods are imperfect, so they pose potential risks for both the present and the future.</div>\n              <div class=\"lec-final-sum-ko\">환경 운동가들은 현재의 폐기물 처리 방식이 불완전하다고 주장하며, 이로 인해 현재와 미래 모두에 잠재적 위험이 존재한다고 본다.</div></div></div>"],"segs":[[{"audio":"./sentence08_audio/1.mp3","hl":null}],[{"audio":"./sentence08_audio/2.mp3","hl":null}],[{"audio":"./sentence08_audio/3.mp3","hl":null},{"audio":"./sentence08_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence08_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence08_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence08_audio/7.mp3","hl":null}],[{"audio":"./sentence08_audio/8.mp3","hl":"main"},{"audio":"./sentence08_audio/9.mp3","hl":"meaning"},{"audio":"./sentence08_audio/
