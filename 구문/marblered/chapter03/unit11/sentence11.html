c-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황적 배경</div><ul><li>사회적, 문화적, 혹은 종교적으로 예민한 상황에 직면할 수 있다.</li><li>갈등을 유발할 수 있는 상황 발생 (sensitive situation)</li><li>갈등이 발생할 가능성이 있는 상황 (potential conflict)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02의문 제기</div><ul><li>질문을 함으로써 발생하는 갈등을 피하는 것이 과연 윤리적인지에 대해 고민하게 된다.</li><li>갈등을 회피할 것인가의 문제 (avoiding conflict)</li><li>무엇이 윤리적인가에 대한 질문 (ethical question)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결론 도출의 필요성</div><ul><li>이러한 민감한 사안에서 질문을 던지는 행위의 옳고 그름을 판단해야 한다.</li><li>갈등을 일으키는 질문의 영향력 (impact of questions)</li><li>윤리적 선택의 어려움 (difficulty of ethical choice)</li><li>핵심 키워드: 윤리적(ethical), 갈등(conflict), 민감함(sensitivity)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">time</td><td class=\"m\">시기, 때</td></tr><tr><td class=\"w\">social</td><td class=\"m\">사회적인</td></tr><tr><td class=\"w\">cultural</td><td class=\"m\">문화적인</td></tr><tr><td class=\"w\">religious</td><td class=\"m\">종교적인</td></tr><tr><td class=\"w\">sensitivity</td><td class=\"m\">민감성, 예민함</td></tr><tr><td class=\"w\">wonder</td><td class=\"m\">궁금해하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ethical</td><td class=\"m\">윤리적인</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다</td></tr><tr><td class=\"w\">question</td><td class=\"m\">질문, 문제</td></tr><tr><td class=\"w\">increase</td><td class=\"m\">증가시키다, 높이다</td></tr><tr><td class=\"w\">conflict</td><td class=\"m\">갈등, 충돌</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">~의 시대에는</span><span class=\"en\"><b>In times of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사회적, 문화적 또는 종교적 민감성의</span><span class=\"en\"><b>social, cultural or religious sensitivity</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 궁금해 할 수도 있다</span><span class=\"en\"><b>one might wonder</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 윤리적인지를</span><span class=\"en\"><b><span class=\"grammar-hl\">whether it is ethical</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피하는 것이,</span><span class=\"en\"><b><span class=\"grammar-hl\">to avoid,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 피하지 않는 것이,</span><span class=\"en\"><b><span class=\"grammar-hl\">or not to avoid</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">질문들을</span><span class=\"en\"><b><span class=\"grammar-hl\">questions</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갈등을 증가시킬 수도 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that might increase conflict</span>.</b></span></div></div><div class=\"lec-sent-ko\">사회적, 문화적 또는 종교적 민감성의 시대에 사람들은 갈등을 증가시킬 수도 있는 질문을 피하는 것 또는 피하지 않는 것이 윤리적인지 궁금해 할 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글 전체의 화두를 던지는 도입부입니다. 여기서 sensitivity는 사전적으로 &#39;민감함&#39;을 뜻하는데, 여기서는 사람들이 의견 차이로 인해 쉽게 상처받거나 격해질 수 있는 &#39;예민한 상황&#39;을 의미합니다. 필자는 갈등을 유발할 수 있는 질문을 다룰 때 우리가 어떤 태도를 취해야 하는지에 대한 도덕적 고민을 독자에게 제시하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it is ethical to avoid, or not to avoid (가주어): 진주어: &#39;it&#39;은 가주어이고, &#39;to avoid, or not to avoid&#39;가 진주어 역할을 하여 문장의 주어 위치에 자리 잡고 있습니다.</div><div class=\"lec-gr-item\">to avoid, or not to avoid (to부정사): &#39;to avoid&#39;와 &#39;not to avoid&#39;가 진주어로서 명사적 용법으로 쓰였습니다. &#39;not&#39;을 to부정사 앞에 배치하여 부정의 의미를 나타냅니다.</div><div class=\"lec-gr-item\">questions that might increase conflict (관계대명사): &#39;that&#39;은 선행사인 &#39;questions&#39;를 수식하는 주격 관계대명사입니다. 뒤에 동사 &#39;might increase&#39;가 바로 이어지며, &#39;that&#39;이 절 내부에서 주어 역할을 합니다.</div><div class=\"lec-gr-item\">whether it is ethical (간접의문문): &#39;whether&#39;를 포함한 절이 &#39;wonder&#39;라는 타동사의 목적어 역할을 하는 명사절로 사용되었습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">time</td><td class=\"m\">시기, 때</td></tr><tr><td class=\"w\">social</td><td class=\"m\">사회적인</td></tr><tr><td class=\"w\">cultural</td><td class=\"m\">문화적인</td></tr><tr><td class=\"w\">religious</td><td class=\"m\">종교적인</td></tr><tr><td class=\"w\">sensitivity</td><td class=\"m\">민감성, 예민함</td></tr><tr><td class=\"w\">wonder</td><td class=\"m\">궁금해하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ethical</td><td class=\"m\">윤리적인</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다</td></tr><tr><td class=\"w\">question</td><td class=\"m\">질문, 문제</td></tr><tr><td class=\"w\">increase</td><td class=\"m\">증가시키다, 높이다</td></tr><tr><td class=\"w\">conflict</td><td class=\"m\">갈등, 충돌</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사회적·문화적·종교적으로 예민한 시기에는 갈등을 유발하는 질문을 다루는 방식에 대해 고민이 생긴다.</li><li>그러한 질문을 피하는 것이 도덕적인지, 아니면 직면하는 것이 도덕적인지에 대한 윤리적 딜레마가 존재한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Individuals often contemplate the ethics of addressing sensitive topics, yet they remain uncertain about whether avoiding conflict is truly the right approach.</div>\n              <div class=\"lec-final-sum-ko\">개인들은 민감한 주제를 다루는 윤리에 대해 깊이 고민하지만, 갈등을 피하는 것이 진정으로 옳은 방식인지에 대해서는 확신하지 못한다.</div></div></div>"],"segs":[[{"audio":"./sentence11_audio/1.mp3","hl":null}],[{"audio":"./sentence11_audio/2.mp3","hl":null}],[{"audio":"./sentence11_audio/3.mp3","hl":null},{"audio":"./sentence11_audio/4.mp3","hl":"stage-0"},{"audio":"./sen
