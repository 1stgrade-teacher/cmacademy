위</div><ul><li>배우들은 감정과 장르를 자유롭게 오가며 연기할 수 있다.</li><li>비극과 희극 사이의 선택 (tragedy or comedy)</li><li>고통받거나 즐거워하는 연기 (suffer or make merry)</li><li>웃음과 눈물을 넘나드는 표현 (laugh or shed tears)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03자유의 가치</div><ul><li>감정을 자유자재로 다루는 배우의 능력은 매우 특별한 것이다.</li><li>감정을 스스로 조절하는 힘</li><li>다양한 인간의 모습을 대변함</li><li>핵심 키워드: 연기(acting), 선택(choice)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fortunate</td><td class=\"m\">운이 좋은</td></tr><tr><td class=\"w\">appear</td><td class=\"m\">출연하다, 나타나다</td></tr><tr><td class=\"w\">tragedy</td><td class=\"m\">비극</td></tr><tr><td class=\"w\">comedy</td><td class=\"m\">희극</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">suffer</td><td class=\"m\">고통받다, 괴로워하다</td></tr><tr><td class=\"w\">make merry</td><td class=\"m\">즐겁게 지내다, 흥겹게 놀다</td></tr><tr><td class=\"w\">shed</td><td class=\"m\">(눈물을) 흘리다</td></tr><tr><td class=\"w\">tear</td><td class=\"m\">눈물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">배우들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Actors</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아주 운이 좋다.</span><span class=\"en\"><b><span class=\"grammar-hl\">are so fortunate</span>.</b></span></div></div><div class=\"lec-sent-ko\">배우들은 아주 운이 좋다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 배우들이 가지는 직업적 특권에 대해 이야기하며 글을 시작합니다. 여기서 fortunate는 사전적으로는 &#39;운이 좋은&#39;이지만, 여기서는 단순히 운이 좋은 것을 넘어, 자신의 감정이나 상황을 자유롭게 선택할 수 있는 배우라는 직업의 &#39;특혜&#39;를 강조하기 위해 선택된 단어입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Actors are so fortunate 2형식(SVC) 구조: Actors가 주어(S), are가 불완전자동사(V), fortunate가 주격보어(C)로 쓰인 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fortunate</td><td class=\"m\">운이 좋은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 선택할 수 있다</span><span class=\"en\"><b>They can choose</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 출연할 것인지를</span><span class=\"en\"><b><span class=\"grammar-hl\">whether they will appear</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비극에</span><span class=\"en\"><b>in tragedy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 희극에,</span><span class=\"en\"><b>or in comedy,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 고통을 겪을 것인지</span><span class=\"en\"><b><span class=\"grammar-hl\">whether they will suffer</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 즐겁게 놀 것인지,</span><span class=\"en\"><b><span class=\"grammar-hl\">or make merry</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">웃을지</span><span class=\"en\"><b><span class=\"grammar-hl\">laugh</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아니면 눈물을 흘릴 것인지를.</span><span class=\"en\"><b><span class=\"grammar-hl\">or shed tears</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 자신들이 비극 또는 희극에 출연할 것인지를, 그들이 고통을 겪을 것인지 또는 즐겁게 놀지, 웃을지 아니면 눈물을 흘릴 것인지를 선택할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;운이 좋다&#39;는 것이 구체적으로 무엇을 의미하는지 나열합니다. 앞 문장의 내용을 부연 설명하며, 배우들이 연기를 통해 감정과 상황을 통제하고 선택할 수 있다는 자유를 보여줍니다. make merry는 &#39;즐겁게 놀다&#39;라는 뜻인데, 여기서는 &#39;고통(suffer)&#39;과 대조되는 &#39;즐거운 감정 표현&#39;을 강조하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">whether they will appear (간접의문문): whether절이 주절 동사 choose의 목적어 역할을 하는 명사절 구조입니다.</div><div class=\"lec-gr-item\">whether they will suffer or make merry (관용표현): whether A or B(~인지 B인지) 구문으로, 두 가지 선택지를 대조하는 구조입니다.</div><div class=\"lec-gr-item\">laugh or shed tears (to부정사(생략)): 앞에 있는 will에 이어지는 동사원형들로, 문맥상 &#39;will laugh or will shed&#39;에서 조동사 뒤의 동사원형이 병렬 구조를 이룹니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">appear</td><td class=\"m\">출연하다, 나타나다</td></tr><tr><td class=\"w\">tragedy</td><td class=\"m\">비극</td></tr><tr><td class=\"w\">comedy</td><td class=\"m\">희극</td></tr><tr><td class=\"w\">suffer</td><td class=\"m\">고통받다, 괴로워하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make merry</td><td class=\"m\">즐겁게 지내다, 흥겹게 놀다</td></tr><tr><td class=\"w\">shed</td><td class=\"m\">(눈물을) 흘리다</td></tr><tr><td class=\"w\">tear</td><td class=\"m\">눈물</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>배우라는 직업은 매우 운이 좋은 편에 속한다.</li><li>그 이유는 자신이 연기할 장르와 감정을 자유롭게 선택할 수 있기 때문이다.</li><li>삶의 희로애락을 연기로 직접 결정하고 표현할 수 있다는 점이 배우의 큰 특권이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Actors possess the unique opportunity to decide their roles, so they can freely choose between experiencing sorrow or joy on stage.</div>\n              <div class=\"lec-final-sum-ko\">배우들은 자신의 역할을 결정할 특별한 기회를 가지기에, 무대 위에서 슬픔과 기쁨 사이를 자유롭게 선택할 수 있다.</div></div></div>"],"segs":[[{"audio":"./sentence07_audio/1.mp3","hl":null}],[{"audio":"./sentence07_audio/2.mp3","hl":null}],[{"audio":"./sentence07_audio/3.mp3","hl":null},{"audio":"./sentence07_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence07_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence07_audio/6.
