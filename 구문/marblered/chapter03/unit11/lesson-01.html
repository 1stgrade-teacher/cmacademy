  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}

  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

lecturePlayer(document.getElementById("app"),{"brand":"unit11","title":"마법같은 블록구문 실전편 Unit 11 명사절 목적어","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>명사절 목적어 완전 정복: that, whether, what, whatever까지\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>동사나 전치사의 목적어로 쓰이는 명사절을 찾아 해석하고, 접속사 that, whether, if, 의문사, 복합관계사를 구별해 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마법같은 블록구문 실전편, 명사절이 목적어로 쓰이는 문장들을 집중적으로 공부해 볼게요. 문장 속에서 that, whether, what, whatever 같은 덩어리들이 어떻게 동사 뒤에 붙어서 목적어 역할을 하는지 하나하나 살펴보겠습니다. 차근차근 따라오면 영어 문장의 뼈대가 훨씬 또렷하게 보일 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">오늘의 핵심은 \u003cb class=\"key\">명사절 목적어\u003c/b>입니다. that, whether, if, 의문사 where, what, how, 그리고 복합관계사 whatever, whichever 등이 이끄는 절이 문장에서 \u003cb class=\"key\">동사나 전치사의 목적어\u003c/b>로 쓰이면, 그 절 전체가 하나의 덩어리로 '~하는지, ~라는 것, ~하는 것'의 의미를 갖습니다. 특히 접속사 that이 생략되거나, whether와 if가 바뀌어 쓰일 수 있는 경우까지 주의 깊게 보세요.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 A judge must decide \u003cspan class=\"fx\">whether a person is guilty or innocent of a crime\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 Your present circumstances don't determine where you can go; they merely determine where you start.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 The great astronomer Edwin Hubble discovered \u003cspan class=\"fx\">that all distant galaxies are receding from our Milky Way Galaxy\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 The woman who was on passport control asked me \u003cspan class=\"fx\">if I had any further identification\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 People who are satisfied appreciate \u003cspan class=\"fx\">what they have in life and don't worry about how it compares to what others have\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Perhaps, we've just forgotten \u003cspan class=\"fx\">that we are still pioneers, that we've barely begun, and that our greatest accomplishments cannot be behind us\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 Actors are so fortunate. They can choose \u003cspan class=\"fx\">whether they will appear in tragedy or in comedy, whether they will suffer or make merry, laugh or shed tears\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 Environmentalists argue \u003cspan class=\"fx\">no system of waste disposal can be absolutely safe, either now or in the future\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 Either Saturday or Monday, choose \u003cspan class=\"fx\">whichever is more convenient for you\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 Indeed, a brief look at a dictionary will show you \u003cspan class=\"fx\">that the majority of words are used with more than one meaning\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 In times of social, cultural or religious sensitivity one might wonder \u003cspan class=\"fx\">whether it is ethical to avoid, or not to avoid, questions that might increase conflict\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 The government will take \u003cspan class=\"fx\">whatever action is necessary to achieve monetary and financial stability\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘의 핵심은 명사절 목적어입니다. that, whether, if, 의문사 where, what, how, 그리고 복합관계사 whatever, whichever 등이 이끄는 절이 문장에서 동사나 전치사의 목적어로 쓰이면, 그 절 전체가 하나의 덩어리로 '~하는지', '~라는 것', '~하는 것'의 의미를 갖습니다. 특히 접속사 that이 생략되거나 whether와 if가 서로 바뀌어 쓰일 수 있는 경우를 주의해서 봐야 해요.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 A judge must decide \u003cspan class=\"fx\">whether a person is guilty or innocent of a crime\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">A judge\u003c/div>\u003cdiv class=\"k\">판사는\u003c/div>\u003cdiv class=\"e\">must decide\u003c/div>\u003cdiv class=\"k\">판결을 내려야 한다\u003c/div>\u003cdiv class=\"e\">whether a person is guilty or innocent\u003c/div>\u003cdiv class=\"k\">어떤 사람이 유죄인지 무죄인지를\u003c/div>\u003cdiv class=\"e\">of a crime.\u003c/div>\u003cdiv class=\"k\">범죄에 대해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>접속사 \u003cb class=\"key\">whether\u003c/b>가 이끄는 명사절이 동사 \u003cb class=\"key\">decide\u003c/b>의 목적어로 쓰였습니다. '~인지 아닌지'의 의미를 가진 whether절은 명사절로, 여기서는 guilty or innocent라는 선택지를 포함합니다.\u003c/div>","segs":[{"n":3,"text":"A judge, 판사는. must decide, 판결을 내려야 한다. whether a person is guilty or innocent, 어떤 사람이 유죄인지 무죄인지를. of a crime, 범죄에 대해","hl":"ch"},{"n":4,"text":"첫 번째 문장에서는 whether가 이끄는 명사절이 decide의 목적어로 쓰였어요. whether절은 '~인지 아닌지'라는 선택의 의미를 담고, 여기서는 '유죄인지 무죄인지'를 나타냅니다. 이처럼 명사절은 동사 뒤에 와서 동사의 목적어 역할을 할 수 있습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 A judge must decide \u003cspan class=\"fx\">whether a person is guilty or innocent of a crime\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>판사는 피고인이 범죄에 대해 유죄인지 무죄인지를 반드시 판결해야 한다는 뜻입니다. 판사의 의무와 판결의 기준을 보여 줍니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whether a person is guilty or innocent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">if a person is guilty or innocent\u003c/span>\u003cdiv class=\"w\">whether 대신 if를 써도 '~인지 아닌지'의 명사절을 이끌 수 있지만, whether가 더 격식 있고 선택의 의미가 강합니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">must decide\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has to determine\u003c/span>\u003cdiv class=\"w\">decide 대신 determine을 쓰면 '결정하다'의 의미가 조금 더 공식적이고 강하게 느껴집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">guilty\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">culpable\u003c/span>\u003cspan class=\"y-eq\">guilty = culpable\u003c/span>\u003cdiv class=\"w\">guilty를 법적 책임을 강조하는 단어로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">innocent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">not guilty\u003c/span>\u003cspan class=\"y-eq\">innocent = not guilty\u003c/span>\u003cdiv class=\"w\">innocent를 풀어서 not guilty로 표현해도 같은 의미입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">crime\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">offense\u003c/span>\u003cspan class=\"y-eq\">crime = offense\u003c/span>\u003cdiv class=\"w\">crime을 조금 더 공식적인 어감의 offense로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">A judge is required to determine whether an individual is guilty or innocent with respect to a crime.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 판사는 범죄에 대해 피고인이 유죄인지 무죄인지를 반드시 가려야 한다는 뜻이에요. 판사의 역할과 책임을 강조하는 문장이죠. 쉽게 말하면, 판사는 guilty인지 innocent인지 결정해야 한다는 겁니다.","hl":"mn"},{"n":6,"text":"whether a person is guilty or innocent 부분은 if a person is guilty or innocent으로 바꿔 쓸 수 있어요. 다만 whether가 더 공식적이고 선택의 느낌이 강해서 글에서는 whether를 더 많이 씁니다. 또 must decide는 has to determine으로 바꾸면 조금 더 강한 의무를 표현할 수 있습니다.","hl":"rw"},{"n":7,"text":"guilty는 culpable로 바꿀 수 있고, innocent는 not guilty로 풀어서 표현해도 됩니다. crime은 offense나 wrongdoing으로 대체 가능해요. 이 단어들은 법이나 규칙에 관한 글에서 자주 나오니 함께 외워두세요.","hl":"ph"},{"n":8,"text":"전체를 바꿔 보면, A judge is required to determine whether an individual is guilty or innocent with respect to a crime. 이렇게 쓸 수 있어요. 같은 뜻이지만 표현을 살짝 바꾸면 문장이 더 세련되게 들리죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 Your present circumstances don't determine where you can go; they merely determine where you start.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Your present circumstances\u003c/div>\u003cdiv class=\"k\">당신의 현재 상황은\u003c/div>\u003cdiv class=\"e\">don't determine\u003c/div>\u003cdiv class=\"k\">결정하지 않는다\u003c/div>\u003cdiv class=\"e\">where you can go;\u003c/div>\u003cdiv class=\"k\">어디로 당신이 갈 수 있는지를\u003c/div>\u003cdiv class=\"e\">they merely determine\u003c/div>\u003cdiv class=\"k\">그것들은 단지 결정할 뿐이다\u003c/div>\u003cdiv class=\"e\">where you start.\u003c/div>\u003cdiv class=\"k\">어디서 당신이 시작하는지를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>의문사 \u003cb class=\"key\">where\u003c/b>가 이끄는 명사절이 두 번 나와서 각각 동사 \u003cb class=\"key\">determine\u003c/b>의 목적어로 쓰였습니다. where는 '어디로, 어디서'의 의미를 가진 의문사로, 명사절을 이끌어 '~하는 곳'이라는 뜻을 담습니다.\u003c/div>","segs":[{"n":9,"text":"Your present circumstances, 당신의 현재 상황은. don't determine, 결정하지 않는다. where you can go, 어디로 당신이 갈 수 있는지를. they merely determine, 그것들은 단지 결정할 뿐이다. where you start, 어디서 당신이 시작하는지를","hl":"ch"},{"n":10,"text":"두 번째 문장에서는 where가 이끄는 명사절이 두 번 나옵니다. where you can go와 where you start 모두 동사 determine의 목적어 역할을 하고 있어요. where는 '어디로, 어디서'라는 뜻으로, 문장에서 덩어리째 목적어가 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 Your present circumstances don't determine where you can go; they merely determine where you start.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>현재의 상황이 미래의 목적지를 결정하지 못하고, 단지 출발점만 결정할 뿐이라는 뜻입니다. 즉, 현재 처지가 나쁘다고 해서 미래가 제한되는 것은 아니라는 격려의 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">present circumstances\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">current situation\u003c/span>\u003cdiv class=\"w\">present circumstances를 더 간단한 current situation으로 바꾸면 이해하기 쉽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">merely determine\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">only decide\u003c/span>\u003cdiv class=\"w\">merely를 only로, determine을 decide로 바꾸면 뜻은 같지만 어감이 더 평이해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">circumstances\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">conditions\u003c/span>\u003cspan class=\"y-eq\">circumstances = conditions\u003c/span>\u003cdiv class=\"w\">circumstances를 비슷한 뜻의 conditions로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">determine\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">decide\u003c/span>\u003cspan class=\"y-eq\">determine = decide\u003c/span>\u003cdiv class=\"w\">determine을 더 일상적인 decide로 대체했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">merely\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">just\u003c/span>\u003cspan class=\"y-eq\">merely = just\u003c/span>\u003cdiv class=\"w\">merely를 더 구어적인 just로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Your current situation does not decide the destination you can reach; it only decides where you begin.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장의 속뜻은, 현재 상황이 좋지 않아도 미래의 목표까지 정해지는 것은 아니라는 겁니다. 현재 상황은 단지 출발점만 결정할 뿐이에요. 그래서 희망을 주는 명언이죠.","hl":"mn"},{"n":12,"text":"present circumstances는 current situation으로 바꿔도 뜻이 같고 더 쉬워요. 그리고 merely determine은 only decide로 바꿀 수 있습니다. 원어민들은 이렇게 바꿔 쓰는 경우가 많아요.","hl":"rw"},{"n":13,"text":"circumstances는 conditions와 거의 같은 뜻이고, determine은 decide로, merely는 just로 대체 가능합니다. 모두 시험에 자주 나오는 동의어들이므로 묶어서 기억하세요.","hl":"ph"},{"n":14,"text":"이 문장 전체를 패러프레이징하면, Your current situation does not decide the destination you can reach; it only decides where you begin. 이렇게 쓸 수 있습니다. 뜻은 같으면서 표현이 조금 달라졌죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 The great astronomer Edwin Hubble discovered \u003cspan class=\"fx\">that all distant galaxies are receding from our Milky Way Galaxy\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The great astronomer Edwin Hubble\u003c/div>\u003cdiv class=\"k\">위대한 천문학자 에드윈 허블은\u003c/div>\u003cdiv class=\"e\">discovered\u003c/div>\u003cdiv class=\"k\">발견했다\u003c/div>\u003cdiv class=\"e\">that all distant galaxies are receding\u003c/div>\u003cdiv class=\"k\">모든 먼 은하들이 멀어지고 있다는 것을\u003c/div>\u003cdiv class=\"e\">from our Milky Way Galaxy.\u003c/div>\u003cdiv class=\"k\">우리의 은하수로부터\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>접속사 \u003cb class=\"key\">that\u003c/b>이 이끄는 명사절이 동사 \u003cb class=\"key\">discovered\u003c/b>의 목적어로 쓰였습니다. that절은 '~라는 것'의 의미로, 여기서는 허블이 발견한 사실 전체를 나타냅니다.\u003c/div>","segs":[{"n":15,"text":"The great astronomer Edwin Hubble, 위대한 천문학자 에드윈 허블은. discovered, 발견했다. that all distant galaxies are receding, 모든 먼 은하들이 멀어지고 있다는 것을. from our Milky Way Galaxy, 우리의 은하수로부터","hl":"ch"},{"n":16,"text":"세 번째 문장에서는 that이 이끄는 명사절이 discovered의 목적어로 쓰였어요. that절은 '~라는 것'이라는 뜻으로, 발견한 내용 전체를 담고 있습니다. 이렇게 that절이 목적어로 오면 그 절 전체가 하나의 정보 덩어리가 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 The great astronomer Edwin Hubble discovered \u003cspan class=\"fx\">that all distant galaxies are receding from our Milky Way Galaxy\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>허블이 모든 먼 은하가 우리 은하로부터 멀어지고 있다는, 즉 우주가 팽창하고 있다는 사실을 발견했다는 의미입니다. 천문학의 중요한 발견을 설명하는 문장이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">discovered that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">found that\u003c/span>\u003cdiv class=\"w\">discover 대신 find를 쓰면 더 일반적인 '알아내다'의 의미가 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are receding from\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are moving away from\u003c/span>\u003cdiv class=\"w\">recede를 move away from으로 풀어 쓰면 더 구체적이고 이해하기 쉽습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">astronomer\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">space scientist\u003c/span>\u003cspan class=\"y-eq\">astronomer = space scientist\u003c/span>\u003cdiv class=\"w\">astronomer를 직업을 설명하는 말로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">galaxies\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">star systems\u003c/span>\u003cspan class=\"y-eq\">galaxies = star systems\u003c/span>\u003cdiv class=\"w\">galaxies를 star systems로 표현해도 비슷한 뜻입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">receding\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">moving away\u003c/span>\u003cspan class=\"y-eq\">receding = moving away\u003c/span>\u003cdiv class=\"w\">receding을 움직임을 분명히 나타내는 구로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Edwin Hubble, a great astronomer, found that all faraway galaxies are moving away from our galaxy, the Milky Way.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장은 허블이라는 천문학자가 모든 먼 은하가 우리 은하수에서 멀어지고 있다는 사실을 발견했다는 뜻입니다. 우주가 팽창한다는 중요한 과학적 발견을 말하고 있어요.","hl":"mn"},{"n":18,"text":"discovered that은 found that으로 바꿔도 자연스럽습니다. 그리고 are receding from은 are moving away from으로 풀어 쓰면 더 쉽게 이해할 수 있어요. 뜻은 거의 같습니다.","hl":"rw"},{"n":19,"text":"astronomer는 space scientist로, galaxies는 star systems로, receding은 moving away로 대체할 수 있어요. 특히 recede는 '뒤로 물러나다, 멀어지다'의 뜻으로, move away와 함께 외워두면 좋습니다.","hl":"ph"},{"n":20,"text":"전체 문장을 바꿔서 말하면, Edwin Hubble, a great astronomer, found that all faraway galaxies are moving away from our galaxy, the Milky Way. 이렇게 표현할 수 있습니다. 의미는 그대로이고 어휘만 살짝 바뀌었죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 The woman who was on passport control asked me \u003cspan class=\"fx\">if I had any further identification\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The woman\u003c/div>\u003cdiv class=\"k\">그 여자는\u003c/div>\u003cdiv class=\"e\">who was on passport control\u003c/div>\u003cdiv class=\"k\">[여권 심사대에 있던]\u003c/div>\u003cdiv class=\"e\">asked me\u003c/div>\u003cdiv class=\"k\">내게 물었다\u003c/div>\u003cdiv class=\"e\">if I had any further identification.\u003c/div>\u003cdiv class=\"k\">내가 또 다른 신분 증명 자료를 가졌는지를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">if\u003c/b>가 이끄는 명사절이 동사 \u003cb class=\"key\">asked\u003c/b>의 직접목적어로 쓰였습니다. if는 '~인지 아닌지'의 뜻으로, 여기서는 whether로 바꿔 쓸 수 있습니다. 또한 앞의 who ~ control은 The woman을 수식하는 형용사절입니다.\u003c/div>","segs":[{"n":21,"text":"The woman, 그 여자는. who was on passport control, [여권 심사대에 있던]. asked me, 내게 물었다. if I had any further identification, 내가 또 다른 신분 증명 자료를 가졌는지를","hl":"ch"},{"n":22,"text":"네 번째 문장은 if가 이끄는 명사절이 asked의 목적어로 쓰였어요. if는 '~인지 아닌지'라는 뜻인데, 여기서는 whether로 바꿔 쓸 수 있어요. 그리고 앞에 who was on passport control은 The woman을 꾸며 주는 형용사절입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 The woman who was on passport control asked me \u003cspan class=\"fx\">if I had any further identification\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>여권 심사대에서 일하는 여성이 나에게 추가 신분증이 있는지 물었다는 뜻입니다. 공항이나 국경에서 흔히 겪는 상황을 묘사하고 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">if I had any further identification\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">whether I had any further identification\u003c/span>\u003cdiv class=\"w\">if를 whether로 바꾸면 더 공식적이고 명확한 선택의 의미가 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">asked me\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">inquired of me\u003c/span>\u003cdiv class=\"w\">ask를 inquire로 바꾸면 조금 더 격식 있는 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">passport control\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">immigration\u003c/span>\u003cspan class=\"y-eq\">passport control = immigration\u003c/span>\u003cdiv class=\"w\">passport control을 비슷한 의미의 immigration으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">further identification\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">additional ID\u003c/span>\u003cspan class=\"y-eq\">further = additional, identification = ID\u003c/span>\u003cdiv class=\"w\">further를 additional로, identification을 줄여서 ID로 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">asked\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">inquired\u003c/span>\u003cspan class=\"y-eq\">asked = inquired\u003c/span>\u003cdiv class=\"w\">asked를 더 공식적인 inquired로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The woman at passport control asked me whether I had any additional identification.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"이 문장은 여권 심사대에 있던 여자 분이 나에게 추가 신분증이 있는지 물어봤다는 상황을 말해요. 공항에서 보안 검색할 때 자주 겪는 일이죠.","hl":"mn"},{"n":24,"text":"if I had any further identification은 whether I had any further identification으로 바꿀 수 있습니다. 뜻은 같고 whether가 좀 더 공식적인 느낌을 줘요. 그리고 asked me는 inquired of me로 바꾸면 더 문어체가 됩니다.","hl":"rw"},{"n":25,"text":"passport control은 immigration으로, further identification은 additional ID로, asked는 inquired로 바꿔 쓸 수 있어요. further와 additional은 '추가의'라는 뜻으로 자주 짝을 이룹니다.","hl":"ph"},{"n":26,"text":"이 문장을 통째로 바꾸면, The woman at passport control asked me whether I had any additional identification. 이렇게 쓸 수 있습니다. 의미는 동일하고 표현이 조금 더 간결해졌어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 People who are satisfied appreciate \u003cspan class=\"fx\">what they have in life and don't worry about how it compares to what others have\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">People who are satisfied\u003c/div>\u003cdiv class=\"k\">만족하는 사람들은\u003c/div>\u003cdiv class=\"e\">appreciate\u003c/div>\u003cdiv class=\"k\">감사한다\u003c/div>\u003cdiv class=\"e\">what they have in life\u003c/div>\u003cdiv class=\"k\">그들이 인생에서 가진 것을\u003c/div>\u003cdiv class=\"e\">and don't worry about\u003c/div>\u003cdiv class=\"k\">그리고 걱정하지 않는다\u003c/div>\u003cdiv class=\"e\">how it compares\u003c/div>\u003cdiv class=\"k\">그것이 어떻게 비교되는지에 대해서\u003c/div>\u003cdiv class=\"e\">to what others have.\u003c/div>\u003cdiv class=\"k\">다른 사람들이 가진 것과\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">what\u003c/b>이 이끄는 명사절 what they have in life가 동사 \u003cb class=\"key\">appreciate\u003c/b>의 목적어로 쓰였습니다. 또한 \u003cb class=\"key\">how\u003c/b>가 이끄는 명사절 how it compares to what others have가 전치사 \u003cb class=\"key\">about\u003c/b>의 목적어로 쓰였고, 그 안에 다시 \u003cb class=\"key\">what\u003c/b>이 이끄는 명사절 what others have가 전치사 \u003cb class=\"key\">to\u003c/b>의 목적어로 쓰였습니다.\u003c/div>","segs":[{"n":27,"text":"People who are satisfied, 만족하는 사람들은. appreciate, 감사한다. what they have in life, 그들이 인생에서 가진 것을. and don't worry about, 그리고 걱정하지 않는다. how it compares, 그것이 어떻게 비교되는지에 대해서. to what others have, 다른 사람들이 가진 것과","hl":"ch"},{"n":28,"text":"다섯 번째 문장은 what과 how가 이끄는 명사절이 여러 번 나오는 복잡한 구조예요. what they have in life는 appreciate의 목적어이고, how it compares to what others have는 전치사 about의 목적어입니다. 그 안에 또 what others have가 전치사 to의 목적어로 들어 있어요. 이렇게 명사절이 겹겹이 들어갈 수 있다는 점을 잘 봐두세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 People who are satisfied appreciate \u003cspan class=\"fx\">what they have in life and don't worry about how it compares to what others have\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>자신의 삶에 만족하는 사람들은 자신이 가진 것에 감사하고, 그것을 남이 가진 것과 비교하는 걱정을 하지 않는다는 뜻입니다. 만족과 감사의 태도를 강조합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">People who are satisfied\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Those who are content\u003c/span>\u003cdiv class=\"w\">satisfied를 content로, people을 those로 바꾸면 조금 더 문어적이고 간결해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">don't worry about how it compares to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">don't concern themselves with how it stacks up against\u003c/span>\u003cdiv class=\"w\">worry about를 concern themselves with로, compare to를 stack up against로 바꾸면 더 생생한 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">satisfied\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">content\u003c/span>\u003cspan class=\"y-eq\">satisfied = content\u003c/span>\u003cdiv class=\"w\">satisfied를 비슷한 뜻의 content로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">appreciate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">value\u003c/span>\u003cspan class=\"y-eq\">appreciate = value\u003c/span>\u003cdiv class=\"w\">appreciate를 '소중히 여기다'의 의미인 value로 대체했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">compares to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">measures up to\u003c/span>\u003cspan class=\"y-eq\">compares to = measures up to\u003c/span>\u003cdiv class=\"w\">compare to를 '~에 필적하다'의 뉘앙스인 measure up to로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Those who are content value what they possess in life and do not worry about how it measures up to what other people have.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"이 문장은 만족하는 사람들은 자기 인생에서 가진 것을 소중히 여기고, 다른 사람의 것과 비교하면서 걱정하지 않는다는 뜻이에요. 쉽게 말해, 현재에 감사하고 비교하지 않는 태도가 만족의 비결이라는 거죠.","hl":"mn"},{"n":30,"text":"People who are satisfied는 Those who are content로 바꿀 수 있어요. 그리고 don't worry about how it compares to는 don't concern themselves with how it stacks up against로 바꾸면 더 생생한 표현이 됩니다. 시험에서는 이렇게 바꿔 쓰는 능력이 중요해요.","hl":"rw"},{"n":31,"text":"satisfied는 content로, appreciate는 value로, compares to는 measures up to로 대체 가능합니다. 이 단어들은 모두 '만족하다, 감사하다, 비교하다'의 의미를 가지고 있어요.","hl":"ph"},{"n":32,"text":"이 문장 전체를 패러프레이징하면, Those who are content value what they possess in life and do not worry about how it measures up to what other people have. 이렇게 됩니다. 원문과 뜻은 같지만 어휘가 조금 고급스러워졌죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">06 Perhaps, we've just forgotten \u003cspan class=\"fx\">that we are still pioneers, that we've barely begun, and that our greatest accomplishments cannot be behind us\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Perhaps,\u003c/div>\u003cdiv class=\"k\">아마도\u003c/div>\u003cdiv class=\"e\">we've just forgotten\u003c/div>\u003cdiv class=\"k\">우리는 그저 잊어버렸는지도 모른다\u003c/div>\u003cdiv class=\"e\">that we are still pioneers,\u003c/div>\u003cdiv class=\"k\">우리가 여전히 개척자라는 것을\u003c/div>\u003cdiv class=\"e\">that we've barely begun,\u003c/div>\u003cdiv class=\"k\">우리가 개척을 시작했다는 것을\u003c/div>\u003cdiv class=\"e\">and that our greatest accomplishments cannot be behind us.\u003c/div>\u003cdiv class=\"k\">그리고 우리의 가장 위대한 성취는 우리의 뒤에 있을 수 없다는 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>접속사 \u003cb class=\"key\">that\u003c/b>이 이끄는 세 개의 명사절이 콤마와 and에 의해 병렬 연결되어 동사 \u003cb class=\"key\">have forgotten\u003c/b>의 목적어로 쓰였습니다. that절이 길어질 때 이렇게 병렬 구조로 나열하면 리듬감이 생깁니다.\u003c/div>","segs":[{"n":33,"text":"Perhaps, 아마도. we've just forgotten, 우리는 그저 잊어버렸는지도 모른다. that we are still pioneers, 우리가 여전히 개척자라는 것을. that we've barely begun, 우리가 개척을 시작했다는 것을. and that our greatest accomplishments cannot be behind us, 그리고 우리의 가장 위대한 성취는 우리의 뒤에 있을 수 없다는 것을","hl":"ch"},{"n":34,"text":"여섯 번째 문장은 that이 이끄는 명사절이 세 개나 나와서 콤마와 and로 연결되어 있어요. 이 세 절 모두 have forgotten의 목적어입니다. 이렇게 긴 목적어를 병렬로 나열할 때는 각 절의 시작을 that으로 통일해 주면 문장이 깔끔해집니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">06 Perhaps, we've just forgotten \u003cspan class=\"fx\">that we are still pioneers, that we've barely begun, and that our greatest accomplishments cannot be behind us\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리가 여전히 개척자이고, 이제 막 시작했으며, 우리의 가장 위대한 성취가 뒤에 있을 수 없다는 것을 잊었다는 뜻입니다. 즉, 미래에 더 큰 일이 남아 있다는 희망의 메시지입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">we've just forgotten\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">we have simply failed to remember\u003c/span>\u003cdiv class=\"w\">just forgotten을 simply failed to remember로 바꾸면 의미가 강조되고 더 공식적입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cannot be behind us\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are not behind us\u003c/span>\u003cdiv class=\"w\">cannot be를 are not으로 바꾸면 좀 더 단정적인 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pioneers\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">trailblazers\u003c/span>\u003cspan class=\"y-eq\">pioneers = trailblazers\u003c/span>\u003cdiv class=\"w\">pioneers를 비슷한 뜻의 trailblazers로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">barely begun\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">just started\u003c/span>\u003cspan class=\"y-eq\">barely = just, begun = started\u003c/span>\u003cdiv class=\"w\">barely begun을 더 쉬운 just started로 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">accomplishments\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">achievements\u003c/span>\u003cspan class=\"y-eq\">accomplishments = achievements\u003c/span>\u003cdiv class=\"w\">accomplishments를 같은 뜻의 achievements로 대체했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Maybe we have simply forgotten that we are still trailblazers, that we have just started, and that our greatest achievements cannot be in the past.\u003c/div>\u003c/div>","segs":[{"n":35,"text":"이 문장은 우리가 여전히 개척자이고, 이제 막 시작했으며, 가장 위대한 성취는 아직 앞에 있다는 사실을 잊고 있다는 뜻이에요. 과거에 집착하지 말고 미래를 향해 나아가라는 메시지를 담고 있습니다.","hl":"mn"},{"n":36,"text":"we've just forgotten은 we have simply failed to remember로 바꿀 수 있고, cannot be behind us는 are not behind us로 바꾸면 더 직설적인 표현이 됩니다. 뜻은 같지만 어감이 조금 달라져요.","hl":"rw"},{"n":37,"text":"pioneers는 trailblazers로, barely begun은 just started로, accomplishments는 achievements로 바꿔 쓸 수 있어요. 특히 bare은 '거의 ~않는'이라는 뜻으로 just와 자주 짝을 이룹니다.","hl":"ph"},{"n":38,"text":"전체를 바꾸면, Maybe we have simply forgotten that we are still trailblazers, that we have just started, and that our greatest achievements cannot be in the past. 이렇게 표현할 수 있습니다. 같은 뜻이면서 표현이 조금 더 현대적이에요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">07 Actors are so fortunate. They can choose \u003cspan class=\"fx\">whether they will appear in tragedy or in comedy, whether they will suffer or make merry, laugh or shed tears\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Actors are so fortunate.\u003c/div>\u003cdiv class=\"k\">배우들은 아주 운이 좋다\u003c/div>\u003cdiv class=\"e\">They can choose\u003c/div>\u003cdiv class=\"k\">그들은 선택할 수 있다\u003c/div>\u003cdiv class=\"e\">whether they will appear in tragedy or in comedy,\u003c/div>\u003cdiv class=\"k\">자신들이 비극 또는 희극에 출연할 것인지를\u003c/div>\u003cdiv class=\"e\">whether they will suffer or make merry,\u003c/div>\u003cdiv class=\"k\">그들이 고통을 겪을 것인지 또는 즐겁게 놀지\u003c/div>\u003cdiv class=\"e\">laugh or shed tears.\u003c/div>\u003cdiv class=\"k\">눈물을 흘릴 것인지를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>접속사 \u003cb class=\"key\">whether\u003c/b>가 이끄는 명사절이 두 번 나와서 동사 \u003cb class=\"key\">choose\u003c/b>의 목적어로 쓰였습니다. 두 번째 whether절은 'suffer or make merry, laugh or shed tears'처럼 내부에 다시 선택의 구조를 가집니다.\u003c/div>","segs":[{"n":39,"text":"Actors are so fortunate, 배우들은 아주 운이 좋다. They can choose, 그들은 선택할 수 있다. whether they will appear in tragedy or in comedy, 자신들이 비극 또는 희극에 출연할 것인지를. whether they will suffer or make merry, 그들이 고통을 겪을 것인지 또는 즐겁게 놀지. laugh or shed tears, 눈물을 흘릴 것인지를","hl":"ch"},{"n":40,"text":"일곱 번째 문장은 whether가 이끄는 명사절이 choose의 목적어로 두 번 나와요. 첫 번째 whether절은 비극이나 희극 중 선택, 두 번째 whether절은 고통이나 즐거움, 웃음이나 눈물 중 선택을 나타냅니다. 이처럼 whether는 여러 선택지를 제시할 때 유용합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 Actors are so fortunate. They can choose \u003cspan class=\"fx\">whether they will appear in tragedy or in comedy, whether they will suffer or make merry, laugh or shed tears\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>배우들은 비극에 출연할지 희극에 출연할지, 고통을 겪을지 즐길지, 웃을지 울지를 선택할 수 있어서 운이 좋다는 뜻입니다. 인생의 다양한 감정을 연기로 경험할 수 있는 배우의 특권을 말합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">They can choose whether\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">They have the option whether\u003c/span>\u003cdiv class=\"w\">can choose를 have the option으로 바꾸면 선택권을 가진다는 의미가 더 명확해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make merry\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">enjoy themselves\u003c/span>\u003cdiv class=\"w\">make merry를 더 평이한 enjoy themselves로 바꾸면 이해하기 쉽습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">so fortunate\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">so lucky\u003c/span>\u003cspan class=\"y-eq\">fortunate = lucky\u003c/span>\u003cdiv class=\"w\">fortunate를 더 일상적인 lucky로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">appear in\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">perform in\u003c/span>\u003cspan class=\"y-eq\">appear in = perform in\u003c/span>\u003cdiv class=\"w\">appear in을 '공연하다'의 의미인 perform in으로 대체했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">shed tears\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cry\u003c/span>\u003cspan class=\"y-eq\">shed tears = cry\u003c/span>\u003cdiv class=\"w\">shed tears를 간단히 cry로 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Actors are very lucky because they can decide if they will be in a tragedy or a comedy, if they will suffer or have fun, laugh or cry.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"이 문장은 배우들이 비극이나 희극에 출연할지, 고통을 겪을지 기쁨을 누릴지, 웃을지 울지를 스스로 선택할 수 있어서 정말 운이 좋다는 뜻이에요. 인생의 여러 감정을 연기로 체험할 수 있다는 거죠.","hl":"mn"},{"n":42,"text":"They can choose whether를 They have the option whether로 바꾸면 '선택권이 있다'는 의미가 더 또렷해집니다. 그리고 make merry는 enjoy themselves로 바꾸면 더 쉬운 표현이 돼요.","hl":"rw"},{"n":43,"text":"so fortunate는 so lucky로, appear in은 perform in으로, shed tears는 cry로 바꿔 쓸 수 있습니다. 이 표현들은 모두 감정이나 공연과 관련된 어휘라서 함께 외워두면 좋아요.","hl":"ph"},{"n":44,"text":"전체를 패러프레이징하면, Actors are very lucky because they can decide if they will be in a tragedy or a comedy, if they will suffer or have fun, laugh or cry. 이렇게 쓸 수 있어요. 뜻은 그대로이면서 if를 써서 조금 더 구어적인 느낌을 냈습니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 Environmentalists argue \u003cspan class=\"fx\">no system of waste disposal can be absolutely safe, either now or in the future\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Environmentalists argue\u003c/div>\u003cdiv class=\"k\">환경 운동가들은 주장한다\u003c/div>\u003cdiv class=\"e\">no system of waste disposal\u003c/div>\u003cdiv class=\"k\">어떠한 쓰레기 처리 시스템도\u003c/div>\u003cdiv class=\"e\">can be absolutely safe,\u003c/div>\u003cdiv class=\"k\">절대적으로 안전할 수는 없다고\u003c/div>\u003cdiv class=\"e\">either now or in the future.\u003c/div>\u003cdiv class=\"k\">지금이든 미래든\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>동사 \u003cb class=\"key\">argue\u003c/b> 다음에 목적어 역할을 하는 명사절을 이끄는 접속사 \u003cb class=\"key\">that\u003c/b>이 생략되어 있습니다. that이 생략되어도 문장이 자연스러우며, '~라고 주장한다'의 의미가 됩니다.\u003c/div>","segs":[{"n":45,"text":"Environmentalists argue, 환경 운동가들은 주장한다. no system of waste disposal, 어떠한 쓰레기 처리 시스템도. can be absolutely safe, 절대적으로 안전할 수는 없다고. either now or in the future, 지금이든 미래든","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 argue 다음에 that이 생략된 명사절이 목적어로 왔어요. 원래는 argue that no system...인데, 회화체에서는 접속사 that을 자주 생략합니다. 시험에서 이렇게 that이 생략된 구조를 발견하는 것이 중요해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 Environmentalists argue \u003cspan class=\"fx\">no system of waste disposal can be absolutely safe, either now or in the future\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>환경운동가들은 어떤 쓰레기 처리 시스템도 지금이나 미래에 절대적으로 안전할 수 없다고 주장한다는 뜻입니다. 쓰레기 처리의 위험성을 강조하는 주장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">argue no system\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">argue that no system\u003c/span>\u003cdiv class=\"w\">생략된 that을 넣으면 문장이 더 명확해지고 공식적인 글이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">absolutely safe\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">completely safe\u003c/span>\u003cdiv class=\"w\">absolutely를 completely로 바꾸면 뜻은 같지만 더 일상적입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">argue\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">contend\u003c/span>\u003cspan class=\"y-eq\">argue = contend\u003c/span>\u003cdiv class=\"w\">argue를 '주장하다'의 뜻인 contend로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">waste disposal\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">waste management\u003c/span>\u003cspan class=\"y-eq\">waste disposal = waste management\u003c/span>\u003cdiv class=\"w\">disposal을 management로 바꾸면 더 포괄적인 처리 개념이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">absolutely\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">totally\u003c/span>\u003cspan class=\"y-eq\">absolutely = totally\u003c/span>\u003cdiv class=\"w\">absolutely를 totally로 대체해도 같은 강조의 의미입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Environmentalists contend that no waste management system can be totally safe, now or in the future.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"환경운동가들은 어떤 쓰레기 처리 시스템도 지금이든 미래든 완전히 안전할 수 없다고 주장한다는 뜻입니다. 쓰레기 처리의 위험을 경고하는 문장이에요.","hl":"mn"},{"n":48,"text":"argue no system은 argue that no system으로 that을 넣어도 되고, absolutely safe는 completely safe로 바꿀 수 있어요. 뜻은 같지만 that을 넣으면 문장이 더 분명해집니다.","hl":"rw"},{"n":49,"text":"argue는 contend로, waste disposal은 waste management로, absolutely는 totally로 바꿔 쓸 수 있습니다. 특히 disposal과 management는 환경 관련 글에서 자주 등장하니 잘 기억하세요.","hl":"ph"},{"n":50,"text":"전체를 바꾸면, Environmentalists contend that no waste management system can be totally safe, now or in the future. 이렇게 됩니다. that을 넣고 어휘를 약간 바꿔서 같은 내용을 다르게 표현했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 Either Saturday or Monday, choose \u003cspan class=\"fx\">whichever is more convenient for you\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Either Saturday or Monday,\u003c/div>\u003cdiv class=\"k\">토요일이나 월요일 중\u003c/div>\u003cdiv class=\"e\">choose\u003c/div>\u003cdiv class=\"k\">선택하라\u003c/div>\u003cdiv class=\"e\">whichever is more convenient for you.\u003c/div>\u003cdiv class=\"k\">어느 것이든 네게 더 편한 쪽을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>복합관계대명사 \u003cb class=\"key\">whichever\u003c/b>가 이끄는 명사절이 동사 \u003cb class=\"key\">choose\u003c/b>의 목적어로 쓰였습니다. whichever는 '어느 것이든 ~한 것'이라는 뜻으로, 선택의 범위를 포괄합니다.\u003c/div>","segs":[{"n":51,"text":"Either Saturday or Monday, 토요일이나 월요일 중. choose, 선택하라. whichever is more convenient for you, 어느 것이든 네게 더 편한 쪽을","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 whichever가 이끄는 명사절이 choose의 목적어로 쓰였어요. whichever는 '어느 것이든'이라는 뜻의 복합관계대명사로, 명사절을 이끌면서 동시에 선택지를 포함합니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 Either Saturday or Monday, choose \u003cspan class=\"fx\">whichever is more convenient for you\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>토요일이나 월요일 중에서 너에게 더 편한 날을 선택하라는 뜻입니다. 두 가지 옵션 중 하나를 고르라는 친절한 제안입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whichever is more convenient\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">whichever one is more convenient\u003c/span>\u003cdiv class=\"w\">one을 넣어 주면 '어느 쪽 하나'라는 의미가 더 분명해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Either Saturday or Monday\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">On Saturday or Monday\u003c/span>\u003cdiv class=\"w\">Either를 빼고 On을 쓰면 더 간단한 표현이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">choose\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">select\u003c/span>\u003cspan class=\"y-eq\">choose = select\u003c/span>\u003cdiv class=\"w\">choose를 더 공식적인 select로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">convenient\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">suitable\u003c/span>\u003cspan eligious sensitivity\u003c/div>\u003cdiv class=\"k\">사회적, 문화적 또는 종교적 민감성의 시대에\u003c/div>\u003cdiv class=\"e\">one might wonder\u003c/div>\u003cdiv class=\"k\">사람들은 궁금해할 수도 있다\u003c/div>\u003cdiv class=\"e\">whether it is ethical\u003c/div>\u003cdiv class=\"k\">(...이) 윤리적인지\u003c/div>\u003cdiv class=\"e\">to avoid, or not to avoid,\u003c/div>\u003cdiv class=\"k\">질문을 피하는 것 또는 피하지 않는 것이\u003c/div>\u003cdiv class=\"e\">questions that might increase conflict.\u003c/div>\u003cdiv class=\"k\">[갈등을 증가시킬 수도 있는]\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>접속사 \u003cb class=\"key\">whether\u003c/b>가 이끄는 명사절이 동사 \u003cb class=\"key\">wonder\u003c/b>의 목적어로 쓰였습니다. 이 whether절 안에서 \u003cb class=\"key\">it\u003c/b>은 가주어이고, 진주어는 \u003cb class=\"key\">to avoid, or not to avoid, questions that might increase conflict\u003c/b>입니다. 또한 that might increase conflict는 questions를 수식하는 형용사절입니다.\u003c/div>","segs":[{"n":63,"text":"In times of social, cultural or religious sensitivity, 사회적, 문화적 또는 종교적 민감성의 시대에. one might wonder, 사람들은 궁금해할 수도 있다. whether it is ethical, (...이) 윤리적인지. to avoid, or not to avoid, 질문을 피하는 것 또는 피하지 않는 것이. questions that might increase conflict, [갈등을 증가시킬 수도 있는]","hl":"ch"},{"n":64,"text":"열한 번째 문장은 whether가 이끄는 명사절이 wonder의 목적어로 쓰였고, 그 안에 가주어 it과 진주어 to부정사가 들어 있어요. that might increase conflict는 questions를 꾸미는 형용사절입니다. 이렇게 한 문장 안에 여러 절이 겹쳐 있을 수 있다는 걸 보여 주는 복잡한 구조입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 In times of social, cultural or religious sensitivity one might wonder \u003cspan class=\"fx\">whether it is ethical to avoid, or not to avoid, questions that might increase conflict\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사회적, 문화적, 종교적으로 민감한 시기에 갈등을 키울 수 있는 질문을 피하는 것이 윤리적인지, 피하지 않는 것이 윤리적인지 궁금해할 수 있다는 뜻입니다. 민감한 주제에 대한 윤리적 고민을 나타냅니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">one might wonder whether\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">people may ask themselves if\u003c/span>\u003cdiv class=\"w\">one might wonder를 people may ask themselves if로 바꾸면 더 구체적이고 일상적입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">to avoid, or not to avoid\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">to avoid or to address\u003c/span>\u003cdiv class=\"w\">not to avoid를 to address로 바꾸면 '피하지 않고 다루다'의 의미가 더 명확해집니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sensitivity\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">delicacy\u003c/span>\u003cspan class=\"y-eq\">sensitivity = delicacy\u003c/span>\u003cdiv class=\"w\">sensitivity를 '미묘함'의 뜻인 delicacy로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">ethical\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">moral\u003c/span>\u003cspan class=\"y-eq\">ethical = moral\u003c/span>\u003cdiv class=\"w\">ethical을 같은 뜻의 moral로 대체했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">increase conflict\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">heighten tension\u003c/span>\u003cspan class=\"y-eq\">increase conflict = heighten tension\u003c/span>\u003cdiv class=\"w\">increase conflict를 '긴장을 고조시키다'의 표현으로 바꿨습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">During times of social, cultural, or religious delicacy, people may ask themselves if it is moral to avoid, or to address, questions that might heighten tension.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"이 문장은 사회적, 문화적, 종교적으로 예민한 시기에 갈등을 키울 수 있는 질문을 피하는 것이 윤리적인지, 아니면 피하지 않는 것이 윤리적인지 궁금해할 수 있다는 의미예요. 민감한 주제를 다룰 때의 딜레마를 말하고 있습니다.","hl":"mn"},{"n":66,"text":"one might wonder whether는 people may ask themselves if로 바꿀 수 있고, to avoid or not to avoid는 to avoid or to address로 바꾸면 '피하거나 다루거나'의 뜻이 더 분명해져요.","hl":"rw"},{"n":67,"text":"sensitivity는 delicacy로, ethical은 moral로, increase conflict는 heighten tension으로 바꿔 쓸 수 있어요. 이 표현들은 사회적 이슈를 다룰 때 자주 쓰입니다.","hl":"ph"},{"n":68,"text":"전체를 패러프레이징하면, During times of social, cultural, or religious delicacy, people may ask themselves if it is moral to avoid, or to address, questions that might heighten tension. 이렇게 됩니다. 어휘가 바뀌었지만 의미는 동일하죠.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 The government will take \u003cspan class=\"fx\">whatever action is necessary to achieve monetary and financial stability\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The government will take\u003c/div>\u003cdiv class=\"k\">정부는 취할 것이다\u003c/div>\u003cdiv class=\"e\">whatever action is necessary\u003c/div>\u003cdiv class=\"k\">필요한 어떤 조치든지\u003c/div>\u003cdiv class=\"e\">to achieve monetary and financial stability.\u003c/div>\u003cdiv class=\"k\">통화와 금융의 안정성을 확보하기 위해서\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>복합관계형용사 \u003cb class=\"key\">whatever\u003c/b>가 명사 action을 수식하면서 이끄는 명사절 전체가 동사 \u003cb class=\"key\">take\u003c/b>의 목적어로 쓰였습니다. whatever는 '어떤 ~이든'의 뜻으로, 필요한 모든 조치를 포함합니다.\u003c/div>","segs":[{"n":69,"text":"The government will take, 정부는 취할 것이다. whatever action is necessary, 필요한 어떤 조치든지. to achieve monetary and financial stability, 통화와 금융의 안정성을 확보하기 위해서","hl":"ch"},{"n":70,"text":"열두 번째 문장은 whatever가 명사 action을 꾸미면서 이끄는 명사절이 take의 목적어로 쓰였어요. whatever는 복합관계형용사로, '어떤 ~이든'이라는 뜻을 갖고 있어요. 이렇게 whatever가 명사를 수식하면 그 명사구 전체가 목적어가 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 The government will take \u003cspan class=\"fx\">whatever action is necessary to achieve monetary and financial stability\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>정부가 통화와 금융의 안정을 이루기 위해 필요한 어떤 조치든지 취할 것이라는 뜻입니다. 정부의 강력한 의지를 표현한 문장입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">whatever action is necessary\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">any action that is necessary\u003c/span>\u003cdiv class=\"w\">whatever를 any ~ that으로 풀어 쓰면 '필요한 어떤 조치라도'의 의미가 그대로 전달됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">achieve monetary and financial stability\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">attain monetary and fiscal stability\u003c/span>\u003cdiv class=\"w\">achieve를 attain으로, financial을 fiscal로 바꾸면 더 공식적인 경제 용어가 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take action\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">take measures\u003c/span>\u003cspan class=\"y-eq\">take action = take measures\u003c/span>\u003cdiv class=\"w\">action을 measures로 바꾸면 '조치'의 의미가 더 구체적입니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">achieve\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">attain\u003c/span>\u003cspan class=\"y-eq\">achieve = attain\u003c/span>\u003cdiv class=\"w\">achieve를 '달성하다'의 뜻인 attain으로 바꿨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">stability\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">soundness\u003c/span>\u003cspan class=\"y-eq\">stability = soundness\u003c/span>\u003cdiv class=\"w\">stability를 '건전성'의 뜻인 soundness로 대체했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">The government will take any measures that are needed to attain monetary and fiscal soundness.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"정부가 통화와 금융의 안정을 이루기 위해 필요한 어떤 조치든 다 취하겠다는 뜻입니다. 경제 안정을 위한 정부의 강한 의지를 보여 주는 문장이에요.","hl":"mn"},{"n":72,"text":"whatever action is necessary는 any action that is necessary로 바꿔 쓸 수 있어요. 뜻은 같지만 whatever가 더 간결하고 강한 느낌을 줍니다. 그리고 achieve monetary and financial stability는 attain monetary and fiscal stability로 바꾸면 더 전문적인 경제 용어가 됩니다.","hl":"rw"},{"n":73,"text":"take action은 take measures로, achieve는 attain으로, stability는 soundness로 바꿀 수 있어요. 모두 경제나 정책 기사에서 자주 나오는 표현입니다.","hl":"ph"},{"n":74,"text":"전체 문장을 바꾸면, The government will take any measures that are needed to attain monetary and fiscal soundness. 이렇게 표현할 수 있습니다. whatever를 any ~ that으로 풀어서 같은 뜻을 나타냈어요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">명사절\u003c/b>은 that, whether, if, 의문사(where, what, how), 복합관계사(whichever, whatever) 등이 이끌며 \u003cb class=\"key\">동사나 전치사의 목적어\u003c/b>로 쓰인다.\u003c/li>\u003cli>\u003cb class=\"key\">that\u003c/b>절은 '~라는 것'의 의미로, 목적어 자리에서 that이 \u003cb class=\"key\">생략\u003c/b>될 수 있다.\u003c/li>\u003cli>\u003cb class=\"key\">whether\u003c/b>와 \u003cb class=\"key\">if\u003c/b>는 '~인지 아닌지'의 뜻으로 명사절을 이끌며, whether가 더 공식적이고 \u003cb class=\"key\">선택의 의미\u003c/b>가 강하다.\u003c/li>\u003cli>\u003cb class=\"key\">what\u003c/b>, \u003cb class=\"key\">where\u003c/b>, \u003cb class=\"key\">how\u003c/b> 같은 의문사절은 '~하는 것, ~하는 곳, ~하는 방법'의 의미로 목적어가 된다.\u003c/li>\u003cli>\u003cb class=\"key\">whichever\u003c/b>, \u003cb class=\"key\">whatever\u003c/b> 같은 복합관계사절은 '어느 것이든, 어떤 ~이든'의 뜻으로 목적어를 이끈다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘 우리는 명사절이 목적어로 쓰이는 다양한 접속사들을 공부했어요. that은 '~라는 것', whether와 if는 '~인지 아닌지', what과 where, how는 의문사가 이끄는 명사절, whichever와 whatever는 복합관계사가 이끄는 명사절로 모두 문장에서 목적어 역할을 한다는 점을 꼭 기억하세요. 이 구조들을 잘 익혀 두면 긴 문장도 덩어리로 묶어서 해석할 수 있어요. 오늘 수고 많았고, 다음 시간에 또 만나요.","hl":"sum"}]}]});</script></body></html>
