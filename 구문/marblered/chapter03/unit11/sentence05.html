/j35ppdRgkjHT8u35f40u5cHJGeMc/nn/P6Zo+a+/v/AMOgF/l/n8uwPX8aTuM9O/8An/PPtSF19QOBkZ/D1OT9O59+TcOOR6A5HHf+Z/Mildd196DXs1pcWjA75/x//X+XtSZX+8Pz/wA5/ln86Ny/3h+f+f8AP40cy6Nd9+3X5Bb+vl+Vhf1o/wAikDKc4IGMg8+3PU/h79hRuXj5gR0GDnuf880XXdfeHlZ/537f1f8AAdz/AJ/H/wCvRj3H+Pr+Wf8ADNN3L6j8x+vP/wBfmgso5yPxPvxyDz6HpT3/AA/4b9Bfp/w/9d+tx3fjHb37enr6+9JQSAMkjnjqB16Yx26Z4Hp9DI9Rx78f54/TpxR+n/DB/VtO6X4P+theP8/554+nJpDjaTjp0/X+fTj/APWm5fUfmKcMnBALZHGATnjOOQBkenTHtnC5lvdet0Etn6Pp06n/2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Secret to Satisfaction: Focusing on Oneself Rather Than Others<small>만족의 비결: 타인이 아닌 자신에게 집중하기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 SNS를 보다가 남들과 자신을 비교하며 우울해진 적 있나요? 이 글은 &#39;만족(Satisfaction)&#39;이라는 감정이 단순히 상황적인 요소가 아니라, 타인과 나를 비교하지 않는 심리적 태도에서 온다는 점을 강조하고 있어요. 심리학에서는 이를 &#39;상대적 박탈감(Relative Deprivation)&#39;의 반대 개념으로 볼 수 있는데, 남과 비교하며 생기는 상대적 기준을 내려놓는 것이 행복의 핵심이라고 말하죠. 마치 맛있는 음식을 먹을 때 옆 사람의 식단과 내 식단을 비교하느라 정작 내 음식의 맛을 즐기지 못하는 것과 같아요. 즉, 만족하는 사람들은 타인과의 경쟁이 아닌, 스스로가 가진 가치에 집중하는 삶의 태도를 지니고 있다는 사실을 기억하면 지문을 훨씬 쉽게 이해할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01만족의 정의</div><ul><li>진정한 만족을 느끼는 사람들은 현재 자신이 가진 것에 집중하며 감사함을 느낍니다.</li><li>자신의 삶에 대한 긍정적 평가</li><li>현재 가진 것(what they have)을 소중히 여기는 태도</li><li>핵심 키워드: 만족(satisfied), 감사(appreciate)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02비교하지 않는 마음</div><ul><li>만족하는 사람들은 자신의 삶을 타인의 삶과 견주어 보지 않습니다.</li><li>타인의 소유물에 관심 없음</li><li>남들과 비교(compares)하는 행위를 하지 않음</li><li>불필요한 걱정을 차단함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결론</div><ul><li>남과 비교하지 않는 태도는 평온하고 만족스러운 삶을 유지하는 핵심 비결입니다.</li><li>외부와의 경쟁보다 내면의 상태를 중시</li><li>심리적 안정감을 유지하는 방법</li><li>핵심 키워드: 비교(compares), 평온(contentment)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">satisfy</td><td class=\"m\">만족시키다</td></tr><tr><td class=\"w\">appreciate</td><td class=\"m\">진가를 알아보다, 감사하게 여기다</td></tr><tr><td class=\"w\">compare</td><td class=\"m\">비교하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만족하는 사람들은</span><span class=\"en\"><b>People <span class=\"grammar-hl\">who are satisfied</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감사하게 여긴다</span><span class=\"en\"><b>appreciate</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 가진 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">what they have</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인생에서</span><span class=\"en\"><b>in life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 걱정하지 않는다</span><span class=\"en\"><b>and don’t worry about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 그것이 비교되는지에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">how it compares</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들이 가진 것과</span><span class=\"en\"><b><span class=\"grammar-hl\">to what others have</span>.</b></span></div></div><div class=\"lec-sent-ko\">만족하는 사람들은 그들이 인생에서 가진 것을 감사하고 다른 사람들이 가진 것과 그것이 어떻게 비교되는지에 대해서 걱정하지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 만족하는 삶의 태도를 정의하고 있습니다. 여기서 **appreciate**는 사전적으로는 &#39;감상하다, 이해하다&#39;라는 뜻이지만, 여기서는 &#39;가치를 인정하고 감사히 여기다&#39;라는 의미로 쓰였습니다. 필자는 단순히 가진 것을 인식하는 것을 넘어 그것이 얼마나 소중한지 깊이 깨닫는 태도를 강조하기 위해 이 단어를 선택했습니다. 또한, 다른 사람과의 비교를 &#39;걱정&#39;한다는 것은 남과 비교하는 행위 자체가 불필요한 불안을 야기함을 시사하며, 앞부분의 &#39;가치 인정&#39;과 뒷부분의 &#39;비교하지 않음&#39;을 대조시켜 만족의 조건을 명확히 설명하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who are satisfied (관계대명사): 주격 관계대명사 who가 이끄는 절이 앞의 선행사 People을 수식한다. who 뒤에 바로 주어가 없이 동사가 바로 나오므로, who는 주어 역할을 하는 관계대명사이다.</div><div class=\"lec-gr-item\">are satisfied (수동태): be동사(are)+p.p.(satisfied) 구조. satisfy는 &#39;만족시키다&#39;라는 의미의 타동사인데, 뒤에 목적어가 없으므로 주어인 People이 만족을 받는 대상임을 나타내는 수동구조 are satisfied로 쓴다. 기본구조: satisfy + O(사람).</div><div class=\"lec-gr-item\">what they have (관계대명사): 선행사를 포함한 관계대명사 what(~하는 것)이 이끄는 절이 appreciate의 목적어 역할을 한다. what 뒤에 have의 목적어 자리가 비어 있는 불완전한 문장 구조이다.</div><div class=\"lec-gr-item\">how it compares to what others have (간접의문문): 의문사(how) + 주어(it) + 동사(compares) 순서의 명사절로, worry의 전치사 about 뒤에서 목적어 역할을 한다.</div><div class=\"lec-gr-item\">what others have (관계대명사): 선행사를 포함한 관계대명사 what(~하는 것)이 이끄는 절이 전치사 to의 목적어 역할을 한다. what 뒤에 have의 목적어 자리가 비어 있는 불완전한 문장 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">appreciate</td><td class=\"m\">진가를 알아보다, 감사하게 여기다</td></tr><tr><td class=\"w\">compare</td><td class=\"m\">비교하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>만족하는 사람들은 현재 자신이 가진 삶의 조건에 감사함을 느낀다.</li><li>이들은 타인의 소유물과 자신의 것을 비교하며 불필요한 걱정을 하지 않는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Satisfied people value their own lives, and they do not feel anxious about how their situation compares to others.</div>\n              <div class=\"lec-final-sum-ko\">만족하는 사람들은 자신의 삶을 가치 있게 여기며, 자신의 상황을 타인과 비교하는 것에 대해 불안해하지 않는다.</div></div></div>"],"segs":[[{"audio":"./sentence05_audio/1.mp3","hl":null}],[{"audio":"./sentence05_audio/2.mp3","hl":null}],[{"audio":"./sentence05_audio/3.mp3","hl":null},{"audio":"./sentence05_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence05_audio/5.mp3","hl":
