<li>핵심 키워드: 판사(judge), 유죄(guilty), 무죄(innocent)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02판결의 목적</div><ul><li>판사는 증거와 법을 바탕으로 피고인의 행위가 범죄인지 판별하여 정의를 실현한다.</li><li>법적 기준에 따른 범죄 여부 확인</li><li>피고인의 책임 유무를 가리는 과정</li><li>핵심 키워드: 범죄(crime), 결정(decide)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">judge</td><td class=\"m\">판사</td></tr><tr><td class=\"w\">decide</td><td class=\"m\">결정하다, 판단하다</td></tr><tr><td class=\"w\">whether</td><td class=\"m\">~인지 (아닌지)</td></tr><tr><td class=\"w\">guilty</td><td class=\"m\">유죄의</td></tr><tr><td class=\"w\">innocent</td><td class=\"m\">무죄의</td></tr><tr><td class=\"w\">crime</td><td class=\"m\">범죄</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">판사는</span><span class=\"en\"><b>A judge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">판결을 내려야 한다</span><span class=\"en\"><b>must decide</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람이</span><span class=\"en\"><b><span class=\"grammar-hl\">whether a person</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유죄인지 또는 무죄인지</span><span class=\"en\"><b><span class=\"grammar-hl\">is guilty or innocent</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">범행에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">of a crime</span>.</b></span></div></div><div class=\"lec-sent-ko\">판사는 어떤 사람이 범행에 대해 유죄인지 무죄인지 판결을 내려야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 판사의 핵심적인 역할이 무엇인지 정의하는 문장입니다. 여기서 decide는 사전적으로는 &#39;결정하다&#39;라는 뜻이지만, 여기서는 법률적인 맥락에 따라 증거를 토대로 최종적인 &#39;판결을 내리다&#39;라는 의미로 쓰였습니다. 판사라는 직업의 무게감을 강조하기 위해 단순히 생각하는 것이 아니라 사법적 판단을 내려야 한다는 어감을 살려 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">whether a person is guilty or innocent of a crime (간접의문문): decide(타동사)의 목적어로 쓰인 명사절입니다. &#39;whether + S + V&#39; 구조로 &#39;~인지 아닌지&#39;라는 의미를 나타내며 문장 전체에서 명사 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">judge</td><td class=\"m\">판사</td></tr><tr><td class=\"w\">decide</td><td class=\"m\">결정하다, 판단하다</td></tr><tr><td class=\"w\">whether</td><td class=\"m\">~인지 (아닌지)</td></tr><tr><td class=\"w\">guilty</td><td class=\"m\">유죄의</td></tr><tr><td class=\"w\">innocent</td><td class=\"m\">무죄의</td></tr><tr><td class=\"w\">crime</td><td class=\"m\">범죄</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>판사의 기본 의무는 피고인의 유죄 여부를 판가름하는 것이다.</li><li>법적 판단은 사실관계를 바탕으로 한 명확한 결정 과정을 포함한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">A judge holds the legal authority to evaluate evidence, and they must determine if the accused person is guilty or innocent.</div>\n              <div class=\"lec-final-sum-ko\">판사는 증거를 평가할 법적 권한을 가지며, 그들은 피고인이 유죄인지 무죄인지를 결정해야 한다.</div></div></div>"],"segs":[[{"audio":"./sentence01_audio/1.mp3","hl":null}],[{"audio":"./sentence01_audio/2.mp3","hl":null}],[{"audio":"./sentence01_audio/3.mp3","hl":null},{"audio":"./sentence01_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence01_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence01_audio/6.mp3","hl":null}],[{"audio":"./sentence01_audio/7.mp3","hl":"main"},{"audio":"./sentence01_audio/8.mp3","hl":"meaning"},{"audio":"./sentence01_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence01_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getEl
