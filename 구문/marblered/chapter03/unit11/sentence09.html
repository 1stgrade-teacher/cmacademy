4OGyeePQEdeACM9TimY/ulF7Z3Ek9TnORjk45OAOgxxTSTe709Vbr87avT7171hO7ev9aL52e9r2W4wELknIA3McnJzjnJ9yBn27daFA5x/DkgemeSAQM/dHoTjk9suK8c7Dnjrn0wfvdO+CPTjrQI2JbjkDPHOPbK592+nXBqlJRV21bW61v02Tu3t93bVDumnr0a1btayXq7etvPdP//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Choosing a Convenient Time for Scheduling<small>일정 조율을 위한 편리한 시간 선택</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 문장에는 선택을 나타내는 접속사 ‘either A or B’ 구문이 사용되었는데, 이는 둘 중 하나를 반드시 선택해야 하는 상황을 나타낼 때 자주 쓰이는 표현이에요. 우리가 일상에서 식당 메뉴를 고르거나 약속 날짜를 정할 때처럼, 상대방에게 여러 선택지 중 하나를 자유롭게 고르라고 정중하게 제안하거나 허락하는 맥락에서 아주 유용하죠. 이처럼 영작이나 독해를 할 때 선택의 폭을 좁혀주는 표현들을 잘 익혀두면, 의사소통할 때 훨씬 명확하고 효율적으로 정보를 전달할 수 있답니다. 특히 이 지문에서는 상대방의 편리함(convenience)을 최우선으로 고려하는 배려의 태도가 담겨 있다는 점을 기억하며 읽어보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01선택지 제시</div><ul><li>상대방에게 가능한 날짜 중 하나를 고르도록 제안한다.</li><li>선택 가능한 요일: 토요일(Saturday) 또는 월요일(Monday)</li><li>선택의 기준: 더 편리한(convenient) 쪽</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02의사결정 요청</div><ul><li>상대방이 스스로 일정을 고려하여 결정하도록 한다.</li><li>당신(you)에게 더 적합한 시간을 고름</li><li>결정 권한을 상대방에게 위임함</li><li>핵심 키워드: 편리한(convenient)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">choose</td><td class=\"m\">선택하다</td></tr><tr><td class=\"w\">whichever</td><td class=\"m\">어느 쪽이든 (어느 것이든지)</td></tr><tr><td class=\"w\">convenient</td><td class=\"m\">편리한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">토요일이거나</span><span class=\"en\"><b>Either Saturday</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 월요일 중</span><span class=\"en\"><b>or Monday,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선택해라</span><span class=\"en\"><b><span class=\"grammar-hl\">choose</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어느 것이든</span><span class=\"en\"><b><span class=\"grammar-hl\">whichever</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 편리한 쪽을</span><span class=\"en\"><b><span class=\"grammar-hl\">is more convenient</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너에게</span><span class=\"en\"><b>for you.</b></span></div></div><div class=\"lec-sent-ko\">토요일이나 월요일 중 어느 것이든 네게 더 편한 쪽을 선택해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이는 상대방에게 일정을 정하라는 제안을 하고 있습니다. 여기서 whichever는 사전적으로 &#39;어느 쪽이든&#39;이라는 뜻인데, 여기서는 선택 가능한 두 가지 옵션 중 하나를 고르는 상황을 강조합니다. 단순히 &#39;아무거나&#39;가 아니라, 상대방의 상황에 맞게 더 편리한(more convenient) 쪽을 스스로 판단해 결정하라는 선택권을 부여하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">choose (명령문): 주어(you)가 생략된 동사원형으로 시작하는 구조로, 상대방에게 선택을 요구하는 문장입니다.</div><div class=\"lec-gr-item\">whichever is more convenient (간접의문문(명사절)): whichever가 이끄는 절이 choose의 목적어 역할을 합니다. &#39;어느 쪽이든 더 편리한 것&#39;이라는 의미로, 명사절로서 문장의 목적어 자리에 위치합니다.</div><div class=\"lec-gr-item\">more convenient (비교급): convenient라는 형용사를 비교급으로 만들어 두 선택지 중 비교 우위에 있는 상태를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">choose</td><td class=\"m\">선택하다</td></tr><tr><td class=\"w\">whichever</td><td class=\"m\">어느 쪽이든 (어느 것이든지)</td></tr><tr><td class=\"w\">convenient</td><td class=\"m\">편리한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>토요일과 월요일 중 하나를 택해야 하는 상황이다.</li><li>결정의 기준은 상대방의 편의성이다.</li><li>상대방에게 일정 선택의 자율권을 주고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">You can pick either Saturday or Monday, as you are free to choose the time that suits you best.</div>\n              <div class=\"lec-final-sum-ko\">자신에게 가장 적합한 시간을 자유롭게 선택할 수 있으므로, 토요일이나 월요일 중 하나를 고르면 된다.</div></div></div>"],"segs":[[{"audio":"./sentence09_audio/1.mp3","hl":null}],[{"audio":"./sentence09_audio/2.mp3","hl":null}],[{"audio":"./sentence09_audio/3.mp3","hl":null},{"audio":"./sentence09_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence09_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence09_audio/6.mp3","hl":null}],[{"audio":"./sentence09_audio/7.mp3","hl":"main"},{"audio":"./sentence09_audio/8.mp3","hl":"meaning"},{"audio":"./sentence09_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence09_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
