Aj6fzyOePqegMd/n/P+f5ijPOPbOP8AP+fypu4ZIBGRnv6dfy4z/KlyM9R9Mj/9dAC0U3cOM4GSQPfHJ6Z6DJ+gzwOi5HYg8gde5x/T/PWj+v6/r/IBf8/5/wA+1FN3DOMjoT1HY4PHt39O+O5uUc5H+ePx5pX/AEXzf/DgO6Z6nv8A/WHSjPsf8/5z/OkyDjkdz27dcc9j164pNy9QQfxH8/y4z29qYC9f5+x9O3b2NH14688cD9fx9x6UZHqP/wBXX/PakLKBnIwD6++D/WgBw/8Ar/nRTdy+o5OB0/x6HsfcUFlXuPbkD+Zx/ngUXt+QDqP09fp/n9PQ9EyPUfn6daNynuOD696AFP4D6/5/rTXBKnHBAz/Pr149KMj1HOeenAPqPTp9aRuAzDGdpxxnOASBjuPYdeaL6X6biv08m/ut/mf/2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Government&#39;s Commitment to Economic Stability<small>경제 안정을 향한 정부의 의지</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 이해하기 위해서는 먼저 통화 안정과 금융 안정이라는 경제적 개념을 알아두는 것이 좋아요. 통화 안정(Monetary stability)은 우리가 사용하는 돈의 가치가 물가 상승 등으로 급격히 변하지 않고 일정한 수준으로 유지되는 상태를 말하며, 금융 안정(Financial stability)은 은행이나 증권 시장 같은 금융 시스템이 위기 없이 안전하게 작동하는 상태를 의미해요. 정부나 중앙은행은 경제가 흔들릴 때 금리를 조절하거나 자금을 투입하는 등의 정책을 펼치는데, 이를 통틀어 통화 정책(Monetary policy)이라고 부르죠. 마치 우리 몸의 체온이 적정 수준을 유지해야 건강한 것처럼, 국가 경제도 이 두 가지 안정을 통해 튼튼한 기초를 다지는 것이 무엇보다 중요하답니다. 그래서 정부가 &#39;필요한 모든 조치를 취하겠다&#39;고 선언하는 것은, 경제가 위기에 처했을 때 시장의 혼란을 막고 믿음을 주겠다는 강력한 의지를 보여주는 것이라고 이해하면 쉬워요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01정부의 목표</div><ul><li>정부는 경제의 건전성을 유지하기 위해 통화와 금융 시스템의 안정을 최우선 과제로 삼는다.</li><li>국가 경제의 기초를 다지는 통화 안정(monetary stability)</li><li>금융 시스템의 원활한 운영을 위한 금융 안정(financial stability)</li><li>핵심 키워드: 안정(stability)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02실행의 의지</div><ul><li>정부는 목표 달성을 위해서라면 수단과 방법을 가리지 않고 필요한 조치를 취할 것이다.</li><li>목표를 위해 필요한 모든 행동(whatever action)을 수행함</li><li>상황에 따라 유연하고 강력하게 대응하겠다는 의지 표명</li><li>핵심 키워드: 필요한 조치(necessary action)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">government</td><td class=\"m\">정부</td></tr><tr><td class=\"w\">take action</td><td class=\"m\">조치를 취하다</td></tr><tr><td class=\"w\">whatever</td><td class=\"m\">무엇이든, 어떤 ~라도</td></tr><tr><td class=\"w\">necessary</td><td class=\"m\">필요한, 필수의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">achieve</td><td class=\"m\">성취하다, 달성하다</td></tr><tr><td class=\"w\">monetary</td><td class=\"m\">통화의, 화폐의</td></tr><tr><td class=\"w\">financial</td><td class=\"m\">재정의, 금융의</td></tr><tr><td class=\"w\">stability</td><td class=\"m\">안정, 안정성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">정부는</span><span class=\"en\"><b>The government</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">취할 것이다</span><span class=\"en\"><b>will take</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 조치든지 필요한</span><span class=\"en\"><b><span class=\"grammar-hl\">whatever action is necessary</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달성하기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to achieve</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">통화와 금융의 안정성을</span><span class=\"en\"><b>monetary and financial stability.</b></span></div></div><div class=\"lec-sent-ko\">정부는 통화와 금융의 안정성을 확보하기 위해서 필요한 어떤 조치든지 취할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 정부의 강력한 의지를 나타내고 있습니다. 여기서 take는 사전적으로 &#39;가져가다, 잡다&#39;라는 뜻이지만, 여기서는 어떤 정책이나 수단을 실행에 옮긴다는 의미인 &#39;취하다, 시행하다&#39;로 쓰였습니다. 정부가 단순히 계획만 세우는 것이 아니라 실질적인 행동에 나설 것임을 강조하기 위해 이 동사를 선택했습니다. 또한 whatever action is necessary(필요한 모든 조치)라는 표현을 통해, 안정이라는 목표를 위해 수단과 방법을 가리지 않겠다는 정부의 확고한 태도를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to achieve (to부정사): 부사적 용법(목적)으로, 앞에 나온 actions(명사)의 목적을 나타내며 ‘~하기 위하여’로 해석되는 구조입니다.</div><div class=\"lec-gr-item\">whatever action is necessary (관계대명사): whatever가 명사절(whatever action is necessary)을 이끄는 복합관계대명사로, 문장에서 목적어 역할을 합니다. ‘~하는 어떠한 행동이라도’라는 의미를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">government</td><td class=\"m\">정부</td></tr><tr><td class=\"w\">whatever</td><td class=\"m\">무엇이든, 어떤 ~라도</td></tr><tr><td class=\"w\">necessary</td><td class=\"m\">필요한, 필수의</td></tr><tr><td class=\"w\">achieve</td><td class=\"m\">성취하다, 달성하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">monetary</td><td class=\"m\">통화의, 화폐의</td></tr><tr><td class=\"w\">financial</td><td class=\"m\">재정의, 금융의</td></tr><tr><td class=\"w\">stability</td><td class=\"m\">안정, 안정성</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>정부는 통화와 금융의 안정을 매우 중요하게 여긴다.</li><li>이를 달성하기 위해 정부는 수단에 상관없이 필요한 모든 조치를 적극적으로 취할 계획이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The government prioritizes economic security, so it will implement any required measures to maintain financial stability.</div>\n              <div class=\"lec-final-sum-ko\">정부는 경제적 안정을 최우선으로 하기에, 재정 안정을 유지하기 위해 필요한 모든 조치를 시행할 것이다.</div></div></div>"],"segs":[[{"audio":"./sentence12_audio/1.mp3","hl":null}],[{"audio":"./sentence12_audio/2.mp3","hl":null}],[{"audio":"./sentence12_audio/3.mp3","hl":null},{"audio":"./sentence12_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence12_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence12_audio/6.mp3","hl":null}],[{"audio":"./sentence12_audio/7.mp3","hl":"main"},{"audio":"./sentence12_audio/8.mp3","hl":"meaning"},{"audio":"./sentence12_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence12_audio/10.mp3","hl":null}]]};var
