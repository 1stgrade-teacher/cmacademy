 끝없는 잠재력</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 인류가 스스로를 &#39;개척자(pioneer)&#39;라고 인식하며 끊임없이 도전해야 한다는 점을 강조하고 있습니다. 여기서 개척자란 미지의 영역에 처음 발을 내딛는 사람을 뜻하는데, 마치 아직 지도에 표시되지 않은 새로운 땅을 탐험하는 탐험가와 비슷한 맥락이라고 이해하면 좋아요. 인류는 과거의 성공에 안주하기 쉽지만, 사실 우리는 발전의 여지가 무궁무진한 초기 단계(barely begun)에 머물러 있을지도 모릅니다. 즉, 우리의 가장 위대한 업적은 이미 지나간 과거가 아니라, 앞으로 우리가 도전하여 만들어갈 미래의 가능성(future potential)에 있다는 점을 기억하는 것이 중요합니다. 이 글은 과거의 성과에 갇히지 말고, 다시 한번 개척자의 마음가짐으로 새로운 도약을 준비하자는 긍정적인 메시지를 담고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01망각의 상태</div><ul><li>우리는 인류가 여전히 탐험가라는 사실을 잠시 잊고 지내고 있다.</li><li>인류의 탐험가 정신(pioneers)을 망각함</li><li>우리가 아직 초기 단계에 머물러 있다는 점을 간과함</li><li>핵심 키워드: 망각(forgotten), 탐험가(pioneers)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02성취의 가능성</div><ul><li>과거의 업적에 안주하기보다 앞으로 더 큰 일을 해낼 수 있다.</li><li>지금까지의 성취가 최고라고 생각하는 것은 착각임</li><li>최고의 성취는 과거가 아닌 미래에 남겨져 있음</li><li>핵심 키워드: 성취(accomplishments), 미래(ahead)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perhaps</td><td class=\"m\">아마도</td></tr><tr><td class=\"w\">forget</td><td class=\"m\">잊다</td></tr><tr><td class=\"w\">pioneer</td><td class=\"m\">개척자</td></tr><tr><td class=\"w\">barely</td><td class=\"m\">간신히, 겨우</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">begin</td><td class=\"m\">시작하다</td></tr><tr><td class=\"w\">great</td><td class=\"m\">위대한, 대단한</td></tr><tr><td class=\"w\">accomplishment</td><td class=\"m\">업적, 성취</td></tr><tr><td class=\"w\">behind</td><td class=\"m\">~의 뒤에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아마도,</span><span class=\"en\"><b>Perhaps,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 그저 잊어버렸는지도 모른다</span><span class=\"en\"><b>we’ve just <span class=\"grammar-hl\">forgotten</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 여전히 개척자들이라는 것을,</span><span class=\"en\"><b><span class=\"grammar-hl\">that we are still pioneers,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 가까스로 시작했다는 것을,</span><span class=\"en\"><b><span class=\"grammar-hl\">that we’ve barely begun,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리의 가장 위대한 성취는</span><span class=\"en\"><b><span class=\"grammar-hl\">and that our greatest accomplishments</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있을 수 없다는 것을 우리 뒤에.</span><span class=\"en\"><b><span class=\"grammar-hl\">cannot be behind us</span>.</b></span></div></div><div class=\"lec-sent-ko\">아마도 우리는 우리가 여전히 개척자들이라는 것을, 우리가 가까스로 시작했다는 것을, 그리고 우리의 가장 위대한 성취는 우리의 뒤에 있을 수 없다는 것을 그저 잊어버렸는지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장들이 제시되었을 맥락을 이어받아, 우리가 과거의 성취에 안주하거나 미래를 비관하는 태도를 버려야 함을 강조합니다. 여기서 pioneers는 사전적으로 &#39;개척자&#39;를 뜻하는데, 여기서는 인류가 정점에 다다른 것이 아니라 새로운 영역을 탐험하는 초기 단계에 있다는 점을 강조하기 위해 선택되었습니다. barely는 &#39;거의 ~않게&#39;라는 뜻이지만, 여기서는 &#39;이제 막 ~하기 시작했다&#39;는 어감을 주어 우리의 가능성이 무궁무진함을 나타냅니다. behind us는 물리적으로 &#39;뒤에&#39;라는 뜻이지만, 여기서는 시간의 흐름상 &#39;이미 지나간 과거&#39;를 의미합니다. 즉, 우리가 이룬 업적이 미래가 아닌 과거에만 머물러 있다고 착각하는 인간의 심리를 꼬집기 위해 이 표현을 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">forgotten that we are still pioneers, that we’ve barely begun, and that our greatest accomplishments cannot be behind us 동격의 that: &#39;forgotten&#39; 뒤에 나열된 세 개의 that절은 앞의 내용을 구체화하며, &#39;that절이라는 사실을 잊었다&#39;는 구조를 가짐</div><div class=\"lec-gr-item\">cannot be 조동사 구문: &#39;can&#39;과 &#39;not&#39;이 결합하여 가능성을 부정하며, 뒤에 보어(behind us)를 동반하는 2형식 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perhaps</td><td class=\"m\">아마도</td></tr><tr><td class=\"w\">pioneer</td><td class=\"m\">개척자</td></tr><tr><td class=\"w\">barely</td><td class=\"m\">간신히, 겨우</td></tr><tr><td class=\"w\">great</td><td class=\"m\">위대한, 대단한</td></tr><tr><td class=\"w\">accomplishment</td><td class=\"m\">업적, 성취</td></tr><tr><td class=\"w\">behind</td><td class=\"m\">~의 뒤에</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인류는 자신이 완성된 존재라고 착각하며 과거의 성공에 갇혀 있다.</li><li>하지만 우리는 여전히 개척자이며, 인간의 역사는 이제 막 시작된 것에 불과하다.</li><li>따라서 가장 위대한 업적은 과거가 아닌 미래에 놓여 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">We tend to forget our status as ongoing pioneers, but we must realize that our true potential remains ahead of us.</div>\n              <div class=\"lec-final-sum-ko\">우리는 스스로가 여전히 개척자라는 사실을 잊곤 하지만, 우리의 진정한 잠재력은 앞으로 올 미래에 있다는 점을 깨달아야 한다.</div></div></div>"],"segs":[[{"audio":"./sentence06_audio/1.mp3","hl":null}],[{"audio":"./sentence06_audio/2.mp3","hl":null}],[{"audio":"./sentence06_audio/3.mp3","hl":null},{"audio":"./sentence06_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence06_audio/5.mp3","hl":"stage-1"}],[{"audio":"./sentence06_audio/6.mp3","hl":null}],[{"audio":"./sentence06_audio/7.mp3","hl":"main"},{"audio":"./sentence06_audio/8.mp3","hl":"meaning"},{"audio":"./sentence06_audio/9.mp3","hl":"grammar"}],[{"audio":"./sentence06_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])
