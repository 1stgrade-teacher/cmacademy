 단지 출발선일 뿐이라는 점을 기억하면 지문을 훨씬 깊이 있게 이해할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황의 정의</div><ul><li>현재 처한 상황은 당신의 최종 목적지가 아니라 시작점을 의미할 뿐이다.</li><li>현재의 상황(present circumstances)은 출발점임</li><li>최종 결과(where you can go)를 미리 결정하지 않음</li><li>핵심 키워드: 상황(circumstances), 출발점(start)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02미래의 가능성</div><ul><li>도착지는 현재 상황에 얽매이지 않으며 자신의 노력으로 바꿀 수 있다.</li><li>현재에 머물러야 한다는 것은 오해임</li><li>미래의 도달 범위는 무한히 열려 있음</li><li>핵심 키워드: 결정하다(determine), 도달하다(go)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03관점의 전환</div><ul><li>어려운 환경을 한계로 보지 말고 성장의 발판으로 삼아야 한다.</li><li>환경적 제약에 굴복하지 않는 태도</li><li>자신의 목표를 향해 나아가는 과정의 중요성</li><li>핵심 키워드: 관점(perspective), 성장(growth)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">present</td><td class=\"m\">현재의</td></tr><tr><td class=\"w\">circumstance</td><td class=\"m\">상황, 환경</td></tr><tr><td class=\"w\">determine</td><td class=\"m\">결정하다, 알아내다</td></tr><tr><td class=\"w\">merely</td><td class=\"m\">한낱, 단지, 그저</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신의 현재 상황은</span><span class=\"en\"><b>Your present circumstances</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결정하지 않는다</span><span class=\"en\"><b>don’t determine</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어디로 당신이 갈 수 있는지를;</span><span class=\"en\"><b><span class=\"grammar-hl\">where you can go</span>;</b></span></div></div><div class=\"lec-sent-ko\">당신의 현재 상황이 어디로 당신이 갈 수 있는지를 결정하지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현재 처한 환경이 미래의 성취를 한정 짓는 것이 아니라, 단지 출발점일 뿐이라는 격려의 메시지입니다. 여기서 determine은 사전적으로 &#39;결정하다&#39;라는 뜻인데, 여기서는 &#39;운명을 확정 짓다&#39;라는 의미로 쓰였습니다. 필자는 현재의 처지가 미래의 가능성을 가로막는 장애물이 아니라, 단지 시작점이라는 점을 강조하기 위해 이 낱말을 사용하여 긍정적인 관점의 변화를 이끌어내고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">where you can go (간접의문문): 의문사(where) + 주어(you) + 동사(can go)의 어순으로 구성되어, determine의 목적어 역할을 하는 명사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">present</td><td class=\"m\">현재의</td></tr><tr><td class=\"w\">circumstance</td><td class=\"m\">상황, 환경</td></tr><tr><td class=\"w\">determine</td><td class=\"m\">결정하다, 알아내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 2</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은</span><span class=\"en\"><b>they</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 결정할 뿐이다</span><span class=\"en\"><b>merely determine</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어디서 당신이 시작하는지를.</span><span class=\"en\"><b><span class=\"grammar-hl\">where you start</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 어디서 당신이 시작하는지를 단지 결정한다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">where you start (간접의문문): 의문사(where) + 주어(you) + 동사(start)의 어순으로 구성되어, determine의 목적어 역할을 하는 명사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">determine</td><td class=\"m\">결정하다, 알아내다</td></tr><tr><td class=\"w\">merely</td><td class=\"m\">한낱, 단지, 그저</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>현재의 처지는 미래의 최종 목적지가 아니다.</li><li>환경은 단지 시작점에 불과하므로, 그 결과는 앞으로의 노력에 달려 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">While your current situation sets the starting point, it does not dictate the final destination of your life.</div>\n              <div class=\"lec-final-sum-ko\">현재의 상황은 출발점을 결정하지만, 삶의 최종 목적지까지 결정하는 것은 아니다.</div></div></div>"],"segs":[[{"audio":"./sentence02_audio/1.mp3","hl":null}],[{"audio":"./sentence02_audio/2.mp3","hl":null}],[{"audio":"./sentence02_audio/3.mp3","hl":null},{"audio":"./sentence02_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence02_audio/5.mp3","hl":"stage-1"},{"audio":"./sentence02_audio/6.mp3","hl":"stage-2"}],[{"audio":"./sentence02_audio/7.mp3","hl":null}],[{"audio":"./sentence02_audio/8.mp3","hl":"main"},{"audio":"./sentence02_audio/9.mp3","hl":"meaning"},{"audio":"./sentence02_audio/10.mp3","hl":"grammar"}],[{"audio":"./sentence02_audio/11.mp3","hl":"main"},{"audio":"./sentence02_audio/12.mp3","hl":"grammar"}],[{"audio":"./sentence02_audio/13.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scroll
