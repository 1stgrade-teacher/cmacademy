ection-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">indeed</td><td class=\"m\">정말로, 사실은</td></tr><tr><td class=\"w\">brief</td><td class=\"m\">짧은, 간략한</td></tr><tr><td class=\"w\">dictionary</td><td class=\"m\">사전</td></tr><tr><td class=\"w\">majority</td><td class=\"m\">대다수</td></tr><tr><td class=\"w\">meaning</td><td class=\"m\">의미</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">정말로,</span><span class=\"en\"><b>Indeed,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">짧은 살펴봄은</span><span class=\"en\"><b><span class=\"grammar-hl\">a brief look</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사전에 대한</span><span class=\"en\"><b><span class=\"grammar-hl\">at a dictionary</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에게 보여 줄 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">will show you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대다수의 단어들이</span><span class=\"en\"><b><span class=\"grammar-hl\">that the majority of words</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사용된다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">are used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나 이상의 의미와 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">with more than one meaning.</span></b></span></div></div><div class=\"lec-sent-ko\">정말로, 사전을 잠깐 살펴보는 것은 대다수의 단어가 하나 이상의 의미로 사용된다는 것을 당신에게 보여 줄 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로서, 언어의 기본적인 특징을 제시합니다. 여기서 brief는 사전적으로 &#39;짧은&#39;이라는 뜻이지만, 여기서는 &#39;자세히 조사할 필요도 없이 금방 확인 가능하다&#39;는 맥락으로 쓰였습니다. 이는 언어의 다의성이 매우 흔하고 보편적인 현상임을 강조하여 독자의 공감을 이끌어내려는 필자의 의도가 담겨 있습니다. 앞 문장이 없지만, 뒤이어 나올 언어의 복잡성이나 해석의 다양성에 대한 논의를 시작하는 첫 단추 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a brief look at a dictionary will show you that the majority of words are used with more than one meaning. (4형식(SVOO)): show(수여동사) + you(간접목적어) + that절(직접목적어) 구조로, 주어(look)가 당신에게 that절이라는 내용을 보여준다는 문장 구조입니다.</div><div class=\"lec-gr-item\">that the majority of words are used (수동태): be동사(are)+p.p.(used) 구조입니다. use는 타동사인데 목적어가 없어서 수동구조 are used 형태로 쓰였으며, 기본구조는 V(use) + O(목적어)입니다.</div><div class=\"lec-gr-item\">that the majority of words are used with more than one meaning (명사절(that절)): 주어(the majority of words)와 서술어(are used)를 갖춘 완전한 절이 show의 직접목적어 역할을 하는 명사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">indeed</td><td class=\"m\">정말로, 사실은</td></tr><tr><td class=\"w\">brief</td><td class=\"m\">짧은, 간략한</td></tr><tr><td class=\"w\">dictionary</td><td class=\"m\">사전</td></tr><tr><td class=\"w\">majority</td><td class=\"m\">대다수</td></tr><tr><td class=\"w\">meaning</td><td class=\"m\">의미</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우리가 흔히 사용하는 단어들은 대부분 한 가지 의미만 가지고 있지 않다.</li><li>사전을 조금만 찾아보아도 알 수 있듯이, 단어들은 상황에 따라 여러 가지 뜻으로 쓰인다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Language is characterized by polysemy, as evidenced by the fact that most words carry multiple meanings.</div>\n              <div class=\"lec-final-sum-ko\">대부분의 단어가 다수의 의미를 지닌다는 사실에서 알 수 있듯이, 언어는 다의성을 특징으로 한다.</div></div></div>"],"segs":[[{"audio":"./sentence10_audio/1.mp3","hl":null}],[{"audio":"./sentence10_audio/2.mp3","hl":null}],[{"audio":"./sentence10_audio/3.mp3","hl":null},{"audio":"./sentence10_audio/4.mp3","hl":"stage-0"},{"audio":"./sentence10_audio/5.mp3","hl":"stage-1"}],
