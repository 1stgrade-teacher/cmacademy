사적 척도</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">역사 속에서 많은 문화권은 인간이 자신의 내면을 다스리는 법을 배워야만 진정한 성인이 된다고 믿어왔는데, 이를 자기 조절(Self-regulation)이라고 해요. 쉽게 말해, 끓어오르는 화를 참거나 힘들어도 참고 공부하는 것처럼 자신의 생각과 감정을 스스로 제어하는 능력을 말하죠. 고대 그리스의 스토아학파(Stoicism) 철학자들도 인간이 감정에 휘둘리지 않고 이성적으로 행동하는 것을 가장 고귀한 가치로 여겼답니다. 현대 심리학에서도 이러한 능력은 정서 지능(Emotional Intelligence)의 핵심 요소로 평가받는데, 감정을 무조건 억누르는 것이 아니라 건강하게 관리하고 조절하는 능력이 타인과 원만한 관계를 맺고 목표를 달성하는 데 필수적이기 때문이에요. 결국 이 글은 단순히 감정을 참는 것이 아니라, 인간으로서의 품격과 주체성을 갖추기 위해 마음을 다스리는 노력이 왜 과거부터 중요하게 여겨졌는지 그 맥락을 다루고 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01역사적 가정</div><ul><li>과거의 특정 시기 동안 사람들은 인간이 되기 위한 필수 조건을 당연하게 여겼다.</li><li>인간다움(fully human)의 정의</li><li>스스로를 통제하는 능력의 중요성</li><li>핵심 키워드: 당연시하다(taken it for granted)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02자기 통제의 중요성</div><ul><li>인간으로서 온전해지기 위해서는 자신의 내면을 스스로 다스릴 수 있어야 한다고 믿었다.</li><li>생각(thoughts)과 감정(feelings)의 조절</li><li>정신적인 자기 통제(master) 능력 요구</li><li>핵심 키워드: 인간다움(fully human)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">certain</td><td class=\"m\">특정한</td></tr><tr><td class=\"w\">take it for granted</td><td class=\"m\">~을 당연하게 여기다</td></tr><tr><td class=\"w\">fully</td><td class=\"m\">완전히, 충분히</td></tr><tr><td class=\"w\">master</td><td class=\"m\">숙달하다, 통제하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 시기에</span><span class=\"en\"><b>At certain times</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">역사 속의,</span><span class=\"en\"><b>in history,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문화는 그것을 여겨왔다</span><span class=\"en\"><b>cultures have <span class=\"grammar-hl\">taken it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당연한 것으로</span><span class=\"en\"><b><span class=\"grammar-hl\">for granted</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> a person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완전히 인간적이지는 않았다는 것을</span><span class=\"en\"><b>was not fully human</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그나 그녀가 배우지 않는다면</span><span class=\"en\"><b><span class=\"grammar-hl\">unless he or she learned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">통제하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to master</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각과 감정을.</span><span class=\"en\"><b>thoughts and feelings.</b></span></div></div><div class=\"lec-sent-ko\">역사의 어떤 때에 문화는 만약 사람이 생각과 감정을 억누르는 것을 배우지 않았다면 그 사람이 충분하게 인간적이지 않았다는 것을 당연하게 여겨왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로서, 과거의 특정 시기에 &#39;인간다움&#39;의 기준을 어디에 두었는지 설명합니다. 여기서 taken it for granted는 사전적으로는 &#39;당연하게 여기다&#39;이지만, 문맥상 &#39;깊이 생각할 필요도 없는 확고한 믿음이나 통념&#39;을 의미합니다. 필자는 당시 사회가 감정 조절 능력을 인간의 필수 조건으로 얼마나 중요하게 생각했는지를 강조하기 위해 이 표현을 선택했습니다. 또한, master는 &#39;주인&#39;이라는 명사가 아니라 &#39;숙달하다, 통제하다&#39;라는 동사로 쓰였는데, 자신의 내면을 단순히 느끼는 것에 그치지 않고 자신의 의지로 완전히 다루는 능동적인 태도를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taken it for granted that (관용표현): take A for granted(A를 당연하게 여기다) 구조이며, it은 가목적어, that절이 진목적어 역할을 하는 5형식 구조입니다.</div><div class=\"lec-gr-item\">that a person was not fully human 동격의 that: 앞의 it(가목적어)이 가리키는 내용인 &#39;a person was not fully human&#39;이라는 사실을 구체적으로 설명하는 명사절입니다.</div><div class=\"lec-gr-item\">unless he or she learned to master (to부정사): master(타동사)의 목적어 역할을 하는 명사적 용법으로, learn의 목적어로 쓰였습니다.</div><div class=\"lec-gr-item\">master thoughts and feelings (to부정사): learn의 목적어로 쓰인 명사적 용법의 to부정사구 안에 포함된 master(타동사)의 목적어들입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">certain</td><td class=\"m\">특정한</td></tr><tr><td class=\"w\">fully</td><td class=\"m\">완전히, 충분히</td></tr><tr><td class=\"w\">master</td><td class=\"m\">숙달하다, 통제하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과거 특정 문화권에서는 생각과 감정을 스스로 다스리는 것이 인간의 필수 조건이라 믿었다.</li><li>이러한 믿음은 인간을 단순히 본능에 따르는 존재가 아닌, 내면을 통제할 수 있는 주체로 보려는 시각을 반영한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Historical cultures believed that individuals were considered fully human only when they learned to control their own thoughts and feelings.</div>\n              <div class=\"lec-final-sum-ko\">역사적 문화권에서는 개인이 자신의 생각과 감정을 조절하는 법을 배울 때 비로소 온전한 인간으로 간주했다.</div></div></div>"],"segs":[[{"audio":"./unit12-sentence11_강의_audio/1.mp3","hl":null}],[{"audio":"./unit12-sentence11_강의_audio/2.mp3","hl":null}],[{"audio":"./unit12-sentence11_강의_audio/3.mp3","hl":null},{"audio":"./unit12-sentence11_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit12-sentence11_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit12-sentence11_강의_audio/6.mp3","hl":null}],[{"audio":"./unit12-sentence11_강의_audio/7.mp3","hl":"main"},{"audio":"./unit12-sentence11_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit12-sentence11_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit12-sentence11_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=d
