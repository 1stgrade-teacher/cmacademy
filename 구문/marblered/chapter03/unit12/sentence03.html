ss=\"lec-cover-title\">Why Moral Stories Do Not Always Lead to Moral Actions<small>도덕 이야기가 항상 도덕적 행동으로 이어지지 않는 이유</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 흔히 우리는 &#39;착하게 살자&#39;는 교훈을 담은 옛날이야기를 읽으면 자연스럽게 도덕적인 사람이 될 거라고 생각하곤 하죠? 하지만 심리학에서는 이런 도덕적 이야기(moral stories)가 실제 행동으로 바로 이어지지 않을 수도 있다는 점에 주목해요. 이를 도덕적 위선(moral hypocrisy) 또는 도덕적 정당화(moral licensing) 현상으로 설명하기도 하는데, 마음속으로 좋은 생각을 했다는 이유만으로 뇌가 스스로를 &#39;착한 사람&#39;이라 착각해 실제 행동은 이기적으로 변할 수 있다는 것이죠. 마치 헬스장에서 운동 계획만 세워도 마치 운동을 다 한 것 같은 뿌듯함을 느끼는 것과 비슷해요. 즉, 도덕적인 이야기를 읽는 것(input)이 반드시 도덕적인 행동(output)을 보장하지는 않는다는 점을 미리 이해하면, 오늘 지문을 훨씬 깊이 있게 읽을 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01일반적인 통념 비판</div><ul><li>우리는 고전적인 도덕 이야기가 도덕적 행동을 당연히 길러줄 것이라고 생각하지만, 이는 사실이 아닐 수 있습니다.</li><li>당연히 여기다 (take for granted)</li><li>고전 도덕 이야기 (classic moral stories)</li><li>도덕적 행동 촉진 (promote moral behaviors)</li><li>핵심 키워드: 당연시 (take for granted)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02의문 제기</div><ul><li>도덕적인 내용을 담은 이야기들이 실제로 사람들의 행동 변화를 이끌어내는가에 대해 회의적인 시각을 가져야 합니다.</li><li>이야기의 교훈과 실제 행동의 괴리</li><li>자동적인 연결 (automatically)에 대한 의문</li><li>핵심 키워드: 회의적 시각 (skepticism)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take ~ for granted</td><td class=\"m\">~을 당연하게 여기다</td></tr><tr><td class=\"w\">classic</td><td class=\"m\">고전적인, 전형적인</td></tr><tr><td class=\"w\">moral</td><td class=\"m\">도덕적인</td></tr><tr><td class=\"w\">automatically</td><td class=\"m\">자동적으로, 무의식적으로</td></tr><tr><td class=\"w\">promote</td><td class=\"m\">증진하다, 촉진하다</td></tr><tr><td class=\"w\">behavior</td><td class=\"m\">행동, 태도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당연하게 여겨서는 안 된다</span><span class=\"en\"><b>should not <span class=\"grammar-hl\">take</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을</span><span class=\"en\"><b><span class=\"grammar-hl\">it for granted</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고전적인 교훈적 이야기들이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> classic moral stories</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자동적으로 촉진할 것이라는 점을</span><span class=\"en\"><b>will automatically promote</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도덕적 행동을</span><span class=\"en\"><b>moral behaviors.</b></span></div></div><div class=\"lec-sent-ko\">우리는 고전적인 교훈적 이야기들이 자동적으로 도덕적 행동을 촉진할 것임을 당연하게 여겨서는 안 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 주제를 제시합니다. 여기서 take it for granted는 사전적으로는 &#39;당연하게 여기다&#39;라는 뜻입니다. 문맥상으로는 우리가 평소 고전 동화가 아이들의 인성을 길러줄 것이라고 막연하게 믿고 있는 &#39;통념&#39;을 의미합니다. 필자는 우리가 무비판적으로 믿고 있는 이 전제를 의심해봐야 한다고 강조하기 위해 이 표현을 선택했습니다. 앞서 제시된 일반적인 믿음에 대해 반론을 제기하며, 도덕 교육이 단순히 이야기를 읽는 것만으로는 이루어지지 않는다는 점을 지적하려는 의도가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">take it for granted that (관용표현): take A for granted(A를 당연하게 여기다) 구조이며, it은 가목적어, that절이 진목적어인 5형식 구조입니다.</div><div class=\"lec-gr-item\">that classic moral stories will automatically promote moral behaviors 동격의 that: 앞의 가목적어 it이 가리키는 실제 내용을 설명하는 절입니다. 명사절로서 that 뒤에 주어(classic moral stories)와 동사(will promote)가 갖춰진 완전한 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">classic</td><td class=\"m\">고전적인, 전형적인</td></tr><tr><td class=\"w\">moral</td><td class=\"m\">도덕적인</td></tr><tr><td class=\"w\">automatically</td><td class=\"m\">자동적으로, 무의식적으로</td></tr><tr><td class=\"w\">promote</td><td class=\"m\">증진하다, 촉진하다</td></tr><tr><td class=\"w\">behavior</td><td class=\"m\">행동, 태도</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>고전적인 도덕 이야기를 읽는 것이 곧바로 도덕적 행동으로 이어진다는 생각은 당연한 것이 아니다.</li><li>도덕적 교훈이 담긴 이야기를 접한다고 해서 자동으로 올바른 행동이 나타나지는 않는다.</li><li>교육적 효과에 대한 무비판적인 믿음을 경계하고, 실제적인 도덕 교육의 방식을 고민해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People often assume that moral stories naturally encourage good behavior, but these narratives do not automatically translate into ethical actions.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 도덕 이야기가 자연스럽게 선한 행동을 장려한다고 생각하지만, 이러한 이야기가 자동으로 도덕적 행동으로 이어지지는 않는다.</div></div></div>"],"segs":[[{"audio":"./unit12-sentence02_강의_audio/1.mp3","hl":null}],[{"audio":"./unit12-sentence02_강의_audio/2.mp3","hl":null}],[{"audio":"./unit12-sentence02_강의_audio/3.mp3","hl":null},{"audio":"./unit12-sentence02_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit12-sentence02_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit12-sentence02_강의_audio/6.mp3","hl":null}],[{"audio":"./unit12-sentence02_강의_audio/7.mp3","hl":"main"},{"audio":"./unit12-sentence02_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit12-sentence02_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit12-sentence02_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classLi
