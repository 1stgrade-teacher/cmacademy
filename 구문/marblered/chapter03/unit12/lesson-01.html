  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

lecturePlayer(document.getElementById("app"),{"brand":"unit12","title":"마법같은 블록구문 실전편 Unit 12 가목적어 it 완전 정복","audioDir":"lesson-01_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마법같은 블록구문 실전편\u003c/div>\u003ch1>가목적어 it 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>가목적어 it의 진짜 목적어를 찾아 자연스럽게 해석한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마법같은 블록구문 실전편에서 가목적어 it을 다룹니다. 고등학교 영어에서 정말 자주 나오는 구조라서 정확히 익혀 두면 독해 속도가 크게 올라갈 거예요. 지금부터 예문 열두 개를 함께 분석해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마법같은 블록구문 실전편\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">가목적어 it은 뒤에 오는 \u003cb class=\"key\">to부정사구\u003c/b>나 \u003cb class=\"key\">that절\u003c/b>을 대신하며, it 자체는 해석하지 않는다. 동사와 목적격 보어 사이에서 \u003cb class=\"key\">가목적어 it\u003c/b>을 찾고, 진목적어를 뒤에서 연결하면 해석이 정확해진다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 Artificial intelligence \u003cspan class=\"fx\">makes it possible for machines to learn from experience and perform human tasks\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 We should not \u003cspan class=\"fx\">take it for granted that classic moral stories will automatically promote moral behaviors\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 The European Union \u003cspan class=\"fx\">has found it difficult to reach a consensus on economic issues\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 Our research \u003cspan class=\"fx\">makes it evident that many imaginative children often invent imaginary playmates\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">Engrave it on your heart that a little help is worth a deal of pity\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Even if you don't read a newspaper or watch television, and walk around the streets with your eyes down, you'll \u003cspan class=\"fx\">find it impossible to avoid some form of publicity\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 I \u003cspan class=\"fx\">make it a rule not to clutter my mind with simple information that I can find in a book in five minutes\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 We \u003cspan class=\"fx\">owe it to our children to give them a dignified and hopeful future\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">Bear it in mind when a life storm breaks that, no matter how violent, it is only temporary and that behind the clouds the sun is always shining\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 The internet \u003cspan class=\"fx\">has made it easy for us to hear whatever we like the most in mere seconds\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 At certain times in history, cultures \u003cspan class=\"fx\">have taken it for granted that a person was not fully human unless he or she learned to master thoughts and feelings\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 Every man who knows how to read \u003cspan class=\"fx\">has it in his power to magnify himself, to multiply the ways in which he exists, to make his life full, significant, and interesting\u003c/span>.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"오늘 배울 구문은 가목적어 it입니다. 목적어 자리에 it이 먼저 나오고 진짜 목적어인 to부정사구나 that절이 뒤에 오는 구조인데요. it은 해석하지 않고 진짜 목적어를 찾아 연결하는 것이 핵심입니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Artificial intelligence \u003cspan class=\"fx\">makes it possible for machines to learn from experience and perform human tasks\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Artificial intelligence\u003c/div>\u003cdiv class=\"k\">인공지능은\u003c/div>\u003cdiv class=\"e\">makes\u003c/div>\u003cdiv class=\"k\">만든다\u003c/div>\u003cdiv class=\"e\">it\u003c/div>\u003cdiv class=\"k\">그것을\u003c/div>\u003cdiv class=\"e\">possible\u003c/div>\u003cdiv class=\"k\">가능하게\u003c/div>\u003cdiv class=\"e\">for machines\u003c/div>\u003cdiv class=\"k\">기계들이\u003c/div>\u003cdiv class=\"e\">to learn from experience\u003c/div>\u003cdiv class=\"k\">경험으로부터 배우는 것을\u003c/div>\u003cdiv class=\"e\">and perform human tasks.\u003c/div>\u003cdiv class=\"k\">그리고 인간의 과제를 수행하는 것을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>5형식 문장에서 \u003cb class=\"key\">makes it possible for machines to learn from experience and perform human tasks\u003c/b>는 가목적어 it을 사용한 구문이다. 진목적어는 \u003cb class=\"key\">to learn from experience and perform human tasks\u003c/b>이고, possible은 목적격보어이다. for machines는 to learn의 의미상 주어이다.\u003c/div>","segs":[{"n":3,"text":"Artificial intelligence, 인공지능은. makes, 만든다. it, 그것을. possible, 가능하게. for machines, 기계들이. to learn from experience, 경험으로부터 배우는 것을. and perform human tasks, 그리고 인간의 과제를 수행하는 것을","hl":"ch"},{"n":4,"text":"첫 번째 문장은 makes it possible이라는 형태로 가목적어 it을 쓴 오형식 구문입니다. 진짜 목적어는 뒤에 있는 to learn from experience and perform human tasks이고 possible은 목적격 보어입니다. for machines는 to learn의 의미상 주어이므로 기계들이라는 뜻을 붙여 주면 됩니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Artificial intelligence \u003cspan class=\"fx\">makes it possible for machines to learn from experience and perform human tasks\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인공지능이 기계가 경험으로부터 배우고 인간의 일을 수행하는 것을 가능하게 만든다는 뜻입니다. it은 가짜 목적어일 뿐 해석하지 않으며, 진짜 목적어는 뒤에 있는 to부정사구입니다. for machines는 배우는 주체가 기계라는 사실을 나타냅니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">makes it possible for machines to learn from experience and perform human tasks\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">enables machines to learn from experience and perform human tasks\u003c/span>\u003cdiv class=\"w\">make it possible for A to do는 enable A to do로 바꾸면 더 간결하고 자연스럽다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">artificial intelligence\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">AI\u003c/span>\u003cspan class=\"y-eq\">artificial intelligence = AI\u003c/span>\u003cdiv class=\"w\">전문 용어를 줄임말로 바꾸어 쓴 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make it possible for A to do\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">enable A to do\u003c/span>\u003cspan class=\"y-eq\">make it possible for A to do = enable A to do\u003c/span>\u003cdiv class=\"w\">형용사 possible과 사역 동사 make를 한 동사 enable로 전환해 의미를 유지했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">perform\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">carry out\u003c/span>\u003cspan class=\"y-eq\">perform = carry out\u003c/span>\u003cdiv class=\"w\">과제나 임무를 수행하다는 뜻의 동의어로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Artificial intelligence enables machines to learn from experience and perform human tasks.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"인공지능이 기계들이 경험으로부터 배우고 인간의 일을 수행하는 것을 가능하게 만든다는 내용입니다. 여기서 it은 해석하지 않고 뒤에 나오는 긴 to부정사구가 진짜 목적어라는 점을 꼭 기억하세요.","hl":"mn"},{"n":6,"text":"makes it possible for machines to learn을 enables machines to learn으로 바꿔 쓸 수 있습니다. possible이라는 형용사 대신 동사 enable을 쓰면 더 간결하게 같은 뜻을 표현할 수 있어요. perform human tasks는 carry out human tasks로도 바꿔 말할 수 있습니다.","hl":"rw"},{"n":7,"text":"artificial intelligence는 AI로 줄여 씁니다. make it possible for somebody to do는 enable somebody to do로 바꿀 수 있고요. perform은 carry out이나 conduct로 바꿔 쓸 수 있어요.","hl":"ph"},{"n":8,"text":"같은 뜻을 한 문장으로 정리하면 Artificial intelligence enables machines to learn from experience and perform human tasks라고 말할 수 있습니다. enable을 쓰면 가목적어 it 없이도 같은 의미를 간단하게 전달할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 We should not \u003cspan class=\"fx\">take it for granted that classic moral stories will automatically promote moral behaviors\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We\u003c/div>\u003cdiv class=\"k\">우리는\u003c/div>\u003cdiv class=\"e\">should not take\u003c/div>\u003cdiv class=\"k\">여겨서는 안 된다\u003c/div>\u003cdiv class=\"e\">it\u003c/div>\u003cdiv class=\"k\">그것을\u003c/div>\u003cdiv class=\"e\">for granted\u003c/div>\u003cdiv class=\"k\">당연하게\u003c/div>\u003cdiv class=\"e\">that classic moral stories\u003c/div>\u003cdiv class=\"k\">고전적인 교훈적 이야기들이\u003c/div>\u003cdiv class=\"e\">will automatically promote\u003c/div>\u003cdiv class=\"k\">자동으로 촉진할 것임을\u003c/div>\u003cdiv class=\"e\">moral behaviors.\u003c/div>\u003cdiv class=\"k\">도덕적 행동을\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">take it for granted that ~\u003c/b>은 '~을 당연한 것으로 여기다'라는 뜻의 관용 표현으로, 가목적어 it이 쓰인다. 진목적어는 접속사 that이 이끄는 명사절 \u003cb class=\"key\">that classic moral stories will automatically promote moral behaviors\u003c/b>이다. 문장 전체는 ‘~(을) 당연하게 여기다’를 의미한다.\u003c/div>","segs":[{"n":9,"text":"We, 우리는. should not take, 여겨서는 안 된다. it, 그것을. for granted, 당연하게. that classic moral stories, 고전적인 교훈적 이야기들이. will automatically promote, 자동으로 촉진할 것임을. moral behaviors, 도덕적 행동을","hl":"ch"},{"n":10,"text":"두 번째 문장은 take it for granted that이라는 관용 표현입니다. 이때 it은 가목적어이고 진짜 목적어는 that classic moral stories will automatically promote moral behaviors라는 that절입니다. take it for granted that은 무엇을 당연한 것으로 여기다는 뜻으로 통째로 기억하세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 We should not \u003cspan class=\"fx\">take it for granted that classic moral stories will automatically promote moral behaviors\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>고전적인 교훈 이야기가 자동으로 도덕적 행동을 촉진할 것이라고 당연하게 여겨서는 안 된다는 뜻입니다. 이야기를 들려주는 것만으로 도덕적 행동이 저절로 생긴다고 가볍게 생각하지 말라는 조언입니다. it은 뒤에 오는 that절을 대신할 뿐 해석하지 않습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">should not take it for granted that classic moral stories will automatically promote moral behaviors\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">should not assume that classic moral stories will automatically promote moral behaviors\u003c/span>\u003cdiv class=\"w\">take it for granted that를 assume that으로 바꾸어 더 단순하게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take it for granted that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">assume that\u003c/span>\u003cspan class=\"y-eq\">take it for granted that ~ = assume that ~\u003c/span>\u003cdiv class=\"w\">관용 표현을 한 동사로 바꿔 의미를 유지했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">promote\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">encourage\u003c/span>\u003cspan class=\"y-eq\">promote = encourage\u003c/span>\u003cdiv class=\"w\">행동을 촉진하다는 뜻의 동의어로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We should not assume that classic moral stories will automatically promote moral behaviors.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"고전적인 교훈 이야기가 자동으로 도덕적 행동을 촉진할 것이라고 당연하게 여겨서는 안 된다는 뜻이에요. 이야기만 들려주면 아이들이 저절로 착해질 거라고 쉽게 생각하지 말라는 조언입니다. 여기서 it은 뒤에 오는 that절을 대신할 뿐 해석하지 않습니다.","hl":"mn"},{"n":12,"text":"should not take it for granted that은 should not assume that으로 바꿔 쓸 수 있습니다. assume을 쓰면 가목적어 it 없이도 같은 의미를 더 단순하게 전달할 수 있어요. promote는 encourage로 바꿔서 도덕적 행동을 장려한다고 표현할 수도 있습니다.","hl":"rw"},{"n":13,"text":"take it for granted that은 assume that으로 바꿀 수 있습니다. promote는 encourage나 foster로 바꿔 쓸 수 있고요. moral은 도덕적인이라는 뜻입니다.","hl":"ph"},{"n":14,"text":"같은 뜻으로 전체 문장을 바꾸면 We should not assume that classic moral stories will automatically promote moral behaviors라고 말할 수 있습니다. 이렇게 assume을 쓰면 가목적어 it 구문을 피하면서도 의미를 그대로 유지할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 The European Union \u003cspan class=\"fx\">has found it difficult to reach a consensus on economic issues\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The European Union\u003c/div>\u003cdiv class=\"k\">유럽연합은\u003c/div>\u003cdiv class=\"e\">has found\u003c/div>\u003cdiv class=\"k\">알았다\u003c/div>\u003cdiv class=\"e\">it\u003c/div>\u003cdiv class=\"k\">그것이\u003c/div>\u003cdiv class=\"e\">difficult\u003c/div>\u003cdiv class=\"k\">어렵다는 것을\u003c/div>\u003cdiv class=\"e\">to reach a consensus\u003c/div>\u003cdiv class=\"k\">의견 일치에 도달하는 것이\u003c/div>\u003cdiv class=\"e\">on economic issues.\u003c/div>\u003cdiv class=\"k\">경제 문제에 대해\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>5형식 문장에서 \u003cb class=\"key\">has found it difficult to reach a consensus on economic issues\u003c/b>는 가목적어 it을 사용한다. 진목적어는 \u003cb class=\"key\">to reach a consensus on economic issues\u003c/b>이고, difficult는 목적격보어이다. it은 가목적어로 해석하지 않는다.\u003c/div>","segs":[{"n":15,"text":"The European Union, 유럽연합은. has found, 알았다. it, 그것이. difficult, 어렵다는 것을. to reach a consensus, 의견 일치에 도달하는 것이. on economic issues, 경제 문제에 대해","hl":"ch"},{"n":16,"text":"세 번째 문장은 has found it difficult to reach처럼 가목적어 it을 쓴 오형식 구문입니다. 진짜 목적어는 to reach a consensus on economic issues이고 difficult가 목적격 보어입니다. it은 해석하지 않고 뒤의 to부정사구가 진짜 목적어라는 점을 잡아야 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 The European Union \u003cspan class=\"fx\">has found it difficult to reach a consensus on economic issues\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>유럽연합이 경제 문제에 관해 의견 일치에 도달하는 것이 어렵다는 것을 알게 되었다는 뜻입니다. it은 뒤의 to부정사구를 대신하며, ‘경제 문제에 대한 합의 도달’이 어렵다는 의미를 전달합니다. 실제 주체는 유럽연합이지만 to reach의 의미상 주어가 the European Union이라는 점을 문맥으로 파악할 수 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">has found it difficult to reach a consensus on economic issues\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has found reaching a consensus on economic issues difficult\u003c/span>\u003cdiv class=\"w\">to부정사 대신 동명사를 쓰고 가목적어 it을 생략해 더 직접적으로 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">reach a consensus\u003c/spa ok in five minutes\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make a habit of not cluttering my mind with simple information that I can find in a book in five minutes\u003c/span>\u003cdiv class=\"w\">규칙으로 삼다는 뜻을 습관으로 삼다는 표현으로 바꾸었다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">make it a rule to do\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">make a habit of doing\u003c/span>\u003cspan class=\"y-eq\">make it a rule to do = make a habit of doing\u003c/span>\u003cdiv class=\"w\">관용표현을 동명사를 쓰는 관용표현으로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">clutter\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">fill\u003c/span>\u003cspan class=\"y-eq\">clutter = fill\u003c/span>\u003cdiv class=\"w\">어지럽히다 대신 채우다로 바꾸어 비슷한 의미를 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">I make a habit of not cluttering my mind with simple information that I can find in a book in five minutes.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"나는 책에서 오 분 이내에 찾을 수 있는 단순한 정보로 내 마음을 어지럽히지 않는 것을 규칙으로 삼는다는 뜻이에요. 굳이 외울 필요 없는 정보는 책에 맡겨 두고 머리를 비워 두라는 아인슈타인의 조언입니다. it은 뒤에 오는 긴 to부정사구를 대신할 뿐 해석하지 않습니다.","hl":"mn"},{"n":42,"text":"make it a rule to do는 make a habit of doing으로 바꿔 쓸 수 있습니다. 규칙으로 삼다는 뜻을 습관으로 삼다는 표현으로 바꾸면 더 부드러운 어감이 돼요. clutter는 fill로 바꿔 말할 수도 있습니다.","hl":"rw"},{"n":43,"text":"make it a rule to do는 make a habit of doing으로 바꿀 수 있습니다. clutter는 fill이나 crowd로 바꿔 쓸 수 있어요. information은 단수 명사로 쓰이고 that 이하가 수식하고 있습니다.","hl":"ph"},{"n":44,"text":"같은 뜻으로 바꾸면 I make a habit of not cluttering my mind with simple information that I can find in a book in five minutes라고 말할 수 있습니다. 이렇게 make a habit of doing을 쓰면 가목적어 it 없이도 같은 의미를 전달할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 We \u003cspan class=\"fx\">owe it to our children to give them a dignified and hopeful future\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We\u003c/div>\u003cdiv class=\"k\">우리는\u003c/div>\u003cdiv class=\"e\">owe\u003c/div>\u003cdiv class=\"k\">의무를 지고 있다\u003c/div>\u003cdiv class=\"e\">it\u003c/div>\u003cdiv class=\"k\">그것을\u003c/div>\u003cdiv class=\"e\">to our children\u003c/div>\u003cdiv class=\"k\">우리의 자녀들에게\u003c/div>\u003cdiv class=\"e\">to give them\u003c/div>\u003cdiv class=\"k\">그들에게 주는 것을\u003c/div>\u003cdiv class=\"e\">a dignified and hopeful future.\u003c/div>\u003cdiv class=\"k\">고귀하고 희망찬 미래를\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">owe it to our children to give them a dignified and hopeful future\u003c/b>는 가목적어 it 구문이다. 진목적어는 \u003cb class=\"key\">to give them a dignified and hopeful future\u003c/b>이고, to our children은 부사구이다. owe A to B 형태로 ‘B에게 A를 빚지다’는 뜻에서 it이 진목적어를 대신한다.\u003c/div>","segs":[{"n":45,"text":"We, 우리는. owe, 의무를 지고 있다. it, 그것을. to our children, 우리의 자녀들에게. to give them, 그들에게 주는 것을. a dignified and hopeful future, 고귀하고 희망찬 미래를","hl":"ch"},{"n":46,"text":"여덟 번째 문장은 owe it to our children to give처럼 가목적어 it을 쓴 구문입니다. 진짜 목적어는 to give them a dignified and hopeful future이고 to our children은 부사구입니다. owe A to B라는 구조에서 it이 진목적어를 대신한다는 점을 기억하세요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 We \u003cspan class=\"fx\">owe it to our children to give them a dignified and hopeful future\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>우리는 우리 아이들에게 고귀하고 희망찬 미래를 주어야 할 의무가 있다는 뜻입니다. 아이들의 미래에 대한 책임을 강조하는 표현입니다. it은 뒤에 오는 to부정사구를 대신합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">We owe it to our children to give them a dignified and hopeful future.\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">We have a duty to our children to give them a dignified and hopeful future.\u003c/span>\u003cdiv class=\"w\">의무를 빚지고 있다는 뜻을 have a duty to로 바꿔 더 명확하게 표현했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">owe it to our children to do\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have a duty to our children to do\u003c/span>\u003cspan class=\"y-eq\">owe it to somebody to do = have a duty to somebody to do\u003c/span>\u003cdiv class=\"w\">빚지다라는 은유적 표현을 의무가 있다는 표현으로 전환했다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">dignified\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">noble\u003c/span>\u003cspan class=\"y-eq\">dignified = noble\u003c/span>\u003cdiv class=\"w\">고귀한이라는 뜻의 유의어로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We have a duty to our children to give them a dignified and hopeful future.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"우리는 우리 아이들에게 고귀하고 희망찬 미래를 주어야 할 의무가 있다는 뜻입니다. 아이들의 미래에 대한 책임을 강조하는 말이에요. 여기서 it은 뒤에 오는 to부정사구를 대신할 뿐 해석하지 않습니다.","hl":"mn"},{"n":48,"text":"owe it to our children to give는 have a duty to our children to give로 바꿔 쓸 수 있습니다. 빚지고 있다는 은유적 표현을 의무가 있다는 말로 바꾸면 더 명확한 의미가 전달돼요. dignified는 noble로 바꿔 말할 수 있습니다.","hl":"rw"},{"n":49,"text":"owe it to somebody to do는 have a duty to somebody to do로 바꿀 수 있습니다. dignified는 noble이나 honorable로 바꿔 쓸 수 있고요. hopeful future는 희망찬 미래라는 뜻입니다.","hl":"ph"},{"n":50,"text":"같은 뜻으로 바꾸면 We have a duty nd that behind the clouds, 그리고 구름 뒤에는. the sun is always shining, 태양이 항상 빛나고 있다는 것을","hl":"ch"},{"n":52,"text":"아홉 번째 문장은 Bear it in mind that 형태로 가목적어 it을 쓴 명령문입니다. 진짜 목적어는 that절 두 개, 즉 that, no matter how violent, it is only temporary와 that behind the clouds the sun is always shining입니다. no matter how violent는 how violent it may be에서 it may be가 생략된 표현입니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 \u003cspan class=\"fx\">Bear it in mind when a life storm breaks that, no matter how violent, it is only temporary and that behind the clouds the sun is always shining\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인생의 폭풍이 칠 때, 아무리 거세더라도 그것은 단지 일시적이며 구름 뒤에서는 태양이 항상 빛나고 있다는 것을 마음속에 새기라는 뜻입니다. 힘든 시기가 지나간다는 위로의 메시지입니다. 두 it 중 첫 it은 가목적어, 두 번째 it은 a life storm을 가리킵니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Bear it in mind when a life storm breaks that, no matter how violent, it is only temporary\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Remember when a life storm breaks that, no matter how violent, it is only temporary\u003c/span>\u003cdiv class=\"w\">명심하라는 표현을 기억하라는 평이한 동사로 바꿨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Bear it in mind that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Keep in mind that\u003c/span>\u003cspan class=\"y-eq\">Bear it in mind that ~ = Keep in mind that ~\u003c/span>\u003cdiv class=\"w\">명심하다는 뜻의 관용 표현을 동의어로 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">no matter how violent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan
