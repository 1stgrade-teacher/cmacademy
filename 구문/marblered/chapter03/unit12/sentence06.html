다. 우리가 흔히 말하는 &#39;말뿐인 위로&#39;보다 직접적인 행동이 담긴 도움이 상대방에게는 훨씬 더 큰 가치가 있다는 뜻이지요. 마치 배고픈 사람에게 &quot;힘내&quot;라고 말하는 대신 빵 한 조각을 건네는 것이 더 효과적인 것과 같은 이치랍니다. 즉, 관념적인 동정보다는 작은 실천이 담긴 친절(kindness)이 세상을 바꾸는 실질적인 힘이 된다는 것을 기억하며 글을 읽어보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01조언의 제시</div><ul><li>마음속 깊이 간직해야 할 삶의 태도에 대해 이야기한다.</li><li>행동의 중요성 강조</li><li>단순한 감정보다는 실질적인 행위를 권장함</li><li>핵심 키워드: 새기다(Engrave)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02비교와 선택</div><ul><li>말로 하는 동정과 실제적인 도움 사이의 가치를 비교한다.</li><li>동정(pity)은 위로일 뿐 문제를 해결하지 못함</li><li>도움(help)은 실질적인 변화를 만들어냄</li><li>핵심 키워드: 동정(pity), 도움(help)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가치 판단</div><ul><li>결론적으로 작은 행동 하나가 많은 말보다 훨씬 가치 있다.</li><li>실천이 동반된 도움의 무게를 강조</li><li>진정한 친절은 행동으로 나타남</li><li>핵심 키워드: 가치(worth)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">engrave</td><td class=\"m\">새기다, 명심하다</td></tr><tr><td class=\"w\">heart</td><td class=\"m\">마음, 심장</td></tr><tr><td class=\"w\">worth</td><td class=\"m\">~할 가치가 있는</td></tr><tr><td class=\"w\">a deal of</td><td class=\"m\">다량의, 상당한</td></tr><tr><td class=\"w\">pity</td><td class=\"m\">연민, 동정</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것을 새겨라</span><span class=\"en\"><b><span class=\"grammar-hl\">Engrave it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 마음에</span><span class=\"en\"><b><span class=\"grammar-hl\">on your heart</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약간의 도움이</span><span class=\"en\"><b><span class=\"grammar-hl\">that a little help</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가치가 있다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">is worth</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 동정의</span><span class=\"en\"><b><span class=\"grammar-hl\">a deal of pity.</span></b></span></div></div><div class=\"lec-sent-ko\">작은 도움이 많은 동정의 가치가 있다는 것을 당신의 마음에 새겨라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 Engrave는 사전적으로 &#39;조각하다, 새기다&#39;라는 뜻입니다. 여기서는 단순히 기억하라는 말을 넘어, 절대 잊지 말고 당신의 신념으로 삼으라는 강조의 의미로 쓰였습니다. 머릿속이 아니라 마음(heart)에 새기라고 표현함으로써, 지식으로 아는 것을 넘어 실천하는 삶의 태도가 되어야 함을 비유적으로 나타냈습니다. 이 문장은 타인의 불행을 불쌍히 여기는 마음(pity)만 갖는 것보다, 비록 작더라도 실질적인 행동(help)을 하는 것이 훨씬 더 큰 가치를 지닌다는 교훈을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Engrave it on your heart that a little help is worth a deal of pity. (가주어): 진주어: it은 가목적어이고, that절(a little help is worth a deal of pity)이 진목적어 역할을 하여 문장의 복잡함을 줄여주는 구조입니다.</div><div class=\"lec-gr-item\">that a little help is worth a deal of pity 동격의 that: 앞의 명사(심리적 상태나 진리를 담은 내용)의 구체적인 내용을 보충 설명하는 동격의 that절 구조입니다.</div><div class=\"lec-gr-item\">is worth (관용표현): be worth는 &#39;~할 가치가 있다&#39;는 의미로 쓰이는 숙어적 표현입니다.</div><div class=\"lec-gr-item\">a deal of (관용표현): a deal of는 &#39;많은, 상당한&#39;의 의미를 나타내는 수량 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">engrave</td><td class=\"m\">새기다, 명심하다</td></tr><tr><td class=\"w\">heart</td><td class=\"m\">마음, 심장</td></tr><tr><td class=\"w\">worth</td><td class=\"m\">~할 가치가 있는</td></tr><tr><td class=\"w\">a deal of</td><td class=\"m\">다량의, 상당한</td></tr><tr><td class=\"w\">pity</td><td class=\"m\">연민, 동정</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>타인을 향한 막연한 동정심은 실제적인 도움을 주지 못한다.</li><li>말뿐인 안타까움보다 작더라도 직접적인 행동이 훨씬 중요하다.</li><li>이러한 가치관을 마음속 깊이 간직하고 실천해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People should value offering practical assistance rather than just feeling sympathy, because taking action has a greater impact on others.</div>\n              <div class=\"lec-final-sum-ko\">단순히 동정심을 느끼기보다 실질적인 도움을 주는 것을 가치 있게 여겨야 하는데, 이는 행동이 타인에게 더 큰 영향을 주기 때문이다.</div></div></div>"],"segs":[[{"audio":"./unit12-sentence05_강의_audio/1.mp3","hl":null}],[{"audio":"./unit12-sentence05_강의_audio/2.mp3","hl":null}],[{"audio":"./unit12-sentence05_강의_audio/3.mp3","hl":null},{"audio":"./unit12-sentence05_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit12-sentence05_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit12-sentence05_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit12-sentence05_강의_audio/7.mp3","hl":null}],[{"audio":"./unit12-sentence05_강의_audio/8.mp3","hl":"main"},{"audio":"./unit12-sentence05_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit12-sentence05_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit12-sentence05_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().to
