w lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01독서의 능력</div><ul><li>글을 읽을 줄 아는 사람은 누구나 자신의 삶을 더 나은 방향으로 바꿀 수 있는 힘을 가지고 있습니다.</li><li>독서(reading)를 통해 개인의 잠재력(power)을 발휘함</li><li>스스로를 성장시키고 삶을 더 크게 만들 수 있음</li><li>핵심 키워드: 잠재력(power), 성장(magnify)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02삶의 다각화</div><ul><li>독서는 우리가 존재할 수 있는 다양한 방식과 경로를 만들어 줍니다.</li><li>단순히 한 가지 모습으로 사는 것을 넘어섬</li><li>존재의 방식(ways of existing)을 다양하게 늘림</li><li>핵심 키워드: 다양화(multiply), 존재(exists)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가치 있는 삶의 실현</div><ul><li>독서를 통해 일상을 더욱 풍요롭고 깊이 있게 가꿀 수 있습니다.</li><li>삶을 충만하고 의미(significant) 있게 만듦</li><li>독서는 흥미롭고 가치 있는 인생을 만드는 수단임</li><li>핵심 키워드: 의미(significant), 흥미(interesting)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">know</td><td class=\"m\">알다, 할 줄 알다</td></tr><tr><td class=\"w\">read</td><td class=\"m\">읽다</td></tr><tr><td class=\"w\">power</td><td class=\"m\">능력, 힘</td></tr><tr><td class=\"w\">magnify</td><td class=\"m\">확대하다, 증대하다</td></tr><tr><td class=\"w\">multiply</td><td class=\"m\">늘리다, 증대시키다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exist</td><td class=\"m\">존재하다</td></tr><tr><td class=\"w\">full</td><td class=\"m\">충만한, 가득 찬</td></tr><tr><td class=\"w\">significant</td><td class=\"m\">의미 있는, 중요한</td></tr><tr><td class=\"w\">interesting</td><td class=\"m\">흥미로운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모든 사람은</span><span class=\"en\"><b>Every man</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아는</span><span class=\"en\"><b><span class=\"grammar-hl\">who knows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">읽는 방법을</span><span class=\"en\"><b><span class=\"grammar-hl\">how to read</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 가지고 있다</span><span class=\"en\"><b>has it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 수중에</span><span class=\"en\"><b>in his power</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신을 확장하는 것을,</span><span class=\"en\"><b><span class=\"grammar-hl\">to magnify himself</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방식을 다양화하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to multiply the ways</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신이 존재하는</span><span class=\"en\"><b><span class=\"grammar-hl\">in which he exists</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 삶을 만드는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to make his life</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">충만하고, 중대하고, 흥미롭게</span><span class=\"en\"><b><span class=\"grammar-hl\">full, significant, and interesting</span>.</b></span></div></div><div class=\"lec-sent-ko\">글을 읽는 방법을 아는 모든 사람은 자신을 확장하는 것, 자신이 존재하는 방식을 다양화하는 것, 자신의 삶을 충만하고, 중대하고, 흥미롭게 만드는 것을 자신의 수중에 가진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 독서가 인간의 삶에 미치는 긍정적인 영향을 서술합니다. 여기서 magnify는 사전적으로 &#39;확대하다, 크게 하다&#39;라는 뜻인데, 여기서는 단순히 몸집을 키우는 것이 아니라 한 사람의 내면적 역량과 경험의 폭을 넓히는 것을 의미합니다. 필자는 인간이 책을 통해 자신의 한계를 넘어선 성장을 이룰 수 있다는 점을 강조하기 위해 이 동사를 선택했습니다. 또한, 글의 도입부로서 독서라는 행위가 가진 확장성이라는 핵심 주제를 제시하며, 뒤이어 나올 구체적인 변화들을 포괄하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who knows how to read (관계대명사): 주격 관계대명사절로 선행사 &#39;Every man&#39;을 수식함. who 뒤에 주어 없이 바로 동사 &#39;knows&#39;가 오는 구조.</div><div class=\"lec-gr-item\">how to read (to부정사): 의문사(how) + to부정사 구조로 문장에서 &#39;읽는 방법&#39;이라는 명사적 역할을 함.</div><div class=\"lec-gr-item\">to magnify himself (to부정사): 앞의 명사 &#39;power&#39;를 수식하는 형용사적 용법. &#39;자기 자신을 확대할&#39;이라는 의미를 가짐.</div><div class=\"lec-gr-item\">to multiply the ways (to부정사): 앞선 &#39;to magnify&#39;와 병렬 구조를 이루어 &#39;power&#39;를 수식하는 형용사적 용법으로 사용됨.</div><div class=\"lec-gr-item\">in which he exists 관계부사(전치사+관계대명사): &#39;in which&#39;는 &#39;the ways&#39;를 선행사로 받는 관계대명사절 구조로, &#39;in which&#39; 뒤에는 주어(he)와 동사(exists)가 갖춰진 완전한 절이 옴.</div><div class=\"lec-gr-item\">to make his life full, significant, and interesting 5형식(SVOC) 구조: &#39;make(V) + his life(O) + full, significant, and interesting(C)&#39;의 형태로, 목적어의 상태를 설명하는 형용사 보어들이 나열됨.</div><div class=\"lec-gr-item\">to make (to부정사): 앞의 &#39;to magnify&#39;, &#39;to multiply&#39;와 함께 &#39;power&#39;를 수식하는 형용사적 용법의 병렬 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">know</td><td class=\"m\">알다, 할 줄 알다</td></tr><tr><td class=\"w\">read</td><td class=\"m\">읽다</td></tr><tr><td class=\"w\">power</td><td class=\"m\">능력, 힘</td></tr><tr><td class=\"w\">magnify</td><td class=\"m\">확대하다, 증대하다</td></tr><tr><td class=\"w\">multiply</td><td class=\"m\">늘리다, 증대시키다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exist</td><td class=\"m\">존재하다</td></tr><tr><td class=\"w\">full</td><td class=\"m\">충만한, 가득 찬</td></tr><tr><td class=\"w\">significant</td><td class=\"m\">의미 있는, 중요한</td></tr><tr><td class=\"w\">interesting</td><td class=\"m\">흥미로운</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>읽기 능력을 갖춘 사람은 스스로를 성장시킬 수 있는 힘을 가진다.</li><li>독서는 개인이 경험하는 삶의 방식을 다채롭게 만든다.</li><li>결과적으로 독서는 개인의 삶을 내면적으로 풍요롭고 가치 있게 변화시킨다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Reading allows people to magnify their existence, and it enables them to make their lives more significant and interesting.</div>\n              <div class=\"lec-final-sum-ko\">독서는 사람들이 자신의 존재를 확장하게 해주며, 그들의 삶을 더욱 의미 있고 흥미롭게 만들 수 있도록 돕는다.</div></div></div>"],"segs":[[{"audio":"./unit12-sentence12_강의_audio/1.mp3","hl":null}],[{"audio":"./unit12-sentence12_강의_audio/2.mp3","hl":null}],[{"audio":"./unit12-sentence12_강의_audio/3.mp3","hl":null},{"audio":"./unit12-sentence12_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit12-sentence12_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit12-sentence12_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit12-sentence12_강의_audio/7.mp3","hl":null}],[{"audio":"./unit12-sentence12_강의_audio/8.mp3","hl":"main"},{"audio":"./unit12-sentence12_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit12-sentence12_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit12-sentence12_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};
