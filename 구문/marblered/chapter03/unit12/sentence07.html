</div><ul><li>광고는 우리의 의지와 상관없이 주변 환경 속에 항상 존재한다.</li><li>현대 사회 어디에서나 접할 수 있는 정보</li><li>시각적인 차단만으로는 회피가 어려움</li><li>핵심 키워드: 환경(surroundings), 침투(penetration)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">even if</td><td class=\"m\">설령 ~일지라도</td></tr><tr><td class=\"w\">newspaper</td><td class=\"m\">신문</td></tr><tr><td class=\"w\">television</td><td class=\"m\">텔레비전</td></tr><tr><td class=\"w\">walk around</td><td class=\"m\">돌아다니다</td></tr><tr><td class=\"w\">street</td><td class=\"m\">거리</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">impossible</td><td class=\"m\">불가능한</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다</td></tr><tr><td class=\"w\">form</td><td class=\"m\">형태, 방식</td></tr><tr><td class=\"w\">publicity</td><td class=\"m\">광고, 홍보</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 당신이 신문을 읽지 않거나</span><span class=\"en\"><b><span class=\"grammar-hl\">Even if you don’t read a newspaper</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">텔레비전을 시청하지 않더라도,</span><span class=\"en\"><b><span class=\"grammar-hl\">or watch television</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 거리를 걸어 다닌다고 해도</span><span class=\"en\"><b>and <span class=\"grammar-hl\">walk around</span> the streets</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">눈을 내리깐 채로,</span><span class=\"en\"><b><span class=\"grammar-hl\">with your eyes down</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 불가능하다는 것을 알게 될 것이다</span><span class=\"en\"><b>you’ll <span class=\"grammar-hl\">find it impossible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피하는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">to avoid</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 형태의 광고를</span><span class=\"en\"><b>some form of publicity.</b></span></div></div><div class=\"lec-sent-ko\">비록 당신이 신문을 읽지 않거나 텔레비전을 시청하지 않는다고 하더라도, 그리고 눈을 내리깐 채로 거리를 걸어 다닌다고 하더라도 당신은 어떤 형태의 광고를 피하는 것이 불가능하다는 것을 알게 될 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 현대 사회에서 광고(publicity)로부터 완전히 벗어나는 것이 얼마나 힘든지를 가정법적 상황을 통해 강조합니다. 여기서 publicity는 사전적으로는 &#39;공표&#39;, &#39;널리 알림&#39;을 뜻하지만, 여기서는 맥락상 대중에게 노출되는 &#39;광고&#39;나 &#39;홍보물&#39;을 의미합니다. 필자는 우리가 일상적인 매체(신문, TV)를 멀리하고 시선을 피하는 행동(고개를 숙임)을 해도 결국 마주치게 되는 광고의 보편성을 보여주기 위해 이 표현을 선택했습니다. 앞부분의 구체적인 상황들은 우리가 광고를 피하려는 노력을 보여주며, 뒷부분은 그 노력이 무의미하다는 반전으로 이어져 논리적 대조를 이룹니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Even if you don’t read a newspaper or watch television (분사구문): 문맥상 양보의 의미를 가지며 접속사(Even if) + 주어(you) + 동사(don&#39;t read/watch) 구조로 이루어진 부사절이다.</div><div class=\"lec-gr-item\">walk around (분사구문): 앞서 나온 &#39;Even if you don&#39;t&#39;의 주어와 동일한 you가 생략된 형태로, 문맥상 &#39;If you walk around&#39;와 같이 조건의 의미를 지닌다.</div><div class=\"lec-gr-item\">with your eyes down (관용표현): &#39;with + 명사 + 형용사/분사&#39; 구문으로, 상태를 나타내는 부사구 역할을 한다.</div><div class=\"lec-gr-item\">find it impossible to avoid 5형식(SVOC) 구조: find(S) + it(가목적어) + impossible(OC, 형용사) + to avoid(진목적어) 구조로, to부정사가 진목적어 역할을 하는 문장 패턴이다.</div><div class=\"lec-gr-item\">to avoid (to부정사): 5형식 문장에서 가목적어 it을 대신하여 실질적인 목적어 역할을 하는 명사적 용법의 to부정사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">even if</td><td class=\"m\">설령 ~일지라도</td></tr><tr><td class=\"w\">newspaper</td><td class=\"m\">신문</td></tr><tr><td class=\"w\">television</td><td class=\"m\">텔레비전</td></tr><tr><td class=\"w\">walk around</td><td class=\"m\">돌아다니다</td></tr><tr><td class=\"w\">street</td><td class=\"m\">거리</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">impossible</td><td class=\"m\">불가능한</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다</td></tr><tr><td class=\"w\">form</td><td class=\"m\">형태, 방식</td></tr><tr><td class=\"w\">publicity</td><td class=\"m\">광고, 홍보</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>현대 사회에서 매체를 멀리하고 시선을 돌리는 등 광고를 피하려 노력해도 소용이 없다.</li><li>광고는 어디에나 존재하며, 우리 삶에서 그것을 완전히 차단하는 것은 사실상 불가능하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People are constantly surrounded by various forms of advertising, even when they try to avoid media or look away while walking.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 매체를 피하거나 길을 걸으며 시선을 돌리려 할 때조차, 다양한 형태의 광고에 끊임없이 둘러싸여 있다.</div></div></div>"],"segs":[[{"audio":"./unit12-sentence06_강의_audio/1.mp3","hl":null}],[{"audio":"./unit12-sentence06_강의_audio/2.mp3","hl":null}],[{"audio":"./unit12-sentence06_강의_audio/3.mp3","hl":null},{"audio":"./unit12-sentence06_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit12-sentence06_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit12-sentence06_강의_audio/6.mp3","hl":null}],[{"audio":"./unit12-sentence06_강의_audio/7.mp3","hl":"main"},{"audio":"./unit12-sentence06_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit12-sentence06_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit12-sentence06_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var
