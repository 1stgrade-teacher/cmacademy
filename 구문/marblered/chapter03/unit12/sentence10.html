R2YuoACk4JKgc4HUnA9+MniphZvneuv4aPz329ASbTtdqzu1utdbPpbb7l6/wD/2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Finding Hope Beyond Life’s Temporary Storms<small>인생의 일시적인 폭풍 너머에서 희망 찾기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">인생을 살다 보면 예기치 못한 힘든 상황을 맞닥뜨리게 되는데, 이를 흔히 삶의 폭풍(life storm)이라고 비유하곤 해요. 심리학에서는 이러한 역경을 어떻게 받아들이느냐에 따라 회복 탄력성(resilience)이 달라진다고 보는데, 이는 어려운 상황 속에서도 다시 일어서려는 긍정적인 마음가짐을 의미해요. 마치 날씨가 흐려도 구름 뒤에는 늘 태양이 빛나고 있다는 사실을 아는 것과 같은 이치죠. 즉, 지금 당장 겪는 고통이 영원하지 않다는 일시성(temporariness)을 인지하는 것만으로도 심리적 고통을 크게 줄일 수 있답니다. 힘든 순간이 닥칠 때 그 감정에만 매몰되지 않고, 언젠가 상황이 나아질 것이라는 희망을 품는 것이야말로 정신적 건강을 지키는 핵심 열쇠라고 할 수 있어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01시련의 발생</div><ul><li>인생에서 갑작스럽게 찾아오는 힘든 상황을 받아들여야 한다.</li><li>인생의 시련(life storm)이 닥치는 순간을 인지함</li><li>폭풍우처럼 휘몰아치는 상황을 가정함</li><li>핵심 키워드: 시련(storm)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02일시적 성격</div><ul><li>어떠한 시련이라도 결국 지나가는 일시적인 사건임을 기억해야 한다.</li><li>시련의 강도(violent)와 상관없이 그 상태는 영원하지 않음</li><li>고통은 결국 끝나는 것임을 명심함</li><li>핵심 키워드: 일시적인(temporary)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03희망의 유지</div><ul><li>힘든 시기 뒤에는 언제나 다시 밝은 날이 기다리고 있음을 잊지 말아야 한다.</li><li>구름(clouds) 뒤에는 태양(sun)이 항상 존재함</li><li>긍정적인 상황이 다시 올 것임을 확신함</li><li>핵심 키워드: 희망(hope)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bear in mind</td><td class=\"m\">명심하다, 기억하다</td></tr><tr><td class=\"w\">life</td><td class=\"m\">인생, 삶</td></tr><tr><td class=\"w\">storm</td><td class=\"m\">폭풍, (인생의) 시련</td></tr><tr><td class=\"w\">break</td><td class=\"m\">(폭풍 등이) 갑자기 시작되다, 터지다</td></tr><tr><td class=\"w\">no matter how</td><td class=\"m\">아무리 ~하더라도</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">violent</td><td class=\"m\">격렬한, 맹렬한</td></tr><tr><td class=\"w\">temporary</td><td class=\"m\">일시적인</td></tr><tr><td class=\"w\">cloud</td><td class=\"m\">구름</td></tr><tr><td class=\"w\">shine</td><td class=\"m\">빛나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마음속에 품어라</span><span class=\"en\"><b><span class=\"grammar-hl\">Bear it in mind</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인생의 폭풍이 일 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when a life storm breaks</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~라는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아무리 맹렬하더라도</span><span class=\"en\"><b><span class=\"grammar-hl\">no matter how violent,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 단지 일시적이라는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">it is only temporary</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 ~라는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">and that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구름 뒤에는</span><span class=\"en\"><b><span class=\"grammar-hl\">behind the clouds</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태양이</span><span class=\"en\"><b><span class=\"grammar-hl\">the sun</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상 빛나고 있다는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">is always shining</span>.</b></span></div></div><div class=\"lec-sent-ko\">인생의 폭풍이 일 때 아무리 맹렬하더라도 그것은 단지 일시적이라는 것을, 그리고 구름 뒤에는 태양이 항상 빛나고 있다는 것을 마음속에 품어라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞부분의 Bear it in mind는 직역하면 &#39;마음속에 곰을 지녀라&#39;가 아니라, &#39;명심하다&#39;라는 뜻입니다. 필자는 인생의 힘든 시기를 &#39;폭풍&#39;에, 희망을 &#39;태양&#39;에 비유하는 관습적인 표현을 사용하여 독자에게 위로와 격려를 건네고 있습니다. 또한, &#39;폭풍은 지나가고 해는 뜬다&#39;는 논리를 통해 지금 겪는 고난이 끝이 아님을 강조하며 앞뒤 문장의 인과관계를 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Bear it in mind (관용표현): &#39;명심하다&#39;라는 뜻의 숙어. 뒤에 오는 that절을 목적어로 취하는 구조입니다.</div><div class=\"lec-gr-item\">when a life storm breaks (관계부사(when)): 시간의 의미를 담아 &#39;폭풍이 몰아칠 때&#39;라는 부사절을 이끄는 관계부사 절입니다.</div><div class=\"lec-gr-item\">that, no matter how violent, it is only temporary 동격의 that: 앞선 관용표현 &#39;Bear it in mind&#39;의 구체적인 내용(&#39;~라는 사실을&#39;)을 설명하는 명사절을 이끄는 접속사 that입니다.</div><div class=\"lec-gr-item\">it is only temporary 5형식(SVOC) 구조: 주어(it) + 동사(is) + 보어(temporary)의 2형식 구조이나, 넓은 의미에서 상태를 나타내는 형용사가 보어로 사용된 문장 패턴입니다.</div><div class=\"lec-gr-item\">and that behind the clouds the sun is always shining 동격의 that: 앞의 &#39;Bear it in mind&#39;가 취하는 목적어 절이 병렬 구조로 연결된 것입니다. &#39;~라는 사실을&#39;을 설명합니다.</div><div class=\"lec-gr-item\">behind the clouds the sun is always shining (도치): 장소를 나타내는 부사구(behind the clouds)가 문두로 오면서, 주어(the sun)와 동사(is shining)의 어순이 도치될 수 있는 구조이나, 여기서는 문맥 강조를 위해 부사구가 앞에 배치되었습니다.</div><div class=\"lec-gr-item\">is always shining (현재진행): be동사(is) + 현재분사(shining)가 결합하여 &#39;항상 빛나고 있다&#39;라는 진행의 동작을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">life</td><td class=\"m\">인생, 삶</td></tr><tr><td class=\"w\">storm</td><td class=\"m\">폭풍, (인생의) 시련</td></tr><tr><td class=\"w\">break</td><td class=\"m\">(폭풍 등이) 갑자기 시작되다, 터지다</td></tr><tr><td class=\"w\">no matter how</td><td class=\"m\">아무리 ~하더라도</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">violent</td><td class=\"m\">격렬한, 맹렬한</td></tr><tr><td class=\"w\">temporary</td><td class=\"m\">일시적인</td></tr><tr><td class=\"w\">cloud</td><td class=\"m\">구름</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인생에서 겪는 힘든 시기는 마치 폭풍우처럼 거세게 느껴진다.</li><li>하지만 그 어떤 고난도 영원하지 않으며 결국 지나가게 되어 있다.</li><li>시련의 뒤편에는 항상 희망(태양)이 존재한다는 사실을 잊지 말아야 한다.</li><li>어려움 속에서도 긍정적인 태도를 유지하며 인내심을 가져야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Life&#39;s hardships are only temporary despite their intensity, so people should keep in mind that brighter days exist beyond their current struggles.</div>\n              <div class=\"lec-final-sum-ko\">인생의 시련은 강렬할지라도 일시적일 뿐이므로, 사람들은 현재의 어려움 너머에 더 밝은 날이 있음을 기억해야 한다.</div></div></div>"],"segs":[[{"audio":"./unit12-sentence09_강의_audio/1.mp3","hl":null}],[{"audio":"./unit12-sentence09_강의_audio/2.mp3","hl":null}],[{"audio":"./unit12-sentence09_강의_audio/3.mp3","hl":null},{"audio":"./unit12-sentence09_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit12-sentence09_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit12-sentence09_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit12-sentence09_강의_audio/7.mp3","hl":null}],[{"audio":"./unit12-sentence09_강의_audio/8.mp3","hl":"main"},{"audio":"./unit12-sentence09_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit12-sentence09_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit12-sentence09_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==
