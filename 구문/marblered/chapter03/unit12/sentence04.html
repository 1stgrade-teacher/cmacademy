1/Lv159B0CBhj6j69Bj9KS26JW/C3yD+tvTr/X4H//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Challenge of Reaching Economic Consensus in the EU<small>유럽연합에서 경제적 합의에 도달하기 위한 과제</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">유럽 연합(European Union, EU)은 여러 나라가 모여 하나의 경제 공동체를 이루고 있는데, 국가마다 처한 상황이 달라 모두가 만족하는 합의(Consensus)를 끌어내기가 매우 어렵습니다. 마치 여러 명의 친구가 모여 여행지를 정할 때 누구는 휴양지를, 누구는 도심을 원해서 결정을 못 하는 것과 비슷한 상황이라고 생각하면 이해하기 쉬워요. 경제 정책을 결정할 때는 각 나라의 이익이 충돌하기 때문에, 모든 구성원을 설득하고 의견을 하나로 모으는 과정이 매우 복잡하고 시간이 많이 걸릴 수밖에 없죠. 이런 상황을 흔히 &#39;만장일치를 구하는 과정의 어려움&#39;이라고 표현하는데, 이번 지문에서는 왜 EU가 경제 문제에서 통일된 결정을 내리기 힘든 구조적 원인을 가지고 있는지에 대해 다루고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 설명</div><ul><li>유럽연합은 회원국 간의 경제적인 문제에 대해 의견을 모으는 데 어려움을 겪고 있다.</li><li>경제적 사안(economic issues)에 대한 의견 일치 필요</li><li>회원국 간 서로 다른 입장 차이 존재</li><li>핵심 키워드: 합의(consensus)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02문제의 원인</div><ul><li>다양한 국가들이 모여 있는 구조상 공동의 해결책을 도출하기가 쉽지 않다.</li><li>각 국가의 서로 다른 경제 상황</li><li>이해관계의 복잡성으로 인한 논의 지연</li><li>핵심 키워드: 유럽연합(European Union)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03향후 과제</div><ul><li>앞으로 유럽연합이 경제적 결속력을 높이기 위해서는 원만한 합의 과정이 필수적이다.</li><li>정책적 조율(coordination)을 위한 노력 필요</li><li>공통된 경제 목표 설정을 위한 대화 지속</li><li>핵심 키워드: 경제적 문제(economic issues)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">European Union</td><td class=\"m\">유럽 연합</td></tr><tr><td class=\"w\">find</td><td class=\"m\">~라고 여기다, 발견하다</td></tr><tr><td class=\"w\">difficult</td><td class=\"m\">어려운</td></tr><tr><td class=\"w\">reach</td><td class=\"m\">(합의 등에) 도달하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consensus</td><td class=\"m\">합의, 의견 일치</td></tr><tr><td class=\"w\">economic</td><td class=\"m\">경제의, 경제학의</td></tr><tr><td class=\"w\">issue</td><td class=\"m\">사안, 문제</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">유럽연합은</span><span class=\"en\"><b>The European Union</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알게 되었다</span><span class=\"en\"><b>has <span class=\"grammar-hl\">found</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어렵다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">it difficult</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의견 일치에 도달하는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">to reach</span> a consensus</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경제 문제들에 관해</span><span class=\"en\"><b>on economic issues.</b></span></div></div><div class=\"lec-sent-ko\">유럽연합은 경제 문제에 관해 의견 일치에 도달하는 것이 어렵다는 것을 알았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 유럽연합(EU)이 경제와 관련된 현안을 결정할 때 회원국들 사이에서 하나의 통일된 의견을 모으는 데 어려움을 겪고 있다는 상황을 설명합니다. 여기서 consensus는 사전적으로 &#39;합의&#39;를 의미하는데, 단순히 의견을 모으는 것을 넘어 서로 다른 이해관계를 가진 여러 국가가 최종적으로 찬성하여 하나의 결론을 내리는 &#39;정치적·경제적 동의&#39;를 뜻합니다. 필자는 유럽연합이 가진 복잡한 의사결정 구조의 한계를 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">found it difficult 5형식(SVOC) 구조: find(5형식 동사) + it(가목적어) + difficult(목적보어/형용사) + to reach(진목적어) 형태입니다. 목적어 자리에 부정사구를 그대로 쓰면 보어와의 순서가 어색해지므로 가목적어 it을 쓰고 진목적어를 뒤로 보낸 구조입니다.</div><div class=\"lec-gr-item\">to reach (to부정사): 5형식 구조에서 가목적어 it을 대신하여 뒤에 위치한 진목적어 역할을 하는 명사적 용법의 부정사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">European Union</td><td class=\"m\">유럽 연합</td></tr><tr><td class=\"w\">difficult</td><td class=\"m\">어려운</td></tr><tr><td class=\"w\">reach</td><td class=\"m\">(합의 등에) 도달하다</td></tr><tr><td class=\"w\">consensus</td><td class=\"m\">합의, 의견 일치</td></tr><tr><td class=\"w\">economic</td><td class=\"m\">경제의, 경제학의</td></tr><tr><td class=\"w\">issue</td><td class=\"m\">사안, 문제</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>유럽연합은 다양한 회원국들로 구성되어 있어 경제 관련 현안에 대해 하나의 의견을 모으기가 어렵다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The European Union faces significant challenges in forming a unified policy because its members have trouble reaching a consensus on economic issues.</div>\n              <div class=\"lec-final-sum-ko\">유럽연합은 회원국들이 경제적 사안에 대해 합의를 도출하는 데 어려움을 겪고 있어 통일된 정책을 형성하는 데 큰 도전에 직면해 있다.</div></div></div>"],"segs":[[{"audio":"./unit12-sentence03_강의_audio/1.mp3","hl":null}],[{"audio":"./unit12-sentence03_강의_audio/2.mp3","hl":null}],[{"audio":"./unit12-sentence03_강의_audio/3.mp3","hl":null},{"audio":"./unit12-sentence03_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit12-sentence03_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit12-sentence03_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit12-sentence03_강의_audio/7.mp3","hl":null}],[{"audio":"./unit12-sentence03_강의_audio/8.mp3","hl":"main"},{"audio":"./unit12-sentence03_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit12-sentence03_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit12-sentence03_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=
