c-stage-head\">01우리의 의무</div><ul><li>우리는 다음 세대에게 가치 있는 미래를 물려주어야 할 도덕적 책임이 있다.</li><li>아이들을 위한 미래 보장 (give them a future)</li><li>부모 세대가 져야 할 당연한 의무 (owe it to our children)</li><li>핵심 키워드: 책임(obligation), 미래(future)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02미래의 조건</div><ul><li>아이들이 물려받을 미래는 존엄하고 희망으로 가득 차 있어야 한다.</li><li>인간으로서의 존엄성 유지 (dignified)</li><li>긍정적인 기대와 희망 (hopeful)</li><li>핵심 키워드: 존엄한(dignified), 희망적인(hopeful)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">owe</td><td class=\"m\">~에게 ~을 빚지고 있다 (의무가 있다)</td></tr><tr><td class=\"w\">child</td><td class=\"m\">아이, 자녀</td></tr><tr><td class=\"w\">give</td><td class=\"m\">주다, 제공하다</td></tr><tr><td class=\"w\">dignified</td><td class=\"m\">품위 있는, 존엄한</td></tr><tr><td class=\"w\">hopeful</td><td class=\"m\">희망찬, 기대에 찬</td></tr><tr><td class=\"w\">future</td><td class=\"m\">미래</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 빚지고 있다 그것을</span><span class=\"en\"><b>We <span class=\"grammar-hl\">owe it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 자녀들에게</span><span class=\"en\"><b><span class=\"grammar-hl\">to our children</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들에게 줄 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to give</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고귀한</span><span class=\"en\"><b>a dignified</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 희망찬 미래를</span><span class=\"en\"><b>and hopeful future.</b></span></div></div><div class=\"lec-sent-ko\">우리는 우리의 자녀들에게 고귀하고 희망찬 미래를 제공할 의무를 지고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 어른들이 다음 세대를 위해 마땅히 해야 할 도덕적 책임을 강조하고 있습니다. 여기서 owe는 사전적으로 &#39;빚을 지다&#39;라는 뜻이지만, 여기서는 &#39;마땅히 해야 할 의무가 있다&#39;는 의미로 쓰였습니다. 필자는 단순히 아이들을 돕는 것을 넘어, 우리가 그들에게 갚아야 할 &#39;빚&#39;과 같은 엄중한 책임이 있다는 점을 강조하기 위해 이 단어를 선택했습니다. 앞뒤 맥락 없이 단독으로 쓰인 문장이지만, 전체적인 글의 논조가 우리가 세상을 더 나은 곳으로 만들어야 한다는 당위성을 주장하는 도입부임을 알 수 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">owe it to our children (관용표현): owe A to B(A를 B에게 빚지다/B의 덕분으로 여기다) 구조이며, 여기서 가목적어 &#39;it&#39;이 쓰이고 진목적어는 뒤의 &#39;to give&#39;가 담당하는 5형식 구조와 유사한 목적어 보충 구조임</div><div class=\"lec-gr-item\">to give (to부정사): 앞의 가목적어 &#39;it&#39;을 대신하는 진목적어 역할을 하는 명사적 용법의 to부정사임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">owe</td><td class=\"m\">~에게 ~을 빚지고 있다 (의무가 있다)</td></tr><tr><td class=\"w\">child</td><td class=\"m\">아이, 자녀</td></tr><tr><td class=\"w\">give</td><td class=\"m\">주다, 제공하다</td></tr><tr><td class=\"w\">dignified</td><td class=\"m\">품위 있는, 존엄한</td></tr><tr><td class=\"w\">hopeful</td><td class=\"m\">희망찬, 기대에 찬</td></tr><tr><td class=\"w\">future</td><td class=\"m\">미래</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우리는 다음 세대에게 존엄하고 희망적인 미래를 물려주어야 할 책임이 있다.</li><li>더 나은 미래를 만드는 것은 현재 세대가 반드시 실천해야 할 도덕적 의무이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">We have a duty to ensure our children’s future, so we must strive to make it dignified and hopeful.</div>\n              <div class=\"lec-final-sum-ko\">우리는 아이들의 미래를 책임져야 하므로, 그것이 존엄하고 희망차게 되도록 노력해야 한다.</div></div></div>"],"segs":[[{"audio":"./unit12-sentence08_강의_audio/1.mp3","hl":null}],[{"audio":"./unit12-sentence08_강의_audio/2.mp3","hl":null}],[{"audio":"./unit12-sentence08_강의_audio/3.mp3","hl":null},{"audio":"./unit12-s
