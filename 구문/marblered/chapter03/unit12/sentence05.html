ff8OKAF/wA/5/z/ACOCkDDoSM/N37KefyyM+lG5fUdQOo7/AP66A/MWkzjr9On/ANc/T6g+opNwzjPrz9Oo/DjPp3xS7h6j88/yoAWj9MfTn/635dKT3zxnj8egz0P5Z9/UyPUfmKPX/gAL19uO4/z+IoGe/wDn/Pb26800MGBII9Oo9M/y/keo5o3KO/fHUf1P6n/CgB1FN3LgHIHBPp0HPHt/h7UuR1z/AJxn+XNLv5vT7lsLTXy3/MWj/P8Anr/SkJA79aWmMP8AP5/X9Ka33TgZI9Ovv+maXIHcdxn6Z4/Doc9+vNI2AGIxnaT+Q9P6d+9AH//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Why Do Children Create Imaginary Friends?<small>왜 아이들은 상상 속의 친구를 만드는가?</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 어린 시절에 눈에 보이지 않는 친구와 대화를 나누거나 함께 놀았던 기억이 있나요? 심리학에서는 이를 상상 속의 친구(imaginary playmate)라고 부르는데, 이는 아이들이 인지적 발달 과정에서 겪는 매우 자연스러운 현상 중 하나예요. 이런 친구들은 아이가 겪는 외로움을 달래주기도 하고, 사회적 기술을 연습하는 연습 상대 역할을 해주기도 하죠. 마치 우리가 새로운 상황을 대비해 미리 시뮬레이션을 해보는 것처럼, 아이들은 가상의 친구와 상호작용하며 창의성과 공감 능력을 키워나가는 것입니다. 즉, 상상 속의 친구는 단순한 환상이 아니라 아이들의 건강한 성장을 돕는 마음의 동반자라고 할 수 있어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01연구 결과의 제시</div><ul><li>많은 상상력이 풍부한 아이들이 가상의 놀이 친구를 만들어낸다는 점을 연구를 통해 확인할 수 있다.</li><li>연구 결과가 명확히 보여주는 현상 (research makes it evident)</li><li>창의적인 아이들의 특징 (imaginative children)</li><li>핵심 키워드: 상상 속 친구 (imaginary playmates)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">research</td><td class=\"m\">연구</td></tr><tr><td class=\"w\">evident</td><td class=\"m\">분명한, 명백한</td></tr><tr><td class=\"w\">imaginative</td><td class=\"m\">상상력이 풍부한</td></tr><tr><td class=\"w\">invent</td><td class=\"m\">발명하다, 지어내다</td></tr><tr><td class=\"w\">imaginary</td><td class=\"m\">상상의, 가상의</td></tr><tr><td class=\"w\">playmate</td><td class=\"m\">놀이 친구</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 연구는</span><span class=\"en\"><b>Our research</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">명백하게 만든다</span><span class=\"en\"><b><span class=\"grammar-hl\">makes it evident</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 상상력이 풍부한 아이들이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> many <span class=\"grammar-hl\">imaginative</span> children</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 만들어 낸다는 것을</span><span class=\"en\"><b>often invent</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상상의 놀이 친구를</span><span class=\"en\"><b><span class=\"grammar-hl\">imaginary</span> playmates.</b></span></div></div><div class=\"lec-sent-ko\">우리의 연구는 상상력이 풍부한 많은 아이들이 종종 상상의 놀이 친구를 만들어 낸다는 것을 명백하게 만든다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로서, 연구 결과를 통해 아이들이 &#39;상상의 친구&#39;를 만드는 행동이 흔하다는 사실을 밝히고 있습니다. 여기서 evident는 사전적으로 &#39;분명한&#39;이라는 뜻인데, 여기서는 연구 데이터가 뒷받침되어 누구나 반박할 수 없을 만큼 확실한 사실임을 강조하기 위해 쓰였습니다. 또한 invent는 보통 &#39;발명하다&#39;로 해석되지만, 여기서는 아이들이 머릿속으로 없는 존재를 스스로 지어내어 관계를 맺는 창의적인 정신 활동을 의미합니다. 단순히 무언가를 뚝딱 만드는 것이 아니라, 아이들의 풍부한 상상력이 실체 없는 대상을 실존하는 것처럼 만들어낸다는 점을 강조하려고 이 단어를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes it evident that 5형식(SVOC) 구조 및 가주어-진주어: make + O(it) + C(evident) + 진목적어(that절) 구조입니다. 여기서 it은 가목적어이고, that절이 실제 목적어 역할을 하는 5형식 구조입니다.</div><div class=\"lec-gr-item\">that many imaginative children often invent imaginary playmates (진목적어): 앞의 5형식 구조에서 make의 목적어(it)가 가리키는 실제 내용으로, 명사절로서 목적어 역할을 합니다.</div><div class=\"lec-gr-item\">imaginative (현재분사(형용사)): 명사(children)의 속성을 설명하는 형용사적 성격의 단어입니다.</div><div class=\"lec-gr-item\">imaginary (현재분사(형용사)): 명사(playmates)를 수식하는 형용사적 성격의 단어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">research</td><td class=\"m\">연구</td></tr><tr><td class=\"w\">evident</td><td class=\"m\">분명한, 명백한</td></tr><tr><td class=\"w\">imaginative</td><td class=\"m\">상상력이 풍부한</td></tr><tr><td class=\"w\">invent</td><td class=\"m\">발명하다, 지어내다</td></tr><tr><td class=\"w\">imaginary</td><td class=\"m\">상상의, 가상의</td></tr><tr><td class=\"w\">playmate</td><td class=\"m\">놀이 친구</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>연구 결과, 상상력이 뛰어난 아이들은 흔히 상상의 친구를 만들어 낸다.</li><li>아이들은 이러한 상상 놀이를 통해 자신의 창의성과 정신적 세계를 확장한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Many children naturally invent imaginary playmates because they possess active imaginations.</div>\n              <div class=\"lec-final-sum-ko\">많은 아이들은 활발한 상상력을 가지고 있기 때문에 자연스럽게 상상 속의 놀이 친구를 만들어낸다.</div></div></div>"],"segs":[[{"audio":"./unit12-sentence04_강의_audio/1.mp3","hl":null}],[{"audio":"./unit12-sentence04_강의_audio/2.mp3","hl":null}],[{"audio":"./unit12-sentence04_강의_audio/3.mp3","hl":null},{"audio":"./unit12-sentence04_강의_audio/4.mp3","hl":"stage-0"}],[{"audio":"./unit12-sentence04_강의_audio/5.mp3","hl":null}],[{"audio":"./unit12-sentence04_강의_audio/6.mp3","hl":"main"},{"audio":"./unit12-sentence04_강의_audio/7.mp3","hl":"meaning"},{"audio":"./unit12-sentence04_강의_audio/8.mp3","hl":"grammar"}],[{"audio":"./unit12-sentence04_강의_audio/9.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){
