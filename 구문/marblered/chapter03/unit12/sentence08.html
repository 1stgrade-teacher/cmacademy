" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02정보 접근의 효율성</div><ul><li>책을 통해 5분 안에 찾을 수 있는 정보는 암기할 가치가 없다.</li><li>정보의 접근성(accessibility) 고려</li><li>책을 통한 즉각적인 확인(find in a book)</li><li>핵심 키워드: 효율성(efficiency)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03지적 자원의 활용</div><ul><li>단순 암기보다는 지식의 본질적인 사고에 집중하려는 태도를 보여준다.</li><li>불필요한 정보는 배제(exclude)</li><li>생각의 공간을 여유롭게 유지함</li><li>핵심 키워드: 사고 능력(thinking ability)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make it a rule to-v</td><td class=\"m\">~하는 것을 규칙으로 삼다</td></tr><tr><td class=\"w\">clutter</td><td class=\"m\">어지럽히다, 채우다</td></tr><tr><td class=\"w\">mind</td><td class=\"m\">마음, 정신</td></tr><tr><td class=\"w\">simple</td><td class=\"m\">간단한, 단순한</td></tr><tr><td class=\"w\">information</td><td class=\"m\">정보</td></tr><tr><td class=\"w\">find</td><td class=\"m\">찾다, 발견하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 규칙으로 삼는다</span><span class=\"en\"><b>I make it a rule</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어지럽히지 않는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">not to clutter</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 마음을</span><span class=\"en\"><b>my mind</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">간단한 정보로</span><span class=\"en\"><b>with simple information</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 찾을 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that I can find</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">책에서</span><span class=\"en\"><b>in a book</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">5분 이내에.</span><span class=\"en\"><b>in five minutes.</b></span></div></div><div class=\"lec-sent-ko\">나는 5분 이내에 내가 책에서 찾을 수 있는 간단한 정보로 내 마음을 어지럽히지 않는 것을 규칙으로 삼는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기에서 clutter는 사전적으로 &#39;어지럽히다, 잡동사니를 채워 넣다&#39;라는 뜻입니다. 문맥상으로는 뇌의 용량이 한정되어 있는데, 굳이 기억할 필요가 없는 정보를 담아 머릿속을 복잡하게 만드는 상황을 의미합니다. 필자는 뇌를 깔끔하게 유지하여 중요한 사고에 집중하기 위해 이 단어를 골랐습니다. 또한 make it a rule은 &#39;~을 습관/원칙으로 하다&#39;라는 관용구로, 자신의 철저한 정보 관리 태도를 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make it a rule to (관용표현): &#39;~하는 것을 규칙으로 하다&#39;라는 의미의 숙어입니다. 여기서는 &#39;make(5형식) + it(가목적어) + a rule(목적보어) + to부정사(진목적어)&#39; 구조로 쓰였습니다.</div><div class=\"lec-gr-item\">not to clutter (to부정사): 부정사 앞에 not을 써서 부정의 의미를 나타내며, 목적보어 자리에 위치하여 &#39;어지럽히지 않도록&#39;이라는 의미를 만듭니다.</div><div class=\"lec-gr-item\">that I can find (관계대명사): 앞에 있는 명사구 &#39;simple information&#39;을 수식하는 목적격 관계대명사절입니다. 뒤에 &#39;find&#39;의 목적어 자리가 비어 있는 불완전한 문장이 이어집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">clutter</td><td class=\"m\">어지럽히다, 채우다</td></tr><tr><td class=\"w\">mind</td><td class=\"m\">마음, 정신</td></tr><tr><td class=\"w\">simple</td><td class=\"m\">간단한, 단순한</td></tr><tr><td class=\"w\">information</td><td class=\"m\">정보</td></tr><tr><td class=\"w\">find</td><td class=\"m\">찾다, 발견하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>책을 통해 쉽게 확인할 수 있는 단순한 지식은 굳이 외우지 않는다.</li><li>뇌의 공간을 불필요한 정보로 채우지 않으려는 정보 관리 철학을 보여준다.</li><li>지식의 저장보다는 사고의 효율성을 중시하는 태도이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">We should avoid filling our minds with trivial facts that are readily available in books, so that we can focus our mental energy on more important tasks.</div>\n              <div class=\"lec-final-sum-ko\">책에서 쉽게 찾을 수 있는 사소한 정보로 마음을 채우지 않아야, 더 중요한 일에 정신적 에너지를 집중할 수 있다.</div></div></div>"],"segs":[[{"audio":"./unit12-sentence07_강의_audio/1.mp3","hl":null}],[{"audio":"./unit12-sentence07_강의_audio/2.mp3","hl":null}],[{"audio":"./unit12-sentence07_강의_audio/3.mp3","hl":null},{"audio":"./unit12-sentence07_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit12-sentence07_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./unit12-sentence07_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./unit12-sentence07_강의_audio/7.mp3","hl":null}],[{"audio":"./unit12-sentence07_강의_audio/8.mp3","hl":"main"},{"audio":"./unit12-sentence07_강의_audio/9.mp3","hl":"meaning"},{"audio":"./unit12-sentence07_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./unit12-sentence07_강의_audio/11.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoVi
