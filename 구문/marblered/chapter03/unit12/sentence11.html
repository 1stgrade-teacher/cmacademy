다. 그래서 오늘 읽을 지문에서는 우리가 인터넷을 통해 원하는 것만 즉시 얻게 된 환경이 우리에게 어떤 영향을 주는지 다루고 있으니, 평소 여러분의 스마트폰 사용 습관을 떠올리며 읽어보길 바랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01기술의 발전</div><ul><li>인터넷은 우리가 원하는 것을 즉각적으로 얻을 수 있게 만들었다.</li><li>정보와 콘텐츠에 접근하는 방식의 변화</li><li>과거와 비교할 수 없는 속도(speed)와 편리함</li><li>핵심 키워드: 인터넷(Internet), 즉각적인(mere seconds)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02취향의 선택</div><ul><li>우리는 자신의 기호에 맞는 대상을 쉽고 빠르게 선택할 수 있다.</li><li>개인의 선호도(like the most)에 따른 자유로운 청취</li><li>선택의 폭이 넓어지고 접근성이 좋아짐</li><li>핵심 키워드: 취향(like), 선택(hear)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">internet</td><td class=\"m\">인터넷</td></tr><tr><td class=\"w\">make</td><td class=\"m\">(상태를) ~하게 만들다</td></tr><tr><td class=\"w\">easy</td><td class=\"m\">쉬운, 용이한</td></tr><tr><td class=\"w\">whatever</td><td class=\"m\">무엇이든지</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mere</td><td class=\"m\">단지 ~에 불과한</td></tr><tr><td class=\"w\">second</td><td class=\"m\">초(시간 단위)</td></tr><tr><td class=\"w\">in mere seconds</td><td class=\"m\">불과 몇 초 만에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인터넷은</span><span class=\"en\"><b>The internet</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쉽게 만들어왔다</span><span class=\"en\"><b>has <span class=\"grammar-hl\">made it easy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가</span><span class=\"en\"><b><span class=\"grammar-hl\">for us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">듣는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to hear</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 가장 좋아하는 무엇이든</span><span class=\"en\"><b><span class=\"grammar-hl\">whatever we like</span> the most</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단 몇 초 안에</span><span class=\"en\"><b>in mere seconds.</b></span></div></div><div class=\"lec-sent-ko\">인터넷은 우리가 가장 좋아하는 무엇이든 단 몇 초 안에 쉽게 우리가 듣도록 만들어왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인터넷 덕분에 사람들이 원하는 음악이나 콘텐츠를 즉시 접할 수 있다는 상황을 설명합니다. 여기서 mere는 사전적으로 &#39;단지 ~에 불과한&#39;이라는 뜻이지만, 여기서는 시간이 아주 짧다는 것을 강조하여 &#39;불과 몇 초&#39;라는 느낌을 줍니다. 필자는 기술의 발전으로 정보 습득이 얼마나 빠르고 간편해졌는지를 극적으로 보여주기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made it easy for us to hear (5형식(SVOC)): 주어(The internet) + 동사(made) + 가목적어(it) + 목적보어(easy) + 의미상주어(for us) + 진목적어(to hear) 구조. 동사 make는 5형식으로 쓰일 때 목적어 자리에 가목적어 it을 두고 목적보어(형용사)를 먼저 쓴 뒤, 진목적어인 to부정사를 뒤로 배치하는 구조를 취한다.</div><div class=\"lec-gr-item\">to hear (to부정사): 진목적어 역할을 하며, 앞에 있는 의미상주어 for us가 이 동작의 주체임을 나타낸다.</div><div class=\"lec-gr-item\">whatever we like (관계대명사(복합관계대명사)): whatever는 &#39;any that&#39; 또는 &#39;anything that&#39;의 의미로, 여기서 &#39;anything that we like&#39;로 풀이되며 명사절을 이끈다. 뒤의 관계대명사절 &#39;we like&#39;에서 목적어 자리가 비어 있는 불완전한 문장 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">internet</td><td class=\"m\">인터넷</td></tr><tr><td class=\"w\">easy</td><td class=\"m\">쉬운, 용이한</td></tr><tr><td class=\"w\">whatever</td><td class=\"m\">무엇이든지</td></tr><tr><td class=\"w\">mere</td><td class=\"m\">단지 ~에 불과한</td></tr><tr><td class=\"w\">second</td><td class=\"m\">초(시간 단위)</td></tr><tr><td class=\"w\">in mere seconds</td><td class=\"m\">불과 몇 초 만에</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인터넷의 발달로 우리는 원하는 정보를 아주 짧은 시간 안에 즉시 찾아낼 수 있게 되었다.</li><li>기술적 편리함이 우리가 정보를 소비하는 방식을 완전히 바꾸어 놓았다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The internet enables users to access their favorite content instantly, and it provides an environment where personal preferences are easily satisfied.</div>\n              <div class=\"lec-final-sum-ko\">인터넷은 사용자가 가장 좋아하는 콘텐츠에 즉시 접근할 수 있게 해주며, 개인의 취향이 쉽게 충족되는 환경을 제공한다.</div></div></div>"],"segs":[[{"audio":"./unit12-sentence10_강의_audio/1.mp3","hl":null}],[{"audio":"./unit12-sentence10_강의_audio/2.mp3","hl":null}],[{"audio":"./unit12-sentence10_강의_audio/3.mp3","hl":null},{"audio":"./unit12-sentence10_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit12-sentence10_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit12-sentence10_강의_audio/6.mp3","hl":null}],[{"audio":"./unit12-sentence10_강의_audio/7.mp3","hl":"main"},{"audio":"./unit12-sentence10_강의_audio/8.mp3","hl":"meaning"},{"audio":"./unit12-sentence10_강의_audio/9.mp3","hl":"grammar"}],[{"audio":"./unit12-sentence10_강의_audio/10.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(M
