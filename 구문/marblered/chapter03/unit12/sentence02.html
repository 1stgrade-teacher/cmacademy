HPekZhk5YfN0HGP90Zwc8bfqByeTX9RKVuVpXdoe731Wtn1bbvp5Ntbfz1yvmabtbd6dLXa311u30du+n//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Artificial Intelligence: Machines Learning and Performing Like Humans<small>인공지능: 인간처럼 배우고 행동하는 기계</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">인공지능(Artificial Intelligence)은 컴퓨터가 사람처럼 스스로 학습하고 판단하게 만드는 기술을 말하는데요, 쉽게 비유하자면 우리가 책을 읽고 공부해서 지식을 쌓는 것처럼 기계도 수많은 데이터를 통해 스스로 규칙을 찾아내는 과정을 거친다고 이해하면 됩니다. 여기서 기계가 경험을 통해 배우는 방식을 기계 학습(Machine Learning)이라고 하며, 이는 인공지능이 복잡한 문제를 해결하는 가장 핵심적인 기반이 됩니다. 최근에는 딥러닝(Deep Learning)이라는 기술이 발전하면서 컴퓨터가 인간의 뇌 구조를 모방해 더 정교하고 인간과 유사한 작업을 수행할 수 있게 되었습니다. 이러한 기술 덕분에 인공지능은 단순히 반복적인 일을 처리하는 것을 넘어, 이제는 언어 번역이나 예술 창작처럼 고도의 지능이 필요한 영역까지 우리 삶 깊숙이 들어와 도움을 주고 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01인공지능의 정의와 가능성</div><ul><li>인공지능은 기계가 인간의 지적 능력을 모방할 수 있게 만드는 기술입니다.</li><li>기계가 경험을 통해 스스로 학습(learning from experience)함</li><li>인간의 업무(human tasks)를 기계가 대신 수행함</li><li>핵심 키워드: 인공지능(Artificial intelligence)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02핵심 작동 원리</div><ul><li>기계는 데이터를 통해 정보를 습득하고 처리하는 과정을 거칩니다.</li><li>이전의 경험(experience)을 데이터로 활용함</li><li>인간이 수행하던 복잡한 작업을 학습함</li><li>핵심 키워드: 기계(machines)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">artificial</td><td class=\"m\">인공적인</td></tr><tr><td class=\"w\">intelligence</td><td class=\"m\">지능</td></tr><tr><td class=\"w\">make</td><td class=\"m\">~을 ~하게 만들다(가목적어 구문 활용)</td></tr><tr><td class=\"w\">possible</td><td class=\"m\">가능한</td></tr><tr><td class=\"w\">machine</td><td class=\"m\">기계</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">learn</td><td class=\"m\">배우다, 학습하다</td></tr><tr><td class=\"w\">experience</td><td class=\"m\">경험</td></tr><tr><td class=\"w\">perform</td><td class=\"m\">수행하다</td></tr><tr><td class=\"w\">human</td><td class=\"m\">인간의</td></tr><tr><td class=\"w\">task</td><td class=\"m\">일, 과업</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 1</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인공지능은</span><span class=\"en\"><b>Artificial intelligence</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능하게 만든다</span><span class=\"en\"><b><span class=\"grammar-hl\">makes it possible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기계들이</span><span class=\"en\"><b><span class=\"grammar-hl\">for machines</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경험으로부터 배우는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to learn</span> from experience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 수행하는 것을</span><span class=\"en\"><b>and perform</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간의 과제를</span><span class=\"en\"><b>human tasks.</b></span></div></div><div class=\"lec-sent-ko\">인공지능은 기계들이 경험으로부터 배우는 것을 그리고 인간의 과제를 수행하는 것을 가능하게 만든다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인공지능이라는 기술이 과거에는 인간만이 할 수 있었던 일들을 어떻게 처리하게 되었는지 그 근본적인 이유를 설명합니다. 여기서 possible은 사전적으로는 &#39;가능한&#39;이라는 뜻이지만, 이 문맥에서는 기계가 인간의 영역에 진입하게 된 &#39;상태적 변화&#39;를 의미합니다. 필자가 이 단어를 쓴 이유는 인공지능 도입 전과 후의 명확한 차이(불가능에서 가능으로의 전환)를 강조하기 위해서입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes it possible for machines to learn 5형식(SVOC) 구조: &#39;make + O + C&#39; 형태에서 목적어 자리에 가목적어 it을 쓰고 진목적어로 to부정사 구문(for machines to learn...)을 배치한 구조입니다. 5형식 문장에서 목적어가 길어질 때 사용하는 일반적인 패턴입니다.</div><div class=\"lec-gr-item\">to learn (to부정사): 진목적어 역할을 하며, 앞에 있는 의미상 주어(for machines)와 결합하여 &#39;기계들이 학습하는 것&#39;이라는 동작의 주체와 행위를 명확히 합니다.</div><div class=\"lec-gr-item\">for machines to learn to부정사의 의미상 주어: to부정사(to learn)의 주체를 명시하기 위해 &#39;for + 목적격(machines)&#39; 구조를 사용했습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">artificial</td><td class=\"m\">인공적인</td></tr><tr><td class=\"w\">intelligence</td><td class=\"m\">지능</td></tr><tr><td class=\"w\">make</td><td class=\"m\">~을 ~하게 만들다(가목적어 구문 활용)</td></tr><tr><td class=\"w\">possible</td><td class=\"m\">가능한</td></tr><tr><td class=\"w\">machine</td><td class=\"m\">기계</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">learn</td><td class=\"m\">배우다, 학습하다</td></tr><tr><td class=\"w\">experience</td><td class=\"m\">경험</td></tr><tr><td class=\"w\">perform</td><td class=\"m\">수행하다</td></tr><tr><td class=\"w\">human</td><td class=\"m\">인간의</td></tr><tr><td class=\"w\">task</td><td class=\"m\">일, 과업</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인공지능은 기계가 경험을 통해 스스로 학습할 수 있게 한다.</li><li>이를 통해 기계는 과거 인간만이 할 수 있었던 복잡한 업무를 수행할 수 있게 되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Artificial intelligence allows machines to learn from data, and it enables them to carry out various human tasks.</div>\n              <div class=\"lec-final-sum-ko\">인공지능은 기계가 데이터를 통해 학습하게 해주며, 이를 통해 기계가 다양한 인간의 업무를 수행할 수 있게 한다.</div></div></div>"],"segs":[[{"audio":"./unit12-sentence01_강의_audio/1.mp3","hl":null}],[{"audio":"./unit12-sentence01_강의_audio/2.mp3","hl":null}],[{"audio":"./unit12-sentence01_강의_audio/3.mp3","hl":null},{"audio":"./unit12-sentence01_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./unit12-sentence01_강의_audio/5.mp3","hl":"stage-1"}],[{"audio":"./unit12-sentence01_강의_audio/6.mp3","hl":null}],[{"audio":"./u
