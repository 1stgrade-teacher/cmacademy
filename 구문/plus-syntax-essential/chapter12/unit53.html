</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){

  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700)+(s.pause||0)/rate,t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function reveal(){var ss=segs();for(var x=0;x<=j&&x<ss.length;x++){if(ss[x].rv){var e=sl.querySelectorAll('[data-rv="'+ss[x].rv+'"]');for(var y=0;y<e.length;y++)e[y].classList.add("lp-on");}}}

  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);reveal();if(!playing)return;

  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"lc":["\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 밑줄 친 말 알아보기\u003c/span>\u003cdiv class=\"g-q\">밑줄 친 'to cook together'의 역할(쓰임)은?\u003c/div>\u003cdiv class=\"g-qs\">It is fun to cook together.\u003c/div>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>진주어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>가주어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>주격보어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>목적어\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">진주어\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">문장 맨 앞의 It은 가주어이고, 문장 끝의 to부정사구는 진짜 주어인 진주어입니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 밑줄 친 말 알아보기\u003c/span>\u003cdiv class=\"g-q\">밑줄 친 'that he is honest'의 역할(쓰임)은?\u003c/div>\u003cdiv class=\"g-qs\">It is clear that he is honest.\u003c/div>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>진주어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>가주어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>명사절 목적어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>동격\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">진주어\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">It은 가주어이며, that절은 문장의 실제 주어 역할을 하는 진주어절입니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 밑줄 친 말 알아보기\u003c/span>\u003cdiv class=\"g-q\">밑줄 친 'Sumin'의 역할(쓰임)은?\u003c/div>\u003cdiv class=\"g-qs\">It was Sumin that broke the record.\u003c/div>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>강조된 주어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>가주어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>진주어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>목적어\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">강조된 주어\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">It is ... that 강조 구문으로 주어 Sumin을 강조하고 있습니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 밑줄 친 말 알아보기\u003c/span>\u003cdiv class=\"g-q\">밑줄 친 'it'의 역할(쓰임)은?\u003c/div>\u003cdiv class=\"g-qs\">I found it hard to wake up early.\u003c/div>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>가목적어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>가주어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>비인칭주어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>지시대명사\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">가목적어\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">동사 find 뒤에서 목적어 자리를 채우고 진짜 목적어인 to wake up early를 뒤로 보낸 가목적어입니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 문장 형식 고르기\u003c/span>\u003cdiv class=\"g-q\">이 문장의 형식은?\u003c/div>\u003cdiv class=\"g-qs\">I found it hard to wake up early.\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>SVO\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>SVC\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>SVOC\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>SVOO\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">SVOC\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">주어(I) + 동사(found) + 가목적어(it) + 목적격보어(hard) + 진목적어(to wake up early) 구조의 5형식 문장입니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 어법 O/X 고치기\u003c/span>\u003cdiv class=\"g-q\">밑줄 친 'break'은(는) 어법상 맞나요?\u003c/div>\u003cdiv class=\"g-qs\">It was Sumin who break the record.\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>O\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>X\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">X\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">과거 시제의 문장이므로 강조되는 주어에 맞는 과거동사 broke를 써야 합니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 어법 O/X 고치기\u003c/span>\u003cdiv class=\"g-q\">밑줄 친 'importantly'은(는) 어법상 맞나요?\u003c/div>\u003cdiv class=\"g-qs\">She thinks it importantly that everyone gets a chance.\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>O\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>X\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">X\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">목적격보어 자리이므로 부사가 아니라 형용사 important가 와야 합니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 객관식\u003c/span>\u003cdiv class=\"g-q\">다음 중 밑줄 친 it의 쓰임이 나머지와 다른 하나는?\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>It is fun to play soccer.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>It is clear that she is right.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>It is raining heavily outside.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>It is true that honesty is the best policy.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>It is important to study hard.\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">It is raining heavily outside.\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">3번의 it은 날씨를 나타내는 비인칭주어이고, 나머지는 모두 가주어입니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 배열\u003c/span>\u003cdiv class=\"g-q\">알맞은 순서로 배열하여 문장을 완성하세요. (우리가 함께 영어 공부를 하는 것은 흥미롭다.)\u003c/div>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">It is interesting to study English together.\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">가주어 It을 문두에 쓰고 비동사와 보어, 진주어인 to부정사구를 순서대로 배열합니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 문장 전환 · 배열\u003c/span>\u003cdiv class=\"g-q\">가주어 It을 사용하여 문장을 다시 쓰세요. 바꾼 문장을 배열하여 완성하세요.\u003c/div>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">It is hard for me to wake up early.\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">긴 주어구 대신 It을 주어 자리에 두고 원래 주어를 문장 끝으로 보냅니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan cla
