 class=\"g-qs\">Students must not using phones.\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>O\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>X\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">X\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">조동사 must 뒤에는 동사원형이 와야 하므로 using은 틀렸다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 객관식\u003c/span>\u003cdiv class=\"g-q\">다음 중 밑줄 친 조동사의 쓰임이 나머지와 다른 것은?\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>You must wear a helmet.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>She must be tired.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>You should drink more water.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>We have to return these books.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>We ought to protect wild animals.\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">She must be tired.\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">나머지는 모두 의무나 당위(~해야 한다)를 나타내지만, 2번은 강한 추측(~임에 틀림없다)을 나타낸다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 배열\u003c/span>\u003cdiv class=\"g-q\">알맞은 순서로 배열하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">You should drink more water.\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">주어(You) + 조동사(should) + 동사원형(drink) + 목적어(more water) 순서로 배열한다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 배열\u003c/span>\u003cdiv class=\"g-q\">알맞은 순서로 배열하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">You don't have to bring your own lunch tomorrow.\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">주어(You) + don't have to + 동사원형(bring) + 목적어(your own lunch) + 부사(tomorrow) 순서이다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 문장 전환 · 배열\u003c/span>\u003cdiv class=\"g-q\">must를 같은 의미의 have to로 바꾸기 바
