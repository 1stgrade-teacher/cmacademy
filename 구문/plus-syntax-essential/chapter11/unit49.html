은 말을 고르세요. (빈칸에 알맞은 말을 고르세요.)\u003c/div>\u003cdiv class=\"g-qs\">Writing a good summary can be as ____ as writing a new story.\u003c/div>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>difficult\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>more difficult\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">difficult\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">as 원급 as 구문이므로 원급인 difficult가 정답입니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 어법 O/X 고치기\u003c/span>\u003cdiv class=\"g-q\">밑줄 친 'than'은(는) 어법상 맞나요?\u003c/div>\u003cdiv class=\"g-qs\">Today is not as hot than yesterday.\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>O\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>X\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">X\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">as ~ as 원급 비교 구문이므로 비교 대상 앞에는 than이 아니라 as를 써야 합니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 어법 O/X 고치기\u003c/span>\u003cdiv class=\"g-q\">밑줄 친 'more fresh'은(는) 어법상 맞나요?\u003c/div>\u003cdiv class=\"g-qs\">The air in the countryside feels a bit more fresh than that in the city center.\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>O\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>X\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">X\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">음절이 짧은 형용사 fresh는 -er을 붙여 fresher로 써야 합니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 객관식\u003c/span>\u003cdiv class=\"g-q\">다음 중 밑줄 친 표현의 쓰임이 나머지와 다른 것은?\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>This bag is lighter than mine.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Today is not as hot as yesterday.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>She runs faster than her brother.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>The air feels a bit fresher than the city.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>⑤\u003c/b>I want to eat apples than bananas.\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">I want to eat apples than bananas.\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">1~4번은 비교급 구문(A보다 B하다)이지만 5번 문장은 문법적으로 성립하지 않는 잘못된 표현입니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 배열\u003c/span>\u003cdiv class=\"g-q\">알맞은 순서로 배열하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">This bag is lighter than mine.\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">주어(This bag) + 동사(is) + 비교급(lighter) + 비교 대상(than mine)의 순서입니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 문장 전환 · 배열\u003c/span>\u003cdiv class=\"g-q\">as ~ as 원급 비교 구문으로 바꾸기 바꾼 문장을 배열하여 완성하세요.\u003c/div>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">A lion does not run as fast as a cheetah.\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">비교급 문장을 반대 의미의 원급 대조 구문으로 전환합니다.\u003c/div>\u003c/div>"],"brand":"Syntax","title":"플러스구문(Essential) UNIT 49","audioDir":"unit49_audio","preview":false,"count":199,"slides":[{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-badge an-pop\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">UNIT\u003cbr>49\u003c/span>\u003c/div>\u003cdiv class=\"k-big\">\u003cspan class=\"an-bnc\">⚖️\u003c/span>\u003c/div>\u003ch1 class=\"gk-h1 an\" style=\"--d:0.30s\">비교하기 대장 되기\u003c/h1>\u003cdiv class=\"g-en2 an\" style=\"--d:0.60s\">A + be + as ~ as B / A + be + 비교급 + than + B\u003c/div>\u003cdiv class=\"k-src\">플러스구문(Essential)\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분 오늘부터 우리는 두 대상을 서로 비교해서 말하는 방법을 배워볼게요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag an-pop\">도입\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"g-scene\" data-hl=\"hs\">\u003cspan class=\"an-pop\" style=\"display:inline-block;--d:0.00s\"
