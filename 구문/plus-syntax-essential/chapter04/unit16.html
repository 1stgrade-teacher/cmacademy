,"hl":"hq","rv":"hq"}]},{"html":"\u003cspan class=\"lp-tag an-pop\">핵심 개념\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt an\">\u003cspan class=\"an-wig\">💡\u003c/span>수동태의 다양한 시제와 조동사 수동태\u003c/div>\u003cdiv class=\"k-ez an\" style=\"--d:0.40s\" data-hl=\"ie\">수동태의 기본은 \u003cb class=\"key\">be동사 \u003c/b>\u003cb class=\"key\">+ \u003c/b>\u003cb class=\"key\">p.p.\u003c/b>이지만, 진행이나 완료, 조동사가 더해질 때는 그 공식이 중간에 쏙 들어간다는 점을 기억하면 됩니다.\u003c/div>\u003cdiv class=\"g-ana gx\" data-rv=\"ia\" data-hl=\"ia\">\u003cspan class=\"e an-bnc\">🧱\u003c/span>\u003cdiv>레고 블록 조립처럼 기본 수동태 뼈대에 시제나 조동사라는 특별한 블록을 앞에 하나 더 끼워 맞추는 것과 같습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":6,"text":"수동태의 기본은 be동사와 p.p.의 만남입니다. 하지만 여기에 진행의 의미나 완료의 의미, 혹은 조동사의 힘을 빌리고 싶을 때는 그 사이에 적절한 조각들을 끼워 넣는다는 점만 기억하면 됩니다.","hl":"ie"},{"n":7,"text":"레고 블록 조립처럼 기본 수동태 뼈대에 시제나 조동사라는 특별한 블록을 앞에 하나 더 끼워 맞추는 것과 같습니다.","hl":"ia","rv":"ia"}]},{"html":"\u003cspan class=\"lp-tag an-pop\">구문 포인트 1\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt an\">\u003cspan class=\"an-bnc\">⏳\u003c/span>진행·완료형 수동태 알아보기\u003c/div>\u003cdiv class=\"g-vis\" data-hl=\"gv0\">\u003cdiv class=\"g-tf\">\u003cdiv class=\"g-tfs\" data-hl=\"gv0f0\">\u003cspan class=\"g-tfl\">① 현재진행 능동\u003c/span>\u003cspan class=\"en g-tfe\">They are painting the wall.\u003c/span>\u003csmall>그들이 벽에 페인트를 칠하는 중이다\u003c/small>\u003c/div>\u003cdiv class=\"g-tfa gx\" data-rv=\"v0f1\">⬇\u003c/div>\u003cdiv class=\"g-tfs gx\" data-rv=\"v0f1\" data-hl=\"gv0f1\">\u003cspan class=\"g-tfl\">② 현재진행 수동\u003c/span>\u003cspan class=\"en g-tfe\">The wall \u003cb class=\"g-df\">is\u003c/b> \u003cb class=\"g-df\">being\u003c/b> \u003cb class=\"g-df\">painted.\u003c/b>\u003c/span>\u003csmall>be + being + p.p. 형태로 바뀜\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez gx\" data-rv=\"ve0\" data-hl=\"ve0\">진행형 수동태는 \u003cb class=\"key\">being \u003c/b>\u003cb class=\"key\">+ \u003c/b>\u003cb class=\"key\">p.p.\u003c/b>, 완료형 수동태는 \u003cb class=\"key\">
