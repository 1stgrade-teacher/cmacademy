</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"구문사고력 v-ing v-ed review reading01","audioDir":"01_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.468em\">v-ing/v-ed\u003cbr>review\u003cbr>reading01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Green Funerals: Going Green Beyond Life\u003c/h1>\u003ch2>녹색 장례식, 삶을 넘어 죽음까지 친환경으로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>영국에서는 세상을 떠날 때도 환경 친화적이려는 \u003cb class=\"key\">녹색 \u003c/b>\u003cb class=\"key\">장례식\u003c/b>이 매우 인기를 얻고 있으며, 판지 관과 천연 섬유 수의, 자연 환경 속 매장지 같은 아이디어가 선호되고 있다. 생각만큼 값이 싸지는 않지만, 환경론자들은 환경을 위해 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">역할을 \u003c/b>\u003cb class=\"key\">하는 \u003c/b>\u003cb class=\"key\">것\u003c/b>은 값으로 따질 일이 아니라고 말한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Eco-friendly funerals are gaining popularity in England, and environmentalists say doing their part for the environment does not come with a price tag.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 영국의 녹색 장례식, green funeral에 대한 글이에요. 요즘은 사는 동안만이 아니라 세상을 떠날 때도 환경을 생각하는 사람들이 늘고 있다는 내용이죠. 간단히 말하면 환경 친화적 장례식이 인기를 얻고 있지만 생각만큼 싸지는 않고, 그래도 환경론자들은 그 가치를 값으로 따질 수 없다고 말한다는 거예요. 자, 그럼 문장 하나하나 따라가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">장례식(funeral)은 전통적으로 나무 관을 쓰고 화장이나 매장으로 치러 왔어요. 그런데 최근에는 \u003cb class=\"key\">탄소 \u003c/b>\u003cb class=\"key\">배출\u003c/b>(carbon footprint)을 줄이려는 움직임이 장례 문화까지 번지고 있죠. 판지(cardboard)나 천연 섬유(natural fiber)처럼 빨리 분해되는 소재를 쓰고, \u003cb class=\"key\">자연장\u003c/b>(natural burial)을 선택하는 방식이 대표적이에요. 이런 장례를 친환경이라는 뜻에서 녹색 장례식(green funeral)이라고 불러요. 마치 텀블러를 들고 다니며 일회용 컵을 줄이는 것처럼, 마지막 순간까지 환경을 생각하는 셈이에요. 다만 친환경 소재는 \u003cb class=\"key\">생산 \u003c/b>\u003cb class=\"key\">단가\u003c/b>가 높아 가격이 만만치 않을 수 있다는 점도 함께 알아 두세요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 장례식, funeral은 전통적으로 나무 관을 쓰고 화장이나 매장으로 치러 왔어요. 그런데 최근에는 탄소 배출, 즉 carbon footprint를 줄이려는 움직임이 장례 문화까지 번지고 있죠. 판지나 천연 섬유처럼 빨리 분해되는 소재를 쓰고 자연장, 다시 말해 natural burial을 선택하는 방식이 대표적이에요. 이런 장례를 친환경이라는 뜻에서 녹색 장례식, green funeral이라고 불러요. 텀블러를 들고 다니며 일회용 컵을 줄이는 것처럼, 마지막 순간까지 환경을 생각하는 셈이에요. 다만 친환경 소재는 생산 단가가 높아서 가격이 만만치 않을 수 있다는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>화제의 확장\u003csmall>도입·전환 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 '믿기 어렵지만'이라는 표현으로 시작해 독자의 시선을 끌어요. 어떤 사람들은 환경을 생각하는 \u003cb class=\"key\">친환경적 \u003c/b>\u003cb class=\"key\">삶\u003c/b>을 사는 것만으로는 더 이상 충분치 않다고 느낀다는 거죠. 그래서 영국에서는 세상을 떠나는 \u003cb class=\"key\">죽음\u003c/b>의 순간까지 환경 친화적이 되려고 노력한대요. 삶의 영역이 마지막 순간으로 확장되는 단계예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>구체적 사례\u003csmall>예시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>'녹색 장례식'으로 알려진 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">친화적 \u003c/b>\u003cb class=\"key\">장례식\u003c/b>이 매우 인기를 얻고 있다고 해요. 이어서 판지로 만든 관, 천연 섬유로 짠 수의, 자연 환경 속 \u003cb class=\"key\">매장지\u003c/b> 같은 구체적인 아이디어가 소개돼요. 이런 방식이 영국의 환경론자들에게 선호된다는 점에서, 앞의 내용이 실제 \u003cb class=\"key\">사례\u003c/b>로 뒷받침되는 단계예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>예상 밖 반전\u003csmall>반전 · 문장 5\u003c/small>\u003c/h4>\u003cp>그런데 여기서 예상과 다른 사실이 나와요. 이런 장례식이 생각만큼 \u003cb class=\"key\">값이 \u003c/b>\u003cb class=\"key\">싸지\u003c/b> 않다는 거죠. 친환경 소재와 과정에 드는 \u003cb class=\"key\">비용\u003c/b> 때문에 독자가 품고 있던 통념이 한 번 흔들리는 단계예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>필자의 주장\u003csmall>주장·결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>하지만 환경론자들은 환경을 위해 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">역할을 \u003c/b>\u003cb class=\"key\">하는 \u003c/b>\u003cb class=\"key\">것\u003c/b>은 값으로 따질 일이 아니라고 말해요. 다시 말해 돈이 더 들더라도 그 가치는 \u003cb class=\"key\">가격표\u003c/b>로 매길 수 없다는 주장이에요. 이 문장이 글 전체의 \u003cb class=\"key\">주제문\u003c/b> 역할을 하면서 글을 닫는 단계예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 삶에서 죽음으로 화제를 넓힌 뒤, 구체적인 사례를 보여 주고, 마지막에 필자의 주장으로 마무리하는 흐름이에요.","hl":null},{"n":4,"text":"글은 믿기 어렵다는 표현으로 시작해서 독자의 시선을 끌어요. 어떤 사람들은 환경을 생각하는 친환경적 삶을 사는 것만으로는 더 이상 충분치 않다고 느낀다는 거죠. 그래서 영국에서는 세상을 떠나는 죽음의 순간까지 환경 친화적이 되려고 노력한대요. 삶의 영역이 마지막 순간으로 확장되는 단계예요.","hl":"f0"},{"n":5,"text":"녹색 장례식으로 알려진 환경 친화적 장례식이 매우 인기를 얻고 있다고 해요. 이어서 판지로 만든 관, 천연 섬유로 짠 수의, 자연 환경 속 매장지 같은 구체적인 아이디어가 소개돼요. 이런 방식이 영국의 환경론자들에게 선호된다는 점에서, 앞의 내용이 실제 사례로 뒷받침되는 단계예요.","hl":"f1"},{"n":6,"text":"그런데 여기서 예상과 다른 사실이 나와요. 이런 장례식이 생각만큼 값이 싸지 않다는 거죠. 친환경 소재와 과정에 드는 비용 때문에 독자가 품고 있던 통념이 한 번 흔들리는 단계예요.","hl":"f2"},{"n":7,"text":"하지만 환경론자들은 환경을 위해 자기 역할을 하는 것은 값으로 따질 일이 아니라고 말해요. 다시 말해 돈이 더 들더라도 그 가치는 가격표로 매길 수 없다는 주장이에요. 이 문장이 글 전체의 주제문 역할을 하면서 글을 닫는 단계예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 첫 문장에서 'Although'로 양보하며 화제를 열고, 이어서 영국의 \u003cb class=\"key\">녹색 \u003c/b>\u003cb class=\"key\">장례식\u003c/b>이라는 구체적 사례를 제시해요. 다섯 번째 문장에서 'not as cheap as'로 통념을 흔들어 \u003cb class=\"key\">반전\u003c/b>을 만들고, 마지막 문장에서 환경론자들의 말을 빌려 글의 주제를 밝혀요. 핵심 주장이 맨 끝에 오는 \u003cb class=\"key\">미괄식\u003c/b> 구조라서 마지막 문장에 주목해야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Although (1)\u003c/b>\u003cspan>양보·도입\u003c/span>\u003cb>Known as (3)\u003c/b>\u003cspan>명명·재진술\u003c/span>\u003cb>not as cheap as (5)\u003c/b>\u003cspan>예상 반전\u003c/span>\u003cb>But (6)\u003c/b>\u003cspan>전환·주장 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a greener life\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">environmentally friendly\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">green funerals\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">eco-friendly funerals\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">doing their part for the environment\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 예시를 활용한 미괄식 구조예요. 처음에는 삶에서 환경을 생각하는 이야기로 시작하지만, 핵심 주장은 마지막 문장에서 나와요. 중간에 제시된 영국의 녹색 장례식은 모두 이 주장을 뒷받침하는 사례인 셈이죠. 그래서 글을 읽을 때 마지막 문장에 가장 주목해야 해요.","hl":"ty"},{"n":9,"text":"신호어를 보면 첫 번째 문장의 Although가 양보하면서 화제를 열고, 다섯 번째 문장의 not as cheap as가 예상을 뒤집는 반전을 만들어요. 마지막 문장의 But 뒤에서 필자의 주장이 나온다는 점도 놓치면 안 되죠. 그리고 environmentally friendly가 eco-friendly와 green으로, 다시 doing their part for the environment로 바뀌는 재진술의 흐름도 함께 봐 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>although\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~일지라도\u003c/span>\u003c/div>\u003cdiv>\u003cb>hard to believe\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>믿기 어려운\u003c/span>\u003c/div>\u003cdiv>\u003cb>no longer\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 이상 ~않은\u003c/span>\u003c/div>\u003cdiv>\u003cb>enough\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>충분한\u003c/span>\u003c/div>\u003cdiv>\u003cb>green\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>환경 친화적인, 녹색의\u003c/span>\u003c/div>\u003cdiv>\u003cb>live a life\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>삶을 살다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environmentally friendly\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>환경 친화적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>try to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하려고 노력하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave the Earth\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>세상을 떠나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be known as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 알려져 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>funeral\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장례식\u003c/span>\u003c/div>\u003cdiv>\u003cb>eco-friendly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>환경 친화적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인기 있는, 대중적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>cardboard\u003c/b>\u003cem>명사\u003c/em>\u003cspan>판지, 두꺼운 종이\u003c/span>\u003c/div>\u003cdiv>\u003cb>coffin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관\u003c/span>\u003c/div>\u003cdiv>\u003cb>sew\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(바느질로) 짓다, 꿰매다\u003c/span>\u003c/div>\u003cdiv>\u003cb>natural fiber\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>천연 섬유\u003c/span>\u003c/div>\u003cdiv>\u003cb>burial place\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>매장지\u003c/span>\u003c/div>\u003cdiv>\u003cb>setting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경, 배경\u003c/span>\u003c/div>\u003cdiv>\u003cb>favor\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선호하다, 지지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environmentalist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경론자, 환경 운동가\u003c/span>\u003c/div>\u003cdiv>\u003cb>cheap\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>값싼, 저렴한\u003c/span>\u003c/div>\u003cdiv>\u003cb>might\u003c/b>\u003cem>조동사\u003c/em>\u003cspan>~일지도 모르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>do one's part\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>자기 역할을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>come with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 수반하다, ~이 따르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>price tag\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가격표, 값\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚어 볼게요. environmentally friendly는 환경 친화적인이라는 뜻이고, eco-friendly도 같은 의미로 바뀌어 쓰여요. burial은 매장이라는 뜻이고, do one's part는 자기 역할을 하다, come with a price tag는 가격표가 붙어 있다, 즉 값을 치러야 한다는 표현이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">enough\u003c/b>\u003cspan class=\"m\">충분한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sufficient\u003c/span>\u003cspan class=\"s\">adequate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insufficient\u003c/span>\u003cspan class=\"a\">lacking\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">popular\u003c/b>\u003cspan class=\"m\">인기 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-liked\u003c/span>\u003cspan class=\"s\">favored\u003c/span>\u003cspan class=\"s\">widespread\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpopular\u003c/span>\u003cspan class=\"a\">rare\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">favor\u003c/b>\u003cspan class=\"m\">선호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prefer\u003c/span>\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"s\">advocate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">oppose\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cheap\u003c/b>\u003cspan class=\"m\">값싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inexpensive\u003c/span>\u003cspan class=\"s\">affordable\u003c/span>\u003cspan class=\"s\">low-cost\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expensive\u003c/span>\u003cspan class=\"a\">costly\u003c/span>\u003cspan class=\"a\">pricey\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">natural\u003c/b>\u003cspan class=\"m\">천연의, 자연의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">organic\u003c/span>\u003cspan class=\"s\">pure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">artificial\u003c/span>\u003cspan class=\"a\">synthetic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">believe\u003c/b>\u003cspan class=\"m\">믿다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accept\u003c/span>\u003cspan class=\"s\">trust\u003c/span>\u003cspan class=\"s\">credit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003cspan class=\"a\">distrust\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘도 정리해 볼게요. enough는 sufficient, adequate와 비슷하고 반대말은 insufficient예요. popular는 well-liked, widespread와 가깝고 반대는 unpopular죠. favor는 prefer, support로 바꿔 쓸 수 있고 반대말은 oppose예요. cheap은 inexpensive, affordable과 같고 반대는 expensive, costly예요. natural은 organic과 가깝고 반대는 artificial, synthetic이고, believe는 accept, trust로 바꿀 수 있으며 반대는 doubt예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 믿기 어려울지라도,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although \u003c/span>\u003cspan class=\"tgt\">hard \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">believe\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람들은 느낀다\u003c/span>\u003cspan class=\"en\">some people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 더 이상 충분하지 않다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">longer \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 환경 친화적인 삶을 사는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">live \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">greener \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">믿기가 어려울 수 있겠지만 어떤 사람들에게는 환경 보존을 하는 삶을 사는 것만으로는 더 이상 충분치 않다(죽을 때도 환경을 생각한다).\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 화제를 던지는 도입문이에요. 보통 사람은 살아 있는 동안만 환경을 생각하면 된다고 여기지만, 어떤 사람들은 \u003cb class=\"key\">죽을 \u003c/b>\u003cb class=\"key\">때\u003c/b>까지 환경을 생각해야 한다고 느낀다는 뜻이죠. greener life는 '더 푸른 삶'이 아니라 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">친화적\u003c/b>인 삶, 즉 환경 보존을 실천하는 삶을 가리키는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사절의 주어·be동사 생략\u003c/span> : Although + [(it is) + hard to believe] : \"비록 (그것이) 믿기 어려울지라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략 (feel + that절)\u003c/span> : feel + [(that) + 주어 + 동사] : \"~라고 느끼다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">가주어 it / 진주어 to부정사\u003c/span> : It is + [형용사 enough] + [to live ~ (진주어)] : \"더 환경 친화적인 삶을 사는 것은 더 이상 충분하지 않다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Although hard to believe, 비록 믿기 어려울지라도. some people feel, 어떤 사람들은 느낀다. it's no longer enough, 그것은 더 이상 충분하지 않다고. to live a greener life, 더 환경 친화적인 삶을 사는 것이. 이 문장 전체를 해석하면, 믿기가 어려울 수 있겠지만 어떤 사람들에게는 환경 보존을 하는 삶을 사는 것만으로는 더 이상 충분치 않다(죽을 때도 환경을 생각한다).","hl":"m"},{"n":13,"text":"이 문장은 글의 화제를 던지는 도입문이에요. 보통 사람들은 살아 있는 동안만 환경을 생각하면 된다고 여기지만, 어떤 사람들은 죽을 때까지 환경을 생각해야 한다고 느낀다는 뜻이죠. greener life는 단순히 더 푸른 삶이 아니라 환경 친화적인 삶을 뜻하는 표현이에요.","hl":"mn"},{"n":14,"text":"첫 번째 어법은 Although hard to believe인데요, 이건 Although it is hard to believe에서 주어와 be동사가 빠진 부사절의 생략이에요. 두 번째는 feel이 that절을 목적어로 데리고 오면서 접속사 that이 생략된 구조라는 점이죠. 세 번째는 it이 가주어이고 to live a greener life가 진주어라는 점이에요. 주어가 너무 길어서 가주어로 자리를 잡아 주고 진주어를 뒤로 보낸 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영국에서는,\u003c/span>\u003cspan class=\"en\">In England,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이 노력하고 있다\u003c/span>\u003cspan class=\"en\">many people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">trying \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경 친화적이 되려고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">environmentally \u003c/span>\u003cspan class=\"tgt\">friendly\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 세상을 떠날 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">leave \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Earth\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">영국에서는 많은 사람들이 세상을 떠날 때 환경 친화적이 되려고 노력하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 삶뿐 아니라 세상을 떠나는 순간에도 환경을 생각하려는 영국 사람들의 움직임을 소개하는 문장이에요. leave the Earth는 '지구를 떠나다'라는 \u003cb class=\"key\">완곡한 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로 \u003cb class=\"key\">죽음\u003c/b>을 돌려 말한 것이고, 이 문장이 뒤에 나올 녹색 장례식 이야기의 배경을 깔아 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">try + to부정사 (목적의 to부정사)\u003c/span> : try + [to be ~ (to부정사/목적어)] : \"환경 친화적이 되려고 노력하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 부사절의 현재시제\u003c/span> : when + [주어 + 현재동사] : \"그들이 세상을 떠날 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">타동사 leave + 목적어\u003c/span> : leave + [the Earth (목적어)] : \"세상을 떠나다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"In England, 영국에서는. many people are trying, 많은 사람들이 노력하고 있다. to be environmentally friendly, 환경 친화적이 되려고. when they leave the Earth, 그들이 세상을 떠날 때. 이 문장 전체를 해석하면, 영국에서는 많은 사람들이 세상을 떠날 때 환경 친화적이 되려고 노력하고 있다.","hl":"m"},{"n":16,"text":"두 번째 문장은 영국 사람들이 삶뿐 아니라 세상을 떠나는 순간에도 환경을 생각하려 한다는 내용이에요. leave the Earth는 지구를 떠나다, 즉 죽음을 돌려 말한 완곡한 표현이고, 이 문장이 뒤에 나올 녹색 장례식 이야기의 배경을 깔아 주는 거죠.","hl":"mn"},{"n":17,"text":"먼저 try 뒤에 to부정사가 온 try to부정사를 보세요. '~하려고 노력하다'라는 뜻이고, try 뒤에 동명사가 오면 '시험 삼아 해 보다'로 뜻이 달라지니 조심해야 해요. 다음으로 when이 이끄는 시간 부사절에서는 미래의 일이라도 현재시제를 쓴다는 점이에요. 그래서 will leave가 아니라 leave인 거죠. 마지막으로 leave가 '~을 떠나다'라는 뜻의 타동사라서 the Earth가 전치사 없이 바로 목적어로 온다는 점도 꼭 챙기세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">녹색 장례식으로 알려진,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Known \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">green \u003c/span>\u003cspan class=\"tgt\">funerals\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경 친화적 장례식은\u003c/span>\u003cspan class=\"en\">eco-friendly funerals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 인기를 얻고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">becoming \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">popular\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">녹색 장례식으로 알려진 환경 친화적 장례식이 매우 인기를 얻고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 환경 친화적 장례식에 이름을 붙여 주는 문장이에요. 문장 앞의 Known as구가 주어 eco-friendly funerals를 꾸미면서 '이것이 바로 \u003cb class=\"key\">녹색 \u003c/b>\u003cb class=\"key\">장례식\u003c/b>'이라고 개념을 정의하고, 동시에 그것이 인기를 얻고 있다는 흐름을 이어 줍니다. \u003cb class=\"key\">과거분사\u003c/b>구가 앞에서 주어를 수식하는 전형적인 구조예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 부사적 용법(수동 분사구문)\u003c/span> : [(Being) + known as ~] + 주어 + 동사 : \"녹색 장례식으로 알려져 (있는)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">불완전자동사 become + 주격보어\u003c/span> : become + [very popular (주격보어)] : \"매우 인기를 얻고 있다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Known as green funerals, 녹색 장례식으로 알려진. eco-friendly funerals, 환경 친화적 장례식은. are becoming very popular, 매우 인기를 얻고 있다. 이 문장 전체를 해석하면, 녹색 장례식으로 알려진 환경 친화적 장례식이 매우 인기를 얻고 있다.","hl":"m"},{"n":19,"text":"세 번째 문장은 앞에서 말한 환경 친화적 장례식에 이름을 붙여 주는 문장이에요. Known as로 시작하는 과거분사구가 주어를 꾸며 주면서 이것이 바로 녹색 장례식이라고 개념을 정의해 주고, 동시에 인기를 얻고 있다는 흐름을 이어 주죠.","hl":"mn"},{"n":20,"text":"먼저 문장 앞의 Known as green funerals가 과거분사로 시작하는 분사구문이라는 점이에요. Being이 생략된 수동의 의미라서 '알려져 있는'으로 해석해요. 그리고 become이 형용사를 보어로 데리고 오는 불완전자동사라서 very popular가 주격보어로 온다는 점도 기억하세요. 여기에 진행형이 겹쳐서 점점 인기를 얻고 있다는 변화의 느낌을 주는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">판지(두꺼운 종이)로 제작된 관,\u003c/span>\u003cspan class=\"en\">Cardboard coffins,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천연 섬유로 짠 옷(수의),\u003c/span>\u003cspan class=\"en\">clothes \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sewn \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">natural \u003c/span>\u003cspan class=\"tgt\">fibers\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 자연 환경 속에 있는 무덤이,\u003c/span>\u003cspan class=\"en\">and a burial place in a natural setting\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인기 있는 몇 가지 아이디어이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">popular \u003c/span>\u003cspan class=\"tgt\">ideas\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영국의 환경론자들에게 선호되고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">favored \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">British \u003c/span>\u003cspan class=\"tgt\">environmentalists\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">판지(두꺼운 종이)로 제작된 관, 천연 섬유로 짠 옷(수의), 자연 환경 속에 있는 무덤이, 영국의 환경론자들에게 선호되고 있는 몇 가지 인기 아이디어이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 영국 환경론자들이 선호하는 친환경 장례 방식 세 가지를 소개하는 문장이에요. 관, 옷, 무덤 자리처럼 \u003cb class=\"key\">나열된\u003c/b> \u003cb class=\"key\">주어\u003c/b>가 길게 이어지다가 마지막에 are로 묶이는 구조라서 끊어 읽을 때 주어 덩어리를 놓치지 않는 게 중요해요. 결국 이런 방식들이 인기 있는 \u003cb class=\"key\">아이디어\u003c/b>라는 뜻으로, 앞으로 이어질 이야기의 예시를 정리해 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 용법(수동)\u003c/span> : [명사 clothes] + [sewn from natural fibers (과거분사구)] : \"천연 섬유로 짠\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치(복수 주어)\u003c/span> : [A, B, and C (복수 주어)] + are : \"인기 있는 몇 가지 아이디어이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 용법(수동)과 by 행위자\u003c/span> : [명사 ideas] + [favored by + 행위자 (과거분사구)] : \"영국의 환경론자들에게 선호되고 있는\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Cardboard coffins, 판지(두꺼운 종이)로 제작된 관. clothes sewn from natural fibers, 천연 섬유로 짠 옷(수의). and a burial place in a natural setting, 그리고 자연 환경 속에 있는 무덤이. are some of the popular ideas, 인기 있는 몇 가지 아이디어이다. favored by these British environmentalists, 영국의 환경론자들에게 선호되고 있는. 이 문장 전체를 해석하면, 판지(두꺼운 종이)로 제작된 관, 천연 섬유로 짠 옷(수의), 자연 환경 속에 있는 무덤이, 영국의 환경론자들에게 선호되고 있는 몇 가지 인기 아이디어이다.","hl":"m"},{"n":22,"text":"이 문장은 영국 환경론자들이 선호하는 친환경 장례 방식을 소개하고 있어요. 관, 옷, 무덤 자리처럼 나열된 주어가 길게 이어지다가 마지막에 are로 묶이는 구조죠. 결국 이런 방식들이 인기 있는 아이디어라는 뜻으로, 뒤에 이어질 내용의 예시를 정리해 주는 문장입니다.","hl":"mn"},{"n":23,"text":"먼저 clothes sewn from natural fibers를 보면, 옷은 스스로 짜는 게 아니라 짜여지는 대상이죠. 이렇게 수동 관계일 때는 과거분사 sewn을 써서 뒤에서 명사 clothes를 꾸며 줍니다. 두 번째로 are some of the popular ideas에서 주어가 관, 옷, 무덤 세 덩어리의 복수 주어라서 동사가 is가 아니라 are인 거예요. 마지막으로 favored by these British environmentalists는 ideas가 environmentalists에게 선호되는 대상이니까 과거분사 favored를 쓰고 행위자를 by로 붙인 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경 친화적 장례식은\u003c/span>\u003cspan class=\"en\">Eco-friendly funerals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~만큼 싸지 않다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">cheap \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 생각할지도 모르는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 환경 친화적 장례식은 생각만큼 돈이 적게 들지는 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인기를 끄는 친환경 장례식이지만 가격까지 착한 것은 아니라는 \u003cb class=\"key\">반전\u003c/b>을 주는 문장이에요. not as cheap as you might think는 '생각만큼 싸지 않다'로, 독자의 \u003cb class=\"key\">예상\u003c/b>을 깨는 표현이죠. 이 문장이 다음 문장의 환경론자 주장으로 넘어가는 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">원급 비교(as ~ as)의 부정\u003c/span> : not + [as + 원급 + as + 비교 대상] : \"생각만큼 싸지 않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 might의 추측 용법\u003c/span> : [might + 동사원형] : \"생각할지도 모르다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Eco-friendly funerals, 환경 친화적 장례식은. are not as cheap as, ~만큼 싸지 않다. you might think, 당신이 생각할지도 모르는. 이 문장 전체를 해석하면, 이러한 환경 친화적 장례식은 생각만큼 돈이 적게 들지는 않는다.","hl":"m"},{"n":25,"text":"앞에서 친환경 장례식이 인기를 끈다고 했죠. 그런데 여기서 한 번 반전이 일어납니다. 환경에 좋다고 해서 가격까지 착한 건 아니라는, 우리의 예상과 다른 이야기를 꺼내는 거예요. 그래서 다음 문장에서 환경론자들의 주장으로 넘어가는 전환점이 되는 문장입니다.","hl":"mn"},{"n":26,"text":"여기서 핵심은 as와 as 사이에 형용사 원급이 들어간 비교 표현이에요. cheap이라는 원급을 as와 as로 감싸면 그만큼 싸다가 되고, 앞에 not을 붙이면 생각만큼 싸지 않다로 의미가 뒤집힙니다. 그리고 might는 과거가 아니라 할지도 모른다는 추측을 나타내는 조동사라서 뒤에 동사원형 think가 오는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 많은 환경론자들은 말한다\u003c/span>\u003cspan class=\"en\">But many environmentalists say\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경에 대하여 일정한 역할을 하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">part \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">environment \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">값으로 따질 일이 아니라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">doesn't \u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">price \u003c/span>\u003cspan class=\"tgt\">tag\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 많은 환경론자들은 환경에 대하여 일정한 역할을 하는 것은 값으로 따질 일이 아니라고 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 장례식이 싸지 않다고 했지만, 환경론자들의 생각은 다르다는 것을 보여 줘요. 환경을 위해 자기 몫을 하는 일은 \u003cb class=\"key\">돈으로 \u003c/b>\u003cb class=\"key\">따질\u003c/b> 문제가 아니라는 거죠. price tag는 \u003cb class=\"key\">가격표\u003c/b>라는 뜻으로, 여기서는 \u003cb class=\"key\">값으로 \u003c/b>\u003cb class=\"key\">매길 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 가치를 비유하는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(say의 목적어)\u003c/span> : say + [that + 주어 + 동사 ~] : \"~라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구 주어(단수 취급)\u003c/span> : [Doing + 목적어 ~] + 단수 동사 : \"환경에 대하여 일정한 역할을 하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정문과 자동사 come with(동반)\u003c/span> : doesn't + [come with + 명사] : \"값으로 따질 일이 아니다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"But many environmentalists say, 하지만 많은 환경론자들은 말한다. that doing their part for the environment, 환경에 대하여 일정한 역할을 하는 것은. doesn't come with a price tag, 값으로 따질 일이 아니라고. 이 문장 전체를 해석하면, 하지만 많은 환경론자들은 환경에 대하여 일정한 역할을 하는 것은 값으로 따질 일이 아니라고 말한다.","hl":"m"},{"n":28,"text":"앞 문장에서는 장례식이 싸지 않다고 했는데, 환경론자들의 생각은 다릅니다. 환경을 위해 자기 몫을 하는 일은 돈으로 따질 문제가 아니라는 거예요. 여기서 price tag는 가격표라는 뜻으로, 값으로 매길 수 없는 가치를 비유적으로 보여 주는 표현입니다.","hl":"mn"},{"n":29,"text":"먼저 say 뒤에 that이 이끄는 명사절이 통째로 와서 ~라고 말하다의 목적어가 됩니다. 그 안에서 doing their part for the environment는 동명사구가 주어로 쓰인 건데, 하나의 일로 보기 때문에 단수 동사 doesn't가 오는 겁니다. 마지막으로 come with는 ~을 수반하다라는 숙어이고, 여기에 부정이 붙어 값표가 따라오지 않는다, 즉 값으로 따질 일이 아니다라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>어떤 사람들은 환경을 생각하는 \u003cb class=\"key\">친환경적 \u003c/b>\u003cb class=\"key\">삶\u003c/b>을 사는 것만으로는 더 이상 충분치 않다고 느낀다.\u003c/li>\u003cli>영국에서는 세상을 떠날 때 환경 친화적이려는 \u003cb class=\"key\">녹색 \u003c/b>\u003cb class=\"key\">장례식\u003c/b>이 인기를 얻고 있으며, 판지 관과 천연 섬유 수의, 자연 환경 속 매장지가 선호된다.\u003c/li>\u003cli>이런 장례식은 생각만큼 \u003cb class=\"key\">값이 \u003c/b>\u003cb class=\"key\">싸지\u003c/b> 않아서, 친환경이 항상 저렴한 것은 아니라는 반전이 나타난다.\u003c/li>\u003cli>그래도 환경론자들은 환경을 위해 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">역할을 \u003c/b>\u003cb class=\"key\">하는 \u003c/b>\u003cb class=\"key\">것\u003c/b>은 값으로 따질 일이 아니라고 주장한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Eco-friendly funerals are gaining popularity in England, and environmentalists say doing their part for the environment does not come with a price tag.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">영국에서는 세상을 떠날 때도 환경 친화적이려는 \u003cb class=\"key\">녹색 \u003c/b>\u003cb class=\"key\">장례식\u003c/b>이 매우 인기를 얻고 있으며, 판지 관과 천연 섬유 수의, 자연 환경 속 매장지 같은 아이디어가 선호되고 있다. 생각만큼 값이 싸지는 않지만, 환경론자들은 환경을 위해 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">역할을 \u003c/b>\u003cb class=\"key\">하는 \u003c/b>\u003cb class=\"key\">것\u003c/b>은 값으로 따질 일이 아니라고 말한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"정리해 볼게요. 이 글은 영국에서 환경 친화적 장례식, 즉 녹색 장례식이 인기를 얻고 있다는 소식에서 출발해요. 생각만큼 싸지 않다는 반전이 있지만, 환경론자들은 환경을 위해 자기 역할을 하는 것은 값으로 따질 일이 아니라고 말하죠. 마지막 문장의 주장을 중심으로 전체 흐름을 다시 한 번 정리해 보시길 바라요. 오늘 수업도 수고 많았어요.","hl":null}]}]});</script></body></html>
