  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

  a.onloadeddata=function(){okBase=true;};

}
lecturePlayer(document.getElementById("app"),{"brand":"목적어 판단","title":"목적어의 정체와 수식어, 그리고 가목적어 it","audioDir":"lecture_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">10강 목적어 판단\u003c/div>\u003ch1>목적어의 정체와 수식어, 그리고 가목적어 it\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>목적어 자리에 올 수 있는 다양한 형태와 수식어, 그리고 가목적어 it을 정확히 이해한다\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분 오늘부터 우리와 함께 목적어에 대해 확실하게 정복해 볼 거예요. 문장에서 목적어 자리에 명사와 명사구 명사절이 어떻게 들어가는지 살펴볼 거고요. 수식어와 구별하는 방법이랑 가목적어 it까지 꼼꼼하게 다뤄볼 테니까 잘 따라오세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">목적어 자리에 오는 명사, 명사구, 명사절\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사의 목적어 자리에는 \u003cb class=\"key\">명사\u003c/b>, 대명사뿐만 아니라 명사 역할을 하는 \u003cb class=\"key\">구\u003c/b>나 \u003cb class=\"key\">절\u003c/b>이 올 수 있어요.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">They didn’t realize \u003cspan class=\"fx\">the seriousness of the situation\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그들은 그 상황의 심각성을 인식하지 못했다.\u003c/div>\u003cdiv class=\"g-note\">명사구가 목적어로 쓰인 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The father gives \u003cspan class=\"fx\">his son an allowance\u003c/span> every week.\u003c/div>\u003cdiv class=\"g-ko\">그 아버지는 아들에게 매주 용돈을 준다.\u003c/div>\u003cdiv class=\"g-note\">간접목적어와 직접목적어가 모두 쓰인 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The volcano stopped \u003cspan class=\"fx\">erupting\u003c/span> after five days.\u003c/div>\u003cdiv class=\"g-ko\">그 화산은 5일 후에 분출을 멈추었다.\u003c/div>\u003cdiv class=\"g-note\">동명사구가 목적어로 쓰인 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">I consider \u003cspan class=\"fx\">arriving late for appointments rude\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 약속에 늦는 것을 무례하다고 생각한다.\u003c/div>\u003cdiv class=\"g-note\">동명사구와 목적격보어가 쓰인 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-4\">\u003cdiv class=\"g-en\">Could you tell me \u003cspan class=\"fx\">how to fasten this seat belt\u003c/span>, please?\u003c/div>\u003cdiv class=\"g-ko\">이 안전벨트를 어떻게 매는지 알려주시겠어요?\u003c/div>\u003cdiv class=\"g-note\">의문사 to부정사구가 목적어로 쓰인 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-5\">\u003cdiv class=\"g-en\">The disobeying student did exactly \u003cspan class=\"fx\">what his parents told him not to\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">반항하는 그 학생은 그의 부모님이 하지 말라고 하는 것만 했다.\u003c/div>\u003cdiv class=\"g-note\">관계대명사 what 절이 목적어로 쓰인 문장\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>목적어 자리에 오는 명사절은 문장의 핵심 의미를 전달하므로 형태를 잘 기억해 두세요.\u003c/div>","segs":[{"n":2,"text":"문장에서 목적어는 보통 을이나 를로 해석되는 자리인데요. 이 자리에는 단순한 명사나 대명사뿐만 아니라 명사구와 명사절도 들어갈 수 있어요. 어떻게 쓰이는지 예문들을 통해 자세히 알아볼게요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 읽어 볼게요. They didn’t realize the seriousness of the situation은 그들은 그 상황의 심각성을 인식하지 못했다라는 뜻이에요. 여기서 목적어 자리에는 the seriousness of the situation이라는 명사구가 쓰였어요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. The father gives his son an allowance every week는 그 아버지는 아들에게 매주 용돈을 준다라는 뜻이에요. 동사 뒤에 his son이라는 간접목적어와 an allowance라는 직접목적어가 나란히 왔어요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문입니다. The volcano stopped erupting after five days는 그 화산은 5일 후에 분출을 멈추었다라는 뜻이에요. stop 동사 뒤에 erupting이라는 동명사구가 목적어로 와서 화산이 멈춘 동작을 나타내고 있어요.","hl":"ex-2"},{"n":6,"text":"네 번째 예문이에요. I consider arriving late for appointments rude는 나는 약속에 늦는 것을 무례하다고 생각한다라는 뜻이에요. arriving late for appointments가 목적어고 rude가 목적격보어 자리예요.","hl":"ex-3"},{"n":7,"text":"다섯 번째 예문입니다. Could you tell me how to fasten this seat belt, please는 이 안전벨트를 어떻게 매는지 알려주시겠어요라는 뜻이에요. how to fasten this seat belt라는 의문사 to부정사구가 tell 동사의 목적어로 쓰였어요.","hl":"ex-4"},{"n":8,"text":"여섯 번째 예문이에요. The disobeying student did exactly what his parents told him not to는 반항하는 그 학생은 그의 부모님이 하지 말라고 하는 것만 했다라는 뜻이에요. what his parents told him not to라는 명사절이 목적어 자리에 왔어요.","hl":"ex-5"},{"n":9,"text":"목적어 자리에 명사절이 올 때는 형태를 정확히 파악하는 것이 중요해요. 관계대명사나 의문사가 이끄는 절이 목적어로 자주 쓰인다는 점을 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">목적어와 수식어 구분하기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">목적어는 형용사 역할을 하는 \u003cb class=\"key\">구\u003c/b>나 \u003cb class=\"key\">절\u003c/b>의 수식을 받기 쉬우며 동사를 꾸며주는 \u003cb class=\"key\">부사\u003c/b>와는 확실히 구분해야 해요.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">A forest fire in Brazil can affect \u003cspan class=\"fx\">the weather in Moscow\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">브라질에서 일어난 산불은 모스크바의 날씨에 영향을 줄 수 있다.\u003c/div>\u003cdiv class=\"g-note\">전치사구가 명사를 수식하는 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Countries import \u003cspan class=\"fx\">things that they can’t produce\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나라들은 생산할 수 없는 것들을 수입한다.\u003c/div>\u003cdiv class=\"g-note\">관계대명사절이 명사를 수식하는 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I can hold \u003cspan class=\"fx\">my breath\u003c/span> for one minute under water.\u003c/div>\u003cdiv class=\"g-ko\">나는 물속에서 일분 동안 숨을 참을 수 있다.\u003c/div>\u003cdiv class=\"g-note\">목적어와 부사구를 구별하는 문장\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>목적어는 주로 을이나 를로 해석되지만 수식어구는 장소나 시간 등을 나타낸다는 것을 기억하세요.\u003c/div>","segs":[{"n":10,"text":"목적어 명사 뒤에 수식어가 길게 붙어 있는 경우가 아주 많아요. 이때 동사를 꾸미는 부사와 명사를 꾸미는 형용사 역할을 헷갈리면 안 되는데요. 예문을 보면서 차이점을 확실히 느껴보세요.","hl":"rule"},{"n":11,"text":"첫 번째 예문입니다. A forest fire in Brazil can affect the weather in Moscow는 브라질에서 일어난 산불은 모스크바의 날씨에 영향을 줄 수 있다라는 뜻이에요. affect 뒤의 the weather in Moscow가 목적어고 뒤에서 명사를 꾸며주는 수식어가 붙어 있어요.","hl":"ex-0"},{"n":12,"text":"두 번째 예문이에요. Countries import things that they can't produce는 나라들은 생산할 수 없는 것들을 수입한다라는 뜻이에요. things 뒤에 that they can't produce라는 관계대명사절이 와서 목적어를 꾸며주고 있어요.","hl":"ex-1"},{"n":13,"text":"세 번째 예문입니다. I can hold my breath for one minute under water는 나는 물속에서 일분 동안 숨을 참을 수 있다라는 뜻이에요. hold의 목적어는 my breath이고 뒤에 나오는 표현들은 전부 장소나 시간을 나타내는 부사구예요.","hl":"ex-2"},{"n":14,"text":"목적어와 수식어를 구별할 때는 해석을 꼼꼼하게 해보는 것이 좋아요. 을이나 를에 해당하는 대상이 바로 목적어라는 점을 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">가목적어 it의 사용\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">VOC\u003c/b> 구조에서 목적어로 쓰인 긴 명사구와 명사절은 문장 뒤로 보내고 원래 자리에 \u003cb class=\"key\">가목적어 it\u003c/b>을 남겨요.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 동사 + it + 목적격보어 + 진목적어(명사구/명사절)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The blister on my heel made \u003cspan class=\"fx\">it painful to walk\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">내 발뒤꿈치에 생긴 물집은 걷는 것을 고통스럽게 했다.\u003c/div>\u003cdiv class=\"g-note\">가목적어 it과 to부정사 진목적어 구문\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I think \u003cspan class=\"fx\">it a blessing that we can help others\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 우리가 다른 사람들을 도울 수 있는 것을 축복이라고 생각한다.\u003c/div>\u003cdiv class=\"g-note\">가목적어 it과 that절 진목적어 구문\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I don’t consider \u003cspan class=\"fx\">it important whether you’ve got a college education\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">나는 당신이 대학교육을 받았는지 여부가 중요하다고 생각하지 않는다.\u003c/div>\u003cdiv class=\"g-note\">가목적어 it과 whether절 진목적어 구문\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>가목적어 it은 해석하지 않고 뒤에 있는 진짜 목적어를 을이나 를로 해석해요.\u003c/div>","segs":[{"n":15,"text":"목적어 자리에 긴 명사구어나 명사절이 오면 문장이 너무 길고 불안정해 보여요. 그래서 진짜 목적어는 뒤로 보내고 그 빈자리에 가목적어 it을 채워 넣는데요. 아주 자주 쓰이는 규칙이니까 꼭 외워두세요. 예문으로 살펴볼게요.","hl":"rule"},{"n":16,"text":"첫 번째 예문입니다. The blister on my heel made it painful to walk는 내 발뒤꿈치에 생긴 물집은 걷는 것을 고통스럽게 했다라는 뜻이에요. make 다음에 it이 가목적어로 나오고 painful이 목적격보어, to walk가 진짜 목적어로 뒤에 갔어요.","hl":"ex-0"},{"n":17,"text":"두 번째 예문이에요. I think it a blessing that we can help others는 나는 우리가 다른 사람들을 도울 수 있는 것을 축복이라고 생각한다라는 뜻이에요. think 뒤에 가목적어 it과 목적격보어 a blessing이 오고 that절이 진목적어로 뒤로 빠졌어요.","hl":"ex-1"},{"n":18,"text":"세 번째 예문입니다. I don't consider it important whether you've got a college education은 나는 당신이 대학교육을 받았는지 여부가 중요하다고 생각하지 않는다라는 뜻이에요. consider 뒤에 it이 가목적어로 쓰이고 whether절이 진목적어로 뒤에 위치했어요.","hl":"ex-2"},{"n":19,"text":"가목적어 it을 해석할 때 그것이라고 해석하면 안 돼요. 뒤에 나오는 진짜 목적어를 목적어처럼 해석해야 한다는 점을 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The blister on my heel made painful to walk.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The blister on my heel made it painful to walk.\u003c/div>\u003cdiv class=\"g-why\">형용사나 명사 목적격보어 앞에서 목적어 역할을 대신하는 [[가목적어 it]]을 생략했기 때문에 틀렸어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I think a blessing that we can help others.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I think it a blessing that we can help others.\u003c/div>\u003cdiv class=\"g-why\">긴 [[명사절]] 목적어가 뒤로 갈 때 빈자리를 채워줄 [[가목적어 it]]을 누락했기 때문에 틀렸어요.\u003c/div>\u003c/div>","segs":[{"n":20,"text":"첫 번째 자주 틀리는 문장이에요. The blister on my heel made painful to walk라고 쓰면 목적어 자리가 비어 있어서 틀려요. 보어 앞에 반드시 가목적어 it을 넣어서 The blister on my heel made it painful to walk로 써야 맞아요.","hl":"mk-0"},{"n":21,"text":"두 번째 자주 틀리는 문장입니다. I think a blessing that we can help others라고 하면 안 되고요. 목적격보어 앞에 가목적어 it을 넣어서 I think it a blessing that we can help others라고 완성해 주어야 해요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/sp
