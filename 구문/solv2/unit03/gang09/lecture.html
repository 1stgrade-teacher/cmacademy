  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"주어, 동사 판단","title":"완벽한 문장의 시작! 주어와 동사 찾기","audioDir":"lecture_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">09강 주어, 동사 판단\u003c/div>\u003ch1>완벽한 문장의 시작! 주어와 동사 찾기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>문장의 주인인 주어 자리에 올 수 있는 다양한 형태와 수식을 받는 주어를 정확히 찾아내어 문장의 뼈대를 세운다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘 우리 함께 09강 주어와 동사 판단 단원을 정복해 봐요. 영어 문장을 읽을 때 문장의 주인공인 주어가 누구인지, 행동을 나타내는 동사가 어디에 있는지 찾는 것은 정말 중요하죠. 오늘 저와 함께 주어 자리에 올 수 있는 여러 가지 모습과 주어를 꾸며주는 수식어까지 완벽하게 파헤쳐 보겠어요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">주어 자리에 오는 명사, 명사구, 명사절\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">문장의 주인공인 주어 자리에는 보통 \u003cb class=\"key\">명사\u003c/b>나 대명사가 오지만, \u003cb class=\"key\">명사구\u003c/b>나 \u003cb class=\"key\">명사절\u003c/b>처럼 덩어리가 통째로 주어로 오기도 해요.\u003cdiv>\u003cspan class=\"g-formula\">명사(구/절) + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">All his wealth\u003c/span> couldn’t bring him happiness.\u003c/div>\u003cdiv class=\"g-ko\">모든 그의 부도 그에게 행복을 가져다주지 못했다.\u003c/div>\u003cdiv class=\"g-note\">명사구(All his wealth)가 주어로 쓰인 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Dropping atomic bombs on Japan\u003c/span> ended World War II.\u003c/div>\u003cdiv class=\"g-ko\">일본에 원자폭탄을 투하한 것이 세계2차 대전을 끝냈다.\u003c/div>\u003cdiv class=\"g-note\">동명사구(Dropping atomic bombs on Japan)가 주어로 쓰인 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">To argue with him\u003c/span> is a waste of time.\u003c/div>\u003cdiv class=\"g-ko\">그와 논쟁을 벌이는 것은 시간 낭비이다.\u003c/div>\u003cdiv class=\"g-note\">투부정사구(To argue with him)가 주어로 쓰인 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">What I enjoy most\u003c/span> is traveling around and visiting new places.\u003c/div>\u003cdiv class=\"g-ko\">내가 가장 즐기는 것은 여행을 다니고 새로운 장소를 방문하는 것이다.\u003c/div>\u003cdiv class=\"g-note\">관계대명사 what 절이 주어로 쓰인 문장\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주어가 너무 길면 가주어 \u003cb class=\"key\">It\u003c/b>을 문장 맨 앞에 쓰고 진짜 주어는 뒤로 보낼 수 있어요.\u003c/div>","segs":[{"n":2,"text":"문장에서 가장 중요한 주인공이 바로 주어예요. 주어 자리에는 보통 명사나 대명사가 오지만 때로는 여러 단어가 뭉친 명사구와 문장 형태인 명사절도 주어 자리에 올 수 있답니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 함께 볼게요. All his wealth couldn’t bring him happiness라고 되어 있죠. 여기서 모든 그의 부라는 뜻의 All his wealth가 문장의 주어로 쓰였어요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. Dropping atomic bombs on Japan ended World War II라고 했죠. 일본에 원자폭탄을 투하한 것이라는 동명사구 전체가 주어 역할을 하고 있어요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문을 보죠. To argue with him is a waste of time이에요. 그와 논쟁을 벌이는 것이라는 투부정사구가 주어로 맨 앞에 나와 있어요.","hl":"ex-2"},{"n":6,"text":"네 번째 예문입니다. What I enjoy most is traveling around and visiting new places라고 했죠. 내가 가장 즐기는 것이라는 what 절이 주어로 쓰였어요.","hl":"ex-3"},{"n":7,"text":"주어 자리에 투부정사나 대절처럼 긴 덩어리가 오면 문장이 무거워 보여요. 그럴 때는 가주어 It을 앞에 쓰고 진짜 주어를 뒤로 보내서 깔끔하게 만들어 줄 수 있답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">가주어를 사용한 문장과 명사절 주어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">길어진 주어 대신 가주어 \u003cb class=\"key\">It\u003c/b>을 쓰고 진짜 주어는 뒤로 보낼 수 있으며, \u003cb class=\"key\">that절\u003c/b>이나 whether절도 주어가 될 수 있어요.\u003cdiv>\u003cspan class=\"g-formula\">It ~ to부정사 / that절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">That students learn better when they cooperate\u003c/span> has been proven\u003c/div>\u003cdiv class=\"g-ko\">학생들이 협력할 때 더 잘 배운다는 것은 사실인 것으로 증명되었다.\u003c/div>\u003cdiv class=\"g-note\">that절이 주어로 쓰인 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">It\u003c/span> is a waste of time to argue with him.\u003c/div>\u003cdiv class=\"g-ko\">그와 논쟁을 벌이는 것은 시간 낭비이다.\u003c/div>\u003cdiv class=\"g-note\">가주어 It과 진주어 투부정사 구문\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">It\u003c/span> has been proven true that students learn better when they\u003c/div>\u003cdiv class=\"g-ko\">학생들이 협력할 때 더 잘 배운다는 것은 사실인 것으로 증명되었다.\u003c/div>\u003cdiv class=\"g-note\">가주어 It과 진주어 that절 구문\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">It will make no difference \u003cspan class=\"fx\">whether you take a taxi or a bus\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">택시를 타든 버스를 타든 별 차이가 없을 것이다.\u003c/div>\u003cdiv class=\"g-note\">whether절이 진주어로 쓰인 문장\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>whether절이 주어일 때도 가주어 It을 활용하여 문장을 자연스럽게 쓸 수 있어요.\u003c/div>","segs":[{"n":8,"text":"앞서 배운 긴 주어들을 문장 뒤로 보내고 빈자리를 It으로 채우는 문장들을 살펴볼게요. 또한 사실을 나타내는 that절이나 인지 아닌지를 묻는 whether절도 주어로 아주 잘 쓰인답니다.","hl":"rule"},{"n":9,"text":"첫 번째 예문을 읽어 볼게요. That students learn better when they cooperate has been proven이에요. 학생들이 협력할 때 더 잘 배운다는 사실 전체가 주어로 쓰였어요.","hl":"ex-0"},{"n":10,"text":"두 번째 예문이에요. It is a waste of time to argue with him이라고 했죠. 앞서 배운 투부정사 주어를 뒤로 보내고 가주어 It을 쓴 형태예요.","hl":"ex-1"},{"n":11,"text":"세 번째 예문을 보죠. It has been proven true that students learn better when they로 되어 있어요. that절이 너무 길어서 뒤로 가고 가주어 It이 자리를 대신했네요.","hl":"ex-2"},{"n":12,"text":"네 번째 예문입니다. It will make no difference whether you take a taxi or a bus예요. 택시를 타든 버스를 타든 차이가 없다는 내용이 진주어로 뒤에 와 있어요.","hl":"ex-3"},{"n":13,"text":"whether절이 주어로 올 때도 역시 가주어 It을 문장 앞에 써서 균형 있는 문장을 만들 수 있다는 것을 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">주어를 수식하는 형용사구와 분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주어 뒤에서 명사를 꾸며주는 \u003cb class=\"key\">투부정사\u003c/b>, \u003cb class=\"key\">현재분사\u003c/b>, \u003cb class=\"key\">과거분사\u003c/b> 등의 수식어구를 잘 구분해야 해요.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 형용사구/분사 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">His desire \u003cspan class=\"fx\">to become an actor\u003c/span> began in high school.\u003c/div>\u003cdiv class=\"g-ko\">배우가 되고자 하는 그의 열망은 고등학교 때 시작되었다.\u003c/div>\u003cdiv class=\"g-note\">투부정사구가 주어를 수식하는 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">A black cat \u003cspan class=\"fx\">crossing your path\u003c/span> is believed to be a sign of bad luck.\u003c/div>\u003cdiv class=\"g-ko\">가는 길을 가로지르는 검은 고양이는 불운의 징조로 믿어진다.\u003c/div>\u003cdiv class=\"g-note\">현재분사구가 주어를 수식하는 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Dogs \u003cspan class=\"fx\">kept indoors\u003c/span> often have problems with depression and anxiety.\u003c/div>\u003cdiv class=\"g-ko\">실내에서 키운 개는 종종 우울증과 불안증의 문제가 있다.\u003c/div>\u003cdiv class=\"g-note\">과거분사구가 주어를 수식하는 문장\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>분사가 주어를 뒤에서 꾸밀 때 수동과 능동의 의미 관계를 잘 살펴봐야 해요.\u003c/div>","segs":[{"n":14,"text":"주어 뒤에 붙어서 주어를 더 자세히 설명해 주는 수식어구들을 알아볼게요. 투부정사나 분사 같은 표현이 주어 바로 뒤에서 명사를 꾸며줄 수 있답니다.","hl":"rule"},{"n":15,"text":"첫 번째 예문을 봅시다. His desire to become an actor began in high school이에요. 배우가 되고자 하는이라는 투부정사구가 주어 desire를 꾸며주고 있어요.","hl":"ex-0"},{"n":16,"text":"두 번째 예문이에요. A black cat crossing your path is believed to be a sign of bad luck이라고 했죠. 길을 가로지르는이라는 현재분사구 분홍빛 표현이 고양이를 수식해요.","hl":"ex-1"},{"n":17,"text":"세 번째 예문을 보죠. Dogs kept indoors often have problems with depression and anxiety예요. 실내에서 키워진다는 의미의 과거분사구가 개들을 꾸며주고 있네요.","hl":"ex-2"},{"n":18,"text":"분사가 주어를 꾸밀 때 능동이면 현재분사를, 수동이면 과거분사를 쓴다는 점을 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">전치사구와 관계대명사절의 주어 수식\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주어는 \u003cb class=\"key\">전치사구\u003c/b>나 \u003cb class=\"key\">관계대명사절\u003c/b>의 수식을 받아 길어질 수 있으며, 진짜 동사의 위치를 잘 찾아야 해요.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 전치사구/관계대명사절 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">People \u003cspan class=\"fx\">with high blood pressure\u003c/span> need to exercise every day.\u003c/div>\u003cdiv class=\"g-ko\">고혈압이 있는 사람들은 매일 운동을 해야 한다.\u003c/div>\u003cdiv class=\"g-note\">전치사구가 주어를 수식하는 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Money \u003cspan class=\"fx\">that we use to make profits\u003c/span> is called an investment.\u003c/div>\u003cdiv class=\"g-ko\">이윤을 내기 위해서 사용하는 돈은 투자라고 불린다.\u003c/div>\u003cdiv class=\"g-note\">관계대명사절이 주어를 수식하는 문장\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>수식어구가 길어도 주어와 진짜 동사 사이의 수 일치를 틀리지 않도록 조심하세요.\u003c/div>","segs":[{"n":19,"text":"마지막으로 주어가 전치사구나 관계대명사절 때문에 길어지는 경우를 살펴볼게요. 수식어구에 현혹되지 말고 문장의 진짜 동사를 찾아내는 것이 핵심이에요.","hl":"rule"},{"n":20,"text":"첫 번째 예문을 읽어 볼게요. People with high blood pressure need to exercise every day예요. 고혈압을 가진이라는 전치사구가 사람들을 꾸며주고 있죠.","hl":"ex-0"},{"n":21,"text":"두 번째 예문이에요. Money that we use to make profits is called an investment라고 했어요. 우리가 이윤을 내기 위해 사용하는이라는 관계대명사절이 돈을 수식해요.","hl":"ex-1"},{"n":22,"text":"주어와 동사 사이에 긴 수식어가 끼어 있더라도 당황하지 말고 진짜 주어의 단수와 복수를 파악해서 동사와 짝을 맞춰 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>To argue with him are a waste of time.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ To argue with him is a waste of time.\u003c/div>\u003cdiv class=\"g-why\">투부정사구가 주어일 때는 단수 취급을 하므로 동사는 are가 아니라 is를 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Dogs keeping indoors often have problems.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Dogs kept indoors often have problems.\u003c/div>\u003cdiv class=\"g-why\">개들이 실내에서 '키워지는' 수동의 의미이므로 현재분사 keeping이 아니라 과거분사 kept를 써야 해요.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"학생들이 자주 하는 실수 중 하나예요. To argue with him are a waste of time이라고 쓰면 틀려요. 투부정사구 주어는 단수 취급하므로 is를 써야 맞답니다.","hl":"mk-0"},{"n":24,"text":"두 번째 자주 틀리는 부분이에요. Dogs keeping indoors라고 쓰면 개들이 직접 실내에서 키우는 뜻이 돼요. 개들은 키워지는 것이므로 과거분사 kept를 써야 올바른 문장이 돼요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장의 주어 자리에 올 수 없는 것은 무엇인가요?\u003c/div>\u003cdiv class=\"g-qs\">____ is a waste of time.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>All his wealth\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>To argue with him\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>Happily\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>That students learn better\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Happily\u003c/span>\u003cdiv class=\"g-exp\">부사인 Happily는 명사 역할을 할 수 없으므로 주어 자리에 올 수 없어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"첫 번째 문제입니다. 빈칸에 들어갈 수 없는 것을 고르는 문제네요. 화면에 나오는 보기들을 잘 읽고 잠시 멈춘 뒤 정답을 골라 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 세 번째 보기인 Happily예요. 부사는 주어 자리에 올 수 없기 때문이죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/d 003cspan class=\"a\">All his wealth couldn’t bring him happiness\u003c/span>\u003cdiv class=\"g-exp\">주어인 All his wealth가 맨 처음에 오고 조동사 couldn't와 동사원형 bring이 이어져요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"네 번째 문제입니다. 괄호 안의 단어들을 바르게 배열하는 문제네요. 잠시 멈추고 공책에 순서대로 적어 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 All his wealth couldn’t bring him happiness예요. 주어 다음에 조동사와 동사가 잘 연결되었죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말 뜻에 맞게 빈칸을 영작하세요.\u003c/div>\u003cdiv class=\"g-qs\">이윤을 내기 위해서 사용하는 돈은 투자라고 불린다. -&gt; ____ that we use to make profits is called an investment.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Money\u003c/span>\u003cdiv class=\"g-exp\">주어에 해당하는 단어 '돈'을 뜻하는 Money가 와야 해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"다섯 번째 문제입니다. 제시된 우리말을 참고하여 빈칸에 알맞은 영단어를 쓰는 영작 문제예요. 잠시 멈추고 직접 써 보세요.","hl":"q"},{"n":38,"text":"","hl":"q","pause":6},{"n":39,"text":"정답은 Money예요. 주어인 돈을 뜻하는 명사 Money가 문장 맨 처음에 와야 하죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 주어를 수식하는 분사의 쓰임이 옳지 않은 것은 무엇인가요?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>A black cat crossing your path\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Dogs kept indoors\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>People with high blood pressure\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Money that we use\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Money that we use\u003c/span>\u003cdiv class=\"g-exp\">Money that we use는 관계대명사절의 수식을 받는 것이지 분사구의 수식을 받는 것이 아니에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":40,"text":"마지막 여섯 번째 문제입니다. 보기 중 분사의 수식을 받는 주어가 아닌 것을 골라 보세요. 잠시 생각하고 정답을 골라 보세요.","hl":"q"},{"n":41,"text":"","hl":"q","pause":6},{"n":42,"text":"정답은 네 번째 보기인 Money that we use예요. 이것은 관계대명사절의 수식을 받는 형태랍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">09강 주어, 동사 판단\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>주어 자리에는 명사, 대명사뿐만 아니라 \u003cb class=\"key\">명사구\u003c/b>와 \u003cb class=\"key\">명사절\u003c/b>도 올 수 있어요.\u003c/li>\u003cli>길어진 주어는 가주어 \u003cb class=\"key\">It\u003c/b>을 쓰고 뒤로 보낼 수 있어요.\u003c/li>\u003cli>주어는 투부정사, 분사, \u003cb class=\"key\">전치사구\u003c/b>, \u003cb class=\"key\">관계대명사절\u003c/b>의 수식을 받을 수 있어요.\u003c/li>\u003c/ul>","segs":[{"n":43,"text":"오늘 우리는 주어 자리에 올 수 있는 다양한 형태와 주어를 꾸며주는 수식어구에 대해 확실히 배웠어요. 주어와 동사를 정확히 찾는 연습을 꾸준히 한다면 어떤 어려운 영어 문장도 두렵지 않을 거예요. 오늘 배운 내용을 복습하면서 오늘 강의를 마무리할게요. 수고 많았어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
