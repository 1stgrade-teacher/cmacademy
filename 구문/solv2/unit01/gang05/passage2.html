13X3of9fhcWim70zjenXH3h/jS5UkAMpJ9x/wDq+h6HI9ad13Wu3mL7tfx0/r5IX60oyeB/n/OB/kVH5kY6uv8A30P8enP+cGl3rjO4Y6ckDrj1x68fp2pXXdfeh2fby+fYdRx3/nj+hpA6njcCOuMj88ZHT3oLKOSR6dc/youu6+8LPs12TVn/AF8ujFopNynoy/gR/Sjcp/iXvjkE9vT1yOaLrureq/rqJJWstu2/r/wfncXGBgdv8f8AP8qOev8An3pAynowOPf3/wD1mjcvqOeOtF0+qfzH3/r8RecY7Dt2B/zn0pfX+XOR05/p6+1MDof4l/Md+nIOPpg9u/NKWVepHb9R6fyP+Iouu612131/peoW6au/fr/nuO5PP/6859v8/pSc5z2/r/k8+mPegkYByMHjgjPpk+mev50Bl6bh+Y7cdPYnnqfT3d13Vv8Ahv8ANff5h/w4jMFxxnOSB+OOT1xx7c56d03qQ3GODjP4nHAx0yecDk4x3axUjhkPphhnPGQfX8CcH60gHDcA/KeOCcHkdAeOPTn8BhXWmq18/wAvy1/yE72b/ut3X4Pf+u/f/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">How Calculators and Digital Tools Enhance Our Thinking<small>계산기와 디지털 도구가 우리의 사고력을 향상시키는 방법</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 &#39;인지적 오프로딩(Cognitive Offloading)&#39;이라는 개념을 들어본 적 있나요? 이는 우리가 뇌의 부담을 줄이기 위해 외부 도구에 정보를 의존하는 행위를 말하는데, 오늘 지문에서는 바로 이 개념을 계산기와 인터넷이라는 도구에 빗대어 설명하고 있어요. 과거에는 계산기가 수학적 능력을 떨어뜨릴까 봐 걱정했지만, 실제로는 단순 계산이라는 번거로운 작업에서 우리를 해방해 주었죠. 이처럼 도구에 의존하는 것이 뇌의 &#39;작업 기억(Working Memory)&#39;을 덜어주어, 우리가 더 높은 수준의 사고를 할 수 있게 돕는다는 것이 핵심이에요. 즉, 도구를 사용하는 것은 단순히 머리를 쓰지 않는 게 아니라, 중요한 사고를 위해 뇌의 자원을 아끼는 효율적인 전략이 될 수 있다는 점을 이해하고 글을 읽으면 훨씬 도움이 될 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01과거의 우려</div><ul><li>휴대용 계산기가 처음 도입되었을 때 학부모들은 수학적 개념 이해가 약해질까 봐 걱정했다.</li><li>계산기(portable calculators) 사용에 대한 부모들의 반대</li><li>수학 개념(mathematical concepts)을 이해하지 못할 것이라는 우려</li><li>핵심 키워드: 반대(objected), 의존(reliance)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02기대 이상의 결과</div><ul><li>연구 결과, 계산기를 사용하면서 학생들은 단순 계산에서 벗어나 수학 원리를 더 깊이 이해하게 되었다.</li><li>반복적인 계산(routine calculations) 시간의 감소</li><li>근본적인 원리(principles)에 대한 깊은 이해</li><li>핵심 키워드: 원리(principles), 이해(understanding)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03현대적 의미</div><ul><li>오늘날 인터넷 의존도가 높아지는 현상도 계산기의 사례처럼 창의적인 사고를 돕는다고 평가받는다.</li><li>온라인 데이터베이스(online databases)에 대한 의존</li><li>기억하는 부담에서 벗어나 창의적 사고(creative thought)에 집중</li><li>핵심 키워드: 정보망(Web), 창의성(creative)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04뇌의 작동 방식</div><ul><li>계산기가 작업 기억의 부담을 줄여주었듯, 현대의 도구들도 고차원적인 추론을 가능하게 한다.</li><li>작업 기억(working memory)의 압박 완화</li><li>추상적 추론(abstract reasoning)을 위한 뇌 용량 확보</li><li>핵심 키워드: 보조 수단(aid), 추론(reasoning)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">allow</td><td class=\"m\">허용하다</td></tr><tr><td class=\"w\">portable</td><td class=\"m\">휴대용의</td></tr><tr><td class=\"w\">calculator</td><td class=\"m\">계산기</td></tr><tr><td class=\"w\">object</td><td class=\"m\">반대하다</td></tr><tr><td class=\"w\">reliance</td><td class=\"m\">의존</td></tr><tr><td class=\"w\">weaken</td><td class=\"m\">약화시키다</td></tr><tr><td class=\"w\">grasp</td><td class=\"m\">이해</td></tr><tr><td class=\"w\">mathematical</td><td class=\"m\">수학의</td></tr><tr><td class=\"w\">concept</td><td class=\"m\">개념</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">subsequent</td><td class=\"m\">그 후의, 차후의</td></tr><tr><td class=\"w\">largely</td><td class=\"m\">대체로, 크게</td></tr><tr><td class=\"w\">unneeded</td><td class=\"m\">불필요한</td></tr><tr><td class=\"w\">routine</td><td class=\"m\">일상적인, 반복적인</td></tr><tr><td class=\"w\">calculation</td><td class=\"m\">계산</td></tr><tr><td class=\"w\">principle</td><td class=\"m\">원리</td></tr><tr><td class=\"w\">underlie</td><td class=\"m\">~의 기저에 있다, 밑바탕이 되다</td></tr><tr><td class=\"w\">argument</td><td class=\"m\">주장</td></tr><tr><td class=\"w\">dependence</td><td class=\"m\">의존</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1970년대에,</span><span class=\"en\"><b>In the 1970s,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교가 시작했을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when schools began</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들이 ~하도록 허락하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">allowing</span> students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">휴대용 계산기를 사용하도록,</span><span class=\"en\"><b>to use portable calculators,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 부모들이 반대했다.</span><span class=\"en\"><b>many parents objected.</b></span></div></div><div class=\"lec-sent-ko\">1970년대에 학생들이 휴대용 계산기를 사용하도록 학교가 허락하기 시작했을 때, 많은 학부모들이 반대했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부입니다. 과거의 새로운 기술 도입 사례를 제시하며, 기술 변화에 대한 사람들의 일반적인 거부감을 설명하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when schools began allowing (관계부사): when은 시간을 나타내는 관계부사로, 선행사 &#39;the 1970s&#39;를 수식한다. 뒤에 주어+동사가 갖춰진 완전한 절이 온다.</div><div class=\"lec-gr-item\">allowing students to use 5형식(SVOC) 구조: allow는 5형식 동사로 &#39;allow + 목적어(students) + 목적격보어(to부정사)&#39; 구조를 취한다. to부정사(to use)는 목적격보어 자리에 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">allow</td><td class=\"m\">허용하다</td></tr><tr><td class=\"w\">portable</td><td class=\"m\">휴대용의</td></tr><tr><td class=\"w\">calculator</td><td class=\"m\">계산기</td></tr><tr><td class=\"w\">object</td><td class=\"m\">반대하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 걱정했다</span><span class=\"en\"><b>They worried</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기계들에 대한 의존이</span><span class=\"en\"><b><span class=\"grammar-hl\">that a reliance on the machines</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약화시킬 것이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">would weaken</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 자녀들의 이해력을</span><span class=\"en\"><b>their children’s grasp</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수학적 개념에 대한</span><span class=\"en\"><b>of mathematical concepts.</b></span></div></div><div class=\"lec-sent-ko\">그들은 기계에 대한 의존성이 자녀들의 수학적 개념에 대한 이해력을 약화시킬 것이라고 걱정했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 부모들의 반대 이유를 구체적으로 밝히고 있습니다. &#39;grasp&#39;는 사전적으로 &#39;꽉 잡다&#39;라는 뜻이지만, 여기서는 지식이나 개념을 완전히 &#39;이해하고 파악하는 능력&#39;을 의미합니다. 수학적 개념을 자기 것으로 만드는 힘이 약해질 것을 우려했음을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that a reliance on the machines would weaken (명사절(that절)): worry의 목적어 역할을 하는 명사절로, 완전한 문장을 이끈다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reliance</td><td class=\"m\">의존</td></tr><tr><td class=\"w\">weaken</td><td class=\"m\">약화시키다</td></tr><tr><td class=\"w\">grasp</td><td class=\"m\">이해</td></tr><tr><td class=\"w\">mathematical</td><td class=\"m\">수학의</td></tr><tr><td class=\"w\">concept</td><td class=\"m\">개념</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들의 두려움은,</span><span class=\"en\"><b>Their fears,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">후속 연구들이 보여주었듯이,</span><span class=\"en\"><b><span class=\"grammar-hl\">subsequent studies showed</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대체로 불필요한 것이었다.</span><span class=\"en\"><b>were largely unneeded.</b></span></div></div><div class=\"lec-sent-ko\">그런 우려가 대체로 불필요한 것이었음을 후속 연구가 보여주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 부모들의 걱정이 기우였음을 밝히며, 글의 방향을 &#39;걱정&#39;에서 &#39;실제 결과&#39;로 전환하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">subsequent studies showed (삽입절): 주어(Their fears)와 동사(were) 사이에 문장이 삽입되어 주어의 출처나 근거를 보충한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">subsequent</td><td class=\"m\">그 후의, 차후의</td></tr><tr><td class=\"w\">largely</td><td class=\"m\">대체로, 크게</td></tr><tr><td class=\"w\">unneeded</td><td class=\"m\">불필요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">더 이상 강요받지 않으면서</span><span class=\"en\"><b><span class=\"grammar-hl\">No longer forced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 시간을 쓰도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to spend</span> a lot of time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기계적인 계산에,</span><span class=\"en\"><b>on routine calculations,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 학생들은 얻었다</span><span class=\"en\"><b>many students gained</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 깊은 이해를</span><span class=\"en\"><b>a deeper understanding</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">원리들에 대한</span><span class=\"en\"><b>of the principles</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 연습 문제의 기저에 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">underlying</span> their exercises.</b></span></div></div><div class=\"lec-sent-ko\">더 이상 정해진(기계적인) 계산에 많은 시간을 소모하지 않아도 된 많은 학생들은 그들의 연습 문제에 기반이 되는 원리에 대해 더 깊이 이해하게 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 계산기의 긍정적인 효과를 설명합니다. &#39;routine&#39;은 보통 &#39;일상적인, 지루한&#39;이라는 뜻이지만, 여기서는 사고력이 필요 없는 &#39;단순 반복적인&#39; 작업을 의미합니다. 기계가 지루한 계산을 대신해주었기에, 인간은 더 고차원적인 학습이 가능했다는 논리적 결과를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">No longer forced to spend (분사구문(과거분사)): 원래 절로 변환하면 &#39;Because they were no longer forced to spend...&#39;로, 문맥상 이유를 나타낸다. forced는 수동의 의미를 가진 과거분사구문이다.</div><div class=\"lec-gr-item\">underlying (현재분사(형용사)): underlying이 the principles를 수식하며 &#39;기초가 되는 원리들&#39;이라는 능동적 의미의 동작/상태를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">routine</td><td class=\"m\">일상적인, 반복적인</td></tr><tr><td class=\"w\">calculation</td><td class=\"m\">계산</td></tr><tr><td class=\"w\">principle</td><td class=\"m\">원리</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘날,</span><span class=\"en\"><b>Today,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계산기에 관한 이야기는</span><span class=\"en\"><b>the story of the calculator</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 사용된다</span><span class=\"en\"><b><span class=\"grammar-hl\">is often used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주장을 뒷받침하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to support</span> <span class=\"grammar-hl\">the argument</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 증가하는 의존이</span><span class=\"en\"><b><span class=\"grammar-hl\">that our growing dependence</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온라인 데이터베이스에 대한</span><span class=\"en\"><b><span class=\"grammar-hl\">on online databases</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유익하다는 (주장)</span><span class=\"en\"><b><span class=\"grammar-hl\">is advantageous</span>.</b></span></div></div><div class=\"lec-sent-ko\">오늘날, 계산기에 관한 이 이야기는, 온라인 자료에 대한 증가하는 의존이 도움이 되는(←불리한) 것이라는 주장을 뒷받침하기 위해 종종 사용된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과거의 계산기 사례를 현재의 온라인 데이터베이스(인터넷) 문제로 연결하는 가교 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is often used to support (수동태): be동사(is)+p.p.(used) 구조. use는 타동사(use+O+toV)인데 목적어가 없어서 수동구조 is used 형태로 쓴다. 기본구조: use A to V (A를 V하는 데 사용하다).</div><div class=\"lec-gr-item\">the argument that our growing dependence on online databases is advantageous 동격의 that: 명사(argument) + that절 구조로, that절이 앞 명사(argument)의 내용을 구체화하여 설명한다.</div><div class=\"lec-gr-item\">growing dependence (현재분사(형용사)): growing이 dependence를 수식하며 &#39;커져 가는 의존&#39;이라는 동작/상태를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">calculator</td><td class=\"m\">계산기</td></tr><tr><td class=\"w\">argument</td><td class=\"m\">주장</td></tr><tr><td class=\"w\">dependence</td><td class=\"m\">의존</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리를 자유롭게 함으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">By freeing us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기억하는 일로부터,</span><span class=\"en\"><b><span class=\"grammar-hl\">from the work of remembering</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말해지기를,</span><span class=\"en\"><b>it’s said,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">웹은 우리를 허락한다</span><span class=\"en\"><b>the Web <span class=\"grammar-hl\">allows us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 시간을 쓰도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to devote</span> more time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">창의적인 생각에</span><span class=\"en\"><b>to creative thought.</b></span></div></div><div class=\"lec-sent-ko\">기억하는 일로부터 우리를 자유롭게 함으로써, 인터넷은 우리가 창의적인 생각에 더 많은 시간을 쓰도록 해준다고들 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 온라인 서비스가 인간의 기억이라는 짐을 덜어주어 창의성을 높여줄 것이라는 긍정적인 전망을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">By freeing us from the work of remembering (동명사): 전치사(By)의 목적어로 -ing 형태가 쓰여 명사적 기능을 수행한다.</div><div class=\"lec-gr-item\">allows us to devote 5형식(SVOC) 구조: allow는 &#39;allow + 목적어(us) + 목적격보어(to부정사)&#39; 구조를 취한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">allow</td><td class=\"m\">허용하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">휴대용 계산기는</span><span class=\"en\"><b>The pocket calculator</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">압박을 덜어주었다</span><span class=\"en\"><b>relieved the pressure</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 작업 기억에 대한,</span><span class=\"en\"><b>on our working memory,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 사용하도록 해주면서</span><span class=\"en\"><b><span class=\"grammar-hl\">letting us use</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 중요한 단기 기억 저장소를</span><span class=\"en\"><b>that critical short-term store</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 추상적인 추론을 위해</span><span class=\"en\"><b>for more abstract reasoning.</b></span></div></div><div class=\"lec-sent-ko\">휴대용 계산기는 우리의 작업 기억에 대한 부담을 덜어주었고, 중요한 단기 기억을 더 추상적인 추론에 사용할 수 있도록 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 계산기가 인간의 뇌 구조에 어떻게 기여했는지 과학적으로 분석합니다. &#39;working memory&#39;는 심리학 용어로 정보를 일시적으로 처리하는 능력을 말합니다. 계산기가 이 &#39;작업 기억&#39;의 부담을 덜어줌으로써, 인간은 더 고차원적인 생각을 할 수 있게 되었다는 인과관계를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">letting us use (분사구문(현재분사)): 원래 절로 변환하면 &#39;and it let us use...&#39;로 해석되며 동시동작을 나타낸다. let은 사역동사로 &#39;let + 목적어 + 동사원형(use)&#39; 구조를 취한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">calculator</td><td class=\"m\">계산기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">계산기는,</span><span class=\"en\"><b>The calculator,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강력하지만 매우 전문화된 도구인,</span><span class=\"en\"><b>a powerful but highly specialized tool,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">드러났다</span><span class=\"en\"><b><span class=\"grammar-hl\">turned out to be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도움이 되는 것으로</span><span class=\"en\"><b>an aid</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 작업 기억에</span><span class=\"en\"><b>to our working memory.</b></span></div></div><div class=\"lec-sent-ko\">강력하지만 매우 전문화된 도구인 계산기는 우리의 작업 기억에 도움이 되는 것으로 드러났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글을 마무리하며 계산기의 역할을 &#39;보조 수단(aid)&#39;으로 정의하고, 인간의 인지 능력을 보완하는 기술의 가치를 긍정적으로 평가합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">turned out to be (관용표현): turn out to V는 &#39;~임이 밝혀지다/드러나다&#39;라는 의미의 숙어적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">calculator</td><td class=\"m\">계산기</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과거 학교에서 계산기 도입을 반대했지만, 실제로는 학습에 도움이 되었다.</li><li>계산기는 단순 계산이라는 부담을 덜어주어 학생들이 수학의 원리를 깊이 이해하게 했다.</li><li>이 사례는 오늘날 인터넷 데이터베이스에 의존하는 것이 인간의 창의적 사고에 유익할 수 있다는 주장의 근거가 된다.</li><li>기술은 인간의 기억 부담을 줄여 더 추상적이고 창의적인 사고를 가능하게 하는 보조 도구이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Calculators allow students to move beyond routine calculations to understand deeper principles, while digital tools free our minds for more abstract and creative reasoning.</div>\n              <div class=\"lec-final-sum-ko\">계산기는 학생들이 단순 반복 계산에서 벗어나 더 깊은 원리를 이해하게 해주며, 디지털 도구는 우리의 사고가 더 추상적이고 창의적인 추론을 하도록 돕는다.</div></div></div>"],"segs":[[{"audio":"./passage2_audio/1.mp3","hl":null}],[{"audio":"./passage2_audio/2.mp3","hl":null}],[{"audio":"./passage2_audio/3.mp3","hl":null},{"audio":"./passage2_audio/4.mp3","hl":"stage-0"},{"audio":"./passage2_audio/5.mp3","hl":"stage-1"},{"audio":"./passage2_audio/6.mp3","hl":"stage-2"},{"audio":"./passage2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage2_audio/8.mp3","hl":null}],[{"audio":"./passage2_audio/9.mp3","hl":"main"},{"audio":"./passage2_audio/10.mp3","hl":"meaning"},{"audio":"./passage2_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/12.mp3","hl":"main"},{"audio":"./passage2_audio/13.mp3","hl":"meaning"},{"audio":"./passage2_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/15.mp3","hl":"main"},{"audio":"./passage2_audio/16.mp3","hl":"meaning"},{"audio":"./passage2_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/18.mp3","hl":"main"},{"audio":"./passage2_audio/19.mp3","hl":
