<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5강 reading2 — AI 강의</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"5강 reading2","audioDir":"passage2_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">5강\u003cbr>2번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>What the Calculator Story Says About Our Dependence on the Web\u003c/h1>\u003ch2>계산기 이야기가 웹 의존에 대해 말해 주는 것\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>계산기 도입에 대한 우려와 달리 도구에 대한 \u003cb class=\"key\">의존\u003c/b>은 오히려 학생들의 \u003cb class=\"key\">원리\u003c/b> 이해를 도왔고, 오늘날 이 사례는 웹 의존이 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">기억\u003c/b>의 부담을 덜어 준다는 주장의 근거로 쓰인다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The history of the calculator is used to support the argument that our growing dependence on online databases is advantageous, because tools that take over routine memory work free our working memory for more abstract reasoning.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 계산기와 인터넷을 나란히 놓고 도구에 대한 의존을 어떻게 바라봐야 하는지 다뤄 볼 거예요. 이 지문은 계산기 도입을 둘러싼 학부모의 우려가 후속 연구로 어떻게 뒤집혔는지 보여 주고, 그 이야기를 오늘날 웹에 대한 의존으로 확장합니다. 정리하면 도구에 대한 의존이 오히려 원리 이해를 도왔고, 그 사례가 웹 의존의 이점을 주장하는 근거로 쓰인다는 내용이에요. 그럼 함께 꼼꼼히 읽어 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">작업 기억(working memory)은 정보를 잠시 붙잡아 두는 뇌의 단기 저장소로, 한 번에 담을 수 있는 양이 정해져 있어요. 그래서 암산처럼 기억을 많이 쓰는 일을 하면 정작 중요한 추론에 쓸 여유가 줄어들죠. 계산기나 검색 엔진 같은 도구는 이런 부담을 대신 맡아 주는 인지적 지렛대 역할을 합니다. 예를 들어 요리할 때 재료를 손에 잔뜩 들고 있으면 레시피를 응용할 여유가 없지만, 재료를 도마 위에 올려 두면 새로운 요리를 시도할 수 있는 것과 같은 원리예요. 이렇게 인지 부하(cognitive load)를 줄여 준 도구가 사고력을 떨어뜨리는지 높이는지는 오랫동안 논쟁거리였고, 이 글도 바로 그 논쟁의 연장선에 있습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 작업 기억이라는 개념부터 짚고 갈게요. 작업 기억은 정보를 잠깐 붙잡아 두는 단기 저장소인데, 한 번에 담을 수 있는 양이 정해져 있어요. 그래서 암산처럼 기억을 많이 쓰는 일을 하면 정작 중요한 추론에 쓸 여유가 줄어들죠. 계산기나 검색 엔진은 이런 부담을 대신 맡아 주는 인지적 지렛대 역할을 합니다. 요리할 때 재료를 손에 잔뜩 들고 있으면 레시피를 응용할 여유가 없지만 도마 위에 올려 두면 새로운 시도를 할 수 있는 것과 같은 원리예요. 이렇게 인지 부하를 줄여 주는 도구가 사고력을 떨어뜨리는지 높이는지는 오랫동안 논쟁거리였습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>계산기 등장과 반대\u003csmall>도입·통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>1970년대에 학교가 학생들에게 휴대용 계산기 사용을 허락하기 시작하자 많은 학부모가 반대했어요. 그들은 기계에 대한 \u003cb class=\"key\">의존성\u003c/b>이 자녀들의 수학적 \u003cb class=\"key\">개념\u003c/b>에 대한 이해력을 약화시킬까 봐 걱정했습니다. 당시의 우려는 도구에 대한 \u003cb class=\"key\">불신\u003c/b>에서 비롯된 것이었죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>연구가 뒤집은 우려\u003csmall>반박·근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>그런데 후속 연구는 그 우려가 대체로 \u003cb class=\"key\">불필요\u003c/b>했다는 것을 보여 주었어요. 더 이상 정해진 \u003cb class=\"key\">계산\u003c/b>에 많은 시간을 소모하지 않아도 된 학생들은 오히려 연습 문제에 기반이 되는 \u003cb class=\"key\">원리\u003c/b>를 더 깊이 이해하게 되었습니다. 도구가 사고를 망친 것이 아니라 사고의 재료를 바꿔 준 셈이죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>오늘날의 논쟁으로 확장\u003csmall>전환·주장 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>오늘날 이 계산기 이야기는 온라인 자료에 대한 의존이 이롭다는 \u003cb class=\"key\">주장\u003c/b>을 뒷받침하는 근거로 자주 인용됩니다. 기억하는 일에서 우리를 자유롭게 해 주기 때문에 인터넷이 \u003cb class=\"key\">창의적\u003c/b>인 생각에 더 많은 시간을 쓰게 해 준다는 것이죠. 과거의 사례가 현재의 \u003cb class=\"key\">논쟁\u003c/b>으로 옮겨온 순간입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>작업 기억이라는 열쇠\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>마지막 단계의 열쇠는 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">기억\u003c/b>이라는 개념이에요. 휴대용 계산기는 그 기억에 걸리는 부담을 덜어 주어 중요한 단기 저장소를 더 \u003cb class=\"key\">추상적\u003c/b>인 추론에 사용할 수 있도록 했습니다. 결국 계산기는 강력하지만 매우 전문화된 도구로서 우리 기억을 돕는 \u003cb class=\"key\">조력자\u003c/b>로 드러난 것이죠.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장별로 글의 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 천구백칠십 년대에 학교가 휴대용 계산기 사용을 허락하기 시작하자 많은 학부모가 반대했습니다. 그들은 기계에 대한 의존성이 자녀들의 수학적 개념에 대한 이해력을 약화시킬까 봐 걱정했어요. 당시의 우려는 도구에 대한 불신에서 비롯된 것이었죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서 글은 그 우려를 반박합니다. 후속 연구는 그런 걱정이 대체로 불필요했다는 것을 보여 주었어요. 더 이상 정해진 계산에 많은 시간을 소모하지 않아도 된 학생들은 오히려 연습 문제에 기반이 되는 원리를 더 깊이 이해하게 되었습니다. 도구가 사고를 망친 것이 아니라 사고의 재료를 바꿔 준 셈이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 시선이 오늘날로 넘어갑니다. 이 계산기 이야기는 온라인 자료에 대한 의존이 이롭다는 주장을 뒷받침하는 근거로 자주 인용돼요. 기억하는 일에서 우리를 자유롭게 해 주기 때문에 인터넷이 창의적인 생각에 더 많은 시간을 쓰게 해 준다는 것이죠. 과거의 사례가 현재의 논쟁으로 옮겨온 순간입니다.","hl":"f2"},{"n":7,"text":"마지막 단계의 열쇠는 작업 기억이에요. 휴대용 계산기는 그 기억에 걸리는 부담을 덜어 주어 중요한 단기 저장소를 더 추상적인 추론에 사용할 수 있도록 했습니다. 결국 계산기는 강력하지만 매우 전문화된 도구로서 우리 기억을 돕는 조력자로 드러난 것이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박(사례 유추)\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 우려와 반박이 한 번에 나타나는 \u003cb class=\"key\">통념\u003c/b> 제시 구조예요. 도입부에서 학부모의 반대라는 통념을 내세우고 곧바로 후속 연구라는 \u003cb class=\"key\">근거\u003c/b>로 그것을 뒤집습니다. 이어 계산기 사례를 현재의 웹 의존 논쟁에 유추 적용하고, 마지막에 작업 기억이라는 개념으로 결론을 맺어요. 주제문이 글의 중간인 다섯 번째 문장에 놓여 있으므로 \u003cb class=\"key\">중괄식\u003c/b> 구성으로 판단합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In the 1970s, when (1)\u003c/b>\u003cspan>시간 배경 제시\u003c/span>\u003cb>They worried that (2)\u003c/b>\u003cspan>통념·우려 제시\u003c/span>\u003cb>subsequent studies showed (3)\u003c/b>\u003cspan>통념 반박의 근거\u003c/span>\u003cb>No longer forced to (4)\u003c/b>\u003cspan>결과·변화 표시\u003c/span>\u003cb>Today (5)\u003c/b>\u003cspan>현재로의 전환\u003c/span>\u003cb>it's said (6)\u003c/b>\u003cspan>일반적 주장 인용\u003c/span>\u003cb>turned out to be (8)\u003c/b>\u003cspan>결론·판명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a reliance on the machines\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">our growing dependence on online databases\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the work of remembering\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the pressure on our working memory\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">that critical short-term store\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>학부모의 우려(통념)\u003c/th>\u003cth>후속 연구의 결과(실제)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>계산기 의존이 개념 이해를 약화시킴\u003c/td>\u003ctd>계산기 사용이 원리 이해를 심화시킴\u003c/td>\u003c/tr>\u003ctr>\u003ctd>도구를 사고의 방해물로 봄\u003c/td>\u003ctd>도구를 작업 기억의 조력자로 봄\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식을 보면 통념과 반박이 한 번에 나타나는 구조예요. 도입부에서 학부모의 반대라는 통념을 제시하고, 곧바로 후속 연구라는 근거로 그것을 뒤집습니다. 그리고 그 사례를 현재의 웹 의존 논쟁에 유추로 적용한 뒤 작업 기억이라는 개념으로 마무리하죠. 주제문이 글의 중간인 다섯 번째 문장에 놓여 있으니 중괄식 구성이라고 정리하면 됩니다.","hl":"ty"},{"n":9,"text":"신호어도 눈여겨보세요. 첫 번째 문장의 In the 1970s, when은 시간 배경을 깔아 주고, 두 번째 문장의 They worried that은 우려라는 통념을 엽니다. 세 번째 문장의 subsequent studies showed는 통념을 반박하는 근거 신호이고, 다섯 번째 문장의 Today는 시선을 현재로 돌려요. 또 a reliance on the machines가 our growing dependence on online databases로, the pressure on our working memory가 that critical short-term store로 다시 표현되는 재진술의 흐름을 잡으면 글이 한눈에 들어옵니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>portable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>휴대용의\u003c/span>\u003c/div>\u003cdiv>\u003cb>object\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reliance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의존(성)\u003c/span>\u003c/div>\u003cdiv>\u003cb>weaken\u003c/b>\u003cem>동사\u003c/em>\u003cspan>약화시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grasp\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이해(력)\u003c/span>\u003c/div>\u003cdiv>\u003cb>concept\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개념\u003c/span>\u003c/div>\u003cdiv>\u003cb>subsequent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>그 이후의, 후속의\u003c/span>\u003c/div>\u003cdiv>\u003cb>largely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대체로, 주로\u003c/span>\u003c/div>\u003cdiv>\u003cb>routine\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정해진, 일상적인(기계적인)\u003c/span>\u003c/div>\u003cdiv>\u003cb>calculation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>계산\u003c/span>\u003c/div>\u003cdiv>\u003cb>gain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>얻다, 획득하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>principle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원리\u003c/span>\u003c/div>\u003cdiv>\u003cb>underlying\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기저에 있는, 근본이 되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>support\u003c/b>\u003cem>동사\u003c/em>\u003cspan>뒷받침하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>argument\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주장\u003c/span>\u003c/div>\u003cdiv>\u003cb>dependence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의존\u003c/span>\u003c/div>\u003cdiv>\u003cb>advantageous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유리한, 이로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>free A from B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B로부터 자유롭게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>devote A to B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B에 쏟다, 바치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>creative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>창의적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>relieve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>덜어 주다, 완화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pressure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부담, 압박\u003c/span>\u003c/div>\u003cdiv>\u003cb>working memory\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>작업 기억\u003c/span>\u003c/div>\u003cdiv>\u003cb>critical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한, 결정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>short-term\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>단기의\u003c/span>\u003c/div>\u003cdiv>\u003cb>abstract\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>추상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>reasoning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>추론\u003c/span>\u003c/div>\u003cdiv>\u003cb>specialized\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전문화된\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 드러나다, 판명되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>aid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도움, 조력\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어는 몇 개만 짚을게요. reliance는 의존, grasp는 이해력, underlying은 기저에 있는이라는 뜻이에요. advantageous는 유리하고 이롭다는 의미로, 앞에서 나온 학부모의 우려와 정확히 반대 방향의 평가를 담고 있죠. relieve는 부담을 덜어 주다, reasoning은 추론이라는 뜻으로 마지막 부분의 핵심을 잡아 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">reliance\u003c/b>\u003cspan class=\"m\">의존\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dependence\u003c/span>\u003cspan class=\"s\">trust\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">independence\u003c/span>\u003cspan class=\"a\">self-sufficiency\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">weaken\u003c/b>\u003cspan class=\"m\">약화시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">undermine\u003c/span>\u003cspan class=\"s\">impair\u003c/span>\u003cspan class=\"s\">diminish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">strengthen\u003c/span>\u003cspan class=\"a\">reinforce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">object\u003c/b>\u003cspan class=\"m\">반대하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">oppose\u003c/span>\u003cspan class=\"s\">protest\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">approve\u003c/span>\u003cspan class=\"a\">support\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">advantageous\u003c/b>\u003cspan class=\"m\">이로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">beneficial\u003c/span>\u003cspan class=\"s\">favorable\u003c/span>\u003cspan class=\"s\">helpful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disadvantageous\u003c/span>\u003cspan class=\"a\">harmful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">relieve\u003c/b>\u003cspan class=\"m\">덜어 주다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ease\u003c/span>\u003cspan class=\"s\">alleviate\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">aggravate\u003c/span>\u003cspan class=\"a\">intensify\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gain\u003c/b>\u003cspan class=\"m\">얻다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">forfeit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">critical\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">vital\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">abstract\u003c/b>\u003cspan class=\"m\">추상적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">theoretical\u003c/span>\u003cspan class=\"s\">conceptual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">concrete\u003c/span>\u003cspan class=\"a\">tangible\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘를 동의어와 반의어로 정리해 볼게요. reliance는 dependence와 바꿔 쓸 수 있고 반대말은 independence예요. weaken은 undermine이나 impair로 바꿀 수 있고 반대는 strengthen입니다. advantageous는 beneficial이나 favorable로, relieve는 ease나 alleviate로 바꿔 쓸 수 있어요. critical은 crucial이나 essential과 같은 뜻이고, abstract의 반대말은 concrete예요. 이 짝들은 빈칸 추론에서 그대로 정답의 단서가 되니 꼭 외워 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1970년대에,\u003c/span>\u003cspan class=\"en\">In the 1970s,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교가 학생들이 ...하도록 허락하기 시작했을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">schools \u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">allowing \u003c/span>\u003cspan class=\"tgt\">students \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휴대용 계산기를 사용하도록,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">portable \u003c/span>\u003cspan class=\"tgt\">calculators\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 학부모들이 반대했다.\u003c/span>\u003cspan class=\"en\">many parents objected.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1970년대에 학생들이 휴대용 계산기를 사용하도록 학교가 허락하기 시작했을 때, 많은 학부모들이 반대했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 1970년대에 학교가 휴대용 계산기를 허용하자 학부모들이 반대한 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 제시해요. 이어질 계산기 우려와 연구 결과를 자연스럽게 연결하는 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 만드는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사 when의 계속적 용법\u003c/span> : 선행사 [the 1970s] + when + [완전한 절] : \"학교가 학생들이 휴대용 계산기를 사용하도록 허락하기 시작했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">allow + 목적어 + to부정사(목적격 보어)\u003c/span> : allow [목적어 students] + [to use (to부정사)] : \"학생들이 휴대용 계산기를 사용하도록 허락하는 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"In the 1970s, 1970년대에. when schools began allowing students, 학교가 학생들이 ...하도록 허락하기 시작했을 때. to use portable calculators, 휴대용 계산기를 사용하도록. many parents objected, 많은 학부모들이 반대했다.. 이 문장 전체를 해석하면, 1970년대에 학생들이 휴대용 계산기를 사용하도록 학교가 허락하기 시작했을 때, 많은 학부모들이 반대했다.","hl":"m"},{"n":13,"text":"이 문장은 계산기가 학교에 들어오던 도입 배경을 보여 주고, 학부모들의 반대로 문제 상황을 만들어요.","hl":"mn"},{"n":14,"text":"첫 번째로 when schools began allowing students to use portable calculators에서 when은 앞의 the nineteen seventies를 받아 시간을 설명하는 관계부사예요. 뒤에는 주어와 동사가 갖춰진 완전한 절이 와서 앞의 시간 표현을 꾸며 주죠. 두 번째로 allow는 목적어 students 뒤에 to부정사 to use를 목적격 보어로 취해서 학생들이 계산기를 사용하도록 허락하다라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 걱정했다\u003c/span>\u003cspan class=\"en\">They worried\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기계에 대한 의존이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">reliance \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">machines \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자녀들의 이해력을 약화시킬 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">weaken \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">children's \u003c/span>\u003cspan class=\"tgt\">grasp \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수학적 개념에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">mathematical \u003c/span>\u003cspan class=\"tgt\">concepts\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 기계에 대한 의존성이 자녀들의 수학적 개념에 대한 이해력을 약화시킬 것이라고 걱정했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 학부모들이 반대한 \u003cb class=\"key\">이유\u003c/b>를 구체화하는 문장이에요. 계산기에 \u003cb class=\"key\">의존\u003c/b>하면 수학적 개념에 대한 이해가 약해질 수 있다는 우려를 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : worried + [that + 완전한 절] : \"기계에 대한 의존이 자녀들의 수학적 개념 이해력을 약화시킬 것이라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 on을 동반하는 명사 reliance\u003c/span> : reliance on [목적어] : \"기계에 대한 의존\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 would + 동사원형\u003c/span> : would + [동사원형 weaken] : \"약화시킬 것이라고\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They worried, 그들은 걱정했다. that a reliance on the machines, 기계에 대한 의존이. would weaken their children's grasp, 자녀들의 이해력을 약화시킬 것이라고. of mathematical concepts, 수학적 개념에 대한. 이 문장 전체를 해석하면, 그들은 기계에 대한 의존성이 자녀들의 수학적 개념에 대한 이해력을 약화시킬 것이라고 걱정했다.","hl":"m"},{"n":16,"text":"이 문장은 학부모들이 반대한 이유를 구체화해요. 계산기에 의존하면 수학적 개념에 대한 이해가 약해질 수 있다는 우려를 보여 주죠.","hl":"mn"},{"n":17,"text":"첫 번째로 that은 worried 뒤에서 목적어 역할을 하는 명사절을 이끌어요. 그래서 that절 전체가 걱정했다의 대상이 되죠. 두 번째로 reliance는 전치사 on과 함께 쓰여 '~에 대한 의존'을 나타내요. 세 번째로 would weaken에서 would 뒤에는 동사원형 weaken이 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 두려움은,\u003c/span>\u003cspan class=\"en\">Their fears,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">후속 연구가 보여주었듯이,\u003c/span> nk\">\u003cspan class=\"ko\">창의적인 생각에 더 많은 시간을 쏟도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">devote \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">creative \u003c/span>\u003cspan class=\"tgt\">thought\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기억하는 일로부터 우리를 자유롭게 함으로써, 인터넷은 우리가 창의적인 생각에 더 많은 시간을 쓰도록 해준다고들 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인터넷이 기억을 대신해 주기 때문에 우리가 창의적 사고에 시간을 더 쓸 수 있다는 \u003cb class=\"key\">주장\u003c/b>의 내용을 담은 문장이에요. 앞 문장의 주장을 \u003cb class=\"key\">인용\u003c/b> 형식으로 받아 구체화하고 있죠. by freeing으로 \u003cb class=\"key\">수단\u003c/b>을, allow A to B로 그 결과를 제시하는 구조입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : By + 동명사(~ing) , 주어 + 동사 : \"기억하는 일로부터 우리를 자유롭게 함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가주어 it과 수동태 관용 표현\u003c/span> : It is said (that) + 절 : ~라고들 한다 : \"~라고들 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격보어로 쓰인 to부정사 + devote A to B\u003c/span> : allow + 목적어 + to부정사 / devote + 목적어 + to + 명사 : \"우리가 창의적인 생각에 더 많은 시간을 쏟도록 해준다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"By freeing us from the work of remembering, 기억하는 일로부터 우리를 자유롭게 함으로써. it's said, ~라고들 한다. the Web allows us, 인터넷은 우리가 ~하도록 해준다. to devote more time to creative thought, 창의적인 생각에 더 많은 시간을 쏟도록. 이 문장 전체를 해석하면, 기억하는 일로부터 우리를 자유롭게 함으로써, 인터넷은 우리가 창의적인 생각에 더 많은 시간을 쓰도록 해준다고들 한다.","hl":"m"},{"n":28,"text":"인터넷이 기억을 대신해 주기 때문에 우리가 창의적인 생각에 더 많은 시간을 쓸 수 있다는 주장의 내용을 담은 문장이에요. 앞 문장의 주장을 인용 형식으로 받아서 구체화하고 있죠. by freeing이라는 수단과 allow us to devote라는 결과가 짝을 이루는 구조로 읽으면 됩니다.","hl":"mn"},{"n":29,"text":"첫 번째, By freeing us from the work of remembering에서 by 뒤에 동명사가 오는 표현은 수단을 나타내요. 전치사 뒤라서 free가 동명사 freeing으로 바뀐 형태죠. 두 번째, it's said는 it이 가주어이고 say의 수동태로, 사람들이 말한다는 전언을 표시하는 삽입 표현이에요. 세 번째, allows us to devote에서 allow는 목적격보어로 to부정사를 취하고, devote 뒤의 to는 전치사라서 뒤에 명사 creative thought가 오는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휴대용 계산기는\u003c/span>\u003cspan class=\"en\">The pocket calculator\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부담을 덜어주었고\u003c/span>\u003cspan class=\"en\">relieved the pressure\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 작업 기억에 대한\u003c/span>\u003cspan class=\"en\">on our working memory,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 사용할 수 있도록 하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">letting \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 중요한 단기 기억을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">critical \u003c/span>\u003cspan class=\"tgt\">short-term \u003c/span>\u003cspan class=\"tgt\">store \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 추상적인 추론에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">abstract \u003c/span>\u003cspan class=\"tgt\">reasoning\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">휴대용 계산기는 우리의 작업 기억에 대한 부담을 덜어주었고, 중요한 단기 기억을 더 추상적인 추론에 사용할 수 있도록 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 계산기가 우리 기억에 어떤 도움을 주었는지 설명하는 문장이에요. 작업 기억에 걸리던 부담을 덜어 주어, 그 중요한 단기 기억을 더 추상적인 추론에 쓸 수 있게 했다는 거죠. 앞에서 말한 '계산기 덕분에 개념을 더 깊이 이해했다'는 내용을 기억의 관점에서 다시 풀어 주는 \u003cb class=\"key\">근거\u003c/b> 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사, 결과)\u003c/span> : 주절 + , [letting (~하면서 / ~하게 되면서)] → 주어가 이어서 하는 동작을 [[분사구문]]으로 덧붙임 : \"우리가 그 중요한 단기 기억을 더 추상적인 추론에 사용할 수 있게 하면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 let + 목적어 + 동사원형\u003c/span> : let + [us (목적어)] + [use (동사원형)] → 목적격 보어 자리에 동사원형 : \"우리가 사용하도록 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for (용도·목적)\u003c/span> : use A for B → B에 A를 쓰다 / B를 위해 A를 쓰다 : \"더 추상적인 추론에(쓰기 위해)\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The pocket calculator, 휴대용 계산기는. relieved the pressure, 부담을 덜어주었고. on our working memory, 우리의 작업 기억에 대한. letting us use, 우리가 사용할 수 있도록 하면서. that critical short-term store, 그 중요한 단기 기억을. for more abstract reasoning, 더 추상적인 추론에. 이 문장 전체를 해석하면, 휴대용 계산기는 우리의 작업 기억에 대한 부담을 덜어주었고, 중요한 단기 기억을 더 추상적인 추론에 사용할 수 있도록 했다.","hl":"m"},{"n":31,"text":"이 문장은 계산기가 우리 기억을 어떻게 도왔는지 말하고 있어요. 작업 기억에 걸리던 부담을 덜어 줘서, 그 중요한 단기 기억을 더 추상적인 추론에 쓸 수 있게 해 주었다는 거죠. 앞에서 계산기 덕분에 개념을 더 깊이 이해했다고 했는데, 그 이유를 기억의 관점에서 다시 풀어 주는 근거 문장이에요.","hl":"mn"},{"n":32,"text":"어법 포인트는 세 가지예요. 첫 번째, 콤마 뒤에 나오는 letting은 주절 주어인 The pocket calculator가 이끄는 분사구문이에요. 앞 절의 결과로 일어난 일을 덧붙여 설명하는 결과의 의미로 쓰였죠. 두 번째, letting us use에서 let은 사역동사라서 목적어 us 뒤에 동사원형 use가 옵니다. 목적격 보어 자리에 동사원형이 온다는 점 꼭 기억하세요. 세 번째, for more abstract reasoning의 for는 용도를 나타내는 전치사로, use A for B, 즉 B에 A를 쓰다라는 구조를 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계산기는\u003c/span>\u003cspan class=\"en\">The calculator,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강력하지만 매우 전문화된 도구인데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">powerful \u003c/span>\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">highly \u003c/span>\u003cspan class=\"tgt\">specialized \u003c/span>\u003cspan class=\"tgt\">tool\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~인 것으로 드러났다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">turned \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 작업 기억에 도움이 되는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">aid \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">memory\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">강력하지만 매우 전문화된 도구인 계산기는 우리의 작업 기억에 도움이 되는 것으로 드러났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 계산기가 결국 우리 작업 기억에 도움이 되는 도구였다고 정리하는 문장이에요. 강력하지만 매우 전문화된 도구라는 \u003cb class=\"key\">동격\u003c/b> 표현으로 계산기의 성격을 규정하고, turned out to be로 '결과적으로 밝혀졌다'는 뜻을 전합니다. 다음 내용에서 웹 곧 온라인 데이터베이스도 우리 기억을 도울 수 있다는 주장으로 넘어가는 \u003cb class=\"key\">근거\u003c/b>가 되는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격(콤마로 부연하는 동격어구)\u003c/span> : 명사, [명사구], → 앞 명사를 부연 설명하는 [[동격]] : \"강력하지만 매우 전문화된 도구인데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">turn out + to부정사 (결과)\u003c/span> : turn out [to be + 명사/형용사] → (결과적으로) ~인 것으로 드러나다 : \"~인 것으로 드러났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 to (대상)\u003c/span> : an aid to + 명사 → ~에 대한 도움 / ~에도움이 되는 것 : \"우리의 작업 기억에 도움이 되는 것\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The calculator, 계산기는. a powerful but highly specialized tool, 강력하지만 매우 전문화된 도구인데. turned out to be, ~인 것으로 드러났다. an aid to our working memory, 우리의 작업 기억에 도움이 되는 것. 이 문장 전체를 해석하면, 강력하지만 매우 전문화된 도구인 계산기는 우리의 작업 기억에 도움이 되는 것으로 드러났다.","hl":"m"},{"n":34,"text":"이 문장은 계산기가 결국 우리 작업 기억에 도움이 되는 도구였다고 정리해요. 강력하지만 매우 전문화된 도구라는 표현으로 계산기의 성격을 규정하고, turned out to be로 결과적으로 그렇게 밝혀졌다는 뜻을 전합니다. 다음 내용에서 웹도 우리 기억을 도와줄 수 있다는 주장으로 넘어가는 근거가 되는 문장이에요.","hl":"mn"},{"n":35,"text":"어법 포인트도 세 가지예요. 첫 번째, 콤마 사이에 있는 a powerful but highly specialized tool은 앞의 The calculator를 부연 설명하는 동격 표현이에요. powerful과 specialized가 but으로 연결된 병렬 구조라는 것도 같이 봐 두세요. 두 번째, turned out to be는 turn out 뒤에 to부정사가 붙어서 결과적으로 무엇으로 드러났다는 의미를 만드는 구조예요. 세 번째, an aid to our working memory에서 to는 도움의 대상을 받는 전치사라서 뒤에 명사가 옵니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>1970년대에 학교가 계산기 사용을 허락하자 학부모들은 기계에 대한 \u003cb class=\"key\">의존성\u003c/b>이 자녀의 수학적 개념 이해를 약화시킬까 봐 반대했다.\u003c/li>\u003cli>그러나 후속 연구는 그 우려가 대체로 \u003cb class=\"key\">불필요\u003c/b>했음을 보여 주었고, 학생들은 정해진 계산에서 벗어나 \u003cb class=\"key\">원리\u003c/b>를 더 깊이 이해하게 되었다.\u003c/li>\u003cli>오늘날 이 사례는 온라인 자료에 대한 의존이 \u003cb class=\"key\">이롭다\u003c/b>는 주장을 뒷받침하는 근거로 사용된다.\u003c/li>\u003cli>계산기는 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">기억\u003c/b>의 부담을 덜어 주어 중요한 단기 저장소를 더 \u003cb class=\"key\">추상적\u003c/b>인 추론에 쓸 수 있게 한 조력자였다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The history of the calculator is used to support the argument that our growing dependence on online databases is advantageous, because tools that take over routine memory work free our working memory for more abstract reasoning.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">계산기 도입에 대한 우려와 달리 도구에 대한 \u003cb class=\"key\">의존\u003c/b>은 오히려 학생들의 \u003cb class=\"key\">원리\u003c/b> 이해를 도왔고, 오늘날 이 사례는 웹 의존이 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">기억\u003c/b>의 부담을 덜어 준다는 주장의 근거로 쓰인다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 글의 핵심은 도구에 대한 의존을 무조건 나쁘게 볼 필요가 없다는 거예요. 계산기는 작업 기억의 부담을 덜어 주어 학생들이 원리와 추상적 추론에 집중하게 도왔습니다. 그 이야기가 오늘날 웹에 대한 의존이 이롭다는 주장의 근거로 이어지고 있죠. 마지막으로 여덟 번째 문장, 계산기는 강력하지만 매우 전문화된 도구로서 우리 작업 기억에 도움이 되었다는 문장을 꼭 기억해 주세요. 수고했어요, 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
