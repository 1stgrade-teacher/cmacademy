<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5강 reading1 — AI 강의</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"5강 reading1","audioDir":"passage1_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">5강\u003cbr>1번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Space Garbage: The Hidden Danger in the Night Sky\u003c/h1>\u003ch2>우주 쓰레기: 밤하늘에 숨은 위험\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>밤하늘의 별빛처럼 보이는 것이 사실은 지구 궤도를 도는 \u003cb class=\"key\">우주 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>일 수 있으며, 엄청난 속도로 움직이는 이 쓰레기는 큰 위험을 만든다. 유엔은 위성과 로켓 제작업자들이 \u003cb class=\"key\">규정\u003c/b>을 따르도록 요청하며, 우주는 인간의 쓰레기장이 아니라고 강조한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Space garbage orbiting Earth at high speed is dangerous, so the UN requires satellite and rocket manufacturers to follow regulations and keep space clean.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 밤하늘의 별빛처럼 보이지만 사실은 쓰레기일 수도 있는 우주 쓰레기에 관한 글이에요. 별을 보며 소원을 비는 장면으로 시작해서 우주 쓰레기의 위험, 유엔의 규제, 그리고 우주는 인간의 쓰레기장이 아니라는 주장까지 이어지죠. 요약하면 우주 쓰레기의 위험을 인식하고 규정을 따라야 한다는 내용이고, 요지는 우주를 깨끗하게 지켜야 한다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">지구 둘레를 도는 \u003cb class=\"key\">인공위성\u003c/b>(satellite)과 로켓은 임무를 마치면 부품이나 폐기물을 우주에 남깁니다. 이렇게 인간이 우주에 남긴 물체를 통틀어 \u003cb class=\"key\">우주 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>(space debris, space junk)라고 불러요. 우주 쓰레기는 시속 3만 킬로미터에 가까운 \u003cb class=\"key\">속도\u003c/b>로 움직이기 때문에 작은 나사 하나도 큰 파괴력을 가질 수 있습니다. 이는 고속도로를 달리는 자동차의 유리창이 작은 돌멩이 하나에 깨지는 것과 비슷한 이치예요. 충돌로 생긴 조각이 다시 쓰레기가 되어 위험이 눈덩이처럼 커지기 때문에 국제 사회가 \u003cb class=\"key\">규제\u003c/b>(regulation)에 나선 것입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 임무를 마친 인공위성 satellite이나 로켓은 부품과 폐기물을 우주에 남기게 됩니다. 이렇게 인간이 우주에 남긴 물체를 통틀어 우주 쓰레기, 영어로 space debris 또는 space junk라고 불러요. 이런 쓰레기는 시속 삼만 킬로미터에 가까운 엄청난 속도로 움직이기 때문에 작은 나사 하나도 큰 파괴력을 가질 수 있죠. 고속도로를 달리는 자동차의 유리창이 작은 돌멩이 하나에 깨지는 것과 비슷한 이치예요. 게다가 충돌로 생긴 조각이 다시 쓰레기가 되어 위험이 눈덩이처럼 커지기 때문에 국제 사회가 regulation, 즉 규제에 나선 것입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>별빛인 줄 알았는데\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 별을 보며 소원을 빌 때 조심하라고 말하며 시작해요. 밤하늘에 반짝이는 그 밝은 불빛이 사실은 \u003cb class=\"key\">별\u003c/b>이 아니라 \u003cb class=\"key\">쓰레기\u003c/b>일지도 모른다는 뜻이죠. 독자의 상식을 뒤집는 \u003cb class=\"key\">반전\u003c/b>으로 흥미를 끄는 도입부입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>우주 쓰레기의 실체\u003csmall>예시·근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>지구 궤도에는 수천 개의 \u003cb class=\"key\">우주 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>가 돌고 있어요. 로켓의 크고 작은 금속 부품, 고장 난 위성, 심지어 우주비행사의 장갑까지 그 정체는 다양하죠. 게다가 시속 3만 킬로미터에 가까운 \u003cb class=\"key\">속도\u003c/b>로 움직이기 때문에 작은 조각 하나도 진로를 방해하는 모든 것을 파괴할 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>유엔의 규정 요청\u003csmall>해결 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>문제와 위험성을 \u003cb class=\"key\">인식\u003c/b>한 유엔은 위성과 로켓 제작업자들에게 규정을 따르라고 요청했어요. 규정에는 설계상의 제한과 새로운 과학기술의 추가가 \u003cb class=\"key\">포함\u003c/b>됩니다. 이제 위성과 로켓은 더 적고 단순한 부품으로 만들어야 하고, 임무를 마치면 지구로 \u003cb class=\"key\">귀환\u003c/b>해야 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>우주는 쓰레기장이 아니다\u003csmall>결론·주장 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>디자인을 바꾸고 기술을 더하는 데 많은 \u003cb class=\"key\">비용\u003c/b>이 들겠지만 누구도 불평해서는 안 된다고 글은 말해요. 결국 우주는 인간의 \u003cb class=\"key\">쓰레기장\u003c/b>이 아니라는 것이 글쓴이의 핵심 주장입니다. 비용보다 중요한 \u003cb class=\"key\">환경\u003c/b> 책임을 강조하며 글을 맺고 있어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"글은 별을 보며 소원을 빌 때는 조심하라고 말하며 시작해요. 밤하늘에 반짝이는 그 밝은 불빛이 별이 아니라 쓰레기일지도 모른다는 것이죠. 독자가 가진 상식을 뒤집는 반전으로 흥미를 끄는 도입부입니다.","hl":"f0"},{"n":5,"text":"이어서 지구 궤도에는 수천 개의 우주 쓰레기가 돌고 있다는 사실이 나와요. 로켓의 크고 작은 금속 부품, 고장 난 위성, 심지어 우주비행사의 장갑까지 그 정체가 다양하죠. 게다가 시속 삼만 킬로미터에 가까운 속도로 움직이기 때문에 작은 조각 하나도 진로를 방해하는 모든 것을 파괴할 수 있다고 합니다.","hl":"f1"},{"n":6,"text":"문제와 위험성을 인식한 유엔은 위성과 로켓 제작업자들에게 규정을 따라 줄 것을 요청했어요. 규정에는 설계상의 제한과 새로운 과학기술의 추가가 포함됩니다. 이제 위성과 로켓은 더 적고 단순한 부품으로 만들어야 하고, 임무를 다하면 지구로 귀환해야 하죠.","hl":"f2"},{"n":7,"text":"마지막으로 디자인을 바꾸고 기술을 더하는 데 많은 비용이 들겠지만 누구도 불평해서는 안 된다고 말해요. 결국 우주는 인간의 쓰레기장이 아니라는 것이 글쓴이의 핵심 주장입니다. 비용보다 중요한 환경 책임을 강조하며 글을 맺고 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 별을 보며 소원을 빈다는 \u003cb class=\"key\">통념\u003c/b>에서 출발해 밤하늘의 빛이 쓰레기일 수 있다는 사실을 제시해요. 이어 우주 쓰레기의 예시와 위험을 \u003cb class=\"key\">근거\u003c/b>로 보여 준 뒤 유엔의 규정이라는 \u003cb class=\"key\">해결책\u003c/b>을 내놓죠. 마지막 문장에서 우주는 인간의 쓰레기장이 아니라는 주장을 제시하므로 핵심이 끝에 오는 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>actually (2)\u003c/b>\u003cspan>통념 반박\u003c/span>\u003cb>even (5)\u003c/b>\u003cspan>극단적 예 강조\u003c/span>\u003cb>Recognizing (6)\u003c/b>\u003cspan>문제 인식에서 해결로 전환\u003c/span>\u003cb>but (9)\u003c/b>\u003cspan>양보 뒤 주장 제시\u003c/span>\u003cb>not (10)\u003c/b>\u003cspan>부정을 통한 주장 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Those bright lights twinkling in the night sky\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">garbage\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">&quot;space garbage&quot;\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this garbage\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a small piece of garbage\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a garbage dump\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결의 전개 방식을 따릅니다. 앞부분에서 우주 쓰레기라는 문제를 제시하고, 뒤에서 유엔의 규정이라는 해결책을 내놓죠. 글쓴이의 주장이 마지막 문장에 나오기 때문에 미괄식 구조라고 볼 수 있어요. 그래서 결론 문장을 읽을 때 글쓴이가 무엇을 요구하는지 확인하는 것이 중요합니다.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 두 번째 문장의 actually는 독자가 기대하는 것과 반대되는 사실을 알려 주는 신호예요. 다섯 번째 문장의 even은 우주비행사의 장갑이라는 극단적인 예를 강조하죠. 여섯 번째 문장의 Recognizing은 문제 인식에서 해결로 넘어가는 전환점이고, 아홉 번째 문장의 but은 비용이라는 양보 뒤에 주장을 붙이는 역할을 합니다. 또한 마지막 문장은 not을 써서 우주는 쓰레기장이 아니라고 부정의 형태로 주장을 강하게 남기고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>be careful\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>조심하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wish upon a star\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>별을 보며 소원을 빌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>twinkle\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반짝이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>garbage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰레기\u003c/span>\u003c/div>\u003cdiv>\u003cb>thousands of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>수천의\u003c/span>\u003c/div>\u003cdiv>\u003cb>piece\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조각, 개\u003c/span>\u003c/div>\u003cdiv>\u003cb>orbit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>궤도를 돌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>broken-down\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고장 난\u003c/span>\u003c/div>\u003cdiv>\u003cb>satellite\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위성\u003c/span>\u003c/div>\u003cdiv>\u003cb>astronaut\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우주비행사\u003c/span>\u003c/div>\u003cdiv>\u003cb>travel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이동하다, 움직이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>per\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~당\u003c/span>\u003c/div>\u003cdiv>\u003cb>destroy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>파괴하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>get in one's way\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 진로를 방해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recognize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>danger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위험\u003c/span>\u003c/div>\u003cdiv>\u003cb>request\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요청하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>manufacturer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제조업자\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(규정을) 따르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>regulation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>규정\u003c/span>\u003c/div>\u003cdiv>\u003cb>include\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>limit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제한\u003c/span>\u003c/div>\u003cdiv>\u003cb>design\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설계, 디자인\u003c/span>\u003c/div>\u003cdiv>\u003cb>technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>simple\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>단순한\u003c/span>\u003c/div>\u003cdiv>\u003cb>complete\u003c/b>\u003cem>동사\u003c/em>\u003cspan>완수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cost\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비용이 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>complain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>불평하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dump\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰레기장\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚을게요. garbage는 쓰레기, orbit은 궤도를 돌다, destroy는 파괴하다라는 뜻이에요. recognize는 인식하다, regulation은 규정, complain은 불평하다로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">garbage\u003c/b>\u003cspan class=\"m\">쓰레기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trash\u003c/span>\u003cspan class=\"s\">waste\u003c/span>\u003cspan class=\"s\">rubbish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">destroy\u003c/b>\u003cspan class=\"m\">파괴하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ruin\u003c/span>\u003cspan class=\"s\">wreck\u003c/span>\u003cspan class=\"s\">damage\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">build\u003c/span>\u003cspan class=\"a\">create\u003c/span>\u003cspan class=\"a\">protect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">danger\u003c/b>\u003cspan class=\"m\">위험\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">risk\u003c/span>\u003cspan class=\"s\">hazard\u003c/span>\u003cspan class=\"s\">threat\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safety\u003c/span>\u003cspan class=\"a\">security\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">recognize\u003c/b>\u003cspan class=\"m\">인식하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">realize\u003c/span>\u003cspan class=\"s\">acknowledge\u003c/span>\u003cspan class=\"s\">identify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">request\u003c/b>\u003cspan class=\"m\">요청하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ask\u003c/span>\u003cspan class=\"s\">demand\u003c/span>\u003cspan class=\"s\">urge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">follow\u003c/b>\u003cspan class=\"m\">따르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">obey\u003c/span>\u003cspan class=\"s\">observe\u003c/span>\u003cspan class=\"s\">comply with\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">violate\u003c/span>\u003cspan class=\"a\">disobey\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">complain\u003c/b>\u003cspan class=\"m\">불평하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">grumble\u003c/span>\u003cspan class=\"s\">object\u003c/span>\u003cspan class=\"s\">protest\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accept\u003c/span>\u003cspan class=\"a\">praise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">simple\u003c/b>\u003cspan class=\"m\">단순한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">easy\u003c/span>\u003cspan class=\"s\">plain\u003c/span>\u003cspan class=\"s\">basic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">complex\u003c/span>\u003cspan class=\"a\">complicated\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. destroy는 ruin, wreck과 뜻이 비슷하고 build, protect와는 반대돼요. danger는 risk, hazard와 가깝고 safety와는 반대되는 말이죠. recognize는 realize, acknowledge로 바꿔 쓸 수 있고 ignore, overlook과는 반대입니다. follow는 obey, comply with와 비슷하고 violate, disobey와는 반대라는 점도 기억해 주세요. complain은 grumble, protest와 가깝고 accept와는 반대됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조심하도록 하라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Be \u003c/span>\u003cspan class=\"tgt\">careful\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음에 …할 때는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네가 별을 보며 소원을 빌\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">wish \u003c/span>\u003cspan class=\"tgt\">upon \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">star\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다음에 별을 보며 소원을 빌 때는 조심하도록 하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 첫 문장으로, 별을 보며 소원을 비는 익숙한 장면을 불러와 독자의 \u003cb class=\"key\">주의\u003c/b>를 끄는 명령문이다. 왜 조심해야 하는지 밝히지 않아 궁금증을 만들고, 뒤에 나올 \u003cb class=\"key\">우주 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b> 이야기를 위한 \u003cb class=\"key\">복선\u003c/b>을 깔아 놓는다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형 Be] + [형용사 careful] (주어 You 생략) : \"조심하도록 하라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간의 부사절을 이끄는 the next time\u003c/span> : the next time + [주어 you + 동사 wish] (~하는 다음번에는) : \"다음에 네가 별을 보며 소원을 빌 때는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Be careful, 조심하도록 하라. the next time, 다음에 …할 때는. you wish upon a star, 네가 별을 보며 소원을 빌. 이 문장 전체를 해석하면, 다음에 별을 보며 소원을 빌 때는 조심하도록 하라.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 문장으로, 별을 보며 소원을 비는 익숙한 장면을 불러와요. 그런데 조심하라고 주의를 주니까 독자는 왜 그러지 하고 궁금해하죠. 뒤에 나올 우주 쓰레기 이야기를 미리 깔아 두는 복선이라고 보면 됩니다.","hl":"mn"},{"n":14,"text":"먼저 Be careful은 주어 You를 생략한 명령문이에요. 동사원형으로 시작하면 명령문이라고 기억해 두세요. 두 번째로 the next time 뒤에 you wish upon a star처럼 주어와 동사가 이어지면 접속사처럼 '~할 때'라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 밝은 불빛들은\u003c/span>\u003cspan class=\"en\">Those bright lights\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밤하늘에 반짝이는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">twinkling \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">night \u003c/span>\u003cspan class=\"tgt\">sky\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로 쓰레기일지도 모른다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">actually \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">garbage\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">별이 아니라!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">stars\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">밤하늘에 반짝이는 그 밝은 불빛이 별이 아니라 쓰레기일지도 모른다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장이 만든 궁금증을 곧바로 반전으로 이어 가는 문장이다. 밤하늘의 \u003cb class=\"key\">밝은 \u003c/b>\u003cb class=\"key\">불빛\u003c/b>이 별이 아니라 \u003cb class=\"key\">쓰레기\u003c/b>일 수 있다고 말하며 글의 주제를 던진다. may와 not stars를 써서 \u003cb class=\"key\">단정\u003c/b>하지 않으면서도 충격적인 정보를 전달한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 용법(명사 수식)\u003c/span> : [명사 Those bright lights] + [현재분사구 twinkling in the night sky] : \"밤하늘에 반짝이는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 may + 동사원형(추측)\u003c/span> : [조동사 may] + [부사 actually] + [동사원형 be] + [보어 garbage] : \"실제로 쓰레기일지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정어를 이용한 보충 설명\u003c/span> : [보어 garbage], + [not + 보어 stars] (앞말을 부정하며 다시 설명) : \"별이 아니라\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Those bright lights, 그 밝은 불빛들은. twinkling in the night sky, 밤하늘에 반짝이는. may actually be garbage, 실제로 쓰레기일지도 모른다. not stars!, 별이 아니라!. 이 문장 전체를 해석하면, 밤하늘에 반짝이는 그 밝은 불빛이 별이 아니라 쓰레기일지도 모른다!","hl":"m"},{"n":16,"text":"이 문장은 앞 문장에서 던진 궁금증을 곧바로 반전으로 이어 가요. 밤하늘의 밝은 불빛이 별이 아니라 쓰레기일 수도 있다고 말하면서 글의 주제를 던지는 거죠. may와 not stars를 써서 단정하지 않으면서도 충격적인 정보를 전달합니다.","hl":"mn"},{"n":17,"text":"먼저 twinkling in the night sky는 앞에 있는 Those bright lights를 꾸미는 현재분사예요. 반짝이고 있는, 이렇게 능동의 의미로 명사를 수식하죠. 다음으로 may actually be garbage에서 may는 ~일지도 모른다라는 추측이고 뒤에는 반드시 동사원형이 옵니다. 마지막으로 not stars는 앞의 garbage와 대조되는 말을 붙여 별이 아니라는 부정의 느낌을 강조하는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수천 개의 조각이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">thousands \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">pieces \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“우주 쓰레기”의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">&quot;space \u003c/span>\u003cspan class=\"tgt\">garbage&quot;\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구 궤도를 돌고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">orbiting \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Earth\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수천 개의 “우주 쓰레기”가 지구 궤도를 돌고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 추측을 구체적인 사실로 바꿔 주는 문장이다. 지구 주위에 수천 개의 \u003cb class=\"key\">우주 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>가 실제로 돌고 있음을 알려 주며 글의 \u003cb class=\"key\">주제\u003c/b>를 분명히 세운다. 막연한 느낌이 아니라 셀 수 있는 \u003cb class=\"key\">근거\u003c/b>를 제시해 설득력을 높인다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(유도부사)\u003c/span> : There + [be동사] + [주어] (~이 있다) : \"~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현(thousands of + 복수명사)\u003c/span> : [thousands of] + [복수명사 pieces] + [of + 명사] : \"수천 개의 우주 쓰레기 조각\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 용법(후치 수식)\u003c/span> : [명사 pieces] + [현재분사구 orbiting the Earth] : \"지구 궤도를 돌고 있는\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"There are, ~이 있다. thousands of pieces, 수천 개의 조각이. of \"space garbage\", “우주 쓰레기”의. orbiting the Earth, 지구 궤도를 돌고 있는. 이 문장 전체를 해석하면, 수천 개의 “우주 쓰레기”가 지구 궤도를 돌고 있다.","hl":"m"},{"n":19,"text":"이 문장은 앞 문장의 추측을 구체적인 사실로 바꿔 주는 역할을 해요. 지구 주위에 수천 개의 우주 쓰레기가 실제로 돌고 있다는 걸 알려 주면서 글의 주제를 분명히 세우죠. 막연한 느낌이 아니라 셀 수 있는 근거를 제시해서 설득력을 높여 줍니다.","hl":"mn"},{"n":20,"text":"먼저 There are는 무엇이 존재한다는 걸 처음 소개하는 유도부사 구문이에요. 뒤에 오는 주어가 복수라서 are를 쓴다는 점도 챙겨 두세요. 다음으로 thousands of pieces of space garbage는 수량 표현으로, thousands of 뒤에는 복수명사가 옵니다. 마지막으로 orbiting the Earth는 앞의 pieces를 뒤에서 꾸며 주는 현재분사로, 지구 궤도를 돌고 있는이라는 진행의 의미를 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 쓰레기의 예들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Examples \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">garbage \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로켓에서 나온 크고 작은 금속 부품이고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">are\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">metal \u003c/span>\u003cspan class=\"tgt\">parts \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">rockets, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고장난 위성,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">broken-down \u003c/span>\u003cspan class=\"tgt\">satellites, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 심지어 우주비행사의 장갑입니다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">astronaut's \u003c/span>\u003cspan class=\"tgt\">glove\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우주 쓰레기가 되는 것들에는 로켓의 크고 작은 금속 부품, 고장난 위성, 심지어 우주비행사들의 장갑도 있다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 \u003cb class=\"key\">우주 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>가 구체적으로 무엇인지 예를 들어 보여 주는 문장이에요. 로켓 부품, 고장 난 위성, 심지어 우주비행사의 장갑까지 다양한 물건이 지구 둘레를 돈다는 \u003cb class=\"key\">예시\u003c/b>를 제시하죠. 낯선 개념을 구체적인 사례로 풀어 주어 독자가 'space garbage'를 쉽게 \u003cb class=\"key\">이해\u003c/b>하도록 도와줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : [Examples (복수 주어)] + [are (복수 동사)] : \"이 쓰레기의 예들은 …이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조(A, B, and C)\u003c/span> : [A], [B], and [C] : \"로켓의 크고 작은 금속 부품, 고장난 위성, 심지어 우주비행사의 장갑\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(복합 형용사)\u003c/span> : [broken-down (과거분사)] + [satellites (명사)] : \"고장 난 위성\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Examples of this garbage, 이 쓰레기의 예들은. are big and small metal parts from rockets, 로켓에서 나온 크고 작은 금속 부품이고. broken-down satellites, 고장난 위성. and even an astronaut's glove!, 그리고 심지어 우주비행사의 장갑입니다!. 이 문장 전체를 해석하면, 우주 쓰레기가 되는 것들에는 로켓의 크고 작은 금속 부품, 고장난 위성, 심지어 우주비행사들의 장갑도 있다!","hl":"m"},{"n":22,"text":"이 문장은 앞에서 말한 space garbage가 구체적으로 무엇인지 예를 들어 주는 역할을 해요. 로켓의 금속 부품, 고장 난 위성, 심지어 우주비행사의 장갑까지 생각보다 다양한 물건이 우주를 떠돌고 있다는 걸 보여 주죠. 낯선 개념을 구체적인 예시로 풀어 주니까 독자가 훨씬 쉽게 이해할 수 있어요.","hl":"mn"},{"n":23,"text":"첫 번째로 Examples of this garbage are를 보면 주어 Examples가 복수라서 동사가 are로 수 일치를 했어요. 두 번째로 broken-down satellites에서 broken-down은 과거분사가 형용사처럼 명사를 꾸미는 형태로, 수동의 의미인 고장 난이라는 뜻이 돼요. 세 번째로 big and small metal parts from rockets, broken-down satellites, and even an astronaut's glove가 A, B, and C로 병렬 연결된 구조예요. 로켓에서 나온 부품, 위성, 장갑 이렇게 세 덩어리가 are의 보어로 나란히 놓인 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 시속 30,000km로 움직이기 때문에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Traveling \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">almost \u003c/span>\u003cspan class=\"tgt\">30,000 \u003c/span>\u003cspan class=\"tgt\">km \u003c/span>\u003cspan class=\"tgt\">per \u003c/span>\u003cspan class=\"tgt\">hour\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 쓰레기 조각이라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">piece \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">garbage\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇이든 파괴할 수 있다\u003c/span>\u003cspan class=\"en\">can destroy \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">anything \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 진로를 방해하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">gets \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">way\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">거의 시속 30,000km로 움직이기 때문에, 작은 쓰레기 조각이라도 자신의 진로를 방해하는 것이면 뭐든 파괴할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주 쓰레기가 위험한 이유를 \u003cb class=\"key\">속도\u003c/b>로 설명하는 문장이에요. 시속 삼만 킬로미터라는 엄청난 \u003cb class=\"key\">속도\u003c/b> 때문에 작은 조각 하나도 앞을 막는 물체를 \u003cb class=\"key\">파괴\u003c/b>할 수 있다는 것이죠. '작은 조각'과 '무엇이든 파괴'라는 결과를 맞세워 위험성을 \u003cb class=\"key\">강조\u003c/b>하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사, 이유)\u003c/span> : [Traveling ~ (분사구문)] , [주절] : \"거의 시속 30,000km로 움직이기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">강조 부사 even\u003c/span> : [even] + [명사구] : \"작은 쓰레기 조각조차도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 that(제한적 용법)\u003c/span> : [선행사 anything] + [that + 주어 + 동사] : \"자신의 진로를 방해하는 무엇이든\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Traveling at almost 30,000 km per hour, 거의 시속 30,000km로 움직이기 때문에. even a small piece of garbage, 작은 쓰레기 조각이라도. can destroy anything, 무엇이든 파괴할 수 있다. that gets in its way, 자신의 진로를 방해하는. 이 문장 전체를 해석하면, 거의 시속 30,000km로 움직이기 때문에, 작은 쓰레기 조각이라도 자신의 진로를 방해하는 것이면 뭐든 파괴할 수 있다.","hl":"m"},{"n":25,"text":"이 문장은 우주 쓰레기가 왜 위험한지를 속도로 설명해요. 시속 삼만 킬로미터라는 어마어마한 속도로 돌기 때문에 작은 조각 하나도 앞을 막는 물체를 파괴할 수 있다는 거죠. 작은 조각과 무엇이든 파괴라는 결과를 맞세워서 위험성을 강조하고 있어요.","hl":"mn"},{"n":26,"text":"먼저 Traveling at almost thirty thousand kilometers per hour는 분사구문이에요. 주어인 a small piece of garbage가 스스로 움직이는 능동 관계라서 현재분사 Traveling으로 시작했고, 여기서는 이유의 의미로 쓰였어요. 두 번째로 anything that gets in its way에서 선행사가 anything처럼 부정을 뜻하는 말이면 관계대명사는 that을 써요. that절이 anything을 한정해서 자신의 진로를 방해하는 무엇이든이라는 뜻이 되죠. 그리고 even은 조차라는 강조 부사로, 작은 조각이라도 위험하다는 점을 강조하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문제와 위험성을 인식한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Recognizing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">problem \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">danger\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“우주 쓰레기”의\u003c/span>\u003cspan class=\"en\">of &quot;space garbage,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유엔은 요청했다\u003c/span>\u003cspan class=\"en\">the United Nations \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">requested\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위성과 로켓 제작업자들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">satellite \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">rocket \u003c/span>\u003cspan class=\"tgt\">manufacturers \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">규정을 따를 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">follow \u003c/span>\u003cspan class=\"tgt\">regulations\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“우주 쓰레기”의 문제와 그 위험성을 인식한 유엔은 위성과 로켓을 만드는 제작업자들이 (제작상의 규제에 관한) 규정에 따라줄 것을 요청했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 위험을 깨달은 \u003cb class=\"key\">유엔\u003c/b>이 직접 나서서 제작자들에게 규정을 지키라고 \u003cb class=\"key\">요청\u003c/b>한 문장이에요. 앞 문장까지가 문제와 위험 설명이었다면, 여기서부터는 해결을 위한 움직임으로 글의 흐름이 \u003cb class=\"key\">전환\u003c/b>되는 지점이죠. 여기서 말한 regulations의 구체적인 내용이 바로 다음 문장들에 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사, 이유)\u003c/span> : [Recognizing ~ (분사구문)] , [주절] : \"문제와 위험성을 인식했기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료(have/has + 과거분사)\u003c/span> : [has] + [requested (과거분사)] : \"요청해 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">요청·제안 동사의 that절에 (should) + 동사원형\u003c/span> : [request] + that + [주어] + [(should) + 동사원형] : \"위성과 로켓 제작업자들이 규정을 따를 것을\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Recognizing the problem and danger, 문제와 위험성을 인식한. of \"space garbage,\", “우주 쓰레기”의. the United Nations has requested, 유엔은 요청했다. that satellite and rocket manufacturers, 위성과 로켓 제작업자들이. follow regulations, 규정을 따를 것을. 이 문장 전체를 해석하면, “우주 쓰레기”의 문제와 그 위험성을 인식한 유엔은 위성과 로켓을 만드는 제작업자들이 (제작상의 규제에 관한) 규정에 따라줄 것을 요청했다.","hl":"m"},{"n":28,"text":"앞 문장까지 우주 쓰레기의 위험을 설명했다면, 이 문장은 그 문제를 인식한 유엔이 실제로 행동에 나섰다는 내용이에요. 제작자들에게 규정을 따르라고 요청했다는 거죠. 위험 설명에서 해결을 위한 움직임으로 글의 흐름이 전환되는 지점이고, 여기서 말한 규정의 내용이 바로 다음 문장들에 나와요.","hl":"mn"},{"n":29,"text":"첫 번째로 Recognizing the problem and danger는 분사구문이에요. 주어인 the United Nations가 인식하는 능동 관계라서 현재분사 Recognizing으로 시작했고, 이유의 의미를 담고 있어요. 두 번째로 has requested는 현재완료인데, 과거의 요청이 지금까지 이어지거나 현재 결과로 남아 있다는 걸 보여 줘요. 주어가 단수인 the United Nations라서 has를 썼죠. 세 번째로 has requested that satellite and rocket manufacturers follow regulations에서 request는 요청의 동사라서 that절 안에 should가 생략되고 동사원형 follow가 왔어요. 주어가 복수여도 follows가 아니라 동사원형을 쓴다는 점이 시험에 잘 나와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것들은 포함한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">These\u003c/span> include\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디자인상의 제한을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">limits \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">designs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 몇 가지 추가를\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">additions \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 과학기술의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">technology\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 규정에는 디자인상의 제한과 몇 가지 추가적인 과학기술이 포함된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 \u003cb class=\"key\">규정\u003c/b>이 구체적으로 무엇을 담고 있는지 알려 주는 문장이에요. These가 바로 그 규정들, 즉 \u003cb class=\"key\">regulations\u003c/b>를 가리키고, 규정에는 디자인 제한과 새로운 기술의 추가가 들어 있다는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 These의 문맥 지칭\u003c/span> : These + [복수 동사 include] + [복수 명사] : \"이것들은 (앞 문장의 규정들을 가리킴)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 on의 용법(대상)\u003c/span> : [명사 limits] + on + [명사 designs] : \"디자인상의 제한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">of 전치사구의 수식 관계\u003c/span> : [명사 additions] + of + [명사 new technology] : \"새로운 과학기술의 몇 가지 추가\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"These include, 이것들은 포함한다. limits on designs, 디자인상의 제한을. and some additions, 그리고 몇 가지 추가를. of new technology, 새로운 과학기술의. 이 문장 전체를 해석하면, 이 규정에는 디자인상의 제한과 몇 가지 추가적인 과학기술이 포함된다.","hl":"m"},{"n":31,"text":"여기서 These가 무엇을 가리키는지가 핵심이에요. 바로 앞 문장에 나온 regulations, 그러니까 규정들이죠. 그 규정 안에 디자인 제한과 새로운 기술의 추가가 들어 있다는 것을 알려 주는 문장이에요.","hl":"mn"},{"n":32,"text":"첫 번째, These는 앞 문장의 복수 명사 regulations를 받는 지시대명사예요. 두 번째, limits on designs에서 on은 무엇에 대한이라는 대상을 나타내는 전치사죠. 세 번째, additions of new technology에서 of는 앞 명사를 뒤에서 설명하는 수식 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위성과 로켓은\u003c/span>\u003cspan class=\"en\">Satellites and rockets\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제 제작되어야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">made\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 적고 더 단순한 부품으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">fewer \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">simpler \u003c/span>\u003cspan class=\"tgt\">parts\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것들은 지구로 돌아와야 한다\u003c/span>\u003cspan class=\"en\">and they must return to earth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">임무를 다 완수하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">complete \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">jobs\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제 위성과 로켓은 더 적은 수의 더 단순한 부품으로 제작되어야 하며, 임무를 다 수행하면 지구로 돌아와야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 규정의 실제 내용을 풀어 주는 문장이에요. 부품을 \u003cb class=\"key\">단순화\u003c/b>하고 임무가 끝나면 \u003cb class=\"key\">지구로 \u003c/b>\u003cb class=\"key\">귀환\u003c/b>하게 하라는, 우주 쓰레기를 줄이기 위한 구체적인 실천 지침이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 must + 수동태\u003c/span> : [주어] + must + be + [과거분사 made] : \"반드시 제작되어야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 형용사의 병렬\u003c/span> : [비교급 형용사] and [비교급 형용사] + [명사] : \"더 적고 더 단순한 부품으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간 부사절 접속사 when\u003c/span> : [주절] + when + [주어 + 동사] : \"그들이 임무를 완수할 때\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Satellites and rockets, 위성과 로켓은. must now be made, 이제 제작되어야 한다. with fewer and simpler parts, 더 적고 더 단순한 부품으로. and they must return to earth, 그리고 그것들은 지구로 돌아와야 한다. when they complete their jobs, 임무를 다 완수하면. 이 문장 전체를 해석하면, 이제 위성과 로켓은 더 적은 수의 더 단순한 부품으로 제작되어야 하며, 임무를 다 수행하면 지구로 돌아와야 한다.","hl":"m"},{"n":34,"text":"이 문장은 앞에서 말한 규정의 실제 내용을 풀어 줘요. 부품을 단순화하고, 임무가 끝나면 지구로 귀환하게 하라는 구체적인 실천 지침이죠. 우주 쓰레기를 줄이기 위해 만든 규정이라고 이해하면 됩니다.","hl":"mn"},{"n":35,"text":"첫 번째, must now be made는 조동사 must 뒤에 수동태 be made가 온 형태예요. 두 번째, with fewer and simpler parts는 비교급 병렬로 두 형용사가 parts를 함께 꾸며 주죠. 세 번째, when they complete their jobs에서 when은 시간 부사절을 이끌어서 지구로 돌아오는 시점을 알려 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디자인을 변경하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Changing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">design \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 더 많은 기술을 추가하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">adding \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">technologies\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 비용이 들게 할 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">cost \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 누구도 불평해서는 안 된다\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">complain\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">디자인을 변경하는 것과 기술을 더 추가하는 것이 더 많은 비용을 들게 하겠지만, 누구도 불평해서는 안 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 규정을 지키는 데 \u003cb class=\"key\">비용\u003c/b>이 많이 든다는 점을 인정하면서도, 그래도 해야 한다는 태도를 보여 주는 문장이에요. 우주를 쓰레기장으로 만들지 않기 위해서는 누구도 불평할 수 없다는 뜻으로, 글의 \u003cb class=\"key\">결론\u003c/b>을 강하게 맺어 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어의 병렬\u003c/span> : [동명사구 A] and [동명사구 B] + [단수 동사] : \"디자인을 변경하는 것과 더 많은 기술을 추가하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사 cost의 용법\u003c/span> : [주어] + cost + [금액] (사람 + 금액도 가능) : \"많은 비용이 들게 할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정어 주어 + 조동사 should\u003c/span> : no one + should + [동사원형] : \"누구도 불평해서는 안 된다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Changing the design, 디자인을 변경하는 것은. and adding more technologies, 그리고 더 많은 기술을 추가하는 것은. will cost a lot of money, 많은 비용이 들게 할 것이다. but no one should complain, 그러나 누구도 불평해서는 안 된다. 이 문장 전체를 해석하면, 디자인을 변경하는 것과 기술을 더 추가하는 것이 더 많은 비용을 들게 하겠지만, 누구도 불평해서는 안 된다.","hl":"m"},{"n":37,"text":"이 문장은 규정을 지키는 데 비용이 많이 든다는 점을 솔직하게 인정해요. 그런데도 우주를 쓰레기장으로 만들지 않기 위해서는 감수해야 한다는 태도를 보여 주죠. 글의 결론을 힘 있게 맺어 주는 문장입니다.","hl":"mn"},{"n":38,"text":"첫 번째, Changing the design and adding more technologies는 동명사구 두 개가 and로 묶여 하나의 주어 역할을 해요. 그래서 뒤에 단수 동사 will이 와요. 두 번째, cost는 비용이 들게 하다는 뜻의 타동사예요. 세 번째, no one은 아무도라는 부정어 주어라서 should와 함께 쓰여 강한 당위를 나타내죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주는\u003c/span>\u003cspan class=\"en\">Space\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기장\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">garbage \u003c/span>\u003cspan class=\"tgt\">dump\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">humans\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우주는 인간의 쓰레기장이 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 결론으로, 우주를 \u003cb class=\"key\">쓰레기장\u003c/b>에 비유해 인간이 우주를 함부로 오염시키면 안 된다는 메시지를 전달해요. 앞에서 설명한 우주 쓰레기의 심각성과 규제 필요성을 바탕으로, 우주는 인간이 버린 것을 마음대로 쌓아 두는 공간이 아니라는 점을 \u003cb class=\"key\">강조\u003c/b>합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 부정문\u003c/span> : 주어 + be동사 + not + 보어 : \"~이 아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 보어(명사구)\u003c/span> : 주어 + be동사 + [명사구(주격 보어)] : \"쓰레기장\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사] + for + [대상] : \"인간의\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Space, 우주는. is not, ~이 아니다. a garbage dump, 쓰레기장. for humans, 인간의. 이 문장 전체를 해석하면, 우주는 인간의 쓰레기장이 아니다.","hl":"m"},{"n":40,"text":"이 문장은 글의 마지막에서 우주를 쓰레기장에 비유하면서, 우주를 함부로 오염시키면 안 된다는 점을 강조해요. 앞에서 말한 우주 쓰레기의 심각성과 규제의 필요성을 다시 한 번 정리하는 역할을 하죠.","hl":"mn"},{"n":41,"text":"첫 번째로 is not은 be동사 뒤에 not이 붙은 부정 표현이에요. 두 번째로 a garbage dump는 be동사 is의 주격 보어로, 주어 Space가 무엇인지 설명해 줍니다. 세 번째로 for humans는 앞의 garbage dump를 꾸미는 전치사구라서 인간의 쓰레기장이라는 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>밤하늘에 반짝이는 밝은 빛은 \u003cb class=\"key\">별\u003c/b>이 아니라 우주 쓰레기일지도 모른다.\u003c/li>\u003cli>로켓의 금속 부품, 고장 난 위성, 우주비행사의 장갑까지 모두 \u003cb class=\"key\">우주 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>가 되어 지구 궤도를 돈다.\u003c/li>\u003cli>시속 3만 킬로미터에 가까운 \u003cb class=\"key\">속도\u003c/b> 때문에 작은 쓰레기 조각도 진로를 방해하는 모든 것을 파괴할 수 있다.\u003c/li>\u003cli>유엔은 제작업자들에게 \u003cb class=\"key\">규정\u003c/b>을 따르게 하고, 우주는 인간의 쓰레기장이 아니라고 주장한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Space garbage orbiting Earth at high speed is dangerous, so the UN requires satellite and rocket manufacturers to follow regulations and keep space clean.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">밤하늘의 별빛처럼 보이는 것이 사실은 지구 궤도를 도는 \u003cb class=\"key\">우주 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>일 수 있으며, 엄청난 속도로 움직이는 이 쓰레기는 큰 위험을 만든다. 유엔은 위성과 로켓 제작업자들이 \u003cb class=\"key\">규정\u003c/b>을 따르도록 요청하며, 우주는 인간의 쓰레기장이 아니라고 강조한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 내용을 정리해 볼게요. 밤하늘의 빛이 별이 아니라 우주 쓰레기일 수 있다는 사실, 그리고 그 쓰레기가 엄청난 속도로 움직여 큰 위험이 된다는 점을 기억하세요. 그래서 유엔은 제작업자들에게 규정을 따르라고 요청했고, 글쓴이는 우주가 인간의 쓰레기장이 아니라고 말합니다. 오늘 수업은 여기까지입니다. 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
