dSFu78BkhjiJADpaktPLIrELMkMWCHfZz4rFU8JhqmJm1amrxTt707+7BJ7uUrJWvazdmjow2Hni61LD0leU2k2n8MPdvKT391Nycnv91//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Space Garbage: The Urgent Need for Responsible Exploration<small>우주 쓰레기: 책임 있는 탐사를 위한 긴급한 필요성</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">밤하늘을 수놓는 별들 사이에는 우리가 미처 몰랐던 우주 쓰레기(space debris)가 떠다니고 있는데, 이는 수명을 다한 인공위성이나 로켓의 파편 등을 의미해요. 지구 궤도를 아주 빠른 속도로 도는 이 파편들은 작은 크기라도 다른 인공위성과 충돌할 경우 연쇄적인 파괴력을 발휘할 수 있어 매우 위험하답니다. 이를 해결하기 위해 국제 사회는 우주 지속 가능성(space sustainability)을 높이고자 로켓 설계 단계부터 쓰레기를 줄이는 규제를 도입하고 있어요. 마치 우리가 지구의 환경을 보호하듯 우주 공간도 깨끗하게 관리해야 할 소중한 자산이라는 인식을 가지는 것이 중요해요. 이러한 노력은 훗날 우리가 더 안전하게 우주를 탐사하고 인공위성 서비스를 누리기 위해 꼭 필요한 과정이랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01우주 쓰레기의 실체</div><ul><li>밤하늘의 별처럼 보이는 것들이 사실은 지구 주위를 도는 우주 쓰레기일 수 있다.</li><li>수많은 우주 쓰레기(space garbage)가 지구 궤도를 돌고 있음</li><li>로켓 금속 파편, 고장 난 위성, 심지어 우주비행사의 장갑(astronaut’s glove)까지 포함됨</li><li>핵심 키워드: 우주 쓰레기(space garbage)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02우주 쓰레기의 위험성</div><ul><li>매우 빠른 속도로 이동하는 우주 쓰레기는 작은 크기라도 엄청난 파괴력을 가진다.</li><li>시속 3만 km의 빠른 속도(speed)로 이동</li><li>경로에 있는 무엇이든 파괴할 수 있는 위험성(danger)</li><li>핵심 키워드: 속도(speed), 위험(danger)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03국제사회의 규제 노력</div><ul><li>유엔은 우주 쓰레기 문제를 해결하기 위해 제조사들이 지켜야 할 규칙을 마련했다.</li><li>유엔(United Nations)의 규제(regulations) 요구</li><li>로켓 및 위성 설계 방식의 변화 필요</li><li>핵심 키워드: 규제(regulations), 유엔(United Nations)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04새로운 제조 지침</div><ul><li>우주 쓰레기를 줄이기 위해 위성과 로켓 제작 방식에 구체적인 변화가 요구된다.</li><li>더 적고 단순한 부품(fewer and simpler parts)을 사용하도록 설계</li><li>임무 완수 후 지구로 귀환(return to earth)하는 기술 도입</li><li>핵심 키워드: 귀환(return), 설계(design)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05책임감 있는 태도</div><ul><li>우주 개발에는 많은 비용이 들지만, 인류는 우주를 쓰레기장으로 만들지 말아야 한다.</li><li>기술 변경과 추가에 따른 많은 비용 발생</li><li>우주를 인간의 쓰레기장(garbage dump)으로 여겨선 안 됨</li><li>핵심 키워드: 쓰레기장(garbage dump), 책임(responsibility)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">careful</td><td class=\"m\">주의 깊은, 조심하는</td></tr><tr><td class=\"w\">wish upon a star</td><td class=\"m\">별에게 소원을 빌다</td></tr><tr><td class=\"w\">twinkle</td><td class=\"m\">반짝이다</td></tr><tr><td class=\"w\">actually</td><td class=\"m\">실제로, 사실은</td></tr><tr><td class=\"w\">garbage</td><td class=\"m\">쓰레기</td></tr><tr><td class=\"w\">orbit</td><td class=\"m\">궤도를 돌다</td></tr><tr><td class=\"w\">metal</td><td class=\"m\">금속</td></tr><tr><td class=\"w\">rocket</td><td class=\"m\">로켓</td></tr><tr><td class=\"w\">break down</td><td class=\"m\">고장 나다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">satellite</td><td class=\"m\">인공위성</td></tr><tr><td class=\"w\">astronaut</td><td class=\"m\">우주비행사</td></tr><tr><td class=\"w\">destroy</td><td class=\"m\">파괴하다</td></tr><tr><td class=\"w\">get in one&#39;s way</td><td class=\"m\">~의 앞길을 가로막다</td></tr><tr><td class=\"w\">recognize</td><td class=\"m\">인식하다, 알아차리다</td></tr><tr><td class=\"w\">United Nations</td><td class=\"m\">국제연합(UN)</td></tr><tr><td class=\"w\">request</td><td class=\"m\">요청하다</td></tr><tr><td class=\"w\">manufacturer</td><td class=\"m\">제조사</td></tr><tr><td class=\"w\">regulation</td><td class=\"m\">규정, 규칙</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">조심하도록 하라</span><span class=\"en\"><b>Be careful</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다음번에</span><span class=\"en\"><b>the next time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네가 별에게 소원을 빌 때</span><span class=\"en\"><b>you wish upon a star.</b></span></div></div><div class=\"lec-sent-ko\">다음에 별을 보며 소원을 빌 때는 조심하도록 하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞에서 별을 보고 소원을 비는 낭만적인 상황을 언급하며, 이 글이 우주 쓰레기라는 다소 충격적인 반전 주제를 다룰 것임을 예고하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to (to부정사): wish upon a star 전체가 명사구로 사용되어 &#39;별에게 소원을 비는 것&#39;이라는 의미를 형성함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">careful</td><td class=\"m\">주의 깊은, 조심하는</td></tr><tr><td class=\"w\">wish upon a star</td><td class=\"m\">별에게 소원을 빌다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저 밝은 불빛들은</span><span class=\"en\"><b>Those bright lights</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밤하늘에서 반짝이는</span><span class=\"en\"><b><span class=\"grammar-hl\">twinkling</span> in the night sky</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사실 쓰레기일지도 모른다</span><span class=\"en\"><b>may actually be garbage,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">별이 아니라</span><span class=\"en\"><b>not stars!</b></span></div></div><div class=\"lec-sent-ko\">밤하늘에 반짝이는 그 밝은 불빛이 별이 아니라 쓰레기일지도 모른다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 garbage는 사전적으로 &#39;쓰레기, 폐기물&#39;을 뜻하는데, 문맥상 우주를 떠다니는 인공적인 파편들을 의미합니다. 필자는 아름다운 &#39;별&#39;과 대조되는 &#39;쓰레기&#39;라는 단어를 사용해 독자에게 놀라움을 주고 경각심을 불러일으키려 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">twinkling (현재분사): twinkling이 앞의 명사구(Those bright lights)를 수식함. &#39;밤하늘에서 반짝이는 그 밝은 빛들&#39;이라는 의미로, 명사의 동작을 수식하는 형용사적 기능</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">actually</td><td class=\"m\">실제로, 사실은</td></tr><tr><td class=\"w\">garbage</td><td class=\"m\">쓰레기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b>There are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수천 개의 “우주 쓰레기” 조각들이</span><span class=\"en\"><b>thousands of pieces of “space garbage”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구를 궤도 도는</span><span class=\"en\"><b><span class=\"grammar-hl\">orbiting</span> the Earth.</b></span></div></div><div class=\"lec-sent-ko\">수천 개의 “우주 쓰레기”가 지구 궤도를 돌고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제기한 의문점에 대해 수천 개라는 구체적인 수치를 제시하며 우주 쓰레기가 실재하는 심각한 문제임을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">orbiting (현재분사): orbiting이 앞의 명사구(pieces of space garbage)를 수식함. &#39;지구를 돌고 있는 수천 개의 우주 쓰레기 조각들&#39;이라는 의미로, 명사의 상태를 수식하는 형용사적 기능</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">garbage</td><td class=\"m\">쓰레기</td></tr><tr><td class=\"w\">orbit</td><td class=\"m\">궤도를 돌다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 쓰레기의 예들은</span><span class=\"en\"><b>Examples of this garbage</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">크고 작은 금속 부품들이다</span><span class=\"en\"><b>are big and small metal parts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">로켓으로부터 온</span><span class=\"en\"><b>from rockets,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고장 난 위성들</span><span class=\"en\"><b><span class=\"grammar-hl\">broken-down</span> satellites,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 심지어 우주비행사의 장갑도</span><span class=\"en\"><b>and even an astronaut’s glove!</b></span></div></div><div class=\"lec-sent-ko\">우주 쓰레기가 되는 것들에는 로켓의 크고 작은 금속 부품, 고장난 위성, 심지어 우주비행사들의 장갑도 있다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우주 쓰레기가 무엇인지 구체적인 항목을 나열하여 독자의 이해를 돕고, 장갑과 같은 의외의 물건을 언급해 위험성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">broken-down (과거분사): broken-down이 뒤의 명사(satellites)를 수식함. &#39;고장 난 위성들&#39;이라는 의미로, 과거분사가 명사를 수식하는 형용사적 기능</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">garbage</td><td class=\"m\">쓰레기</td></tr><tr><td class=\"w\">metal</td><td class=\"m\">금속</td></tr><tr><td class=\"w\">rocket</td><td class=\"m\">로켓</td></tr><tr><td class=\"w\">satellite</td><td class=\"m\">인공위성</td></tr><tr><td class=\"w\">astronaut</td><td class=\"m\">우주비행사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이동하면서</span><span class=\"en\"><b><span class=\"grammar-hl\">Traveling</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시속 거의 3만 km로</span><span class=\"en\"><b><span class=\"grammar-hl\">at almost 30,000 km per hour</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 작은 쓰레기 조각 하나도</span><span class=\"en\"><b>even a small piece of garbage</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">파괴할 수 있다</span><span class=\"en\"><b>can destroy anything</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 진로에 들어오는 것은 무엇이든</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> gets in its way.</b></span></div></div><div class=\"lec-sent-ko\">거의 시속 30,000km로 움직이기 때문에, 작은 쓰레기 조각이라도 자신의 진로를 방해하는 것이면 뭐든 파괴할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 엄청난 속도를 언급하여 쓰레기의 물리적 위협을 설명합니다. 여기서 destroy는 &#39;파괴하다&#39;라는 뜻인데, 우주에서는 아주 작은 파편도 엄청난 운동 에너지를 가져 치명적인 사고를 유발할 수 있다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Traveling at almost 30,000 km per hour (분사구문): 현재분사로 시작하는 부사적 기능으로, 절 전체의 맥락을 수식함. 원래 절로 바꾸면 While it is traveling at almost 30,000 km per hour가 됨</div><div class=\"lec-gr-item\">that (관계대명사): that 이하의 절(gets in its way)에서 주어 역할을 하며 선행사 anything을 수식하는 주격 관계대명사</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">garbage</td><td class=\"m\">쓰레기</td></tr><tr><td class=\"w\">destroy</td><td class=\"m\">파괴하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">문제와 위험을 인식하여</span><span class=\"en\"><b><span class=\"grammar-hl\">Recognizing the problem and danger</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“우주 쓰레기”의</span><span class=\"en\"><b><span class=\"grammar-hl\">of “space garbage,”</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유엔은</span><span class=\"en\"><b>the United Nations</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">요청했다</span><span class=\"en\"><b>has <span class=\"grammar-hl\">requested</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위성과 로켓 제작업자들이</span><span class=\"en\"><b><span class=\"grammar-hl\">that satellite and rocket manufacturers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">규정을 따를 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">follow</span> regulations.</b></span></div></div><div class=\"lec-sent-ko\">“우주 쓰레기”의 문제와 그 위험성을 인식한 유엔은 위성과 로켓을 만드는 제작업자들이 (제작상의 규제에 관한) 규정에 따라줄 것을 요청했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 다룬 위험성에 대한 구체적인 대응책(UN의 개입)을 제시하며 글의 흐름을 문제 인식에서 해결 방안으로 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Recognizing the problem and danger of “space garbage,” (분사구문): 현재분사로 시작하는 부사적 기능으로, 문장의 주어인 the United Nations의 상태를 나타냄. 원래 절로 바꾸면 Because the United Nations recognizes the problem and danger of “space garbage”가 됨</div><div class=\"lec-gr-item\">requested that satellite and rocket manufacturers follow 당위성 that절: request는 당위성을 나타내는 동사로, 목적어인 that절 내부의 동사(follow)는 should가 생략된 동사원형임. 이는 &#39;제조업체들이 규정을 따를 것을 요구했다&#39;는 당위적 의미를 만듦</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">garbage</td><td class=\"m\">쓰레기</td></tr><tr><td class=\"w\">rocket</td><td class=\"m\">로켓</td></tr><tr><td class=\"w\">satellite</td><td class=\"m\">인공위성</td></tr><tr><td class=\"w\">United Nations</td><td class=\"m\">국제연합(UN)</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">request</td><td class=\"m\">요청하다</td></tr><tr><td class=\"w\">manufacturer</td><td class=\"m\">제조사</td></tr><tr><td class=\"w\">regulation</td><td class=\"m\">규정, 규칙</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것들은 포함한다</span><span class=\"en\"><b><span class=\"grammar-hl\">These include</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디자인에 대한 제한을</span><span class=\"en\"><b>limits on designs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 몇 가지 추가를</span><span class=\"en\"><b>and some additions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 기술의</span><span class=\"en\"><b>of new technology.</b></span></div></div><div class=\"lec-sent-ko\">이 규정에는 디자인상의 제한과 몇 가지 추가적인 과학기술이 포함된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 규정의 구체적인 내용을 언급하며 다음 문장에서 설명할 기술적 보완의 근거를 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">These include (관용표현): include는 특정 대상을 예로 들거나 범주에 포함할 때 사용하는 동사로, 여기서는 앞서 언급된 규정의 내용을 열거하는 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">위성과 로켓은</span><span class=\"en\"><b>Satellites and rockets</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이제 만들어져야 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">must now be made</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 적고 더 단순한 부품들로</span><span class=\"en\"><b>with fewer and simpler parts,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것들은 지구로 돌아와야 한다</span><span class=\"en\"><b>and they must return to earth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 임무를 완료할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when they complete their jobs</span>.</b></span></div></div><div class=\"lec-sent-ko\">이제 위성과 로켓은 더 적은 수의 더 단순한 부품으로 제작되어야 하며, 임무를 다 수행하면 지구로 돌아와야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 제조사에 요구되는 구체적인 지침을 제시하여 실질적인 해결책을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">must now be made (수동태): be동사(be)+과거분사(made) 구조. make는 타동사인데 목적어가 없어서 수동구조 be made 형태로 씀. 기본구조: make A (A를 만들다)</div><div class=\"lec-gr-item\">when they complete their jobs (관계부사): when은 시간을 나타내는 접속사로, 이 문장에서는 위성 등이 임무를 마치는 &#39;때&#39;를 이끄는 부사절을 유도함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rocket</td><td class=\"m\">로켓</td></tr><tr><td class=\"w\">satellite</td><td class=\"m\">인공위성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">디자인을 바꾸는 것과</span><span class=\"en\"><b><span class=\"grammar-hl\">Changing the design</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 기술을 더하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">and adding more technologies</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비용이 들 것이다</span><span class=\"en\"><b>will cost</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 돈이</span><span class=\"en\"><b>a lot of money,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 아무도 불평해서는 안 된다</span><span class=\"en\"><b>but no one should complain.</b></span></div></div><div class=\"lec-sent-ko\">디자인을 변경하는 것과 기술을 더 추가하는 것이 더 많은 비용을 들게 하겠지만, 누구도 불평해서는 안 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비용 문제라는 현실적인 제약을 인정하면서도, 환경 보호와 안전이 경제적 이익보다 우선되어야 한다는 필자의 강한 주장을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Changing the design and adding more technologies (동명사): 문장의 주어로 쓰여 &#39;설계를 변경하는 것&#39;과 &#39;더 많은 기술을 추가하는 것&#39;이라는 행위를 명사화함</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우주는 아니다</span><span class=\"en\"><b>Space is not</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓰레기장이</span><span class=\"en\"><b>a <span class=\"grammar-hl\">garbage dump</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간을 위한</span><span class=\"en\"><b>for humans.</b></span></div></div><div class=\"lec-sent-ko\">우주는 인간의 쓰레기장이 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 garbage dump는 &#39;쓰레기장&#39;이라는 뜻으로, 우주를 무분별하게 사용하는 인류의 태도를 비판하며 글 전체의 핵심 메시지를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">garbage dump (동명사(명사적)): garbage(쓰레기)와 dump(덤프/투기장)가 결합하여 &#39;쓰레기 매립지&#39;라는 용도의 복합 명사를 이룸</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">garbage</td><td class=\"m\">쓰레기</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>밤하늘에 반짝이는 것 중 일부는 별이 아니라 위험한 우주 쓰레기이다.</li><li>빠른 속도로 이동하는 우주 쓰레기는 위성 등에 큰 위협이 된다.</li><li>UN은 이를 해결하기 위해 로켓과 위성 설계 및 폐기 규정을 강화했다.</li><li>비용이 들더라도 미래를 위해 우주를 깨끗하게 유지해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Space debris poses significant risks to equipment in orbit, so the UN is enforcing new design and disposal regulations to keep space clean.</div>\n              <div class=\"lec-final-sum-ko\">우주 쓰레기는 궤도 내 장비에 상당한 위험을 초래하므로, 유엔은 우주를 깨끗하게 유지하기 위해 새로운 설계 및 폐기 규정을 시행하고 있다.</div></div></div>"],"segs":[[{"audio":"./passage1_audio/1.mp3","hl":null}],[{"audio":"./passage1_audio/2.mp3","hl":null}],[{"audio":"./passage1_audio/3.mp3","hl":null},{"audio":"./passage1_audio/4.mp3","hl":"stage-0"},{"audio":"./passage1_audio/5.mp3","hl":"stage-1"},{"audio":"./passage1_audio/6.mp3","hl":"stage-2"},{"audio":"./passage1_audio/7.mp3","hl":"stage-3"},{"audio":"./passage1_audio/8.mp3","hl":"stage-4"}],[{"audio":"./passage1_audio/9.mp3","hl":null}],[{"aud
