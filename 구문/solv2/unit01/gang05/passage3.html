<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5강 reading3 — AI 강의</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"5강 reading3","audioDir":"passage3_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">5강\u003cbr>3번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Selling Thanks to the Fair, but Not Paying for It\u003c/h1>\u003ch2>시장 덕에 팔았다면, 시장을 위해 내야 한다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>John은 읍내 농산물 시장 정문에서 아이스크림을 팔았지만 자릿세를 내지 않아 아버지에게 집으로 돌아가라는 말을 들었다. 아버지는 John이 시장 덕분에 장사를 했으면서 \u003cb class=\"key\">후원비\u003c/b>를 한 푼도 내지 않은 점을 문제로 지적했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>If you benefit from an event, you must also pay the costs that support it.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 어느 여름날 아이스크림 트럭을 빌려 읍내 농산물 시장으로 나간 John의 이야기예요. John은 정문 입구에 트럭을 세우고 아이스크림을 팔기 시작했지만, 곧 아버지에게 집으로 돌아가라는 말을 듣게 되죠. 이 글은 아버지가 왜 그런 말을 했는지를 따라가며 혜택과 비용의 관계를 알려 줍니다. 요지는 이거예요. 어떤 혜택을 누렸다면, 그 혜택을 만들어 준 것에 대한 비용도 함께 부담해야 한다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">county fair(읍내 농산물 시장) 같은 행사장에서는 허가를 받은 사람만 물건을 팔 수 있고, 그 대가로 \u003cb class=\"key\">자릿세\u003c/b>(concession fee)를 냅니다. 이 돈은 행사장을 꾸미고 운영하는 데 쓰이기 때문에, 내지 않으면 \u003cb class=\"key\">무임승차\u003c/b>(free riding)가 됩니다. 다시 말해 행사가 만들어 준 손님과 명성이라는 혜택은 누리면서 비용은 다른 사람에게 떠넘기는 셈이지요. 학교 축제에 비유하면, 교실을 빌려 장사하면서 \u003cb class=\"key\">부스 \u003c/b>\u003cb class=\"key\">임대료\u003c/b>는 내지 않는 것과 같습니다. John은 '경계 밖'에서 팔았으니 규정을 어기지 않았다고 생각했지만, 아버지는 혜택을 얻었다면 \u003cb class=\"key\">비용 \u003c/b>\u003cb class=\"key\">부담\u003c/b>도 함께해야 한다고 본 것입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경을 조금 알아 볼게요. county fair 같은 행사장에서는 허가를 받은 사람만 물건을 팔 수 있고, 그 대가로 자릿세를 냅니다. 이 돈은 행사장을 꾸미고 운영하는 데 쓰이기 때문에, 내지 않으면 무임승차가 되는 거죠. 다시 말해 행사가 만들어 준 손님과 명성이라는 혜택은 누리면서 비용은 다른 사람에게 떠넘기는 셈이에요. 학교 축제에 비유하면, 교실을 빌려 장사하면서 부스 임대료는 내지 않는 것과 같아요. John은 경계 밖에서 팔았으니 규정을 어기지 않았다고 생각했지만, 아버지는 혜택을 얻었다면 비용 부담도 함께해야 한다고 본 겁니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>트럭을 빌려 장사 시작\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>어느 여름날 아침 John은 아이스크림 트럭을 \u003cb class=\"key\">빌려서\u003c/b> 읍내 농산물 시장으로 몰고 갑니다. 그는 정문 입구에 트럭을 세워 두고 곧바로 아이스크림을 \u003cb class=\"key\">팔기 \u003c/b>\u003cb class=\"key\">시작\u003c/b>하지요. 겉으로 보기에는 아무 문제도 없는 평범한 장사처럼 보입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>아버지의 개입\u003csmall>전환 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>그러나 그의 계획은 \u003cb class=\"key\">수포로 \u003c/b>\u003cb class=\"key\">돌아갑니다\u003c/b>. 어깨에 손길을 느끼며 돌아보니 아버지가 &quot;집으로 돌아가라&quot;고 말합니다. 당황하고 쩔쩔매면서도 John은 \u003cb class=\"key\">시키는 \u003c/b>\u003cb class=\"key\">대로\u003c/b> 집으로 향합니다. 여기서 독자는 왜 아버지가 그런 말을 했는지 \u003cb class=\"key\">의문\u003c/b>을 품게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>집 앞에서의 질문\u003csmall>질문 제시 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>아버지가 집에 도착해 보니 John은 빌린 트럭에 고개를 푹 숙인 채 앉아 있습니다. 아버지는 다그치지 않고 &quot;내가 왜 너에게 집에 가라고 했는지 아니?&quot;라고 \u003cb class=\"key\">질문\u003c/b>을 던집니다. 이 질문이 글의 \u003cb class=\"key\">문제\u003c/b>를 독자에게 정면으로 제시하는 장치입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>이유 설명과 반박\u003csmall>주장·반박 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>아버지가 이유를 설명합니다. John이 \u003cb class=\"key\">자릿세\u003c/b>를 내지 않았다는 것입니다. John은 시장 안에서 팔지는 않았다며 \u003cb class=\"key\">규정을 \u003c/b>\u003cb class=\"key\">어기지 \u003c/b>\u003cb class=\"key\">않았다\u003c/b>고 반박하지만, 아버지는 &quot;그게 바로 내가 하려는 얘기다&quot;라고 받아칩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>아버지의 결론\u003csmall>결론 · 문장 13\u003c/small>\u003c/h4>\u003cp>아버지의 마지막 말이 이 글의 \u003cb class=\"key\">주제\u003c/b>입니다. John이 아이스크림을 팔 수 있었던 것은 시장 덕분인데, 그는 시장을 \u003cb class=\"key\">후원\u003c/b>하는 비용을 한 푼도 내지 않았다는 것이지요. 혜택을 얻었다면 그 혜택을 만든 \u003cb class=\"key\">비용\u003c/b>도 함께 책임져야 한다는 결론입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. John이 아이스크림 트럭을 빌려서 읍내 농산물 시장으로 갑니다. 정문 입구에 트럭을 세워 두고 곧바로 아이스크림을 팔기 시작하죠. 겉으로 보면 아무 문제도 없는 장사처럼 보여요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 전환입니다. 그러나 그의 계획은 수포로 돌아가요. 어깨에 손길을 느끼며 돌아보니 아버지가 집으로 돌아가라고 말합니다. 당황하고 쩔쩔매면서도 John은 시키는 대로 집으로 향하고, 독자는 왜 그랬는지 의문을 품게 됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 질문이에요. 아버지가 집에 도착해 보니 John은 빌린 트럭에 고개를 푹 숙인 채 앉아 있어요. 아버지는 다그치지 않고 내가 왜 너에게 집에 가라고 했는지 아니라고 묻습니다. 이 질문이 글의 문제를 독자에게 정면으로 던지는 장치예요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 주장과 반박입니다. 아버지가 John이 자릿세를 내지 않았다고 이유를 설명하죠. John은 시장 안에서 팔지는 않았다며 규정을 어기지 않았다고 반박합니다. 그러자 아버지는 그게 바로 내가 하려는 얘기라고 받아칩니다.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 결론이에요. 아버지의 마지막 말이 이 글의 주제입니다. John이 아이스크림을 팔 수 있었던 것은 시장 덕분인데, 시장을 후원하는 비용은 한 푼도 내지 않았다는 것이죠. 결국 혜택을 얻었다면 그 혜택을 만든 비용도 함께 책임져야 한다는 결론이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 사건을 \u003cb class=\"key\">시간순\u003c/b>으로 따라가다가, 아버지의 질문에 답하는 방식으로 \u003cb class=\"key\">이유\u003c/b>를 밝힙니다. John의 생각과 아버지의 기준이 'But'과 'That's just it'에서 \u003cb class=\"key\">대조\u003c/b>되며, 주제를 담은 문장이 맨 끝에 놓인 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다. 그래서 결론은 마지막 문장에서 'thanks to the fair'와 'support it'의 \u003cb class=\"key\">인과\u003c/b> 관계로 완성됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>however (3)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>Do you know why (9)\u003c/b>\u003cspan>질문 제시\u003c/span>\u003cb>But (11)\u003c/b>\u003cspan>반박\u003c/span>\u003cb>That's just it (12)\u003c/b>\u003cspan>재진술·강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the concession fee\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pay anything to support it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">didn't pay anything\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>John\u003c/th>\u003cth>아버지\u003c/th>\u003c/tr>\u003ctr>\u003ctd>시장 밖에서 팔았으니 규정 위반이 아니라고 봄\u003c/td>\u003ctd>시장 덕에 팔았으니 후원비를 내야 한다고 봄\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자신의 행위만 기준으로 판단\u003c/td>\u003ctd>행사가 준 혜택까지 함께 고려\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 질문과 답변의 방식으로 전개되는 미괄식 글입니다. 사건을 시간순으로 따라가다가 아버지의 질문에 답하는 형태로 이유를 밝히죠. John의 생각과 아버지의 기준이 부딪히면서 주제가 마지막 문장에서야 완성됩니다. 그래서 결론은 항상 끝 문장에서 확인해야 해요.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. 세 번째 문장의 however는 계획이 수포로 돌아가는 전환을 알려 줍니다. 아홉 번째 문장의 Do you know why는 질문을 던져 뒤에 답이 온다는 것을 예고하고, 열한 번째 문장의 But은 John의 반박을 이끌죠. 열두 번째 문장의 That's just it은 아버지의 말을 다시 강조하며 주제로 모아 갑니다. 이렇게 질문과 반박과 재진술이 마지막 문장의 thanks to와 support it으로 수렴하는 구조예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>rent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빌리다, 임대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>county fair\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>읍내 농산물 시장\u003c/span>\u003c/div>\u003cdiv>\u003cb>sell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>팔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>park\u003c/b>\u003cem>동사\u003c/em>\u003cspan>세워 두다, 주차하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>main entrance\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>정문 입구\u003c/span>\u003c/div>\u003cdiv>\u003cb>short-lived\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>오래가지 않는, 단명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>shoulder\u003c/b>\u003cem>명사\u003c/em>\u003cspan>어깨\u003c/span>\u003c/div>\u003cdiv>\u003cb>voice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목소리\u003c/span>\u003c/div>\u003cdiv>\u003cb>bewildered\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>당황한, 어리둥절한\u003c/span>\u003c/div>\u003cdiv>\u003cb>embarrassed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쩔쩔매는, 창피한\u003c/span>\u003c/div>\u003cdiv>\u003cb>obey\u003c/b>\u003cem>동사\u003c/em>\u003cspan>따르다, 복종하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>arrive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도착하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>slump down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(고개를) 푹 숙이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>explain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>설명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>concession\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(판매) 허가, 양보\u003c/span>\u003c/div>\u003cdiv>\u003cb>concession fee\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>자릿세, 판매 허가 수수료\u003c/span>\u003c/div>\u003cdiv>\u003cb>argue\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>add\u003c/b>\u003cem>동사\u003c/em>\u003cspan>덧붙이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>break the rules\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>규정을 어기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rule\u003c/b>\u003cem>명사\u003c/em>\u003cspan>규정, 규칙\u003c/span>\u003c/div>\u003cdiv>\u003cb>thanks to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 덕분에\u003c/span>\u003c/div>\u003cdiv>\u003cb>support\u003c/b>\u003cem>동사\u003c/em>\u003cspan>후원하다, 지원하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어 몇 개만 짚을게요. rent는 빌리다라는 동사이고, short-lived는 오래가지 않는이라는 뜻이에요. concession fee는 행사장에서 물건을 팔기 위해 내는 자릿세를 말하고, support는 후원하다, 지원하다라는 동사로 마지막 문장의 핵심이 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">short-lived\u003c/b>\u003cspan class=\"m\">오래가지 않는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">brief\u003c/span>\u003cspan class=\"s\">momentary\u003c/span>\u003cspan class=\"s\">temporary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lasting\u003c/span>\u003cspan class=\"a\">permanent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">however\u003c/b>\u003cspan class=\"m\">그러나\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">nevertheless\u003c/span>\u003cspan class=\"s\">nonetheless\u003c/span>\u003cspan class=\"s\">but\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">bewildered\u003c/b>\u003cspan class=\"m\">당황한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">confused\u003c/span>\u003cspan class=\"s\">puzzled\u003c/span>\u003cspan class=\"s\">perplexed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">composed\u003c/span>\u003cspan class=\"a\">clear-headed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">obey\u003c/b>\u003cspan class=\"m\">따르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">follow\u003c/span>\u003cspan class=\"s\">comply with\u003c/span>\u003cspan class=\"s\">submit to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disobey\u003c/span>\u003cspan class=\"a\">resist\u003c/span>\u003cspan class=\"a\">defy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">argue\u003c/b>\u003cspan class=\"m\">주장하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">claim\u003c/span>\u003cspan class=\"s\">contend\u003c/span>\u003cspan class=\"s\">assert\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003cspan class=\"a\">concede\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">support\u003c/b>\u003cspan class=\"m\">후원하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">back\u003c/span>\u003cspan class=\"s\">fund\u003c/span>\u003cspan class=\"s\">sponsor\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">oppose\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">break the rules\u003c/b>\u003cspan class=\"m\">규정을 어기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">violate the rules\u003c/span>\u003cspan class=\"s\">go against the rules\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">follow the rules\u003c/span>\u003cspan class=\"a\">obey the rules\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어로 정리해 볼게요. bewildered는 confused, puzzled와 같은 뜻으로 당황한이고, 반대말은 composed처럼 침착한이에요. obey는 follow, comply with와 바꿔 쓸 수 있고 반대말은 disobey나 defy죠. argue는 claim, contend로 바꿔 쓸 수 있고, support는 back, fund, sponsor와 동의어예요. break the rules는 violate the rules로 바꿔 쓸 수 있고 반대말은 follow the rules라는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 여름날 아침,\u003c/span>\u003cspan class=\"en\">One summer morning,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">John은 아이스크림 트럭을 빌려서\u003c/span>\u003cspan class=\"en\">John \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">rented \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">ice \u003c/span>\u003cspan class=\"tgt\">cream \u003c/span>\u003cspan class=\"tgt\">truck \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 몰고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">drove \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">읍내 농산물 시장으로 갔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">county \u003c/span>\u003cspan class=\"tgt\">fair\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 여름날 아침, John은 아이스크림 트럭을 빌려서 읍내 농산물 시장으로 몰고 갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이야기의 \u003cb class=\"key\">배경\u003c/b>과 John이 처음 벌인 행동을 함께 제시해요. 그가 아이스크림 트럭을 \u003cb class=\"key\">빌려서\u003c/b> 읍내 농산물 시장으로 몰고 간 일이 뒤에 이어지는 사건의 \u003cb class=\"key\">발단\u003c/b>이 된다는 점을 기억하세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사 병렬\u003c/span> : [주어] + [동사 과거형] and [동사 과거형] : \"아이스크림 트럭을 빌려서 그것을 몰고 갔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to (방향·도착점)\u003c/span> : drove + [목적어 it] + [to + 장소] : \"읍내 농산물 시장으로\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"One summer morning, 어느 여름날 아침. John rented an ice cream truck, John은 아이스크림 트럭을 빌려서. and drove it, 그리고 그것을 몰고. to the county fair, 읍내 농산물 시장으로 갔다. 이 문장 전체를 해석하면, 어느 여름날 아침, John은 아이스크림 트럭을 빌려서 읍내 농산물 시장으로 몰고 갔다.","hl":"m"},{"n":14,"text":"이 문장은 이야기의 배경과 John이 처음 벌인 행동을 같이 보여 줘요. 그가 아이스크림 트럭을 빌려서 읍내 농산물 시장으로 몰고 갔다는 것, 이게 사건의 발단이에요.","hl":"mn"},{"n":15,"text":"첫 번째로 and 앞뒤를 보세요. rented와 drove가 똑같이 과거형으로 나란히 놓여 있죠. 이렇게 등위접속사 and가 대등한 두 동작을 병렬로 묶어 주는 거예요. 두 번째로 to the county fair에서 to는 움직임의 도착점을 나타내는 전치사예요. 그래서 '읍내 농산물 시장으로'라고 방향으로 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 트럭을 세워 두고\u003c/span>\u003cspan class=\"en\">He parked the truck\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정문 입구에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">main \u003c/span>\u003cspan class=\"tgt\">entrance\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이스크림을 팔기 시작했다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">selling \u003c/span>\u003cspan class=\"tgt\">ice \u003c/span>\u003cspan class=\"tgt\">cream\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 정문 입구에 트럭을 세워 두고 아이스크림을 팔기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> John이 트럭을 어디에 댔는지, 그리고 무엇을 시작했는지가 한 문장에 담겨 있어요. \u003cb class=\"key\">정문\u003c/b> 입구라는 위치가 뒤에 아버지가 등장하는 장면과 자연스럽게 연결된다는 점을 기억하세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 by (~옆에, ~에)\u003c/span> : parked [the truck] + [by + 장소] : \"정문 입구에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사 begin\u003c/span> : began + [selling (동명사/목적어)] : \"아이스크림을 팔기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"He parked the truck, 그는 트럭을 세워 두고. by the main entrance, 정문 입구에. and began selling ice cream, 아이스크림을 팔기 시작했다. 이 문장 전체를 해석하면, 그는 정문 입구에 트럭을 세워 두고 아이스크림을 팔기 시작했다.","hl":"m"},{"n":17,"text":"John이 트럭을 어디에 댔는지, 그리고 무엇을 시작했는지가 한 문장에 담겨 있어요. 정문 입구라는 위치가 뒤에 아버지가 나타나는 장면과 연결된다는 점도 같이 기억해 두세요.","hl":"mn"},{"n":18,"text":"먼저 by the main entrance에서 by는 '바로 옆에'라는 근접의 느낌을 가진 전치사예요. 그래서 정문 입구에 트럭을 붙여 댔다는 뜻이 됩니다. 다음으로 began selling에서 selling은 동명사로 began의 목적어 자리에 왔어요. 그래서 '아이스크림을 팔기 시작했다'라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 계획은\u003c/span>\u003cspan class=\"en\">His plan\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">금방 수포로 돌아갔어요,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">short-lived\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 그의 계획은 금방 수포로 돌아갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 자신 있게 장사를 시작한 John의 \u003cb class=\"key\">계획\u003c/b>이 오래가지 못했음을 알려 주는 반전 문장이에요. short-lived 하나로 '금방 끝났다'는 결과가 압축되어 있고, however가 그 \u003cb class=\"key\">반전\u003c/b>을 신호해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식(S+V+C)과 복합 형용사\u003c/span> : His plan + was + [short-lived (주격보어/형용사)] : \"(그의 계획은) 금방 수포로 돌아갔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속부사 however (역접)\u003c/span> : [앞 내용] + however (접속부사) + [뒤 내용] : \"그러나\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"His plan, 그의 계획은. was short-lived, 금방 수포로 돌아갔어요. however, 그러나. 이 문장 전체를 해석하면, 그러나 그의 계획은 금방 수포로 돌아갔다.","hl":"m"},{"n":20,"text":"앞에서 John이 자신 있게 장사를 시작했지만, 이 문장에서 분위기가 확 뒤집혀요. short-lived라는 표현 하나로 오래가지 못했다는 결과가 압축되어 있고, however가 그 반전을 신호해 줍니다.","hl":"mn"},{"n":21,"text":"먼저 was short-lived를 보세요. be동사 뒤에 형용사가 와서 주어 His plan의 상태를 설명하는 이 형식 구조예요. short-lived는 '짧게 사는'이라는 뜻이 합쳐진 복합 형용사라서 '금방 수포로 돌아갔다'로 자연스럽게 해석합니다. 다음으로 however는 접속부사예요. 접속사가 아니라서 콤마로 끊어 주고, 앞 내용과 반대되는 흐름을 표시한다고 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어깨에 손길을 느끼면서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Feeling \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">hand \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">shoulder\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">John은 들었다\u003c/span>\u003cspan class=\"en\">John \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">heard \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아버지의 목소리가 말하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">father's \u003c/span>\u003cspan class=\"tgt\">voice \u003c/span>\u003cspan class=\"tgt\">say\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“얘야, 집으로 돌아가거라.\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Better \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">home\u003c/span>, son.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어깨에 손길을 느끼면서, John은 아버지의 목소리를 들었다. “얘야, 집으로 돌아가거라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> John이 어깨에 손길을 느끼며 아버지의 목소리를 듣는 장면으로, 아버지가 갑자기 개입해 집으로 가라고 \u003cb class=\"key\">명령\u003c/b>하는 흐름을 만듭니다. heard his father's voice say는 '아버지가 말하는 목소리를 들었다'라는 뜻으로, 뒤에 이어지는 직접 인용을 자연스럽게 연결합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사)\u003c/span> : Feeling + [목적어] + [장소 부사구], 주절 = '~하면서, 주절' : \"어깨에 손길을 느끼면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지각동사 + 목적어 + 동사원형\u003c/span> : hear + [목적어] + [동사원형(목적격 보어)] : \"아버지의 목소리가 말하는 것을 들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">had better 생략 구문\u003c/span> : (You had) better + [동사원형] : \"집으로 가는 게 좋겠다, 집으로 가라\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Feeling a hand on his shoulder, 어깨에 손길을 느끼면서. John heard, John은 들었다. his father's voice say, 아버지의 목소리가 말하는 것을. \"Better go home, son, “얘야, 집으로 돌아가거라.. 이 문장 전체를 해석하면, 어깨에 손길을 느끼면서, John은 아버지의 목소리를 들었다. “얘야, 집으로 돌아가거라.","hl":"m"},{"n":23,"text":"여기서는 John이 어깨에 손길을 느끼면서 아버지의 목소리를 듣는 장면이에요. 아버지가 갑자기 개입해서 집으로 가라고 명령하는 흐름을 만들어 주고, heard his father's voice say 뒤에는 아버지가 한 말이 직접 인용으로 이어져요.","hl":"mn"},{"n":24,"text":"첫 번째로 Feeling a hand on his shoulder는 분사구문이에요. 주어 John이 손길을 느끼면서라는 뜻으로 접속사와 주어가 생략된 구조죠. 두 번째로 heard his father's voice say는 지각동사 heard 뒤에 목적어와 동사원형 say가 온 구조예요. 그래서 아버지의 목소리가 말하는 것을 들었다로 해석해요. 세 번째로 Better go home은 You had better go home에서 You had가 생략된 표현으로, 집으로 가라는 강한 권유나 명령을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당장.”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Now\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당장.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지가 덧붙인 Now.는 앞의 명령을 더 강하게 밀어붙이는 한마디입니다. 집으로 가라는 말이 단순한 권유가 아니라 \u003cb class=\"key\">즉시성\u003c/b>과 \u003cb class=\"key\">단호함\u003c/b>을 가진 명령임을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사(명령 강조)\u003c/span> : Now + (명령문) = '지금, 당장' : \"당장\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Now.\", 당장.”. 이 문장 전체를 해석하면, 당장.”","hl":"m"},{"n":26,"text":"이 한 단어는 앞의 명령을 더 강하게 밀어붙이는 역할을 해요. 집으로 가라는 말이 단순한 권유가 아니라 즉시성과 단호함을 가진 명령임을 보여 주죠.","hl":"mn"},{"n":27,"text":"여기서 Now는 단순히 지금이라는 시간 부사가 아니라 당장이라는 뜻으로 명령의 즉시성을 강조해요. 그래서 단호한 명령의 느낌을 살려 해석하면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당황하여 쩔쩔매면서,\u003c/sp ">2\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\"tgt\">John \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집 앞에 있는 것을 발견했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">front \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">house\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아버지가 집에 도착해보니 John이 집 앞에 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지가 집에 \u003cb class=\"key\">도착\u003c/b>한 뒤 John이 집 앞에 있는 모습을 \u003cb class=\"key\">발견\u003c/b>했다는 뜻이에요. 앞에서 John에게 집에 가라고 했던 아버지의 말이 실제로 이어졌음을 보여 주며, 다음 장면으로 넘어가는 \u003cb class=\"key\">장면 \u003c/b>\u003cb class=\"key\">전환\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">home의 부사적 용법(전치사 생략)\u003c/span> : arrive [자동사] + home [부사] : \"집에 도착했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">find + 목적어 + 전치사구(목적어의 상태)\u003c/span> : find [타동사] + [목적어 John] + [전치사구 in front of their house] : \"John이 그들의 집 앞에 있는 것을 발견했다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"His father, 그의 아버지는. arrived home, 집에 도착해서. and found John, John이. in front of their house, 집 앞에 있는 것을 발견했어요. 이 문장 전체를 해석하면, 아버지가 집에 도착해보니 John이 집 앞에 있었다.","hl":"m"},{"n":32,"text":"아버지가 집에 도착한 뒤 John이 집 앞에 있는 모습을 발견했다는 뜻이에요. 앞에서 John에게 집에 가라고 했던 아버지의 말이 실제로 이어졌음을 보여 주며, 다음 내용으로 넘어가는 장면 전환 역할을 합니다.","hl":"mn"},{"n":33,"text":"첫 번째, arrived home에서 home은 집으로라는 부사로 쓰여서 앞에 전치사를 쓰지 않아요. 두 번째, found John in front of their house는 find 다음에 목적어 John, 그 뒤에 위치를 나타내는 전치사구가 온 구조예요. 그래서 John이 그들의 집 앞에 있는 것을 발견하다로 해석하고, in front of는 ~앞에라는 전치사구로 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u00 3c/span>\u003cspan class=\"gn\">with + 목적어 + 과거분사(분사구)\u003c/span> : with + [목적어 his head] + [과거분사 slumped down] : \"그의 머리를 푹 숙인 채로\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"He, 그는. was sitting, 앉아 있었어요. in the rented truck, 빌린 트럭 안에. with his head, 그의 머리를. slumped down, 푹 숙인 채로. 이 문장 전체를 해석하면, 그는 고개를 푹 숙인 채로 빌린 트럭에 앉아 있었다.","hl":"m"},{"n":35,"text":"John이 빌린 트럭 안에 앉아 고개를 푹 숙이고 있었던 모습을 묘사해요. 앞에서 당황하고 창피해했던 John의 감정과 패배감이 그대로 드러나는 시각적 묘사입니다.","hl":"mn"},{"n":36,"text":"첫 번째, was sitting은 be동사 과거형 was에 현재분사 sitting이 붙은 과거진행이에요. 그래서 앉아 있었다라는 진행 상태를 나타냅니다. 두 번째, the rented truck에서 rented는 과거분사로 truck을 꾸며 수동의 뜻을 내서 빌린 트럭이 돼요. 세 번째, with his head slumped down은 with 다음에 목적어 his head, 그 뒤에 과거분사 slumped down이 온 구조로 그의 머리를 푹 숙인 채로라는 부대상황을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 아니\u003c/span>\u003cspan class=\"en\">&quot;Do you know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 왜 너에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">told \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집에 가라고 했는지?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">home\u003c/span>?&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 아버지는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">father \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게 물었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">asked \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“너는 내가 왜 너에게 집에 가라고 했는지 아니?” 아버지가 John에게 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지가 John에게 집에 가라고 했던 이유를 스스로 생각해 보게 하려고 되묻는 장면이에요. 단순한 꾸중이 아니라 \u003cb class=\"key\">질문\u003c/b>을 통해 John이 \u003cb class=\"key\">자릿세\u003c/b> 문제를 깨닫게 하려는 \u003cb class=\"key\">교육적 \u003c/b>\u003cb class=\"key\">의도\u003c/b>가 담겨 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사 + 주어 + 동사)\u003c/span> : Do you know + [why + 주어 I + 동사 told + 목적어 you + to부정사 to go home]? : \"내가 왜 너에게 집에 가라고 했는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">S + V + O (ask + 목적어)\u003c/span> : [주어 his father] + [동사 asked] + [목적어 him] : \"그의 아버지는 그에게 물었다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"\"Do you know, 너는 아니. why I told you, 내가 왜 너에게. to go home?\", 집에 가라고 했는지?. his father, 그의 아버지는. asked him, 그에게 물었어요. 이 문장 전체를 해석하면, “너는 내가 왜 너에게 집에 가라고 했는지 아니?” 아버지가 John에게 물었다.","hl":"m"},{"n":38,"text":"아버지가 John에게 집에 가라고 했던 이유를 스스로 생각해 보게 하려고 되묻는 장면이에요. 단순한 꾸중이 아니라 질문을 통해 John이 자릿세 문제를 깨닫게 하려는 교육적 의도가 담겨 있습니다.","hl":"mn"},{"n":39,"text":"첫 번째, why I told you to go home은 know의 목적어로 들어간 간접의문문이에요. 그래서 의문사 why 다음에 주어 I, 동사 told 순서로 와요. 그 안의 told you to go home은 tell 뒤에 목적어 you와 목적격보어 to부정사가 온 구조로 너에게 집에 가라고 말했다로 해석해요. 두 번째, his father asked him은 직접 인용문 뒤에서 말한 주체와 대상을 밝히는 전달 동사 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 설명했다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">explained \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">John이 내지 않았다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">John \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">hadn't \u003c/span>\u003cspan class=\"tgt\">paid\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자릿세를\u003c/span>\u003cspan class=\"en\">the concession fee.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 John이 자릿세를 내지 않았기 때문이라고 설명했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지가 John에게 집에 가라고 한 까닭을 밝히는 문장이에요. concession fee는 행사장에서 장사할 때 내는 \u003cb class=\"key\">자릿세\u003c/b>를 뜻하고, John이 그 돈을 내지 않은 것이 문제였다는 점을 explained 뒤의 that절로 풀어 주고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that (타동사의 목적어절)\u003c/span> : explain + [that + 주어 + 동사 ~ (명사절/목적어)] : \"John이 (돈을) 내지 않았다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료 (대과거)\u003c/span> : had + not + [과거분사 paid] ~ : \"내지 않았었다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"He explained, 그는 설명했다. that John hadn't paid, John이 내지 않았다고. the concession fee, 자릿세를. 이 문장 전체를 해석하면, 그는 John이 자릿세를 내지 않았기 때문이라고 설명했다.","hl":"m"},{"n":41,"text":"아버지가 John에게 집에 가라고 한 이유를 밝히는 대목이에요. concession fee는 행사장에서 장사할 때 내는 자릿세를 말하는데, John이 그 돈을 내지 않은 것이 문제였다는 거죠. 그래서 아버지는 John의 행동이 규칙 위반이라고 설명한 겁니다.","hl":"mn"},{"n":42,"text":"먼저 explained 뒤에 that이 나오면서 무엇을 설명했는지 목적어절을 이끌어요. explain은 목적어가 꼭 필요한 타동사라서 that절이 통째로 목적어 자리에 들어간 거예요. 두 번째로 hadn't paid는 과거완료 형태인데, 설명하는 시점보다 그 전에 이미 돈을 내지 않았던 일이라 대과거로 표현한 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;하지만 저는 팔고 있지 않았어요\u003c/span>\u003cspan class=\"en\">&quot;But I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wasn't \u003c/span>\u003cspan class=\"tgt\">selling\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시장 안에서&quot;\u003c/span>\u003cspan class=\"en\">inside,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">John은 주장했다\u003c/span>\u003cspan class=\"en\">John argued,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">덧붙이면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">adding\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 규정을 어기지 않았다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">break \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">rules\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“하지만 저는 시장 안에서 팔지는 않았어요.”하고 John은 주장하며 그가 규정을 어기지 않았다고 덧붙였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> John이 자기 행동을 변명하며 \u003cb class=\"key\">주장\u003c/b>하는 문장이에요. 시장 안에서 판 것이 아니니 \u003cb class=\"key\">규정을 \u003c/b>\u003cb class=\"key\">어기지 \u003c/b>\u003cb class=\"key\">않았다\u003c/b>고 항변하는 것인데, adding은 그 주장에 말을 덧붙이는 동작을 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형 (부정)\u003c/span> : was/were + not + [현재분사 V-ing] : \"팔고 있지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (현재분사, 능동·동시동작)\u003c/span> : , [V-ing ~ (분사구문)] : \"덧붙이면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that (분사의 목적어절)\u003c/span> : adding + [that + 주어 + 동사 ~] : \"그가 규정을 어기지 않았다고\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"\"But I wasn't selling, \"하지만 저는 팔고 있지 않았어요. inside,\", 시장 안에서\". John argued, John은 주장했다. adding, 덧붙이면서. that he didn't break the rules, 그가 규정을 어기지 않았다고. 이 문장 전체를 해석하면, “하지만 저는 시장 안에서 팔지는 않았어요.”하고 John은 주장하며 그가 규정을 어기지 않았다고 덧붙였다.","hl":"m"},{"n":44,"text":"John이 자기 변명을 이어 가는 문장이에요. 그는 시장 안에서 판 게 아니니까 규칙을 어긴 게 아니라고 항변하죠. argue는 여기서 주장하다라는 뜻이고, adding은 그 주장에 말을 보태는 동작을 보여 줍니다.","hl":"mn"},{"n":45,"text":"첫 번째로 wasn't selling은 과거진행형이에요. 그때 그 순간 팔고 있지 않았다는 상황을 그리는 형태죠. 두 번째로 adding은 분사구문인데, 주어 John이 직접 덧붙이는 능동 동작이라 현재분사로 쓴 거예요. 세 번째로 that은 adding의 목적어절을 이끄는 명사절 접속사로, 덧붙인 내용이 무엇인지 알려 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;그게 바로 내가 하려는 얘기다&quot;\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">just\u003c/span> it,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아버지가 말했다.\u003c/span>\u003cspan class=\"en\">his father said.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“그게 바로 내가 하려는 얘기다.” 아버지가 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지가 John의 변명을 받아 '바로 그 점이 \u003cb class=\"key\">문제\u003c/b>'라고 핵심을 찌르는 말이에요. just를 써서 앞의 말을 콕 집어 \u003cb class=\"key\">강조\u003c/b>하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 That + be동사 축약\u003c/span> : That(지시대명사) + is → That's : \"그게 바로 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">강조 부사 just\u003c/span> : be동사 + [just] + 대명사/명사 : \"바로, 딱\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"\"That's just it,\", \"그게 바로 내가 하려는 얘기다\". his father said, 아버지가 말했다.. 이 문장 전체를 해석하면, “그게 바로 내가 하려는 얘기다.” 아버지가 말했다.","hl":"m"},{"n":47,"text":"아버지가 John의 변명을 딱 받아치면서 바로 그 점이 문제라고 핵심을 짚는 말이에요. John이 시장 안에서 팔지 않았다고 말한 그 태도 자체가 문제라는 거죠. 짧은 한마디지만 이야기의 핵심을 찌르는 표현입니다.","hl":"mn"},{"n":48,"text":"첫 번째로 That's는 지시대명사 That에 is를 줄여 쓴 형태예요. 앞에서 John이 한 말 전체를 That으로 받아 주는 거죠. 두 번째로 just는 강조 부사로, be동사 뒤에서 바로 그것이라고 콕 집어 주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 아이스크림을 팔 수 있었다\u003c/span>\u003cspan class=\"en\">&quot;You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">sell\u003c/span> ice cream\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농산물 시장 덕분에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">thanks \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> the fair,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 너는 아무것도 내지 않았다\u003c/span>\u003cspan class=\"en\">but you didn't pay anything\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 후원하기 위해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">support \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“네가 아이스크림을 팔 수 있는 것은 농산물 시장 덕인데, 너는 후원비를 한 푼도 내지 않았어.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지가 John의 항변을 정면으로 되받는 문장이에요. John은 “시장 안에서 팔지 않았으니 규정을 어기지 않았다”고 했지만, 아버지는 \u003cb class=\"key\">혜택\u003c/b>을 입었으면 그에 걸맞은 \u003cb class=\"key\">대가\u003c/b>를 치러야 한다는 점을 짚어 줍니다. 즉 “문제는 파는 위치가 아니라 \u003cb class=\"key\">자릿세\u003c/b>를 내지 않은 것”이라는 지적이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 could(과거의 가능)\u003c/span> : 주어 + could + [동사원형] = ~할 수 있었다 : \"팔 수 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 전치사구 thanks to(~덕분에)\u003c/span> : thanks to + [명사(구)] = ~ 덕분에 : \"농산물 시장 덕분에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : 동사 + 목적어 + [to부정사구](목적) = ~하기 위해 …하다 : \"그것을 후원하기 위해서\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"You could sell ice cream, 너는 아이스크림을 팔 수 있었다. thanks to the fair, 농산물 시장 덕분에. but you didn't pay anything, 그런데 너는 아무것도 내지 않았다. to support it, 그것을 후원하기 위해서. 이 문장 전체를 해석하면, “네가 아이스크림을 팔 수 있는 것은 농산물 시장 덕인데, 너는 후원비를 한 푼도 내지 않았어.”","hl":"m"},{"n":50,"text":"아버지가 John의 말을 정면으로 되받는 장면이에요. John은 시장 안에서 팔지 않았으니 규정을 어기지 않았다고 했지만, 아버지는 혜택을 입었으면 그만한 대가를 치러야 한다고 짚어 주죠. 결국 문제는 어디서 팔았느냐가 아니라 자릿세를 내지 않았다는 점이라는 거예요.","hl":"mn"},{"n":51,"text":"먼저 could sell을 볼게요. 여기서 could는 조동사라서 뒤에 반드시 동사원형이 와요. 그래서 sells가 아니라 sell이 그대로 온 거고, 과거 시점의 가능을 나타내서 '팔 수 있었다'로 읽어요. 두 번째로 thanks to는 '감사하다'가 아니라 원인을 나타내는 전치사구예요. 그래서 뒤에 the fair가 붙어 '농산물 시장 덕분에'가 되는 거죠. 마지막으로 to support it에서 to부정사는 목적을 나타내요. 그래서 '그것을 후원하기 위해서'라고 해석하고, 앞의 pay와 자연스럽게 연결해 주면 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>John은 아이스크림 트럭을 빌려 읍내 농산물 시장 \u003cb class=\"key\">정문 \u003c/b>\u003cb class=\"key\">입구\u003c/b>에서 장사를 시작했다.\u003c/li>\u003cli>그러나 아버지가 나타나 집으로 돌아가라고 했고, John은 당황한 채 \u003cb class=\"key\">시키는 \u003c/b>\u003cb class=\"key\">대로\u003c/b> 따랐다.\u003c/li>\u003cli>아버지는 John이 \u003cb class=\"key\">자릿세\u003c/b>를 내지 않았기 때문이라 설명했고, John은 규정을 어기지 않았다고 반박했다.\u003c/li>\u003cli>아버지는 시장 \u003cb class=\"key\">덕분에\u003c/b> 팔았으면서 후원비를 내지 않은 점을 지적하며 혜택과 비용의 관계를 일깨웠다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>If you benefit from an event, you must also pay the costs that support it.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">John은 읍내 농산물 시장 정문에서 아이스크림을 팔았지만 자릿세를 내지 않아 아버지에게 집으로 돌아가라는 말을 들었다. 아버지는 John이 시장 덕분에 장사를 했으면서 \u003cb class=\"key\">후원비\u003c/b>를 한 푼도 내지 않은 점을 문제로 지적했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 글의 핵심은 혜택에는 반드시 비용이 따른다는 것이었어요. John은 시장 덕분에 장사를 했으니 자릿세를 내야 했던 거죠. 시험에서는 마지막 문장의 thanks to와 support it의 관계를 주제로 잡으면 됩니다. 오늘도 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
