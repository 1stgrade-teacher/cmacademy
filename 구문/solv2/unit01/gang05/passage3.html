 지역 축제장으로 향했다.</li><li>축제 정문 근처에 트럭 주차 (parked the truck)</li><li>아이스크림 판매 개시</li><li>핵심 키워드: 지역 축제(county fair)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02아버지의 갑작스러운 제지</div><ul><li>존은 축제장에서 장사를 하던 중 아버지의 명령에 의해 강제로 귀가하게 되었다.</li><li>아버지의 뜻밖의 등장 (father’s voice)</li><li>당황하고 창피한 마음으로 지시에 따름 (bewildered and embarrassed)</li><li>핵심 키워드: 귀가 명령(go home)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03갈등의 원인 확인</div><ul><li>집으로 돌아온 존에게 아버지는 그를 꾸짖으며 문제의 본질을 설명했다.</li><li>아버지는 존이 허가 비용을 내지 않았음을 지적</li><li>존은 축제장 내부가 아니었으므로 규칙을 어기지 않았다고 반박</li><li>핵심 키워드: 사용료(concession fee)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04아버지의 교훈</div><ul><li>아버지는 축제의 혜택을 받으면서 책임을 다하지 않은 존의 태도를 지적했다.</li><li>축제 덕분에 장사를 할 수 있었음</li><li>축제를 유지하기 위한 비용 지불의 의무 (support it)</li><li>핵심 키워드: 도덕적 책임(responsibility)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rent</td><td class=\"m\">임대하다, 빌리다</td></tr><tr><td class=\"w\">county fair</td><td class=\"m\">카운티 축제 (지방 자치 단체의 지역 축제)</td></tr><tr><td class=\"w\">entrance</td><td class=\"m\">입구</td></tr><tr><td class=\"w\">short-lived</td><td class=\"m\">단기적인, 오래가지 못하는</td></tr><tr><td class=\"w\">bewildered</td><td class=\"m\">당황한, 어리둥절한</td></tr><tr><td class=\"w\">embarrassed</td><td class=\"m\">쑥스러운, 당혹스러운</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">obey</td><td class=\"m\">따르다, 복종하다</td></tr><tr><td class=\"w\">slump</td><td class=\"m\">툭 처지다, 푹 쓰러지다</td></tr><tr><td class=\"w\">concession fee</td><td class=\"m\">(영업 등을 위한) 사용료, 허가비</td></tr><tr><td class=\"w\">argue</td><td class=\"m\">주장하다, 따지다</td></tr><tr><td class=\"w\">break</td><td class=\"m\">(규칙 등을) 어기다, 위반하다</td></tr><tr><td class=\"w\">support</td><td class=\"m\">지원하다, 후원하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 여름날 아침에,</span><span class=\"en\"><b>One summer morning,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">John은 아이스크림 트럭을 빌렸다</span><span class=\"en\"><b>John <span class=\"grammar-hl\">rented</span> an ice cream truck</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것을 몰고 갔다</span><span class=\"en\"><b>and drove it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">읍내 농산물 시장으로</span><span class=\"en\"><b>to the county fair.</b></span></div></div><div class=\"lec-sent-ko\">어느 여름날 아침, John은 아이스크림 트럭을 빌려서 읍내 농산물 시장으로 몰고 갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 존이 자신의 사업을 시작하기 위해 축제라는 장소를 선택해 이동하는 이야기의 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">rented (일반동사): 과거 시점의 동작을 나타내는 서술어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rent</td><td class=\"m\">임대하다, 빌리다</td></tr><tr><td class=\"w\">county fair</td><td class=\"m\">카운티 축제 (지방 자치 단체의 지역 축제)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 트럭을 주차했다</span><span class=\"en\"><b>He parked the truck</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정문 입구 옆에</span><span class=\"en\"><b>by the main entrance</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 시작했다</span><span class=\"en\"><b>and began</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이스크림 파는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">selling</span> ice cream.</b></span></div></div><div class=\"lec-sent-ko\">그는 정문 입구에 트럭을 세워 두고 아이스크림을 팔기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 축제 방문객들의 발길이 가장 많은 정문이라는 전략적 위치를 선택하여 판매를 시작하는 모습입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">selling (동명사): begin의 목적어 역할을 하는 명사적 용법의 -ing 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">entrance</td><td class=\"m\">입구</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그의 계획은 수포로 돌아갔다,</span><span class=\"en\"><b>His plan was <span class=\"grammar-hl\">short-lived</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만.</span><span class=\"en\"><b>however.</b></span></div></div><div class=\"lec-sent-ko\">그러나 그의 계획은 금방 수포로 돌아갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 short-lived는 사전적으로는 &#39;단기간의&#39;라는 뜻이지만, 여기서는 기대했던 사업이 시작하자마자 곧바로 중단될 위기에 처했음을 의미합니다. 사건의 전환을 암시하며 독자의 긴장감을 높이기 위해 이 표현을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">short-lived (관용표현): 형용사 역할을 하는 복합어로 &#39;단명하는/오래가지 못하는&#39;이라는 의미입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">short-lived</td><td class=\"m\">단기적인, 오래가지 못하는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">손길을 느끼면서</span><span class=\"en\"><b><span class=\"grammar-hl\">Feeling a hand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 어깨 위에 있는,</span><span class=\"en\"><b><span class=\"grammar-hl\">on his shoulder</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">John은 들었다</span><span class=\"en\"><b>John heard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아버지의 목소리가 말하는 것을,</span><span class=\"en\"><b>his father’s voice say,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“집에 가는 게 좋겠다, 아들아.</span><span class=\"en\"><b>“Better go home, son.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금 당장.”</span><span class=\"en\"><b>Now.”</b></span></div></div><div class=\"lec-sent-ko\">어깨에 손길을 느끼면서, John은 아버지의 목소리를 들었다. “얘야, 집으로 돌아가거라. 당장.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;오래가지 못한 계획&#39;이 아버지의 개입 때문이었음이 드러나며, 사건의 갈등이 본격화되는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Feeling a hand on his shoulder (분사구문): &#39;when/because he felt a hand on his shoulder&#39;로 해석되며, 접속사 + 주어(he) + 동사(felt) 형태의 절로 변환 가능합니다.</div><div class=\"lec-gr-item\">hear his father’s voice say 5형식(SVOC) 구조: 지각동사 hear + 목적어(his father’s voice) + 목적보어(say)로, 목적보어 자리에 동사원형이 쓰인 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당황하고 창피해서,</span><span class=\"en\"><b><span class=\"grammar-hl\">Bewildered and embarrassed</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 시키는 대로 했다.</span><span class=\"en\"><b>he obeyed.</b></span></div></div><div class=\"lec-sent-ko\">당황하여 쩔쩔매면서 그는 시키는 대로 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> obeyed는 &#39;복종하다, 따르다&#39;라는 뜻인데, 여기서는 아버지가 가진 권위 앞에 반항하지 못하고 순응하는 존의 심리적 위축 상태를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Bewildered and embarrassed (분사구문): &#39;because he was bewildered and embarrassed&#39;로 해석되며, 접속사 + 주어(he) + 동사(was) 형태의 절로 변환 가능합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bewildered</td><td class=\"m\">당황한, 어리둥절한</td></tr><tr><td class=\"w\">embarrassed</td><td class=\"m\">쑥스러운, 당혹스러운</td></tr><tr><td class=\"w\">obey</td><td class=\"m\">따르다, 복종하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아버지는 집에 도착했다</span><span class=\"en\"><b>His father <span class=\"grammar-hl\">arrived</span> home</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 John을 발견했다</span><span class=\"en\"><b>and found John</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 집 앞에 있는</span><span class=\"en\"><b>in front of their house.</b></span></div></div><div class=\"lec-sent-ko\">아버지가 집에 도착해보니 John이 집 앞에 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아버지와 아들이 대화하기 위한 장소로 옮겨가는 연결 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">arrived (일반동사): 주어 His father의 과거 행위를 서술합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 앉아 있었다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">was sitting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빌린 트럭 안에</span><span class=\"en\"><b>in the rented truck</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 고개를</span><span class=\"en\"><b>with his head</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">푹 숙인 채로</span><span class=\"en\"><b><span class=\"grammar-hl\">slumped</span> down.</b></span></div></div><div class=\"lec-sent-ko\">그는 고개를 푹 숙인 채로 빌린 트럭에 앉아 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> slumped는 사전적으로 &#39;툭 떨어지다, 푹 처지다&#39;인데, 여기서는 단순히 고개가 내려간 것을 넘어 존이 크게 낙담하고 기가 죽어 있는 상태를 묘사합니다. 그가 자신의 잘못을 인지하거나 상황에 대한 좌절감을 느끼고 있음을 강조하기 위해 이 동사를 사용했습니다. 8. “Do you know why I told you to go home?” his father asked him. 아버지의 행동에 대한 이유를 밝히기 전, 존에게 스스로를 돌아보게 하는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was sitting (현재진행): be동사(was) + -ing(sitting) 형태로 과거의 동작이 진행 중이었음을 나타냅니다.</div><div class=\"lec-gr-item\">slumped (과거분사(형용사)): 명사 his head를 수식하며, &#39;축 늘어진&#39; 상태를 의미합니다. (the head that is/was slumped)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rent</td><td class=\"m\">임대하다, 빌리다</td></tr><tr><td class=\"w\">slump</td><td class=\"m\">툭 처지다, 푹 쓰러지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“너는 이유를 아느냐</span><span class=\"en\"><b>“Do you know <span class=\"grammar-hl\">why</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 너에게 말한</span><span class=\"en\"><b><span class=\"grammar-hl\">I told you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집에 가라고?”</span><span class=\"en\"><b><span class=\"grammar-hl\">to go home</span>?”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아버지가 그에게 물었다.</span><span class=\"en\"><b>his father asked him.</b></span></div></div><div class=\"lec-sent-ko\">“너는 내가 왜 너에게 집에 가라고 했는지 아니?” 아버지가 John에게 물었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아버지의 행동에 대한 이유를 밝히기 전, 존에게 스스로를 돌아보게 하는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">why I told you to go home (간접의문문): 의문사(why) + 주어(I) + 동사(told)의 어순으로, know의 목적어 역할을 합니다.</div><div class=\"lec-gr-item\">told you to go 5형식(SVOC) 구조: tell + 목적어(you) + 목적보어(to go)로, 목적보어 자리에 to부정사를 취하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 설명했다</span><span class=\"en\"><b>He explained</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">John이 지불하지 않았다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that John hadn’t paid</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자릿세를</span><span class=\"en\"><b>the concession fee.</b></span></div></div><div class=\"lec-sent-ko\">그는 John이 자릿세를 내지 않았기 때문이라고 설명했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아버지가 존을 집으로 돌려보낸 구체적인 이유(규정 위반)가 제시됩니다. 10. “But I wasn’t selling inside,” John argued, adding that he didn’t break the rules. 자신의 행동이 정당하다고 생각하는 존의 입장이 드러나며, 아버지와 아들 사이의 가치관 차이가 충돌합니다. 11. “That’s just it,” his father said. That’s just it은 직역하면 &#39;그것이 바로 그것이다&#39;이지만, 여기서는 &#39;바로 그 지점이 핵심적인 잘못이다&#39;라는 뜻입니다. 상대방의 논리적 허점을 정확히 짚어내기 위해 이 강조 표현을 사용했습니다. 12. “You could sell ice cream thanks to the fair, but you didn’t pay anything to support it.” 축제의 이득만 취하고 그 기반이 되는 비용은 지불하지 않은 존의 행동이 사회적 도리 측면에서 잘못되었음을 아버지가 가르쳐주는 결론 부분입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that John hadn’t paid (that절(명사절)): explain의 목적어 역할을 하는 명사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">concession fee</td><td class=\"m\">(영업 등을 위한) 사용료, 허가비</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“하지만 저는 팔고 있지 않았어요</span><span class=\"en\"><b>“But I wasn’t selling</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안에서,”</span><span class=\"en\"><b>inside,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">John은 주장했다,</span><span class=\"en\"><b>John argued,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">덧붙이면서</span><span class=\"en\"><b><span class=\"grammar-hl\">adding</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 어기지 않았다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that he didn’t break</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">규칙들을</span><span class=\"en\"><b>the rules.</b></span></div></div><div class=\"lec-sent-ko\">“하지만 저는 시장 안에서 팔지는 않았어요.”하고 John은 주장하며 그가 규정을 어기지 않았다고 덧붙였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 행동이 정당하다고 생각하는 존의 입장이 드러나며, 아버지와 아들 사이의 가치관 차이가 충돌합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was selling (현재진행): be동사(was) + -ing(selling) 형태로 과거의 동작이 진행 중이었음을 나타냅니다.</div><div class=\"lec-gr-item\">adding (분사구문): &#39;and he added&#39;와 같이 앞선 절의 내용을 부연 설명하는 동시동작의 의미입니다.</div><div class=\"lec-gr-item\">that he didn’t break (that절(명사절)): adding의 내용을 보충하는 목적어 절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">argue</td><td class=\"m\">주장하다, 따지다</td></tr><tr><td class=\"w\">break</td><td class=\"m\">(규칙 등을) 어기다, 위반하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“그것이 바로 그것이다,”</span><span class=\"en\"><b>“<span class=\"grammar-hl\">That’s just it</span>,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아버지가 말했다.</span><span class=\"en\"><b>his father said.</b></span></div></div><div class=\"lec-sent-ko\">“그게 바로 내가 하려는 얘기다.” 아버지가 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> That’s just it은 직역하면 &#39;그것이 바로 그것이다&#39;이지만, 여기서는 &#39;바로 그 지점이 핵심적인 잘못이다&#39;라는 뜻입니다. 상대방의 논리적 허점을 정확히 짚어내기 위해 이 강조 표현을 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">That’s just it (관용표현): 상대방의 말에 동의하거나 핵심을 지적할 때 &#39;바로 그것이다&#39;라는 의미로 쓰입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“너는 아이스크림을 팔 수 있었다</span><span class=\"en\"><b>“You could sell ice cream</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 시장 덕분에,</span><span class=\"en\"><b><span class=\"grammar-hl\">thanks to</span> the fair,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 너는 아무것도 내지 않았다</span><span class=\"en\"><b>but you didn’t pay anything</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 후원하기 위해.”</span><span class=\"en\"><b>to support it.”</b></span></div></div><div class=\"lec-sent-ko\">“네가 아이스크림을 팔 수 있는 것은 농산물 시장 덕인데, 너는 후원비를 한 푼도 내지 않았어.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 축제의 이득만 취하고 그 기반이 되는 비용은 지불하지 않은 존의 행동이 사회적 도리 측면에서 잘못되었음을 아버지가 가르쳐주는 결론 부분입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thanks to (관용표현): &#39;~덕분에&#39;라는 의미의 전치사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">support</td><td class=\"m\">지원하다, 후원하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>존은 축제장 앞에서 아이스크림 판매를 시도했으나, 아버지의 제지로 곧 중단했다.</li><li>존은 허가비를 내지 않았음에도 축제장 밖이라 규칙을 어기지 않았다고 주장했다.</li><li>아버지는 축제의 혜택을 누리면서 대가를 지불하지 않는 것은 공정하지 않다고 일깨워준다.</li><li>행동의 결과뿐만 아니라, 그 혜택을 누리는 근간에 대한 도덕적 책임감을 강조하는 글이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">John tries to run his business without paying the fee, but his father teaches him that success must be accompanied by supporting the community that enables it.</div>\n              <div class=\"lec-final-sum-ko\">존은 수수료를 내지 않고 사업을 하려 하지만, 자신의 아버지는 성공하려면 그 기회를 가능하게 한 공동체를 지원해야 한다는 점을 가르쳐준다.</div></div></div>"],"segs":[[{"audio":"./passage3_audio/1.mp3","hl":null}],[{"audio":"./passage3_audio/2.mp3","hl":null}],[{"audio":"./passage3_audio/3.mp3","hl":null},{"audio":"./passage3_audio/4.mp3","hl":"stage-0"},{"audio":"./passage3_audio/5.mp3","hl":"stage-1"},{"audio":"./passage3_audio/6.mp3","hl":"stage-2"},{"audio":"./passage3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage3_audio/8.mp3","hl":null}],[{"audio":"./passage3_audio/9.mp3","hl":"main"},{"audio":"./passage3_audio/10.mp3","hl":"meaning"},{"audio":"./passage3_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/12.mp3","hl":"main"},{"audio":"./passage3_audio/13.mp3","hl":"meaning"},{"audio":"./passage3_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/15.mp3","hl":"main"},{"audio":"./passage3_audio/16.mp3","hl":"meaning"},{"audio":"./passage3_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/18.mp3","hl":"main"},{"audio":"./passage3_audio/19.mp3","hl":"meaning"},{"audio":"./passage3_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/21.mp3","hl":"main"},{"audio":"./passage3_audio/22.mp3","hl":"meaning"},{"audio":"./passage3_audio/23.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/24.mp3","hl":"main"},{"audio":"./passage3_audio/25.mp3","hl":"meaning"},{"audio":"./passage3_audio/26.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/27.mp3","hl":"main"},{"audio":"./passage3_audio/28.mp3","hl":"
