</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"to-v Review passage2","audioDir":"passage2_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">to review\u003cbr>reading02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Beyond Economics: The Enduring Power of Sports\u003c/h1>\u003ch2>경제를 넘어: 스포츠의 지속적인 힘\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>스포츠의 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">힘\u003c/b>은 확고하지만, 글은 경제만이 아니라 스포츠가 가진 \u003cb class=\"key\">지속적인 \u003c/b>\u003cb class=\"key\">특성\u003c/b>에 주목합니다. 스포츠는 \u003cb class=\"key\">존경\u003c/b>과 겸손한 승리, 우아한 패배를 가르치며 \u003cb class=\"key\">평생 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 남깁니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Sports have enduring social and personal value beyond their economic power, teaching respect, humility, grace, and lifelong self-belief.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 스포츠가 지닌 경제적 힘을 넘어서는 가치에 관한 지문을 함께 읽어 볼게요. 이 글은 스포츠의 경제적 힘을 인정하면서도, 스포츠가 가진 지속적인 특성과 평생 가치에 주목합니다. 요지는 스포츠가 사람을 뭉치게 하고 존경과 겸손과 우아함 같은 태도를 길러 준다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">메이저 스포츠 행사는 단순한 경기 이상의 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">효과\u003c/b>(economic effect)를 냅니다. 도시는 경기장, 교통, 관광, 일자리 같은 이익을 기대하며 유치 경쟁(bidding competition)을 벌이죠. 이런 이익을 상업적 가치(commercial worth)라고 부르고, 행사 뒤에 남는 시설·이미지·공동체의 변화는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">유산\u003c/b>(legacy)이라고 합니다. 스포츠는 또한 규칙을 지키고 상대를 인정하는 과정에서 \u003cb class=\"key\">지속적인 \u003c/b>\u003cb class=\"key\">특성\u003c/b>(enduring qualities)을 길러 줍니다. 이것은 마치 동아리 활동이 끝난 뒤에도 친구들과의 신뢰가 남는 것과 비슷합니다. 결국 스포츠의 \u003cb class=\"key\">평생 \u003c/b>\u003cb class=\"key\">가치\u003c/b>(lifelong values)는 돈으로 계산되는 부분을 넘어 사람과 사회를 바꾸는 힘에 있습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 이야기해 볼게요. 메이저 스포츠 행사는 단순한 경기 이상의 경제적 효과를 냅니다. 도시는 경기장과 교통과 관광과 일자리 같은 이익을 기대하며 유치 경쟁을 벌이죠. 이런 상업적 가치와 함께 행사 뒤에 남는 시설과 이미지와 공동체의 변화를 사회적 유산이라고 불러요. 스포츠는 규칙을 지키고 상대를 인정하는 과정에서 지속적인 특성을 길러 주고, 이는 동아리 활동이 끝난 뒤에도 친구들과의 신뢰가 남는 것과 비슷합니다. 결국 스포츠의 평생 가치는 돈으로 계산되는 부분을 넘어 사람과 사회를 바꾸는 힘에 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>경제적 힘과 유치 경쟁\u003csmall>도입·통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>스포츠의 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">힘\u003c/b>은 이제 확고하게 인정되며 전 세계적으로 커지고 있습니다. 그래서 많은 도시가 주요 스포츠 행사를 유치하려고 엄청난 노력을 기울입니다. 이때 도시가 노리는 것은 \u003cb class=\"key\">상업적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>만이 아니라 그 행사가 남기는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">유산\u003c/b>과 장기적 혜택입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>경제를 넘어선 전환\u003csmall>전환·주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>세 번째 문장은 'But'으로 방향을 틀며 이것이 경제만의 문제가 아니라고 말합니다. 스포츠에는 \u003cb class=\"key\">지속적인 \u003c/b>\u003cb class=\"key\">특성\u003c/b>이 있다는 점을 네 번째 문장에서 \u003cb class=\"key\">주제문\u003c/b>처럼 제시합니다. 즉 경제적 이익을 넘어 스포츠가 사람에게 남기는 가치로 시선을 옮기는 \u003cb class=\"key\">전환\u003c/b>입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>스포츠가 가르치는 태도\u003csmall>근거·예시 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>스포츠는 우리에게 우리 자신보다 더 큰 어떤 것에 참가하는 방법을 보여 줍니다. 또 팀 동료와 상대편에 대한 \u003cb class=\"key\">존경\u003c/b>을 나타내는 방식을 가르칩니다. 겸손하게 이기고 우아하게 지는 태도, 곧 \u003cb class=\"key\">겸손\u003c/b>과 \u003cb class=\"key\">우아함\u003c/b>을 배우게 하며 목표를 세우고 성취하는 법도 알려 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>뭉침과 평생 가치\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>마지막 문장에서 스포츠는 사람들을 뭉치게 합니다. 이때 스포츠가 가르치는 \u003cb class=\"key\">자부심\u003c/b>과 \u003cb class=\"key\">자신감\u003c/b>은 평생 동안 지속되는 \u003cb class=\"key\">평생 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 지닙니다. 그래서 글은 경제적 힘을 넘어 스포츠의 지속적인 특성과 사회적 가치를 강조하며 끝납니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 스포츠의 경제적 힘이 확고하고 세계적으로 커지고 있다는 점을 말합니다. 많은 도시가 주요 스포츠 행사를 유치하려고 엄청난 노력을 기울이죠. 그 이유는 상업적 가치만이 아니라 그 행사가 남기는 사회적 유산과 장기적인 사회적 혜택 때문입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 방향을 바꾸는 전환입니다. 세 번째 문장에서 But이 나오면서 이것이 경제만의 문제가 아니라고 말해요. 네 번째 문장은 스포츠의 지속적인 특성을 주제문으로 제시합니다. 즉 경제적 이익을 넘어 스포츠가 사람에게 남기는 가치로 시선을 옮기는 거죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 스포츠가 가르치는 구체적인 태도를 설명합니다. 스포츠는 우리 자신보다 더 큰 어떤 것에 참가하는 방법을 보여 주고, 팀 동료와 상대편에 대한 존경을 가르쳐요. 또 겸손하게 이기고 우아하게 지는 태도, 곧 겸손과 우아함을 배우게 하며 목표를 세우고 성취하는 법도 알려 줍니다.","hl":"f2"},{"n":7,"text":"마지막 단계에서 스포츠는 사람들을 뭉치게 합니다. 스포츠가 가르치는 자부심과 자신감은 평생 동안 지속되는 평생 가치를 지녀요. 그래서 이 글은 경제적 힘을 넘어 스포츠의 지속적인 특성과 사회적 가치를 강조하며 끝납니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 먼저 스포츠의 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">힘\u003c/b>을 인정하며 출발하지만, 세 번째 문장에서 'But'으로 \u003cb class=\"key\">전환\u003c/b>해 경제만의 문제가 아니라고 말합니다. 네 번째 문장이 'enduring qualities'를 내세운 \u003cb class=\"key\">주제문\u003c/b>이며, 이후 참여·존경·승패 태도가 근거로 이어집니다. 마지막 문장은 스포츠가 사람을 뭉치게 하고 \u003cb class=\"key\">평생 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 남긴다는 결론으로 마무리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>not just for (2)\u003c/b>\u003cspan>상업적 가치 외에 사회적 혜택을 추가하는 대조\u003c/span>\u003cb>but for (2)\u003c/b>\u003cspan>상업적 가치와 사회적 혜택을 대조\u003c/span>\u003cb>But (3)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>also (4)\u003c/b>\u003cspan>추가·강조\u003c/span>\u003cb>They show us (5)\u003c/b>\u003cspan>근거 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">commercial worth\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">long-term social benefits\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">enduring qualities\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">self-worth and self-belief\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">values that can last a lifetime\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>경제적 힘·상업적 가치\u003c/th>\u003cth>지속적인 특성·사회적 유산\u003c/th>\u003c/tr>\u003ctr>\u003ctd>상업적 가치와 경제적 효과에 초점\u003c/td>\u003ctd>사회적 유산과 지속적인 특성에 초점\u003c/td>\u003c/tr>\u003ctr>\u003ctd>행사 유치의 단기적 이익\u003c/td>\u003ctd>참여·존경·승패 태도 같은 평생 가치\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 통념을 인정한 뒤 시선을 넓히는 통념과 반박의 흐름으로 볼 수 있어요. 처음에는 스포츠의 경제적 힘과 상업적 가치를 인정하지만, 세 번째 문장의 But이 전환을 만들어요. 주제문은 네 번째 문장인 스포츠의 지속적인 특성에 있고, 마지막에는 평생 가치라는 결론으로 모입니다. 그래서 구조는 주제문이 글 중간에 놓인 중괄식으로 정리할 수 있습니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 두 번째 문장의 not just for but for가 상업적 가치와 사회적 혜택을 나란히 놓으며 대조를 만듭니다. 세 번째 문장의 But은 앞의 경제 중심 흐름을 끊고 전환을 알려 주죠. 네 번째 문장의 also는 스포츠에 경제 외의 특성이 더 있다는 점을 강조합니다. 이후 They show us와 They help us 같은 반복 표현이 근거를 이어 주고, 마지막 문장이 전체를 정리합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>economic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>경제적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>power\u003c/b>\u003cem>명사\u003c/em>\u003cspan>힘\u003c/span>\u003c/div>\u003cdiv>\u003cb>established\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>확고한, 확립된\u003c/span>\u003c/div>\u003cdiv>\u003cb>global\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>세계적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>growing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>성장하는, 커지는\u003c/span>\u003c/div>\u003cdiv>\u003cb>make efforts\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>노력하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입찰하다, 유치하려 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>개최하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>major\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>주요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>commercial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상업적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>worth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가치\u003c/span>\u003c/div>\u003cdiv>\u003cb>long-term\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>장기적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>social\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사회적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>benefit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>혜택, 이익\u003c/span>\u003c/div>\u003cdiv>\u003cb>legacy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유산\u003c/span>\u003c/div>\u003cdiv>\u003cb>economics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경제, 경제학\u003c/span>\u003c/div>\u003cdiv>\u003cb>enduring\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지속적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>quality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특성, 자질\u003c/span>\u003c/div>\u003cdiv>\u003cb>participate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>참여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>demonstrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다, 입증하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>respect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>존경, 존중\u003c/span>\u003c/div>\u003cdiv>\u003cb>teammate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>팀 동료\u003c/span>\u003c/div>\u003cdiv>\u003cb>opponent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상대, 상대편\u003c/span>\u003c/div>\u003cdiv>\u003cb>humility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>겸손\u003c/span>\u003c/div>\u003cdiv>\u003cb>grace\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우아함, 품위\u003c/span>\u003c/div>\u003cdiv>\u003cb>set a goal\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>목표를 세우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fulfill\u003c/b>\u003cem>동사\u003c/em>\u003cspan>성취하다, 이행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring together\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>뭉치게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-worth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자부심, 자기가치\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-belief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자신감, 자기신념\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 몇 개 짚어 볼게요. established는 확고하게 인정된, enduring은 지속적인, demonstrate는 보여 주다라는 뜻이에요. humility는 겸손, grace는 우아함이나 품위로 기억해 두면 좋습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">established\u003c/b>\u003cspan class=\"m\">확고한, 확립된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">settled\u003c/span>\u003cspan class=\"s\">recognized\u003c/span>\u003cspan class=\"s\">confirmed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uncertain\u003c/span>\u003cspan class=\"a\">unproven\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enduring\u003c/b>\u003cspan class=\"m\">지속적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lasting\u003c/span>\u003cspan class=\"s\">persistent\u003c/span>\u003cspan class=\"s\">durable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">temporary\u003c/span>\u003cspan class=\"a\">fleeting\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">benefit\u003c/b>\u003cspan class=\"m\">혜택, 이익\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">advantage\u003c/span>\u003cspan class=\"s\">gain\u003c/span>\u003cspan class=\"s\">profit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disadvantage\u003c/span>\u003cspan class=\"a\">loss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">demonstrate\u003c/b>\u003cspan class=\"m\">보여 주다, 입증하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">show\u003c/span>\u003cspan class=\"s\">display\u003c/span>\u003cspan class=\"s\">illustrate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">participate\u003c/b>\u003cspan class=\"m\">참여하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">take part\u003c/span>\u003cspan class=\"s\">engage\u003c/span>\u003cspan class=\"s\">join\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">withdraw\u003c/span>\u003cspan class=\"a\">abstain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">humility\u003c/b>\u003cspan class=\"m\">겸손\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">modesty\u003c/span>\u003cspan class=\"s\">meekness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">arrogance\u003c/span>\u003cspan class=\"a\">pride\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fulfill\u003c/b>\u003cspan class=\"m\">성취하다, 이행하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">achieve\u003c/span>\u003cspan class=\"s\">accomplish\u003c/span>\u003cspan class=\"s\">realize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fail\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘는 동의어와 반의어로 묶어 볼게요. established는 recognized나 confirmed와 가깝고 unproven과 반대되며, enduring은 lasting이나 persistent와 가깝고 temporary와 반대돼요. demonstrate는 show나 display와 가깝고 conceal과 반대이며, participate는 take part나 join과 가깝고 withdraw와 반대입니다. humility는 modesty와 가깝고 arrogance와 반대이며, benefit은 advantage나 gain과 가깝고 disadvantage와 반대입니다. fulfill은 achieve나 accomplish와 가깝고 fail과 반대된다는 점도 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스포츠의 경제적 힘은\u003c/span>\u003cspan class=\"en\">Sports' economic power\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현재 확고하게 인정되고 있으며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">established\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계적으로 점점 커지고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">global \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">growing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">스포츠의 경제적 힘은 현재 확고하게 인정되고 있으며 전 세계적으로 점점 커지고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 첫 출발점으로, 스포츠가 가진 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">힘\u003c/b>이 이미 확고하게 자리 잡았고 앞으로도 더 커진다는 \u003cb class=\"key\">배경\u003c/b>을 먼저 깔아 주는 역할을 해요. 그래서 뒤에 이어지는 '그러나 경제만의 문제가 아니다'라는 흐름이 자연스럽게 살아나게 되죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : [주어] + be동사 + [과거분사] (~되다, ~해지다) : \"현재 확고하게 인정되고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사·현재분사의 병렬 구조\u003c/span> : [형용사 global] + and + [현재분사 growing] : \"전 세계적이고 점점 커지는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Sports' economic power, 스포츠의 경제적 힘은. is now well established, 현재 확고하게 인정되고 있으며. global and growing, 전 세계적으로 점점 커지고 있다. 이 문장 전체를 해석하면, 스포츠의 경제적 힘은 현재 확고하게 인정되고 있으며 전 세계적으로 점점 커지고 있다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 출발점이에요. 스포츠의 경제적 힘이 이미 확고하게 자리 잡았고 앞으로 더 커진다는 배경을 먼저 깔아 주는 거죠. 그래서 뒤에 경제만의 문제가 아니라는 이야기가 자연스럽게 이어질 수 있는 거예요.","hl":"mn"},{"n":14,"text":"어법은 두 가지만 짚을게요. 첫 번째, is now well established는 수동태예요. be동사 뒤에 과거분사가 오면 '인정되다'처럼 수동의 뜻이 되고, well은 그 과거분사를 꾸며 주는 부사 역할을 해요. 두 번째, global and growing은 형용사와 현재분사가 and로 이어진 병렬 구조예요. growing은 지금도 계속 커지고 있다는 느낌을 살려 주는 현재분사라고 정리해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 도시들이 엄청난 노력을 하고 있다\u003c/span>\u003cspan class=\"en\">Many cities make huge efforts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주요한 스포츠 행사를 유치하려고 시도할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">bidding\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stage\u003c/span> major sporting events,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 상업적 가치뿐만 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">commercial \u003c/span>\u003cspan class=\"tgt\">worth \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장기적인 사회적 혜택을 위해서도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">long-term \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">benefits\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 행사의 유산이 되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">legacy \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">events\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 도시들이 그들의 상업적 가치뿐만 아니라 그러한 행사의 유산이 되는 장기적인 사회적 혜택을 위해서도 주요한 스포츠 행사를 유치하려고 시도하며, 엄청난 노력을 하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 도시들이 왜 큰 스포츠 행사를 유치하려고 애쓰는지 그 이유를 설명해요. 돈이 되는 상업적 가치 때문만이 아니라, 행사가 끝난 뒤에도 남는 장기적인 사회적 혜택 때문이라는 점을 강조하죠. 여기서 \u003cb class=\"key\">유산\u003c/b>이라는 표현이 다음 문장의 '경제만의 문제가 아니다'로 넘어가는 \u003cb class=\"key\">다리\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when + 분사구문(시간 부사절의 축약)\u003c/span> : when + [주어·be동사 생략] + [현재분사] (~할 때) : \"입찰할 때, 유치를 시도할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : bid + [to + 동사원형] (~하려고 입찰하다) : \"개최하려고, 유치하려고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">상관접속사 not just A but B (전치사구 병렬)\u003c/span> : not just + [A] + but + [B] (A뿐만 아니라 B도) : \"그들의 상업적 가치뿐만 아니라 장기적인 사회적 혜택을 위해서도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 the long-term social benefits] + that + [동사 are] : \"그러한 행사의 유산이 되는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Many cities make huge efforts, 많은 도시들이 엄청난 노력을 하고 있다. when bidding to stage major sporting events, 주요한 스포츠 행사를 유치하려고 시도할 때. not just for their commercial worth, 그들의 상업적 가치뿐만 아니라. but for the long-term social benefits, 장기적인 사회적 혜택을 위해서도. that are the legacy of such events, 그러한 행사의 유산이 되는. 이 문장 전체를 해석하면, 많은 도시들이 그들의 상업적 가치뿐만 아니라 그러한 행사의 유산이 되는 장기적인 사회적 혜택을 위해서도 주요한 스포츠 행사를 유치하려고 시도하며, 엄청난 노력을 하고 있다.","hl":"m"},{"n":16,"text":"이 문장은 도시들이 왜 큰 스포츠 행사를 유치하려고 애쓰는지 그 이유를 설명해요. 돈이 되는 상업적 가치 때문만이 아니라, 행사가 끝난 뒤에도 남는 장기적인 사회적 혜택 때문이라는 점을 강조하는 거죠. 여기서 유산이라는 표현이 다음 문장의 경제만의 문제가 아니다로 넘어가는 다리 역할을 한다고 기억해 두세요.","hl":"mn"},{"n":17,"text":"어법은 순서대로 네 가지예요. 첫 번째, when bidding은 시간을 나타내는 접속사 when 뒤에서 주어와 be동사가 사라진 분사구문이에요. 원래는 when they bid인데 주절 주어와 같아서 they가 생략된 거죠. 두 번째, to stage는 유치하려고 애쓴다는 목적을 나타내는 to부정사예요. 세 번째, not just for their commercial worth but for the long-term social benefits는 상관접속사로, 두 전치사구가 똑같은 모양으로 병렬을 이루고 있어요. 네 번째, that are the legacy of such events에서 that은 앞에 있는 the long-term social benefits를 받는 주격 관계대명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 이것은\u003c/span>\u003cspan class=\"en\">But this\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 경제의 문제만은 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">isn't \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">question \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">economics\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 이것은 경제만의 문제가 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장까지는 경제적 가치와 혜택을 이야기했으니, 이 문장은 그 흐름을 한 번 돌려세우는 역할을 해요. 스포츠의 가치를 경제라는 잣대로만 보면 안 된다는 신호를 주는 거죠. 여기서 \u003cb class=\"key\">부분 \u003c/b>\u003cb class=\"key\">부정\u003c/b>이 쓰여 '경제만의 문제는 아니다'라는 뜻이 되고, 곧 스포츠의 다른 가치들이 이어질 것임을 예고해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부분 부정(not ~ only)\u003c/span> : not + [only] + ... (~만은 아니다) : \"단지 경제의 문제만은 아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of의 관계 표현(~의, ~에 관한)\u003c/span> : [명사 a question] + of + [명사 economics] : \"경제의 문제\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But this, 그러나 이것은. isn't only a question of economics, 단지 경제의 문제만은 아니다. 이 문장 전체를 해석하면, 그러나 이것은 경제만의 문제가 아니다.","hl":"m"},{"n":19,"text":"앞 문장까지는 경제적 가치와 혜택을 이야기했으니, 이 문장은 그 흐름을 한 번 돌려세우는 역할을 해요. 스포츠의 가치를 경제라는 잣대로만 보면 안 된다는 신호를 주는 거죠. 여기서 부분 부정이 쓰여서 경제만의 문제는 아니라는 뜻이 되고, 곧 스포츠의 다른 가치들이 이어질 것임을 예고해 줍니다.","hl":"mn"},{"n":20,"text":"어법은 두 가지예요. 첫 번째, isn't only a question of economics는 부분 부정이에요. not이 only와 만나면 전체를 부정하는 게 아니라 단지 그것만은 아니라는 뜻이 되죠. 두 번째, a question of economics에서 of는 경제에 관한이라는 의미로 앞의 명사 question에 내용을 붙여 주는 역할을 해요. 참고로 economics는 학문 이름이라 단수로 취급한다는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스포츠는\u003c/span>\u003cspan class=\"en\">Sports\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역시 갖고 있다\u003c/span>\u003cspan class=\"en\">also \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지속적인 특성들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">enduring \u003c/span>\u003cspan class=\"tgt\">qualities\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">스포츠는 지속적인 특성 역시 갖고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 스포츠가 경제만의 문제가 아니라고 했으니, 이 문장은 \u003cb class=\"key\">화제 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 해 주는 역할을 한다. 즉 스포츠에는 시간이 흘러도 사라지지 않는 \u003cb class=\"key\">지속적인 \u003c/b>\u003cb class=\"key\">특성\u003c/b>이 있다는 점을 한 줄로 못 박아, 뒤에 이어질 스포츠의 가치 설명의 발판을 놓는다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사 have + 목적어\u003c/span> : [주어] + have [타동사] + [목적어 qualities] : \"지속적인 특성들을 갖고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사 형용사의 명사 수식\u003c/span> : [동사 + -ing] + [명사] = ~하는/~한 성질의 명사 : \"지속되는 특성들\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Sports, 스포츠는. also have, 역시 갖고 있다. enduring qualities, 지속적인 특성들을. 이 문장 전체를 해석하면, 스포츠는 지속적인 특성 역시 갖고 있다.","hl":"m"},{"n":22,"text":"앞 문장에서 스포츠가 경제만의 문제가 아니라고 했죠. 그래서 이 문장이 화제 전환을 해 주는 거예요. 스포츠에는 시간이 흘러도 사라지지 않는 지속적인 특성이 있다는 점을 한 줄로 딱 못 박아 주는 문장입니다.","hl":"mn"},{"n":23,"text":"첫 번째로 have는 뒤에 qualities를 목적어로 데리고 가는 타동사예요. 두 번째로 enduring은 동명사가 아니라 현재분사로 쓰인 형용사입니다. 동사 endure에 ing를 붙여서 뒤의 qualities를 꾸며 주니까, 지속되는 특성, 다시 말해 지속적인 특성이라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스포츠는 우리에게 보여주며\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">show \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 것에 참가하는 방법을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">participate \u003c/span>\u003cspan class=\"tgt\">in\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 자신보다 더 큰\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">bigger \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">ourselves\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 우리에게 가르친다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">teach \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">존경심을 나타내는 방식을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">demonstrate \u003c/span>\u003cspan class=\"tgt\">respect\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팀 동료와 상대편에 대한\u003c/span>\u003cspan class=\"en\">for teammates and opponents.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">스포츠는 우리에게 우리 자신보다 더 큰 어떤 것에 참가하는 방법을 보여주며 팀 동료나 상대편에 대한 존경심을 나타내는 방식을 가르친다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스포츠의 지속적인 특성을 구체적으로 풀어 놓은 문장으로, 스포츠가 '무엇에 참여하는 법'과 '사람을 대하는 법'을 알려 주는 교육의 장이라는 점을 밝힌다. \u003cb class=\"key\">공동체 \u003c/b>\u003cb class=\"key\">참여\u003c/b>와 \u003cb class=\"key\">상대에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">존경\u003c/b>이라는 두 가지 가치를 show와 teach로 나란히 제시해, 앞 문장의 '지속적인 특성'을 뒷받침한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 동사 + 간접목적어 + 직접목적어\u003c/span> : show + [간접목적어 us] + [직접목적어 how to부정사구] : \"우리에게 ~하는 방법을 보여주다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사(명사구)\u003c/span> : how + to + 동사원형 = ~하는 방법 : \"참가하는 방법\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 형용사의 후치수식\u003c/span> : [something] + [비교급 형용사 + than + 비교 대상] : \"우리 자신보다 더 큰 어떤 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : [show us + 목적어] and [teach us + 목적어] : \"그리고 우리에게 ~하는 방식을 가르친다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They show us, 스포츠는 우리에게 보여주며. how to participate in something, 어떤 것에 참가하는 방법을. bigger than ourselves, 우리 자신보다 더 큰. and teach us, 그리고 우리에게 가르친다. how to demonstrate respect, 존경심을 나타내는 방식을. for teammates and opponents, 팀 동료와 상대편에 대한. 이 문장 전체를 해석하면, 스포츠는 우리에게 우리 자신보다 더 큰 어떤 것에 참가하는 방법을 보여주며 팀 동료나 상대편에 대한 존경심을 나타내는 방식을 가르친다.","hl":"m"},{"n":25,"text":"앞에서 말한 스포츠의 지속적인 특성을 구체적으로 풀어 놓은 문장이에요. 스포츠는 우리 자신보다 더 큰 어떤 것에 참여하는 법을 보여 주고, 동료와 상대를 존중하는 법까지 가르쳐 준다는 거죠. 결국 스포츠가 사람을 키우는 교육의 장이라는 점을 밝히는 문장입니다.","hl":"mn"},{"n":26,"text":"먼저 show us를 보면 show가 4형식 동사라서 우리에게라는 간접목적어를 먼저 받고, 뒤에 how to participate 이하를 직접목적어로 받아요. 두 번째로 how to participate는 의문사 to부정사로 ~하는 방법이라는 명사 덩어리를 만드는 형태입니다. 세 번째로 something bigger than ourselves에서 bigger than 이하는 something을 뒤에서 꾸며 주는 후치수식이에요. 마지막으로 and를 기준으로 show us와 teach us가 나란히 이어지는 병렬 구조라는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이들은 우리가 배우도록 돕는다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">겸손하게 이기는 방식\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">win \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">humility \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 우아하게 지는 방식\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">lose \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">grace\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">목표를 설정하는 방식\u003c/span>\u003cspan class=\"en\">how to set a goal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 성취하는 방식까지도\u003c/span>\u003cspan class=\"en\">and fulfill it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이들은 우리에게 겸손하게 이기며 우아하게 지는 방식, 목표를 설정하고 성취하는 방식까지도 가르쳐 줄 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 '존경심을 가르친다'는 내용을 이어받아, 스포츠가 승패를 담담하게 받아들이는 \u003cb class=\"key\">승패를 \u003c/b>\u003cb class=\"key\">대하는 \u003c/b>\u003cb class=\"key\">태도\u003c/b>와 \u003cb class=\"key\">목표 \u003c/b>\u003cb class=\"key\">성취\u003c/b>의 방식을 길러 준다고 정리한다. with humility는 '겸손하게', with grace는 '우아하게(품위 있게)'라는 뜻으로, 결과보다 과정의 태도를 중시한다는 점을 드러낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">준사역동사 help + 목적어 + 원형부정사\u003c/span> : help + [목적어 us] + [원형부정사 learn] : \"우리가 배우도록 돕는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사(명사구)\u003c/span> : how + to + 동사원형 = ~하는 방법 : \"겸손하게 이기는 방식\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 병렬\u003c/span> : [to win ~] and [(to) lose ~] : \"이기고 지는 방식\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"They help us learn, 이들은 우리가 배우도록 돕는다. how to win with humility, 겸손하게 이기는 방식. and lose with grace, 그리고 우아하게 지는 방식. how to set a goal, 목표를 설정하는 방식. and fulfill it, 그리고 그것을 성취하는 방식까지도. 이 문장 전체를 해석하면, 이들은 우리에게 겸손하게 이기며 우아하게 지는 방식, 목표를 설정하고 성취하는 방식까지도 가르쳐 줄 수 있다.","hl":"m"},{"n":28,"text":"앞 문장에서 존경심을 가르친다고 했죠. 이 문장은 그 흐름을 이어받아 승패를 대하는 태도와 목표를 이루는 방식을 스포츠가 길러 준다고 정리해 줍니다. with humility는 겸손하게, with grace는 우아하게, 다시 말해 품위 있게라는 뜻이에요. 결과보다 과정의 태도가 중요하다는 점을 기억하면 됩니다.","hl":"mn"},{"n":29,"text":"먼저 help us learn에서 help는 준사역동사라서 목적어 뒤에 to를 뺀 원형부정사 learn이 옵니다. 두 번째로 how to win은 의문사 to부정사로 겸손하게 이기는 방식이라는 명사구를 만들어요. 세 번째로 to win with humility와 lose with grace가 and로 이어지는 병렬이고, 뒤에 how to set a goal and fulfill it도 같은 방식으로 나란히 연결된다는 점을 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스포츠는 사람들을 뭉치게 하며\u003c/span>\u003cspan class=\"en\">Sports \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">bring \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">together\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자부심과 자신감은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">self-worth \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">self-belief\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 가르쳐 주는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">teach\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가치이고\u003c/span>\u003cspan class=\"en\">are values\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평생 동안 지속될 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">last \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lifetime\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">스포츠는 사람들을 뭉치게 하며 그들이 가르쳐 주는 자부심과 자신감은 평생 동안 지속되는 가치를 지닌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 스포츠가 사람들을 \u003cb class=\"key\">뭉치게\u003c/b> 하고, 스포츠가 가르치는 자부심과 자신감이 \u003cb class=\"key\">평생 \u003c/b>\u003cb class=\"key\">지속\u003c/b>되는 \u003cb class=\"key\">가치\u003c/b>임을 말하며 글을 마무리합니다. 앞에서 말한 스포츠의 지속적인 힘을 하나로 정리하는 결론 역할을 합니다. the self-worth and self-belief는 스포츠가 길러 주는 내적 태도이고, values that can last a lifetime은 그것이 일시적이지 않다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 + 목적어 + together의 어순\u003c/span> : bring + 목적어 people + together(부사) : \"사람들을 뭉치게 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사구의 병렬 구조\u003c/span> : the self-worth + and + self-belief : \"자부심과 자신감\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : the self-worth and self-belief + that(목적격) + they teach : \"그들이 가르쳐 주는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : values + that(주격) + can last a lifetime : \"평생 동안 지속될 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Sports bring people together, 스포츠는 사람들을 뭉치게 하며. the self-worth and self-belief, 자부심과 자신감은. that they teach, 그들이 가르쳐 주는. are values, 가치이고. that can last a lifetime, 평생 동안 지속될 수 있는. 이 문장 전체를 해석하면, 스포츠는 사람들을 뭉치게 하며 그들이 가르쳐 주는 자부심과 자신감은 평생 동안 지속되는 가치를 지닌다.","hl":"m"},{"n":31,"text":"이 문장은 스포츠가 사람들을 뭉치게 하고, 스포츠가 가르치는 자부심과 자신감이 평생 지속되는 가치임을 말하며 글을 마무리해요. 앞에서 말한 스포츠의 지속적인 힘을 하나로 정리하는 결론 역할을 하죠. the self-worth and self-belief는 스포츠가 길러 주는 내적 태도이고, values that can last a lifetime은 그것이 일시적이지 않다는 뜻이에요.","hl":"mn"},{"n":32,"text":"첫 번째로 bring people together에서 bring은 목적어 people을 먼저 두고 together가 뒤에서 '한데 모여'라는 결과 상태를 보충해요. 그래서 '사람들을 뭉치게 하다'로 해석하죠. 두 번째로 the self-worth and self-belief는 and가 두 추상명사를 대등하게 잇는 병렬 구조이고, 뒤의 관계절이 두 명사를 함께 꾸며 줘요. 세 번째로 that they teach에서 that은 앞의 자부심과 자신감을 받는 목적격 관계대명사이고 teach의 목적어 역할을 해요. 네 번째로 that can last a lifetime에서 that은 values를 받는 주격 관계대명사로 뒤 절의 주어 역할을 하고, can last는 '지속될 수 있다'라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>스포츠의 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">힘\u003c/b>은 세계적으로 확고해졌고, 많은 도시가 주요 행사 유치에 큰 노력을 쏟습니다.\u003c/li>\u003cli>도시들은 \u003cb class=\"key\">상업적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>뿐 아니라 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">유산\u003c/b>과 장기적인 사회적 혜택을 기대합니다.\u003c/li>\u003cli>그러나 글은 경제를 넘어 스포츠의 \u003cb class=\"key\">지속적인 \u003c/b>\u003cb class=\"key\">특성\u003c/b>과 \u003cb class=\"key\">존경\u003c/b> 같은 인성 교육적 가치에 주목합니다.\u003c/li>\u003cli>스포츠는 사람을 뭉치게 하고 \u003cb class=\"key\">자부심\u003c/b>, \u003cb class=\"key\">자신감\u003c/b>, \u003cb class=\"key\">평생 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 남깁니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Sports have enduring social and personal value beyond their economic power, teaching respect, humility, grace, and lifelong self-belief.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">스포츠의 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">힘\u003c/b>은 확고하지만, 글은 경제만이 아니라 스포츠가 가진 \u003cb class=\"key\">지속적인 \u003c/b>\u003cb class=\"key\">특성\u003c/b>에 주목합니다. 스포츠는 \u003cb class=\"key\">존경\u003c/b>과 겸손한 승리, 우아한 패배를 가르치며 \u003cb class=\"key\">평생 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 남깁니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글은 스포츠의 경제적 힘에서 출발해 상업적 가치와 사회적 유산을 언급한 뒤, 경제를 넘어선 지속적인 특성으로 나아갑니다. 그리고 존경, 겸손, 우아함, 자부심, 자신감, 평생 가치를 통해 스포츠의 진짜 힘을 보여 주죠. 이 흐름을 기억하면 내용 이해와 빈칸 추론 문제 모두 훨씬 수월해질 거예요. 오늘도 수고했고, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
