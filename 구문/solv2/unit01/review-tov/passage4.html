</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"to-v Review passage4","audioDir":"passage4_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">to review\u003cbr>reading04\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>The Power of Dependence: How the Servant Controls the Master\u003c/h1>\u003ch2>의존의 힘: 신하가 왕을 지배하는 방법\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>진정한 \u003cb class=\"key\">궁극적 \u003c/b>\u003cb class=\"key\">힘\u003c/b>은 사람을 강요하지 않고도 원하는 대로 행동하게 만드는 힘이며, 그것을 얻는 가장 좋은 방법은 상대가 나 없이는 기능하지 못하는 \u003cb class=\"key\">의존 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 형성하는 것이다. 그러한 관계가 확립되면 당신은 우세한 입장에서 주인을 움직이게 되는데, 이는 왕의 신하가 실질적으로 왕을 지배하는 전형적인 사례이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The ultimate power comes not from forcing people but from making them depend on you so deeply that they willingly do as you wish.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 궁극적 힘은 어디에서 나오는가라는 주제의 글이에요. 이 글은 사람을 강요해서 움직이는 힘이 아니라, 상대가 나에게 의존하게 만드는 관계가 진짜 힘이라고 말하고 있습니다. 요지는 궁극적 힘은 의존 관계에서 나온다는 것이고, 그래서 신하가 왕을 지배하는 역설적인 상황까지 설명해 줘요. 함께 차근차근 읽어 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">권력이나 힘(power)은 흔히 상대를 강요하거나 압박할 때 생긴다고 생각하기 쉽습니다. 하지만 사회심리학에서는 상대가 나 없이는 안 된다고 느끼는 \u003cb class=\"key\">의존\u003c/b> 상태를 만들 때 훨씬 강한 영향력이 생긴다고 봅니다. 이때 쓰이는 용어가 바로 의존 관계(relationship of dependence)이고, 상대가 나를 \u003cb class=\"key\">대체\u003c/b>하기 어려울수록 나의 협상력은 커집니다. 일상에서도 회사에서 없어서는 안 되는 실무자를 떠올리면 이해가 쉬운데, 그 사람이 빠지면 일이 멈추기 때문에 사장도 그 직원의 말을 무시하기 어렵죠. 즉 힘은 소리치는 데서가 아니라 \u003cb class=\"key\">대체 \u003c/b>\u003cb class=\"key\">불가능성\u003c/b>에서 나온다는 뜻입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 얘기해 볼게요. 우리는 힘을 강한 사람이 약한 사람을 누르는 것으로 생각하기 쉽죠. 그런데 사회심리학에서는 상대가 나 없이는 안 된다고 느끼는 의존 상태가 훨씬 강한 영향력을 만든다고 봅니다. 이때 쓰는 표현이 relationship of dependence, 즉 의존 관계예요. 일상에서도 회사에 없어서는 안 되는 실무자를 떠올려 보세요. 그 직원이 빠지면 일이 멈추기 때문에 사장도 그 직원의 말을 무시하기 어렵습니다. 힘은 소리치는 데서가 아니라 대체 불가능성에서 나온다는 것이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>궁극적 힘의 정의\u003csmall>도입·주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 \u003cb class=\"key\">궁극적 \u003c/b>\u003cb class=\"key\">힘\u003c/b>이 무엇인지부터 정의합니다. 그것은 사람들을 강요하지 않고도 원하는 대로 행동하게 만드는 힘이죠. 상대가 자발적으로 당신이 소망하는 것을 줄 때, 그 힘은 \u003cb class=\"key\">견줄 \u003c/b>\u003cb class=\"key\">자가 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 것이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>의존 관계라는 방법\u003csmall>주장·근거 · 문장 3\u003c/small>\u003c/h4>\u003cp>그러면 그러한 지위를 얻는 가장 좋은 방법은 무엇일까요. 글은 \u003cb class=\"key\">의존 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 형성하는 것이라고 답합니다. 상대가 나에게 \u003cb class=\"key\">의지\u003c/b>하게 만드는 관계를 만드는 것이 핵심이라는 것이죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>대체 불가능한 존재\u003csmall>근거·설명 · 문장 4\u003c/small>\u003c/h4>\u003cp>주인은 당신의 봉사를 요구하지만, 그는 약해서 당신 없이는 기능하지 못합니다. 당신이 그의 일에 깊이 관여하면 당신을 없애는 일은 큰 어려움이 되고, 대신할 사람을 \u003cb class=\"key\">훈련\u003c/b>시키는 데 귀중한 시간을 빼앗기게 됩니다. 그래서 당신은 \u003cb class=\"key\">대체 \u003c/b>\u003cb class=\"key\">불가능한\u003c/b> 사람이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>우세 확보와 지배\u003csmall>결론·예시 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>그런 관계가 확립되면 당신은 \u003cb class=\"key\">우세한 \u003c/b>\u003cb class=\"key\">입장\u003c/b>에서 주인을 원하는 대로 움직입니다. 글은 이를 왕의 신하가 실질적으로 왕을 지배하는 \u003cb class=\"key\">전형적인 \u003c/b>\u003cb class=\"key\">사례\u003c/b>로 정리합니다. 힘은 강요가 아니라 의존에서 나온다는 결론이죠.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 궁극적 힘의 정의예요. 이 글은 궁극적 힘이 사람들을 원하는 대로 행동하게 만드는 힘이라고 말합니다. 중요한 건 강요가 아니라 자발성이라는 점이에요. 상대가 스스로 당신이 소망하는 것을 줄 때, 그 힘은 견줄 자가 없는 것이 됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 방법이 나옵니다. 그런 지위를 얻는 가장 좋은 방법은 의존 관계를 형성하는 것이에요. 상대가 나에게 의지하게 만드는 관계를 만들라는 뜻이죠. 여기서 dependence는 상대가 나에게 기대어 의지하게 되는 상태를 뜻해요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 그 관계가 왜 강한지에 대한 설명이에요. 주인은 당신의 봉사를 요구하지만, 그는 약해서 당신 없이는 기능하지 못합니다. 당신이 그의 일에 깊이 관여하면 당신을 없애는 일은 그에게 큰 어려움이 되고, 대신할 사람을 훈련시키는 데 귀중한 시간을 빼앗기게 됩니다. 그래서 당신은 대체 불가능한 사람이 되는 거예요.","hl":"f2"},{"n":7,"text":"마지막 단계는 결과예요. 그런 관계가 확립되면 당신은 우세한 입장에서 주인을 원하는 대로 움직이게 됩니다. 글은 이것을 왕의 신하가 실질적으로 왕을 지배하는 전형적인 사례로 정리합니다. 결국 힘은 강요가 아니라 의존에서 나온다는 것이 이 글의 결론이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 첫 문장에서 궁극적 힘의 정의라는 \u003cb class=\"key\">주제\u003c/b>를 먼저 던지고, 이어서 그 힘을 얻는 방법과 이유를 차례로 붙입니다. 그래서 \u003cb class=\"key\">주장-근거\u003c/b> 전개이며, 주제문이 맨 앞에 있으니 \u003cb class=\"key\">두괄식\u003c/b>입니다. 세 번째 문장은 방법을, 네 번째 문장은 그 방법이 왜 강력한지에 대한 근거를 제시합니다. 마지막 문장은 신하와 왕의 사례로 주장을 \u003cb class=\"key\">구체화\u003c/b>하며 글을 닫습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>The ultimate power is (1)\u003c/b>\u003cspan>주제문 제시·정의\u003c/span>\u003cb>The best way to achieve this position is (3)\u003c/b>\u003cspan>방법 제시(근거 시작)\u003c/span>\u003cb>Once such a relationship is established (5)\u003c/b>\u003cspan>조건-결과 전환\u003c/span>\u003cb>It is the classic case of (6)\u003c/b>\u003cspan>예시로 마무리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the power to get people to do as you wish\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they willingly grant you what you desire\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a relationship of dependence\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">you have the upper hand\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the servant of the king who actually controls the king\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>주인(the master)\u003c/th>\u003cth>신하(the servant, you)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>당신의 봉사를 요구하지만 당신 없이는 기능하지 못함\u003c/td>\u003ctd>그의 일에 깊이 관여해 대체 불가능해짐\u003c/td>\u003c/tr>\u003ctr>\u003ctd>당신을 없애면 큰 어려움과 시간 손실\u003c/td>\u003ctd>우세한 입장에서 주인을 원하는 대로 움직임\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 주장과 근거입니다. 첫 문장에서 궁극적 힘에 대한 주제를 먼저 던지고, 그다음에 방법과 이유를 붙이는 구조죠. 주제문이 맨 앞에 있으니까 두괄식이라고 정리하면 됩니다. 마지막 문장은 신하와 왕의 사례로 앞의 주장을 구체화해 줍니다.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보세요. 첫 문장의 The ultimate power is는 주제를 정의하며 글을 엽니다. The best way to achieve this position is는 방법을 제시하면서 근거로 넘어가고, Once such a relationship is established는 조건에서 결과로 방향을 틀어 줍니다. 마지막의 It is the classic case of는 예시로 글을 닫는 신호이고요. 이렇게 주제, 방법, 조건, 사례가 이어지는 흐름을 잡으면 전체 구조가 한눈에 들어옵니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>ultimate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>궁극적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>power\u003c/b>\u003cem>명사\u003c/em>\u003cspan>힘, 권력\u003c/span>\u003c/div>\u003cdiv>\u003cb>force\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강요하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>willingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자발적으로, 기꺼이\u003c/span>\u003c/div>\u003cdiv>\u003cb>grant\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주다, 부여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>desire\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소망하다, 바라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>untouchable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어느 누구도 견줄 자가 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>achieve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>얻어내다, 달성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>position\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지위\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>형성하다, 창출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>relationship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관계\u003c/span>\u003c/div>\u003cdiv>\u003cb>dependence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의존, 의지\u003c/span>\u003c/div>\u003cdiv>\u003cb>master\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주인, 상전\u003c/span>\u003c/div>\u003cdiv>\u003cb>require\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>service\u003c/b>\u003cem>명사\u003c/em>\u003cspan>봉사, 복무\u003c/span>\u003c/div>\u003cdiv>\u003cb>weak\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>약한\u003c/span>\u003c/div>\u003cdiv>\u003cb>function\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기능하다, 일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>involve oneself in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 열중하다, 몰두하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>do away with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>없애다, 제거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>difficulty\u003c/b>\u003cem>명사\u003c/em>\u003cspan>어려움\u003c/span>\u003c/div>\u003cdiv>\u003cb>at least\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>적어도\u003c/span>\u003c/div>\u003cdiv>\u003cb>valuable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>귀중한\u003c/span>\u003c/div>\u003cdiv>\u003cb>train\u003c/b>\u003cem>동사\u003c/em>\u003cspan>훈련시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>replace\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대체하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>establish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확립하다, 형성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>upper hand\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우세한 입장\u003c/span>\u003c/div>\u003cdiv>\u003cb>classic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전형적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>servant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신하, 하인\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실질적으로, 실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>control\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지배하다, 통제하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚어 볼게요. dependence는 의존이나 의지라는 뜻이고, establish는 관계를 확립한다고 할 때 쓰입니다. do away with는 없애다라는 뜻의 숙어이고, upper hand는 우세한 입장을 말해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">dependence\u003c/b>\u003cspan class=\"m\">의존, 의지\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reliance\u003c/span>\u003cspan class=\"s\">dependency\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">independence\u003c/span>\u003cspan class=\"a\">autonomy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">willingly\u003c/b>\u003cspan class=\"m\">자발적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">voluntarily\u003c/span>\u003cspan class=\"s\">readily\u003c/span>\u003cspan class=\"s\">spontaneously\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reluctantly\u003c/span>\u003cspan class=\"a\">unwillingly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">force\u003c/b>\u003cspan class=\"m\">강요하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">compel\u003c/span>\u003cspan class=\"s\">coerce\u003c/span>\u003cspan class=\"s\">pressure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">allow\u003c/span>\u003cspan class=\"a\">permit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">untouchable\u003c/b>\u003cspan class=\"m\">견줄 자가 없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unbeatable\u003c/span>\u003cspan class=\"s\">invincible\u003c/span>\u003cspan class=\"s\">unassailable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">vulnerable\u003c/span>\u003cspan class=\"a\">weak\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">grant\u003c/b>\u003cspan class=\"m\">주다, 부여하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">give\u003c/span>\u003cspan class=\"s\">bestow\u003c/span>\u003cspan class=\"s\">confer\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">achieve\u003c/b>\u003cspan class=\"m\">얻어내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">attain\u003c/span>\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"s\">gain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fail\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">establish\u003c/b>\u003cspan class=\"m\">확립하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">set up\u003c/span>\u003cspan class=\"s\">found\u003c/span>\u003cspan class=\"s\">create\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abolish\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. dependence는 reliance, dependency와 뜻이 가깝고 independence와는 반대지요. willingly는 voluntarily, readily와 가깝고 reluctantly와는 반대입니다. grant는 give, bestow와 통하고 deny와는 반대이며, establish는 set up, found와 가깝고 abolish와는 반대예요. untouchable은 unbeatable, invincible과 가깝고 vulnerable과는 반대라는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">궁극적 힘은\u003c/span>\u003cspan class=\"en\">The ultimate power\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">힘이다\u003c/span>\u003cspan class=\"en\">is the power\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 하게 만드는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 원하는 바대로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">wish\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">궁극적 힘은 당신이 원하는 바대로 사람들이 행동하게 만드는 힘이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">궁극적 \u003c/b>\u003cb class=\"key\">힘\u003c/b>은 남을 강제하는 힘이 아니라 상대가 스스로 움직이게 만드는 힘이라는 점을 못 박는 \u003cb class=\"key\">주제문\u003c/b>이에요. 이 한 문장이 글 전체에서 '어떻게 하면 그런 힘을 얻을까'라는 화두를 던지고 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">get + 목적어 + to부정사(목적격보어)\u003c/span> : get + [목적어 people] + [to do (to부정사/목적격보어)] : \"사람들이 하게 만드는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 as(방식·양태)\u003c/span> : as + [주어 you] + [동사 wish (완전한 절)] : \"당신이 원하는 바대로\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The ultimate power, 궁극적 힘은. is the power, 힘이다. to get people to do, 사람들이 하게 만드는. as you wish, 당신이 원하는 바대로. 이 문장 전체를 해석하면, 궁극적 힘은 당신이 원하는 바대로 사람들이 행동하게 만드는 힘이다.","hl":"m"},{"n":13,"text":"이 문장은 글의 주제문이에요. 궁극적 힘은 남을 강제하는 힘이 아니라 상대가 스스로 움직이게 만드는 힘이라는 점을 못 박고 있죠. 그래서 앞으로 '어떻게 하면 그런 힘을 얻을까'라는 이야기가 이어집니다.","hl":"mn"},{"n":14,"text":"첫 번째 어법은 to get people to do예요. get은 목적어 people 뒤에 to부정사를 목적격보어로 데려와서 '~하게 만들다'라는 구조를 만들어요. 여기서 to부정사는 목적어의 행동을 이끌어 내는 역할을 합니다. 두 번째는 as you wish인데, as는 '~하는 방식으로, ~대로'라는 뜻의 접속사예요. 그래서 뒤에 you wish처럼 주어와 동사를 갖춘 완전한 절이 오는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 이렇게 할 수 있을 때\u003c/span>\u003cspan class=\"en\">When you can do this\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들에게 강요하거나 다치게 해야 할 필요 없이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">force \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">hurt \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 자발적으로 당신에게 주고자 할 때\u003c/span>\u003cspan class=\"en\">when they willingly grant you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 소망하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">desire\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 힘은 어느 누구도 견줄 자가 없는 것이 된다\u003c/span>\u003cspan class=\"en\">then your power is untouchable.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 사람들에게 강요하거나 다치게 해야 할 필요 없이 이렇게 할 수 있을 때, 그들이 자발적으로 당신이 소망하는 것을 당신에게 주고자 할 때, 당신의 힘은 어느 누구도 견줄 자가 없는 것이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 강요하거나 다치게 하지 않고, 상대가 \u003cb class=\"key\">자발적\u003c/b>으로 원하는 것을 내어 줄 때 성립하는 힘이라는 조건을 when절 두 개로 제시해요. 그 두 조건이 채워지면 그 힘은 \u003cb class=\"key\">견줄 \u003c/b>\u003cb class=\"key\">자가 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 것이 된다는 뜻이죠. 앞 문장의 정의를 조건과 결과로 풀어 놓은 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 without + 동명사(부정구)\u003c/span> : without + [having to force ... or hurt ... (동명사구)] : \"사람들에게 강요하거나 다치게 해야 할 필요 없이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">or에 의한 병렬 구조\u003c/span> : [to force people] or [(to) hurt them] : \"사람들에게 강요하거나 다치게 하거나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 what(선행사 포함)\u003c/span> : what + [주어 you] + [동사 desire] = 명사절 : \"당신이 소망하는 것을\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"When you can do this, 당신이 이렇게 할 수 있을 때. without having to force people or hurt them, 사람들에게 강요하거나 다치게 해야 할 필요 없이. when they willingly grant you, 그들이 자발적으로 당신에게 주고자 할 때. what you desire, 당신이 소망하는 것을. then your power is untouchable, 당신의 힘은 어느 누구도 견줄 자가 없는 것이 된다. 이 문장 전체를 해석하면, 당신이 사람들에게 강요하거나 다치게 해야 할 필요 없이 이렇게 할 수 있을 때, 그들이 자발적으로 당신이 소망하는 것을 당신에게 주고자 할 때, 당신의 힘은 어느 누구도 견줄 자가 없는 것이 된다.","hl":"m"},{"n":16,"text":"두 개의 when절이 조건을 제시하고 있어요. 사람들에게 강요하거나 다치게 하지 않고, 상대가 자발적으로 당신이 소망하는 것을 내어 줄 때 성립하는 힘이라는 거죠. 두 조건이 채워지면 그 힘은 견줄 자가 없는 것이 된다는 뜻이고, 앞 문장의 정의를 조건과 결과로 풀어 놓은 겁니다.","hl":"mn"},{"n":17,"text":"첫 번째는 without having to force people or hurt them이에요. without은 전치사라서 뒤에 반드시 동명사가 와야 하고, have to의 동명사형인 having to가 '~해야 할 필요'를 나타냅니다. 두 번째는 what you desire인데, what은 선행사를 품은 관계대명사로 '~하는 것'이라는 명사절을 만들어서 grant의 목적어 역할을 해요. 세 번째는 force people or hurt them, or 앞뒤에 동사원형이 나란히 놓인 병렬 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 좋은 방법은\u003c/span>\u003cspan class=\"en\">The best way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 지위를 얻어내기 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">achieve \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class= {"n":19,"text":"이 문장은 글의 핵심 처방을 제시해요. 지위를 얻는 방법은 힘으로 누르는 게 아니라 상대가 나 없이는 안 되는 의존 관계를 만드는 것이라는 뜻이죠. dependence는 '자립'이 아니라 '의존'이라는 점을 꼭 붙잡아야 합니다.","hl":"mn"},{"n":20,"text":"첫 번째는 to achieve this position이에요. to부정사가 앞의 The best way를 뒤에서 꾸며서 '~하기 위한 방법'이라는 뜻을 만들어 줍니다. 두 번째는 is to create인데, be동사 뒤에서 주어의 내용을 다시 설명하는 주격보어 자리라서 명사적 to부정사가 온 거예요. 세 번째는 a relationship of dependence, of가 '~의'로 관계의 성질을 규정하고, dependence는 depend의 명사형으로 '의존'이라는 뜻입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주인은 당신의 봉사를 요구한다;\u003c/span>\u003cspan class=\"en\">The master requires your services;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 약하거나 당신 없이는 기능할 수 없다;\u003c/span>\u003cspan class=\"en\">he is weak, or unable to function without you;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 그의 일에 너무 깊이 관여해 왔다\u003c/span>\u003cspan class=\"en\">you have involved yourself in his work \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">deeply \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 당신을 버리는 것은 그에게 엄청난 어려움을 가져올 것이다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">away \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">you\u003c/span> would bring him great difficulty,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 적어도 빼앗길 귀중한 시간을 의미할 것이다\u003c/span>\u003cspan class=\"en\">or at least would mean valuable \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">lost\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신을 대체할 다른 사람을 훈련시키는 데에서.\u003c/span>\u003cspan class=\"en\">in training another \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">replace \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">주인은 당신에게 봉사를 요구하는데, 그는 몸이 약해서 당신 없이는 기능할(일할) 수 없으며, 당신은 그의 일에 매우 열중하여 당신을 버리는 것은 그에게 엄청난 어려움을 가져오거나 적어도 당신을 대체할 사람을 훈련시키는데 빼앗길 귀중한 시간을 의미할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">의존 \u003c/b>\u003cb class=\"key\">관계\u003c/b>가 성립하는 구체적 조건을 설명해요. 주인이 당신의 봉사 없이는 기능하기 어렵고, 당신을 대체하는 데 귀중한 시간이 들수록 당신의 힘은 커진다는 뜻이죠. 세미콜론으로 주인의 약함과 당신의 깊은 관여를 나란히 제시해 \u003cb class=\"key\">우세한 \u003c/b>\u003cb class=\"key\">입장\u003c/b>의 근거를 만드는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">so ~ that 구문(결과)\u003c/span> : so + [부사] + that + [절] : \"너무 깊이 ~해서 ...\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [Doing away with you] + would bring : \"당신을 버리는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사 후치수식\u003c/span> : valuable [time] + [lost ...] : \"빼앗길 귀중한 시간\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사 형용사적 용법\u003c/span> : another + [to replace you] : \"당신을 대체할 다른 사람\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The master requires your services, 주인은 당신의 봉사를 요구한다;. he is weak, or unable to function without you, 그는 약하거나 당신 없이는 기능할 수 없다;. you have involved yourself in his work so deeply, 당신은 그의 일에 너무 깊이 관여해 왔다. that doing away with you would bring him great difficulty, 그래서 당신을 버리는 것은 그에게 엄청난 어려움을 가져올 것이다. or at least would mean valuable time lost, 혹은 적어도 빼앗길 귀중한 시간을 의미할 것이다. in training another to replace you, 당신을 대체할 다른 사람을 훈련시키는 데에서.. 이 문장 전체를 해석하면, 주인은 당신에게 봉사를 요구하는데, 그는 몸이 약해서 당신 없이는 기능할(일할) 수 없으며, 당신은 그의 일에 매우 열중하여 당신을 버리는 것은 그에게 엄청난 어려움을 가져오거나 적어도 당신을 대체할 사람을 훈련시키는데 빼앗길 귀중한 시간을 의미할 것이다.","hl":"m"},{"n":22,"text":"이 문장은 의존 관계가 성립하는 구체적인 조건을 설명해요. 주인이 당신의 봉사 없이는 기능하기 어렵고 당신을 대체하는 데 귀중한 시간이 들수록 당신의 힘은 커진다는 뜻이죠. 세미콜론으로 주인의 약함과 당신의 깊은 관여를 나란히 제시해서 우세한 입장의 근거를 만들어 주는 문장이에요.","hl":"mn"},{"n":23,"text":"첫 번째로 so deeply that은 so와 that 사이의 deeply가 정도를 나타내고 that절이 그 결과를 설명하는 결과 구문이에요. 두 번째로 doing away with you는 동명사 doing이 주어로 쓰여 '당신을 버리는 것'이라는 명사구를 만든 형태죠. 세 번째로 time lost는 과거분사 lost가 앞의 time을 뒤에서 꾸며 주면서 수동 관계를 나타내요. 네 번째로 to replace you는 앞의 another를 꾸며 '당신을 대체할 다른 사람'이라는 형용사적 의미를 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일단 그러한 관계가 형성되면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Once \u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">relationship \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">established\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 우세한 입장이 되어\u003c/span>\u003cspan class=\"en\">you have the upper hand\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주인으로 하여금 당신이 원하는 대로 하게 한다.\u003c/span>\u003cspan class=\"en\">to \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">master \u003c/span>\u003cspan class=\"tgt\">do\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">wish\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러한 관계가 형성이 되면 당신은 우세한 입장이 되어 주인으로 하여금 당신이 원하는 대로 하게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">의존 \u003c/b>\u003cb class=\"key\">관계\u003c/b>가 일단 확립되면 힘의 방향이 역전된다는 결론을 제시해요. 주인이 당신을 필요로 하기 때문에 당신이 \u003cb class=\"key\">우세한 \u003c/b>\u003cb class=\"key\">입장\u003c/b>에서 주인에게 원하는 것을 요구할 수 있다는 거죠. 앞 문장의 조건이 실제 \u003cb class=\"key\">통제력\u003c/b>으로 바뀌는 지점을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Once 접속사 + 수동태\u003c/span> : Once + 주어 + is + p.p. : \"일단 그러한 관계가 형성되면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 동사원형\u003c/span> : make + [목적어] + [동사원형] : \"주인으로 하여금 하게 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">as 접속사(양태)\u003c/span> : do + as + 주어 + 동사 : \"당신이 원하는 대로\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Once such a relationship is established, 일단 그러한 관계가 형성되면. you have the upper hand, 당신은 우세한 입장이 되어. to make the master do as you wish, 주인으로 하여금 당신이 원하는 대로 하게 한다.. 이 문장 전체를 해석하면, 그러한 관계가 형성이 되면 당신은 우세한 입장이 되어 주인으로 하여금 당신이 원하는 대로 하게 한다.","hl":"m"},{"n":25,"text":"이 문장은 의존 관계가 일단 확립되면 힘의 방향이 역전된다는 결론을 보여 줘요. 주인이 당신을 필요로 하기 때문에 당신이 우세한 입장에서 원하는 것을 요구할 수 있다는 거죠. 앞 문장의 조건이 실제 통제력으로 바뀌는 지점을 짚어 주는 문장이에요.","hl":"mn"},{"n":26,"text":"첫 번째로 Once such a relationship is established에서 Once는 조건을 나타내는 접속사이고 is established는 수동태예요. 두 번째로 make the master do는 사역동사 make 뒤에 목적어와 동사원형이 온 구조로 '주인으로 하여금 하게 하다'라는 사역 의미를 만들어요. 세 번째로 as you wish에서 as는 '당신이 원하는 대로'라는 양태를 나타내는 접속사로, wish 뒤에 목적어가 생략된 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 전형적인 사례이다\u003c/span>\u003cspan class=\"en\">It is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">classic \u003c/span>\u003cspan class=\"tgt\">case\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕의 신하에 관한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">servant \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">king\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실질적으로 왕을 지배하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">actually \u003c/span>\u003cspan class=\"tgt\">controls \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">king\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 왕의 신하가 실질적으로 왕을 지배하는 전형적인 사례이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 설명한 \u003cb class=\"key\">의존 \u003c/b>\u003cb class=\"key\">관계\u003c/b>의 힘 역전을 왕과 신하라는 비유로 요약해요. 겉으로는 신하가 왕을 섬기지만, 실제로는 신하가 왕을 \u003cb class=\"key\">통제\u003c/b>하는 전형적인 사례라는 뜻이죠. 글 전체의 결론을 이미지로 압축해 \u003cb class=\"key\">우세한 \u003c/b>\u003cb class=\"key\">입장\u003c/b>이 누구에게 있는지 분명히 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사구 보어\u003c/span> : It is + [the classic case] : \"전형적인 사례\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 명사 수식\u003c/span> : the case + [of the servant ...] : \"왕의 신하에 관한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : [the servant] + who + 동사 : \"실질적으로 왕을 지배하는\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It is the classic case, 그것은 전형적인 사례이다. of the servant of the king, 왕의 신하에 관한. who actually controls the king, 실질적으로 왕을 지배하는. 이 문장 전체를 해석하면, 그것은 왕의 신하가 실질적으로 왕을 지배하는 전형적인 사례이다.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 설명한 의존 관계의 힘 역전을 왕과 신하라는 비유로 요약해요. 겉으로는 신하가 왕을 섬기지만 실제로는 신하가 왕을 통제하는 전형적인 사례라는 뜻이죠. 글 전체의 결론을 이미지로 압축해서 우세한 입장이 누구에게 있는지 분명히 보여 줘요.","hl":"mn"},{"n":29,"text":"첫 번째로 the classic case는 It is 뒤에서 주어의 정체를 설명하는 명사구 보어예요. 두 번째로 of the servant of the king에서 of 전치사구가 앞의 case를 뒤에서 꾸며 주며 어떤 사례인지 구체화하죠. 세 번째로 who actually controls the king에서 who는 앞의 선행사 servant를 받는 주격 관계대명사이고, controls는 단수 선행사에 맞춘 수 일치 형태예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>궁극적 힘은 사람을 강요하지 않고 원하는 대로 행동하게 만드는 \u003cb class=\"key\">견줄 \u003c/b>\u003cb class=\"key\">자가 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 힘이다.\u003c/li>\u003cli>그 힘을 얻는 가장 좋은 방법은 상대가 나에게 의지하는 \u003cb class=\"key\">의존 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 형성하는 것이다.\u003c/li>\u003cli>주인이 나 없이는 기능하지 못하고 나를 대체하는 데 큰 손실이 생길 때, 나는 \u003cb class=\"key\">대체 \u003c/b>\u003cb class=\"key\">불가능한\u003c/b> 존재가 된다.\u003c/li>\u003cli>관계가 확립되면 신하가 왕을 지배하듯 \u003cb class=\"key\">우세한 \u003c/b>\u003cb class=\"key\">입장\u003c/b>에서 주인을 움직이게 된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The ultimate power comes not from forcing people but from making them depend on you so deeply that they willingly do as you wish.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">진정한 \u003cb class=\"key\">궁극적 \u003c/b>\u003cb class=\"key\">힘\u003c/b>은 사람을 강요하지 않고도 원하는 대로 행동하게 만드는 힘이며, 그것을 얻는 가장 좋은 방법은 상대가 나 없이는 기능하지 못하는 \u003cb class=\"key\">의존 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 형성하는 것이다. 그러한 관계가 확립되면 당신은 우세한 입장에서 주인을 움직이게 되는데, 이는 왕의 신하가 실질적으로 왕을 지배하는 전형적인 사례이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 글은 힘의 원천을 강요가 아니라 의존 관계에서 찾은 글이었어요. 궁극적 힘은 사람들이 자발적으로 따르게 만들고, 그 바탕에는 나를 대체하기 어렵게 만드는 관계가 있습니다. 그 결과 신하가 왕을 지배하는 역설적인 상황까지 나오죠. 오늘 내용 잘 정리해 두고, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
