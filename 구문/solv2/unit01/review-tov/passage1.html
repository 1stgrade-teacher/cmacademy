<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>to-v Review passage1 — AI 강의</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"to-v Review passage1","audioDir":"passage1_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">to review\u003cbr>reading01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Be Fair to Yourself: Don't Be Your Own Worst Critic\u003c/h1>\u003ch2>자신에게 공정하라: 스스로의 최악의 비판자가 되지 말라\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 우리는 실수 후 자신을 다른 사람보다 더 비판하고 단점을 과장하기 쉽지만, \u003cb class=\"key\">정직한 \u003c/b>\u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">평가\u003c/b>와 \u003cb class=\"key\">개선\u003c/b> 노력에 더해 자신의 \u003cb class=\"key\">성취\u003c/b>에 자부심을 갖는 것이 중요하다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>We should evaluate ourselves honestly and seek improvement, but we should not exaggerate our flaws or forget to take pride in our accomplishments.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 자신을 너무 가혹하게 비판하지 말고 균형 있게 바라보자는 지문을 함께 읽어 볼게요. 이 글은 우리가 실수 뒤에 자신을 다른 사람보다 더 비판하고 단점을 과장하기 쉽지만, 정직한 자기 평가와 개선 노력에 더해 자신의 성취에 자부심을 가져야 한다고 말해요. 한 문장으로 요약하면, 스스로에게 공정하고 성취를 인정하며 자신감을 회복하자는 것이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 흔히 자신을 객관적으로 보는 것 같지만, 실제로는 자기 자신에게 가장 가혹한 평가자가 되기 쉽습니다. 심리학에서는 이런 경향을 자기 비판 self-criticism 또는 부정적 자기 대화 negative self-talk라고 부릅니다. 사람은 자신에게 더 높은 기준을 세우기 때문에 실수 후 다른 사람보다 자신을 더 강하게 책망합니다. 이는 시험 점수 하나만 보고 자신을 실패자로 단정하는 것과 비슷합니다. 중요한 것은 단점을 인정하되 \u003cb class=\"key\">균형 \u003c/b>\u003cb class=\"key\">잡힌 \u003c/b>\u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">평가\u003c/b>를 통해 \u003cb class=\"key\">자신감\u003c/b>을 회복하는 것입니다.\u003c/div>","segs":[{"n":2,"text":"우리는 흔히 자신을 객관적으로 보는 것 같지만 실제로는 자기 자신에게 가장 가혹한 평가자가 되기 쉽습니다. 심리학에서는 이런 경향을 자기 비판 또는 부정적 자기 대화라고 부릅니다. 사람은 자신에게 더 높은 기준을 세우기 때문에 실수 후 다른 사람보다 자신을 더 강하게 책망합니다. 이는 시험 점수 하나만 보고 자신을 실패자로 단정하는 것과 비슷합니다. 중요한 것은 단점을 인정하되 균형 잡힌 자기 평가를 통해 자신감을 회복하는 것입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>스스로를 향한 비판\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>우리 중 다수는 자신의 \u003cb class=\"key\">최악의 \u003c/b>\u003cb class=\"key\">비판가\u003c/b>가 됩니다. 그래서 \u003cb class=\"key\">실수\u003c/b>를 하면 다른 누구보다 자신에게 더 비판적이 됩니다. 이는 글 전체의 문제를 제시하는 출발점입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>높은 기대의 결과\u003csmall>원인 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>자신에게 더 많은 것을 \u003cb class=\"key\">기대\u003c/b>하기 때문에 이런 비판이 생깁니다. 그 결과 잘한 것보다 \u003cb class=\"key\">문제가 \u003c/b>\u003cb class=\"key\">되는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 먼저 보고, 그것을 \u003cb class=\"key\">과장\u003c/b>하는 경향이 있습니다. 원인과 결과를 이어 주는 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>과장의 예시\u003csmall>예시 · 문장 5\u003c/small>\u003c/h4>\u003cp>약간 살이 찐 경우에도 자신을 뚱뚱하고 보기 흉하다고 말하는 \u003cb class=\"key\">예시\u003c/b>가 나옵니다. 이는 실제보다 \u003cb class=\"key\">단점\u003c/b>을 부풀리는 태도를 보여 줍니다. 일상에서 흔히 볼 수 있는 \u003cb class=\"key\">과장\u003c/b>의 장면입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>균형과 자부심\u003csmall>주장 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>때로 자신에게 \u003cb class=\"key\">실망\u003c/b>하는 것은 정상이지만, 자신을 \u003cb class=\"key\">깎아내릴수록\u003c/b> \u003cb class=\"key\">자신감\u003c/b>을 되찾기 어렵습니다. 그래서 정직하게 평가하고 개선점을 찾되, 자신이 이룬 것에 \u003cb class=\"key\">자부심\u003c/b>을 가져야 합니다. 실패와 실수에도 불구하고 가끔은 \u003cb class=\"key\">격려\u003c/b>를 받을 자격이 있다는 것이 글의 주장입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가며 문제 제기, 원인, 예시, 해결책이 어떻게 이어지는지 살펴보겠습니다.","hl":null},{"n":4,"text":"먼저 글은 우리 중 다수가 자신의 최악의 비판가라는 점에서 시작합니다. 그래서 실수를 하면 다른 누구보다 자신에게 더 비판적이 된다고 말하죠. 이 부분은 글 전체의 문제를 제시하는 출발점이에요.","hl":"f0"},{"n":5,"text":"다음으로 자신에게 더 많은 것을 기대하기 때문에 이런 비판이 생긴다고 설명합니다. 그 결과 잘한 것보다 문제가 되는 것을 먼저 보고 그것을 과장하는 경향이 있다는 거죠. 원인과 결과를 이어 주는 단계라서 흐름을 잡기 좋아요.","hl":"f1"},{"n":6,"text":"이어서 약간 살이 찐 경우에도 자신을 뚱뚱하고 보기 흉하다고 말하는 예시가 나옵니다. 이는 실제보다 단점을 부풀리는 태도를 보여 줍니다. 일상에서 흔히 볼 수 있는 과장의 장면이에요.","hl":"f2"},{"n":7,"text":"마지막으로 때로 자신에게 실망하는 것은 정상이지만 자신을 깎아내릴수록 자신감을 되찾기 어렵다고 말합니다. 그래서 정직하게 평가하고 개선점을 찾되 자신이 이룬 것에 자부심을 가져야 한다고 주장하죠. 실패와 실수에도 불구하고 가끔은 격려를 받을 자격이 있다는 것이 글의 최종 주장입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 자신을 과도하게 비판하는 \u003cb class=\"key\">문제\u003c/b>를 먼저 제시하고, 그 원인과 예시를 든 뒤 마지막에 \u003cb class=\"key\">해결책\u003c/b>을 제시합니다. 따라서 전개 방식은 \u003cb class=\"key\">문제-해결\u003c/b>이고, 중심 주장이 뒤쪽에 나오므로 \u003cb class=\"key\">미괄식\u003c/b>입니다. 주제문은 정직하게 평가하되 성취에 자부심을 가지라고 말하는 일곱 번째 문장입니다. 마지막 문장은 그 주장을 \u003cb class=\"key\">격려\u003c/b>의 표현으로 다시 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (2)\u003c/b>\u003cspan>문제 심화·결과\u003c/span>\u003cb>because (3)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>As a result (4)\u003c/b>\u003cspan>결과 제시\u003c/span>\u003cb>For example (5)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>but (6)\u003c/b>\u003cspan>전환·대조\u003c/span>\u003cb>So (7)\u003c/b>\u003cspan>해결책 제시\u003c/span>\u003cb>Despite (8)\u003c/b>\u003cspan>양보·강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">our own worst critics\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">more critical of ourselves\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">see what's wrong with us\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">put ourselves down\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">failings and mistakes\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>과도한 자기 비판\u003c/th>\u003cth>균형 잡힌 자기 평가\u003c/th>\u003c/tr>\u003ctr>\u003ctd>단점을 과장함\u003c/td>\u003ctd>단점을 인정하되 개선함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자신감을 잃기 쉬움\u003c/td>\u003ctd>성취에 자부심을 가짐\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 자신을 과도하게 비판하는 문제를 먼저 제시하고 원인과 예시를 든 뒤 마지막에 해결책을 제시합니다. 그래서 전개 방식은 문제 해결이고 중심 주장이 뒤쪽에 나오므로 미괄식이라고 볼 수 있어요. 주제문은 정직하게 평가하되 성취에 자부심을 가지라고 말하는 일곱 번째 문장입니다. 마지막 문장은 그 주장을 격려의 표현으로 다시 강조합니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 두 번째 문장의 So가 문제를 이어 주고, 세 번째 문장의 because가 원인을 알려 줍니다. 네 번째 문장의 As a result는 결과를, 다섯 번째 문장의 For example은 예시를 표시하죠. 여섯 번째 문장의 but에서 자기 비판에 대한 전환이 시작되고, 일곱 번째 문장의 So가 해결책을 제시합니다. 마지막 Despite는 실패와 실수에도 불구하고 격려를 받을 자격이 있다는 점을 강조해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>critic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비판가, 비평가\u003c/span>\u003c/div>\u003cdiv>\u003cb>worst\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>최악의\u003c/span>\u003c/div>\u003cdiv>\u003cb>make a mistake\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>실수를 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>critical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비판적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>expect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>as a result\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그 결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>tend to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 경향이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>what's wrong\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>문제가 되는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>exaggerate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>과장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>slightly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>약간\u003c/span>\u003c/div>\u003cdiv>\u003cb>overweight\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>살이 찐, 과체중의\u003c/span>\u003c/div>\u003cdiv>\u003cb>fat\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>뚱뚱한\u003c/span>\u003c/div>\u003cdiv>\u003cb>ugly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>보기 흉한\u003c/span>\u003c/div>\u003cdiv>\u003cb>normal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>disappointed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>실망한\u003c/span>\u003c/div>\u003cdiv>\u003cb>from time to time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>때때로\u003c/span>\u003c/div>\u003cdiv>\u003cb>put down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>깎아내리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>regain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>되찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>confidence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자신감\u003c/span>\u003c/div>\u003cdiv>\u003cb>evaluate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>평가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>honestly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정직하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>look for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>improvement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개선\u003c/span>\u003c/div>\u003cdiv>\u003cb>take pride in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 자부심을 가지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>accomplishment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성취, 업적\u003c/span>\u003c/div>\u003cdiv>\u003cb>despite\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에도 불구하고\u003c/span>\u003c/div>\u003cdiv>\u003cb>failing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실패, 결점\u003c/span>\u003c/div>\u003cdiv>\u003cb>deserve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~할 자격이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pat on the back\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>격려, 칭찬\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 몇 개 짚어 볼게요. make a mis cspan class=\"s\">restore\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">forfeit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">evaluate\u003c/b>\u003cspan class=\"m\">평가하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assess\u003c/span>\u003cspan class=\"s\">judge\u003c/span>\u003cspan class=\"s\">appraise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">improvement\u003c/b>\u003cspan class=\"m\">개선\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">betterment\u003c/span>\u003cspan class=\"s\">enhancement\u003c/span>\u003cspan class=\"s\">progress\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deterioration\u003c/span>\u003cspan class=\"a\">decline\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accomplishment\u003c/b>\u003cspan class=\"m\">성취\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">achievement\u003c/span>\u003cspan class=\"s\">success\u003c/span>\u003cspan class=\"s\">feat\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">failure\u003c/span>\u003cspan class=\"a\">defeat\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘도 정리해 볼게요. critical은 비판적인이라는 뜻으로 judgmental이나 faultfinding과 가깝고 supportive나 accepting과는 반대입니다. exaggerate는 overstate나 magnify처럼 과장하다는 의미이고 minimize나 understate와 반대돼요. confidence는 assurance나 self belief로 바꿔 쓸 수 있고 insecurity나 doubt와 반대입니다. evaluate는 assess나 judge와 가깝고 ignore나 overlook과는 반대라는 점도 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 중 다수는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Many \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이다\u003c/span>\u003cspan class=\"en\">are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 자신의 최악의 비판가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">worst \u003c/span>\u003cspan class=\"tgt\">critics\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 중 다수는 우리 자신의 최악의 비판가이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자기 비판이 얼마나 흔한지를 \u003cb class=\"key\">일반화\u003c/b>하며 글을 여는 문장이에요. many of us와 our own worst critics를 통해 ‘우리 대부분이 스스로에게 가장 가혹한 \u003cb class=\"key\">비판가\u003c/b>’라는 필자의 전제를 먼저 깔아 주죠. own이 들어가면서 ‘남이 아닌 바로 \u003cb class=\"key\">자신\u003c/b>의’라는 점이 강조돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부분 표현 주어(of + 복수대명사)\u003c/span> : [Many of + 복수대명사] + 복수동사 : \"우리 중 다수는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격 강조의 own\u003c/span> : [소유격 + own + 명사] : \"우리 자신의 최악의 비판가\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Many of us, 우리 중 다수는. are, 이다. our own worst critics, 우리 자신의 최악의 비판가. 이 문장 전체를 해석하면, 우리 중 다수는 우리 자신의 최악의 비판가이다.","hl":"m"},{"n":13,"text":"이 문장은 글의 출발점이에요. 우리 대부분이 자기 자신에게 가장 가혹한 비판가라는 사실을 먼저 깔아 주죠. own이 들어가면서 남이 아닌 바로 자신의 비판가라는 점이 강조됩니다.","hl":"mn"},{"n":14,"text":"첫 번째, Many of us는 of 뒤에 복수대명사가 온 부분 표현 주어라서 동사도 복수형 are를 써요. 두 번째, our own worst critics에서 own은 소유격 뒤에서 자신의 것이라는 의미를 강조하는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 실수를 하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">mistake\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 우리 자신에 대해 더욱 비판적이다\u003c/span>\u003cspan class=\"en\">we are more critical \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">ourselves\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 누구에 대해 그럴 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">anyone \u003c/span>\u003cspan class=\"tgt\">else\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 우리는 실수를 하면, 다른 누구에 대해 비판적인 것보다 우리에 대해 더욱 비판적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 ‘우리는 자기 최악의 비판가’라는 내용에 \u003cb class=\"key\">이유\u003c/b>를 붙여 구체화하는 문장이에요. 실수라는 상황을 예로 들면서, 같은 실수라도 \u003cb class=\"key\">타인\u003c/b>보다 \u003cb class=\"key\">자신\u003c/b>에게 훨씬 가혹하다는 것을 비교급으로 보여 주죠. than 이하에서 critical이 반복되지 않고 be of만 남은 점이 시험 포인트예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 접속사 when(부사절 내 현재시제)\u003c/span> : [when + 주어 + 현재동사], 주어 + 동사 : \"우리가 실수를 하면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사(주어와 동일 대상 지칭)\u003c/span> : [전치사 + 재귀대명사(-self/selves)] : \"우리 자신에 대해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교 구문과 than절의 반복 어구 생략\u003c/span> : [more + 형용사 + than + 주어 + (반복 어구 생략)] : \"다른 누구에 대해 그럴 것보다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"So, 그러므로. when we make a mistake, 우리가 실수를 하면. we are more critical of ourselves, 우리는 우리 자신에 대해 더욱 비판적이다. than we would be of anyone else, 다른 누구에 대해 그럴 것보다. 이 문장 전체를 해석하면, 그러므로 우리는 실수를 하면, 다른 누구에 대해 비판적인 것보다 우리에 대해 더욱 비판적이다.","hl":"m"},{"n":16,"text":"앞에서 말한 자기 비판이 실제로 어떤 모습인지 실수 상황을 통해 보여 주는 문장이에요. 같은 실수를 해도 남에게보다 자기 자신에게 훨씬 가혹하다는 걸 비교급으로 강조하고 있죠.","hl":"mn"},{"n":17,"text":"첫 번째, when we make a mistake는 시간의 부사절이고 부사절 안에서는 미래의 일도 현재시제로 써요. 두 번째, more critical of ourselves than 이하는 비교 구문인데 than 뒤에서 critical이 반복되지 않고 be of anyone else만 남았어요. 세 번째, of ourselves는 주어 we와 같은 대상을 다시 가리키는 재귀대명사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 이렇게 하는 것은\u003c/span>\u003cspan class=\"en\">We do \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">this\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 자신에게 더 많은 걸 기대하기 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">expect \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">ourselves\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들에게 기대하는 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">others\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 이렇게 하는 것은 다른 사람들한테보다 우리 자신한테 더 많은 걸 기대하기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 현상에 대한 \u003cb class=\"key\">원인\u003c/b>을 제시하며 글의 논리를 한 단계 깊게 만드는 문장이에요. this가 앞 문장 전체, 즉 ‘자신에게 더 비판적이라는 태도’를 \u003cb class=\"key\">지시\u003c/b>한다는 점을 잡아야 해요. more ~ than 비교와 대동사 do를 통해 ‘자신에게 기대하는 수준 &gt; 타인에게 기대하는 수준’이라는 \u003cb class=\"key\">비대칭\u003c/b>이 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 this(앞 문장 내용 지칭)\u003c/span> : [지시대명사 this = 앞 문장의 내용 전체] : \"이렇게(자신에게 더 비판적인 것)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유의 부사절 접속사 because\u003c/span> : [주어 + 동사 + because + 주어 + 동사] : \"우리 자신에게 더 많은 걸 기대하기 때문이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">대동사 do(반복 동사 expect의 대체)\u003c/span> : [than + 주어 + do + (목적어)] : \"다른 사람들에게 기대하는 것보다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"We do this, 우리가 이렇게 하는 것은. because we expect more from ourselves, 우리 자신에게 더 많은 걸 기대하기 때문이다. than we do from others, 다른 사람들에게 기대하는 것보다. 이 문장 전체를 해석하면, 우리가 이렇게 하는 것은 다른 사람들한테보다 우리 자신한테 더 많은 걸 기대하기 때문이다.","hl":"m"},{"n":19,"text":"앞 문장에서 말한 자기 비판의 이유를 밝혀 주는 문장이에요. this가 앞 문장 전체를 가리킨다는 걸 먼저 잡으면 해석이 아주 쉬워져요. 결국 자신에게 기대하는 수준이 남에게 기대하는 수준보다 높다는 이야기죠.","hl":"mn"},{"n":20,"text":"첫 번째, this는 앞 문장의 내용 전체를 가리키는 지시대명사예요. 두 번째, because는 원인을 이끄는 부사절 접속사이고 expect A from B 구문이라서 from ourselves가 기대의 대상이 돼요. 세 번째, than we do from others에서 do는 앞의 expect를 반복하지 않으려고 쓴 대동사이고, 해석할 때는 expect로 되살려 읽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 결과,\u003c/span>\u003cspan class=\"en\">As a result,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 보는 경향이 있다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tend \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게 문제가 되는 것을,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what's \u003c/span>\u003cspan class=\"tgt\">wrong \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 잘한 것이 아니라,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">what's \u003c/span>\u003cspan class=\"tgt\">right\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나서 그것을 과장한다.\u003c/span>\u003cspan class=\"en\">and then \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">exaggerate \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 결과, 우리는 우리가 잘한 것이 아니라, 문제가 되는 것을 보고, 그것을 과장하는 경향이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 '자기 자신을 더 혹평한다'는 내용이 어떤 \u003cb class=\"key\">결과\u003c/b>로 이어지는지 보여 주는 문장이에요. 우리는 자기에게서 \u003cb class=\"key\">문제가 \u003c/b>\u003cb class=\"key\">되는 \u003c/b>\u003cb class=\"key\">것\u003c/b>만 골라 보고 잘한 점은 놓친다는 뜻이죠. 문제점과 잘한 점을 \u003cb class=\"key\">대조\u003c/b>시켜, 결국 부족한 부분만 \u003cb class=\"key\">과장\u003c/b>한다는 흐름을 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">tend to부정사(경향 표현)\u003c/span> : tend + [to see (to부정사구/목적어)] : \"보는 경향이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what(선행사 포함)\u003c/span> : what + [불완전한 절] = the thing that ~ : \"우리에게 문제가 되는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정어 not에 의한 대조(병렬 구조)\u003c/span> : see + [what's wrong with us] + not + [what's right] : \"우리가 잘한 것이 아니라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">동사 병렬(to see ~ and then exaggerate)\u003c/span> : tend to [see] ~ and then [exaggerate] it : \"그것을 과장한다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"As a result, 그 결과. we tend to see, 우리는 보는 경향이 있다. what's wrong with us, 우리에게 문제가 되는 것을. not what's right, 우리가 잘한 것이 아니라. and then exaggerate it, 그리고 나서 그것을 과장한다.. 이 문장 전체를 해석하면, 그 결과, 우리는 우리가 잘한 것이 아니라, 문제가 되는 것을 보고, 그것을 과장하는 경향이 있다.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 말한 자기 혹평이 어떤 결과로 이어지는지 알려 줘요. 결국 우리는 나에게 문제가 되는 것만 바라보고 잘한 것은 놓친다는 뜻이죠. 문제가 되는 것과 잘한 것을 대조해서 결국 그 문제점을 과장한다는 흐름입니다.","hl":"mn"},{"n":23,"text":"첫 번째로 tend to see를 보면 tend는 뒤에 to부정사를 데려와서 보는 경향이 있다는 뜻을 만들어요. 두 번째로 what's wrong with us에서 what은 선행사를 품은 관계대명사라서 우리에게 문제가 되는 것이라고 해석하고, 뒤에는 불완전한 절이 와요. 세 번째로 not what's right는 목적어 두 개를 나란히 놓고 두 번째만 not으로 부정해서 잘한 것과 대조하는 장치예요. 마지막으로 exaggerate는 앞의 see와 병렬로 to부정사 자리를 함께 쓰면서 그리고 나서 과장한다로 이어집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 약간 살이 찐 것일 수도 있는데\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">slightly \u003c/span>\u003cspan class=\"tgt\">overweight\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 사람들에게 말한다\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003cspan class=\"tgt\">everyone \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 뚱뚱하고 보기 흉하다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you're \u003c/span>\u003cspan class=\"tgt\">fat \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">ugly\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 당신은 약간 살이 찐 것일 수도 있는데 모든 사람들에게 자신이 뚱뚱하고 보기 흉하다고 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 주장을 \u003cb class=\"key\">예시\u003c/b>로 풀어 주는 문장이에요. 실제로는 약간 살이 쪘을 뿐인데 스스로를 뚱뚱하고 보기 흉하다고 \u003cb class=\"key\">단정\u003c/b>해서 말한다는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 보여 줍니다. 자기 비하가 얼마나 과장되기 쉬운지 몸으로 느끼게 해 주는 대목이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 might + 동사원형(추측)\u003c/span> : might + [be (동사원형)] : \"~일 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 형용사 수식\u003c/span> : [slightly (부사)] + [overweight (형용사)] : \"약간 살이 찐\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략(명사절 목적어)\u003c/span> : tell + [목적어 everyone] + [(that) you're fat and ugly] : \"모든 사람들에게 자신이 뚱뚱하고 보기 흉하다고 말한다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"For example, 예를 들어. you might be slightly overweight, 당신은 약간 살이 찐 것일 수도 있는데. but you tell everyone, 모든 사람들에게 말한다. you're fat and ugly, 자신이 뚱뚱하고 보기 흉하다고. 이 문장 전체를 해석하면, 예를 들어, 당신은 약간 살이 찐 것일 수도 있는데 모든 사람들에게 자신이 뚱뚱하고 보기 흉하다고 말한다.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 한 이야기를 예시로 풀어 주는 문장이에요. 실제로는 살이 조금 쪘을 뿐인데 스스로를 뚱뚱하고 보기 흉하다고 단정해서 말한다는 구체적 상황을 보여 주죠. 자기 비하가 얼마나 쉽게 과장되는지 느끼게 해 주는 대목입니다.","hl":"mn"},{"n":26,"text":"먼저 might be를 보면 조동사 might 뒤에는 언제나 동사원형이 와서 여기서는 추측을 나타내요. 다음으로 slightly overweight에서 slightly는 형용사 overweight를 꾸며 정도를 약하게 만들어 줍니다. 마지막으로 you tell everyone you're fat and ugly는 tell이 사람을 목적어로 데리고 절을 받는 구조인데, 접속사 that이 생략되어 바로 절이 이어지는 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물론,\u003c/span>\u003cspan class=\"en\">Of course,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 정상이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">completely \u003c/span>\u003cspan class=\"tgt\">normal \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때로 우리 자신에게 실망하는 것은,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">disappointed \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">ourselves\u003c/span> from time to time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 우리가 우리 자신을 깎아내릴수록,\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">ourselves \u003c/span>\u003cspan class=\"tgt\">down, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신감을 되찾기는 더 어려워진다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">harder \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">regain \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">confidence\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">물론, 때로 우리 자신에게 실망하는 것은 아주 정상이지만, 우리가 우리 자신을 깎아내릴수록 자신감을 되찾기는 어려워진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 때로 실망하는 것은 \u003cb class=\"key\">정상\u003c/b>이라는 점을 먼저 인정하면서, 자기 비하가 반복되면 자신감 회복이 어려워진다는 \u003cb class=\"key\">악순환\u003c/b>을 짚는 문장이에요. 그래서 스스로를 깎아내리는 말의 \u003cb class=\"key\">습관\u003c/b>을 경계하고, 다음 문장의 조언으로 자연스럽게 넘어가는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it / 진주어 to부정사\u003c/span> : it + [is + 형용사] + [to be disappointed ~ (진주어)] : \"우리 자신에게 실망하는 것은 아주 정상이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 부정사(be + p.p.)\u003c/span> : be + [disappointed (과거분사)] + with + 대상 : \"우리 자신에게 실망하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">the 비교급 ~ the 비교급(비례)\u003c/span> : the + [비교급] + 주어 + 동사, the + [비교급] + 주어 + 동사 : \"우리가 우리 자신을 깎아내릴수록 더 어렵다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">가주어 it의 진주어 to부정사\u003c/span> : it + is + [형용사 harder] + [to regain our confidence] : \"자신감을 되찾는 것\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Of course, 물론. it is completely normal, 아주 정상이다. to be disappointed with ourselves from time to time, 때로 우리 자신에게 실망하는 것은. but the more we put ourselves down, 그런데 우리가 우리 자신을 깎아내릴수록. the harder it is to regain our confidence, 자신감을 되찾기는 더 어려워진다.. 이 문장 전체를 해석하면, 물론, 때로 우리 자신에게 실망하는 것은 아주 정상이지만, 우리가 우리 자신을 깎아내릴수록 자신감을 되찾기는 어려워진다.","hl":"m"},{"n":28,"text":"때로 실망하는 건 정상이라는 점을 먼저 인정해 줘요. 그런데 자기 비하가 반복되면 자신감 회복이 어려워지는 악순환이 생긴다는 걸 짚고 있죠. 그래서 스스로를 깎아내리는 말의 습관을 경계하자는 흐름으로 이어집니다.","hl":"mn"},{"n":29,"text":"먼저 it is completely normal to be disappointed with ourselves에서 앞의 it은 해석하지 않는 가주어이고 진짜 주어는 뒤의 to부정사구예요. 주어가 길어질 때 균형을 맞추려고 이렇게 만든답니다. 그리고 disappointed는 과거분사라서 be동사와 만나 실망하게 된이라는 수동의 의미를 만들어요. 다음으로 the more we put ourselves down, the harder it is는 the 비교급이 두 번 나와서 비례를 나타내고, 앞절이 조건, 뒤절이 그 결과가 됩니다. 마지막으로 뒤쪽의 it도 똑같이 가주어이고 진주어는 to regain our confidence라는 점, 같은 가주어 틀이 두 번 반복된다는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신을 정직하게 평가해야 하겠지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">evaluate \u003c/span>\u003cspan class=\"tgt\">yourself \u003c/span>\u003cspan class=\"tgt\">honestly\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 방법들을 찾아야 하겠지만\u003c/span>\u003cspan class=\"en\">and look for \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ways \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개선하기 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">improvements\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 이룬 것들에 대한 자부심을 잊지 말라.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">forget \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">pride \u003c/span>\u003cspan class=\"tgt\">in\u003c/span> your accomplishments.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 자신을 정직하게 평가하고 개선할 방법들을 찾아야 하겠지만, 자신이 이룬 것들에 대한 자부심을 잊지 않도록 하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 자신을 혹평하는 태도를 경계한 흐름을 이어, 균형 잡힌 태도를 제안하는 문장이에요. \u003cb class=\"key\">정직한 \u003c/b>\u003cb class=\"key\">평가\u003c/b>와 \u003cb class=\"key\">자부심\u003c/b>이라는 두 가지를 함께 가지라는 뜻으로, 개선 노력만 강조하면 자신감을 잃는다는 앞 문장의 내용을 받아 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 while (양보)\u003c/span> : while + [주어 + 동사] , [주절] : \"자신을 정직하게 평가해야 하겠지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [ways (명사)] + [to make improvements (to부정사구/형용사적)] : \"개선할 방법들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정 명령문 + to부정사(목적어)\u003c/span> : don't + [동사원형 forget] + [to take (to부정사/목적어)] : \"자부심을 갖는 것을 잊지 말라\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"So, 그러므로. while you should evaluate yourself honestly, 자신을 정직하게 평가해야 하겠지만. and look for ways, 그리고 방법들을 찾아야 하겠지만. to make improvements, 개선하기 위한. don't forget to take pride in your accomplishments, 자신이 이룬 것들에 대한 자부심을 잊지 말라.. 이 문장 전체를 해석하면, 그러므로 자신을 정직하게 평가하고 개선할 방법들을 찾아야 하겠지만, 자신이 이룬 것들에 대한 자부심을 잊지 않도록 하라.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 자신을 혹평하는 태도를 경계한 흐름을 이어 받아요. 정직한 평가와 자부심을 함께 가지라고 조언하고 있죠. 개선하려는 노력만 강조하면 자신감을 잃으니, 자신이 이룬 것에도 자부심을 가지라는 뜻이에요.","hl":"mn"},{"n":32,"text":"먼저 while은 '~하는 동안'뿐 아니라 '~하지만'이라는 양보의 뜻으로도 쓰여요. 뒤에 오는 주절의 don't forget과 짝을 이루어 대조를 만들어 주죠. 두 번째로 don't forget은 부정 명령문이라서 동사원형으로 시작하고, forget 뒤에는 to부정사가 목적어로 와서 '~할 것을 잊지 말라'가 돼요. 마지막으로 ways to make improvements에서 to부정사는 앞의 명사 ways를 꾸며 주는 형용사적 용법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 실패와 실수에도 불구하고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Despite \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">failings \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">mistakes\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 격려를 받을 자격이 있어요\u003c/span>\u003cspan class=\"en\">you deserve \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">pat \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">back\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가끔씩은.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">once \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">while\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실패와 실수에도 불구하고, 당신은 가끔씩은 격려를 받을 자격이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 마무리하며 독자에게 건네는 위로의 문장이에요. 실수와 실패가 있더라도 \u003cb class=\"key\">격려\u003c/b>를 받을 가치가 있는 존재라는 점을 강조합니다. 앞에서 말한 \u003cb class=\"key\">자부심\u003c/b>을 다시 한 번 밀어 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 Despite + 명사구 (양보)\u003c/span> : Despite + [your failings and mistakes (명사구)] , [주절] : \"당신의 실패와 실수에도 불구하고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용표현 (칭찬·격려)\u003c/span> : deserve + [a pat on the back (명사구/관용표현)] : \"격려, 칭찬\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">빈도 부사구\u003c/span> : [every once in a while (부사구)] : \"가끔씩은, 때때로\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Despite your failings and mistakes, 당신의 실패와 실수에도 불구하고. you deserve a pat on the back, 당신은 격려를 받을 자격이 있어요. every once in a while, 가끔씩은.. 이 문장 전체를 해석하면, 실패와 실수에도 불구하고, 당신은 가끔씩은 격려를 받을 자격이 있다.","hl":"m"},{"n":34,"text":"이 문장은 글 전체를 마무리하면서 독자에게 건네는 위로예요. 실수와 실패가 있어도 격려를 받을 자격이 있다는 뜻이죠. 앞에서 말한 자부심을 다시 한 번 강조하는 역할을 합니다.","hl":"mn"},{"n":35,"text":"먼저 Despite는 although와 달리 전치사라서 뒤에 절이 아니라 명사구가 와요. 그래서 your failings and mistakes처럼 명사구가 바로 이어지죠. 두 번째로 a pat on the back은 등을 토닥여 준다는 이미지에서 나온 관용표현으로, 칭찬과 격려라는 뜻이에요. 마지막으로 every once in a while은 문장 끝에서 빈도를 나타내는 부사구로, 가끔씩이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>우리는 실수 후 자신을 다른 사람보다 더 비판하는 \u003cb class=\"key\">최악의 \u003c/b>\u003cb class=\"key\">비판가\u003c/b>가 되기 쉽다.\u003c/li>\u003cli>자신에게 더 많은 것을 \u003cb class=\"key\">기대\u003c/b>하기 때문에 단점을 크게 보고 \u003cb class=\"key\">과장\u003c/b>한다.\u003c/li>\u003cli>때로 실망하는 것은 정상이지만 자신을 \u003cb class=\"key\">깎아내리면\u003c/b> 자신감을 되찾기 어렵다.\u003c/li>\u003cli>정직하게 평가하고 \u003cb class=\"key\">개선\u003c/b>하려 노력하되, 자신의 \u003cb class=\"key\">성취\u003c/b>에 자부심을 갖고 격려를 받을 자격이 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>We should evaluate ourselves honestly and seek improvement, but we should not exaggerate our flaws or forget to take pride in our accomplishments.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 우리는 실수 후 자신을 다른 사람보다 더 비판하고 단점을 과장하기 쉽지만, \u003cb class=\"key\">정직한 \u003c/b>\u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">평가\u003c/b>와 \u003cb class=\"key\">개선\u003c/b> 노력에 더해 자신의 \u003cb class=\"key\">성취\u003c/b>에 자부심을 갖는 것이 중요하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"정리해 볼게요. 이 글은 우리가 자신에게 지나치게 비판적이 되기 쉽다는 문제를 짚고, 정직한 평가와 개선 노력 속에서도 자신의 성취에 자부심을 가져야 한다고 말합니다. 단점을 인정하되 그것을 과장하지 말고, 실패와 실수에도 불구하고 가끔은 자신에게 격려를 건네라는 것이 핵심이에요. 오늘 내용을 기억하고 스스로에게 조금 더 공정하게 대해 주세요. 수고했어요.","hl":null}]}]});</script></body></html>
