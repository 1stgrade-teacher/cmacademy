</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"to-v Review passage3","audioDir":"passage3_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">to review\u003cbr>reading03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Spider Silk from Goat's Milk\u003c/h1>\u003ch2>염소의 젖에서 나오는 거미줄\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>거미줄은 강철보다 다섯 배나 강한 최고의 소재이지만, 상업화에는 백만 마리가 넘는 거미가 필요하다는 문제가 늘 발목을 잡았다. 한 캐나다 회사가 \u003cb class=\"key\">거미 \u003c/b>\u003cb class=\"key\">유전자\u003c/b>를 가진 염소를 만들어 젖 속에서 \u003cb class=\"key\">거미줄 \u003c/b>\u003cb class=\"key\">단백질\u003c/b>을 얻는 방식으로 이 문제를 풀어 가고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>By breeding goats with spider genes, one Canadian company is turning goat's milk into an unlimited supply of spider silk protein.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 거미줄과 염소에 관한 아주 흥미로운 이야기예요. 거미줄은 강철보다 다섯 배나 강한 최고의 소재인데, 이걸 대량으로 만들기가 어려워서 늘 문제였죠. 그런데 한 캐나다 회사가 염소의 젖으로 이 문제를 풀어 가고 있다는 내용이에요. 요지는 거미 유전자를 가진 염소를 이용하면 거미줄 단백질을 얼마든지 얻을 수 있다는 것으로, 함께 확인해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">거미줄(spider silk)은 자연이 만든 최고의 섬유라고 불립니다. 무게는 가볍지만 강철(steel)보다 훨씬 질기고 탄력이 뛰어나며, 미생물이 스스로 분해하는 \u003cb class=\"key\">생분해성\u003c/b> 소재이기 때문이에요. 문제는 거미가 영역 동물이라 한곳에 많이 모아 기를 수 없고, 한 마리에서 얻을 수 있는 실의 양도 극히 적다는 점입니다. 그래서 과학자들은 거미 대신 다른 생물의 몸을 공장처럼 쓰는 \u003cb class=\"key\">유전공학\u003c/b>(genetic engineering)을 떠올렸어요. 이는 필요한 레시피만 다른 주방에 넣어 두고 그 주방의 제품 라인으로 음식을 찍어내는 것과 비슷합니다. 이렇게 다른 종의 유전자를 넣어 만든 동물을 \u003cb class=\"key\">형질전환\u003c/b>(transgenic) 동물이라고 부릅니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 거미줄은 자연이 만든 최고의 섬유라서 가볍고 탄력이 좋으며, 미생물이 스스로 분해하는 생분해성 소재예요. 그런데 거미는 영역 동물이라 한곳에 많이 모아 기를 수가 없고, 한 마리에서 얻는 실의 양도 아주 적어요. 그래서 과학자들은 다른 생물의 몸을 공장처럼 쓰는 유전공학을 떠올렸습니다. 필요한 레시피만 다른 주방에 넣어 두고 그 주방의 제품 라인으로 음식을 찍어내는 것과 비슷하죠. 이렇게 다른 종의 유전자를 넣어 만든 동물을 형질전환 동물이라고 불러요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>거미줄의 가치와 장벽\u003csmall>도입·문제 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>거미집은 지구상에서 가장 강한 물질 중의 하나로 만들어진다. \u003cb class=\"key\">거미줄\u003c/b>은 가볍고 탄력이 있으며 완전 생분해성 물질이고 강철보다 다섯 배나 더 강하다. 그래서 과학자들은 오랫동안 거미줄을 \u003cb class=\"key\">상업화\u003c/b>하는 것을 연구해 왔다. 그러나 겨우 1킬로그램의 거미줄을 만드는 데 백만 마리가 훨씬 넘는 거미가 필요하다는 \u003cb class=\"key\">문제\u003c/b>가 늘 그들을 가로막았다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>염소의 젖이라는 해법\u003csmall>전환·해결 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>그런데 한 캐나다 회사가 이 문제를 해결한 것으로 보인다. 그들은 곧 \u003cb class=\"key\">염소의 \u003c/b>\u003cb class=\"key\">젖\u003c/b>에서 무한한 양의 거미줄을 생산하게 될 것 같다고 말한다. 거미를 공장에 모으는 대신 염소를 생산 설비로 쓰겠다는 \u003cb class=\"key\">발상의 \u003c/b>\u003cb class=\"key\">전환\u003c/b>인 셈이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>유전자 이식의 구체적 과정\u003csmall>근거·방법 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>퀘벡에 있는 Nexia Biotechnologies사의 과학자들은 거미의 \u003cb class=\"key\">유전자\u003c/b>를 가진 염소를 만드는 데 성공했다. 그 염소들이 짝짓기를 할 만큼 충분히 크면, 거미줄 \u003cb class=\"key\">단백질\u003c/b>이 들어 있는 젖을 생산하는 염소를 낳을 것으로 기대된다. 즉 염소가 새끼를 낳고 젖을 짜는 평범한 과정이 그대로 거미줄 생산 과정이 되는 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>바이오스틸과 활용 전망\u003csmall>결론·전망 · 문장 8\u003c/small>\u003c/h4>\u003cp>이 \u003cb class=\"key\">거미줄 \u003c/b>\u003cb class=\"key\">젖\u003c/b>은 바이오스틸이라고 하는 거미줄과 같은 물질을 만드는 데 이용된다. 바이오스틸은 어망에서 항공기 부품에 이르기까지, 심지어 사람들의 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">부위\u003c/b>를 대체하는 것까지 모든 것을 더 쉽게 만들어 줄 것이다. 결국 유전공학이 \u003cb class=\"key\">대량 \u003c/b>\u003cb class=\"key\">생산\u003c/b>이라는 오랜 숙제를 풀어낸 셈이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 거미줄의 가치와 장벽이에요. 거미집은 지구상에서 가장 강한 물질 중의 하나로 만들어지고, 거미줄은 가볍고 탄력이 있으며 완전 생분해성이고 강철보다 다섯 배나 더 강하죠. 그래서 과학자들은 오랫동안 거미줄을 상업화하는 것을 연구해 왔어요. 그런데 킬로그램 하나를 만드는 데 백만 마리가 훨씬 넘는 거미가 필요하다는 문제가 늘 그들을 가로막았습니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 해결의 실마리예요. 그런데 한 캐나다 회사가 이 문제를 해결한 것으로 보인다고 합니다. 그들은 곧 염소의 젖에서 무한한 양의 거미줄을 생산하게 될 것 같다고 말해요. 거미를 공장에 모으는 대신 염소를 생산 설비로 쓰겠다는 발상의 전환이죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 구체적인 방법이에요. 퀘벡에 있는 넥시아 바이오테크놀로지스사의 과학자들은 거미의 유전자를 가진 염소를 만드는 데 성공했어요. 그 염소들이 짝짓기를 할 만큼 충분히 크면, 거미줄 단백질이 들어 있는 젖을 생산하는 염소를 낳을 것으로 기대된답니다. 염소가 새끼를 낳고 젖을 짜는 평범한 과정이 그대로 거미줄 생산 과정이 되는 거예요.","hl":"f2"},{"n":7,"text":"마지막 단계는 활용과 전망이에요. 이 거미줄 젖은 바이오스틸이라고 하는 거미줄과 같은 물질을 만드는 데 이용돼요. 바이오스틸은 어망에서 항공기 부품에 이르기까지, 심지어 사람들의 신체 부위를 대체하는 것까지 모든 것을 더 쉽게 만들어 줄 겁니다. 결국 유전공학이 대량 생산이라는 오랜 숙제를 풀어낸 셈이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 세 문장은 거미줄의 우수성과 함께 \u003cb class=\"key\">상업화\u003c/b>를 가로막는 결정적 장벽을 제시한다. 네 번째 문장에서 However로 \u003cb class=\"key\">전환\u003c/b>하며 한 캐나다 회사가 문제를 해결했다는 \u003cb class=\"key\">주제문\u003c/b>이 등장한다. 이어서 다섯 번째부터 여덟 번째 문장까지 염소의 젖, 유전자, 바이오스틸이라는 구체적 근거와 전망으로 이를 뒷받침한다. 주제문이 글의 중간에 놓여 있으므로 \u003cb class=\"key\">중괄식\u003c/b> 전개로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (3)\u003c/b>\u003cspan>문제 제기로의 역접\u003c/span>\u003cb>However (4)\u003c/b>\u003cspan>해결로 넘어가는 전환\u003c/span>\u003cb>When (7)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>This (8)\u003c/b>\u003cspan>앞 내용을 받는 지시어\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">spider silk\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spider silk protein\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">silk milk\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">web-like material\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Biosteel\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결로 짜인 글인데, 주제문이 글의 중간에 놓인 중괄식 구조예요. 앞부분에서 상업화를 가로막는 장벽을 길게 깔아 두고, 네 번째 문장에서 해결을 알린 뒤 나머지로 근거를 채우죠. 그래서 주제문을 찾을 때는 문장 하나하나보다 역접 뒤에 나오는 문장을 먼저 보셔야 해요.","hl":"ty"},{"n":9,"text":"신호어를 보면 구조가 아주 선명해요. 세 번째 문장의 but은 거미줄의 장점에서 문제로 방향을 꺾고, 네 번째 문장의 However는 그 문제를 해결로 전환시키는 결정적인 신호예요. 마지막 문장의 This는 앞에 나온 실크 밀크를 그대로 받아 주는 지시어이니, 무엇을 가리키는지 꼭 확인하세요. 이렇게 역접과 지시어를 표시하면 재진술 관계가 저절로 보입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>be made from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 만들어진다\u003c/span>\u003c/div>\u003cdiv>\u003cb>material\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물질, 재료\u003c/span>\u003c/div>\u003cdiv>\u003cb>silk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>견사, 거미줄\u003c/span>\u003c/div>\u003cdiv>\u003cb>elastic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>탄력 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>completely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>biodegradable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>생분해성의\u003c/span>\u003c/div>\u003cdiv>\u003cb>steel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>강철\u003c/span>\u003c/div>\u003cdiv>\u003cb>look at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 검토하다, 연구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>commercialize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상업화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>well over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>훨씬 넘는\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>막다, 저지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나, 하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>it seems that\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~인 것 같다\u003c/span>\u003c/div>\u003cdiv>\u003cb>solve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>produce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unlimited\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무한한, 제한 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>quantity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양, 분량\u003c/span>\u003c/div>\u003cdiv>\u003cb>breed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사육하다, 번식시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gene\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유전자\u003c/span>\u003c/div>\u003cdiv>\u003cb>mate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>짝짓기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>give birth to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 낳다\u003c/span>\u003c/div>\u003cdiv>\u003cb>contain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다, 함유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>protein\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단백질\u003c/span>\u003c/div>\u003cdiv>\u003cb>be used to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 이용되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>web-like\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거미줄 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>aircraft\u003c/b>\u003cem>명사\u003c/em>\u003cspan>항공기\u003c/span>\u003c/div>\u003cdiv>\u003cb>replacement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대체, 대체품\u003c/span>\u003c/div>\u003cdiv>\u003cb>body part\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신체 부위\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚고 갈게요. biodegradable는 생분해성의라는 뜻이고, commercialize는 상업화하다라는 동사예요. be close to는 거의 무엇을 하려 한다는 뜻이고, breed는 사육하다, 번식시키다라는 의미로 과거형 bred로 나옵니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">solve\u003c/b>\u003cspan class=\"m\">해결하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"s\">figure out\u003c/span>\u003cspan class=\"s\">work out\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">complicate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">strong\u003c/b>\u003cspan class=\"m\">강한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">powerful\u003c/span>\u003cspan class=\"s\">sturdy\u003c/span>\u003cspan class=\"s\">tough\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weak\u003c/span>\u003cspan class=\"a\">fragile\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">produce\u003c/b>\u003cspan class=\"m\">생산하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">create\u003c/span>\u003cspan class=\"s\">generate\u003c/span>\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">consume\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unlimited\u003c/b>\u003cspan class=\"m\">무한한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">infinite\u003c/span>\u003cspan class=\"s\">boundless\u003c/span>\u003cspan class=\"s\">endless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">limited\u003c/span>\u003cspan class=\"a\">restricted\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contain\u003c/b>\u003cspan class=\"m\">포함하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">include\u003c/span>\u003cspan class=\"s\">hold\u003c/span>\u003cspan class=\"s\">comprise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">completely\u003c/b>\u003cspan class=\"m\">완전히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">entirely\u003c/span>\u003cspan class=\"s\">fully\u003c/span>\u003cspan class=\"s\">totally\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partly\u003c/span>\u003cspan class=\"a\">partially\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stop\u003c/b>\u003cspan class=\"m\">막다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prevent\u003c/span>\u003cspan class=\"s\">block\u003c/span>\u003cspan class=\"s\">hinder\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">allow\u003c/span>\u003cspan class=\"a\">permit\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. solve는 resolve, figure out과 비슷하고 반대말은 complicate예요. produce는 create, generate와 가깝고, unlimited는 infinite, endless와 같은 뜻이라 반대말은 limited죠. contain은 include, hold로 바꿔 쓸 수 있고 completely는 entirely, fully와 같은 의미예요. stop은 prevent, block으로 바꿔 쓸 수 있으니, 시험에서 바꿔 표현 문제로 자주 나옵니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거미집은\u003c/span>\u003cspan class=\"en\">A spider's web\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들어진다 (~로부터)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 강한 물질들 중 하나로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">strongest \u003c/span>\u003cspan class=\"tgt\">materials\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구상에서\u003c/span>\u003cspan class=\"en\">on earth.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">거미집은 지구상에서 가장 강한 물질 중의 하나(거미줄)로 만들어진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 \u003cb class=\"key\">도입부\u003c/b>로, 거미집이 지구상에서 가장 강한 물질 중 하나로 만들어진다는 사실을 먼저 던지는 문장이에요. 여기서 말한 '가장 강한 물질'은 다음 문장에 나오는 \u003cb class=\"key\">거미줄(spider \u003c/b>\u003cb class=\"key\">silk)\u003c/b>을 가리키는 \u003cb class=\"key\">복선\u003c/b>이죠. 즉 글쓴이는 소재의 \u003cb class=\"key\">강도\u003c/b>를 먼저 강조하며 이야기를 시작하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be made from)\u003c/span> : [주어] + be made from + [재료·원료]: '~로 만들어지다' : \"~로 만들어진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">one of + 최상급 + 복수명사\u003c/span> : one of the + [최상급 형용사] + [복수명사]: '가장 ~한 것들 중 하나' : \"가장 강한 물질들 중 하나\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"A spider's web, 거미집은. is made from, 만들어진다 (~로부터). one of the strongest materials, 가장 강한 물질들 중 하나로. on earth, 지구상에서. 이 문장 전체를 해석하면, 거미집은 지구상에서 가장 강한 물질 중의 하나(거미줄)로 만들어진다.","hl":"m"},{"n":13,"text":"이 문장은 글의 도입부예요. 거미집이 지구상에서 가장 강한 물질 중 하나로 만들어진다고 하면서, 그 강한 물질이 바로 다음에 나올 거미줄이라는 걸 은근히 깔아 주는 복선이죠. 글쓴이는 거미줄의 강도를 먼저 강조하면서 이야기를 시작하고 있는 거예요.","hl":"mn"},{"n":14,"text":"먼저 is made from은 수동태예요. 거미집은 만드는 게 아니라 만들어지는 대상이니까 수동태를 쓴 거죠. 재료가 변형되어 만들어질 때는 전치사 from을 쓴다는 점도 기억해 두세요. 두 번째로 one of the strongest materials는 one of 다음에 최상급과 복수명사가 오는 구조예요. 그래서 '가장 강한 물질들 중 하나'라는 뜻이 되고, 뒤에 materials가 복수라는 걸 꼭 확인해야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거미줄은\u003c/span>\u003cspan class=\"en\">Spider silk\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가볍고, 탄력이 있으며, 완전히 생분해성이고,\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">light, \u003c/span>\u003cspan class=\"tgt\">elastic, \u003c/span>\u003cspan class=\"tgt\">completely \u003c/span>\u003cspan class=\"tgt\">biodegradable\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 강철보다 다섯 배나 더 강하다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">five \u003c/span>\u003cspan class=\"tgt\">times \u003c/span>\u003cspan class=\"tgt\">stronger \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">steel\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">거미줄은 가볍고 탄력이 있으며 완전 생분해성 물질이며 강철보다 5배나 더 강하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거미줄의 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">특성\u003c/b>을 네 가지로 나열하며 장점을 부각하는 문장이에요. 가볍고 탄력 있고 \u003cb class=\"key\">생분해성\u003c/b>이며 강철보다 다섯 배 강하다니, \u003cb class=\"key\">상업적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>가 큰 소재임이 분명하죠. 이렇게 장점을 쌓아 놓은 뒤 다음 문장에서 문제점을 꺼내면 \u003cb class=\"key\">대조\u003c/b>가 만들어지고, 뒤에 나올 해결책이 더 돋보이게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">보어 병렬 구조\u003c/span> : [주어] + be + [보어1], [보어2], [보어3] : \"가볍고, 탄력이 있으며, 완전히 생분해성인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">배수사 + 비교급 + than (비교급 강조)\u003c/span> : [배수사] + [비교급] + than + [비교 대상]: '~보다 몇 배 더 …한' : \"강철보다 다섯 배 더 강한\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Spider silk, 거미줄은. is light, elastic, completely biodegradable, 가볍고, 탄력이 있으며, 완전히 생분해성이고. and five times stronger than steel, 그리고 강철보다 다섯 배나 더 강하다. 이 문장 전체를 해석하면, 거미줄은 가볍고 탄력이 있으며 완전 생분해성 물질이며 강철보다 5배나 더 강하다.","hl":"m"},{"n":16,"text":"거미줄의 물리적 특성을 네 가지로 나열하면서 장점을 확실히 부각하는 문장이에요. 가볍고 탄력 있고 생분해성이며 강철보다 다섯 배나 강하다니, 상업적 가치가 정말 큰 소재라는 걸 알 수 있죠. 이렇게 장점을 쌓아 놓고 다음 문장에서 문제점을 꺼내면 대조가 만들어져서 뒤의 해결책이 더 눈에 들어옵니다.","hl":"mn"},{"n":17,"text":"먼저 light, elastic, completely biodegradable는 주어 Spider silk를 설명하는 주격보어들이에요. 쉼표로 쭉 이어지는 보어 병렬 구조라는 걸 기억하세요. 두 번째로 five times stronger than steel은 배수사가 비교급 앞에 온 표현이에요. '몇 배 더 ~하다'라고 할 때는 배수사를 비교급 앞에 두고 than으로 비교 대상을 붙이면 됩니다. 배수사가 비교급을 강조해 주는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학자들은\u003c/span>\u003cspan class=\"en\">Scientists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오랫동안 거미줄을 상업화하는 것을 연구해 왔지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">commercializing \u003c/span>\u003cspan class=\"tgt\">spider \u003c/span>\u003cspan class=\"tgt\">silk \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">years\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 한 가지 문제가 늘 그들을 가로막았는데,\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">problem \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">stopped \u003c/span>\u003cspan class=\"tgt\">them:\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">백만 마리가 훨씬 넘는 거미가 필요하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">takes \u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">million \u003c/span>\u003cspan class=\"tgt\">spiders \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">겨우 1킬로그램의 거미줄을 만드는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">kilogram \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">spider \u003c/span>\u003cspan class=\"tgt\">silk\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">과학자들은 오랫동안 거미줄을 상업화하는 것을 연구해왔지만, 늘 한 가지 문제가 그들을 가로막았는데, 겨우 1킬로그램의 거미줄을 만드는 데 백만 마리가 훨씬 넘는 거미가 필요하다는 점이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거미줄의 장점에도 불구하고 \u003cb class=\"key\">상업화\u003c/b>를 가로막는 결정적 \u003cb class=\"key\">장애물\u003c/b>을 꺼내는 문장이에요. 콜론 뒤에서 그 문제를 구체적으로 풀어 주는데, 거미줄 1킬로그램을 얻는 데 \u003cb class=\"key\">백만 \u003c/b>\u003cb class=\"key\">마리\u003c/b>가 넘는 거미가 필요하다는 \u003cb class=\"key\">비효율성\u003c/b>이죠. 앞 문장의 장점과 정확히 대조되기 때문에, 뒤에 나올 \u003cb class=\"key\">해결책\u003c/b>이 무엇일지 궁금하게 만드는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(계속) + 전치사 at 뒤 동명사\u003c/span> : have + [과거분사] + for years / look at + [동명사(-ing)] : \"오랫동안 거미줄을 상업화하는 것을 연구해 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">콜론(:)을 통한 부연 설명\u003c/span> : [앞 문장] : [앞 내용을 구체화하는 설명] : \"한 가지 문제가 늘 그들을 가로막았는데, 즉\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">가주어 It + 진주어 to부정사 (It takes + 목적어 + to부정사)\u003c/span> : It takes + [목적어(필요한 대상)] + [to부정사]: '~하는 데 …이 필요하다' : \"겨우 1킬로그램의 거미줄을 만드는 데 백만 마리가 훨씬 넘는 거미가 필요하다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Scientists, 과학자들은. have looked at commercializing spider silk for years, 오랫동안 거미줄을 상업화하는 것을 연구해 왔지만. but one problem has always stopped them, 그런데 한 가지 문제가 늘 그들을 가로막았는데. It takes well over a million spiders, 백만 마리가 훨씬 넘는 거미가 필요하다. to make just one kilogram of spider silk, 겨우 1킬로그램의 거미줄을 만드는 데. 이 문장 전체를 해석하면, 과학자들은 오랫동안 거미줄을 상업화하는 것을 연구해왔지만, 늘 한 가지 문제가 그들을 가로막았는데, 겨우 1킬로그램의 거미줄을 만드는 데 백만 마리가 훨씬 넘는 거미가 필요하다는 점이다.","hl":"m"},{"n":19,"text":"거미줄의 장점에도 불구하고 상업화를 가로막는 결정적 장애물을 꺼내는 문장이에요. 콜론 뒤에서 그 문제를 구체적으로 풀어 주는데, 거미줄 one kilogram을 얻는 데 백만 마리가 넘는 거미가 필요하다는 비효율성이죠. 앞 문장의 장점과 딱 대조되니까, 뒤에 나올 해결책이 무엇일지 궁금해지게 만드는 거예요.","hl":"mn"},{"n":20,"text":"먼저 have looked at commercializing spider silk for years는 현재완료에 for years가 붙어서 '오랫동안 쭉 연구해 왔다'는 계속의 의미를 나타내요. 그리고 전치사 at 뒤에는 동명사 commercializing이 와야 한다는 것도 꼭 챙기세요. 두 번째로 one problem has always stopped them 뒤의 콜론은 앞에서 꺼낸 one problem이 무엇인지 뒤에서 구체화해 주는 표시예요. 세 번째로 It takes well over a million spiders to make just one kilogram of spider silk에서 It은 가주어, to make 이하는 진주어입니다. '무엇을 하는 데 얼마만큼이 필요하다'는 뜻을 It takes로 표현하는 관용 표현이니까 통째로 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~인 것으로 보인다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">seems \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 캐나다 회사가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> one Canadian company\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 문제를 해결했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">solved\u003c/span> the problem.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런데 한 캐나다 회사가 이 문제를 해결한 것으로 보인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장들에서 거미줄을 상업화하지 못하게 막은 결정적 문제를 말했죠. \u003cb class=\"key\">However\u003c/b>로 흐름을 전환하며 이제 해결책이 나온다는 신호를 주고, \u003cb class=\"key\">it \u003c/b>\u003cb class=\"key\">seems \u003c/b>\u003cb class=\"key\">that\u003c/b>으로 단정하지 않고 조심스럽게 표현합니다. 이미 해결을 끝낸 상태라는 점은 \u003cb class=\"key\">현재완료\u003c/b> has solved가 담당해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비인칭 구문 it seems that (~인 것 같다)\u003c/span> : It seems + [that + 주어 + 동사] (that절이 [[진주어]]) : \"~인 것으로 보인다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료(have/has + 과거분사)\u003c/span> : has + [과거분사 solved] (주어 one Canadian company가 단수) : \"해결했다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"However, 그런데. it seems, ~인 것으로 보인다. that one Canadian company, 한 캐나다 회사가. has solved the problem, 그 문제를 해결했다. 이 문장 전체를 해석하면, 그런데 한 캐나다 회사가 이 문제를 해결한 것으로 보인다.","hl":"m"},{"n":22,"text":"앞에서는 거미줄을 상업화하지 못한 이유를 말했죠. 그런데 However가 나오면서 분위기가 바뀌어요. it seems that은 '~인 것으로 보인다'라는 뜻으로, 단정하지 않고 조심스럽게 말할 때 쓰는 표현이고, has solved는 현재완료로 이미 해결을 끝낸 상태를 보여 줍니다.","hl":"mn"},{"n":23,"text":"첫 번째, it seems that에서 it은 '그것'이 아니라 뒤에 오는 that절 내용을 가리키는 비인칭 주어예요. 그래서 '~인 것으로 보인다'로 해석합니다. 두 번째, has solved는 현재완료인데, 주어가 한 캐나다 회사, 즉 삼인칭 단수라서 has를 쓴 거예요. 이미 해결해 버린 상태라는 결과의 느낌으로 읽어 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 말한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">say \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 곧 생산하게 될 것 같다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">close \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">producing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무한한 양의 거미줄을\u003c/span>\u003cspan class=\"en\">unlimited quantities of spider silk\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">염소의 젖에서\u003c/span>\u003cspan class=\"en\">— in goat's milk.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 곧 염소의 젖에서 무한한 양의 거미줄을 생산하게 될 것 같다고 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 문제를 해결한 회사가 어떤 방식으로 거미줄을 얻겠다는지 밝히는 문장이에요. \u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">close \u003c/b>\u003cb class=\"key\">to\u003c/b>는 '~에 가깝다'이지만 진행 중인 일에서는 '곧 ~하게 될 것 같다'로 해석하고, 전치사 to 뒤에는 \u003cb class=\"key\">동명사\u003c/b>가 옵니다. 염소의 젖 속에서 거미줄 단백질을 \u003cb class=\"key\">무한한 \u003c/b>\u003cb class=\"key\">양\u003c/b>으로 얻겠다는 계획이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략\u003c/span> : say + [(that) + 주어 + 동사] : \"그들은 ~라고 말한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to + 동명사\u003c/span> : be close to + [동명사(-ing)] : \"곧 ~하게 될 것 같다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They say, 그들은 말한다. they are close to producing, 그들이 곧 생산하게 될 것 같다. unlimited quantities of spider silk, 무한한 양의 거미줄을. — in goat's milk, 염소의 젖에서. 이 문장 전체를 해석하면, 그들은 곧 염소의 젖에서 무한한 양의 거미줄을 생산하게 될 것 같다고 말한다.","hl":"m"},{"n":25,"text":"이 문장은 회사가 어떤 방식으로 거미줄을 얻겠다는지 알려 줍니다. be close to는 원래 '~에 가깝다'인데, 여기서는 '곧 ~하게 될 것 같다'로 자연스럽게 풀어 주세요. 그리고 마지막에 in goat's milk가 붙어서 어디서 생산하는지를 알려 주죠. 무한한 양의 거미줄을 염소 젖에서 얻겠다는 계획입니다.","hl":"mn"},{"n":26,"text":"첫 번째, close to의 to는 부정사의 to가 아니라 전치사예요. 그래서 뒤에 동사원형이 아니라 동명사 producing이 온 겁니다. 두 번째, They say 뒤에는 접속사 that이 생략되어 있어서 they are가 목적어절로 이어져요. 그래서 '그들은 곧 생산하게 될 것 같다고 말한다'로 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Nex \"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 with의 수식(소유)\u003c/span> : [명사 goats] + with + [명사 spider genes] : \"거미의 유전자를 가진 염소\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Scientists at Nexia Biotechnologies, Nexia Biotechnologies사의 과학자들은. in Quebec, 퀘벡에 있는. have successfully bred, 성공적으로 사육해 냈다. goats with spider genes, 거미의 유전자를 가진 염소를. 이 문장 전체를 해석하면, 퀘벡에 있는 Nexia Biotechnologies사의 과학자들은 거미의 유전자를 가진 염소를 만드는 데 성공했다.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 말한 염소 젖 이야기가 어디서 나온 것인지 밝혀 줍니다. 퀘벡에 있는 회사의 과학자들이 이미 거미 유전자를 가진 염소를 만들어 냈다는 거죠. 그래서 앞의 계획이 허황된 이야기가 아니라 실제 성과에 바탕을 두고 있다는 느낌을 줍니다.","hl":"mn"},{"n":29,"text":"첫 번째, Scientists 뒤에 at Nexia Biotechnologies in Quebec이라는 전치사구가 이어지면서 어떤 과학자인지 앞의 명사를 꾸며 줘요. 두 번째, have successfully bred는 현재완료로, 이미 해내었다는 완료의 느낌을 줍니다. 세 번째, goats with spider genes에서 with는 '~을 가진'이라는 뜻으로 뒤에서 염소를 꾸며 주는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 염소들이 짝짓기를 할 만큼 충분히 크면,\u003c/span>\u003cspan class=\"en\">When the goats are \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">old \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">mate\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기대된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">hoped\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 염소를 낳을 것으로\u003c/span>\u003cspan class=\"en\">they will give birth to \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">goats \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거미줄 단백질이 들어있는 젖을 생산하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">produce \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">milk \u003c/span>\u003cspan class=\"tgt\">containing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">spider \u003c/span>\u003cspan class=\"tgt\">silk \u003c/span>\u003cspan class=\"tgt\">protein\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 염소들이 짝짓기를 할 만큼 충분히 크면, 거미줄 단백질이 들어있는 젖을 생산하는 염소를 낳을 것으로 기대된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거미 유전자를 지닌 염소가 자라서 짝짓기를 하면, \u003cb class=\"key\">거미줄 \u003c/b>\u003cb class=\"key\">단백질\u003c/b>이 든 젖을 내는 새끼를 낳을 것이라는 기대를 담은 문장이에요. it is hoped는 '사람들이 기대한다'를 \u003cb class=\"key\">수동태\u003c/b>로 표현해 연구 내용을 \u003cb class=\"key\">객관적\u003c/b>으로 전달하는 장치예요. 앞 문장의 'solve the problem'을 구체적인 과정으로 풀어 주는 대목이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">enough to부정사 (형용사 + enough + to부정사)\u003c/span> : be + [형용사] + enough + [to동사원형] → '~할 만큼 충분히 …한' : \"짝짓기를 할 만큼 충분히 큰\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가주어 it / 진주어 that절 (It is hoped that ~)\u003c/span> : It is hoped + [that절] → '~라고 기대된다' : \"기대된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 that (주격, 선행사 goats)\u003c/span> : [선행사] + that + [동사] → '…하는 선행사' : \"젖을 생산하는 염소\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">현재분사 containing (명사 수식)\u003c/span> : [명사] + -ing(현재분사) + [목적어] → '~을 함유하는 명사' : \"거미줄 단백질이 들어있는 젖\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"When the goats are old enough to mate, 그 염소들이 짝짓기를 할 만큼 충분히 크면. it is hoped, 기대된다. they will give birth to goats, 그것들이 염소를 낳을 것으로. that produce milk containing the spider silk protein, 거미줄 단백질이 들어있는 젖을 생산하는. 이 문장 전체를 해석하면, 그 염소들이 짝짓기를 할 만큼 충분히 크면, 거미줄 단백질이 들어있는 젖을 생산하는 염소를 낳을 것으로 기대된다.","hl":"m"},{"n":31,"text":"이 문장은 캐나다 회사가 만든 거미 유전자 염소가 자라서 짝짓기를 하면, 거미줄 단백질이 든 젖을 생산하는 염소를 낳을 거라는 기대를 전해요. it is hoped는 사람들이 기대한다는 뜻을 수동태로 표현해서 연구 내용을 객관적으로 들리게 해 주죠. 앞 문장에서 말한 문제를 해결하는 구체적인 과정이라고 보시면 돼요.","hl":"mn"},{"n":32,"text":"먼저 old enough to mate에서 enough는 형용사 뒤에서 정도를 나타내고, to mate가 그 정도의 기준을 제시해요. 두 번째로 it is hoped는 가주어 it을 세우고 진짜 주어인 that절을 뒤로 보낸 수동태 표현이에요. 세 번째, goats that produce milk에서 that은 선행사 goats를 받는 주격 관계대명사라서 바로 뒤에 동사 produce가 와요. 이렇게 that절이 형용사절 역할을 하면서 goats를 꾸며 주는 거죠. 마지막으로 milk containing은 능동과 진행의 의미로 milk를 뒤에서 꾸미는 현재분사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 '거미줄 젖'은 이용될 것이다\u003c/span>\u003cspan class=\"en\">This &quot;silk milk&quot; \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바이오스틸이라고 하는 거미줄과 같은 물질을 만들어내는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">produce\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">web-like \u003c/span>\u003cspan class=\"tgt\">material \u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">Biosteel\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 더 쉽게 만들 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">easier \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어망에서 항공기 부품에 이르기까지 모든 것을 만드는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">everything\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">fishing \u003c/span>\u003cspan class=\"tgt\">nets \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">aircraft \u003c/span>\u003cspan class=\"tgt\">parts\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 아마도 심지어 사람들의 신체 부위를 대체할 수 있는 것까지!\u003c/span>\u003cspan class=\"en\">and perhaps even replacement body parts for people!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 “거미줄 젖”은 바이오스틸이라고 하는 거미줄과 같은 물질을 만들어내는 데 이용되며, 바이오스틸은, 어망에서 항공기 부품에 이르기까지, 심지어 사람들의 신체 부위를 대체할 수 있는 것까지, 모든 것을 만드는 것을 더 쉽게 할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> ‘silk milk’가 \u003cb class=\"key\">바이오스틸\u003c/b>이라는 신소재로 가공되어 어망부터 항공기 부품, 나아가 \u003cb class=\"key\">인체 \u003c/b>\u003cb class=\"key\">대체 \u003c/b>\u003cb class=\"key\">부품\u003c/b>까지 만들 수 있게 된다는 내용이에요. which 이하가 \u003cb class=\"key\">계속적 \u003c/b>\u003cb class=\"key\">관계대명사\u003c/b>로 이어져 바이오스틸의 \u003cb class=\"key\">파급 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 덧붙이고, 글은 이 미래 가능성으로 마무리돼요. 앞 문장의 기대가 어떤 결과로 이어지는지 보여 주는 결론부죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be used to부정사 (목적의 to부정사 + 수동태)\u003c/span> : be used + [to동사원형] → '~하기 위해 사용되다' : \"만들어내는 데 이용될 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사 called (명사 수식, 수동)\u003c/span> : [명사] + called + [이름] → '~라고 불리는 명사' : \"바이오스틸이라고 불리는 거미줄과 같은 물질\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">계속적 관계대명사 which + 가목적어 it\u003c/span> : [앞 절/선행사] + , which + [동사] → '그것은/~인데, 그것은' : \"그것은 모든 것을 만드는 것을 더 쉽게 만들 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">from A to B (범위)\u003c/span> : from + [A] + to + [B] → 'A에서 B에 이르기까지' : \"어망에서 항공기 부품에 이르기까지\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"This \"silk milk\" will be used, 이 '거미줄 젖'은 이용될 것이다. to produce a web-like material called Biosteel, 바이오스틸이라고 하는 거미줄과 같은 물질을 만들어내는 데. which will make it easier, 그것은 더 쉽게 만들 것이다. to make everything from fishing nets to aircraft parts, 어망에서 항공기 부품에 이르기까지 모든 것을 만드는 것을. and perhaps even replacement body parts for people!, 그리고 아마도 심지어 사람들의 신체 부위를 대체할 수 있는 것까지!. 이 문장 전체를 해석하면, 이 “거미줄 젖”은 바이오스틸이라고 하는 거미줄과 같은 물질을 만들어내는 데 이용되며, 바이오스틸은, 어망에서 항공기 부품에 이르기까지, 심지어 사람들의 신체 부위를 대체할 수 있는 것까지, 모든 것을 만드는 것을 더 쉽게 할 것이다.","hl":"m"},{"n":34,"text":"이 문장은 거미줄 젖이 바이오스틸이라는 신소재로 가공되어, 어망부터 항공기 부품, 심지어 사람의 인체 대체 부품까지 만들 수 있게 된다는 내용이에요. which 이하는 계속적 관계대명사로 이어져서 바이오스틸의 파급 효과를 덧붙이고 있어요. 글 전체가 이 미래 가능성으로 마무리된다는 흐름을 꼭 기억하세요.","hl":"mn"},{"n":35,"text":"먼저 will be used to produce에서 be used to 뒤에 동사원형이 오면 '~하기 위해 사용되다'라는 목적을 나타내요. to부정사가 수동태 동사 뒤에서 목적을 보충하는 거죠. 두 번째, a material called Biosteel에서 called는 불리다는 뜻의 수동 의미로 앞의 material을 꾸며요. which is called에서 관계대명사와 be동사가 생략된 형태예요. 세 번째, which will make it easier에서 which는 앞의 Biosteel을 이어받는 계속적 관계대명사이고, make의 목적어 자리에 it을 둔 가목적어 구문이에요. 진목적어인 to make everything은 뒤로 빠져 있고요. 마지막으로 from fishing nets to aircraft parts는 범위의 시작과 끝을 from과 to로 묶어 전부라는 강조 효과를 내는 표현이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>거미줄은 가볍고 탄력이 있으며 강철보다 다섯 배나 강한 \u003cb class=\"key\">최고의 \u003c/b>\u003cb class=\"key\">소재\u003c/b>다.\u003c/li>\u003cli>하지만 1킬로그램을 만드는 데 백만 마리가 넘는 거미가 필요해 \u003cb class=\"key\">상업화\u003c/b>가 늘 막혀 있었다.\u003c/li>\u003cli>한 캐나다 회사가 거미 \u003cb class=\"key\">유전자\u003c/b>를 가진 염소를 만들어 젖에서 거미줄 \u003cb class=\"key\">단백질\u003c/b>을 얻는 방법을 찾아냈다.\u003c/li>\u003cli>이 \u003cb class=\"key\">거미줄 \u003c/b>\u003cb class=\"key\">젖\u003c/b>으로 만든 \u003cb class=\"key\">바이오스틸\u003c/b>은 어망부터 항공기 부품, 신체 대체 부위까지 쓰임이 넓다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>By breeding goats with spider genes, one Canadian company is turning goat's milk into an unlimited supply of spider silk protein.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">거미줄은 강철보다 다섯 배나 강한 최고의 소재이지만, 상업화에는 백만 마리가 넘는 거미가 필요하다는 문제가 늘 발목을 잡았다. 한 캐나다 회사가 \u003cb class=\"key\">거미 \u003c/b>\u003cb class=\"key\">유전자\u003c/b>를 가진 염소를 만들어 젖 속에서 \u003cb class=\"key\">거미줄 \u003c/b>\u003cb class=\"key\">단백질\u003c/b>을 얻는 방식으로 이 문제를 풀어 가고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 글의 핵심은 아주 간단해요. 거미줄은 최고의 소재지만 거미로는 대량 생산이 불가능했고, 그 답을 염소의 젖에서 찾았다는 것이죠. 거미 유전자를 가진 염소가 만들어 내는 거미줄 단백질, 그리고 그것으로 만드는 바이오스틸까지 머릿속에 그림으로 남겨 두세요. 다음에 만나면 이 구조를 스스로 설명해 보는 연습을 해 봅시다. 오늘도 수고 많았어요, 여러분.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
