65yMHt6f0pLW7XdbNO/wp+UdOr+XmultHrdbd7+fdXe+qtdjiTnJPp9c9uf8/WjknOeMAY+gx2+noe+OtBYDJJUZ/2hjJ5GefbOPp9KTeucZA57nj2GemQPbvRe9nbpZ7O2if8AT3fkt3o97bd09LK9/LX8hevpzx2/WrNnbG8vLe0T79xNHCMAEkOwUkjn7qbnHuMZx0rZGQAQcgYwRyTx69j1/T29S8EeHJIXGs3sRjcoy2MT5DbXBD3DoQCodWKRZBLIzuVAaMnHE4mOGoyqNpScbU1fWUtLJLoktXpok1tc6MLQeJqxpxTa052lpGF0pN6qytora82ne3//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Deadly Reality of Combat Sports: A Call for Reform<small>격투기 스포츠의 치명적인 현실: 개혁을 향한 외침</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">오늘날 우리가 흔히 접하는 격투기(Combat sports)와 같은 종목들은 상대방을 타격해 의식을 잃게 만드는 것을 목표로 하는데, 여기서 가장 위험한 요소는 뇌진탕(Concussion)과 같은 심각한 뇌 손상입니다. 단순히 겉으로 보이는 상처뿐만 아니라, 반복적인 충격이 뇌세포에 가해지면 기억력 저하나 운동 신경 손상 등 평생 지워지지 않는 치명적인 후유증을 남길 수 있죠. 실제로 의료계에서는 이러한 스포츠를 인간의 생명을 위협하는 폭력적인 행위로 규정하고, 선수 보호와 윤리적 측면에서 스포츠 금지(Ban on sports)를 강력히 주장하고 있습니다. 우리가 스포츠 경기를 단순히 즐길 거리로 볼지, 아니면 인간의 신체적 안전을 우선시해야 하는지에 대해 전문가들 사이에서도 오랜 논쟁이 이어지고 있다는 점을 기억하며 글을 읽어보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01현대 스포츠의 잔혹성</div><ul><li>오늘날 대중 매체에서는 상대방을 가격하여 의식을 잃게 만드는 폭력적인 격투기 종목이 흔하게 방영되고 있다.</li><li>복싱(boxing), 킥복싱(kickboxing), 얼티밋 파이팅(ultimate fighting) 등 다양한 격투기 존재</li><li>스포츠의 주된 목표는 상대에게 강한 타격을 입혀 의식을 잃게 하는 것(lose consciousness)</li><li>핵심 키워드: 잔혹한 스포츠(cruel sports)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02격투기가 신체에 미치는 치명적 영향</div><ul><li>강력한 타격은 선수들의 신체, 특히 뇌에 심각한 손상을 입히며 생명을 위협하는 결과를 초래한다.</li><li>전문가들은 프로 선수들의 절반 이상이 뇌 손상(brain damage)을 겪는다고 추정함</li><li>머리에 가해지는 심각한 타격은 선수들에게 치명적임</li><li>핵심 키워드: 뇌 손상(brain damage)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03의학계의 경고와 규제 노력</div><ul><li>영국의 의사들을 포함한 전문가들은 격투기의 위험성을 알리며 해당 스포츠의 금지를 강력히 촉구하고 있다.</li><li>영국의 외과 의사 존 서트클리프(John Sutcliffe)는 수술 중 사망한 사례들을 목격함</li><li>영국 의학 협회(British Medical Association) 소속 의사들이 스포츠 금지를 위해 노력함</li><li>핵심 키워드: 금지(banned)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04격투기 폐지를 위한 호소</div><ul><li>희생되는 젊은 선수들을 막기 위해 더 이상 방관하지 말고 전문 격투기를 중단시켜야 한다는 목소리가 높다.</li><li>반복되는 죽음과 신체적 장애(crippled) 문제 제기</li><li>추가적인 인명 피해를 막기 위한 사회적 변화 요구</li><li>핵심 키워드: 중단(stopped)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">these days</td><td class=\"m\">요즈음, 오늘날</td></tr><tr><td class=\"w\">cruel</td><td class=\"m\">잔인한</td></tr><tr><td class=\"w\">traditional</td><td class=\"m\">전통적인</td></tr><tr><td class=\"w\">goal</td><td class=\"m\">목표</td></tr><tr><td class=\"w\">consciousness</td><td class=\"m\">의식</td></tr><tr><td class=\"w\">blow</td><td class=\"m\">강타, 타격</td></tr><tr><td class=\"w\">damage</td><td class=\"m\">손상을 입히다</td></tr><tr><td class=\"w\">severely</td><td class=\"m\">심하게, 엄격하게</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">estimate</td><td class=\"m\">추정하다</td></tr><tr><td class=\"w\">professional</td><td class=\"m\">전문적인, 직업의</td></tr><tr><td class=\"w\">surgeon</td><td class=\"m\">외과 의사</td></tr><tr><td class=\"w\">perform</td><td class=\"m\">수행하다, 시행하다</td></tr><tr><td class=\"w\">surgery</td><td class=\"m\">수술</td></tr><tr><td class=\"w\">injury</td><td class=\"m\">부상</td></tr><tr><td class=\"w\">ban</td><td class=\"m\">금지하다</td></tr><tr><td class=\"w\">cripple</td><td class=\"m\">불구로 만들다, 무력화하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">요즘에는</span><span class=\"en\"><b>These days,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많이 있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">there are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잔인한 스포츠가 너무 많다.</span><span class=\"en\"><b>too many cruel sports.</b></span></div></div><div class=\"lec-sent-ko\">요즘에는 잔인한 스포츠가 너무 많다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현대 사회에 폭력성을 띤 스포츠가 지나치게 많다는 문제점을 제기하며 글을 시작하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there are (도치): 유도부사 there가 문두에 오면서 주어인 &#39;too many cruel sports&#39;가 동사 뒤로 도치된 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">these days</td><td class=\"m\">요즈음, 오늘날</td></tr><tr><td class=\"w\">cruel</td><td class=\"m\">잔인한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">텔레비전에서,</span><span class=\"en\"><b>On television,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선택할 수 있는데</span><span class=\"en\"><b>you can <span class=\"grammar-hl\">choose</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기존의 권투와 킥복싱, 극한 격투기, 그밖에 많은 것들 중에서 선택할 수 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">from</span> traditional boxing, kickboxing, ultimate fighting, and many others.</b></span></div></div><div class=\"lec-sent-ko\">텔레비전에서, 기존의 권투와 킥복싱, 극한 격투기, 그밖에 많은 것들 중에서 선택할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;잔인한 스포츠&#39;에 대한 구체적인 예시를 들어 독자가 주변에서 쉽게 접하는 상황임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">choose from (관용표현): &#39;~중에서 선택하다&#39;라는 의미의 구동사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">traditional</td><td class=\"m\">전통적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이런 모든 스포츠의 주된 목표는</span><span class=\"en\"><b>The main goal in all these sports</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하는 것이다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람을 세게 가격하는 것인데</span><span class=\"en\"><b><span class=\"grammar-hl\">to hit</span> another person hard enough</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의식을 잃게 할 정도로.</span><span class=\"en\"><b>to <span class=\"grammar-hl\">make him lose</span> consciousness.</b></span></div></div><div class=\"lec-sent-ko\">이런 모든 스포츠의 주된 목표는 의식을 잃게 할 정도로 다른 사람을 세게 가격하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스포츠의 본질적인 목표가 &#39;상대에게 신체적 타격을 가해 기절시키는 것&#39;임을 밝혀, 이것이 왜 잔인한지 그 이유를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to hit (to부정사): 문장에서 명사적 용법으로 주격 보어 역할을 하며, &#39;치기&#39;라고 해석합니다.</div><div class=\"lec-gr-item\">make him lose 5형식(SVOC) 구조: &#39;make(사역동사) + 목적어(him) + 목적보어(lose, 동사원형)&#39;의 구조입니다. 사역동사 make는 목적보어로 동사원형을 취합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">goal</td><td class=\"m\">목표</td></tr><tr><td class=\"w\">consciousness</td><td class=\"m\">의식</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러한 심한 타격은</span><span class=\"en\"><b><span class=\"grammar-hl\">Such hard blows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">줄 수 있는데</span><span class=\"en\"><b>can damage</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선수들의 몸에 심각한 손상을</span><span class=\"en\"><b>the fighters’ bodies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">줄 수 있다.</span><span class=\"en\"><b>severely.</b></span></div></div><div class=\"lec-sent-ko\">그러한 심한 타격은 선수들의 몸에 심각한 손상을 줄 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> blow는 사전적으로 &#39;불다&#39;라는 뜻이지만, 여기서는 &#39;강타&#39;나 &#39;가격&#39;을 의미합니다. 단순히 &#39;때리는 것&#39;보다 훨씬 충격이 큰 물리적 공격임을 강조하기 위해 이 단어를 선택했습니다. 이 문장은 타격의 결과로 생기는 구체적인 피해를 언급하며 논리를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Such hard blows (관용표현): &#39;그러한 ~&#39;의 의미로, 앞 문장의 내용을 가리키는 지시형용사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blow</td><td class=\"m\">강타, 타격</td></tr><tr><td class=\"w\">damage</td><td class=\"m\">손상을 입히다</td></tr><tr><td class=\"w\">severely</td><td class=\"m\">심하게, 엄격하게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">전문가들은 추정하는데</span><span class=\"en\"><b>Experts estimate</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이런 종류의 스포츠가</span><span class=\"en\"><b>that these kinds of sports</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">입힌 상태라는 것을</span><span class=\"en\"><b>leave</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">50%가 넘는 프로 선수들의 뇌에 손상을</span><span class=\"en\"><b>more than 50% of professional fighters’ brains</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">입힌 상태라고 추정한다.</span><span class=\"en\"><b><span class=\"grammar-hl\">damaged</span>.</b></span></div></div><div class=\"lec-sent-ko\">이런 종류의 스포츠가 50%가 넘는 프로 선수들의 뇌에 손상을 입힌 상태라고 전문가들은 추정한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;신체적 손상&#39; 중에서 가장 치명적인 &#39;뇌 손상&#39;에 대한 통계를 제시하여 사안의 심각성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">damaged (과거분사): &#39;brains damaged&#39; 구조에서 목적어(brains)의 상태를 설명하는 목적격 보어로 쓰였으며, &#39;손상된 상태인&#39;의 의미를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">damage</td><td class=\"m\">손상을 입히다</td></tr><tr><td class=\"w\">estimate</td><td class=\"m\">추정하다</td></tr><tr><td class=\"w\">professional</td><td class=\"m\">전문적인, 직업의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">영국의 외과의사 John Sutcliffe는</span><span class=\"en\"><b>John Sutcliffe, <span class=\"grammar-hl\">a British surgeon</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">했지만</span><span class=\"en\"><b>performed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">응급 뇌수술을</span><span class=\"en\"><b>emergency brain surgery</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세 명의 선수들에게</span><span class=\"en\"><b>on three fighters</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지난 7개월 동안</span><span class=\"en\"><b>in the last seven months,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">했지만</span><span class=\"en\"><b>but</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부상이 너무 심각해</span><span class=\"en\"><b>their injuries were <span class=\"grammar-hl\">so serious</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세 사람이 모두 사망했다.</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> all of them died.</b></span></div></div><div class=\"lec-sent-ko\">영국의 외과의사 John Sutcliffe는 지난 7개월 동안 세 명의 선수들에게 응급 뇌수술을 했지만, 부상이 너무 심각해 세 사람이 모두 사망했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 사례(사망 사고)를 통해 앞서 언급한 뇌 손상이 실제 죽음으로 이어질 수 있는 현실적인 위험임을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a British surgeon (관용표현): &#39;John Sutcliffe&#39;와 동격 관계를 이루어 부연 설명하는 명사구입니다.</div><div class=\"lec-gr-item\">so serious that (관용표현): &#39;so + 형용사/부사 + that절&#39; 구조로, &#39;~할 정도로 매우 ~한&#39;이라는 결과를 나타내는 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surgeon</td><td class=\"m\">외과 의사</td></tr><tr><td class=\"w\">perform</td><td class=\"m\">수행하다, 시행하다</td></tr><tr><td class=\"w\">surgery</td><td class=\"m\">수술</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오랫동안</span><span class=\"en\"><b>For many years,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영국의학협회에 속해 있는 그와 또 다른 의사들은</span><span class=\"en\"><b>he and other doctors in the British Medical Association</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">열심히 노력해왔는데</span><span class=\"en\"><b><span class=\"grammar-hl\">have worked</span> hard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이런 스포츠를 금지시키기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to have these sports banned</span>.</b></span></div></div><div class=\"lec-sent-ko\">오랫동안 영국의학협회에 속해 있는 그와 또 다른 의사들은 이런 스포츠를 금지시키기 위해 열심히 노력해왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> banned는 사전적으로 &#39;금지된&#39;인데, 여기서는 사회적 규제를 통해 위험한 스포츠를 퇴출하려는 강력한 의지를 나타냅니다. 전문가 집단이 문제 해결을 위해 어떤 행동을 취하고 있는지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have worked (관용표현): &#39;For many years&#39;라는 시간 부사와 함께 쓰여 현재완료(계속)의 의미를 나타냅니다.</div><div class=\"lec-gr-item\">to have these sports banned 5형식(SVOC) 구조: &#39;have(사역동사) + 목적어(these sports) + 목적보어(p.p. banned)&#39; 형태입니다. 목적어인 스포츠가 금지되는 수동의 관계이므로 과거분사 banned가 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ban</td><td class=\"m\">금지하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">John Sutcliffe는 ~라고 했다</span><span class=\"en\"><b>Sutcliffe has said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얼마나 더 많은 젊은이들이</span><span class=\"en\"><b>“How many more young men</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">죽거나 불구가 되어야</span><span class=\"en\"><b><span class=\"grammar-hl\">must be killed or crippled</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직업적인 격투기가</span><span class=\"en\"><b>before professional fighting</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중단될 것인가?</span><span class=\"en\"><b><span class=\"grammar-hl\">is stopped</span>?</b></span></div></div><div class=\"lec-sent-ko\">John Sutcliffe는 “얼마나 더 많은 젊은이들이 죽거나 불구가 되어야 직업적인 격투기가 중단될 것인가?”라고 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> crippled는 사전적으로 &#39;불구로 만든&#39;이라는 뜻인데, 여기서는 단순히 몸이 다치는 수준을 넘어 정상적인 생활이 불가능할 정도의 심각한 장애를 입는 상황을 극적으로 표현하여 대중의 경각심을 일깨우고 있습니다. 글 전체의 결론으로, 격투기 스포츠에 대한 강한 비판과 제도적 변화의 필요성을 호소합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">must be killed or crippled (수동태): be동사(be)+p.p.(killed/crippled) 구조입니다. kill과 cripple은 타동사인데 목적어가 주어로 이동하여 수동구조가 되었습니다. 기본구조: kill/cripple + O (O를 죽이다/불구로 만들다).</div><div class=\"lec-gr-item\">is stopped (수동태): be동사(is)+p.p.(stopped) 구조입니다. stop은 타동사인데 목적어가 주어로 이동하여 수동구조가 되었습니다. 기본구조: stop + O (O를 멈추다/중단하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">professional</td><td class=\"m\">전문적인, 직업의</td></tr><tr><td class=\"w\">cripple</td><td class=\"m\">불구로 만들다, 무력화하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>최근 잔인한 격투 스포츠가 성행하고 있으며, 이는 상대방의 의식을 잃게 하는 것을 목표로 한다.</li><li>이러한 스포츠는 선수들에게 치명적인 뇌 손상과 사망을 초래하는 심각한 위험을 안고 있다.</li><li>전문가들은 격투 스포츠의 위험성을 경고하며 이를 금지해야 한다고 강력히 주장한다.</li><li>더 이상의 희생을 막기 위해 프로 격투기에 대한 제도적인 규제가 필요하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Professional fighting causes permanent brain damage or death to participants, so medical experts are demanding that these sports be banned to protect human life.</div>\n              <div class=\"lec-final-sum-ko\">전문 격투기는 선수들에게 영구적인 뇌 손상이나 죽음을 초래하므로, 의학 전문가들은 인간의 생명을 보호하기 위해 이러한 스포츠의 금지를 요구하고 있다.</div></div></div>"],"segs":[[{"audio":"./passage3_audio/1.mp3","hl":null}],[{"audio":"./passage3_audio/2.mp3","hl":null}],[{"audio":"./passage3_audio/3.mp3","hl":null},{"audio":"./passage3_audio/4.mp3","hl":"stage-0"},{"audio":"./passage3_audio/5.mp3","hl":"stage-1"},{"audio":"./passage3_audio/6.mp3","hl":"stage-2"},{"audio":"./passage3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage3_audio/8.mp3","hl":null}],[{"audio":"./passage3_audio/9.mp3","hl":"main"},{"audio":"./passage3_audio/10.mp3","hl":"meaning"},{"audio":"./passage3_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/12.mp3","hl":"main"},{"audio":"./passage3_audio/13.mp3","hl":"meaning"},{"audio":"./passage3_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/15.mp3","hl":"main"},{"audio":"./passage3_audio/16.mp3","hl":"meaning"},{"audio":"./passage3_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/18.mp3","hl":"main"},{"audio":"./passage3_audio/19.mp3","hl":"meaning"},{"audio":"./passage3_audio/20.mp3",
