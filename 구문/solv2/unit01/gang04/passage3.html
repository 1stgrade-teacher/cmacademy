</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"4강 reading3","audioDir":"passage3_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">4강\u003cbr>3번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Cruel Sports: When Winning Means Knocking Someone Out\u003c/h1>\u003ch2>잔인한 스포츠: 이기는 것이 누군가를 의식 불명에 빠뜨리는 일일 때\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 텔레비전에서 인기 있는 격투 스포츠는 상대를 \u003cb class=\"key\">의식\u003c/b>을 잃게 할 만큼 세게 가격하는 것을 목표로 삼아 선수들의 몸과 \u003cb class=\"key\">뇌\u003c/b>에 심각한 손상을 입히고 있으며, 의사들은 이런 스포츠를 \u003cb class=\"key\">금지\u003c/b>해야 한다고 주장한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Doctors argue that cruel combat sports should be banned because hard blows leave more than half of professional fighters with damaged brains and sometimes kill them.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 잔인한 격투 스포츠의 위험과 그 금지 요구를 다루는 글이에요. 텔레비전에서 쉽게 볼 수 있는 격투 종목들이 실제로 선수들의 뇌에 어떤 피해를 주는지, 그리고 의사들이 왜 목소리를 높이는지 살펴볼 거예요. 요약하면 격투 스포츠의 목표 자체가 상대를 의식 잃게 만드는 것이라 위험하고, 그래서 금지해야 한다는 주장이에요. 자, 그럼 시작해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">권투(boxing)나 종합격투기(MMA)처럼 상대를 직접 가격하는 스포츠는 머리에 충격이 반복되어 뇌진탕(concussion) 위험이 커요. 이런 타격이 쌓이면 만성 외상성 뇌병증(CTE)처럼 뇌가 서서히 망가지는 질환으로 이어질 수 있죠. 그래서 영국 의학협회(British Medical Association) 같은 의료 단체는 오래전부터 이런 스포츠를 \u003cb class=\"key\">금지\u003c/b>해야 한다고 주장해 왔어요. 관중의 흥행과 방송 시청률이 걸려 있어서 위험을 알면서도 경기가 계속되는 점이 문제의 핵심이에요. 자동차를 탈 때 안전벨트를 반드시 매는 것처럼, 위험을 줄이는 최소한의 \u003cb class=\"key\">안전장치\u003c/b>가 필요하다는 눈으로 이 글을 보면 이해가 쉬워요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 복싱이나 종합격투기처럼 상대를 직접 때리는 스포츠는 머리에 충격이 반복되기 때문에 뇌진탕 위험이 커요. 이런 타격이 쌓이면 만성 외상성 뇌병증처럼 뇌가 서서히 망가지는 질환으로 이어질 수 있죠. 그래서 영국의학협회 같은 의료 단체는 오래전부터 이런 스포츠를 금지하라고 목소리를 높여 왔어요. 흥행과 시청률이 걸려 있으니 위험을 알면서도 경기가 쉽게 없어지지 않는다는 점도 함께 기억해 두세요. 자동차를 탈 때 안전벨트를 반드시 매듯이, 위험을 줄이는 최소한의 안전장치가 필요하다는 관점으로 이 글을 보면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>잔인한 스포츠의 범람\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>글은 요즘에는 \u003cb class=\"key\">잔인한\u003c/b> 스포츠가 너무 많다는 한 문장으로 시작해요. 화자의 문제의식이 담긴 \u003cb class=\"key\">도입\u003c/b> 문장으로, 뒤에 이어질 구체적인 예시들을 미리 예고해요. 짧지만 too many라는 표현에 비판적인 어조가 담겨 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>격투 스포츠의 목표\u003csmall>예시 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>텔레비전에서 권투, 킥복싱, 극한 격투기 등 여러 종목을 고를 수 있다는 \u003cb class=\"key\">예시\u003c/b>가 나와요. 이 스포츠들의 주된 목표는 상대를 \u003cb class=\"key\">의식\u003c/b>을 잃게 할 정도로 세게 가격하는 것이라고 밝혀요. 곧 경기의 목표 자체가 상대에게 \u003cb class=\"key\">위험\u003c/b>을 주는 행위임을 보여 주는 대목이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>뇌 손상의 근거\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>심한 타격이 선수들의 몸에 심각한 손상을 준다는 \u003cb class=\"key\">인과\u003c/b>가 이어져요. 전문가들은 이런 스포츠가 프로 선수 절반이 넘는 사람들의 \u003cb class=\"key\">뇌\u003c/b>에 손상을 남긴다고 추정해요. expert와 estimate라는 표현이 \u003cb class=\"key\">근거\u003c/b>의 신뢰도를 높여 주는 역할을 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사망 사례\u003csmall>예시 · 문장 6\u003c/small>\u003c/h4>\u003cp>영국 외과의사 John Sutcliffe가 지난 일곱 달 동안 세 선수의 \u003cb class=\"key\">응급\u003c/b> 뇌수술을 했지만 모두 사망했다는 사례가 나와요. 추정 통계를 실제 \u003cb class=\"key\">사례\u003c/b>로 뒷받침하는 부분이에요. so serious that 구문이 부상의 심각성을 강하게 강조해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>금지 요구\u003csmall>주장 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>그와 영국의학협회 의사들이 오랫동안 이런 스포츠를 \u003cb class=\"key\">금지\u003c/b>시키기 위해 노력해 왔다는 주장이 나와요. 마지막에는 얼마나 더 많은 젊은이들이 죽거나 \u003cb class=\"key\">불구\u003c/b>가 되어야 격투기가 중단될 것인가라는 수사 의문문으로 호소해요. 글 전체의 \u003cb class=\"key\">주제\u003c/b>가 마지막 문장에 응축되어 있어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 처음부터 끝까지 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 글은 요즘에는 잔인한 스포츠가 너무 많다는 한 문장으로 시작해요. 화자의 문제의식이 담긴 문장이면서, 뒤에 나올 구체적인 예시를 예고하는 역할을 하죠. too many라는 표현에 비판적인 어조가 숨어 있다는 점도 짚어 두세요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 예시예요. 텔레비전에서 권투, 킥복싱, 극한 격투기 등 여러 종목을 고를 수 있다고 하죠. 그리고 이 스포츠들의 주된 목표가 상대를 의식 잃게 할 정도로 세게 가격하는 것이라고 밝혀요. 결국 경기의 목표 자체가 상대에게 위험을 주는 행위라는 걸 보여 주는 대목이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 근거예요. 심한 타격이 선수들의 몸에 심각한 손상을 준다는 인과가 이어지고, 전문가들이 프로 선수 절반이 넘는 사람들의 뇌에 손상이 남는다고 추정한다는 통계가 나와요. expert와 estimate라는 표현이 근거의 신뢰도를 높여 주죠. 숫자가 아니라 전문가의 추정이라는 점을 기억하면 좋아요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 사망 사례예요. 영국 외과의사 John Sutcliffe가 지난 일곱 달 동안 세 선수의 응급 뇌수술을 했지만 모두 사망했다는 내용이 나오죠. 앞의 통계를 실제 사례로 뒷받침하는 부분이에요. so serious that 구문이 부상의 심각성을 얼마나 강하게 강조하는지도 눈여겨보세요.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 주장이에요. 그와 영국의학협회 의사들이 오랫동안 이런 스포츠를 금지시키기 위해 노력해 왔다고 하고, 마지막에는 얼마나 더 많은 젊은이들이 죽거나 불구가 되어야 격투기가 중단될 것인가라는 수사 의문문으로 호소해요. 글 전체의 주제가 바로 이 마지막 문장에 응축되어 있어요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제 제기 - 근거 - 주장\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">도입에서 잔인한 스포츠가 너무 많다는 \u003cb class=\"key\">문제\u003c/b>를 제기하고, 그 목표와 위험을 예시와 통계로 풀어요. 이어 실제 사망 사례라는 \u003cb class=\"key\">근거\u003c/b>를 제시한 뒤, 마지막에 금지를 요구하는 \u003cb class=\"key\">주장\u003c/b>을 배치해요. 핵심 주장이 글의 끝에서 수사 의문문으로 나오기 때문에 \u003cb class=\"key\">미괄식\u003c/b> 구조로 판단해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>These days (1)\u003c/b>\u003cspan>문제 제기·도입\u003c/span>\u003cb>Experts estimate (5)\u003c/b>\u003cspan>근거 제시\u003c/span>\u003cb>but (6)\u003c/b>\u003cspan>반전·결과 강조\u003c/span>\u003cb>have worked hard to (7)\u003c/b>\u003cspan>주장·요구\u003c/span>\u003cb>How many more (8)\u003c/b>\u003cspan>수사 의문문으로 주장 강화\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">cruel sports\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these sports\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these kinds of sports\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">professional fighting\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">banned\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">stopped\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>격투 스포츠\u003c/th>\u003cth>의료계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>상대를 의식 잃게 가격하는 것이 목표\u003c/td>\u003ctd>선수를 보호하는 것이 목표\u003c/td>\u003c/tr>\u003ctr>\u003ctd>뇌 손상과 사망을 초래\u003c/td>\u003ctd>금지와 중단을 요구\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 문제 제기에서 근거를 거쳐 주장으로 가는 흐름이에요. 도입에서 잔인한 스포츠가 너무 많다는 문제를 던지고, 중간에는 목표와 위험, 통계와 사례라는 근거를 쌓아요. 그리고 마지막에 금지를 요구하는 주장을 놓죠. 핵심 주장이 글의 끝에서 수사 의문문으로 나오기 때문에 미괄식 구조로 판단하면 돼요.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. These days로 문제를 열고, Experts estimate로 근거를 세우고, but으로 사망이라는 결과를 강조하죠. have worked hard to에서는 주장이 시작되고, How many more라는 수사 의문문으로 호소를 마무리해요. 같은 대상을 cruel sports, these sports, these kinds of sports, professional fighting처럼 계속 바꿔 부르는 재진술도 함께 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>these days\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>요즘에는\u003c/span>\u003c/div>\u003cdiv>\u003cb>cruel\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잔인한\u003c/span>\u003c/div>\u003cdiv>\u003cb>traditional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전통적인, 기존의\u003c/span>\u003c/div>\u003cdiv>\u003cb>ultimate fighting\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>극한 격투기\u003c/span>\u003c/div>\u003cdiv>\u003cb>choose from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~중에서 선택하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>main\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>주된, 주요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>goal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목표\u003c/span>\u003c/div>\u003cdiv>\u003cb>hit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>때리다, 가격하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hard enough to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 정도로 세게\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose consciousness\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>의식을 잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>such\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>그러한\u003c/span>\u003c/div>\u003cdiv>\u003cb>blow\u003c/b>\u003cem>명사\u003c/em>\u003cspan>타격, 강타\u003c/span>\u003c/div>\u003cdiv>\u003cb>damage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>손상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>severely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심각하게, 심하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>expert\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전문가\u003c/span>\u003c/div>\u003cdiv>\u003cb>estimate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>professional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>직업적인, 프로의\u003c/span>\u003c/div>\u003cdiv>\u003cb>brain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뇌\u003c/span>\u003c/div>\u003cdiv>\u003cb>surgeon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>외과의사\u003c/span>\u003c/div>\u003cdiv>\u003cb>perform\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수행하다, 시행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>emergency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>응급\u003c/span>\u003c/div>\u003cdiv>\u003cb>surgery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수술\u003c/span>\u003c/div>\u003cdiv>\u003cb>injury\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부상\u003c/span>\u003c/div>\u003cdiv>\u003cb>serious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>심각한, 중대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>association\u003c/b>\u003cem>명사\u003c/em>\u003cspan>협회, 단체\u003c/span>\u003c/div>\u003cdiv>\u003cb>ban\u003c/b>\u003cem>동사\u003c/em>\u003cspan>금지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>crippled\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불구가 된\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>중단하다, 멈추다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚어 볼게요. cruel은 잔인한이라는 뜻이고, lose consciousness는 의식을 잃다는 표현이에요. severely는 심각하게, estimate는 추정하다, ban은 금지하다라는 뜻이니 꼭 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">cruel\u003c/b>\u003cspan class=\"m\">잔인한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">brutal\u003c/span>\u003cspan class=\"s\">savage\u003c/span>\u003cspan class=\"s\">harsh\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">humane\u003c/span>\u003cspan class=\"a\">kind\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">main\u003c/b>\u003cspan class=\"m\">주된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">primary\u003c/span>\u003cspan class=\"s\">chief\u003c/span>\u003cspan class=\"s\">principal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003cspan class=\"a\">secondary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">severely\u003c/b>\u003cspan class=\"m\">심각하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">seriously\u003c/span>\u003cspan class=\"s\">gravely\u003c/span>\u003cspan class=\"s\">badly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">mildly\u003c/span>\u003cspan class=\"a\">slightly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">damage\u003c/b>\u003cspan class=\"m\">손상시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">harm\u003c/span>\u003cspan class=\"s\">injure\u003c/span>\u003cspan class=\"s\">impair\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">repair\u003c/span>\u003cspan class=\"a\">protect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">estimate\u003c/b>\u003cspan class=\"m\">추정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assess\u003c/span>\u003cspan class=\"s\">evaluate\u003c/span>\u003cspan class=\"s\">reckon\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ban\u003c/b>\u003cspan class=\"m\">금지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prohibit\u003c/span>\u003cspan class=\"s\">forbid\u003c/span>\u003cspan class=\"s\">outlaw\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">allow\u003c/span>\u003cspan class=\"a\">permit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stop\u003c/b>\u003cspan class=\"m\">중단하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">halt\u003c/span>\u003cspan class=\"s\">cease\u003c/span>\u003cspan class=\"s\">end\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">continue\u003c/span>\u003cspan class=\"a\">start\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어로 정리해 볼게요. cruel은 brutal, savage와 가깝고 반대말은 humane이에요. severely는 seriously, gravely와 비슷하고 반대는 mildly죠. damage는 harm, injure와 통하고 반대는 repair이고, ban은 prohibit, forbid와 같고 반대는 allow, permit이에요. stop은 halt, cease와 가깝고 반대는 continue예요. 이렇게 묶음으로 외우면 어휘 문제가 훨씬 쉬워져요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요즘에는\u003c/span>\u003cspan class=\"en\">These days,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 많은 잔인한 스포츠가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">many\u003c/span> cruel sports.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">요즘에는 잔인한 스포츠가 너무 많다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 도입부로, 최근 \u003cb class=\"key\">잔인한 \u003c/b>\u003cb class=\"key\">스포츠\u003c/b>가 넘쳐난다는 문제를 제기하는 문장이에요. \u003cb class=\"key\">there \u003c/b>\u003cb class=\"key\">are\u003c/b> 구문은 '~이 있다'라는 뜻이고, 뒤에 오는 명사가 진짜 주어라는 점이 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there be 구문(유도부사)\u003c/span> : There + [be동사] + [주어] → '~이/가 있다' : \"있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">too + 형용사 (정도 강조)\u003c/span> : too + [형용사] + [명사] → '너무 ~한' : \"너무 많은\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"These days, 요즘에는. there are, 있습니다. too many cruel sports, 너무 많은 잔인한 스포츠가. 이 문장 전체를 해석하면, 요즘에는 잔인한 스포츠가 너무 많다.","hl":"m"},{"n":14,"text":"첫 번째 문장은 글의 도입이에요. 요즘 잔인한 스포츠가 너무 많다는 문제를 던지고 있죠. 여기서 there are는 '있다'라는 뜻이고, 진짜 주어는 뒤에 오는 too many cruel sports라는 점을 꼭 기억해 두세요.","hl":"mn"},{"n":15,"text":"먼저 there are는 there be 구문으로 '~이 있다'라는 뜻을 만들어요. 두 번째로 too many는 '너무 많은'이라는 뜻으로 정도가 지나침을 강조하죠. 마지막으로 동사가 are인 이유는 실제 주어인 too many cruel sports가 복수이기 때문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">텔레비전에서\u003c/span>\u003cspan class=\"en\">On television,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 선택할 수 있습니다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">choose \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기존의 권투 중에서\u003c/span>\u003cspan class=\"en\">\u003cspan 을 세게 가격하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이런 스포츠의 \u003cb class=\"key\">주된 \u003c/b>\u003cb class=\"key\">목표\u003c/b>가 상대를 가격해 \u003cb class=\"key\">의식\u003c/b>을 잃게 만드는 것이라고 규정하며, 왜 잔인한지 근거를 제시하는 문장이에요. to부정사가 보어로 쓰여 '~하는 것이다'라는 의미를 만들고, enough to가 정도를 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (주격 보어)\u003c/span> : [주어] + be동사 + to부정사 → '~하는 것이다' : \"다른 사람을 가격하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">enough to부정사 (정도)\u003c/span> : [형용사/부사] + enough + to부정사 → '~할 만큼 충분히 …한' : \"~할 만큼 충분히 세게\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 원형부정사\u003c/span> : make + [목적어] + [동사원형] → '~가 …하게 만들다' : \"그가 의식을 잃게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"The main goal in all these sports, 이런 모든 스포츠의 주된 목표는. is, 입니다. to hit another person, 다른 사람을 세게 가격하는 것. hard enough, 충분히 세게. to make him lose consciousness, 그가 의식을 잃게 할 만큼. 이 문장 전체를 해석하면, 이런 모든 스포츠의 주된 목표는 의식을 잃게 할 정도로 다른 사람을 세게 가격하는 것이다.","hl":"m"},{"n":20,"text":"세 번째 문장은 이런 스포츠들의 주된 목표가 무엇인지 정확히 밝혀요. 상대를 때려 의식을 잃게 만드는 것이 목표라고 하면서 잔인하다는 점을 분명히 하죠. 여기서 to부정사가 목표의 내용을 채워 주는 역할을 한다는 게 중요해요.","hl":"mn"},{"n":21,"text":"첫 번째로 to hit another person은 주어 The main goal을 설명하는 보어 자리에 온 to부정사이고, be동사 뒤에서 '~하는 것이다'로 해석해요. 두 번째로 hard enough to make는 enough to부정사로 '~할 만큼 충분히 세게'라는 정도를 나타내요. 세 번째로 make him lose consciousness에서 make는 사역동사라서 뒤에 동사원형 lose가 오고, 그가 의식을 잃게 만든다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 심한 타격은\u003c/span>\u003cspan class=\"en\">Such hard blows\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손상을 줄 수 있다\u003c/span>\u00 ge의 정도를 강하게 꾸미는 부사이고 손상이 얼마나 심각한지를 분명히 해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전문가들은 추정한다\u003c/span>\u003cspan class=\"en\">Experts \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">estimate \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 종류의 스포츠가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> these kinds of sports\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남긴다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">leave\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프로 선수들의 뇌 중 50%가 넘는 부분을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">50%\u003c/span> of professional fighters' brains\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손상된 상태로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">damaged\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 종류의 스포츠가 50%가 넘는 프로 선수들의 뇌에 손상을 입힌 상태라고 전문가들은 추정한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전문가들이 이런 스포츠가 프로 선수들의 뇌 중 50%가 넘는 부분을 \u003cb class=\"key\">손상된 \u003c/b>\u003cb class=\"key\">상태\u003c/b>로 남긴다고 \u003cb class=\"key\">추정\u003c/b>한다는 뜻이에요. 앞 문장의 신체 손상 주장을 \u003cb class=\"key\">통계\u003c/b>로 뒷받침하며, 격투기의 위험이 개인 문제가 아니라 널리 퍼진 문제임을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that절을 목적어로 취하는 동사\u003c/span> : estimate + [that + 주어 + 동사 ...] : \"~라고 추정하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 동사 leave\u003c/span> : leave + [목적어] + [목적격보어] : \"~을 ...한 상태로 남기다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교 표현 more than\u003c/span> : more than + [수량] : \"50%가 넘는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">과거분사 목적격보어\u003c/span> : leave + [목적어] + [damaged(과거분사)] : \"손상된 상태로\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Experts estimate, 전문가들은 추정한다. that these kinds of sports, 이런 종류의 스포츠가. leave, 남긴다고. more than 50% of professional fighters' brains, 프로 선수들의 뇌 중 50%가 넘는 부분을. damaged, 손상된 상태로. 이 문장 전체를 해석하면, 이런 종류의 스포츠가 50%가 넘는 프로 선수들의 뇌에 손상을 입힌 상태라고 전문가들은 추정한다.","hl":"m"},{"n":26,"text":"이 문장은 전문가들이 이런 스포츠가 프로 선수들의 뇌 중 절반이 넘는 부분을 손상된 상태로 남긴다고 추정한다는 뜻이에요. 앞 문장의 신체 손상 주장을 통계로 뒷받침하며, 격투기의 위험이 개인 문제가 아니라 널리 퍼진 문제임을 보여 주죠.","hl":"mn"},{"n":27,"text":"첫 번째로 estimate that에서 estimate는 that절을 목적어로 받고 that은 절을 이끄는 접속사예요. 두 번째로 leave는 목적어 뒤에 목적격보어를 두어 목적어를 어떤 상태로 남긴다는 다섯 형식 문장을 만들어요. 세 번째로 more than은 수량 앞에서 쓰이는 비교 표현이에요. 네 번째로 damaged는 수동의 의미를 지닌 과거분사로 목적어의 상태를 설명하는 목적격보어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영국의 외과의사 John Sutcliffe는\u003c/span>\u003cspan class=\"en\">John Sutcliffe, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">British \u003c/span>\u003cspan class=\"tgt\">surge\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">응급 뇌수술을 했\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">performed\u003c/span> emergency brain surgery\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세 명의 선수들에게\u003c/span>\u003cspan class=\"en\">on three fighters\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지난 7개월 동안\u003c/span>\u003cspan class=\"en\">in the last seven months,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그들의 부상이 너무 심각해서\u003c/span>\u003cspan class=\"en\">but their injuries were \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">serious \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세 사람이 모두 사망했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> all of them died.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">영국의 외과의사 John Sutcliffe는 지난 7개월 동안 세 명의 선수들에게 응급 뇌수술을 했지만, 부상이 너무 심각해 세 사람이 모두 사망했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> John Sutcliffe가 세 선수에게 응급 뇌수술을 했지만 모두 사망했다는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 제시해요. 이는 앞에서 말한 격투기의 \u003cb class=\"key\">위험성\u003c/b>이 실제 생명을 앗아간다는 점을 보여 주고, 다음 문장의 \u003cb class=\"key\">금지 \u003c/b>\u003cb class=\"key\">요구\u003c/b>로 이어지는 강한 근거가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 명사구\u003c/span> : [고유명사], [동격 명사구], : \"영국의 외과의사인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 on의 대상 표현\u003c/span> : perform surgery on + [사람] : \"~에게\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거시제\u003c/span> : [주어] + [과거동사] : \"했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">so ~ that 구문\u003c/span> : so + [형용사] + that + [결과 절] : \"너무 심각해서 ~했다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"John Sutcliffe, a British surgeon, 영국의 외과의사 John Sutcliffe는. performed emergency brain surgery, 응급 뇌수술을 했. on three fighters, 세 명의 선수들에게. in the last seven months, 지난 7개월 동안. but their injuries were so serious, 하지만 그들의 부상이 너무 심각해서. that all of them died, 세 사람이 모두 사망했다. 이 문장 전체를 해석하면, 영국의 외과의사 John Sutcliffe는 지난 7개월 동안 세 명의 선수들에게 응급 뇌수술을 했지만, 부상이 너무 심각해 세 사람이 모두 사망했다.","hl":"m"},{"n":29,"text":"이 문장은 John Sutcliffe가 세 선수에게 응급 뇌수술을 했지만 모두 사망했다는 구체적 사례를 제시해요. 이는 앞에서 말한 격투기의 위험성이 실제 생명을 앗아간다는 점을 보여 주고, 다음 문장의 금지 요구로 이어지는 강한 근거가 되죠.","hl":"mn"},{"n":30,"text":"첫 번째로 a British surgeon은 앞의 John Sutcliffe가 어떤 사람인지 설명하는 동격 표현이에요. 두 번째로 performed는 지난 일을 나타내는 과거시제이고 문장의 서술어 역할을 해요. 세 번째로 on은 perform surgery on이라는 관용 표현에서 수술의 대상을 이끄는 전치사예요. 네 번째로 so serious that은 so와 that 사이의 형용사 serious가 정도를 나타내고 that절이 결과를 설명하는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오랫동안\u003c/span>\u003cspan class=\"en\">For many years,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그와 또 다른 의사들은\u003c/span>\u003cspan class=\"en\">he and other \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">doctors \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영국의학협회에 속해 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">British \u003c/span>\u003cspan class=\"tgt\">Medical \u003c/span>\u003cspan class=\"tgt\">Association\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열심히 노력해왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">worked \u003c/span>\u003cspan class=\"tgt\">hard\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 스포츠를 금지시키기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">sports \u003c/span>\u003cspan class=\"tgt\">banned\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오랫동안 영국의학협회에 속해 있는 그와 또 다른 의사들은 이런 스포츠를 금지시키기 위해 열심히 노력해왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의사들이 오랫동안 격투 스포츠를 없애기 위해 애써 왔다는 사실을 전하는 문장이에요. for many years와 함께 쓰인 have worked가 '과거부터 지금까지 계속'이라는 \u003cb class=\"key\">계속\u003c/b>의 느낌을 만들어 주고, to have these sports banned는 '이런 스포츠가 금지되게 하기 위해'라는 \u003cb class=\"key\">목적\u003c/b>을 나타냅니다. 앞 문장에서 격투기의 참혹함을 보여 준 뒤, 그에 맞서는 사람들의 \u003cb class=\"key\">노력\u003c/b>을 제시하는 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [[명사]] + 전치사구(형용사 역할) : \"영국의학협회에 속해 있는 의사들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료(계속)\u003c/span> : have/has + [[과거분사]] + for + 기간 : \"열심히 노력해왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적) + have + 목적어 + 과거분사\u003c/span> : [[to부정사]](목적) + have + [[목적어]] + 과거분사 : \"이런 스포츠를 금지시키기 위해\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"For many years, 오랫동안. he and other doctors, 그와 또 다른 의사들은. in the British Medical Association, 영국의학협회에 속해 있는. have worked hard, 열심히 노력해왔다. to have these sports banned, 이런 스포츠를 금지시키기 위해. 이 문장 전체를 해석하면, 오랫동안 영국의학협회에 속해 있는 그와 또 다른 의사들은 이런 스포츠를 금지시키기 위해 열심히 노력해왔다.","hl":"m"},{"n":32,"text":"이 문장은 의사들이 오랫동안 격투 스포츠를 없애기 위해 애써 왔다는 걸 알려 주는 대목이에요. for many years가 있으니까 과거의 어느 시점부터 지금까지 쭉 이어져 온 일이라는 점을 꼭 잡아 주세요.","hl":"mn"},{"n":33,"text":"먼저 have worked hard는 현재완료 계속 용법이에요. for many years처럼 기간을 나타내는 말과 만나면 지금까지 쭉 해 온 일이라는 뜻이 되죠. 두 번째로 to have these sports banned에서 to부정사는 목적을 나타내고, have 다음의 목적어 these sports는 banned와 수동 관계라서 금지되게 하다로 해석해요. 세 번째로 in the British Medical Association은 앞의 doctors를 뒤에서 꾸며 주는 전치사구라는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Sutcliffe는 말해왔다,\u003c/span>\u003cspan class=\"en\">Sutcliffe \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;얼마나 더 많은 젊은이들이\u003c/span>\u003cspan class=\"en\">&quot;How many more young men\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">죽거나 불구가 되어야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">killed \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">crippled\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직업적인 격투기가 중단되기 전에?&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">professional \u003c/span>\u003cspan class=\"tgt\">fighting \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">stopped\u003c/span>?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">John Sutcliffe는 “얼마나 더 많은 젊은이들이 죽거나 불구가 되어야 직업적인 격투기가 중단될 것인가?”라고 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Sutcliffe의 \u003cb class=\"key\">반문\u003c/b>을 그대로 인용한 문장으로, '얼마나 더 많은 젊은이가 죽어야 격투기가 멈춰지겠느냐'며 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">비판\u003c/b>을 던지고 있어요. How many more가 '얼마나 더 많은'이라는 뜻으로 분노를 실어 주고, 이 인용은 앞 문장의 금지 노력을 뒷받침하는 \u003cb class=\"key\">근거\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료\u003c/span> : have/has + [[과거분사]] : \"말해왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 must + 수동태 + 병렬\u003c/span> : [[조동사]] + be + 과거분사 / A or B [[병렬]] : \"죽거나 불구가 되어야\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간 부사절 before + 수동태\u003c/span> : [[before]] + 주어 + 동사(시간 부사절) : \"직업적인 격투기가 중단되기 전에\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Sutcliffe has said, Sutcliffe는 말해왔다. \"How many more young men, \"얼마나 더 많은 젊은이들이. must be killed or crippled, 죽거나 불구가 되어야. before professional fighting is stopped?\", 직업적인 격투기가 중단되기 전에?\". 이 문장 전체를 해석하면, John Sutcliffe는 “얼마나 더 많은 젊은이들이 죽거나 불구가 되어야 직업적인 격투기가 중단될 것인가?”라고 했다.","hl":"m"},{"n":35,"text":"이 문장은 Sutcliffe가 던진 반문을 그대로 인용한 거예요. 얼마나 더 많은 젊은이가 죽어야 격투기가 멈춰지겠느냐고 물으면서 강한 비판을 쏟아 내고 있죠. 바로 앞 문장에서 말한 금지 노력을 뒷받침하는 근거가 되는 말이기도 해요.","hl":"mn"},{"n":36,"text":"먼저 has said는 현재완료로, 그가 한 말이 지금까지도 영향력을 갖는다는 걸 보여 줘요. 두 번째로 must be killed or crippled는 조동사 must 뒤에 수동태 be killed가 오고, or로 crippled가 병렬로 연결된 형태예요. 세 번째로 before professional fighting is stopped에서 before 절 안에서는 앞으로의 일이라도 현재시제 is stopped를 쓰고, 격투기는 중단되는 대상이라 수동태로 쓴다는 점을 기억해요. 마지막으로 How many more는 얼마나 더 많은이라는 뜻으로 강한 비판의 어조를 만들어 준다는 것도 함께 알아 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>텔레비전에서 권투, 킥복싱, 극한 격투기 같은 \u003cb class=\"key\">잔인한\u003c/b> 스포츠를 쉽게 접할 수 있다.\u003c/li>\u003cli>이 스포츠들의 주된 목표는 상대를 \u003cb class=\"key\">의식\u003c/b>을 잃게 할 만큼 세게 가격하는 것이다.\u003c/li>\u003cli>반복되는 강한 타격은 선수들의 몸과 \u003cb class=\"key\">뇌\u003c/b>에 심각한 손상을 입히고 심지어 죽음에 이르게 한다.\u003c/li>\u003cli>영국의학협회 의사들은 이런 스포츠를 \u003cb class=\"key\">금지\u003c/b>시키기 위해 오랫동안 노력해 왔다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Doctors argue that cruel combat sports should be banned because hard blows leave more than half of professional fighters with damaged brains and sometimes kill them.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 텔레비전에서 인기 있는 격투 스포츠는 상대를 \u003cb class=\"key\">의식\u003c/b>을 잃게 할 만큼 세게 가격하는 것을 목표로 삼아 선수들의 몸과 \u003cb class=\"key\">뇌\u003c/b>에 심각한 손상을 입히고 있으며, 의사들은 이런 스포츠를 \u003cb class=\"key\">금지\u003c/b>해야 한다고 주장한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"오늘 글은 잔인한 격투 스포츠의 위험과 금지 요구를 다뤘어요. 경기의 목표 자체가 상대를 의식 잃게 만드는 것이라 뇌 손상과 사망이 반복된다는 점, 그리고 의사들이 금지를 외친다는 점을 꼭 기억하세요. 수사 의문문으로 끝나는 미괄식 구조라서 마지막 문장이 주제라는 것도 잊지 마세요. 오늘 수업 여기까지예요, 수고했어요!","hl":null}]}]});</script></body></html>
