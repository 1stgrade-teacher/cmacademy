설이 존재해요. 마치 컴퓨터가 과부하 걸렸을 때 재부팅을 하듯, 우리 몸도 눈물을 통해 스트레스 호르몬(Stress hormones)을 배출함으로써 마음의 안정을 찾으려는 신체적 정화 과정(Biological detoxification)을 거치는 것이죠. 즉, 눈물은 감정을 밖으로 표출하며 심리적 회복력(Resilience)을 높여주는 우리 몸의 똑똑한 방어 기제라고 이해하면 쉽답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01울음의 정서적 이점</div><ul><li>많은 사람들이 울고 난 뒤에 감정적으로 평온해짐을 경험한다고 보고한다.</li><li>설문 결과: 남녀 모두 울음 후 슬픔과 분노가 감소(less sad or angry)함</li><li>울음이 마음의 평화(at peace)를 가져다줌</li><li>핵심 키워드: 울음(crying), 정서적 안정(well-being)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02눈물의 화학적 분석</div><ul><li>과학자들은 슬픔 때문에 흘리는 눈물과 다른 원인으로 흘리는 눈물의 성분 차이를 연구했다.</li><li>감정에 의한 눈물과 양파를 썰 때 나는 눈물 비교</li><li>슬픔의 눈물에 더 많은 단백질(protein)이 포함됨</li><li>핵심 키워드: 화학적 구성(chemical makeup)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03스트레스 호르몬의 배출</div><ul><li>슬픈 눈물에는 스트레스를 받을 때 분비되는 호르몬이 많이 들어 있다.</li><li>감정 기반의 눈물 속 코르티솔(cortisol) 농도 확인</li><li>코르티솔은 주요 스트레스 호르몬(primary hormone)임</li><li>핵심 키워드: 스트레스 호르몬(stress hormone)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04울음의 생리적 기능</div><ul><li>울음은 몸속의 독소를 배출하여 전반적인 건강을 돕는 역할을 한다.</li><li>체내 독소(toxins)를 물리적으로 배출하는 과정</li><li>울음이 우리 몸의 안녕(well-being)을 증진함</li><li>핵심 키워드: 독소 배출(releasing toxins)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">report</td><td class=\"m\">알리다, 보고하다</td></tr><tr><td class=\"w\">a good cry</td><td class=\"m\">실컷 울기</td></tr><tr><td class=\"w\">at peace</td><td class=\"m\">마음이 평온한</td></tr><tr><td class=\"w\">survey</td><td class=\"m\">설문조사</td></tr><tr><td class=\"w\">as a result of</td><td class=\"m\">~의 결과로</td></tr><tr><td class=\"w\">conduct</td><td class=\"m\">수행하다</td></tr><tr><td class=\"w\">discover</td><td class=\"m\">발견하다</td></tr><tr><td class=\"w\">chemical makeup</td><td class=\"m\">화학적 구성</td></tr><tr><td class=\"w\">contain</td><td class=\"m\">포함하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">protein</td><td class=\"m\">단백질</td></tr><tr><td class=\"w\">raw</td><td class=\"m\">날것의, 가공하지 않은</td></tr><tr><td class=\"w\">propose</td><td class=\"m\">제안하다, 주장하다</td></tr><tr><td class=\"w\">emotion-based</td><td class=\"m\">감정에 기반한</td></tr><tr><td class=\"w\">cortisol</td><td class=\"m\">코르티솔 (스트레스 호르몬)</td></tr><tr><td class=\"w\">primary</td><td class=\"m\">주된, 주요한</td></tr><tr><td class=\"w\">release</td><td class=\"m\">방출하다, 분비하다</td></tr><tr><td class=\"w\">literally</td><td class=\"m\">말 그대로, 정말로</td></tr><tr><td class=\"w\">toxin</td><td class=\"m\">독소</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">종종,</span><span class=\"en\"><b>Often,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 보고한다</span><span class=\"en\"><b>people report that</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">충분히 우는 것이</span><span class=\"en\"><b>a good cry</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 더 기분 좋게 만들 수 있다고</span><span class=\"en\"><b>can <span class=\"grammar-hl\">make them feel better</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 더 평온하게</span><span class=\"en\"><b>and more at peace.</b></span></div></div><div class=\"lec-sent-ko\">종종 사람들은 충분히 우는 것이 그들을 더 기분 좋고 평온하게 만들 수 있다고 말한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실컷 운다는 뜻의 a good cry는 사전적으로는 &#39;좋은 울음&#39;이지만, 여기서는 속이 후련할 정도로 충분히 우는 행위를 의미합니다. 단순히 슬퍼서 우는 것을 넘어, 감정을 해소하는 &#39;카타르시스&#39;의 측면을 강조하려고 이 표현을 썼습니다. 앞 문장은 울음이 정서적 안정에 도움이 된다는 일반적인 믿음을 제시하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make them feel better 5형식(SVOC) 구조: make(사역동사) + them(목적어) + feel(목적보어: 원형부정사) 구조로, 목적어가 ~하게 만들다라는 의미를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">report</td><td class=\"m\">알리다, 보고하다</td></tr><tr><td class=\"w\">a good cry</td><td class=\"m\">실컷 울기</td></tr><tr><td class=\"w\">at peace</td><td class=\"m\">마음이 평온한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 조사에서,</span><span class=\"en\"><b>In one survey,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여성의 85%와</span><span class=\"en\"><b>85% of women</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">남성의 73%가</span><span class=\"en\"><b>and 73% of men</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">덜 슬프다고 느꼈다고 보고했다</span><span class=\"en\"><b>reported <span class=\"grammar-hl\">feeling less sad</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 화가 덜 난다고</span><span class=\"en\"><b><span class=\"grammar-hl\">or angry</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">울고 난 후에</span><span class=\"en\"><b>after crying.</b></span></div></div><div class=\"lec-sent-ko\">한 조사에서 여자의 85%와 남자의 73%가 울고 난 후에 덜 슬프고 화가 덜 났다고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;울음의 효과&#39;에 대한 구체적인 통계적 근거를 제시하여 주장의 신뢰도를 높이고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">feeling less sad or angry (현재분사(분사구문)): reported의 동작 뒤에 이어지는 상태를 설명하며, while they were feeling ~의 의미로 해석됨</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">report</td><td class=\"m\">알리다, 보고하다</td></tr><tr><td class=\"w\">survey</td><td class=\"m\">설문조사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">~의 결과로</span><span class=\"en\"><b>As a result of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이런 종류의 정보의,</span><span class=\"en\"><b>this kind of information,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 과학자가 연구를 수행했다</span><span class=\"en\"><b>a scientist conducted a study</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알아보기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to discover</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">눈물의 화학적 구성을</span><span class=\"en\"><b>the chemical makeup of tears.</b></span></div></div><div class=\"lec-sent-ko\">이런 정보의 결과로, 한 과학자가 눈물의 화학적인 구성을 알아보기 위해 연구를 수행했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시된 울음의 효과(심리적 변화)를 과학적인 원인(화학적 분석)으로 연결하려는 연구의 계기를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to discover (to부정사): 부사적 용법(목적)으로, 연구를 수행한 목적(~하기 위해서)을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">as a result of</td><td class=\"m\">~의 결과로</td></tr><tr><td class=\"w\">conduct</td><td class=\"m\">수행하다</td></tr><tr><td class=\"w\">discover</td><td class=\"m\">발견하다</td></tr><tr><td class=\"w\">chemical makeup</td><td class=\"m\">화학적 구성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 발견했다</span><span class=\"en\"><b>He found that</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">슬픔에 의해 유발된 눈물이</span><span class=\"en\"><b>the tears <span class=\"grammar-hl\">caused by sadness</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 총 단백질을 포함했다는 것을</span><span class=\"en\"><b>contained more total protein</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들보다</span><span class=\"en\"><b>than those</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생양파를 자름으로써 유발된</span><span class=\"en\"><b><span class=\"grammar-hl\">caused by cutting</span> a raw onion.</b></span></div></div><div class=\"lec-sent-ko\">그는 슬픔에 의해 유발된 눈물이 생양파를 자름으로써 유발된 눈물보다 총 양에서 더 많은 단백질을 포함하고 있다는 것을 발견했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 감정에 의한 울음과 외부 자극(양파)에 의한 울음의 성분이 다르다는 점을 비교하며, 앞선 연구의 구체적인 결과를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">caused by sadness (과거분사(형용사)): caused가 앞의 명사 tears를 수식하는 구조로, tears that were caused by sadness(슬픔에 의해 유발된 눈물)의 축약된 관계절 형태임</div><div class=\"lec-gr-item\">caused by cutting (과거분사(형용사)): caused가 앞의 생략된 명사(tears)를 수식하는 구조로, tears that were caused by cutting의 축약된 관계절 형태임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">contain</td><td class=\"m\">포함하다</td></tr><tr><td class=\"w\">protein</td><td class=\"m\">단백질</td></tr><tr><td class=\"w\">raw</td><td class=\"m\">날것의, 가공하지 않은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 제안했다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">proposed that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감정 기반의 눈물이</span><span class=\"en\"><b>the emotion-based tears</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">높은 수준의 코르티솔을 포함했다고,</span><span class=\"en\"><b>contained high levels of cortisol,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 주요 호르몬이다</span><span class=\"en\"><b><span class=\"grammar-hl\">which is the primary hormone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스트레스 상황 동안 분비되는</span><span class=\"en\"><b><span class=\"grammar-hl\">released during stressful situations</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 감정에 근거한 눈물은 높은 정도의 코르티솔을 포함했다고 설명했는데, 이것은 스트레스 상황에서 분비되는 주요한 호르몬이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;제안하다&#39;인 proposed는 여기서는 단순히 의견을 내는 것이 아니라, 연구 결과를 바탕으로 과학적인 가설을 &#39;제시(주장)&#39;한다는 뜻입니다. 4번 문장에서 언급된 단백질 성분의 구체적인 종류(코르티솔)를 밝힘으로써 울음의 생물학적 기능을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">proposed that 당위성 that절: propose(제안하다)는 당위성을 나타내는 동사이며, that절 내의 contained가 과거형으로 쓰인 경우 문맥상 사실에 대한 보고로 해석되나, 당위적 제안일 경우 should가 생략된 동사원형이 올 수 있는 구조임</div><div class=\"lec-gr-item\">released during stressful situations (과거분사(형용사)): released가 앞의 명사 hormone을 수식하며, hormone that is released ~의 축약된 관계절 구조임</div><div class=\"lec-gr-item\">which is the primary hormone (관계대명사): which는 앞의 cortisol을 선행사로 받는 주격 관계대명사이며, 뒤에 is(동사)가 바로 이어지는 절 구조를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">contain</td><td class=\"m\">포함하다</td></tr><tr><td class=\"w\">propose</td><td class=\"m\">제안하다, 주장하다</td></tr><tr><td class=\"w\">emotion-based</td><td class=\"m\">감정에 기반한</td></tr><tr><td class=\"w\">cortisol</td><td class=\"m\">코르티솔 (스트레스 호르몬)</td></tr><tr><td class=\"w\">primary</td><td class=\"m\">주된, 주요한</td></tr><tr><td class=\"w\">release</td><td class=\"m\">방출하다, 분비하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 시사한다</span><span class=\"en\"><b>This suggests that</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 말 그대로 독소를 배출하고 있을지도 모른다는 것을</span><span class=\"en\"><b>we may be literally <span class=\"grammar-hl\">releasing toxins</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 몸에서</span><span class=\"en\"><b>from our system</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 울 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when we cry</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 울음 그 자체가</span><span class=\"en\"><b>and that <span class=\"grammar-hl\">crying itself</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도울지도 모른다는 것을</span><span class=\"en\"><b>may support</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 전반적인 안녕을</span><span class=\"en\"><b>our overall well-being.</b></span></div></div><div class=\"lec-sent-ko\">이 연구 결과는, 우리가 울 때 사실상 우리의 몸에서 독소를 배출하는 것이며, 울음 그 자체가 우리의 전반적인 행복을 높여줄 수도 있다는 것을 시사한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> literally는 사전적으로 &#39;문자 그대로&#39;라는 뜻인데, 여기서는 비유적 표현이 아니라 실제로 몸속의 화학 물질을 밖으로 내보낸다는 사실을 강조하기 위해 사용되었습니다. 전체 글의 결론으로서, 울음이 단순한 감정 표현을 넘어 신체적 해독과 건강 유지에 기여한다는 점을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">releasing toxins (현재진행): be동사(are) + releasing(-ing) 구조로, 우리가 독소를 방출하고 있는 중이라는 동작을 나타냄</div><div class=\"lec-gr-item\">when we cry (관계부사): 시간을 나타내는 접속사 when이 절을 이끌어 cry(울다)라는 상황이 발생하는 때를 설명함</div><div class=\"lec-gr-item\">crying itself (동명사): 문장에서 주어 역할을 하는 명사적 용법으로, &#39;우는 것&#39;이라는 행위를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">literally</td><td class=\"m\">말 그대로, 정말로</td></tr><tr><td class=\"w\">toxin</td><td class=\"m\">독소</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들은 울고 나면 기분이 좋아진다고 느낀다.</li><li>과학자들은 실제로 감정에 의한 눈물에 스트레스 호르몬인 코르티솔이 더 많다는 것을 발견했다.</li><li>눈물을 통해 스트레스 물질이 몸 밖으로 배출될 수 있다.</li><li>결론적으로 울음은 신체적, 정신적 건강을 유지하는 데 도움을 줄 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Crying reduces negative emotions because it helps release stress hormones from the body, and this physical process supports our mental well-being.</div>\n              <div class=\"lec-final-sum-ko\">눈물은 스트레스 호르몬을 몸 밖으로 배출하도록 도와 부정적인 감정을 줄여주며, 이러한 신체적 과정은 우리의 정신 건강을 돕는다.</div></div></div>"],"segs":[[{"audio":"./passage2_audio/1.mp3","hl":null}],[{"audio":"./passage2_audio/2.mp3","hl":null}],[{"audio":"./passage2_audio/3.mp3","hl":null},{"audio":"./passage2_audio/4.mp3","hl":"stage-0"},{"audio":"./passage2_audio/5.mp3","hl":"stage-1"},{"audio":"./passage2_audio/6.mp3","hl":"stage-2"},{"audio":"./passage2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage2_audio/8.mp3","hl":null}],[{"audio":"./passage2_audio/9.mp3","hl":"main"},{"audio":"./passage2_audio/10.mp3","hl":"meaning"},{"audio":"./passage2_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/12.mp3","hl":"main"},{"audio":"./passage2_audio/13.mp3","hl":"meaning"},{"audio":"./passage2_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/15.mp3","hl":"main"},{"audio":"./passage2_audio/16.mp3","hl":"meaning"},{"audio":"./passage2_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/18.mp3","hl":"main"},{"audio":"./passage2_audio/19.mp3","hl":"meaning"},{"audio":"./passage2_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/21.mp3","hl":"main"},{"audio":"./passage2_audio/22.mp3","hl":"meaning"},{"audio":"./passage2_audio/23.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/24.mp3","hl":"main"},{"audio":"./passage2_audio/25.mp3","hl":"meaning"},{"audio":"./passage2_audio/26.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/27.mp3","hl":null}]
