<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4강 reading2 — AI 강의</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"4강 reading2","audioDir":"passage2_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">4강\u003cbr>2번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Why a Good Cry Makes Us Feel Better: The Chemistry of Emotional Tears\u003c/h1>\u003ch2>왜 충분히 울면 기분이 나아질까: 감정의 눈물의 화학\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>울음이 사람을 더 편안하게 만든다는 보고와 조사 결과에서 출발해, 한 과학자가 눈물의 화학적 구성을 연구한 결과 감정에 근거한 눈물에는 스트레스 호르몬인 \u003cb class=\"key\">코르티솔\u003c/b>과 \u003cb class=\"key\">단백질\u003c/b>이 더 많이 들어 있음이 밝혀졌다. 이는 우리가 울 때 몸에서 \u003cb class=\"key\">독소\u003c/b>를 배출하며 울음 자체가 전반적인 행복을 높여 줄 수 있음을 시사한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Crying may literally release toxins such as cortisol from our system, and crying itself may support our overall well-being.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 눈물과 울음에 관한 아주 흥미로운 이야기예요. 좋은 울음이 사람을 더 기분 좋고 평온하게 만든다는 보고에서 시작해서, 한 과학자가 눈물의 화학적 구성을 분석한 연구로 이어지는 글이죠. 결국 울음이 우리 몸에서 독소를 배출하고 전반적인 행복을 높여 줄 수 있다는 것이 이 글의 요지예요. 자, 그럼 차근차근 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">눈물은 생기는 원인에 따라 크게 세 가지로 나뉩니다. 눈을 촉촉하게 유지해 주는 기저 눈물(basal tears), 양파나 먼지 같은 자극 때문에 나는 반사 눈물(reflex tears), 그리고 슬픔이나 분노 같은 감정에서 나오는 정서적 눈물(emotional tears)이 그것입니다. 이 가운데 감정적 눈물에는 스트레스 호르몬인 \u003cb class=\"key\">코르티솔\u003c/b>(cortisol)과 단백질이 더 많이 들어 있다고 알려져 있습니다. 코르티솔은 부신(adrenal gland)에서 분비되어 스트레스 상황에서 몸을 긴장하게 만드는 주요한 호르몬입니다. 마치 보일러가 압력이 너무 높아지면 증기를 밖으로 빼내야 하듯, 우리 몸도 쌓인 스트레스 물질을 눈물이라는 통로로 내보내는 셈입니다. 그래서 '한바탕 울고 나면 개운하다'는 말은 단순한 기분 탓이 아니라 \u003cb class=\"key\">독소\u003c/b> 배출과 관련된 생리적 현상일 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 읽기 전에 배경지식을 하나 챙겨 볼게요. 눈물은 생기는 원인에 따라 크게 세 가지로 나뉘는데, 눈을 촉촉하게 유지하는 기저 눈물, 양파나 먼지 같은 자극 때문에 나는 반사 눈물, 그리고 슬픔이나 분노 같은 감정에서 나오는 정서적 눈물이에요. 이 가운데 감정적 눈물에는 스트레스 호르몬인 코르티솔과 단백질이 더 많이 들어 있다고 알려져 있죠. 코르티솔은 부신에서 분비되어 스트레스 상황에서 몸을 긴장하게 만드는 주요한 호르몬이에요. 보일러에 압력이 너무 높아지면 증기를 밖으로 빼내야 하듯이, 우리 몸도 쌓인 스트레스 물질을 눈물이라는 통로로 내보내는 셈이에요. 그래서 한바탕 울고 나면 개운하다는 말은 단순한 기분 탓이 아니라 독소 배출과 관련된 생리적 현상일 수 있다는 점, 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>울면 나아진다\u003csmall>통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>사람들은 흔히 충분히 우는 것이 자신을 더 기분 좋고 평온하게 만든다고 \u003cb class=\"key\">보고\u003c/b>한다. 실제 조사에서도 여성의 85%와 남성의 73%가 울고 난 후 덜 슬프고 화가 덜 났다고 답했다. 이 단계는 울음의 효과에 대한 \u003cb class=\"key\">경험적 \u003c/b>\u003cb class=\"key\">통념\u003c/b>을 먼저 제시한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>과학자의 연구\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>이런 정보의 결과로 한 과학자가 눈물의 \u003cb class=\"key\">화학적 \u003c/b>\u003cb class=\"key\">구성\u003c/b>을 알아보기 위해 연구를 수행했다. 단순히 통념을 확인하려는 것이 아니라, 눈물 자체의 성분을 직접 분석해 보려는 \u003cb class=\"key\">전환\u003c/b>이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>단백질과 코르티솔\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>그는 슬픔에 의해 유발된 눈물이 생양파를 자름으로써 유발된 눈물보다 총 \u003cb class=\"key\">단백질\u003c/b>을 더 많이 포함하고 있음을 발견했다. 또 감정에 근거한 눈물에는 스트레스 상황에서 분비되는 주요한 호르몬인 \u003cb class=\"key\">코르티솔\u003c/b>이 높은 정도로 들어 있다고 설명했다. 이는 감정의 눈물이 \u003cb class=\"key\">스트레스\u003c/b>와 관련된 성분을 품고 있음을 보여 주는 근거다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>독소 배출과 행복\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>이 연구 결과는 우리가 울 때 사실상 우리 몸에서 \u003cb class=\"key\">독소\u003c/b>를 배출하는 것일 수 있으며, 울음 자체가 전반적인 \u003cb class=\"key\">행복\u003c/b>을 높여 줄 수도 있다는 것을 시사한다. 즉 눈물은 단순한 감정의 표출이 아니라 몸을 \u003cb class=\"key\">정화\u003c/b>하는 통로일 수 있다는 주장이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 통념에서 연구, 그리고 결론까지 네 단계로 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 문장과 두 번째 문장을 볼게요. 사람들은 종종 충분히 우는 것이 자신을 더 기분 좋고 평온하게 만든다고 보고해요. 실제로 한 조사에서 여성의 팔십오 퍼센트와 남성의 칠십삼 퍼센트가 울고 난 후에 덜 슬프고 화가 덜 났다고 답했죠. 여기까지는 우리가 흔히 경험하는 통념을 확인해 주는 단계예요.","hl":"f0"},{"n":5,"text":"그다음 세 번째 문장에서 분위기가 바뀝니다. 이런 정보의 결과로 한 과학자가 눈물의 화학적 구성을 알아보기 위해 연구를 수행했어요. 그냥 궁금해서가 아니라, 왜 울면 기분이 나아지는지를 눈물 성분 자체로 밝혀 보려는 시도였던 거죠.","hl":"f1"},{"n":6,"text":"네 번째와 다섯 번째 문장은 이 글의 핵심 근거예요. 그는 슬픔에 의해 유발된 눈물이 생양파를 자름으로써 유발된 눈물보다 총 단백질을 더 많이 포함하고 있다는 것을 발견했어요. 그리고 감정에 근거한 눈물에는 코르티솔이 높은 정도로 들어 있다고 설명했죠. 코르티솔은 스트레스 상황에서 분비되는 주요한 호르몬이라는 점도 꼭 챙겨 주세요.","hl":"f2"},{"n":7,"text":"마지막 문장이 바로 이 글의 주제문이에요. 이 연구 결과는 우리가 울 때 사실상 우리 몸에서 독소를 배출하는 것이며, 울음 그 자체가 우리의 전반적인 행복을 높여 줄 수도 있다는 것을 시사합니다. 눈물이 단순한 감정의 표출이 아니라 몸을 정화하는 통로일 수 있다는 주장인 거죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 사람들의 경험과 조사 결과라는 \u003cb class=\"key\">통념\u003c/b>으로 시작해, 과학자의 연구라는 \u003cb class=\"key\">근거\u003c/b>를 제시한 뒤 마지막에 주장을 내놓는다. 화학적 구성 분석, 단백질 비교, 코르티솔 제안이 모두 마지막 문장의 결론을 뒷받침하는 근거로 배치되어 있다. 결론에 해당하는 \u003cb class=\"key\">주제문\u003c/b>이 맨 뒤에 오므로 미괄식이며, This suggests that이 그 표지다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Often (1)\u003c/b>\u003cspan>일반적 통념 제시\u003c/span>\u003cb>As a result of this kind of information (3)\u003c/b>\u003cspan>인과적 전환\u003c/span>\u003cb>He found that (4)\u003c/b>\u003cspan>근거 제시\u003c/span>\u003cb>He proposed that (5)\u003c/b>\u003cspan>해석·설명 제시\u003c/span>\u003cb>This suggests that (6)\u003c/b>\u003cspan>결론·시사\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">feel better and more at peace\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">feeling less sad or angry\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the chemical makeup of tears\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the tears caused by sadness\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">support our overall well-being\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>감정의 눈물\u003c/th>\u003cth>양파에 의한 눈물\u003c/th>\u003c/tr>\u003ctr>\u003ctd>총 단백질을 더 많이 포함\u003c/td>\u003ctd>총 단백질이 상대적으로 적음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>코르티솔 수준이 높다고 제안됨\u003c/td>\u003ctd>스트레스 호르몬과 무관한 자극성 눈물\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거의 전개 방식으로 쓰였어요. 통념과 조사 결과를 먼저 보여 주고, 과학자의 연구라는 근거를 거쳐 마지막에 주장을 내놓는 구조죠. 그래서 결론이 맨 뒤에 오는 미괄식 구조입니다. 미괄식에서는 마지막 문장의 suggest 표현을 특히 눈여겨봐야 하고, 앞의 내용이 모두 그 결론을 받쳐 주는 근거라는 점을 기억해야 해요.","hl":"ty"},{"n":9,"text":"신호어도 함께 짚어 볼게요. 첫 번째 문장의 Often은 일반적인 통념을 꺼내는 신호이고, 세 번째 문장의 As a result of this kind of information은 앞의 조사 결과가 연구로 이어지는 인과의 연결고리예요. 네 번째 문장의 He found that은 근거를 제시하는 표현이고, 다섯 번째 문장의 He proposed that은 해석을 더하는 표현이죠. 마지막 문장의 This suggests that은 결론으로 넘어가는 결정적인 신호입니다. 재진술도 눈에 띄는데, feel better and more at peace가 less sad or angry로, 다시 support our overall well-being으로 이어지면서 같은 개념을 계속 바꿔 말하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>report\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(…라고) 보고하다, 말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at peace\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>평온한, 마음이 편안한\u003c/span>\u003c/div>\u003cdiv>\u003cb>survey\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조사, 설문 조사\u003c/span>\u003c/div>\u003cdiv>\u003cb>as a result of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 결과로\u003c/span>\u003c/div>\u003cdiv>\u003cb>conduct\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(연구를) 수행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c em\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(신체) 계, 몸\u003c/span>\u003c/div>\u003cdiv>\u003cb>overall\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전반적인, 전체적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>well-being\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행복, 안녕, 복지\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어 몇 개만 짚고 갈게요. contain은 포함하다, propose는 제안하다라는 뜻이고, release는 방출하다, literally는 문자 그대로 혹은 사실상이라는 의미로 쓰였어요. well-being은 행복, overall은 전반적이라는 뜻으로 마지막 문장의 의미를 잡아 주는 열쇠 단어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">contain\u003c/b>\u003cspan class=\"m\">포함하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">include\u003c/span>\u003cspan class=\"s\">hold\u003c/span>\u003cspan class=\"s\">comprise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003cspan class=\"a\">lack\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discover\u003c/b>\u003cspan class=\"m\">발견하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">find\u003c/span>\u003cspan class=\"s\">detect\u003c/span>\u003cspan class=\"s\">uncover\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">propose\u003c/b>\u003cspan class=\"m\">제안하다, 주장하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">suggest\u003c/span>\u003cspan class=\"s\">claim\u003c/span>\u003cspan class=\"s\">argue\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">primary\u003c/b>\u003cspan class=\"m\">주요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">main\u003c/span>\u003cspan class=\"s\">chief\u003c/span>\u003cspan class=\"s\">principal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">secondary\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">release\u003c/b>\u003cspan class=\"m\">방출하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discharge\u003c/span>\u003cspan class=\"s\">emit\u003c/span>\u003cspan class=\"s\">give off\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">absorb\u003c/span>\u003cspan class=\"a\">retain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suggest\u003c/b>\u003cspan class=\"m\">시사하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">indicate\u003c/span>\u003cspan class=\"s\">imply\u003c/span>\u003cspan class=\"s\">hint\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stressful\u003c/b>\u003cspan class=\"m\">스트레스를 주는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tense\u003c/span>\u003cspan class=\"s\">demanding\u003c/span>\u003cspan class=\"s\">straining\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relaxing\u003c/span>\u003cspan class=\"a\">calming\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">overall\u003c/b>\u003cspan class=\"m\">전반적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">general\u003c/span>\u003cspan class=\"s\">comprehensive\u003c/span>\u003cspan class=\"s\">whole\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partial\u003c/span>\u003cspan class=\"a\">specific\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘의 동의어와 반의어도 정리해 볼게요. contain은 include, hold와 가깝고 exclude와는 반대예요. discover는 find, detect와 비슷하고 overlook과는 반대이고, propose는 suggest, claim과 가깝지만 deny, reject와는 반대됩니다. primary는 main, chief와 같은 뜻이고 secondary, minor와는 반대죠. release는 discharge, emit과 비슷하고 absorb, retain과 반대이며, suggest는 indicate, imply와 가깝습니다. overall은 general, comprehensive와 비슷하고 partial, specific과 반대라는 점까지 묶어서 외워 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종\u003c/span>\u003cspan class=\"en\">Often,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 말한다\u003c/span>\u003cspan class=\"en\">people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">report \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충분히 우는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">cry \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 ~하게 만들 수 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 기분 좋고 더 평온하게 느끼도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">peace\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">종종 사람들은 충분히 우는 것이 그들을 더 기분 좋고 평온하게 만들 수 있다고 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 도입에서 '충분히 울면 기분이 나아진다'는 \u003cb class=\"key\">일반적 \u003c/b>\u003cb class=\"key\">인식\u003c/b>을 먼저 꺼내 놓는 역할을 해요. a good cry는 '실컷 우는 것'을 뜻하는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이고, at peace는 '평온한, 마음이 편안한'이라는 뜻이에요. make them feel better는 \u003cb class=\"key\">사역동사\u003c/b> make가 목적어 뒤에 동사원형 feel을 데려와 '그들이 더 기분 좋게 느끼도록 만들다'가 된 구조예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : report + [that + 주어 + 동사 ~ (명사절/목적어)] : \"충분히 우는 것이 그들을 더 기분 좋고 평온하게 만들 수 있다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 사역동사(make + 목적어 + 동사원형)\u003c/span> : make + [목적어] + [동사원형(feel)] : \"그들이 더 기분 좋게 느끼도록 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조(비교급 and 비교급)\u003c/span> : [비교급] + and + [비교급] : \"더 기분 좋고 더 평온하게 느끼다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Often, 종종. people report, 사람들은 말한다. that a good cry, 충분히 우는 것이. can make them, 그들을 ~하게 만들 수 있다고. feel better and more at peace, 더 기분 좋고 더 평온하게 느끼도록. 이 문장 전체를 해석하면, 종종 사람들은 충분히 우는 것이 그들을 더 기분 좋고 평온하게 만들 수 있다고 말한다.","hl":"m"},{"n":13,"text":"이 문장은 글의 도입에서 충분히 울면 기분이 나아진다는 일반적 인식을 먼저 꺼내 놓는 역할을 해요. a good cry는 실컷 우는 것을 뜻하는 관용 표현이고, at peace는 마음이 평온하다는 뜻이에요. 또 make가 사역동사로 쓰여서 them feel better, 즉 그들이 더 기분 좋게 느끼도록 만든다는 의미를 만들어 냅니다.","hl":"mn"},{"n":14,"text":"첫 번째로 report 뒤에 that절이 와서 목적어 역할을 하고 있어요. 이때 that은 '~라고'로 해석되는 접속사고요. 두 번째로 make는 목적어 them 뒤에 동사원형 feel을 데려오는 사역동사라서 '~하게 만들다'로 해석해요. 목적격 보어 자리에 to부정사가 아니라 동사원형이 온다는 점을 꼭 기억하세요. 세 번째로 better and more at peace는 비교급 두 개가 and로 나란히 이어진 병렬 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 조사에서\u003c/span>\u003cspan class=\"en\">In one survey,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여자의 85%와 남자의 73%가\u003c/span>\u003cspan class=\"en\">85% of women and 73% of men\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">느꼈다고 말했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">reported \u003c/span>\u003cspan class=\"tgt\">feeling\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">덜 슬프거나 덜 화가 난 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">sad \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">angry\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">울고 난 후에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">crying\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 조사에서 여자의 85%와 남자의 73%가 울고 난 후에 덜 슬프고 화가 덜 났다고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 '우는 것이 도움이 된다'는 일반적인 믿음에 구체적인 숫자를 붙여 주는 \u003cb class=\"key\">근거\u003c/b> 문장이에요. 여자의 85%와 남자의 73%라는 수치를 제시해서 주장을 뒷받침하죠. reported feeling은 report 뒤에 \u003cb class=\"key\">동명사\u003c/b>가 목적어로 온 구조로, 응답자들이 실제로 '느꼈다고 말한' 내용임을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 목적어(report + -ing)\u003c/span> : report + [동명사(~ing) (목적어)] : \"(울고 난 후에) 느꼈다고 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 less + 형용사\u003c/span> : less + [형용사] (덜 ~한) : \"덜 슬프거나 덜 화난\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : after + [동명사(~ing)] (~한 후에) : \"울고 난 후에\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"In one survey, 한 조사에서. 85% of women and 73% of men, 여자의 85%와 남자의 73%가. reported feeling, 느꼈다고 말했다. less sad or angry, 덜 슬프거나 덜 화가 난 것을. after crying, 울고 난 후에. 이 문장 전체를 해석하면, 한 조사에서 여자의 85%와 남자의 73%가 울고 난 후에 덜 슬프고 화가 덜 났다고 말했다.","hl":"m"},{"n":16,"text":"이 문장은 앞에서 말한 일반적인 믿음에 구체적인 숫자를 붙여 주는 근거 문장이에요. 여자의 여든다섯 퍼센트, 남자의 일흔세 퍼센트라는 수치를 제시해서 우는 것이 실제로 도움이 된다는 주장을 뒷받침하죠. reported feeling은 느꼈다고 말했다는 뜻으로, 조사에서 응답자들이 직접 보고한 내용임을 보여 줍니다.","hl":"mn"},{"n":17,"text":"첫 번째로 reported feeling에서 feeling은 동명사 목적어예요. report가 동명사를 목적어로 받아서 '~했다고 말했다'로 해석된다는 점을 기억하세요. 두 번째로 less sad or angry에서 less는 비교급 표현이고, sad와 angry가 or로 병렬로 이어져요. 세 번째로 after 뒤에는 동명사 crying이 와서 '울고 난 후에'라는 뜻을 만들어요. 전치사 뒤에는 동사원형이 아니라 동명사가 온다는 것도 함께 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 정보의 결과로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">result \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">information\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 과학자가 연구를 수행했다\u003c/span>\u003cspan class=\"en\">a scientist conducted a study\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알아보기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">discover \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">눈물의 화학적인 구성을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">chemical \u003c/span>\u003cspan class=\"tgt\">makeup \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">tears\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 정보의 결과로, 한 과학자가 눈물의 화학적인 구성을 알아보기 위해 연구를 수행했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞의 조사 결과가 하나의 과학적 연구로 넘어가는 \u003cb class=\"key\">인과관계\u003c/b>를 보여 주는 전환점이에요. as a result of는 '~의 결과로'라는 뜻으로 앞 내용이 원인임을 밝혀 주죠. to discover는 연구를 수행한 \u003cb class=\"key\">목적\u003c/b>을 제시해서, 사람들의 경험담이 눈물의 화학적 구성에 대한 탐구로 이어지는 다리 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(as a result of)\u003c/span> : As a result of + [명사(구)] (~의 결과로) : \"이런 종류의 정보의 결과로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주어 + 동사] + [to + 동사원형 ~ (to부정사구/목적)] : \"눈물의 화학적인 구성을 알아보기 위해\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"As a result of this kind of information, 이런 정보의 결과로. a scientist conducted a study, 한 과학자가 연구를 수행했다. to discover, 알아보기 위해. the chemical makeup of tears, 눈물의 화학적인 구성을. 이 문장 전체를 해석하면, 이런 정보의 결과로, 한 과학자가 눈물의 화학적인 구성을 알아보기 위해 연구를 수행했다.","hl":"m"},{"n":19,"text":"이 문장은 앞의 조사 결과가 하나의 과학적 연구로 이어지는 인과관계를 보여 주는 전환점이에요. as a result of가 앞 내용이 원인임을 분명히 밝혀 주고, to discover가 연구를 수행한 목적을 알려 주죠. 즉 사람들의 경험담이 눈물의 화학적 구성이라는 과학적 탐구로 넘어가는 다리 역할을 하는 문장이에요.","hl":"mn"},{"n":20,"text":"첫 번째로 as a result of는 '~의 결과로'라는 뜻의 전치사구예요. 그래서 앞 문장의 내용이 원인이 된다는 걸 알려 주죠. 그리고 this kind of information은 앞에서 나온 조사 결과들을 묶어 가리키는 지시어 표현이에요. 두 번째로 to discover는 '알아보기 위해'라는 목적을 나타내는 to부정사의 부사적 용법이에요. 앞에서 말한 연구를 수행했다는 행위의 목적을 뒤에서 설명해 주는 구조라는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 발견했다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">슬픔에 의해 유발된 눈물이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> the tears \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">caused \u003 tained more total protein, 더 많은 총 단백질을 포함하고 있다는 것을. than those caused by cutting a raw onion, 생양파를 자름으로써 유발된 눈물보다. 이 문장 전체를 해석하면, 그는 슬픔에 의해 유발된 눈물이 생양파를 자름으로써 유발된 눈물보다 총 양에서 더 많은 단백질을 포함하고 있다는 것을 발견했다.","hl":"m"},{"n":22,"text":"이 문장은 연구 결과를 구체적으로 알려 주는 대목이에요. 슬픔의 눈물과 양파 눈물을 성분으로 비교하면서, 감정이 눈물의 화학 성분까지 바꾼다는 걸 보여 주죠. 뒤에 나온 those가 앞의 the tears를 그대로 받는다는 점도 꼭 기억해 두세요.","hl":"mn"},{"n":23,"text":"어법 포인트를 순서대로 짚어 볼게요. 첫 번째, found that에서 that은 동사 found의 목적어로 명사절을 이끄는 접속사예요. 두 번째, the tears caused by sadness에서 caused by는 과거분사구로 앞의 명사를 뒤에서 꾸미고, 수동의 의미를 담고 있어요. 세 번째, those는 앞에 나온 the tears를 반복하지 않으려고 쓴 대명사이고, 이게 바로 반복 회피의 장치예요. 네 번째, by cutting에서 cutting은 전치사 by 뒤에 온 동명사로, 생양파를 자르는 수단을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 설명했다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">proposed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감정에 근거한 눈물은 높은 정도의 코르티솔을 포함했다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> the emotion-based tears contained high levels of cortisol,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 주요한 호르몬인데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">primary \u003c/span>\u003cspan class=\"tgt\">hormone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스트레스 상황에서 분비되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">released \u003c/span>\u003cspan class=\"tgt\">during \u003c/span>\u003cspan class=\"tgt\">stressful \u003c/span>\u003cspan class=\"tgt\">situations\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 감정에 근거한 눈물은 높은 정도의 코르티솔을 포함했다고 설명했는데, 이것은 스트레스 상황에서 분비되는 주요한 호르몬이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 연구자가 내놓은 해석을 담고 있어요. 감정의 눈물에는 \u003cb class=\"key\">코르티솔\u003c/b>이 많다는 것인데, 코르티솔은 \u003cb class=\"key\">스트레스\u003c/b> 상황에서 분비되는 대표 호르몬이라서 왜 울면 기분이 나아지는지 설명하는 \u003cb class=\"key\">근거\u003c/b>가 되어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that(목적어절)\u003c/span> : propose + [that + 주어 + 동사 ~ (명사절/목적어)] : \"~라고 설명했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">계속적 관계대명사 which\u003c/span> : [명사(cortisol)], which + 동사 ~ (계속적 관계대명사) : \"이것은 주요한 호르몬인데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치 수식\u003c/span> : [명사(the primary hormone)] + [released during ~ (과거분사구/후치수식)] : \"스트레스 상황에서 분비되는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"He proposed, 그는 설명했다. that the emotion-based tears contained high levels of cortisol, 감정에 근거한 눈물은 높은 정도의 코르티솔을 포함했다고. which is the primary hormone, 이것은 주요한 호르몬인데. released during stressful situations, 스트레스 상황에서 분비되는. 이 문장 전체를 해석하면, 그는 감정에 근거한 눈물은 높은 정도의 코르티솔을 포함했다고 설명했는데, 이것은 스트레스 상황에서 분비되는 주요한 호르몬이다.","hl":"m"},{"n":25,"text":"이 문장은 연구자가 내놓은 해석을 담고 있어요. 감정의 눈물에 코르티솔이 많다고 보는 건데, 코르티솔은 스트레스 상황에서 나오는 대표 호르몬이라서 왜 울면 기분이 나아지는지 설명하는 근거가 되어 줍니다.","hl":"mn"},{"n":26,"text":"어법 포인트 세 가지예요. 첫 번째, proposed that에서 that은 propose의 목적어로 명사절을 이끄는 접속사예요. 두 번째, 쉼표 뒤의 which는 바로 앞의 cortisol을 받는 계속적 관계대명사로, '그것은 ~인데'라고 이어서 설명해 줍니다. 세 번째, the primary hormone released에서 released는 과거분사구로 앞의 명사를 뒤에서 꾸미고, '분비되는'이라는 수동의 뜻을 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 연구 결과는 시사한다\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">suggests \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 사실상 우리의 몸에서 독소를 배출하고 있는 것일 수도 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">literally \u003c/span>\u003cspan class=\"tgt\">releasing\u003c/span> toxins from our system\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 울 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">cry\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 울음 그 자체가 우리의 전반적인 행복을 높여줄 수도 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">crying \u003c/span>\u003cspan class=\"tgt\">itself\u003c/span> may support our overall well-being.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 연구 결과는, 우리가 울 때 사실상 우리의 몸에서 독소를 배출하는 것이며, 울음 그 자체가 우리의 전반적인 행복을 높여줄 수도 있다는 것을 시사한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체를 정리하는 결론이자 \u003cb class=\"key\">주제문\u003c/b>이에요. 울음이 몸속 \u003cb class=\"key\">독소\u003c/b>를 실제로 내보내고, 나아가 \u003cb class=\"key\">전반적인 \u003c/b>\u003cb class=\"key\">행복\u003c/b>까지 높여 줄 수 있다고 말하죠. 앞의 연구 결과가 울음의 긍정적 \u003cb class=\"key\">효과\u003c/b>로 이어진다는 흐름을 잡으면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that(목적어절)\u003c/span> : suggest + [that + 주어 + 동사 ~ (명사절/목적어)] : \"~라는 것을 시사한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 may + 진행형\u003c/span> : may + [be + -ing (진행형)] : \"배출하고 있는 것일 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 when(시간 부사절)\u003c/span> : when + 주어 + 동사 (시간 부사절) : \"우리가 울 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">that절의 병렬과 재귀대명사 강조\u003c/span> : [that절] + and + [that절] (병렬) / [재귀대명사 itself] : \"그리고 울음 그 자체가\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This suggests, 이 연구 결과는 시사한다. that we may be literally releasing toxins from our system, 우리가 사실상 우리의 몸에서 독소를 배출하고 있는 것일 수도 있다는 것을. when we cry, 우리가 울 때. and that crying itself may support our overall well-being, 그리고 울음 그 자체가 우리의 전반적인 행복을 높여줄 수도 있다는 것을. 이 문장 전체를 해석하면, 이 연구 결과는, 우리가 울 때 사실상 우리의 몸에서 독소를 배출하는 것이며, 울음 그 자체가 우리의 전반적인 행복을 높여줄 수도 있다는 것을 시사한다.","hl":"m"},{"n":28,"text":"이 문장은 글 전체를 정리하는 결론이자 주제문이에요. 울음이 몸속 독소를 실제로 내보내고, 나아가 전반적인 행복까지 높여 줄 수 있다고 말하죠. 앞에서 본 연구 결과가 울음의 긍정적인 효과로 이어진다는 흐름으로 읽으면 됩니다.","hl":"mn"},{"n":29,"text":"어법 포인트를 짚어 볼게요. 첫 번째, suggests that에서 that은 suggest의 목적어로 명사절을 이끄는 접속사예요. 두 번째, may be literally releasing은 조동사 may에 진행형이 붙어서 '배출하고 있는 것일 수도 있다'는 추측을 나타냅니다. 세 번째, when we cry에서 when은 시간 부사절을 이끄는 접속사예요. 네 번째, and 뒤에 that절이 다시 나오면서 두 개의 that절이 병렬 구조를 이루고, itself는 '그 자체'라는 뜻의 재귀대명사로 강조를 담당합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사람들은 충분히 울면 더 기분 좋고 \u003cb class=\"key\">평온\u003c/b>해진다고 보고하며, 실제 조사에서도 울고 난 뒤 덜 슬프고 화가 덜 났다는 응답이 많았다.\u003c/li>\u003cli>한 과학자는 이런 정보의 결과로 눈물의 \u003cb class=\"key\">화학적 \u003c/b>\u003cb class=\"key\">구성\u003c/b>을 알아보기 위한 연구를 수행했다.\u003c/li>\u003cli>그는 슬픔에 의한 눈물이 양파에 의한 눈물보다 \u003cb class=\"key\">단백질\u003c/b>을 더 많이 포함하고, 감정에 근거한 눈물에는 \u003cb class=\"key\">코르티솔\u003c/b>이 높은 정도로 들어 있다고 설명했다.\u003c/li>\u003cli>이는 우리가 울 때 사실상 몸에서 \u003cb class=\"key\">독소\u003c/b>를 배출하는 것이며 울음 자체가 전반적인 \u003cb class=\"key\">행복\u003c/b>을 높여 줄 수도 있음을 시사한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Crying may literally release toxins such as cortisol from our system, and crying itself may support our overall well-being.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">울음이 사람을 더 편안하게 만든다는 보고와 조사 결과에서 출발해, 한 과학자가 눈물의 화학적 구성을 연구한 결과 감정에 근거한 눈물에는 스트레스 호르몬인 \u003cb class=\"key\">코르티솔\u003c/b>과 \u003cb class=\"key\">단백질\u003c/b>이 더 많이 들어 있음이 밝혀졌다. 이는 우리가 울 때 몸에서 \u003cb class=\"key\">독소\u003c/b>를 배출하며 울음 자체가 전반적인 행복을 높여 줄 수 있음을 시사한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 지문은 눈물이 그냥 감정의 표출이 아니라 몸속 독소를 내보내는 통로일 수 있다는 이야기였어요. 감정의 눈물과 양파 눈물을 단백질과 코르티솔로 비교한 부분, 그리고 마지막 문장의 suggest를 꼭 기억해 주세요. 여러분도 마음이 힘들 때 한 번쯤 충분히 우는 것이 몸과 마음에 도움이 될 수 있겠죠. 오늘 수업 여기까지입니다, 수고했어요.","hl":null}]}]});</script></body></html>
