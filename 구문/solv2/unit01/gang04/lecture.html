  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

lecturePlayer(document.getElementById("app"),{"brand":"v-ed의 기본 역할","title":"v-ed의 기본 역할, 과거분사 파헤치기","audioDir":"lecture_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">04강 v-ed의 기본 역할 (과거분사)\u003c/div>\u003ch1>v-ed의 기본 역할, 과거분사 파헤치기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>동사에 ed가 붙은 과거분사의 형용사적 역할과 보어 역할을 정확히 이해하고 문장에 적용한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕 중학생 여러분, 오늘 선생님이랑 같이 공부할 내용은 동사 뒤에 ed가 붙어서 아주 멋진 역할을 하는 과거분사예요. 우리가 지난 시간까지 배운 것들을 떠올려 보면서, 오늘은 명사를 꾸며주거나 상태를 설명해 주는 v-ed의 비밀을 낱낱이 파헤쳐 볼 거예요. 자, 그럼 눈 크게 뜨고 오늘의 문법 여행을 시작해 볼까요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 2\u003c/span>\u003ch2 class=\"g-h\">명사를 수식하는 형용사 역할\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">v-ed는 \u003cb class=\"key\">형용사\u003c/b> 역할을 하며 명사를 앞이나 뒤에서 수식한다. 의미는 \u003cb class=\"key\">v된, v당한, v받는\u003c/b> 뜻을 가지며 이를 과거분사라고 부른다.\u003cdiv>\u003cspan class=\"g-formula\">명사 + v-ed 또는 v-ed + 명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Try to eat a \u003cspan class=\"fx\">balanced\u003c/span> diet to stay healthy.\u003c/div>\u003cdiv class=\"g-ko\">건강하게 지내기 위해서 균형 잡힌 식단을 먹으려고 노력해라.\u003c/div>\u003cdiv class=\"g-note\">balanced가 명사 diet를 앞에서 수식한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">What’s the code \u003cspan class=\"fx\">needed\u003c/span> to enter your office?\u003c/div>\u003cdiv class=\"g-ko\">너의 사무실에 들어가기 위해서 필요한 비밀번호가 무엇이지?\u003c/div>\u003cdiv class=\"g-note\">needed가 명사 code를 뒤에서 수식한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The student \u003cspan class=\"fx\">distracted\u003c/span> by the noise made many mistakes.\u003c/div>\u003cdiv class=\"g-ko\">소음에 의해서 방해받은 학생은 많은 실수를 했다.\u003c/div>\u003cdiv class=\"g-note\">distracted가 명사 student를 뒤에서 수식한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">Many people living in big cities feel \u003cspan class=\"fx\">disconnected\u003c/span> from nature.\u003c/div>\u003cdiv class=\"g-ko\">도시에 사는 많은 사람들은 자연으로부터 단절됐다고 느낀다.\u003c/div>\u003cdiv class=\"g-note\">disconnected가 주어 people의 상태를 설명하는 분사구이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>명사와 v-ed의 관계가 수동일 때 과거분사 v-ed를 쓴다는 점을 기억하자.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념은 v-ed가 명사를 꾸며주는 형용사 역할을 한다는 거예요. 이 친구는 v된, v당한, v받는이라는 의미를 가지며 우리가 흔히 부르는 과거분사랍니다. 명사의 앞에서 수식하기도 하고 뒤에서 수식하기도 하니까 우리 예문을 통해 직접 확인해 볼게요.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. Try to eat a balanced diet to stay healthy. 건강하게 지내기 위해서 균형 잡힌 식단을 먹으려고 노력해라 라는 뜻이죠. 여기서 balanced가 diet를 앞에서 멋지게 꾸며주고 있어요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문입니다. What’s the code needed to enter your office? 너의 사무실에 들어가기 위해서 필요한 비밀번호가 무엇이지 라는 뜻이에요. 이번에는 needed가 code라는 명사의 뒤에서 수식하고 있네요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문을 들어 볼까요. The student distracted by the noise made many mistakes. 소음에 의해서 방해받은 학생은 많은 실수를 했다 라는 문장이에요. distracted가 student를 뒤에서 꾸며주면서 방해받은 이라는 의미를 더해 주고 있어요.","hl":"ex-2"},{"n":6,"text":"네 번째 예문이에요. Many people living in big cities feel disconnected from nature. 도시에 사는 많은 사람들은 자연으로부터 단절됐다고 느낀다 라는 뜻이죠. 여기서 disconnected는 사람들이 자연과 단절된 상태임을 나타내고 있어요.","hl":"ex-3"},{"n":7,"text":"여기서 중요한 팁을 하나 줄게요. 명사와 v-ed의 관계가 스스로 하는 게 아니라 당하는 수동일 때 과거분사 v-ed를 쓴다는 걸 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 2\u003c/span>\u003ch2 class=\"g-h\">주어와 목적어의 상태를 설명하는 보어 역할\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">v-ed는 주어나 목적어의 \u003cb class=\"key\">상태\u003c/b>를 설명하는 \u003cb class=\"key\">보어\u003c/b>로 쓰이기도 한다.\u003cdiv>\u003cspan class=\"g-formula\">주어/목적어 + 동사 + 보어(v-ed)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You look \u003cspan class=\"fx\">frustrated\u003c/span>. What’s the matter?\u003c/div>\u003cdiv class=\"g-ko\">너는 매우 실망한 것처럼 보인다. 무슨 일이 있어?\u003c/div>\u003cdiv class=\"g-note\">주어 You의 상태를 설명하는 주격 보어이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Keep your muscles \u003cspan class=\"fx\">used\u003c/span>, or you’ll lose them.\u003c/div>\u003cdiv class=\"g-ko\">근육을 계속 사용되게 해라 (근육을 계속 사용하라). 그렇지 않으면 근육을 잃을 것이다.\u003c/div>\u003cdiv class=\"g-note\">목적어 muscles의 상태를 설명하는 목적격 보어이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Last week we had all our windows \u003cspan class=\"fx\">broken\u003c/span> by the storm.\u003c/div>\u003cdiv class=\"g-ko\">지난주에 우리의 창문이 전부 폭풍에 의해 깨졌다.\u003c/div>\u003cdiv class=\"g-note\">목적어 windows의 상태를 설명하는 목적격 보어이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">I have to get everything \u003cspan class=\"fx\">done\u003c/span> by Friday.\u003c/div>\u003cdiv class=\"g-ko\">나는 금요일까지 모든 일들을 마무리되게 해야 한다.\u003c/div>\u003cdiv class=\"g-note\">목적어 everything의 상태를 설명하는 목적격 보어이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주관대+be동사가 생략된 구조로 이해하면 보어 역할을 쉽게 파악할 수 있다.\u003c/div>","segs":[{"n":8,"text":"두 번째 개념은 v-ed가 주어나 목적어의 상태를 보충해서 설명해 주는 보어 역할을 한다는 거예요. 문장에서 주어나 목적어가 어떤 상태인지 생생하게 보여준답니다.","hl":"rule"},{"n":9,"text":"첫 번째 예문을 보죠. You look frustrated. What’s the matter? 너는 매우 실망한 것처럼 보인다. 무슨 일이 있어 라는 뜻이에요. frustrated가 주어인 너의 상태를 아주 잘 설명해 주고 있어요.","hl":"ex-0"},{"n":10,"text":"두 번째 예문입니다. Keep your muscles used, or you’ll lose them. 근육을 계속 사용되게 해라. 그렇지 않으면 근육을 잃을 것이다 라는 뜻이에요. muscles라는 목적어가 사용되는 상태를 유지하라는 목적격 보어로 쓰였어요.","hl":"ex-1"},{"n":11,"text":"세 번째 예문이에요. Last week we had all our windows broken by the storm. 지난주에 우리의 창문이 전부 폭풍에 의해 깨졌다 라는 뜻이죠. 창문들이 깨진 상태가 되도록 했다는 의미로 목적격 보어가 쓰였어요.","hl":"ex-2"},{"n":12,"text":"네 번째 예문입니다. I have to get everything done by Friday. 나는 금요일까지 모든 일들을 마무리되게 해야 한다 라는 뜻이에요. 모든 것이 끝마쳐진 상태가 되도록 한다는 의미에서 done이 목적격 보어로 사용되었답니다.","hl":"ex-3
