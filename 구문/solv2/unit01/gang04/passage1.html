;치명적인 약점&#39;을 가리켜 &#39;아킬레스건(Achilles&#39; heel)&#39;이라고 부르는 걸 들어본 적 있나요? 이 용어는 그리스 신화 속 영웅 아킬레스의 이야기에서 유래했는데, 신화나 문학 작품 속 주인공이 가진 결정적인 결함을 가리키는 비극적 결함(Hamartia)이라는 개념과 아주 밀접하게 연결되어 있어요. 아킬레스처럼 겉보기에는 완벽해 보이는 사람이나 시스템도 아주 작은 부분에서 시작된 치명적인 약점(Fatal weakness) 때문에 결국 무너질 수 있다는 것이 이 글의 핵심적인 관점이죠. 마치 아무리 튼튼한 건물이라도 기둥의 작은 균열 하나가 건물을 무너뜨릴 수 있는 것과 같은 이치랍니다. 오늘 지문을 읽기 전에, 완벽함 속에 숨겨진 작은 틈이 어떤 결과를 초래하는지를 생각하며 글을 읽어보면 훨씬 더 흥미로울 거예요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입</div><ul><li>겉보기에 완벽해 보이는 것들도 치명적인 약점을 가질 수 있다는 사실을 보여준다.</li><li>완벽함 뒤에 숨겨진 치명적 약점 (fatal weakness)</li><li>몰락의 원인이 되는 결함 (downfall)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02그리스 신화 속 영웅</div><ul><li>아킬레스는 불사의 능력을 얻으려던 시도 속에서 단 하나의 약점을 갖게 되었다.</li><li>신화적 배경: 스틱스 강(River Styx)의 물</li><li>어머니의 간절한 노력: 아킬레스를 위대한 전사로 키우려는 시도</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03약점의 생성 과정</div><ul><li>어머니가 잡고 있던 발뒤꿈치 부분만 물에 닿지 않아 약점이 되고 말았다.</li><li>신체 부위가 물에 잠기지 않은 유일한 곳 (heel)</li><li>보호받지 못한 신체 부위의 발생</li><li>핵심 키워드: 아킬레스의 발뒤꿈치(Achilles’ heel)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결과와 관용구의 탄생</div><ul><li>결국 그 약점은 전쟁터에서 아킬레스를 죽음에 이르게 했고, 오늘날까지 표현으로 남았다.</li><li>트로이 전쟁(Trojan War)에서의 비극적 죽음</li><li>사람의 가장 약한 부분을 뜻하는 관용구의 기원</li><li>핵심 키워드: 관용구(idiom)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perfect</td><td class=\"m\">완벽한</td></tr><tr><td class=\"w\">turn out</td><td class=\"m\">~임이 밝혀지다, 결국 ~이 되다</td></tr><tr><td class=\"w\">fatal</td><td class=\"m\">치명적인</td></tr><tr><td class=\"w\">weakness</td><td class=\"m\">약점</td></tr><tr><td class=\"w\">lead to</td><td class=\"m\">~로 이어지다, 야기하다</td></tr><tr><td class=\"w\">downfall</td><td class=\"m\">몰락, 파멸</td></tr><tr><td class=\"w\">constant</td><td class=\"m\">끊임없는, 변함없는</td></tr><tr><td class=\"w\">tragic</td><td class=\"m\">비극적인</td></tr><tr><td class=\"w\">legend</td><td class=\"m\">전설</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">warrior</td><td class=\"m\">전사</td></tr><tr><td class=\"w\">determine</td><td class=\"m\">결심하다, 결정하다</td></tr><tr><td class=\"w\">dip</td><td class=\"m\">(잠깐) 담그다</td></tr><tr><td class=\"w\">wash over</td><td class=\"m\">~ 위를 덮치다(흐르다)</td></tr><tr><td class=\"w\">except</td><td class=\"m\">~을 제외하고</td></tr><tr><td class=\"w\">bring about</td><td class=\"m\">야기하다, 초래하다</td></tr><tr><td class=\"w\">popular</td><td class=\"m\">대중적인, 인기 있는</td></tr><tr><td class=\"w\">idiom</td><td class=\"m\">관용구</td></tr><tr><td class=\"w\">invent</td><td class=\"m\">발명하다, 고안하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">완벽해 보이는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">What seems to be perfect</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음에</span><span class=\"en\"><b>at first</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">때로는 드러난다</span><span class=\"en\"><b>sometimes <span class=\"grammar-hl\">turns out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">치명적인 약점을 가지고 있다고</span><span class=\"en\"><b><span class=\"grammar-hl\">to have</span> a fatal weakness</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 파멸을 초래하는</span><span class=\"en\"><b><span class=\"grammar-hl\">leading to</span> its downfall.</b></span></div></div><div class=\"lec-sent-ko\">처음에는 완벽해 보이는 것이 때로 파멸을 초래하는 치명적인 약점을 가진 것으로 드러나는 경우가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 완벽해 보이는 대상도 결국 파멸에 이르게 하는 결정적 결함이 있을 수 있다는 글의 주제를 제시하는 도입부입니다. 여기서 downfall은 사전적으로 &#39;몰락, 몰락의 원인&#39;을 뜻하며, 문맥상 &#39;성공적인 상태가 무너져 내리는 결과&#39;를 의미합니다. 필자는 대상의 완전함과 결말의 비극성을 극명하게 대비시키기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What seems to be perfect (관계대명사(What)): 선행사를 포함하는 관계대명사로, 주어 역할을 하는 명사절(What + S + V)을 구성한다.</div><div class=\"lec-gr-item\">to be perfect (to부정사): seem(동사)의 보어 역할을 하며, ‘완벽한 것처럼 보이다’라는 상태를 설명한다.</div><div class=\"lec-gr-item\">turns out to have (to부정사): turn out(알려지다/결과가 ~이다) 뒤에서 결과적 용법으로 쓰여, ‘결국 ~을 가지고 있음이 밝혀지다’라는 의미를 만든다.</div><div class=\"lec-gr-item\">leading to (현재분사): 앞의 a fatal weakness를 수식하는 형용사적 기능으로, ‘~을 초래하는(결과로 이어지는)’의 능동적 상태를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perfect</td><td class=\"m\">완벽한</td></tr><tr><td class=\"w\">fatal</td><td class=\"m\">치명적인</td></tr><tr><td class=\"w\">weakness</td><td class=\"m\">약점</td></tr><tr><td class=\"w\">downfall</td><td class=\"m\">몰락, 파멸</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 명의 비극적인 그리스 영웅이 있다</span><span class=\"en\"><b>There is one tragic Greek hero</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예시로 늘 사용되는</span><span class=\"en\"><b><span class=\"grammar-hl\">constantly used</span> as an example</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 치명적인 약점을 가진 것에 대한:</span><span class=\"en\"><b>of <span class=\"grammar-hl\">having one fatal weakness</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아킬레우스이다.</span><span class=\"en\"><b>Achilles.</b></span></div></div><div class=\"lec-sent-ko\">그 치명적인 약점의 한 가지 예로 늘 인용되는 그리스의 비극적인 영웅이 한 명 있는데 바로 Achilles이다</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시한 &#39;치명적 약점&#39;을 가진 구체적인 인물을 소개하며, 독자의 주의를 신화적 사례로 돌리고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">constantly used (과거분사(형용사)): used가 앞의 명사(hero)를 수식하는 구조. hero가 예시로 &#39;사용되는&#39; 수동적 관계를 설명한다. N + p.p. ≈ N that is p.p. 형태이다.</div><div class=\"lec-gr-item\">having one fatal weakness (동명사): 전치사(of)의 목적어 자리에 위치하여 &#39;결함 하나를 가지는 것&#39;이라는 명사적 행위를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fatal</td><td class=\"m\">치명적인</td></tr><tr><td class=\"w\">weakness</td><td class=\"m\">약점</td></tr><tr><td class=\"w\">constant</td><td class=\"m\">끊임없는, 변함없는</td></tr><tr><td class=\"w\">tragic</td><td class=\"m\">비극적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리스 전설에 따르면,</span><span class=\"en\"><b>According to Greek legend,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이는 접촉된</span><span class=\"en\"><b>a child <span class=\"grammar-hl\">touched</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스틱스 강의 물에 의해</span><span class=\"en\"><b><span class=\"grammar-hl\">by the water</span> of the River Styx</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">절대 죽지 않을 것이다</span><span class=\"en\"><b>would never die</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전투에서.</span><span class=\"en\"><b>in battle.</b></span></div></div><div class=\"lec-sent-ko\">그리스 전설에 따르면, Styx 강물에 적신 아이는 싸움에서 절대 죽지 않는다고 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아킬레우스가 왜 불사신이 되었는지 그 배경 지식을 설명하여, 이어질 약점의 탄생 과정을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">touched by the water (과거분사(형용사)): touched가 child를 수식하는 구조. child가 물에 의해 &#39;접촉된(닿은)&#39; 수동적 상태를 설명한다. N + p.p. ≈ N that is p.p. 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">legend</td><td class=\"m\">전설</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아킬레우스의 어머니는,</span><span class=\"en\"><b>Achilles’ mother,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아킬레우스를 위대한 전사로 만들기로 결심하고,</span><span class=\"en\"><b><span class=\"grammar-hl\">determined to make</span> Achilles a great warrior,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스틱스 강으로 이동했다</span><span class=\"en\"><b>traveled to the Styx</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 아들을 담갔다</span><span class=\"en\"><b>and dipped her son</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 물속으로.</span><span class=\"en\"><b>into the water.</b></span></div></div><div class=\"lec-sent-ko\">Achilles를 위대한 전사로 만들기로 결심한 Achilles의 어머니는 Styx 강으로 가서 아들을 강물에 담갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 어머니의 강한 의지가 오히려 아킬레우스의 운명을 결정짓는 행동으로 이어지는 인과관계를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">determined to make (과거분사(분사구문)): 주어(Achilles’ mother)의 상태를 부연 설명하는 분사구문이다. 원래 절로 바꾸면 &#39;Because she was determined to...&#39;의 의미이며, 주어와 과거분사가 결합한 형태이다.</div><div class=\"lec-gr-item\">to make Achilles a great warrior (to부정사): 부사적 용법(목적)으로 쓰여, 그녀가 왜 여행을 떠났는지 그 이유를 설명한다.</div><div class=\"lec-gr-item\">make Achilles a great warrior (5형식(SVOC)): make(사역동사) + 목적어(Achilles) + 목적보어(a great warrior) 구조로, 목적어의 상태를 목적보어가 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">warrior</td><td class=\"m\">전사</td></tr><tr><td class=\"w\">determine</td><td class=\"m\">결심하다, 결정하다</td></tr><tr><td class=\"w\">dip</td><td class=\"m\">(잠깐) 담그다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">먼저 아킬레우스의 머리가 들어갔다,</span><span class=\"en\"><b><span class=\"grammar-hl\">First Achilles’ head went in</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그 다음에 그의 가슴,</span><span class=\"en\"><b>and then his chest,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다리와 발이.</span><span class=\"en\"><b>legs and feet.</b></span></div></div><div class=\"lec-sent-ko\">먼저 Achilles의 머리가 들어갔고, 그 다음에 가슴과 다리, 발이 들어갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 어머니가 아들을 물에 담그는 과정을 상세히 묘사하여, 뒤이어 나올 약점이 생길 물리적 상황을 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">First Achilles’ head went in (도치): 강조를 위해 부사(First)가 문장 맨 앞으로 이동하며 어순이 재배치된 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">강물은 적셨다</span><span class=\"en\"><b>The river’s water washed over</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 몸의 모든 부분을</span><span class=\"en\"><b>every part of his body</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발뒤꿈치를 제외하고는</span><span class=\"en\"><b>except <span class=\"grammar-hl\">the heel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 어머니의 손이 덮고 있었던.</span><span class=\"en\"><b><span class=\"grammar-hl\">his mother’s hand had covered</span>.</b></span></div></div><div class=\"lec-sent-ko\">엄마의 손이 덮고 있었던 발뒤꿈치만 빼고 강물이 그의 온몸을 적셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;모든 부분&#39;과 &#39;제외된 한 부분&#39;을 대조함으로써, 아킬레우스의 유일한 약점이 형성되는 결정적 순간을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the heel his mother’s hand had covered (관계대명사(목적격)): heel과 his... 사이에 목적격 관계대명사(which/that)가 생략되어 있다. 뒤의 절(his mother&#39;s hand had covered)에서 목적어 자리가 비어 있는 불완전한 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">except</td><td class=\"m\">~을 제외하고</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서, 아킬레우스의 발뒤꿈치는 그의 약점이 되었다,</span><span class=\"en\"><b>Thus, Achilles’ heel became his weak spot,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 나중에 초래했다</span><span class=\"en\"><b><span class=\"grammar-hl\">which later brought about</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 죽음을</span><span class=\"en\"><b>his death</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">트로이 전쟁에서.</span><span class=\"en\"><b>in the Trojan War.</b></span></div></div><div class=\"lec-sent-ko\">그래서 Achilles의 발뒤꿈치는 그의 약점이 되었고, 후에 트로이 전쟁에서 그를 숨지게 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 사건(어머니의 실수)이 어떤 결과(죽음)를 가져왔는지 연결하며, 이야기가 결론으로 나아가는 과정입니다. brought about은 &#39;초래하다, 유발하다&#39;라는 뜻으로, 단순한 발생이 아니라 &#39;원인으로부터 결과가 필연적으로 이끌려 나왔음&#39;을 강조하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">which later brought about 관계대명사(계속적 용법): 앞 문장의 내용 전체(발꿈치가 약점이 된 사실)를 선행사로 받으며 보충 설명을 제공한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리하여, 인기 있는 관용어가,</span><span class=\"en\"><b>Thus, a popular idiom,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금 묘사하는 데 쓰이는</span><span class=\"en\"><b><span class=\"grammar-hl\">now used to describe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람의 가장 약한 지점을,</span><span class=\"en\"><b>a person’s weakest point,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발명되었다:</span><span class=\"en\"><b><span class=\"grammar-hl\">was invented</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;아킬레우스의 발뒤꿈치.&quot;</span><span class=\"en\"><b>“Achilles’ heel.”</b></span></div></div><div class=\"lec-sent-ko\">그리하여 오늘날 어떤 사람의 최대 약점을 나타내는 데 널리 쓰이는 관용어가 생겨났는데 바로 “Achilles의 발뒤꿈치”이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 신화적 이야기가 현대 언어 표현으로 정착되었음을 밝히며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">now used to describe (과거분사(형용사)): idiom을 수식하는 구조. 관용구가 &#39;사용되는&#39; 수동적 관계를 설명한다. N + p.p. ≈ N that is p.p. 형태이다.</div><div class=\"lec-gr-item\">was invented (수동태): be동사(was)+p.p.(invented) 구조. invent는 타동사(목적어를 취하는 동사)인데, 주어가 동작의 대상이므로 수동구조 was invented 형태로 쓴다. 기본구조: V(invent) + O(목적어)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">popular</td><td class=\"m\">대중적인, 인기 있는</td></tr><tr><td class=\"w\">idiom</td><td class=\"m\">관용구</td></tr><tr><td class=\"w\">invent</td><td class=\"m\">발명하다, 고안하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>완벽해 보이는 것도 치명적인 약점을 가질 수 있다는 사실을 아킬레우스의 신화를 통해 설명한다.</li><li>아킬레우스의 어머니는 그를 불사신으로 만들려 했으나, 물에 닿지 못한 발뒤꿈치가 유일한 약점이 되었다.</li><li>이 약점으로 인해 그는 결국 죽음을 맞이했다.</li><li>이 전설에서 유래한 &#39;아킬레우스의 건&#39;은 오늘날 개인의 치명적인 약점을 뜻하는 관용구로 사용된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Achilles became a legendary warrior through the River Styx, but his unprotected heel eventually caused his death in battle.</div>\n              <div class=\"lec-final-sum-ko\">아킬레스는 스틱스 강을 통해 전설적인 전사가 되었지만, 보호받지 못한 발뒤꿈치가 결국 전쟁터에서 그의 죽음을 초래했다.</div></div></div>"],"segs":[[{"audio":"./passage1_audio/1.mp3","hl":null}],[{"audio":"./passage1_audio/2.mp3","hl":null}],[{"audio":"./passage1_audio/3.mp3","hl":null},{"audio":"./passage1_audio/4.mp3","hl":"stage-0"},{"audio":"./passage1_audio/5.mp3","hl":"stage-1"},{"audio":"./passage1_audio/6.mp3","hl":"stage-2"},{"audio":"./passage1_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage1_audio/8.mp3","hl":null}],[{"audio":"./passage1_audio/9.mp3","hl":"main"},{"audio":"./passage1_audio/10.mp3","hl":"meaning"},{"audio":"./passage1_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/12.mp3","hl":"main"},{"audio":"./passage1_audio/13.mp3","hl":"meaning"},{"audio":"./passage1_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/15.mp3","hl":"main"},{"audio":"./passage1_audio/16.mp3","hl":"meaning"},{"audio":"./passage1_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/18.mp3","hl":"main"},{"audio":"./passage1_audio/19.mp3","hl":"meaning"},{"audio":"./passage1_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/21.mp3","hl":"main"},{"audio":"./passage1_audio/22.mp3","hl":"meaning"},{"audio":"./passage1_audio/23.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/24.mp3","hl":"main"},{"audio":"./passage1_audio/25.mp3","hl":"meaning"},{"audio":"./passage1_audio/26.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/27.mp3","hl":"main"},{"audio":"./passage1_audio/28.mp3","hl":"meaning"},{"audio":"./passage1_audio/29.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/30.mp3","hl":"main"},{"audio":"./passage1_audio/31.mp3","hl":"meaning"},{"audio":"./passage1_audio/32.mp3","hl":"gramm
