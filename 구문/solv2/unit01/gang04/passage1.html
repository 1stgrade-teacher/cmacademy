<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4강 reading1 — AI 강의</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"4강 reading1","audioDir":"passage1_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">4강\u003cbr>1번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>The Fatal Weakness Behind a Perfect Appearance\u003c/h1>\u003ch2>완벽해 보이는 것 뒤의 치명적 약점\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>처음에는 완벽해 보이는 것도 파멸을 초래하는 \u003cb class=\"key\">치명적인 \u003c/b>\u003cb class=\"key\">약점\u003c/b>을 가질 수 있다. 그 대표적 예가 \u003cb class=\"key\">Achilles\u003c/b>의 발뒤꿈치이며, 여기서 사람의 최대 약점을 뜻하는 관용어 \u003cb class=\"key\">Achilles' \u003c/b>\u003cb class=\"key\">heel\u003c/b>이 생겨났다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Even something that seems perfect at first can have a fatal weakness that leads to its downfall, as shown by the story of Achilles' heel.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 완벽해 보이는 것의 이면을 다룬 짧은 글을 함께 읽어 볼게요. 이 글은 처음에는 완벽해 보여도 치명적인 약점 때문에 파멸에 이를 수 있다는 내용을 담고 있어요. 핵심 사례는 그리스 영웅 Achilles이고, 마지막에는 Achilles' heel이라는 관용어의 유래로 이어집니다. 함께 천천히 흐름을 따라가 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">그리스 신화에서 \u003cb class=\"key\">Achilles\u003c/b>는 트로이 전쟁의 비극적인 영웅으로 등장합니다. 전설에 따르면 Styx 강물에 적신 아이는 전투에서 죽지 않는 힘을 얻는다고 했습니다. 그래서 Achilles의 어머니는 아들을 위대한 전사로 만들기 위해 그를 강물에 담갔습니다. 하지만 어머니의 손이 덮고 있던 발뒤꿈치만은 물에 닿지 않았고, 이 작은 예외가 훗날 그의 약점이 되었습니다. 오늘날 \u003cb class=\"key\">Achilles' \u003c/b>\u003cb class=\"key\">heel\u003c/b>은 사람의 가장 약한 부분을 뜻하는 관용어로 널리 쓰입니다. 일상에서도 겉은 멀쩡해 보이는 스마트폰이 작은 부품 하나 때문에 고장 나는 경우가 있죠.\u003c/div>","segs":[{"n":2,"text":"그리스 신화에서 Achilles는 트로이 전쟁의 큰 영웅으로 나옵니다. 전설에 따르면 Styx 강물은 아이를 전투에서 죽지 않게 해 주는 힘을 지녔다고 해요. 그래서 Achilles의 어머니는 아들을 위대한 전사로 만들기 위해 그를 강물에 담갔죠. 하지만 어머니가 붙잡고 있던 발뒤꿈치만은 물에 닿지 않았어요. 이 작은 예외가 훗날 그의 약점이 되었고, 오늘날에는 Achilles' heel이라는 관용어로 널리 쓰입니다. 일상에서도 겉은 멀쩡해 보이는 물건이 작은 부품 하나 때문에 고장 나는 경우가 있죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>완벽의 이면\u003csmall>주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 처음에는 완벽해 보이는 것이 때로 \u003cb class=\"key\">치명적인 \u003c/b>\u003cb class=\"key\">약점\u003c/b> 때문에 \u003cb class=\"key\">파멸\u003c/b>을 초래할 수 있다고 말합니다. 이어서 그 대표적인 예로 그리스의 비극적인 영웅 \u003cb class=\"key\">Achilles\u003c/b>를 제시합니다. 독자는 여기서 글 전체의 주제가 완벽의 이면에 있음을 알게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>Styx 강의 전설\u003csmall>예시 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>그리스 전설에 따르면 \u003cb class=\"key\">Styx \u003c/b>\u003cb class=\"key\">강\u003c/b>물에 적신 아이는 전투에서 절대 죽지 않습니다. Achilles의 어머니는 아들을 위대한 \u003cb class=\"key\">전사\u003c/b>로 만들기로 결심하고 그를 강물에 담갔습니다. 머리부터 가슴과 다리와 발까지 차례로 물에 들어갔습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>발뒤꿈치의 예외\u003csmall>전환 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>어머니의 손이 덮고 있던 \u003cb class=\"key\">발뒤꿈치\u003c/b>만 빼고 강물이 그의 온몸을 적셨습니다. 그래서 Achilles의 발뒤꿈치가 그의 \u003cb class=\"key\">약점\u003c/b>이 되었고, 후에 트로이 전쟁에서 그의 죽음을 불러왔습니다. 이 장면이 글의 핵심 전환입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>관용어의 탄생\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>이 이야기에서 오늘날 사람의 최대 약점을 나타내는 관용어 \u003cb class=\"key\">Achilles' \u003c/b>\u003cb class=\"key\">heel\u003c/b>이 생겨났습니다. 결국 이 글은 \u003cb class=\"key\">완벽\u003c/b>해 보이는 것도 숨은 약점을 가질 수 있음을 보여 줍니다. 마지막 문장은 구체적인 사례를 하나의 관용어로 정리하며 글을 맺습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"글은 먼저 처음에는 완벽해 보이는 것이 때로 치명적인 약점을 가져 파멸을 초래할 수 있다고 말해요. 그래서 독자는 이 글의 주제가 완벽의 이면에 있다는 것을 알게 되죠. 이어서 그 대표적인 예로 그리스의 비극적인 영웅 Achilles를 소개합니다.","hl":"f0"},{"n":5,"text":"그리스 전설에 따르면 Styx 강물에 적신 아이는 전투에서 절대 죽지 않는다고 해요. Achilles의 어머니는 아들을 위대한 전사로 만들기로 결심하고 그를 Styx 강물에 담갔죠. 머리부터 가슴과 다리와 발까지 차례로 물에 들어갔습니다.","hl":"f1"},{"n":6,"text":"그런데 어머니의 손이 덮고 있던 발뒤꿈치만은 물에 닿지 않았어요. 그래서 Achilles의 발뒤꿈치가 그의 약점이 되었고, 후에 트로이 전쟁에서 그의 죽음을 불러왔습니다. 이 장면이 글의 핵심 전환이에요.","hl":"f2"},{"n":7,"text":"이 이야기에서 오늘날 사람의 최대 약점을 뜻하는 관용어 Achilles' heel이 생겨났어요. 결국 이 글은 완벽해 보이는 것도 숨은 약점을 가질 수 있음을 보여 줍니다. 마지막 문장은 구체적인 사례를 하나의 관용어로 정리하며 글을 맺고 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 \u003cb class=\"key\">처음에는 \u003c/b>\u003cb class=\"key\">완벽해 \u003c/b>\u003cb class=\"key\">보이는 \u003c/b>\u003cb class=\"key\">것\u003c/b>도 \u003cb class=\"key\">치명적인 \u003c/b>\u003cb class=\"key\">약점\u003c/b>을 가질 수 있다는 주제를 먼저 제시합니다. 이후 Achilles의 구체적인 이야기를 \u003cb class=\"key\">예시\u003c/b>로 들어 그 주제를 뒷받침합니다. 마지막에는 \u003cb class=\"key\">Achilles' \u003c/b>\u003cb class=\"key\">heel\u003c/b>이라는 관용어의 유래로 결론을 맺습니다. 따라서 주제를 앞에 두고 예시로 설명하는 두괄식 주장-예시 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>example (2)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>except (6)\u003c/b>\u003cspan>예외 제시\u003c/span>\u003cb>Thus (7)\u003c/b>\u003cspan>결과 도출\u003c/span>\u003cb>Thus (8)\u003c/b>\u003cspan>결론 정리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">perfect at first\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fatal weakness\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">weak spot\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">weakest point\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Achilles' heel\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>겉으로 보이는 완벽함\u003c/th>\u003cth>숨은 치명적 약점\u003c/th>\u003c/tr>\u003ctr>\u003ctd>처음에는 완벽해 보임\u003c/td>\u003ctd>파멸을 초래할 수 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>쉽게 눈에 띄지 않음\u003c/td>\u003ctd>발뒤꿈치 같은 예외에 존재\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장을 먼저 내세우고 예시로 뒷받침하는 전개 방식이에요. 첫 번째 문장에서 완벽해 보이는 것의 치명적인 약점이라는 주제를 바로 제시하죠. 그다음 Achilles 이야기를 예시로 길게 펼치고, 마지막에 Achilles' heel이라는 관용어로 결론을 맺습니다. 그래서 전체 구조는 두괄식 주장과 예시의 흐름으로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 예시와 결과가 아주 분명해요. 두 번째 문장의 example은 Achilles가 대표적인 예시임을 알려 주고, 마지막의 Thus는 앞의 이야기가 관용어로 정리되는 결론임을 보여 줍니다. 중간의 except는 온몸과 발뒤꿈치의 예외를 대조해 주는 표지예요. 또 fatal weakness가 weak spot과 weakest point로 이어지며 같은 개념이 반복되고 확장됩니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>seem to be\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~인 것처럼 보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>perfect\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>완벽한\u003c/span>\u003c/div>\u003cdiv>\u003cb>at first\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>처음에는\u003c/span>\u003c/div>\u003cdiv>\u003cb>sometimes\u003c/b>\u003cem>부사\u003c/em>\u003cspan>때로는\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결과적으로 드러나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fatal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>치명적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>weakness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>약점\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 초래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>downfall\u003c/b>\u003cem>명사\u003c/em>\u003cspan>파멸, 몰락\u003c/span>\u003c/div>\u003cdiv>\u003cb>tragic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비극적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>hero\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영웅\u003c/span>\u003c/div>\u003cdiv>\u003cb>constantly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>끊임없이, 늘\u003c/span>\u003c/div>\u003cdiv>\u003cb>be used as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 사용되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>example\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예, 사례\u003c/span>\u003c/div>\u003cdiv>\u003cb>legend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전설\u003c/span>\u003c/div>\u003cdiv>\u003cb>according to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 따르면\u003c/span>\u003c/div>\u003cdiv>\u003cb>determined\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>결심한\u003c/span>\u003c/div>\u003cdiv>\u003cb>warrior\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전사\u003c/span>\u003c/div>\u003cdiv>\u003cb>dip\u003c/b>\u003cem>동사\u003c/em>\u003cspan>담그다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가슴\u003c/span>\u003c/div>\u003cdiv>\u003cb>wash over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 적시다, 덮치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>except\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 제외하고\u003c/span>\u003c/div>\u003cdiv>\u003cb>heel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발뒤꿈치\u003c/span>\u003c/div>\u003cdiv>\u003cb>cover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>덮다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thus\u003c/b>\u003cem>부사\u003c/em>\u003cspan>따라서, 그리하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>weak spot\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>약점\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일으키다, 초래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>널리 쓰이는, 인기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>idiom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관용어\u003c/span>\u003c/div>\u003cdiv>\u003cb>describe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묘사하다, 나타내다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어는 맥락과 함께 익혀야 오래 남아요. fatal은 치명적인, weakness는 약점, downfall은 파멸이라는 뜻으로 기억해 두세요. turn out은 결과적으로 드러나다, lead to는 초래하다라는 의미로 정리하면 좋습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">perfect\u003c/b>\u003cspan class=\"m\">완벽한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">flawless\u003c/span>\u003cspan class=\"s\">ideal\u003c/span>\u003cspan class=\"s\">faultless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">imperfect\u003c/span>\u003cspan class=\"a\">flawed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fatal\u003c/b>\u003cspan class=\"m\">치명적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deadly\u003c/span>\u003cspan class=\"s\">lethal\u003c/span>\u003cspan class=\"s\">mortal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harmless\u003c/span>\u003cspan class=\"a\">safe\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">weakness\u003c/b>\u003cspan class=\"m\">약점\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">flaw\u003c/span>\u003cspan class=\"s\">defect\u003c/span>\u003cspan class=\"s\">shortcoming\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">strength\u003c/span>\u003cspan class=\"a\">advantage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">downfall\u003c/b>\u003cspan class=\"m\">파멸, 몰락\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ruin\u003c/span>\u003cspan class=\"s\">collapse\u003c/span>\u003cspan class=\"s\">fall\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">success\u003c/span>\u003cspan class=\"a\">rise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">constantly\u003c/b>\u003cspan class=\"m\">끊임없이\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">continually\u003c/span>\u003cspan class=\"s\">always\u003c/span>\u003cspan class=\"s\">persistently\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rarely\u003c/span>\u003cspan class=\"a\">occasionally\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">except\u003c/b>\u003cspan class=\"m\">~을 제외하고\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">excluding\u003c/span>\u003cspan class=\"s\">barring\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">including\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">popular\u003c/b>\u003cspan class=\"m\">널리 쓰이는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"s\">widespread\u003c/span>\u003cspan class=\"s\">prevalent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpopular\u003c/span>\u003cspan class=\"a\">rare\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘의 동의어와 반의어도 함께 챙겨 볼게요. perfect는 flawless나 ideal과 가깝고 반대말은 imperfect예요. fatal은 deadly나 lethal로 바꿀 수 있고 반대말은 harmless입니다. weakness는 flaw나 defect와 비슷하고 반대말은 strength죠. except는 excluding과 가깝고 반대말은 including으로 기억하면 됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에는 완벽해 보이는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">seems \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">perfect\u003c/span> at first\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때로 드러난다\u003c/span>\u003cspan class=\"en\">sometimes \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">turns \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치명적인 약점을 가진 것으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> a fatal weakness\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파멸을 초래하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">leading \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">downfall\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">처음에는 완벽해 보이는 것이 때로 파멸을 초래하는 치명적인 약점을 가진 것으로 드러나는 경우가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 \u003cb class=\"key\">주제문\u003c/b>으로, 겉으로 완벽해 보이는 것도 속에 \u003cb class=\"key\">치명적인 \u003c/b>\u003cb class=\"key\">약점\u003c/b>을 감추고 있을 수 있다는 일반 원리를 제시해요. 이 원리가 뒤에 나오는 Achilles 이야기의 바탕이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what(주어 역할)\u003c/span> : What + [불완전한 절] + 동사 = …하는 것이 …하다 : \"완벽해 보이는 것이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">turn out + to부정사(결과)\u003c/span> : turn out + [to have (to부정사)] + 목적어 : \"~을 가진 것으로 드러나다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사구의 후치수식\u003c/span> : [명사 + leading(현재분사) + 전치사구] : \"파멸을 초래하는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"What seems to be perfect at first, 처음에는 완벽해 보이는 것이. sometimes turns out, 때로 드러난다. to have a fatal weakness, 치명적인 약점을 가진 것으로. leading to its downfall, 파멸을 초래하는. 이 문장 전체를 해석하면, 처음에는 완벽해 보이는 것이 때로 파멸을 초래하는 치명적인 약점을 가진 것으로 드러나는 경우가 있다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 주제문이에요. 겉으로는 완벽해 보여도 결국에는 치명적인 약점을 가진 것으로 드러날 수 있다는 이야기죠. 그래서 뒤에 나오는 Achilles 이야기가 이 원리를 보여 주는 사례가 되는 거예요.","hl":"mn"},{"n":14,"text":"먼저 What seems to be perfect에서 what은 선행사를 포함해서 완벽해 보이는 것이라는 명사절을 만들고 주어 역할을 해요. 두 번째로 turns out to have에서 turn out은 to부정사와 붙어서 결국 그런 것으로 드러나다라는 결과의 뜻을 만들어요. 마지막으로 leading to its downfall는 앞의 weakness를 뒤에서 꾸미는 후치수식이고, 약점이 파멸을 이끄는 능동 관계라서 현재분사를 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 명의 비극적인 그리스 영웅이 있는데\u003c/span>\u003cspan class=\"en\">There is one tragic Greek hero\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">늘 인용되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">constantly \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 치명적인 약점을 가진 것의 예로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">example\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">fatal \u003c/span>\u003cspan class=\"tgt\">weakness\u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">:\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로 Achilles이다\u003c/span>\u003cspan class=\"en\">Achilles.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 치명적인 약점의 한 가지 예로 늘 인용되는 그리스의 비극적인 영웅이 한 명 있는데 바로 Achilles이다\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 일반 원리를 보여 줄 구체적인 \u003cb class=\"key\">사례\u003c/b>를 처음 꺼내는 문장이에요. 콜론 뒤에 \u003cb class=\"key\">Achilles\u003c/b>라는 이름을 붙여 그 영웅이 누구인지 바로 밝혀 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치수식(수동)\u003c/span> : [명사 + used(과거분사) + as …] : \"늘 예로 인용되는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of + 동명사\u003c/span> : 전치사 of + [having(동명사)] + 목적어 : \"하나의 치명적인 약점을 가진 것의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">콜론(:)을 통한 동격·부연\u003c/span> : 내용 + [:] + 그 내용을 밝히는 명사 : \"바로\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"There is one tragic Greek hero, 한 명의 비극적인 그리스 영웅이 있는데. constantly used, 늘 인용되는. as an example of having one fatal weakness, 하나의 치명적인 약점을 가진 것의 예로. Achilles, 바로 Achilles이다. 이 문장 전체를 해석하면, 그 치명적인 약점의 한 가지 예로 늘 인용되는 그리스의 비극적인 영웅이 한 명 있는데 바로 Achilles이다","hl":"m"},{"n":16,"text":"이 문장은 앞에서 말한 원리를 보여 줄 구체적인 사례를 꺼내는 역할을 해요. 콜론을 쓰고 Achilles라고 이름을 붙여서, 그 영웅이 누구인지 바로 알려 주는 거죠.","hl":"mn"},{"n":17,"text":"먼저 constantly used as an example에서 used는 앞의 hero를 뒤에서 꾸미는 과거분사이고, 영웅이 인용되는 대상이니까 수동의 의미예요. 두 번째로 of having one fatal weakness에서 of 뒤에 동명사 having이 와서 약점을 가진 것이라는 명사적 의미를 만들어요. 마지막으로 콜론은 앞에 나온 hero가 누구인지 뒤에서 동격으로 딱 밝혀 주는 표시예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리스 전설에 따르면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">According \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Greek \u003c/span>\u003cspan class=\"tgt\">legend\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적신 아이는\u003c/span>\u003cspan class=\"en\">a child \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">touched \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Styx 강물에 의해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">water\u003c/span> of the River Styx\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">싸움에서 절대 죽지 않는다고 했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">die\u003c/span> in battle.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리스 전설에 따르면, Styx 강물에 적신 아이는 싸움에서 절대 죽지 않는다고 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Achilles 이야기의 배경이 되는 \u003cb class=\"key\">전설\u003c/b>의 규칙을 소개하는 문장이에요. 강물에 적신 아이는 전투에서 죽지 않는다는 \u003cb class=\"key\">조건\u003c/b>을 먼저 깔아 두는 거죠. 여기서 would는 전설 속 상황을 전할 때 쓰는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 according to + 명사(부사구)\u003c/span> : According to + [명사], + 주어 + 동사 : \"그리스 전설에 따르면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치수식(수동)\u003c/span> : [명사 + touched(과거분사) + by …] : \"물에 적신\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 would(과거 시점에서의 추측)\u003c/span> : [주어] + would + [동사원형] : \"죽지 않을 것이다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"According to Greek legend, 그리스 전설에 따르면. a child touched, 적신 아이는. by the water of the River Styx, Styx 강물에 의해. would never die in battle, 싸움에서 절대 죽지 않는다고 했다.. 이 문장 전체를 해석하면, 그리스 전설에 따르면, Styx 강물에 적신 아이는 싸움에서 절대 죽지 않는다고 했다.","hl":"m"},{"n":19,"text":"이 문장은 Achilles 이야기의 바탕이 되는 전설의 규칙을 소개해요. 강물에 적신 아이는 전투에서 죽지 않는다는 조건을 먼저 깔아 두는 거죠. 여기서 would는 전설 속 상황을 전달할 때 쓰는 표현이에요.","hl":"mn"},{"n":20,"text":"먼저 According to Greek legend에서 according to는 정보의 출처를 밝히는 전치사구로 문장 전체를 꾸며 줘요. 두 번째로 a child touched by the water에서 touched는 child를 뒤에서 꾸미는 과거분사이고, 아이가 물에 적셔진 대상이니까 수동의 의미예요. 마지막으로 would never die에서 would는 전설이 말하는 과거 시점에서의 추측을 나타내고 뒤에 동사원형 die가 오는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Achilles의 어머니는\u003c/span>\u003cspan class=\"en\">Achilles' mother,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Achilles를 위대한 전사로 만들기로 결심한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">determined \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">Achilles \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">warrior\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Styx 강으로 가서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">traveled \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Styx \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아들을 강물에 담갔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">dipped\u003c/span> her son into the water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Achilles를 위대한 전사로 만들기로 결심한 Achilles의 어머니는 Styx 강으로 가서 아들을 강물에 담갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 설명한 Styx 강물의 효능이 실제로 어떻게 사용되었는지 보여 주는 장면이에요. 어머니의 \u003cb class=\"key\">의도\u003c/b>와 그에 따른 두 가지 행동이 한 문장 안에 담겨 있습니다. determined to make는 '~하기로 결심한'이라는 뜻으로 주어인 어머니의 상태를 꾸며 주고, traveled와 dipped는 \u003cb class=\"key\">병렬\u003c/b>로 이어지는 동작이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 수식(수동의 의미)\u003c/span> : [명사 Achilles' mother] + , + [determined to ~ (과거분사구/형용사구)] : \"Achilles를 위대한 전사로 만들기로 결심한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 make + 목적어 + 목적격보어(명사)\u003c/span> : make [목적어 Achilles] + [목적격보어 a great warrior] : \"Achilles를 위대한 전사로 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사구 병렬\u003c/span> : [동사 traveled] + and + [동사 dipped] : \"Styx 강으로 가서 … 담갔다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Achilles' mother, Achilles의 어머니는. determined to make Achilles a great warrior, Achilles를 위대한 전사로 만들기로 결심한. traveled to the Styx, Styx 강으로 가서. and dipped her son into the water, 아들을 강물에 담갔다. 이 문장 전체를 해석하면, Achilles를 위대한 전사로 만들기로 결심한 Achilles의 어머니는 Styx 강으로 가서 아들을 강물에 담갔다.","hl":"m"},{"n":22,"text":"이 문장은 Achilles의 어머니가 아들을 불사신으로 만들기 위해 강물에 담근 장면을 설명해요. 앞에서 나온 Styx 강물 이야기가 실제로 어떻게 쓰였는지 보여 주는 대목이죠. determined to make는 ~하기로 결심한이라는 뜻으로 어머니의 의도를 나타내고, traveled와 dipped는 병렬 구조로 이어지는 두 행동이에요.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 과거분사구 determined to make Achilles a great warrior예요. 주어인 Achilles' mother 뒤에 콤마로 이어 붙어서 어머니가 어떤 상태인지 설명해 주는 형용사구 역할을 하죠. 두 번째는 make Achilles a great warrior인데, make가 목적어 Achilles와 목적격보어 a great warrior를 데리고 와서 Achilles를 위대한 전사로 만들다라는 다섯 형식 문장을 만듭니다. 세 번째는 traveled to the Styx and dipped에서 and가 두 동사를 병렬로 묶어 주는 부분이에요. 그래서 어머니가 강으로 갔다는 행동과 아들을 담갔다는 행동이 대등하게 이어진다고 보시면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먼저\u003c/span>\u003cspan class=\"en\">First\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Achilles의 머리가 들어갔고\u003c/span>\u003cspan class=\"en\">Achilles' head went in,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 다음에 가슴과 다리, 발이 들어갔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">then \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">chest, \u003c/span>\u003cspan class=\"tgt\">legs \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">feet\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">먼저 Achilles의 머리가 들어갔고, 그 다음에 가슴과 다리, 발이 들어갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아들을 강물에 담그자 몸이 어떤 순서로 물속에 들어갔는지 아주 구체적으로 그려 주는 문장이에요. 머리부터 담갔다는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">장면\u003c/b>이 뒤에 나올 발뒤꿈치 이야기와 자연스럽게 연결됩니다. 뒤쪽 and then 이하에서는 went in이 \u003cb class=\"key\">반복 \u003c/b>\u003cb class=\"key\">생략\u003c/b>되어 문장이 간결해졌어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">반복 어구의 생략(동사구 생략)\u003c/span> : [and then] + [주어 his chest, legs and feet] + (동사 went in 생략) : \"그 다음에 가슴과 다리, 발이 (들어갔다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사의 병렬 구조(A, B and C)\u003c/span> : [chest], [legs] and [feet] : \"가슴과 다리, 발\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"First, 먼저. Achilles' head went in, Achilles의 머리가 들어갔고. and then his chest, legs and feet, 그 다음에 가슴과 다리, 발이 들어갔다. 이 문장 전체를 해석하면, 먼저 Achilles의 머리가 들어갔고, 그 다음에 가슴과 다리, 발이 들어갔다.","hl":"m"},{"n":25,"text":"어머니가 아들을 강물에 담그자 몸이 어떤 순서로 물에 들어갔는지 아주 구체적으로 그려 주는 문장이에요. 머리부터 담갔다는 구체적 장면이 뒤에 나올 발뒤꿈치 이야기와 자연스럽게 이어지죠. and then 뒤에서는 went in이 반복 생략되어 문장이 짧아졌어요.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 and then his chest, legs and feet에서 동사구가 통째로 생략된 부분이에요. 앞의 went in이 반복되니까 굳이 다시 쓰지 않고 주어만 남겨 둔 반복 생략이죠. 두 번째는 chest, legs and feet라는 명사의 병렬 구조예요. A, B and C 형태로 마지막 앞에만 and를 붙여 세 가지를 같은 자격으로 묶어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강물이\u003c/span>\u003cspan class=\"en\">The river's water\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 몸의 모든 부분을 적셨다\u003c/span>\u003cspan class=\"en\">washed over every part of his body\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발뒤꿈치만 빼고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">except \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">heel \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄마의 손이 덮고 있었던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">mother's \u003c/span>\u003cspan class=\"tgt\">hand \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">covered\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">엄마의 손이 덮고 있었던 발뒤꿈치만 빼고 강물이 그의 온몸을 적셨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 강물이 온몸을 적셨지만 어머니의 손이 붙잡고 있던 발뒤꿈치만은 물이 닿지 않았다는 것을 말해요. 바로 이 \u003cb class=\"key\">예외\u003c/b> 하나가 뒤에 나오는 Achilles의 죽음으로 이어지는 결정적 원인이 됩니다. except와 목적격 관계대명사가 생략된 절이 겹쳐 있어서 해석할 때 수식 순서를 잘 잡아야 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 except(제외)\u003c/span> : every part of his body + [except + 명사 the heel] : \"발뒤꿈치만 빼고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 which/that의 생략\u003c/span> : [선행사 the heel] + (which/that) + [주어 his mother's hand] + [동사 had covered] : \"엄마의 손이 덮고 있었던 발뒤꿈치\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거완료 had + p.p.\u003c/span> : had + [과거분사 covered] : \"(그 전에) 덮고 있었다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The river's water, 강물이. washed over every part of his body, 그의 몸의 모든 부분을 적셨다. except the heel, 발뒤꿈치만 빼고. his mother's hand had covered, 엄마의 손이 덮고 있었던. 이 문장 전체를 해석하면, 엄마의 손이 덮고 있었던 발뒤꿈치만 빼고 강물이 그의 온몸을 적셨다.","hl":"m"},{"n":28,"text":"강물이 온몸을 적셨지만 어머니의 손이 붙잡고 있던 발뒤꿈치만은 물이 닿지 않았다는 걸 말해요. 바로 이 예외 하나가 뒤에 나오는 Achilles의 죽음으로 이어지는 결정적 원인이 되죠. except와 목적격 관계대명사가 생략된 절이 겹쳐 있어서 해석할 때 수식 순서를 잘 잡아야 합니다.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 전치사 except예요. every part of his body 다음에 붙어서 발뒤꿈치만 빼고라는 예외를 만들어 줍니다. 두 번째는 the heel his mother's hand had covered에서 목적격 관계대명사 which나 that이 생략된 자리예요. 선행사 the heel 바로 뒤에 주어 his mother's hand와 동사 had covered가 이어지니까 관계사절이 통째로 발뒤꿈치를 꾸민다고 보면 됩니다. 세 번째는 과거완료 had covered인데, 강물이 적시기보다 더 앞선 시점에 손이 덮고 있었음을 보여 주는 대과거 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">Thus,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Achilles의 발뒤꿈치는 그의 약점이 되었고,\u003c/span>\u003cspan class=\"en\">Achilles' heel \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">weak \u003c/span>\u003cspan class=\"tgt\">spot\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 후에 초래했고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">later \u003c/span>\u003cspan class=\"tgt\">brought \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 죽음을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">death\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">트로이 전쟁에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Trojan \u003c/span>\u003cspan class=\"tgt\">War\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 Achilles의 발뒤꿈치는 그의 약점이 되었고, 후에 트로이 전쟁에서 그를 숨지게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Achilles의 발뒤꿈치가 \u003cb class=\"key\">약점\u003c/b>이 되어 결국 트로이 전쟁에서 그의 죽음을 초래했다는 인과를 정리해요. 앞의 weak spot을 which가 받아 '그것이 후에 그의 죽음을 초래했다'고 이어 주는 구조예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 become + 주격보어\u003c/span> : become + [명사] = ~이 되다 : \"그의 약점이 되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">계속적 용법의 관계대명사 which\u003c/span> : [선행사], which + [동사] ~ = 그리고 그것은 ~하다 : \"그것은 후에 그의 죽음을 초래했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 수식\u003c/span> : [명사] + in the Trojan War = 트로이 전쟁에서 : \"트로이 전쟁에서\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Thus, 그래서. Achilles' heel became his weak spot, Achilles의 발뒤꿈치는 그의 약점이 되었고. which later brought about, 그것은 후에 초래했고. his death, 그의 죽음을. in the Trojan War, 트로이 전쟁에서.. 이 문장 전체를 해석하면, 그래서 Achilles의 발뒤꿈치는 그의 약점이 되었고, 후에 트로이 전쟁에서 그를 숨지게 했다.","hl":"m"},{"n":31,"text":"이 문장은 Achilles의 발뒤꿈치가 약점이 되어 결국 트로이 전쟁에서 그의 죽음을 초래했다는 인과를 정리해요. 앞의 weak spot을 which가 받아 그것이 후에 그의 죽음을 초래했다고 이어 주는 구조예요.","hl":"mn"},{"n":32,"text":"첫 번째로 became his weak spot에서 became은 '되다'라는 뜻의 동사이고 뒤의 his weak spot은 주어의 상태를 설명하는 주격보어예요. 두 번째로 which later brought about his death에서 which는 앞의 his weak spot을 받는 관계대명사이고, 여기서는 계속적 용법으로 쓰였어요. 세 번째로 in the Trojan War는 앞의 death가 일어난 상황을 꾸미는 전치사구예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리하여\u003c/span>\u003cspan class=\"en\">Thus,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">널리 쓰이는 관용어가\u003c/span>\u003cspan class=\"en\">a popular idiom,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제 나타내는 데 쓰이는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">describe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람의 최대 약점을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">person's \u003c/span>\u003cspan class=\"tgt\">weakest \u003c/span>\u003cspan class=\"tgt\">point\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생겨났는데:\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">invented\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로 “Achilles의 발뒤꿈치”이다.\u003c/span>\u003cspan class=\"en\">&quot;Achilles' heel.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리하여 오늘날 어떤 사람의 최대 약점을 나타내는 데 널리 쓰이는 관용어가 생겨났는데 바로 “Achilles의 발뒤꿈치”이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 설명한 이야기가 오늘날 \u003cb class=\"key\">Achilles' \u003c/b>\u003cb class=\"key\">heel\u003c/b>이라는 \u003cb class=\"key\">관용어\u003c/b>로 굳어졌다는 결론을 제시해요. \u003cb class=\"key\">popular \u003c/b>\u003cb class=\"key\">idiom\u003c/b>은 널리 쓰이는 관용어, weakest point는 가장 약한 부분이라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치 수식\u003c/span> : [명사], + [과거분사구] = ~된/쓰이는 [명사] : \"이제 어떤 사람의 최대 약점을 나타내는 데 쓰이는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be + [과거분사] = ~되다, 생겨나다 : \"생겨났다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Thus, 그리하여. a popular idiom, 널리 쓰이는 관용어가. now used to describe, 이제 나타내는 데 쓰이는. a person's weakest point, 어떤 사람의 최대 약점을. was invented, 생겨났는데:. \"Achilles' heel.\", 바로 “Achilles의 발뒤꿈치”이다.. 이 문장 전체를 해석하면, 그리하여 오늘날 어떤 사람의 최대 약점을 나타내는 데 널리 쓰이는 관용어가 생겨났는데 바로 “Achilles의 발뒤꿈치”이다.","hl":"m"},{"n":34,"text":"이 문장은 앞에서 설명한 이야기가 오늘날 Achilles' heel이라는 관용어로 굳어졌다는 결론을 제시해요. popular idiom은 널리 쓰이는 관용어, weakest point는 가장 약한 부분이라는 뜻이에요.","hl":"mn"},{"n":35,"text":"첫 번째로 now used to describe a person's weakest point에서 now used는 앞의 a popular idiom을 뒤에서 꾸며 주는 과거분사구예요. idiom이 사람들에 의해 쓰이는 대상이므로 수동의 의미가 나요. 두 번째로 was invented는 be동사와 과거분사가 결합한 수동태로, 관용어가 만들어진 것, 즉 생겨난 것을 표현해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>처음에는 완벽해 보이는 것도 파멸을 초래하는 \u003cb class=\"key\">치명적인 \u003c/b>\u003cb class=\"key\">약점\u003c/b>을 가질 수 있다.\u003c/li>\u003cli>그리스 전설 속 \u003cb class=\"key\">Achilles\u003c/b>는 Styx 강물에 담겨 온몸이 보호받았지만 발뒤꿈치만은 예외였다.\u003c/li>\u003cli>어머니의 손이 덮었던 \u003cb class=\"key\">발뒤꿈치\u003c/b>가 그의 약점이 되어 트로이 전쟁에서 죽음에 이르게 했다.\u003c/li>\u003cli>이 이야기에서 사람의 최대 약점을 뜻하는 관용어 \u003cb class=\"key\">Achilles' \u003c/b>\u003cb class=\"key\">heel\u003c/b>이 생겨났다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Even something that seems perfect at first can have a fatal weakness that leads to its downfall, as shown by the story of Achilles' heel.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">처음에는 완벽해 보이는 것도 파멸을 초래하는 \u003cb class=\"key\">치명적인 \u003c/b>\u003cb class=\"key\">약점\u003c/b>을 가질 수 있다. 그 대표적 예가 \u003cb class=\"key\">Achilles\u003c/b>의 발뒤꿈치이며, 여기서 사람의 최대 약점을 뜻하는 관용어 \u003cb class=\"key\">Achilles' \u003c/b>\u003cb class=\"key\">heel\u003c/b>이 생겨났다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 글은 완벽해 보이는 것일수록 숨은 약점을 살펴야 한다는 교훈을 줍니다. Achilles의 발뒤꿈치 이야기가 Achilles' heel이라는 관용어로 이어지는 흐름을 꼭 기억해 주세요. 처음에는 완벽해 보여도 치명적인 약점이 파멸을 부를 수 있다는 점이 핵심이에요. 오늘도 수고 많았고, 다음 강의에서 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
