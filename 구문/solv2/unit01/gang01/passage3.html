</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"1강 reading3","audioDir":"passage3_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">1강\u003cbr>3번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>The Natural Next Step: The Key to Successful Risk Taking\u003c/h1>\u003ch2>자연스러운 다음 단계가 성공적인 위험 감수의 핵심\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>위험 부담이 있는 일을 성공적으로 해내는 핵심은 최종 결과가 아니라 \u003cb class=\"key\">자연스러운 \u003c/b>\u003cb class=\"key\">다음 \u003c/b>\u003cb class=\"key\">단계\u003c/b>를 이해하는 것이다. 스키에서도 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">모굴\u003c/b>부터 하나씩 해내는 사람이 결국 남들이 \u003cb class=\"key\">불가능\u003c/b>하다고 여긴 산의 아래에 도달한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The key to successful risk taking is to focus on the natural next step rather than on the end result.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 위험을 감수하는 일, 즉 risk taking에 관한 글이에요. 겁이 나는 상황에서 결과만 보는 사람과 다음 한 걸음을 보는 사람이 어떻게 달라지는지를 스키 이야기로 풀어내고 있죠. 요약하면 성공적인 risk taking의 핵심은 최종 결과가 아니라 자연스러운 다음 단계를 이해하는 것이에요. 자, 그럼 차근차근 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">risk taking은 실패할 가능성을 알면서도 선택을 감수하는 일을 말해요. 사람들은 위험이 크다고 느끼면 대개 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">결과\u003c/b>부터 상상하고, 그 결과가 무서우면 시작조차 하지 않죠. 심리학에서는 큰 과제를 작은 단위로 쪼개는 이 방식을 chunking이라고 불러요. 스키에서 mogul은 슬로프에 쌓인 눈 언덕을 뜻하는데, 모굴이 많은 코스는 한 번에 내려가려 하면 훨씬 무섭게 느껴져요. 등산할 때도 정상만 올려다보면 지치지만 발밑 한 걸음만 보면 어느새 꼭대기에 서 있잖아요. 이 비유를 떠올리면 \u003cb class=\"key\">다음 \u003c/b>\u003cb class=\"key\">단계\u003c/b>에 집중하라는 지문의 주장이 훨씬 쉽게 와닿을 거예요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. risk taking은 실패할 가능성을 알면서도 선택을 감수하는 일을 말해요. 사람들은 위험이 크다고 느끼면 대개 최종 결과부터 상상하고, 그 결과가 무서우면 시작조차 하지 않죠. 심리학에서는 이렇게 큰 과제를 작은 단위로 쪼개는 것을 chunking이라고 불러요. 스키에서 mogul은 슬로프에 쌓인 눈 언덕을 뜻하는데, 모굴이 많은 코스는 한 번에 내려가려 하면 훨씬 무섭게 느껴져요. 등산할 때도 정상만 올려다보면 지치지만 발밑 한 걸음만 보면 어느새 꼭대기에 서 있잖아요. 이 비유를 떠올리면 다음 단계에 집중하라는 지문의 주장이 훨씬 쉽게 와닿을 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>핵심 주장\u003csmall>주장 · 문장 1\u003c/small>\u003c/h4>\u003cp>위험을 감수하는 일의 성공 비결은 결과가 아니라 \u003cb class=\"key\">다음 \u003c/b>\u003cb class=\"key\">단계\u003c/b>에 있다는 주장이에요. 자신이 취하는 행동이 지금 상황에서 \u003cb class=\"key\">자연스러운 \u003c/b>\u003cb class=\"key\">다음 \u003c/b>\u003cb class=\"key\">단계\u003c/b>인지 따져 보라는 것이죠. 즉 위험은 도박이 아니라 순서 있는 진행이라는 관점을 먼저 잡아 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>흔한 실수\u003csmall>통념 · 문장 2\u003c/small>\u003c/h4>\u003cp>위험 상황을 마주하면 우리는 대개 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">결과\u003c/b>부터 떠올려요. 그 결과가 얼마나 크고 무서운지에 \u003cb class=\"key\">초점\u003c/b>을 맞추는 경향이 있다는 것이죠. 문제는 이 습관이 시작조차 못 하게 만든다는 점이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>포기하는 스키어\u003csmall>반례 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>자신 없는 스키어들은 \u003cb class=\"key\">고난도 \u003c/b>\u003cb class=\"key\">슬로프\u003c/b> 끝에서 바닥까지만 내려다봐요. 전체 길이 한꺼번에 보이니 \u003cb class=\"key\">가파름\u003c/b>만 크게 느껴지는 거죠. 결국 시도하기에 너무 가파르다고 \u003cb class=\"key\">결정\u003c/b>하고는 출발하지 않습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>해내는 스키어\u003csmall>예시 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>해보기로 마음먹은 이들은 초점을 바꿔서 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">모굴\u003c/b>을 어떻게 통과할지부터 \u003cb class=\"key\">분석\u003c/b>해요. 거기에 도달하면 다음 모굴로 넘어가죠. 그렇게 코스 전반을 지나면 남들이 \u003cb class=\"key\">불가능\u003c/b>하다고 여긴 산의 아래에 도달하게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 주장이에요. 위험을 감수하는 일의 성공 비결은 결과가 아니라 다음 단계에 있다는 거죠. 내가 하려는 행동이 지금 상황에서 자연스러운 다음 단계인지 따져 보라는 말이에요. 그래서 위험은 도박이 아니라 순서 있는 진행이라는 관점을 잡아 두면 좋아요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 흔한 실수예요. 위험 상황을 마주하면 우리는 대개 최종 결과부터 떠올려요. 그 결과가 얼마나 크고 무서운지에 초점을 맞추는 경향이 있죠. 문제는 이 습관이 시작조차 못 하게 만든다는 점이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 포기하는 스키어 이야기예요. 자신 없는 스키어들은 고난도 슬로프 끝에서 바닥까지만 내려다봐요. 전체 길이가 한꺼번에 보이니까 가파름만 크게 느껴지는 거죠. 결국 시도하기에 너무 가파르다고 결정하고는 출발하지 않아요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 해내는 스키어 이야기예요. 해보기로 마음먹은 이들은 초점을 바꿔서 첫 번째 모굴을 어떻게 통과할지부터 분석해요. 거기에 도달하면 다음 모굴로 넘어가고, 그렇게 코스 전반을 지나면 남들이 불가능하다고 여긴 산의 아래에 도달하게 되죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-예시(대조 사례)\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">주제문\u003c/b>을 먼저 던지고 뒤에서 사례로 확인시켜 주는 두괄식 구조예요. 두 번째 문장에서 흔한 실수를 꺼낸 뒤, 스키어 사례를 실패와 성공으로 나란히 놓아 \u003cb class=\"key\">대조\u003c/b>를 만들어요. 서로 반대되는 두 사례가 \u003cb class=\"key\">주장\u003c/b>을 더 선명하게 뒷받침하는 방식이죠. 그래서 주제문은 첫 번째 문장이고, 나머지는 모두 예시에 해당합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One of the mistakes (2)\u003c/b>\u003cspan>흔한 실수(통념) 제시\u003c/span>\u003cb>The ones that (5)\u003c/b>\u003cspan>실패 사례와 대조되는 성공 사례로 전환\u003c/span>\u003cb>Once (6)\u003c/b>\u003cspan>첫 단계 이후 다음 단계로 이어지는 계기 표시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the natural next step\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the first step\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the next mogul\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>최종 결과에 집중하는 태도\u003c/th>\u003cth>다음 단계에 집중하는 태도\u003c/th>\u003c/tr>\u003ctr>\u003ctd>슬로프 바닥까지 한꺼번에 내려다봄\u003c/td>\u003ctd>눈앞의 첫 번째 모굴만 바라봄\u003c/td>\u003c/tr>\u003ctr>\u003ctd>너무 가파르다며 시도를 포기함\u003c/td>\u003ctd>한 단계씩 해내고 결국 도달함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장을 먼저 던지고 대조되는 두 사례로 뒷받침하는 전개 방식이에요. 첫 번째 문장에서 핵심 주장을 먼저 제시하고, 뒤에서 스키어 사례를 통해 확인시켜 주니까 두괄식 구조죠. 결과에 집중하는 사람과 단계에 집중하는 사람을 나란히 놓아서 주장이 훨씬 선명해져요. 그래서 주제문은 첫 번째 문장이고, 나머지 문장은 모두 예시에 해당한다고 정리하면 됩니다.","hl":"ty"},{"n":9,"text":"신호어도 꼭 눈여겨보세요. 두 번째 문장의 One of the mistakes는 우리가 흔히 저지르는 실수를 꺼내는 표현이에요. 다섯 번째 문장의 The ones that은 앞에서 나온 실패한 스키어들과 대비되는 성공한 사람들을 소개하는 전환점이죠. 마지막 문장의 Once는 첫 단계를 해낸 뒤 다음 단계로 넘어가는 계기를 알려 줘요. 그리고 the natural next step, the first step, the next mogul이라는 표현이 같은 개념을 계속 바꿔 말하고 있다는 점도 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>key to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 핵심, 열쇠\u003c/span>\u003c/div>\u003cdiv>\u003cb>risk taking\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위험을 감수함, 위험 부담\u003c/span>\u003c/div>\u003cdiv>\u003cb>natural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자연스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>next step\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다음 단계\u003c/span>\u003c/div>\u003cdiv>\u003cb>mistake\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실수\u003c/span>\u003c/div>\u003cdiv>\u003cb>confront\u003c/b>\u003cem>동사\u003c/em>\u003cspan>마주하다, 직면하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>risk situation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위험 상황\u003c/span>\u003c/div>\u003cdiv>\u003cb>tendency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경향, 성향\u003c/span>\u003c/div>\u003cdiv>\u003cb>focus on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 초점을 맞추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>end result\u003c/b>\u003cem>명사\u003c/em>\u003cspan>최종 결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>be unsure of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 자신이 없다\u003c/span>\u003c/div>\u003cdiv>\u003cb>edge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>끝, 가장자리\u003c/span>\u003c/div>\u003cdiv>\u003cb>slope\u003c/b>\u003cem>명사\u003c/em>\u003cspan>슬로프, 경사면\u003c/span>\u003c/div>\u003cdiv>\u003cb>all the way down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>저 아래 끝까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>determine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다, 판단하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>steep\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가파른\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하기로 마음먹다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make it\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>해내다, 성공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>change\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바꾸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>analyze\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분석하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>master\u003c/b>\u003cem>동사\u003c/em>\u003cspan>완수하다, 통달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>first step\u003c/b>\u003cem>명사\u003c/em>\u003cspan>첫 단계\u003c/span>\u003c/div>\u003cdiv>\u003cb>get through\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>통과하다, 지나가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mogul\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모굴(스키 코스의 눈 언덕)\u003c/span>\u003c/div>\u003cdiv>\u003cb>hill\u003c/b>\u003cem>명사\u003c/em>\u003cspan>언덕, 비탈\u003c/span>\u003c/div>\u003cdiv>\u003cb>once\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>일단 ~하면\u003c/span>\u003c/div>\u003cdiv>\u003cb>concentrate on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 집중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>over the course of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~동안에, ~전반에 걸쳐\u003c/span>\u003c/div>\u003cdiv>\u003cb>end up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결국 ~하게 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>impossible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불가능한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어는 몇 개만 짚고 갈게요. confront는 위험 상황을 마주한다는 뜻이고, tendency는 어떤 쪽으로 기우는 경향을 말해요. steep은 가파른, determine은 판단해서 결정한다는 뜻이니 꼭 챙겨 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">confront\u003c/b>\u003cspan class=\"m\">마주하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">face\u003c/span>\u003cspan class=\"s\">encounter\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">avoid\u003c/span>\u003cspan class=\"a\">evade\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">tendency\u003c/b>\u003cspan class=\"m\">경향\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inclination\u003c/span>\u003cspan class=\"s\">leaning\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disinclination\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">determine\u003c/b>\u003cspan class=\"m\">결정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decide\u003c/span>\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hesitate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">steep\u003c/b>\u003cspan class=\"m\">가파른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sharp\u003c/span>\u003cspan class=\"s\">abrupt\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">gentle\u003c/span>\u003cspan class=\"a\">gradual\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">concentrate on\u003c/b>\u003cspan class=\"m\">~에 집중하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">focus on\u003c/span>\u003cspan class=\"s\">pay attention to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">impossible\u003c/b>\u003cspan class=\"m\">불가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unattainable\u003c/span>\u003cspan class=\"s\">hopeless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">possible\u003c/span>\u003cspan class=\"a\">feasible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mistake\u003c/b>\u003cspan class=\"m\">실수\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">error\u003c/span>\u003cspan class=\"s\">blunder\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accuracy\u003c/span>\u003cspan class=\"a\">correctness\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 정리해 볼게요. confront는 face, encounter와 비슷하고 avoid, evade와 반대예요. tendency는 inclination, leaning과 가깝고, determine은 decide, resolve와 비슷하죠. steep은 sharp, abrupt와 통하고 gentle, gradual과 반대예요. concentrate on은 focus on, pay attention to와 같고 ignore, neglect와 반대라는 점도 함께 외워 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">성공적인 위험 부담의 핵심은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">key \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">successful \u003c/span>\u003cspan class=\"tgt\">risk \u003c/span>\u003cspan class=\"tgt\">taking\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이해하는 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 취하는 행동이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">actions \u003c/span>\u003cspan class=\"tgt\">you're \u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연스러운 다음 단계여야 한다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">natural \u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">step\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">위험 부담이 있는 일을 성공적으로 해내는 것의 핵심은, 당신이 취하는 행동이 자연스러운 다음 단계인지를 이해하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 이끌어 가는 \u003cb class=\"key\">주제문\u003c/b>이에요. 위험을 감수하고 도전할 때 성공을 가르는 것은 최종 결과가 아니라 지금 하는 행동이 \u003cb class=\"key\">자연스러운 \u003c/b>\u003cb class=\"key\">다음 \u003c/b>\u003cb class=\"key\">단계\u003c/b>인지에 달려 있다는 뜻이죠. 'risk taking'은 위험을 무릅쓰고 도전하는 행위, 'the natural next step'은 억지로 뛰어넘는 것이 아니라 흐름상 당연히 이어지는 바로 다음 걸음이라는 비유예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 to + 동명사\u003c/span> : the key [to + 명사/동명사] = '~의 핵심' : \"성공적인 위험 부담의 핵심은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be to부정사(명사적 보어)\u003c/span> : 주어(The key) + be동사(is) + [to부정사(보어)] : \"이해하는 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절(목적어)\u003c/span> : understand + [that + 주어 + 동사 ~] : \"당신이 취하는 행동이 자연스러운 다음 단계여야 한다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사 the actions] + (which/that 생략) + [주어 you + 동사 are taking] : \"당신이 취하는 행동\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The key to successful risk taking, 성공적인 위험 부담의 핵심은. is to understand, 이해하는 것이다. that the actions you're taking, 당신이 취하는 행동이. should be the natural next step, 자연스러운 다음 단계여야 한다는 것을. 이 문장 전체를 해석하면, 위험 부담이 있는 일을 성공적으로 해내는 것의 핵심은, 당신이 취하는 행동이 자연스러운 다음 단계인지를 이해하는 것이다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 주제문이에요. 위험 부담을 성공으로 이끄는 핵심은 최종 결과가 아니라 자연스러운 다음 단계를 이해하는 것이라는 거죠. 그래서 뒤에 나오는 스키 이야기도 결과가 아니라 한 단계씩 보는 방향으로 이어집니다.","hl":"mn"},{"n":14,"text":"첫 번째, The key to successful risk taking에서 to는 부정사가 아니라 전치사예요. 그래서 뒤에 동명사 risk taking이 온 거죠. 두 번째, is to understand는 be동사 뒤에 to부정사가 와서 주격 보어 역할을 하는 형태로, 해석은 이해하는 것이다가 됩니다. 세 번째, that절은 understand의 목적어로 쓰인 명사절이에요. 네 번째, the actions you're taking은 목적격 관계대명사가 생략된 구조로, 당신이 취하는 행동이라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 흔히 저지르는 실수 중 하나는\u003c/span>\u003cspan class=\"en\">One of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mistakes \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위험 상황을 마주할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">confronting \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">risk \u003c/span>\u003cspan class=\"tgt\">situation\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경향을 가지는 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">tendency \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최종 결과에 초점을 맞추는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">focus \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">end \u003c/span>\u003cspan class=\"tgt\">result\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">위험 상황을 마주할 때 우리가 흔히 저지르는 실수 중 하나는, 최종 결과에 초점을 맞추는 경향이 있다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 주제를 사람들의 \u003cb class=\"key\">실수\u003c/b> 쪽에서 다시 짚어 주는 문장이에요. 위험한 상황을 만나면 우리는 과정이 아니라 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">결과\u003c/b>만 먼저 바라보는 \u003cb class=\"key\">경향\u003c/b>이 있다는 뜻이죠. 'the end result'는 맨 끝의 결승점만 보는 태도를 가리키고, 이 실수가 다음 문장의 스키 예시로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사 the mistakes] + (which 생략) + [주어 we + 동사 make] : \"우리가 흔히 저지르는 실수\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 when + 분사구문\u003c/span> : when + [현재분사 ~ing] (주절과 같은 주어 we 생략) : \"위험 상황을 마주할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사 주격 보어와 수 일치\u003c/span> : 주어(One of the mistakes) + is + [having(동명사 보어)] : \"경향을 가지는 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 the tendency] + to + [동사원형 focus] : \"최종 결과에 초점을 맞추는 경향\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"One of the mistakes we often make, 우리가 흔히 저지르는 실수 중 하나는. when confronting a risk situation, 위험 상황을 마주할 때. is having the tendency, 경향을 가지는 것이다. to focus on the end result, 최종 결과에 초점을 맞추는. 이 문장 전체를 해석하면, 위험 상황을 마주할 때 우리가 흔히 저지르는 실수 중 하나는, 최종 결과에 초점을 맞추는 경향이 있다는 것이다.","hl":"m"},{"n":16,"text":"앞 문장에서 말한 핵심을 사람들의 실수 쪽에서 다시 짚어 주는 문장이에요. 위험한 상황을 만나면 우리는 과정이 아니라 최종 결과만 먼저 바라보는 경향이 있다는 거죠. 이 실수가 바로 다음에 나오는 스키 타는 사람들의 예시로 이어집니다.","hl":"mn"},{"n":17,"text":"먼저 the mistakes we often make는 목적격 관계대명사가 생략된 구조예요. 우리가 흔히 저지르는 실수라고 해석하죠. 두 번째, when confronting a risk situation은 주어가 주절과 같아서 줄여 쓴 분사구문이고, when이 붙어서 시간의 의미를 살려 줍니다. 세 번째, 주어의 중심어가 단수 One이라서 be동사는 is를 쓰고, 뒤에 오는 having은 주격 보어 동명사예요. 네 번째, the tendency to focus on the end result에서 to부정사는 앞의 명사를 꾸며 주는 형용사적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스키를 탈 때 자신 없어 하는 사람들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Skiers \u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">unsure \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">themselves\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흔히 이렇게 한다\u003c/span>\u003cspan class=\"en\">often \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">this\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">스키를 탈 때 자신 없어 하는 사람들이 흔히 이렇다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 \u003cb class=\"key\">실수\u003c/b>를 구체적인 장면으로 옮겨 오는 문장이에요. 'Skiers'는 스키 타는 사람들이고, 'this'는 바로 앞의 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">결과\u003c/b>에 초점을 맞추는 행동을 가리킵니다. 짧은 문장이지만 일반적인 이야기를 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>로 넘겨 주는 다리 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 Skiers] + who + [be동사 are + 형용사 unsure] : \"자신 없어 하는 스키 타는 사람들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대동사 do\u003c/span> : do + this (앞 내용을 받는 지시어) : \"이렇게 한다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Skiers who are unsure of themselves, 스키를 탈 때 자신 없어 하는 사람들은. often do this, 흔히 이렇게 한다. 이 문장 전체를 해석하면, 스키를 탈 때 자신 없어 하는 사람들이 흔히 이렇다.","hl":"m"},{"n":19,"text":"앞에서 말한 실수를 구체적인 장면으로 옮겨 오는 문장이에요. 자신 없어 하는 스키 타는 사람들이 바로 그 실수를 한다는 거죠. this가 가리키는 것은 최종 결과에 초점을 맞추는 행동이고, 이 문장이 뒤에 나오는 두 종류의 스키어 이야기로 넘어가는 다리 역할을 합니다.","hl":"mn"},{"n":20,"text":"첫 번째, Skiers who are unsure of themselves에서 who는 앞의 선행사 Skiers를 꾸며 주는 주격 관계대명사예요. be unsure of oneself는 자신이 없다라는 뜻의 덩어리 표현으로 기억해 두세요. 두 번째, often do this에서 do는 앞 문장의 동작을 대신 받는 대동사이고, this는 앞 내용을 가리키는 지시어입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 고난도 슬로프의 끝에 가서\u003c/span>\u003cspan class=\"en\">They'll \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">edge \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003cspan class=\"tgt\">slope, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저 아래 바닥까지 이르는 길을 보고는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">down \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bottom, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 결정짓는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">determine\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 슬로프가 너무 가파르다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">slope \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">steep \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 시도하기에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">try\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 고난도 슬로프의 끝에 가서 저 아래 바닥까지 이르는 길을 보고는 이 슬로프가 시도하기에 너무 가파르다고 결정짓는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자신감 없는 스키어들이 위험을 만났을 때 실패하는 방식을 그대로 보여 주는 문장입니다. 이들은 \u003cb class=\"key\">결과\u003c/b>인 바닥부터 훑어보기 때문에 \u003cb class=\"key\">난이도\u003c/b>를 판단하는 기준 자체를 잘못 잡고 맙니다. 'too ~ to'는 '~하기에 너무 ~하다'로, \u003cb class=\"key\">시도\u003c/b>조차 못 하게 만드는 심리적 부담을 담아냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 병렬 구조(and로 연결된 세 동사)\u003c/span> : [주어 They] + [will] + go ~ , look ~ , and determine ~ : \"가서, 보고는, 결정짓는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : determine [that + 주어 + 동사 + 보어] : \"이 슬로프가 너무 가파르다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">too ~ to부정사 구문(부정 의미)\u003c/span> : too + [형용사 steep] + for + [목적격 them] + to + [동사원형 try] : \"그들이 시도하기에 너무 가파른\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They'll go to the edge of a difficult slope, 그들은 고난도 슬로프의 끝에 가서. look all the way down to the bottom, 저 아래 바닥까지 이르는 길을 보고는. and determine, 그리고 결정짓는다. that the slope is too steep, 이 슬로프가 너무 가파르다고. for them to try, 그들이 시도하기에. 이 문장 전체를 해석하면, 그들은 고난도 슬로프의 끝에 가서 저 아래 바닥까지 이르는 길을 보고는 이 슬로프가 시도하기에 너무 가파르다고 결정짓는다.","hl":"m"},{"n":22,"text":"이 문장은 자신감 없는 스키어들이 위험을 만났을 때 실패하는 방식을 아주 선명하게 보여 줘요. 이들은 결과부터 보기 때문에 난이도를 판단하는 기준을 잘못 잡고 맙니다. 시도하기에 너무 가파르다는 부담이 결정을 막아 버리는 거죠.","hl":"mn"},{"n":23,"text":"먼저 go, look, determine 세 동사가 and로 병렬 연결되어 한 사람의 연속 동작을 이룬다는 점을 잡아 주세요. 두 번째로 determine 뒤의 that은 목적어절을 이끄는 접속사예요. 세 번째로 too steep for them to try는 too 형용사 for 목적격 to 동사원형 형태로, 시도하기에 너무 가파르다는 뜻을 만듭니다. 여기서 for them이 to try의 의미상 주어라는 것도 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해보기로 마음먹은 이들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">ones \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">decide \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초점을 바꾼다\u003c/span>\u003cspan class=\"en\">change their focus\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분석함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">analyzing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을 해야 하는가를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫 단계를 완수하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">master \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">step\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경사면의 첫 번째 모굴을 통과하는 것과 같은\u003c/span>\u003cspan class=\"en\">like getting through the first mogul on the hill.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">해보기로 마음먹은 이들은 경사면의 첫 번째 모굴을 어떻게 통과할 것인가와 같은 첫 단계를 완수하기 위해 무엇을 해야 하는가를 분석함으로써 초점을 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여기서 갈리는 지점은 목표가 아니라 \u003cb class=\"key\">초점\u003c/b>입니다. 해보기로 마음먹은 이들은 결승점 대신 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">단계\u003c/b>를 어떻게 해낼지를 분석하죠. 'like getting through ~'는 앞의 first step을 구체적으로 풀어 주는 \u003cb class=\"key\">예시\u003c/b> 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 The ones] + [관계대명사 that] + [동사 decide] : \"해보기로 마음먹은 이들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단)\u003c/span> : by + [동명사 analyzing] + [목적어절] : \"분석함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복합관계대명사 what이 이끄는 명사절\u003c/span> : analyzing + [what + 주어 they + 동사 need + to do] : \"그들이 해야 할 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [what they need to do] + to + [동사원형 master] + [목적어 the first step] : \"첫 단계를 완수하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The ones that decide to make it, 해보기로 마음먹은 이들은. change their focus, 초점을 바꾼다. by analyzing, 분석함으로써. what they need to do, 무엇을 해야 하는가를. to master the first step, 첫 단계를 완수하기 위해. like getting through the first mogul on the hill, 경사면의 첫 번째 모굴을 통과하는 것과 같은. 이 문장 전체를 해석하면, 해보기로 마음먹은 이들은 경사면의 첫 번째 모굴을 어떻게 통과할 것인가와 같은 첫 단계를 완수하기 위해 무엇을 해야 하는가를 분석함으로써 초점을 바꾼다.","hl":"m"},{"n":25,"text":"여기서 갈리는 지점은 목표가 아니라 초점이에요. 해보기로 마음먹은 사람들은 결승점 대신 첫 단계를 어떻게 해낼지를 분석합니다. like getting through 이하는 first step을 구체적으로 풀어 주는 예시라는 점도 꼭 기억해 두세요.","hl":"mn"},{"n":26,"text":"첫 번째로 The ones 뒤의 that은 주격 관계대명사로, 해보기로 마음먹은 이들을 가리킵니다. 두 번째로 by analyzing은 전치사 by 뒤에 동명사가 온 형태로 수단을 나타내요. 세 번째로 what they need to do는 선행사를 포함하는 복합관계대명사 what이 이끄는 목적어절입니다. 네 번째로 to master는 목적을 나타내는 to부정사의 부사적 용법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일단 거기에 도달하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Once \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">there\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 다음 모굴에 집중하고,\u003c/span>\u003cspan class=\"en\">they concentrate on the next mogul,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코스 전반에 대해 그렇게 해서\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">course \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">run\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 결국 아래에 도달한다\u003c/span>\u003cspan class=\"en\">they end up at the bottom\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남들이 불가능한 산이라고 생각했던 곳의\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">others \u003c/span>\u003cspan class=\"tgt\">thought \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">impossible \u003c/span>\u003cspan class=\"tgt\">mountain\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일단 거기에 도달하면 그들은 다음 모굴에 집중하고, 코스 전반에 대해 그렇게 해서 그들은 결국 남들이 불가능한 산이라고 생각했던 곳의 아래에 도달한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 한 단계씩 해내다 보면 남들이 \u003cb class=\"key\">불가능\u003c/b>하다고 여긴 일을 어느새 완주하게 된다는 뜻입니다. 'what others thought was ~'는 다른 사람들의 \u003cb class=\"key\">생각\u003c/b>을 배경에 깔아 성취를 더 크게 부각시켜 주는 장치예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 Once가 이끄는 시간·조건 부사절\u003c/span> : Once + [주어 they] + [동사 get] + [부사 there], + 주절 : \"일단 그들이 거기에 도달하면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 over의 전치사구(부사어)\u003c/span> : over + [the course of the run] : \"코스 전반에 걸쳐\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복합관계대명사 what + 삽입절\u003c/span> : 전치사 of + [what + (others thought) + was + 명사구] : \"남들이 불가능한 산이라고 생각했던 것\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Once they get there, 일단 거기에 도달하면. they concentrate on the next mogul, 그들은 다음 모굴에 집중하고. and over the course of the run, 코스 전반에 대해 그렇게 해서. they end up at the bottom, 그들은 결국 아래에 도달한다. of what others thought was an impossible mountain, 남들이 불가능한 산이라고 생각했던 곳의. 이 문장 전체를 해석하면, 일단 거기에 도달하면 그들은 다음 모굴에 집중하고, 코스 전반에 대해 그렇게 해서 그들은 결국 남들이 불가능한 산이라고 생각했던 곳의 아래에 도달한다.","hl":"m"},{"n":28,"text":"한 단계씩 집중하다 보면 남들이 불가능하다고 여긴 일을 어느새 해내게 된다는 뜻이에요. what others thought was 이하는 다른 사람들의 생각을 배경에 깔아서 성취를 더 크게 부각시켜 줍니다. 결국 위험이라는 산은 한 번에 오르는 게 아니라 한 걸음씩 내려오며 끝내는 거라는 메시지죠.","hl":"mn"},{"n":29,"text":"첫 번째로 Once는 일단 하면이라는 뜻의 접속사로 시간과 조건의 부사절을 이끕니다. 두 번째로 over the course of the run은 전치사 over가 기간을 나타내는 부사어예요. 세 번째로 what others thought was an impossible mountain에서 what은 the thing that에 해당하는 복합관계대명사이고, others thought가 끼어든 삽입 구조라는 점을 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>위험을 감수할 때 성공의 열쇠는 결과가 아니라 \u003cb class=\"key\">자연스러운 \u003c/b>\u003cb class=\"key\">다음 \u003c/b>\u003cb class=\"key\">단계\u003c/b>를 이해하는 것이다.\u003c/li>\u003cli>우리는 위험 상황에서 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">결과\u003c/b>에 초점을 맞추는 경향 때문에 시작조차 못 할 때가 많다.\u003c/li>\u003cli>자신 없는 스키어는 슬로프 전체를 내려다보고 \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">가파르다\u003c/b>고 판단해 포기한다.\u003c/li>\u003cli>해보기로 마음먹은 이들은 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">모굴\u003c/b>부터 하나씩 해내며 결국 \u003cb class=\"key\">불가능\u003c/b>해 보이던 산의 아래에 도달한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The key to successful risk taking is to focus on the natural next step rather than on the end result.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">위험 부담이 있는 일을 성공적으로 해내는 핵심은 최종 결과가 아니라 \u003cb class=\"key\">자연스러운 \u003c/b>\u003cb class=\"key\">다음 \u003c/b>\u003cb class=\"key\">단계\u003c/b>를 이해하는 것이다. 스키에서도 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">모굴\u003c/b>부터 하나씩 해내는 사람이 결국 남들이 \u003cb class=\"key\">불가능\u003c/b>하다고 여긴 산의 아래에 도달한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 글의 핵심은 아주 단순해요. 무서운 결과를 한꺼번에 보지 말고 지금 할 수 있는 자연스러운 다음 단계를 보라는 것이죠. 스키어처럼 첫 번째 모굴부터 하나씩 넘어가면 남들이 불가능하다고 여긴 산도 결국 내려올 수 있어요. 여러분의 공부도 똑같아요. 오늘 배운 흐름과 신호어를 챙겨서 다음 지문에서도 스스로 적용해 보길 바랄게요. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
