</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"1강 reading1","audioDir":"passage1_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">1강\u003cbr>1번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Eat More Chocolate, Save More Forest\u003c/h1>\u003ch2>초콜릿을 더 먹으면 숲이 살아난다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>브라질에서 생계를 위해 대서양림을 벌목하는 사람들에게 \u003cb class=\"key\">코코아 \u003c/b>\u003cb class=\"key\">농장\u003c/b> 일자리를 주면 나무를 베지 않고도 숲과 생계를 함께 지킬 수 있다. 이 계획의 성공은 \u003cb class=\"key\">초콜릿 \u003c/b>\u003cb class=\"key\">수요\u003c/b>의 증가에 달려 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>By employing local people on cocoa farms, we can save both the Atlantic Forest and their livelihoods, and the plan depends on growing global demand for chocolate.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 초콜릿을 더 많이 먹으면 환경을 살릴 수 있다는 아주 흥미로운 이야기예요. 브라질의 대서양림이 벌목되는 문제와, 그 사람들을 코코아 농장에 고용하는 해결책을 담고 있죠. 요약하면 숲과 사람들의 생계를 동시에 지키는 방법이 코코아 재배라는 것이고, 요지는 초콜릿에 대한 전 세계 수요가 늘어야 이 계획이 성공한다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">브라질의 \u003cb class=\"key\">대서양림\u003c/b>은 생물 다양성이 매우 높은 열대우림이에요. 개발도상국에서는 가난한 농민들이 먹고살기 위해 나무를 베고 \u003cb class=\"key\">밀\u003c/b> 같은 환금작물(cash crops)을 심곤 하죠. 이렇게 숲을 농경지로 바꾸는 것을 \u003cb class=\"key\">개간\u003c/b>이라고 해요. 그런데 \u003cb class=\"key\">코코아\u003c/b>는 큰 나무 그늘에서도 잘 자라는 shade-grown 작물이에요. 그래서 나무를 그대로 둔 채 농사를 지을 수 있어 숲과 소득을 동시에 얻을 수 있죠. 이는 우산을 쓴 채 햇빛을 피하는 것과 비슷한데, 다만 \u003cb class=\"key\">소비자 \u003c/b>\u003cb class=\"key\">수요\u003c/b>가 뒷받침되어야 오래 유지돼요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 깔아 볼게요. 브라질의 대서양림은 생물 다양성이 아주 높은 열대우림이에요. 개발도상국에서는 가난한 농민들이 먹고살기 위해 나무를 베고 밀이나 콩 같은 환금작물을 심곤 하죠. 이렇게 숲을 농경지로 바꾸는 것을 개간이라고 해요. 그런데 코코아는 큰 나무 그늘에서도 잘 자라는 shade-grown 작물이라서 나무를 그대로 둔 채 농사를 지을 수 있어요. 우산을 쓴 채 햇빛을 피하는 것처럼 숲과 소득을 동시에 챙기는 방식인데, 다만 소비자 수요가 뒷받침되어야 오래 유지된다는 점을 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>문제 제기와 벌목 실태\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">보존\u003c/b>을 돕는 뜻밖의 방법으로 초콜릿을 더 많이 먹으라고 말하며 시작해요. 이어서 브라질에서 \u003cb class=\"key\">대서양림\u003c/b>이 벌목되고 있다는 구체적인 상황을 제시하죠. 벌목의 주체가 나쁜 사람들이 아니라 가족을 먹여 살릴 돈을 벌기 위해 \u003cb class=\"key\">애쓰는 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>이라는 점이 중요해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>벌목의 이유와 면책\u003csmall>통념 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>사람들은 벌목한 나무를 팔고 베어 낸 땅에 밀 같은 \u003cb class=\"key\">작물\u003c/b>을 재배할 수 있어요. 하지만 글쓴이는 이들에게 \u003cb class=\"key\">잘못\u003c/b>이 없다고 말하죠. 그것이 그들의 유일한 \u003cb class=\"key\">생계 \u003c/b>\u003cb class=\"key\">수단\u003c/b>이기 때문이에요. 여기서 독자는 벌목을 비난하기보다 그 이유를 이해하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>코코아 농장이라는 해결책\u003csmall>해결 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>나무와 생계를 동시에 구하는 방법은 그들을 \u003cb class=\"key\">코코아 \u003c/b>\u003cb class=\"key\">농장\u003c/b>에 고용하는 것이에요. 코코아는 초콜릿의 가장 중요한 \u003cb class=\"key\">원료\u003c/b>인데, 다행히 \u003cb class=\"key\">직사광선\u003c/b> 없이도 자랄 수 있죠. 그래서 숲속의 더 큰 나무 가지 밑에서 잘 자라므로 나무를 전혀 베지 않아도 돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>계획의 성공 조건\u003csmall>조건 · 문장 9\u003c/small>\u003c/h4>\u003cp>마지막 문장은 이 계획의 성공이 \u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">수요\u003c/b>의 증가에 달려 있다고 말해요. 코코아 농장이 계속 유지되려면 사람들이 초콜릿을 많이 사 줘야 한다는 뜻이죠. 결국 소비자의 선택이 \u003cb class=\"key\">숲\u003c/b>을 지키는 힘이 된다는 결론이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 문제를 던지는 부분이에요. 글은 환경 보존을 돕는 뜻밖의 방법으로 초콜릿을 더 많이 먹으라고 말하면서 시작하죠. 이어서 브라질에서 대서양림이 벌목되고 있다는 구체적인 상황이 나와요. 이때 나무를 베는 사람들이 가족을 먹여 살릴 돈을 벌기 위해 애쓰는 사람들이라는 점을 꼭 기억하세요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 벌목의 이유를 설명해요. 사람들은 벌목한 나무를 팔고 베어 낸 땅에 밀 같은 작물을 재배할 수 있죠. 그런데 글쓴이는 이 사람들에게 잘못이 없다고 말해요. 그것이 그들의 유일한 생계 수단이기 때문이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계가 이 글의 핵심인 해결책이에요. 나무와 생계를 동시에 구하는 방법은 그들을 코코아 농장에 고용하는 것이죠. 코코아는 초콜릿을 만드는 가장 중요한 원료인데, 다행히 직사광선 없이도 자랄 수 있어요. 그래서 숲속의 더 큰 나무 가지 밑에서 잘 자라므로 나무를 전혀 베지 않아도 된다는 거예요.","hl":"f2"},{"n":7,"text":"마지막 단계는 조건이에요. 이 계획의 성공은 초콜릿에 대한 전 세계 수요의 증가에 달려 있다고 말하죠. 다시 말해 우리가 초콜릿을 많이 사 줄수록 코코아 농장이 유지되고, 그만큼 숲도 지켜진다는 뜻이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 초콜릿을 더 먹으라는 \u003cb class=\"key\">결론\u003c/b>을 먼저 던지고, 중간에서 브라질의 \u003cb class=\"key\">벌목 \u003c/b>\u003cb class=\"key\">문제\u003c/b>와 코코아 농장이라는 해결책을 차례로 풀어요. 마지막 문장에서는 초콜릿 수요 증가라는 \u003cb class=\"key\">조건\u003c/b>으로 다시 주제를 붙잡죠. 그래서 처음과 끝에서 주제를 되풀이하는 \u003cb class=\"key\">양괄식\u003c/b> 구조로 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>however (4)\u003c/b>\u003cspan>앞의 비난을 뒤집는 전환\u003c/span>\u003cb>One way to (5)\u003c/b>\u003cspan>해결책 제시\u003c/span>\u003cb>Fortunately (7)\u003c/b>\u003cspan>긍정적 근거 제시\u003c/span>\u003cb>so (8)\u003c/b>\u003cspan>결과 제시\u003c/span>\u003cb>But (9)\u003c/b>\u003cspan>조건 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">make money to feed their families\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">means of making a living\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">livelihood of these people\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>벌목과 농경지 개간\u003c/th>\u003cth>코코아 농장 고용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>나무를 베어 밀을 재배\u003c/td>\u003ctd>큰 나무 그늘 아래 코코아 재배\u003c/td>\u003c/tr>\u003ctr>\u003ctd>생계를 위한 단기 선택\u003c/td>\u003ctd>숲과 생계를 동시에 유지\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결의 전개 방식을 따라요. 앞부분에서 대서양림이 벌목되는 문제를 보여 주고, 중반에 코코아 농장이라는 해결책을 제시하죠. 구조를 보면 첫 번째 문장에서 초콜릿을 더 먹으라는 결론을 먼저 던지고, 마지막 문장에서 초콜릿 수요 증가라는 조건으로 다시 주제를 붙잡아요. 그래서 처음과 끝에서 주제를 되풀이하는 양괄식 구조라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어도 눈여겨보세요. however가 나오면 앞의 비난을 뒤집어 이 사람들의 사정을 이해하라는 전환이 일어나요. One way to는 해결책을 꺼내는 표현이고, Fortunately는 다행히 코코아가 그늘에서 자란다는 긍정적인 근거를 이끌어 내죠. 마지막의 But은 계획의 성공이 초콜릿 수요라는 조건에 달려 있다는 점을 강조하는 신호예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>cut down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>벌목하다, 베어 넘기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>struggle\u003c/b>\u003cem>동사\u003c/em>\u003cspan>애쓰다, 분투하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>feed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>먹여 살리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>팔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>crop\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작물\u003c/span>\u003c/div>\u003cdiv>\u003cb>wheat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>밀\u003c/span>\u003c/div>\u003cdiv>\u003cb>cleared\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>개간된, 나무를 베어 낸\u003c/span>\u003c/div>\u003cdiv>\u003cb>land\u003c/b>\u003cem>명사\u003c/em>\u003cspan>땅, 토지\u003c/span>\u003c/div>\u003cdiv>\u003cb>at fault\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잘못이 있는, 책임이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>means\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수단\u003c/span>\u003c/div>\u003cdiv>\u003cb>make a living\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>생계를 꾸리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>livelihood\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생계\u003c/span>\u003c/div>\u003cdiv>\u003cb>employ\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cocoa\u003c/b>\u003cem>명사\u003c/em>\u003cspan>코코아\u003c/span>\u003c/div>\u003cdiv>\u003cb>ingredient\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원료, 재료\u003c/span>\u003c/div>\u003cdiv>\u003cb>fortunately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다행히도\u003c/span>\u003c/div>\u003cdiv>\u003cb>direct\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>직접적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>sunlight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>햇빛\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자라다, 재배하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>branch\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가지\u003c/span>\u003c/div>\u003cdiv>\u003cb>taller\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 큰, 더 높은\u003c/span>\u003c/div>\u003cdiv>\u003cb>success\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성공\u003c/span>\u003c/div>\u003cdiv>\u003cb>depend on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 달려 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>increase\u003c/b>\u003cem>명사\u003c/em>\u003cspan>증가\u003c/span>\u003c/div>\u003cdiv>\u003cb>global\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전 세계의\u003c/span>\u003c/div>\u003cdiv>\u003cb>demand\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수요\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚어 볼게요. struggle은 애쓰다, 분투하다는 뜻이고, livelihood는 생계, employ는 고용하다는 의미예요. ingredient는 원료, demand는 수요라는 뜻이니, 코코아가 초콜릿의 중요한 원료이고 초콜릿 수요가 늘어야 한다는 문장 안에서 꼭 확인해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">save\u003c/b>\u003cspan class=\"m\">구하다, 보존하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"s\">protect\u003c/span>\u003cspan class=\"s\">rescue\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">ruin\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">struggle\u003c/b>\u003cspan class=\"m\">애쓰다, 분투하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">strive\u003c/span>\u003cspan class=\"s\">endeavor\u003c/span>\u003cspan class=\"s\">fight\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">surrender\u003c/span>\u003cspan class=\"a\">yield\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">employ\u003c/b>\u003cspan class=\"m\">고용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hire\u003c/span>\u003cspan class=\"s\">recruit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dismiss\u003c/span>\u003cspan class=\"a\">fire\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">increase\u003c/b>\u003cspan class=\"m\">증가하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rise\u003c/span>\u003cspan class=\"s\">grow\u003c/span>\u003cspan class=\"s\">expand\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decrease\u003c/span>\u003cspan class=\"a\">decline\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">demand\u003c/b>\u003cspan class=\"m\">수요\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">need\u003c/span>\u003cspan class=\"s\">request\u003c/span>\u003cspan class=\"s\">requirement\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">supply\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fortunately\u003c/b>\u003cspan class=\"m\">다행히도\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">luckily\u003c/span>\u003cspan class=\"s\">happily\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unfortunately\u003c/span>\u003cspan class=\"a\">unluckily\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">global\u003c/b>\u003cspan class=\"m\">전 세계의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">worldwide\u003c/span>\u003cspan class=\"s\">international\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">local\u003c/span>\u003cspan class=\"a\">domestic\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. save는 preserve, protect와 가깝고 destroy와는 반대돼요. employ는 hire, recruit와 비슷하고 dismiss와 반대죠. increase는 rise, growth와 가깝고 decrease, decline과 반대돼요. demand는 need, request와 비슷하고 supply와 반대되는 경우가 많아요. fortunately는 luckily와 가깝고 unfortunately와 반대라는 점도 함께 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경 보존을 돕기 위해서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">save \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">environment\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 ~하기만 하면 된다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초콜릿을 더 많이 먹기만\u003c/span>\u003cspan class=\"en\">eat more chocolate!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">환경 보존을 돕기 위해서는 초콜릿을 더 많이 먹기만 하면 된다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 환경 보존을 돕기 위해서는 초콜릿을 더 많이 먹기만 하면 된다는 뜻이에요. 얼핏 상관없어 보이는 초콜릿과 환경을 한 문장에 묶어 \u003cb class=\"key\">흥미\u003c/b>를 끌고, 왜 그런지 뒤에서 설명하게 만드는 \u003cb class=\"key\">도입\u003c/b> 문장이죠. 이 한 문장이 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 미리 던지는 복선 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [[To + 동사원형]] ~, 주어 + 동사 (문장 앞에서 목적을 제시) : \"환경 보존을 돕기 위해서는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 have to + only의 제한\u003c/span> : [[only]] + have to + [[동사원형]] : \"~하기만 하면 된다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"To help save the environment, 환경 보존을 돕기 위해서는. you only have to, 당신은 ~하기만 하면 된다. eat more chocolate!, 초콜릿을 더 많이 먹기만. 이 문장 전체를 해석하면, 환경 보존을 돕기 위해서는 초콜릿을 더 많이 먹기만 하면 된다!","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 주제를 미리 던지는 도입 문장이에요. 초콜릿과 환경이라는 얼핏 멀어 보이는 두 단어를 한 문장에 묶어서 흥미를 끌고, 왜 그런지 궁금하게 만드는 복선 역할을 하죠. 뒤에 나오는 브라질 이야기를 읽으면 이 문장이 왜 나왔는지 자연스럽게 이해가 될 거예요.","hl":"mn"},{"n":14,"text":"첫 번째, 문장 맨 앞의 to help는 목적을 나타내는 부사적 용법의 to부정사예요. 환경을 돕기 위해서라는 목적을 먼저 제시하는 거죠. 두 번째, only have to는 해야 한다라는 뜻의 have to에 only가 붙어서 이것만 하면 된다는 제한의 느낌을 줍니다. 그래서 초콜릿을 더 많이 먹기만 하면 된다고 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">브라질에서는\u003c/span>\u003cspan class=\"en\">In Brazil,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대서양림이 벌목되고 있다\u003c/span>\u003cspan class=\"en\">the Atlantic Forest \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">cut \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈을 벌기 위해 애쓰는 사람들에 의해\u003c/span>\u003cspan class=\"en\">by people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">struggling \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">money \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족들을 먹여 살리기 위해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">feed \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">families\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">브라질에서는 가족들을 먹여 살릴 돈을 벌기 위해 애쓰는 사람들에 의해 대서양림이 벌목되고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 브라질에서는 가족을 먹여 살릴 돈을 벌려는 사람들이 숲을 베고 있다는 뜻이에요. 여기서 중요한 건 이들이 나쁜 사람이 아니라 \u003cb class=\"key\">생계\u003c/b> 때문에 그런다는 점이죠. 그래서 뒤에 이들을 비난할 수 없다는 \u003cb class=\"key\">맥락\u003c/b>이 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행 수동태\u003c/span> : be동사 + [[being]] + [[과거분사]] : \"벌목되고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 용법(후치수식)\u003c/span> : [명사 people] + [[-ing]] ~ (앞 명사를 능동으로 꾸밈) : \"돈을 벌기 위해 애쓰는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [[to + 동사원형]] (목적: ~하기 위해) : \"가족들을 먹여 살리기 위해\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"In Brazil, 브라질에서는. the Atlantic Forest is being cut down, 대서양림이 벌목되고 있다. by people struggling to make money, 돈을 벌기 위해 애쓰는 사람들에 의해. to feed their families, 가족들을 먹여 살리기 위해서. 이 문장 전체를 해석하면, 브라질에서는 가족들을 먹여 살릴 돈을 벌기 위해 애쓰는 사람들에 의해 대서양림이 벌목되고 있다.","hl":"m"},{"n":16,"text":"브라질에서는 가족을 먹여 살릴 돈을 벌려는 사람들이 숲을 베고 있다는 뜻이에요. 여기서 중요한 건 이들이 나쁜 사람이 아니라 생계 때문에 그런다는 점이죠. 그래서 뒤에 이들을 비난할 수 없다는 맥락이 자연스럽게 이어집니다.","hl":"mn"},{"n":17,"text":"첫 번째, is being cut down은 현재진행 수동태예요. 주어인 대서양림이 베는 사람이 아니라 베어지는 대상이기 때문에 수동태를 쓰고, 지금 진행 중이라는 걸 being으로 보여 주는 겁니다. 두 번째, struggling은 people을 뒤에서 꾸미는 현재분사예요. 사람들이 스스로 애쓰는 능동 관계니까 현재분사를 쓴 거죠. 세 번째, to feed는 돈을 번다는 동작의 목적을 이어 주는 to부정사로, 가족들을 먹여 살리기 위해서라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은\u003c/span>\u003cspan class=\"en\">People\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌목한 나무를 팔 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sell \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cut-down \u003c/span>\u003cspan class=\"tgt\">trees \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 밀과 같은 작물을 재배할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">grow \u003c/span>\u003cspan class=\"tgt\">crops \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">wheat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무를 베어낸 땅에\u003c/span>\u003cspan class=\"en\">on \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cleared \u003c/span>\u003cspan class=\"tgt\">land\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 벌목한 나무를 팔고 나무를 베어낸 땅에 밀과 같은 작물을 재배할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나무를 베면 그 나무를 팔아 돈을 벌고, 베어 낸 빈 땅에는 밀 같은 작물을 심을 수 있다는 뜻이에요. 결국 숲을 베는 행동이 \u003cb class=\"key\">생계\u003c/b>와 곧바로 연결된다는 걸 보여 주는 문장이죠. 그래서 앞 문장의 벌목이 단순한 \u003cb class=\"key\">파괴\u003c/b>가 아니라는 점을 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [[조동사 can]] + [[동사원형]] : \"팔 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구의 병렬 구조(and)\u003c/span> : [[동사원형 A]] and [[동사원형 B]] : \"나무를 팔고 ~ 작물을 재배할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(수동)\u003c/span> : [[과거분사]] + [명사] : \"벌목한 나무\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">과거분사 cleared의 형용사적 용법\u003c/span> : the + [[과거분사]] + [명사] : \"나무를 베어낸 땅\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"People, 사람들은. can sell the cut-down trees, 벌목한 나무를 팔 수 있다. and grow crops like wheat, 그리고 밀과 같은 작물을 재배할 수 있다. on the cleared land, 나무를 베어낸 땅에. 이 문장 전체를 해석하면, 사람들은 벌목한 나무를 팔고 나무를 베어낸 땅에 밀과 같은 작물을 재배할 수 있다.","hl":"m"},{"n":19,"text":"나무를 베면 그 나무를 팔아 돈을 벌고, 베어 낸 빈 땅에는 밀 같은 작물을 심을 수 있다는 뜻이에요. 결국 숲을 베는 행동이 생계와 곧바로 연결된다는 걸 보여 주는 문장이죠. 그래서 앞 문장의 벌목이 단순한 파괴가 아니라는 점을 뒷받침합니다.","hl":"mn"},{"n":20,"text":"첫 번째, can 뒤에는 동사원형이 와서 팔 수 있다, 재배할 수 있다라는 가능을 나타냅니다. 두 번째, sell과 grow가 and로 나란히 연결된 병렬 구조예요. can 하나가 두 동사를 함께 지배하니까 둘 다 원형인 거죠. 세 번째, cut-down은 나무가 베어지는 대상이라 과거분사로 명사를 꾸며 준 것이고, 네 번째, cleared도 땅이 개간된 대상이라 과거분사로 쓴 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 사람들은\u003c/span>\u003cspan class=\"en\">These people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘못이 없어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">fault\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그것이 그들의 유일한 수단이기 때문이에요\u003c/span>\u003cspan class=\"en\">because it is their only means\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생계를 꾸리는 수단이죠\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">living\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 이 사람들의 잘못은 아닌 게, 그것이 그들의 유일한 생계 수단이기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 숲 파괴가 이 사람들의 \u003cb class=\"key\">잘못\u003c/b>이 아니라는 점을 분명히 하는 문장입니다. however로 앞 내용을 한 번 \u003cb class=\"key\">전환\u003c/b>시키면서, 그것이 생계를 위한 \u003cb class=\"key\">불가피한 \u003c/b>\u003cb class=\"key\">선택\u003c/b>임을 강조하죠. 다음 문장에서 해결책이 왜 필요한지를 만들어 주는 \u003cb class=\"key\">근거\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용표현 be at fault의 부정\u003c/span> : [[주어]] + be동사 + not + at fault : \"잘못이 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속부사의 삽입 (전환)\u003c/span> : 문장 + , however, + 나머지 문장 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : 전치사(of) + [[동명사]] + 목적어 : \"생계를 꾸리는 것의\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"These people, 이 사람들은. are not at fault, 잘못이 없어요. however, 하지만. because it is their only means, 왜냐하면 그것이 그들의 유일한 수단이기 때문이에요. of making a living, 생계를 꾸리는 수단이죠. 이 문장 전체를 해석하면, 하지만 이 사람들의 잘못은 아닌 게, 그것이 그들의 유일한 생계 수단이기 때문이다.","hl":"m"},{"n":22,"text":"숲을 베는 사람들을 무작정 나무랄 수는 없다는 거예요. however로 앞 내용을 한 번 꺾으면서, 이건 잘못이 아니라 생계를 위한 어쩔 수 없는 선택이라고 말합니다. 그래서 이 문장은 뒤에 나올 해결책이 왜 필요한지 이유를 깔아 주는 역할을 해요.","hl":"mn"},{"n":23,"text":"먼저 be at fault는 잘못이 있다라는 관용표현이에요. 여기에 not이 붙어서 잘못이 아니라는 뜻이 되죠. 그리고 however는 문장 중간에 콤마와 함께 들어간 접속부사로, 앞 문장과 반대되는 흐름을 만들어 줍니다. 마지막으로 of making a living에서 making은 전치사 of 뒤에 온 동명사예요. 전치사 뒤에는 명사가 와야 하니까 동명사로 바꾼 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 가지 방법은\u003c/span>\u003cspan class=\"en\">One way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무도 구하고 이 사람들의 생계도 구하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">save \u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">trees \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">livelihood \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 고용하는 것이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">employ \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코코아 농장에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">cocoa \u003c/span>\u003cspan class=\"tgt\">farms\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나무도 구하고 이 사람들의 생계도 구하는 한 가지 방법이 그들을 코코아 농장에 고용하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 문제로 제시된 '나무 보호'와 '사람들의 생계'라는 두 \u003cb class=\"key\">목표\u003c/b>를 한 번에 잡는 \u003cb class=\"key\">해결책\u003c/b>을 제시합니다. One way가 \u003cb class=\"key\">방법\u003c/b>을 예고하고, to employ 이하가 그 구체적인 대안이 되죠. 글의 흐름이 문제에서 \u003cb class=\"key\">대안\u003c/b>으로 넘어가는 중심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법 + both A and B 병렬\u003c/span> : [[명사]](way) + to부정사(수식) / both + A + and + B : \"나무도 구하고 이 사람들의 생계도 구하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (보어)\u003c/span> : [[주어]] + be동사 + to부정사(보어) : \"그들을 고용하는 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 역할 (장소)\u003c/span> : [[동사]] + 목적어 + on + 장소 : \"코코아 농장에\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"One way, 한 가지 방법은. to save both the trees and the livelihood of these people, 나무도 구하고 이 사람들의 생계도 구하는. is to employ them, 그들을 고용하는 것이에요. on cocoa farms, 코코아 농장에. 이 문장 전체를 해석하면, 나무도 구하고 이 사람들의 생계도 구하는 한 가지 방법이 그들을 코코아 농장에 고용하는 것이다.","hl":"m"},{"n":25,"text":"여기서 드디어 해결책이 나옵니다. 나무를 지키는 것과 사람들의 생계를 지키는 것, 이 두 가지를 함께 잡겠다는 거예요. 방법은 간단합니다. 숲을 베던 사람들을 코코아 농장에서 일하게 하는 겁니다.","hl":"mn"},{"n":26,"text":"먼저 to save는 앞에 있는 One way를 꾸며 주는 to부정사의 형용사적 용법이에요. 방법이라는 명사 뒤에서 어떤 방법인지 설명해 주죠. 그 안에 both the trees and the livelihood처럼 both A and B 형태로 두 목적어를 나란히 묶은 병렬 구조도 꼭 눈여겨보세요. 그리고 is to employ에서 to employ는 주어를 받는 보어로 쓰인 to부정사의 명사적 용법입니다. 주어가 방법이고 보어가 행위라서 방법은 고용하는 것이라는 해석이 나와요. 마지막으로 on cocoa farms는 고용이 이루어지는 장소를 알려 주는 전치사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코코아는\u003c/span>\u003cspan class=\"en\">Cocoa\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 중요한 원료예요\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">ingredient\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초콜릿을 만드는 데에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">chocolate\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">코코아는 초콜릿을 만드는 가장 중요한 원료이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 제시한 대안이 왜 성립하는지 알려 주는 \u003cb class=\"key\">배경지식\u003c/b> 문장입니다. 초콜릿의 핵심 \u003cb class=\"key\">원료\u003c/b>가 코코아임을 밝혀, 코코아 농장 고용이 초콜릿 \u003cb class=\"key\">소비\u003c/b>와 연결되는 근거를 만들어 주죠. 뒤에 나올 '세계적 수요'라는 조건을 이해하기 위한 \u003cb class=\"key\">사전 \u003c/b>\u003cb class=\"key\">정보\u003c/b>이기도 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">최상급 표현 (the + most + 형용사 + 명사)\u003c/span> : the + most + [[형용사]] + 명사 : \"가장 중요한 원료\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : 전치사(in) + [[동명사]] + 목적어 : \"초콜릿을 만드는 데에\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Cocoa, 코코아는. is the most important ingredient, 가장 중요한 원료예요. in making chocolate, 초콜릿을 만드는 데에. 이 문장 전체를 해석하면, 코코아는 초콜릿을 만드는 가장 중요한 원료이다.","hl":"m"},{"n":28,"text":"이 문장은 코코아 농장이 왜 해결책이 되는지 알려 주는 배경이에요. 초콜릿의 가장 중요한 원료가 코코아이기 때문에, 코코아 수요가 늘면 이 사람들을 고용할 이유가 생깁니다. 그래서 뒤에서 세계적인 수요 증가가 조건으로 나오는 거죠.","hl":"mn"},{"n":29,"text":"먼저 the most important ingredient는 the와 최상급 most가 함께 온 최상급 표현이에요. 여러 원료 중에서 으뜸이라는 뜻이 되죠. 그리고 in making chocolate에서 making은 전치사 in 뒤에 온 동명사입니다. 전치사 뒤에는 명사가 와야 하니까 동사를 동명사로 바꿔 초콜릿을 만드는 일이라는 명사 역할을 하게 한 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다행히도,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Fortunately\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코코아는 필요로 하지 않아요\u003c/span>\u003cspan class=\"en\">cocoa \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">doesn't \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직접적인 햇빛을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">direct \u003c/span>\u003cspan class=\"tgt\">sunlight \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자라는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">grow\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다행히도 코코아는 자라는 데 햇빛을 직접 받지 않아도 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코코아가 \u003cb class=\"key\">직접 \u003c/b>\u003cb class=\"key\">햇빛\u003c/b> 없이도 자랄 수 있다는 사실을 알려 주는 문장이에요. 바로 앞에서 코코아 농장에 고용하자는 해결책이 나왔는데, 이 문장은 그 해결책이 가능한 \u003cb class=\"key\">근거\u003c/b>를 대 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문장 부사(양태 부사)\u003c/span> : Fortunately + , + [문장 전체] : \"다행히도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적·기준)\u003c/span> : need + [목적어 direct sunlight] + [to grow (to부정사구/부사적)] : \"자라는 데 햇빛을 직접 받을 필요가 없다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Fortunately, 다행히도. cocoa doesn't need, 코코아는 필요로 하지 않아요. direct sunlight, 직접적인 햇빛을. to grow, 자라는 데. 이 문장 전체를 해석하면, 다행히도 코코아는 자라는 데 햇빛을 직접 받지 않아도 된다.","hl":"m"},{"n":31,"text":"이 문장은 코코아가 직접 햇빛 없이도 자랄 수 있다는 점을 알려 줘요. 바로 앞에서 코코아 농장에 고용하자는 해결책이 나왔잖아요. 그래서 이 문장은 그 해결책이 가능한 근거를 대 주는 역할을 해요.","hl":"mn"},{"n":32,"text":"먼저 fortunately는 문장 전체에 대한 화자의 태도를 나타내는 부사예요. 그래서 콤마로 끊어서 문장 맨 앞에 놓였죠. 다음으로 doesn't need direct sunlight to grow에서 to grow는 자라기 위해라는 목적을 나타내는 부사적 용법이에요. 의미상 주어는 앞에 있는 cocoa라는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 잘 자랄 수 있어요\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">grow \u003c/span>\u003cspan class=\"tgt\">well\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지들 밑에서\u003c/span>\u003cspan class=\"en\">under the branches\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숲속의 더 큰 나무들의\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">taller\u003c/span> trees in the forest,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 어떤 나무도 베어질 필요가 없어요\u003c/span>\u003cspan class=\"en\">so no trees \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">cut \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">코코아는 숲속의 더 큰 나무 가지들 밑에서 잘 자랄 수 있으므로 나무를 전혀 베지 않아도 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코코아가 그늘에서도 잘 자란다는 점을 근거로, 나무를 베지 않아도 된다는 결론까지 이끌어 내는 문장이에요. 앞 문장의 '햇빛이 필요 없다'는 내용을 \u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">밑\u003c/b>이라는 구체적 상황으로 이어 주고, so로 \u003cb class=\"key\">결과\u003c/b>를 정리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can(가능)\u003c/span> : [can] + [동사원형 grow] : \"잘 자랄 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 형용사\u003c/span> : tall + -er = taller : \"더 큰\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 수동형(need to be p.p.)\u003c/span> : need + [to be p.p.] : \"베어질 필요가 없다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It can grow well, 그것은 잘 자랄 수 있어요. under the branches, 가지들 밑에서. of taller trees in the forest, 숲속의 더 큰 나무들의. so no trees need to be cut down, 그래서 어떤 나무도 베어질 필요가 없어요. 이 문장 전체를 해석하면, 코코아는 숲속의 더 큰 나무 가지들 밑에서 잘 자랄 수 있으므로 나무를 전혀 베지 않아도 된다.","hl":"m"},{"n":34,"text":"코코아가 그늘에서도 잘 자란다는 점을 근거로, 나무를 베지 않아도 된다는 결론까지 끌고 가는 문장이에요. 앞 문장에서 햇빛이 필요 없다고 했죠. 그 내용을 가지 밑이라는 구체적인 상황으로 이어 주고, so로 결과를 정리하고 있어요.","hl":"mn"},{"n":35,"text":"먼저 can grow well은 할 수 있다는 가능을 나타내고, 뒤에 동사원형 grow가 왔어요. 다음으로 taller는 다른 나무들보다 더 크다는 비교급이에요. 마지막으로 no trees need to be cut down에서 나무는 베어지는 대상이니까 수동으로 써야 해요. 그래서 need to be cut down, 이렇게 to be p.p. 형태가 된 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 계획의 성공은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">success \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">plan\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">증가에 달려 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">depends \u003c/span>\u003cspan class=\"tgt\">on\u003c/span> the increase\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초콜릿에 대한 전 세계의 수요의\u003c/span>\u003cspan class=\"en\">of the global demand \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">chocolate\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 이 계획의 성공은 초콜릿에 대한 전 세계의 수요 증가에 달려 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 계획이 성공하려면 초콜릿에 대한 전 세계의 \u003cb class=\"key\">수요\u003c/b>가 늘어나야 한다는 조건을 제시하는 문장이에요. 앞에서 코코아 농장 고용이라는 해결책이 나왔으니, 이 문장은 그 계획의 성패가 소비자 \u003cb class=\"key\">수요\u003c/b>에 \u003cb class=\"key\">달려\u003c/b> 있다고 마무리해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 of의 형용사적 수식(주격적 of)\u003c/span> : [the success] + of + [the plan] : \"그 계획의 성공\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사(depend on)\u003c/span> : depend + on + [목적어] : \"~에 달려 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for의 수식(demand for)\u003c/span> : demand + for + [대상] : \"초콜릿에 대한\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"But, 하지만. the success of the plan, 그 계획의 성공은. depends on the increase, 증가에 달려 있어요. of the global demand for chocolate, 초콜릿에 대한 전 세계의 수요의. 이 문장 전체를 해석하면, 하지만 이 계획의 성공은 초콜릿에 대한 전 세계의 수요 증가에 달려 있다.","hl":"m"},{"n":37,"text":"이 문장은 계획이 성공하려면 초콜릿에 대한 전 세계의 수요가 늘어나야 한다는 조건을 제시해요. 앞에서 코코아 농장에 고용하자는 해결책이 나왔잖아요. 그래서 이 문장은 그 계획의 성패가 결국 소비자의 수요에 달려 있다고 마무리해 주는 거예요.","hl":"mn"},{"n":38,"text":"먼저 the success of the plan에서 of the plan이 앞의 the success를 뒤에서 꾸며 주고, 계획이 성공하는 주체라는 주격 관계를 나타내요. 다음으로 depends on은 동사 depend가 전치사 on과 묶여서 자동사 구를 이룬 형태예요. 그래서 on을 빼먹으면 안 되죠. 마지막으로 for chocolate에서 demand는 for와 짝을 이뤄 무엇에 대한 수요인지 대상을 밝혀 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>환경 보존을 돕는 의외의 방법으로 \u003cb class=\"key\">초콜릿\u003c/b>을 더 많이 먹으라는 제안이 나온다.\u003c/li>\u003cli>브라질의 \u003cb class=\"key\">대서양림\u003c/b>은 가족을 먹여 살릴 돈을 벌기 위해 \u003cb class=\"key\">애쓰는 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>에 의해 벌목되고 있다.\u003c/li>\u003cli>나무와 생계를 함께 구하는 방법은 그들을 \u003cb class=\"key\">코코아 \u003c/b>\u003cb class=\"key\">농장\u003c/b>에 고용하는 것이다.\u003c/li>\u003cli>코코아는 \u003cb class=\"key\">직사광선\u003c/b> 없이 큰 나무 그늘에서 잘 자라므로, 이 계획의 성공은 \u003cb class=\"key\">초콜릿 \u003c/b>\u003cb class=\"key\">수요\u003c/b> 증가에 달려 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>By employing local people on cocoa farms, we can save both the Atlantic Forest and their livelihoods, and the plan depends on growing global demand for chocolate.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">브라질에서 생계를 위해 대서양림을 벌목하는 사람들에게 \u003cb class=\"key\">코코아 \u003c/b>\u003cb class=\"key\">농장\u003c/b> 일자리를 주면 나무를 베지 않고도 숲과 생계를 함께 지킬 수 있다. 이 계획의 성공은 \u003cb class=\"key\">초콜릿 \u003c/b>\u003cb class=\"key\">수요\u003c/b>의 증가에 달려 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 글의 핵심을 다시 정리해 볼게요. 환경 보존을 위해 초콜릿을 더 먹으라는 재미있는 제안과, 브라질 대서양림의 벌목 문제, 그리고 코코아 농장에 고용하는 해결책이었죠. 코코아는 직사광선 없이 큰 나무 그늘에서 잘 자라므로 나무를 베지 않아도 된다는 점이 열쇠예요. 결국 숲도 사람도 살리는 것은 초콜릿에 대한 전 세계 수요의 증가라는 사실, 잊지 마세요. 오늘 수업도 수고 많았어요.","hl":null}]}]});</script></body></html>
