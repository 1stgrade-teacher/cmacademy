<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1강 reading2 — AI 강의</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"1강 reading2","audioDir":"passage2_audio","preview":false,"count":27,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">1강\u003cbr>2번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Start from What Should Be, Not from What Has Always Been\u003c/h1>\u003ch2>있어 온 것이 아니라, 마땅히 있어야 할 것에서 출발하라\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>경영 대학원에서는 효과가 있든 없든 익숙한 것을 고수하려는 성향을 극복하기 위해, 과거에 행해져왔던 것을 제쳐 두고 그 정책이 어떠해야 하는가에 집중하는 방법을 가르친다. 우리도 같은 방법으로 \u003cb class=\"key\">항상 \u003c/b>\u003cb class=\"key\">해왔던 \u003c/b>\u003cb class=\"key\">방식\u003c/b>에 고유한 가치가 있다고 가정하지 말고, \u003cb class=\"key\">이를 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">최고\u003c/b>가 되는 것에 집중해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Do not assume inherent value in the way you have always done things; set the past aside and focus on becoming the best you can be.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 경영 대학원에서 가르치는 의사결정 방법을 우리 자신의 삶에 그대로 적용해 보는 글이에요. 내용을 한 줄로 줄이면, 효과가 있든 없든 익숙한 것을 고수하려는 성향을 버리고 마땅히 있어야 할 모습을 기준으로 삼자는 것이죠. 즉 과거가 아니라 목표에서 출발하라는 아주 명쾌한 주장입니다. 함께 천천히 읽어 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">경영학에는 \u003cb class=\"key\">제로 \u003c/b>\u003cb class=\"key\">베이스 \u003c/b>\u003cb class=\"key\">사고\u003c/b>(zero-based thinking)라는 개념이 있다. 지난해 예산을 그대로 이어받아 조금씩 늘리는 방식이 아니라, 모든 것을 백지에서 다시 계산하는 방식이다. 사람은 누구나 현상 유지(status quo)를 좋아하는 습성이 있어서, 이미 오래 해 온 일을 검증 없이 신뢰하기 쉽다. 방학마다 늘 짜던 공부 계획을 올해도 그대로 짜는 것이 대표적인 예로, 그 계획이 \u003cb class=\"key\">효과가 \u003c/b>\u003cb class=\"key\">있었는지\u003c/b> 따져 보지 않고 익숙하다는 이유만으로 반복하는 것이다. 이 글은 바로 그 익숙함에 \u003cb class=\"key\">고유한 \u003c/b>\u003cb class=\"key\">가치\u003c/b>가 있다는 믿음을 의심해 보라고 말한다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 경영학에는 제로 베이스 사고, 영어로 zero-based thinking이라는 개념이 있어요. 지난해 예산을 그대로 이어받아 조금씩 늘리는 방식이 아니라, 모든 것을 백지에서 다시 계산하는 방식이죠. 사람은 누구나 현상 유지, 즉 status quo를 좋아하는 습성이 있어서 이미 오래 해 온 일을 검증 없이 믿기 쉬워요. 여러분이 방학마다 늘 하던 공부 계획을 올해도 그대로 짜는 것도 사실은 같은 이유예요. 그 계획이 효과가 있었는지 따져 보지 않고 익숙하다는 이유만으로 반복하는 거죠. 그래서 이 글은 그 익숙함에 고유한 가치가 있다는 믿음을 한 번 의심해 보자고 말합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>경영 대학원의 방법\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>경영 대학원에서는 경영상 의사결정의 한 방법을 가르친다. 이 방법은 \u003cb class=\"key\">효과가 \u003c/b>\u003cb class=\"key\">있든 \u003c/b>\u003cb class=\"key\">없든\u003c/b> 간에 \u003cb class=\"key\">익숙한 \u003c/b>\u003cb class=\"key\">것을 \u003c/b>\u003cb class=\"key\">고수하려는\u003c/b> 우리의 타고난 성향을 극복하고자 고안된 것이다. 즉 글쓴이는 우리가 검증 없이 익숙한 것에 매달리는 습성을 문제로 본다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>과거를 제쳐 두기\u003csmall>예시 · 문장 2\u003c/small>\u003c/h4>\u003cp>경영자가 회사의 경영 방침을 검토하고 싶으면, 그 사람은 우선 \u003cb class=\"key\">과거에 \u003c/b>\u003cb class=\"key\">행해져왔던 \u003c/b>\u003cb class=\"key\">것\u003c/b>들은 어떤 것이든 제쳐 둔다. 그리고 대신 \u003cb class=\"key\">그 \u003c/b>\u003cb class=\"key\">정책이 \u003c/b>\u003cb class=\"key\">어떤 \u003c/b>\u003cb class=\"key\">것이어야 \u003c/b>\u003cb class=\"key\">하는가\u003c/b>에 집중한다. 여기서 핵심은 판단의 출발점을 과거가 아니라 마땅히 있어야 할 모습에 두는 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>나에게 적용하기\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>이제 글쓴이는 독자에게로 시선을 돌린다. \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">목표\u003c/b>를 가장 잘 성취하기 위해서 어떻게 보이고, 말하고, 행동해야 할지 검토할 때 \u003cb class=\"key\">똑같은 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 따르라고 한다. 경영자의 사례가 곧 우리 자신의 언행에 그대로 적용되는 지점이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>최선에 집중하라\u003csmall>주장 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>글쓴이는 \u003cb class=\"key\">항상 \u003c/b>\u003cb class=\"key\">해왔던 \u003c/b>\u003cb class=\"key\">방식\u003c/b>에 어떤 \u003cb class=\"key\">고유한 \u003c/b>\u003cb class=\"key\">가치\u003c/b>가 있다고 가정하지 말라고 한다. 그리고 늘 존재해왔던 방식이 아니라 \u003cb class=\"key\">이를 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">최고\u003c/b>가 되는 것에 계속 집중하라고 당부한다. 결국 판단의 기준은 과거가 아니라 목표가 되어야 한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 경영 대학원의 방법에서 우리 자신의 적용으로 넘어가는 순서로 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 문장을 봅시다. 경영 대학원에서는 경영상 의사결정의 한 방법을 가르치는데, 이 방법은 효과가 있든 없든 익숙한 것을 고수하려는 우리의 타고난 성향을 극복하고자 고안된 것이에요. 여기서 문제로 지목되는 것은 바로 그 익숙함에 대한 집착입니다.","hl":"f0"},{"n":5,"text":"두 번째 문장은 그 방법을 구체적으로 보여 줘요. 경영자가 회사의 경영 방침을 검토하고 싶으면 우선 과거에 행해져왔던 것들은 어떤 것이든 제쳐 두고, 대신 그 정책이 어떤 것이어야 하는가에 집중한다고 했죠. 판단의 출발점을 과거가 아니라 마땅히 있어야 할 모습에 두는 겁니다.","hl":"f1"},{"n":6,"text":"세 번째 문장에서 글쓴이는 독자에게로 시선을 돌려요. 자신의 목표를 가장 잘 성취하기 위해서 어떻게 보이고 말하고 행동해야 할지 검토할 때 이와 똑같은 방법을 따르라고 합니다. 경영자의 이야기가 곧 우리 자신의 언행에 대한 이야기로 넘어오는 지점이에요.","hl":"f2"},{"n":7,"text":"네 번째와 다섯 번째 문장은 그래서 어떻게 하라는 당부입니다. 항상 해왔던 방식에 어떤 고유한 가치가 있다고 가정하지 말고, 늘 존재해왔던 방식이 아니라 이를 수 있는 최고가 되는 것에 계속 집중하라고 하죠. 결국 판단의 기준을 과거가 아니라 목표에 두라는 겁니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시(사례)-적용\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 경영 대학원의 의사결정 방법이라는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 먼저 제시한다. 이어 세 번째 문장에서 같은 방법을 따르라는 명령형으로 \u003cb class=\"key\">주제\u003c/b>를 던지고, 네 번째와 다섯 번째 문장에서 가정하지 말라, 집중하라는 방식으로 이를 부연한다. 따라서 사례가 앞을 받치고 주제문이 가운데 놓인 \u003cb class=\"key\">중괄식\u003c/b> 구조로 볼 수 있다. 또한 과거의 방식과 최선의 모습이라는 두 기준이 계속 \u003cb class=\"key\">대조\u003c/b>를 이룬다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>whether or not (1)\u003c/b>\u003cspan>양보·조건 제시\u003c/span>\u003cb>instead (2)\u003c/b>\u003cspan>대조·전환\u003c/span>\u003cb>Don't assume (4)\u003c/b>\u003cspan>명령형 강조\u003c/span>\u003cb>not (5)\u003c/b>\u003cspan>대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the familiar\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">whatever has been done historically\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the way you have always done things\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">how you have always been\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>과거에 해왔던 방식 (how you have always been)\u003c/th>\u003cth>이를 수 있는 최고의 모습 (the best you can be)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>출발점: 이미 해 온 일\u003c/td>\u003ctd>출발점: 마땅히 있어야 할 모습\u003c/td>\u003c/tr>\u003ctr>\u003ctd>검증 없는 반복과 정체\u003c/td>\u003ctd>목표 달성과 성장\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 사례를 통한 적용이에요. 경영 대학원의 예시를 먼저 보여 주고, 그것을 독자 자신에게 그대로 옮겨 놓죠. 구조로 보면 주제문이 글 가운데에 놓인 중괄식입니다. 처음 두 문장이 사례를 깔고, 세 번째 문장에서 같은 방법을 따르라고 주제를 던진 뒤, 마지막 두 문장이 그것을 부연하기 때문이에요.","hl":"ty"},{"n":9,"text":"신호어도 눈여겨보세요. 두 번째 문장의 instead는 과거를 제쳐 두고 대신 무엇에 집중하는지를 갈라 주는 대조의 신호예요. 네 번째 문장의 Don't assume은 강한 명령형으로 글쓴이의 주장을 드러내고, 다섯 번째 문장의 not은 늘 해왔던 방식과 최선이 되는 것 사이를 갈라 줍니다. 같은 개념이 the familiar, whatever has been done historically, the way you have always done things, how you have always been처럼 계속 바꿔 표현되는 것도 꼭 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>approach\u003c/b>\u003cem>명사\u003c/em>\u003cspan>접근법, 방법\u003c/span>\u003c/div>\u003cdiv>\u003cb>management\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경영\u003c/span>\u003c/div>\u003cdiv>\u003cb>decision\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결정, 의사결정\u003c/span>\u003c/div>\u003cdiv>\u003cb>be designed to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하도록 고안되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>overcome\u003c/b>\u003cem>동사\u003c/em>\u003cspan>극복하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>natural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>타고난, 자연스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>tendency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성향, 경향\u003c/span>\u003c/div>\u003cdiv>\u003cb>cling to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 매달리다, 고수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>the familiar\u003c/b>\u003cem>명사\u003c/em>\u003cspan>익숙한 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>whether or not\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~이든 아니든\u003c/span>\u003c/div>\u003cdiv>\u003cb>executive\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경영자, 임원\u003c/span>\u003c/div>\u003cdiv>\u003cb>examine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>검토하다, 조사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>policy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방침, 정책\u003c/span>\u003c/div>\u003cdiv>\u003cb>put aside\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>제쳐 두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>historically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>역사적으로, 과거에\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>focus on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 집중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>따르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>achieve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>성취하다, 달성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>objective\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목표\u003c/span>\u003c/div>\u003cdiv>\u003cb>assume\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가정하다, 당연시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inherent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고유한, 내재하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>value\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가치\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep focused on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 계속 집중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>become\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~이 되다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚을게요. cling to는 매달리다, 고수하다는 뜻이고, overcome은 극복하다, put aside는 제쳐 두다는 의미예요. inherent는 고유한, 내재하는이라는 뜻으로, 여기서는 과거 방식에 원래부터 가치가 있는 것은 아니라는 논리를 받쳐 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">overcome\u003c/b>\u003cspan class=\"m\">극복하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conquer\u003c/span>\u003cspan class=\"s\">surmount\u003c/span>\u003cspan class=\"s\">get over\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">surrender to\u003c/span>\u003cspan class=\"a\">succumb to\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">tendency\u003c/b>\u003cspan class=\"m\">성향, 경향\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inclination\u003c/span>\u003cspan class=\"s\">disposition\u003c/span>\u003cspan class=\"s\">propensity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">aversion\u003c/span>\u003cspan class=\"a\">reluctance\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cling to\u003c/b>\u003cspan class=\"m\">~에 매달리다, 고수하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stick to\u003c/span>\u003cspan class=\"s\">hold on to\u003c/span>\u003cspan class=\"s\">adhere to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">let go of\u003c/span>\u003cspan class=\"a\">abandon\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">examine\u003c/b>\u003cspan class=\"m\">검토하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inspect\u003c/span>\u003cspan class=\"s\">review\u003c/span>\u003cspan class=\"s\">scrutinize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">achieve\u003c/b>\u003cspan class=\"m\">성취하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">attain\u003c/span>\u003cspan class=\"s\">accomplish\u003c/span>\u003cspan class=\"s\">reach\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fail\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inherent\u003c/b>\u003cspan class=\"m\">고유한, 내재하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">intrinsic\u003c/span>\u003cspan class=\"s\">innate\u003c/span>\u003cspan class=\"s\">built-in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">external\u003c/span>\u003cspan class=\"a\">acquired\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">assume\u003c/b>\u003cspan class=\"m\">가정하다, 당연시하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">presume\u003c/span>\u003cspan class=\"s\">suppose\u003c/span>\u003cspan class=\"s\">take for granted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">verify\u003c/span>\u003cspan class=\"a\">question\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어로 정리해 볼게요. overcome은 conquer, surmount와 가깝고 반대말은 surrender to입니다. cling to는 stick to, hold on to와 비슷하고 반대는 let go of나 abandon이에요. inherent는 intrinsic, innate와 통하고 반대는 external이나 acquired죠. achieve는 attain, accomplish와, examine은 inspect, review와 묶어서 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경영 대학원에서는\u003c/span>\u003cspan class=\"en\">In business school\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경영상 의사결정의 한 방법을 가르친다\u003c/span>\u003cspan class=\"en\">they teach an approach to management decisions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 타고난 성향을 극복하고자 고안된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">designed \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">overcome\u003c/span> our natural \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">tendency \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">익숙한 것을 고수하고자 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">cling\u003c/span> to the familiar,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">효과가 있든 없든 간에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">whether \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">works\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">경영 대학원에서는 효과가 있든 없든 간에 익숙한 것을 고수하고자 하는 우리의 타고난 성향을 극복하고자 고안된 경영상 의사결정의 한 방법을 가르친다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 경영 대학원에서 가르치는 의사결정법을 소개하면서, 익숙한 관행에 매달리려는 본성을 극복하라고 말해요. '효과가 있든 없든'이라는 표현이 핵심으로, 관행의 \u003cb class=\"key\">효과\u003c/b>와 무관하게 \u003cb class=\"key\">습관\u003c/b>을 의심해야 한다는 \u003cb class=\"key\">전제\u003c/b>를 깔아 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that + 수동태\u003c/span> : [선행사 an approach] + [[that]] + [is designed to + 동사원형] : \"~하도록 고안된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 tendency] + [to + 동사원형] : \"~하려는 성향\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">whether or not 양보 부사절\u003c/span> : [[whether or not]] + [주어 + 동사] : \"~이든 아니든\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"In business school, 경영 대학원에서는. they teach an approach to management decisions, 경영상 의사결정의 한 방법을 가르친다. that is designed to overcome our natural tendency, 우리의 타고난 성향을 극복하고자 고안된. to cling to the familiar, 익숙한 것을 고수하고자 하는. whether or not it works, 효과가 있든 없든 간에. 이 문장 전체를 해석하면, 경영 대학원에서는 효과가 있든 없든 간에 익숙한 것을 고수하고자 하는 우리의 타고난 성향을 극복하고자 고안된 경영상 의사결정의 한 방법을 가르친다.","hl":"m"},{"n":13,"text":"이 문장은 경영 대학원에서 가르치는 의사결정 방법을 소개해요. 익숙한 것에 매달리려는 우리 본성을 극복하라는 건데, 효과가 있든 없든 간에 관행을 의심하라는 전제를 깔아 주는 거죠. 그래서 효과와 상관없이 습관을 먼저 의심하라는 흐름으로 이어진답니다.","hl":"mn"},{"n":14,"text":"첫 번째로 an approach 뒤에 that이 나오는데, 이건 선행사를 받는 주격 관계대명사예요. 두 번째로 is designed to는 be designed to 형태로 '~하도록 고안되다'라는 뜻의 수동태 표현이죠. 세 번째로 tendency to cling에서 to부정사가 앞의 명사를 꾸며 '~하려는 성향'이라는 의미를 만들어요. 마지막으로 whether or not은 '~이든 아니든'이라는 양보의 뜻을 더해 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경영자가 어떤 회사의 경영 방침을 검토하고 싶으면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">executive \u003c/span>\u003cspan class=\"tgt\">wants \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">examine\u003c/span> a company policy,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사람은 우선 제쳐 두고,\u003c/span>\u003cspan class=\"en\">he or she first puts aside\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과거에 행해져왔던 것들은 어떤 것이든\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">whatever \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">done \u003c/span>\u003cspan class=\"tgt\">historically\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신 ~에 집중한다\u003c/span>\u003cspan class=\"en\">and focuses instead on\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 정책이 어떤 것이어야 하는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">policy \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">경영자가 어떤 회사의 경영 방침을 검토하고 싶으면, 그 사람은 우선 과거에 행해져왔던 것들은 어떤 것이든 제쳐 두고, 대신 그 정책이 어떤 것이어야 하는가에 집중한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> '과거에 해왔던 것'과 '마땅히 해야 할 것'을 분리해서 생각하는 \u003cb class=\"key\">사고\u003c/b> 방식을 보여줘요. 앞 문장의 원리를 실제 인물에 적용한 \u003cb class=\"key\">예시\u003c/b>이며, 뒤에서 독자에게 같은 방식을 권하는 \u003cb class=\"key\">권유\u003c/b>로 이어지는 징검다리 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건 부사절의 현재시제\u003c/span> : [If + 주어 + 현재시제], [주어 + 동사] : \"~하고 싶으면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복합관계대명사 whatever + 현재완료 수동태\u003c/span> : [[whatever]] + [has been + p.p.] : \"과거에 행해져왔던 것은 무엇이든\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : [의문사 what] + [주어 the policy] + [조동사 should] + [동사 be] : \"그 정책이 어떤 것이어야 하는가\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"If an executive wants to examine a company policy, 경영자가 어떤 회사의 경영 방침을 검토하고 싶으면. he or she first puts aside, 그 사람은 우선 제쳐 두고. whatever has been done historically, 과거에 행해져왔던 것들은 어떤 것이든. and focuses instead on, 대신 ~에 집중한다. what the policy should be, 그 정책이 어떤 것이어야 하는가. 이 문장 전체를 해석하면, 경영자가 어떤 회사의 경영 방침을 검토하고 싶으면, 그 사람은 우선 과거에 행해져왔던 것들은 어떤 것이든 제쳐 두고, 대신 그 정책이 어떤 것이어야 하는가에 집중한다.","hl":"m"},{"n":16,"text":"이 문장은 과거에 해왔던 것과 앞으로 마땅히 해야 할 것을 분리해서 보는 사고 방식을 보여줘요. 앞 문장의 원리를 실제 경영자에게 적용한 예시이고, 다음 문장에서 독자에게 같은 방식을 권하는 권유로 자연스럽게 이어진답니다.","hl":"mn"},{"n":17,"text":"먼저 if절은 조건을 나타내니까 미래의 일이라도 현재시제 wants로 쓴다는 점을 기억하세요. 그다음 whatever는 복합관계대명사로 '무엇이든'이라는 명사절을 이끌고, has been done은 현재완료 수동태예요. 마지막으로 what the policy should be는 간접의문문이라서 의문사 뒤에 주어와 동사 어순이 온답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이와 똑같은 방법을 따르도록 해라\u003c/span>\u003cspan class=\"en\">Follow the same approach\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~을 검토할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">examine\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 보이고, 말하고, 행동해야 할지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">look, \u003c/span>\u003cspan class=\"tgt\">speak \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">act\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 목표를 가장 잘 성취하기 위해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">achieve \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">objectives\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자신의 목표를 가장 잘 성취하기 위해서 어떻게 보이고, 말하고, 행동해야 할지 검토할 때, 이와 똑같은 방법을 따르도록 해라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이제 독자 자신에게 적용하라는 \u003cb class=\"key\">명령\u003c/b>의 문장이에요. 보이고 말하고 행동하는 방식을 '목표'라는 기준으로 점검하라고 하면서, 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 독자에게 직접 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">as 접속사(시간)\u003c/span> : [[as]] + [주어 + 동사] : \"~을 검토할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 + 병렬구조\u003c/span> : [의문사 how] + [주어 you] + [조동사 should] + [동사원형 look, speak and act] : \"어떻게 보이고, 말하고, 행동해야 할지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to + 동사원형 best achieve] + [목적어 your objectives] : \"자신의 목표를 가장 잘 성취하기 위해서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Follow the same approach, 이와 똑같은 방법을 따르도록 해라. as you examine, ~을 검토할 때. how you should look, speak and act, 어떻게 보이고, 말하고, 행동해야 할지. to best achieve your objectives, 자신의 목표를 가장 잘 성취하기 위해서. 이 문장 전체를 해석하면, 자신의 목표를 가장 잘 성취하기 위해서 어떻게 보이고, 말하고, 행동해야 할지 검토할 때, 이와 똑같은 방법을 따르도록 해라.","hl":"m"},{"n":19,"text":"이제는 독자 자신에게 적용하라는 명령의 문장이에요. 어떻게 보이고 말하고 행동할지를 목표에 맞춰 점검하라고 하면서, 글의 주제를 독자에게 직접 전달한답니다.","hl":"mn"},{"n":20,"text":"첫 번째로 as you examine에서 as는 '~할 때'라는 시간의 접속사로 쓰였어요. 두 번째로 how you should look, speak and act는 간접의문문이라서 how 뒤에 주어와 조동사가 오고, look과 speak와 act가 병렬로 연결됩니다. 세 번째로 to best achieve your objectives에서 to부정사가 목적을 나타내는 부사구로 쓰여 '~하기 위해서'로 해석된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각하지 말라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Don't \u003c/span>\u003cspan class=\"tgt\">assume\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 고유한 가치가 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">inherent \u003c/span>\u003cspan class=\"tgt\">value\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 해왔던 방식에\u003c/span>\u003cspan class=\"en\">to \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">done \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">항상 해왔던 방식에 어떤 고유한 가치가 있다고 생각하지 말라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지금까지 해온 방식을 당연한 기준으로 삼지 말라는 뜻이에요. 'the way you have always done things'는 곧 \u003cb class=\"key\">관행\u003c/b>이고, 그 관행에 \u003cb class=\"key\">고유한 \u003c/b>\u003cb class=\"key\">가치\u003c/b>가 있다고 \u003cb class=\"key\">가정\u003c/b>하지 말라는 조언이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 명령문\u003c/span> : Don't + [동사원형] ~ : \"생각하지 말라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : assume + [that + 주어 + 동사 ~] : \"어떤 고유한 가치가 있다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계부사가 생략된 the way 구문\u003c/span> : the way + [주어 + 동사] : \"당신이 항상 해왔던 방식\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Don't assume, 생각하지 말라. that there is some inherent value, 어떤 고유한 가치가 있다고. to the way you have always done things, 항상 해왔던 방식에. 이 문장 전체를 해석하면, 항상 해왔던 방식에 어떤 고유한 가치가 있다고 생각하지 말라.","hl":"m"},{"n":22,"text":"이 문장은 지금까지 해온 방식을 당연한 기준으로 삼지 말라는 뜻이에요. the way you have always done things는 우리가 말하는 관행이고, 그 관행에 고유한 가치가 있다고 가정하지 말라는 조언이죠. 그래서 익숙함을 곧 정답으로 착각하지 말자는 흐름으로 이해하면 돼요.","hl":"mn"},{"n":23,"text":"첫 번째로 Don't assume은 부정 명령문이에요. Don't 뒤에 동사원형 assume이 와서 금지의 의미를 만들어요. 두 번째로 that there is some inherent value는 assume의 목적어로 쓰인 명사절이고, 그 안에 there is 구문이 들어 있어요. 세 번째로 the way you have always done things는 the way 뒤에 관계부사가 생략된 구조로, you have always done things라는 관계절이 the way를 꾸며 준다고 보면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계속 집중하라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Keep \u003c/span>\u003cspan class=\"tgt\">focused\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이를 수 있는 최고가 되는 것에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">becoming \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">늘 존재해왔던 방식이 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">been\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">늘 존재해왔던 방식이 아니라, 이를 수 있는 최고가 되는 것에 계속 집중하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 '지금의 습관'이 아니라 '도달할 수 있는 최고의 모습'에 초점을 두라는 뜻이에요. focused on 뒤의 becoming과 not 이하의 how가 \u003cb class=\"key\">대조\u003c/b>를 이루며, 과거의 방식이 아니라 \u003cb class=\"key\">성장\u003c/b>의 방향을 보라는 조언이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사 focused를 이용한 상태 유지 표현\u003c/span> : keep + [focused (과거분사/보어)] : \"집중한 상태를 유지하라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 on + 동명사\u003c/span> : on + [동명사 ~] : \"최고가 되는 것에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 that이 생략된 최상급 수식\u003c/span> : the best + [that + 주어 + can be] : \"당신이 될 수 있는 최고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">not을 이용한 대조 표현\u003c/span> : [A], not [B] : \"당신이 항상 그래왔던 방식이 아니라\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Keep focused on, 계속 집중하라. becoming the best you can be, 이를 수 있는 최고가 되는 것에. not how you have always been, 늘 존재해왔던 방식이 아니라. 이 문장 전체를 해석하면, 늘 존재해왔던 방식이 아니라, 이를 수 있는 최고가 되는 것에 계속 집중하라.","hl":"m"},{"n":25,"text":"이 문장은 지금의 습관이 아니라 도달할 수 있는 최고의 모습에 초점을 두라는 뜻이에요. focused on 뒤의 becoming과 not 이하의 how가 대조를 이루면서 과거의 방식과 성장의 방향을 갈라 놓죠. 그래서 늘 해오던 모습에 머물지 말고 더 나은 자신을 향해 집중하라는 조언으로 읽으면 돼요.","hl":"mn"},{"n":26,"text":"첫 번째로 Keep focused는 keep이 '~한 상태를 유지하다'로 쓰인 표현이에요. focused는 과거분사가 형용사처럼 쓰여 보어 역할을 해요. 두 번째로 on becoming the best는 전치사 on 뒤에 동명사 becoming이 온 동명사구예요. 세 번째로 the best you can be는 the best 뒤에 관계대명사 that이 생략된 관계절이 붙은 구조고, 네 번째로 not how you have always been은 앞의 becoming the best와 대조를 이루는 병렬 표현이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>경영 대학원에서는 효과가 있든 없든 \u003cb class=\"key\">익숙한 \u003c/b>\u003cb class=\"key\">것을 \u003c/b>\u003cb class=\"key\">고수하려는\u003c/b> 타고난 성향을 극복하기 위한 의사결정 방법을 가르친다.\u003c/li>\u003cli>그 방법은 \u003cb class=\"key\">과거에 \u003c/b>\u003cb class=\"key\">행해져왔던 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 제쳐 두고 그 정책이 어떤 것이어야 하는가에 집중하는 것이다.\u003c/li>\u003cli>글쓴이는 같은 방법으로 자신의 목표를 가장 잘 성취하기 위해 어떻게 보이고 말하고 행동할지 검토하라고 한다.\u003c/li>\u003cli>\u003cb class=\"key\">항상 \u003c/b>\u003cb class=\"key\">해왔던 \u003c/b>\u003cb class=\"key\">방식\u003c/b>에 고유한 가치가 있다고 가정하지 말고, 늘 존재해왔던 방식이 아니라 이를 수 있는 최고가 되는 것에 집중해야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Do not assume inherent value in the way you have always done things; set the past aside and focus on becoming the best you can be.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">경영 대학원에서는 효과가 있든 없든 익숙한 것을 고수하려는 성향을 극복하기 위해, 과거에 행해져왔던 것을 제쳐 두고 그 정책이 어떠해야 하는가에 집중하는 방법을 가르친다. 우리도 같은 방법으로 \u003cb class=\"key\">항상 \u003c/b>\u003cb class=\"key\">해왔던 \u003c/b>\u003cb class=\"key\">방식\u003c/b>에 고유한 가치가 있다고 가정하지 말고, \u003cb class=\"key\">이를 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">최고\u003c/b>가 되는 것에 집중해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"오늘 글의 핵심은 아주 단순해요. 익숙하다는 이유만으로 과거의 방식을 당연시하지 말고, 마땅히 있어야 할 모습을 기준으로 삼자는 겁니다. 여러분의 공부 습관도 한 번쯤은 백지에서 다시 물어 보세요. 효과가 있었는지, 그리고 최선의 나에 얼마나 가까워지는지 말이죠. 오늘 수업 여기까지입니다. 수고했어요.","hl":null}]}]});</script></body></html>
