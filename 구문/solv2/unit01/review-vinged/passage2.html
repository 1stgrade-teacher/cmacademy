li><li>소의 울음소리(moos)가 자란 지역에 따라 차이가 난다고 믿음</li><li>핵심 키워드: 지역 억양(regional accents)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02언어학자들의 과학적 분석</div><ul><li>전문가들은 소가 사육자의 말투를 따라 할 가능성이 있다는 점에 주목하고 있다.</li><li>언어학자(linguists)들의 동의: 소의 울음소리 차이가 사실일 가능성 제기</li><li>소가 농부의 말하기 방식(speech patterns)을 학습하고 모방(mimic)함</li><li>핵심 키워드: 모방(mimicry)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03소들 사이의 전파와 결과</div><ul><li>습득된 울음소리 방식은 소들 사이에서 퍼져나가며 지역적 특징으로 자리 잡는다.</li><li>농부에게 배운 말투가 무리 내의 다른 소들에게 확산(spread)됨</li><li>아이들이 자란 곳의 언어 습관을 닮는 것과 같은 원리</li><li>지역 내 모든 소가 동일한 울음소리를 갖게 될 가능성</li><li>핵심 키워드: 습관의 전파(spread of patterns)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">farmer</td><td class=\"m\">농부</td></tr><tr><td class=\"w\">believe</td><td class=\"m\">믿다, 생각하다</td></tr><tr><td class=\"w\">unusual</td><td class=\"m\">독특한, 흔치 않은</td></tr><tr><td class=\"w\">opinion</td><td class=\"m\">의견</td></tr><tr><td class=\"w\">raise</td><td class=\"m\">기르다, 사육하다</td></tr><tr><td class=\"w\">region</td><td class=\"m\">지역</td></tr><tr><td class=\"w\">accent</td><td class=\"m\">억양, 말투</td></tr><tr><td class=\"w\">in other words</td><td class=\"m\">다시 말해서</td></tr><tr><td class=\"w\">depend on</td><td class=\"m\">~에 따라 다르다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surprisingly</td><td class=\"m\">놀랍게도</td></tr><tr><td class=\"w\">linguist</td><td class=\"m\">언어학자</td></tr><tr><td class=\"w\">agree</td><td class=\"m\">동의하다</td></tr><tr><td class=\"w\">actually</td><td class=\"m\">실제로</td></tr><tr><td class=\"w\">possible</td><td class=\"m\">가능한</td></tr><tr><td class=\"w\">pick up</td><td class=\"m\">(습관 등을) 익히다, 배우다</td></tr><tr><td class=\"w\">certain</td><td class=\"m\">특정한</td></tr><tr><td class=\"w\">trait</td><td class=\"m\">특성, 특징</td></tr><tr><td class=\"w\">particular</td><td class=\"m\">특정한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">영국의 농부들은</span><span class=\"en\"><b>Farmers in England</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오랫동안 믿어왔다</span><span class=\"en\"><b><span class=\"grammar-hl\">have long believed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 것을</span><span class=\"en\"><b>something</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 특이한</span><span class=\"en\"><b>quite unusual.</b></span></div></div><div class=\"lec-sent-ko\">영국의 농부들은 오랫동안 매우 특이한 것을 믿어왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 영국 농부들이 아주 오랫동안 특별하고 신기한 사실을 믿고 있었다는 서론입니다. 여기서 unusual은 사전적으로는 &#39;특이한&#39;이지만, 문맥상 &#39;상식적으로는 이해하기 힘든, 흥미로운 가설&#39;을 의미합니다. 독자의 호기심을 유발하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have long believed (현재완료): &#39;have + p.p.&#39; 형태로 과거부터 현재까지 이어지는 동작이나 상태를 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">farmer</td><td class=\"m\">농부</td></tr><tr><td class=\"w\">believe</td><td class=\"m\">믿다, 생각하다</td></tr><tr><td class=\"w\">unusual</td><td class=\"m\">독특한, 흔치 않은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들의 의견으로는,</span><span class=\"en\"><b>In their opinion,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소들은 길러진</span><span class=\"en\"><b><span class=\"grammar-hl\">cows raised</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 지역에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in different regions</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 나라의</span><span class=\"en\"><b>of the country</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 액센트를 가진다,</span><span class=\"en\"><b>have different accents,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 그러는 것처럼</span><span class=\"en\"><b><span class=\"grammar-hl\">just like people do</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들의 생각에 따르면, 서로 다른 지역에서 사육된 소들은 사람이 그러한 것처럼 서로 액센트가 다르다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;특이한 믿음&#39;이 구체적으로 무엇인지 밝힙니다. 사람들이 사는 곳에 따라 말투가 다르듯, 소들도 지역별로 고유한 소리(울음소리)를 낸다는 주장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cows raised in different regions (과거분사(형용사)): raise는 타동사인데 목적어가 없어서 과거분사 raised가 &#39;regions&#39;를 수식(= &#39;서로 다른 지역에서 길러진 소들&#39;, N + p.p. ≈ N that are p.p. 구조)</div><div class=\"lec-gr-item\">just like people do (대동사(do)): 앞의 일반동사 &#39;have different accents&#39;를 대신함. 앞의 동사가 일반동사이면 do를 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opinion</td><td class=\"m\">의견</td></tr><tr><td class=\"w\">raise</td><td class=\"m\">기르다, 사육하다</td></tr><tr><td class=\"w\">region</td><td class=\"m\">지역</td></tr><tr><td class=\"w\">accent</td><td class=\"m\">억양, 말투</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다시 말해서,</span><span class=\"en\"><b>In other words,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 ‘음매’ 소리는</span><span class=\"en\"><b>their ‘moos’</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다르게 들린다</span><span class=\"en\"><b>sound different</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지역에 따라</span><span class=\"en\"><b>depending on <span class=\"grammar-hl\">the area</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 길러진</span><span class=\"en\"><b><span class=\"grammar-hl\">where they were raised</span>.</b></span></div></div><div class=\"lec-sent-ko\">다시 말해, 소들의 ‘음매’ 소리가 사육된 지역에 따라 다르게 들린다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장을 다시 한번 풀어서 설명합니다. In other words(다시 말해)라는 연결어를 통해 앞의 내용을 더 명확히 전달하고, 소의 울음소리를 &#39;moos&#39;라고 표현하여 독자의 이해를 돕고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the area where they were raised (관계부사): &#39;the area&#39;를 선행사로 가지며, 뒤에 &#39;they were raised&#39;라는 완전한 절이 이어져 장소적 배경을 설명함.</div><div class=\"lec-gr-item\">were raised (수동태): be동사(were)+p.p.(raised) 구조. 기본구조: raise O (O를 기르다). 타동사 raise 뒤에 목적어가 없어서 수동구조 were raised 형태로 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">raise</td><td class=\"m\">기르다, 사육하다</td></tr><tr><td class=\"w\">in other words</td><td class=\"m\">다시 말해서</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">놀랍게도,</span><span class=\"en\"><b>Surprisingly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 언어학자들은 이제 동의한다</span><span class=\"en\"><b>many linguists now <span class=\"grammar-hl\">agree</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것이</span><span class=\"en\"><b><span class=\"grammar-hl\">that this</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로 사실일지도 모른다고</span><span class=\"en\"><b><span class=\"grammar-hl\">may actually be true</span>.</b></span></div></div><div class=\"lec-sent-ko\">놀랍게도 많은 언어학자들은 이것이 사실일 수 있다고 동의한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 농부들의 단순한 믿음(통념)이 전문가들의 시각에서는 과학적 근거가 있을 수 있다는 반전을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">agree that this may actually be true (명사절(that절)): &#39;agree&#39;라는 타동사의 목적어 역할을 하는 명사절로, &#39;이것이 사실일지도 모른다&#39;는 내용을 이끎.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surprisingly</td><td class=\"m\">놀랍게도</td></tr><tr><td class=\"w\">linguist</td><td class=\"m\">언어학자</td></tr><tr><td class=\"w\">agree</td><td class=\"m\">동의하다</td></tr><tr><td class=\"w\">actually</td><td class=\"m\">실제로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 말한다</span><span class=\"en\"><b>They say</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능할 수 있다고</span><span class=\"en\"><b>it could be <span class=\"grammar-hl\">possible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소들이 습득하는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">that cows pick up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정한 특징들을</span><span class=\"en\"><b>certain traits</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">농부들로부터</span><span class=\"en\"><b>from the <span class=\"grammar-hl\">farmers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 기르는</span><span class=\"en\"><b><span class=\"grammar-hl\">raising them</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 소가 자신들을 기르는 농부에게서 (언어적) 특징들을 익히는 게 가능할 수 있다고 말한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소들이 어떻게 다른 억양을 갖게 되는지에 대한 과학적 가설입니다. 여기서 pick up은 원래 &#39;집어 들다&#39;라는 뜻이지만, 여기서는 습관이나 언어적 특징을 &#39;본능적으로 익히다, 배우다&#39;라는 의미로 쓰였습니다. 자연스러운 학습 과정을 강조하려고 이 표현을 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">possible that cows pick up (가주어): 진주어: &#39;it&#39;이 가주어, &#39;that cows pick up...&#39; 절이 진주어 역할을 하여 문장의 핵심 내용을 뒤로 보냄.</div><div class=\"lec-gr-item\">farmers raising them (현재분사(형용사)): raising이 앞의 &#39;farmers&#39;를 수식하며, 소들을 기르고 있는 능동적인 상태를 설명함(N + -ing ≈ N that is -ing).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">farmer</td><td class=\"m\">농부</td></tr><tr><td class=\"w\">possible</td><td class=\"m\">가능한</td></tr><tr><td class=\"w\">pick up</td><td class=\"m\">(습관 등을) 익히다, 배우다</td></tr><tr><td class=\"w\">certain</td><td class=\"m\">특정한</td></tr><tr><td class=\"w\">trait</td><td class=\"m\">특성, 특징</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 소들이 보낸다면</span><span class=\"en\"><b>If the <span class=\"grammar-hl\">cows spend</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">충분한 시간을</span><span class=\"en\"><b>enough time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정한 농부와,</span><span class=\"en\"><b>with a particular farmer,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 더 가능성이 높을지도 모른다</span><span class=\"en\"><b>they may be more likely</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말투 패턴을 흉내 낼</span><span class=\"en\"><b>to mimic the speech <span class=\"grammar-hl\">patterns</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">농부에 의해 사용되는</span><span class=\"en\"><b><span class=\"grammar-hl\">used by the farmer</span>.</b></span></div></div><div class=\"lec-sent-ko\">특정한 농부와 오랜 시간을 보내면, 소는 농부에 의해 사용되는 말투를 흉내 낼 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가설을 더 구체화합니다. 소와 농부 사이의 &#39;접촉 시간&#39;이 길어지면, 소가 농부의 말투를 따라 하게 된다는 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cows spend (조건절): &#39;If&#39;를 사용한 부사절로, 소들이 특정 농부와 시간을 보내는 조건을 가정함.</div><div class=\"lec-gr-item\">patterns used by the farmer (과거분사(형용사)): use는 타동사인데 목적어가 없어서 과거분사 used가 &#39;patterns&#39;를 수식(= &#39;그 농부에 의해 사용된 말하기 패턴&#39;, N + p.p. ≈ N that is p.p. 구조)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">farmer</td><td class=\"m\">농부</td></tr><tr><td class=\"w\">particular</td><td class=\"m\">특정한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 이러한 말투 패턴은</span><span class=\"en\"><b>And these speech patterns</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그때 퍼질 수 있다</span><span class=\"en\"><b>could then be spread</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소에서 소로</span><span class=\"en\"><b>from cow to cow.</b></span></div></div><div class=\"lec-sent-ko\">그리고 이러한 말투는 소에서 소로 퍼질 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소 한 마리가 배운 특징이 같은 무리의 다른 소들에게도 전염되듯 확산될 수 있다는 확장된 추론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">could be spread (수동태): 조동사(could)+be동사(be)+p.p.(spread) 구조. 기본구조: spread O (O를 퍼뜨리다). 타동사 spread 뒤에 목적어가 없어서 수동구조 be spread 형태로 쓴다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">결과적으로,</span><span class=\"en\"><b>As a result,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마치 아이들이</span><span class=\"en\"><b>just as <span class=\"grammar-hl\">children</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정 지역에서 자란</span><span class=\"en\"><b><span class=\"grammar-hl\">brought up in a certain area</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 아이들처럼 들리는 것과 같이</span><span class=\"en\"><b>sound like other kids</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 지역의,</span><span class=\"en\"><b>from that region,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 소들은</span><span class=\"en\"><b>all of the cows</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정 지역에 있는</span><span class=\"en\"><b>in a certain area</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능성이 있을 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">would be likely</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같은 액센트를 가질</span><span class=\"en\"><b><span class=\"grammar-hl\">to have</span> the same accent</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 ‘음매’할 때</span><span class=\"en\"><b>when they mooed.</b></span></div></div><div class=\"lec-sent-ko\">결과적으로, 어떤 지역에서 자란 아이들(의 말)이 그 지역의 다른 아이들(의 말)같이 들리는 것처럼 특정 지역의 소는 ‘음매’할 때 같은 액센트를 가질 수 있는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 모든 내용을 종합한 결론입니다. 사람이 사는 지역에 따라 사투리가 생기는 원리와 소의 억양이 생기는 원리가 동일하다는 논리로 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">children brought up in a certain area (과거분사(형용사)): bring up은 타동사구인데 목적어가 없어서 과거분사 brought up이 &#39;children&#39;을 수식(= &#39;특정 지역에서 길러진 아이들&#39;, N + p.p. ≈ N that is p.p. 구조)</div><div class=\"lec-gr-item\">would be likely to have (to부정사): be likely to + 동사원형 구조에서 &#39;~할 가능성이 있다&#39;는 의미의 명사적/형용사적 보어 역할을 함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">region</td><td class=\"m\">지역</td></tr><tr><td class=\"w\">accent</td><td class=\"m\">억양, 말투</td></tr><tr><td class=\"w\">certain</td><td class=\"m\">특정한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>영국 농부들은 소도 사는 지역에 따라 억양이 다르다고 믿어왔다.</li><li>언어학자들은 소가 농부와 함께 지내며 그들의 말하기 패턴을 흉내 낼 가능성이 있다고 본다.</li><li>한 소가 배운 억양은 무리 전체로 퍼질 수 있다.</li><li>결국 인간의 사투리 형성 과정처럼, 소들도 지역별로 고유한 억양을 가지게 된다는 논리이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Cows may adopt regional accents as they mimic their farmers, and these characteristics can eventually spread among the herd.</div>\n              <div class=\"lec-final-sum-ko\">소는 사육자를 따라 하면서 지역적인 억양을 가질 수 있고, 이러한 특성은 결국 무리 내에서 퍼질 수 있다.</div></div></div>"],"segs":[[{"audio":"./v-ing, v-ed Review passage2_강의_audio/1.mp3","hl":null}],[{"audio":"./v-ing, v-ed Review passage2_강의_audio/2.mp3","hl":null}],[{"audio":"./v-ing, v-ed Review passage2_강의_audio/3.mp3","hl":null},{"audio":"./v-ing, v-ed Review passage2_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./v-ing, v-ed Review passage2_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./v-ing, v-ed Review passage2_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./v-ing, v-ed Review passage2_강의_audio/7.mp3","hl":null}],[{"audio":"./v-ing, v-ed Review passage2_강의_audio/8.mp3","hl":"main"},{"audio":"./v-ing, v-ed Review passage2_강의_audio/9.mp3","hl":"meaning"},{"audio":"./v-ing, v-ed Review passage2_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./v-ing, v-ed Review passage2_강의_audio/11.mp3","hl":"main"},{"audio":"./v-ing, v-ed Review passage2_강의_audio/12.mp3","hl":"meaning"},{"audio":"./v-ing, v-ed Review passage2_강의_audio/13.mp3","hl":"grammar"}],[{"audio":"./v-ing, v-ed Review passage2_강의_audio/14.mp3","hl":"main"},{"audio":"./v-ing, v-ed Review passage2_강의_audio/15.mp3","hl":"meaning"},{"audio":"./
