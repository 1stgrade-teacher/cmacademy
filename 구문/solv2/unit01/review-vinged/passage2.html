</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"v-ing, v-ed Review passage2","audioDir":"passage2_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.468em\">v-ing/v-ed\u003cbr>review\u003cbr>reading02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Do Cows Have Regional Accents?\u003c/h1>\u003ch2>소도 지역마다 액센트가 다를까?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>영국의 농부들은 서로 다른 지역에서 사육된 소들이 사람처럼 서로 다른 \u003cb class=\"key\">액센트\u003c/b>를 가진다고 오랫동안 믿어 왔는데, 놀랍게도 많은 언어학자들도 이것이 사실일 수 있다고 동의한다. 소가 자신을 기르는 \u003cb class=\"key\">농부\u003c/b>의 \u003cb class=\"key\">말투\u003c/b>를 흉내 내고 그것이 소에서 소로 퍼지면서, 같은 지역의 소들은 '음매'할 때 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">액센트\u003c/b>를 가지게 될 수 있다는 것이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Cows raised in the same region may share the same accent because they pick up and mimic the speech patterns of the farmers raising them.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘 읽을 지문은 영국의 소들이 지역마다 다른 액센트를 가진다는 아주 흥미로운 이야기예요. 농부들의 오랜 믿음에서 시작해서 언어학자들의 동의와 근거로 이어지고, 마지막에 아이들의 말투 비유로 정리되는 글입니다. 요지는 소가 자신을 기르는 농부의 말투를 흉내 내면서 같은 지역 소들이 같은 액센트를 갖게 될 수 있다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사람은 사는 지역에 따라 발음과 억양이 달라지는데, 이 억양을 accent, 지역 차이가 뚜렷한 말의 갈래를 dialect라고 불러요. 최근에는 동물도 소리로 의사를 전하며 주변 환경에 따라 그 소리가 조금씩 달라진다는 연구가 많습니다. 부모나 무리 속 어른을 따라 하며 배우는 이런 방식을 social learning, 즉 사회적 학습이라고 해요. 우리도 친한 친구와 오래 지내다 보면 말투와 억양이 은근히 비슷해지잖아요. 소 역시 자기 옆에서 자기를 기르는 농부를 오래 보면서 그 \u003cb class=\"key\">말투\u003c/b>를 조금씩 따라 하게 될 수 있다는 발상이 이 글의 출발점입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 깔아 볼게요. 사람은 사는 지역에 따라 발음과 억양이 달라지는데, 이 억양을 영어로 accent라고 하고 지역 차이가 뚜렷한 말의 갈래를 dialect라고 불러요. 최근에는 동물도 소리로 의사를 전하고 주변 환경에 따라 그 소리가 조금씩 달라진다는 연구가 많습니다. 부모나 무리 속 어른을 따라 하며 배우는 이런 방식을 social learning, 우리말로 사회적 학습이라고 해요. 우리도 친한 친구와 오래 지내다 보면 말투와 억양이 은근히 비슷해지잖아요. 소 역시 자기 옆에서 자기를 기르는 농부를 오래 보면서 그 말투를 조금씩 따라 하게 될 수 있다는 발상이 이 글의 출발점입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>농부들의 오랜 믿음\u003csmall>통념 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>영국의 \u003cb class=\"key\">농부\u003c/b>들은 오랫동안 매우 특이한 것을 믿어 왔어요. 서로 다른 지역에서 사육된 소들은 사람처럼 서로 \u003cb class=\"key\">액센트\u003c/b>가 다르다는 생각이었죠. 다시 말해 소들의 '음매' 소리가 사육된 \u003cb class=\"key\">지역\u003c/b>에 따라 다르게 들린다는 것입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>언어학자들의 동의\u003csmall>주장 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>놀랍게도 많은 \u003cb class=\"key\">언어학자\u003c/b>들은 이것이 사실일 수 있다고 동의합니다. 소가 자신들을 기르는 농부에게서 특정한 \u003cb class=\"key\">특징\u003c/b>을 익히는 게 가능할 수 있다고 말하죠. 즉 소의 액센트가 농부의 영향에서 비롯될 수 있다는 주장입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>흉내와 확산\u003csmall>근거 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>특정한 농부와 오랜 시간을 보내면 소는 그 농부가 사용하는 \u003cb class=\"key\">말투\u003c/b>를 \u003cb class=\"key\">흉내\u003c/b> 낼 수 있습니다. 그리고 이렇게 익힌 말투는 \u003cb class=\"key\">소에서 \u003c/b>\u003cb class=\"key\">소로\u003c/b> 퍼질 수 있고요. 한 마리의 변화가 무리 전체로 번지는 셈입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>지역별 같은 액센트\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>결과적으로 어떤 지역에서 자란 \u003cb class=\"key\">아이들\u003c/b>이 그 지역의 다른 아이들처럼 들리는 것과 같습니다. 마찬가지로 특정 지역의 소들은 '음매'할 때 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">액센트\u003c/b>를 가질 가능성이 높다는 것이죠. 앞의 믿음이 아이들의 언어 습득이라는 친숙한 \u003cb class=\"key\">비유\u003c/b>로 정리되는 부분입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 통념을 먼저 던지고, 그 통념이 사실일 수 있다는 주장과 근거를 차례로 보여 준 뒤 결론으로 내려가는 흐름이에요.","hl":null},{"n":4,"text":"첫 번째 단계는 농부들의 오랜 믿음이에요. 영국의 농부들은 오랫동안 매우 특이한 것을 믿어 왔습니다. 서로 다른 지역에서 사육된 소들은 사람처럼 서로 액센트가 다르다는 생각이었죠. 다시 말해 소들의 음매 소리가 사육된 지역에 따라 다르게 들린다고 본 거예요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 언어학자들의 동의예요. 놀랍게도 많은 언어학자들은 이것이 사실일 수 있다고 동의합니다. 소가 자신들을 기르는 농부에게서 특정한 특징을 익히는 게 가능할 수 있다고 말하죠. 소의 액센트가 농부의 영향에서 비롯될 수 있다는 주장인 거예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 흉내와 확산이에요. 특정한 농부와 오랜 시간을 보내면 소는 그 농부가 사용하는 말투를 흉내 낼 수 있습니다. 그리고 이렇게 익힌 말투는 소에서 소로 퍼질 수 있어요. 한 마리의 변화가 무리 전체로 번지는 거죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결론이에요. 어떤 지역에서 자란 아이들이 그 지역의 다른 아이들처럼 들리는 것과 같습니다. 마찬가지로 특정 지역의 소들은 음매할 때 같은 액센트를 가질 가능성이 높다는 거예요. 아이들의 언어 습득이라는 친숙한 비유로 앞의 믿음을 정리한 부분입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 농부들의 \u003cb class=\"key\">통념\u003c/b>을 먼저 제시하고, 그것이 사실일 수 있다는 \u003cb class=\"key\">언어학자\u003c/b>들의 주장을 편 다음, 흉내와 확산이라는 \u003cb class=\"key\">근거\u003c/b>를 대는 방식으로 전개됩니다. 결정적인 결론이 여덟 번째 문장에서야 나오기 때문에 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있어요. 화자의 입장이 마지막에 분명하게 정리되는, 주장과 근거가 결합된 전형적인 설명문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In other words (3)\u003c/b>\u003cspan>재진술\u003c/span>\u003cb>Surprisingly (4)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>As a result (8)\u003c/b>\u003cspan>결론·인과\u003c/span>\u003cb>just as (8)\u003c/b>\u003cspan>비유·유추\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">have different accents\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their 'moos' sound different\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mimic the speech patterns\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">have the same accent when they mooed\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 주장과 근거의 구조예요. 농부들의 믿음을 소개하고, 언어학자들도 그게 사실일 수 있다고 동의한다는 주장을 편 다음, 흉내와 확산이라는 근거를 대죠. 결정적인 결론이 맨 마지막 문장에 나오니까 미괄식 구조로 보시면 됩니다.","hl":"ty"},{"n":9,"text":"신호어를 잘 보세요. 세 번째 문장의 In other words는 앞의 내용을 다시 말해 주는 재진술 신호예요. 네 번째 문장의 Surprisingly는 통념을 놀라운 방향으로 뒤집는 전환이고요. 마지막 문장의 As a result는 인과를 정리하는 결론 신호이고, just as는 아이들과 소를 나란히 놓는 비유의 표시입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>farmer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>농부\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unusual\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특이한, 색다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>in one's opinion\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 생각에 따르면\u003c/span>\u003c/div>\u003cdiv>\u003cb>raise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기르다, 사육하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른, 서로 다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>region\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지역\u003c/span>\u003c/div>\u003cdiv>\u003cb>accent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>액센트, 억양\u003c/span>\u003c/div>\u003cdiv>\u003cb>in other words\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 말해\u003c/span>\u003c/div>\u003cdiv>\u003cb>moo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음매(소의 울음소리)\u003c/span>\u003c/div>\u003cdiv>\u003cb>depend on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 달려 있다, ~에 따라 다르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>area\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지역, 구역\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprisingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>놀랍게도\u003c/span>\u003c/div>\u003cdiv>\u003cb>linguist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>언어학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>agree\u003c/b>\u003cem>동사\u003c/em>\u003cspan>동의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로, 정말로\u003c/span>\u003c/div>\u003cdiv>\u003cb>true\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사실인, 진실의\u003c/span>\u003c/div>\u003cdiv>\u003cb>possible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>익히다, 습득하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>certain\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특정한, 어떤\u003c/span>\u003c/div>\u003cdiv>\u003cb>trait\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특징, 특성\u003c/span>\u003c/div>\u003cdiv>\u003cb>particular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특정한, 특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>be likely to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 가능성이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mimic\u003c/b>\u003cem>동사\u003c/em>\u003cspan>흉내 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>speech pattern\u003c/b>\u003cem>명사\u003c/em>\u003cspan>말투, 발화 패턴\u003c/span>\u003c/div>\u003cdiv>\u003cb>spread\u003c/b>\u003cem>동사\u003c/em>\u003cspan>퍼지다, 확산되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>as a result\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결과적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기르다, 양육하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sound like\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~처럼 들리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>the same\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>같은, 동일한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어는 세 가지를 꼭 챙기세요. pick up은 책을 집어 든다가 아니라 특징이나 말투를 익힌다는 뜻으로 쓰였어요. mimic은 흉내 내다는 뜻이고, speech pattern은 말투나 발화 패턴을 가리킵니다. bring up은 아이를 기르고 양육한다는 뜻으로, 앞에 나온 raised와 같은 의미로 바꿔 쓴 표현이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">unusual\u003c/b>\u003cspan class=\"m\">특이한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">uncommon\u003c/span>\u003cspan class=\"s\">extraordinary\u003c/span>\u003cspan class=\"s\">strange\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">believe\u003c/b>\u003cspan class=\"m\">믿다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">think\u003c/span>\u003cspan class=\"s\">trust\u003c/span>\u003cspan class=\"s\">regard\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003cspan class=\"a\">disbelieve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">region\u003c/b>\u003cspan class=\"m\">지역\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">area\u003c/span>\u003cspan class=\"s\">district\u003c/span>\u003cspan class=\"s\">zone\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">agree\u003c/b>\u003cspan class=\"m\">동의하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">concur\u003c/span>\u003cspan class=\"s\">consent\u003c/span>\u003cspan class=\"s\">accept\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disagree\u003c/span>\u003cspan class=\"a\">object\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">possible\u003c/b>\u003cspan class=\"m\">가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">likely\u003c/span>\u003cspan class=\"s\">feasible\u003c/span>\u003cspan class=\"s\">probable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">impossible\u003c/span>\u003cspan class=\"a\">unlikely\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mimic\u003c/b>\u003cspan class=\"m\">흉내 내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">imitate\u003c/span>\u003cspan class=\"s\">copy\u003c/span>\u003cspan class=\"s\">echo\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">originate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">spread\u003c/b>\u003cspan class=\"m\">퍼지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">expand\u003c/span>\u003cspan class=\"s\">circulate\u003c/span>\u003cspan class=\"s\">diffuse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">contain\u003c/span>\u003cspan class=\"a\">restrict\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. unusual은 uncommon이나 extraordinary로 바꿀 수 있고 반대말은 common이에요. believe는 think나 trust, 반대는 doubt이고요. region은 area나 district로 바꿀 수 있고, agree는 concur나 consent, 반대는 disagree입니다. mimic은 imitate나 copy, spread는 expand나 circulate로 바꿔 쓸 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영국의 농부들은\u003c/span>\u003cspan class=\"en\">Farmers in England\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오랫동안 믿어왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">believed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 특이한 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">quite \u003c/span>\u003cspan class=\"tgt\">unusual\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">영국의 농부들은 오랫동안 매우 특이한 것을 믿어왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 영국 농부들이 소에 관한 특이한 믿음을 가지고 있음을 도입하는 문장이다. 글 전체의 화제인 \u003cb class=\"key\">소의 \u003c/b>\u003cb class=\"key\">액센트\u003c/b>를 자연스럽게 꺼내기 위한 \u003cb class=\"key\">도입부\u003c/b> 역할을 한다. something quite unusual은 뒤에서 구체적으로 설명될 \u003cb class=\"key\">특이한 \u003c/b>\u003cb class=\"key\">주장\u003c/b>을 가리킨다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(계속)\u003c/span> : have/has + [과거분사] (long: 오랫동안) : \"오랫동안 믿어왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정대명사의 형용사 후치 수식\u003c/span> : [something] + [형용사(구)] : \"매우 특이한 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Farmers in England, 영국의 농부들은. have long believed, 오랫동안 믿어왔다. something quite unusual, 매우 특이한 것을. 이 문장 전체를 해석하면, 영국의 농부들은 오랫동안 매우 특이한 것을 믿어왔다.","hl":"m"},{"n":13,"text":"이 문장은 영국 농부들이 소에 관한 특이한 믿음을 가지고 있다는 점을 꺼내는 도입부예요. 글 전체의 화제인 소의 액센트를 자연스럽게 소개하고, something quite unusual이 뒤에서 설명될 특이한 주장을 가리킨다고 잡으면 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째로 have long believed는 현재완료로, 과거부터 지금까지 이어지는 계속의 느낌을 살려 오랫동안 믿어왔다고 해석해요. 두 번째로 something quite unusual은 부정대명사 something을 형용사가 뒤에서 꾸며 주는 어순이에요. 그래서 매우 특이한 것이라고 앞에서부터 자연스럽게 읽으면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 생각에 따르면,\u003c/span>\u003cspan class=\"en\">In their opinion,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 나라의 서로 다른 지역에서 사육된 소들은\u003c/span>\u003cspan class=\"en\">cows \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">raised \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">regions \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">country\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로 다른 액센트를 가진다\u003c/span>\u003cspan class=\"en\">have different accents,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람이 그러한 것처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들의 생각에 따르면, 서로 다른 지역에서 사육된 소들은 사람이 그러한 것처럼 서로 액센트가 다르다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소들도 사람처럼 지역에 따라 액센트가 다를 수 있다는 \u003cb class=\"key\">농부들의 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 구체화한다. cows raised는 '사육된 소들'이라는 \u003cb class=\"key\">과거분사\u003c/b> 수식 구조이고, just like people do는 사람의 경우와 \u003cb class=\"key\">비교\u003c/b>해 독자의 이해를 돕는다. 전체 글의 핵심 주제인 소의 지역별 액센트를 제시한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사 후치 수식(수동)\u003c/span> : [명사 cows] + [과거분사구 raised ...] : \"그 나라의 서로 다른 지역에서 사육된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교 표현과 대동사 do\u003c/span> : just like + [명사/절] / people do = people have accents : \"사람이 그러한 것처럼\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"In their opinion, 그들의 생각에 따르면. cows raised in different regions of the country, 그 나라의 서로 다른 지역에서 사육된 소들은. have different accents, 서로 다른 액센트를 가진다. just like people do, 사람이 그러한 것처럼. 이 문장 전체를 해석하면, 그들의 생각에 따르면, 서로 다른 지역에서 사육된 소들은 사람이 그러한 것처럼 서로 액센트가 다르다.","hl":"m"},{"n":16,"text":"이 문장은 소들도 사람처럼 지역에 따라 액센트가 다를 수 있다는 농부들의 생각을 구체화해요. cows raised는 사육된 소들이라는 과거분사 수식으로 잡고, just like people do는 사람의 경우와 비교해서 독자의 이해를 돕는 표현이에요. 전체 글의 핵심 주제인 소의 지역별 액센트를 제시하는 문장입니다.","hl":"mn"},{"n":17,"text":"첫 번째로 raised in different regions of the country는 cows를 뒤에서 꾸미는 과거분사 표현이에요. 소가 사육되는 수동 관계라서 raised를 쓰고, which are raised의 수동 구조가 줄어든 것으로 이해하면 됩니다. 두 번째로 just like people do는 꼭 사람처럼이라는 비교 표현이고, do는 앞의 have different accents를 대신하는 대동사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 말해,\u003c/span>\u003cspan class=\"en\">In other words,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 ‘음매’ 소리는 다르게 들린다\u003c/span>\u003cspan class=\"en\">their 'moos' \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sound \u003c/span>\u003cspan class=\"tgt\">different\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지역에 따라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">depending \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">area\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 사육된 곳에 따라서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">raised\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">(B) 다시 말해, 소들의 ‘음매’ 소리가 사육된 지역에 따라 다르게 들린다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 \u003cb class=\"key\">주장\u003c/b>을 '지역에 따라 음매 소리가 다르다'고 쉽게 바꿔 말한다. their moos sound different는 \u003cb class=\"key\">감각동사\u003c/b> sound 뒤에 형용사 different가 온 구조이며, where they were raised는 \u003cb class=\"key\">관계부사\u003c/b> where로 사육된 장소를 설명한다. 추상적인 주장을 구체적인 소리 차이로 예시화한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감각동사 + 형용사(주격보어)\u003c/span> : sound + [형용사] (different: 주격보어) : \"다르게 들린다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문(조건·양태)\u003c/span> : [Depending on + 명사] = ~에 따라 : \"지역에 따라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계부사 where\u003c/span> : [the area] + [where + 주어 + 동사] : \"그들이 사육된 곳\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"In other words, 다시 말해. their 'moos' sound different, 그들의 ‘음매’ 소리는 다르게 들린다. depending on the area, 지역에 따라. where they were raised, 그들이 사육된 곳에 따라서. 이 문장 전체를 해석하면, (B) 다시 말해, 소들의 ‘음매’ 소리가 사육된 지역에 따라 다르게 들린다는 것이다.","hl":"m"},{"n":19,"text":"이 문장은 앞 문장의 주장을 지역에 따라 음매 소리가 다르다고 쉽게 바꿔 말해요. their moos sound different는 감각동사 sound 뒤에 형용사 different가 온 구조이고, where they were raised는 관계부사 where로 사육된 장소를 설명해요. 추상적인 주장을 구체적인 소리 차이로 예시화하는 문장입니다.","hl":"mn"},{"n":20,"text":"첫 번째로 sound different는 감각동사 sound 뒤에 형용사 different가 주격보어로 와서 주어의 상태를 설명하는 구조예요. 두 번째로 depending on the area는 지역에 따라라는 분사구문으로 문장에 조건의 의미를 더해 줍니다. 세 번째로 where they were raised는 장소의 선행사 the area를 받는 관계부사 where가 쓰였고, they were raised는 그들이 사육되었다는 수동태로 이해하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀랍게도,\u003c/span>\u003cspan class=\"en\">Surprisingly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 언어학자들은 이제 동의한다\u003c/span>\u003cspan class=\"en\">many linguists now agree\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이 실제로 사실일 수 있다고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">actually \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">true\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">놀랍게도 많은 언어학자들은 이것이 사실일 수 있다고 동의한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 소마다 울음소리의 억양이 다를 수 있다는 흥미로운 이야기가 나왔죠. 이 문장은 그 주장에 \u003cb class=\"key\">언어학자\u003c/b>들의 입을 빌려 \u003cb class=\"key\">근거\u003c/b>를 보태 주는 역할을 해요. Surprisingly로 놀라움을 앞세워 독자가 다음 문장의 이유 설명으로 넘어가게 만드는 연결 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that (동사 agree의 목적어절)\u003c/span> : agree + [that + 주어(this) + may + 동사원형 …] (that절 = 목적어) : \"이것이 실제로 사실일 수 있다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 may + 부사 + 형용사\u003c/span> : may + [부사 actually] + [be true (형용사)] : \"실제로 사실일 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Surprisingly, 놀랍게도. many linguists now agree, 많은 언어학자들은 이제 동의한다. that this may actually be true, 이것이 실제로 사실일 수 있다고.. 이 문장 전체를 해석하면, 놀랍게도 많은 언어학자들은 이것이 사실일 수 있다고 동의한다.","hl":"m"},{"n":22,"text":"바로 앞에서 소마다 울음소리가 다를 수 있다는 이야기가 나왔죠. 이 문장은 그 이야기를 언어학자들까지 인정한다고 말하면서 근거를 보태는 역할을 해요. 놀랍게도라는 말로 독자의 흥미를 확 끌어 주는 문장이에요.","hl":"mn"},{"n":23,"text":"먼저 that은 동사 agree 뒤에서 목적어 역할을 하는 명사절 접속사예요. 그래서 뒤에 이것이 사실일 수 있다는 완전한 문장이 통째로 와 있죠. 두 번째로 may actually be true를 보면, 조동사 may 뒤에 동사원형 be가 왔고, 그 사이에 부사 actually가 끼어들어 강조하고 있어요. 조동사 뒤에는 언제나 동사원형이 온다는 점, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 말한다\u003c/span>\u003cspan class=\"en\">They say\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 가능할 수 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">possible \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소가 특정한 특징들을 익히는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">cows \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">pick \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">certain \u003c/span>\u003cspan class=\"tgt\">traits\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들을 기르는 농부에게서.\u003c/span>\u003cspan class=\"en\">from \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">farmers \u003c/span>\u003cspan class=\"tgt\">raising \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 소가 자신들을 기르는 농부에게서 (언어적) 특징들을 익히는 게 가능할 수 있다고 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언어학자들이 동의했다는 내용을 구체적으로 풀어 주는 문장이에요. 소가 농부에게서 \u003cb class=\"key\">특징\u003c/b>을 배울 수도 있다는 \u003cb class=\"key\">가능성\u003c/b>을 조심스럽게 제시하면서, 다음 문장의 구체적 조건 설명으로 넘어가는 발판을 놓죠. could나 may를 써서 단정하지 않은 점이 이 글의 신중한 태도를 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it / 진주어 that절\u003c/span> : It + be동사 + 형용사 + [that + 주어 + 동사 …] (it = 가주어, that절 = 진주어) : \"소가 특정한 특징들을 익히는 것이 가능할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(동사 + 부사)\u003c/span> : [동사 pick] + [부사 up] = 하나의 덩어리 동사 : \"익히다, 습득하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사의 한정적 용법(능동)\u003c/span> : [명사 the farmers] + [현재분사 raising + 목적어 them] (앞 명사를 뒤에서 수식) : \"자신들을 기르는 농부\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They say, 그들은 말한다. it could be possible, 그것이 가능할 수 있다고. that cows pick up certain traits, 소가 특정한 특징들을 익히는 것이. from the farmers raising them, 자신들을 기르는 농부에게서.. 이 문장 전체를 해석하면, 그들은 소가 자신들을 기르는 농부에게서 (언어적) 특징들을 익히는 게 가능할 수 있다고 말한다.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 언어학자들이 동의했다는 내용을 구체적으로 풀어 주는 역할을 해요. 소가 농부에게서 특징을 배울 수도 있다는 가능성을 제시하면서, 다음 문장에서 그 이유를 설명할 발판을 마련하죠. could 같은 표현을 써서 단정하지 않고 조심스럽게 말하고 있다는 점도 눈여겨보세요.","hl":"mn"},{"n":26,"text":"첫 번째로 it could be possible that 이하를 보세요. 여기서 it은 가주어이고 진짜 주어는 뒤에 있는 that절이에요. 그래서 해석할 때 it을 그것으로 옮기지 말고, 소가 특징을 익히는 것이 가능할 수 있다고 읽어야 자연스러워요. 두 번째로 the farmers raising them에서 raising은 현재분사로 앞의 farmers를 꾸며 주고, 소를 기르는 쪽이 농부니까 능동 관계라서 ing 형태가 온 거예요. 세 번째로 pick up은 집어 올린다는 뜻에서 출발해 익히다, 습득하다로 쓰이는 구동사라는 점도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 소가 충분한 시간을 보낸다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cows \u003c/span>\u003cspan class=\"tgt\">spend \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정한 농부와\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">particular \u003c/span>\u003cspan class=\"tgt\">farmer\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 더욱 흉내 낼 가능성이 있다\u003c/span>\u003cspan class=\"en\">they may \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">mimic\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 농부에 의해 사용되는 말투를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">speech \u003c/span>\u003cspan class=\"tgt\">patterns \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">farmer\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">(A) 특정한 농부와 오랜 시간을 보내면, 소는 농부에 의해 사용되는 말투를 흉내 낼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소가 농부의 말투를 배우는 조건과 결과를 한 문장에 담은 핵심 문장이에요. 충분한 시간을 함께 보내는 것이 \u003cb class=\"key\">조건\u003c/b>, 말투를 흉내 낼 가능성이 높아지는 것이 \u003cb class=\"key\">결과\u003c/b>죠. 앞 문장의 막연한 가능성을 구체적인 상황으로 끌어내려, 다음 문장의 '농부에서 소로, 소에서 소로' 확산 논리로 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건을 나타내는 부사절 접속사 if\u003c/span> : [If + 주어 + 동사 …], 주어 + may … (조건 → 결과) : \"만약 소가 특정한 농부와 충분한 시간을 보낸다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be likely to부정사 (형용사 + to부정사)\u003c/span> : [be likely] + [to + 동사원형] (more는 likely의 비교급) : \"흉내 낼 가능성이 더 크다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 한정적 용법(수동)\u003c/span> : [명사 the speech patterns] + [과거분사 used + by + 행위자] : \"그 농부에 의해 사용되는 말투\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"If the cows spend enough time, 만약 소가 충분한 시간을 보낸다면. with a particular farmer, 특정한 농부와. they may be more likely to mimic, 그들은 더욱 흉내 낼 가능성이 있다. the speech patterns used by the farmer, 그 농부에 의해 사용되는 말투를.. 이 문장 전체를 해석하면, (A) 특정한 농부와 오랜 시간을 보내면, 소는 농부에 의해 사용되는 말투를 흉내 낼 수 있다.","hl":"m"},{"n":28,"text":"이 문장은 소가 어떻게 농부의 말투를 배우게 되는지 그 조건과 결과를 아주 분명하게 보여 줘요. 충분한 시간을 함께 보내는 것이 조건이고, 그 결과로 흉내 낼 가능성이 높아진다는 거죠. 앞 문장의 가능성을 구체적인 상황으로 끌어내리는 핵심 문장이라서 서술형으로도 충분히 나올 수 있어요.","hl":"mn"},{"n":29,"text":"먼저 If the cows spend enough time에서 if는 조건을 이끄는 접속사예요. 미래의 일이라도 if절 안에서는 will을 쓰지 않고 현재시제 spend를 쓴다는 점이 중요해요. 두 번째로 be more likely to mimic을 보면, likely라는 형용사 뒤에 to부정사가 붙어서 흉내 낼 가능성이 있다는 뜻이 되고, more 때문에 가능성이 더 크다는 비교의 느낌이 살아요. 세 번째로 the speech patterns used by the farmer에서 used는 과거분사예요. 말투는 농부가 사용하는 대상, 즉 수동 관계니까 ing가 아니라 ed 형태가 온 것이고, 뒤에 by the farmer가 붙어서 누가 사용하는지 알려 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div n class=\"tgt\">mooed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">(C) 결과적으로, 어떤 지역에서 자란 아이들(의 말)이 그 지역의 다른 아이들(의 말)같이 들리는 것처럼 특정 지역의 소는 ‘음매’할 때 같은 액센트를 가질 수 있는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 인간 아이들의 지역별 말투와 소들의 지역별 울음소리를 \u003cb class=\"key\">비교\u003c/b>하며 글을 \u003cb class=\"key\">결론\u003c/b>짓는 역할을 해요. 앞에서 설명한 소의 말투 전파가 지역 전체의 공통 \u003cb class=\"key\">액센트\u003c/b>로 이어질 수 있다는 뜻이죠. just as는 아이들의 경우처럼 소도 그렇다는 \u003cb class=\"key\">유추\u003c/b>를 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교 접속사 just as\u003c/span> : just as + [절], [절] : \"…처럼, …와 마찬가지로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 용법\u003c/span> : children + [brought up in a certain area] (과거분사구가 children을 수식) : \"어떤 지역에서 자란\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be likely to do\u003c/span> : would + be likely + [to have] : \"가질 가능성이 있을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">시간 부사절 접속사 when\u003c/span> : when + [주어] + [동사] : \"그들이 음매할 때\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"As a result, 결과적으로. just as children brought up in a certain area, 어떤 지역에서 자란 아이들이. sound like other kids from that region, 그 지역의 다른 아이들(의 말)같이 들리는 것처럼. all of the cows in a certain area, 특정 지역의 소는. would be likely to have the same accent, 같은 액센트를 가질 수 있는 것이다. when they mooed, ‘음매’할 때. 이 문장 전체를 해석하면, (C) 결과적으로, 어떤 지역에서 자란 아이들(의 말)이 그 지역의 다른 아이들(의 말)같이 들리는 것처럼 특정 지역의 소는 ‘음매’할 때 같은 액센트를 가질 수 있는 것이다.","hl":"m"},{"n":34,"text":"이 문장은 인간 아이들의 지역별 말투와 소들의 지역별 울음소리를 비교하며 글을 결론짓는 역할을 해요. 앞에서 설명한 소의 말투 전파가 지역 전체의 공통 액센트로 이어질 수 있다는 뜻이죠. just as는 아이들의 경우처럼 소도 그렇다는 유추를 만들어 줍니다.","hl":"mn"},{"n":35,"text":"첫 번째로 just as는 두 상황을 비교하는 비교 접속사예요. 아이들의 경우와 소들의 경우를 나란히 놓아 유추를 만들어 주죠. 두 번째로 brought up은 children을 뒤에서 꾸미는 과거분사구이고, 양육된, 자란이라는 수동 의미를 가져요. 세 번째로 would be likely to have는 ~할 가능성이 있다는 표현에 would가 붙어 추측을 부드럽게 만든 형태예요. 네 번째로 when they mooed는 when이 이끄는 시간 부사절로, 음매할 때라는 상황을 제시합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>영국의 \u003cb class=\"key\">농부\u003c/b>들은 지역마다 소의 \u003cb class=\"key\">액센트\u003c/b>가 다르다고 오랫동안 믿어 왔다.\u003c/li>\u003cli>놀랍게도 많은 \u003cb class=\"key\">언어학자\u003c/b>들도 이것이 사실일 수 있다고 동의한다.\u003c/li>\u003cli>소는 자신을 기르는 농부의 \u003cb class=\"key\">말투\u003c/b>를 흉내 내고, 그것이 소에서 소로 \u003cb class=\"key\">퍼질\u003c/b> 수 있다.\u003c/li>\u003cli>그래서 같은 지역에서 자란 소들은 '음매'할 때 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">액센트\u003c/b>를 가질 가능성이 높다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Cows raised in the same region may share the same accent because they pick up and mimic the speech patterns of the farmers raising them.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">영국의 농부들은 서로 다른 지역에서 사육된 소들이 사람처럼 서로 다른 \u003cb class=\"key\">액센트\u003c/b>를 가진다고 오랫동안 믿어 왔는데, 놀랍게도 많은 언어학자들도 이것이 사실일 수 있다고 동의한다. 소가 자신을 기르는 \u003cb class=\"key\">농부\u003c/b>의 \u003cb class=\"key\">말투\u003c/b>를 흉내 내고 그것이 소에서 소로 퍼지면서, 같은 지역의 소들은 '음매'할 때 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">액센트\u003c/b>를 가지게 될 수 있다는 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 글의 핵심은 결국 한 가지예요. 소도 자신을 기르는 농부의 말투를 익히고 그것이 무리로 퍼지면서 지역마다 다른 액센트를 가질 수 있다는 것. 통념이 주장과 근거를 만나 어떻게 결론으로 정리되는지, 그 흐름을 꼭 기억해 두세요. 오늘 수업도 수고 많았어요.","hl":null}]}]});</script></body></html>
