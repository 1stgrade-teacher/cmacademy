</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"v-ing, v-ed Review passage4","audioDir":"passage4_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.468em\">v-ing/v-ed\u003cbr>review\u003cbr>reading04\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>No Refrigeration, So Store Your Meat in Other People's Minds\u003c/h1>\u003ch2>냉장고가 없어서 이웃의 몸과 마음에 고기를 저장하다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>진화 심리학자들은 효과적인 냉장 기술의 부재가 인간의 이른 도덕성 발달에 결정적이었다고 제시한다. 냉장고도 저장 공간도 없던 초기 인류는 여분의 고기를 (동족뿐 아니라) 다른 사람들의 몸과 마음에 저장하고 미래의 보답을 기대하는 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">이타주의\u003c/b>를 실천했으며, 안정적인 관계를 발전시킨 무리가 번창하고 번식할 수 있는 더 나은 위치에 있었다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Without effective refrigeration, early humans stored excess meat in other people's bodies and minds through mutual altruism, and this practice drove our early moral development.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 구문사고력 리딩 파트에 나오는 진화 심리학 이야기예요. 냉장고가 없던 아주 먼 옛날, 남는 고기를 어떻게 처리했는지가 인간의 도덕성과 어떻게 연결되는지 보여 주는 글이죠. 이 글은 효과적인 냉장 기술의 부재가 우리의 이른 도덕성 발달에 결정적이었다고 주장해요. 요지는 냉장 시설이 없던 초기 인류가 여분의 고기를 다른 사람들의 몸과 마음에 저장하면서 상호 이타주의가 발달했다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">진화 심리학(evolutionary psychology)은 인간의 마음과 행동을 진화적 적응의 관점에서 설명하려는 학문이다. 이 관점에서 도덕성(morality)은 단순한 이상이 아니라 협력과 생존에 유리했기 때문에 자연선택(natural selection)을 통해 자리 잡은 성향으로 본다. 초기 인류는 먹이를 오래 보관하는 냉장(refrigeration) 기술이 없었기 때문에 잉여 식량(excess food)은 곧 썩어 버리는 곤란한 자원이었다. 이때 남는 음식을 나눠 주고 나중에 보답을 받는 \u003cb class=\"key\">호혜적 \u003c/b>\u003cb class=\"key\">이타주의\u003c/b>(reciprocal altruism)는 일종의 살아 있는 저축이었다. 마치 오늘날 친구에게 밥을 사 주면 그 호의가 친구의 기억에 저장되어 나중에 되돌아오는 것과 같은 원리다. 이런 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">이타주의\u003c/b>가 반복되면서 신뢰와 평판(reputation)이라는 사회적 장치가 발달했다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 진화 심리학은 인간의 마음과 행동을 진화적 적응의 관점에서 설명하는 학문이에요. 이 관점에서 도덕성은 단순한 이상이 아니라 협력과 생존에 유리했기 때문에 자연선택을 통해 자리 잡은 성향으로 봐요. 초기 인류에게는 먹이를 오래 보관하는 냉장 기술이 없었기 때문에 잉여 식량은 곧 썩어 버리는 곤란한 자원이었죠. 그래서 남는 음식을 나눠 주고 나중에 보답을 받는 호혜적 이타주의가 일종의 살아 있는 저축이 되었어요. 오늘날 친구에게 밥을 사 주면 그 호의가 친구의 기억에 저장되어 나중에 되돌아오는 것과 같은 원리예요. 이런 상호 이타주의가 반복되면서 신뢰와 평판이라는 사회적 장치가 발달했답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>주장 제시\u003csmall>주장 · 문장 1\u003c/small>\u003c/h4>\u003cp>진화 심리학자들은 효과적인 냉장 기술이 없었던 것이 인간의 이른 \u003cb class=\"key\">도덕성 \u003c/b>\u003cb class=\"key\">발달\u003c/b>에 결정적이었다고 제시한다. 냉장고의 부재라는 불편이 오히려 \u003cb class=\"key\">도덕\u003c/b>의 출발점이었다는 역설적 주장이다. 글 전체의 방향을 여는 \u003cb class=\"key\">주제문\u003c/b> 역할을 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>사냥 성공과 잉여\u003csmall>예시 · 문장 2–4\u003c/small>\u003c/h4>\u003cp>아프리카 대초원에서 사냥과 채집을 하던 초기 \u003cb class=\"key\">원인\u003c/b>이 거대한 짐승을 잡았다고 가정한다. 사냥에 참여한 사람과 그 가족이 다 소비할 수 없을 만큼 많은 고기가 \u003cb class=\"key\">잉여\u003c/b>로 남는다. 이 상황이 뒤에 나올 문제의 출발점이 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>저장 수단의 부재\u003csmall>문제 · 문장 5\u003c/small>\u003c/h4>\u003cp>냉장고도, 고기를 둘 공간도 없는 상태에서 여분의 고기로 \u003cb class=\"key\">최대한의 \u003c/b>\u003cb class=\"key\">이득\u003c/b>을 얻으려면 어떻게 해야 하는가라는 질문이 던져진다. 이 물음 하나로 글의 \u003cb class=\"key\">문제\u003c/b>가 또렷하게 드러난다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>타인에게 저장하기\u003csmall>해결 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>가장 똑똑한 조상은 여분의 고기를 (동족뿐 아니라) 다른 사람들의 \u003cb class=\"key\">몸과 \u003c/b>\u003cb class=\"key\">마음\u003c/b>에 저장했을 것이다. 나눠 준 이들이 나중에 그 \u003cb class=\"key\">관대함\u003c/b>에 보답할 수 있다면 그것이 최선의 선택이었다. 여기서 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">이타주의\u003c/b>라는 해결책이 등장한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>번창과 번식\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>안정적인 관계를 발전시키고 이런 종류의 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">이타주의\u003c/b>를 실천한 초기 인간의 무리는 번창하고 번식할 수 있는 더 나은 위치에 있었다. 결국 도덕성은 집단의 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">경쟁력\u003c/b>과 연결된다는 결론이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 주장이에요. 진화 심리학자들은 효과적인 냉장 기술이 없었던 것이 인간의 이른 도덕성 발달에 결정적이었다고 제시해요. 냉장고가 없다는 불편이 오히려 도덕의 출발점이었다는 역설적인 주장이죠. 이 문장이 글 전체의 주제문 역할을 해요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 예시예요. 아프리카 대초원에서 사냥과 채집을 하던 초기 원인이 거대한 짐승을 잡았다고 가정해요. 사냥에 참여한 사람과 그 가족이 다 소비할 수 없을 만큼 많은 고기가 잉여로 남죠. 이 상황이 다음 단계의 문제를 만들어요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 문제 제기예요. 냉장고도, 고기를 둘 공간도 없는 상태에서 여분의 고기로 최대한의 이득을 얻으려면 어떻게 해야 하느냐고 질문해요. 이 물음 하나로 글의 문제가 아주 또렷해지죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 해결이에요. 가장 똑똑한 조상은 여분의 고기를 동족뿐 아니라 다른 사람들의 몸과 마음에 저장했을 거라고 해요. 나눠 준 사람들이 나중에 그 관대함에 보답할 수 있다면 그것이 최선의 선택이었다는 거죠. 여기서 상호 이타주의라는 해결책이 등장해요.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 결론이에요. 안정적인 관계를 발전시키고 이런 상호 이타주의를 실천한 초기 인간의 무리는 번창하고 번식할 수 있는 더 나은 위치에 있었다고 정리해요. 결국 도덕성이 집단의 생존 경쟁력과 연결된다는 뜻이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거(예시)\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 진화 심리학자들의 \u003cb class=\"key\">주장\u003c/b>이 먼저 제시되고, 이후 초기 인류의 사냥 상황이라는 \u003cb class=\"key\">예시\u003c/b>가 그 주장을 뒷받침한다. 예시 속에서는 여분의 고기를 어떻게 처리할 것인가라는 \u003cb class=\"key\">문제\u003c/b>와, 타인에게 저장하고 보답받는다는 해결이 이어진다. 마지막 문장은 상호 이타주의가 집단의 \u003cb class=\"key\">번영\u003c/b>으로 이어진다는 결론으로 주장을 다시 확인한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>have suggested that (1)\u003c/b>\u003cspan>주장 제시\u003c/span>\u003cb>Let's say that (2)\u003c/b>\u003cspan>가정·예시 도입\u003c/span>\u003cb>How do you (5)\u003c/b>\u003cspan>문제 제기(질문)\u003c/span>\u003cb>Provided (7)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>were in a better position (8)\u003c/b>\u003cspan>결론·평가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the absence of any effective form of refrigeration\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">without a fridge or anywhere to store it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">stored their excess meat in the bodies and minds of others\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">practiced this sort of mutual altruism\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">were in a better position to prosper and multiply\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 주장과 근거, 그중에서도 예시를 통한 뒷받침이에요. 첫 번째 문장에서 진화 심리학자들의 주장이 먼저 나오고, 이후 사냥 상황이라는 구체적인 예시가 그 주장을 받쳐 주죠. 그래서 글의 구조는 두괄식이에요. 주제문이 맨 앞에 있고, 마지막 문장에서 그 주장을 다시 확인하며 마무리해요.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. have suggested that은 주장을 꺼내는 표현이고, Let's say that은 가정과 예시를 여는 표현이에요. How do you로 시작하는 질문은 문제를 제기하는 신호이고, Provided는 조건을 달아 주는 접속사죠. 마지막의 were in a better position은 평가와 결론을 알려 주는 표현이에요. 이렇게 재진술과 질문, 조건이 이어지는 흐름을 따라가면 글의 뼈대가 그대로 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>evolutionary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진화의, 진화론적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제시하다, 암시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>absence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부재, 없음\u003c/span>\u003c/div>\u003cdiv>\u003cb>effective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효과적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>refrigeration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>냉장, 냉동\u003c/span>\u003c/div>\u003cdiv>\u003cb>critical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>결정적인, 중대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>moral\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>도덕적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>humanoid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원인(原人), 인간형 생물\u003c/span>\u003c/div>\u003cdiv>\u003cb>hunt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사냥하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gather\u003c/b>\u003cem>동사\u003c/em>\u003cspan>채집하다, 모으다\u003c/span>\u003c/div>\u003cdiv>\u003cb>savannah\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(아프리카의) 대초원\u003c/span>\u003c/div>\u003cdiv>\u003cb>strike it lucky\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>뜻밖의 행운을 만나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>come across\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우연히 마주치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>beast\u003c/b>\u003cem>명사\u003c/em>\u003cspan>짐승, 야수\u003c/span>\u003c/div>\u003cdiv>\u003cb>manage to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>간신히 ~하다, 어떻게든 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>yield\u003c/b>\u003cem>동사\u003c/em>\u003cspan>산출하다, 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>consume\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소비하다, 먹어치우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>benefit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이득, 혜택\u003c/span>\u003c/div>\u003cdiv>\u003cb>excess\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>여분의, 초과의\u003c/span>\u003c/div>\u003cdiv>\u003cb>store\u003c/b>\u003cem>동사\u003c/em>\u003cspan>저장하다, 보관하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ancestor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조상\u003c/span>\u003c/div>\u003cdiv>\u003cb>kin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>친족, 동족\u003c/span>\u003c/div>\u003cdiv>\u003cb>provided\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>만약 ~라면\u003c/span>\u003c/div>\u003cdiv>\u003cb>repay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보답하다, 갚다\u003c/span>\u003c/div>\u003cdiv>\u003cb>generosity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관대함, 너그러움\u003c/span>\u003c/div>\u003cdiv>\u003cb>stable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>안정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>mutual\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상호의, 서로의\u003c/span>\u003c/div>\u003cdiv>\u003cb>altruism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이타주의\u003c/span>\u003c/div>\u003cdiv>\u003cb>prosper\u003c/b>\u003cem>동사\u003c/em>\u003cspan>번창하다, 번영하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>multiply\u003c/b>\u003cem>동사\u003c/em>\u003cspan>번식하다, 증가하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 순서대로 챙겨 볼게요. absence는 부재, critical은 결정적이라는 뜻이고, humanoid는 원인, yield는 산출하다, consume은 소비하다라는 뜻이에요. excess는 여분의, kin은 친족, provided는 만약 그렇다면이라는 접속사로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">absence\u003c/b>\u003cspan class=\"m\">부재, 없음\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lack\u003c/span>\u003cspan class=\"s\">nonexistence\u003c/span>\u003cspan class=\"s\">shortage\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">presence\u003c/span>\u003cspan class=\"a\">existence\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">critical\u003c/b>\u003cspan class=\"m\">결정적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">vital\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">consume\u003c/b>\u003cspan class=\"m\">소비하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">use up\u003c/span>\u003cspan class=\"s\">devour\u003c/span>\u003cspan class=\"s\">eat up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">preserve\u003c/span>\u003cspan class=\"a\">save\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">excess\u003c/b>\u003cspan class=\"m\">여분의, 초과의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">surplus\u003c/span>\u003cspan class=\"s\">extra\u003c/span>\u003cspan class=\"s\">spare\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insufficient\u003c/span>\u003cspan class=\"a\">scarce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stable\u003c/b>\u003cspan class=\"m\">안정적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">steady\u003c/span>\u003cspan class=\"s\">secure\u003c/span>\u003cspan class=\"s\">firm\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unstable\u003c/span>\u003cspan class=\"a\">shaky\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">prosper\u003c/b>\u003cspan class=\"m\">번창하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thrive\u003c/span>\u003cspan class=\"s\">flourish\u003c/span>\u003cspan class=\"s\">succeed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decline\u003c/span>\u003cspan class=\"a\">fail\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">generosity\u003c/b>\u003cspan class=\"m\">관대함\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">kindness\u003c/span>\u003cspan class=\"s\">liberality\u003c/span>\u003cspan class=\"s\">benevolence\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">selfishness\u003c/span>\u003cspan class=\"a\">stinginess\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mutual\u003c/b>\u003cspan class=\"m\">상호의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reciprocal\u003c/span>\u003cspan class=\"s\">shared\u003c/span>\u003cspan class=\"s\">joint\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">one-sided\u003c/span>\u003cspan class=\"a\">unilateral\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. absence는 lack, nonexistence와 가깝고 반대말은 presence예요. critical은 crucial, vital과 바꿔 쓸 수 있고 반대는 trivial이죠. consume은 use up, devour와 가깝고 반대는 preserve예요. prosper는 thrive, flourish와 같고 반대는 decline이고, generosity의 반대는 selfishness예요. stable은 steady, secure와 가깝고 반대는 unstable이라는 점도 함께 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진화 심리학자들은\u003c/span>\u003cspan class=\"en\">Evolutionary psychologists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의견을 제시했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">suggested\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 없는 것(부재)이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">absence \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 효과적인 냉장 기술의 형태라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">effective \u003c/span>\u003cspan class=\"tgt\">form \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">refrigeration \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결정적이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">critical \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 이른 도덕성 발달에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">early \u003c/span>\u003cspan class=\"tgt\">moral \u003c/span>\u003cspan class=\"tgt\">development\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">진화 심리학자들은 효과적인 냉장 기술이 없는 것이 인간의 이른 도덕성 발달에 결정적이었다는 의견을 제시했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 \u003cb class=\"key\">주제\u003c/b>를 여는 첫 문장으로, 학계의 \u003cb class=\"key\">주장\u003c/b>을 인용해 논의를 시작해요. '효과적인 냉장 기술의 부재'라는 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">조건\u003c/b>이 초기 인류의 도덕성 발달에 결정적이었다는 내용인데, 냉장고가 없었기 때문에 음식을 나눠 주는 행동이 생겨났다는 뒤의 흐름을 여는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(완료·계속)\u003c/span> : [주어] + have/has + [과거분사] + [목적어] : \"(지금까지) 의견을 제시해 왔다 / 의견을 제시했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : suggest + that + [주어 + 동사 ~] (that절/목적어) : \"효과적인 냉장 기술이 없는 것이 인간의 이른 도덕성 발달에 결정적이었다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사 + 전치사 to\u003c/span> : be critical to + [명사] : \"~에 결정적이었다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Evolutionary psychologists, 진화 심리학자들은. have suggested, 의견을 제시했다. that the absence, ~이 없는 것(부재)이. of any effective form of refrigeration, 어떤 효과적인 냉장 기술의 형태라도. was critical, 결정적이었다. to our early moral development, 인간의 이른 도덕성 발달에. 이 문장 전체를 해석하면, 진화 심리학자들은 효과적인 냉장 기술이 없는 것이 인간의 이른 도덕성 발달에 결정적이었다는 의견을 제시했다.","hl":"m"},{"n":14,"text":"이 문장은 글의 주제를 여는 첫 문장이에요. 진화 심리학자들이 효과적인 냉장 기술이 없었던 것이 인간의 이른 도덕성 발달에 결정적이었다고 주장한다는 거죠. 냉장고가 없었던 환경이 오히려 도덕성의 출발점이었다는 흐름을 꼭 잡아 두세요.","hl":"mn"},{"n":15,"text":"먼저 have suggested는 현재완료로, 학자들이 지금까지 제시해 온 주장이라는 느낌을 줍니다. 두 번째로 suggested 뒤의 that은 목적어절을 이끄는 접속사이고, 그 안에 the absence라는 주어와 was라는 동사가 갖춰져 있어요. 세 번째로 was critical to에서 to는 전치사라서 뒤에 our early moral development 같은 명사구가 오는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라고 생각해보자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Let's \u003c/span>\u003cspan class=\"tgt\">say\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 초기의 원인이며\u003c/span>\u003cspan class=\"en\">that you're an early humanoid\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아프리카의 대초원에서 사냥과 채집 생활을 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">hunting \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">gathering \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">African \u003c/span>\u003cspan class=\"tgt\">savannah\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 당신이 뜻밖의 행운을 만났다고\u003c/span>\u003cspan class=\"en\">and you \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">strike \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">lucky\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 아프리카의 대초원에서 사냥과 채집생활을 하는 초기의 원인(原人)이며, 뜻밖의 행운을 만났다고 생각해보자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자를 '초기 인류'로 설정해 \u003cb class=\"key\">가정\u003c/b>하는 문장이에요. 아프리카 대초원에서 사냥과 채집을 하던 원인이 큰 \u003cb class=\"key\">행운\u003c/b>을 만났다는 상황을 깔아 두고, 다음 문장의 사건으로 자연스럽게 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">제안·가정의 명령문(관용표현)\u003c/span> : Let's say + [that절] = '~라고 가정해 보자' : \"~라고 생각해보자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구(주격 관계사 + be동사 생략)\u003c/span> : [명사] + -ing ~ (＝ who is/was -ing ~) : \"아프리카의 대초원에서 사냥과 채집 생활을 하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사 + it + 형용사 관용표현\u003c/span> : strike + it + [형용사] = '뜻밖의 행운을 만나다' : \"뜻밖의 행운을 만나다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Let's say, ~라고 생각해보자. that you're an early humanoid, 당신이 초기의 원인이며. hunting and gathering on the African savannah, 아프리카의 대초원에서 사냥과 채집 생활을 하는. and you strike it lucky, 그리고 당신이 뜻밖의 행운을 만났다고. 이 문장 전체를 해석하면, 당신이 아프리카의 대초원에서 사냥과 채집생활을 하는 초기의 원인(原人)이며, 뜻밖의 행운을 만났다고 생각해보자.","hl":"m"},{"n":17,"text":"이 문장은 독자를 초기 인류로 설정해서 가정하는 문장이에요. Let's say로 상황을 열고, 아프리카 대초원에서 사냥과 채집을 하던 원인이 큰 행운을 만났다고 말하죠. 이 가정이 바로 다음 문장의 사건으로 이어집니다.","hl":"mn"},{"n":18,"text":"첫 번째로 Let's say는 가정을 도입하는 관용표현으로 '~라고 가정해 보자'라는 뜻이에요. 두 번째로 hunting and gathering은 an early humanoid를 뒤에서 꾸며 주는 현재분사구이고, 원래는 who was hunting and gathering에서 주격 관계사와 be동사가 생략된 형태로 봅니다. 세 번째로 strike it lucky는 it을 형식적으로 넣고 형용사 lucky가 핵심 내용을 담당하는 관용표현이라서 '뜻밖의 행운을 만나다'로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 마주친다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">across\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 짐승을\u003c/span>\u003cspan class=\"en\">a huge beast,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 당신은 어떻게든 해내어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">manage \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 죽인다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">kill \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 거대한 짐승과 마주쳐서 그것을 어떻게든 죽인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가정 속 사건의 \u003cb class=\"key\">도입\u003c/b>이에요. 거대한 짐승을 만나 죽였다는 것은 곧 엄청난 양의 \u003cb class=\"key\">고기\u003c/b>를 얻었다는 뜻이고, 뒤에서 나올 '남는 고기를 어떻게 처리할까'라는 \u003cb class=\"key\">문제\u003c/b>의 출발점이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(이어동사)\u003c/span> : come across + [목적어] = '~와 우연히 마주치다' : \"마주치다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and(절과 절의 병렬)\u003c/span> : [절] + and + [절] : \"그리고 당신은 그것을 어떻게든 죽인다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : manage + [to부정사] = '어떻게든 ~하다' : \"그것을 죽는 것을 (해내다)\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"You come across, 당신은 마주친다. a huge beast, 거대한 짐승을. and you manage, 그리고 당신은 어떻게든 해내어. to kill it, 그것을 죽인다. 이 문장 전체를 해석하면, 당신은 거대한 짐승과 마주쳐서 그것을 어떻게든 죽인다.","hl":"m"},{"n":20,"text":"이 문장은 가정 속 사건을 본격적으로 시작하는 부분이에요. 거대한 짐승과 마주쳐서 어떻게든 죽였다는 건 엄청난 양의 고기를 얻었다는 뜻이죠. 그래서 다음 문장부터 남는 고기를 어떻게 처리할지 고민하는 흐름이 자연스럽게 이어집니다.","hl":"mn"},{"n":21,"text":"첫 번째로 come across는 동사와 전치사가 합쳐진 구동사로 '우연히 마주치다'라는 뜻이에요. 두 번째로 to kill it에서 to kill은 manage의 목적어로 쓰인 to부정사이고, manage to는 '어떻게든 해내다'라는 뜻을 만듭니다. 세 번째로 and는 앞의 You come across와 뒤의 you manage to kill it이라는 두 절을 대등하게 이어 주는 등위접속사라서, 앞뒤 시제가 현재형으로 똑같이 맞춰져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 산출한다\u003c/span>\u003cspan class=\"en\">It yields\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 많은 고기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">far \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">meat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사냥에 관련된 어떤 사람보다도\u003c/span>\u003cspan class=\"en\">than anyone \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">involved \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">hunt\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 그들의 가족이\u003c/span>\u003cspan class=\"en\">or their families\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소비할 수 있는 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">possibly \u003c/span>\u003cspan class=\"tgt\">consume\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것에서 나오는 고기는 사냥에 관련된 사람이나 그들의 가족이 소비할 수 있는 것보다 훨씬 더 많다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사냥으로 얻은 고기가 사냥꾼과 가족이 먹을 수 있는 양을 훨씬 넘는다는 뜻이에요. \u003cb class=\"key\">여분\u003c/b>의 고기가 생긴다는 점을 강조해 다음 문장의 \u003cb class=\"key\">저장\u003c/b> 문제로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 강조의 far\u003c/span> : far + [비교급] + [명사] : \"훨씬 더 많은 고기\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치 수식\u003c/span> : [명사] + involved in + [명사] : \"사냥에 관련된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 can + 부사 + 동사원형\u003c/span> : [can] + [possibly] + [동사원형] : \"소비할 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"It yields, 그것은 산출한다. far more meat, 훨씬 더 많은 고기를. than anyone involved in the hunt, 사냥에 관련된 어떤 사람보다도. or their families, 또는 그들의 가족이. can possibly consume, 소비할 수 있는 것보다. 이 문장 전체를 해석하면, 그것에서 나오는 고기는 사냥에 관련된 사람이나 그들의 가족이 소비할 수 있는 것보다 훨씬 더 많다.","hl":"m"},{"n":23,"text":"이 문장은 사냥으로 얻은 고기가 사냥꾼과 가족이 먹을 수 있는 양을 훨씬 넘는다는 뜻이에요. 그래서 여분의 고기가 생긴다는 점을 강조하고, 다음에 저장 문제로 넘어가게 해 줍니다.","hl":"mn"},{"n":24,"text":"첫 번째, far more meat에서 far는 비교급 more를 강조해서 훨씬이라는 뜻을 더해요. 두 번째, involved in the hunt에서 involved는 anyone을 뒤에서 꾸미는 과거분사로 관련된이라는 수동 의미를 담고 있어요. 세 번째, can possibly consume에서 can 뒤에는 동사원형 consume이 오고 possibly는 가능성을 강조해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 얻는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">get\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최대한의 이득을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">benefit\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여분의 고기에서\u003c/span>\u003cspan class=\"en\">of your excess meat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">냉장고 없이\u003c/span>\u003cspan class=\"en\">without a fridge\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 그것을 저장할 어떤 공간도 없이\u003c/span>\u003cspan class=\"en\">or anywhere \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">store \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">냉장고나 그것을 저장할 공간이 없는 상황에서 어떻게 여분의 고기에서 최대한 이득을 얻어낼 것인가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 냉장고나 저장 공간이 없는 상황에서 여분의 고기를 어떻게 최대 이득으로 바꿀지 묻는 \u003cb class=\"key\">수사적 \u003c/b>\u003cb class=\"key\">질문\u003c/b>이에요. 곧 다른 사람에게 나눠 주는 \u003cb class=\"key\">호혜\u003c/b>의 해법을 끌어내기 위한 질문이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 How 의문문\u003c/span> : How + [do/does/did] + [주어] + [동사] : \"어떻게 얻는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급 the most + 명사\u003c/span> : the most + [명사] : \"최대한의 이득\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [anywhere] + to + [동사원형] : \"그것을 저장할\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"How do you get, 어떻게 얻는가. the most benefit, 최대한의 이득을. of your excess meat, 여분의 고기에서. without a fridge, 냉장고 없이. or anywhere to store it?, 또는 그것을 저장할 어떤 공간도 없이. 이 문장 전체를 해석하면, 냉장고나 그것을 저장할 공간이 없는 상황에서 어떻게 여분의 고기에서 최대한 이득을 얻어낼 것인가?","hl":"m"},{"n":26,"text":"이 문장은 냉장고나 저장 공간이 없는 상황에서 여분의 고기를 어떻게 최대 이득으로 바꿀지 묻는 수사적 질문이에요. 바로 다른 사람에게 나눠 주는 호혜의 해법을 끌어내기 위한 질문이죠.","hl":"mn"},{"n":27,"text":"첫 번째, How do you get에서 How는 방법을 묻고 do가 주어 앞에 와서 의문문 어순을 만들어요. 두 번째, the most benefit에서 most는 최상급으로 쓰여 가장 많은, 최대의라는 뜻을 만들어요. 세 번째, to store it에서 to store는 앞의 anywhere를 뒤에서 꾸미는 형용사적 용법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 똑똑한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">smartest \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 먼 조상들 중\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">deep \u003c/span>\u003cspan class=\"tgt\">ancestors\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저장했을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">stored\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 여분의 고기를\u003c/span>\u003cspan class=\"en\">their excess meat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들의 몸과 마음에\u003c/span>\u003cspan class=\"en\">in \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bodies \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">minds\u003c/span> of others\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 그들 자신의 친족만이 아니라\u003c/span>\u003cspan class=\"en\">(\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">kin\u003c/span>).\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 먼 조상들 중에 가장 똑똑했던 조상은 (동족뿐만이 아닌) 다른 사람들의 몸과 마음에 여분의 고기를 저장했을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가장 똑똑한 조상은 여분의 고기를 다른 사람들의 몸과 마음, 즉 \u003cb class=\"key\">관계\u003c/b>와 \u003cb class=\"key\">호의\u003c/b> 속에 저장했을 것이라는 뜻이에요. 고기를 나눠 줌으로써 나중에 되돌려받을 \u003cb class=\"key\">상호성\u003c/b>을 만든다는 핵심 주장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">최상급 + of + 복수명사\u003c/span> : the + [최상급] + of + [복수명사] : \"우리의 먼 조상들 중 가장 똑똑한 조상\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">would have + 과거분사(과거 추측)\u003c/span> : [would] + have + [과거분사] : \"저장했을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사 병렬\u003c/span> : [명사 A] + and + [명사 B] : \"몸과 마음\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">not just의 부분 부정\u003c/span> : not just + [명사] : \"단지 그들 자신의 친족만이 아니라\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"The smartest, 가장 똑똑한. of our deep ancestors, 우리의 먼 조상들 중. would have stored, 저장했을 것이다. their excess meat, 그들의 여분의 고기를. in the bodies and minds of others, 다른 사람들의 몸과 마음에. (not just their own kin), 단지 그들 자신의 친족만이 아니라. 이 문장 전체를 해석하면, 우리의 먼 조상들 중에 가장 똑똑했던 조상은 (동족뿐만이 아닌) 다른 사람들의 몸과 마음에 여분의 고기를 저장했을 것이다.","hl":"m"},{"n":29,"text":"이 문장은 가장 똑똑한 조상이 여분의 고기를 다른 사람들의 몸과 마음, 즉 관계와 호의 속에 저장했을 것이라는 뜻이에요. 고기를 나눠 줌으로써 나중에 되돌려받을 상호성을 만든다는 핵심 주장입니다.","hl":"mn"},{"n":30,"text":"첫 번째, The smartest of our deep ancestors에서 the smartest는 of 이하 범위에서 최상급을 나타내요. 두 번째, would have stored는 과거에 일어났을 일을 추측할 때 쓰는 형태예요. 세 번째, the bodies and minds에서 bodies와 minds가 and로 병렬을 이루어 몸과 마음이라는 복합적 저장 장소를 나타내요. 네 번째, not just their own kin에서 not just는 대상을 부분 부정해서 오직 그것만은 아니라는 뜻을 더해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 당신의 선물로 혜택을 받은 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Provided\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">benefiting \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">gift\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미래에 당신의 관대함에 보답할 수 있었다면,\u003c/span>\u003cspan class=\"en\">could possibly repay your generosity in the future,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 최선의 일이었다\u003c/span>\u003cspan class=\"en\">that was \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">thing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여분의 고기를 가지고 당신이 할 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">do\u003c/span> with excess meat.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 당신의 선물로 혜택을 받은 사람들이 미래에 당신의 관대함에 보답할 수 있었다면, 그것은 여분의 고기를 가지고 당신이 할 수 있는 최선의 일이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 던진 질문, 즉 냉장고도 저장 공간도 없이 여분의 고기를 어떻게 처리할 것인가에 대한 답을 조건문으로 제시합니다. 핵심은 \u003cb class=\"key\">조건\u003c/b>이 붙는다는 점인데, 받은 사람이 나중에 \u003cb class=\"key\">보답\u003c/b>할 수 있는 상황일 때만 이 선택이 최선이 된다는 뜻입니다. 즉 고기를 남에게 나눠 주는 행위를 미래의 보답을 기대하는 \u003cb class=\"key\">투자\u003c/b>로 바꿔 설명하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 provided (조건의 부사절)\u003c/span> : [Provided + 주어 + 동사], 주절 : \"만약 ~라면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시대명사 those + 현재분사구의 후치 수식\u003c/span> : [those (people) + benefiting from + 명사 (현재분사구/형용사 역할)] : \"당신의 선물로 혜택을 받은 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [the best thing (that/which) + 주어 + could do] : \"당신이 할 수 있는 최선의 일\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Provided those benefiting from your gift, 만약 당신의 선물로 혜택을 받은 사람들이. could possibly repay your generosity in the future, 미래에 당신의 관대함에 보답할 수 있었다면. that was the best thing, 그것은 최선의 일이었다. you could do with excess meat, 여분의 고기를 가지고 당신이 할 수 있는. 이 문장 전체를 해석하면, 만약 당신의 선물로 혜택을 받은 사람들이 미래에 당신의 관대함에 보답할 수 있었다면, 그것은 여분의 고기를 가지고 당신이 할 수 있는 최선의 일이었다.","hl":"m"},{"n":32,"text":"이 문장은 앞에서 던진 질문에 대한 답이에요. 냉장고도 저장 공간도 없을 때 여분의 고기를 어떻게 처리하는 게 최선이냐, 그 답이 바로 다른 사람에게 나눠 주는 거라는 거죠. 단, 조건이 붙습니다. 선물을 받은 사람이 미래에 당신의 관대함에 보답할 수 있는 상황일 때만 그것이 최선의 선택이 된다는 겁니다.","hl":"mn"},{"n":33,"text":"첫 번째로 Provided는 if와 같은 뜻으로 조건을 이끄는 접속사예요. 그래서 \"만약 라면\"으로 조건을 살려서 해석합니다. 두 번째로 those benefiting from your gift에서 those는 사람들을 가리키는 지시대명사이고, benefiting은 those를 뒤에서 꾸며 주는 현재분사예요. 혜택을 받는 쪽이 능동이라서 현재분사를 쓴다는 점을 기억하세요. 세 번째로 the best thing you could do에는 목적격 관계대명사가 생략되어 있어요. thing을 do가 받는 목적어 자리가 비어 있다고 보면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초기 인간의 무리는\u003c/span>\u003cspan class=\"en\">Groups of early humans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안정적인 관계를 발전시키고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">developed \u003c/span>\u003cspan class=\"tgt\">stable \u003c/span>\u003cspan class=\"tgt\">relationships \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 종류의 상호 이타주의를 실천했던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">practiced \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">sort \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">mutual \u003c/span>\u003cspan class=\"tgt\">altruism\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 나은 위치에 있었다\u003c/span>\u003cspan class=\"en\">were \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">position \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">번창하고 번식할 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">prosper \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">multiply\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안정적인 관계를 발전시키고 이런 종류의 상호 이타주의를 실천했던 초기 인간의 무리는 번창하고 번식할 수 있는 더 나은 위치에 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지문 전체의 결론으로, 앞에서 설명한 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">이타주의\u003c/b>가 실제로 집단의 생존에 이득이 되었음을 정리합니다. 관계를 안정시키고 서로 베푸는 무리일수록 \u003cb class=\"key\">번창\u003c/b>하고 \u003cb class=\"key\">번식\u003c/b>할 유리한 자리에 있었다는 뜻입니다. 즉 이기적인 개인보다 협력하는 집단이 살아남았다는 진화적 관점을 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who + 동사구의 병렬\u003c/span> : [선행사 + who + 동사 A and 동사 B] : \"안정적인 관계를 발전시키고 이런 종류의 상호 이타주의를 실천했던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법 (be in a position to)\u003c/span> : [be in a better position + to + 동사원형 (to부정사구/형용사 역할)] : \"번창하고 번식할 수 있는 더 나은 위치에\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Groups of early humans, 초기 인간의 무리는. who developed stable relationships, 안정적인 관계를 발전시키고. and practiced this sort of mutual altruism, 이런 종류의 상호 이타주의를 실천했던. were in a better position, 더 나은 위치에 있었다. to prosper and multiply, 번창하고 번식할 수 있는. 이 문장 전체를 해석하면, 안정적인 관계를 발전시키고 이런 종류의 상호 이타주의를 실천했던 초기 인간의 무리는 번창하고 번식할 수 있는 더 나은 위치에 있었다.","hl":"m"},{"n":35,"text":"이 문장은 지문의 결론이에요. 앞에서 말한 상호 이타주의가 실제로 집단에 이득이 되었다는 걸 정리하고 있죠. 안정적인 관계를 만들고 서로 베푸는 무리일수록 번창하고 번식하는 데 유리했다는 뜻입니다. 결국 협력하는 집단이 살아남았다는 진화적 관점을 담고 있어요.","hl":"mn"},{"n":36,"text":"첫 번째로 who는 앞에 나온 early humans를 받는 주격 관계대명사예요. 그리고 developed와 practiced가 and로 연결된 병렬 구조라서 두 동사 모두 who를 주어로 보고 시제를 똑같이 맞춘 겁니다. 두 번째로 be in a better position to는 \"할 수 있는 위치에 있다\"라는 관용표현이에요. 여기서 to prosper는 position을 꾸며 주는 형용사적 용법의 to부정사이고, prosper와 multiply가 and로 병렬을 이루고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>진화 심리학자들은 효과적인 \u003cb class=\"key\">냉장 \u003c/b>\u003cb class=\"key\">기술\u003c/b>의 부재가 인간의 이른 도덕성 발달에 결정적이었다고 제시했다.\u003c/li>\u003cli>초기 인류가 거대한 짐승을 사냥하면 사냥에 관련된 사람이나 그 가족이 소비할 수 있는 것보다 훨씬 많은 \u003cb class=\"key\">여분의 \u003c/b>\u003cb class=\"key\">고기\u003c/b>가 생겼다.\u003c/li>\u003cli>냉장고도 저장 공간도 없었기에 가장 똑똑한 조상은 그 고기를 동족뿐 아니라 다른 사람들의 \u003cb class=\"key\">몸과 \u003c/b>\u003cb class=\"key\">마음\u003c/b>에 저장했을 것이다.\u003c/li>\u003cli>미래의 보답을 기대하며 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">이타주의\u003c/b>를 실천하고 안정적인 관계를 발전시킨 무리는 번창하고 번식할 수 있는 더 나은 위치에 있었다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Without effective refrigeration, early humans stored excess meat in other people's bodies and minds through mutual altruism, and this practice drove our early moral development.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">진화 심리학자들은 효과적인 냉장 기술의 부재가 인간의 이른 도덕성 발달에 결정적이었다고 제시한다. 냉장고도 저장 공간도 없던 초기 인류는 여분의 고기를 (동족뿐 아니라) 다른 사람들의 몸과 마음에 저장하고 미래의 보답을 기대하는 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">이타주의\u003c/b>를 실천했으며, 안정적인 관계를 발전시킨 무리가 번창하고 번식할 수 있는 더 나은 위치에 있었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"오늘 글의 핵심은 아주 간단해요. 냉장고가 없던 시절, 남는 고기를 사람들의 몸과 마음에 저장하는 것이 최선이었고, 그 과정에서 상호 이타주의와 안정적인 관계가 자라났다는 거죠. 도덕성이 거창한 이념이 아니라 생존을 위한 지혜에서 출발했다는 점이 참 흥미롭습니다. 여러분도 이 구조를 기억해 두고 다음 지문에서도 주장과 예시를 구분하며 읽어 보세요. 수고 많았습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
