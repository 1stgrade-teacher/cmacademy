식은 화장할 때 발생하는 탄소 배출을 줄이거나, 매장 시 사용되는 화학 약품으로부터 토양을 보호하는 데 도움을 줄 수 있죠. 마치 우리가 평소에 텀블러를 쓰거나 재활용을 실천하는 것처럼, 이들은 생애 마지막 순간까지 환경을 생각하는 가치관을 실천하고자 하는 것이에요. 즉, 환경 보호(Environmental protection)를 단순히 일상의 습관을 넘어 삶의 전 과정으로 확장한 개념이라고 이해하면 훨씬 쉽답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01친환경 장례의 등장</div><ul><li>환경을 보호하려는 사람들은 이제 죽음 이후까지 고려하는 친환경 장례를 선택하고 있다.</li><li>죽은 뒤에도 환경을 생각하는 삶의 연장선</li><li>영국에서 인기를 얻고 있는 친환경 장례(green funerals)</li><li>핵심 키워드: 친환경(environmentally friendly)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02구체적인 장례 방식</div><ul><li>자연을 보호하기 위해 인위적인 재료를 배제한 다양한 장례 방법들이 활용된다.</li><li>자연 분해가 쉬운 종이 관(cardboard coffins) 사용</li><li>자연 섬유(natural fibers)로 만든 옷 입기</li><li>자연 상태 그대로인 장지(natural setting) 선호</li><li>핵심 키워드: 친환경 장례(eco-friendly funerals)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가치 중심적 선택</div><ul><li>친환경 장례는 비용이 적지 않지만, 환경을 위한 실천은 무엇보다 소중하게 여겨진다.</li><li>생각보다 비싼 비용(price tag) 문제 발생</li><li>환경을 위한 노력에는 값을 매길 수 없음</li><li>환경을 지키려는 의지(environmentalists)를 강조</li><li>핵심 키워드: 가치(value)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">believe</td><td class=\"m\">믿다</td></tr><tr><td class=\"w\">no longer</td><td class=\"m\">더 이상 ~가 아닌</td></tr><tr><td class=\"w\">environmentally</td><td class=\"m\">환경적으로</td></tr><tr><td class=\"w\">friendly</td><td class=\"m\">친화적인</td></tr><tr><td class=\"w\">funeral</td><td class=\"m\">장례식</td></tr><tr><td class=\"w\">popular</td><td class=\"m\">인기 있는</td></tr><tr><td class=\"w\">cardboard</td><td class=\"m\">판지</td></tr><tr><td class=\"w\">coffin</td><td class=\"m\">관</td></tr><tr><td class=\"w\">sew</td><td class=\"m\">바느질하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">natural</td><td class=\"m\">자연의</td></tr><tr><td class=\"w\">fiber</td><td class=\"m\">섬유</td></tr><tr><td class=\"w\">burial</td><td class=\"m\">매장</td></tr><tr><td class=\"w\">setting</td><td class=\"m\">환경, 배경</td></tr><tr><td class=\"w\">favor</td><td class=\"m\">선호하다</td></tr><tr><td class=\"w\">environmentalist</td><td class=\"m\">환경 보호론자</td></tr><tr><td class=\"w\">cheap</td><td class=\"m\">저렴한</td></tr><tr><td class=\"w\">do one&#39;s part</td><td class=\"m\">제 역할을 다하다</td></tr><tr><td class=\"w\">come with</td><td class=\"m\">~가 따르다, ~가 수반되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">믿기는 어렵지만,</span><span class=\"en\"><b><span class=\"grammar-hl\">Although hard to believe</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇몇 사람들은 느낀다</span><span class=\"en\"><b>some people feel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 더 이상 충분하지 않다고</span><span class=\"en\"><b><span class=\"grammar-hl\">it’s</span> no longer enough</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 친환경적인 삶을 사는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">to live</span> a greener life.</b></span></div></div><div class=\"lec-sent-ko\">믿기가 어려울 수 있겠지만 어떤 사람들에게는 환경 보존을 하는 삶을 사는 것만으로는 더 이상 충분치 않다(죽을 때도 환경을 생각한다).</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 **enough**는 사전적으로는 &#39;충분한&#39;이라는 뜻이지만, 여기서는 &#39;환경을 보호하기 위한 노력으로서 충분한 수준&#39;을 의미합니다. 단순히 살아있는 동안 환경을 보호하는 것만으로는 환경 문제 해결에 부족하다고 느끼는 사람들의 변화된 인식을 강조하기 위해 이 표현을 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Although hard to believe (분사구문): 접속사 Although가 생략된 분사구문 형태이며, 원래 절로 변환하면 &#39;Although it is hard to believe&#39;가 된다.</div><div class=\"lec-gr-item\">it’s (가주어): 진주어: it은 가주어이며, 뒤의 to live a greener life가 진주어 역할을 하여 문장의 의미상 주어를 뒤로 보낸 구조이다.</div><div class=\"lec-gr-item\">to live (to부정사): 진주어 역할을 하는 명사적 용법으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">believe</td><td class=\"m\">믿다</td></tr><tr><td class=\"w\">no longer</td><td class=\"m\">더 이상 ~가 아닌</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">영국에서,</span><span class=\"en\"><b>In England,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들은 노력하고 있다</span><span class=\"en\"><b>many people <span class=\"grammar-hl\">are trying</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경 친화적이 되려고</span><span class=\"en\"><b><span class=\"grammar-hl\">to be</span> environmentally friendly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 지구를 떠날 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when they leave the Earth</span>.</b></span></div></div><div class=\"lec-sent-ko\">영국에서는 많은 사람들이 세상을 떠날 때 환경 친화적이 되려고 노력하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;지구를 떠난다&#39;는 뜻의 **leave the Earth**는 죽음을 완곡하게 표현한 관용구입니다. 죽음조차 환경에 영향을 미친다는 점을 고려해, 삶의 마지막 순간까지 환경 보호를 실천하려는 의지를 보여주기 위해 부드러운 표현을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are trying (현재진행): be동사(are) + 현재분사(trying) 구조로 &#39;…하는 중이다&#39;라는 동작을 나타낸다.</div><div class=\"lec-gr-item\">to be (to부정사): try의 목적어로 쓰인 명사적 용법이다.</div><div class=\"lec-gr-item\">when they leave the Earth (관계부사): when은 시간을 나타내는 관계부사로, 선행사(환경과 관련된 특정 상황/시점)를 수식하는 절을 이끈다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">environmentally</td><td class=\"m\">환경적으로</td></tr><tr><td class=\"w\">friendly</td><td class=\"m\">친화적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">녹색 장례식이라 알려진,</span><span class=\"en\"><b><span class=\"grammar-hl\">Known as green funerals</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경 친화적 장례식이</span><span class=\"en\"><b>eco-friendly funerals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">되고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are becoming</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 인기 있게</span><span class=\"en\"><b>very popular.</b></span></div></div><div class=\"lec-sent-ko\">녹색 장례식으로 알려진 환경 친화적 장례식이 매우 인기를 얻고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;환경 친화적으로 죽음을 맞이하는 것&#39;의 구체적인 명칭인 &#39;친환경 장례식&#39;을 도입하여 글의 중심 소재를 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Known as green funerals (과거분사): Known이 이끄는 분사구문으로, 주어인 eco-friendly funerals를 보충 설명한다.</div><div class=\"lec-gr-item\">are becoming (현재진행): be동사(are) + 현재분사(becoming) 구조로 상태의 변화가 진행 중임을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">friendly</td><td class=\"m\">친화적인</td></tr><tr><td class=\"w\">funeral</td><td class=\"m\">장례식</td></tr><tr><td class=\"w\">popular</td><td class=\"m\">인기 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">판지로 만든 관,</span><span class=\"en\"><b>Cardboard coffins,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">천연 섬유로 꿰맨 옷,</span><span class=\"en\"><b><span class=\"grammar-hl\">clothes sewn from natural fibers</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 무덤 자리는</span><span class=\"en\"><b>and a burial place</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연 환경 속에 있는</span><span class=\"en\"><b>in a natural setting</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 가지 인기 있는 아이디어들이다</span><span class=\"en\"><b>are some of the popular <span class=\"grammar-hl\">ideas</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 영국 환경론자들에 의해 선호되는</span><span class=\"en\"><b><span class=\"grammar-hl\">favored by</span> these British environmentalists.</b></span></div></div><div class=\"lec-sent-ko\">판지(두꺼운 종이)로 제작된 관, 천연 섬유로 짠 옷(수의), 자연 환경 속에 있는 무덤이, 영국의 환경론자들에게 선호되고 있는 몇 가지 인기 아이디어이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 친환경 장례식을 구체적으로 어떻게 실천하는지 나열하며 앞 문장의 내용을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">clothes sewn from natural fibers (과거분사): sewn이 앞의 명사 clothes를 수식하며, &#39;natural fibers로부터 만들어진(꿰매어진) 옷&#39;이라는 수동적 의미를 지닌다.</div><div class=\"lec-gr-item\">ideas favored by (과거분사): favored가 앞의 명사 ideas를 수식하며, &#39;…에 의해 선호되는 아이디어&#39;라는 수동적 의미를 지닌다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">popular</td><td class=\"m\">인기 있는</td></tr><tr><td class=\"w\">cardboard</td><td class=\"m\">판지</td></tr><tr><td class=\"w\">coffin</td><td class=\"m\">관</td></tr><tr><td class=\"w\">sew</td><td class=\"m\">바느질하다</td></tr><tr><td class=\"w\">natural</td><td class=\"m\">자연의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fiber</td><td class=\"m\">섬유</td></tr><tr><td class=\"w\">burial</td><td class=\"m\">매장</td></tr><tr><td class=\"w\">setting</td><td class=\"m\">환경, 배경</td></tr><tr><td class=\"w\">favor</td><td class=\"m\">선호하다</td></tr><tr><td class=\"w\">environmentalist</td><td class=\"m\">환경 보호론자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">환경 친화적 장례식은</span><span class=\"en\"><b>Eco-friendly funerals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렇게 싸지 않다</span><span class=\"en\"><b>are not as cheap</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 생각할지도 모르는 것만큼</span><span class=\"en\"><b>as you <span class=\"grammar-hl\">might think</span>.</b></span></div></div><div class=\"lec-sent-ko\">이러한 환경 친화적 장례식은 생각만큼 돈이 적게 들지는 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 친환경적인 선택이 항상 비용 면에서 경제적인 것은 아니라는 반전 상황을 제시하여 글의 논의를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">might think (관용표현): &#39;might think&#39;는 상대를 고려하여 완곡하게 추측을 표현하는 관용적 패턴이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">friendly</td><td class=\"m\">친화적인</td></tr><tr><td class=\"w\">funeral</td><td class=\"m\">장례식</td></tr><tr><td class=\"w\">cheap</td><td class=\"m\">저렴한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 많은 환경론자들은 말한다</span><span class=\"en\"><b>But many environmentalists say</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 역할을 하는 것은</span><span class=\"en\"><b>that <span class=\"grammar-hl\">doing their part</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경을 위해</span><span class=\"en\"><b>for the environment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동반하지 않는다고</span><span class=\"en\"><b><span class=\"grammar-hl\">doesn’t come with</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가격표를</span><span class=\"en\"><b>a price tag.</b></span></div></div><div class=\"lec-sent-ko\">하지만 많은 환경론자들은 환경에 대하여 일정한 역할을 하는 것은 값으로 따질 일이 아니라고 말한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 **price tag**는 사전적으로 &#39;가격표&#39;이지만, 문맥상 &#39;돈으로 환산할 수 있는 가치&#39;를 뜻합니다. 환경 보호라는 가치는 금전적 비용보다 훨씬 크다는 점을 강조하기 위해, 가격을 매길 수 없다는 의미의 비유적 표현으로 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">doing their part (동명사): doing이 문장의 주어로 쓰였으며, &#39;자신의 역할을 하는 것&#39;이라는 명사적 개념을 나타낸다.</div><div class=\"lec-gr-item\">doesn’t come with (관용표현): come with는 &#39;~을 동반하다/수반하다&#39;라는 의미의 구동사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">environmentalist</td><td class=\"m\">환경 보호론자</td></tr><tr><td class=\"w\">come with</td><td class=\"m\">~가 따르다, ~가 수반되다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>살아있을 때뿐만 아니라 죽어서도 환경을 생각하려는 사람들이 늘고 있다.</li><li>영국에서 시작된 &#39;친환경 장례식&#39;이 인기를 끌고 있다.</li><li>골판지 관 사용 등 친환경적인 장례 방법들이 실천되고 있다.</li><li>친환경 장례식은 비용이 비쌀 수 있지만, 환경 보호의 가치는 돈으로 따질 수 없다는 인식이 깔려 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People are increasingly choosing eco-friendly funerals with natural materials, because they believe that protecting the environment remains important even at the end of life.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 삶의 마지막 순간까지 환경을 보호하는 것이 중요하다고 믿기에, 자연 친화적인 재료를 사용하는 친환경 장례를 점점 더 많이 선택하고 있다.</div></div></div>"],"segs":[[{"audio":"./passage1_audio/1.mp3","hl":null}],[{"audio":"./passage1_audio/2.mp3","hl":null}],[{"audio":"./passage1_audio/3.mp3","hl":null},{"audio":"./passage1_audio/4.mp3","hl":"stag
