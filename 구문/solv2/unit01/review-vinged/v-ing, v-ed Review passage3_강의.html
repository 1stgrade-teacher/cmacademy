>여러분, 혹시 &#39;성형 리얼리티 쇼(Plastic surgery reality show)&#39;라는 장르에 대해 들어본 적 있나요? 이 지문은 출연자의 외모를 완전히 바꾸는 과정을 공개하는 익스트림 메이크오버(Extreme Makeover)와 같은 방송 프로그램을 다루고 있는데, 이는 개인의 사적인 신체 변화를 오락 콘텐츠로 소비한다는 점에서 현대 사회의 미의 기준(Beauty standards)에 대한 뜨거운 논쟁을 불러일으키곤 합니다. 특히 사람들은 콤플렉스를 극복하고 자신감을 얻는 출연자의 모습에 열광하기도 하지만, 한편으로는 외모 지상주의(Lookism)를 조장하고 성형을 지나치게 가볍게 여기게 만든다는 비판적인 시각도 존재해요. 마치 예전 동화 속 &#39;미운 오리 새끼&#39;가 백조로 변신하듯 드라마틱한 변화를 보여주는 이러한 방송은, 우리 사회가 외적인 아름다움을 얼마나 중요하게 생각하는지 보여주는 문화적 현상(Cultural phenomenon)이라고 할 수 있죠. 이번 글을 읽으면서 여러분은 이러한 방송이 과연 개인의 삶에 긍정적인 영향을 미치는지, 아니면 외모에 대한 잘못된 인식을 심어주는지 고민하며 읽어보면 좋을 것 같아요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01성형수술 공개와 출연</div><ul><li>제니퍼는 자신의 성형수술 과정을 대중에게 공개하는 것을 전혀 부끄러워하지 않았다.</li><li>수술 과정을 촬영하는 TV 계약(TV contract) 체결</li><li>코, 눈, 볼, 가슴, 치아 등 다양한 부위의 수술(operations) 진행</li><li>핵심 키워드: 성형수술(cosmetic surgery)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02프로그램의 성공 요인</div><ul><li>‘익스트림 메이크오버’라는 프로그램은 미운 오리가 백조가 되는 과정으로 큰 인기를 얻었다.</li><li>시청자들의 높은 관심(excited) 유발</li><li>프로그램 명칭: 익스트림 메이크오버(Extreme Makeover)</li><li>극적인 변화를 보여주는 구성</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03프로그램 운영 방식</div><ul><li>경제적 이유로 수술이 어려운 사람들에게 무료로 기회를 제공하는 대신 수술 과정을 방송한다.</li><li>비용 문제 해결(not enough money)을 위한 새로운 방식</li><li>수술을 방송에 공개하는 조건(allow the operations to be shown)</li><li>핵심 키워드: 무료 수술(free surgery)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04대중적 인기와 파급력</div><ul><li>2002년 시작 이후 엄청난 성공을 거두며 매년 수천 명의 지원자가 몰리고 있다.</li><li>프로그램의 큰 성공(hugely successful) 입증</li><li>매년 수많은 사람들이 참가 신청(write in)</li><li>핵심 키워드: 지원자(thousands of people)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">embarrass</td><td class=\"m\">당황하게 하다, 쑥스럽게 하다</td></tr><tr><td class=\"w\">cosmetic surgery</td><td class=\"m\">성형 수술</td></tr><tr><td class=\"w\">contract</td><td class=\"m\">계약(서)</td></tr><tr><td class=\"w\">record</td><td class=\"m\">기록하다, 녹화하다</td></tr><tr><td class=\"w\">surgeon</td><td class=\"m\">외과 의사</td></tr><tr><td class=\"w\">operate</td><td class=\"m\">수술하다</td></tr><tr><td class=\"w\">operation</td><td class=\"m\">수술</td></tr><tr><td class=\"w\">cheek</td><td class=\"m\">뺨</td></tr><tr><td class=\"w\">breast</td><td class=\"m\">가슴</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ugly duckling</td><td class=\"m\">미운 오리 새끼 (나중에 아름답게 변할 사람)</td></tr><tr><td class=\"w\">extreme</td><td class=\"m\">극단적인, 엄청난</td></tr><tr><td class=\"w\">makeover</td><td class=\"m\">단장, 개조 (외모의 변화)</td></tr><tr><td class=\"w\">expensive</td><td class=\"m\">비싼</td></tr><tr><td class=\"w\">for free</td><td class=\"m\">무료로</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">허락하다, 허용하다</td></tr><tr><td class=\"w\">prove</td><td class=\"m\">판명되다, 입증되다</td></tr><tr><td class=\"w\">successful</td><td class=\"m\">성공적인</td></tr><tr><td class=\"w\">write in</td><td class=\"m\">(의견이나 신청 등을) 편지나 이메일로 보내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">제니퍼는</span><span class=\"en\"><b>Jennifer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당황하지 않았다</span><span class=\"en\"><b>was not embarrassed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 성형수술을 가지게 된 것에 대해</span><span class=\"en\"><b>about <span class=\"grammar-hl\">having her cosmetic surgery</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상에 보여지는</span><span class=\"en\"><b><span class=\"grammar-hl\">shown</span> to the world.</b></span></div></div><div class=\"lec-sent-ko\">Jennifer는 자신의 성형수술 과정이 세상에 방영되는 게 부끄럽지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 화제인 &#39;제니퍼&#39;가 자신의 성형 과정을 TV에 공개하는 상황을 다룹니다. 여기서 embarrassed는 사전적으로 &#39;당황스러운&#39;인데, 여기서는 사회적으로 민감할 수 있는 수술 장면을 남에게 보여주는 상황에서 &#39;수치심이나 부끄러움을 느끼지 않았다&#39;는 의미로 쓰였습니다. 자신의 선택에 당당한 주인공의 태도를 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">having her cosmetic surgery shown (동명사(having)): 전치사 about의 목적어 역할을 하며, her cosmetic surgery(목적어) + shown(목적보어/과거분사)이 결합된 5형식 구조의 동명사 구문이다.</div><div class=\"lec-gr-item\">shown (과거분사(형용사적)): 앞의 her cosmetic surgery를 수식하며, &#39;수술이 보여지는&#39;이라는 수동적 상태를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">embarrass</td><td class=\"m\">당황하게 하다, 쑥스럽게 하다</td></tr><tr><td class=\"w\">cosmetic surgery</td><td class=\"m\">성형 수술</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">따라서,</span><span class=\"en\"><b>Therefore,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 기쁘게 서명했다</span><span class=\"en\"><b>she happily signed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">TV 계약서에,</span><span class=\"en\"><b>a TV contract,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 카메라가 녹화했다</span><span class=\"en\"><b>and cameras recorded</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 동작을</span><span class=\"en\"><b>every move</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">외과의사들이 그녀를 수술할 때</span><span class=\"en\"><b>as surgeons <span class=\"grammar-hl\">operated on her</span>.</b></span></div></div><div class=\"lec-sent-ko\">그래서 방송국과의 계약서에 기꺼이 서명했고, 의사들이 시술하는 모든 동작을 카메라가 녹화했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장의 결과로, 제니퍼가 자신의 결정을 행동으로 옮기는 과정입니다. recorded는 단순히 &#39;기록하다&#39;라는 뜻이지만, 여기서는 수술의 모든 과정을 생생하고 세밀하게 담아냈다는 점을 강조하여 시청자들의 호기심을 자극하려는 의도가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">operated on her (관용표현): operate on은 &#39;~를 수술하다&#39;라는 뜻의 숙어로, 기본구조는 &#39;operate(자동사) + on + 목적어&#39; 패턴이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">contract</td><td class=\"m\">계약(서)</td></tr><tr><td class=\"w\">record</td><td class=\"m\">기록하다, 녹화하다</td></tr><tr><td class=\"w\">surgeon</td><td class=\"m\">외과 의사</td></tr><tr><td class=\"w\">operate</td><td class=\"m\">수술하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">제니퍼는 수술을 받았다</span><span class=\"en\"><b>Jennifer <span class=\"grammar-hl\">had operations</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 코, 눈에,</span><span class=\"en\"><b><span class=\"grammar-hl\">on her</span> nose, eyes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뺨, 가슴</span><span class=\"en\"><b>cheeks, breasts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 치아에</span><span class=\"en\"><b>and teeth.</b></span></div></div><div class=\"lec-sent-ko\">Jennifer는 코와 눈, 뺨, 가슴, 치아 수술을 받았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 제니퍼가 구체적으로 어떤 부위를 수술했는지 나열하며, 그녀가 받은 수술의 규모가 상당히 컸음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had operations on her (관용표현): &#39;have operations on&#39;은 &#39;~에 대한 수술을 받다&#39;라는 숙어적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">operation</td><td class=\"m\">수술</td></tr><tr><td class=\"w\">cheek</td><td class=\"m\">뺨</td></tr><tr><td class=\"w\">breast</td><td class=\"m\">가슴</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 수술이</span><span class=\"en\"><b><span class=\"grammar-hl\">When the operation</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마침내 보여졌을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">was finally shown</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">TV에서,</span><span class=\"en\"><b>on TV,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수백만 명의 사람들이</span><span class=\"en\"><b>millions of people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흥분했다</span><span class=\"en\"><b>were excited</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보게 되어</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미운 오리새끼가</span><span class=\"en\"><b><span class=\"grammar-hl\">an ugly duckling</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아름다운 공주가 되는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">become a beautiful princess</span>.</b></span></div></div><div class=\"lec-sent-ko\">수술 모습이 마침내 TV에서 방영되었을 때, 미운 오리새끼가 아름다운 공주가 되는 것을 보고 수백만 명이 흥미를 느꼈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대중이 이 쇼를 왜 좋아하는지 이유를 설명합니다. 여기서 ugly duckling은 사전적으로 &#39;미운 오리 새끼&#39;라는 동화 속 소재인데, 여기서는 &#39;성형 전의 외모&#39;를 비유합니다. beautiful princess는 &#39;성형 후의 외모&#39;를 뜻합니다. 익숙한 동화를 인용해 외모 변화를 극적으로 표현함으로써 대중의 흥분 상태를 효과적으로 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When the operation was finally shown (수동태): be동사(was)+p.p.(shown) 구조. show는 타동사인데 목적어가 없어서 수동구조 was shown 형태로 쓴다. 기본구조: V(show) + O(목적어) + to B(대상).</div><div class=\"lec-gr-item\">to see (to부정사(부사적)): 감정을 나타내는 형용사 excited의 원인을 설명하는 &#39;감정의 원인&#39; 용법으로 쓰였다.</div><div class=\"lec-gr-item\">an ugly duckling become a beautiful princess (5형식(SVOC)): see(지각동사) + O(an ugly duckling) + OC(become, 동사원형) 구조. 지각동사는 목적격보어로 동사원형을 취한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">operation</td><td class=\"m\">수술</td></tr><tr><td class=\"w\">ugly duckling</td><td class=\"m\">미운 오리 새끼 (나중에 아름답게 변할 사람)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 모두</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s</span> all</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일부이다</span><span class=\"en\"><b>part of a new</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 미국의 텔레비전 쇼의</span><span class=\"en\"><b>American television show</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">익스트림 메이크오버라 불리는</span><span class=\"en\"><b><span class=\"grammar-hl\">called</span> Extreme Makeover.</b></span></div></div><div class=\"lec-sent-ko\">이는 모두 “Extreme Makeover”라는 미국의 새 TV 프로그램의 일부이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 서술한 제니퍼의 사례가 일반적인 개인의 경험이 아니라, 특정 TV 프로그램의 형식임을 밝히며 글의 핵심 소재를 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s (가주어): 진주어: 여기서 &#39;It&#39;은 상황을 가리키는 비인칭 주어이나, 문장 전체의 핵심 소재를 도입하는 기능을 한다.</div><div class=\"lec-gr-item\">called (과거분사(형용사적)): 앞의 명사 show를 수식하며, &#39;Extreme Makeover라 불리는&#39;이라는 의미를 가진다. 축약 관계절(which is called) 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">extreme</td><td class=\"m\">극단적인, 엄청난</td></tr><tr><td class=\"w\">makeover</td><td class=\"m\">단장, 개조 (외모의 변화)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>People</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">충분한 돈이 없는</span><span class=\"en\"><b><span class=\"grammar-hl\">who don’t have enough money</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비싼 성형수술을 위한</span><span class=\"en\"><b>for expensive cosmetic surgery</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 행해지게 할 수 있다</span><span class=\"en\"><b>can <span class=\"grammar-hl\">get it done</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무료로,</span><span class=\"en\"><b>for free,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 그들이 허락한다면</span><span class=\"en\"><b><span class=\"grammar-hl\">if they allow</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수술이 보여지는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">the operations to be shown</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">텔레비전에</span><span class=\"en\"><b>on television.</b></span></div></div><div class=\"lec-sent-ko\">비용이 많이 드는 성형수술을 할 만한 돈이 없는 사람들이 수술모습의 TV 방영을 허락할 경우 무료로 수술을 받을 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 쇼가 운영되는 방식(거래 조건)을 설명합니다. get it done은 &#39;수술을 받다&#39;라는 뜻인데, 단순히 수술을 받는 것이 아니라 프로그램 제작진을 통해 &#39;수술을 완성하게 되는&#39; 과정을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who don’t have enough money (관계대명사): 주격 관계대명사 who가 이끄는 절이 앞의 선행사 People을 수식한다. 절 내부에서 주어 역할을 하므로 &#39;주격&#39;이다.</div><div class=\"lec-gr-item\">get it done (5형식(SVOC)): get + O(it) + OC(done, 과거분사) 구조. 목적어(수술)와 목적보어(행해지다)의 관계가 수동이므로 과거분사를 쓴다.</div><div class=\"lec-gr-item\">if they allow the operations to be shown 5형식(SVOC) 및 수동태: allow는 &#39;allow+O+toV&#39; 구조의 5형식 동사이다. 목적어(the operations)가 주어로 올라가 수동태(be shown)를 취하며, 본래의 5형식 구조가 남아있는 형태이다. 기본구조: allow + O + to V.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cosmetic surgery</td><td class=\"m\">성형 수술</td></tr><tr><td class=\"w\">operation</td><td class=\"m\">수술</td></tr><tr><td class=\"w\">expensive</td><td class=\"m\">비싼</td></tr><tr><td class=\"w\">for free</td><td class=\"m\">무료로</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">허락하다, 허용하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것이 시작된 이후로</span><span class=\"en\"><b><span class=\"grammar-hl\">Since it began</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">2002년에,</span><span class=\"en\"><b><span class=\"grammar-hl\">in 2002</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 쇼는</span><span class=\"en\"><b>the show</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">입증되었다</span><span class=\"en\"><b>has proven</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 성공적인 것으로</span><span class=\"en\"><b>hugely successful.</b></span></div></div><div class=\"lec-sent-ko\">2002년에 시작된 이후 이 프로그램은 엄청난 성공을 거두었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 쇼의 인기를 객관적 근거(방영 기간)와 함께 서술하며, 이 현상이 일시적인 것이 아님을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Since it began in 2002 분사구문(의미상 접속사절): Since는 &#39;~한 이래로&#39;라는 의미의 접속사로, 부사절을 이끌어 주절의 상황적 배경을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">prove</td><td class=\"m\">판명되다, 입증되다</td></tr><tr><td class=\"w\">successful</td><td class=\"m\">성공적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">매년</span><span class=\"en\"><b>Each year</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수천 명의 사람들이</span><span class=\"en\"><b>thousands of people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">편지를 보낸다,</span><span class=\"en\"><b>write in,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선택되기를 희망하며</span><span class=\"en\"><b><span class=\"grammar-hl\">hoping to be chosen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 자신의</span><span class=\"en\"><b>for their own</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완전한 변신을 위해</span><span class=\"en\"><b>extreme makeover.</b></span></div></div><div class=\"lec-sent-ko\">해마다 수천 명이 신청을 하고, 자신의 완전 변신을 위해 선택받고 싶어 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막으로 이 쇼가 사회적으로 얼마나 큰 관심을 끌고 있는지, 출연을 희망하는 지원자가 많다는 사실을 통해 결론짓습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hoping to be chosen (분사구문(현재분사)): 주절의 주어인 &#39;thousands of people&#39;의 부가적인 동작을 설명한다. 원래 절로 변환하면 &#39;while they hope to be chosen&#39; 정도의 의미이다.</div><div class=\"lec-gr-item\">to be chosen (수동태): to부정사의 수동형(to be + p.p.)으로, choose(타동사)의 목적어가 주어(people)와 일치하여 수동 구조가 되었다. 기본구조: choose + O(목적어).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">extreme</td><td class=\"m\">극단적인, 엄청난</td></tr><tr><td class=\"w\">makeover</td><td class=\"m\">단장, 개조 (외모의 변화)</td></tr><tr><td class=\"w\">write in</td><td class=\"m\">(의견이나 신청 등을) 편지나 이메일로 보내다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>제니퍼는 자신의 성형 과정을 TV에 공개하는 것에 당당했다.</li><li>&#39;익스트림 메이크오버&#39;는 수술 비용이 없는 사람에게 무료 수술을 해주는 대신 방송 출연을 조건으로 건다.</li><li>미운 오리 새끼가 공주로 변하는 과정은 대중에게 큰 인기를 끌었다.</li><li>이 쇼는 큰 성공을 거두었으며 매년 수천 명의 지원자가 몰리고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People receive free cosmetic surgery through a popular TV show, provided they allow their entire transformation process to be broadcast to the public.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 자신의 전체 변신 과정을 대중에게 공개하는 조건으로, 인기 TV 쇼를 통해 무료 성형수술을 받는다.</div></div></div>"],"segs":[[{"audio":"./v-ing, v-ed Review passage3_강의_audio/1.mp3","hl":null}],[{"audio":"./v-ing, v-ed Review passage3_강의_audio/2.mp3","hl":null}],[{"audio":"./v-ing, v-ed Review passage3_강의_audio/3.mp3","hl":null},{"audio":"./v-ing, v-ed Review passage3_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./v-ing, v-ed Review passage3_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./v-ing, v-ed Review passage3_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./v-ing, v-ed Review passage3_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./v-ing, v-ed Review passage3_강의_audio/8.mp3","hl":null}],[{"audio":"./v-ing, v-ed Review passage3_강의_audio/9.mp3","hl":"main"},{"audio":"./v-ing, v-ed Review passage3_강의_audio/10.mp3","hl":"meaning"},{"audio":"./v-ing, v-ed Review passage3_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./v-ing, v-ed Review passage3_강의_audio/12.mp3","hl":"main"},{"audio":"./v-ing, v-ed Review passage3_강의_audio/13.mp3","hl":"meaning"},{"audio":"./v-ing, v-ed Review passage3_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./v-ing, v-ed Review passage3_강의_audio/15.mp3","hl":"main"},{"audio":"./v-ing, v-ed Review passage3_강의_audio/16.mp3","hl":"meaning"},{"audio":"./v-ing, v-ed Review passage3_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./v-ing, v-ed Review passage3_강의_audio/18.mp3","hl":"
