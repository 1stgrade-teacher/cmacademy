d+/tjgj26c0uR1yPz/+v7/54pMr2I79/wDH1x1/HuTRsAoHA7DjAPXj15/IdsfhS/5/z0P+ePWmhlIOCPfpxQWAHGD+I9+ev6cfnRuA6ikyPXr0/TpRuAIGRk9Pel/mvP8Art5bgLRSZHqKMgdxzx+mf5c0w/q33a/L+ugv+f501vut9D/I0p9++fbj8+3t+lI3AYjrtJ55HA9MjP8An3yL/huof1/X9M//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">How Ancient Sharing Built the Foundation of Human Morality<small>고대 시대의 공유가 어떻게 인간 도덕성의 토대가 되었는가</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">진화심리학(Evolutionary psychology)에서는 인간의 도덕적 발달이 척박한 환경에서 생존하기 위한 전략에서 비롯되었다고 설명해요. 이 지문에서 다루는 핵심 개념인 상호적 이타주의(Reciprocal altruism)는 내가 남에게 베푼 친절이 훗날 나에게 돌아올 것을 기대하는 호혜적인 행동을 의미합니다. 마치 오늘 내가 친구에게 점심을 사주면, 나중에 시험 기간에 친구가 나에게 요점 정리를 빌려주는 것과 비슷한 이치라고 볼 수 있죠. 냉장고가 없던 원시 시대에는 잡은 고기를 혼자 다 먹지 못하고 썩히는 것보다, 주변 사람들과 나누어 사회적 관계라는 일종의 &#39;저축&#39;을 해두는 것이 훨씬 생존에 유리했습니다. 이러한 협력 체계가 자리 잡은 집단은 더 잘 번성할 수 있었고, 결과적으로 인간의 도덕성이 생존과 직결된 진화의 산물로 발전하게 된 것이랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01냉장고가 없던 초기 인류</div><ul><li>냉장 수단이 없었던 초기 인류는 사냥 후 남은 고기를 처리하는 문제에 직면했습니다.</li><li>보관 기술의 부재: 냉장고(refrigeration)가 없던 환경</li><li>사냥의 성공으로 얻은 막대한 양의 고기(excess meat)</li><li>핵심 키워드: 초기 인류(early humanoid), 냉장(refrigeration)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02고기를 보관하는 전략</div><ul><li>현명한 조상들은 남는 고기를 직접 보관하는 대신 다른 사람들에게 나눠주는 방식을 선택했습니다.</li><li>직접 보관의 한계 극복을 위한 타인 활용</li><li>가족뿐만 아니라 공동체 구성원(others)에게 고기 전달</li><li>핵심 키워드: 이타주의(altruism), 인적 자원(bodies and minds)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03상호 이익의 생성</div><ul><li>남는 고기를 베푸는 행위는 나중에 돌려받을 수 있다는 기대가 담긴 전략이었습니다.</li><li>관대함(generosity)을 통한 미래의 보답 유도</li><li>인간관계 형성을 통한 생존 전략 마련</li><li>핵심 키워드: 보답(repay), 상호 이타주의(mutual altruism)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04공동체의 발전과 진화</div><ul><li>나눔을 실천하며 관계를 맺은 집단은 더 큰 생존과 번영의 기회를 얻었습니다.</li><li>안정적인 관계(stable relationships) 구축</li><li>집단의 번영과 종족 번식의 유리함</li><li>핵심 키워드: 진화 심리학(evolutionary psychologists), 번영(prosper)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evolutionary</td><td class=\"m\">진화의</td></tr><tr><td class=\"w\">psychologist</td><td class=\"m\">심리학자</td></tr><tr><td class=\"w\">suggest</td><td class=\"m\">제안하다, 시사하다</td></tr><tr><td class=\"w\">absence</td><td class=\"m\">부재, 없음</td></tr><tr><td class=\"w\">effective</td><td class=\"m\">효과적인</td></tr><tr><td class=\"w\">refrigeration</td><td class=\"m\">냉장, 냉동</td></tr><tr><td class=\"w\">critical</td><td class=\"m\">결정적인, 중대한</td></tr><tr><td class=\"w\">moral</td><td class=\"m\">도덕적인</td></tr><tr><td class=\"w\">humanoid</td><td class=\"m\">원인(원시 인류)</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hunt</td><td class=\"m\">사냥하다</td></tr><tr><td class=\"w\">gather</td><td class=\"m\">채집하다, 모으다</td></tr><tr><td class=\"w\">strike it lucky</td><td class=\"m\">운 좋게 성공하다</td></tr><tr><td class=\"w\">come across</td><td class=\"m\">~을 우연히 마주치다</td></tr><tr><td class=\"w\">beast</td><td class=\"m\">짐승</td></tr><tr><td class=\"w\">manage</td><td class=\"m\">간신히 해내다</td></tr><tr><td class=\"w\">yield</td><td class=\"m\">산출하다, 내놓다</td></tr><tr><td class=\"w\">involve</td><td class=\"m\">포함하다, 관련된</td></tr><tr><td class=\"w\">consume</td><td class=\"m\">소비하다, 먹다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">진화 심리학자들은</span><span class=\"en\"><b>Evolutionary psychologists</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의견을 제시했다</span><span class=\"en\"><b>have <span class=\"grammar-hl\">suggested that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 어떤 효과적인 냉장 형태의 부재가</span><span class=\"en\"><b>the absence of any effective form of refrigeration</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결정적이었다는 것을</span><span class=\"en\"><b>was critical</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 초기 도덕성 발달에</span><span class=\"en\"><b>to our early moral development.</b></span></div></div><div class=\"lec-sent-ko\">진화 심리학자들은 효과적인 냉장 기술이 없는 것이 인간의 이른 도덕성 발달에 결정적이었다는 의견을 제시했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 다룰 주제를 제시합니다. 여기서 critical은 사전적으로 &#39;비판적인&#39;이라는 뜻이지만, 문맥상 &#39;결정적인&#39; 혹은 &#39;중대한&#39;이라는 의미입니다. 인류의 도덕성이 냉장고가 없던 시절의 생존 방식에서 비롯되었다는 핵심 논지를 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">suggested that 동격의 that: that절이 앞의 명사절 내용을 보충하거나, 동사 suggest 뒤에서 사실을 서술하는 that절 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evolutionary</td><td class=\"m\">진화의</td></tr><tr><td class=\"w\">psychologist</td><td class=\"m\">심리학자</td></tr><tr><td class=\"w\">suggest</td><td class=\"m\">제안하다, 시사하다</td></tr><tr><td class=\"w\">absence</td><td class=\"m\">부재, 없음</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">effective</td><td class=\"m\">효과적인</td></tr><tr><td class=\"w\">refrigeration</td><td class=\"m\">냉장, 냉동</td></tr><tr><td class=\"w\">critical</td><td class=\"m\">결정적인, 중대한</td></tr><tr><td class=\"w\">moral</td><td class=\"m\">도덕적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가정해보자</span><span class=\"en\"><b>Let’s say that</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 초기 원인이라고</span><span class=\"en\"><b>you’re an early humanoid</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사냥하고 채집하는</span><span class=\"en\"><b><span class=\"grammar-hl\">hunting and gathering</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아프리카 대초원에서</span><span class=\"en\"><b>on the African savannah</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 당신이 뜻밖의 행운을 만난다고</span><span class=\"en\"><b>and you <span class=\"grammar-hl\">strike it lucky</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신이 아프리카의 대초원에서 사냥과 채집생활을 하는 초기의 원인(原人)이며, 뜻밖의 행운을 만났다고 생각해보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 이해를 돕기 위해 구체적인 상황을 가정하는 도입부입니다. strike it lucky는 &#39;운 좋게 성공하다(대박이 나다)&#39;라는 관용구로, 예상치 못한 큰 사냥감을 얻은 상황을 실감 나게 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hunting and gathering (현재분사): 문장의 주어인 &#39;you&#39;의 상태나 동작을 부가적으로 설명하는 형용사적 기능의 현재분사구입니다.</div><div class=\"lec-gr-item\">strike it lucky (관용표현): &#39;운 좋게 무언가를 얻거나 성공하다&#39;라는 의미의 이디엄입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">humanoid</td><td class=\"m\">원인(원시 인류)</td></tr><tr><td class=\"w\">hunt</td><td class=\"m\">사냥하다</td></tr><tr><td class=\"w\">gather</td><td class=\"m\">채집하다, 모으다</td></tr><tr><td class=\"w\">strike it lucky</td><td class=\"m\">운 좋게 성공하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 마주친다</span><span class=\"en\"><b>You <span class=\"grammar-hl\">come across</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거대한 짐승을</span><span class=\"en\"><b>a huge beast,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 당신은 해낸다</span><span class=\"en\"><b>and you <span class=\"grammar-hl\">manage</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 죽이는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to kill</span> it.</b></span></div></div><div class=\"lec-sent-ko\">당신은 거대한 짐승과 마주쳐서 그것을 어떻게든 죽인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 &#39;운이 좋은 상황&#39;의 구체적인 예시입니다. manage to는 단순히 &#39;처리하다&#39;가 아니라 &#39;어려움 끝에 결국 해내다&#39;라는 뜻으로, 사냥의 긴박함과 성취감을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">come across (관용표현): &#39;우연히 마주치다/발견하다&#39;라는 의미의 이어동사입니다.</div><div class=\"lec-gr-item\">manage to kill (to부정사): 동사 manage의 목적어 역할을 하며, &#39;간신히 ~해내다&#39;라는 의미를 완성하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">come across</td><td class=\"m\">~을 우연히 마주치다</td></tr><tr><td class=\"w\">beast</td><td class=\"m\">짐승</td></tr><tr><td class=\"w\">manage</td><td class=\"m\">간신히 해내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 산출한다</span><span class=\"en\"><b>It yields</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 많은 고기를</span><span class=\"en\"><b>far more meat</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사냥에 관련된 누구보다</span><span class=\"en\"><b>than <span class=\"grammar-hl\">anyone involved in the hunt</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 그들의 가족이</span><span class=\"en\"><b>or their families</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소비할 수 있는 것보다</span><span class=\"en\"><b>can possibly consume.</b></span></div></div><div class=\"lec-sent-ko\">그것에서 나오는 고기는 사냥에 관련된 사람이나 그들의 가족이 소비할 수 있는 것보다 훨씬 더 많다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다음 문장에 나올 &#39;잉여 자원&#39; 문제의 원인을 설명합니다. yield는 보통 &#39;산출하다&#39;라는 경제적 용어지만, 여기서는 사냥을 통해 얻은 고기 양을 강조하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">anyone involved in the hunt (과거분사): &#39;involved&#39;가 앞의 &#39;anyone&#39;을 수식하며, &#39;사냥에 관련된 누군가&#39;라는 의미로 명사를 꾸며주는 형용사 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hunt</td><td class=\"m\">사냥하다</td></tr><tr><td class=\"w\">yield</td><td class=\"m\">산출하다, 내놓다</td></tr><tr><td class=\"w\">involve</td><td class=\"m\">포함하다, 관련된</td></tr><tr><td class=\"w\">consume</td><td class=\"m\">소비하다, 먹다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 어떻게 얻는가</span><span class=\"en\"><b>How do you get</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최대의 이득을</span><span class=\"en\"><b>the most benefit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 여분 고기의</span><span class=\"en\"><b>of your excess meat</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">냉장고 없이</span><span class=\"en\"><b>without a fridge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 그것을 저장할 그 어떤 곳도 없이</span><span class=\"en\"><b>or anywhere <span class=\"grammar-hl\">to store it</span>?</b></span></div></div><div class=\"lec-sent-ko\">냉장고나 그것을 저장할 공간이 없는 상황에서 어떻게 여분의 고기에서 최대한 이득을 얻어낼 것인가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인류가 직면했던 난관을 질문 형태로 던져 독자의 흥미를 유발합니다. excess(과잉, 남는)를 통해 냉장 기술이 없던 원시 시대의 한계를 명확히 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to store it (to부정사): 앞의 명사구 &#39;anywhere&#39;를 수식하여 &#39;~할 곳&#39;이라는 의미를 더하는 형용사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 먼 조상들 중 가장 똑똑한 이들은</span><span class=\"en\"><b>The smartest of our deep ancestors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저장했을 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">would have stored</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 여분 고기를</span><span class=\"en\"><b>their excess meat</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들의 몸과 마음속에</span><span class=\"en\"><b>in the bodies and minds of others</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(그들 자신의 동족뿐만이 아닌)</span><span class=\"en\"><b>(not just their own kin).</b></span></div></div><div class=\"lec-sent-ko\">우리의 먼 조상들 중에 가장 똑똑했던 조상은 (동족뿐만이 아닌) 다른 사람들의 몸과 마음에 여분의 고기를 저장했을 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심적인 해결책을 제시합니다. 고기를 물리적으로 보관하는 대신, 타인에게 나누어 줌으로써 &#39;호의&#39;라는 형태로 저장했다는 비유적인 통찰입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">would have stored (관용표현): 과거 사실에 대한 추측을 나타내는 &#39;would have + p.p.&#39; 형태의 조동사 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신의 선물로부터 혜택을 받은 이들이 ~한다면</span><span class=\"en\"><b><span class=\"grammar-hl\">Provided</span> those <span class=\"grammar-hl\">benefiting from your gift</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보답할 수 있었을</span><span class=\"en\"><b>could possibly repay</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 관대함에</span><span class=\"en\"><b>your generosity</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미래에</span><span class=\"en\"><b>in the future,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 최선의 일이었다</span><span class=\"en\"><b>that was the best thing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 할 수 있는</span><span class=\"en\"><b>you <span class=\"grammar-hl\">could do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여분 고기를 가지고</span><span class=\"en\"><b>with excess meat.</b></span></div></div><div class=\"lec-sent-ko\">만약 당신의 선물로 혜택을 받은 사람들이 미래에 당신의 관대함에 보답할 수 있었다면, 그것은 여분의 고기를 가지고 당신이 할 수 있는 최선의 일이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 나눔이 단순한 자선이 아니라 미래의 생존을 위한 투자였음을 설명합니다. Provided는 &#39;만약 ~라면&#39;이라는 조건의 의미로 쓰였습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Provided (분사구문): &#39;If&#39;와 같은 조건의 의미를 지닌 분사구문으로, 원래 절은 &#39;If they were provided with...&#39; 또는 &#39;Provided that they...&#39;의 구조에서 축약된 형태입니다.</div><div class=\"lec-gr-item\">benefiting from your gift (현재분사): &#39;those&#39;를 뒤에서 수식하며 &#39;당신의 선물로부터 혜택을 받는 (사람들)&#39;이라는 능동적 동작을 설명합니다.</div><div class=\"lec-gr-item\">could do 5형식(SVOC) 구조: &#39;that(목적어) + was(동사) + the best thing(보어) + (that) you could do(관계대명사절)&#39; 구조의 일부로, 대상을 설명하는 5형식적 보어 관계를 포함합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">초기 인간의 무리들은</span><span class=\"en\"><b>Groups of early humans</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안정적인 관계를 발전시켰던</span><span class=\"en\"><b><span class=\"grammar-hl\">who developed stable relationships</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 이런 종류의 상호 이타주의를 실천했던</span><span class=\"en\"><b>and practiced this sort of mutual altruism</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 나은 위치에 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">were in a better position</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">번창하고 번식하기 위한</span><span class=\"en\"><b><span class=\"grammar-hl\">to prosper and multiply</span>.</b></span></div></div><div class=\"lec-sent-ko\">안정적인 관계를 발전시키고 이런 종류의 상호 이타주의를 실천했던 초기 인간의 무리는 번창하고 번식할 수 있는 더 나은 위치에 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 결론적으로, 이러한 행동 양식이 인류 전체의 생존과 진화에 어떻게 기여했는지 요약합니다. mutual altruism(상호 이타주의)은 &#39;내가 베풀면 언젠가 돌려받는다&#39;는 호혜성의 원리를 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who developed stable relationships (관계대명사): &#39;who&#39;가 이끄는 절이 선행사 &#39;Groups of early humans&#39;를 수식하며, 절 내부에서 &#39;who&#39;가 주어 역할을 합니다.</div><div class=\"lec-gr-item\">were in a better position (관용표현): &#39;~할 더 나은 처지에 있다&#39;라는 의미의 상태 표현입니다.</div><div class=\"lec-gr-item\">to prosper and multiply (to부정사): 앞의 &#39;position&#39;을 수식하며, &#39;번영하고 증식할 (처지)&#39;라는 형용사적 용법으로 사용되었습니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>초기 인류는 냉장 기술이 없어 사냥 후 남는 고기를 처리하기 어려웠다.</li><li>똑똑한 조상들은 남는 고기를 타인에게 나누어 주며 미래의 보답을 기약했다.</li><li>이러한 &#39;상호 이타주의&#39;는 인류의 초기 도덕성 발달에 결정적 기여를 했다.</li><li>서로 돕는 관계를 만든 집단이 더 잘 살아남고 번성할 수 있었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Early humans shared excess food with others to build social bonds, and this practice of mutual altruism helped their groups survive and thrive.</div>\n              <div class=\"lec-final-sum-ko\">초기 인류는 사회적 유대를 쌓기 위해 남는 음식을 타인과 나누었으며, 이러한 상호 이타주의 관습은 집단이 생존하고 번성하는 데 도움을 주었다.</div></div></div>"],"segs":[[{"audio":"./v-ing, v-ed Review passage4_강의_audio/1.mp3","hl":null}],[{"audio":"./v-ing, v-ed Review passag
