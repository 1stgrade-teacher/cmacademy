@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"3강 reading3","audioDir":"passage3_audio","preview":false,"count":24,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">3강\u003cbr>3번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>The Elephant in the Room: The Obvious Truth We Avoid\u003c/h1>\u003ch2>방 안의 코끼리: 우리가 외면하는 명백한 진실\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>‘the elephant in the room’은 모두가 알지만 \u003cb class=\"key\">외면\u003c/b>하거나 다루지 않는 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">진실\u003c/b>을 뜻하는 영어 관용구이다. 이 글은 방 안의 코끼리라는 \u003cb class=\"key\">문자적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 통해 큰 문제를 피하고 사소한 문제에 집중하는 태도, 그리고 사회적 금기와 관련된 논의 회피를 설명한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The idiom 'the elephant in the room' refers to an obvious but ignored issue, often a social taboo, that people avoid discussing while focusing on trivial matters.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 the elephant in the room이라는 영어 관용구를 함께 읽어 볼게요. 이 표현은 모두가 알지만 아무도 말하려 하지 않는 명백한 진실을 뜻해요. 다시 말해 눈에 띄는 큰 문제를 외면하는 태도를 꼬집는 말이에요. 글은 이 관용구의 의미와 유래, 그리고 사회적 금기와 연결된 쓰임을 차례로 설명하고 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">관용구(idiom)는 단어의 문자적 의미(literal meaning)와 다른 비유적 의미(figurative meaning)를 갖는 표현이에요. 'the elephant in the room'은 방 안에 정말 코끼리가 있다면 모두가 바로 알아차릴 수밖에 없다는 \u003cb class=\"key\">문자적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에서 출발해, 모두가 알지만 아무도 말하지 않는 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">진실\u003c/b>을 가리키게 되었어요. 이런 문제는 인종차별(racism)이나 종교(religion)처럼 사회적 금기(social taboo)와 연결되어 논의 자체가 조심스러운 경우가 많아요. 일상에서도 거실 한가운데 큰 얼룩이 있는데 가족 모두가 못 본 척하고 다른 집안일만 이야기하는 모습을 떠올리면 이해하기 쉬워요. 즉 이 표현은 단순한 침묵이 아니라, 중요한 문제를 \u003cb class=\"key\">외면\u003c/b>하고 사소한 것에 집중하는 \u003cb class=\"key\">회피 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 꼬집는 말이에요.\u003c/div>","segs":[{"n":2,"text":"관용구는 단어의 문자적 의미와 다른 비유적 의미를 갖는 표현이에요. the elephant in the room은 방 안에 정말 코끼리가 있다면 모두가 바로 알아차릴 수밖에 없다는 문자적 상황에서 출발했어요. 그런데 이 표현은 모두가 알지만 아무도 말하지 않는 명백한 진실을 가리키게 되었죠. 인종차별이나 종교처럼 사회적 금기와 연결된 문제는 논의 자체가 조심스러워서 더 자주 외면하게 돼요. 거실 한가운데 큰 얼룩이 있는데 가족 모두가 못 본 척하고 다른 집안일만 이야기하는 모습을 떠올리면 이해하기 쉬워요. 그래서 이 말은 중요한 문제를 외면하고 사소한 것에 집중하는 회피 태도를 꼬집는 표현이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>관용구의 정의\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>첫 번째 문장은 ‘the elephant in the room’이 영어 관용구임을 밝히고, 그 뜻을 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">진실\u003c/b>로 제시해요. 이 진실은 누구나 알 수 있지만 \u003cb class=\"key\">외면\u003c/b>되거나 다루어지지 않는 대상이라는 점이 핵심이에요. 즉 글은 관용구의 사전적 정의부터 시작해 독자가 개념을 분명히 잡도록 도와줘요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문자적 기원\u003csmall>근거 · 문장 2\u003c/small>\u003c/h4>\u003cp>두 번째 문장은 이 표현이 방 안의 코끼리라는 \u003cb class=\"key\">문자적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에 기반한다고 설명해요. 코끼리는 너무 커서 \u003cb class=\"key\">간과할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없기\u003c/b> 때문에, 이 상황은 명백함을 강조하는 강력한 이미지가 돼요. 이어서 사람들이 큰 문제 대신 사소하고 무관한 문제에 관심을 쏟는 \u003cb class=\"key\">회피 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 지적해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>금기와 논의 회피\u003csmall>예시 · 문장 3\u003c/small>\u003c/h4>\u003cp>세 번째 문장은 이 관용구가 인종차별이나 종교처럼 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">금기\u003c/b>와 관련된 문제를 설명할 때 자주 쓰인다고 해요. 모두가 그것이 문제라고 이해하지만 아무도 기꺼이 논의하려 하지 않는 상황을 보여줘요. 그래서 이 표현은 단순한 사실이 아니라 \u003cb class=\"key\">논의 \u003c/b>\u003cb class=\"key\">회피\u003c/b>의 사회적 분위기를 담고 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>표현의 변형\u003csmall>결론 · 문장 4\u003c/small>\u003c/h4>\u003cp>네 번째 문장은 때때로 ‘a pink elephant’라는 변형도 쓰인다고 덧붙여요. 분홍 코끼리는 보통 코끼리보다 더 \u003cb class=\"key\">눈에 \u003c/b>\u003cb class=\"key\">잘 \u003c/b>\u003cb class=\"key\">띄기\u003c/b> 때문에, 외면하기 어려운 문제라는 뜻을 더 강하게 드러내요. 이는 관용구의 기본 의미를 유지하면서 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">강조\u003c/b>를 더한 변형이라고 볼 수 있어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글은 관용구의 정의에서 시작해 그 기원과 쓰임, 변형으로 나아가는 흐름이에요.","hl":null},{"n":4,"text":"첫 번째 문장은 the elephant in the room이 영어 관용구임을 밝히고 그 뜻을 명백한 진실로 제시해요. 이 진실은 누구나 알 수 있지만 외면되거나 다루어지지 않는 대상이라는 점이 핵심이에요. 글은 이렇게 관용구의 뜻을 먼저 잡게 해 줘요.","hl":"f0"},{"n":5,"text":"두 번째 문장은 이 표현이 방 안의 코끼리라는 문자적 상황에 기반한다고 설명해요. 코끼리는 너무 커서 간과할 수 없기 때문에 이 상황은 명백함을 강조하는 강력한 이미지가 돼요. 이어서 사람들이 큰 문제 대신 사소하고 무관한 문제에 관심을 쏟는 회피 태도를 지적해요.","hl":"f1"},{"n":6,"text":"세 번째 문장은 이 관용구가 인종차별이나 종교처럼 사회적 금기와 관련된 문제를 설명할 때 자주 쓰인다고 해요. 모두가 그것이 문제라고 이해하지만 아무도 기꺼이 논의하려 하지 않는 상황을 보여 주죠. 그래서 이 표현은 단순한 사실이 아니라 논의 회피의 사회적 분위기를 담고 있어요.","hl":"f2"},{"n":7,"text":"네 번째 문장은 때때로 a pink elephant라는 변형도 쓰인다고 덧붙여요. 분홍 코끼리는 보통 코끼리보다 더 눈에 잘 띄기 때문에 외면하기 어려운 문제라는 뜻을 더 강하게 드러내요. 이는 관용구의 기본 의미를 유지하면서 시각적 강조를 더한 변형이라고 볼 수 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">정의-비유-예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 관용구의 뜻을 먼저 \u003cb class=\"key\">정의\u003c/b>한 뒤, 이후 문장에서 그 의미를 뒷받침하는 설명을 이어 가는 두괄식 구성이에요. 방 안의 코끼리라는 상황은 명백한 문제를 \u003cb class=\"key\">비유\u003c/b>하는 장치로 쓰였고, 사회적 금기 사례는 그 의미를 구체화하는 \u003cb class=\"key\">예시\u003c/b>로 기능해요. 마지막 문장은 분홍 코끼리라는 변형을 제시하며 기본 개념을 확장해요. 따라서 중심 내용이 앞에 제시되고 세부 설명이 뒤따르는 구조예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>is an English idiom for (1)\u003c/b>\u003cspan>정의 제시\u003c/span>\u003cb>It is based on (2)\u003c/b>\u003cspan>근거 설명\u003c/span>\u003cb>thus (2)\u003c/b>\u003cspan>결과\u003c/span>\u003cb>such as (3)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>for the reason that (4)\u003c/b>\u003cspan>이유\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">an obvious truth that is being ignored or goes unaddressed\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the elephant in the room\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an issue that involves a social taboo\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an issue which everyone understands to be an issue, but which no one is willing to discuss\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a pink elephant\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>deal with the big one\u003c/th>\u003cth>concern themselves with small and irrelevant issues\u003c/th>\u003c/tr>\u003ctr>\u003ctd>다루어야 할 핵심 문제\u003c/td>\u003ctd>관심을 돌리는 사소한 문제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>명백해서 외면하기 어려움\u003c/td>\u003ctd>무관해서 논의가 분산됨\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 첫 문장에서 관용구의 뜻을 먼저 정의하는 두괄식 구조예요. 그다음 방 안의 코끼리라는 이미지로 명백한 문제를 비유하고, 사회적 금기 사례를 예시로 들어 의미를 구체화해요. 마지막에는 분홍 코끼리라는 변형을 덧붙여 기본 개념을 확장하죠. 그래서 중심 내용이 앞에 나오고 세부 설명이 뒤따르는 흐름으로 읽으면 돼요.","hl":"ty"},{"n":9,"text":"신호어를 보면 흐름이 더 잘 보여요. 첫 번째 문장의 is an English idiom for는 정의를 알려 주고, 두 번째 문장의 thus는 결과를 이끌어 내요. 세 번째 문장의 such as는 예시를 제시하고, 네 번째 문장의 for the reason that은 이유를 설명해요. 또 the elephant in the room과 an issue everyone understands but no one discusses처럼 표현을 바꿔 반복하는 재진술도 놓치지 마세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>elephant in the room\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>방 안의 코끼리; 모두가 알지만 외면하는 명백한 문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>idiom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관용구, 숙어\u003c/span>\u003c/div>\u003cdiv>\u003cb>obvious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>명백한\u003c/span>\u003c/div>\u003cdiv>\u003cb>truth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진실\u003c/span>\u003c/div>\u003cdiv>\u003cb>ignore\u003c/b>\u003cem>동사\u003c/em>\u003cspan>무시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go unaddressed\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다루어지지 않다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be based on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 근거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>impossible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>overlook\u003c/b>\u003cem>동사\u003c/em>\u003cspan>간과하다, 못 본 체하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thus\u003c/b>\u003cem>부사\u003c/em>\u003cspan>따라서\u003c/span>\u003c/div>\u003cdiv>\u003cb>concern oneself with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 관심을 두다, 관여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>irrelevant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무관한\u003c/span>\u003c/div>\u003cdiv>\u003cb>rather than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다는\u003c/span>\u003c/div>\u003cdiv>\u003cb>deal with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다루다, 처리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>idiomatic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관용적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>expression\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표현\u003c/span>\u003c/div>\u003cdiv>\u003cb>describe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>설명하다, 묘사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>issue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문제, 쟁점\u003c/span>\u003c/div>\u003cdiv>\u003cb>involve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다, 관련시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>social\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사회적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>taboo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>금기\u003c/span>\u003c/div>\u003cdiv>\u003cb>such as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어, ~와 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>racism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인종차별\u003c/span>\u003c/div>\u003cdiv>\u003cb>religion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종교\u003c/span>\u003c/div>\u003cdiv>\u003cb>be willing to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기꺼이 ~하려 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>discuss\u003c/b>\u003cem>동사\u003c/em>\u003cspan>논의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>occasionally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>때때로, 가끔\u003c/span>\u003c/div>\u003cdiv>\u003cb>for the reason that\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~라는 이유로\u003c/span>\u003c/div>\u003cdiv>\u003cb>visible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>눈에 보이는\u003c/span>\u003c/div>\u003cdiv>\u003cb>normal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>보통의, 정상적인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어로는 obvious, ignore, overlook, irrelevant를 꼭 챙겨 두세요. obvious는 명백한, ignore는 무시하다, overlook은 간과하다, irrelevant는 무관한이라는 뜻이에요. concern oneself with는 관심을 두다, rather than은 대안을 고르는 표현으로 함께 기억해 두면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">obvious\u003c/b>\u003cspan class=\"m\">명백한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clear\u003c/span>\u003cspan class=\"s\">evident\u003c/span>\u003cspan class=\"s\">apparent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003cspan class=\"a\">unclear\u003c/span>\u003cspan class=\"a\">hidden\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ignore\u003c/b>\u003cspan class=\"m\">무시하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disregard\u003c/span>\u003cspan class=\"s\">neglect\u003c/span>\u003cspan class=\"s\">overlook\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">notice\u003c/span>\u003cspan class=\"a\">address\u003c/span>\u003cspan class=\"a\">acknowledge\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">overlook\u003c/b>\u003cspan class=\"m\">간과하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">miss\u003c/span>\u003cspan class=\"s\">disregard\u003c/span>\u003cspan class=\"s\">neglect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">notice\u003c/span>\u003cspan class=\"a\">observe\u003c/span>\u003cspan class=\"a\">catch\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">irrelevant\u003c/b>\u003cspan class=\"m\">무관한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unrelated\u003c/span>\u003cspan class=\"s\">unimportant\u003c/span>\u003cspan class=\"s\">extraneous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relevant\u003c/span>\u003cspan class=\"a\">pertinent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">issue\u003c/b>\u003cspan class=\"m\">문제, 쟁점\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">matter\u003c/span>\u003cspan class=\"s\">problem\u003c/span>\u003cspan class=\"s\">topic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">visible\u003c/b>\u003cspan class=\"m\">눈에 보이는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">noticeable\u003c/span>\u003cspan class=\"s\">observable\u003c/span>\u003cspan class=\"s\">apparent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">invisible\u003c/span>\u003cspan class=\"a\">hidden\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discuss\u003c/b>\u003cspan class=\"m\">논의하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">debate\u003c/span>\u003cspan class=\"s\">address\u003c/span>\u003cspan class=\"s\">talk about\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">avoid\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어로 어휘를 묶어 볼게요. obvious는 clear, evident, apparent와 가깝고 obscure, unclear, hidden과 반대돼요. ignore는 disregard, neglect, overlook와 비슷하지만 notice, address, acknowledge와는 반대예요. irrelevant는 unrelated, unimportant와 가깝고 relevant, pertinent와 반대돼요. visible은 noticeable, observable와 가깝고 invisible, hidden과 반대된다는 점도 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 4\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'방 안의 코끼리'라는 말은\u003c/span>\u003cspan class=\"en\">The 'elephant in the room'\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영어 관용 표현이다\u003c/span>\u003cspan class=\"en\">is an English idiom\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">명백한 진실을 가리키는\u003c/span>\u003cspan class=\"en\">for an obvious truth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 진실은 무시되고 있거나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">ignored\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다루어지지 않고 방치되는\u003c/span>\u003cspan class=\"en\">or \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">goes \u003c/span>\u003cspan class=\"tgt\">unaddressed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">'방 안의 코끼리'는 무시되고 있거나 다루어지지 않고 방치되는 명백한 진실을 가리키는 영어 관용 표현이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 'the elephant in the room'이라는 표현의 사전적 정의를 제시하는 도입 문장입니다. 핵심은 이것이 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">진실\u003c/b>을 가리키는 \u003cb class=\"key\">영어 \u003c/b>\u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이라는 점이며, 뒤의 that절이 어떤 진실인지 구체화합니다. 글 전체가 이 숙어를 설명하는 흐름이므로 정의를 먼저 깔아 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 + 현재진행 수동태\u003c/span> : [선행사 an obvious truth] + that(주격 관계대명사) + is being + p.p. : \"무시되고 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">go + 형용사(상태 유지·변화)\u003c/span> : go [자동사] + [형용사(주격보어)] : \"다루어지지 않은 채로 남는다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The 'elephant in the room', '방 안의 코끼리'라는 말은. is an English idiom, 영어 관용 표현이다. for an obvious truth, 명백한 진실을 가리키는. that is being ignored, 그 진실은 무시되고 있거나. or goes unaddressed, 다루어지지 않고 방치되는. 이 문장 전체를 해석하면, '방 안의 코끼리'는 무시되고 있거나 다루어지지 않고 방치되는 명백한 진실을 가리키는 영어 관용 표현이다.","hl":"m"},{"n":13,"text":"이 문장은 'the elephant in the room'이라는 표현의 뜻을 사전처럼 정리해 주는 도입 문장이에요. 명백한 진실인데도 아무도 손대지 않는 상황을 가리키는 영어 관용 표현이라는 거죠. 글 전체가 이 숙어를 풀어 설명하는 흐름이니까, 정의를 먼저 제시하는 역할이라고 보시면 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째, that은 앞에 나온 an obvious truth를 꾸며 주는 주격 관계대명사예요. 두 번째, is being ignored는 현재진행 수동태로 지금 무시되고 있는 상태를 보여 줍니다. 세 번째, goes unaddressed에서 go는 상태를 나타내는 이형식 동사라서 형용사와 함께 다루어지지 않은 상태로 남는다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 4\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 생각에 근거한다\u003c/span>\u003cspan class=\"en\">It is based on the idea\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방 안의 코끼리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">elephant \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">room \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">간과하기 불가능할 것이라는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">impossible \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">overlook\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서 '방 안의 코끼리'를 무시하는 사람들은\u003c/span>\u003cspan class=\"en\">thus, people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">ignore \u003c/span>\u003cspan class=\"tgt\">'the \u003c/span>\u003cspan class=\"tgt\">elephant \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">room'\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작고 관계없는 문제들에 몰두한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">concern \u003c/span>\u003cspan class=\"tgt\">themselves \u003c/span>\u003cspan class=\"tgt\">with\u003c/span> small and irrelevant issues\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 문제를 다루기보다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">deal \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 방 안의 코끼리는 간과하기 불가능할 것이라는 생각에 근거한다; 따라서 '방 안의 코끼리'를 무시하는 사람들은 큰 문제를 다루기보다는 작고 관계없는 문제들에 몰두한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 정의한 관용 표현이 왜 성립하는지 그 근거를 설명합니다. 방 안에 코끼리가 있다면 도저히 못 본 체할 수 없다는 이미지에서 출발한다는 것이죠. 그래서 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">문제\u003c/b>를 외면한 채 \u003cb class=\"key\">작고 \u003c/b>\u003cb class=\"key\">관계없는 \u003c/b>\u003cb class=\"key\">문제\u003c/b>에 몰두하는 사람들의 태도를 대비시켜 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 that절\u003c/span> : [추상명사 the idea] + that + [주어 + 동사 + 보어의 완전한 절] : \"방 안의 코끼리는 간과하기 불가능할 것이라는 생각\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 people] + who + [동사 ignore + 목적어] : \"'방 안의 코끼리'를 무시하는 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">재귀대명사가 쓰인 관용 표현\u003c/span> : concern oneself with + [명사] : \"~에 몰두하다, ~에 관심을 두다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">rather than + 동사원형(병렬)\u003c/span> : [동사원형 A] rather than [동사원형 B] : \"큰 문제를 다루기보다는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"It is based on the idea, 그것은 생각에 근거한다. that an elephant in a room, 방 안의 코끼리는. would be impossible to overlook, 간과하기 불가능할 것이라는. thus, people who ignore 'the elephant in the room', 따라서 '방 안의 코끼리'를 무시하는 사람들은. concern themselves with small and irrelevant issues, 작고 관계없는 문제들에 몰두한다. rather than deal with the big one, 큰 문제를 다루기보다는. 이 문장 전체를 해석하면, 그것은 방 안의 코끼리는 간과하기 불가능할 것이라는 생각에 근거한다; 따라서 '방 안의 코끼리'를 무시하는 사람들은 큰 문제를 다루기보다는 작고 관계없는 문제들에 몰두한다.","hl":"m"},{"n":16,"text":"이 문장은 앞에서 소개한 관용 표현이 어떤 발상에서 나왔는지 근거를 대는 문장이에요. 방 안에 코끼리가 있으면 아무리 외면해도 못 본 체할 수 없다는 이미지에서 출발한다는 거죠. 그래서 큰 문제는 두고 작고 관계없는 문제에만 몰두하는 사람들의 모순된 태도를 보여 줍니다.","hl":"mn"},{"n":17,"text":"첫 번째, that은 추상명사 the idea와 같은 내용을 풀어 주는 동격의 접속사이고 뒤에는 완전한 절이 옵니다. 두 번째, who는 people을 받아 꾸며 주는 주격 관계대명사예요. 세 번째, concern themselves with는 재귀대명사가 들어간 표현으로 몰두하다라는 뜻을 갖습니다. 네 번째, rather than 뒤에 동사원형 deal이 온 것은 앞의 concern과 병렬을 이루기 때문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 4\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 관용 표현은 종종 사용된다\u003c/span>\u003cspan class=\"en\">This idiomatic expression \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문제를 묘사하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">describe\u003c/span> an issue\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회적 금기를 수반하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">involves \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">taboo\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인종차별이나 종교 같은\u003c/span>\u003cspan class=\"en\">such as racism or religion,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두가 문제라고 이해하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">everyone \u003c/span>\u003cspan class=\"tgt\">understands \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">issue\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 아무도 논의하려 하지 않는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">willing \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">discuss\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 관용 표현은 인종차별이나 종교와 같이 사회적 금기를 수반하는, 모두가 문제라고 이해하지만 아무도 논의하려 하지 않는 문제를 묘사하기 위해 종종 사용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이 숙어가 실제로 언제 쓰이는지 사용 맥락을 알려 줍니다. 인종차별이나 종교처럼 모두가 문제라고 알면서도 입에 올리기 꺼리는 주제를 가리킬 때 쓴다는 것이죠. 앞 문장의 정의를 구체적인 예로 풀어 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 + to부정사의 부사적 용법(목적)\u003c/span> : [be + p.p.] + [to + 동사원형] : \"묘사하기 위해 종종 사용된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 an issue] + that + [동사 + 목적어] : \"사회적 금기를 수반하는 문제\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 which + understand O to be Y\u003c/span> : [선행사 an issue] + which + [주어 everyone + 동사 understands + 목적격보어 to be an issue] : \"모두가 문제라고 이해하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">관계대명사 which의 병렬 + be willing to\u003c/span> : which A ... but which B ... / [be willing to + 동사원형] : \"그러나 아무도 논의하려 하지 않는\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"This idiomatic expression is often used, 이 관용 표현은 종종 사용된다. to describe an issue, 문제를 묘사하기 위해. that involves a social taboo, 사회적 금기를 수반하는. such as racism or religion, 인종차별이나 종교 같은. which everyone understands to be an issue, 모두가 문제라고 이해하는. but which no one is willing to discuss, 그러나 아무도 논의하려 하지 않는. 이 문장 전체를 해석하면, 이 관용 표현은 인종차별이나 종교와 같이 사회적 금기를 수반하는, 모두가 문제라고 이해하지만 아무도 논의하려 하지 않는 문제를 묘사하기 위해 종종 사용된다.","hl":"m"},{"n":19,"text":"이 문장은 이 숙어가 실제로 어떤 상황에서 쓰이는지 사용 맥락을 알려 줘요. 인종차별이나 종교처럼 모두가 문제라고 알면서도 입에 올리기를 꺼리는 주제를 가리킬 때 쓴다는 거죠. 앞 문장에서 제시한 정의를 구체적인 예로 풀어 주는 역할을 합니다.","hl":"mn"},{"n":20,"text":"첫 번째, is often used처럼 주어가 행위를 당하는 입장이라 수동태를 썼고, to describe가 묘사하기 위해라는 목적을 나타내요. 두 번째, that은 an issue를 꾸미는 주격 관계대명사입니다. 세 번째, which everyone understands to be an issue에서 which는 역시 an issue를 받는 주격 관계대명사이고, understand가 목적격보어 to be를 데려 모두가 문제라고 이해한다는 뜻을 만들어요. 네 번째, but which no one is willing to discuss는 앞의 which절과 병렬을 이루고, be willing to는 기꺼이 하려 하다라는 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 4\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 관용구는\u003c/span>\u003cspan class=\"en\">The idiom\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 때때로 사용된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">occasionally \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘분홍 코끼리’로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">'a \u003c/span>\u003cspan class=\"tgt\">pink \u003c/span>\u003cspan class=\"tgt\">elephant'\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 이유 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">reason \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분홍 코끼리가 더 눈에 띌 것이라는\u003c/span>\u003cspan class=\"en\">a pink elephant \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">visible \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보통 코끼리보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than\u003c/span> a normal elephant.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 관용구는 또한 분홍 코끼리가 보통 코끼리보다 더 눈에 띌 것이기 때문에 ‘분홍 코끼리’로도 때때로 사용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 ‘the elephant in the room’이라는 관용구가 때때로 ‘a pink elephant’로 바뀌어 쓰이는 \u003cb class=\"key\">이유\u003c/b>를 설명한다. 실제로 없는 분홍 코끼리는 보통 코끼리보다 더 \u003cb class=\"key\">눈에 \u003c/b>\u003cb class=\"key\">띄기\u003c/b> 때문에, 외면하는 문제를 더 강하게 드러내려는 \u003cb class=\"key\">비유\u003c/b>를 담고 있다. 앞 문장의 관용 표현을 보충하는 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : be + 과거분사 + by 행위자 : \"또한 때때로 사용된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as + 명사(자격·역할)\u003c/span> : use A as B : \"‘분홍 코끼리’로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격의 that절\u003c/span> : the reason + that + 완전한 절 : \"그 이유 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">조동사 would + 비교급\u003c/span> : would + 동사원형 + 비교급 + than : \"더 눈에 띌 것이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The idiom, 그 관용구는. is also occasionally used, 또한 때때로 사용된다. as 'a pink elephant', ‘분홍 코끼리’로. for the reason that, 그 이유 때문에. a pink elephant would be more visible, 분홍 코끼리가 더 눈에 띌 것이라는. than a normal elephant, 보통 코끼리보다. 이 문장 전체를 해석하면, 이 관용구는 또한 분홍 코끼리가 보통 코끼리보다 더 눈에 띌 것이기 때문에 ‘분홍 코끼리’로도 때때로 사용된다.","hl":"m"},{"n":22,"text":"이 문장은 the elephant in the room이라는 관용구가 때때로 a pink elephant로 바뀌어 쓰이는 이유를 설명해요. 실제로 없는 분홍 코끼리는 보통 코끼리보다 더 눈에 띄기 때문에, 외면하는 문제를 더 강하게 드러내려는 비유를 담고 있죠. 앞 문장의 관용 표현을 보충하는 역할을 합니다.","hl":"mn"},{"n":23,"text":"어법 포인트를 짚어 볼게요. 첫 번째, The idiom is also occasionally used에서 주어가 사용되는 대상이므로 수동태로 표현했고 also와 occasionally가 be동사 뒤에서 빈도를 나타내요. 두 번째, as a pink elephant의 as는 대상의 자격이나 역할을 규정하는 전치사로 쓰였어요. 세 번째, for the reason that은 the reason과 that절이 동격 관계를 이루면서 이유를 이끄는 표현이에요. 네 번째, would be more visible than에서 would는 가정적 조동사로 상상 속 상황을 나타내고 more visible than은 비교급 표현을 만들어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>‘the elephant in the room’은 모두가 알지만 \u003cb class=\"key\">외면\u003c/b>하거나 다루지 않는 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">진실\u003c/b>을 가리키는 영어 관용구예요.\u003c/li>\u003cli>방 안의 코끼리는 너무 커서 \u003cb class=\"key\">간과할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없기\u003c/b> 때문에 이 표현은 명백함을 강조하는 비유로 쓰여요.\u003c/li>\u003cli>사람들은 큰 문제를 다루기보다 사소하고 무관한 문제에 관심을 쏟는 \u003cb class=\"key\">회피 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 보일 수 있어요.\u003c/li>\u003cli>이 관용구는 인종차별이나 종교 같은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">금기\u003c/b>와 관련된 논의 회피를 설명하며, ‘a pink elephant’라는 변형으로 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">강조\u003c/b>를 더하기도 해요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The idiom 'the elephant in the room' refers to an obvious but ignored issue, often a social taboo, that people avoid discussing while focusing on trivial matters.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">‘the elephant in the room’은 모두가 알지만 \u003cb class=\"key\">외면\u003c/b>하거나 다루지 않는 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">진실\u003c/b>을 뜻하는 영어 관용구이다. 이 글은 방 안의 코끼리라는 \u003cb class=\"key\">문자적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 통해 큰 문제를 피하고 사소한 문제에 집중하는 태도, 그리고 사회적 금기와 관련된 논의 회피를 설명한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":24,"text":"오늘 글의 핵심은 the elephant in the room이 모두가 알지만 외면하는 명백한 진실을 뜻한다는 점이에요. 방 안의 코끼리라는 문자적 상황은 그 문제가 얼마나 간과할 수 없이 큰지 보여 주고, 사회적 금기와 연결된 논의 회피를 설명해 줘요. 마지막의 a pink elephant는 눈에 잘 띄는 문제를 더 강하게 강조하는 변형이에요. 이 표현을 기억하고 주변의 큰 문제를 외면하지 않는 태도를 가져 보시길 바라며 오늘 수업은 여기까지입니다.","hl":null}]}]});</script></body></html>
