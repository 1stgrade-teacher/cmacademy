-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01자생 식물 심기의 인기</div><ul><li>최근 정원에 자생 식물을 심는 것이 큰 인기를 끌고 있다.</li><li>새들과 꽃가루 매개자(pollinators)를 유인하는 효과</li><li>정원의 생물 다양성(diversity) 증진</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02도시 정원의 한계</div><ul><li>도심 속의 고립된 정원만으로는 훼손된 자연 서식지를 완전히 복구하기 어렵다.</li><li>자생 풍경을 흉내 내는 것만으로는 부족함</li><li>사라진 서식지(lost native habitat)를 보완하기에는 역부족</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가장 친환경적인 정원 활용법</div><ul><li>자신의 식량을 직접 재배하는 것이 생태학적으로 가장 가치 있는 정원 이용 방법이다.</li><li>먹거리 재배(gardening for food)의 중요성 제기</li><li>사람과 동물이 공존하는 정원 모델 추구</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04공생을 위한 실천</div><ul><li>정원에 심은 식물은 야생 동물뿐만 아니라 사람에게도 훌륭한 먹이가 될 수 있다.</li><li>해바라기 씨를 나누어 먹는 사례</li><li>과실수(fruit trees)를 통해 새와 사람이 함께 식량 공유</li><li>핵심 키워드: 공생(coexistence)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grow</td><td class=\"m\">기르다, 재배하다</td></tr><tr><td class=\"w\">native</td><td class=\"m\">자생의, 토착의</td></tr><tr><td class=\"w\">catch on</td><td class=\"m\">유행하다, 인기를 얻다</td></tr><tr><td class=\"w\">wildfire</td><td class=\"m\">들불, 산불</td></tr><tr><td class=\"w\">attract</td><td class=\"m\">끌어들이다, 유인하다</td></tr><tr><td class=\"w\">pollinator</td><td class=\"m\">꽃가루 매개자 (곤충 등)</td></tr><tr><td class=\"w\">diversity</td><td class=\"m\">다양성</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">imitate</td><td class=\"m\">흉내 내다, 본떠 만들다</td></tr><tr><td class=\"w\">landscape</td><td class=\"m\">조경, 풍경</td></tr><tr><td class=\"w\">isolated</td><td class=\"m\">고립된, 떨어진</td></tr><tr><td class=\"w\">make up for</td><td class=\"m\">보상하다, 벌충하다</td></tr><tr><td class=\"w\">habitat</td><td class=\"m\">서식지</td></tr><tr><td class=\"w\">ecological</td><td class=\"m\">생태학적인</td></tr><tr><td class=\"w\">oil-rich</td><td class=\"m\">기름이 풍부한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">토착 식물을 기르는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Growing native plants</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정원에서</span><span class=\"en\"><b>in a garden</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유행하고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is catching on</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산불처럼</span><span class=\"en\"><b>like wildfire.</b></span></div></div><div class=\"lec-sent-ko\">정원에 토착 식물을 심는 것이 (산불 번지듯) 순식간에 유행하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> catching on은 사전적으로 &#39;이해하다, 유행하다&#39;라는 뜻인데, 여기서는 자생 식물을 심는 행위가 사람들 사이에서 매우 빠르게 퍼지고 있다는 의미입니다. like wildfire는 &#39;산불처럼&#39;이라는 뜻의 관용구로, 그 확산 속도가 걷잡을 수 없이 빠르다는 점을 강조하기 위해 필자가 이 표현을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Growing native plants (동명사): -ing가 문장에서 주어 역할을 하여 &#39;토종 식물을 기르는 것은&#39;이라는 명사적 개념의 주어로 쓰였다.</div><div class=\"lec-gr-item\">is catching on (현재진행): be동사(is) + 현재분사(-ing) 형태로, &#39;인기를 얻고 있다&#39;라는 동작의 진행을 나타낸다.</div><div class=\"lec-gr-item\">catching on (관용표현): catch on은 &#39;인기를 얻다/유행하다&#39;라는 뜻의 숙어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grow</td><td class=\"m\">기르다, 재배하다</td></tr><tr><td class=\"w\">native</td><td class=\"m\">자생의, 토착의</td></tr><tr><td class=\"w\">wildfire</td><td class=\"m\">들불, 산불</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">토착종들은 종종 끌어들인다</span><span class=\"en\"><b>Natives often attract</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 새들과 꽃가루 매개자들을</span><span class=\"en\"><b>more birds and pollinators</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">벌이나 나비와 같은</span><span class=\"en\"><b>such as bees and butterflies,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들의 다양성을 증가시키면서</span><span class=\"en\"><b><span class=\"grammar-hl\">increasing their diversity</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 정원에</span><span class=\"en\"><b>to your garden.</b></span></div></div><div class=\"lec-sent-ko\">토착종들은 종종 새들 그리고 벌이나 나비와 같은 꽃가루받이를 하는 곤충들을 더 많이 끌어들여 정원의 다양함을 증가시켜준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 자생 식물을 기르는 것이 왜 유행하는지에 대한 이유를 설명하며, 생태계 측면의 긍정적인 효과를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">increasing their diversity (분사구문): 주절의 결과나 부수적인 동작을 설명하며, 원래 절로 바꾸면 &#39;and they increase their diversity&#39;가 된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">native</td><td class=\"m\">자생의, 토착의</td></tr><tr><td class=\"w\">attract</td><td class=\"m\">끌어들이다, 유인하다</td></tr><tr><td class=\"w\">pollinator</td><td class=\"m\">꽃가루 매개자 (곤충 등)</td></tr><tr><td class=\"w\">diversity</td><td class=\"m\">다양성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자연 풍경을 흉내 내는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Imitating a native landscape</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도시의 외딴 마당에서</span><span class=\"en\"><b>in an isolated urban yard,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리 큰 역할을 하지 못한다</span><span class=\"en\"><b><span class=\"grammar-hl\">does not do</span> all that much</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보완하는 데</span><span class=\"en\"><b>to <span class=\"grammar-hl\">make up for</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사라진 자연 서식지를</span><span class=\"en\"><b>lost native habitat.</b></span></div></div><div class=\"lec-sent-ko\">그러나, 도시의 외딴 안마당에 자연 풍경을 흉내 내는 것이 잃어버린 자연 서식지를 보완하는 데 그리 큰 역할을 하는 것은 아니다(이것을 통해 자연적인 풍경을 맛볼 수 있는 것은 아니다).</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> make up for는 &#39;보상하다, 보충하다&#39;라는 뜻으로, 훼손된 자연 서식지를 인간이 인위적으로 복구하는 데는 한계가 있다는 비판적 시각을 보여줍니다. however를 기점으로 앞 문장의 긍정적 측면에서 한계점으로 논리가 전환됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Imitating a native landscape (동명사): -ing가 전치사구 내에서 &#39;모방하는 것&#39;이라는 명사적 역할을 한다.</div><div class=\"lec-gr-item\">does not do (대동사): do는 앞의 일반동사구(make up for...)를 대신하여 반복을 피하는 대동사로 쓰였다. 앞의 동사가 일반동사이면 do[does, did]를 쓴다.</div><div class=\"lec-gr-item\">make up for (관용표현): &#39;보충하다/만회하다&#39;라는 뜻의 숙어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">native</td><td class=\"m\">자생의, 토착의</td></tr><tr><td class=\"w\">landscape</td><td class=\"m\">조경, 풍경</td></tr><tr><td class=\"w\">isolated</td><td class=\"m\">고립된, 떨어진</td></tr><tr><td class=\"w\">make up for</td><td class=\"m\">보상하다, 벌충하다</td></tr><tr><td class=\"w\">habitat</td><td class=\"m\">서식지</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러니 무엇인가</span><span class=\"en\"><b>So <span class=\"grammar-hl\">what is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 생태적인 사용은</span><span class=\"en\"><b><span class=\"grammar-hl\">the most ecological use</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 정원의?</span><span class=\"en\"><b><span class=\"grammar-hl\">of your garden</span>?</b></span></div></div><div class=\"lec-sent-ko\">그러면 정원을 가장 생태적으로 쓸 수 있는 길은 무엇일까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제기한 도시 마당의 한계점을 극복하기 위해, 더 나은 실천적 대안을 제시하기 위해 독자에게 질문을 던지며 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what is the most ecological use of your garden (간접의문문): &#39;무엇이 당신 정원의 가장 생태적인 용도인지&#39;라는 의문사가 주어 역할을 하는 명사절 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ecological</td><td class=\"m\">생태학적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">목록의 가장 위에</span><span class=\"en\"><b><span class=\"grammar-hl\">At the top of the list</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정원을 가꾸는 것이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is gardening</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신 자신의 음식을 위해</span><span class=\"en\"><b>for your own food.</b></span></div></div><div class=\"lec-sent-ko\">자신의 음식을 위해 정원을 이용하는 것이 가장 첫 번째이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 질문에 대한 필자의 핵심 주장을 밝히는 문장으로, &#39;생태적 정원 가꾸기&#39;의 최우선 순위를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">At the top of the list is gardening (도치): 전치사구(At the top of the list)가 강조를 위해 문두로 나가고, 주어(gardening)와 동사(is)의 위치가 바뀐 구조이다.</div><div class=\"lec-gr-item\">gardening (동명사): be동사의 보어 자리에서 &#39;정원 가꾸기&#39;라는 명사적 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아무런 이유가 없다</span><span class=\"en\"><b><span class=\"grammar-hl\">There is no reason</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 심은 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">that what you plant</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새들, 나비들, 그리고 벌들을 위해</span><span class=\"en\"><b>for birds, butterflies, and bees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 먹이지 못할</span><span class=\"en\"><b>cannot also feed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신과 당신의 가족을</span><span class=\"en\"><b>you and your family.</b></span></div></div><div class=\"lec-sent-ko\">새들, 나비들, 그리고 벌들을 위해 심어 놓은 것을 가족들에게 먹도록 주지 못할 이유는 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 생태계를 위한 정원과 인간을 위한 정원이 양립 불가능한 것이 아니라, 충분히 공존할 수 있다는 가능성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There is no reason that what you plant 동격의 that: &#39;이유(reason)&#39;라는 명사 뒤에서 that절이 그 이유의 구체적인 내용(&#39;당신이 심는 것이 ~할 수 없다는 사실&#39;)을 설명하고 있다.</div><div class=\"lec-gr-item\">what you plant (관계대명사): what이 &#39;~하는 것&#39;이라는 뜻의 선행사를 포함한 관계대명사로, plant의 목적어 자리가 비어 있는 명사절이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">해바라기는 종종 불린다</span><span class=\"en\"><b>Sunflowers <span class=\"grammar-hl\">are often called</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“자연의 새 먹이통”으로</span><span class=\"en\"><b>“nature’s bird feeders,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 당신은 충분히 심을 수 있다</span><span class=\"en\"><b>but you can plant enough</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기름진 씨앗을 나누기 위해</span><span class=\"en\"><b>to share the oil-rich seeds.</b></span></div></div><div class=\"lec-sent-ko\">해바라기는 종종 ‘자연이 주는 새들의 먹이통’으로 불리지만, 기름이 풍부한 씨앗을 (새와 사람이) 같이 맛보기 위해 넉넉히 심을 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 주장을 뒷받침하는 구체적인 예시(해바라기)를 통해, 인간과 동물이 자원을 공유하는 실현 가능한 방법을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are often called (수동태): be동사(are)+p.p.(called) 구조. call은 타동사로 기본구조 &#39;call A B(A를 B라고 부르다)&#39;를 취하는데 목적어가 없어 수동구조로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">oil-rich</td><td class=\"m\">기름이 풍부한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 과일 나무들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Many fruit trees</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 정원에 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">in your garden</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 먹이를 줄 수 있다</span><span class=\"en\"><b>can also feed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새들과 당신 둘 다에게</span><span class=\"en\"><b>both birds and you.</b></span></div></div><div class=\"lec-sent-ko\">정원에 있는 많은 과수들도 새들과 우리들 둘 다의 음식을 제공할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 해바라기에 이어 과실수라는 예시를 추가하여, 인간과 동물이 공생하는 정원 가꾸기가 실천하기 어렵지 않음을 다시 한번 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Many fruit trees in your garden 핵심 구조: 문장의 주어부로, 형용사구(in your garden)가 명사(Many fruit trees)를 후치 수식한다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>자생 식물을 기르는 것이 유행이지만, 도시의 작은 마당에서는 서식지 복원 효과가 제한적이다.</li><li>정원을 가장 생태적으로 활용하는 최고의 방법은 인간을 위한 식량을 직접 재배하는 것이다.</li><li>인간을 위한 농사와 동물을 위한 정원 가꾸기는 서로 배타적이지 않다.</li><li>해바라기나 과실수처럼 인간과 동물이 함께 자원을 공유하는 방식으로 정원을 활용할 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Native plants support local wildlife, but growing edible plants allows your garden to provide food for both creatures and your family.</div>\n              <div class=\"lec-final-sum-ko\">토종 식물은 지역 야생 동물을 지원하지만, 식용 식물을 재배하면 당신의 정원이 생물과 당신의 가족 모두에게 먹거리를 제공할 수 있다.</div></div></div>"],"segs":[[{"audio":"./passage3_audio/1.mp3","hl":null}],[{"audio":"./passage3_audio/2.mp3","hl":null}],[{"audio":"./passage3_audio/3.mp3","hl":null},{"audio":"./passage3_audio/4.mp3","hl":"stage-0"},{"audio":"./passage3_audio/5.mp3","hl":"stage-1"},{"audio":"./passage3_audio/6.mp3","hl":"stage-2"},{"audio":"./passage3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage3_audio/8.mp3","hl":null}],[{"audio":"./passage3_audio/9.mp3","hl":"main"},{"audio":"./passage3_audio/10.mp3","hl":"meaning"},{"audio":"./passage3_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/12.mp3","hl":"main"},{"audio":"./passage3_audio/13.mp3","hl":"meaning"},{"audio":"./passage3_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/15.mp3","hl":"main"},{"audio":"./passage3_audio/16.mp3","hl":"meaning"},{"audio":"./passage3_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/18.mp3","hl":"main"},{"audio":"./passage3_audio/19.mp3","hl":"meaning"},{"audio":"./passage3_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/21.mp3","hl":"main"},{"audio":"./passage3_audio
