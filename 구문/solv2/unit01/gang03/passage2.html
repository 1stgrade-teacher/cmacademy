n3x+TsggsSuScfeHGMA4yefbjGOQRxlgI55HUdCv68ngjGDjAGPXh/1/X+ZUNHeS5XbZtafC/w5rN/IXg4CgjnGM+nHYj1/D68BM9cHp7ZOffOf5HnI69AkZ+8CO2cZyB9evJ4HYdqNgCkDH3c5LA8Yyc/QEHp0DZ6ZpLvulr8v69TZpNNJ3fKkmrXskrX12sn1s79Ef//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Sherlock Holmes: When Fiction Is Mistaken for Reality<small>셜록 홈즈: 허구가 현실로 오해받을 때</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 책이나 영화 속 인물을 실존 인물이라고 착각해본 적 있나요? 이 글은 허구의 인물이 너무나 생생하게 묘사될 때 독자들이 이를 실제 역사 속 인물로 오해하는 가상과 현실의 혼동(confusion between fiction and reality) 현상을 다루고 있어요. 영국의 소설가 아서 코난 도일이 만든 명탐정 셜록 홈즈(Sherlock Holmes)는 너무나 완벽한 캐릭터 설정과 세밀한 배경 덕분에, 많은 팬이 그를 단순한 문학적 창작물이 아닌 실존했던 탐정(fictional character treated as a real person)으로 믿게 되었죠. 마치 우리가 좋아하는 드라마 주인공의 SNS 계정을 검색해보거나 그가 살았던 동네를 성지순례하는 것과 비슷한 심리라고 볼 수 있어요. 이렇게 작품 속 설정이 현실 세계에까지 강력한 영향력을 미치는 현상을 이해하면, 사람들이 왜 홈즈의 대학 시절을 진지하게 고민하는지 훨씬 재미있게 읽을 수 있을 거예요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01가상과 현실의 혼동</div><ul><li>많은 사람들이 소설 속 인물인 셜록 홈즈를 실제 존재했던 인물로 오해하고 있다.</li><li>허구(fiction)와 현실(reality)을 혼동하는 사람들</li><li>셜록 홈즈(Sherlock Holmes)가 실존 인물이라고 믿음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02런던 베이커 가의 방문자들</div><ul><li>소설 속 홈즈의 주소를 찾아가 그가 살았던 곳을 보기를 원하는 사람들이 여전히 존재한다.</li><li>소설 속 주소인 베이커 가 221번지(221 Baker Street)를 방문함</li><li>홈즈가 실제로 살았던 장소를 찾으려는 시도</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03홈즈를 향한 의문들</div><ul><li>사람들은 홈즈가 여전히 살아있는지 묻거나 그의 생애를 연구하는 편지를 보내기도 한다.</li><li>홈즈의 생존 여부(still be alive)를 묻는 편지</li><li>추리 소설 잡지(journals of detective fiction)에 게재되는 홈즈의 젊은 시절 관련 기사</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04학구적인 논쟁</div><ul><li>일부 사람들은 홈즈가 어느 대학을 다녔는지에 대해 진지하게 토론하기도 한다.</li><li>대학 출신지(Cambridge or Oxford)에 대한 논쟁</li><li>가상 인물의 삶을 실제 역사처럼 분석하려는 진지한 시도(serious article)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fictional</td><td class=\"m\">허구의</td></tr><tr><td class=\"w\">detective</td><td class=\"m\">탐정</td></tr><tr><td class=\"w\">be concerned</td><td class=\"m\">~에 관한 한</td></tr><tr><td class=\"w\">confuse</td><td class=\"m\">혼동하다</td></tr><tr><td class=\"w\">fiction</td><td class=\"m\">허구</td></tr><tr><td class=\"w\">reality</td><td class=\"m\">현실</td></tr><tr><td class=\"w\">every now and then</td><td class=\"m\">때때로</td></tr><tr><td class=\"w\">demand</td><td class=\"m\">요구하다</td></tr><tr><td class=\"w\">turn up</td><td class=\"m\">나타나다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">similarly</td><td class=\"m\">비슷하게</td></tr><tr><td class=\"w\">alive</td><td class=\"m\">살아 있는</td></tr><tr><td class=\"w\">address</td><td class=\"m\">주소</td></tr><tr><td class=\"w\">in addition</td><td class=\"m\">게다가</td></tr><tr><td class=\"w\">trace</td><td class=\"m\">추적하다, 뒤를 쫓다</td></tr><tr><td class=\"w\">youth</td><td class=\"m\">어린 시절, 청춘</td></tr><tr><td class=\"w\">from time to time</td><td class=\"m\">가끔씩</td></tr><tr><td class=\"w\">journal</td><td class=\"m\">잡지, 저널</td></tr><tr><td class=\"w\">once in a while</td><td class=\"m\">가끔</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Arthur Conan Doyle의 소설 속 탐정 Sherlock Holmes에</span><span class=\"en\"><b><span class=\"grammar-hl\">Where Arthur Conan Doyle’s fictional detective Sherlock Holmes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관한 한,</span><span class=\"en\"><b><span class=\"grammar-hl\">is concerned</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들은</span><span class=\"en\"><b>some people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혼동해왔다</span><span class=\"en\"><b><span class=\"grammar-hl\">have confused</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">허구와 실제를</span><span class=\"en\"><b>fiction with reality.</b></span></div></div><div class=\"lec-sent-ko\">Arthur Conan Doyle의 소설 속 탐정 Sherlock Holmes에 관한 한, 어떤 사람들은 허구와 실제를 혼동해왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 도입부로, 사람들이 가상의 인물인 셜록 홈즈를 실존 인물로 착각하는 현상을 언급합니다. 여기서 concerned는 사전적으로 &#39;걱정하는&#39;이지만, 여기서는 &#39;~와 관련해서는&#39;이라는 뜻으로 쓰였습니다. 필자는 주제를 제시하기 위해 &#39;관련되다&#39;라는 표현을 통해 논의의 범위를 설정하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Where Arthur Conan Doyle’s fictional detective Sherlock Holmes is concerned (관용표현): &#39;~에 관한 한&#39;이라는 뜻의 &#39;as far as ~ is concerned&#39; 또는 &#39;where ~ is concerned&#39; 구조로, 문장 전체의 주제를 설정하는 부사적 역할을 합니다.</div><div class=\"lec-gr-item\">have confused (현재완료): &#39;have + p.p.&#39; 형태로, 과거에 일어난 일이 현재까지 영향을 미쳐 &#39;혼동해 오고 있다&#39;라는 상태를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fictional</td><td class=\"m\">허구의</td></tr><tr><td class=\"w\">detective</td><td class=\"m\">탐정</td></tr><tr><td class=\"w\">confuse</td><td class=\"m\">혼동하다</td></tr><tr><td class=\"w\">fiction</td><td class=\"m\">허구</td></tr><tr><td class=\"w\">reality</td><td class=\"m\">현실</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">때때로,</span><span class=\"en\"><b><span class=\"grammar-hl\">Every now and then</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>for example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방문객들이</span><span class=\"en\"><b>visitors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보여 달라고 요구하는</span><span class=\"en\"><b><span class=\"grammar-hl\">demanding to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Sherlock Holmes가 전에 살았던 곳을</span><span class=\"en\"><b><span class=\"grammar-hl\">where Sherlock Holmes once lived</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나타난다</span><span class=\"en\"><b>turn up</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">221 베이커 가에</span><span class=\"en\"><b>at 221 Baker Street</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">런던의</span><span class=\"en\"><b>in London.</b></span></div></div><div class=\"lec-sent-ko\">때때로, 예를 들어, Sherlock Holmes가 전에 살았던 곳을 보여 달라고 요구하는 방문객들이 런던 베이커가 221번지에 나타난다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 주장에 대한 구체적인 예시입니다. turn up은 사전적으로 &#39;뒤집다, 나타나다&#39;인데, 여기서는 &#39;도착하다&#39; 혹은 &#39;등장하다&#39;라는 의미로 쓰였습니다. 홈즈가 소설 속 인물임을 잊고 실제로 그곳에 그가 살았을 것이라 믿고 찾아오는 사람들의 황당한 행동을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Every now and then (관용표현): &#39;가끔, 때때로&#39;라는 의미의 부사적 구입니다.</div><div class=\"lec-gr-item\">demanding to see (현재분사): &#39;demanding&#39;이 앞의 &#39;visitors&#39;를 수식하며, &#39;see&#39;를 행하는 주체인 방문객의 동작을 설명합니다. &#39;visitors who are demanding to see&#39;의 축약으로 볼 수 있습니다.</div><div class=\"lec-gr-item\">to see (to부정사): &#39;demand + O + to V&#39; 구조에서 파생된 것으로, &#39;보기 위해(목적)&#39; 또는 &#39;보는 것을(명사적)&#39; 요구한다는 의미로 쓰였습니다.</div><div class=\"lec-gr-item\">where Sherlock Holmes once lived (간접의문문): &#39;where + S + V&#39; 형태로, &#39;see&#39;라는 타동사의 목적어 역할을 하는 명사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">every now and then</td><td class=\"m\">때때로</td></tr><tr><td class=\"w\">demand</td><td class=\"m\">요구하다</td></tr><tr><td class=\"w\">turn up</td><td class=\"m\">나타나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이와 유사하게,</span><span class=\"en\"><b>Similarly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">편지들이</span><span class=\"en\"><b>letters</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알고 싶다고 하는</span><span class=\"en\"><b><span class=\"grammar-hl\">asking to know</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Holmes가 아직도 살아있는지</span><span class=\"en\"><b><span class=\"grammar-hl\">if Holmes might still be alive</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여전히 도착한다</span><span class=\"en\"><b>still arrive</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 소설 속 주소로</span><span class=\"en\"><b>at his fictional address.</b></span></div></div><div class=\"lec-sent-ko\">이와 유사하게, Holmes가 아직도 살아있는지 알고 싶다고 하는 편지들이 아직도 그의 소설 속 주소로 도착한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 예시입니다. fictional은 &#39;허구의&#39;라는 뜻인데, 필자는 이 단어를 사용하여 해당 주소가 실제 거주지가 아니라 소설 속에만 존재하는 곳임을 다시 한번 강조함으로써 사람들의 착각이 비현실적임을 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asking to know (현재분사): &#39;asking&#39;이 앞의 &#39;letters&#39;를 수식하며, 편지의 내용을 설명합니다. &#39;letters that are asking to know&#39;의 축약입니다.</div><div class=\"lec-gr-item\">to know (to부정사): &#39;ask + to V&#39; 구조로, &#39;알기를 요청하는&#39;이라는 의미의 명사적 용법입니다.</div><div class=\"lec-gr-item\">if Holmes might still be alive (간접의문문): &#39;if + S + V&#39; 형태로, &#39;know&#39;의 목적어 역할을 하는 명사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fictional</td><td class=\"m\">허구의</td></tr><tr><td class=\"w\">fiction</td><td class=\"m\">허구</td></tr><tr><td class=\"w\">similarly</td><td class=\"m\">비슷하게</td></tr><tr><td class=\"w\">alive</td><td class=\"m\">살아 있는</td></tr><tr><td class=\"w\">address</td><td class=\"m\">주소</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">게다가,</span><span class=\"en\"><b>In addition,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기사들이</span><span class=\"en\"><b>articles</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Holmes의 젊은 시절을 추적하는</span><span class=\"en\"><b><span class=\"grammar-hl\">tracing the youth of Holmes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실린다</span><span class=\"en\"><b>appear</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가끔씩</span><span class=\"en\"><b>from time to time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잡지에</span><span class=\"en\"><b>in journals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">탐정소설의</span><span class=\"en\"><b>of detective fiction.</b></span></div></div><div class=\"lec-sent-ko\">게다가, Holmes의 젊은 시절을 추적하는 기사들이 가끔씩 탐정소설 잡지에 실린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 세 번째 예시로, 독자뿐만 아니라 전문가(혹은 작가들)조차 허구의 인물인 홈즈의 과거사를 진지하게 다룬다는 점을 보여줍니다. tracing은 &#39;추적하다/따라가다&#39;인데, 여기서는 소설 속 파편적인 정보를 모아 홈즈의 생애를 구성하려는 시도를 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tracing the youth of Holmes (현재분사): &#39;tracing&#39;이 앞의 &#39;articles&#39;를 수식합니다. 명사 N을 꾸미는 현재분사로 &#39;...를 추적하는 기사들&#39;이라는 의미입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">detective</td><td class=\"m\">탐정</td></tr><tr><td class=\"w\">fiction</td><td class=\"m\">허구</td></tr><tr><td class=\"w\">in addition</td><td class=\"m\">게다가</td></tr><tr><td class=\"w\">youth</td><td class=\"m\">어린 시절, 청춘</td></tr><tr><td class=\"w\">from time to time</td><td class=\"m\">가끔씩</td></tr><tr><td class=\"w\">journal</td><td class=\"m\">잡지, 저널</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가끔,</span><span class=\"en\"><b><span class=\"grammar-hl\">Once in a while</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심각한 기사가</span><span class=\"en\"><b>a serious article</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요한 문제를 논하는</span><span class=\"en\"><b><span class=\"grammar-hl\">debating an important question</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발표된다:</span><span class=\"en\"><b><span class=\"grammar-hl\">is published</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“Holmes는 다녔을까</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Did Holmes go</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캠브리지 대학교에</span><span class=\"en\"><b><span class=\"grammar-hl\">to Cambridge</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아니면 옥스퍼드 대학교에?”</span><span class=\"en\"><b><span class=\"grammar-hl\">or Oxford?</span>”</b></span></div></div><div class=\"lec-sent-ko\">가끔 중요한 문제를 논하는 심각한 기사가 발표되는데, “Holmes는 캠브리지 대학교에 다녔을까, 옥스퍼드 대학교에 다녔을까?”하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 예시입니다. debating은 &#39;토론하다/논쟁하다&#39;인데, 허구의 인물이 어느 대학을 나왔는지 따지는 것이 논리적으로 무의미함을 꼬집기 위해 이 단어를 골랐습니다. 앞의 예시들보다 더 학술적인 형식을 빌려, 허구와 현실의 경계가 무너진 상황을 유머러스하게 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Once in a while (관용표현): &#39;가끔&#39;을 뜻하는 부사구입니다.</div><div class=\"lec-gr-item\">debating an important question (현재분사): &#39;debating&#39;이 앞의 &#39;article&#39;을 수식하며, 기사가 &#39;토론하고 있는 중인&#39; 상태를 설명합니다.</div><div class=\"lec-gr-item\">is published (수동태): be동사(is) + p.p.(published) 구조입니다. publish는 타동사(기본구조: V + O)인데 목적어가 주어로 이동하여 수동태가 되었습니다.</div><div class=\"lec-gr-item\">Did Holmes go to Cambridge or Oxford? (간접의문문): 문장 뒤에 직접의문문 형태로 삽입되어 앞의 &#39;important question&#39;과 동격적 관계를 이룹니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">once in a while</td><td class=\"m\">가끔</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들은 가상의 탐정 셜록 홈즈를 실존 인물로 착각하곤 한다.</li><li>홈즈의 집을 찾아가거나, 생사를 묻는 편지를 보내는 등 현실과 허구를 혼동하는 사례가 많다.</li><li>심지어 전문가들조차 홈즈의 어린 시절이나 학력을 진지하게 분석하는 기사를 쓴다.</li><li>이는 대중들이 소설 속 인물의 세계관에 깊이 몰입하여 현실과 허구의 경계를 구분하지 못하게 된 현상을 보여준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Many people visit or write to Sherlock Holmes’s fictional address, and some even publish serious articles about his background as if he were a real person.</div>\n              <div class=\"lec-final-sum-ko\">많은 사람이 셜록 홈즈의 가상 주소를 찾거나 편지를 보내며, 심지어 그가 실존 인물인 것처럼 그의 배경에 관한 진지한 글을 기고하기도 한다.</div></div></div>"],"segs":[[{"audio":"./passage2_audio/1.mp3","hl":null}],[{"audio":"./passage2_audio/2.mp3","hl":null}],[{"audio":"./passage2_audio/3.mp3","hl":null},{"audio":"./passage2_audio/4.mp3","hl":"stage-0"},{"audio":"./passage2_audio/5.mp3","hl":"stage-1"},{"audio":"./passage2_audio/6.mp3","hl":"stage-2"},{"audio":"./passage2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage2_audio/8.mp3","hl":null}],[{"audio":"./passage2_audio/9.mp3","hl":"main"},{"audio":"./passage2_audio/10.mp3","hl":"meaning"},{"audio":"./passage2_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/12.mp3","hl":"main"},{"audio":"./passage2_audio/13.m
