  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"3강 reading2","audioDir":"passage2_audio","preview":false,"count":27,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">3강\u003cbr>2번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Sherlock Holmes: When Fiction Is Mistaken for Reality\u003c/h1>\u003ch2>허구와 실제가 뒤섞인 Sherlock Holmes\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사람들은 Sherlock Holmes에 관해 \u003cb class=\"key\">허구와 \u003c/b>\u003cb class=\"key\">실제\u003c/b>를 혼동하여, 런던 Baker Street 221번지에 방문객이 몰리고 소설 속 주소로 편지가 도착하며, 그의 젊은 시절이나 대학을 논하는 \u003cb class=\"key\">진지한 \u003c/b>\u003cb class=\"key\">기사\u003c/b>까지 등장한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Some people confuse the fictional detective Sherlock Holmes with a real person, treating his invented address and biography as actual facts.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 Arthur Conan Doyle이 만든 탐정 Sherlock Holmes에 관한 이야기예요. 사람들이 소설 속 인물을 실제 인물처럼 대하는 흥미로운 현상을 다루고 있죠. 요지는 어떤 사람들은 허구와 실제를 혼동한다는 것이고, 그 뒤에는 이를 뒷받침하는 예시들이 촘촘하게 이어집니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">Arthur Conan Doyle이 1887년에 창조한 Sherlock Holmes는 \u003cb class=\"key\">추리 \u003c/b>\u003cb class=\"key\">소설\u003c/b>(detective fiction)을 대표하는 캐릭터입니다. Holmes는 런던 Baker Street 221번지에 살면서 친구 Watson과 함께 사건을 해결하는 인물로 그려지죠. 소설이 큰 인기를 얻자 실제로 그 주소로 팬레터가 쏟아졌고, 오늘날 그 자리에는 Sherlock Holmes Museum이 들어서 있습니다. 이런 현상은 \u003cb class=\"key\">미디어 \u003c/b>\u003cb class=\"key\">리터러시\u003c/b>(media literacy) 관점에서 허구(fiction)와 실제(reality)의 경계를 구분하는 능력이 왜 중요한지를 보여 줍니다. 마치 드라마 속 병원을 진짜 병원으로 착각해 응급실을 찾아가는 관객과 비슷한 셈입니다. 작품의 배경이 실제 도시를 바탕으로 할수록 사람들은 \u003cb class=\"key\">허구성\u003c/b>을 잊기 쉬워집니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경을 조금 알고 가면 훨씬 편해요. Sherlock Holmes는 추리 소설 속 인물로, 런던 Baker Street 이백이십일 번지에 살면서 친구 Watson과 함께 사건을 해결하는 탐정이죠. 소설이 큰 인기를 얻자 실제로 그 주소로 팬레터가 쏟아졌고, 지금은 그 자리에 Sherlock Holmes Museum이 들어서 있을 정도예요. 이런 현상은 미디어 리터러시, 그러니까 허구와 실제의 경계를 구분하는 능력이 왜 중요한지를 보여 줍니다. 드라마 속 병원을 진짜 병원으로 착각해서 응급실을 찾아가는 관객과 비슷한 셈이에요. 작품의 배경이 실제 도시를 바탕으로 할수록 사람들은 허구성을 잊기 쉬워진다는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>주제 제시\u003csmall>주장 · 문장 1\u003c/small>\u003c/h4>\u003cp>필자는 첫 문장에서 Arthur Conan Doyle의 소설 속 탐정 Sherlock Holmes에 관한 한, 어떤 사람들이 \u003cb class=\"key\">허구와 \u003c/b>\u003cb class=\"key\">실제\u003c/b>를 혼동해 왔다고 말한다. Where ... is concerned는 '~에 관한 한'이라는 뜻으로 \u003cb class=\"key\">화제의 \u003c/b>\u003cb class=\"key\">범위\u003c/b>를 좁히는 표현이다. 뒤에 이어지는 모든 예시가 이 한 문장의 \u003cb class=\"key\">주장\u003c/b>을 뒷받침한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>실제 주소 방문\u003csmall>예시 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>때때로 방문객들이 런던 \u003cb class=\"key\">Baker \u003c/b>\u003cb class=\"key\">Street \u003c/b>\u003cb class=\"key\">221번지\u003c/b>에 나타나 Sherlock Holmes가 전에 살았던 곳을 보여 달라고 요구한다. 이와 유사하게 Holmes가 아직 \u003cb class=\"key\">살아 \u003c/b>\u003cb class=\"key\">있는지\u003c/b> 알고 싶다는 편지가 지금도 그의 소설 속 주소로 도착한다. 소설 속 주소가 실제 주소로 인식되면서 \u003cb class=\"key\">혼동\u003c/b>이 구체적인 행동으로 드러나는 단계이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기사로 확장\u003csmall>예시 · 문장 4\u003c/small>\u003c/h4>\u003cp>게다가 Holmes의 \u003cb class=\"key\">젊은 \u003c/b>\u003cb class=\"key\">시절\u003c/b>을 추적하는 기사가 가끔씩 탐정 소설 잡지에 실린다. 허구의 인물에게 실제 인물 같은 \u003cb class=\"key\">이력\u003c/b>이 붙는 장면이며, In addition이 앞의 예시에 사례를 하나 더 보태는 \u003cb class=\"key\">신호어\u003c/b> 역할을 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>학술 논쟁\u003csmall>예시 · 문장 5\u003c/small>\u003c/h4>\u003cp>가끔 중요한 문제를 논하는 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">기사\u003c/b>가 발표되는데, Holmes가 Cambridge에 다녔는지 Oxford에 다녔는지를 다룬다. 소설 속 \u003cb class=\"key\">설정\u003c/b>에 불과한 내용이 학술적 논쟁의 주제가 된 것이다. 이 마지막 예시가 허구와 실제의 혼동이 얼마나 깊은지를 가장 극명하게 보여 준다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 글의 흐름을 단계별로 천천히 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 문장에서 글의 주제가 바로 나옵니다. Arthur Conan Doyle의 소설 속 탐정 Sherlock Holmes에 관한 한, 어떤 사람들은 허구와 실제를 혼동해 왔다는 거죠. Where is concerned는 에 관한 한이라는 뜻으로 화제의 범위를 좁혀 주는 표현이에요. 필자는 이렇게 주장을 먼저 던지고 뒤에서 예시로 받치는 방식을 택했습니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 아주 구체적인 예시예요. 때때로 방문객들이 런던 Baker Street 이백이십일 번지에 나타나서 Sherlock Holmes가 전에 살았던 곳을 보여 달라고 요구한다고 하죠. 이와 유사하게 Holmes가 아직 살아 있는지 알고 싶다는 편지들이 지금도 그의 소설 속 주소로 도착한다고 합니다. 소설 속 주소가 실제 주소처럼 받아들여지면서 혼동이 행동으로 나타나는 장면이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 시야가 잡지 쪽으로 넓어집니다. 게다가 Holmes의 젊은 시절을 추적하는 기사들이 가끔씩 탐정 소설 잡지에 실린다는 내용이 나오죠. In addition이라는 신호어가 앞의 예시에 사례를 하나 더 보태는 역할을 합니다. 허구의 인물에게 젊은 시절이라는 실제 같은 이력이 붙는 순간이에요.","hl":"f2"},{"n":7,"text":"마지막 단계는 이 혼동이 얼마나 진지하게 받아들여지는지를 보여 줍니다. 가끔 중요한 문제를 논하는 심각한 기사가 발표되는데, Holmes가 Cambridge에 다녔을까 Oxford에 다녔을까를 다룬다는 거예요. 소설 속 설정에 불과한 내용이 학술적인 논쟁의 주제가 된 셈이죠. 이 마지막 문장이 글 전체의 혼동을 가장 극명하게 보여 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거(예시 나열)\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 '허구와 실제를 혼동해 왔다'는 \u003cb class=\"key\">주장\u003c/b>이 먼저 제시되고, 2번부터 5번까지 구체적인 사례가 뒤따른다. for example, Similarly, In addition, Once in a while 같은 \u003cb class=\"key\">예시 \u003c/b>\u003cb class=\"key\">신호어\u003c/b>가 연달아 쓰인 점이 이를 뒷받침한다. 별도의 결론 문장 없이 사례만으로 주장을 강화하는 \u003cb class=\"key\">예시 \u003c/b>\u003cb class=\"key\">나열\u003c/b> 방식이며, 주제문이 맨 앞에 있으므로 \u003cb class=\"key\">두괄식\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Where ... is concerned (1)\u003c/b>\u003cspan>화제 범위 제한·주제 제시\u003c/span>\u003cb>for example (2)\u003c/b>\u003cspan>첫 번째 예시 도입\u003c/span>\u003cb>Similarly (3)\u003c/b>\u003cspan>앞 예시와 유사한 사례 추가\u003c/span>\u003cb>In addition (4)\u003c/b>\u003cspan>예시 하나 더 보태기\u003c/span>\u003cb>Once in a while (5)\u003c/b>\u003cspan>마지막 예시 도입\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">confused fiction with reality\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">demanding to see where Sherlock Holmes once lived\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">asking to know if Holmes might still be alive\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">tracing the youth of Holmes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">debating whether Holmes went to Cambridge or Oxford\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>허구 (Fiction)\u003c/th>\u003cth>실제 (Reality)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>소설 속 인물 Sherlock Holmes\u003c/td>\u003ctd>실제 인물처럼 대접받는 탐정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>소설 속 주소 Baker Street 221번지\u003c/td>\u003ctd>방문객과 편지가 몰리는 실제 장소\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cambridge냐 Oxford냐는 설정\u003c/td>\u003ctd>진지한 학술 기사로 논의되는 주제\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장을 먼저 제시하고 예시로 뒷받침하는 주장과 근거의 구조예요. 주제문이 첫 번째 문장에 있으니 두괄식이라고 부릅니다. 첫 문장에서 허구와 실제를 혼동한다고 선언하고, 두 번째 문장부터 다섯 번째 문장까지 네 개의 구체적인 사례를 차례로 늘어놓죠. 그래서 따로 결론을 붙이지 않아도 주장이 흔들리지 않는 글이 됩니다.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. for example은 첫 번째 예시를 끌어오고, Similarly는 앞의 사례와 비슷한 예시를 나란히 붙이며, In addition은 예시를 하나 더 보태고, Once in a while은 마지막 사례를 소개합니다. 이렇게 예시를 나열하는 신호어가 이어지면 필자의 주장을 확인하는 힘이 생겨요. 또 소설 속 주소와 실제 주소처럼 서로 반대되는 개념이 한 문장 안에서 부딪히는 지점도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Where A is concerned\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A에 관한 한\u003c/span>\u003c/div>\u003cdiv>\u003cb>fictional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>소설의, 허구의\u003c/span>\u003c/div>\u003cdiv>\u003cb>detective\u003c/b>\u003cem>명사\u003c/em>\u003cspan>탐정\u003c/span>\u003c/div>\u003cdiv>\u003cb>confuse A with B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B와 혼동하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fiction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>허구, 소설\u003c/span>\u003c/div>\u003cdiv>\u003cb>reality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실제, 현실\u003c/span>\u003c/div>\u003cdiv>\u003cb>every now and then\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>때때로\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>demand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나타나다, 모습을 드러내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>similarly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마찬가지로, 유사하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>alive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>살아 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>arrive at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 도착하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>address\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주소\u003c/span>\u003c/div>\u003cdiv>\u003cb>in addition\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>게다가\u003c/span>\u003c/div>\u003cdiv>\u003cb>trace\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추적하다, 추적해 밝히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>youth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>젊은 시절, 청년기\u003c/span>\u003c/div>\u003cdiv>\u003cb>from time to time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>때때로\u003c/span>\u003c/div>\u003cdiv>\u003cb>journal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잡지, 학술지\u003c/span>\u003c/div>\u003cdiv>\u003cb>once in a while\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가끔, 이따금\u003c/span>\u003c/div>\u003cdiv>\u003cb>serious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진지한, 심각한\u003c/span>\u003c/div>\u003cdiv>\u003cb>debate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>논하다, 토론하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>publish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발표하다, 출판하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>article\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기사\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>question\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문제, 질문\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚을게요. confuse A with B는 A를 B와 혼동하다, turn up은 나타나다, trace는 추적하다라는 뜻이에요. journal은 여기서 학술지나 잡지라는 의미로 쓰였고, publish는 발표하다로 읽으면 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">fictional\u003c/b>\u003cspan class=\"m\">허구의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">imaginary\u003c/span>\u003cspan class=\"s\">invented\u003c/span>\u003cspan class=\"s\">made-up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">real\u003c/span>\u003cspan class=\"a\">factual\u003c/span>\u003cspan class=\"a\">actual\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">confuse\u003c/b>\u003cspan class=\"m\">혼동하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mix up\u003c/span>\u003cspan class=\"s\">muddle\u003c/span>\u003cspan class=\"s\">mistake\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">distinguish\u003c/span>\u003cspan class=\"a\">separate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">turn up\u003c/b>\u003cspan class=\"m\">나타나다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">show up\u003c/span>\u003cspan class=\"s\">appear\u003c/span>\u003cspan class=\"s\">arrive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disappear\u003c/span>\u003cspan class=\"a\">vanish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">alive\u003c/b>\u003cspan class=\"m\">살아 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">living\u003c/span>\u003cspan class=\"s\">breathing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dead\u003c/span>\u003cspan class=\"a\">deceased\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">serious\u003c/b>\u003cspan class=\"m\">진지한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">earnest\u003c/span>\u003cspan class=\"s\">solemn\u003c/span>\u003cspan class=\"s\">grave\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">frivolous\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">debate\u003c/b>\u003cspan class=\"m\">논하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discuss\u003c/span>\u003cspan class=\"s\">argue\u003c/span>\u003cspan class=\"s\">dispute\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">agree\u003c/span>\u003cspan class=\"a\">concede\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">arrive\u003c/b>\u003cspan class=\"m\">도착하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reach\u003c/span>\u003cspan class=\"s\">come\u003c/span>\u003cspan class=\"s\">appear\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">depart\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. fictional은 허구의라는 뜻으로 imaginary나 invented와 가깝고, 반대말은 real이나 factual이에요. confuse는 mix up과 같고 distinguish가 반대말이죠. turn up은 show up이나 appear로 바꿔 쓸 수 있고, 반대는 disappear예요. alive는 living과 같고 dead가 반대이며, serious는 earnest나 grave와 비슷하고 trivial이 반대입니다. debate는 discuss나 argue로, important는 significant나 crucial로 바꿔 말할 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Arthur Conan Doyle의 소설 속 탐정 Sherlock Holmes에 관한 한,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Where \u003c/span>\u003cspan class=\"tgt\">Arthur \u003c/span>\u003cspan class=\"tgt\">Conan \u003c/span>\u003cspan class=\"tgt\">Doyle's \u003c/span>\u003cspan class=\"tgt\">fictional \u003c/span>\u003cspan class=\"tgt\">detective \u003c/span>\u003cspan class=\"tgt\">Sherlock \u003c/span>\u003cspan class=\"tgt\">Holmes \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">concerned\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람들은 혼동해왔다\u003c/span>\u003cspan class=\"en\">some people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">confused \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">허구를 실제와\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">fiction \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">reality\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Arthur Conan Doyle의 소설 속 탐정 Sherlock Holmes에 관한 한, 어떤 사람들은 허구와 실제를 혼동해왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체를 이끄는 \u003cb class=\"key\">주제 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. Sherlock Holmes에 관한 한 사람들이 \u003cb class=\"key\">허구\u003c/b>와 \u003cb class=\"key\">실제\u003c/b>를 헷갈려 왔다는 화두를 던지고 있죠. 그래서 뒤에는 이 주장을 뒷받침하는 구체적인 사례들이 줄줄이 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현(Where ~ is concerned: ~에 관한 한)\u003c/span> : Where + [명사(구)] + is concerned = [명사]에 관한 한 : \"Arthur Conan Doyle의 소설 속 탐정 Sherlock Holmes에 관한 한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료(have + 과거분사)\u003c/span> : have/has + [과거분사] = 과거부터 현재까지 이어진 상태 : \"혼동해왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사 구문(confuse A with B)\u003c/span> : confuse + [목적어 A] + with + [목적어 B] = A를 B와 혼동하다 : \"허구를 실제와 혼동하다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Where Arthur Conan Doyle's fictional detective Sherlock Holmes is concerned, Arthur Conan Doyle의 소설 속 탐정 Sherlock Holmes에 관한 한. some people have confused, 어떤 사람들은 혼동해왔다. fiction with reality, 허구를 실제와. 이 문장 전체를 해석하면, Arthur Conan Doyle의 소설 속 탐정 Sherlock Holmes에 관한 한, 어떤 사람들은 허구와 실제를 혼동해왔다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체를 이끄는 주제 문장이에요. Sherlock Holmes에 관한 한 사람들이 허구와 실제를 헷갈려 왔다는 화두를 던지고 있죠. 그래서 뒤에는 이 주장을 뒷받침하는 구체적인 사례들이 줄줄이 이어지는 구조입니다.","hl":"mn"},{"n":14,"text":"먼저 Where Arthur Conan Doyle's fictional detective Sherlock Holmes is concerned는 ~에 관한 한이라는 관용 표현이에요. 뒤 문장 내용이 성립하는 전제를 깔아 주는 역할을 하죠. 다음으로 have confused는 현재완료라서 과거부터 지금까지 계속 이어져 왔다는 느낌을 줍니다. 마지막으로 confused fiction with reality에서 confuse A with B, A를 B와 짝 지어 혼동하다라는 표현을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때때로,\u003c/span>\u003cspan class=\"en\">Every now and then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">for example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보여 달라고 요구하는 방문객들이\u003c/span>\u003cspa 003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아직도 그의 소설 속 주소로 도착한다.\u003c/span>\u003cspan class=\"en\">still arrive at his fictional address.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이와 유사하게, Holmes가 아직도 살아있는지 알고 싶다고 하는 편지들이 아직도 그의 소설 속 주소로 도착한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에 이어 두 번째 \u003cb class=\"key\">예시\u003c/b>를 보여 주는 문장이에요. 이번에는 사람이 아니라 편지가 소설 속 주소로 계속 배달된다는 거죠. similarly가 앞의 사례와 같은 흐름이라는 것을 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사(형용사적 용법)\u003c/span> : [명사] + [현재분사 ~ing] = ~하는 [명사] : \"알고 싶다고 하는 편지들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 if(~인지 아닌지)\u003c/span> : know + if + [주어 + 동사] = ~인지 아닌지 알다 : \"Holmes가 아직도 살아있는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 might + 동사원형(추측)\u003c/span> : might + [동사원형] = ~일지도 모른다 : \"아직도 살아있을지도 모른다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Similarly, 이와 유사하게. letters asking to know, 알고 싶다고 하는 편지들이. if Holmes might still be alive, Holmes가 아직도 살아있는지. still arrive at his fictional address, 아직도 그의 소설 속 주소로 도착한다.. 이 문장 전체를 해석하면, 이와 유사하게, Holmes가 아직도 살아있는지 알고 싶다고 하는 편지들이 아직도 그의 소설 속 주소로 도착한다.","hl":"m"},{"n":19,"text":"앞 문장에 이어 두 번째 예시를 보여 주는 문장이에요. 이번에는 사람이 아니라 편지가 소설 속 주소로 계속 배달된다는 거죠. similarly가 앞의 사례와 같은 흐름이라는 것을 알려 줍니다.","hl":"mn"},{"n":20,"text":"먼저 letters asking to know에서 asking은 현재분사로 letters를 꾸며 주고, 묻는 주체가 편지들이라서 능동의 ing가 왔어요. 두 번째로 if Holmes might still be alive에서 if는 만약이 아니라 ~인지 아닌지라는 명사절 접속사이고, know의 목적어로 쓰였습니다. 세 번째로 might still be alive에서 might는 추측의 조동사이고 뒤에는 동사원형 be가 온다는 점을 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가,\u003c/span>\u003cspan class=\"en\">In addition,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Holmes의 젊은 시절을 추적하는 기사들이\u003c/span>\u003cspan class=\"en\">articles \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tracing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">youth \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Holmes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가끔씩 실린다\u003c/span>\u003cspan class=\"en\">appear \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">탐정소설 잡지에\u003c/span>\u003cspan class=\"en\">in journals of detective fiction.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가, Holmes의 젊은 시절을 추적하는 기사들이 가끔씩 탐정소설 잡지에 실린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 손님이 221번지에 찾아오고 편지가 도착한다는 예를 들었는데, 이 문장은 그 흐름을 이어 받아 잡지 \u003cb class=\"key\">기사\u003c/b>까지 Holmes를 실존 인물처럼 다룬다고 말합니다. 즉 \u003cb class=\"key\">현실과 \u003c/b>\u003cb class=\"key\">허구의 \u003c/b>\u003cb class=\"key\">혼동\u003c/b>이 여러 방향에서 나타난다는 것을 보여 주는 또 하나의 사례예요. tracing은 '추적하는'이 아니라 Holmes의 삶을 더듬어 다루는, 즉 '기록으로 다루는'에 가깝습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 용법(능동)\u003c/span> : [명사 articles] + [tracing + 목적어 (현재분사구)] : \"Holmes의 젊은 시절을 추적하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">빈도를 나타내는 관용 표현(부사구)\u003c/span> : from time to time = occasionally = 가끔씩 : \"가끔씩\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"In addition, 게다가. articles tracing the youth of Holmes, Holmes의 젊은 시절을 추적하는 기사들이. appear from time to time, 가끔씩 실린다. in journals of detective fiction, 탐정소설 잡지에. 이 문장 전체를 해석하면, 게다가, Holmes의 젊은 시절을 추적하는 기사들이 가끔씩 탐정소설 잡지에 실린다.","hl":"m"},{"n":22,"text":"이 문장은 허구의 인물이 현실의 인물처럼 다뤄지는 흐름을 이어 줍니다. 앞에서 손님이 찾아오고 편지가 도착한다고 했죠. 이제는 잡지에 실리는 기사까지 Holmes의 젊은 시절을 다룬다는 겁니다. 결국 현실과 허구의 혼동이 기사라는 형태로도 나타난다는 뜻이에요.","hl":"mn"},{"n":23,"text":"먼저 tracing the youth of Holmes를 보세요. tracing은 현재분사로, 앞에 있는 articles를 뒤에서 꾸며 주면서 기사들이 젊은 시절을 추적하는 능동의 주체라는 걸 보여 줍니다. 관계대명사와 be동사가 생략된 형태라고 이해하면 쉬워요. 그리고 from time to time은 가끔씩이라는 뜻의 관용 표현입니다. 빈도를 나타내는 부사구로 통째로 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가끔\u003c/span>\u003cspan class=\"en\">Once in a while,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 문제를 논하는 심각한 기사가\u003c/span>\u003cspan class=\"en\">a serious article \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">debating \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">question\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발표되는데,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">published\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“Holmes는 캠브리지 대학교에 다녔을까, 옥스퍼드 대학교에 다녔을까?”하는 것이다.\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Did \u003c/span>\u003cspan class=\"tgt\">Holmes \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Cambridge \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">Oxford?\u003c/span>&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가끔 중요한 문제를 논하는 심각한 기사가 발표되는데, “Holmes는 캠브리지 대학교에 다녔을까, 옥스퍼드 대학교에 다녔을까?”하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가상의 인물의 대학 진학 여부를 진지한 \u003cb class=\"key\">논쟁\u003c/b> 거리로 다루는 기사가 실린다는 내용입니다. 앞선 예시들과 마찬가지로 \u003cb class=\"key\">가상의 \u003c/b>\u003cb class=\"key\">인물\u003c/b>에게 실제 대학이라는 현실의 잣대를 들이대는 \u003cb class=\"key\">현실과 \u003c/b>\u003cb class=\"key\">허구의 \u003c/b>\u003cb class=\"key\">혼동\u003c/b>을 가장 극명하게 보여 주는 마무리 문장이에요. serious라는 단어를 써서 우스운 상황을 오히려 진지하게 서술하는 점이 이 글의 재미 포인트입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 용법(능동)\u003c/span> : [명사 a serious article] + [debating + 목적어 (현재분사구)] : \"중요한 문제를 논하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(현재시제)\u003c/span> : [주어 a serious article] + [is published (be동사 + 과거분사)] : \"발표된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">선택 의문문(or)\u003c/span> : Did + 주어 + 동사원형 + A or B? : \"Holmes는 캠브리지 대학교에 다녔을까, 옥스퍼드 대학교에 다녔을까?\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Once in a while, 가끔. a serious article debating an important question, 중요한 문제를 논하는 심각한 기사가. is published, 발표되는데. \"Did Holmes go to Cambridge or Oxford?\", “Holmes는 캠브리지 대학교에 다녔을까, 옥스퍼드 대학교에 다녔을까?”하는 것이다.. 이 문장 전체를 해석하면, 가끔 중요한 문제를 논하는 심각한 기사가 발표되는데, “Holmes는 캠브리지 대학교에 다녔을까, 옥스퍼드 대학교에 다녔을까?”하는 것이다.","hl":"m"},{"n":25,"text":"이 문장은 가상의 인물의 대학 진학 여부를 진지한 논쟁 거리로 다루는 기사가 실린다는 내용입니다. 앞의 예시들과 똑같이 가상의 인물에게 실제 대학이라는 현실의 잣대를 들이대고 있죠. 그래서 이 글 전체를 관통하는 현실과 허구의 혼동을 가장 선명하게 보여 주는 마무리 문장이에요.","hl":"mn"},{"n":26,"text":"첫 번째, debating an important question에서 debating은 현재분사입니다. 앞에 있는 a serious article을 뒤에서 꾸며 주면서 기사가 문제를 논하는 능동의 관계라는 걸 알려 줘요. 두 번째, is published는 수동태로 기사는 발표되는 대상이라는 뜻입니다. 주어가 단수라서 is가 온 것도 같이 기억해 두세요. 세 번째, Did Holmes go to Cambridge or Oxford는 둘 중 하나를 고르게 하는 선택 의문문입니다. 의문사 없이 Did로 시작한다는 점이 포인트예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사람들은 Sherlock Holmes에 관해 \u003cb class=\"key\">허구와 \u003c/b>\u003cb class=\"key\">실제\u003c/b>를 혼동해 왔다.\u003c/li>\u003cli>그래서 방문객들이 런던 \u003cb class=\"key\">Baker \u003c/b>\u003cb class=\"key\">Street \u003c/b>\u003cb class=\"key\">221번지\u003c/b>에 나타나 그가 전에 살았던 곳을 보여 달라고 요구한다.\u003c/li>\u003cli>Holmes가 아직 살아 있는지 묻는 \u003cb class=\"key\">편지\u003c/b>가 지금도 그의 소설 속 주소로 도착한다.\u003c/li>\u003cli>Holmes의 젊은 시절을 추적하는 기사와 그가 Cambridge에 다녔는지 Oxford에 다녔는지를 논하는 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">기사\u003c/b>까지 잡지에 발표된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Some people confuse the fictional detective Sherlock Holmes with a real person, treating his invented address and biography as actual facts.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사람들은 Sherlock Holmes에 관해 \u003cb class=\"key\">허구와 \u003c/b>\u003cb class=\"key\">실제\u003c/b>를 혼동하여, 런던 Baker Street 221번지에 방문객이 몰리고 소설 속 주소로 편지가 도착하며, 그의 젊은 시절이나 대학을 논하는 \u003cb class=\"key\">진지한 \u003c/b>\u003cb class=\"key\">기사\u003c/b>까지 등장한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"오늘 글은 허구의 인물을 실제 인물처럼 대하는 사람들의 모습을 여러 예시로 보여 주었습니다. 첫 문장에서 주장을 잡고, 이어지는 예시 신호어를 따라가면 내용이 저절로 정리돼요. 시험에서는 첫 문장과 예시들의 공통점을 연결하는 문제가 자주 나오니 그 부분을 꼭 기억해 두세요. 오늘 수업은 여기까지입니다. 수고했어요.","hl":null}]}]});</script></body></html>
