<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3강 reading1 — AI 강의</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"3강 reading1","audioDir":"passage1_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">3강\u003cbr>1번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Reading Quickly Boosts Fluency and Comprehension\u003c/h1>\u003ch2>빨리 읽기가 유창함과 이해력을 높인다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>많은 학생들은 글의 전체 의미를 파악하려면 모든 단어를 따져가며 천천히 읽어야 한다고 생각하지만, 오히려 \u003cb class=\"key\">빨리 \u003c/b>\u003cb class=\"key\">읽기\u003c/b>가 \u003cb class=\"key\">유창함\u003c/b>과 이해를 높인다. 모르는 단어는 건너뛰고 문장들을 연결해 보면 사소한 세부사항에 방해받지 않고 \u003cb class=\"key\">짐작\u003c/b>으로 전체 의미를 파악할 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Reading quickly and skipping over unknown words can increase your fluency and comprehension, unlike slow, word-by-word reading.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 읽기 속도와 이해력의 관계를 다룬 글이에요. 많은 학생이 모든 단어를 천천히 따져 읽어야 이해가 된다고 믿지만, 이 글은 정반대로 빨리 읽기가 유창함과 이해를 높인다고 말하고 있죠. 핵심은 모르는 단어를 건너뛰고 문장들을 연결해 전체 의미를 짐작하는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">독해에서 \u003cb class=\"key\">이해력\u003c/b>은 단어를 하나하나 아는 능력이라기보다 글 전체의 흐름을 붙잡는 능력에 가깝다. 우리 뇌가 한 번에 처리할 수 있는 정보의 양은 정해져 있어서, 모르는 단어 하나에 오래 붙잡히면 정작 중요한 내용을 놓치게 된다. 이렇게 정보를 한꺼번에 다루는 부담을 cognitive load, 즉 인지 부하라고 부른다. 반대로 속도를 내어 읽으면 글의 구조가 눈에 들어오고, 그 구조가 낯선 단어의 뜻을 짐작하게 해 주는데 이것을 \u003cb class=\"key\">educated \u003c/b>\u003cb class=\"key\">guess\u003c/b>라고 한다. 자전거를 처음 배울 때도 페달 하나하나를 의식하면 오히려 넘어지지만, 앞을 보고 시원하게 달리면 균형이 저절로 잡힌다. \u003cb class=\"key\">유창함\u003c/b>도 이렇게 속도를 내면서 자연스럽게 길러지는 것이다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 독해에서 comprehension, 즉 이해력은 단어 하나하나를 아는 것보다 글의 흐름을 붙잡는 능력에 가까워요. 우리 뇌가 한 번에 처리할 수 있는 정보의 양은 정해져 있어서, 모르는 단어 하나에 오래 붙잡히면 정작 중요한 내용을 놓치게 되죠. 그래서 속도를 내어 읽으면 글의 구조가 눈에 들어오고, 그 구조가 낯선 단어의 뜻을 짐작하게 해 줘요. 이것을 영어로 educated guess라고 부릅니다. 자전거를 처음 배울 때도 페달 하나하나를 의식하면 오히려 넘어지지만 앞을 보고 시원하게 달리면 균형이 잡히듯이, fluency, 즉 유창함도 속도를 내면서 자연스럽게 길러지는 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>통념 제시\u003csmall>도입·통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 많은 학생들이 독해에 어려움을 겪는다는 이야기로 시작한다. 그 학생들은 글의 \u003cb class=\"key\">전체 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 파악하기 위해서는 모든 단어를 따져가며 지문을 \u003cb class=\"key\">천천히\u003c/b> 살펴보아야 한다고 굳게 믿는다. 이것이 이 글에서 반박하게 될 \u003cb class=\"key\">통념\u003c/b>이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>정반대 주장\u003csmall>전환·주장 · 문장 3\u003c/small>\u003c/h4>\u003cp>그러나 세 번째 문장에서 글은 정반대 방향으로 틀어진다. 빨리 읽는 것이 \u003cb class=\"key\">유창함\u003c/b>과 이해를 높이는 데 도움이 될 수 있다는 것이 이 글의 \u003cb class=\"key\">주장\u003c/b>이다. 앞의 통념을 한 번에 뒤집는 \u003cb class=\"key\">전환\u003c/b>이 여기서 일어난다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>두 가지 근거\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>첫 번째 근거는 모르는 단어를 건너뛰는 것이다. 사소하고 중요하지 않은 \u003cb class=\"key\">세부사항\u003c/b>에 이해가 방해받지 않게 해 준다. 두 번째 근거는 문장들을 연결해 요지가 어떻게 \u003cb class=\"key\">전개\u003c/b>되는지 보는 것으로, 이것이 잘 모르는 단어의 의미를 \u003cb class=\"key\">짐작\u003c/b>하게 해 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>당부와 결론\u003csmall>결론·당부 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>마지막으로 글은 다음번에 읽을 때 모르는 단어에서 멈추지 말고 지문을 빠르게 훑어보라고 \u003cb class=\"key\">당부\u003c/b>한다. 그렇게 하면 \u003cb class=\"key\">세부사항\u003c/b>을 꼭 다 알지 않고도 글을 이해할 수 있다는 것을 알게 된다. 앞의 주장이 실천 지침과 결론으로 마무리되는 부분이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 통념이에요. 많은 학생이 독해에 어려움을 겪는다는 사실에서 글은 시작하죠. 그리고 그 학생들은 글의 전체 의미를 파악하려면 모든 단어를 따져가며 지문을 천천히 살펴보아야 한다고 생각해요. 여기서 우리는 학생들이 굳게 믿고 있는 통념 하나를 확인하게 됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 전환이에요. 그러나 반대가 맞다면서 글은 방향을 확 틀어요. 빨리 읽는 것이 유창함과 이해를 높이는 데 도움이 될 수 있다는 것이 이 글의 주장이죠. 앞에서 본 통념을 한 번에 뒤집는 전환이 일어나는 자리예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 근거 제시예요. 모르는 단어를 건너뛰면 사소하고 중요하지 않은 세부사항에 방해받지 않는다는 근거가 먼저 나와요. 이어서 요지가 어떻게 전개되고 있는지 문장들을 연결해서 보면 잘 모르는 단어의 의미를 짐작할 수 있다는 근거가 붙죠. 두 근거 모두 빨리 읽기가 왜 이해에 도움이 되는지를 설명해 줍니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 당부와 결론이에요. 다음번에 글을 읽을 때 모르는 단어에서 멈추지 말고 지문을 빠르게 훑어보라고 권해요. 그러면 세부사항을 꼭 다 알지 않고도 글을 이해할 수 있다는 것을 알게 될 거라고 말하죠. 주장이 실천 지침과 결론으로 깔끔하게 마무리되는 부분이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 두 문장에서 모든 단어를 따져가며 읽어야 한다는 \u003cb class=\"key\">통념\u003c/b>을 먼저 깔아 놓는다. 이어 세 번째 문장에서 however로 그 통념을 뒤집으며 빨리 읽기가 유창함과 이해를 높인다는 \u003cb class=\"key\">주제문\u003c/b>을 제시한다. 그 뒤로는 근거와 당부가 붙어 주제문을 받쳐 주므로 주제가 글의 가운데 놓인 \u003cb class=\"key\">중괄식\u003c/b>으로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (3)\u003c/b>\u003cspan>통념을 뒤집는 전환\u003c/span>\u003cb>Besides (5)\u003c/b>\u003cspan>근거를 보태는 추가\u003c/span>\u003cb>The next time (6)\u003c/b>\u003cspan>독자에게 행동을 권하는 당부\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">reading comprehension\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">grasp the full meaning of the text\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">increase your fluency and comprehension\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">make an educated guess\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">understand it without necessarily knowing all the details\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>천천히 읽기 (slow reading)\u003c/th>\u003cth>빨리 읽기 (fast reading)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>모든 단어를 따져가며 읽음\u003c/td>\u003ctd>모르는 단어는 건너뜀\u003c/td>\u003c/tr>\u003ctr>\u003ctd>모르는 단어에 멈춰 흐름이 끊김\u003c/td>\u003ctd>사소한 세부사항에 방해받지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>유창함과 이해가 잘 늘지 않음\u003c/td>\u003ctd>유창함과 이해가 향상됨\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개방식은 통념과 반박이에요. 구조를 보면 첫 두 문장에서 통념이 깔리고, 세 번째 문장에 주제문이 놓인 뒤 근거와 당부가 이어지죠. 그래서 주제가 글의 가운데에 있는 중괄식이라고 정리할 수 있어요. 읽을 때는 세 번째 문장의 however에서 힘을 주는 게 중요합니다.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 세 번째 문장의 however는 앞의 통념을 뒤집는 전환 신호예요. 다섯 번째 문장의 besides는 근거를 하나 더 보태는 추가 신호이고요. 마지막 문장의 the next time은 독자에게 행동을 권하는 당부의 신호로 읽으면 됩니다. 또 전체 의미를 파악한다는 표현이 comprehension과 understanding으로 되풀이되면서 같은 개념이 이어진다는 점도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>have difficulty with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 어려움을 겪다\u003c/span>\u003c/div>\u003cdiv>\u003cb>comprehension\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이해, 독해력\u003c/span>\u003c/div>\u003cdiv>\u003cb>go through\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(지문을) 처음부터 끝까지 살펴보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>passage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지문, 글\u003c/span>\u003c/div>\u003cdiv>\u003cb>in order to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하기 위해\u003c/span>\u003c/div>\u003cdiv>\u003cb>grasp\u003c/b>\u003cem>동사\u003c/em>\u003cspan>파악하다, 붙잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>text\u003c/b>\u003cem>명사\u003c/em>\u003cspan>글, 지문\u003c/span>\u003c/div>\u003cdiv>\u003cb>opposite\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>반대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>increase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>높이다, 증가시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fluency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유창함\u003c/span>\u003c/div>\u003cdiv>\u003cb>skip over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>건너뛰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interrupt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방해하다, 중단시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unimportant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요하지 않은\u003c/span>\u003c/div>\u003cdiv>\u003cb>detail\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세부사항\u003c/span>\u003c/div>\u003cdiv>\u003cb>besides\u003c/b>\u003cem>부사\u003c/em>\u003cspan>게다가\u003c/span>\u003c/div>\u003cdiv>\u003cb>link\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>main idea\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>요지, 중심 생각\u003c/span>\u003c/div>\u003cdiv>\u003cb>progress\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전개되다, 진전되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>allow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~하게 해 주다, 허락하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>educated guess\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사려 깊은 추측, 짐작\u003c/span>\u003c/div>\u003cdiv>\u003cb>unfamiliar\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>익숙하지 않은, 잘 모르는\u003c/span>\u003c/div>\u003cdiv>\u003cb>skim\u003c/b>\u003cem>동사\u003c/em>\u003cspan>훑어보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pause\u003c/b>\u003cem>동사\u003c/em>\u003cspan>멈추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unknown\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>알려지지 않은, 모르는\u003c/span>\u003c/div>\u003cdiv>\u003cb>necessarily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>반드시\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚어 볼게요. have difficulty with는 어려움을 겪다, grasp는 파악하다, educated guess는 사려 깊은 추측이라는 뜻이에요. skim은 훑어보다, necessarily는 반드시라는 뜻이고요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">comprehension\u003c/b>\u003cspan class=\"m\">이해, 독해력\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">understanding\u003c/span>\u003cspan class=\"s\">grasp\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstanding\u003c/span>\u003cspan class=\"a\">confusion\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">grasp\u003c/b>\u003cspan class=\"m\">파악하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">understand\u003c/span>\u003cspan class=\"s\">seize\u003c/span>\u003cspan class=\"s\">catch\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">increase\u003c/b>\u003cspan class=\"m\">높이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">raise\u003c/span>\u003cspan class=\"s\">boost\u003c/span>\u003cspan class=\"s\">enhance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decrease\u003c/span>\u003cspan class=\"a\">reduce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">avoid\u003c/b>\u003cspan class=\"m\">피하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">evade\u003c/span>\u003cspan class=\"s\">escape\u003c/span>\u003cspan class=\"s\">dodge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">face\u003c/span>\u003cspan class=\"a\">confront\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">allow\u003c/b>\u003cspan class=\"m\">~하게 해 주다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">permit\u003c/span>\u003cspan class=\"s\">enable\u003c/span>\u003cspan class=\"s\">let\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forbid\u003c/span>\u003cspan class=\"a\">prevent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unfamiliar\u003c/b>\u003cspan class=\"m\">익숙하지 않은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unknown\u003c/span>\u003cspan class=\"s\">strange\u003c/span>\u003cspan class=\"s\">unusual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">familiar\u003c/span>\u003cspan class=\"a\">known\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unimportant\u003c/b>\u003cspan class=\"m\">중요하지 않은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trivial\u003c/span>\u003cspan class=\"s\">minor\u003c/span>\u003cspan class=\"s\">insignificant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">important\u003c/span>\u003cspan class=\"a\">essential\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어로 정리해 볼게요. comprehension은 understanding, grasp와 가깝고 반대는 misunderstanding이에요. increase는 raise, boost와 같고 반대는 decrease죠. avoid는 evade, escape와 통하고 반대는 face예요. unfamiliar는 unknown, strange와 같고 반대는 familiar이고요. 마지막으로 unimportant는 trivial, minor와 가깝고 반대는 essential입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 학생들이\u003c/span>\u003cspan class=\"en\">Many students\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어려움을 겪는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">difficulty \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독해에 (관해서)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">reading \u003c/span>\u003cspan class=\"tgt\">comprehension\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 학생들이 독해에 어려움을 겪는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독해에 어려움을 겪는 학생이 많다는 사실을 제시하며 글의 화제를 여는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. have difficulty with는 '~에 어려움을 겪다'라는 \u003cb class=\"key\">관용표현\u003c/b>으로 뒤에 어려움의 대상이 옵니다. reading comprehension은 '읽기 이해', 곧 \u003cb class=\"key\">독해\u003c/b>라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용표현(have difficulty with + 명사)\u003c/span> : 주어 + have difficulty + with + [명사/동명사] : \"~에 어려움을 겪다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 명사 수식\u003c/span> : [동명사 reading] + [명사 comprehension] = ~하는 것(명사) : \"독해(읽기 이해)\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Many students, 많은 학생들이. have difficulty, 어려움을 겪는다. with reading comprehension, 독해에 (관해서). 이 문장 전체를 해석하면, 많은 학생들이 독해에 어려움을 겪는다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 문장으로, 독해에 어려움을 겪는 학생이 많다는 걸 보여 주면서 화제를 여는 도입 문장이에요. have difficulty with는 어려움의 대상을 뒤에 붙이는 관용표현이고요, reading comprehension은 읽기 이해, 즉 독해라는 뜻이에요.","hl":"mn"},{"n":14,"text":"첫 번째로 have difficulty with는 ~에 어려움을 겪다라는 관용표현이에요. with 뒤에는 어려움의 대상이 명사로 와야 한다는 점을 꼭 기억하세요. 두 번째로 reading comprehension에서 reading은 읽기라는 동명사가 comprehension이라는 명사를 꾸며 주는 형태예요. 동명사가 명사 앞에 오면 명사를 수식한다고 이해하면 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 생각한다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지문을 천천히 살펴보아야 한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">through\u003c/span> a passage slowly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 단어를 따져가며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">studying \u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">word\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파악하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">grasp\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">글의 전체 의미를\u003c/span>\u003cspan class=\"en\">the full meaning of the text.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 글의 전체 의미를 파악하기 위해 모든 단어를 따져가며 지문을 천천히 살펴보아야 한다고 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 학생들이 품고 있는 잘못된 \u003cb class=\"key\">고정관념\u003c/b>을 설명하는 문장이에요. 모든 단어를 하나하나 따져야만 전체 의미를 알 수 있다는 부담을 feel that으로 표현했죠. studying every word는 '모든 단어를 따져가며'라는 \u003cb class=\"key\">분사구문\u003c/b>이고, in order to는 목적을 나타내는 \u003cb class=\"key\">to부정사\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 목적어절\u003c/span> : feel + [that + 주어 + 동사 ~] : \"~라고 생각하다, ~라고 느끼다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문(동시·부대상황)\u003c/span> : [주어 + 동사] , [동사원형-ing ~] (주어가 능동으로 ~하면서) : \"모든 단어를 따져가며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : in order to + [동사원형] = ~하기 위해 : \"파악하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They feel, 그들은 생각한다. that they must go through a passage slowly, 지문을 천천히 살펴보아야 한다고. studying every word, 모든 단어를 따져가며. in order to grasp, 파악하기 위해. the full meaning of the text, 글의 전체 의미를. 이 문장 전체를 해석하면, 그들은 글의 전체 의미를 파악하기 위해 모든 단어를 따져가며 지문을 천천히 살펴보아야 한다고 생각한다.","hl":"m"},{"n":16,"text":"학생들이 가지고 있는 고정관념을 설명하는 문장이에요. 모든 단어를 하나하나 따져야 전체 의미를 알 수 있다고 feel, 즉 생각한다는 거죠. 실제로는 그 반대라는 걸 바로 다음 문장에서 뒤집어 줄 거예요.","hl":"mn"},{"n":17,"text":"먼저 feel 뒤에 that절이 와서 ~라고 생각하다라는 목적어 역할을 하고 있어요. 그다음 studying every word는 주어 They가 능동으로 하면서라는 뜻을 더해 주는 분사구문이에요. 마지막으로 in order to grasp는 ~하기 위해라는 목적을 나타내는 to부정사의 부사적 용법이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 반대가 맞다\u003c/span>\u003cspan class=\"en\">the opposite is true:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨리 읽는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Reading \u003c/span>\u003cspan class=\"tgt\">quickly\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 높이도록 도울 수 있다\u003c/span>\u003cspan class=\"en\">can \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">increase\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 유창함과 이해를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">fluency \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">comprehension\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그 반대가 맞다. 빨리 읽는 것이 유창함과 이해를 높이는데 도움이 될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> However로 앞의 통념을 정면으로 뒤집으며, 빨리 읽기가 오히려 \u003cb class=\"key\">유창함\u003c/b>과 이해를 높인다는 이 글의 \u003cb class=\"key\">주제문\u003c/b>이에요. 콜론은 뒤에 나오는 내용이 앞 내용을 구체적으로 풀어 준다는 표시예요. 동명사 주어 Reading quickly 뒤에는 단수 동사 can이 온다는 점도 기억하세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [동명사구 Reading quickly] + [단수 동사] : \"빨리 읽는 것(은)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">help + 목적어 + to부정사(5형식)\u003c/span> : help + [목적어 you] + [to + 동사원형 increase] : \"당신이 높이도록 돕다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬구조(and)\u003c/span> : [명사 A fluency] + and + [명사 B comprehension] : \"당신의 유창함과 이해(력)\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"However, 하지만. the opposite is true, 그 반대가 맞다. Reading quickly, 빨리 읽는 것은. can help you to increase, 당신이 높이도록 도울 수 있다. your fluency and comprehension, 당신의 유창함과 이해를. 이 문장 전체를 해석하면, 하지만 그 반대가 맞다. 빨리 읽는 것이 유창함과 이해를 높이는데 도움이 될 수 있다.","hl":"m"},{"n":19,"text":"However로 앞의 통념을 정면으로 뒤집으면서, 빨리 읽기가 오히려 유창함과 이해를 높인다는 이 글의 주제문이에요. 콜론 뒤에는 앞 내용을 구체적으로 풀어 주는 말이 이어진다고 보면 됩니다.","hl":"mn"},{"n":20,"text":"첫 번째로 Reading quickly를 보면 reading이 동명사로 주어가 되었고, 그래서 뒤에 단수 동사 can이 온 거예요. 두 번째로 help you to increase는 help 다음에 목적어와 to부정사가 오는 오 형식 구조로, 당신이 높이도록 돕는다는 뜻이 됩니다. 세 번째로 your fluency and comprehension은 and로 두 명사를 나란히 연결한 병렬구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모르는 단어들은 건너뜀으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">skipping \u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">words \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 피할 수 있다\u003c/span>\u003cspan class=\"en\">you can \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">avoid \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방해받는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">getting \u003c/span>\u003cspan class=\"tgt\">interrupted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사소하고 중요하지 않은 세부사항들에 의해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">small, \u003c/span>\u003cspan class=\"tgt\">unimportant \u003c/span>\u003cspan class=\"tgt\">details\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모르는 단어는 건너뜀으로써 사소하고 중요하지 않은 세부사항들에 의해 (전체적인 내용 이해에) 방해받는 것을 피할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 '빨리 읽어라'라고 한 주장을 실행하는 구체적인 방법을 제시하는 문장입니다. 핵심은 \u003cb class=\"key\">모르는 \u003c/b>\u003cb class=\"key\">단어\u003c/b>에 붙잡히지 말라는 것으로, 사소한 세부사항이 \u003cb class=\"key\">이해의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>을 끊지 않게 하라는 뜻이죠. by ~ing가 '~함으로써'라는 \u003cb class=\"key\">수단\u003c/b>을 나타낸다는 점도 함께 기억하세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : by + [[동명사]] (~함으로써) : \"모르는 단어들을 건너뜀으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사 the words] + [관계대명사 생략] + [주어 you + 동사 don't know] : \"당신이 모르는 단어들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사 목적어(avoid + ~ing)\u003c/span> : avoid + [[동명사]](getting) : \"방해받는 것을 피하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">get + 과거분사(수동 의미)\u003c/span> : get + [[과거분사]] + by 행위자 : \"사소하고 중요하지 않은 세부사항들에 의해 방해받는 것\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"By skipping over the words you don't know, 모르는 단어들은 건너뜀으로써. you can avoid, 당신은 피할 수 있다. getting interrupted, 방해받는 것을. by small, unimportant details, 사소하고 중요하지 않은 세부사항들에 의해. 이 문장 전체를 해석하면, 모르는 단어는 건너뜀으로써 사소하고 중요하지 않은 세부사항들에 의해 (전체적인 내용 이해에) 방해받는 것을 피할 수 있다.","hl":"m"},{"n":22,"text":"이 문장은 빨리 읽는 구체적인 방법을 알려 주고 있어요. 모르는 단어에 붙잡히지 말고 과감히 건너뛰면, 사소한 세부사항 때문에 이해의 흐름이 끊기는 일을 피할 수 있다는 거죠. by skipping처럼 by 뒤에 동명사를 쓰면 '건너뜀으로써'라는 수단이 된답니다.","hl":"mn"},{"n":23,"text":"먼저 by skipping over the words를 보세요. 전치사 by 뒤에 동명사가 와서 '건너뜀으로써'라는 수단을 나타내요. 그다음 the words you don't know는 목적격 관계대명사가 생략되어 the words를 꾸미는 형용사절이에요. 세 번째로 avoid는 목적어로 동명사를 데려오는 동사라서 getting이 온 거고, 네 번째로 get 뒤에 과거분사 interrupted가 붙어서 수동의 의미, 즉 세부사항들에 의해 방해받는다는 뜻이 됩니다. by 뒤의 세부사항들은 행위자 역할을 한다는 것도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한\u003c/span>\u003cspan class=\"en\">Besides,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문장들을 연결해서 보는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">linking \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sentences\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요지가 어떻게 전개되고 있는가를 알기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">main \u003c/span>\u003cspan class=\"tgt\">idea \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">progressing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 ~할 수 있게 해 줄 것이다\u003c/span>\u003cspan class=\"en\">will \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">allow \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">짐작하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">educated \u003c/span>\u003cspan class=\"tgt\">guess\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘 모르는 단어들의 의미에 대해\u003c/span>\u003cspan class=\"en\">about the meaning of unfamiliar words.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한 요지가 어떻게 전개되고 있는가를 알기 위해 문장들을 연결해서 보는 것은, 잘 모르는 단어들의 의미를 짐작할 수 있게 해줄 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에 이유를 하나 더 보태는 문장으로, 문장들을 \u003cb class=\"key\">연결\u003c/b>해 읽는 것이 왜 도움이 되는지 설명합니다. 요지의 \u003cb class=\"key\">전개\u003c/b>를 따라가다 보면 잘 모르는 단어의 뜻도 \u003cb class=\"key\">짐작\u003c/b>할 수 있게 된다는 것이죠. 문장 앞부분의 동명사구가 주어라는 점이 해석의 열쇠입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [[동명사]]구 + [단수 동사 will allow] : \"문장들을 연결해서 보는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + [[동사원형]] (~하기 위해) : \"요지가 어떻게 전개되는지 알기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사 how + [주어 the main idea] + [동사 is progressing] : \"요지가 어떻게 전개되고 있는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">allow + 목적어 + to부정사\u003c/span> : allow + [[목적어]] + to + 동사원형 : \"당신이 짐작하게 해 주다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Besides, 또한. linking the sentences, 문장들을 연결해서 보는 것은. to see how the main idea is progressing, 요지가 어떻게 전개되고 있는가를 알기 위해. will allow you, 당신이 ~할 수 있게 해 줄 것이다. to make an educated guess, 짐작하는 것을. about the meaning of unfamiliar words, 잘 모르는 단어들의 의미에 대해. 이 문장 전체를 해석하면, 또한 요지가 어떻게 전개되고 있는가를 알기 위해 문장들을 연결해서 보는 것은, 잘 모르는 단어들의 의미를 짐작할 수 있게 해줄 것이다.","hl":"m"},{"n":25,"text":"이 문장은 문장들을 연결해서 읽는 것이 왜 유익한지 말해 줍니다. 요지의 전개를 따라가며 읽으면, 잘 모르는 단어의 뜻도 문맥 덕분에 짐작할 수 있게 된다는 거예요. 그래서 모르는 단어가 나와도 전체 흐름을 놓치지 말라는 조언으로 이어집니다.","hl":"mn"},{"n":26,"text":"먼저 linking the sentences를 보면 동명사구가 문장의 주어로 나왔고, 그 주어를 받는 동사는 단수로 will allow가 됩니다. 두 번째로 to see는 '알기 위해'라는 목적을 나타내는 to부정사구예요. 세 번째로 how the main idea is progressing은 see의 목적어가 된 간접의문문으로, 의문사 다음에 주어와 동사 순서가 온다는 점을 꼭 기억하세요. 마지막으로 allow you to make는 allow 뒤에 목적어, 그리고 목적격보어로 to부정사가 오는 구조랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음번에 글을 읽을 때는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">read\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지문을 빠르게 훑어보도록 하라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">try \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">skim \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">passage\u003c/span> quickly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모르는 단어에서 멈추지 말고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">pausing \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">unknown \u003c/span>\u003cspan class=\"tgt\">words\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다음번에 글을 읽을 때는 모르는 단어에서 멈추지 말고 지문을 빠르게 훑어보도록 하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지금까지의 조언을 독자에게 \u003cb class=\"key\">명령\u003c/b>으로 정리하는 마무리 문장입니다. 모르는 단어에서 \u003cb class=\"key\">멈추지\u003c/b> 말고 빠르게 훑어보라고 \u003cb class=\"key\">지시\u003c/b>하는 것이죠. 세부사항을 다 몰라도 이해할 수 있다는 다음 문장의 예고 역할도 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 the next time(시간 부사절)\u003c/span> : the next time + [주어 you] + [동사 read] : \"다음번에 글을 읽을 때는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">try + to부정사(목적어)\u003c/span> : try + [[to부정사]] : \"지문을 훑어보도록 해 보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 without + 동명사\u003c/span> : without + [[동명사]] (~하지 않고) : \"모르는 단어에서 멈추지 않고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">과거분사 형용사\u003c/span> : unknown([[과거분사]]) + [명사 words] : \"모르는 단어들\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The next time you read, 다음번에 글을 읽을 때는. try to skim the passage quickly, 지문을 빠르게 훑어보도록 하라. without pausing at unknown words, 모르는 단어에서 멈추지 말고. 이 문장 전체를 해석하면, 다음번에 글을 읽을 때는 모르는 단어에서 멈추지 말고 지문을 빠르게 훑어보도록 하라.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 말한 조언을 독자에게 명령으로 정리해 주는 문장이에요. 모르는 단어에서 멈추지 말고 빠르게 훑어보라고 지시하고 있죠. 그래서 세부사항을 다 알지 못해도 이해할 수 있다는 다음 문장으로 자연스럽게 이어진답니다.","hl":"mn"},{"n":29,"text":"먼저 The next time you read에서 the next time은 '~할 때'라는 접속사 역할을 해서 시간 부사절을 이끌어요. 두 번째로 try to skim은 try 뒤에 to부정사가 온 구조로 '훑어보려고 해 보다'라는 뜻이고, 명령문이라 '훑어보도록 하라'가 됩니다. 세 번째로 without pausing은 전치사 without 뒤에 동명사가 와서 '멈추지 않고'라는 부대상황을 만들어요. 마지막으로 unknown words의 unknown은 과거분사가 명사 words를 꾸미는 형태라는 것도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 알게 될 것이다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">find\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 그것을 이해할 수 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">understand \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반드시 세부사항을 다 알지 않고도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">necessarily \u003c/span>\u003cspan class=\"tgt\">knowing\u003c/span> all the details.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">세부사항을 꼭 다 알지 않고도 글을 이해할 수 있다는 것을 알게 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 마지막 문장으로, 앞에서 권한 '모르는 단어에서 멈추지 말고 빠르게 훑어보기'를 실천하면 어떤 결과가 생기는지 \u003cb class=\"key\">예상\u003c/b>하며 글을 맺고 있어요. 세부사항을 다 알지 않아도 이해할 수 있다는 \u003cb class=\"key\">결론\u003c/b>을 제시해 독자가 느끼는 부담을 없애 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 should의 예상·기대 용법\u003c/span> : You [should] + [find] + that절 (should + 동사원형) : \"당신은 ~라는 것을 알게 될 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : find + [that] + 주어 + 동사 ~ (that절 = find의 목적어) : \"당신이 그것을 이해할 수 있다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 without + 동명사(부정)\u003c/span> : without + [knowing] (전치사 + 동명사 ~ing) : \"반드시 ~하지는 않고도\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"You should find, 당신은 알게 될 것이다. that you are able to understand it, 당신이 그것을 이해할 수 있다는 것을. without necessarily knowing all the details, 반드시 세부사항을 다 알지 않고도. 이 문장 전체를 해석하면, 세부사항을 꼭 다 알지 않고도 글을 이해할 수 있다는 것을 알게 될 것이다.","hl":"m"},{"n":31,"text":"이 문장은 글의 마지막 문장이에요. 앞에서 권한 대로 모르는 단어에서 멈추지 말고 빠르게 훑어보면 어떤 일이 생길지 예상하면서 글을 맺고 있죠. 세부사항을 꼭 다 알지 않아도 충분히 이해할 수 있다는 결론을 전해 주는 문장이에요.","hl":"mn"},{"n":32,"text":"첫 번째, should는 의무가 아니라 예상의 뜻이에요. 그래서 '당신은 ~하게 될 거예요'라고 미래의 기대를 부드럽게 말해 주죠. 두 번째, find 뒤에 나오는 that은 접속사예요. 뒤에 완전한 절이 와서 통째로 find의 목적어 역할을 한답니다. 세 번째, without은 전치사라서 뒤에 동사가 그대로 올 수 없어요. 그래서 knowing이라는 동명사로 바꿔서 '~하지 않고도'라는 부정의 뜻을 만들어 주는 거예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>많은 학생들은 글의 \u003cb class=\"key\">전체 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 파악하려면 모든 단어를 따져가며 \u003cb class=\"key\">천천히\u003c/b> 읽어야 한다고 생각한다.\u003c/li>\u003cli>그러나 빨리 읽는 것이 \u003cb class=\"key\">유창함\u003c/b>과 이해를 높이는 데 도움이 될 수 있다.\u003c/li>\u003cli>모르는 단어는 \u003cb class=\"key\">건너뛰고\u003c/b> 문장들을 연결해 보면 \u003cb class=\"key\">educated \u003c/b>\u003cb class=\"key\">guess\u003c/b>로 그 의미를 짐작할 수 있다.\u003c/li>\u003cli>다음번에 글을 읽을 때 모르는 단어에서 \u003cb class=\"key\">멈추지\u003c/b> 말고 빠르게 훑어보면 세부사항을 다 알지 않고도 이해할 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Reading quickly and skipping over unknown words can increase your fluency and comprehension, unlike slow, word-by-word reading.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">많은 학생들은 글의 전체 의미를 파악하려면 모든 단어를 따져가며 천천히 읽어야 한다고 생각하지만, 오히려 \u003cb class=\"key\">빨리 \u003c/b>\u003cb class=\"key\">읽기\u003c/b>가 \u003cb class=\"key\">유창함\u003c/b>과 이해를 높인다. 모르는 단어는 건너뛰고 문장들을 연결해 보면 사소한 세부사항에 방해받지 않고 \u003cb class=\"key\">짐작\u003c/b>으로 전체 의미를 파악할 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글의 핵심은 하나예요. 모든 단어를 다 알아야 이해하는 것이 아니라, 빠르게 읽으며 흐름을 잡아야 이해가 된다는 것이죠. 다음에 지문을 만나면 모르는 단어에서 멈추지 말고 시원하게 훑어보세요. 그 습관이 유창함과 이해력을 함께 키워 줄 거예요. 오늘도 수고 많았습니다.","hl":null}]}]});</script></body></html>
