ry word)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02빠른 읽기의 장점</div><ul><li>빠르게 읽는 것은 글의 유창성과 전체적인 이해도를 높이는 데 도움을 줍니다.</li><li>글의 흐름을 놓치지 않음</li><li>중요하지 않은 세부 사항에 얽매이지 않음</li><li>핵심 키워드: 유창성(fluency), 이해력(comprehension)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03맥락을 통한 추론</div><ul><li>모르는 단어가 나와도 멈추지 않고 문장을 연결하면 의미를 추측할 수 있습니다.</li><li>문장 간의 연결성 파악</li><li>모르는 단어의 의미를 교육적 추측으로 해결</li><li>핵심 키워드: 추측(educated guess), 맥락(context)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실천적 학습법</div><ul><li>모르는 단어에 멈추지 말고 지문을 훑어 읽는 연습을 시작해야 합니다.</li><li>모르는 단어에서 멈추지 않기 (without pausing)</li><li>전체를 빠르게 훑기 (skim)</li><li>핵심 키워드: 훑어 읽기(skimming), 실천(try)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">difficulty</td><td class=\"m\">어려움</td></tr><tr><td class=\"w\">reading comprehension</td><td class=\"m\">독해(력)</td></tr><tr><td class=\"w\">go through</td><td class=\"m\">~을 살펴보다, ~을 읽다</td></tr><tr><td class=\"w\">passage</td><td class=\"m\">(글의) 구절, 단락</td></tr><tr><td class=\"w\">grasp</td><td class=\"m\">이해하다, 파악하다</td></tr><tr><td class=\"w\">opposite</td><td class=\"m\">정반대의</td></tr><tr><td class=\"w\">fluency</td><td class=\"m\">유창성</td></tr><tr><td class=\"w\">skip</td><td class=\"m\">건너뛰다</td></tr><tr><td class=\"w\">interrupt</td><td class=\"m\">방해하다, 중단시키다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unimportant</td><td class=\"m\">중요하지 않은</td></tr><tr><td class=\"w\">detail</td><td class=\"m\">세부 사항</td></tr><tr><td class=\"w\">besides</td><td class=\"m\">게다가, 더욱이</td></tr><tr><td class=\"w\">link</td><td class=\"m\">연결하다</td></tr><tr><td class=\"w\">progress</td><td class=\"m\">진행되다</td></tr><tr><td class=\"w\">educated guess</td><td class=\"m\">(지식을 바탕으로 한) 추측</td></tr><tr><td class=\"w\">unfamiliar</td><td class=\"m\">낯선</td></tr><tr><td class=\"w\">skim</td><td class=\"m\">훑어 읽다</td></tr><tr><td class=\"w\">pause</td><td class=\"m\">잠시 멈추다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 학생들이</span><span class=\"en\"><b>Many students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어려움을 겪는다.</span><span class=\"en\"><b>have difficulty</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독해에</span><span class=\"en\"><b>with <span class=\"grammar-hl\">reading</span> comprehension.</b></span></div></div><div class=\"lec-sent-ko\">많은 학생들이 독해에 어려움을 겪는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 독해를 어려워하는 학생들의 일반적인 상황을 제시하며, 이후에 나올 해결책을 위한 문제 상황을 설정하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reading (동명사): 전치사 with의 목적어 자리에 위치하여 &#39;읽기&#39;라는 행위를 나타내는 명사적 용법으로 쓰임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">difficulty</td><td class=\"m\">어려움</td></tr><tr><td class=\"w\">reading comprehension</td><td class=\"m\">독해(력)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 생각한다</span><span class=\"en\"><b>They feel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지문을 천천히 살펴보아야 한다고</span><span class=\"en\"><b>that they must go through a passage slowly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 단어를 따져가며</span><span class=\"en\"><b><span class=\"grammar-hl\">studying</span> every word</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">글의 전체 의미를 파악하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">in order to grasp</span> the full meaning of the text.</b></span></div></div><div class=\"lec-sent-ko\">그들은 글의 전체 의미를 파악하기 위해 모든 단어를 따져가며 지문을 천천히 살펴보아야 한다고 생각한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 go through는 사전적으로 &#39;통과하다&#39;인데, 여기서는 &#39;글을 끝까지 읽어 내려가다&#39;라는 뜻입니다. 학생들이 독해를 위해 단어 하나하나에 집착하는 잘못된 학습 방식을 강조하려고 이 구동사를 골랐습니다. 앞 문장의 &#39;어려움&#39;이 구체적으로 어떤 행동에서 비롯되는지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">studying (현재분사): 분사구문으로 쓰임. 원래 절은 &#39;as they study every word&#39;이며, 문장의 주절과 동시동작 또는 부수적인 상황을 설명함.</div><div class=\"lec-gr-item\">in order to grasp (to부정사): 부사적 용법(목적)으로, &#39;~하기 위해서&#39;라는 의미로 동작의 목적을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">go through</td><td class=\"m\">~을 살펴보다, ~을 읽다</td></tr><tr><td class=\"w\">passage</td><td class=\"m\">(글의) 구절, 단락</td></tr><tr><td class=\"w\">grasp</td><td class=\"m\">이해하다, 파악하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 반대가</span><span class=\"en\"><b><span class=\"grammar-hl\">the opposite</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맞다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is true</span>:</b></span></div></div><div class=\"lec-sent-ko\">(하지만 그 반대가 맞다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞에서 제시한 학생들의 생각(천천히 읽기)이 틀렸음을 지적하며, &#39;빨리 읽기&#39;라는 해결책을 제시하는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the opposite is true (관용표현): &#39;반대가 사실이다&#39;라는 뜻의 고정된 표현.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opposite</td><td class=\"m\">정반대의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빨리 읽는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">Reading quickly</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도움이 될 수 있다</span><span class=\"en\"><b>can <span class=\"grammar-hl\">help you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유창함과 이해를 높이는데</span><span class=\"en\"><b><span class=\"grammar-hl\">to increase</span> your fluency and comprehension.</b></span></div></div><div class=\"lec-sent-ko\">(빨리 읽는 것이 유창함과 이해를 높이는데 도움이 될 수 있다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> interrupted는 사전적으로 &#39;중단되다&#39;인데, 여기서는 읽기의 &#39;맥락이 끊기거나 집중력이 흐트러지는 것&#39;을 의미합니다. 모르는 단어 하나에 멈추는 것이 전체 이해를 방해한다는 점을 부각하기 위해 이 단어를 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Reading quickly (동명사): 문장의 주어 자리에 위치하여 &#39;빠르게 읽는 것&#39;이라는 명사적 역할을 함.</div><div class=\"lec-gr-item\">help you to increase 5형식(SVOC) 구조: help + O + to부정사 구조로, 목적어인 you가 to부정사하는 것을 돕는다는 의미. 목적보어로 to부정사가 쓰임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fluency</td><td class=\"m\">유창성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">단어는 건너뜀으로써</span><span class=\"en\"><b>By <span class=\"grammar-hl\">skipping</span> over the words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모르는</span><span class=\"en\"><b>you don’t know,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방해받는 것을 피할 수 있다</span><span class=\"en\"><b>you can avoid getting interrupted</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사소하고 중요하지 않은 세부사항들에 의해</span><span class=\"en\"><b>by small, <span class=\"grammar-hl\">unimportant</span> details.</b></span></div></div><div class=\"lec-sent-ko\">모르는 단어는 건너뜀으로써 사소하고 중요하지 않은 세부사항들에 의해 (전체적인 내용 이해에) 방해받는 것을 피할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> interrupted는 사전적으로 &#39;중단되다&#39;인데, 여기서는 읽기의 &#39;맥락이 끊기거나 집중력이 흐트러지는 것&#39;을 의미합니다. 모르는 단어 하나에 멈추는 것이 전체 이해를 방해한다는 점을 부각하기 위해 이 단어를 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">skipping (동명사): 전치사 By의 목적어 자리에 위치한 동명사로, 수단이나 방법을 나타냄.</div><div class=\"lec-gr-item\">unimportant (관용표현): un-(부정) + important(중요한)가 결합된 형용사로, 세부적인 것이 &#39;중요하지 않은&#39; 상태를 수식함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">skip</td><td class=\"m\">건너뛰다</td></tr><tr><td class=\"w\">interrupt</td><td class=\"m\">방해하다, 중단시키다</td></tr><tr><td class=\"w\">unimportant</td><td class=\"m\">중요하지 않은</td></tr><tr><td class=\"w\">detail</td><td class=\"m\">세부 사항</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한</span><span class=\"en\"><b>Besides,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문장들을 연결해서 보는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">linking</span> the sentences</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알기 위해</span><span class=\"en\"><b>to see</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">요지가 어떻게 전개되고 있는가를</span><span class=\"en\"><b>how the main idea is progressing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해줄 것이다 당신이 ~하게</span><span class=\"en\"><b><span class=\"grammar-hl\">will allow you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">짐작할 수 있게</span><span class=\"en\"><b><span class=\"grammar-hl\">to make</span> an educated guess</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘 모르는 단어들의 의미를</span><span class=\"en\"><b>about the meaning of unfamiliar words.</b></span></div></div><div class=\"lec-sent-ko\">또한 요지가 어떻게 전개되고 있는가를 알기 위해 문장들을 연결해서 보는 것은, 잘 모르는 단어들의 의미를 짐작할 수 있게 해줄 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞에서 &#39;단어를 건너뛰라&#39;는 조언에 이어, 오히려 그렇게 했을 때 얻게 되는 이점인 &#39;문맥 파악을 통한 단어 추론&#39;을 제시하며 논리를 보충합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">linking (동명사): 문장의 주어 역할을 하는 동명사구로, &#39;연결하는 것은&#39;이라는 명사적 의미를 지님.</div><div class=\"lec-gr-item\">will allow you to make 5형식(SVOC) 구조: allow + O + to부정사 형태. 주어가 목적어(you)가 to부정사(make an educated guess)하도록 허용/가능하게 한다는 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">besides</td><td class=\"m\">게다가, 더욱이</td></tr><tr><td class=\"w\">link</td><td class=\"m\">연결하다</td></tr><tr><td class=\"w\">progress</td><td class=\"m\">진행되다</td></tr><tr><td class=\"w\">educated guess</td><td class=\"m\">(지식을 바탕으로 한) 추측</td></tr><tr><td class=\"w\">unfamiliar</td><td class=\"m\">낯선</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음번에</span><span class=\"en\"><b>The next time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">글을 읽을 때는</span><span class=\"en\"><b>you read,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지문을 빠르게 훑어보도록 하라</span><span class=\"en\"><b>try <span class=\"grammar-hl\">to skim</span> the passage quickly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멈추지 말고</span><span class=\"en\"><b>without pausing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모르는 단어에서</span><span class=\"en\"><b>at unknown words.</b></span></div></div><div class=\"lec-sent-ko\">다음번에 글을 읽을 때는 모르는 단어에서 멈추지 말고 지문을 빠르게 훑어보도록 하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> skim은 &#39;우유의 걷어낸 거품&#39;에서 유래해 &#39;대충 훑어보다&#39;라는 뜻이 되었습니다. 세부 단어보다는 글 전체의 흐름을 빠르게 파악하라는 전략을 강조하기 위해 이 단어를 사용했습니다. 앞선 근거들을 바탕으로 독자에게 구체적인 실천 행동을 제안합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to skim (to부정사): 명령문에서 try의 목적어로 쓰인 명사적 용법.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">passage</td><td class=\"m\">(글의) 구절, 단락</td></tr><tr><td class=\"w\">skim</td><td class=\"m\">훑어 읽다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">알게 될 것이다</span><span class=\"en\"><b>You should find</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">글을 이해할 수 있다는 것을</span><span class=\"en\"><b>that you <span class=\"grammar-hl\">are able to understand</span> it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세부사항을 꼭 다 알지 않고도</span><span class=\"en\"><b>without necessarily knowing all the details.</b></span></div></div><div class=\"lec-sent-ko\">세부사항을 꼭 다 알지 않고도 글을 이해할 수 있다는 것을 알게 될 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론으로, 독해의 핵심이 &#39;단어 암기&#39;가 아닌 &#39;전체적인 이해&#39;에 있음을 다시 한번 강조하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are able to understand (to부정사): 형용사 able의 의미를 보충하는 부사적 용법(형용사 수식)으로 쓰임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">detail</td><td class=\"m\">세부 사항</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>많은 학생이 모든 단어를 완벽히 알아야 글을 이해할 수 있다고 생각한다.</li><li>하지만 단어 하나에 집착하며 천천히 읽는 것은 오히려 독해의 흐름을 방해한다.</li><li>모르는 단어를 건너뛰고 빠르게 읽으면 오히려 문맥을 통해 내용을 더 잘 이해할 수 있다.</li><li>결국 독해력 향상을 위해서는 전체적인 흐름을 파악하는 &#39;훑어 읽기(skim)&#39;가 중요하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Quick reading improves comprehension by focusing on the main idea, and it allows readers to infer the meaning of unknown words through context.</div>\n              <div class=\"lec-final-sum-ko\">속독은 중심 내용에 집중하게 하여 이해력을 높여주며, 문맥을 통해 모르는 단어의 의미를 추론할 수 있게 한다.</div></div></div>"],"segs":[[{"audio":"./passage1_audio/1.mp3","hl":null}],[{"audio":"./passage1_audio/2.mp3","hl":null}],[{"audio":"./passage1_audio/3.mp3","hl":null},{"audio":"./passage1_audio/4.mp3","hl":"stage-0"},{"audio":"./passage1_audio/5.mp3","hl":"stage-1"},{"audio":"./passage1_audio/6.mp3","hl":"stage-2"},{"audio":"./passage1_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage1_audio/8.mp3","hl":null}],[{"audio":"./passage1_audio/9.mp3","hl":"main"},{"audio":"./passage1_audio/10.mp3","hl":"meaning"},{"audio":"./passage1_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/12.mp3","hl":"main"},{"audio":"./passage1_audio/13.mp3","hl":"meaning"},{"audio":"./passage1_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/15.mp3","hl":"main"},{"audio":"./passage1_audio/16.mp3","hl":"meaning"},{"audio":"./passage1_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/18.mp3","hl":"main"},{"audio":"./passage1_audio/19.mp3","hl":"meaning"},{"audio":"./passage1_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage1
