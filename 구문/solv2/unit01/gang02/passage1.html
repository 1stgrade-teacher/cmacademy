</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2강 reading1","audioDir":"passage1_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">2강\u003cbr>1번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Not Descended From Us\u003c/h1>\u003ch2>우리 자손은 아니다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">코코넛\u003c/b> 나무 위 원숭이들이 인간이 자신들의 자손이라는 소문을 반박하며, 가족을 버리고 \u003cb class=\"key\">독점\u003c/b>과 \u003cb class=\"key\">폭력\u003c/b>을 일삼는 인간은 원숭이의 후손이 아니라고 결론 내린다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Although man may have descended, he did not descend from monkeys, whose moral conduct he fails to match.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"자, 오늘 함께 읽을 지문은 코코넛 나무 위에서 벌어지는 원숭이들의 대화예요. 세 마리 원숭이가 인간에 대한 아주 흥미로운 소문을 꺼내죠. 내용은 간단해요. 인간이 자신들의 고귀한 종족에서 진화했다는 소문을 원숭이가 정면으로 반박하는 이야기예요. 오늘 이 글의 요지는 인간은 진화했지만 결코 원숭이의 자손은 아니라는 것, 함께 확인해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글은 찰스 다윈(Charles Darwin)의 \u003cb class=\"key\">진화론\u003c/b>(evolution)을 소재로 한 짧은 풍자시(satire)예요. 과학적으로 인간과 원숭이는 영장류(primate)라는 공통 조상에서 갈라져 나온 먼 친척 관계로 설명됩니다. 그런데 이 시는 그런 과학적 논쟁을 하려는 것이 아니라, 원숭이의 입을 빌려 인간의 \u003cb class=\"key\">도덕성\u003c/b>을 비판하는 데 초점을 두죠. 예를 들어 가족을 버리거나 재산을 독점하고 폭력을 쓰는 모습을 보면, 마치 이웃에게 울타리를 치고 혼자만 음식을 쌓아 두는 사람을 떠올리게 됩니다. 즉 화자는 '인간은 진화했지만 원숭이보다 나은 존재인가'라는 질문을 던지고 있는 거예요. 이런 \u003cb class=\"key\">풍자\u003c/b> 글에서는 주장의 방향이 마지막에 뒤집히는 경우가 많으니 결론 문장을 특히 주의해서 읽어야 합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 이 글은 다윈의 진화론을 소재로 한 짧은 풍자시예요. 과학적으로 인간과 원숭이는 영장류라는 공통 조상에서 갈라져 나온 먼 친척이라고 설명하죠. 그런데 이 시는 과학 이야기를 하려는 게 아니라 원숭이의 입을 빌려 인간의 도덕성을 비판하려고 해요. 가족을 버리고 재산을 혼자 독점하고 폭력을 쓰는 모습을 보면, 이웃에게 울타리를 치고 음식을 혼자 쌓아 두는 사람이 떠오르잖아요. 그래서 이 글은 인간은 진화했지만 원숭이보다 나은 존재인가라는 질문을 던지는 풍자로 읽어야 해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>나무 위의 대화\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">코코넛\u003c/b> 나무 위에 원숭이 세 마리가 앉아 이야기를 나누는 장면으로 글은 시작해요. 이 가운데 한 원숭이가 다른 원숭이들에게 '들어봐'라고 말하며 화제를 꺼내죠. 평범한 \u003cb class=\"key\">대화\u003c/b> 장면 같지만, 곧 이어질 무거운 주장을 예고하는 \u003cb class=\"key\">도입\u003c/b>부예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>뜻밖의 소문\u003csmall>통념 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>인간이 고귀한 우리 \u003cb class=\"key\">종족\u003c/b>의 자손이라는 소문이 있다는 것을 말해요. 믿기 힘든 \u003cb class=\"key\">소문\u003c/b>이라는 점을 강조하면서도, 그 생각만 해도 \u003cb class=\"key\">창피\u003c/b>하다고 규정하죠. 이 대목에서 인간에 대한 원숭이의 부정적 시각이 분명히 드러나요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>가족을 버리지 않는 원숭이\u003csmall>근거 · 문장 5\u003c/small>\u003c/h4>\u003cp>어느 원숭이도 \u003cb class=\"key\">가족\u003c/b>을 버리고 자식을 굶주리게 하거나 그들의 삶을 망친 적이 없다고 말해요. 즉 가족을 지키는 것이 원숭이의 \u003cb class=\"key\">도리\u003c/b>라는 뜻이죠. 인간에 대한 반박의 첫 \u003cb class=\"key\">근거\u003c/b>가 가족 사랑이라는 점이 핵심이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>울타리와 나눔\u003csmall>예시 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>코코넛 나무에 \u003cb class=\"key\">울타리\u003c/b>를 치고 열매를 낭비하며 다른 원숭이들이 먹지 못하게 하는 원숭이는 절대 볼 수 없다고 해요. 이어서 자신이 울타리를 치면 오히려 \u003cb class=\"key\">굶주림\u003c/b> 때문에 다른 원숭이들이 훔칠 수밖에 없을 것이라고 덧붙이죠. 소유와 \u003cb class=\"key\">독점\u003c/b>이 얼마나 부자연스러운지 보여 주는 대목이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>인간은 우리 후손이 아니다\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>밤에 나가 \u003cb class=\"key\">사고\u003c/b>를 치고 총이나 곤봉, 칼로 다른 원숭이의 목숨을 빼앗는 일은 원숭이가 하지 않는다고 말해요. 폭력으로 생명을 해치는 것이야말로 인간만의 행동이라는 \u003cb class=\"key\">반례\u003c/b>인 셈이죠. 마지막 문장에서 인간은 진화했지만 우리 \u003cb class=\"key\">자손\u003c/b>은 아니라고 선을 그으며 결론을 맺어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"글은 코코넛 나무 위에 원숭이 세 마리가 앉아 이야기를 나누는 장면으로 시작해요. 그중 한 원숭이가 다른 원숭이들에게 들어보라고 말하면서 화제를 꺼내죠. 평범한 대화 장면 같지만, 곧 나올 무거운 주장을 예고하는 도입부예요.","hl":"f0"},{"n":5,"text":"이어서 인간이 고귀한 우리 종족의 자손이라는 소문이 있다고 말해요. 믿기 힘든 소문이라고 하면서, 그 생각만 해도 창피하다고 딱 잘라 말하죠. 여기서 인간에 대한 원숭이의 부정적인 시각이 확실히 드러나요.","hl":"f1"},{"n":6,"text":"첫 번째 근거는 가족이에요. 어느 원숭이도 가족을 버리고 자식을 굶주리게 하거나 그들의 삶을 망친 적이 없다고 해요. 가족을 지키는 것이 원숭이의 도리라는 걸 보여 주는 반박의 첫 근거죠.","hl":"f2"},{"n":7,"text":"두 번째 근거는 나눔이에요. 코코넛 나무에 울타리를 치고 열매를 낭비하면서 다른 원숭이들이 먹지 못하게 하는 원숭이는 절대 볼 수 없다고 해요. 그리고 자신이 울타리를 치면 오히려 굶주림 때문에 다른 원숭이들이 훔칠 수밖에 없을 거라고 덧붙이죠. 독점이 얼마나 부자연스러운지 보여 주는 대목이에요.","hl":"f3"},{"n":8,"text":"마지막 근거는 생명이에요. 밤에 나가 사고를 치고 총이나 곤봉, 칼로 다른 원숭이의 목숨을 빼앗는 일은 원숭이가 하지 않는다고 말해요. 그리고 마지막에 인간은 진화했지만 우리 자손은 아니라고 선을 그으며 결론을 맺죠. 여기가 이 글의 주제문이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 인간이 원숭이의 후손이라는 \u003cb class=\"key\">통념\u003c/b>을 먼저 꺼낸 뒤, 가족·나눔·생명이라는 세 가지 기준으로 \u003cb class=\"key\">반박\u003c/b>해요. 부정 표현을 반복하며 근거를 차곡차곡 쌓아 가다가 마지막 문장에서 '인간은 진화했지만 우리 자손은 아니다'라는 \u003cb class=\"key\">주제문\u003c/b>이 나오죠. 그래서 결론이 글 끝에 놓인 \u003cb class=\"key\">미괄식\u003c/b> 구조예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Now, listen (2)\u003c/b>\u003cspan>주의 환기\u003c/span>\u003cb>There's a rumor that (3)\u003c/b>\u003cspan>통념 제시\u003c/span>\u003cb>That very idea is a disgrace (4)\u003c/b>\u003cspan>평가·반박\u003c/span>\u003cb>And another thing you will never see (6)\u003c/b>\u003cspan>근거 추가\u003c/span>\u003cb>Here's another thing (8)\u003c/b>\u003cspan>근거 추가\u003c/span>\u003cb>but (9)\u003c/b>\u003cspan>반전·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">descended from our noble race\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">man descended\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">didn't descend from us\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>원숭이 (Monkeys)\u003c/th>\u003cth>인간 (Man)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>가족을 버리지 않음\u003c/td>\u003ctd>가족을 버리고 자식을 굶김\u003c/td>\u003c/tr>\u003ctr>\u003ctd>코코넛을 함께 나눠 먹음\u003c/td>\u003ctd>울타리로 독점하고 낭비함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>무기로 목숨을 빼앗지 않음\u003c/td>\u003ctd>총·곤봉·칼로 목숨을 빼앗음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 통념을 먼저 꺼내고 그것을 반박하는 방식으로 전개돼요. 인간이 원숭이의 후손이라는 소문을 제시한 뒤, 가족과 나눔과 생명이라는 세 가지 기준으로 차근차근 반박하죠. 결정적인 주제문은 맨 마지막 문장에 나오기 때문에 이 글은 미괄식 구조예요.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. 들어보라는 말로 주의를 끌고, 소문이 있다는 표현으로 통념을 꺼내죠. 그리고 창피하다는 평가가 바로 반박의 신호이고, 또 한 가지라는 표현이 두 번 반복되면서 근거가 계속 추가돼요. 마지막 but 절에서 화자의 진짜 주장이 나온다는 점도 놓치지 마세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>sit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>앉다\u003c/span>\u003c/div>\u003cdiv>\u003cb>coconut\u003c/b>\u003cem>명사\u003c/em>\u003cspan>코코넛\u003c/span>\u003c/div>\u003cdiv>\u003cb>talk\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이야기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>listen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>듣다, 귀 기울이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rumor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소문\u003c/span>\u003c/div>\u003cdiv>\u003cb>hard to believe\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>믿기 어려운\u003c/span>\u003c/div>\u003cdiv>\u003cb>descend from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 자손이다, ~로부터 진화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>noble\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고귀한\u003c/span>\u003c/div>\u003cdiv>\u003cb>race\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종족, 인종\u003c/span>\u003c/div>\u003cdiv>\u003cb>very\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>바로 그, 정말로\u003c/span>\u003c/div>\u003cdiv>\u003cb>disgrace\u003c/b>\u003cem>명사\u003c/em>\u003cspan>창피, 수치\u003c/span>\u003c/div>\u003cdiv>\u003cb>desert\u003c/b>\u003cem>동사\u003c/em>\u003cspan>버리다, 떠나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>starve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>굶주리게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ruin\u003c/b>\u003cem>동사\u003c/em>\u003cspan>망치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>life\u003c/b>\u003cem>명사\u003c/em>\u003cspan>삶, 목숨\u003c/span>\u003c/div>\u003cdiv>\u003cb>another thing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>또 한 가지\u003c/span>\u003c/div>\u003cdiv>\u003cb>fence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>울타리\u003c/span>\u003c/div>\u003cdiv>\u003cb>go to waste\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>낭비되다, 쓰레기로 버려지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>forbid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>금지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>starvation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>굶주림\u003c/span>\u003c/div>\u003cdiv>\u003cb>force\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강요하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>steal\u003c/b>\u003cem>동사\u003c/em>\u003cspan>훔치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>get into trouble\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사고를 치다, 말썽을 부리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gun\u003c/b>\u003cem>명사\u003c/em>\u003cspan>총\u003c/span>\u003c/div>\u003cdiv>\u003cb>club\u003c/b>\u003cem>명사\u003c/em>\u003cspan>곤봉\u003c/span>\u003c/div>\u003cdiv>\u003cb>knife\u003c/b>\u003cem>명사\u003c/em>\u003cspan>칼\u003c/span>\u003c/div>\u003cdiv>\u003cb>take one's life\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>목숨을 빼앗다\u003c/span>\u003c/div>\u003cdiv>\u003cb>descend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>진화하다, 유래하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 짚고 갈게요. descend from은 어디서 유래했다는 뜻으로 쓰이고, noble은 고귀한이라는 뜻이에요. disgrace는 창피함, go to waste는 낭비되다, forbid는 금지하다로 정리해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">descend\u003c/b>\u003cspan class=\"m\">진화하다, 유래하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">originate\u003c/span>\u003cspan class=\"s\">derive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ascend\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">noble\u003c/b>\u003cspan class=\"m\">고귀한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">worthy\u003c/span>\u003cspan class=\"s\">dignified\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lowly\u003c/span>\u003cspan class=\"a\">vulgar\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disgrace\u003c/b>\u003cspan class=\"m\">창피, 수치\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shame\u003c/span>\u003cspan class=\"s\">dishonor\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">honor\u003c/span>\u003cspan class=\"a\">pride\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">desert\u003c/b>\u003cspan class=\"m\">버리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">abandon\u003c/span>\u003cspan class=\"s\">leave\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">retain\u003c/span>\u003cspan class=\"a\">protect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">starve\u003c/b>\u003cspan class=\"m\">굶주리게 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">famish\u003c/span>\u003cspan class=\"s\">go hungry\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">feed\u003c/span>\u003cspan class=\"a\">nourish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ruin\u003c/b>\u003cspan class=\"m\">망치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">destroy\u003c/span>\u003cspan class=\"s\">wreck\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">restore\u003c/span>\u003cspan class=\"a\">save\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">forbid\u003c/b>\u003cspan class=\"m\">금지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prohibit\u003c/span>\u003cspan class=\"s\">ban\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">allow\u003c/span>\u003cspan class=\"a\">permit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">waste\u003c/b>\u003cspan class=\"m\">낭비하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">squander\u003c/span>\u003cspan class=\"s\">misuse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">save\u003c/span>\u003cspan class=\"a\">conserve\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 볼게요. descend는 originate, derive와 가깝고 반대말은 ascend예요. noble은 worthy, dignified와 비슷하고 lowly가 반대말이죠. disgrace는 shame, dishonor와 같고 honor가 반대말이에요. forbid는 prohibit, ban과 같고 allow, permit이 반대고요. desert는 abandon, leave와 가깝고 starve는 feed, nourish와 반대 관계로 묶어 두면 좋아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원숭이 세 마리가\u003c/span>\u003cspan class=\"en\">Three monkeys\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">앉아 있었다\u003c/span>\u003cspan class=\"en\">sat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코코넛 나무에\u003c/span>\u003cspan class=\"en\">in a coconut tree\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이야기를 나누고 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">talking\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">원숭이 세 마리가 코코넛 나무에 앉아 이야기를 나누고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 \u003cb class=\"key\">배경\u003c/b>을 잡아 주는 도입 문장이에요. 원숭이 세 마리가 코코넛 나무에 앉아 이야기를 나누는 장면을 머릿속에 그려 두면 돼요. 앉아 있는 동작과 말하는 동작이 함께 일어나는 \u003cb class=\"key\">동시동작\u003c/b>이라는 점이 이 문장의 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 동시동작(부대상황)\u003c/span> : sat [자동사] + talking [현재분사 → 동시동작] : \"이야기를 나누면서\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Three monkeys, 원숭이 세 마리가. sat, 앉아 있었다. in a coconut tree, 코코넛 나무에. talking, 이야기를 나누고 있었다. 이 문장 전체를 해석하면, 원숭이 세 마리가 코코넛 나무에 앉아 이야기를 나누고 있었다.","hl":"m"},{"n":14,"text":"이 문장은 이야기의 배경을 잡아 주는 도입 문장이에요. 원숭이 세 마리가 코코넛 나무에 앉아서 이야기를 나누는 장면을 머릿속에 그려 두세요. 앉아 있는 동작과 말하는 동작이 같이 일어나는 동시동작이라는 점이 핵심이에요.","hl":"mn"},{"n":15,"text":"첫 번째 포인트는 talking이에요. 주어인 원숭이들이 앉아 있으면서 동시에 이야기를 나누고 있죠. 이렇게 앞 동작과 함께 일어나는 동시 상황은 동사 뒤에 현재분사를 붙여서 나타내요. 그리고 in a coconut tree처럼 나무 위에 있다는 표현에 전치사 in을 쓴다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원숭이 한 마리가\u003c/span>\u003cspan class=\"en\">One monkey\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 원숭이들에게 말했다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">others\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;자, 들어 봐.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">&quot;Now, \u003c/span>\u003cspan class=\"tgt\">listen.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">원숭이 한 마리가 다른 원숭이들에게 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 원숭이 한 마리가 무리를 향해 말문을 여는 장면이에요. 뒤에 붙은 Now, listen은 '자, 들어 봐'라며 상대의 \u003cb class=\"key\">주의\u003c/b>를 끄는 신호이고, 바로 다음 문장에서 \u003cb class=\"key\">소문\u003c/b> 이야기가 시작돼요. 말하는 대상이 막연한 '사람들'이 아니라 특정 무리의 나머지인 the others라는 점도 눈여겨보세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">say + to + 사람(3형식 문형)\u003c/span> : say [자동사적 동사] + to + [사람] (~에게 말하다) : \"다른 원숭이들에게 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형] + ~ (주어 You 생략) : \"자, 들어 봐\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"One monkey, 원숭이 한 마리가. said to the others, 다른 원숭이들에게 말했다. \"Now, listen, \"자, 들어 봐.. 이 문장 전체를 해석하면, 원숭이 한 마리가 다른 원숭이들에게 말했다.","hl":"m"},{"n":17,"text":"원숭이 한 마리가 무리를 향해 말문을 여는 장면이에요. 뒤에 붙은 Now, listen은 자, 들어 봐라며 상대의 주의를 끄는 신호이고, 바로 다음 문장에서 소문 이야기가 시작돼요. 말하는 대상이 특정 무리의 나머지를 가리키는 the others라는 점도 기억해 두세요.","hl":"mn"},{"n":18,"text":"첫 번째 포인트는 said to the others예요. say는 tell과 달리 사람을 목적어로 바로 데릴 수 없어서 전치사 to를 써서 말이 향하는 방향을 나타내요. 두 번째는 Now, listen인데요, 상대의 주의를 끄는 명령문이라 주어 You가 생략되고 동사원형 listen으로 시작해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소문이 있는데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There's \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">rumor\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 믿기 어렵다고 생각되는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">hard \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">believe\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간이 내려왔다는(진화했다는)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">man \u003c/span>\u003cspan class=\"tgt\">descended \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고귀한 우리 종족으로부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">noble \u003c/span>\u003cspan class=\"tgt\">race\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“들어봐, 우리가 믿기는 어렵다고 생각되는(믿기 힘든) 소문이 있는데, 인간이 고귀한 우리 종족의 자손이라는 거야(우리 종족으로부터 진화했다는 거야).\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 원숭이가 인간의 유래에 관한 \u003cb class=\"key\">소문\u003c/b>을 꺼내며 이야기의 화제를 던지는 부분이에요. '인간이 우리 종족에서 내려왔다'는 주장을 \u003cb class=\"key\">믿기 \u003c/b>\u003cb class=\"key\">어렵다\u003c/b>고 잘라 말하는 뉘앙스죠. 콜론 뒤의 that절은 앞에 나온 a rumor의 내용을 그대로 풀어 주는 \u003cb class=\"key\">동격\u003c/b> 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is 구문(유도부사)\u003c/span> : There + be동사 + [주어] (~이 있다) : \"소문이 있는데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : [선행사 a rumor] + that + [주어 we] + [동사 find] + ... (~를 ...라고 여기다) : \"우리가 믿기 어렵다고 생각하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">find + 목적어 + 형용사(목적격보어) 5형식\u003c/span> : find + [목적어(that=a rumor)] + [hard (목적격보어)] + to believe : \"~을 믿기 어렵다고 여기다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">동격의 접속사 that\u003c/span> : [추상명사 a rumor] + that + [주어 man + 동사 descended ...] : \"인간이 고귀한 우리 종족의 자손이라는 것\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"There's a rumor, 소문이 있는데. that we find hard to believe, 우리가 믿기 어렵다고 생각되는. that man descended, 인간이 내려왔다는(진화했다는). from our noble race, 고귀한 우리 종족으로부터. 이 문장 전체를 해석하면, “들어봐, 우리가 믿기는 어렵다고 생각되는(믿기 힘든) 소문이 있는데, 인간이 고귀한 우리 종족의 자손이라는 거야(우리 종족으로부터 진화했다는 거야).","hl":"m"},{"n":20,"text":"이 문장은 원숭이가 인간의 유래에 관한 소문을 꺼내면서 이야기의 화제를 던지는 부분이에요. 인간이 우리 종족에서 내려왔다는 주장을 믿기 어렵다고 잘라 말하는 뉘앙스죠. 콜론 뒤의 that절은 앞에 나온 a rumor의 내용을 그대로 풀어 주는 동격 표현이에요.","hl":"mn"},{"n":21,"text":"첫 번째 포인트는 There's a rumor예요. 무엇이 있다고 말할 때는 유도부사 there를 앞에 두고 진짜 주어인 a rumor를 be동사 뒤에 놓아요. 두 번째는 that we find hard to believe인데요, that은 앞의 a rumor를 받으면서 believe의 목적격 자리를 채우고 있어요. 세 번째로 find hard to believe는 find가 목적어와 형용사 보어를 데리는 5형식이라는 걸 보여 줘요. a rumor를 hard, 그러니까 믿기 어렵다고 여기는 거죠. 네 번째는 콜론 뒤의 that man descended from our noble race예요. 이 that은 rumor의 내용을 풀어 주는 동격이고, 뒤에 주어 man과 동사 descended가 다 있는 완전한 절이 온다는 게 결정적인 차이예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로 그 생각은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">idea\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창피한 것이다\u003c/span>\u003cspan class=\"en\">a disgrace.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">생각만 해도 창피해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 나온 '인간이 원숭이의 후손'이라는 소문을 \u003cb class=\"key\">수치\u003c/b>라고 딱 잘라 규정하는 문장이에요. very를 붙여 '그 생각 자체'를 콕 집어 \u003cb class=\"key\">강조\u003c/b>하고, 원숭이의 자존심을 세우는 \u003cb class=\"key\">반박\u003c/b>의 출발점이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">강조의 very (명사 앞 강조 형용사)\u003c/span> : [지시사 That] + [very(강조 형용사) + 명사 idea] → '바로 그 ~' : \"바로 그 생각\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"That very idea, 바로 그 생각은. is, 이다. a disgrace, 창피한 것이다. 이 문장 전체를 해석하면, 생각만 해도 창피해.","hl":"m"},{"n":23,"text":"앞에서 인간이 원숭이의 후손이라는 소문이 나왔죠. 이 문장은 그 생각 자체를 수치라고 딱 잘라 말하는 거예요. 원숭이의 자존심을 세우는 반박의 시작이라고 보시면 됩니다.","hl":"mn"},{"n":24,"text":"첫 번째 포인트는 강조의 very예요. 지시사 뒤에 명사가 오기 전에 very가 붙으면 매우가 아니라 바로 그라는 강조의 뜻이 됩니다. 그래서 That very idea는 바로 그 생각으로 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 원숭이도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">No \u003c/span>\u003cspan class=\"tgt\">monkey \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 번도 가족을 버린 적이 없었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">ever \u003c/span>\u003cspan class=\"tgt\">deserted \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">family\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자기 아이들을 굶기면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">starving \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">children \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들의 삶을 망치면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">ruining \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">lives\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 원숭이도 가족들을 버려, 굶어 죽인다거나 그들의 삶을 망친 적은 한 번도 없었어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간과 달리 원숭이는 가족을 버리지 않는다는 점을 \u003cb class=\"key\">근거\u003c/b>로 내세우는 문장이에요. desert, starving, ruining 세 동사를 통해 인간의 \u003cb class=\"key\">비인간적\u003c/b> 행동을 비판하고 있죠. 두 번째 문장의 수치라는 규정에 이어 원숭이의 도덕성을 \u003cb class=\"key\">증명\u003c/b>하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 주어 No + ever의 부정 강조\u003c/span> : [No + 명사] + [ever + 동사] → '한 번도 ~한 적이 없다' : \"어느 원숭이도 한 번도 가족을 버린 적이 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구문(부대상황·결과) + 병렬구조\u003c/span> : [주절] + , + [현재분사(~하면서) + and + 현재분사(~하면서)] : \"자기 아이들을 굶기면서, 그리고 그들의 삶을 망치면서\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"No monkey, 어느 원숭이도. ever deserted his family, 한 번도 가족을 버린 적이 없었다. starving his children, 자기 아이들을 굶기면서. and ruining their lives, 그리고 그들의 삶을 망치면서. 이 문장 전체를 해석하면, 어느 원숭이도 가족들을 버려, 굶어 죽인다거나 그들의 삶을 망친 적은 한 번도 없었어.","hl":"m"},{"n":26,"text":"원숭이는 가족을 버리지 않는다는 걸 근거로 내세우는 문장이에요. 인간은 가족을 버리고 아이를 굶기고 삶을 망친다고 비판하는 거죠. 앞의 수치라는 말에 도덕적 근거를 붙이는 셈입니다.","hl":"mn"},{"n":27,"text":"첫 번째로 No가 주어에 붙으면 문장 전체가 부정이 되고, 여기에 ever를 더해 한 번도라는 강조를 만듭니다. 두 번째로 콤마 뒤 starving과 ruining은 분사구문이면서 and로 병렬을 이루고 있어요. 두 동작 모두 주어인 No monkey에 연결된다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 또 한 가지는\u003c/span>\u003cspan class=\"en\">And \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"tgt\">thing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네가 절대 볼 수 없는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원숭이이다\u003c/span>\u003cspan class=\"en\">is a monkey\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코코넛 나무 주위에 울타리를 치고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">builds \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">fence \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">coconut \u003c/span>\u003cspan class=\"tgt\">tree\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코코넛을 쓰레기로 내버리면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">lets \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">coconuts \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">waste\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 다른 모든 원숭이들이 그것을 먹지 못하게 하는\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">forbids \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">monkeys \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">eat \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 네가 절대 볼 수 없는 또 한 가지는 원숭이가 코코넛 나무 주위에 울타리를 치고, 코코넛을 쓰레기로 내버리면서, 다른 원숭이들이 먹지 못하게 하는 것이야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간만 하는 세 번째 \u003cb class=\"key\">차이점\u003c/b>으로, 울타리를 치고 혼자 독식하는 행동을 제시하는 문장이에요. builds, lets, forbids의 \u003cb class=\"key\">병렬\u003c/b>을 통해 그런 일은 원숭이가 절대 하지 않는다는 점을 강조하죠. 이렇게 인간의 탐욕을 \u003cb class=\"key\">근거\u003c/b>로 쌓아 두고 마지막 문장에서 반전을 준비하는 구조입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사 another thing] + [(which/that) you will never see 생략] : \"네가 절대 볼 수 없는 또 한 가지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 a monkey] + [who + 동사(builds)] : \"코코넛 나무 주위에 울타리를 치는 원숭이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">사역동사 let + 목적어 + 원형부정사\u003c/span> : let + [목적어 the coconuts] + [동사원형 go] : \"코코넛이 쓰레기로 버려지게 내버려 두다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">forbid + 목적어 + to부정사\u003c/span> : forbid + [목적어 all other monkeys] + [to부정사 to eat] : \"다른 모든 원숭이들이 그것을 먹는 것을 금지하다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"And another thing, 그리고 또 한 가지는. you will never see, 네가 절대 볼 수 없는. is a monkey, 원숭이이다. who builds a fence around a coconut tree, 코코넛 나무 주위에 울타리를 치고. lets the coconuts go to waste, 코코넛을 쓰레기로 내버리면서. and forbids all other monkeys to eat them, 그리고 다른 모든 원숭이들이 그것을 먹지 못하게 하는. 이 문장 전체를 해석하면, 그리고 네가 절대 볼 수 없는 또 한 가지는 원숭이가 코코넛 나무 주위에 울타리를 치고, 코코넛을 쓰레기로 내버리면서, 다른 원숭이들이 먹지 못하게 하는 것이야.","hl":"m"},{"n":29,"text":"인간만 하는 세 번째 차이점을 제시하는 문장이에요. 울타리를 치고 혼자 독식하는 행동을 원숭이는 절대 하지 않는다고 말하죠. 이렇게 근거를 쌓아 두고 마지막 문장에서 반전을 준비하는 겁니다.","hl":"mn"},{"n":30,"text":"첫 번째는 another thing과 you will never see 사이에 목적격 관계대명사가 생략된 구조예요. 두 번째는 a monkey를 받는 주격 관계대명사 who이고, 뒤에 builds, lets, forbids가 병렬로 이어집니다. 세 번째는 사역동사 let이라서 목적어 뒤에 to 없이 동사원형 go가 오고, go to waste는 낭비되다라는 관용표현이에요. 네 번째는 forbid가 목적어 뒤에 to부정사를 데려오는 동사라는 점, 사역동사 let과 비교해서 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 내가 울타리를 친다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">fence \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 나무 주위에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">tree\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">굶주림이 너희를 강제할 거야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">starvation \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">force \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내게서 훔치도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">steal \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 내가 이 나무 주위에 울타리를 치면, 굶주림 때문에 너희들은 내 것을 훔칠 수밖에 없을 거야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 울타리를 치면 결국 \u003cb class=\"key\">굶주림\u003c/b> 때문에 훔치는 일이 생긴다는 뜻이에요. 소유와 경계가 \u003cb class=\"key\">도둑질\u003c/b>을 만들어 낸다는 아이러니를 보여 주며, 바로 앞 문장의 울타리 비판을 이어 갑니다. 원숭이는 이런 \u003cb class=\"key\">소유\u003c/b> 다툼을 하지 않는다는 점이 강조됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거(현재 사실의 반대 가정)\u003c/span> : If + 주어 + [[동사 과거형]] , 주어 + would + 동사원형 : \"만약 내가 이 나무 주위에 울타리를 친다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 would(가정의 결과)\u003c/span> : [[주어]] + would + 동사원형 : \"굶주림이 강제할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식 동사 + 목적격보어(to부정사)\u003c/span> : force + [[목적어]] + to부정사 : \"너희가 내게서 훔치도록 강제할 것이다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"If I put a fence, 만약 내가 울타리를 친다면. around this tree, 이 나무 주위에. starvation would force you, 굶주림이 너희를 강제할 거야. to steal from me, 내게서 훔치도록. 이 문장 전체를 해석하면, 만약 내가 이 나무 주위에 울타리를 치면, 굶주림 때문에 너희들은 내 것을 훔칠 수밖에 없을 거야.","hl":"m"},{"n":32,"text":"원숭이가 가정을 하나 해 보는 장면이에요. 내가 이 나무에 울타리를 치면 어떻게 될까요? 굶주림 때문에 너희가 내 것을 훔칠 수밖에 없게 된다는 거죠. 울타리와 소유가 결국 도둑질을 만든다는 걸 짚어 주는 겁니다.","hl":"mn"},{"n":33,"text":"첫 번째로 If I put a fence를 보세요. 실제로는 울타리를 치지 않을 상황을 상상하는 가정법이에요. 조건절은 동사 과거형 put, 결과절은 would로 받아서 현재 사실의 반대를 표현합니다. 두 번째로 starvation would force에서 would는 조건이 실현됐을 때의 결과를 나타내고, starvation은 셀 수 없는 명사라 단수로 봅니다. 세 번째로 force you to steal을 보세요. force는 목적어 뒤에 to부정사를 데리고 오는 동사라서, 강제해서 훔치게 만든다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기 또 다른 것이 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Here's \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"tgt\">thing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원숭이가 하지 않을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">monkey \u003c/span>\u003cspan class=\"tgt\">won't \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밤에 나가 사고를 치고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">night \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">trouble, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 총이나 곤봉, 칼을 써서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">gun, \u003c/span>\u003cspan class=\"tgt\">club, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">knife\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 원숭이의 목숨을 빼앗으려고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">monkey's \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">원숭이라면 하지 않을 게 또 하나 있는데, 밤에 나가 사고를 치며, 총이나 곤봉, 칼로 다른 원숭이의 목숨을 빼앗는 거야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 원숭이가 하지 않는 또 다른 일로 \u003cb class=\"key\">폭력\u003c/b>을 꼽는 문장이에요. 밤에 나가 사고를 치고, 총이나 칼로 다른 원숭이의 \u003cb class=\"key\">목숨\u003c/b>을 빼앗는 일은 하지 않는다는 거죠. 앞 문장의 울타리 이야기와 나란히 놓여 인간의 \u003cb class=\"key\">욕심\u003c/b>과 폭력성을 부각합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도치(Here + 동사 + 주어)\u003c/span> : Here + [[동사]] + 주어 : \"여기 또 다른 것이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : 선행사 + [[목적격 관계대명사]](that/which) + 주어 + 동사 : \"원숭이가 하지 않을 또 다른 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사원형 병렬 구조\u003c/span> : [[동사원형]] A and 동사원형 B, and 동사원형 C : \"밤에 나가고, 사고를 치고, 총이나 곤봉, 칼을 사용하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [[to부정사]](목적: ~하기 위해) : \"다른 원숭이의 목숨을 빼앗기 위해\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Here's another thing, 여기 또 다른 것이 있어요. a monkey won't do, 원숭이가 하지 않을. go out at night and get into trouble, 밤에 나가 사고를 치고. and use a gun, club, or knife, 그리고 총이나 곤봉, 칼을 써서. to take some other monkey's life, 다른 원숭이의 목숨을 빼앗으려고. 이 문장 전체를 해석하면, 원숭이라면 하지 않을 게 또 하나 있는데, 밤에 나가 사고를 치며, 총이나 곤봉, 칼로 다른 원숭이의 목숨을 빼앗는 거야.","hl":"m"},{"n":35,"text":"여덟 번째 문장은 원숭이가 절대 하지 않는 일을 콕 집어 나열해요. 밤에 나가 사고 치고, 흉기로 다른 원숭이의 목숨을 빼앗는 일이죠. 앞에서 울타리 이야기를 했으니, 인간이 하는 폭력과 욕심을 원숭이는 하지 않는다고 대비시키는 겁니다.","hl":"mn"},{"n":36,"text":"첫 번째로 Here's another thing을 보세요. Here가 앞에 오면 주어와 동사의 어순이 바뀌는 도치가 일어납니다. 두 번째로 another thing a monkey won't do에서 thing 뒤에 목적격 관계대명사 that이나 which가 생략되어 있어요. 원숭이가 하지 않을 것, 이렇게 thing을 꾸며 주는 거죠. 세 번째로 go, get, use 세 동사가 병렬로 나열되어 있으니 동사원형 모양을 그대로 유지해야 합니다. 마지막으로 to take some other monkey's life는 목적을 나타내는 to부정사예요. 총이나 칼을 쓰는 목적이 목숨을 빼앗는 것이라는 뜻입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래, 인간은 유래했어요\u003c/span>\u003cspan class=\"en\">Yes, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">man \u003c/span>\u003cspan class=\"tgt\">descended\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그는 유래하지 않았어요\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">descend \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래, 인간은 누군가의 자손이지만, 우리 자손은 아니었어.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간이 어딘가에서 \u003cb class=\"key\">유래\u003c/b>한 것은 인정하지만, 원숭이의 \u003cb class=\"key\">자손\u003c/b>은 아니라고 선을 긋는 결론이에요. 앞에서 인간의 욕심과 폭력을 늘어놓은 뒤라, 그런 인간을 우리 후손이라 부를 수 없다는 \u003cb class=\"key\">자부심\u003c/b> 섞인 반어로 읽힙니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">무관사 man(인류 전체)\u003c/span> : [[무관사]] man = 인간, 인류 : \"인간은 (어딘가에서) 유래했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">일반동사의 부정(do동사)\u003c/span> : [[do동사]] + not + 동사원형 : \"그는 유래하지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사 from\u003c/span> : descend + [[전치사]] from : \"우리에게서 유래하다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Yes, man descended, 그래, 인간은 유래했어요. but he didn't descend, 그러나 그는 유래하지 않았어요. from us, 우리에게서. 이 문장 전체를 해석하면, 그래, 인간은 누군가의 자손이지만, 우리 자손은 아니었어.”","hl":"m"},{"n":38,"text":"이 문장이 지문의 결론이에요. 인간도 어딘가에서 유래했다는 점은 인정하지만, 우리 원숭이에게서 온 건 아니라는 거죠. 앞에서 인간의 욕심과 폭력을 죽 늘어놓았으니, 그런 인간을 우리 자손이라고 부를 수 없다는 반어 섞인 자부심입니다.","hl":"mn"},{"n":39,"text":"첫 번째로 man descended에서 관사 없이 쓰인 man은 인간, 인류 전체를 가리킵니다. 두 번째로 descend은 자동사라서 from과 함께 쓰여 유래하다는 뜻이 되고, from us가 기원을 나타냅니다. 세 번째로 he didn't descend에서 일반동사의 부정은 didn't로 만들고 뒤에는 동사원형이 옵니다. he는 앞에 나온 man을 받는 대명사예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>원숭이 세 마리가 \u003cb class=\"key\">코코넛\u003c/b> 나무에 앉아 인간이 자신들의 후손이라는 소문을 꺼낸다.\u003c/li>\u003cli>원숭이는 그 \u003cb class=\"key\">소문\u003c/b>이 믿기 힘들고 생각만 해도 창피하다고 말한다.\u003c/li>\u003cli>어느 원숭이도 가족을 버리거나 나무에 \u003cb class=\"key\">울타리\u003c/b>를 치고 열매를 낭비하거나 폭력으로 목숨을 빼앗지 않는다.\u003c/li>\u003cli>그래서 인간은 진화했을지 몰라도 결코 원숭이의 \u003cb class=\"key\">자손\u003c/b>은 아니라고 결론 내린다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Although man may have descended, he did not descend from monkeys, whose moral conduct he fails to match.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">코코넛\u003c/b> 나무 위 원숭이들이 인간이 자신들의 자손이라는 소문을 반박하며, 가족을 버리고 \u003cb class=\"key\">독점\u003c/b>과 \u003cb class=\"key\">폭력\u003c/b>을 일삼는 인간은 원숭이의 후손이 아니라고 결론 내린다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"오늘 글은 원숭이가 인간의 도덕성을 꼬집는 풍자였어요. 가족, 나눔, 생명이라는 세 가지 기준에서 원숭이는 인간보다 낫다는 주장을 펼쳤죠. 결국 인간은 진화했지만 원숭이의 자손은 아니라는 마지막 문장이 핵심이에요. 이 구조를 기억하면 비슷한 풍자 글도 쉽게 읽을 수 있을 거예요. 오늘 수고 많았어요.","hl":null}]}]});</script></body></html>
