@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2강 reading2","audioDir":"passage2_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">2강\u003cbr>2번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>The Perfect Criminals Without Stingers\u003c/h1>\u003ch2>벌침 없는 완전 범죄자들\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>도둑벌은 자기 음식이나 벌집을 만드는 것을 책임이라고 생각하지 않고 남의 것을 빼앗아 사는데, \u003cb class=\"key\">벌침\u003c/b>이 없는 대신 벌들이 위험을 알릴 때 쓰는 \u003cb class=\"key\">특수한 \u003c/b>\u003cb class=\"key\">분무액\u003c/b>을 뿌려 꿀벌을 쫓아내고 꿀을 훔치는 \u003cb class=\"key\">완전 \u003c/b>\u003cb class=\"key\">범죄자\u003c/b>다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Robber bees, though they have no stingers, rob other bees of their nests and honey by misusing the very spray the bees use to warn one another of danger.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 벌침 하나 없이도 완벽한 범죄를 저지르는 도둑벌에 관한 이야기예요. 이 글은 도둑벌이 남의 벌집과 꿀을 어떻게 빼앗는지, 그 작전을 순서대로 보여 주고 있습니다. 요약하자면 도둑벌은 꿀벌이 위험을 알릴 때 쓰는 특수한 분무액을 악용해서 꿀벌을 쫓아내고 빈 벌집을 턴다는 거죠. 자, 그럼 시작해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">꿀벌처럼 무리 지어 사는 곤충은 페로몬(pheromone)이라는 화학 신호로 서로 소통합니다. 그중에는 위험이 닥쳤을 때 동료에게 알리는 경보 페로몬(alarm pheromone)도 있는데, 이것은 무리를 지키는 안전장치입니다. 그런데 어떤 벌은 이 신호를 자기 이익을 위해 가로챕니다. 마치 아파트 경비실 방송을 몰래 켜서 주민들을 대피시킨 뒤 빈집을 터는 도둑과 같습니다. 도둑벌(robber bee)은 바로 그런 방식으로 살아가는 벌로, 남의 벌집에 들어가 \u003cb class=\"key\">경보 \u003c/b>\u003cb class=\"key\">신호\u003c/b>를 뿌리고 \u003cb class=\"key\">꿀\u003c/b>을 실어 갑니다. 흥미로운 점은 이런 벌에게 \u003cb class=\"key\">벌침\u003c/b>이 없다는 사실로, 몸의 무기 대신 화학 신호를 \u003cb class=\"key\">무기\u003c/b>로 쓴다는 것을 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 꿀벌처럼 무리 지어 사는 곤충은 페로몬, 영어로 pheromone이라는 화학 신호로 서로 소통해요. 그중에는 위험이 닥쳤을 때 동료에게 알리는 경보 페로몬, 즉 alarm pheromone도 있죠. 그런데 어떤 벌은 이 신호를 자기 이익을 위해 가로챕니다. 마치 아파트 경비실 방송을 몰래 켜서 주민들을 대피시킨 뒤 빈집을 터는 도둑처럼요. 도둑벌, 영어로 robber bee는 바로 그런 방식으로 살아가는 벌이에요. 몸의 무기인 벌침이 없어도 화학 신호 하나면 충분하다는 걸 보여 주는 사례입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>편한 삶\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>도둑벌은 \u003cb class=\"key\">편한 \u003c/b>\u003cb class=\"key\">삶\u003c/b>을 삽니다. 자기 음식이나 벌집을 만드는 일을 자기 \u003cb class=\"key\">책임\u003c/b>이라고 생각하지 않죠. 그런 생활필수품은 다른 벌들의 벌집을 빼앗고 먹이를 훔침으로써 얻어집니다. 처음부터 \u003cb class=\"key\">남의 \u003c/b>\u003cb class=\"key\">것\u003c/b>에 기대어 사는 존재로 소개되는 셈입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>벌침 없는 반전\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>그런데 이 도둑벌들에게는 \u003cb class=\"key\">벌침\u003c/b>이 없습니다. Yet이 앞 내용을 뒤집는 지점이죠. 대신 그들에게는 그들을 \u003cb class=\"key\">완전 \u003c/b>\u003cb class=\"key\">범죄자\u003c/b>로 만들어 주는 독특한 특징이 하나 있습니다. 이 문장이 글 전체를 이끄는 \u003cb class=\"key\">주제문\u003c/b> 역할을 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>분무액 살포\u003csmall>근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>그 특징은 도둑들의 \u003cb class=\"key\">작전\u003c/b>을 보면 드러납니다. 한두 마리가 털고 싶은 벌집에 먼저 들어갑니다. 그리고 그 안에서 벌들이 서로에게 위험을 알릴 때 사용하는 \u003cb class=\"key\">특수한 \u003c/b>\u003cb class=\"key\">분무액\u003c/b>을 뿌리죠. 벌침 대신 \u003cb class=\"key\">화학 \u003c/b>\u003cb class=\"key\">신호\u003c/b>를 무기로 쓰는 것입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>꿀벌의 착각\u003csmall>결과 · 문장 7\u003c/small>\u003c/h4>\u003cp>분무액을 맡은 벌집 안의 벌들은 \u003cb class=\"key\">긴급 \u003c/b>\u003cb class=\"key\">상황\u003c/b>이라고 생각합니다. 그래서 꿀을 남겨 둔 채 \u003cb class=\"key\">새끼\u003c/b>를 보호하려고 급히 떠나 버립니다. 결국 자기 집을 스스로 비워 주는 쪽은 \u003cb class=\"key\">꿀벌\u003c/b> 자신이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>약탈과 빈집\u003csmall>결론 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>그 틈에 많은 수의 도둑들이 벌집으로 들어옵니다. 꿀을 훔쳐 자기 벌집으로 옮겨 놓고, 그 일에는 몇 시간 혹은 하루나 이틀이 걸리기도 합니다. 결국 \u003cb class=\"key\">욕심 \u003c/b>\u003cb class=\"key\">많은\u003c/b> 도둑들은 떠나고, 돌아온 꿀벌은 \u003cb class=\"key\">빈 \u003c/b>\u003cb class=\"key\">벌집\u003c/b>만 발견하게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 처음부터 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 도둑벌은 참 편한 삶을 살아요. 자기 음식이나 벌집을 만드는 일을 자기 책임이라고 생각하지 않죠. 필요한 것은 다른 벌들의 벌집을 빼앗고 먹이를 훔쳐서 얻습니다. 남의 것에 기대어 사는 존재라는 점을 처음부터 분명히 밝히고 있어요.","hl":"f0"},{"n":5,"text":"그런데 여기서 흥미로운 반전이 나옵니다. 이 도둑벌들에게는 벌침이 없어요. 그런데도 대신 그들에게는 완전 범죄자로 만들어 주는 독특한 특징이 하나 있다고 하죠. 이 문장이 글 전체를 이끄는 주제문입니다.","hl":"f1"},{"n":6,"text":"그 특징은 도둑들의 작전을 보면 바로 드러나요. 한두 마리가 털고 싶은 벌집에 먼저 들어갑니다. 그리고 그 안에서 벌들이 서로에게 위험을 알릴 때 사용하는 특수한 분무액을 뿌리죠. 벌침 대신 화학 신호를 무기로 쓰는 겁니다.","hl":"f2"},{"n":7,"text":"그 분무액을 맡은 벌집 안의 벌들은 긴급 상황이라고 생각해요. 그래서 꿀을 남겨 둔 채 새끼를 보호하려고 급히 떠나 버립니다. 결국 자기 집을 스스로 비워 주는 쪽은 꿀벌 자신이 되는 거죠.","hl":"f3"},{"n":8,"text":"그 틈에 많은 수의 도둑들이 벌집으로 들어옵니다. 꿀을 훔쳐서 자기 벌집으로 옮겨 놓고, 그 일에는 몇 시간 혹은 하루나 이틀이 걸리기도 해요. 결국 욕심 많은 도둑들이 떠나고, 돌아온 꿀벌은 빈 벌집만 발견하게 됩니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 도둑벌이 남의 것을 빼앗아 산다고 말한 뒤, \u003cb class=\"key\">벌침\u003c/b>이 없다는 반전을 던지고, 그 비밀을 \u003cb class=\"key\">작전\u003c/b> 과정으로 풀어 줍니다. 핵심 주제문이 네 번째 문장에서 먼저 제시되고 뒤에서 근거가 이어지므로 \u003cb class=\"key\">두괄식\u003c/b>입니다. 도둑벌의 침입부터 분무액 살포, 꿀벌의 대피, 꿀 운반, 철수까지 사건이 일어난 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>대로 전개됩니다. 그래서 전개 방식은 시간순 과정 설명으로 보는 것이 자연스럽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Yet (3)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>Instead (4)\u003c/b>\u003cspan>대체·전환\u003c/span>\u003cb>Then (7)\u003c/b>\u003cspan>결과·시간\u003c/span>\u003cb>Now (8)\u003c/b>\u003cspan>단계 전환\u003c/span>\u003cb>Finally (11)\u003c/b>\u003cspan>마무리·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">robber bees\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the thieves\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a large number of thieves\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the greedy thieves\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 시간의 흐름을 따라 과정을 설명하는 글입니다. 도둑벌의 등장부터 벌집 침입, 꿀 운반, 철수까지 사건이 일어난 순서대로 이어지죠. 그리고 핵심 주제문이 글 앞부분에 먼저 나오니까 두괄식 구조예요. 덕분에 뒤에 나오는 자세한 작전 설명이 왜 필요한지가 자연스럽게 이해됩니다.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. 첫 번째로 나오는 Yet은 앞 내용을 뒤집는 전환이고, 이어지는 Instead는 벌침 대신 무엇이 있는지를 알려 주죠. Then은 원인과 결과를 이어 주고, Now는 본격적인 약탈 단계로 넘어간다는 신호예요. 마지막의 Finally는 이야기를 정리하는 마무리 표지입니다. 그리고 robber bees가 thieves로, 다시 greedy thieves로 바뀌는 재진술도 꼭 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>robber bee\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도둑벌\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead a life\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>삶을 살다, 생활하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>여기다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>responsibility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>책임\u003c/span>\u003c/div>\u003cdiv>\u003cb>necessity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>필수품, 생활필수품\u003c/span>\u003c/div>\u003cdiv>\u003cb>acquire\u003c/b>\u003cem>동사\u003c/em>\u003cspan>얻다, 획득하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>빼앗다, 가져가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rob A of B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A에게서 B를 훔치다, 강탈하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stinger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>벌침, 침\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>unique\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>독특한, 특유의\u003c/span>\u003c/div>\u003cdiv>\u003cb>feature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특징, 특색\u003c/span>\u003c/div>\u003cdiv>\u003cb>make it possible for A to V\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A가 ~하는 것을 가능하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>criminal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>범죄자\u003c/span>\u003c/div>\u003cdiv>\u003cb>thief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도둑 (복수 thieves)\u003c/span>\u003c/div>\u003cdiv>\u003cb>enter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>give off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>내뿜다, 발산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>spray\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분무액, 스프레이\u003c/span>\u003c/div>\u003cdiv>\u003cb>warn A of B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A에게 B를 경고하다, 알리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>danger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위험\u003c/span>\u003c/div>\u003cdiv>\u003cb>emergency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>긴급 상황, 비상사태\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave behind\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>남겨 두고 떠나다, 뒤에 남기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rush\u003c/b>\u003cem>동사\u003c/em>\u003cspan>급히 가다, 돌진하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>young\u003c/b>\u003cem>명사\u003c/em>\u003cspan>새끼, 어린 것들\u003c/span>\u003c/div>\u003cdiv>\u003cb>a large number of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>많은 수의\u003c/span>\u003c/div>\u003cdiv>\u003cb>carry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>운반하다, 옮기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>greedy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>욕심 많은, 탐욕스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>only to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결국 ~하게 될 뿐이다, ~하지만 (유감되게도)\u003c/span>\u003c/div>\u003cdiv>\u003cb>empty\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비어 있는, 텅 빈\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개만 짚을게요. robber bee는 도둑벌, stinger는 벌침이라는 뜻이에요. give off는 내뿜다, 발산하다는 뜻이고, spray는 여기서 분무액을 가리키죠. leave behind는 남겨 두고 떠나다, only to는 결국 그런 결과만 알게 되었다는 뜻으로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">robber\u003c/b>\u003cspan class=\"m\">도둑, 강도\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thief\u003c/span>\u003cspan class=\"s\">burglar\u003c/span>\u003cspan class=\"s\">looter\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">victim\u003c/span>\u003cspan class=\"a\">guard\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">acquire\u003c/b>\u003cspan class=\"m\">얻다, 획득하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"s\">gain\u003c/span>\u003cspan class=\"s\">get\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">give up\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unique\u003c/b>\u003cspan class=\"m\">독특한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distinctive\u003c/span>\u003cspan class=\"s\">unusual\u003c/span>\u003cspan class=\"s\">special\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">give off\u003c/b>\u003cspan class=\"m\">내뿜다, 발산하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">emit\u003c/span>\u003cspan class=\"s\">release\u003c/span>\u003cspan class=\"s\">send out\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">absorb\u003c/span>\u003cspan class=\"a\">take in\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">danger\u003c/b>\u003cspan class=\"m\">위험\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hazard\u003c/span>\u003cspan class=\"s\">threat\u003c/span>\u003cspan class=\"s\">risk\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safety\u003c/span>\u003cspan class=\"a\">security\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">greedy\u003c/b>\u003cspan class=\"m\">욕심 많은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">selfish\u003c/span>\u003cspan class=\"s\">grasping\u003c/span>\u003cspan class=\"s\">avaricious\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">generous\u003c/span>\u003cspan class=\"a\">selfless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">protect\u003c/b>\u003cspan class=\"m\">보호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guard\u003c/span>\u003cspan class=\"s\">defend\u003c/span>\u003cspan class=\"s\">shield\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003cspan class=\"a\">attack\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">emergency\u003c/b>\u003cspan class=\"m\">긴급 상황\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">crisis\u003c/span>\u003cspan class=\"s\">urgency\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">routine\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 볼게요. robber는 thief, burglar와 가깝고, acquire는 obtain, gain과 같은 뜻이에요. unique는 distinctive, unusual로 바꿔 쓸 수 있고, give off는 emit, release와 통합니다. 반대로 danger의 반대말은 safety, security이고, greedy의 반대말은 generous, selfless예요. protect는 guard, defend와 묶고, 반대말인 harm, attack도 같이 기억해 두면 좋습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도둑벌은\u003c/span>\u003cspan class=\"en\">Robber bees\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">편하게 산다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lead \u003c/span>\u003cspan class=\"tgt\">easy \u003c/span>\u003cspan class=\"tgt\">lives\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 결코 생각하지 않는다\u003c/span>\u003cspan class=\"en\">They never \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">consider \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 그들의 책임이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">responsibility \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신의 음식이나 벌집을 만드는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span> their own food or nests.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">도둑벌은 편하게 산다. 그들은 그들의 음식이나 벌집을 만드는 것을 그들의 책임이라고 생각하지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도둑벌의 \u003cb class=\"key\">생활 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 소개하는 문장이에요. 도둑벌은 스스로 먹이와 벌집을 만드는 일을 \u003cb class=\"key\">책임\u003c/b>으로 여기지 않아서, 다른 벌의 집과 먹이에 의존한다는 점을 드러내죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현(lead + 형용사 + life)\u003c/span> : lead + [easy (형용사)] + [lives (복수명사)] = 편한 삶을 살다 : \"편하게 산다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가목적어 it / 진목적어 to부정사\u003c/span> : consider + [it (가목적어)] + [their responsibility (목적격보어)] + [to make ... (진목적어)] : \"그것을 자신들의 책임이라고 생각하다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Robber bees, 도둑벌은. lead easy lives, 편하게 산다. They never consider, 그들은 결코 생각하지 않는다. it their responsibility, 그것을 그들의 책임이라고. to make their own food or nests, 그들 자신의 음식이나 벌집을 만드는 것을. 이 문장 전체를 해석하면, 도둑벌은 편하게 산다. 그들은 그들의 음식이나 벌집을 만드는 것을 그들의 책임이라고 생각하지 않는다.","hl":"m"},{"n":14,"text":"이 문장은 도둑벌의 생활 방식을 소개해요. 도둑벌은 자기 먹이와 벌집을 만드는 일을 책임으로 여기지 않는다는 거죠. 그래서 다른 벌에게 기대어 편하게 산다는 점이 드러나요.","hl":"mn"},{"n":15,"text":"먼저 lead easy lives는 편한 삶을 살다는 뜻의 관용 표현이에요. 여기서 easy 같은 형용사가 life를 꾸며 어떤 삶인지 보여 주죠. 다음으로 consider it their responsibility to make를 볼게요. consider는 목적어 뒤에 목적격보어를 두는 동사인데, 진짜 목적어인 to부정사구가 길어서 it을 가목적어로 먼저 쓰고 긴 목적어는 뒤로 보내 문장 균형을 맞춘 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 필수품들은\u003c/span>\u003cspan class=\"en\">These necessities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생활의\u003c/span>\u003cspan class=\"en\">of life\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얻어진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">acquired\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 벌들의 벌집을 빼앗음으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">nests \u003c/span>\u003cspan class=\"tgt\">away \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">bees \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들의 먹이를 훔침으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">robbing \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러한 생활필수품들은 다른 벌들의 벌집을 빼앗고 그들의 먹이를 훔침으로써 얻어진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도둑벌이 생활필수품을 얻는 \u003cb class=\"key\">방법\u003c/b>을 설명하는 문장이에요. 벌집을 빼앗는 일과 먹이를 훔치는 일, 두 가지 \u003cb class=\"key\">수단\u003c/b>이 both A and B로 \u003cb class=\"key\">병렬\u003c/b>되어 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + [과거분사] : \"얻어진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">both A and B의 병렬 구조\u003c/span> : both + [by taking ...] + and + [by robbing ...] : \"다른 벌들의 벌집을 빼앗음으로써 그리고 그들의 먹이를 훔침으로써 둘 다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"These necessities, 이러한 필수품들은. of life, 생활의. are acquired, 얻어진다. both by taking nests away from other bees, 다른 벌들의 벌집을 빼앗음으로써. and by robbing them of their food, 그리고 그들의 먹이를 훔침으로써. 이 문장 전체를 해석하면, 그러한 생활필수품들은 다른 벌들의 벌집을 빼앗고 그들의 먹이를 훔침으로써 얻어진다.","hl":"m"},{"n":17,"text":"이 문장은 도둑벌이 생활필수품을 얻는 방법을 설명해요. 다른 벌의 벌집을 빼앗는 일과 먹이를 훔치는 일, 두 가지 수단이 both A and B로 병렬되어 있죠. 그래서 도둑벌의 생존 방식이 철저히 남의 것을 빼앗는 데 있음을 보여 줍니다.","hl":"mn"},{"n":18,"text":"먼저 are acquired는 수동태예요. 주어 These necessities of life가 얻는 행위의 대상이기 때문에 be동사와 과거분사로 표현했죠. 다음으로 both by taking nests away from other bees and by robbing them of their food를 보면, by taking과 by robbing이라는 두 전치사구가 both A and B로 대등하게 연결된 병렬 구조예요. 전치사 by를 반복해서 두 가지 수단을 분명히 보여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Yet\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 도둑벌들은\u003c/span>\u003cspan class=\"en\">these robber bees\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌침이 없다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">stingers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇지만 이 도둑벌들에게는 벌침이 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 도둑벌이 남의 벌집과 먹이를 빼앗는다고 했는데, 여기서 \u003cb class=\"key\">반전\u003c/b>이 일어나요. 그런 도둑벌에게 \u003cb class=\"key\">벌침\u003c/b>이 없다는 점을 강조하며 다음 문장의 독특한 특징으로 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사\u003c/span> : Yet + [절] : \"그렇지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">no + 명사(부정 형용사)\u003c/span> : have + [no + 복수명사] : \"벌침이 전혀 없다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Yet, 그렇지만. these robber bees, 이 도둑벌들은. have no stingers, 벌침이 없다.. 이 문장 전체를 해석하면, 그렇지만 이 도둑벌들에게는 벌침이 없다.","hl":"m"},{"n":20,"text":"앞에서 도둑벌이 남의 벌집과 먹이를 빼앗는다고 했는데, 여기서 반전이 일어나요. 그런 도둑벌에게 벌침이 없다는 점을 강조하면서 다음에 나올 독특한 특징으로 자연스럽게 이어 줍니다.","hl":"mn"},{"n":21,"text":"먼저 Yet은 앞 문장의 내용과 반대되는 전환을 나타내는 접속부사예요. 뒤 내용과의 대조를 분명히 해 주죠. 그리고 have no stingers에서 no는 not any와 같은 뜻으로 명사 앞에서 전혀 없다는 의미를 만들어요. 여기서는 벌침이 하나도 없다는 강한 부정을 보여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신\u003c/span>\u003cspan class=\"en\">Instead,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게는 있다\u003c/span>\u003cspan class=\"en\">they have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독특한 특징이\u003c/span>\u003cspan class=\"en\">a unique feature\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 ~을 가능하게 해 온\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">possible\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전 범죄자가 되도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">become\u003c/span> the perfect criminals.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대신 그들에게는 그들을 완전 범죄자로 만들어주는 독특한 특징이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 도둑벌에게 벌침이 없다는 사실을 말한 뒤, Instead로 \u003cb class=\"key\">전환\u003c/b>하여 벌침 대신 \u003cb class=\"key\">독특한 \u003c/b>\u003cb class=\"key\">특징\u003c/b>이 있다는 점을 제시합니다. 이 특징이 도둑벌을 \u003cb class=\"key\">완전 \u003c/b>\u003cb class=\"key\">범죄자\u003c/b>로 만들어 주며, 바로 뒤에서 그 특징이 무엇인지 구체적으로 설명할 것임을 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 + that + 불완전한 절 : \"그것이 ~하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가목적어 it 구문과 현재완료\u003c/span> : has + made + it(가목적어) + possible(목적격보어) + to부정사(진목적어) : \"~을 가능하게 해 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어\u003c/span> : for + 목적격 + to부정사 : \"그들이 완전 범죄자가 되도록\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Instead, 대신. they have, 그들에게는 있다. a unique feature, 독특한 특징이. that has made it possible, 그것이 ~을 가능하게 해 온. for them, 그들이. to become the perfect criminals, 완전 범죄자가 되도록. 이 문장 전체를 해석하면, 대신 그들에게는 그들을 완전 범죄자로 만들어주는 독특한 특징이 있다.","hl":"m"},{"n":23,"text":"여기서 Instead가 앞의 벌침이 없다는 내용과 대비되며 전환을 만들어요. 벌침은 없지만 독특한 특징이 있어서 완전 범죄자가 된다는 흐름으로, 뒤에서 그 특징을 설명할 거라고 예고하는 문장입니다.","hl":"mn"},{"n":24,"text":"첫 번째로 that은 앞의 a unique feature를 받는 주격 관계대명사예요. 선행사 a unique feature를 받아 절의 주어가 되고, has made는 현재완료로 지금까지 이어지는 결과를 보여 줍니다. 두 번째로 has made it possible은 가목적어 구문이에요. 진짜 목적어인 to become 이하는 길어서 가목적어 it을 먼저 두고 진목적어를 뒤로 보낸 거죠. 세 번째로 for them to become은 to부정사의 의미상 주어 구문입니다. to become의 주체가 them이라는 것을 for로 표시한 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도둑들은 이렇게 한다\u003c/span>\u003cspan class=\"en\">Here's \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">thieves \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도둑벌들 중의 한두 마리가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">One \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">two \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">thieves \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌집에 들어간다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">enter\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">nest \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거기서\u003c/span>\u003cspan class=\"en\">There,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 뿌린다\u003c/span>\u003cspan class=\"en\">they give off\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특수한 분무액을\u003c/span>\u003cspan class=\"en\">a special spray\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌들이 사용하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">bees \u003c/span>\u003cspan class=\"tgt\">use\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 경고할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">warn\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위험에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">danger\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">거기서 그들은 벌들이 서로에게 위험에 대한 경고를 할 때 사용하는 특수한 분무액을 뿌린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도둑벌의 \u003cb class=\"key\">작전\u003c/b>을 구체화하는 핵심 문장으로, 도둑벌이 벌들이 위험 신호로 쓰는 \u003cb class=\"key\">특수한 \u003c/b>\u003cb class=\"key\">분무액\u003c/b>을 이용해 속임수를 부린다는 뜻입니다. 뒤 문장에서 벌들이 \u003cb class=\"key\">긴급 \u003c/b>\u003cb class=\"key\">상황\u003c/b>으로 착각해 집을 비우는 결과로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : 선행사 + that + 주어 + 동사 + 목적어 : \"벌들이 사용하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 부사절 접속사 when\u003c/span> : when + 주어 + 동사 : \"그들이 경고할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">warn A of B 구문\u003c/span> : warn + 목적어 + of + 명사 : \"서로에게 위험을\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"There, 거기서. they give off, 그들은 뿌린다. a special spray, 특수한 분무액을. that bees use, 벌들이 사용하는. when they warn, 그들이 경고할 때. one another, 서로에게. of danger, 위험에 대해. 이 문장 전체를 해석하면, 거기서 그들은 벌들이 서로에게 위험에 대한 경고를 할 때 사용하는 특수한 분무액을 뿌린다.","hl":"m"},{"n":29,"text":"도둑벌의 작전을 구체화하는 핵심 문장이에요. 도둑벌이 벌들이 위험 신호로 쓰는 특수한 분무액을 이용해 속임수를 부린다는 뜻이고, 그래서 벌들이 긴급 상황으로 착각하게 되는 거죠.","hl":"mn"},{"n":30,"text":"첫 번째로 that bees use에서 that은 앞의 a special spray를 받는 목적격 관계대명사예요. use의 목적어 역할을 하면서 앞의 명사를 꾸며 줍니다. 두 번째로 when they warn은 시간 부사절을 이끄는 접속사 when의 쓰임이에요. 세 번째로 one another of danger는 앞의 warn과 함께 warn A of B 구문을 만듭니다. one another는 상호대명사로 서로를 뜻하고, of danger는 경고의 내용인 위험을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면\u003c/span>\u003cspan class=\"en\">Then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 긴급 상황에 처했다고 생각하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thinking \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">emergency \u003c/span>\u003cspan class=\"tgt\">situation\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌집 안의 벌들이\u003c/span>\u003cspan class=\"en\">the bees inside the nest\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꿀을 남겨둔 채\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">leave \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">honey \u003c/span>\u003cspan class=\"tgt\">behind\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">급히 떠나 버린다\u003c/span>\u003cspan class=\"en\">and rush away\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새끼를 보호하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">protect \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">young\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 벌집 안의 벌들이 긴급 상황에 처했다고 생각하고, 꿀을 남겨둔 채 새끼를 보호하기 위해 급히 떠나 버린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 도둑벌이 \u003cb class=\"key\">분무액\u003c/b>을 뿌린 결과, 꿀벌들이 어떻게 반응하는지를 보여주는 문장이에요. 꿀벌들은 상황을 \u003cb class=\"key\">긴급 \u003c/b>\u003cb class=\"key\">상황\u003c/b>으로 착각하고 \u003cb class=\"key\">새끼 \u003c/b>\u003cb class=\"key\">보호\u003c/b>를 최우선으로 삼아 꿀을 두고 달아나죠. 결국 도둑벌에게 꿀을 내어주는 빈집을 스스로 만들어 주는 셈입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사, 동시상황)\u003c/span> : [접속사·주어 생략] + [동사원형-ing (분사구)] , [주절] = '~하면서, ~하고' : \"그들이 긴급 상황에 처했다고 생각하고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">leave + 목적어 + 부사(behind)\u003c/span> : leave [목적어] + [부사 behind] = '~을 남겨두고 가다' : \"꿀을 남겨둔 채 (떠나다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [행위 동사] + to + [동사원형] = '~하기 위해' : \"새끼를 보호하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Then, 그러면. thinking they are in an emergency situation, 그들이 긴급 상황에 처했다고 생각하고. the bees inside the nest, 벌집 안의 벌들이. leave their honey behind, 꿀을 남겨둔 채. and rush away, 급히 떠나 버린다. to protect their young, 새끼를 보호하기 위해. 이 문장 전체를 해석하면, 그러면 벌집 안의 벌들이 긴급 상황에 처했다고 생각하고, 꿀을 남겨둔 채 새끼를 보호하기 위해 급히 떠나 버린다.","hl":"m"},{"n":32,"text":"이 문장은 앞에서 도둑벌이 특수한 분무액을 뿌린 결과를 설명해요. 벌집 안의 꿀벌들은 그 냄새를 위험 신호로 받아들이고, 새끼를 지키려고 꿀을 두고 도망친다는 거죠. 결국 도둑벌이 꿀을 마음껏 가져갈 수 있는 빈집을 스스로 만들어 주는 셈이에요.","hl":"mn"},{"n":33,"text":"먼저 thinking they are in an emergency situation은 분사구문이에요. 접속사와 주어가 생략되고 동사가 ing로 바뀐 형태로, 주절의 주어인 the bees가 생각하는 주체라는 점을 꼭 기억하세요. 두 번째로 leave their honey behind는 leave 목적어 부사 구조로 꿀을 남겨두고 간다는 뜻이고요. 마지막으로 to protect their young은 to부정사의 부사적 용법으로 목적을 나타내서 새끼를 보호하기 위해라고 해석한다는 것, 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제\u003c/span>\u003cspan class=\"en\">Now\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 수의 도둑(벌)들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">large \u003c/span>\u003cspan class=\"tgt\">number \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">thieves\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌집에 들어온다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">enter \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">nest\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제 많은 수의 도둑(벌)들이 벌집에 들어온다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 한두 마리의 도둑벌이 벌집을 비워 놓은 사이, 이제 \u003cb class=\"key\">다수\u003c/b>의 도둑벌이 본격적으로 들어오는 장면이에요. 규모가 커졌다는 점이 \u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">large \u003c/b>\u003cb class=\"key\">number \u003c/b>\u003cb class=\"key\">of\u003c/b>로 드러나면서 사건이 \u003cb class=\"key\">절정\u003c/b>으로 치닫는 흐름을 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수량 표현 a large number of + 복수명사\u003c/span> : a large number of + [복수명사] + [복수동사] : \"많은 수의 도둑벌들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사 enter (전치사 불필요)\u003c/span> : enter + [목적어] (X: enter into the nest) : \"벌집에 들어온다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Now, 이제. a large number of thieves, 많은 수의 도둑(벌)들이. enter the nest, 벌집에 들어온다. 이 문장 전체를 해석하면, 이제 많은 수의 도둑(벌)들이 벌집에 들어온다.","hl":"m"},{"n":35,"text":"앞에서 꿀벌들이 도망간 뒤, 이제 본격적으로 많은 도둑벌들이 벌집으로 들어오는 장면이에요. 처음엔 한두 마리가 들어가 분무액을 뿌렸지만, 이제는 큰 무리가 한꺼번에 몰려드는 거죠.","hl":"mn"},{"n":36,"text":"a large number of thieves에서 number는 수를 세는 표현이라 뒤에 복수명사 thieves가 오고, 동사도 복수형 enter를 씁니다. 그리고 enter는 타동사라서 뒤에 전치사 into를 붙이지 않고 바로 목적어 the nest를 받는다는 점, 시험에 자주 나오니까 꼭 챙기세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 꿀을 가져가고,\u003c/span>\u003cspan class=\"en\">They take the honey,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 꿀을 그들은 옮겨놓아요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">carry \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 벌집으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">nest\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 꿀을 훔쳐서, 자신들의 벌집에 옮겨놓는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도둑벌들이 훔친 \u003cb class=\"key\">꿀\u003c/b>을 자기 \u003cb class=\"key\">벌집\u003c/b>으로 실어 나르는 장면이에요. which가 앞의 the honey를 그대로 받아서 '옮기는 대상'이 되어 주죠. 훔치는 동작과 나르는 동작을 하나로 이어 붙여, 이들의 목적이 결국 꿀이라는 점을 분명히 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">계속적 용법의 관계대명사 which\u003c/span> : [선행사 the honey], which + [주어+동사] = '그것을 ~' : \"그 꿀을 그들은 옮겨\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 어순(동사 + 목적어 + 부사 + 전치사)\u003c/span> : carry [목적어] back to [장소] = '~을 ...로 옮겨놓다' : \"자신들의 벌집으로 옮겨놓다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"They take the honey, 그들은 꿀을 가져가고. which they carry back, 그 꿀을 그들은 옮겨놓아요. to their own nest, 자신들의 벌집으로. 이 문장 전체를 해석하면, 그들은 꿀을 훔쳐서, 자신들의 벌집에 옮겨놓는다.","hl":"m"},{"n":38,"text":"도둑벌들이 훔친 꿀을 자기 벌집으로 실어 나르는 장면이에요. which는 앞의 the honey를 그대로 받아서 옮기는 대상이 되어 주죠. 훔치고 나르는 두 동작을 하나로 이어 붙인 문장이라고 보시면 됩니다.","hl":"mn"},{"n":39,"text":"which they carry back to their own nest는 계속적 용법의 관계대명사예요. 앞의 the honey를 선행사로 받으면서 그 꿀을 그들이 자신들의 벌집으로 옮겨놓는다는 뜻을 덧붙여 줍니다. 그리고 carry back to처럼 동사 뒤에 부사 back이 오고 그다음 전치사 to가 오는 어순도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 걸릴 수도 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> may take\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 시간 혹은 하루나 이틀이\u003c/span>\u003cspan class=\"en\">several hours or even a day or two\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 일을 완전히 끝내는 데는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">job \u003c/span>\u003cspan class=\"tgt\">completely\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 일을 완전히 끝내는 데는 몇 시간 혹은 하루나 이틀이 걸릴 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도둑벌들이 꿀을 자기 벌집으로 옮기는 작업에 시간이 얼마나 많이 드는지를 알려 주는 문장이에요. \u003cb class=\"key\">하루 \u003c/b>\u003cb class=\"key\">이틀\u003c/b>이라는 긴 시간을 들여 작업한다는 점에서 이들의 털이가 얼마나 \u003cb class=\"key\">조직적\u003c/b>인지가 드러나죠. 겉으로 보이는 '편한 삶'과 달리 실제 도둑질은 상당히 공들인 작업이라는 흐름을 만들어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 It(형식주어)\u003c/span> : It + [동사] + [진주어 to부정사구] : ~하는 것은 …이다 : \"그것은(해석하지 않음)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(진주어)\u003c/span> : take + [시간] + to do : ~하는 데 (시간이) 걸리다 : \"그 일을 완전히 끝내는 것(은)\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"It may take, 그것은 걸릴 수도 있다. several hours or even a day or two, 몇 시간 혹은 하루나 이틀이. to do the job completely, 그 일을 완전히 끝내는 데는. 이 문장 전체를 해석하면, 그 일을 완전히 끝내는 데는 몇 시간 혹은 하루나 이틀이 걸릴 수도 있다.","hl":"m"},{"n":41,"text":"이 문장은 도둑벌들이 꿀을 옮기는 데 시간이 얼마나 걸리는지를 말해 줘요. 하루 이틀, 그러니까 꽤 긴 시간을 들여서 작업한다는 거죠. 그래서 이들의 털이가 상당히 조직적이라는 인상을 남겨 줍니다.","hl":"mn"},{"n":42,"text":"첫 번째로, 문장 맨 앞의 It은 '그것'이라고 해석하지 않아요. 뒤에 나오는 to do the job completely라는 진주어를 대신 받아 주는 가주어 It이거든요. 두 번째로, take는 여기서 '가지다'가 아니라 시간이 걸리다라는 뜻으로 쓰였어요. 그래서 It may take 다음에 시간, 그다음에 to do가 오면 '~하는 데 몇 시간이 걸릴 수도 있다'라고 해석한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결국 욕심 많은 도둑들은 떠나고,\u003c/span>\u003cspan class=\"en\">Finally the greedy thieves leave,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꿀벌들이 돌아오지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> the honey bees come back\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결국 ~을 알게 될 뿐이고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 벌집이 비어 있는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">nest \u003c/span>\u003cspan class=\"tgt\">empty\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결국 욕심 많은 도둑들은 떠나고, 꿀벌들이 돌아오지만 벌집이 비어있는 것을 알게 될 뿐이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 털이극의 마지막 장면으로, 도둑벌들이 꿀을 다 챙겨 유유히 사라진 뒤의 결과를 보여 줘요. 꿀벌들은 \u003cb class=\"key\">뒤늦게\u003c/b> 돌아와 텅 빈 벌집만 확인하게 되죠. only to가 앞의 기대와 정반대되는 \u003cb class=\"key\">안타까운 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 강조해서, 도둑벌이 '완전 범죄자'라는 앞 문장의 평가를 마무리해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and(절과 절의 병렬)\u003c/span> : [절1] + and + [절2] : ~하고, 그리고 ~하다 : \"그리고(떠나고, ~하지만)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">only to부정사의 부사적 용법(결과)\u003c/span> : only to + [동사원형] : 결국 ~하게 되다, ~했지만 …할 뿐이다 : \"결국 ~하게 될 뿐이고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">find + 목적어 + 목적격보어(5형식)\u003c/span> : find + [목적어] + [형용사(목적격보어)] : 목적어가 ~한 것을 알다 : \"그들의 벌집이 비어 있는 것을 알다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Finally the greedy thieves leave, 결국 욕심 많은 도둑들은 떠나고. and the honey bees come back, 꿀벌들이 돌아오지만. only to find, 결국 ~을 알게 될 뿐이고. their nest empty, 그들의 벌집이 비어 있는 것을. 이 문장 전체를 해석하면, 결국 욕심 많은 도둑들은 떠나고, 꿀벌들이 돌아오지만 벌집이 비어있는 것을 알게 될 뿐이다.","hl":"m"},{"n":44,"text":"마지막 문장은 털이의 결말을 보여 줘요. 도둑들은 꿀을 다 챙겨서 유유히 떠나고, 꿀벌들은 뒤늦게 돌아와 텅 빈 벌집만 확인하게 되죠. 이 안타까운 결과가 앞에서 말한 완전 범죄자라는 평가를 마무리해 줍니다.","hl":"mn"},{"n":45,"text":"첫 번째로, and가 두 개의 절을 대등하게 이어 주고 있어요. 도둑들이 떠나는 장면과 꿀벌들이 돌아오는 장면이 나란히 놓이면서 대조가 생기죠. 두 번째로, only to는 '결국 ~하게 될 뿐이다'라는 결과의 to부정사예요. 기대와 정반대되는 안타까운 결과를 강조하는 표현이에요. 세 번째로, find their nest empty에서 find는 목적어와 목적격보어를 함께 데리고 있는 구조예요. their nest가 목적어, empty가 목적격보어로 '벌집이 비어 있는 것을 알다'라고 해석한답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>도둑벌은 자기 음식이나 벌집을 만드는 것을 책임으로 여기지 않고 \u003cb class=\"key\">남의 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 빼앗아 삽니다.\u003c/li>\u003cli>이들에게는 \u003cb class=\"key\">벌침\u003c/b>이 없지만, 그들을 \u003cb class=\"key\">완전 \u003c/b>\u003cb class=\"key\">범죄자\u003c/b>로 만들어 주는 독특한 특징이 있습니다.\u003c/li>\u003cli>한두 마리가 벌집에 들어가 위험을 알리는 \u003cb class=\"key\">특수한 \u003c/b>\u003cb class=\"key\">분무액\u003c/b>을 뿌리면, 벌들은 긴급 상황으로 착각해 꿀을 두고 떠납니다.\u003c/li>\u003cli>그 틈에 많은 도둑들이 \u003cb class=\"key\">꿀\u003c/b>을 실어 가고, 돌아온 꿀벌은 \u003cb class=\"key\">빈 \u003c/b>\u003cb class=\"key\">벌집\u003c/b>만 발견하게 됩니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Robber bees, though they have no stingers, rob other bees of their nests and honey by misusing the very spray the bees use to warn one another of danger.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">도둑벌은 자기 음식이나 벌집을 만드는 것을 책임이라고 생각하지 않고 남의 것을 빼앗아 사는데, \u003cb class=\"key\">벌침\u003c/b>이 없는 대신 벌들이 위험을 알릴 때 쓰는 \u003cb class=\"key\">특수한 \u003c/b>\u003cb class=\"key\">분무액\u003c/b>을 뿌려 꿀벌을 쫓아내고 꿀을 훔치는 \u003cb class=\"key\">완전 \u003c/b>\u003cb class=\"key\">범죄자\u003c/b>다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 글의 핵심은 하나예요. 벌침이 없다는 약점을 화학 신호를 악용하는 전략으로 뒤집었다는 것, 그래서 도둑벌이 완전 범죄자가 되었다는 점입니다. 시험에서는 Yet, Instead, Then, Now, Finally 같은 신호어를 따라가며 과정을 정리하고, 주제문이 무엇인지 먼저 잡는 연습을 꼭 해 보세요. 오늘 수업은 여기까지, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
