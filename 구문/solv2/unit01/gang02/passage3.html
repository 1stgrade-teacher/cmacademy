@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2강 reading3","audioDir":"passage3_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">2강\u003cbr>3번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Asch's Line Experiment: Why We Follow the Group\u003c/h1>\u003ch2>애쉬의 선 실험, 우리는 왜 집단을 따르는가\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>심리학자 Solomon Asch는 \u003cb class=\"key\">동조 \u003c/b>\u003cb class=\"key\">성향\u003c/b>이 독립적 사고와 이성적 판단보다 강한지 알아보기 위해 시각적 지각 실험을 했고, 실제 실험 대상자의 70퍼센트 이상이 명백한 정답 대신 \u003cb class=\"key\">집단의 \u003c/b>\u003cb class=\"key\">압력\u003c/b>에 굴복해 틀린 답을 말했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>People's tendency to agree with their peers can override independent thought and rational judgment, as Asch's line experiment demonstrated.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 심리학자 Solomon Asch의 유명한 선분 실험이에요. 이 실험은 사람들이 독립적으로 판단하려는 성향과 동료들에게 동의하려는 성향 중 어느 쪽이 더 강한지를 확인하려고 설계되었죠. 결론부터 말하면, 정답이 뻔한 쉬운 과제에서도 상당수의 사람이 집단의 압력에 굴복했다는 내용이에요. 그럼 지문을 한 문장씩 짚어 가며 자세히 살펴보겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">Solomon Asch의 실험은 사회심리학에서 \u003cb class=\"key\">동조\u003c/b>(conformity)를 보여 주는 대표적인 사례로 꼽혀요. 동조란 집단의 다수가 말하는 방향으로 자신의 판단이나 행동을 바꾸는 현상을 말하고, 여기에 작용하는 힘을 또래 압력(peer pressure) 또는 사회적 압력(social pressure)이라고 불러요. 사람은 대개 자기가 본 것을 스스로 판단하려 하지만, 다수의 의견이 눈앞에 제시되면 틀렸다는 걸 알면서도 분위기에 휩쓸리기 쉬워요. 일상에서도 비슷한 일이 생기는데, 모둠 활동에서 친구들이 모두 같은 답을 말할 때 혼자만 다른 답을 말하기가 얼마나 어려운지 떠올려 보면 이해가 쉬워요. Asch는 이 실험으로 \u003cb class=\"key\">이성적 \u003c/b>\u003cb class=\"key\">판단\u003c/b>보다 집단의 분위기가 우리의 선택을 더 세게 흔들 수 있다는 점을 보여 주었답니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚고 갈게요. 이 실험은 사회심리학에서 동조, 즉 conformity를 보여 주는 대표적인 사례로 꼽혀요. 동조란 집단의 다수가 말하는 방향으로 자신의 판단이나 행동을 바꾸는 현상을 말하고, 여기에 작용하는 힘을 또래 압력, peer pressure라고 부르죠. 사람은 원래 자기가 본 것을 스스로 판단하려고 하지만, 다수의 의견이 눈앞에 제시되면 틀린 줄 알면서도 분위기에 휩쓸리기 쉬워요. 모둠 활동에서 친구들이 모두 같은 답을 말할 때 혼자만 다른 답을 말하기 어려운 경험을 떠올려 보면 이해가 쉬울 거예요. Asch는 이 실험으로 이성적 판단보다 집단의 분위기가 우리의 선택을 더 세게 흔들 수 있다는 점을 보여 주었답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문과 준비\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>심리학자 Solomon Asch는 사람들이 \u003cb class=\"key\">동조 \u003c/b>\u003cb class=\"key\">성향\u003c/b>과 독립적 사고 중 어느 쪽이 더 강한지 알아보고 싶었어요. 그래서 대학생들로 이루어진 집단을 모아 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">지각\u003c/b>에 관한 실험에 참여한다고 알렸죠. 이 단계는 실험의 \u003cb class=\"key\">목적\u003c/b>과 상황을 제시하는 도입부예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>쉬운 과제\u003csmall>과정 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>Asch는 세 개의 \u003cb class=\"key\">선분\u003c/b>을 보여 주고 차례대로 어느 것이 가장 긴지 물었어요. 정답이 \u003cb class=\"key\">명백한\u003c/b> 아주 쉬운 과제였죠. 틀릴 이유가 전혀 없는 과제였기 때문에, 뒤에 나올 \u003cb class=\"key\">오답\u003c/b>이 더 충격적으로 다가오게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>숨겨진 지시\u003csmall>전환 · 문장 5\u003c/small>\u003c/h4>\u003cp>However로 시작하는 이 문장에서 실험의 \u003cb class=\"key\">반전\u003c/b>이 드러나요. Asch는 마지막 사람을 제외한 모든 사람에게 \u003cb class=\"key\">중간 \u003c/b>\u003cb class=\"key\">길이\u003c/b>의 선이 가장 길다고 말하도록 은밀히 지시했어요. 즉 마지막 사람만이 진짜 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">대상자\u003c/b>였던 거죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결과와 함의\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>결과는 놀라웠어요. 실제 실험 대상자의 70퍼센트 이상이 \u003cb class=\"key\">집단의 \u003c/b>\u003cb class=\"key\">압력\u003c/b>에 굴복해서 중간 길이의 선이 가장 길다고 말했어요. \u003cb class=\"key\">명백한\u003c/b> 정답조차 집단이 다르게 말하면 흔들린다는 것을 보여 주는 \u003cb class=\"key\">결론\u003c/b>이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 실험의 목적을 밝히는 부분이에요. 심리학자 Solomon Asch는 사람들이 동료들에게 동의하려는 성향이 독립적인 사고와 이성적인 판단보다 더 강한지 알고 싶었어요. 그래서 대학생들로 이루어진 집단을 모아 시각적 지각에 관한 실험에 참여하고 있다고 알렸죠. 질문을 먼저 던지고 상황을 세팅하는 도입부라고 보시면 됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 실제 과제를 제시하는 부분이에요. Asch는 세 개의 선분을 보여 주고 차례대로 어느 선이 가장 긴지 물었어요. 정답이 뻔히 보이는 아주 쉬운 과제였죠. 이렇게 쉬운 과제라는 점이 중요한데, 틀릴 이유가 전혀 없기 때문에 뒤에 나올 오답이 더 충격적으로 느껴지기 때문이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 실험의 반전이 드러나요. However로 시작하는 문장에서 Asch가 마지막 사람을 제외한 모든 사람에게 중간 길이의 선이 가장 길다고 말하도록 은밀히 지시했다는 사실이 나오죠. 즉 마지막 사람만이 진짜 실험 대상자였고, 나머지는 미리 정해진 답을 말하는 역할이었던 거예요.","hl":"f2"},{"n":7,"text":"마지막 단계는 결과예요. 실제 실험 대상자의 칠십 퍼센트 이상이 집단의 압력에 굴복해서 중간 길이의 선이 가장 길다고 말했어요. 눈으로 보면 정답이 명백한데도 집단이 다르게 말하자 판단을 바꿔 버린 거죠. 이 결과가 글 전체의 결론 역할을 합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 첫 문장에서 어느 성향이 더 강한가라는 \u003cb class=\"key\">질문\u003c/b>을 던지고, 마지막 문장에서 실험 결과로 \u003cb class=\"key\">답\u003c/b>을 주는 질문-답변 구조예요. 답이 맨 끝에 나오기 때문에 \u003cb class=\"key\">미괄식\u003c/b> 전개로 볼 수 있어요. 중간의 실험 과정은 그 답을 뒷받침하는 \u003cb class=\"key\">근거\u003c/b> 역할을 하고, However가 조작 사실을, As it turned out이 결과를 표시하고 있죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>whether (1)\u003c/b>\u003cspan>탐구 질문 제시\u003c/span>\u003cb>However (5)\u003c/b>\u003cspan>전환·반전\u003c/span>\u003cb>As it turned out (6)\u003c/b>\u003cspan>결과·결론 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">tendency to agree with their peers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">group pressure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">caved in to group pressure\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>독립적 사고와 이성적 판단\u003c/th>\u003cth>동조 성향과 집단의 압력\u003c/th>\u003c/tr>\u003ctr>\u003ctd>스스로 정답을 판단하려 함\u003c/td>\u003ctd>다수의 답을 따라가려 함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>명백한 정답을 인지함\u003c/td>\u003ctd>틀린 답도 따라 말함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>끝까지 유지하는 소수\u003c/td>\u003ctd>70퍼센트 이상이 굴복\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 첫 문장에서 과연 어느 성향이 더 강한가라는 질문을 던지고, 마지막 문장에서 실험 결과로 답을 주는 질문과 답변의 구조예요. 답이 맨 끝에 나오기 때문에 미괄식 전개로 보는 게 자연스럽죠. 가운데 실험 과정은 그 답을 뒷받침하는 근거 역할을 하고요.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 첫 문장의 whether는 무엇을 알아보려는지 질문을 던지는 표지이고, 다섯 번째 문장의 However는 조작된 사실을 알려 주는 전환 신호예요. 마지막 문장의 As it turned out은 결과가 드러난다는 표지죠. 그리고 마지막 사람과 나머지 사람, 명백한 정답과 집단의 오답이 서로 대조를 이루고 있다는 점도 함께 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>psychologist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>심리학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아내다, 발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>whether\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~인지 아닌지\u003c/span>\u003c/div>\u003cdiv>\u003cb>tendency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성향, 경향\u003c/span>\u003c/div>\u003cdiv>\u003cb>agree with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 동의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>peer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동료, 또래\u003c/span>\u003c/div>\u003cdiv>\u003cb>independent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>독립적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>rational\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이성적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>judgment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>판단\u003c/span>\u003c/div>\u003cdiv>\u003cb>assemble\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모으다, 소집하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>announce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알리다, 발표하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take part in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>참여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>experiment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실험\u003c/span>\u003c/div>\u003cdiv>\u003cb>visual\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>시각의\u003c/span>\u003c/div>\u003cdiv>\u003cb>perception\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지각, 인식\u003c/span>\u003c/div>\u003cdiv>\u003cb>segment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조각, 부분\u003c/span>\u003c/div>\u003cdiv>\u003cb>in turn\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>차례대로\u003c/span>\u003c/div>\u003cdiv>\u003cb>task\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과제, 일\u003c/span>\u003c/div>\u003cdiv>\u003cb>obvious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>명백한\u003c/span>\u003c/div>\u003cdiv>\u003cb>secretly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>은밀히, 몰래\u003c/span>\u003c/div>\u003cdiv>\u003cb>instruct\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>all but\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 제외한 모두\u003c/span>\u003c/div>\u003cdiv>\u003cb>subject\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실험 대상자, 피험자\u003c/span>\u003c/div>\u003cdiv>\u003cb>medium-length\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중간 길이의\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>밝혀지다, 드러나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>over\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~이상\u003c/span>\u003c/div>\u003cdiv>\u003cb>cave in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>굴복하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pressure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>압력\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 몇 개 짚을게요. tendency는 성향이나 경향, rational은 이성적이라는 뜻이고, assemble은 모으다, 소집하다는 의미예요. cave in은 압력에 굴복하다는 뜻의 숙어이니 꼭 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">tendency\u003c/b>\u003cspan class=\"m\">성향, 경향\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inclination\u003c/span>\u003cspan class=\"s\">disposition\u003c/span>\u003cspan class=\"s\">leaning\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">aversion\u003c/span>\u003cspan class=\"a\">disinclination\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">independent\u003c/b>\u003cspan class=\"m\">독립적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">autonomous\u003c/span>\u003cspan class=\"s\">self-reliant\u003c/span>\u003cspan class=\"s\">free\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dependent\u003c/span>\u003cspan class=\"a\">subordinate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rational\u003c/b>\u003cspan class=\"m\">이성적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">logical\u003c/span>\u003cspan class=\"s\">reasonable\u003c/span>\u003cspan class=\"s\">sensible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">irrational\u003c/span>\u003cspan class=\"a\">illogical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">obvious\u003c/b>\u003cspan class=\"m\">명백한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clear\u003c/span>\u003cspan class=\"s\">evident\u003c/span>\u003cspan class=\"s\">apparent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unclear\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003cspan class=\"a\">ambiguous\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">assemble\u003c/b>\u003cspan class=\"m\">모으다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gather\u003c/span>\u003cspan class=\"s\">collect\u003c/span>\u003cspan class=\"s\">congregate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disperse\u003c/span>\u003cspan class=\"a\">scatter\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">secretly\u003c/b>\u003cspan class=\"m\">은밀히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">covertly\u003c/span>\u003cspan class=\"s\">confidentially\u003c/span>\u003cspan class=\"s\">privately\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">openly\u003c/span>\u003cspan class=\"a\">publicly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">announce\u003c/b>\u003cspan class=\"m\">알리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">declare\u003c/span>\u003cspan class=\"s\">state\u003c/span>\u003cspan class=\"s\">proclaim\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cave in\u003c/b>\u003cspan class=\"m\">굴복하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">yield\u003c/span>\u003cspan class=\"s\">submit\u003c/span>\u003cspan class=\"s\">give in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">resist\u003c/span>\u003cspan class=\"a\">withstand\u003c/span>\u003cspan class=\"a\">defy\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어로 어휘를 넓혀 볼게요. tendency의 동의어는 inclination이나 disposition이고, independent는 autonomous나 self-reliant로 바꿔 쓸 수 있어요. rational의 동의어는 logical, reasonable이고 반의어는 irrational이에요. obvious는 clear, evident와 의미가 같고 반대말은 unclear나 ambiguous죠. 마지막으로 cave in은 yield, give in과 같은 뜻이고 반대말은 resist나 defy예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심리학자 Solomon Asch는\u003c/span>\u003cspan class=\"en\">Psychologist Solomon Asch\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알고 싶었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">discover\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들의 성향이 ~인지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">whether \u003c/span>\u003cspan class=\"tgt\">people's \u003c/span>\u003cspan class=\"tgt\">tendency\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또래들에게 동의하려는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">agree \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">peers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 강한지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">stronger \u003c/span>\u003cspan class=\"tgt\">than\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독립적인 사고를 향한 그들의 성향보다\u003c/span>\u003cspan class=\"en\">their tendency toward independent thought\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이성적인 판단에 대한 성향보다\u003c/span>\u003cspan class=\"en\">and rational judgment.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심리학자 Solomon Asch는 사람들이 독립적인 사고와 이성적인 판단에 대한 성향보다 동료들에게 동의하려는 성향이 더 강한지 어떤지를 알고 싶었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 제시해요. Asch는 사람들이 \u003cb class=\"key\">독립적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>와 이성적 판단보다 \u003cb class=\"key\">동료\u003c/b>에게 동의하려는 성향이 더 강한지 확인하려 했죠. 그래서 뒤에 이어지는 실험 설명이 이 질문에 답하는 구조로 전개돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want + [to discover (to부정사구/목적어)] : \"발견하기를 원했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문(whether절)\u003c/span> : discover + [whether + 주어 + 동사 ~] : \"사람들의 성향이 ~인지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(명사 수식)\u003c/span> : [tendency] + to agree (to부정사구/수식) : \"동의하려는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">비교급 비교\u003c/span> : [stronger (비교급)] + than + [비교 대상] : \"~보다 더 강했다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Psychologist Solomon Asch, 심리학자 Solomon Asch는. wanted to discover, 알고 싶었다. whether people's tendency, 사람들의 성향이 ~인지. to agree with their peers, 또래들에게 동의하려는. was stronger than, 더 강한지. their tendency toward independent thought, 독립적인 사고를 향한 그들의 성향보다. and rational judgment, 그리고 이성적인 판단에 대한 성향보다. 이 문장 전체를 해석하면, 심리학자 Solomon Asch는 사람들이 독립적인 사고와 이성적인 판단에 대한 성향보다 동료들에게 동의하려는 성향이 더 강한지 어떤지를 알고 싶었다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 실험 목적을 제시해요. Asch는 사람들이 독립적 사고와 이성적 판단보다 동료에게 동의하려는 성향이 더 강한지 확인하려 했죠. 그래서 뒤에 이어지는 실험 설명이 이 질문에 답하는 구조로 전개돼요.","hl":"mn"},{"n":14,"text":"첫 번째로, wanted to discover에서 to discover는 want의 목적어 역할을 하는 to부정사예요. 두 번째로, whether people's tendency에서 whether는 '~인지 어떤지'를 만드는 간접의문문이고 discover의 목적어절을 이끌어요. 세 번째로, to agree with their peers에서 to부정사는 앞의 tendency를 수식해 '동의하려는 성향'처럼 형용사적 역할을 해요. 네 번째로, was stronger than은 비교급 stronger와 than이 짝을 이루어 두 성향을 비교하는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Asch는 모았다\u003c/span>\u003cspan class=\"en\">Asch assembled\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열두 명의 대학생들로 이루어진 집단들을\u003c/span>\u003cspan class=\"en\">groups of twelve university students\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 알렸다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">announced \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 참여하고 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">part\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 실험에\u003c/span>\u003cspan class=\"en\">in an experiment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시각적 지각에 관한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">visual \u003c/span>\u003cspan class=\"tgt\">perception\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Asch는 20명의 대학생들로 이루어진 집단들을 모아서, 그들이 시각적 지각에 관한 실험에 참여하고 있다고 알렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Asch가 실험 참가자 집단을 구성하고 실험을 소개하는 장면이에요. 겉으로는 \u003cb class=\"key\">시각 \u003c/b>\u003cb class=\"key\">지각\u003c/b> 실험이라고 알리지만, 실제 목적을 숨긴 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">설계\u003c/b>의 시작이죠. 원문의 twelve는 \u003cb class=\"key\">열두 \u003c/b>\u003cb class=\"key\">명\u003c/b>인데, 제시된 해석에는 스무 명으로 되어 있으니 원문 기준으로는 열두 명으로 기억해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that(목적어)\u003c/span> : announce + [that + 주어 + 동사 ~] : \"~라고 알렸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : was/were + [현재분사(taking)] : \"참여하고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 on(주제·관련)\u003c/span> : an experiment + on + [visual perception] : \"시각적 지각에 관한\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Asch assembled, Asch는 모았다. groups of twelve university students, 열두 명의 대학생들로 이루어진 집단들을. and announced, 그리고 알렸다. that they were taking part, 그들이 참여하고 있다고. in an experiment, 한 실험에. on visual perception, 시각적 지각에 관한. 이 문장 전체를 해석하면, Asch는 20명의 대학생들로 이루어진 집단들을 모아서, 그들이 시각적 지각에 관한 실험에 참여하고 있다고 알렸다.","hl":"m"},{"n":16,"text":"이 문장은 Asch가 실험 참가자 집단을 구성하고 실험을 소개하는 장면이에요. 겉으로는 시각 지각 실험이라고 알리지만, 실제 목적을 숨긴 실험 설계의 시작이죠. 원문의 twelve는 열두 명이라는 뜻이고, 제시된 해석의 스무 명과는 다르니 원문 기준으로 열두 명을 기억해 두세요.","hl":"mn"},{"n":17,"text":"첫 번째로, announced that에서 that은 뒤에 완전한 절을 이끌며 announce의 목적어 역할을 하는 명사절 접속사예요. 두 번째로, were taking part는 was나 were에 현재분사가 붙은 과거진행형으로 '참여하고 있었다'는 뜻을 나타내요. 세 번째로, on visual perception에서 on은 '~에 관한'이라는 주제를 나타내는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그들에게 보여 주었다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">showed \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세 개의 선분들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">line \u003c/span>\u003cspan class=\"tgt\">segments\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 각각에게 물었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">asked\u003c/span> each one\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차례대로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">turn\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 선이 가장 긴지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">line \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">longest\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그들에게 줄 세 조각을 보여주고서 차례대로 어느 줄이 가장 긴지를 각자에게 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Asch가 참가자들에게 세 선분을 보여 주고 차례대로 답하게 한 장면이에요. 과제는 쉬워 보이지만, 뒤에서 또래 압력이 작용할 수 있는 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 만들어요. in turn은 한 사람씩 \u003cb class=\"key\">차례대로\u003c/b> 답하게 했다는 \u003cb class=\"key\">진행 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 보여줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식(수여동사 show)\u003c/span> : show + [간접목적어] + [직접목적어] : \"그들에게 세 개의 선분을 보여주었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 병렬\u003c/span> : [showed] + and + [asked] : \"그리고 물었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용표현(in turn)\u003c/span> : in turn = 차례대로 : \"차례대로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사 which)\u003c/span> : ask + [which + 명사 + 동사 ~] : \"어느 선이 가장 긴지\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He showed them, 그는 그들에게 보여 주었다. three line segments, 세 개의 선분들을. and asked each one, 그리고 각각에게 물었다. in turn, 차례대로. which line was the longest, 어느 선이 가장 긴지. 이 문장 전체를 해석하면, 그는 그들에게 줄 세 조각을 보여주고서 차례대로 어느 줄이 가장 긴지를 각자에게 물었다.","hl":"m"},{"n":19,"text":"이 문장은 Asch가 참가자들에게 세 선분을 보여 주고 차례대로 답하게 한 장면이에요. 과제는 쉬워 보이지만, 뒤에서 또래 압력이 작용할 수 있는 실험 상황을 만들어요. in turn은 한 사람씩 차례대로 답하게 했다는 진행 방식을 보여줘요.","hl":"mn"},{"n":20,"text":"첫 번째로, showed them three line segments는 show가 '~에게 ~을 보여주다'로 쓰인 수여동사 구문이에요. 두 번째로, and asked는 앞의 showed와 asked가 and로 연결된 동사 병렬이에요. 세 번째로, in turn은 '차례대로'라는 관용표현이고, 네 번째로, which line was the longest는 ask의 목적어로 쓰인 간접의문문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 쉬운 일이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> was an easy task\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 정답은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">correct \u003c/span>\u003cspan class=\"tgt\">answer \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">명백했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">obvious\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 쉬운 일이었고 정답은 명백했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 세 개의 선분 중 가장 긴 것을 고르는 과제가 제시되었는데, 이 문장은 그 과제가 \u003cb class=\"key\">눈으로 \u003c/b>\u003cb class=\"key\">보기\u003c/b>만 하면 \u003cb class=\"key\">정답\u003c/b>이 뻔할 만큼 쉬웠다는 점을 못 박아 줍니다. 뒤에서 사람들이 왜 엉뚱한 답을 말했는지를 더 충격적으로 느끼게 하려고 미리 \u003cb class=\"key\">판단 \u003c/b>\u003cb class=\"key\">기준\u003c/b>을 세워 두는 역할이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 it(앞 문장의 내용을 받음)\u003c/span> : [It (대명사)] + be동사 + [보어] : \"그것은 (그 과제는)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and로 두 절을 병렬\u003c/span> : [It was an easy task] + and + [the correct answer was obvious] : \"그리고 정답은 명백했다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It was an easy task, 그것은 쉬운 일이었다. and the correct answer, 그리고 정답은. was obvious, 명백했다. 이 문장 전
