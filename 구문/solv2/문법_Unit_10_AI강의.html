  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 10 의문사 who, what, when","title":"Who, What, When — 궁금한 것을 콕 집어 묻기","audioDir":"문법_Unit_10_audio","preview":false,"count":23,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 10. who, what, when 질문\u003c/div>\u003ch1>Who, What, When — 궁금한 것을 콕 집어 묻기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>who, what, when을 사용해 사람, 사물, 시간에 대한 구체적인 사실 정보를 묻는 질문을 만들 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 함께 영어 문법 공부해 볼까요? 오늘은 who, what, when이 들어간 질문들을 배워 볼 거예요. 이 세 친구들은 모두 우리가 궁금한 사실 정보를 콕 집어 물어볼 때 쓰는 말이에요. 누가 그랬는지, 무엇인지, 언제인지 물어보는 표현을 오늘 확실하게 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">who — 사람에게 묻는 질문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">who\u003c/b>는 \u003cb class=\"key\">사람\u003c/b>에 대한 구체적인 정보를 물을 때 씁니다. who 뒤에 be동사나 일반동사를 넣어 '누구'인지 묻는 질문을 만들 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">Who + be동사 + 주어? = 주어는 누구니?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Who is your English teacher\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">너의 영어 선생님은 누구니?\u003c/div>\u003cdiv class=\"g-note\">who는 사람의 이름이나 신분을 물을 때 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Who made this cake\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">누가 이 케이크를 만들었니?\u003c/div>\u003cdiv class=\"g-note\">누가 했는지 주어를 물을 때는 who 뒤에 동사를 바로 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>who는 \u003cb class=\"key\">사람\u003c/b>을 물을 때만 쓰고, 대답에는 사람 \u003cb class=\"key\">이름\u003c/b>이나 신분이 나와야 자연스러워요.\u003c/div>","segs":[{"n":2,"text":"자, 이제 who부터 살펴볼게요. who는 사람이 누구인지 궁금할 때 쓰는 말이에요. 친구 얼굴이 생각나지 않아서 누구더라 하고 물을 때가 있잖아요. 그럴 때 영어로는 who를 문장 맨 앞에 두고 묻는 거예요. who 뒤에는 be동사나 일반동사를 넣어서 질문 모양을 만들어 주면 됩니다.","hl":"rule"},{"n":3,"text":"Who is your English teacher? 하고 읽어 주세요. 뜻은 너의 영어 선생님은 누구니예요. 맨 앞에 who가 나오면 사람을 묻는 질문이라는 표시가 되는 거죠.","hl":"ex-0"},{"n":4,"text":"Who made this cake? 는 누가 이 케이크를 만들었니라는 뜻이에요. 이때는 who가 주어 자리에 들어가서 who 다음에 바로 동사 made가 오죠. 그래서 대답도 My mom did처럼 사람이 나와야 합니다.","hl":"ex-1"},{"n":5,"text":"한 가지만 기억해요. who를 썼다면 대답은 반드시 사람이어야 해요. 만약 대답이 사물이라면 who가 아니라 what을 써야 한다는 점도 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">what — 사물이나 사실에 묻는 질문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">what\u003c/b>은 사물이나 구체적인 \u003cb class=\"key\">사실\u003c/b> 정보를 물을 때 씁니다. '무엇'이라고 해석하고, 대답으로는 사물이나 행동에 대한 정보가 나옵니다.\u003cdiv>\u003cspan class=\"g-formula\">What + be동사 + 주어? = 주어는 무엇이니?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">What is in your bag\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">네 가방 안에 무엇이 있니?\u003c/div>\u003cdiv class=\"g-note\">what은 사물이 무엇인지 물을 때 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">What do you want\u003c/span> for your birthday?\u003c/div>\u003cdiv class=\"g-ko\">너는 생일 선물로 무엇을 원하니?\u003c/div>\u003cdiv class=\"g-note\">일반동사가 있으면 what 뒤에 do나 does를 넣어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">what\u003c/b> 뒤에 명사가 붙으면 '무슨 ~'이라는 뜻이 돼요. 예를 들어 what time은 \u003cb class=\"key\">몇 시\u003c/b>라는 뜻이에요.\u003c/div>","segs":[{"n":6,"text":"이번에는 what을 볼까요. what은 사물이 무엇인지, 또는 어떤 사실이 무엇인지 궁금할 때 쓰는 말이에요. 우리말로는 무엇이라고 해석하면 됩니다. what 하나만 바꿔도 묻는 대상이 사람에서 사물로 확 바뀌니까 who와 비교해서 들어 보세요.","hl":"rule"},{"n":7,"text":"What is in your bag? 은 네 가방 안에 무엇이 있니라는 뜻이에요. 가방 안에 있는 사물이 궁금하니까 what을 쓴 거죠. 만약 누가 가방 안에 있냐고 사람을 물으면 who를 써야 해요.","hl":"ex-0"},{"n":8,"text":"What do you want for your birthday? 는 너는 생일 선물로 무엇을 원하니라는 뜻이에요. 이렇게 일반동사 want가 있으면 what 뒤에 do를 넣어서 질문 모양을 만들어 줍니다.","hl":"ex-1"},{"n":9,"text":"참고로 what 뒤에 명사가 붙으면 뜻이 조금 달라져요. what time이라고 하면 몇 시라는 뜻이 되니까 함께 기억해 두면 좋아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">when — 시간에 묻는 질문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">when\u003c/b>은 시간이나 날짜처럼 \u003cb class=\"key\">때\u003c/b>에 대한 정보를 물을 때 씁니다. '언제'라고 해석하며, 대답으로는 날짜나 시간이 나옵니다.\u003cdiv>\u003cspan class=\"g-formula\">When + be동사 + 주어? = 주어는 언제니?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">When is your birthday\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">네 생일은 언제니?\u003c/div>\u003cdiv class=\"g-note\">날짜나 때를 물을 때 when을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">When does the school festival start\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">학교 축제는 언제 시작하니?\u003c/div>\u003cdiv class=\"g-note\">일반동사가 있으면 when 뒤에 does를 넣어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>대답이 시간이나 날짜라면 \u003cb class=\"key\">when\u003c/b>, 사람이라면 \u003cb class=\"key\">who\u003c/b>를 골라야 해요.\u003c/div>","segs":[{"n":10,"text":"마지막으로 when이에요. when은 시간이나 날짜, 즉 때에 대해 물어볼 때 쓰는 말이에요. 우리말로는 언제라고 해석하면 되죠. 그래서 when 질문의 대답에는 항상 시간이나 날짜가 나옵니다. 대답을 먼저 보고 when인지 아닌지 판단하는 습관을 들이면 아주 좋아요.","hl":"rule"},{"n":11,"text":"When is your birthday? 는 네 생일은 언제니라는 뜻이에요. 생일은 날짜니까 때를 묻는 when을 쓴 거죠. 대답은 It is in May처럼 때가 나옵니다.","hl":"ex-0"},{"n":12,"text":"When does the school festival start? 는 학교 축제는 언제 시작하니라는 뜻이에요. 일반동사 start가 있으니까 when 뒤에 does를 넣어서 질문을 만들었습니다. 이때 start는 항상 원래 모양 그대로 써요.","hl":"ex-1"},{"n":13,"text":"정리하면 질문을 만들기 전에 대답이 무엇인지 먼저 생각해 보세요. 대답이 시간이면 when, 사람이면 who, 사물이면 what이에요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>What is your birthday?\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ When is your birthday?\u003c/div>\u003cdiv class=\"g-why\">생일은 날짜, 즉 때를 묻는 것이므로 what이 아니라 when을 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>When is your favorite singer?\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Who is your favorite singer?\u003c/div>\u003cdiv class=\"g-why\">좋아하는 가수는 사람이므로 when이 아니라 who를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Who your teacher is?\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Who is your teacher?\u003c/div>\u003cdiv class=\"g-why\">의문문에서는 be동사가 주어 앞으로 나와야 합니다.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"생일은 무엇이 아니라 언제인지 묻는 거잖아요. 그래서 What is your birthday가 아니라 When is your birthday라고 해야 합니다. 대답이 날짜라면 반드시 when이라고 기억해 두세요.","hl":"mk-0"},{"n":15,"text":"좋아하는 가수는 사람이죠. 그런데 when을 쓰면 언제가 좋아하는 가수니라는 이상한 말이 되어 버려요. 사람을 물을 때는 who, 이 한 가지만 기억하면 됩니다.","hl":"mk-1"},{"n":16,"text":"영어 의문문에서는 be동사가 주어보다 앞에 와야 해요. 그래서 Who your teacher is가 아니라 Who is your teacher 순서로 써야 합니다. 어순만 바꿔도 훨씬 자연스러운 문장이 되죠.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 2\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">____ is your birthday? — It is in May.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">When\u003c/span>\u003cdiv class=\"g-exp\">대답이 It is in May로 시간을 나타내므로 때를 묻는 when이 알맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"첫 번째 문제는 빈칸 채우기예요. 빈칸 뒤에 is your birthday가 이어지고, 대답은 It is in May예요. 어떤 말이 들어가야 할지 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":6},{"n":19,"text":"정답은 When이에요. 대답이 It is in May, 즉 오월이라는 시간이니까 때를 묻는 when을 써야 합니다. 만약 what을 넣으면 무엇이 네 생일이니가 되어서 대답과 전혀 맞지 않게 되죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 2\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 대화의 빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">A: ____ made this cake?  B: My mom did.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>Who\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>What\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>When\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>How\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Who\u003c/span>\u003cdiv class=\"g-exp\">대답이 My mom did로 사람을 가리키므로 사람을 묻는 who가 알맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"두 번째 문제는 객관식이에요. 대화를 들어 볼게요. 빈칸 made this cake? 그리고 대답은 My mom did예요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 첫 번째 보기 Who예요. 대답이 My mom did니까 사람을 묻는 질문이에요. What을 쓰면 무엇이 이 케이크를 만들었니가 되어서 사람 대답과 맞지 않고, When은 시간을 묻는 말이라 여기에는 어울리지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 10. who, what, when 질문\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">who\u003c/b>는 \u003cb class=\"key\">사람\u003c/b>에 대한 정보를 물을 때 씁니다.\u003c/li>\u003cli>\u003cb class=\"key\">what\u003c/b>은 사물이나 사실, 즉 \u003cb class=\"key\">무엇\u003c/b>인지 물을 때 씁니다.\u003c/li>\u003cli>\u003cb class=\"key\">when\u003c/b>은 날짜나 시간, 즉 \u003cb class=\"key\">언제\u003c/b>인지 물을 때 씁니다.\u003c/li>\u003cli>질문을 만들기 전에 \u003cb class=\"key\">대답\u003c/b>이 무엇인지 먼저 생각하면 who, what, when을 쉽게 고를 수 있습니다.\u003c/li>\u003c/ul>","segs":[{"n":23,"text":"오늘은 who, what, when 질문을 배웠어요. who는 사람, what은 사물이나 사실, when은 시간을 물을 때 쓴다는 것, 다들 기억하시죠? 질문을 만들 때 대답이 무엇인지 먼저 생각해 보면 세 친구를 헷갈리지 않고 고를 수 있어요. 오늘 배운 표현으로 주변 친구들에게 직접 질문도 해 보면서 연습해 보세요. 수고했어요, 다음 시간에 또 만나요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
