lecturePlayer(document.getElementById("app"),{"brand":"Unit 1 주어와 동사의 이해","title":"Unit 1 주어와 동사의 이해: 동사·대동사·수 일치 핵심 정리","audioDir":"문법_Unit_1_주어와_동사의_이해_2_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 1 주어와 동사의 이해\u003c/div>\u003ch1>Unit 1 주어와 동사의 이해: 동사·대동사·수 일치 핵심 정리\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>문장 구조의 기본인 동사와 대동사를 이해하고, 주어와 동사의 수 일치 원칙을 예문에 적용할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 주어와 동사의 이해 단원을 함께 공부해요. 문장을 이루는 동사의 역할부터 대동사, 주어와 동사의 수 일치까지 예문으로 차근차근 살펴볼게요. 마지막에는 간단한 문제도 함께 풀어 보면서 오늘 배운 내용을 확인해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">동사와 문장 구조, 그리고 명령문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">문장을 구성하려면 반드시 \u003cb class=\"key\">동사\u003c/b>가 필요하고, 두 개 이상의 동사를 쓰려면 \u003cb class=\"key\">접속어구\u003c/b>로 연결해야 합니다. 접속어구가 없으면 두 동사 중 하나는 \u003cb class=\"key\">준동사\u003c/b>여야 합니다. \u003cb class=\"key\">명령문\u003c/b>은 동사원형이 이끌어 문장을 구성합니다.\u003cdiv>\u003cspan class=\"g-formula\">문장 = 주어 + 동사 / 명령문 = 동사원형 + 목적어\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The relationship between money and happiness \u003cspan class=\"fx\">[ is / being ]\u003c/span> a complicated one.\u003c/div>\u003cdiv class=\"g-ko\">돈과 행복의 관계는 복잡한 것이다.\u003c/div>\u003cdiv class=\"g-note\">문장 구성에 반드시 필요한 동사 is가 쓰입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She closed the door and \u003cspan class=\"fx\">[ went / going ]\u003c/span> back to her bed.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 문을 닫고 침대로 돌아갔다.\u003c/div>\u003cdiv class=\"g-note\">접속사 and가 두 동사 closed와 went를 연결합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">[ Take / Taking ]\u003c/span> your umbrella with you on your way out tomorrow morning.\u003c/div>\u003cdiv class=\"g-ko\">내일 아침 나갈 때 우산을 챙겨라.\u003c/div>\u003cdiv class=\"g-note\">동사원형 Take가 이끄는 명령문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">Try to talk to \u003cspan class=\"fx\">yourself\u003c/span> in positive terms.\u003c/div>\u003cdiv class=\"g-ko\">긍정적인 말로 자신에게 말해 보라.\u003c/div>\u003cdiv class=\"g-note\">명령문에서 목적어가 주어 자신이면 재귀대명사 yourself를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>명령문은 앞에 \u003cb class=\"key\">You should\u003c/b>가 생략된 것으로 볼 수 있어 목적어가 주어 자신이면 \u003cb class=\"key\">재귀대명사\u003c/b> yourself를 씁니다.\u003c/div>","segs":[{"n":2,"text":"먼저 문장에는 동사가 꼭 필요하다는 점부터 기억해요. 동사를 두 개 쓰고 싶을 때는 and나 but 같은 접속어구로 연결해야 하고, 접속어구가 없으면 하나는 준동사로 바꿔야 해요. 명령문은 동사원형이 문장을 이끌고, 그 앞에는 You should가 생략된 것으로 볼 수 있어요. 이 원리를 예문으로 하나씩 확인해 볼게요.","hl":"rule"},{"n":3,"text":"The relationship between money and happiness is a complicated one. 돈과 행복의 관계는 복잡한 것이다라는 뜻이에요. 이 문장에서 is는 문장을 구성하는 데 반드시 필요한 동사이고, being은 동사 자리에 혼자 설 수 없어요.","hl":"ex-0"},{"n":4,"text":"She closed the door and went back to her bed. 그녀는 문을 닫고 침대로 돌아갔다는 뜻이에요. and가 closed와 went를 연결해 두 동작을 자연스럽게 이어 주고 있죠.","hl":"ex-1"},{"n":5,"text":"Take your umbrella with you on your way out tomorrow morning. 내일 아침 나갈 때 우산을 챙기라는 뜻이에요. Take가 동사원형으로 시작하는 명령문이라서 Taking이 아니라 Take를 써야 해요.","hl":"ex-2"},{"n":6,"text":"Try to talk to yourself in positive terms. 긍정적인 말로 자신에게 말해 보라는 뜻이에요. 명령문에서 목적어가 주어 자신이면 yourself를 써서 자신에게 말한다는 의미를 분명히 해요.","hl":"ex-3"},{"n":7,"text":"명령문에서는 주어 you가 숨어 있다고 생각하면 편해요. 그래서 목적어가 주어 자신일 때는 yourself 같은 재귀대명사를 씁니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">대동사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞에 나온 \u003cb class=\"key\">동사(구)\u003c/b>의 반복을 피하기 위해 \u003cb class=\"key\">대동사\u003c/b>를 씁니다. 대동사로는 앞에 사용된 동사에 따라 do, be동사, have, 조동사를 사용합니다. 대동사는 대동사가 쓰인 절의 \u003cb class=\"key\">주어의 수·인칭·시제\u003c/b>에 맞춰 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">일반동사 → do[does, did] / be동사·진행형 → be동사 / 완료형 → have[has, had] / 조동사 → 조동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Animals \u003cspan class=\"fx\">do\u003c/span> not express their pain as humans do.\u003c/div>\u003cdiv class=\"g-ko\">동물들은 인간이 아픔을 표현하는 방식처럼 아픔을 표현하지 않는다.\u003c/div>\u003cdiv class=\"g-note\">do는 express their pain을 대신합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Cats \u003cspan class=\"fx\">are\u003c/span> much more sensitive to smell than we are.\u003c/div>\u003cdiv class=\"g-ko\">고양이들은 우리보다 냄새에 훨씬 더 민감하다.\u003c/div>\u003cdiv class=\"g-note\">are는 are sensitive to smell을 대신합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">can\u003c/span> not speak Spanish, but my sister can.\u003c/div>\u003cdiv class=\"g-ko\">나는 스페인어를 말할 수 없지만 내 여동생은 할 수 있다.\u003c/div>\u003cdiv class=\"g-note\">can은 can speak Spanish를 대신합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>일반동사는 \u003cb class=\"key\">do\u003c/b>, be동사와 진행형은 \u003cb class=\"key\">be동사\u003c/b>, 완료형은 \u003cb class=\"key\">have\u003c/b>, 조동사는 \u003cb class=\"key\">조동사\u003c/b>로 받습니다.\u003c/div>","segs":[{"n":8,"text":"이번에는 대동사예요. 앞에 나온 동사구를 똑같이 반복하기 싫을 때 do나 be동사, have, 조동사 같은 대동사로 짧게 받아 줍니다. 이때 대동사는 앞 동사의 종류에 맞추고, 대동사가 쓰인 절의 주어와 시제에도 맞춰야 해요. 예문을 보면 어떤 동사구를 대신하는지 쉽게 알 수 있을 거예요.","hl":"rule"},{"n":9,"text":"Animals do not express their pain as humans do. 동물들은 인간이 아픔을 표현하는 방식처럼 아픔을 표현하지 않는다는 뜻이에요. 뒤의 do는 앞에 나온 express their pain을 대신하는 대동사예요.","hl":"ex-0"},{"n":10,"text":"Cats are much more sensitive to smell than we are. 고양이들은 우리보다 냄새에 훨씬 더 민감하다는 뜻이에요. are는 앞의 are sensitive to smell을 반복하지 않으려고 쓴 be동사 대동사예요.","hl":"ex-1"},{"n":11,"text":"I can not speak Spanish, but my sister can. 나는 스페인어를 말할 수 없지만 내 여동생은 할 수 있다는 뜻이에요. can은 앞의 can speak Spanish를 대신하는 조동사 대동사예요.","hl":"ex-2"},{"n":12,"text":"대동사를 고를 때는 앞에 어떤 동사가 나왔는지를 먼저 보세요. 일반동사면 do, be동사나 진행형이면 be동사, 완료형이면 have, 조동사면 같은 조동사로 받는다고 정리해 두면 좋아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">주어–동사 수 일치: 핵심 주어와 구·절 주어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주어가 길면 \u003cb class=\"key\">수식어\u003c/b>와 구분하여 \u003cb class=\"key\">핵심 주어\u003c/b>의 수에 동사를 일치시킵니다. 핵심 주어는 수식어구의 수식을 받아 마지막에 해석되는 명사(구)입니다. \u003cb class=\"key\">to부정사구\u003c/b>와 \u003cb class=\"key\">동명사구\u003c/b> 주어, \u003cb class=\"key\">명사절\u003c/b> 주어는 단수동사를 씁니다. 동격절을 수반한 명사(구)는 \u003cb class=\"key\">명사의 수\u003c/b>에 동사의 수를 일치시킵니다.\u003cdiv>\u003cspan class=\"g-formula\">수식어 + 핵심 주어 → 핵심 주어의 수 / to부정사구·동명사구·명사절 주어 → 단수동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Opportunities to work abroad \u003cspan class=\"fx\">[ is / are ]\u003c/span> limited to a very few people.\u003c/div>\u003cdiv class=\"g-ko\">해외에서 일할 기회는 극소수에게 제한되어 있다.\u003c/div>\u003cdiv class=\"g-note\">to부정사구의 수식을 받는 핵심 주어 Opportunities가 복수라 are를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The income gap between genders \u003cspan class=\"fx\">[ is / are ]\u003c/span> decreasing in many countries.\u003c/div>\u003cdiv class=\"g-ko\">성별 간 소득 격차는 많은 나라에서 줄고 있다.\u003c/div>\u003cdiv class=\"g-note\">전치사구의 수식을 받는 핵심 주어 The income gap이 단수라 is를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Wearing masks \u003cspan class=\"fx\">helps\u003c/span> protect us and everyone around us.\u003c/div>\u003cdiv class=\"g-ko\">마스크를 쓰는 것은 우리와 주변 모든 사람을 보호하는 데 도움이 된다.\u003c/div>\u003cdiv class=\"g-note\">동명사구 주어 Wearing masks는 단수 취급해 helps를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">The evidence that the new drugs are better \u003cspan class=\"fx\">[ is / are ]\u003c/span> weak.\u003c/div>\u003cdiv class=\"g-ko\">새 약이 더 낫다는 증거는 약하다.\u003c/div>\u003cdiv class=\"g-note\">동격절을 수반한 명사 The evidence가 단수라 is를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>전치사구, 형용사구, 분사구, to부정사구, 관계사절 같은 \u003cb class=\"key\">수식어\u003c/b>는 주어의 수를 결정하지 않습니다. \u003cb class=\"key\">동격절\u003c/b>이 붙어도 동사의 수는 핵심 명사에 맞춥니다.\u003c/div>","segs":[{"n":13,"text":"주어가 길어질 때는 당황하지 말고 핵심 주어를 찾아야 해요. 전치사구나 to부정사구, 분사구, 관계사절 같은 수식어는 주어의 수를 결정하지 않고, 수식어를 걷어 낸 뒤 마지막에 해석되는 명사가 진짜 주어예요. to부정사구나 동명사구, 명사절이 주어일 때는 단수동사를 쓴다는 점도 꼭 기억해요. 동격절이 붙은 명사는 그 명사의 수에 동사를 맞춥니다. 예문으로 핵심 주어를 직접 찾아볼게요.","hl":"rule"},{"n":14,"text":"Opportunities to work abroad are limited to a very few people. 해외에서 일할 기회는 극소수에게 제한되어 있다는 뜻이에요. to work abroad는 Opportunities를 꾸미는 수식어이고, 핵심 주어 Opportunities가 복수라서 are를 써요.","hl":"ex-0"},{"n":15,"text":"The income gap between genders is decreasing in many countries. 성별 간 소득 격차는 많은 나라에서 줄고 있다는 뜻이에요. between genders를 걷어 내면 핵심 주어 The income gap이 단수라서 is가 맞아요.","hl":"ex-1"},{"n":16,"text":"Wearing masks helps protect us and everyone around us. 마스크를 쓰는 것은 우리와 주변 모든 사람을 보호하는 데 도움이 된다는 뜻이에요. 동명사구 Wearing masks가 주어라서 단수동사 helps를 써요.","hl":"ex-2"},{"n":17,"text":"The evidence that the new drugs are better is weak. 새 약이 더 낫다는 증거는 약하다는 뜻이에요. that the new drugs are better는 The evidence와 동격인 절이고, 동사의 수는 핵심 명사 The evidence에 맞춰 is를 써요.","hl":"ex-3"},{"n":18,"text":"수식어는 주어를 자세히 설명해 줄 뿐 동사의 수를 바꾸지 않아요. 전치사구나 분사구, to부정사구, 관계사절이 보이면 잠시 걷어 내고 핵심 주어만 남겨 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">단수·복수 취급하는 주어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">one of\u003c/b>, \u003cb class=\"key\">each of\u003c/b>, every로 시작하는 주어는 단수 취급하고, either of, neither of도 원칙적으로 단수 취급합니다. \u003cb class=\"key\">the + 형용사\u003c/b>가 ‘~한 사람들’이라는 뜻이면 복수 취급하고, \u003cb class=\"key\">police\u003c/b>와 cattle 같은 집합명사는 항상 복수 취급합니다. \u003cb class=\"key\">a number of\u003c/b>는 복수 취급하고, \u003cb class=\"key\">the number of\u003c/b>는 단수 취급합니다.\u003cdiv>\u003cspan class=\"g-formula\">one of·each of·every·either of·neither of → 단수 / the + 형용사·police·cattle·a number of → 복수 / the number of → 단수\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">One of the passengers \u003cspan class=\"fx\">[ was / were ]\u003c/span> injured in the car accident.\u003c/div>\u003cdiv class=\"g-ko\">승객 중 한 명이 자동차 사고에서 다쳤다.\u003c/div>\u003cdiv class=\"g-note\">one of + 복수명사 + 단수동사 was를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Each of the explanations \u003cspan class=\"fx\">[ has / have ]\u003c/span> its merits and shortcomings.\u003c/div>\u003cdiv class=\"g-ko\">각 설명에는 각각 장점과 단점이 있다.\u003c/div>\u003cdiv class=\"g-note\">each of + 복수명사 + 단수동사 has를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The rich \u003cspan class=\"fx\">[ pays / pay ]\u003c/span> more taxes because they earn more money.\u003c/div>\u003cdiv class=\"g-ko\">부자들은 더 많은 돈을 벌기 때문에 더 많은 세금을 낸다.\u003c/div>\u003cdiv class=\"g-note\">the rich는 ‘부자들’이라는 복수 보통명사라 pay를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">The police \u003cspan class=\"fx\">[ is / are ]\u003c/span> looking for a man with blonde hair.\u003c/div>\u003cdiv class=\"g-ko\">경찰은 금발 머리 남자를 찾고 있다.\u003c/div>\u003cdiv class=\"g-note\">police는 항상 복수 취급하므로 are를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">a number of\u003c/b>는 ‘다수의’라 복수 취급하고, \u003cb class=\"key\">the number of\u003c/b>는 ‘~의 수’라 단수 취급합니다. \u003cb class=\"key\">상관접속사\u003c/b>로 연결된 주어는 뒤에 나온 명사의 수에 맞춥니다.\u003c/div>","segs":[{"n":19,"text":"마지막으로 단수와 복수 취급을 구분해 볼게요. one of나 each of, every로 시작하는 주어는 단수로 보고, the rich처럼 the와 형용사가 사람들을 뜻할 때는 복수로 봐요. police와 cattle은 항상 복수 취급하고, a number of는 다수라서 복수, t
