PYD+X+fpTchQSAOORgjr0OOvt0/ImjIGfmGPw75PX/PfPrSgAA5BKgEjpzgZxk8fnk/zoIk+iXNdbLW6stPXVf1qf/Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Power of Encouragement: Rekindling Our Inner Light<small>격려의 힘: 우리의 내면을 다시 밝히는 것</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 살면서 누군가의 말 한마디나 행동 덕분에 힘든 시기를 극복하고 다시 시작할 용기를 얻었던 경험이 있나요? 이 글은 &#39;사회적 지지(Social Support)&#39;가 인간의 심리에 얼마나 큰 힘을 발휘하는지를 잘 보여줍니다. 사회적 지지란 주변 사람들과 맺는 정서적 연결이나 도움을 의미하는데, 이는 심리학적으로 우리의 뇌가 스트레스를 처리하는 방식에 긍정적인 영향을 줍니다. 마치 불이 꺼진 촛불이 옆의 촛불로부터 다시 불꽃을 옮겨받는 것처럼, 인간은 서로의 격려를 통해 회복탄력성(Resilience)을 얻고 다시 나아갈 동력을 얻게 되죠. 결국 이 지문은 우리 삶을 지탱하는 것이 혼자만의 힘이 아니라, 타인과의 따뜻한 관계에서 오는 심리적 에너지라는 점을 강조하고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01삶의 시련</div><ul><li>누구나 살다 보면 내면의 열정과 희망이 꺼지는 순간을 경험하게 된다.</li><li>삶의 빛(light)이 일시적으로 사라짐</li><li>내면의 에너지가 고갈되는 시기</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02회복의 계기</div><ul><li>타인의 도움이나 격려를 통해 잃어버렸던 열정을 다시 불러일으킬 수 있다.</li><li>타인의 작은 도움(spark)이 희망을 다시 지핌</li><li>재점화(rekindled)되는 내면의 힘</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03감사의 마음</div><ul><li>우리를 다시 일어서게 해준 소중한 사람들에게 깊은 고마움을 느껴야 한다.</li><li>자신을 일깨워준 사람들에 대한 감사(gratitude)</li><li>내면의 불꽃(flame)을 다시 켜준 이들의 존재</li><li>핵심 키워드: 감사(gratitude), 재점화(rekindled)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at times</td><td class=\"m\">가끔, 때때로</td></tr><tr><td class=\"w\">light</td><td class=\"m\">빛</td></tr><tr><td class=\"w\">go out</td><td class=\"m\">(불·전등이) 꺼지다</td></tr><tr><td class=\"w\">rekindle</td><td class=\"m\">다시 불붙이다, 다시 불러일으키다</td></tr><tr><td class=\"w\">spark</td><td class=\"m\">불꽃, 불똥</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cause</td><td class=\"m\">이유, 근거</td></tr><tr><td class=\"w\">gratitude</td><td class=\"m\">감사, 고마움</td></tr><tr><td class=\"w\">flame</td><td class=\"m\">불꽃, 화염</td></tr><tr><td class=\"w\">within</td><td class=\"m\">~의 내부에, 안에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">‘elephant in the room’은</span><span class=\"en\"><b>The <span class=\"grammar-hl\">‘elephant in the room’</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영어 표현이다</span><span class=\"en\"><b>is an English idiom</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">명백한 진실을 가리키는</span><span class=\"en\"><b>for an obvious truth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무시되거나</span><span class=\"en\"><b><span class=\"grammar-hl\">that is being ignored</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">언급되지 않는</span><span class=\"en\"><b>or <span class=\"grammar-hl\">goes unaddressed</span>.</b></span></div></div><div class=\"lec-sent-ko\">(‘elephant in the room’은 무시되거나 언급되지 않는 명백한 진실을 가리키는 영어 표현이다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 light는 사전적으로는 &#39;빛&#39;이지만, 여기서는 인생의 희망이나 열정을 의미합니다. goes out은 &#39;나가다&#39;라는 뜻도 있지만, 여기서는 불이 &#39;꺼지다&#39;라는 의미로 쓰여 우리 내면의 활기가 사라진 상태를 나타냅니다. rekindled는 &#39;다시 불을 붙이다&#39;라는 뜻으로, 좌절했던 삶에 다시 생명력을 불어넣는 과정을 강조합니다. 앞 문장에서 우리가 살면서 겪는 일시적인 침체나 절망을 언급하고, 뒤에서는 그것이 타인의 도움으로 회복될 수 있음을 보여주며 대조를 이룹니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">‘elephant in the room’ (관용표현): 특정 상황에서 모두가 알고 있지만 언급하기를 꺼리는 문제를 뜻하는 영어 이디엄이다.</div><div class=\"lec-gr-item\">that is being ignored (관계대명사): that은 선행사 obvious truth를 수식하며 절 내부에서 주어 역할을 한다. 현재진행 수동태(be+being+p.p.) 구조로 &#39;무시되고 있는&#39;이라는 의미를 갖는다.</div><div class=\"lec-gr-item\">goes unaddressed (과거분사): unaddressed는 &#39;다루어지지 않은&#39;이라는 상태를 나타내며, 주어(truth)의 상태를 설명하는 보어 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각에 근거하고 있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">is based on</span> <span class=\"grammar-hl\">the idea</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방안에 있는 코끼리를</span><span class=\"en\"><b><span class=\"grammar-hl\">that an elephant in a room</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">못 본체 하는 것이 불가능하다는</span><span class=\"en\"><b><span class=\"grammar-hl\">would be impossible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각에 근거하고 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">to overlook</span>;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러므로,</span><span class=\"en\"><b>thus,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘방안에 있는 코끼리’를 무시하는 사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">people who ignore ‘the elephant in the room’</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관심을 갖는다</span><span class=\"en\"><b>concern themselves</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작고 무관한 문제들에</span><span class=\"en\"><b>with small and irrelevant issues</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 문제를 해결하기보다는</span><span class=\"en\"><b><span class=\"grammar-hl\">rather than deal with</span> the big one.</b></span></div></div><div class=\"lec-sent-ko\">(이것은 방안에 있는 코끼리를 못 본체 하는 것이 불가능하다는 생각에 근거하고 있다. 그러므로, ‘방안에 있는 코끼리’를 무시하는 사람들은 큰 문제를 해결하기보다는 작고 무관한 문제들에 관심을 갖는다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> cause는 단순히 &#39;원인&#39;이라는 뜻도 있지만, 여기서는 &#39;마땅히 ~할 이유&#39;라는 의미로 쓰였습니다. lighted the flame은 앞 문장의 rekindled와 연결되는 표현으로, 상대방이 우리에게 준 영향력을 &#39;불꽃을 밝히는 행위&#39;라는 은유로 표현했습니다. 전체 문맥상, 우리 삶의 어려운 순간을 누군가의 도움으로 극복했음을 인정하고 그들에게 고마워해야 한다는 결론을 이끌어냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is based on (수동태): be동사(is)+p.p.(based) 구조. base는 타동사(base A on B: A의 근거를 B에 두다)인데 목적어가 없어서 수동구조 is based on 형태로 쓴다.</div><div class=\"lec-gr-item\">the idea that an elephant in a room would be impossible to overlook 동격의 that: 명사(idea) + that + S + V 구조로, that절이 앞의 idea라는 명사의 구체적인 내용을 설명하고 있다.</div><div class=\"lec-gr-item\">to overlook (to부정사): 앞의 형용사 impossible을 수식하는 부사적 용법으로, 문맥상 &#39;간과하기에는&#39;이라는 의미로 쓰였다.</div><div class=\"lec-gr-item\">people who ignore ‘the elephant in the room’ (관계대명사): who는 선행사 people을 수식하며 절 내부에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">rather than deal with (to부정사): rather than 뒤에 이어지는 원형 부정사구로, 앞의 동사 concern themselves와 대조되는 행동을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 표현은</span><span class=\"en\"><b>This idiomatic expression</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 사용된다</span><span class=\"en\"><b><span class=\"grammar-hl\">is often used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문제를 말할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">to describe</span> <span class=\"grammar-hl\">an issue</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사회적으로 금기시되는 것들,</span><span class=\"en\"><b><span class=\"grammar-hl\">that involves a social taboo</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인종차별이나 종교와 같은</span><span class=\"en\"><b>such as racism or religion,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 사람들이 여기지만</span><span class=\"en\"><b><span class=\"grammar-hl\">which everyone understands</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문제라고</span><span class=\"en\"><b><span class=\"grammar-hl\">to be an issue</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 아무도</span><span class=\"en\"><b>but <span class=\"grammar-hl\">which no one</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">논의하지 않으려고 하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">is willing to discuss</span>.</b></span></div></div><div class=\"lec-sent-ko\">(이 표현은 종종 인종차별이나 종교와 같은 사회적으로 금기시되는 것들, 즉 모든 사람들이 문제라고 여기지만 아무도 논의하지 않으려고 하는 것을 말할 때 사용된다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is often used to describe (수동태): be동사(is)+p.p.(used) 구조. use는 타동사(use A to V: A를 V하기 위해 사용하다)인데 목적어가 없어서 수동구조 is used to V 형태로 쓴다.</div><div class=\"lec-gr-item\">an issue that involves a social taboo (관계대명사): that은 선행사 an issue를 수식하며 절 내부에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">which everyone understands to be an issue (관계대명사): which는 선행사 social taboo를 수식하며 절 내부에서 목적어 역할을 한다. 5형식(understand + O + to V) 구조가 사용되었다.</div><div class=\"lec-gr-item\">which no one is willing to discuss (관계대명사): which는 선행사 an issue를 수식하며 절 내부에서 discuss의 목적어 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 표현은</span><span class=\"en\"><b>The idiom</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 가끔 사용되기도 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">is also occasionally used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘pink elephant’라는 표현으로</span><span class=\"en\"><b>as ‘a pink elephant’</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이유로</span><span class=\"en\"><b><span class=\"grammar-hl\">for the reason</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분홍색 코끼리가</span><span class=\"en\"><b><span class=\"grammar-hl\">that a pink elephant</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘 보일 것이라는</span><span class=\"en\"><b><span class=\"grammar-hl\">would be more visible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">평범한 코끼리보다</span><span class=\"en\"><b>than a normal elephant.</b></span></div></div><div class=\"lec-sent-ko\">(이 표현은 또한 평범한 코끼리보다 분홍색 코끼리가 더 잘 보일 것이라는 이유로 ‘pink elephant’라는 표현으로 사용되기도 한다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is also occasionally used (수동태): be동사(is)+p.p.(used) 구조. use는 타동사인데 목적어가 없어서 수동구조 is used 형태로 쓴다.</div><div class=\"lec-gr-item\">for the reason that a pink elephant would be more visible 동격의 that: 명사(reason) + that + S + V 구조로, that절이 앞의 명사 reason의 내용을 구체적으로 설명한다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인생을 살다 보면 의욕이 사라지거나 힘든 시기를 겪기도 한다.</li><li>하지만 타인의 도움이나 관심 덕분에 우리는 다시 열정을 회복할 수 있다.</li><li>우리 내면의 빛을 다시 밝혀준 이들에게 깊은 감사를 표하는 것은 당연한 일이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">We sometimes lose our inner motivation when facing hardships, yet we are able to regain it through the support we receive from others.</div>\n              <div class=\"lec-final-sum-ko\">우리는 때때로 어려움에 직면할 때 내면의 동기를 잃지만, 타인에게 받는 지지를 통해 그것을 다시 되찾을 수 있다.</div></div></div>"],"segs":[[{"audio":"./passage3_audio/1.mp3","hl":null}],[{"audio":"./passage3_audio/2.mp3","hl":null}],[{"audio":"./passage3_audio/3.mp3","hl":null},{"audio":"./passage3_audio/4.mp3","hl":"stage-0"},{"audio":"./passage3_audio/5.mp3","hl":"stage-1"},{"audio":"./passage3_audio/6.mp3","hl":"stage-2"}],[
