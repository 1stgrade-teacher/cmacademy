A1/5/Q0m+PBG5SSeDkdz6A/5zyeKXcq4OVz1Bz+Pr2x/POeMKz7b7eYl2ab9fl5u+/wCHV7oQfbr04B7g/l14Ht3p2OT7dcfqf5en+AWAAJONx5GeDknjrx+vH6puX1A9Rkf/AF+vb9emafy/rTf+t3qzOTk01yu3VWT3t1V9L/1qKCOATt5xnjp37jP+Bwe2GuVCuAyse2OnPHX055+nvTHdeVBBHQ/MBnOODwemO+Bx2zy3pkcEkArg8kZP3R3GcH8OcLuIqKWjur320va6fy2b01/IVtN9d0u6Vm/wZ//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Understanding the Idiom: The Elephant in the Room<small>관용구 이해하기: 방 안의 코끼리</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 모두가 다 알고 있지만 굳이 입 밖으로 꺼내기 꺼리는 상황을 마주해 본 적 있나요? 이 지문에 등장하는 &#39;방 안의 코끼리(elephant in the room)&#39;는 바로 그런 모두가 알고 있지만 침묵하는 불편한 진실을 뜻하는 관용구예요. 마치 거대한 코끼리가 좁은 방에 들어와 있다면 누구라도 바로 알아챌 수밖에 없는데, 다들 모르는 척하며 엉뚱한 이야기만 나누는 상황을 떠올리면 이해하기 쉬워요. 이러한 현상은 사회적 금기(social taboo)나 민감한 갈등 상황에서 자주 나타나는데, 갈등을 회피하려는 심리 때문에 공동체가 중요한 문제를 외면하게 되는 맥락을 담고 있습니다. 이 표현을 정확히 이해하면 뉴스나 일상 대화에서 사람들이 왜 중요한 문제를 두고도 침묵하는지 그 숨은 이유를 더 깊이 파악할 수 있을 거예요.</div></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">‘elephant in the room’은</span><span class=\"en\"><b>The <span class=\"grammar-hl\">‘elephant in the room’</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영어 표현이다</span><span class=\"en\"><b>is an English idiom</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">명백한 진실을 가리키는</span><span class=\"en\"><b>for an obvious truth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무시되거나</span><span class=\"en\"><b><span class=\"grammar-hl\">that is being ignored</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">언급되지 않는.</span><span class=\"en\"><b><span class=\"grammar-hl\">or goes unaddressed</span>.</b></span></div></div><div class=\"lec-sent-ko\">‘elephant in the room’은 무시되거나 언급되지 않는 명백한 진실을 가리키는 영어 표현이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 소재인 ‘방 안의 코끼리’라는 관용구의 사전적 정의를 소개하며 글의 서두를 엽니다. 여기서 idiom은 사전적으로 &#39;관용구&#39;이지만, 여기서는 언어 속에 녹아 있는 문화적 약속이라는 의미를 가집니다. 필자는 사람들이 알면서도 회피하는 불편한 진실을 &#39;코끼리&#39;라는 아주 크고 눈에 띄는 존재에 비유했음을 명확히 하려고 이 표현을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">‘elephant in the room’ (관용표현): 의미를 명확히 알기 힘든 특정 대상이나 상황을 비유적으로 표현한 영어 관용구입니다.</div><div class=\"lec-gr-item\">that is being ignored or goes unaddressed (관계대명사): that이 주격 관계대명사로 쓰여 앞의 선행사 &#39;an obvious truth&#39;를 수식하며, 뒤에 주어가 빠진 절이 이어집니다.</div><div class=\"lec-gr-item\">is being ignored (수동태): be동사(is)+현재분사(being)+과거분사(ignored)가 결합한 현재진행 수동태 구조입니다. 기본구조: ignore + O(목적어) 형태인데 목적어가 주어로 올라가 수동구조가 되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각에 근거하고 있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">is based on</span> <span class=\"grammar-hl\">the idea</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방안에 있는 코끼리를</span><span class=\"en\"><b><span class=\"grammar-hl\">that an elephant in a room</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">못 본체 하는 것이 불가능하다는.</span><span class=\"en\"><b><span class=\"grammar-hl\">would be impossible to overlook</span>;</b></span></div></div><div class=\"lec-sent-ko\">(이것은 방안에 있는 코끼리를 못 본체 하는 것이 불가능하다는 생각에 근거하고 있다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 정의를 구체화하며 이 관용구가 왜 생겨났는지 원리를 설명합니다. overlook은 &#39;내려다보다&#39;가 사전적 의미이지만, 여기서는 &#39;간과하다, 못 본 체 넘어가다&#39;라는 뜻입니다. 코끼리가 방에 있다면 절대로 놓칠 수 없다는 점을 강조하여, 그 문제를 애써 외면하는 사람들의 태도가 얼마나 비현실적인지를 부각하기 위해 이 단어를 사용했습니다. 1번 문장의 정의를 논리적 근거와 함께 보충하는 구조입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is based on (수동태): be동사(is)+p.p.(based) 구조입니다. base는 타동사(base A on B: A를 B에 근거를 두다)인데 목적어가 주어로 이동하여 수동태가 되었습니다.</div><div class=\"lec-gr-item\">the idea that an elephant in a room would be impossible to overlook 동격의 that: 명사(idea) 뒤에서 that절이 앞의 idea가 구체적으로 무엇인지 그 내용을 상세히 설명하는 구조입니다.</div><div class=\"lec-gr-item\">impossible to overlook (to부정사): 형용사(impossible)를 뒤에서 수식하는 부사적 용법으로, 문맥상 &#39;간과하기에 불가능한&#39;이라는 의미를 형성합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러므로,</span><span class=\"en\"><b>thus,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘방안에 있는 코끼리’를 무시하는 사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">people who ignore</span> <span class=\"grammar-hl\">‘the elephant in the room’</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작고 무관한 문제들에 관심을 갖는데</span><span class=\"en\"><b>concern themselves with small and irrelevant issues</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 문제를 해결하기보다는.</span><span class=\"en\"><b><span class=\"grammar-hl\">rather than deal with</span> the big one.</b></span></div></div><div class=\"lec-sent-ko\">(그러므로, ‘방안에 있는 코끼리’를 무시하는 사람들은 큰 문제를 해결하기보다는 작고 무관한 문제들에 관심을 갖는다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 관용구가 실제 현실에서 어떻게 적용되는지 구체적인 사례를 제시합니다. willing은 사전적으로 &#39;기꺼이 ~하는&#39;이지만, 여기서는 &#39;하고 싶어 하다, 의지를 가지다&#39;라는 의미로 쓰였습니다. 중요한 문제임에도 불구하고 아무도 입 밖에 내지 않으려는 사회적 분위기를 대비시켜, 이 표현이 가진 비판적인 성격을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">people who ignore (관계대명사): 주격 관계대명사 who가 앞의 명사(people)를 수식하며, 절 내부에서 주어 역할을 합니다.</div><div class=\"lec-gr-item\">‘the elephant in the room’ (관용표현): 모두가 알고 있지만 언급하기를 꺼리는 거대한 문제를 뜻하는 숙어입니다.</div><div class=\"lec-gr-item\">rather than deal with (to부정사): 관용적 표현(rather than) 뒤에 생략된 to부정사 구조로, &#39;deal with하는 것보다는&#39;이라는 선택의 의미를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 표현은</span><span class=\"en\"><b>This idiomatic expression</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 사용되는데</span><span class=\"en\"><b><span class=\"grammar-hl\">is often used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문제를 말할 때</span><span class=\"en\"><b>to describe <span class=\"grammar-hl\">an issue</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사회적으로 금기시되는 것들이 포함된</span><span class=\"en\"><b><span class=\"grammar-hl\">that involves a social taboo</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인종차별이나 종교와 같은</span><span class=\"en\"><b>such as racism or religion,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 사람들이 문제라고 여기지만</span><span class=\"en\"><b><span class=\"grammar-hl\">which everyone understands to be an issue</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아무도 논의하지 않으려고 하는.</span><span class=\"en\"><b>but <span class=\"grammar-hl\">which no one is willing to discuss</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 표현은 종종 인종차별이나 종교와 같은 사회적으로 금기시되는 것들, 즉 모든 사람들이 문제라고 여기지만 아무도 논의하지 않으려고 하는 것을 말할 때 사용된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 관용구가 실제 현실에서 어떻게 적용되는지 구체적인 사례를 제시합니다. willing은 사전적으로 &#39;기꺼이 ~하는&#39;이지만, 여기서는 &#39;하고 싶어 하다, 의지를 가지다&#39;라는 의미로 쓰였습니다. 중요한 문제임에도 불구하고 아무도 입 밖에 내지 않으려는 사회적 분위기를 대비시켜, 이 표현이 가진 비판적인 성격을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is often used (수동태): be동사(is)+p.p.(used) 구조입니다. 기본구조: use + O + to-v (A를 v하는 데 사용하다/묘사하다) 형태에서 목적어가 주어로 이동하여 수동태가 되었습니다.</div><div class=\"lec-gr-item\">an issue that involves a social taboo (관계대명사): 주격 관계대명사 that이 선행사(an issue)를 수식하며, 절 내부에서 주어 역할을 합니다.</div><div class=\"lec-gr-item\">which everyone understands to be an issue 5형식(SVOC) 구조: 관계대명사 which절 내부에서 understand(동사) + everyone(목적어) + to be an issue(목적보어)의 5형식 구조가 사용되었습니다.</div><div class=\"lec-gr-item\">which no one is willing to discuss (관계대명사): 목적격 관계대명사 which가 선행사(an issue)를 수식하며, discuss 뒤의 목적어 자리가 빠져 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 표현은</span><span class=\"en\"><b><span class=\"grammar-hl\">The idiom</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 가끔 사용되는데</span><span class=\"en\"><b><span class=\"grammar-hl\">is also occasionally used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘pink elephant’라는 표현으로</span><span class=\"en\"><b>as ‘a pink elephant’</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이유로</span><span class=\"en\"><b>for the reason that</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분홍색 코끼리가</span><span class=\"en\"><b>a pink elephant</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘 보일 것이라는</span><span class=\"en\"><b>would be <span class=\"grammar-hl\">more visible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">평범한 코끼리보다.</span><span class=\"en\"><b><span class=\"grammar-hl\">than a normal elephant</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 표현은 또한 평범한 코끼리보다 분홍색 코끼리가 더 잘 보일 것이라는 이유로 ‘pink elephant’라는 표현으로 사용되기도 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> ‘방 안의 코끼리’라는 표현의 변형된 형태를 소개하며 글을 마무리합니다. visible은 &#39;눈에 보이는&#39;이라는 뜻이지만, 여기서는 &#39;확연히 드러나는, 무시할 수 없는&#39;이라는 강조의 의미를 가집니다. 일반 코끼리보다 눈에 띄는 분홍색 코끼리를 언급함으로써, 문제를 외면하려는 인간의 심리를 더욱 극명하게 대비시키려는 필자의 의도가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The idiom is also occasionally used (수동태): be동사(is)+p.p.(used) 구조입니다. 기본구조: use + O (O를 사용하다) 형태에서 목적어가 주어로 이동하였습니다.</div><div class=\"lec-gr-item\">more visible than a normal elephant 비교급 관용표현: &#39;더 ~한&#39;이라는 의미를 강조하기 위해 형용사(visible)에 more를 붙여 비교하는 표현입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>‘방 안의 코끼리’는 모두가 알지만 다루기 꺼려하여 무시하는 명백한 진실을 뜻한다.</li><li>코끼리는 방 안에서 놓칠 수 없는 거대한 존재이기에, 이를 무시하는 것은 사소한 일에만 집착하는 행동이다.</li><li>주로 인종 차별이나 종교 등 사회적 금기와 관련된 불편한 진실을 지칭할 때 사용된다.</li><li>때로는 더욱 눈에 잘 띄는 ‘분홍색 코끼리’라는 표현으로 변형되어 사용되기도 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The idiom refers to an obvious but unaddressed issue, and it is frequently used to describe sensitive topics that people prefer to ignore.</div>\n              <div class=\"lec-final-sum-ko\">이 관용구는 명백하지만 다뤄지지 않는 문제를 의미하며, 사람들이 무시하길 선호하는 민감한 주제를 설명할 때 자주 사용된다.</div></div></div>"],"segs":[[{"audio":"./passage3_audio/1.mp3","hl":null}],[{"audio":"./passage3_audio/2.mp3","hl":null}],[{"audio":"./passage3_audio/3.mp3","hl":"main"},{"audio":"./passage3_audio/4.mp3","hl":"meaning"},{"audio":"./passage3_audio/5.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/6.mp3","hl":"main"},{"audio":"./passage3_audio/7.mp3","hl":"meaning"},{"audio":"./passage3_audio/8.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/9.mp3","hl":"main"},{"audio":"./passage3_audio/10.mp3","hl":"meaning"},{"audio":"./passage3_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/12.mp3","hl":"main"},{"audio":"./passage3_audio/13.mp3","hl":"meaning"},{"audio":"./passage3_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/15.mp3","hl":"main"},{"audio":"./passage3_audio/16.mp3","hl":"meaning"},{"audio":"./passage3_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/18.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
