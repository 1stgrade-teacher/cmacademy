</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"관계사의 기본 역할","title":"관계사의 기본 역할 마스터하기","audioDir":"lecture_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">06강 관계사의 기본 역할\u003c/div>\u003ch1>관계사의 기본 역할 마스터하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>관계대명사와 관계부사의 기본 개념을 이해하고 문장 속에서 올바르게 사용할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘 우리는 영문법에서 정말 중요한 관계사의 기본 역할을 함께 공부해 볼 거예요. 관계대명사와 관계부사가 문장에서 어떻게 쓰이는지 선생님과 차근차근 알아보아요. 오늘 수업을 열심히 듣고 나면 긴 문장도 전혀 어렵지 않게 해석할 수 있을 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">관계대명사의 역할과 종류\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">관계대명사\u003c/b>는 \u003cb class=\"key\">who, that, which, whose\u003c/b> 등이 있으며, 이들이 이끄는 절 안에서 주어, 목적어, 보어, 소유대명사 역할을 해요.\u003cdiv>\u003cspan class=\"g-formula\">선행사 + 관계대명사 + 불완전한 문장\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">People \u003cspan class=\"fx\">who\u003c/span> love the color orange love having fun with their friends.\u003c/div>\u003cdiv class=\"g-ko\">사람들 / 오렌지색을 좋아하는 / 친구들과 노는 것을 좋아한다.\u003c/div>\u003cdiv class=\"g-note\">주격 관계대명사 who가 people을 꾸며줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">There is no culture \u003cspan class=\"fx\">which\u003c/span> is superior or inferior to others.\u003c/div>\u003cdiv class=\"g-ko\">문화는 없다 / 다른 문화에 비해서 우월하거나 열등한.\u003c/div>\u003cdiv class=\"g-note\">주격 관계대명사 which가 culture를 꾸며줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The friendships \u003cspan class=\"fx\">that\u003c/span> you make in high school last your whole life.\u003c/div>\u003cdiv class=\"g-ko\">우정 / 당신이 고등학교에서 맺는 / 평생 동안 지속된다.\u003c/div>\u003cdiv class=\"g-note\">목적격 관계대명사 that이 friendships를 꾸며줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">I wouldn’t fly with an airline \u003cspan class=\"fx\">whose\u003c/span> safety record is bad.\u003c/div>\u003cdiv class=\"g-ko\">나는 항공사로 비행하지 않을 것이다 / 그 항공사의 안전 기록이 좋지 않은.\u003c/div>\u003cdiv class=\"g-note\">소유격 관계대명사 whose가 airline의 소유를 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>관계대명사 \u003cb class=\"key\">that\u003c/b>은 사람과 사물 모두에 쓸 수 있으며, 전치사의 목적어로 쓰인 \u003cb class=\"key\">목적격 관계대명사\u003c/b>는 생략할 수 있어요.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념은 관계대명사예요. 관계대명사 who, that, which, whose는 이들이 이끄는 절 안에서 주어와 목적어 같은 역할을 한답니다. 문장 속에서 앞의 명사를 꾸며주는 아주 중요한 친구들이에요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 볼게요. People who love the color orange love having fun with their friends. 라는 문장이에요. 오렌지색을 좋아하는 사람들은 친구들과 노는 것을 좋아한다는 뜻이죠. 여기서 who는 주격 관계대명사로 쓰였어요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. There is no culture which is superior or inferior to others. 라는 문장인데요. 다른 문화에 비해서 우월하거나 열등한 문화는 없다는 뜻이에요. 여기서 which는 culture를 받아주는 주격 관계대명사랍니다.","hl":"ex-1"},{"n":5,"text":"세 번째 예문을 보죠. The friendships that you make in high school last your whole life. 라는 문장이에요. 당신이 고등학교에서 맺는 우정은 평생 동안 지속된다는 뜻이죠. 여기서 that은 목적격 관계대명사로 쓰였어요.","hl":"ex-2"},{"n":6,"text":"네 번째 예문이에요. I wouldn’t fly with an airline whose safety record is bad. 라는 문장이에요. 안전 기록이 좋지 않은 항공사로는 비행하지 않겠다는 뜻이죠. 여기서 whose는 소유격 관계대명사로 쓰였어요.","hl":"ex-3"},{"n":7,"text":"여기서 잠깐 주의할 점이 있어요. 관계대명사 that은 사람과 사물 모두에 쓸 수 있고, 목적격 관계대명사는 종종 생략되기도 한답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">전치사와 소유격이 포함된 관계대명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사 뒤에 오는 \u003cb class=\"key\">관계대명사\u003c/b>나 소유격을 나타내는 \u003cb class=\"key\">whose\u003c/b>를 정확하게 구분하여 사용해야 해요.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + 관계대명사 / 선행사 + whose + 명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Everybody is surprised at the fluency \u003cspan class=\"fx\">with which\u003c/span> I speak English.\u003c/div>\u003cdiv class=\"g-ko\">모든 사람은 유창함에 놀란다 / 내가 영어를 말하는.\u003c/div>\u003cdiv class=\"g-note\">전치사 with와 관계대명사 which가 함께 쓰였습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The woman \u003cspan class=\"fx\">who(m)\u003c/span> my father is arguing with is the sales director.\u003c/div>\u003cdiv class=\"g-ko\">그 여자 / 우리 아버지가 언쟁을 하고 있는 / 영업 책임자이다.\u003c/div>\u003cdiv class=\"g-note\">목적격 관계대명사 who 또는 whom이 쓰였습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I’m not the man \u003cspan class=\"fx\">that\u003c/span> I used to be.\u003c/div>\u003cdiv class=\"g-ko\">나는 그런 사람이 아니다 / 내가 예전에 그랬던.\u003c/div>\u003cdiv class=\"g-note\">보어 역할을 대신하는 관계대명사 that이 쓰였습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>전치사가 관계대명사 앞으로 이동할 수 있으며, 이때 목적격 \u003cb class=\"key\">whom\u003c/b>이나 \u003cb class=\"key\">which\u003c/b>를 주로 사용해요.\u003c/div>","segs":[{"n":8,"text":"두 번째 개념은 조금 더 다양한 형태의 관계대명사예요. 전치사와 함께 쓰이는 관계대명사와 소유격 관계대명사의 쓰임을 자세히 살펴볼게요.","hl":"rule"},{"n":9,"text":"첫 번째 예문을 볼까요. Everybody is surprised at the fluency with which I speak English. 라는 문장이에요. 내가 영어를 말하는 유창함에 모든 사람이 놀란다는 뜻이죠. 여기서 with which는 전치사와 관계대명사가 함께 쓰인 형태예요.","hl":"ex-0"},{"n":10,"text":"두 번째 예문이에요. The woman who(m) my father is arguing with is the sales director. 라는 문장이죠. 우리 아버지가 언쟁을 하고 있는 그 여자가 영업 책임자라는 뜻이에요. 여기서 who나 whom은 전치사 with의 목적어 자리에 쓰인 목적격 관계대명사예요.","hl":"ex-1"},{"n":11,"text":"마지막 세 번째 예문이에요. I’m not the man that I used to be. 라는 문장인데요. 나는 내가 예전에 그랬던 그런 사람이 아니라는 뜻이에요. 여기서 that은 보어 역할을 대신하는 관계대명사로 쓰였답니다.","hl":"ex-2"},{"n":12,"text":"전치사와 관계대명사가 함께 쓰일 때, 전치사가 관계대명사 바로 앞으로 이동할 수 있다는 점을 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">관계부사의 역할과 종류\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">관계부사\u003c/b> \u003cb class=\"key\">when, where\u003c/b>는 절 안에서 시간이나 장소를 나타내는 부사 역할을 해요.\u003cdiv>\u003cspan class=\"g-formula\">선행사(시간/장소) + 관계부사(when/where) + 완전한 문장\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">There are times \u003cspan class=\"fx\">when\u003c/span> I wonder why I study.\u003c/div>\u003cdiv class=\"g-ko\">그런 시기가 있다 / 내가 왜 공부를 하는지 의아스러운.\u003c/div>\u003cdiv class=\"g-note\">시간을 나타내는 관계부사 when이 times를 꾸며줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The jungle \u003cspan class=\"fx\">where\u003c/span> the tribe lives is full of strange animals.\u003c/div>\u003cdiv class=\"g-ko\">그 정글은 / 그 부족이 사는 / 이상한 동물들로 가득 차 있다.\u003c/div>\u003cdiv class=\"g-note\">장소를 나타내는 관계부사 where가 jungle을 꾸며줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>관계부사 뒤에는 주어, 목적어 등이 모두 갖춰진 \u003cb class=\"key\">완전한 문장\u003c/b>이 온다는 것을 기억하세요.\u003c/div>","segs":[{"n":13,"text":"세 번째 개념은 관계부사예요. 관계부사 when과 where는 각각 시간과 장소를 나타내는 부사 역할을 한답니다. 관계대명사와 달리 뒤에 완전한 문장이 온다는 특징이 있어요.","hl":"rule"},{"n":14,"text":"첫 번째 예문을 보죠. There are times when I wonder why I study. 라는 문장이에요. 내가 왜 공부를 하는지 의아스러운 그런 시기가 있다는 뜻이죠. 여기서 when은 시간을 나타내는 관계부사예요.","hl":"ex-0"},{"n":15,"text":"두 번째 예문이에요. The jungle where the tribe lives is full of strange animals. 라는 문장인데요. 그 부족이 사는 정글은 이상한 동물들로 가득 차 있다는 뜻이에요. 여기서 where는 장소를 나타내는 관계부사로 쓰였어요.","hl":"ex-1"},{"n":16,"text":"관계부사 뒤에는 빠진 성분 없이 주어와 동사가 모두 갖춰진 완전한 문장이 온다는 것을 절대 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">이유와 방법을 나타내는 관계부사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">reason, way 뒤에 각각 이유와 방법을 나타내는 관계부사 \u003cb class=\"key\">why\u003c/b>와 \u003cb class=\"key\">that\u003c/b>이 와요.\u003cdiv>\u003cspan class=\"g-formula\">reason + why + 완전한 문장 / way + that(또는 in which) + 완전한 문장\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">That is a major reason \u003cspan class=\"fx\">why\u003c/span> they were such poor countries.\u003c/div>\u003cdiv class=\"g-ko\">그것이 주된 이유다 / 그들이 그렇게 가난한 나라였던.\u003c/div>\u003cdiv class=\"g-note\">이유를 나타내는 관계부사 why가 reason 뒤에 쓰였습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I find the way \u003cspan class=\"fx\">that\u003c/span> you talk extremely rude.\u003c/div>\u003cdiv class=\"g-ko\">나는 그 방식을 생각한다 / 당신이 말하는 (방식) / 극히 무례하다고.\u003c/div>\u003cdiv class=\"g-note\">방법을 나타내는 관계부사 that이 way 뒤에 쓰였습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>선행사 \u003cb class=\"key\">way\u003c/b>와 관계부사 \u003cb class=\"key\">that\u003c/b>은 둘 중 하나만 쓰거나 in which로 바꿔 쓸 수 있어요.\u003c/div>","segs":[{"n":17,"text":"네 번째 개념은 이유와 방법을 나타내는 관계부사예요. 선행사 reason 뒤에는 why가 오고, way 뒤에는 that이 와서 각각 이유와 방법을 설명해 준답니다.","hl":"rule"},{"n":18,"text":"첫 번째 예문을 볼게요. That is a major reason why they were such poor countries. 라는 문장이에요. 그것이 그들이 그렇게 가난한 나라였던 주된 이유라는 뜻이죠. 여기서 why는 이유를 나타내는 관계부사로 쓰였어요.","hl":"ex-0"},{"n":19,"text":"두 번째 예문이에요. I find the way that you talk extremely rude. 라는 문장이죠. 당신이 말하는 방식이 극히 무례하다고 생각한다는 뜻이에요. 여기서 way 뒤에 쓰인 that은 방법을 나타내는 관계부사랍니다.","hl":"ex-1"},{"n":20,"text":"여기서 한 가지 팁을 주자면, way와 관계부사 that은 둘 다 쓰거나 둘 중 하나만 쓸 수도 있고 in which로 바꿔 쓸 수도 있어요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The jungle where lives the tribe is full of strange animals.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The jungle where the tribe lives is full of strange animals.\u003c/div>\u003cdiv class=\"g-why\">관계부사 뒤의 절은 완전한 어순을 가져야 하므로 주어와 동사의 순서가 바뀌면 안 돼요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I met a man which has blue eyes.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I met a man who has blue eyes.\u003c/div>\u003cdiv class=\"g-why\">선행사가 사람일 때는 관계대명사로 which가 아니라 who나 that을 써야 해요.\u003c/div>\u003c/div>","segs":[{"n":21,"text":"학생들이 자주 틀리는 첫 번째 문장이에요. The jungle where lives the tribe 라고 쓰면 틀려요. 관계부사 뒤에는 주어가 동사 앞로 와야 하니까 The jungle where the tribe lives 라고 바르게 써야 한답니다.","hl":"mk-0"},{"n":22,"text":"두 번째로 자주 하는 실수예요. I met a man which has blue eyes라고 쓰면 안 돼요. 선행사인 man이 사람이니까 which가 아니라 who나 that을 써야 맞아요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 가장 알맞은 관계대명사를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">People ______ love the color orange love having fun with their friends.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>which\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>who\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>whose\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>where\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>when\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">who\u003c/span>\u003cdiv class=\"g-exp\">선행사 People이 사람이므로 주격 관계대명사 who가 정답이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"첫 번째 문제예요. 화면의 문장을 보고 빈칸에 들어갈 가장 알맞은 관계대명사를 골라보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":6},{"n":25,"text":"정답은 두 번째 보기인 who예요. 선행사 People이 사람이기 때문에 주격 관계대명사 who를 쓰는 것이 맞답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 빈칸에 들어갈 수 없
