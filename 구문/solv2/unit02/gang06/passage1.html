는 지구의 거대한 퍼즐 조각인 지각판들이 서로 맞물려 있는 불안정한 지점에 위치해 있어서, 지열(Geothermal energy) 활동이 매우 활발한 나라예요. 마치 냄비 바닥에 불이 붙은 것처럼 땅속 깊은 곳의 뜨거운 열기가 지표면으로 분출되는 지질학적 핫스팟(Geological hot spot) 덕분에 아이슬란드는 천연 에너지의 보고가 되었죠. 우리가 온천을 즐기는 것과 비슷하게, 아이슬란드 사람들은 이 뜨거운 땅의 열기를 이용해서 발전(Power generation)을 하거나 집 안의 난방을 해결해요. 또한, 지형적인 특성상 거대한 빙하에서 녹아 흐르는 풍부한 물을 이용한 수력 발전(Hydroelectric power)까지 결합되어, 환경 오염 걱정 없이 아주 저렴하고 깨끗한 에너지를 마음껏 사용할 수 있는 환경이 갖춰진 셈이랍니다.</div></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아이슬란드라는 나라는</span><span class=\"en\"><b>The country of Iceland</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위치해 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is located</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지질학적인 &quot;열점&quot; 위에</span><span class=\"en\"><b>on a geological “hot spot”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지각을 통해 새어 나오는 열이</span><span class=\"en\"><b><span class=\"grammar-hl\">that heat escaping through the Earth’s crust</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만들어낸</span><span class=\"en\"><b><span class=\"grammar-hl\">has made</span>.</b></span></div></div><div class=\"lec-sent-ko\">아이슬란드라는 나라는 지각을 통해 새어나오는 열에 의해 생성된 지질학적 ‘열점’에 위치해 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아이슬란드의 지리적 특징을 소개하는 도입부입니다. 여기서 hot spot은 사전적으로는 &#39;인기 있는 장소&#39;를 뜻하지만, 여기서는 &#39;지질학적으로 지하 열기가 분출되는 지점&#39;을 의미합니다. 지구가 뜨겁다는 사실을 직관적으로 보여주기 위해 이 표현을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is located (수동태): be동사(is)+p.p.(located) 구조. locate는 타동사(위치시키다)인데 목적어가 없어서 수동구조 is located 형태로 쓴다. 기본구조: locate A(목적어) in B(장소)</div><div class=\"lec-gr-item\">heat escaping through the Earth’s crust (현재분사): escaping이 앞의 명사 heat를 수식하며 &#39;지각을 통해 빠져나가는 열&#39;이라는 의미의 동작/상태를 나타낸다. (현재분사+N 구조: N이 ~하는 중인/하는)</div><div class=\"lec-gr-item\">that heat escaping through the Earth’s crust has made (관계대명사): 목적격 관계대명사 that이 이끄는 절로, 선행사 &#39;hot spot&#39;을 수식한다. 절 내부의 타동사 made 뒤에 목적어가 빠져 있는 불완전한 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 ~ 때문이다</span><span class=\"en\"><b><span class=\"grammar-hl\">This is because</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이슬란드가 형성되었다는 것은</span><span class=\"en\"><b>Iceland <span class=\"grammar-hl\">was formed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불안정한 부분 위에서</span><span class=\"en\"><b>over an unstable part</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구의</span><span class=\"en\"><b>of the Earth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 대륙판이</span><span class=\"en\"><b><span class=\"grammar-hl\">where two continental plates</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만나는</span><span class=\"en\"><b><span class=\"grammar-hl\">come together</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 아이슬란드가 두 개의 대륙판이 만나는 지구의 불안정한 곳 위에 형성되어 있기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;핫스팟&#39;이 왜 생겨났는지에 대한 과학적 원인을 설명합니다. &#39;불안정하다&#39;는 것은 지질학적으로 활동이 활발하다는 뜻과 연결됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This is because (관용표현): &#39;이것은 ~이기 때문이다&#39;라는 의미로, 뒤에 이유에 해당하는 절(주어+동사)이 온다.</div><div class=\"lec-gr-item\">was formed (수동태): be동사(was)+p.p.(formed) 구조. form은 타동사(형성하다)인데 목적어가 없어서 수동구조 was formed 형태로 쓴다. 기본구조: form A(목적어)</div><div class=\"lec-gr-item\">where two continental plates come together (관계부사): 장소(an unstable part of the Earth)를 수식하며, 뒤에 주어+동사가 갖춰진 완전한 절이 온다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 의미한다</span><span class=\"en\"><b><span class=\"grammar-hl\">This means that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이슬란드가 가지고 있다는 것을</span><span class=\"en\"><b>Iceland has</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 강력한 지하 지진들을</span><span class=\"en\"><b>a lot of intense underground earthquakes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 화산 활동을</span><span class=\"en\"><b>and volcanic activity.</b></span></div></div><div class=\"lec-sent-ko\">이것은 아이슬란드에 강력한 지하 지진과 화산활동이 많다는 것을 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장의 불안정한 지형이 가져오는 구체적인 결과(지진과 화산)를 서술하며, 자연스럽게 다음 문장의 &#39;열&#39;에 대한 이야기로 이어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This means that (that절(명사절)): 타동사 means의 목적어 역할을 하는 명사절이다. 당위성 that절(동사원형) 구조가 아니므로 단순 내용절로 처리한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 활동은</span><span class=\"en\"><b>This activity</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 열을 발생시킨다</span><span class=\"en\"><b><span class=\"grammar-hl\">generates</span> a lot of heat,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 충당한다</span><span class=\"en\"><b>and it meets</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">70% 이상을</span><span class=\"en\"><b>over 70%</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 나라 에너지 수요의</span><span class=\"en\"><b>of the country’s energy needs.</b></span></div></div><div class=\"lec-sent-ko\">이러한 활동은 많은 열을 발생시키는데, 이 열은 나라 전체 에너지 수요의 70% 이상을 충당한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화산 활동으로 생긴 &#39;열&#39;이 실제로 어떻게 자원화되는지를 보여줍니다. meets는 &#39;만나다&#39;라는 뜻이지만, 여기서는 &#39;요구사항이나 필요를 충족시키다&#39;라는 의미로 쓰여, 자연 에너지가 국가의 필요를 완벽히 해결하고 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">generates 5형식(SVOC) 구조(확장): 문맥상 주어(This activity)가 목적어(a lot of heat)를 생성한다는 SVO 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 열 덕분에</span><span class=\"en\"><b>Due to this heat,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거대한 빙원과 빙하뿐만 아니라</span><span class=\"en\"><b>as well as the huge ice fields and glaciers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강물을 만들어내는</span><span class=\"en\"><b><span class=\"grammar-hl\">that create rivers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발전소에 공급할</span><span class=\"en\"><b><span class=\"grammar-hl\">to feed power plants</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 아이슬란드 마을과 도시의 주민들은</span><span class=\"en\"><b>the residents of most Icelandic towns and cities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지속적으로 공급받는다</span><span class=\"en\"><b><span class=\"grammar-hl\">are continually supplied with</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 저렴한 에너지를</span><span class=\"en\"><b>very cheap energy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 물과 집을 난방하기 위한</span><span class=\"en\"><b><span class=\"grammar-hl\">for heating their water and homes</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 열 덕택에, 그리고 강물을 만들어 발전소를 가동하게 하는 빙원이나 빙하로 인해, 아이슬란드의 대부분의 마을과 도시 주민들은 온수와 난방을 하는 데 있어 매우 값싼 에너지를 지속적으로 공급받는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지열 에너지 외에 빙하를 이용한 수력 에너지까지 더해져 아이슬란드 주민들이 얻는 실질적인 혜택을 구체적으로 설명합니다. feed는 &#39;먹이를 주다&#39;가 본래 뜻이지만, 여기서는 발전소에 끊임없이 물을 &#39;보내주다/공급하다&#39;라는 뜻으로 쓰여, 자연이 인공적인 발전소의 동력을 마련해준다는 느낌을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that create rivers (관계대명사): 주격 관계대명사 that이 이끄는 절로, 선행사 &#39;huge ice fields and glaciers&#39;를 수식한다. 절 내부에서 주어 역할을 하며 동사 create로 이어진다.</div><div class=\"lec-gr-item\">to feed power plants (to부정사): 앞의 명사 rivers를 수식하는 형용사적 용법으로, &#39;~하는, ~할&#39;이라는 의미를 가진다.</div><div class=\"lec-gr-item\">are continually supplied with (수동태): be동사(are)+p.p.(supplied) 구조. supply는 타동사인데 목적어가 없어서 수동구조 are supplied 형태로 쓴다. 기본구조: supply A(목적어) with B(물건)</div><div class=\"lec-gr-item\">for heating their water and homes (동명사): 전치사 for 뒤에서 행위/용도를 나타내는 명사적 기능으로 쓰였다. &#39;물과 집을 데우기 위한(용도)&#39;이라는 의미를 가진다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">독특한 지리적 위치 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">Because of</span> its unique geographical location</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 지질학적 특징들 때문에</span><span class=\"en\"><b>and geological characteristics,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이슬란드는 큰 이득을 본다</span><span class=\"en\"><b>Iceland benefits greatly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">에너지 자원이라는 측면에서</span><span class=\"en\"><b>in terms of energy resources.</b></span></div></div><div class=\"lec-sent-ko\">독특한 지리적 위치와 지질학적 특징으로 인해 아이슬란드는 에너지 자원이라는 점에서 큰 이득을 본다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전체 내용을 요약하며 마무리하는 문장입니다. 아이슬란드의 자연적 조건이 곧 국가적 경쟁력이 되었음을 결론짓습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Because of (관용표현): 전치사구로 뒤에 명사구(its unique geographical location and geological characteristics)를 동반하여 이유를 나타낸다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>아이슬란드는 지각판이 만나는 불안정한 지형 덕분에 화산과 지진이 잦다.</li><li>이러한 지질학적 특성으로 발생하는 열과 풍부한 빙하를 에너지원으로 활용한다.</li><li>덕분에 아이슬란드는 국가 에너지 수요의 70% 이상을 저렴하고 지속 가능한 방식으로 해결한다.</li><li>자연적 조건이 국가의 큰 자원적 혜택으로 이어지는 사례이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Iceland is located on a geological hot spot, so it generates most of its energy from natural heat and water.</div>\n              <div class=\"lec-final-sum-ko\">아이슬란드는 지질학적 핫스팟에 위치해 있으므로, 자연적인 열과 물을 이용하여 대부분의 에너지를 생산한다.</div></div></div>"],"segs":[[{"audio":"./passage1_audio/1.mp3","hl":null}],[{"audio":"./passage1_audio/2.mp3","hl":null}],[{"audio":"./passage1_audio/3.mp3","hl":"main"},{"audio":"./passage1_audio/4.mp3","hl":"meaning"},{"audio":"./passage1_audio/5.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/6.mp3","hl":"main"},{"audio":"./passage1_audio/7.mp3","hl":"meaning"},{"audio":"./passage1_audio/8.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/9.mp3","hl":"main"},{"audio":"./passage1_audio/10.mp3","hl":"meaning"},{"audio":"./passage1_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/12.mp3","hl":"main"},{"audio":"./passage1_audio/13.mp3","hl":"meaning"},{"audio":"./passage1_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/15.mp3","hl":"main"},{"audio":"./passage1_audio/16.mp3","hl":"meaning"},{"audio":"./passage1_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/18.mp3","hl":"main"},{"audio":"./passage1_audio/19.mp3","hl":"meaning"},{"audio":"./passage1_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/21.mp3","hl":null}]]};var i=0,j
