abuXA+Yc5xyOcdT+Hf074oLqOpH50fqA7Hf0/rR/k/5/wA/XsUyODnrjHvn/wDXSbh6gduvU8/0Gc0C/wAn19Pn89P8nenv+n1pGJAJHUc445/OkyCOGBJyARg8jP6jHP8ASlJABPoM+vTn/wDVzRuM/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Caution Toward Unsolicited Job Offers from Unknown Sources<small>출처를 알 수 없는 구직 제안에 대한 주의</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 본 적 없는 회사로부터 갑자기 합격 메일이나 채용 제안을 받아본 적 있나요? 이런 현상을 흔히 스팸 메일(Spam Mail) 또는 피싱(Phishing)의 일종이라고 하는데, 이는 타인의 개인정보를 노리거나 악성 코드를 퍼뜨리기 위해 가짜 채용 공고를 이용하는 아주 흔한 수법이에요. 마치 모르는 사람이 공짜 선물을 주겠다며 접근하는 것과 같아서, 이런 메일을 받으면 보안 의식(Security Awareness)을 가지고 주의 깊게 확인해야 합니다. 특히 내가 지원하지 않은 곳에서 온 연락은 개인정보 유출(Data Breach)의 통로가 될 수 있으니, 링크를 함부로 누르지 않는 디지털 리터러시(Digital Literacy)가 무엇보다 중요해요. 지문을 읽기 전에 이런 메일이 왜 위험한지, 그리고 우리가 어떻게 스스로를 보호할 수 있을지 한번 생각하며 글을 읽어보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 발생</div><ul><li>필자에게 낯선 회사로부터 이메일이 한 통 도착했다.</li><li>채용 제안(job offer)을 담은 이메일 수신</li><li>제안을 보낸 회사의 정체를 알 수 없음(unknown company)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02의문 제기</div><ul><li>필자는 해당 기업에 지원했던 기억이 전혀 없는 상태이다.</li><li>지원한 기억(remember applying)이 없음</li><li>회사의 신뢰성과 제안의 의도를 의심함</li><li>핵심 키워드: 기억(memory), 지원(application)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">receive</td><td class=\"m\">받다</td></tr><tr><td class=\"w\">offer</td><td class=\"m\">제안하다, 제공하다</td></tr><tr><td class=\"w\">unknown</td><td class=\"m\">알려지지 않은, 모르는</td></tr><tr><td class=\"w\">company</td><td class=\"m\">회사</td></tr><tr><td class=\"w\">remember</td><td class=\"m\">기억하다</td></tr><tr><td class=\"w\">apply to</td><td class=\"m\">~에 지원하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아이슬란드라는 나라는</span><span class=\"en\"><b>The country of Iceland</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위치해 있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">is located</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지질학적 ‘열점’에</span><span class=\"en\"><b>on a geological “hot spot”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지각을 통해 새어나오는 열에 의해</span><span class=\"en\"><b><span class=\"grammar-hl\">that heat escaping through the Earth’s crust</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생성된</span><span class=\"en\"><b><span class=\"grammar-hl\">has made</span>.</b></span></div></div><div class=\"lec-sent-ko\">(아이슬란드라는 나라는 지각을 통해 새어나오는 열에 의해 생성된 지질학적 ‘열점’에 위치해 있다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 출처를 알 수 없는 의문의 취업 제안 메일을 받은 상황을 설명하며 글의 도입부를 열고 있습니다. 여기서 offering은 사전적으로는 &#39;제공하다&#39;라는 뜻이지만, 여기서는 &#39;나에게 일자리를 주겠다고 제안하는&#39;이라는 맥락으로 쓰였습니다. 구직자가 스스로 지원하지 않은 회사에서 먼저 연락이 왔다는 점을 강조하여, 화자가 느끼는 의구심을 더 효과적으로 나타내기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is located (수동태): be동사(is)+p.p.(located) 구조. locate는 타동사(위치시키다)인데 목적어가 없어서 수동구조 is located 형태로 쓴다. 기본구조: locate O (O를 위치시키다)</div><div class=\"lec-gr-item\">that heat escaping through the Earth’s crust has made (관계대명사): 목적격 관계대명사 that이 이끄는 절이 앞의 &#39;hot spot&#39;을 수식한다. 절 내부의 동사 made 뒤에 목적어가 빠져 있는 불완전한 문장 구조이다.</div><div class=\"lec-gr-item\">escaping (현재분사): escaping이 앞의 명사 heat를 수식하며, &#39;지각을 통해 빠져나가는 열&#39;이라는 의미의 동작을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 ~ 때문이다</span><span class=\"en\"><b><span class=\"grammar-hl\">This is because</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이슬란드가</span><span class=\"en\"><b>Iceland</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">형성되어</span><span class=\"en\"><b><span class=\"grammar-hl\">was formed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구의 불안정한 곳 위에</span><span class=\"en\"><b>over an unstable part of the Earth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 개의 대륙판이</span><span class=\"en\"><b><span class=\"grammar-hl\">where two continental plates</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만나는</span><span class=\"en\"><b><span class=\"grammar-hl\">come together</span>.</b></span></div></div><div class=\"lec-sent-ko\">(이것은 아이슬란드가 두 개의 대륙판이 만나는 지구의 불안정한 곳 위에 형성되어 있기 때문이다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This is because (관용표현): &#39;이것은 ~ 때문이다&#39;라는 뜻의 표현으로, 문장에서 원인이나 이유를 나타내는 명사절을 이끈다.</div><div class=\"lec-gr-item\">was formed (수동태): be동사(was)+p.p.(formed) 구조. form은 타동사(형성하다)인데 목적어가 없어서 수동구조 was formed 형태로 쓴다. 기본구조: form O (O를 형성하다)</div><div class=\"lec-gr-item\">where two continental plates come together (관계부사): where가 이끄는 절이 앞의 선행사 &#39;an unstable part of the Earth&#39;를 수식한다. 관계부사 뒤에는 주어(plates)와 자동사(come)가 갖춰진 완전한 절이 온다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 ~을 의미한다</span><span class=\"en\"><b><span class=\"grammar-hl\">This means</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이슬란드에</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> Iceland</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강력한 지하 지진과</span><span class=\"en\"><b>has a lot of intense underground earthquakes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화산활동이 많다는 것을</span><span class=\"en\"><b>and volcanic activity.</b></span></div></div><div class=\"lec-sent-ko\">(이것은 아이슬란드에 강력한 지하 지진과 화산활동이 많다는 것을 의미한다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This means that (that절): mean의 목적어로 쓰인 명사절이며, 앞의 지질학적 상황이 초래하는 결과를 설명한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 활동은</span><span class=\"en\"><b>This activity</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발생시키는데</span><span class=\"en\"><b>generates</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 열을</span><span class=\"en\"><b>a lot of heat,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 열은 ~을 충당한다</span><span class=\"en\"><b>and it <span class=\"grammar-hl\">meets</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나라 전체 에너지 수요의 70% 이상을</span><span class=\"en\"><b>over 70% of the country’s energy needs.</b></span></div></div><div class=\"lec-sent-ko\">(이러한 활동은 많은 열을 발생시키는데, 이 열은 나라 전체 에너지 수요의 70% 이상을 충당한다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">meets (일반동사): 주어(This activity)의 서술어로, &#39;충족시키다&#39;라는 의미를 가진 3인칭 단수 현재형 동사이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 열 덕택에</span><span class=\"en\"><b>Due to this heat,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 ~로 인해</span><span class=\"en\"><b>as well as the huge ice fields and glaciers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강물을 만들어</span><span class=\"en\"><b><span class=\"grammar-hl\">that create rivers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발전소를 가동하게 하는 빙원이나 빙하</span><span class=\"en\"><b><span class=\"grammar-hl\">to feed power plants</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이슬란드의 대부분의 마을과 도시 주민들은</span><span class=\"en\"><b>the residents of most Icelandic towns and cities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지속적으로 공급받는다</span><span class=\"en\"><b><span class=\"grammar-hl\">are continually supplied with</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 값싼 에너지를</span><span class=\"en\"><b>very cheap energy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온수와 난방을 하는 데 있어</span><span class=\"en\"><b><span class=\"grammar-hl\">for heating</span> their water and homes.</b></span></div></div><div class=\"lec-sent-ko\">(이 열 덕택에, 그리고 강물을 만들어 발전소를 가동하게 하는 빙원이나 빙하로 인해, 아이슬란드의 대부분의 마을과 도시 주민들은 온수와 난방을 하는 데 있어 매우 값싼 에너지를 지속적으로 공급받는다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that create rivers to feed power plants (관계대명사): 주격 관계대명사 that이 이끄는 절이 앞의 선행사 &#39;ice fields and glaciers&#39;를 수식한다.</div><div class=\"lec-gr-item\">to feed (to부정사): 앞의 명사 rivers를 수식하는 형용사적 용법으로, &#39;발전소에 공급할 강&#39;이라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">are continually supplied with (수동태): be동사(are)+p.p.(supplied) 구조. supply는 타동사로 supply A with B(A에게 B를 공급하다) 구조인데 목적어(residents)가 주어로 올라가 수동구조 are supplied가 되었다. 기본구조: supply O with B</div><div class=\"lec-gr-item\">for heating (동명사): 전치사 for의 목적어로 쓰여 &#39;난방하는 것&#39;이라는 용도/행위를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">독특한 지리적 위치와</span><span class=\"en\"><b>Because of its unique <span class=\"grammar-hl\">geographical location</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지질학적 특징으로 인해</span><span class=\"en\"><b>and geological characteristics,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이슬란드는</span><span class=\"en\"><b>Iceland</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 이득을 본다</span><span class=\"en\"><b>benefits greatly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">에너지 자원이라는 점에서</span><span class=\"en\"><b>in terms of energy resources.</b></span></div></div><div class=\"lec-sent-ko\">(독특한 지리적 위치와 지질학적 특징으로 인해 아이슬란드는 에너지 자원이라는 점에서 큰 이득을 본다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">geographical location (현재분사): -ing 형태가 명사 앞에 쓰였으나, 여기서는 지리적(geographical)이라는 형용사구의 일부로 사용되었다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>화자가 지원한 적 없는 생소한 회사로부터 취업 제안 메일을 받았다.</li><li>갑작스러운 제안으로 인해 해당 이메일의 신뢰성에 의문이 생기는 상황이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People may receive job offers from companies they never contacted, and these messages often require careful verification for security.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 연락한 적 없는 회사로부터 구직 제안을 받을 수 있으며, 이러한 메시지는 보안을 위해 신중한 확인이 필요하다.</div></div></div>"],"segs":[[{"audio":"./passage1_audio/1.mp3","hl":null}],[{"audio":"./passage1_audio/2.mp3","hl":null}],[{"audio":"./passage1_audio/3.mp3","hl":null},{"audio":"./passage1_audio/4.mp3","hl":"stage-0"},{"audio":"./passage1_audio/5.mp3","hl":"stage-1"}],[{"audio":"./passage1_audio/6.mp3","hl":null}],[{"audio":"./passage1_audio/7.mp3","hl":"main"},{"audio":"./passage1_audio/8.mp3","hl":"meaning"},{"audio":"./passage1_audio/9.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/10.mp3","hl":"main"},{"audio":"./passage1_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/12.mp3","hl":"main"},{"audio":"./passage1_audio/13.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/14.mp3","hl":"main"},{"audio":"./p
