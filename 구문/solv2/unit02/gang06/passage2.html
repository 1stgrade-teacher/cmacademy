9fw+nWk3D1H5imuut7W+Wy13/H0DX7vw1/zYue34/5/X8+2eTGfrkf5/of84AVBySMcnqP8RnnBPOTk0h4B2gnhjkYIxjnqc9MnoR1yVxTXK1f0V01s2rpdb910067NRvfVKy/4f7vRo//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Vocabulary: A Mirror of an Author&#39;s Temperament<small>어휘: 작가 성향의 거울</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 작가가 사용하는 언어와 단어 선택이 그 사람의 고유한 성격이나 기질을 어떻게 드러내는지를 다루고 있습니다. 언어학에서는 이를 문체론(Stylistics)이라는 분야로 연구하는데, 마치 우리가 평소에 즐겨 쓰는 말투나 단어만 봐도 그 사람의 성향을 짐작할 수 있는 것과 비슷한 원리예요. 작가들이 무의식적으로 선택하는 단어의 빈도나 배열 방식을 분석하면, 그들의 내면적 특성(Inner temperament)이나 심리 상태를 과학적으로 추적할 수 있답니다. 마치 지문(Fingerprint)이 사람마다 다른 것처럼, 글 속에 나타나는 언어적 습관을 데이터 분석(Data analysis)하면 작가의 숨겨진 개성을 명확하게 파악할 수 있다는 점을 미리 알고 글을 읽으면 훨씬 이해가 쉬울 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01분석의 출발</div><ul><li>작가가 사용하는 단어들을 살펴보는 것만으로도 그 사람이 가진 고유한 성향을 파악할 수 있다.</li><li>단어 사용(use of words) 그 자체가 분석 대상이 됨</li><li>분석을 통해 가치 있는 결과(valuable results) 도출 가능</li><li>핵심 키워드: 작가의 기질(temperaments of authors)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02분석의 유용성</div><ul><li>단어 선택은 작가의 무의식적인 특징을 드러내는 중요한 단서가 된다.</li><li>작가마다 다른 고유한 언어 습관 확인</li><li>글 속에 숨겨진 작가의 내면적 성향 발견</li><li>핵심 키워드: 분석(analysis)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">use</td><td class=\"m\">사용</td></tr><tr><td class=\"w\">yield</td><td class=\"m\">산출하다, 결과를 내다</td></tr><tr><td class=\"w\">analysis</td><td class=\"m\">분석</td></tr><tr><td class=\"w\">valuable</td><td class=\"m\">가치 있는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">illustrative</td><td class=\"m\">예증하는, 분명히 보여주는</td></tr><tr><td class=\"w\">various</td><td class=\"m\">다양한</td></tr><tr><td class=\"w\">temperament</td><td class=\"m\">기질, 성향</td></tr><tr><td class=\"w\">author</td><td class=\"m\">저자, 작가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지구상에서 자라는 아름답고 흥미로운 것들과 비교하면, 호두는 대단한 것 같지는 않다.</span><span class=\"en\"><b>If you compare a walnut</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>with some of the beautiful and exciting things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">that grow on our planet</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>it does not seem to be a marvelous creation.</b></span></div></div><div class=\"lec-sent-ko\">(지구상에서 자라는 아름답고 흥미로운 것들과 비교하면, 호두는 대단한 것 같지는 않다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기에서 yields는 사전적으로 &#39;농작물이나 이익을 산출하다&#39;라는 뜻이지만, 이 문장에서는 분석이라는 과정을 통해 어떤 &#39;결과를 이끌어내거나 드러낸다&#39;는 의미로 쓰였습니다. 필자는 저자의 문체 분석이 단순한 데이터 조사가 아니라, 저자의 성격적 본질을 증명해 내는 &#39;생산적인 과정&#39;임을 강조하기 위해 이 단어를 선택했습니다. 또한, illustrative of는 &#39;~을 예증하는&#39;이라는 딱딱한 의미인데, 문맥상 저자의 성격이 글 속에 &#39;잘 녹아 있거나 잘 보여준다&#39;는 뜻입니다. 글의 스타일(단어 선택)이 그 사람의 기질을 나타내는 일종의 증거물이 됨을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that grow on our planet (관계대명사): that은 주격 관계대명사로서 선행사 things를 수식하며, 관계대명사 뒤에는 주어 없이 바로 동사(grow)가 이어지는 불완전한 절의 구조를 가진다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호두는 흔하고,</span><span class=\"en\"><b>It is common,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거칠고,</span><span class=\"en\"><b>rough,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별히 매력적이지도 않고,</span><span class=\"en\"><b><span class=\"grammar-hl\">not particularly attractive</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분명 많은 가치가 있지도 않다.</span><span class=\"en\"><b>and certainly not of much value.</b></span></div></div><div class=\"lec-sent-ko\">(호두는 흔하고, 거칠고, 특별히 매력적이지도 않고, 분명 많은 가치가 있지도 않다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">not particularly attractive (관용표현): not particularly는 &#39;그다지 ~하지 않은&#39;의 의미를 가진 부사구로, 뒤에 오는 형용사 attractive를 부정한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">게다가,</span><span class=\"en\"><b>Besides,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 작다.</span><span class=\"en\"><b>it <span class=\"grammar-hl\">is small</span>.</b></span></div></div><div class=\"lec-sent-ko\">(게다가, 그것은 작다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is small 5형식(SVOC) 구조: 주어(it) + 동사(is) + 보어(small)로 이루어진 2형식 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호두의 성장은 그것을 둘러싸고 있는 딱딱한 껍질, 평생 동안 결코 벗어나지 못하는 껍질에 의해 제한된다.</span><span class=\"en\"><b>Its growth is limited</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>by the hard shell</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">that surrounds it</span> —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>the shell <span class=\"grammar-hl\">from which</span> it never escapes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>during its lifetime.</b></span></div></div><div class=\"lec-sent-ko\">(호두의 성장은 그것을 둘러싸고 있는 딱딱한 껍질, 평생 동안 결코 벗어나지 못하는 껍질에 의해 제한된다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that surrounds it (관계대명사): that은 주격 관계대명사로서 선행사 shell을 수식하며, 뒤에 주어 없이 동사(surrounds)가 오는 불완전한 절의 구조를 가진다.</div><div class=\"lec-gr-item\">from which (전치사+관계대명사): 전치사 from + 관계대명사 which의 구조이다. 뒤에 &#39;it(주어) never escapes(동사)&#39;와 같이 완전한 절이 오는 관계대명사절 형태다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">물론</span><span class=\"en\"><b>Of course,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 잘못된 방법이다</span><span class=\"en\"><b>that is the wrong way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호두를 판단하는</span><span class=\"en\"><b><span class=\"grammar-hl\">to judge a walnut</span>.</b></span></div></div><div class=\"lec-sent-ko\">(물론 그것은 호두를 판단하는 잘못된 방법이다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기에서 yields는 사전적으로 &#39;농작물이나 이익을 산출하다&#39;라는 뜻이지만, 이 문장에서는 분석이라는 과정을 통해 어떤 &#39;결과를 이끌어내거나 드러낸다&#39;는 의미로 쓰였습니다. 필자는 저자의 문체 분석이 단순한 데이터 조사가 아니라, 저자의 성격적 본질을 증명해 내는 &#39;생산적인 과정&#39;임을 강조하기 위해 이 단어를 선택했습니다. 또한, illustrative of는 &#39;~을 예증하는&#39;이라는 딱딱한 의미인데, 문맥상 저자의 성격이 글 속에 &#39;잘 녹아 있거나 잘 보여준다&#39;는 뜻입니다. 글의 스타일(단어 선택)이 그 사람의 기질을 나타내는 일종의 증거물이 됨을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to judge a walnut (to부정사): 앞의 명사(the wrong way)를 수식하는 형용사적 용법으로, 판단의 근거가 되는 행동을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호두 하나를 깨뜨려</span><span class=\"en\"><b><span class=\"grammar-hl\">Break one open</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안을 들여다보라.</span><span class=\"en\"><b><span class=\"grammar-hl\">and look inside</span>.</b></span></div></div><div class=\"lec-sent-ko\">(호두 하나를 깨뜨려 안을 들여다보라.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Break one open and look inside 5형식(SVOC) 구조: Break(동사) + one(목적어) + open(목적보어)으로 구성된 5형식 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보라</span><span class=\"en\"><b>See</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 호두가 어떻게 자랐는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">how the walnut has grown</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 구석을 채우도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to fill</span> every corner</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 채울 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">available to it</span>.</b></span></div></div><div class=\"lec-sent-ko\">(그 호두가 자라서 그것이 채울 수 있는 모든 구석을 어떻게 채웠는지를 보라.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how the walnut has grown to fill (간접의문문): 의문사(how) + 주어(the walnut) + 동사(has grown)의 어순을 가진 명사절로, See의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">to fill (to부정사): 부사적 용법 중 결과(~하여 ~하게 되다)를 나타낸다.</div><div class=\"lec-gr-item\">available to it (형용사구): available이 후치 수식하여 corner를 꾸며주며, &#39;그것에게 이용 가능한&#39;이라는 의미를 갖는다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호두는 아무런 결정권이 없었다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">had no say</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">크기나 모양에는</span><span class=\"en\"><b>in the size or shape</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">껍질의</span><span class=\"en\"><b>of that shell.</b></span></div></div><div class=\"lec-sent-ko\">(호두는 껍질의 크기나 모양에는 아무런 결정권이 없었다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had no say (관용표현): have a say in (~에 발언권이 있다/결정권이 있다)의 부정형으로, 결정권이 없음을 의미한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 제약들을 고려해볼 때</span><span class=\"en\"><b><span class=\"grammar-hl\">given those limitations</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 완전한 성장을 이룬 것이다.</span><span class=\"en\"><b>it achieved its full growth.</b></span></div></div><div class=\"lec-sent-ko\">(하지만, 그 제약들을 고려해볼 때 그것은 완전한 성장을 이룬 것이다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">given those limitations (분사구문): given(~을 고려하면)은 전치사처럼 쓰인 분사구문으로, 원래 절로 바꾸면 &#39;If we consider those limitations&#39;와 같은 의미이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 얼마나 운이 좋겠는가</span><span class=\"en\"><b>How lucky we will be</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약</span><span class=\"en\"><b>if,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호두처럼</span><span class=\"en\"><b>like the walnut,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 꽃을 피운다면</span><span class=\"en\"><b>we blossom and bloom</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인생의 모든 면에서</span><span class=\"en\"><b>in every aspect of the life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게 주어진</span><span class=\"en\"><b><span class=\"grammar-hl\">that is given to us</span>.</b></span></div></div><div class=\"lec-sent-ko\">(우리에게 주어진 인생의 모든 면에서 우리가 호두처럼 꽃을 피운다면 우리는 얼마나 운이 좋겠는가.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that is given to us (수동태): be동사(is)+p.p.(given) 구조. give는 타동사인데 뒤에 목적어가 없어서 수동구조 is given 형태로 쓴다. 기본구조: give + O(직접목적어) + to + O(간접목적어) 형태로, 수동태가 되면 간접목적어가 주어로 가고 직접목적어가 남거나(주어 be given O), 여기처럼 직접목적어(life)가 주어가 되면 to+사람이 남는다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">용기를 내라!</span><span class=\"en\"><b><span class=\"grammar-hl\">Take heart</span>!</b></span></div></div><div class=\"lec-sent-ko\">(용기를 내라!)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Take heart (관용표현): &#39;용기를 내라&#39;는 의미의 이디엄이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하나의 호두도 그렇게 할 수 있다면</span><span class=\"en\"><b>If one nut can <span class=\"grammar-hl\">do it</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리도 그렇게 할 수 있는 것이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">so can you</span>.</b></span></div></div><div class=\"lec-sent-ko\">(하나의 호두도 그렇게 할 수 있다면 우리도 그렇게 할 수 있는 것이다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so can you (도치): 부정어 없이 &#39;또한 그러하다&#39;를 강조하기 위해 so + 조동사(can) + 주어(you) 형태로 도치가 발생했다.</div><div class=\"lec-gr-item\">do it (대동사): do는 앞의 일반동사구(fill every corner/achieve its full growth)를 대신하는 대동사(pro-verb)로 쓰였다. 앞의 동사가 일반동사이므로 do를 사용하였다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>작가가 어떤 단어를 사용하는지를 분석하면 그 사람의 기질을 파악할 수 있다.</li><li>단어 선택은 저자의 개성과 내면 세계를 반영하는 중요한 지표가 된다.</li><li>문체 분석은 단순히 언어적 연구를 넘어 저자의 인간적인 특성을 밝히는 가치 있는 작업이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Analyzing the words an author uses allows readers to discover personal characteristics, and it serves as a method to understand their unique temperament.</div>\n              <div class=\"lec-final-sum-ko\">작가가 사용하는 단어를 분석하면 독자는 개인적인 특징을 발견할 수 있고, 그것은 그들의 독특한 기질을 이해하는 방법이 된다.</div></div></div>"],"segs":[[{"audio":"./passage2_audio/1.mp3","hl":null}],[{"audio":"./passage2_audio/2.mp3","hl":null}],[{"audio":"./passage2_audio/3.mp3","hl":null},{"audio":"./passage2_audio/4.mp3","hl":"stage-0"},{"audio":"./passage2_audio/5.mp3","hl":"stage-1"}],[{"audio":"./passage2_audio/6.mp3","hl":null}],[{"audio":"./passage2_audio/7.mp3","hl":"main"},{"audio":"./passage2_audio/8.mp3","hl":"meaning"},{"audio":"./passage2_audio/9.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/10.mp3","hl":"main"},{"audio":"./passage2_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/12.mp3","hl":"main"},{"audio":"./passage2_audio/13.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/14.mp3","hl":"main"},{"audio":"./passage2_audio/15.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/16.mp3","hl":"main"},{"audio":"./passage2_audio/17.mp3","hl":"meaning"},{"audio":"./passage2_audio/18.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/19.mp3","hl":"main"},{"audio":"./passage2_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/21.mp3","hl":"main"},{"audio":"./passage2_audio/22.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/23.mp3","hl":"main"},{"audio":"./passage2_audio/24.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/25.mp3","h ut(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
