\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 호두의 겉모습만 보고 판단하면 그리 특별해 보이지 않는다는 사실을 언급하며 글을 시작합니다. &#39;marvelous&#39;는 사전적으로 &#39;경이로운&#39;이라는 뜻인데, 여기서는 필자가 호두를 겉으로만 평가했을 때의 &#39;평범함&#39;을 강조하기 위해 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that grow on our planet (관계대명사): 주격 관계대명사 that이 선행사 beautiful and exciting things를 수식하며, 절 내부에서 that이 주어 역할을 함(= 동사 grow의 주어 자리 존재)</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 흔하고, 거칠고,</span><span class=\"en\"><b><span class=\"grammar-hl\">It is common</span>, rough,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별히 매력적이지 않다,</span><span class=\"en\"><b>not particularly attractive,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 확실히 아니다</span><span class=\"en\"><b>and certainly not</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 가치가 있는 것은.</span><span class=\"en\"><b>of much value.</b></span></div></div><div class=\"lec-sent-ko\">호두는 흔하고, 거칠고, 특별히 매력적이지도 않고, 분명 많은 가치가 있지도 않다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 호두의 겉모습이 가진 단점을 나열합니다. 앞 문장의 &#39;놀랍지 않다&#39;는 추상적인 평가를 구체적인 형용사들로 풀어서 설명하며 논리적인 뒷받침을 하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is common (가주어): 진주어(형태상의 유의점): 여기서 It은 가주어가 아니라 호두(a walnut)를 가리키는 대명사 주어이며, 문장은 단순 SVC 구조임</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">게다가,</span><span class=\"en\"><b>Besides,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 작다.</span><span class=\"en\"><b><span class=\"grammar-hl\">it is small</span>.</b></span></div></div><div class=\"lec-sent-ko\">게다가, 그것은 작다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 호두의 보잘것없어 보이는 특징을 하나 더 추가하여, 호두가 왜 &#39;평범한 것&#39;처럼 보이는지를 보충 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it is small (관용표현): besides는 부사로 &#39;게다가/더욱이&#39;라는 의미로 문장 전체를 수식함</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것의 성장은 제한된다</span><span class=\"en\"><b>Its growth <span class=\"grammar-hl\">is limited</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">딱딱한 껍질에 의해</span><span class=\"en\"><b>by the hard shell</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 둘러싸고 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that surrounds it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 그 껍질은</span><span class=\"en\"><b>— the shell</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 결코 탈출하지 못하는</span><span class=\"en\"><b><span class=\"grammar-hl\">from which it never escapes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 일생 동안.</span><span class=\"en\"><b>during its lifetime.</b></span></div></div><div class=\"lec-sent-ko\">호두의 성장은 그것을 둘러싸고 있는 딱딱한 껍질, 평생 동안 결코 벗어나지 못하는 껍질에 의해 제한된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 호두가 가진 &#39;환경적 제약&#39;을 설명합니다. shell은 사전적으로 &#39;껍데기&#39;이지만, 여기서는 우리가 살면서 겪는 &#39;한계&#39;나 &#39;환경적 제약&#39;을 비유하는 말로 쓰였습니다. 필자는 호두가 가진 물리적 한계를 인간의 상황에 빗대어 표현하려 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is limited (수동태): be동사(is)+p.p.(limited) 구조. limit은 타동사인데 목적어가 없어서 수동구조 is limited 형태로 쓴다. 기본구조: V + O (목적어를 제한하다)</div><div class=\"lec-gr-item\">that surrounds it (관계대명사): 주격 관계대명사 that이 선행사 the hard shell을 수식하며, 절 내부에서 that이 주어 역할을 함(= 동사 surrounds의 주어 자리 존재)</div><div class=\"lec-gr-item\">from which it never escapes (전치사+관계대명사): 전치사 from + 관계대명사 which + S(it) + V(escapes)의 구조로, 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절(완전문장)이 온다</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">물론,</span><span class=\"en\"><b>Of course,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 잘못된 방법이다</span><span class=\"en\"><b><span class=\"grammar-hl\">that is the wrong way</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호두를 판단하는.</span><span class=\"en\"><b>to judge a walnut.</b></span></div></div><div class=\"lec-sent-ko\">물론 그것은 호두를 판단하는 잘못된 방법이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 겉모습 위주의 판단이 틀렸음을 지적하며, 글의 관점을 외부에서 내부로 전환하는 결정적인 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that is the wrong way 대명사: 여기서 that은 앞 문장의 내용 전체를 가리키는 지시 대명사임</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하나를 깨뜨려라</span><span class=\"en\"><b><span class=\"grammar-hl\">Break one open</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 안을 들여다보라.</span><span class=\"en\"><b>and look inside.</b></span></div></div><div class=\"lec-sent-ko\">호두 하나를 깨뜨려 안을 들여다보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 직접 행동을 요구하여 관점의 변화를 이끌어냅니다. 앞 문장의 &#39;잘못된 방법&#39;을 바로잡기 위한 구체적인 해결책을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Break one open (5형식(SVOC)): break(V) + one(O) + open(C). 목적어 one의 상태를 보어 open으로 설명하는 구조임</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보아라 어떻게 호두가</span><span class=\"en\"><b><span class=\"grammar-hl\">See how the walnut</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자라났는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">has grown</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 구석을 채우기 위해</span><span class=\"en\"><b>to fill every corner</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것에게 이용 가능한.</span><span class=\"en\"><b><span class=\"grammar-hl\">available to it</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 호두가 자라서 그것이 채울 수 있는 모든 구석을 어떻게 채웠는지를 보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 호두의 내면적인 노력을 강조합니다. fill은 사전적으로 &#39;채우다&#39;라는 뜻인데, 여기서는 호두가 주어진 환경 안에서 &#39;최선을 다해 자신의 능력을 끝까지 발휘했다&#39;는 의미로 확장되어 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">See how the walnut has grown (간접의문문): &#39;의문사(how) + S(the walnut) + V(has grown)&#39;의 어순으로, see의 목적어 역할을 하는 명사절임</div><div class=\"lec-gr-item\">available to it (현재분사(분사)): available이 형용사구로서 앞의 the corner를 수식하며, 의미상 &#39;그것에게 이용 가능한&#39;이라는 상태를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 결정권이 없었다</span><span class=\"en\"><b><span class=\"grammar-hl\">It had no say</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">크기에 관하여</span><span class=\"en\"><b>in the size</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 모양에 관하여</span><span class=\"en\"><b>or shape</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 껍질의.</span><span class=\"en\"><b>of that shell.</b></span></div></div><div class=\"lec-sent-ko\">호두는 껍질의 크기나 모양에는 아무런 결정권이 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 호두가 통제할 수 없는 &#39;태어난 환경&#39;을 설명합니다. have no say는 &#39;발언권이 없다&#39;는 뜻인데, 여기서는 인간이 자신의 환경이나 타고난 조건을 스스로 정할 수 없다는 숙명적인 한계를 나타내기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It had no say (관용표현): have no say in은 &#39;~에 대해 발언권이 없다/결정권이 없다&#39;는 의미의 숙어임</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러한 제약들을 고려하면,</span><span class=\"en\"><b><span class=\"grammar-hl\">given those limitations</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 이루었다</span><span class=\"en\"><b>it achieved</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 완전한 성장을.</span><span class=\"en\"><b>its full growth.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 그 제약들을 고려해볼 때 그것은 완전한 성장을 이룬 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한계가 있음에도 불구하고 호두가 이뤄낸 결과물을 칭찬하며, 앞 문장의 &#39;제한&#39;과 대비되는 &#39;성취&#39;를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">given those limitations (분사구문): 과거분사 given이 쓰인 분사구문으로, 원래 절로 변환 시 &#39;If we consider those limitations&#39;의 의미를 지님</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">얼마나 운이 좋을까 우리가</span><span class=\"en\"><b>How lucky we will be</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약, 호두처럼,</span><span class=\"en\"><b>if, like the walnut,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 꽃을 피우고 번영한다면</span><span class=\"en\"><b>we blossom and bloom</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 면에서</span><span class=\"en\"><b>in every aspect</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">삶의</span><span class=\"en\"><b>of the life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게 주어진.</span><span class=\"en\"><b><span class=\"grammar-hl\">that is given to us</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리에게 주어진 인생의 모든 면에서 우리가 호두처럼 꽃을 피운다면 우리는 얼마나 운이 좋겠는가.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 호두의 사례를 통해 인간에게 교훈을 전달합니다. blossom and bloom은 사전적으로 &#39;꽃이 피다&#39;는 뜻인데, 여기서는 인간이 자신의 잠재력을 최대한 발휘하여 &#39;성공적이고 아름답게 살아가는 모습&#39;을 비유적으로 표현했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that is given to us (수동태): be동사(is)+p.p.(given) 구조. give는 타동사인데 목적어가 없어서 수동구조 is given 형태로 쓴다. 기본구조: give + O + to B (O를 B에게 주다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">용기를 내라!</span><span class=\"en\"><b><span class=\"grammar-hl\">Take heart</span>!</b></span></div></div><div class=\"lec-sent-ko\">용기를 내라!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 직접적인 격려를 보냅니다. take heart는 &#39;기운을 차리다&#39;는 뜻인데, 앞서 호두의 사례를 통해 충분히 할 수 있다는 자신감을 심어주기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Take heart (관용표현): take heart는 &#39;용기를 내다&#39;라는 의미의 관용구임</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 하나의 호두가</span><span class=\"en\"><b>If one nut</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 할 수 있다면,</span><span class=\"en\"><b><span class=\"grammar-hl\">can do it</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너도 할 수 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">so can you</span>.</b></span></div></div><div class=\"lec-sent-ko\">하나의 호두도 그렇게 할 수 있다면 우리도 그렇게 할 수 있는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 호두와 인간을 동일시하며, 독자가 처한 환경 속에서도 스스로 충분히 성장할 수 있다는 희망적인 메시지로 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can do it (대동사): 여기서 do는 앞선 문맥의 &#39;blossom and bloom(성장하다/꽃피우다)&#39;이라는 일반동사구를 대신하는 대동사임. 앞의 동사가 일반동사이면 do를 쓴다</div><div class=\"lec-gr-item\">so can you (도치): 부정어/강조 구문인 so가 문두에 오면서 &#39;So + 조동사(can) + S(you)&#39;의 어순으로 주어와 조동사가 도치됨</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>호두는 겉보기엔 작고 보잘것없어 보이지만, 사실은 제약 속에서도 자신의 잠재력을 최대한 발휘한 결과물이다.</li><li>우리 인간도 주어진 환경과 한계라는 &#39;껍데기&#39; 안에 살고 있다.</li><li>호두처럼 자신의 환경에서 최선을 다해 내면을 채운다면, 우리도 삶을 아름답게 꽃피울 수 있다.</li><li>한 알의 호두도 해냈으니, 우리도 자신의 삶에서 충분히 성장할 수 있다는 용기를 갖자.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">A walnut grows to fill every corner of its shell despite its physical constraints, and we should also maximize our growth within the life we are given.</div>\n              <div class=\"lec-final-sum-ko\">호두는 물리적 제약에도 불구하고 껍질의 모든 구석을 채우며 성장하는데, 우리 또한 주어진 삶 안에서 자신의 성장을 극대화해야 한다.</div></div></div>"],"segs":[[{"audio":"./passage2_audio/1.mp
