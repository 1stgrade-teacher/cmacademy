ge-1\"><div class=\"lec-stage-head\">02실천 방향 설정</div><ul><li>지구의 환경 보호를 위해 화학 물질 배출을 감소시키는 노력이 필요합니다.</li><li>오염 물질 배출량(released)을 의도적으로 줄임</li><li>환경 오염 방지를 위한 필수적인 행동</li><li>핵심 키워드: 배출 감소(reduce)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03기대 효과</div><ul><li>화학 물질을 줄임으로써 깨끗한 환경을 유지할 수 있습니다.</li><li>공기와 물의 질(air and water) 개선</li><li>건강한 생태계 보존을 위한 필수 조치</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reduce</td><td class=\"m\">줄이다</td></tr><tr><td class=\"w\">hazardous</td><td class=\"m\">위험한</td></tr><tr><td class=\"w\">toxic</td><td class=\"m\">유독한</td></tr><tr><td class=\"w\">chemical</td><td class=\"m\">화학 물질</td></tr><tr><td class=\"w\">release</td><td class=\"m\">배출하다, 방출하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">철학자들은</span><span class=\"en\"><b>Philosophers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오랫동안 논쟁을 해왔는데</span><span class=\"en\"><b>have long argued</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과정에 대해</span><span class=\"en\"><b>about the <span class=\"grammar-hl\">process</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 사용하는</span><span class=\"en\"><b><span class=\"grammar-hl\">people use</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로를 이해하기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to understand</span> one another.</b></span></div></div><div class=\"lec-sent-ko\">(철학자들은 사람들이 서로를 이해하기 위해 사용하는 과정에 대해 오랫동안 논쟁을 해왔다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인간이 환경을 오염시키는 행동을 개선해야 한다는 주장을 담고 있습니다. 여기서 released는 사전적으로 &#39;풀어주다, 해방하다&#39;라는 뜻이지만, 여기서는 공장이나 일상생활에서 배출된 화학 물질이 자연으로 흘러 들어가는 상황을 나타냅니다. 필자는 단순히 화학 물질을 버리는 것이 아니라, 인간의 통제를 벗어나 자연으로 &#39;쏟아져 나오는&#39; 느낌을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">process people use to understand (to부정사): &#39;to understand&#39;는 형용사적 용법으로 앞의 명사(process)를 수식하며, &#39;이해하기 위한 과정&#39;이라는 의미를 형성함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 이들은 믿는다</span><span class=\"en\"><b>Some <span class=\"grammar-hl\">believe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 세심한 이론가라는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> we are careful theorizers.</b></span></div></div><div class=\"lec-sent-ko\">(어떤 이들은 우리가 세심한 이론가라고 믿는다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">believe that 명사절 접속사 that: believe의 목적어 역할을 하는 명사절을 이끄는 접속사로, 완전한 문장을 이끎</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 가설을 생각해 내고</span><span class=\"en\"><b>We come up with hypotheses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들이 어떻게 행동할 것인지에 대해</span><span class=\"en\"><b>about <span class=\"grammar-hl\">how other people will behave</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그런 다음 그러한 가설들을 검증하는데</span><span class=\"en\"><b>and then test those hypotheses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">증거와 대조해</span><span class=\"en\"><b>against the <span class=\"grammar-hl\">evidence</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 시시각각으로 관찰하는.</span><span class=\"en\"><b><span class=\"grammar-hl\">we observe</span> minute by minute.</b></span></div></div><div class=\"lec-sent-ko\">(우리는 다른 사람들이 어떻게 행동할 것인지에 대해 가설을 생각해 내고, 그러한 가설들을 우리가 시시각각으로 관찰하는 증거와 대조해 검증한다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how other people will behave (간접의문문): 의문사(how) + 주어(other people) + 동사(will behave) 순서로 구성되어 &#39;어떻게 다른 사람들이 행동할지&#39;라는 명사구 역할을 함</div><div class=\"lec-gr-item\">evidence we observe (관계대명사(목적격)): 명사(evidence) 뒤에 &#39;we observe&#39;라는 절이 이어지며, observe의 목적어 자리가 생략된 채 명사를 수식함</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 이론에서는</span><span class=\"en\"><b>In this theory,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 이성적인 과학자라는 인상을 주며</span><span class=\"en\"><b>people come across as rational scientists,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">끊임없이 증거를 따져보고</span><span class=\"en\"><b><span class=\"grammar-hl\">constantly weighing evidence</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">설명을 검증하는.</span><span class=\"en\"><b><span class=\"grammar-hl\">and testing explanations</span>.</b></span></div></div><div class=\"lec-sent-ko\">(이 이론에서는 사람들은 끊임없이 증거를 따져보고 설명을 검증하는 이성적인 과학자라는 인상을 준다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">constantly weighing evidence and testing explanations (현재분사): &#39;weighing&#39;과 &#39;testing&#39;은 문장의 주어인 &#39;people&#39;의 동작을 설명하는 분사구문으로, &#39;~하면서&#39;라는 동시동작을 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 뚜렷한 증거도 있는데</span><span class=\"en\"><b>And there’s clear <span class=\"grammar-hl\">evidence</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 종류의 가설 검증이</span><span class=\"en\"><b><span class=\"grammar-hl\">that this sort of hypothesis testing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일부라는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">is part of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 서로를 이해하는 방법의.</span><span class=\"en\"><b><span class=\"grammar-hl\">how we understand one another</span>.</b></span></div></div><div class=\"lec-sent-ko\">(그리고 이러한 종류의 가설 검증이 우리가 서로를 이해하는 방법의 일부라는 뚜렷한 증거도 있다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">evidence that this sort of hypothesis testing is part of 동격의 that: 앞의 명사(evidence)의 내용을 구체적으로 설명하는 절을 이끌며, &#39;이런 종류의 가설 검증이 ~의 일부라는 사실&#39;로 해석됨</div><div class=\"lec-gr-item\">how we understand one another (간접의문문): 의문사(how) + 주어(we) + 동사(understand) 순서로 구성되어 전치사 of의 목적어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 요즈음</span><span class=\"en\"><b>But these days</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 연구는 견해를 지지하는데</span><span class=\"en\"><b>most research supports <span class=\"grammar-hl\">the idea</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 무의식적으로 다른 사람의 입장이 되어 보고</span><span class=\"en\"><b><span class=\"grammar-hl\">that we automatically simulate others</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들이 느끼는 것을 이해한다는 것을</span><span class=\"en\"><b>and understand <span class=\"grammar-hl\">what others feel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">느낌으로써</span><span class=\"en\"><b>by feeling</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 경험하고 있는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">what they are experiencing</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 자신 안에서.</span><span class=\"en\"><b>in ourselves.</b></span></div></div><div class=\"lec-sent-ko\">(하지만 요즈음 대부분의 연구는 우리가 무의식적으로 다른 사람의 입장이 되어 보고 우리 자신 안에서 그들이 경험하고 있는 것을 느낌으로써 다른 사람들이 느끼는 것을 이해한다는 견해를 지지한다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the idea that we automatically simulate others 동격의 that: 앞의 명사(idea)가 담고 있는 내용을 구체화하여 &#39;우리가 타인을 자동적으로 모의한다는 생각&#39;이라는 동격 구조를 만듦</div><div class=\"lec-gr-item\">what others feel (간접의문문): 관계대명사 what(무엇을) + 주어(others) + 동사(feel) 구조로, understand의 목적어 절을 형성함</div><div class=\"lec-gr-item\">what they are experiencing (간접의문문): 의문사 what + 주어(they) + 동사(are experiencing) 구조로, 전치사 by의 목적어인 동명사(feeling) 뒤의 목적어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이런 관점에서 보면,</span><span class=\"en\"><b>In this view,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 냉정한 이론가들은 아닌데</span><span class=\"en\"><b>people aren’t cold <span class=\"grammar-hl\">theorizers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">판단을 내리는</span><span class=\"en\"><b><span class=\"grammar-hl\">who are making judgments</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들에 대해.</span><span class=\"en\"><b>about other creatures.</b></span></div></div><div class=\"lec-sent-ko\">(이런 관점에서 보면, 사람들은 다른 사람들에 대해 판단을 내리는 냉정한 이론가들은 아니다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">theorizers who are making judgments (관계대명사): 주격 관계대명사 who가 선행사(theorizers)를 수식하며, 뒤에 동사구(are making)가 이어짐</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 무의식적인 배우들이다</span><span class=\"en\"><b>They are unconscious <span class=\"grammar-hl\">actors</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이해하는</span><span class=\"en\"><b><span class=\"grammar-hl\">who understand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공유하거나 최소한 따라해 봄으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">sharing or at least simulating</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반응들을</span><span class=\"en\"><b>the responses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 보는</span><span class=\"en\"><b><span class=\"grammar-hl\">they see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주변에 있는 사람들에게서.</span><span class=\"en\"><b><span class=\"grammar-hl\">in the people</span> around them.</b></span></div></div><div class=\"lec-sent-ko\">(그들은 주변에 있는 사람들에게서 그들이 보는 반응들을 공유하거나 최소한 따라해 봄으로써 이해하는 무의식적인 배우들이다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">actors who understand (관계대명사): 주격 관계대명사 who가 선행사(actors)를 수식하며 뒤에 동사(understand)가 이어지는 구조</div><div class=\"lec-gr-item\">sharing or at least simulating (현재분사): &#39;sharing&#39;과 &#39;simulating&#39;은 동명사로 쓰여 전치사(by)의 목적어 역할을 수행하며, 방법/수단을 나타냄</div><div class=\"lec-gr-item\">they see in the people (관계대명사(목적격)): 명사(responses) 뒤에 생략된 관계대명사가 있고, 뒤에 &#39;they see&#39;라는 주어+동사가 이어지며 선행사를 수식함</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>환경 보호를 위해 공기와 물을 오염시키는 유해 화학 물질의 배출량을 줄여야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">We must minimize the release of toxic chemicals, and we should protect our air and water from pollution.</div>\n              <div class=\"lec-final-sum-ko\">우리는 유해 화학 물질 배출을 최소화해야 하며, 오염으로부터 대기와 수질을 보호해야 한다.</div></div></div>"],"segs":[[{"audio":"./passage2_audio/1.mp3","hl":null}],[{"audio":".
