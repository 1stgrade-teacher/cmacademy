DHpScgevT/J/r+nNG5fUfmKMj1H5igOV9n9zAjv3xxnoP896X/Pb8/wBP8fZCQBkkY9c/p/nr2pN6H+Icc9ew7gj8vzFBP9fl+HV/qKDnP1xQxUAnI+UE89eBk/Tjn2B70Bhk5Ixjjkdf19P1/JpIyScFQD1HX5TgZyQeuCDjHJPymrgk2nfqtFu9r6PXrbtfyLUOZOTe3+cbt+m6tdn/2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">How We Understand Others: From Cold Theorizing to Empathetic Simulation<small>우리는 타인을 어떻게 이해하는가: 냉철한 이론화에서 공감적 시뮬레이션으로</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 타인의 마음을 이해하는 과정을 설명하는 심리학 이론에는 크게 두 가지 관점이 있어요. 하나는 우리가 머릿속으로 끊임없이 상대의 행동을 예측하고 가설을 세워 검증하는 이론 이론(Theory Theory)인데, 마치 과학자가 실험을 하듯 이성적으로 타인을 분석한다고 보는 시각이죠. 반면, 최근 많은 연구가 지지하는 시뮬레이션 이론(Simulation Theory)은 우리가 타인의 감정을 내면에서 똑같이 재현해 보며 공감하는 방식을 강조해요. 쉽게 말해, 슬픈 영화를 볼 때 주인공의 슬픔을 함께 느끼는 것처럼, 타인의 반응을 내 안에서 무의식적으로 흉내 내며(Simulation) 그들의 마음을 이해한다는 뜻이에요. 즉, 우리는 차가운 분석가가 아니라 타인과 감정을 나누는 공감하는 존재(Empathetic beings)로서 세상을 살아간다고 이해하면 지문을 훨씬 쉽게 읽을 수 있을 거예요.</div></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">철학자들은</span><span class=\"en\"><b>Philosophers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오랫동안 논쟁해 왔다</span><span class=\"en\"><b>have long argued</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 과정에 대해</span><span class=\"en\"><b>about the process</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 사용하는</span><span class=\"en\"><b>people use</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로를 이해하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to understand</span> one another.</b></span></div></div><div class=\"lec-sent-ko\">철학자들은 사람들이 서로를 이해하기 위해 사용하는 과정에 대해 오랫동안 논쟁을 해왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람들이 타인의 마음을 읽고 이해하는 방식에 대한 철학적 논의를 언급하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to understand (to부정사): process를 뒤에서 수식하는 형용사적 용법의 to부정사로, &#39;~할 (과정)&#39;의 의미를 가짐</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 이들은 믿는다</span><span class=\"en\"><b>Some believe</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 ~라고</span><span class=\"en\"><b><span class=\"grammar-hl\">that we are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세심한 이론가</span><span class=\"en\"><b><span class=\"grammar-hl\">careful theorizers</span>.</b></span></div></div><div class=\"lec-sent-ko\">어떤 이들은 우리가 세심한 이론가라고 믿는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> theorizer는 사전적으로 &#39;이론을 세우는 사람&#39;을 뜻하는데, 여기서는 타인의 행동을 관찰하고 분석하는 &#39;분석가&#39;나 &#39;추론자&#39;라는 의미로 쓰였습니다. 우리가 단순히 직관적으로 아는 것이 아니라, 논리적인 근거를 따지는 존재임을 강조하려고 이 단어를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that we are careful theorizers (명사절(that절)): believe라는 타동사의 목적어 역할을 하는 명사절임</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 생각해 낸다</span><span class=\"en\"><b>We come up with</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~에 관한 가설을</span><span class=\"en\"><b>hypotheses about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 다른 사람들이</span><span class=\"en\"><b><span class=\"grammar-hl\">how other people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행동할 것인지,</span><span class=\"en\"><b><span class=\"grammar-hl\">will behave</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 나서 검증한다</span><span class=\"en\"><b>and then test</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러한 가설들을</span><span class=\"en\"><b>those hypotheses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">증거와 대조하여</span><span class=\"en\"><b>against the <span class=\"grammar-hl\">evidence</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 관찰하는</span><span class=\"en\"><b><span class=\"grammar-hl\">we observe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시시각각으로</span><span class=\"en\"><b>minute by minute.</b></span></div></div><div class=\"lec-sent-ko\">우리는 다른 사람들이 어떻게 행동할 것인지에 대해 가설을 생각해 내고, 그러한 가설들을 우리가 시시각각으로 관찰하는 증거와 대조해 검증한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;신중한 이론가&#39;라는 주장에 대한 구체적인 설명입니다. come up with는 사전적으로는 &#39;생각해 내다&#39;인데, 여기서는 가설을 &#39;만들어내다(고안하다)&#39;는 의미로 쓰여, 인간의 지적인 추론 과정을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how other people will behave (간접의문문): 의문사(how) + 주어(other people) + 동사(will behave)의 어순으로 구성된 명사절로서, 전치사 about의 목적어 역할을 함</div><div class=\"lec-gr-item\">evidence we observe 관계대명사(목적격 생략): 명사(evidence) 뒤에 주어(we)와 동사(observe)가 이어지며, observe의 목적어가 생략된 형태임</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 이론에서,</span><span class=\"en\"><b>In this theory,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 ~라는 인상을 준다</span><span class=\"en\"><b>people <span class=\"grammar-hl\">come across as</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이성적인 과학자,</span><span class=\"en\"><b>rational scientists,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">끊임없이 증거를 따져보고</span><span class=\"en\"><b><span class=\"grammar-hl\">constantly weighing evidence</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">설명을 검증하는</span><span class=\"en\"><b><span class=\"grammar-hl\">and testing explanations</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 이론에서는 사람들은 끊임없이 증거를 따져보고 설명을 검증하는 이성적인 과학자라는 인상을 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> come across as는 사전적으로 &#39;어떤 인상을 주다&#39;인데, 문맥상 &#39;보인다&#39; 혹은 &#39;나타난다&#39;로 해석됩니다. 앞에서 말한 &#39;이론가&#39;라는 개념을 &#39;과학자&#39;라는 비유를 통해 우리가 얼마나 이성적이고 분석적인지 극명하게 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">come across as (관용표현): &#39;~라는 인상을 주다&#39;라는 의미의 숙어</div><div class=\"lec-gr-item\">constantly weighing evidence and testing explanations (현재분사(분사구문)): people이 주어로 하는 능동적 동작을 설명하며, 원래 절로 변환하면 &#39;while they are constantly weighing...&#39;임</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 뚜렷한 증거가 있다</span><span class=\"en\"><b>And there’s clear <span class=\"grammar-hl\">evidence</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 종류의</span><span class=\"en\"><b><span class=\"grammar-hl\">that this sort of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가설 검증이</span><span class=\"en\"><b><span class=\"grammar-hl\">hypothesis testing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~의 일부라는</span><span class=\"en\"><b><span class=\"grammar-hl\">is part of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 이해하는 방식의</span><span class=\"en\"><b><span class=\"grammar-hl\">how we understand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로를</span><span class=\"en\"><b><span class=\"grammar-hl\">one another</span>.</b></span></div></div><div class=\"lec-sent-ko\">그리고 이러한 종류의 가설 검증이 우리가 서로를 이해하는 방법의 일부라는 뚜렷한 증거도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 주장을 뒷받침하는 근거가 있음을 인정하며, 이 이론이 일리가 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">evidence that this sort of hypothesis testing is part of how we understand one another 동격의 that: 앞의 명사(evidence)와 뒤의 that절이 같은 내용을 나타내어 명사절의 내용을 구체화함</div><div class=\"lec-gr-item\">how we understand one another (간접의문문): 전치사 of의 목적어로 쓰인 명사절로, 의문사(how) + 주어(we) + 동사(understand) 구조임</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 요즘</span><span class=\"en\"><b>But these days</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 연구는 지지한다</span><span class=\"en\"><b>most research supports</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 생각을</span><span class=\"en\"><b><span class=\"grammar-hl\">the idea</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가</span><span class=\"en\"><b><span class=\"grammar-hl\">that we</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자동적으로 다른 사람들을 시뮬레이션하고,</span><span class=\"en\"><b><span class=\"grammar-hl\">automatically simulate others</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이해한다는</span><span class=\"en\"><b>and understand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들이 느끼는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">what others feel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">느낌으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">feeling</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 경험하고 있는 것을,</span><span class=\"en\"><b><span class=\"grammar-hl\">what they are experiencing</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 자신 안에서</span><span class=\"en\"><b>in ourselves.</b></span></div></div><div class=\"lec-sent-ko\">하지만 요즈음 대부분의 연구는 우리가 무의식적으로 다른 사람의 입장이 되어 보고 우리 자신 안에서 그들이 경험하고 있는 것을 느낌으로써 다른 사람들이 느끼는 것을 이해한다는 견해를 지지한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> simulate는 사전적으로 &#39;모의 실험하다&#39;인데, 여기서는 타인의 행동이나 감정을 내면에서 똑같이 재현해 보는 &#39;공감&#39;이나 &#39;따라 하기&#39;의 의미로 쓰였습니다. But을 사용하여 앞선 &#39;과학적 분석&#39;과는 대조되는 &#39;직관적 공감&#39;이라는 새로운 관점을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the idea that we automatically simulate others 동격의 that: 앞의 명사(the idea)가 구체적으로 어떤 내용인지를 that절이 설명하고 있음</div><div class=\"lec-gr-item\">what others feel (간접의문문): understand의 목적어로 쓰인 명사절로, 의문대명사(what)가 절 안에서 feel의 목적어 역할을 함</div><div class=\"lec-gr-item\">feeling what they are experiencing (현재분사(분사구문)): 문장의 주어인 we가 행하는 부가적인 동작을 나타내며, while we are feeling...으로 변환 가능함</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이런 관점에서,</span><span class=\"en\"><b>In this view,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 ~가 아니다</span><span class=\"en\"><b>people aren’t</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">냉정한 이론가들</span><span class=\"en\"><b>cold theorizers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">판단을 내리고 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">who are making judgments</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 존재들에 대해</span><span class=\"en\"><b>about other creatures.</b></span></div></div><div class=\"lec-sent-ko\">이런 관점에서 보면, 사람들은 다른 사람들에 대해 판단을 내리는 냉정한 이론가들은 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> cold는 사전적으로 &#39;차가운&#39;이지만, 여기서는 감정이 배제된 이성적이고 계산적인 상태를 강조합니다. &#39;과학자적 분석&#39;의 차가움과 &#39;공감&#39;의 따뜻함을 대비시키기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who are making judgments (관계대명사): 주격 관계대명사(who)가 theorizers를 수식하며, 현재진행형(are making) 구조로 서술됨</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 ~이다</span><span class=\"en\"><b>They are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무의식적인 배우들</span><span class=\"en\"><b>unconscious actors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이해하는</span><span class=\"en\"><b><span class=\"grammar-hl\">who understand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공유하거나</span><span class=\"en\"><b>by sharing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 최소한 따라해 봄으로써</span><span class=\"en\"><b>or at least <span class=\"grammar-hl\">simulating</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 반응들을</span><span class=\"en\"><b>the responses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 보는</span><span class=\"en\"><b><span class=\"grammar-hl\">they see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들 안에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in the people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 주변의</span><span class=\"en\"><b><span class=\"grammar-hl\">around them</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 주변에 있는 사람들에게서 그들이 보는 반응들을 공유하거나 최소한 따라해 봄으로써 이해하는 무의식적인(자연스런) 배우들이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> actor는 사전적으로 &#39;배우(연기자)&#39;를 뜻하는데, 여기서는 타인의 감정을 내면에서 똑같이 &#39;재현해 내는 사람&#39;이라는 의미입니다. 분석적인 과학자가 아니라 타인과 감정을 나누는 능동적인 참여자라는 점을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who understand (관계대명사): 주격 관계대명사(who)가 선행사(actors)를 수식함</div><div class=\"lec-gr-item\">simulating (현재분사(분사구문)): 동시동작을 나타내는 부사적 기능으로, 접속사를 포함한 절로 변환하면 &#39;while they are simulating...&#39;임</div><div class=\"lec-gr-item\">they see in the people around them 관계대명사(목적격 생략): 선행사(responses)와 주어(they) 사이에 목적격 관계대명사가 생략되어, 뒤의 절이 선행사를 수식함</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과거에는 사람들이 타인을 이해할 때 합리적인 과학자처럼 가설을 세우고 분석한다고 보았다.</li><li>하지만 최근 연구에 따르면 우리는 타인의 감정을 내면에서 똑같이 시뮬레이션하며 공감하는 방식으로 이해한다.</li><li>즉, 인간은 타인을 차갑게 분석하는 이론가가 아니라, 무의식적으로 타인의 반응을 공유하는 공감적 존재이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People initially rely on rational hypothesis testing to understand others, but modern research indicates that we primarily grasp their emotions by unconsciously simulating their responses.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 초기에 타인을 이해하기 위해 합리적인 가설 검증에 의존하지만, 현대 연구는 우리가 타인의 반응을 무의식적으로 시뮬레이션함으로써 그들의 감정을 주로 파악한다고 밝히고 있다.</div></div></div>"],"segs":[[{"audio":"./passage2_audio/1.mp3","hl":null}],[{"audio":"./passage2_audio/2.mp3","hl":null}],[{"audio":"./passage2_audio/3.mp3","hl":"main"},{"audio":"./passage2_audio/4.mp3","hl":"meaning"},{"audio":"./passage2_audio/5.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/6.mp3","hl":"main"},{"audio":"./passage2_audio/7.mp3","hl":"meaning"},{"audio":"./passage2_audio/8.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/9.mp3","hl":"main"},{"audio":"./passage2_audio/10.mp3","hl":"meaning"},{"audio":"./passage2_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/12.mp3","hl":"main"},{"audio":"./passage2_audio/13.mp3","hl":"meaning"},{"audio":"./passage2_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/15.mp3","hl":"main"},{"audi
