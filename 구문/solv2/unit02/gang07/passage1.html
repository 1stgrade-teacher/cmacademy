>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">직장은</span><span class=\"en\"><b>The workplace</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게 제공한다</span><span class=\"en\"><b>offers us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 기회를</span><span class=\"en\"><b>many <span class=\"grammar-hl\">opportunities</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지식을 얻을</span><span class=\"en\"><b><span class=\"grammar-hl\">to gain</span> knowledge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 방식들에 관한</span><span class=\"en\"><b>about the <span class=\"grammar-hl\">different ways</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간들이 상호작용하는</span><span class=\"en\"><b><span class=\"grammar-hl\">human beings interact</span>.</b></span></div></div><div class=\"lec-sent-ko\">직장은 우리에게 인간들이 의사소통하는 여러 다른 방식들에 관한 지식을 얻을 많은 기회를 제공한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인간관계가 일어나는 장소로서의 &#39;직장&#39;이 사람들의 행동 양식을 관찰하기에 좋은 환경임을 제시하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">opportunities to gain (to부정사): 명사(opportunities)를 수식하는 형용사적 용법으로, &#39;지식을 얻을 기회&#39;라는 의미를 가짐</div><div class=\"lec-gr-item\">different ways human beings interact (관계부사): ways와 human beings interact 사이에 관계부사 how가 생략된 구조로, 앞의 명사 ways를 수식함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 많은 것을 배울 수 있다,</span><span class=\"en\"><b>We can learn a lot,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>for example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행동을 관찰함으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">observing</span> the behavior</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">회의에 참석하는 사람들의</span><span class=\"en\"><b>of people <span class=\"grammar-hl\">attending meetings</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에서 그들은 자유롭다</span><span class=\"en\"><b><span class=\"grammar-hl\">at which they are free</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 원하는 어디든 앉기에</span><span class=\"en\"><b><span class=\"grammar-hl\">to sit</span> wherever they want</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중앙 탁자 주변에</span><span class=\"en\"><b>around a central table.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 우리는 중앙 탁자 주변에 그들이 원하는 어느 곳이든 자유롭게 앉을 수 있는 회의에 참석하는 사람들의 행동을 관찰함으로써 많은 것을 배울 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;상호작용&#39;을 구체적으로 확인해볼 수 있는 사례로 &#39;회의실 자리 배치&#39;를 제시합니다. 여기서 free는 사전적으로 &#39;자유로운&#39;이지만, 여기서는 아무런 제약이나 강제된 규칙이 없는 상태를 의미합니다. 필자는 사람들이 스스로 선택한 행동에 그들의 무의식적인 의도가 담겨 있음을 보여주기 위해 이 단어를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">observing (동명사): 전치사(by)의 목적어 역할을 하며 &#39;~함으로써&#39;라는 수단/방법을 나타냄</div><div class=\"lec-gr-item\">attending meetings (현재분사): 명사(meetings)를 수식하며 &#39;회의에 참석하는 사람들&#39;이라는 동작을 설명함</div><div class=\"lec-gr-item\">at which they are free to sit (전치사+관계대명사): 전치사(at) + 관계대명사(which) 뒤에 주어(they) + 동사(are)가 갖춰진 완전한 절이 오는 구조로 앞의 명사(meetings)를 수식함</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">장소들은</span><span class=\"en\"><b>The places</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 사람이 앉기로 선택한</span><span class=\"en\"><b><span class=\"grammar-hl\">two people choose to sit in</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 보여준다</span><span class=\"en\"><b>often show</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~인지 아닌지를</span><span class=\"en\"><b>whether or not</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 같은 의견을 가지는지</span><span class=\"en\"><b>they have the same opinion</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주제에 관해</span><span class=\"en\"><b>on the topic</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">토론될</span><span class=\"en\"><b><span class=\"grammar-hl\">that will be discussed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">회의에서</span><span class=\"en\"><b>in the meeting.</b></span></div></div><div class=\"lec-sent-ko\">두 사람이 앉기를 선택한 장소는 그 회의에서 토론될 주제에 대해 둘이 같은 의견인지 아닌 지를 종종 보여준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시한 &#39;자리 배치&#39;라는 행위가 단순한 행동이 아니라, 회의 안건에 대한 그들의 입장(의견 일치 여부)을 반영하는 일종의 &#39;신호&#39;임을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">two people choose to sit in (관계대명사): 명사(places)와 two 사이에는 목적격 관계대명사(which/that)가 생략되어 있으며, 뒤의 문장(two people choose to sit in [the places])에서 목적어 자리가 빠진 형태임</div><div class=\"lec-gr-item\">that will be discussed (관계대명사): 주격 관계대명사(that)가 명사(topic)를 수식하며, 뒤에 수동태 구조가 이어짐</div><div class=\"lec-gr-item\">will be discussed (수동태): be동사(be)+p.p.(discussed) 구조. discuss는 타동사인데 목적어가 없어서 수동구조 be discussed 형태로 쓴다. 기본구조: discuss + O(목적어)</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일반적으로,</span><span class=\"en\"><b>In general,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람은 더 가능성이 높다</span><span class=\"en\"><b>a person <span class=\"grammar-hl\">is more likely</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반대편에 앉을</span><span class=\"en\"><b><span class=\"grammar-hl\">to sit</span> opposite</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가의</span><span class=\"en\"><b>someone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그나 그녀가 예상하는</span><span class=\"en\"><b><span class=\"grammar-hl\">he or she expects</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의견이 다를 것으로</span><span class=\"en\"><b><span class=\"grammar-hl\">to disagree with</span>.</b></span></div></div><div class=\"lec-sent-ko\">일반적으로 사람은 자신과 의견이 다를 것으로 예상하는 사람의 반대편에 앉을 가능성이 더 높다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자리 배치의 첫 번째 규칙을 소개합니다. 여기서 opposite은 &#39;맞은편의&#39;라는 공간적 위치를 나타내지만, 심리적으로는 상대방과 대립하거나 거리를 두려는 방어적 태도를 강조하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is more likely to sit (to부정사): 관용표현(be likely to V)의 일부로, &#39;~할 가능성이 높다&#39;는 의미를 형성</div><div class=\"lec-gr-item\">he or she expects to disagree with (관계대명사): 명사(someone)와 he 사이에 목적격 관계대명사(whom/that)가 생략되어 있으며, 뒤의 문장(he or she expects to disagree with [someone])에서 전치사의 목적어 자리가 빠진 형태임</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 사람이 느낄 때</span><span class=\"en\"><b>when two people feel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 가능성이 있다고</span><span class=\"en\"><b>that they are likely</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동의할 상태일,</span><span class=\"en\"><b><span class=\"grammar-hl\">to be in agreement</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 가능성이 있다</span><span class=\"en\"><b>there is a good chance</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 선택할</span><span class=\"en\"><b><span class=\"grammar-hl\">that they will choose</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나란히 앉기로</span><span class=\"en\"><b><span class=\"grammar-hl\">to sit</span> side by side.</b></span></div></div><div class=\"lec-sent-ko\">그러나 두 사람이 동의할 것 같다고 느낄 때 그들은 나란히 옆에 앉을 가능성이 높다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자리 배치의 두 번째 규칙으로, 의견이 같을 때의 행동을 대조적으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to be in agreement (to부정사): 형용사(likely)의 의미를 보충하는 보어 역할을 함</div><div class=\"lec-gr-item\">that they will choose to sit 동격의 that: 명사(chance) + that + S + V 구조로, 뒤의 that절이 앞의 명사(chance)의 구체적인 내용을 설명함</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인간 행동 전문가들은</span><span class=\"en\"><b>Experts in human behavior</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">믿는다</span><span class=\"en\"><b><span class=\"grammar-hl\">believe that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것은 일반적으로 ~때문이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">this is generally due to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사실</span><span class=\"en\"><b><span class=\"grammar-hl\">the fact</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">that most people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어렵다고 느낀다</span><span class=\"en\"><b><span class=\"grammar-hl\">find it hard</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가와 의견을 달리하기가</span><span class=\"en\"><b><span class=\"grammar-hl\">to disagree with</span> <span class=\"grammar-hl\">someone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 옆에 앉아 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">who is sitting next to them</span>.</b></span></div></div><div class=\"lec-sent-ko\">인간행동에 관한 전문가들은, 이것이 대부분의 사람들은 그들의 옆에 앉아 있는 사람과 의견을 같이 하기가 어렵다고 생각하는 사실 때문이라고 믿는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시한 자리 선택의 이유를 인간 심리적 측면에서 분석합니다. 여기서 hard는 &#39;단단한&#39;이라는 물리적 의미가 아니라, 심리적으로 거부감을 느끼거나 관계를 어색하게 만들기 힘들어한다는 &#39;곤란한&#39;의 의미로 쓰였습니다. 필자는 공간적인 &#39;옆자리&#39;라는 조건이 인간의 심리에 심리적 거리감을 좁혀 갈등을 피하게 만드는 효과를 준다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">believe that this is generally due to (명사절): believe의 목적어 역할을 하는 that절</div><div class=\"lec-gr-item\">the fact that most people find it hard to disagree with 동격의 that: 명사(fact) + that + S + V 구조로, 뒤의 that절이 앞의 명사(fact)의 내용을 구체화함</div><div class=\"lec-gr-item\">find it hard to disagree 5형식(SVOC) 구조: find(S) + it(가목적어 O) + hard(목적보어 C) + to disagree(진목적어) 구조로 쓰임</div><div class=\"lec-gr-item\">is sitting (현재진행): be동사(is) + -ing(sitting) 형태로 &#39;현재 ~하는 중인&#39; 상태를 나타냄</div><div class=\"lec-gr-item\">someone who is sitting next to them (관계대명사): 주격 관계대명사(who)가 선행사(someone)를 수식하며 뒤에 진행형 구조가 이어짐</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>직장은 사람들의 상호작용을 관찰하기 좋은 장소이다.</li><li>회의 시 사람들이 앉는 위치는 그들의 의견 일치 여부를 반영한다.</li><li>반대 의견을 가진 사람은 서로 마주 보는 자리를 선택하는 경향이 있다.</li><li>반면, 의견이 같은 사람들은 서로 나란히 앉으려 한다.</li><li>이는 옆에 앉은 사람에게는 반대하기 어렵다는 심리적 요인 때문이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People tend to sit opposite those they disagree with, while they prefer to sit side by side when they share similar opinions because proximity makes disagreement difficult.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 의견이 다를 것 같은 사람과는 마주 보고 앉는 반면, 의견이 같을 때는 옆자리를 선호하는데 이는 가까운 거리가 반대 의사를 표현하기 어렵게 만들기 때문이다.</div></div></div>"],"segs":[[{"audio":"./passage1_audio/1.mp3","hl":null}],[{"audio":"./passage1_audio/2.mp3","hl":null}],[{"audio":"./passage1_audio/3.mp3","hl":"main"},{"audio":"./passage1_audio/4.mp3","hl":"meaning"},{"audio":"./passage1_audio/5.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/6.mp3","hl":"main"},{"audio":"./passage1_audio/7.mp3","hl":"meaning"},{"audio":"./passage1_audio/8.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/9.mp3","hl":"main"},{"audio":"./passage1_audio/10.mp3","hl":"meaning"},{"audio":"./passage1_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/12.mp3","hl":"main"},{"audio":"./passage1_audio/13.mp3","hl":"meaning"},{"audio":"./passage1_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/15.mp3","hl":"main"},{"audio":"./passage1_audio/16.mp3","hl":"meaning"},{"audio":"./passage1_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/18.mp3","hl":"main"},{"audio":"./passage1_audio/19.mp3","hl":"meaning"},{"audio":"./passage1_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/21.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el
