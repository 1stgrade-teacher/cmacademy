16Dr+OPXrRuUdxg8dcZ9P8AP696Lra6v6r/ADBReumnp3stfvWrbu36Dv8APHb/AD/+vnNJ/n/P+f8A6wSqjJYdB0IyCen9D644GSKTeucZAyRxkZ57YJ6gfiffii67r70A72/Hr/n1/wD1c5TGQQPvdAeODg9O/wCR56deKTcAeoxj1/X39sfkc8L6EZ54GOTkjP0wRkjPBHXijmVr322W76bLVddvPVITV9NO2p//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">How Regular Exercise Boosts Brain Health<small>규칙적인 운동이 뇌 건강을 증진하는 방법</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 운동을 하고 나면 머리가 맑아지는 느낌을 받은 적 있나요? 이는 뇌의 신경가소성(Neuroplasticity)이라는 개념과 깊은 관련이 있는데, 우리 뇌는 운동을 통해 혈류량이 늘어나면 뇌 유래 신경영양인자(BDNF, Brain-Derived Neurotrophic Factor)라는 단백질을 분비하게 됩니다. 쉽게 말해, 이 물질은 뇌세포를 튼튼하게 만들고 새로운 정보를 받아들이기 좋은 환경을 조성하는 일종의 뇌의 비료 같은 역할을 하죠. 즉, 규칙적인 운동은 단순히 몸을 건강하게 하는 것을 넘어 학습 능력과 기억력을 높이는 최적의 두뇌 상태를 만들어 줍니다. 따라서 공부하기 전 가벼운 스트레칭이나 달리기를 하는 것이 기억력 향상에 큰 도움이 될 수 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01운동의 직접적 효과</div><ul><li>규칙적인 신체 활동은 뇌로 전달되는 혈액의 양을 증가시키는 역할을 합니다.</li><li>규칙적인 운동(regular exercise)의 중요성</li><li>뇌 혈류(blood flowing) 증가의 원인</li><li>핵심 키워드: 혈류량(blood flow)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02뇌 기능 향상</div><ul><li>뇌로 유입되는 혈액이 많아지면 뇌 기능이 활성화됩니다.</li><li>뇌세포에 산소와 영양분 공급 원활</li><li>신체적 움직임이 뇌 활동(brain activity)을 촉진함</li><li>핵심 키워드: 뇌 기능(brain function)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03건강한 두뇌 유지</div><ul><li>운동은 뇌 건강을 지키고 인지 능력을 개선하는 데 효과적입니다.</li><li>규칙적인 운동 습관을 통한 두뇌 관리</li><li>뇌의 효율성 증진</li><li>핵심 키워드: 신체 건강(physical health)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">regular</td><td class=\"m\">규칙적인</td></tr><tr><td class=\"w\">exercise</td><td class=\"m\">운동</td></tr><tr><td class=\"w\">increase</td><td class=\"m\">증가시키다</td></tr><tr><td class=\"w\">amount</td><td class=\"m\">양</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blood</td><td class=\"m\">혈액, 피</td></tr><tr><td class=\"w\">flow</td><td class=\"m\">흐르다</td></tr><tr><td class=\"w\">brain</td><td class=\"m\">뇌</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">직장은</span><span class=\"en\"><b>The workplace</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게</span><span class=\"en\"><b>offers us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 기회를</span><span class=\"en\"><b>many <span class=\"grammar-hl\">opportunities</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지식을 얻을</span><span class=\"en\"><b><span class=\"grammar-hl\">to gain</span> knowledge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러 다른 방식들에 관한</span><span class=\"en\"><b>about the different ways</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간들이 의사소통하는 것을 제공한다.</span><span class=\"en\"><b>human beings <span class=\"grammar-hl\">interact</span>.</b></span></div></div><div class=\"lec-sent-ko\">(직장은 우리에게 인간들이 의사소통하는 여러 다른 방식들에 관한 지식을 얻을 많은 기회를 제공한다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 주제를 제시하는 도입부입니다. 여기서 increases는 사전적으로 &#39;증가하다&#39;라는 뜻이지만, 여기서는 단순한 양적 확대를 넘어 뇌의 기능을 활성화하는 환경을 조성한다는 의미로 쓰였습니다. 필자는 운동이 뇌에 미치는 긍정적인 신체적 변화를 강조하기 위해 이 동사를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">opportunities to gain (to부정사): to + 동사원형의 형태이며, 앞의 명사 opportunities를 수식하는 형용사적 용법으로 쓰여 &#39;~할 기회&#39;라는 의미를 형성함</div><div class=\"lec-gr-item\">interact (현재분사): human beings와 interact 사이에서 &#39;인간이 상호작용하는 방식들&#39;이라는 의미로 뒤에서 앞의 명사를 수식하는 구조임</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 많은 것을 배울 수 있는데,</span><span class=\"en\"><b>We can learn a lot,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>for example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들의 행동을 관찰함으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">observing</span> the behavior of people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">회의에 참석하는</span><span class=\"en\"><b><span class=\"grammar-hl\">attending</span> meetings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 자유롭게 앉을 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">at which they are free to sit</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 원하는 어느 곳이든</span><span class=\"en\"><b>wherever they want</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중앙 탁자 주변에.</span><span class=\"en\"><b>around a central table.</b></span></div></div><div class=\"lec-sent-ko\">(예를 들어, 우리는 중앙 탁자 주변에 그들이 원하는 어느 곳이든 자유롭게 앉을 수 있는 회의에 참석하는 사람들의 행동을 관찰함으로써 많은 것을 배울 수 있다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">observing (동명사): 전치사 by의 목적어 자리에서 &#39;~함으로써&#39;라는 의미의 명사적 역할을 수행함</div><div class=\"lec-gr-item\">attending (현재분사): 앞에 있는 명사 people을 수식하며, &#39;회의에 참석하는 사람들&#39;이라는 동작의 상태를 설명함</div><div class=\"lec-gr-item\">at which they are free to sit 관계부사(전치사+관계대명사): &#39;at which + S + V&#39;의 구조로 선행사 meetings를 수식함. 관계대명사 뒤에는 주어(they)와 동사(are)가 갖춰진 완전한 절이 옴</div><div class=\"lec-gr-item\">to sit (to부정사): 형용사 free의 뒤에서 정도나 범위를 한정하는 부사적 용법으로 쓰임</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">장소는</span><span class=\"en\"><b>The places</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 사람이 앉기를 선택한</span><span class=\"en\"><b>two people <span class=\"grammar-hl\">choose to sit</span> in</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 보여주는데</span><span class=\"en\"><b>often show</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">둘이 같은 의견인지 아닌 지를</span><span class=\"en\"><b>whether or not they have the same opinion</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주제에 대해</span><span class=\"en\"><b>on the topic</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 회의에서 토론될.</span><span class=\"en\"><b><span class=\"grammar-hl\">that will be discussed</span> in the meeting.</b></span></div></div><div class=\"lec-sent-ko\">(두 사람이 앉기를 선택한 장소는 그 회의에서 토론될 주제에 대해 둘이 같은 의견인지 아닌 지를 종종 보여준다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">choose to sit (to부정사): 동사 choose의 목적어로 쓰이는 명사적 용법임</div><div class=\"lec-gr-item\">that will be discussed (관계대명사): that이 주격 관계대명사로 쓰여 앞의 명사 the topic을 수식함</div><div class=\"lec-gr-item\">will be discussed (수동태): be동사(be) + p.p.(discussed) 구조. discuss는 타동사인데 목적어가 없어서 수동구조로 쓴다. 기본구조: discuss + O(목적어)</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일반적으로</span><span class=\"en\"><b>In general,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람은</span><span class=\"en\"><b>a person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">앉을 가능성이 더 높다</span><span class=\"en\"><b>is more likely <span class=\"grammar-hl\">to sit</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람의 반대편에</span><span class=\"en\"><b>opposite someone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신과 의견이 다를 것으로 예상하는.</span><span class=\"en\"><b>he or she <span class=\"grammar-hl\">expects to disagree</span> with.</b></span></div></div><div class=\"lec-sent-ko\">(일반적으로 사람은 자신과 의견이 다를 것으로 예상하는 사람의 반대편에 앉을 가능성이 더 높다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to sit (to부정사): be likely toV 관용표현의 일부로, 주어의 상태나 성향을 설명하는 명사적 요소임</div><div class=\"lec-gr-item\">expects to disagree (to부정사): 동사 expect의 목적어로 쓰이는 명사적 용법임</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 두 사람이</span><span class=\"en\"><b>But when two people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">느낄 때</span><span class=\"en\"><b>feel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 동의할 것 같다는 것을</span><span class=\"en\"><b>that they <span class=\"grammar-hl\">are likely to be</span> <span class=\"grammar-hl\">in agreement</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능성이 높다</span><span class=\"en\"><b>there is a good chance</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 앉기를 선택할</span><span class=\"en\"><b>that they will <span class=\"grammar-hl\">choose to sit</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나란히 옆에.</span><span class=\"en\"><b>side by side.</b></span></div></div><div class=\"lec-sent-ko\">(그러나 두 사람이 동의할 것 같다고 느낄 때 그들은 나란히 옆에 앉을 가능성이 높다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are likely to be (to부정사): be likely toV 관용표현의 일부로 쓰임</div><div class=\"lec-gr-item\">in agreement (관용표현): &#39;be in agreement&#39;는 &#39;동의하는 상태이다&#39;라는 의미를 가진 구문임</div><div class=\"lec-gr-item\">choose to sit (to부정사): 동사 choose의 목적어로 쓰이는 명사적 용법임</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인간행동에 관한 전문가들은</span><span class=\"en\"><b>Experts in human behavior</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">믿는데</span><span class=\"en\"><b><span class=\"grammar-hl\">believe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것이 사실 때문이라는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> this is generally <span class=\"grammar-hl\">due to the fact</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 사람들은 어렵다고 생각하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> most people <span class=\"grammar-hl\">find it hard</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람과 의견을 같이 하기가</span><span class=\"en\"><b><span class=\"grammar-hl\">to disagree</span> with someone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 옆에 앉아 있는.</span><span class=\"en\"><b>who is <span class=\"grammar-hl\">sitting</span> next to them.</b></span></div></div><div class=\"lec-sent-ko\">(인간행동에 관한 전문가들은, 이것이 대부분의 사람들은 그들의 옆에 앉아 있는 사람과 의견을 같이 하기가 어렵다고 생각하는 사실 때문이라고 믿는다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">believe that (that절): 동사 believe의 목적어 역할을 하는 명사절로, 문장 전체의 내용을 이끎</div><div class=\"lec-gr-item\">due to the fact that 동격의 that: the fact + that + S + V 구조로, 뒤의 that절이 앞의 명사 fact의 구체적인 내용을 설명함</div><div class=\"lec-gr-item\">find it hard to disagree (5형식(SVOC)): find(V) + it(가목적어) + hard(보어) + to disagree(진목적어) 구조로, to부정사가 실제 목적어 역할을 함</div><div class=\"lec-gr-item\">to disagree (to부정사): 5형식 구조에서 진목적어 역할을 하는 명사적 용법임</div><div class=\"lec-gr-item\">sitting (현재분사): 뒤에서 someone을 수식하며, &#39;~하고 있는(상태인) 누군가&#39;라는 동작을 설명함</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>규칙적인 운동은 뇌로 향하는 혈류량을 늘려 뇌 기능을 향상시킨다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Regular exercise improves brain health as it increases the volume of blood flow to the brain.</div>\n              <div class=\"lec-final-sum-ko\">규칙적인 운동은 뇌로 향하는 혈류량을 증가시켜 뇌 건강을 향상시킨다.</div></div></div>"],"segs":[[{"audio":"./passage1_audio/1.mp3","hl":null}],[{"audio":"./passage1_audio/2.mp3","hl":null}],[{"audio":"./passage1_audio/3.mp3","hl":null},{"audio":"./passage1_audio/4.mp3","hl":"stage-0"},{"audio":"./passage1_audio/5.mp3","hl":"stage-1"},{"audio":"./passage1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./passage1_audio/7.mp3","hl":null}],[{"audio":"./passage1_audio/8.mp3","hl":"main"},{"audio":"./passage1_audio/9.mp3","hl":"meaning"},{"audio":"./passage1_audio/10.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/11.mp3","hl":"main"},{"audio":"./passage1_audio/12.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/13.mp3","hl":"main"},{"audio":"./passage1_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/15.mp3","hl":"main"},{"audio":"./passage1_audio/16.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/17.mp3","hl":"main"},{"audio":"./passage1_audio/18.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/19.mp3","hl":"main"},{"audio":"./passage1_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/21.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=M
