zF0WttttvT/ACFx9P8AP6fr+lH+f5+/+cn8U4/vL/30v+NBwc8r7jcv+NINN979dPSy/H8e4f16+9HQcdqUDOSCuB6OOn1yOT3GOCcEdqO2cjAz3H19fy/DtTv31/pfhZeQf0+99O39fISl5H5duevB/wAP5dqBz0KnjPDgen6/3l69j7nGRyueP4l79O560v6/r/gD8hKXk/pj688dPx9+aARzyp/4Evr9c+3akJAGcj04YHr+PofxHrnl2b28vvf+Yf0vw/r5C49cj04pPX3/AE+n+c/hSAjONy89PmHTjrz1zjCjJ7DnGRjgjJXk8/MOvX/Io+e//D6/1a/UBaPbPr7cf/W9aOOPmXnn7y/4/p14pMrj7y+v3gB0LevccjnkdM0dGvR/dfz8/O4rLbp26fd+PqKBjgUfrjP+eP8AP1pQM9MHPPUe36+o647cUHAGM/NkjquPp168HrjBwO4oW/e9vnfz6Bdaq/4/1109RP8APpS+vt/nP0/xFICDnBB/4EP0H4Hgfz6r0GcgHnHIOfw3cjr256c5FILXVr9dfl0fy0dw78fhx19u/Pt/Sk/z9acBkZBBHsRxnjoSOeOf07U1sAHOMfUd/wAf1/Wjv/XVD/rz/D9BT/8AXOP88deR0yPpTWyVYA4O1sfkSfz5z9aAyk4yORkcjp654B49xTmXCtkZyrHjBAAAOSeegPI4+tUlZq7tZp6rzS6+bfk7eYfn+Pn+h//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Leonardo da Vinci: A Mind That Perceived the Unseen<small>레오나르도 다 빈치: 보이지 않는 것을 본 천재적인 정신</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 르네상스 시대를 대표하는 천재 레오나르도 다빈치(Leonardo da Vinci)는 단순히 그림만 잘 그린 화가가 아니라, 과학과 공학 등 여러 분야를 넘나들며 통찰력을 발휘한 다재다능한 인물이에요. 이 글에서는 그의 뛰어난 관찰력(Observational skill)을 언급하는데, 이는 사물의 본질을 꿰뚫어 보는 힘을 의미해요. 마치 우리가 무심코 지나치는 나뭇잎의 잎맥 하나까지도 그는 새로운 시각(New perspective)으로 분석해서 정교한 작품이나 발명품의 아이디어로 연결했답니다. 이처럼 평범한 것에서 비범한 가치를 찾아내는 통찰적 사고(Insightful thinking)가 어떻게 위대한 업적을 만드는지 이번 지문을 통해 함께 살펴보면 좋겠어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01다 빈치의 특별함</div><ul><li>레오나르도 다 빈치는 일반적인 사람들과는 확연히 다른 독특한 사고방식을 지니고 있었습니다.</li><li>남다른 정신적 능력 (unusual mind)</li><li>평범한 사람들이 놓치는 것을 보는 능력</li><li>핵심 키워드: 독창성(originality), 통찰력(insight)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02뛰어난 관찰력</div><ul><li>그는 다른 사람들이 미처 보지 못하거나 간과하는 것들을 포착하는 비범한 재능을 가졌습니다.</li><li>비범한 능력 (uncanny ability)</li><li>보이지 않는 것을 보는 시각</li><li>핵심 키워드: 관찰(observation), 감각(perception)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">certainly</td><td class=\"m\">틀림없이, 분명히</td></tr><tr><td class=\"w\">unusual</td><td class=\"m\">비범한, 특이한</td></tr><tr><td class=\"w\">mind</td><td class=\"m\">정신, 지성</td></tr><tr><td class=\"w\">uncanny</td><td class=\"m\">묘한, 기이한, 초자연적인</td></tr><tr><td class=\"w\">ability</td><td class=\"m\">능력</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 자주 판단 실수를 하는데</span><span class=\"en\"><b>People regularly make mistakes of judgment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘못된 분석에 의해</span><span class=\"en\"><b>based on faulty analysis —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가게에서 틀린 상표의 샴푸를 구입하는 것처럼 사소한 실수와</span><span class=\"en\"><b>mistakes as minor as buying the wrong brand of shampoo at the grocery store</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">망하게 되어 있는 기업에 돈을 몽땅 투자하는 것처럼 중대한 실수가 있다.</span><span class=\"en\"><b>and as major as investing all of their money in an enterprise <span class=\"grammar-hl\">doomed to failure</span>.</b></span></div></div><div class=\"lec-sent-ko\">(사람들은 잘못된 분석에 의해 자주 판단 실수를 하는데, 가게에서 틀린 상표의 샴푸를 구입하는 것처럼 사소한 실수와, 망하게 되어 있는 기업에 돈을 몽땅 투자하는 것처럼 중대한 실수가 있다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장과의 논리적 관계를 고려하면, 이 글은 다 빈치가 평범한 사람들과는 다른 특별한 인물이었음을 강조하며 시작합니다. 여기서 uncanny는 사전적으로 &#39;초자연적인, 이상한&#39;이라는 뜻이지만, 여기서는 &#39;상식적으로 설명하기 어려울 만큼 놀랍고 기이한&#39;이라는 의미로 쓰였습니다. 필자는 다 빈치의 관찰력이 단순히 뛰어난 수준을 넘어, 범인의 이해를 벗어난 정도였다는 점을 강조하기 위해 이 낱말을 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">doomed to failure (과거분사): doomed이 enterprise를 수식. &#39;failure(실패)로 운명 지어진(doomed) enterprise(기업)&#39;라는 의미로 N + p.p. 형태가 축약된 관계절(enterprise that is doomed to failure) 역할을 함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이런 실수의 일부는</span><span class=\"en\"><b>While some of these errors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쉽게 돌려질 수 있지만</span><span class=\"en\"><b><span class=\"grammar-hl\">can be easily blamed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정보나 교육의 부재 탓으로</span><span class=\"en\"><b><span class=\"grammar-hl\">on</span> a lack of information or education,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 실수는</span><span class=\"en\"><b>most of them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생겨나는데</span><span class=\"en\"><b>occur</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 마음이 작용하는 방식 때문에.</span><span class=\"en\"><b>because of <span class=\"grammar-hl\">the way our minds work</span>.</b></span></div></div><div class=\"lec-sent-ko\">(이런 실수의 일부는 정보나 교육의 부재 탓으로 쉽게 돌려질 수 있지만, 대부분의 실수는 우리 마음이 작용하는 방식 때문에 생겨난다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be easily blamed on (수동태): be동사(be)+p.p.(blamed) 구조. blame은 타동사인데 뒤에 목적어가 없어서 수동구조(can be blamed) 형태로 쓴다. 기본구조: blame A on B (A를 B의 탓으로 돌리다).</div><div class=\"lec-gr-item\">the way our minds work (관계부사): the way 뒤에 생략된 how 대신 주어(our minds)+동사(work)가 이끄는 절이 결합하여 선행사(the way)를 수식하는 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mind</td><td class=\"m\">정신, 지성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리 마음이</span><span class=\"en\"><b>Our minds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 우리를 잘못 이끌어</span><span class=\"en\"><b>are frequently <span class=\"grammar-hl\">misleading us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사건이나 상황에 대한 분석을</span><span class=\"en\"><b>and <span class=\"grammar-hl\">causing our analysis of events and circumstances</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">틀리게 하는 것이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">to be wrong</span>.</b></span></div></div><div class=\"lec-sent-ko\">(우리 마음이 종종 우리를 잘못 이끌어 사건이나 상황에 대한 분석을 틀리게 하는 것이다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">misleading us (현재진행): be동사(are)+-ing(misleading) 구조. 주어(Our minds)의 동작을 서술함.</div><div class=\"lec-gr-item\">causing our analysis of events and circumstances to be wrong (5형식(SVOC)): cause + O(our analysis) + O.C.(to be wrong). 원인(causing)이 목적어의 상태(to be wrong)를 유발하는 구조.</div><div class=\"lec-gr-item\">to be wrong (to부정사): 5형식 구조에서 목적보어(O.C.) 역할을 하는 to부정사.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mind</td><td class=\"m\">정신, 지성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">극단적인 경우,</span><span class=\"en\"><b>In some extreme cases,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 결과는</span><span class=\"en\"><b><span class=\"grammar-hl\">the consequences</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">희생이 클 수 있으며</span><span class=\"en\"><b><span class=\"grammar-hl\">can be costly</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어쩌면 치명적일 수도 있다.</span><span class=\"en\"><b>perhaps even deadly.</b></span></div></div><div class=\"lec-sent-ko\">(극단적인 경우, 그 결과는 희생이 클 수 있으며 어쩌면 치명적일 수도 있다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the consequences can be costly (관용표현): &#39;costly(비용이 많이 드는/희생이 큰)&#39;라는 형용사가 문장의 보어로 쓰여 결과를 강조함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For instance,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 운전을 하는데</span><span class=\"en\"><b>if we <span class=\"grammar-hl\">are driving</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 뇌가 정보를 잘못 해석하면</span><span class=\"en\"><b>and our brains <span class=\"grammar-hl\">misinterpret the information</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신호등의 색이 전달하는</span><span class=\"en\"><b><span class=\"grammar-hl\">the color of traffic lights carries</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 치명적인 사고를 당할 수 있다.</span><span class=\"en\"><b>we could have a fatal accident.</b></span></div></div><div class=\"lec-sent-ko\">(예를 들어, 우리가 운전을 하는데 우리 뇌가 신호등의 색이 전달하는 정보를 잘못 해석하면, 우리는 치명적인 사고를 당할 수 있다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are driving (현재진행): be동사(are)+-ing(driving) 구조.</div><div class=\"lec-gr-item\">misinterpret the information the color of traffic lights carries (관계대명사): the information과 the color 사이에 목적격 관계대명사(that/which)가 생략됨. 뒤의 절(the color... carries)이 선행사(the information)를 수식함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그런 비극적인 일을 막기 위해,</span><span class=\"en\"><b><span class=\"grammar-hl\">In order to prevent</span> such a tragic event,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반드시 해라</span><span class=\"en\"><b>always <span class=\"grammar-hl\">make sure</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재확인하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to double-check</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뇌가 전하는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">what your brain is telling you</span>.</b></span></div></div><div class=\"lec-sent-ko\">(그런 비극적인 일을 막기 위해, 뇌가 전하는 것을 반드시 재확인해라.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">In order to prevent (to부정사): &#39;목적(~하기 위해서)&#39;을 나타내는 부사적 용법의 to부정사.</div><div class=\"lec-gr-item\">make sure to double-check (관용표현): &#39;make sure to + 동사원형&#39;은 &#39;~할 것을 확실히 하다/반드시 ~하다&#39;라는 의미의 관용구.</div><div class=\"lec-gr-item\">what your brain is telling you (간접의문문): what(~하는 것)이 이끄는 명사절이 전치사/타동사의 목적어 역할을 함.</div><div class=\"lec-gr-item\">is telling (현재진행): be동사(is)+-ing(telling) 구조.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">말처럼 말이다</span><span class=\"en\"><b><span class=\"grammar-hl\">As they say</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건설업계의</span><span class=\"en\"><b>in the construction industry, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 번 재고,</span><span class=\"en\"><b>“Measure twice;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 번에 자르라.</span><span class=\"en\"><b>cut once.</b></span></div></div><div class=\"lec-sent-ko\">(“두 번 재고, 한 번에 자르라”는 건설업계의 말처럼 말이다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As they say (관용표현): &#39;~라고들 하듯이&#39;라는 뜻으로 일반적인 사회적 통념이나 속담을 인용할 때 쓰는 표현.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>레오나르도 다 빈치는 일반인과는 완전히 다른 독특한 정신세계와 통찰력을 지녔다.</li><li>그는 남들이 지나치는 평범한 것들 속에서도 특별한 진실을 발견하는 능력을 갖추고 있었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Leonardo da Vinci was distinguished by his extraordinary mind, and he could perceive details that remained hidden to others.</div>\n              <div class=\"lec-final-sum-ko\">레오나르도 다 빈치는 비범한 정신력으로 남달랐으며, 다른 사람들에게는 숨겨져 있던 세부 사항들을 포착할 수 있었다.</div></div></div>"],"segs":[[{"audio":"./passage3_audio/1.mp3","hl":null}],[{"audio":"./passage3_audio/2.mp3","hl":null}],[{"audio":"./passage3_audio/3.mp3","hl":null},{"audio":"./passage3_audio/4.mp3","hl":"stage-0"},{"audio":"./passage3_audio/5.mp3","hl":"stage-1"}],[{"audio":"./passage3_audio/6.mp3","hl":null}],[{"audio":"./passage3_audio/7.mp3","hl":"main"},{"audio":"./passage3_audio/8.mp3","hl":"meaning"},{"audio":"./passage3_audio/9.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/10.mp3","hl":"main"},{"audio":"./passage3_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/12.mp3","hl":"main"},{"audio":"./passage3_audio/13.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/14.mp3","hl":"main"},{"audio":"./passage3_audio/15.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/16.mp3","hl":"main"},{"audio":"./passage3_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/18.mp3","hl":"main"},{"audio":"./passage3_audio/19.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/20.mp3","hl":"main"},{"audio":"./passage3_audio/21.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/22.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
