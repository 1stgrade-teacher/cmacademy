작은 실수부터 인생의 큰 결정까지 더 정확하게 내릴 수 있답니다. &quot;한 번 더 생각하기&quot;는 단순히 신중한 태도를 넘어, 우리 뇌의 오류를 바로잡는 아주 중요한 메타인지(Metacognition) 훈련인 셈이죠.</div></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 정기적으로 판단 실수를 한다</span><span class=\"en\"><b>People regularly make mistakes of judgment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘못된 분석에 근거한</span><span class=\"en\"><b>based on faulty analysis</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— ~만큼 사소한 실수들과</span><span class=\"en\"><b>— mistakes as minor as</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">틀린 브랜드의 샴푸를 사는 것인</span><span class=\"en\"><b>buying the wrong brand of shampoo</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식료품점에서</span><span class=\"en\"><b>at the grocery store</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~만큼 중대한 실수가</span><span class=\"en\"><b>and as major as</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 돈의 전부를 투자하는 것인</span><span class=\"en\"><b>investing all of their money</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기업에</span><span class=\"en\"><b>in an enterprise</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실패할 운명인</span><span class=\"en\"><b><span class=\"grammar-hl\">doomed to failure</span>.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 잘못된 분석에 의해 자주 판단 실수를 하는데, 가게에서 틀린 상표의 샴푸를 구입하는 것처럼 사소한 실수와, 망하게 되어 있는 기업에 돈을 몽땅 투자하는 것처럼 중대한 실수가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장은 사람들이 흔히 저지르는 판단 착오의 범위를 예시를 통해 구체적으로 보여줍니다. 여기서 doomed는 사전적으로 &#39;불운한 운명을 맞게 하다&#39;라는 뜻이지만, 여기서는 어떤 사업이 시작부터 망할 것이 이미 예정되어 있다는 점을 강조합니다. 필자는 이 단어를 통해 그런 선택이 얼마나 무모하고 돌이킬 수 없는 결정인지를 부각하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">doomed to failure (과거분사(형용사)): doomed가 enterprise를 수식. &#39;failure로 운명 지어진 enterprise&#39;라는 의미로, N+p.p. 구조(enterprise that is doomed to failure)의 축약 형태임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 실수들 중 일부는</span><span class=\"en\"><b>While some of these errors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쉽게 돌려질 수 있지만</span><span class=\"en\"><b><span class=\"grammar-hl\">can be easily blamed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정보나 교육의 부족 탓으로</span><span class=\"en\"><b><span class=\"grammar-hl\">on</span> a lack of information or education,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들 대부분은 발생한다</span><span class=\"en\"><b>most of them occur</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방식 때문에</span><span class=\"en\"><b>because of the way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 마음이 작동하는</span><span class=\"en\"><b>our minds work.</b></span></div></div><div class=\"lec-sent-ko\">이런 실수의 일부는 정보나 교육의 부재 탓으로 쉽게 돌려질 수 있지만, 대부분의 실수는 우리 마음이 작용하는 방식 때문에 생겨난다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 실수들의 원인을 두 가지(외부적 요인 vs 내부적 요인)로 분류하며, 글의 핵심 주제인 &#39;인간 사고방식의 오류&#39;로 논지를 옮겨가고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be easily blamed on (수동태): be동사(be)+p.p.(blamed) 구조. blame은 타동사인데 목적어가 없어서 수동구조 be blamed on 형태로 쓴다. 기본구조: blame A on B (A를 B의 탓으로 돌리다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리 마음은 종종 우리를 잘못 이끌고 있다</span><span class=\"en\"><b>Our minds are frequently <span class=\"grammar-hl\">misleading</span> us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 야기한다 우리의 분석이</span><span class=\"en\"><b>and <span class=\"grammar-hl\">causing our analysis</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사건들과 상황들에 대한</span><span class=\"en\"><b><span class=\"grammar-hl\">of events and circumstances</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">틀리게 되는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to be wrong</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리 마음이 종종 우리를 잘못 이끌어 사건이나 상황에 대한 분석을 틀리게 하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;마음이 작동하는 방식&#39;에 대한 구체적인 부연 설명입니다. misleading은 &#39;오도하다, 잘못 인도하다&#39;라는 뜻으로, 우리의 뇌가 객관적인 사실을 그대로 보여주지 않고 왜곡된 정보를 제공한다는 점을 나타내기 위해 선택되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">misleading (현재진행): be동사(are)+현재분사(misleading) 구조. 주어(Our minds)가 ~하는 중이라는 동작의 진행을 나타냄.</div><div class=\"lec-gr-item\">causing our analysis of events and circumstances to be wrong 5형식(SVOC) 구조: cause(동사)+our analysis(목적어)+to be wrong(목적보어/to부정사). 목적어가 ~하도록 야기한다는 의미의 구조.</div><div class=\"lec-gr-item\">to be wrong (to부정사): 5형식 구조(cause+O+toV)에서 목적보어 역할. toV가 상태를 나타내는 보어로 사용됨.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몇몇 극단적인 경우들에서,</span><span class=\"en\"><b>In some extreme cases,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 결과들은 비용이 많이 들 수 있고,</span><span class=\"en\"><b>the consequences <span class=\"grammar-hl\">can be costly</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어쩌면 심지어 치명적일 수도 있다.</span><span class=\"en\"><b>perhaps even deadly.</b></span></div></div><div class=\"lec-sent-ko\">극단적인 경우, 그 결과는 희생이 클 수 있으며 어쩌면 치명적일 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 말한 실수의 심각성을 다시 한번 강조합니다. costly는 단순한 &#39;비싼&#39;의 의미를 넘어, 돈뿐만 아니라 소중한 가치를 잃게 되는 큰 손실을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be costly (관용표현): 조동사 can이 be동사와 결합하여 가능성/잠재적 상태를 나타냄.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For instance,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 우리가 운전 중이고</span><span class=\"en\"><b><span class=\"grammar-hl\">if we are driving</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리 뇌가 잘못 해석한다면</span><span class=\"en\"><b>and our brains misinterpret</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 정보를</span><span class=\"en\"><b><span class=\"grammar-hl\">the information</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신호등의 색이 전달하는</span><span class=\"en\"><b><span class=\"grammar-hl\">the color of traffic lights carries</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 치명적인 사고를 당할 수 있다.</span><span class=\"en\"><b>we could have a fatal accident.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 우리가 운전을 하는데 우리 뇌가 신호등의 색이 전달하는 정보를 잘못 해석하면, 우리는 치명적인 사고를 당할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장의 &#39;치명적인 결과&#39;에 대한 실제적인 예시를 들어 독자의 이해를 돕고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">if we are driving (분사구문(진행)): while/if절 안에서 be동사(are)+현재분사(driving) 구조를 통해 진행 중인 상황을 조건으로 설정함.</div><div class=\"lec-gr-item\">the information the color of traffic lights carries (관계대명사(목적격)): &#39;the information&#39;과 &#39;the color...&#39; 사이에는 목적격 관계대명사(which/that)가 생략됨. 뒤의 carries의 목적어 자리가 비어 있는 불완전한 문장 구조임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">막기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">In order to prevent</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러한 비극적인 사건을,</span><span class=\"en\"><b>such a tragic event,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상 확실히 해라</span><span class=\"en\"><b>always make sure</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재확인하는 것을</span><span class=\"en\"><b>to double-check</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 뇌가 당신에게 말하고 있는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">what your brain is telling you</span>.</b></span></div></div><div class=\"lec-sent-ko\">그런 비극적인 일을 막기 위해, 뇌가 전하는 것을 반드시 재확인해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지의 문제 상황을 해결하기 위한 필자의 제언입니다. 앞의 분석적 내용들을 바탕으로, 뇌의 본능적인 판단을 무조건 믿지 말고 한 번 더 검증하라는 결론을 도출합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">In order to prevent (to부정사): &#39;하기 위해서&#39;라는 부사적 용법의 목적을 나타내는 관용표현.</div><div class=\"lec-gr-item\">what your brain is telling you (간접의문문(명사절)): &#39;what your brain is telling you&#39; 전체가 &#39;check&#39;의 목적어 역할을 함. 의문사 what이 포함된 절이 명사구처럼 쓰임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들이 말하듯이</span><span class=\"en\"><b><span class=\"grammar-hl\">As they say</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건설 업계에서,</span><span class=\"en\"><b>in the construction industry,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“두 번 측정하라;</span><span class=\"en\"><b>“Measure twice;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 번 잘라라.”</span><span class=\"en\"><b>cut once.”</b></span></div></div><div class=\"lec-sent-ko\">“두 번 재고, 한 번에 자르라”는 건설업계의 말처럼 말이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이전 문장의 &#39;재확인&#39;의 중요성을 격언을 인용하여 효과적으로 강조합니다. Measure twice; cut once는 비유적 표현으로, 신중한 준비와 확인이 돌이킬 수 없는 실수를 막는다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As they say (관용표현): &#39;~처럼&#39;이라는 의미의 접속사로서 일반적인 통념을 인용할 때 사용됨.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우리는 잘못된 분석으로 사소한 것부터 중대한 것까지 판단 착오를 자주 겪는다.</li><li>이러한 실수는 단순히 정보가 부족해서가 아니라, 우리 뇌 자체가 정보를 처리하는 방식의 결함 때문이다.</li><li>잘못된 판단은 생명을 위협할 정도로 심각한 결과를 초래할 수 있다.</li><li>따라서 뇌가 내리는 판단을 무비판적으로 수용하지 말고, 항상 이중으로 확인하는 습관을 들여야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Our brains often process information incorrectly, so we must double-check our judgments to prevent potentially dangerous mistakes.</div>\n              <div class=\"lec-final-sum-ko\">우리의 뇌는 종종 정보를 잘못 처리하기 때문에, 잠재적으로 위험한 실수를 막기 위해 우리는 자신의 판단을 다시 확인해야 한다.</div></div></div>"],"segs":[[{"audio":"./passage3_audio/1.mp3","hl":null}],[{"audio":"./passage3_audio/2.mp3","hl":null}],[{"audio":"./passage3_audio/3.mp3","hl":"main"},{"audio":"./passage3_audio/4.mp3","hl":"meaning"},{"audio":"./passage3_audio/5.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/6.mp3","hl":"main"},{"audio":"./passage3_audio/7.mp3","hl":"meaning"},{"audio":"./passage3_audio/8.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/9.mp3","hl":"main"},{"audio":"./passage3_audio/10.mp3","hl":"meaning"},{"audio":"./passage3_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/12.mp3","hl":"main"},{"audio":"./passage3_audio/13.mp3","hl":"meaning"},{"audio":"./passage3_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/15.mp3","hl":"main"},{"audio":"./passage3_audio/16.mp3","hl":"meaning"},{"audio":"./passage3_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/18.mp3","hl":"main"},{"audio":"./passage3_audio/19.mp3","hl":"meaning"},{"audio":"./passage3_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/21.mp3","hl":"main"},{"audio":"./passage3_audio/22.mp3","hl":"meaning"},{"audio":"./passage3_audio/23.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/24.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
