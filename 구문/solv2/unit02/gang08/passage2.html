low lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01기술 개발의 배경</div><ul><li>구글을 비롯한 세계 여러 자동차 회사들이 기존 차량에 적용할 기술을 연구하고 있습니다.</li><li>대상: 현재 사람이 직접 운전하는 차량(manned vehicles)</li><li>목적: 운전자가 손을 놓고 다른 활동을 할 수 있는 기술 개발</li><li>핵심 키워드: 운전자 없는 주행(autonomous driving)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02핵심 기능 구현</div><ul><li>운전자의 물리적 개입을 줄여 주행 중 다른 업무에 집중할 수 있게 합니다.</li><li>운전대에서 손을 떼는 주행(take hands off the wheel)</li><li>운전 이외의 다른 작업(other tasks)에 집중 가능</li><li>핵심 키워드: 기술 혁신(technological innovation)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">carmaker</td><td class=\"m\">자동차 제조사</td></tr><tr><td class=\"w\">develop</td><td class=\"m\">개발하다</td></tr><tr><td class=\"w\">technology</td><td class=\"m\">기술</td></tr><tr><td class=\"w\">apply</td><td class=\"m\">적용하다</td></tr><tr><td class=\"w\">currently</td><td class=\"m\">현재</td></tr><tr><td class=\"w\">manned</td><td class=\"m\">유인의 (사람이 탑승하여 조종하는)</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">vehicle</td><td class=\"m\">탈것, 차량</td></tr><tr><td class=\"w\">permit</td><td class=\"m\">허용하다, 가능하게 하다</td></tr><tr><td class=\"w\">take one&#39;s hands off</td><td class=\"m\">~에서 손을 떼다</td></tr><tr><td class=\"w\">wheel</td><td class=\"m\">(자동차의) 핸들, 바퀴</td></tr><tr><td class=\"w\">focus on</td><td class=\"m\">~에 집중하다</td></tr><tr><td class=\"w\">task</td><td class=\"m\">과업, 일</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">선인장은</span><span class=\"en\"><b>Cacti</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">살아남고 번성할 수 있다</span><span class=\"en\"><b>can survive and thrive</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사막 환경에서</span><span class=\"en\"><b>in desert environments</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 가지 독특한 외형적 특징 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">because of</span> some unique physical features.</b></span></div></div><div class=\"lec-sent-ko\">(선인장은 몇 가지 독특한 외형적 특징 때문에 사막 환경에서 살아남고 번성할 수 있다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 자율주행 기술의 현재 개발 현황을 설명합니다. 여기서 manned는 사전적으로는 &#39;사람이 탑승한/유인(有人)의&#39;라는 뜻인데, 여기서는 기술이 개입되기 전의 &#39;사람이 직접 운전하는 상태&#39;를 강조합니다. 필자는 자율주행과 대비되는 현재의 운전 방식을 명확히 정의하여, 기술 변화의 지점을 보여주려고 이 단어를 골랐습니다. 앞 문장이 없으나, 이 글은 앞으로 다가올 &#39;무인 운전&#39; 시대를 암시하며 기술의 목적을 밝히고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because of (관용표현): 전치사구로 &#39;… 때문에&#39;라는 뜻을 가지며, 뒤에 명사구(some unique physical features)를 목적어로 취합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">선인장은</span><span class=\"en\"><b>Cacti</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잎을 완전히 잃지는 않았지만</span><span class=\"en\"><b><span class=\"grammar-hl\">have never lost</span> their leaves completely</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수백만 년의 진화를 겪으며</span><span class=\"en\"><b>over millions of years of evolution,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잎은</span><span class=\"en\"><b>but their leaves</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 작아졌다.</span><span class=\"en\"><b><span class=\"grammar-hl\">have gotten</span> smaller.</b></span></div></div><div class=\"lec-sent-ko\">(선인장은 수백만 년의 진화를 겪으며 잎을 완전히 잃지는 않았지만, 잎은 더 작아졌다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have never lost (현재완료): have + p.p. 형태이며, 과거의 어느 시점부터 현재까지의 지속적인 상태나 경험을 나타냅니다.</div><div class=\"lec-gr-item\">have gotten (현재완료): have + p.p. 형태이며, 변화의 과정을 강조하여 과거부터 지금까지 상태가 변했음을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이는</span><span class=\"en\"><b>This</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선인장에 도움이 되었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">has helped</span> the cacti</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">표면적을 줄임으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">by reducing</span> their surface area,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">표면적을 통해 수분이</span><span class=\"en\"><b><span class=\"grammar-hl\">through which</span> moisture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">손실될 수 있기 때문이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">can be lost</span>.</b></span></div></div><div class=\"lec-sent-ko\">(이는 표면적을 줄임으로써 선인장에 도움이 되었는데, 표면적을 통해 수분이 손실될 수 있기 때문이다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has helped (현재완료): have + p.p. 형태이며, 앞선 상황이 현재 결과에 영향을 미치고 있음을 나타냅니다.</div><div class=\"lec-gr-item\">by reducing (동명사): 전치사 &#39;by&#39;의 목적어로 쓰여 &#39;…함으로써&#39;라는 수단/방법을 나타냅니다.</div><div class=\"lec-gr-item\">through which (전치사+관계대명사): 전치사+관계대명사(which) 뒤에 &#39;moisture can be lost&#39;라는 주어+동사를 갖춘 완전한 절이 오는 관계대명사절 구조입니다.</div><div class=\"lec-gr-item\">can be lost (수동태): be동사(be) + p.p.(lost) 구조입니다. lose는 타동사인데 목적어가 없어서 수동구조 be lost 형태로 씁니다. 기본구조: S + lose + O(목적어).</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 종의 선인장은</span><span class=\"en\"><b>Many species of cacti</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또 잎에 뾰족한 가시를 돋게 했는데</span><span class=\"en\"><b><span class=\"grammar-hl\">have also developed</span> pointy spines for leaves,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이는 물의 증발을 적게 만들어 줄뿐 아니라</span><span class=\"en\"><b>which not only <span class=\"grammar-hl\">allow less water to evaporate</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그늘을 주며</span><span class=\"en\"><b>but also <span class=\"grammar-hl\">shade</span> the plants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹독한 사막의 태양으로부터</span><span class=\"en\"><b>from harsh desert sunlight</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 보호해준다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">protect</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">촉촉하고 영양분 있는 잎의 살을 먹으려 하는 동물들로부터</span><span class=\"en\"><b>from animals <span class=\"grammar-hl\">looking to eat</span> their moist, nutritious flesh.</b></span></div></div><div class=\"lec-sent-ko\">(많은 종의 선인장은 또 잎에 뾰족한 가시를 돋게 했는데, 이는 물의 증발을 적게 만들어 줄뿐 아니라, 혹독한 사막의 태양으로부터 그늘을 주며, 촉촉하고 영양분 있는 잎의 살을 먹으려 하는 동물들로부터 그들을 보호해준다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have also developed (현재완료): have + p.p. 형태이며, 과거부터 현재까지 축적된 변화를 나타냅니다.</div><div class=\"lec-gr-item\">allow less water to evaporate (5형식(SVOC)): allow + O(less water) + OC(to부정사) 구조로, 목적어가 목적격보어하는 것을 가능하게 하다라는 의미입니다.</div><div class=\"lec-gr-item\">to evaporate (to부정사): 5형식 문장에서 allow의 목적격 보어로 사용되어 동작의 미래적/당위적 의미를 나타냅니다.</div><div class=\"lec-gr-item\">shade (to부정사): 앞선 allow와 병렬 구조를 이루며, 생략된 to가 있는 원형부정사(to) shade 형태로 목적격 보어 역할을 합니다.</div><div class=\"lec-gr-item\">protect (to부정사): allow의 목적격 보어로 사용되는 병렬 구조로, 생략된 to가 있는 원형부정사(to) protect 형태입니다.</div><div class=\"lec-gr-item\">looking to eat (현재분사): looking이 앞의 명사 animals를 수식하는 구조이며(= &#39;…을 찾는 동물&#39;), &#39;동작&#39;을 나타내는 현재분사(형용사)입니다.</div><div class=\"lec-gr-item\">to eat (to부정사): 앞의 분사 looking을 수식하는 부사적 용법으로, &#39;먹으려고&#39;라는 목적을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">develop</td><td class=\"m\">개발하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대부분의 선인장 종은</span><span class=\"en\"><b>Most species of cacti</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 밀랍이 있는데</span><span class=\"en\"><b>also have <span class=\"grammar-hl\">wax</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잎과 줄기를 덮어주는</span><span class=\"en\"><b><span class=\"grammar-hl\">covering their leaves and stems</span>.</b></span></div></div><div class=\"lec-sent-ko\">(대부분의 선인장 종은 또한 잎과 줄기를 덮어주는 밀랍이 있다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wax covering their leaves and stems (현재분사): covering이 앞의 명사 wax를 수식하는 구조이며(= &#39;잎과 줄기를 덮고 있는 왁스&#39;), &#39;동작/상태&#39;를 나타내는 현재분사(형용사)입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이는</span><span class=\"en\"><b>This</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수분 손실을 줄이는 것을 고려한 것인데</span><span class=\"en\"><b><span class=\"grammar-hl\">allows for</span> <span class=\"grammar-hl\">a reduction</span> of water loss,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선인장의 수분은</span><span class=\"en\"><b>as the cactus’s moisture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밀랍 코팅을 통과할 수 없기 때문이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">cannot penetrate</span> the wax coating.</b></span></div></div><div class=\"lec-sent-ko\">(이는 수분 손실을 줄이는 것을 고려한 것인데, 선인장의 수분은 밀랍 코팅을 통과할 수 없기 때문이다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">allows for (관용표현): &#39;…을 가능하게 하다&#39;라는 의미의 숙어적 표현입니다.</div><div class=\"lec-gr-item\">a reduction 명사: 문장 내에서 동사 allow for의 목적어 역할을 합니다.</div><div class=\"lec-gr-item\">cannot penetrate (조동사): 조동사 can과 동사원형 penetrate를 사용하여 부정적인 능력이나 가능성을 나타냅니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>구글과 세계적인 자동차 기업들이 자율주행 기술을 개발 중이다.</li><li>이 기술의 목적은 운전자가 운전에서 벗어나 다른 활동을 할 수 있게 만드는 것이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Global carmakers are developing technologies for current vehicles, and these innovations allow drivers to focus on other tasks instead of driving.</div>\n              <div class=\"lec-final-sum-ko\">전 세계 자동차 제조사들은 현재 차량을 위한 기술을 개발하고 있으며, 이러한 혁신은 운전자가 운전 대신 다른 일에 집중할 수 있게 해준다.</div></div></div>"],"segs":[[{"audio":"./passage2_audio/1.mp3","hl":null}],[{"audio":"./passage2_audio/2.mp3","hl":null}],[{"audio":"./passage2_audio/3.mp3","hl":null},{"audio":"./passage2_audio/4.mp3","hl":"stage-0"},{"audio":"./passage2_audio/5.mp3","hl":"stage-1"}],[{"audio":"./passage2_audio/6.mp3","hl":null}],[{"audio":"./passage2_audio/7.mp3","hl":"main"},{"audio":"./passage2_audio/8.mp3","hl":"meaning"},{"audio":"./passage2_audio/9.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/10.mp3","hl":"main"},{"audio":"./passage2_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/12.mp3","hl":"main"},{"audio":"./passage2_audio/13.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/14.mp3","hl":"main"},{"audio":"./passage2_audio/15.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/16.mp3","hl":"main"},{"audio":"./passage2_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/18.mp3","hl":"main"},{"audio":"./passage2_audio/19.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/20.mp3","hl":nu
