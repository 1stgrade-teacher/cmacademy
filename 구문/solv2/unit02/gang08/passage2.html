n class=\"grammar-hl\">because of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 가지 독특한 외형적 특징들</span><span class=\"en\"><b>some unique physical features.</b></span></div></div><div class=\"lec-sent-ko\">선인장은 몇 가지 독특한 외형적 특징 때문에 사막 환경에서 살아남고 번성할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 선인장이 척박한 사막에서 어떻게 생존하는지에 대한 주제를 제시합니다. 여기서 thrive는 사전적으로 &#39;번영하다&#39;이지만, 여기서는 식물이 환경에 완전히 적응해 잘 자라는 모습을 강조합니다. 단순히 &#39;살아남는 것&#39;을 넘어 &#39;매우 잘 자란다&#39;는 의미를 전달하려고 이 단어를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because of (관용표현): 전치사구로 &#39;… 때문에&#39;라는 뜻을 가지며, 뒤에 명사구(some unique physical features)가 이어지는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">선인장은</span><span class=\"en\"><b>Cacti</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잎을 완전히 잃지는 않았다</span><span class=\"en\"><b><span class=\"grammar-hl\">have never lost</span> their leaves completely</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수백만 년 동안</span><span class=\"en\"><b>over millions of years</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진화의</span><span class=\"en\"><b>of evolution,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 잎들은</span><span class=\"en\"><b>but their leaves</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 작아졌다</span><span class=\"en\"><b>have gotten smaller.</b></span></div></div><div class=\"lec-sent-ko\">선인장은 수백만 년의 진화를 겪으며 잎을 완전히 잃지는 않았지만, 잎은 더 작아졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;독특한 특징&#39; 중 첫 번째로 &#39;잎의 축소&#39;를 다룹니다. 진화라는 긴 시간의 흐름 속에서도 잎을 완전히 없애지 않고 크기를 줄이는 방향으로 적응했음을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have never lost (현재완료): have + p.p. 형태입니다. 과거의 특정 시점부터 현재까지의 상태나 경험을 나타낼 때 사용합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 선인장을 도왔다</span><span class=\"en\"><b>This has <span class=\"grammar-hl\">helped the cacti</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 표면적을 줄임으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">by reducing</span> their surface area,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 통해</span><span class=\"en\"><b><span class=\"grammar-hl\">through which</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수분이 손실될 수 있는</span><span class=\"en\"><b>moisture <span class=\"grammar-hl\">can be lost</span>.</b></span></div></div><div class=\"lec-sent-ko\">이는 (선인장의) 표면적을 줄임으로써 선인장에 도움이 되었는데, 표면적을 통해 수분이 손실될 수 있기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 왜 잎이 작아졌는지 그 생물학적 이유를 설명합니다. &#39;표면적&#39;이 넓으면 수분 증발이 잘 일어나는데, 이를 줄임으로써 생존력을 높였다는 인과관계를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">helped the cacti by reducing (동명사): 전치사 &#39;by&#39;의 목적어 역할을 하며, &#39;reduce(줄이다)&#39;라는 행위를 명사화하여 수단이나 방법을 나타냅니다.</div><div class=\"lec-gr-item\">through which (전치사+관계대명사): 전치사+관계대명사+S+V(moisture can be lost) 구조입니다. 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절이 오며, 앞의 선행사(surface area)를 수식합니다.</div><div class=\"lec-gr-item\">can be lost (수동태): be동사(be)+p.p.(lost) 구조입니다. lose는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(can be lost) 형태로 씁니다. 기본구조: lose O (O를 잃다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 종의 선인장은</span><span class=\"en\"><b>Many species of cacti</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 발달시켰다</span><span class=\"en\"><b>have also <span class=\"grammar-hl\">developed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뾰족한 가시를</span><span class=\"en\"><b>pointy spines</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잎 대신에,</span><span class=\"en\"><b>for leaves,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~할 뿐만 아니라</span><span class=\"en\"><b>which not only</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 적은 물을 허용한다</span><span class=\"en\"><b><span class=\"grammar-hl\">allow less water</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">증발하도록,</span><span class=\"en\"><b><span class=\"grammar-hl\">to evaporate</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 식물에게 그늘을 준다</span><span class=\"en\"><b>but also shade the plants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹독한 사막 햇빛으로부터</span><span class=\"en\"><b>from harsh desert sunlight</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그들을 보호한다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">protect them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물들로부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from animals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹으려고 하는</span><span class=\"en\"><b><span class=\"grammar-hl\">looking to eat</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 촉촉하고 영양분 있는 살을</span><span class=\"en\"><b>their moist, nutritious flesh.</b></span></div></div><div class=\"lec-sent-ko\">많은 종의 선인장은 또 잎에 뾰족한 가시를 돋게 했는데, 이는 물의 증발을 적게 만들어 줄뿐 아니라, 혹독한 사막의 태양으로부터 그늘을 주며, 촉촉하고 영양분 있는 잎의 살을 먹으려 하는 동물들로부터 그들을 보호해준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 잎이 가시로 변한 또 다른 이점을 설명합니다. 단순히 수분을 지키는 것을 넘어 햇빛 차단과 동물 방어라는 복합적인 역할을 수행함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">developed (현재완료): have + p.p.(developed) 구조입니다. 과거부터 현재까지 지속되거나 완료된 상태를 나타냅니다.</div><div class=\"lec-gr-item\">allow less water to evaporate (5형식(SVOC)): allow + 목적어(less water) + 목적보어(to evaporate) 구조입니다. allow는 5형식 문장에서 목적어가 to부정사하도록 허용한다는 의미로 사용됩니다.</div><div class=\"lec-gr-item\">to evaporate (to부정사): 5형식 문장에서 목적보어 역할을 하며, 목적어인 &#39;less water&#39;의 동작을 보충 설명합니다.</div><div class=\"lec-gr-item\">protect them from animals looking to eat (현재분사): looking이 animals를 수식합니다. &#39;먹으려고 하는 동물들&#39;이라는 의미로, 명사 뒤에서 동작을 나타내며 수식하는 현재분사(형용사) 구조입니다.</div><div class=\"lec-gr-item\">to eat (to부정사): looking을 수식하는 부사적 용법으로, &#39;먹으려는&#39;이라는 목적의 의미를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대부분의 선인장 종들은</span><span class=\"en\"><b>Most species of cacti</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 왁스를 가지고 있다</span><span class=\"en\"><b>also have wax</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 잎과 줄기를 덮는</span><span class=\"en\"><b><span class=\"grammar-hl\">covering their leaves and stems</span>.</b></span></div></div><div class=\"lec-sent-ko\">대부분의 선인장 종은 또한 잎과 줄기를 덮어주는 밀랍이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 특징으로 왁스 코팅을 소개하며, 앞선 문장들과 나열 구조를 이룹니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">covering their leaves and stems (현재분사): covering이 wax를 수식합니다. &#39;잎과 줄기를 덮고 있는 왁스&#39;라는 의미로, 명사 뒤에서 진행 중인 동작이나 상태를 나타내는 현재분사(형용사) 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 ~을 가능하게 한다</span><span class=\"en\"><b>This <span class=\"grammar-hl\">allows for</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수분 손실의 감소를,</span><span class=\"en\"><b><span class=\"grammar-hl\">a reduction</span> of water loss,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 선인장의 수분은</span><span class=\"en\"><b>as the cactus’s moisture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">통과할 수 없기 때문이다</span><span class=\"en\"><b><span class=\"grammar-hl\">cannot penetrate</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 왁스 코팅을</span><span class=\"en\"><b>the wax coating.</b></span></div></div><div class=\"lec-sent-ko\">이는 수분 손실을 줄이는 것을 고려한 것인데, 선인장의 수분은 밀랍 코팅을 통과할 수 없기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 왁스 코팅의 기능을 구체적으로 설명합니다. penetrate는 사전적으로 &#39;침투하다, 관통하다&#39;인데, 여기서는 수분이 외부로 빠져나가지 못하게 막는 장벽 역할을 강조합니다. 왁스가 마치 방수 코팅처럼 작용한다는 의미를 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">allows for a reduction (관용표현): &#39;allow for&#39;는 &#39;~을 고려하다&#39; 또는 &#39;~을 가능하게 하다&#39;라는 숙어입니다.</div><div class=\"lec-gr-item\">cannot penetrate (조동사): &#39;can&#39;은 가능이나 능력을 나타내며 뒤에 동사원형을 취합니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>선인장은 척박한 사막 환경에서 살아남기 위해 진화 과정을 거치며 독특한 신체 구조를 갖게 되었다.</li><li>잎의 크기를 줄여 표면적을 최소화함으로써 수분 증발을 방지했다.</li><li>잎을 가시로 변형시켜 증발 억제, 햇빛 차단, 천적으로부터의 보호라는 다목적 기능을 수행한다.</li><li>표면에 왁스 층을 발달시켜 수분이 밖으로 나가지 못하게 차단함으로써 생존력을 높였다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Cacti have evolved smaller leaves and waxy coatings to reduce water loss, while their sharp spines provide protection from sunlight and animals.</div>\n              <div class=\"lec-final-sum-ko\">선인장은 수분 손실을 줄이기 위해 잎을 작게 하고 왁스 코팅을 진화시켰으며, 날카로운 가시는 햇빛과 동물로부터 식물을 보호한다.</div></div></div>"],"segs":[[{"audio":"./passage2_audio/1.mp3","hl":null}],[{"audio":"./passage2_audio/2.mp3","hl":null}],[{"audio":"./passage2_audio/3.mp3","hl":"main"},{"audio":"./passage2_audio/4.mp3","hl":"meaning"},{"audio":"./passage2_audio/5.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/6.mp3","hl":"main"},{"audio":"./passage2_audio/7.mp3","hl":"meaning"},{"audio":"./passage2_audio/8.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/9.mp3","hl":"main"},{"audio":"./passage2_audio/10.mp3","hl":"meaning"},{"audio":"./passage2_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/12.mp3","hl":"main"},{"audio":"./passage2_audio/13.mp3","hl":"meaning"},{"audio":"./passage2_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/15.mp3","hl":"main"},{"audio":"./passage2_audio/16.mp3","hl":"meaning"},{"audio":"./passage2_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/18.mp3","hl":"main"},{"audio":"./passage2_audio/19.mp3","hl":"meaning"},{"audio":"./passage2_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/21.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top
