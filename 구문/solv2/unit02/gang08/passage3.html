히 바로잡는 과정(Early Correction)이 무엇보다 중요합니다. 오늘 배운 내용을 그날 바로 복습하며 모르는 부분을 완전히 자기 것으로 만드는 습관은, 공부라는 긴 프로젝트에서 불필요한 시간 낭비를 막고 효율을 극대화하는 가장 강력한 전략이 됩니다.</div></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소프트웨어를 개발할 때는</span><span class=\"en\"><b>In software development</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘 알려져 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">it’s</span> <span class=\"grammar-hl\">well known</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오류가 수정되어야 한다는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> bugs <span class=\"grammar-hl\">should be fixed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">되도록 빨리</span><span class=\"en\"><b>as soon as possible</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확인된 후에는</span><span class=\"en\"><b>after they <span class=\"grammar-hl\">have been identified</span>.</b></span></div></div><div class=\"lec-sent-ko\">소프트웨어를 개발할 때는 오류가 확인된 후에는 되도록 빨리 수정해야 한다는 것이 잘 알려져 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소프트웨어 개발의 원리를 언급하며 글을 시작합니다. 여기서 well known은 &#39;모두가 동의하는 상식&#39;이라는 뜻으로, 이후에 나올 학습법의 정당성을 확보하기 위해 이 표현을 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it’s (가주어): 진주어: it은 가주어이며, that절(bugs should be fixed...)이 진주어로 쓰여 문장의 진짜 주어 역할을 함.</div><div class=\"lec-gr-item\">well known that 동격의 that: well known(사실/내용)이라는 명사적 성격의 서술 뒤에서 그 내용을 구체화하는 that절로, 앞의 well known이 내포하는 바를 설명함.</div><div class=\"lec-gr-item\">should be fixed (수동태): be동사(be)+p.p.(fixed) 구조. fix는 타동사인데 목적어가 없어서 수동구조 be fixed 형태로 쓴다. 기본구조: fix + O(목적어) (목적어를 고치다).</div><div class=\"lec-gr-item\">have been identified (수동태): be동사(have been)+p.p.(identified) 구조. identify는 타동사인데 목적어가 없어서 수동구조 have been identified 형태로 쓴다. 기본구조: identify + O(목적어) (목적어를 식별하다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">프로젝트의 끝 무렵에</span><span class=\"en\"><b><span class=\"grammar-hl\">Waiting until the end of a project</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오류를 수정하려고 미루는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to fix a bug</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">노력이 50배나 더 필요할 수도 있다</span><span class=\"en\"><b>can take fifty times as much effort</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수정하는 것보다</span><span class=\"en\"><b>as <span class=\"grammar-hl\">it would take</span> to fix the bug</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음에 오류가 발견되었을 때</span><span class=\"en\"><b>the first time <span class=\"grammar-hl\">it was noticed</span>.</b></span></div></div><div class=\"lec-sent-ko\">프로젝트의 끝 무렵에 오류를 수정하려고 미루는 것은, 처음에 오류가 발견되었을 때 수정하는 것보다 노력이 50배나 더 필요할 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 일반적인 원칙을 구체적인 수치(50배)로 제시하여, 문제 해결을 미루는 것이 얼마나 비효율적인지 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Waiting until the end of a project (동명사): 문장에서 주어 역할을 하며, 프로젝트의 끝까지 기다리는 행위라는 명사적 개념으로 사용됨.</div><div class=\"lec-gr-item\">to fix a bug (to부정사): 앞의 Waiting을 수식하거나 행위의 목적을 나타내는 부사적 용법으로, 버그를 고치기 위해 기다리는 상황을 설명함.</div><div class=\"lec-gr-item\">it would take (관용표현): take + 시간/노력 + to V(…하는 데 …가 들다) 구조. 여기서는 it(가주어)이 take의 목적을 설명하는 진주어(to fix...)를 대신함.</div><div class=\"lec-gr-item\">it was noticed (수동태): be동사(was)+p.p.(noticed) 구조. notice는 타동사인데 목적어가 없어서 수동구조 was noticed 형태로 쓴다. 기본구조: notice + O(목적어) (목적어를 알아차리다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">배우지 못하는 것도</span><span class=\"en\"><b><span class=\"grammar-hl\">Failing to learn</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일 배우도록 되어 있는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">what you’re supposedly taught</span> each day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심각한 오류이다.</span><span class=\"en\"><b>is a serious bug.</b></span></div></div><div class=\"lec-sent-ko\">매일 배우도록 되어 있는 것을 배우지 못하는 것도 심각한 오류이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소프트웨어 개발의 원리를 &#39;학습&#39;의 영역으로 끌어옵니다. supposedly는 사전적으로 &#39;추정상&#39;이라는 뜻이지만, 여기서는 &#39;당연히 해야 하는&#39;이라는 어감을 강조하여 학습자가 마땅히 해야 할 일을 안 했을 때의 심각성을 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Failing to learn (동명사): 문장의 주어로 쓰여 &#39;학습에 실패하는 것&#39;이라는 행위를 명사화함.</div><div class=\"lec-gr-item\">what you’re supposedly taught (간접의문문): what이 이끄는 절이 learn의 목적어 역할을 하며, &#39;당신이 무엇을 배우는지&#39;를 나타내는 의문사절임.</div><div class=\"lec-gr-item\">are supposedly taught (수동태): be동사(are)+p.p.(taught) 구조. teach는 타동사인데 목적어가 없어서 수동구조 are taught 형태로 쓴다. 기본구조: teach + O(사람) + O(내용) 또는 teach + O(사람) + to V (사람에게 ~를 가르치다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 어떤 것을 이해하지 못한다면</span><span class=\"en\"><b>If you don’t understand something</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘 수업에서 배운</span><span class=\"en\"><b><span class=\"grammar-hl\">you were taught</span> in class today,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 오류로 간주하라</span><span class=\"en\"><b>treat it as a bug</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수정해야 할</span><span class=\"en\"><b><span class=\"grammar-hl\">that must be fixed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">되도록 빨리</span><span class=\"en\"><b>as soon as possible.</b></span></div></div><div class=\"lec-sent-ko\">만약 오늘 수업에서 배운 어떤 것을 이해하지 못한다면 그것을 되도록 빨리 수정해야 할 오류로 간주하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에서 정의한 &#39;학습의 결함&#39;을 어떻게 처리해야 하는지 구체적인 행동 지침을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">you were taught (수동태): be동사(were)+p.p.(taught) 구조. teach는 타동사인데 목적어가 없어서 수동구조 were taught 형태로 쓴다. 기본구조: teach + O(사람) + O(내용) 또는 teach + O(사람) + to V (사람에게 ~를 가르치다).</div><div class=\"lec-gr-item\">that must be fixed (관계대명사): 주격 관계대명사 that이 선행사 a bug를 수식하며, 절 내부에서 주어 역할을 함. 또한 수동태(be fixed)가 포함되어 있어, fix는 타동사인데 목적어가 없어 수동구조 be fixed를 씀.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것을 미루지 말라.</span><span class=\"en\"><b>Do not <span class=\"grammar-hl\">put it off</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것을 미루지 말라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 버그 수정을 미루지 말라는 앞선 경고를 명령문으로 강하게 재확인합니다. put off는 &#39;연기하다&#39;라는 뜻의 숙어인데, 필자는 학습 결함이 쌓이는 것을 막기 위해 이 표현을 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">put it off (관용표현): put off(미루다/연기하다)는 구동사로, 대명사 목적어(it)가 반드시 중간에 위치해야 하는 구조임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">새로운 자료를 쌓지 말라</span><span class=\"en\"><b>Do not <span class=\"grammar-hl\">pile new material</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 위에</span><span class=\"en\"><b><span class=\"grammar-hl\">on top of it</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 위에 새로운 자료(배울 것)를 쌓지 말라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학습의 결함(버그)이 해결되지 않은 상태에서 지식을 계속 덧씌우는 것이 왜 위험한지를 경고합니다. pile은 사전적으로 &#39;쌓다&#39;라는 뜻인데, 이해하지 못한 기초 위에 새로운 정보를 계속 얹는 행위가 마치 무너질 탑을 쌓는 것과 같다는 이미지를 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">pile new material on top of it (관용표현): pile A on B (A를 B 위에 쌓다) 구조로 사용됨.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 한 단어나</span><span class=\"en\"><b>If you don’t understand a word,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 개념이나</span><span class=\"en\"><b>a concept,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 과를 이해하지 못한다면,</span><span class=\"en\"><b>or a lesson,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 것을 그만두고,</span><span class=\"en\"><b>then drop everything</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">필요한 것은 무엇이든지 하라</span><span class=\"en\"><b>and do <span class=\"grammar-hl\">whatever it takes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 배우기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to learn it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계속 진행하기 전에</span><span class=\"en\"><b>before you continue on.</b></span></div></div><div class=\"lec-sent-ko\">만약 한 단어나 하나의 개념이나 한 과를 이해하지 못한다면, 모든 것을 그만두고, 계속 진행하기 전에 그것을 배우기 위해 필요한 것은 무엇이든지 하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학습 결함 해결을 최우선 순위에 두라는 결론입니다. drop everything은 &#39;하던 일을 멈추다&#39;라는 뜻이지만, 여기서는 학습의 결함을 즉시 해결하는 것이 다른 어떤 진도보다 중요하다는 절박함을 강조하기 위해 선택되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">whatever it takes (간접의문문): whatever가 이끄는 절이 do의 목적어 역할을 하며, &#39;필요한 무엇이든&#39;이라는 의미의 명사절을 형성함.</div><div class=\"lec-gr-item\">to learn it (to부정사): 목적의 부사적 용법으로, 학습하기 위해서라는 의미를 전달함.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>소프트웨어에서 버그를 바로 수정하는 것이 효율적이듯, 학습도 배운 즉시 이해하는 것이 중요하다.</li><li>당일 배운 내용을 이해하지 못하면 심각한 &#39;버그&#39;로 간주해야 한다.</li><li>버그(모르는 것)를 방치하고 계속 새로운 내용을 쌓으면 나중에 더 큰 문제가 된다.</li><li>모르는 것이 생기면 진도를 멈추고 그 문제를 먼저 완벽히 해결해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Failing to understand a lesson is like a software bug, so you must resolve it immediately instead of letting new information pile up.</div>\n              <div class=\"lec-final-sum-ko\">수업을 이해하지 못하는 것은 소프트웨어 버그와 같으므로, 새로운 정보가 쌓이게 두지 말고 즉시 해결해야 한다.</div></div></div>"],"segs":[[{"audio":"./passage3_audio/1.mp3","hl":null}],[{"audio":"./passage3_audio/2.mp3","hl":null}],[{"audio":"./passage3_audio/3.mp3","hl":"main"},{"audio":"./passage3_audio/4.mp3","hl":"meaning"},{"audio":"./passage3_audio/5.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/6.mp3","hl":"main"},{"audio":"./passage3_audio/7.mp3","hl":"meaning"},{"audio":"./passage3_audio/8.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/9.mp3","hl":"main"},{"audio":"./passage3_audio/10.mp3","hl":"meaning"},{"audio":"./passage3_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/12.mp3","hl":"main"},{"audio":"./passage3_audio/13.mp3","hl":"meaning"},{"audio":"./passage3_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/15.mp3","hl":"main"},{"audio":"./passage3_audio/16.mp3","hl":"meaning"},{"audio":"./passage3_audio/17. ;a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
