3s+/Qd0/wA/4Ug6YPPXJP6cduD+HSl49R6jkdh1/p+BHXNNBUcAjv39OO5z/SneOlmu33fp57Ba/wDwytpZavpuvUUeg6DnHpn/AD9TxnnqhJ4J7nHU9/6++B168cqrKwyCOvqBxznr/PtzmlJHc84GOR0x29vx9cmkpK++lrJNvy87dbP09R2d3v0vtfp+rVv+HD/P+f8APNHI75weo+v9KaGU85HXjnr/AI5HP/6qC6rwSBn6dv5UnNPSz6aW89U1f5fPVByvtr/w2/3/AOew4/rjjp3H0Ptz+fNH+f8AP+e1BIGDkYPTkHv/AJ7f1pu5fUc5xyP055/Ud/SnzpLduy7PXz/4cVu2v9L/ADXzfkOJ/Dv+f6+n5+9Ieh+lJkZ+8MHtkfQ/Xvxx9Oc0h4VgAMgEgZ45B46DHtz09OtQ5rbmta2iu227J6dem979y4xe990ratLRppPy/DTo0f/Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Fix Your Learning Bugs: The Importance of Immediate Understanding<small>학습의 오류를 즉시 해결하라: 즉각적인 이해의 중요성</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">소프트웨어 개발 분야에서는 버그(bug)를 발견 즉시 수정하지 않으면 나중에 50배나 더 큰 노력이 든다는 사실이 정설로 통하는데, 이는 학습(learning) 과정에서도 똑같이 적용돼요. 공부할 때 개념을 명확히 이해하지 않고 넘어가는 것은 마치 코드에 숨겨진 작은 오류를 방치하는 것과 같은데, 이런 &#39;학습의 버그&#39;가 쌓이면 나중에 더 복잡한 내용을 배울 때 큰 걸림돌이 되곤 하죠. 마치 기초 공사가 부실한 건물이 위로 올라갈수록 무너질 위험이 커지는 것과 비슷해요. 따라서 모르는 것을 바로 해결하지 않고 뒤로 미루는 습관은 학습 효율을 크게 떨어뜨리는 요인이 되니, 완벽한 이해(complete understanding)를 통해 지식의 구조를 튼튼하게 만드는 것이 매우 중요합니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01소프트웨어 개발의 교훈</div><ul><li>소프트웨어 개발에서 버그는 발견 즉시 해결하는 것이 효율적이다.</li><li>프로젝트 후반에 수정하면 50배의 노력이 더 필요함</li><li>문제를 즉시 발견하고 수정하는 것의 중요성</li><li>핵심 키워드: 버그(bugs), 소프트웨어 개발(software development)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02학습과 버그의 유사성</div><ul><li>학습 과정에서 내용을 이해하지 못한 것 또한 치명적인 버그에 해당한다.</li><li>매일 배우는 내용을 제대로 익히지 못하는 것은 문제</li><li>수업 내용을 이해하지 못한 상태를 수정해야 할 버그로 간주</li><li>핵심 키워드: 학습(learning), 버그(bug)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03즉각적인 해결의 필요성</div><ul><li>이해하지 못한 내용을 뒤로 미루거나 쌓아두어서는 안 된다.</li><li>모르는 내용을 뒤로 미루지(put off) 말 것</li><li>그 위에 새로운 학습 내용을 쌓지(pile) 말 것</li><li>핵심 키워드: 미루기(procrastination), 누적(pile)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04완전한 이해를 위한 실천</div><ul><li>모르는 것이 있다면 즉시 하던 일을 멈추고 확실히 이해해야 한다.</li><li>단어, 개념, 수업 내용 중 모르는 부분은 즉시 파악</li><li>다음 진도로 넘어가기 전 모든 수단을 동원해 해결</li><li>핵심 키워드: 이해(understand), 해결(fix)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">software</td><td class=\"m\">소프트웨어</td></tr><tr><td class=\"w\">development</td><td class=\"m\">개발</td></tr><tr><td class=\"w\">bug</td><td class=\"m\">결함, 오류</td></tr><tr><td class=\"w\">fix</td><td class=\"m\">해결하다, 고치다</td></tr><tr><td class=\"w\">identify</td><td class=\"m\">확인하다, 발견하다</td></tr><tr><td class=\"w\">effort</td><td class=\"m\">노력</td></tr><tr><td class=\"w\">notice</td><td class=\"m\">알아차리다, 인지하다</td></tr><tr><td class=\"w\">fail</td><td class=\"m\">~하지 못하다</td></tr><tr><td class=\"w\">supposedly</td><td class=\"m\">아마, 가정상</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">serious</td><td class=\"m\">심각한</td></tr><tr><td class=\"w\">treat</td><td class=\"m\">대하다, 취급하다</td></tr><tr><td class=\"w\">put off</td><td class=\"m\">미루다</td></tr><tr><td class=\"w\">pile</td><td class=\"m\">쌓다</td></tr><tr><td class=\"w\">material</td><td class=\"m\">자료, 학습 내용</td></tr><tr><td class=\"w\">concept</td><td class=\"m\">개념</td></tr><tr><td class=\"w\">drop</td><td class=\"m\">그만두다, 중단하다</td></tr><tr><td class=\"w\">whatever</td><td class=\"m\">무엇이든지</td></tr><tr><td class=\"w\">continue</td><td class=\"m\">계속하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소프트웨어를 개발할 때는</span><span class=\"en\"><b>In software development</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘 알려져 있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">it’s well known</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오류가</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> <span class=\"grammar-hl\">bugs</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수정해야 한다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">should be fixed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">되도록 빨리</span><span class=\"en\"><b>as soon as possible</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확인된 후에는.</span><span class=\"en\"><b>after they <span class=\"grammar-hl\">have been identified</span>.</b></span></div></div><div class=\"lec-sent-ko\">소프트웨어를 개발할 때는 오류가 확인된 후에는 되도록 빨리 수정해야 한다는 것이 잘 알려져 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소프트웨어 개발의 원리를 언급하며 글을 시작합니다. 여기서 well known은 &#39;모두가 인정하는 당연한 사실&#39;이라는 점을 강조하여, 뒤에서 나올 학습 원칙 또한 당연히 따라야 할 진리임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it’s well known that (가주어): 진주어: it은 가주어, that절은 진주어로 쓰인 구조입니다. known은 know의 과거분사이며, know는 타동사인데 목적어가 없어서 수동구조 be동사(is)+p.p.(known) 형태로 씁니다. 기본구조: know + O + (to be) C (O가 C라고 알다/생각하다)</div><div class=\"lec-gr-item\">bugs should be fixed (수동태): be동사(be)+p.p.(fixed) 구조입니다. fix는 타동사인데 목적어가 없어서 수동구조로 씁니다. 기본구조: fix + O (O를 고치다)</div><div class=\"lec-gr-item\">have been identified (수동태): be동사(been)+p.p.(identified) 구조입니다. identify는 타동사인데 목적어가 없어서 수동구조로 씁니다. 기본구조: identify + O (O를 확인하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">software</td><td class=\"m\">소프트웨어</td></tr><tr><td class=\"w\">development</td><td class=\"m\">개발</td></tr><tr><td class=\"w\">bug</td><td class=\"m\">결함, 오류</td></tr><tr><td class=\"w\">fix</td><td class=\"m\">해결하다, 고치다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">프로젝트의 끝 무렵에 오류를 수정하려고 미루는 것은,</span><span class=\"en\"><b><span class=\"grammar-hl\">Waiting</span> until the end of a project</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오류를 수정하려고</span><span class=\"en\"><b><span class=\"grammar-hl\">to fix a bug</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">노력이 50배나 더 필요할 수도 있는데</span><span class=\"en\"><b>can take fifty times as much effort</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">필요한 것보다</span><span class=\"en\"><b>as <span class=\"grammar-hl\">it would take</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오류를 수정하는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">to fix the bug</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음에</span><span class=\"en\"><b><span class=\"grammar-hl\">the first time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오류가 발견되었을 때.</span><span class=\"en\"><b><span class=\"grammar-hl\">it was noticed</span>.</b></span></div></div><div class=\"lec-sent-ko\">프로젝트의 끝 무렵에 오류를 수정하려고 미루는 것은, 처음에 오류가 발견되었을 때 수정하는 것보다 노력이 50배나 더 필요할 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 버그를 방치할 때 발생하는 비효율성을 구체적인 수치(50배)로 제시합니다. 앞 문장에서 언급한 &#39;즉시 해결&#39;이 왜 중요한지에 대한 근거가 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Waiting (동명사): 문장의 주어 역할을 하며, ‘기다리는 것’이라는 행위를 나타냅니다.</div><div class=\"lec-gr-item\">to fix a bug (to부정사): 앞의 동명사 Waiting을 수식하는 형용사적 용법으로, ‘버그를 고치기 위해 기다리는 것’이라는 의미를 완성합니다.</div><div class=\"lec-gr-item\">it would take to fix the bug (to부정사): 가주어 it과 진주어 to부정사 구조로, &#39;버그를 고치는 것이 ~만큼의 노력이 들 것이다&#39;라는 의미를 형성합니다.</div><div class=\"lec-gr-item\">the first time it was noticed (수동태): be동사(was)+p.p.(noticed) 구조입니다. notice는 타동사인데 목적어가 없어서 수동구조로 씁니다. 기본구조: notice + O (O를 알아차리다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bug</td><td class=\"m\">결함, 오류</td></tr><tr><td class=\"w\">fix</td><td class=\"m\">해결하다, 고치다</td></tr><tr><td class=\"w\">effort</td><td class=\"m\">노력</td></tr><tr><td class=\"w\">notice</td><td class=\"m\">알아차리다, 인지하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">배우지 못하는 것도</span><span class=\"en\"><b><span class=\"grammar-hl\">Failing</span> to learn</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일 배우도록 되어 있는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">what you’re supposedly taught</span> each day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심각한 오류이다.</span><span class=\"en\"><b>is a serious bug.</b></span></div></div><div class=\"lec-sent-ko\">매일 배우도록 되어 있는 것을 배우지 못하는 것도 심각한 오류이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소프트웨어의 버그라는 개념을 학생의 학습 과정에 비유적으로 적용합니다. 여기서 bug는 사전적으로 &#39;프로그램의 오류&#39;를 뜻하지만, 여기서는 &#39;학습의 결손&#39;을 의미합니다. 공부를 미루는 행위를 기술적 오류에 빗대어 그 심각성을 강렬하게 경고하려는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Failing (동명사): 문장의 주어 역할을 하며, ‘실패하는 것’이라는 행위를 나타냅니다.</div><div class=\"lec-gr-item\">what you’re supposedly taught (수동태): be동사(’re)+p.p.(taught) 구조입니다. teach는 타동사인데 목적어가 없어서 수동구조로 씁니다. 기본구조: teach + O(사람) + O(내용) / teach + O + to V (5형식)</div><div class=\"lec-gr-item\">you’re (현재진행): be동사(are) + 현재분사(-ing) 형태가 아니라, 주어+be동사 축약형입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bug</td><td class=\"m\">결함, 오류</td></tr><tr><td class=\"w\">fail</td><td class=\"m\">~하지 못하다</td></tr><tr><td class=\"w\">supposedly</td><td class=\"m\">아마, 가정상</td></tr><tr><td class=\"w\">serious</td><td class=\"m\">심각한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 어떤 것을 이해하지 못한다면</span><span class=\"en\"><b>If you don’t understand something</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘 수업에서 배운</span><span class=\"en\"><b><span class=\"grammar-hl\">you were taught</span> in class today,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 오류로 간주하라</span><span class=\"en\"><b>treat it as <span class=\"grammar-hl\">a bug</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수정해야 할</span><span class=\"en\"><b><span class=\"grammar-hl\">that must be fixed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">되도록 빨리.</span><span class=\"en\"><b>as soon as possible.</b></span></div></div><div class=\"lec-sent-ko\">만약 오늘 수업에서 배운 어떤 것을 이해하지 못한다면 그것을 되도록 빨리 수정해야 할 오류로 간주하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 비유를 이어받아 구체적인 행동 지침을 내립니다. 모르는 것을 단순한 &#39;상태&#39;가 아니라 &#39;즉시 해결해야 할 과제&#39;로 인식하게 함으로써 학습자의 경각심을 일깨웁니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">you were taught (수동태): be동사(were)+p.p.(taught) 구조입니다. teach는 타동사인데 목적어가 없어서 수동구조로 씁니다. 기본구조: teach + O(사람) + O(내용)</div><div class=\"lec-gr-item\">a bug that must be fixed (관계대명사): that은 목적어가 없는 절을 이끌어 선행사 a bug를 수식합니다. 또한 be동사(be)+p.p.(fixed)의 수동태 구조이며, fix는 타동사인데 목적어가 없어서 수동구조로 씁니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bug</td><td class=\"m\">결함, 오류</td></tr><tr><td class=\"w\">fix</td><td class=\"m\">해결하다, 고치다</td></tr><tr><td class=\"w\">treat</td><td class=\"m\">대하다, 취급하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것을 미루지 말라.</span><span class=\"en\"><b>Do not <span class=\"grammar-hl\">put it off</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것을 미루지 말라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학습 결손을 방치하는 것에 대해 단호하게 거부하며 주의를 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">put it off (관용표현): put off(~을 미루다/연기하다)은 이어동사(구동사)로, 목적어 it이 대명사이므로 반드시 put과 off 사이에 위치합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">새로운 자료를 쌓지 말라</span><span class=\"en\"><b>Do not <span class=\"grammar-hl\">pile</span> new material</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 위에.</span><span class=\"en\"><b>on top of it.</b></span></div></div><div class=\"lec-sent-ko\">그 위에 새로운 자료(배울 것)를 쌓지 말라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 pile은 &#39;쌓다&#39;라는 뜻인데, 이해하지 못한 기초 위에 새로운 정보를 계속 얹는 행위를 위험한 것으로 묘사합니다. 기초가 흔들리는 상태에서 무작정 진도만 나가는 학습법을 경계하라는 비유적 표현입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">pile (5형식): pile A on B(A를 B 위에 쌓다) 구조에서 파생된 표현으로, 새로운 자료를 그(문제) 위에 쌓지 말라는 명령문입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pile</td><td class=\"m\">쌓다</td></tr><tr><td class=\"w\">material</td><td class=\"m\">자료, 학습 내용</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 한 단어나</span><span class=\"en\"><b>If you don’t understand a word,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 개념이나</span><span class=\"en\"><b>a concept,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 과를 이해하지 못한다면,</span><span class=\"en\"><b>or a lesson,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 것을 그만두고</span><span class=\"en\"><b>then drop everything</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">필요한 것은 무엇이든지 하라</span><span class=\"en\"><b>and do <span class=\"grammar-hl\">whatever it takes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 배우기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to learn it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계속 진행하기 전에.</span><span class=\"en\"><b><span class=\"grammar-hl\">before you continue on</span>.</b></span></div></div><div class=\"lec-sent-ko\">만약 한 단어나 하나의 개념이나 한 과를 이해하지 못한다면, 모든 것을 그만두고, 계속 진행하기 전에 그것을 배우기 위해 필요한 것은 무엇이든지 하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 내용들을 종합하여 내리는 결론입니다. drop everything은 사전적으로 &#39;모든 것을 떨어뜨리다&#39;이지만, 여기서는 &#39;우선순위를 완전히 바꾸어 당장 하던 것을 멈추는 것&#39;을 의미합니다. 학습의 연속성보다 &#39;완전한 이해&#39;가 최우선임을 강조하기 위해 이 표현을 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">whatever it takes to learn it (to부정사): 앞의 명사적 수식 대상(whatever it takes)의 목적을 나타내는 형용사적 용법으로, &#39;그것을 배우기 위한 무엇이든&#39;이라는 의미를 갖습니다.</div><div class=\"lec-gr-item\">before you continue on (관용표현): continue on(계속해서 나아가다/진행하다)은 자동사로 쓰인 구동사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">concept</td><td class=\"m\">개념</td></tr><tr><td class=\"w\">drop</td><td class=\"m\">그만두다, 중단하다</td></tr><tr><td class=\"w\">whatever</td><td class=\"m\">무엇이든지</td></tr><tr><td class=\"w\">continue</td><td class=\"m\">계속하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>소프트웨어 개발에서 버그는 발견 즉시 해결하는 것이 훨씬 효율적이다.</li><li>학습 과정에서의 이해 부족도 일종의 &#39;버그&#39;이며 심각하게 받아들여야 한다.</li><li>모르는 것을 방치하고 새로운 내용을 쌓는 것은 학습에 치명적이다.</li><li>진도를 나가는 것보다 모르는 것을 즉시 해결하는 것이 학습의 최우선 과제이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Students should treat lack of understanding as a critical error to be fixed immediately, so they can avoid piling up unresolved learning gaps.</div>\n              <div class=\"lec-final-sum-ko\">학생들은 이해하지 못한 부분을 즉시 해결해야 할 치명적인 오류로 여겨야 하며, 이를 통해 해결되지 않은 학습 공백이 쌓이는 것을 방지할 수 있다.</div></div></div>"],"segs":[[{"audio":"./passage3_audio/1.mp3","hl":null}],[{"audio":"./passage3_audio/2.mp3","hl":null}],[{"audio":"./passage3_audio/3.mp3","hl":null},{"audio":"./passage3_audio/4.mp3","hl":"stage-0"},{"audio":"./passage3_audio/5.mp3","hl":"stage-1"},{"audio":"./passage3_audio/6.mp3","hl":"stage-2"},{"audio":"./passage3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage3_audio/8.mp3","hl":null}],[{"audio":"./passage3_audio/9.mp3","hl":"main"},{"audio":"./passage3_audio/10.mp3","hl":"meaning"},{"audio":"./passage3_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/12.mp3","hl":"main"},{"audio":"./passage3_audio/13.mp3","hl":"meaning"},{"audio":"./passage3_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/15.mp3","hl":"main"},{"audio":"./passage3_audio/16.mp3","hl":"meaning"},{"audio":"./passage3_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/18.mp3","hl":"main"},{"audio":"./passage3_audio/19.mp3","hl":"meaning"},{"audio":"./passage3_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/21.mp3","hl":"main"},{"audio":"./passage3_audio/22.mp3","hl":"meaning"},{"audio":"./passage3_audio/23.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/24.mp3","hl":"main"},{"audio":"./passage3_audio/25.
