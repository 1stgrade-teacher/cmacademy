I96XIyORk9Pfp0/SgBf8APT/P+e2KKbuXOMjP+T/jS7hxk4znHvj0/wA9KA/r+v69RaPw/H/P0/lSZHqPzFGR0yPbnt/n/Gj+n6gL/n/P+evNJ9ev546//XoJwQOMH356frn29PfgJHqPz/8Ar/56UAHUfkfX3/z+hpf/AK/+e3+fzppYYz2OR9cce/H0B60bhge/C+/p+GOfp+VADqOfb2/z/X9KTIGB65/+v/8AX7Dvil6f/XoAKPrRRQAcdPp/9b+VIc/4fX39ulL/APX/AM/h3prMFB9cMR3PAyaAP//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Hire for Attitude: Why Mind-set Matters More Than Skills<small>태도를 보고 채용하라: 왜 마음가짐이 기술보다 더 중요한가</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 채용 과정에서 실무 능력보다 개인의 태도를 중시하는 현대 경영의 흐름을 다루고 있는데, 여기서 가장 중요한 개념은 태도 중심 채용(Hiring for attitude)입니다. 이는 단순히 현재 보유한 기술이나 경력보다, 새로운 지식을 배우려는 학습 의지(Thirst for knowledge)와 스스로 성장하려는 성장 마인드셋(Growth mindset)을 갖춘 인재를 선호하는 전략을 말해요. 쉽게 비유하자면, 이미 다 만들어진 완성품을 사려는 것이 아니라, 물을 주면 무럭무럭 자랄 수 있는 잠재력 있는 씨앗(Potential)을 고르는 것과 같답니다. 실제로 많은 기업이 &#39;가르칠 수 없는 태도&#39;를 가진 사람을 뽑는 것이 나중에 기술을 가르치는 것보다 훨씬 효율적이라고 판단하고 있어요. 따라서 이 글을 읽을 때는 기술은 시간이 지나면 익힐 수 있지만, 근본적인 마음가짐(Mind-set)은 바꾸기 어렵다는 점에 주목해 보세요.</div></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만들 수 없다</span><span class=\"en\"><b>You <span class=\"grammar-hl\">can’t build</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 회사를</span><span class=\"en\"><b>a great company</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뛰어난 사람들 없이는</span><span class=\"en\"><b>without great people.</b></span></div></div><div class=\"lec-sent-ko\">뛰어난 사람들 없이는 좋은 회사를 만들 수 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 위대한 기업을 만들기 위한 필수 조건으로 &#39;사람(인재)&#39;을 제시하며, 글 전체에서 강조할 핵심 주제를 서두에 던지고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can’t build 조동사 can&#39;t: &#39;~할 수 없다&#39;는 부정적 능력을 나타내는 조동사이며, 뒤에 동사원형 build가 결합된 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 뛰어난 사람들을 알 수 있을까</span><span class=\"en\"><b><span class=\"grammar-hl\">how do you know</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 볼 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when you see them</span>?</b></span></div></div><div class=\"lec-sent-ko\">그러나 사람들을 볼 때 어떻게 뛰어난 사람들을 알 수 있을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;훌륭한 인재&#39;를 찾는 것이 어렵다는 문제의식을 제기하며, 글의 논의를 &#39;채용 기준&#39;으로 자연스럽게 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how do you know (간접의문문): 의문사(how)+주어(you)+동사(know) 구조로, 문장에서 타동사 know의 목적어 역할을 합니다. do는 의문문을 만드는 일반동사 조동사입니다.</div><div class=\"lec-gr-item\">when you see them 현재분사(분사구문 아님): 여기서는 when이 이끄는 부사절로, 시간의 의미를 나타내는 접속사 when 뒤에 주어(you)와 동사(see)가 완벽하게 갖춰진 절 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지난 수 년 동안,</span><span class=\"en\"><b>Over the past few years,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">회사들이</span><span class=\"en\"><b>a number of companies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">광범위한 산업의</span><span class=\"en\"><b>in a wide range of industries —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여행사에서 제조업 분야에 이르기까지</span><span class=\"en\"><b>from travel to manufacturing —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스스로 질문을 해보았다</span><span class=\"en\"><b>have asked themselves</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 채용과 나쁜 채용을 구별하는 것에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">what separates their good hires</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 채용과 나쁜 채용을 구별하는 것에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">from bad ones</span>.</b></span></div></div><div class=\"lec-sent-ko\">지난 수 년 동안, 여행사에서 제조업 분야에 이르기까지 광범위한 산업의 회사들이 좋은 채용과 나쁜 채용을 구별하는 것에 대해 스스로 질문을 해보았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 채용의 중요성을 인식한 기업들이 &#39;성공적인 채용&#39;과 &#39;실패한 채용&#39;의 차이를 고민하기 시작했다는 배경을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what separates their good hires from bad ones (간접의문문): 의문사(what)가 절 안에서 주어 역할을 하며, what + 동사(separates) + 목적어(good hires) + 전치사구(from bad ones)로 구성되어 타동사 asked의 목적어절로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 모두 도달했다</span><span class=\"en\"><b>They all <span class=\"grammar-hl\">arrived</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같은 대답에</span><span class=\"en\"><b><span class=\"grammar-hl\">at</span> the same answer:</b></span></div></div><div class=\"lec-sent-ko\">(그들은 같은 대답에 도달했다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심 주장입니다. What(지식)과 Who(사람의 본질/태도)를 대비시켜, 기술적 역량보다 인성이나 태도가 우선임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">arrived at (관용표현): arrive at은 &#39;~에 도달하다/결론에 이르다&#39;라는 의미의 숙어로, arrive와 전치사 at이 결합한 자동사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들이 알고 있는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">What people know</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">덜 중요하다는 것이다</span><span class=\"en\"><b>is less important</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 어떤 사람들이냐 보다</span><span class=\"en\"><b>than <span class=\"grammar-hl\">who they are</span>.</b></span></div></div><div class=\"lec-sent-ko\">(사람들이 알고 있는 것이 그들이 어떤 사람들이냐 보다 덜 중요하다는 것이다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> trained는 사전적으로 &#39;훈련받은&#39;인데, 여기서는 기술적 업무를 익히는 과정을 의미합니다. 필자는 &#39;지식은 전수가 가능하지만 내면의 동기는 가르칠 수 없다&#39;는 점을 들어 왜 &#39;태도&#39;가 중요한지를 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What people know (관계대명사(what)): &#39;~하는 것&#39;으로 해석되는 명사절이며, what이 동사 know의 목적어 역할을 하는 불완전한 절 구조입니다.</div><div class=\"lec-gr-item\">who they are (간접의문문): 의문사(who)+주어(they)+동사(are) 구조로, 문장에서 보어 자리에 위치하며 명사절 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 훈련을 받으면</span><span class=\"en\"><b>People <span class=\"grammar-hl\">can be trained</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 어떤 일이든 할 수 있지만,</span><span class=\"en\"><b><span class=\"grammar-hl\">to do</span> almost anything,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>but</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가르칠 수가 없다</span><span class=\"en\"><b>you can’t teach someone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 배우기를 원하지 않는다면</span><span class=\"en\"><b>if they don’t want to learn.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 훈련을 받으면 거의 어떤 일이든 할 수 있지만, 그들이 배우기를 원하지 않는다면 가르칠 수가 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> trained는 사전적으로 &#39;훈련받은&#39;인데, 여기서는 기술적 업무를 익히는 과정을 의미합니다. 필자는 &#39;지식은 전수가 가능하지만 내면의 동기는 가르칠 수 없다&#39;는 점을 들어 왜 &#39;태도&#39;가 중요한지를 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be trained (수동태): be동사(be)+과거분사(trained) 구조입니다. train은 타동사인데 뒤에 목적어가 없어서 수동구조 be trained 형태로 씁니다. 기본구조: train + O (O를 훈련시키다).</div><div class=\"lec-gr-item\">to do (to부정사): 수동태 동사구인 be trained 뒤에서 &#39;~하도록(훈련받다)&#39;의 의미를 더하는 부사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지식에 대한 목마름과</span><span class=\"en\"><b>This thirst for knowledge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발전에 대한 욕망이</span><span class=\"en\"><b>and drive for improvement</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고용주들이 찾는 것이다.</span><span class=\"en\"><b>is <span class=\"grammar-hl\">what employers look for</span>.</b></span></div></div><div class=\"lec-sent-ko\">지식에 대한 목마름과 발전에 대한 욕망이 고용주들이 찾는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> thirst는 사전적으로 &#39;갈증&#39;인데, 여기서는 배움에 대한 &#39;강렬한 욕구&#39;를 의미합니다. 단순히 &#39;want&#39;라고 하지 않고 &#39;thirst&#39;를 선택해, 배움에 대한 열망이 생존 본능만큼 절실해야 함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what employers look for (관계대명사(what)): &#39;명사절 what + S + V&#39; 구조로, 선행사를 포함한 관계대명사절이며 문장에서 보어 역할을 합니다. look for(구하다)의 목적어 자리가 비어 있는 불완전한 절입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고용이란,</span><span class=\"en\"><b><span class=\"grammar-hl\">Hiring</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고용주들은 믿는다</span><span class=\"en\"><b>they believe,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">것이 아니고</span><span class=\"en\"><b>is not about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 찾는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">finding people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적절한 경험을 가진</span><span class=\"en\"><b><span class=\"grammar-hl\">with the right experience</span>;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">것이라고</span><span class=\"en\"><b>it’s about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 찾는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">finding people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적절한 태도를 가진</span><span class=\"en\"><b><span class=\"grammar-hl\">with the right mind-set</span>.</b></span></div></div><div class=\"lec-sent-ko\">고용이란, 적절한 경험을 가진 사람들을 찾는 것이 아니고 적절한 태도를 가진 사람들을 찾는 것이라고 고용주들은 믿는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 채용의 기준을 &#39;경험(과거의 산물)&#39;에서 &#39;마음가짐(미래의 잠재력)&#39;으로 완전히 이동시키며 주장을 요약합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Hiring (동명사): 문장에서 주어 역할을 하며, &#39;채용하는 것&#39;이라는 행위를 나타냅니다.</div><div class=\"lec-gr-item\">finding people with the right experience (동명사): 전치사 about의 목적어로 쓰인 &#39;find + O(사람들)&#39; 구조의 동명사구입니다.</div><div class=\"lec-gr-item\">finding people with the right mind-set (동명사): 전치사 about의 목적어로 쓰였으며, finding은 동명사로서 명사구의 핵심 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 회사들은</span><span class=\"en\"><b>These companies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태도를 보고 채용해서</span><span class=\"en\"><b><span class=\"grammar-hl\">hire for attitude</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기술을 갖게 훈련을 시킨다.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">train for skill</span>.</b></span></div></div><div class=\"lec-sent-ko\">이러한 회사들은 태도를 보고 채용해서 기술을 갖게 훈련을 시킨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 내용을 짧은 문장으로 압축하여 결론을 내립니다. &#39;hire for&#39;와 &#39;train for&#39;라는 병렬 구조를 사용해 기업의 채용 전략을 명확히 대조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hire for attitude (관용표현): hire for ~는 &#39;~을 기준으로 채용하다&#39;라는 의미의 구조입니다.</div><div class=\"lec-gr-item\">train for skill (관용표현): train for ~는 &#39;~을 목적으로/기준으로 훈련하다&#39;라는 의미의 구조입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>훌륭한 기업을 만들려면 뛰어난 인재가 필수적이다.</li><li>기업들은 채용 시 기술적 지식보다는 그 사람의 본질적인 태도를 중시한다.</li><li>배움에 대한 열망과 성장하려는 의지는 가르칠 수 없는 영역이기 때문이다.</li><li>따라서 성공적인 기업은 경험보다 올바른 마음가짐(태도)을 가진 사람을 뽑아 기술을 교육한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Companies prioritize hiring individuals with the right mind-set and a desire for improvement, as technical skills can be developed through training.</div>\n              <div class=\"lec-final-sum-ko\">기업들은 기술적인 능력은 훈련을 통해 길러질 수 있으므로, 올바른 마음가짐과 발전하려는 열망을 가진 사람을 채용하는 것을 우선시한다.</div></div></div>"],"segs":[[{"audio":"./passage1_audio/1.mp3","hl":null}],[{"audio":"./passage1_audio/2.mp3","hl":null}],[{"audio":"./passage1_audio/3.mp3","hl":"main"},{"audio":"./passage1_audio/4.mp3","hl":"meaning"},{"audio":"./passage1_audio/5.mp3","hl":"grammar"}],[{"audio":"./passage1_audio/6.mp3","hl":"main"},{"audio":"./passage1_audio/7.mp3","hl":"meanin
