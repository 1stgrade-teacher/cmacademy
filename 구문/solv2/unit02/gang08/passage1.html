lass=\"w\">head</td><td class=\"m\">~로 향하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in the direction of</td><td class=\"m\">~의 방향으로</td></tr><tr><td class=\"w\">size</td><td class=\"m\">크기</td></tr><tr><td class=\"w\">large</td><td class=\"m\">큰</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">좋은 회사를 만들 수 없다</span><span class=\"en\"><b>You <span class=\"grammar-hl\">can’t build</span> a great company</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뛰어난 사람들 없이는</span><span class=\"en\"><b>without great people.</b></span></div></div><div class=\"lec-sent-ko\">(뛰어난 사람들 없이는 좋은 회사를 만들 수 없다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> NASA 과학자들이 지구로 다가오는 소행성들을 발견했다는 사실을 전달하며, 그 위험성을 구체적인 비교 대상인 &#39;엠파이어 스테이트 빌딩&#39;을 통해 강조하고 있습니다. 여기서 spotted는 사전적으로는 &#39;점, 얼룩&#39;이라는 명사지만, 동사로는 &#39;발견하다, 찾아내다&#39;라는 뜻입니다. 단순히 본 것이 아니라, 우주라는 광활한 곳에서 수많은 물체 중 특정 소행성들을 &#39;콕 집어 찾아냈다&#39;는 뉘앙스를 주기 위해 이 단어를 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can’t build 조동사 can과 동사원형 build가 결합하여 능력이나 가능성의 부정을 나타내는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 뛰어난 사람들을 알 수 있을까</span><span class=\"en\"><b><span class=\"grammar-hl\">how do you know</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 볼 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when you see them</span>?</b></span></div></div><div class=\"lec-sent-ko\">(그러나 사람들을 볼 때 어떻게 뛰어난 사람들을 알 수 있을까?)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how do you know (간접의문문): 의문사(how) + 주어(you) + 동사(know)의 어순으로 구성된 명사절 구조로, 여기서는 &#39;어떻게 아는가&#39;라는 목적어 역할을 수행합니다.</div><div class=\"lec-gr-item\">when you see them 시간의 부사절: 접속사 when이 이끄는 절로, 주절의 동작(know)이 일어나는 시점을 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지난 수 년 동안,</span><span class=\"en\"><b>Over the past few years,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">회사들이</span><span class=\"en\"><b>a number of companies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">광범위한 산업의</span><span class=\"en\"><b>in a wide range of industries —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여행사에서 제조업 분야에 이르기까지</span><span class=\"en\"><b>from travel to manufacturing —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스스로 질문을 해보았다</span><span class=\"en\"><b>have asked themselves</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 채용과</span><span class=\"en\"><b><span class=\"grammar-hl\">what separates their good hires</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나쁜 채용을 구별하는 것에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">from bad ones</span>.</b></span></div></div><div class=\"lec-sent-ko\">(지난 수 년 동안, 여행사에서 제조업 분야에 이르기까지 광범위한 산업의 회사들이 좋은 채용과 나쁜 채용을 구별하는 것에 대해 스스로 질문을 해보았다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what separates their good hires from bad ones (간접의문문): 의문사 what이 주어 역할을 겸하며(의문대명사), 뒤에 동사(separates)와 목적어(good hires)가 이어지는 구조로, ask의 직접목적어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 같은 대답에 도달했다</span><span class=\"en\"><b>They all arrived at the same answer:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 알고 있는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">What people know</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">덜 중요하다는 것이다</span><span class=\"en\"><b>is less important</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 어떤 사람들이냐 보다</span><span class=\"en\"><b>than <span class=\"grammar-hl\">who they are</span>.</b></span></div></div><div class=\"lec-sent-ko\">(그들은 같은 대답에 도달했다. 사람들이 알고 있는 것이 그들이 어떤 사람들이냐 보다 덜 중요하다는 것이다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What people know 관계대명사 what: &#39;~하는 것&#39;으로 해석되며, 뒤의 know 동사의 목적어 자리가 비어 있는 명사절을 이끕니다.</div><div class=\"lec-gr-item\">who they are (간접의문문): 의문사(who) + 주어(they) + 동사(are)의 어순으로, &#39;그들이 누구인지&#39;라는 의미의 명사절입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 훈련을 받으면</span><span class=\"en\"><b>People <span class=\"grammar-hl\">can be trained</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 어떤 일이든 할 수 있지만,</span><span class=\"en\"><b><span class=\"grammar-hl\">to do</span> almost anything,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렇지만</span><span class=\"en\"><b>but</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가르칠 수가 없다</span><span class=\"en\"><b>you can’t teach someone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 배우기를 원하지 않는다면</span><span class=\"en\"><b>if they don’t want to learn.</b></span></div></div><div class=\"lec-sent-ko\">(사람들은 훈련을 받으면 거의 어떤 일이든 할 수 있지만, 그들이 배우기를 원하지 않는다면 가르칠 수가 없다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be trained (수동태): be동사(be)+p.p.(trained) 구조입니다. train은 타동사인데 목적어가 없어서 수동구조 be trained 형태로 씁니다. 기본구조: train + O (O를 훈련시키다).</div><div class=\"lec-gr-item\">to do (to부정사): be trained(수동태) 뒤에서 동작의 목적이나 대상을 보충 설명하는 부사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지식에 대한 목마름과</span><span class=\"en\"><b>This thirst for knowledge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발전에 대한 욕망이</span><span class=\"en\"><b>and drive for improvement</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고용주들이 찾는 것이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is what employers look for</span>.</b></span></div></div><div class=\"lec-sent-ko\">(지식에 대한 목마름과 발전에 대한 욕망이 고용주들이 찾는 것이다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is what employers look for 관계대명사 what: &#39;~하는 것&#39;으로 해석되며, 보어 자리에 위치한 명사절입니다. 절 내부의 look for 뒤에 목적어가 생략된 불완전한 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고용이란,</span><span class=\"en\"><b><span class=\"grammar-hl\">Hiring,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고용주들은 믿는다</span><span class=\"en\"><b><span class=\"grammar-hl\">they believe,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 찾는 것이 아니고</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span> not about <span class=\"grammar-hl\">finding</span> people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적절한 경험을 가진</span><span class=\"en\"><b>with the right experience;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 찾는 것이라고</span><span class=\"en\"><b>it’s about <span class=\"grammar-hl\">finding</span> people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적절한 태도를 가진</span><span class=\"en\"><b>with the right mind-set.</b></span></div></div><div class=\"lec-sent-ko\">(고용이란, 적절한 경험을 가진 사람들을 찾는 것이 아니고 적절한 태도를 가진 사람들을 찾는 것이라고 고용주들은 믿는다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Hiring, they believe, is (삽입절): 주어(Hiring)와 동사(is) 사이에 그들이 그렇게 믿는다는 내용을 나타내는 주어+동사가 삽입된 형태입니다.</div><div class=\"lec-gr-item\">finding (동명사): 전치사 about의 목적어 자리에 위치하여 &#39;~하는 것&#39;이라는 명사적 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 회사들은 태도를 보고 채용해서</span><span class=\"en\"><b>These companies <span class=\"grammar-hl\">hire for attitude</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기술을 갖게 훈련을 시킨다.</span><span class=\"en\"><b>and train for skill.</b></span></div></div><div class=\"lec-sent-ko\">(이러한 회사들은 태도를 보고 채용해서 기술을 갖게 훈련을 시킨다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hire for attitude (관용표현): &#39;hire for&#39;는 &#39;~라는 조건을 보고 채용하다&#39;라는 의미의 숙어적 표현입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>NASA 과학자들이 지구를 향해 날아오는 6개의 소행성을 발견함.</li><li>그중 가장 큰 소행성은 엠파이어 스테이트 빌딩보다 거대함.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">NASA scientists have identified six asteroids heading toward Earth, and one of them is even larger than the Empire State Building.</div>\n              <div class=\"lec-final-sum-ko\">NASA 과학자들은 지구로 향하는 6개의 소행성을 확인했는데, 그중 하나는 엠파이어 스테이트 빌딩보다 더 크다.</div></div></div>"],"segs":[[{"audio":"./passage1_audio/1.mp3","hl":null}],[{"audio":"./passage1_audio/2.mp3","hl":null}],[{"audio":"./passage1_audio/3.mp3","hl":null}
