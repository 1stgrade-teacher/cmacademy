div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 흔히 말하는 부정적 사고방식(Negative thinking)은 심리학적으로 인지적 편향(Cognitive bias)의 일종으로, 인간이 생존을 위해 위험 요소를 먼저 감지하려는 뇌의 본능에서 비롯된 면이 있어요. 특히 사람들은 불평을 공유함으로써 서로 공감대를 형성하려는 사회적 유대(Social bonding)를 맺곤 하는데, 이를 &#39;불평의 역설&#39;이라고도 부릅니다. 하지만 잦은 불평은 뇌의 회로를 부정적인 반응에 익숙해지게 만들어, 결과적으로 신경 가소성(Neuroplasticity) 원리에 따라 부정적인 사고 패턴을 강화할 위험이 있어요. 따라서 단순히 힘들다고 말하는 대신 긍정적인 언어를 사용하는 연습을 하는 것은 단순히 기분 탓이 아니라, 뇌의 구조적 경로를 바꾸어 잠재력을 최대한 발휘하게 만드는 과학적인 방법이기도 하답니다. 우리가 부정적인 생각을 놓아버려야 하는 이유를, 이 글을 통해 함께 알아보도록 해요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01부정적 사고의 일상화</div><ul><li>현대 사회에서 사람들은 불평을 통해 관계를 맺는 부정적 습관에 길들여져 있다.</li><li>대화의 주된 내용이 불평(complaining) 위주임</li><li>불평을 나누며 서로를 알아가는 것이 일상적 의사소통 방식이 됨</li><li>핵심 키워드: 부정적 사고(negative thinking), 습관화(conditioned)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02불평의 근본적 이유와 한계</div><ul><li>사람들은 살면서 겪는 여러 어려움 때문에 불평할 만한 합당한 이유를 가지고 있다.</li><li>결혼 생활 실패나 인간관계의 실망감(disappointing relationship)</li><li>모든 사람에게 좋은 사람이 되려다 겪는 과부하(overload)</li><li>무작정 불평하는 것 이상의 대처가 필요함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03불평이 미치는 부정적 영향</div><ul><li>불평은 단순히 말을 내뱉는 것에 그치지 않고 인간의 에너지를 갉아먹는 도둑과 같다.</li><li>자존감(self-esteem)과 긍정적인 하루를 앗아감</li><li>위기 대처 능력을 떨어뜨리고 새로운 시도를 방해함</li><li>핵심 키워드: 감정적 도둑(emotional thieves)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04긍정적 변화를 위한 제언</div><ul><li>불평이라는 부정적인 생각들을 버림으로써 그 자리를 긍정적인 생각으로 채워야 한다.</li><li>부정적 사고를 놓아주는 것이 변화의 시작</li><li>긍정적인 생각(positive thoughts)이 자연스럽게 그 자리를 대신함</li><li>더 나은 삶의 가능성을 위해 생각의 전환이 필요함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">culturally</td><td class=\"m\">문화적으로</td></tr><tr><td class=\"w\">condition</td><td class=\"m\">길들이다, 조절하다</td></tr><tr><td class=\"w\">accept</td><td class=\"m\">받아들이다</td></tr><tr><td class=\"w\">negative</td><td class=\"m\">부정적인</td></tr><tr><td class=\"w\">norm</td><td class=\"m\">표준, 규범</td></tr><tr><td class=\"w\">overhear</td><td class=\"m\">우연히 듣다</td></tr><tr><td class=\"w\">complain</td><td class=\"m\">불평하다</td></tr><tr><td class=\"w\">communicate</td><td class=\"m\">의사소통하다</td></tr><tr><td class=\"w\">gripe</td><td class=\"m\">불평, 불만</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">instead of</td><td class=\"m\">~대신에</td></tr><tr><td class=\"w\">valid</td><td class=\"m\">타당한, 정당한</td></tr><tr><td class=\"w\">failing</td><td class=\"m\">실패하는, 잘못되어가는</td></tr><tr><td class=\"w\">disappointing</td><td class=\"m\">실망스러운</td></tr><tr><td class=\"w\">suffer from</td><td class=\"m\">~로 고통받다</td></tr><tr><td class=\"w\">overload</td><td class=\"m\">과부하</td></tr><tr><td class=\"w\">grumble</td><td class=\"m\">투덜거리다</td></tr><tr><td class=\"w\">thief</td><td class=\"m\">도둑</td></tr><tr><td class=\"w\">self-esteem</td><td class=\"m\">자존감</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 문화적으로 길들여졌다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">have become culturally conditioned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부정적인 생각을 받아들이도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to accept</span> negative thinking</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기준으로</span><span class=\"en\"><b>as the norm.</b></span></div></div><div class=\"lec-sent-ko\">우리는 부정적인 생각을 기준으로 받아들이도록(부정적인 생각을 하도록) 문화적으로 길들여졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우리 사회가 부정적인 태도를 자연스럽게 여기도록 분위기를 형성해 왔다는 점을 지적합니다. 여기서 conditioned는 사전적으로는 &#39;조건화된&#39;이지만, 여기서는 반복된 문화적 경험으로 인해 특정 행동을 당연하게 여기게 된 상태를 뜻합니다. 습관이 고착화되어 스스로 의식하지 못하는 사이에 부정적인 사람이 되어버린 상황을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have become culturally conditioned (수동태): be동사(have become)+p.p.(conditioned) 구조. condition은 타동사(조건/길들이다)인데 목적어가 없어서 수동구조 have become conditioned 형태로 쓴다. 기본구조: condition + O + to V (O를 ~하도록 길들이다).</div><div class=\"lec-gr-item\">to accept (to부정사): 앞의 conditioned를 수식하는 형용사적 용법으로, ~하게 되다라는 의미의 결과를 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">culturally</td><td class=\"m\">문화적으로</td></tr><tr><td class=\"w\">condition</td><td class=\"m\">길들이다, 조절하다</td></tr><tr><td class=\"w\">accept</td><td class=\"m\">받아들이다</td></tr><tr><td class=\"w\">negative</td><td class=\"m\">부정적인</td></tr><tr><td class=\"w\">norm</td><td class=\"m\">표준, 규범</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내가 사람들이 말하는 것을 우연히 들을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When I overhear people talking</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직장에서나 거리에서</span><span class=\"en\"><b>at work or on the street,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 경우에</span><span class=\"en\"><b>most of the time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 불평하고 있다</span><span class=\"en\"><b>they are complaining.</b></span></div></div><div class=\"lec-sent-ko\">사람들이 직장이나 거리에서 말하는 것을 어쩌다 듣게 되면 대부분은 불평들을 하는 소리이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;부정적인 사고가 일반화된 현실&#39;을 증명하는 구체적인 사례를 제시합니다. 필자가 일상에서 겪는 경험을 나열하며 주장이 사실임을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When I overhear people talking 5형식(SVOC) 구조: overhear(지각동사) + 목적어(people) + 목적격보어(talking, 현재분사). 지각동사 뒤에서 목적어가 행동하는 중임을 나타내기 위해 현재분사 talking을 사용함.</div><div class=\"lec-gr-item\">talking (현재분사): 위 5형식 구조에서 people의 동작을 설명하는 능동/진행의 의미.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">overhear</td><td class=\"m\">우연히 듣다</td></tr><tr><td class=\"w\">complain</td><td class=\"m\">불평하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">슬프게도,</span><span class=\"en\"><b>Sadly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것은 되어버렸다</span><span class=\"en\"><b>this has become</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 의사소통하는 방식이,</span><span class=\"en\"><b><span class=\"grammar-hl\">the way we communicate</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 알아가는 방식이</span><span class=\"en\"><b><span class=\"grammar-hl\">the way we get to know</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로를</span><span class=\"en\"><b><span class=\"grammar-hl\">each other</span>.</b></span></div></div><div class=\"lec-sent-ko\">슬프게도 그게 우리가 의사소통을 하고 서로를 알게 되는 방식이 되어버렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 불평하는 행위가 단순한 푸념을 넘어 인간관계의 핵심 수단이 된 안타까운 상황을 강조하며 앞 문장의 내용을 부연 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the way we communicate (관계부사): the way 뒤에 생략된 관계부사 how가 생략된 구조로, 뒤에 주어(we)와 동사(communicate)가 이어진 완전한 절이 옴.</div><div class=\"lec-gr-item\">the way we get to know each other (관계부사): 앞과 마찬가지로 the way 뒤에 관계부사 how가 생략된 구조. get to는 관용표현으로 ~하게 되다라는 변화의 의미.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">communicate</td><td class=\"m\">의사소통하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 친구를 사귄다</span><span class=\"en\"><b>We make friends</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 불평들을 공유함으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">sharing</span> our gripes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기쁨 대신에</span><span class=\"en\"><b>instead of joys.</b></span></div></div><div class=\"lec-sent-ko\">우리는 기쁨을 함께 하는 대신 같이 불평하면서 친구를 사귄다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에서 말한 &#39;서로를 알아가는 방식&#39;이 구체적으로 어떻게 나타나는지 대조를 통해 보여줍니다. 여기서 gripes는 사전적으로는 &#39;불평, 투덜거림&#39;인데, 여기서는 단순히 기분 나쁨을 넘어 타인과 공감대를 형성하기 위해 내뱉는 부정적인 대화 소재를 의미합니다. 긍정적인 경험보다 부정적인 경험을 공유할 때 더 쉽게 유대감을 느끼는 비정상적인 인간관계를 꼬집기 위해 이 단어를 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sharing (동명사): 전치사 by 뒤에 위치하여 ~함으로써라는 수단/방법을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gripe</td><td class=\"m\">불평, 불만</td></tr><tr><td class=\"w\">instead of</td><td class=\"m\">~대신에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">때때로</span><span class=\"en\"><b>Sometimes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 타당한 이유를 가진다</span><span class=\"en\"><b>we have a valid <span class=\"grammar-hl\">reason</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 기분이 나쁜</span><span class=\"en\"><b><span class=\"grammar-hl\">we feel bad</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일들에 대해</span><span class=\"en\"><b>about things.</b></span></div></div><div class=\"lec-sent-ko\">무언가 기분이 안 좋을 만한 타당한 이유가 있을 때도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 무조건적인 긍정을 강요하는 것이 아님을 밝히며, 부정적인 감정을 느끼는 상황 자체가 존재함을 인정하는 완충 지대를 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reason we feel bad (관계부사): reason 뒤에 생략된 관계부사 why가 생략된 구조. 뒤에 완전한 문장이 이어짐.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">valid</td><td class=\"m\">타당한, 정당한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아마 우리는 실패하는 결혼 생활 속에 있거나,</span><span class=\"en\"><b>Maybe we are in a <span class=\"grammar-hl\">failing marriage</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 실망스러운 관계를 겪었거나,</span><span class=\"en\"><b>or we’ve had a <span class=\"grammar-hl\">disappointing relationship</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 총체적인 과부하로 고통받고 있다</span><span class=\"en\"><b>or we’re suffering from the total overload</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모두에게 모든 것이 되려고 노력하는 것이 유발하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that trying to be everything to everybody causes</span>.</b></span></div></div><div class=\"lec-sent-ko\">아마 결혼 생활이 힘들어지거나, 누군가와의 관계가 나빠졌거나, 모든 사람에게 중요한 존재가 되려는 노력이 주는 총체적인 과부하로 고통 받고 있을지 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 5번 문장의 &#39;정당한 이유&#39;가 무엇인지 구체적인 예시를 들어 독자의 공감을 이끌어냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">failing marriage (현재분사(형용사)): failing이 marriage를 수식하여 실패하고 있는/무너져가는 결혼 생활이라는 진행 중인 상태를 묘사함.</div><div class=\"lec-gr-item\">disappointing relationship (현재분사(형용사)): disappointing이 relationship을 수식하여 실망스러운 관계라는 성질을 나타냄.</div><div class=\"lec-gr-item\">that trying to be everything to everybody causes (관계대명사(목적격)): that 뒤에 주어(trying to be everything to everybody)와 동사(causes)가 오지만 causes의 목적어가 빠져 있는 불완전한 문장. 앞의 the total overload를 수식함.</div><div class=\"lec-gr-item\">trying (동명사): 문장의 주어 역할을 하며 ~하는 것이라는 명사적 의미로 사용됨.</div><div class=\"lec-gr-item\">to be (to부정사): trying의 보어 역할을 하며 ~가 되려고 노력하는 것의 의미로 쓰임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">failing</td><td class=\"m\">실패하는, 잘못되어가는</td></tr><tr><td class=\"w\">disappointing</td><td class=\"m\">실망스러운</td></tr><tr><td class=\"w\">overload</td><td class=\"m\">과부하</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이런 상황들 속에서도,</span><span class=\"en\"><b>Even in these situations,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 더 많은 것을 할 수 있다</span><span class=\"en\"><b>we could <span class=\"grammar-hl\">do</span> more</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단순히 불평하는 것보다</span><span class=\"en\"><b>than just grumble.</b></span></div></div><div class=\"lec-sent-ko\">하지만 이런 상황에서도 불평만 해서는 안 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 예시들조차 불평만으로 해결되지 않으며, 문제 해결을 위해 더 생산적인 태도가 필요하다는 필자의 핵심 주장을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">do (대동사): 앞서 언급된 부정적인 상황에 대응하는 행동을 대신함. 앞의 동사가 일반동사이면 do를 쓴다는 규칙에 따라 쓰임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grumble</td><td class=\"m\">투덜거리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">불평은 도둑들과 같다</span><span class=\"en\"><b>Complaints are like <span class=\"grammar-hl\">thieves</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 에너지를 훔치는,</span><span class=\"en\"><b><span class=\"grammar-hl\">who steal</span> your energy,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 자긍심을,</span><span class=\"en\"><b>your self-esteem,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 당신의 좋은 날들을</span><span class=\"en\"><b>and your good days</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기쁨으로 가득 찬</span><span class=\"en\"><b><span class=\"grammar-hl\">filled with joy</span>.</b></span></div></div><div class=\"lec-sent-ko\">불평은 에너지와 자긍심, 기쁨으로 가득 찬 좋은 날들을 훔쳐가는 도둑과 같다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> thieves(도둑)라는 비유를 사용하여 불평이 인간에게 끼치는 해악을 시각화합니다. 불평은 단순히 말하는 행위가 아니라, 우리가 소중히 지켜야 할 삶의 자산을 앗아가는 파괴적인 행위임을 강하게 경고하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thieves who steal (관계대명사(주격)): who 뒤에 동사(steal)가 바로 이어지며 thieves를 수식함.</div><div class=\"lec-gr-item\">filled with joy (과거분사(형용사)): 뒤에서 days를 수식하며 ~로 가득 찬이라는 수동/완료의 의미를 가짐.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">complain</td><td class=\"m\">불평하다</td></tr><tr><td class=\"w\">self-esteem</td><td class=\"m\">자존감</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 감정적인 도둑들은</span><span class=\"en\"><b>These emotional thieves</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 능력을 흐리게 한다</span><span class=\"en\"><b>cloud your ability</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위기에 대처하는</span><span class=\"en\"><b>to deal with crises</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 크게 제한한다</span><span class=\"en\"><b>and greatly limit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 전반적인 잠재력을</span><span class=\"en\"><b>your overall potential</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신을 막음으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">preventing</span> you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 것들을 시도하는 것조차</span><span class=\"en\"><b>from even <span class=\"grammar-hl\">trying</span> new things.</b></span></div></div><div class=\"lec-sent-ko\">이런 감정의 도둑들은 위기 대처 능력을 흐리게(약하게) 하며, 새로운 것에 대한 시도조차 못하게 함으로써 전반적인 잠재력을 크게 제한한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 8번 문장의 비유를 이어받아, 부정적인 사고가 실제로 개인의 성장을 어떻게 방해하는지 인과관계를 설명합니다. 여기서 cloud는 사전적으로 &#39;구름으로 덮다&#39;인데, 여기서는 판단력이나 능력이 흐릿해져 명확하게 사고하지 못하게 만드는 상태를 뜻합니다. 안개가 끼면 앞이 안 보이듯, 불평하는 습관이 우리의 지적·감정적 통찰력을 마비시킨다는 것을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">preventing (현재분사): 분사구문으로, 앞 문장의 내용이 결과적으로 ~하는 것을 막는다는 동시동작/결과를 나타냄.</div><div class=\"lec-gr-item\">trying (동명사): 전치사 by의 목적어로 쓰여 행위/활동을 나타냄.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신의 부정적인 생각들을 버려라,</span><span class=\"en\"><b>Let go of your negative thoughts,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면 긍정적인 생각들이</span><span class=\"en\"><b>and positive thoughts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시작할 것이다</span><span class=\"en\"><b>will start <span class=\"grammar-hl\">taking</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 자리를 차지하기를</span><span class=\"en\"><b><span class=\"grammar-hl\">their place</span>.</b></span></div></div><div class=\"lec-sent-ko\">부정적인 생각을 버려라, 그러면 긍정적인 생각이 그 자리를 차지하기 시작할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 행동 변화를 촉구하며 글을 마무리합니다. 9번까지의 분석을 바탕으로, 부정적인 생각을 버리는 것이 곧 긍정적인 삶으로 나아가는 첫걸음임을 강조하는 결론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taking their place (현재분사): start의 목적보어로 쓰여, ~하는 것을 시작하다라는 동작의 진행을 설명함.</div><div class=\"lec-gr-item\">taking their place (관용표현): take one&#39;s place는 ~의 자리를 대신하다라는 숙어적 표현.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">negative</td><td class=\"m\">부정적인</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>현대 사회에서는 부정적인 사고가 일상적인 대화 방식으로 자리 잡았다.</li><li>우리는 기쁨보다 불평을 나누며 관계를 맺고, 이는 인간의 에너지를 앗아가는 도둑질과 같다.</li><li>살다 보면 힘든 상황을 겪지만, 불평만 늘어놓는 것은 문제 해결에 전혀 도움이 되지 않는다.</li><li>부정적인 생각을 버려야만 비로소 새로운 도전과 긍정적인 변화가 우리 삶에 자리 잡을 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People often use complaining to build relationships, yet this negative habit depletes personal energy and limits one&#39;s ability to achieve potential.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 관계를 맺기 위해 자주 불평하지만, 이러한 부정적인 습관은 개인의 에너지를 고갈시키고 잠재력을 발휘하는 능력을 제한한다.</div></div></div>"],"segs":[[{"audio":"./passage1_audio/1.mp3","hl":null}],[{"audio":"./passage1_audio/2.mp3","hl":null}],[{"audio":"./passage1_audio/3.mp3","hl":null},{"audio":
