 불가능함 (be anybody other than yourself)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02연기의 공통점과 차이점</div><ul><li>같은 대사를 하더라도 인물에 대한 해석은 연기자마다 다르다.</li><li>동일한 대사를 사용하여 연기함 (Shakespeare’s lines)</li><li>인물의 행동 동기에 대한 해석은 사람마다 다름 (what you think makes Hamlet behave)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03연기의 고유성</div><ul><li>배우마다 인물을 이해하는 방식이 다르기 때문에 연기가 독창적이다.</li><li>해석의 차이가 연기를 특별하게 만듦 (acting is unique)</li><li>연기는 인물에 대한 자신의 이해를 전달하는 과정임 (telling an audience what you understand)</li><li>핵심 키워드: 해석(interpretation), 독창성(uniqueness)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">actor</td><td class=\"m\">배우</td></tr><tr><td class=\"w\">character</td><td class=\"m\">등장인물, 배역</td></tr><tr><td class=\"w\">in reality</td><td class=\"m\">실제로, 사실은</td></tr><tr><td class=\"w\">neither</td><td class=\"m\">~도 역시 아니다</td></tr><tr><td class=\"w\">revenge</td><td class=\"m\">복수</td></tr><tr><td class=\"w\">therein</td><td class=\"m\">그곳에, 그 점에</td></tr><tr><td class=\"w\">secret</td><td class=\"m\">비결, 비밀</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">performance</td><td class=\"m\">연기, 공연</td></tr><tr><td class=\"w\">similar</td><td class=\"m\">비슷한</td></tr><tr><td class=\"w\">in that</td><td class=\"m\">~라는 점에서</td></tr><tr><td class=\"w\">behave</td><td class=\"m\">행동하다</td></tr><tr><td class=\"w\">unique</td><td class=\"m\">독특한, 고유의</td></tr><tr><td class=\"w\">audience</td><td class=\"m\">관객</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">배우들은</span><span class=\"en\"><b>Actors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">되지 않는다</span><span class=\"en\"><b>do not become</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인물들이</span><span class=\"en\"><b>the <span class=\"grammar-hl\">characters</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 연기하는</span><span class=\"en\"><b><span class=\"grammar-hl\">they play</span>.</b></span></div></div><div class=\"lec-sent-ko\">배우가 자신이 연기하는 인물이 되는 것은 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 배우가 연기라는 행위를 한다고 해서, 본래의 자기 자신이 사라지고 다른 존재가 되는 것은 아니라는 점을 분명히 하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">characters they play (관계대명사(목적격)): 명사 characters 뒤에 관계대명사 that/which가 생략된 구조로, play 뒤의 목적어가 빠져 있으며 characters를 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">actor</td><td class=\"m\">배우</td></tr><tr><td class=\"w\">character</td><td class=\"m\">등장인물, 배역</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 할 수 없다,</span><span class=\"en\"><b>You can’t,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로,</span><span class=\"en\"><b>in reality,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가가 되는 것을</span><span class=\"en\"><b>be <span class=\"grammar-hl\">anybody</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신 자신 외의</span><span class=\"en\"><b><span class=\"grammar-hl\">other than yourself</span>.</b></span></div></div><div class=\"lec-sent-ko\">사람은 실제로 자신 이외의 다른 사람이 될 수 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;연기&#39;와 &#39;실제&#39;의 경계를 확정 짓습니다. 여기서 reality는 &#39;실제 현실&#39;이라는 뜻으로, 연극 무대와는 대비되는 물리적이고 변하지 않는 우리 존재의 본질을 강조하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">anybody other than yourself (관용표현): other than은 &#39;~이외의&#39;라는 뜻으로 anybody를 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in reality</td><td class=\"m\">실제로, 사실은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나도 그럴 수 없다.</span><span class=\"en\"><b><span class=\"grammar-hl\">Neither can I</span>.</b></span></div></div><div class=\"lec-sent-ko\">나도 그럴 수 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 내용을 필자 자신에게도 동일하게 적용함으로써, 모든 인간은 본질적으로 타인이 될 수 없다는 보편적 원칙을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Neither can I (도치): 부정어 Neither로 문장이 시작되어 조동사 can과 주어 I의 위치가 바뀐 구조임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">neither</td><td class=\"m\">~도 역시 아니다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 당신이 될 수 없고,</span><span class=\"en\"><b>I can’t be you,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 내가 될 수 없으며,</span><span class=\"en\"><b>and you can’t be me,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 둘 중 누구도</span><span class=\"en\"><b>and <span class=\"grammar-hl\">neither of us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">햄릿이 될 수 없다.</span><span class=\"en\"><b><span class=\"grammar-hl\">can be Hamlet</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 네가 될 수 없고, 너는 내가 될 수 없으며, 우리 둘 다 Hamlet이 될 수 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 예시(햄릿)를 들어, 타인이 되는 것은 물리적으로 불가능함을 재확인합니다. 앞 문장들의 추상적인 논리를 독자가 이해하기 쉬운 극 중 인물로 구체화했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">neither of us can be Hamlet (관용표현): neither of는 &#39;둘 중 어느 쪽도 ~가 아니다&#39;를 의미하며 단수/복수 취급이 가능하나 여기서는 복수 명사 us와 함께 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">neither</td><td class=\"m\">~도 역시 아니다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 우리 둘 다</span><span class=\"en\"><b>But both of us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">복수를 이해한다</span><span class=\"en\"><b>understand revenge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 자신의 방식으로,</span><span class=\"en\"><b>in our own ways,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그 안에 놓여 있다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">therein lies</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비밀이</span><span class=\"en\"><b>the secret</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 당신과 내가</span><span class=\"en\"><b>of <span class=\"grammar-hl\">how you and I</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">햄릿을 연기할 수 있는지에 대한</span><span class=\"en\"><b><span class=\"grammar-hl\">can play Hamlet</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 우리 둘 다 각자의 방식으로 복수를 이해하고 있으며, 바로 거기에 여러분과 내가 Hamlet을 연기할 수 있는 비밀이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 타인이 되는 것은 불가능하지만 &#39;복수&#39;라는 감정은 이해할 수 있다는 점을 지적합니다. 여기서 secret은 사전적으로 &#39;비밀&#39;이지만, 여기서는 연기의 핵심 원리를 뜻합니다. 인간은 타인이 될 순 없어도 감정의 공통분모를 통해 타인을 &#39;해석&#39;할 수 있다는 연기의 본질을 짚어내기 위해 이 단어를 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">therein lies (도치): 장소 부사 therein이 문장 앞으로 나오면서 주어 the secret과 동사 lies의 위치가 바뀐 구조임</div><div class=\"lec-gr-item\">how you and I can play Hamlet (간접의문문): 의문사 how + 주어(you and I) + 동사(can play)의 어순으로 이루어진 명사절로 전치사 of의 목적어 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">revenge</td><td class=\"m\">복수</td></tr><tr><td class=\"w\">therein</td><td class=\"m\">그곳에, 그 점에</td></tr><tr><td class=\"w\">secret</td><td class=\"m\">비결, 비밀</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 연기는</span><span class=\"en\"><b>Our performances</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비슷할 것이다</span><span class=\"en\"><b>would be similar</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~라는 점에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 둘 다 말한다는</span><span class=\"en\"><b>we both say</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">셰익스피어의 대사를,</span><span class=\"en\"><b>Shakespeare’s lines,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 당신이 생각하는 것은</span><span class=\"en\"><b>but <span class=\"grammar-hl\">what you think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇이 햄릿을 행동하게 만드는지</span><span class=\"en\"><b><span class=\"grammar-hl\">makes Hamlet behave</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 하는 방식으로</span><span class=\"en\"><b><span class=\"grammar-hl\">the way he does</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같지 않다</span><span class=\"en\"><b>is not the same</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 생각하는 것과</span><span class=\"en\"><b>as what I think.</b></span></div></div><div class=\"lec-sent-ko\">둘 다 Shakespeare의 대사를 말한다는 점에서는 여러분과 나의 연기가 비슷하겠지만, 네가 생각하기에 Hamlet을 그의 방식대로 행동하게 만드는 것은 내가 생각하는 것과 같지 않다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 외적인 연기는 같아도 내적인 해석은 다르다는 것을 대조합니다. behave는 &#39;행동하다&#39;인데, 여기서는 단순히 움직이는 것이 아니라 인물의 성격과 상황을 고려한 연기적 선택을 의미합니다. 배우마다 고유한 &#39;해석&#39;이 존재함을 보여주려 이 단어를 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in that (관용표현): &#39;~라는 점에서&#39;라는 의미로 접속사처럼 쓰여 뒤에 절을 동반함</div><div class=\"lec-gr-item\">what you think makes Hamlet behave the way he does (5형식(SVOC)): makes(사역동사) + Hamlet(목적어) + behave(목적보어/동사원형) 구조이며, what절 전체가 문장의 주어 역할을 함</div><div class=\"lec-gr-item\">the way he does (대동사): does는 앞의 일반동사 behave를 대신하는 대동사로, 앞의 동사가 일반동사이면 do/does/did를 쓴다는 규칙에 따라 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">performance</td><td class=\"m\">연기, 공연</td></tr><tr><td class=\"w\">similar</td><td class=\"m\">비슷한</td></tr><tr><td class=\"w\">in that</td><td class=\"m\">~라는 점에서</td></tr><tr><td class=\"w\">behave</td><td class=\"m\">행동하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것이 이유이다</span><span class=\"en\"><b><span class=\"grammar-hl\">That’s why</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 연기가</span><span class=\"en\"><b>our acting</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독특한</span><span class=\"en\"><b>is unique.</b></span></div></div><div class=\"lec-sent-ko\">이런 이유로 우리의 연기가 저마다 독특한(다른) 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 &#39;해석의 차이&#39;가 곧 각 배우만의 개성(unique)이 된다는 결론을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">That’s why (관용표현): &#39;그것이 ~하는 이유이다&#39;라는 의미로 관계부사 why가 이끄는 절이 보어로 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unique</td><td class=\"m\">독특한, 고유의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">즐거움은</span><span class=\"en\"><b><span class=\"grammar-hl\">The fun</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연기 속의</span><span class=\"en\"><b><span class=\"grammar-hl\">in acting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인물들을 연기하는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is to play</span> <span class=\"grammar-hl\">characters</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른</span><span class=\"en\"><b><span class=\"grammar-hl\">that are different</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신 자신으로부터</span><span class=\"en\"><b>from yourself</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면,</span><span class=\"en\"><b>because,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 할 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">when you do,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 청중에게 말하고 있기 때문이다</span><span class=\"en\"><b><span class=\"grammar-hl\">you are telling</span> an audience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 이해하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">what you understand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 인물에 대하여</span><span class=\"en\"><b><span class=\"grammar-hl\">about this character</span>.</b></span></div></div><div class=\"lec-sent-ko\">연기의 즐거움은 자신과 다른 인물을 연기한다는 것인데, 연기를 할 때 이 인물에 대해 자신이 이해하는 바를 청중에게 말해주기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 연기의 진정한 목적을 밝힙니다. telling은 사전적으로 &#39;말하다&#39;이지만, 여기서는 단순히 대사를 읊는 것을 넘어 배우의 내면적 해석을 관객에게 &#39;전달하고 표출하는&#39; 행위를 뜻합니다. 연기가 자기표현의 일종임을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The fun in acting (동명사): acting은 전치사 in의 목적어이자 행위를 나타내는 명사적 기능의 동명사임</div><div class=\"lec-gr-item\">is to play (to부정사): 보어 자리에 쓰인 명사적 용법의 to부정사임</div><div class=\"lec-gr-item\">characters that are different (관계대명사(주격)): 명사 characters를 수식하며 that 뒤에 주어가 없는 주격 관계대명사절임</div><div class=\"lec-gr-item\">when you do (대동사): do는 앞의 일반동사 play characters를 대신하며, 앞의 동사가 일반동사이면 do[does,did]를 쓴다는 규칙에 따라 쓰임</div><div class=\"lec-gr-item\">when you do, you are telling (현재진행): be동사(are) + 현재분사(telling)가 결합하여 현재 진행 중인 동작을 나타냄</div><div class=\"lec-gr-item\">what you understand about this character (간접의문문): 의문사 what + 주어(you) + 동사(understand)의 어순이며 telling의 목적어 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">character</td><td class=\"m\">등장인물, 배역</td></tr><tr><td class=\"w\">audience</td><td class=\"m\">관객</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>배우는 실제로 다른 인물이 될 수 없으며, 이는 모든 인간에게 공통적인 현실이다.</li><li>하지만 인간은 공통된 감정을 각자의 방식으로 이해할 수 있고, 그것이 연기의 핵심이다.</li><li>같은 대사를 하더라도 인물에 대한 배우 개개인의 해석이 다르기에 연기는 저마다 독특해진다.</li><li>결국 연기란 자기와 다른 인물을 통해 자신만의 인물 해석을 관객에게 보여주는 즐거운 과정이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Actors cannot truly become someone else, yet they provide unique performances because they portray characters through their own individual understanding.</div>\n              <div class=\"lec-final-sum-ko\">배우는 실제로 타인이 될 수 없지만, 자신만의 이해를 바탕으로 인물을 연기하기에 독창적인 공연을 만들어낸다.</div></div></div>"],"segs":[[{"audio":"./passage3_audio/1.mp3","hl":null}],[{"audio":"./passage3_audio/2.mp3","hl":null}],[{"audio":"./passage3_audio/3.mp3","hl":null},{"audio":"./passage3_audio/4.mp3","hl":"stage-0"},{"audio":"./passage3_audio/5.mp3","hl":"stage-1"},{"audio":"./passage3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./passage3_audio/7.mp3","hl":null}],[{"audio":"./passage3_audio/8.mp3","hl":"main"},{"audio":"./passage3_audio/9.mp3","hl":"meaning"},{"audio":"./passage3_audio/10.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/11.mp3","hl":"main"},{"audio":"./passage3_audio/12.mp3","hl":"meaning"},{"audio":"./passage3_audio/13.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/14.mp3","hl":"main"},{"audio":"./passage3_audio/15.mp3","hl":"meaning"},{"audio":"./passage3_audio/16.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/17.mp3","hl":"main"},{"audio":"./passage3_audio/18.mp3","hl":"meaning"},{"audio":"./passage3_audio/19.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/20.mp3","hl":"main"},{"audio":"./passage3_audio/21.mp3","hl":"meaning"},{"audio":"./passage3_audio/22.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/23.mp3","hl":"main"},{"audio":"./passage3_audio/24.mp3","hl":"meaning"},{"audio":"./passage3_audio/25.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/26.mp3","hl":"main"},{"audio":"./passage3_audio/27.mp3","hl":"meaning"},{"audio":"./passage3_audio/28.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/29.mp3","hl":"main"},{"audio":"./passage3_audio/30.mp3","hl":"meaning"},{"audio":"./passage3_audio/31.mp3","hl":"grammar"}],[{"audio":"./passage3_audio/32.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");funct
