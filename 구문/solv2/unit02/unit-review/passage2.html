s)</li><li>&#39;휴가 중&#39;이라는 특별한 규칙의 적용 (being-on-holiday)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02복장을 통한 변화</div><ul><li>평소와 다른 복장은 단순히 옷을 갈아입는 것을 넘어 자신의 상태를 알리는 신호입니다.</li><li>직장인의 평소 단정한 복장과 휴가의 캐주얼한 복장 대비</li><li>중년 남성의 사례: 반바지, 샌들, 무늬 있는 셔츠 등 (patterned shirt)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03휴가 복장의 의미</div><ul><li>휴가 복장을 입는 행위는 주변 사람들과 자기 자신에게 휴가 상태임을 선언하는 것입니다.</li><li>평소의 사회적 의무가 잠시 중단됨 (social obligations)</li><li>직장에서는 상상할 수 없는 행동을 할 수 있는 자유</li><li>동료들의 시선에서 벗어났다는 심리적 인식 (witnessed by colleagues)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">holiday</td><td class=\"m\">휴가, 명절</td></tr><tr><td class=\"w\">unwritten</td><td class=\"m\">성문으로 되지 않은, 관습적인</td></tr><tr><td class=\"w\">rule</td><td class=\"m\">규칙</td></tr><tr><td class=\"w\">custom</td><td class=\"m\">관습, 풍습</td></tr><tr><td class=\"w\">everyday</td><td class=\"m\">매일의, 일상적인</td></tr><tr><td class=\"w\">break</td><td class=\"m\">어기다, 깨뜨리다</td></tr><tr><td class=\"w\">recognizably</td><td class=\"m\">알아볼 수 있게, 인식할 수 있을 정도로</td></tr><tr><td class=\"w\">come into force</td><td class=\"m\">시행되다, 발효되다</td></tr><tr><td class=\"w\">take (something) for example</td><td class=\"m\">~을 예로 들다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">middle-aged</td><td class=\"m\">중년의</td></tr><tr><td class=\"w\">sandal</td><td class=\"m\">샌들</td></tr><tr><td class=\"w\">patterned</td><td class=\"m\">무늬가 있는</td></tr><tr><td class=\"w\">scarcely</td><td class=\"m\">거의 ~않다, 간신히</td></tr><tr><td class=\"w\">recognizable</td><td class=\"m\">알아볼 수 있는</td></tr><tr><td class=\"w\">professional</td><td class=\"m\">전문적인, 직업의</td></tr><tr><td class=\"w\">commuter</td><td class=\"m\">통근자</td></tr><tr><td class=\"w\">obligation</td><td class=\"m\">의무</td></tr><tr><td class=\"w\">suspend</td><td class=\"m\">유예하다, 일시 중지하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">휴일은 시간이다</span><span class=\"en\"><b>Holidays are a time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓰이지 않은 규칙들이</span><span class=\"en\"><b><span class=\"grammar-hl\">when</span> the unwritten rules</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 일상생활의 관습들이</span><span class=\"en\"><b>and customs of everyday life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">널리 깨어지는</span><span class=\"en\"><b><span class=\"grammar-hl\">are widely broken</span>.</b></span></div></div><div class=\"lec-sent-ko\">휴일은 관습적인 규칙이나 일상적인 삶의 관습들이 전반적으로 깨어지는 시간이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 휴일이라는 특별한 기간이 되면 평소 당연하게 여겨지던 일상의 규칙들이 무시된다는 도입부입니다. 여기서 broken은 단순히 &#39;부서지다&#39;는 사전적 의미를 넘어, 규범이나 규칙이 &#39;적용되지 않거나 무시된다&#39;는 뜻으로 쓰였습니다. 필자는 일상의 틀이 일시적으로 해체됨을 강조하려고 이 단어를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when (관계부사): 선행사 a time을 수식하며, 뒤에 &#39;the unwritten rules and customs of everyday life are widely broken&#39;이라는 완전한 절이 이어짐</div><div class=\"lec-gr-item\">are widely broken (수동태): be동사(are)+p.p.(broken) 구조. break는 타동사인데 목적어가 없어서 수동구조 are broken 형태로 쓴다. 기본구조: V(break) + O(목적어)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">holiday</td><td class=\"m\">휴가, 명절</td></tr><tr><td class=\"w\">unwritten</td><td class=\"m\">성문으로 되지 않은, 관습적인</td></tr><tr><td class=\"w\">rule</td><td class=\"m\">규칙</td></tr><tr><td class=\"w\">custom</td><td class=\"m\">관습, 풍습</td></tr><tr><td class=\"w\">everyday</td><td class=\"m\">매일의, 일상적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신에, 다른 규칙들이</span><span class=\"en\"><b>Instead, other rules</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 가장 두드러지게, “휴가 중임”의 규칙들이 —</span><span class=\"en\"><b>— most recognizably, those of “<span class=\"grammar-hl\">being-on-holiday</span>” —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">효력을 발생한다.</span><span class=\"en\"><b>come into force.</b></span></div></div><div class=\"lec-sent-ko\">대신에, 가장 두드러지게 “휴가 중임”에 관한 다른 규칙들이 효력을 발생한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 일상 규칙이 깨진 자리를 새로운 휴가철 규칙이 대체한다는 내용입니다. come into force는 사전적으로 &#39;효력이 발생하다&#39;인데, 여기서는 휴가 중이라는 새로운 행동 양식이 사람들에게 강력하게 적용되기 시작한다는 의미입니다. 법률 용어를 빌려옴으로써 휴가철 행동 양식이 마치 의무적인 규칙처럼 작동함을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">being-on-holiday (동명사): 전치사 of의 목적어로 쓰여 &#39;휴가 중임&#39;이라는 명사적 개념을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">holiday</td><td class=\"m\">휴가, 명절</td></tr><tr><td class=\"w\">rule</td><td class=\"m\">규칙</td></tr><tr><td class=\"w\">recognizably</td><td class=\"m\">알아볼 수 있게, 인식할 수 있을 정도로</td></tr><tr><td class=\"w\">come into force</td><td class=\"m\">시행되다, 발효되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">옷을 예를 들어라,</span><span class=\"en\"><b><span class=\"grammar-hl\">Take clothing,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예를 들어:</span><span class=\"en\"><b><span class=\"grammar-hl\">for example</span>:</b></span></div></div><div class=\"lec-sent-ko\">옷의 예를 보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 휴가철 규칙의 구체적인 예시로 복장을 들었습니다. 여기서 scarcely는 &#39;거의 ~않다&#39;라는 뜻인데, 평소의 이미지와 너무 달라 동일인물인지 의심될 정도라는 극적인 대비를 강조하기 위해 선택된 부사입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Take clothing, for example (관용표현): &#39;예를 들어 ~를 들어보자&#39;라는 뜻의 명령문 형태의 관용구</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take (something) for example</td><td class=\"m\">~을 예로 들다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 중년의 남성은</span><span class=\"en\"><b>The middle-aged man</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반바지와 샌들을 입은</span><span class=\"en\"><b><span class=\"grammar-hl\">dressed in shorts, sandals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 무늬 있는 셔츠를 입은,</span><span class=\"en\"><b><span class=\"grammar-hl\">and a patterned shirt</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목은 열어둔 채로,</span><span class=\"en\"><b><span class=\"grammar-hl\">open at the neck</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">머리에 밀짚모자를 쓴 채로,</span><span class=\"en\"><b>with a straw hat on his head,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 알아보기 힘들다</span><span class=\"en\"><b>is scarcely recognizable</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말쑥하게 차려입은 전문 통근자로</span><span class=\"en\"><b>as the neatly dressed professional commuter</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사무실을 오가는</span><span class=\"en\"><b><span class=\"grammar-hl\">who travels to and from the office</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나머지 일 년 동안의</span><span class=\"en\"><b>during the rest of the year.</b></span></div></div><div class=\"lec-sent-ko\">반바지를 입고, 샌들을 신고, 무늬가 있는 셔츠를 입고, 목은 (단추 등을 채우지 않고) 열어둔 채, 머리에는 밀짚모자를 쓴 중년의 남성은, 말쑥하게 차려 입고 (휴일을 제외한) 나머지 근무일들 동안 사무실을 오가는 통근자로 보이기 어렵다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 휴가철 복장이 단순한 옷이 아니라, 사회적 책임에서 벗어나겠다는 &#39;상징적 행위&#39;임을 설명합니다. suspended는 &#39;매달다&#39;는 뜻에서 유래해 &#39;중단되다, 유예되다&#39;라는 의미로 쓰였습니다. 일상의 의무가 잠시 멈춘 상태임을 명확히 보여주려고 이 단어를 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">dressed in shorts, sandals and a patterned shirt (과거분사): 명사 the middle-aged man을 수식하는 형용사적 기능. [N + p.p.] 구조로 &#39;…을 입은 중년 남성&#39;이라는 의미(the middle-aged man who is dressed in...의 축약)</div><div class=\"lec-gr-item\">open at the neck (과거분사): 명사 a patterned shirt를 수식. [N + p.p.] 구조로 &#39;목 부분이 열려 있는 셔츠&#39;라는 의미</div><div class=\"lec-gr-item\">who travels to and from the office (관계대명사): 선행사 the neatly dressed professional commuter를 수식하며, 절 내에서 주어 역할을 하는 주격 관계대명사</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">middle-aged</td><td class=\"m\">중년의</td></tr><tr><td class=\"w\">sandal</td><td class=\"m\">샌들</td></tr><tr><td class=\"w\">patterned</td><td class=\"m\">무늬가 있는</td></tr><tr><td class=\"w\">scarcely</td><td class=\"m\">거의 ~않다, 간신히</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recognizable</td><td class=\"m\">알아볼 수 있는</td></tr><tr><td class=\"w\">professional</td><td class=\"m\">전문적인, 직업의</td></tr><tr><td class=\"w\">commuter</td><td class=\"m\">통근자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 옷들을 입음으로써,</span><span class=\"en\"><b><span class=\"grammar-hl\">By wearing these clothes</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 말하고 있다</span><span class=\"en\"><b>he is telling</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상과 그 자신 둘 다에게</span><span class=\"en\"><b>both the world and himself</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 휴가 중이라는 것을,</span><span class=\"en\"><b><span class=\"grammar-hl\">that he is on holiday</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 평소 사회적 의무 중 많은 것이</span><span class=\"en\"><b>that many of his usual social obligations</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유예되었다는 것을,</span><span class=\"en\"><b><span class=\"grammar-hl\">are suspended</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그가 방식들로 행동할 수 있다는 것을</span><span class=\"en\"><b>and <span class=\"grammar-hl\">that he can behave</span> in ways</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 꿈도 꾸지 못할</span><span class=\"en\"><b><span class=\"grammar-hl\">that he would never dream of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직장에서는</span><span class=\"en\"><b>in the workplace</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그가 추정하기에</span><span class=\"en\"><b>and <span class=\"grammar-hl\">which he assumes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목격되지 않을</span><span class=\"en\"><b><span class=\"grammar-hl\">will not be witnessed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동료들에 의해</span><span class=\"en\"><b>by colleagues.</b></span></div></div><div class=\"lec-sent-ko\">그러한 옷들을 입음으로써, 그는 세상과 자기 자신에게 휴가 중이라는 것, 그의 사회적 의무 중 많은 것이 정지되었다는 것, 그리고 직장에서는 꿈도 꾸지 못하는, 그가 생각하기에 동료들의 눈에 뜨이지 않을 방식으로 행동할 수 있다는 것을 말하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 휴가철 복장이 단순한 옷이 아니라, 사회적 책임에서 벗어나겠다는 &#39;상징적 행위&#39;임을 설명합니다. suspended는 &#39;매달다&#39;는 뜻에서 유래해 &#39;중단되다, 유예되다&#39;라는 의미로 쓰였습니다. 일상의 의무가 잠시 멈춘 상태임을 명확히 보여주려고 이 단어를 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">By wearing these clothes (동명사): 전치사 by의 목적어로 쓰여 &#39;이 옷들을 입음으로써&#39;라는 수단/방법을 나타냄</div><div class=\"lec-gr-item\">that he is on holiday 동격의 that: 앞의 tell이라는 동사가 취하는 목적어 절로, he is on holiday라는 내용이 telling의 구체적인 대상임을 설명</div><div class=\"lec-gr-item\">are suspended (수동태): be동사(are)+p.p.(suspended) 구조. suspend는 타동사인데 목적어가 없어서 수동구조 are suspended 형태로 쓴다. 기본구조: V(suspend) + O(목적어)</div><div class=\"lec-gr-item\">that he can behave 동격의 that: 앞의 tell이라는 동사의 목적어 절로, he can behave...라는 내용이 telling의 구체적인 대상임을 설명</div><div class=\"lec-gr-item\">that he would never dream of (관계대명사): 선행사 ways를 수식. 절 내부에서 전치사 of의 목적어가 빠져 있는 목적격 관계대명사</div><div class=\"lec-gr-item\">which he assumes will not be witnessed (관계대명사): 선행사 ways를 수식. 절 내부에서 주어(which)가 쓰이고, 그 뒤에 삽입절(he assumes)이 위치함</div><div class=\"lec-gr-item\">will not be witnessed (수동태): be동사(be)+p.p.(witnessed) 구조. witness는 타동사인데 목적어가 없어서 수동구조 be witnessed 형태로 쓴다. 기본구조: V(witness) + O(목적어)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">holiday</td><td class=\"m\">휴가, 명절</td></tr><tr><td class=\"w\">obligation</td><td class=\"m\">의무</td></tr><tr><td class=\"w\">suspend</td><td class=\"m\">유예하다, 일시 중지하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>휴일은 일상적인 사회적 관습과 규칙이 중단되는 특별한 시기이다.</li><li>사람들은 휴가철이 되면 그에 맞는 복장과 행동 양식으로 평소와는 다른 사람이 된다.</li><li>휴가철 복장은 자신이 일상의 사회적 책임에서 벗어났음을 알리는 일종의 신호이다.</li><li>이를 통해 사람들은 직장에서 할 수 없는 자유로운 행동을 휴가 기간 동안 즐긴다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">During holidays, individuals abandon their usual professional appearances and social obligations, as they adopt specific behaviors that distinguish their vacation time from their daily routines.</div>\n              <div class=\"lec-final-sum-ko\">휴가 기간 동안 사람들은 평소의 직업적 외양과 사회적 의무를 버리고, 휴가 시간을 일상과 구분 짓는 특정한 행동을 취한다.</div></div></div>"],"segs":[[{"audio":"./passage2_audio/1.mp3","hl":null}],[{"audio":"./passage2_audio/2.mp3","hl":null}],[{"audio":"./passage2_audio/3.mp3","hl":null},{"audio":"./passage2_audio/4.mp3","hl":"stage-0"},{"audio":"./passage2_audio/5.mp3","hl":"stage-1"},{"audio":"./passage2_audio/6.mp3","hl":"stage-2"}],[{"audio":"./passage2_audio/7.mp3","hl":null}],[{"audio":"./passage2_audio/8.mp3","hl":"main"},{"audio":"./passage2_audio/9.mp3","hl":"meaning"},{"audio":"./passage2_audio/10.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/11.mp3","hl":"main"},{"audio":"./passage2_audio/12.mp3","hl":"meaning"},{"audio":"./passage2_audio/13.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/14.mp3","hl":"main"},{"audio":"./passage2_audio/15.mp3","hl":"meaning"},{"audio":"./passage2_audio/16.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/17.mp3","hl":"main"},{"audio":"./passage2_audio/18.mp3","hl":"meaning"},{"audio":"./passage2_audio/19.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/20.mp3","hl":"main"},{"audio":"./passage2_audio/21.mp3","hl":"meaning"},{"audio":"./passage2_audio/22.mp3","hl":"grammar"}],[{"audio":"./passage2_audio/23.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;va
