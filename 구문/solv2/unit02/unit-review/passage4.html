 사회가 당연하게 여기는 토론과 경쟁 중심의 문화가 사실은 아주 오래전 그리스 시대부터 이어진 합리적 문제 해결 방식임을 이해하면 글을 훨씬 쉽게 읽을 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01서구 사상의 기원</div><ul><li>현대 서구 사고의 뿌리는 고대 그리스의 황금기에서 시작되었다.</li><li>정치, 철학, 과학, 법의 현대적 기초 마련</li><li>고대 그리스 사상가들의 영향력 (Greek thinkers)</li><li>핵심 키워드: 현대 서구 사상(modern Western thought)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02논리적 탐구의 방식</div><ul><li>그리스인들은 반대되는 의견끼리 맞붙이는 방식이 진리를 찾는 최선의 방법이라고 믿었다.</li><li>서로 다른 생각을 시험하여 평가함</li><li>적대적 토론을 통한 합리적 탐구 (rational inquiry)</li><li>핵심 키워드: 반대적 토론(adversarial discussion)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03다양한 분야로의 확산</div><ul><li>이러한 논쟁 중심의 접근법은 서구 사회의 핵심 영역 전반에 영향을 미쳤다.</li><li>정치: 민주주의(democracy)와 정책 경쟁</li><li>철학: 세계의 본질에 대한 이성적인 대화</li><li>과학: 자연 현상을 설명하기 위한 경쟁적 이론(competing theories)</li><li>법: 당사자 대립 구조인 법 체계</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04현대 서구 사회의 특징</div><ul><li>오늘날 서구의 생활 방식은 이러한 질서 있는 경쟁을 기반으로 유지되고 있다.</li><li>정치, 상업, 과학, 법의 공통된 기반</li><li>경쟁을 통한 사회적 발전</li><li>핵심 키워드: 질서 있는 경쟁(orderly competition)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">origin</td><td class=\"m\">기원</td></tr><tr><td class=\"w\">contemporary</td><td class=\"m\">현대의</td></tr><tr><td class=\"w\">trace back to</td><td class=\"m\">~으로 거슬러 올라가다</td></tr><tr><td class=\"w\">lay the foundation(s)</td><td class=\"m\">토대를 마련하다</td></tr><tr><td class=\"w\">novel</td><td class=\"m\">새로운, 참신한</td></tr><tr><td class=\"w\">approach</td><td class=\"m\">접근법</td></tr><tr><td class=\"w\">pursue</td><td class=\"m\">추구하다</td></tr><tr><td class=\"w\">rational</td><td class=\"m\">합리적인</td></tr><tr><td class=\"w\">inquiry</td><td class=\"m\">탐구, 연구</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">adversarial</td><td class=\"m\">대립적인</td></tr><tr><td class=\"w\">evaluate</td><td class=\"m\">평가하다</td></tr><tr><td class=\"w\">sphere</td><td class=\"m\">영역</td></tr><tr><td class=\"w\">vie</td><td class=\"m\">경쟁하다</td></tr><tr><td class=\"w\">rhetorical</td><td class=\"m\">수사학적인, 말의</td></tr><tr><td class=\"w\">supremacy</td><td class=\"m\">우위, 패권</td></tr><tr><td class=\"w\">prompt</td><td class=\"m\">촉발하다, 유도하다</td></tr><tr><td class=\"w\">construction</td><td class=\"m\">구성, 구축</td></tr><tr><td class=\"w\">phenomenon</td><td class=\"m\">현상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">현대 서양적 사고의 기원은</span><span class=\"en\"><b>The origins of contemporary Western thought</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거슬러 올라갈 수 있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">can be traced back</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고대 그리스의 전성기로</span><span class=\"en\"><b>to the golden age of ancient Greece,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그때 그리스의 사상가들은 토대를 마련하였다</span><span class=\"en\"><b><span class=\"grammar-hl\">when Greek thinkers laid the foundations</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현대 서양의 정치, 철학, 과학 및 법의</span><span class=\"en\"><b>for modern Western politics, philosophy, science, and law.</b></span></div></div><div class=\"lec-sent-ko\">현대 서양적 사고의 기원은 고대 그리스의 전성기로 거슬러 올라갈 수 있는데, 그때 그리스의 사상가들은 현대 서양의 정치, 철학, 과학 및 법의 토대를 마련하였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 주제를 제시합니다. traced back은 &#39;뒤를 쫓아 거슬러 올라가다&#39;라는 뜻으로, 현대 사상이 갑자기 생긴 것이 아니라 뿌리가 있음을 강조합니다. 또한 laid the foundations는 &#39;토대를 놓다&#39;라는 비유적 표현으로, 이들이 후대 문명의 기틀을 닦았다는 점을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be traced back (수동태): be동사(be)+p.p.(traced) 구조. trace는 타동사인데 목적어가 없어서 수동구조 can be traced 형태로 쓴다. 기본구조: trace A to B (A를 B까지 추적하다/거슬러 올라가다).</div><div class=\"lec-gr-item\">when Greek thinkers laid the foundations (관계부사): when이 선행사(the golden age of ancient Greece)를 수식하며, 뒤에 주어(Greek thinkers)와 동사(laid)가 갖춰진 완전한 절이 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">origin</td><td class=\"m\">기원</td></tr><tr><td class=\"w\">contemporary</td><td class=\"m\">현대의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들의 새로운 접근법은</span><span class=\"en\"><b>Their novel approach</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">합리적인 탐구를 추구하는 것이었는데</span><span class=\"en\"><b>was <span class=\"grammar-hl\">to pursue</span> rational inquiry</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대립 관계의 토의를 통해</span><span class=\"en\"><b>through adversarial discussion:</b></span></div></div><div class=\"lec-sent-ko\">(그들의 새로운 접근법은 대립 관계의 토의를 통해 합리적인 탐구를 추구하는 것이었다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 &#39;그리스 사상&#39;의 핵심 방식을 설명합니다. novel은 사전적으로 &#39;소설&#39;이지만 여기서는 &#39;참신한, 새로운&#39;이라는 뜻입니다. 기존의 권위에 의존하지 않고 토론을 통해 진리를 찾으려는 혁신성을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to pursue (to부정사): 명사적 용법으로 주격 보어(C) 역할을 하며, 앞의 주어(Their novel approach)를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">novel</td><td class=\"m\">새로운, 참신한</td></tr><tr><td class=\"w\">approach</td><td class=\"m\">접근법</td></tr><tr><td class=\"w\">pursue</td><td class=\"m\">추구하다</td></tr><tr><td class=\"w\">rational</td><td class=\"m\">합리적인</td></tr><tr><td class=\"w\">inquiry</td><td class=\"m\">탐구, 연구</td></tr><tr><td class=\"w\">adversarial</td><td class=\"m\">대립적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일련의 생각을 평가하는 가장 좋은 방법은</span><span class=\"en\"><b><span class=\"grammar-hl\">The best way to evaluate one set of ideas</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 결론을 내리기를</span><span class=\"en\"><b>they decided,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 검증하는 것이었다</span><span class=\"en\"><b>was by testing it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 일련의 생각에 대조해서</span><span class=\"en\"><b>against another set of ideas.</b></span></div></div><div class=\"lec-sent-ko\">(일련의 생각을 평가하는 가장 좋은 방법은 그것을 다른 일련의 생각에 대조해서 검증하는 것이라고 그들은 결론을 내렸다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 이전 문장의 &#39;대립적 토론&#39;이라는 접근법이 구체적인 사회 시스템으로 어떻게 구현되었는지 나열합니다. vied for는 &#39;경쟁하다&#39;라는 뜻으로, 단순한 싸움이 아니라 자신의 주장을 논리적으로 입증하려는 지적 경쟁을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The best way to evaluate one set of ideas (to부정사): 형용사적 용법으로 앞의 명사(The best way)를 수식하여 &#39;평가할 최선의 방법&#39;이라는 의미를 만든다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evaluate</td><td class=\"m\">평가하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">정치적 영역에서</span><span class=\"en\"><b>In the political sphere,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 결과는 민주주의였는데</span><span class=\"en\"><b>the result was democracy,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">민주주의에서는 경합하는 정책의 지지자들은</span><span class=\"en\"><b><span class=\"grammar-hl\">in which supporters of rival policies</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수사적인 우위를 차지하려고 다투었다</span><span class=\"en\"><b><span class=\"grammar-hl\">vied</span> for rhetorical supremacy;</b></span></div></div><div class=\"lec-sent-ko\">(정치적 영역에서 그 결과는 민주주의였는데, 민주주의에서는 경합하는 정책의 지지자들은 수사적인 우위를 차지하려고 다투었다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 이전 문장의 &#39;대립적 토론&#39;이라는 접근법이 구체적인 사회 시스템으로 어떻게 구현되었는지 나열합니다. vied for는 &#39;경쟁하다&#39;라는 뜻으로, 단순한 싸움이 아니라 자신의 주장을 논리적으로 입증하려는 지적 경쟁을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in which supporters of rival policies vied (전치사+관계대명사): 전치사(in)+관계대명사(which) 뒤에 주어(supporters of rival policies)와 동사(vied)가 갖춰진 완전한 절이 오는 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sphere</td><td class=\"m\">영역</td></tr><tr><td class=\"w\">vie</td><td class=\"m\">경쟁하다</td></tr><tr><td class=\"w\">rhetorical</td><td class=\"m\">수사학적인, 말의</td></tr><tr><td class=\"w\">supremacy</td><td class=\"m\">우위, 패권</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">철학에서</span><span class=\"en\"><b>in philosophy,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 논리적인 주장과 대화로 이끌었고</span><span class=\"en\"><b>it led to <span class=\"grammar-hl\">reasoned arguments</span> and dialogues</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계의 본질에 대한</span><span class=\"en\"><b>about the nature of the world;</b></span></div></div><div class=\"lec-sent-ko\">(철학에서 그것은 세계의 본질에 대한 논리적인 주장과 대화로 이끌었고,)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reasoned arguments (과거분사): reasoned가 arguments를 수식하며 &#39;이성적인/논리적인 논거&#39;라는 의미를 나타낸다. p.p.+N 구조로 &#39;…된 N&#39;으로 해석된다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">과학에서는</span><span class=\"en\"><b>in science,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 대립하는 이론들의 구축을 자극했으며</span><span class=\"en\"><b>it prompted <span class=\"grammar-hl\">the construction of competing theories</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연 현상을 설명하려고 노력하는</span><span class=\"en\"><b><span class=\"grammar-hl\">to try to explain natural phenomena</span>;</b></span></div></div><div class=\"lec-sent-ko\">(과학에서는 자연 현상을 설명하려고 노력하는 대립하는 이론들의 구축을 자극했으며,)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the construction of competing theories (현재분사): competing이 theories를 수식하며 &#39;경쟁하는/대립하는 이론들&#39;이라는 동작/상태를 나타낸다. -ing+N 구조로 &#39;…하는 N&#39;으로 해석된다.</div><div class=\"lec-gr-item\">to try to explain natural phenomena (to부정사): 부사적 용법(목적)으로 &#39;자연 현상을 설명하기 위해&#39;라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">prompt</td><td class=\"m\">촉발하다, 유도하다</td></tr><tr><td class=\"w\">construction</td><td class=\"m\">구성, 구축</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">법 분야에서</span><span class=\"en\"><b>in the field of law,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 결과는 대립 관계의 법 체계였다.</span><span class=\"en\"><b>the result was <span class=\"grammar-hl\">the adversaria legal system</span>.</b></span></div></div><div class=\"lec-sent-ko\">(법 분야에서 그 결과는 대립 관계의 법 체계였다.)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the adversaria legal system (관용표현): &#39;adversarial legal system(적대적 법 체계/당사자 대립주의)&#39;을 의미하는 용어다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 접근법이 토대인데</span><span class=\"en\"><b>This approach is the foundation</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현대 서양의 생활 방식의</span><span class=\"en\"><b>for <span class=\"grammar-hl\">the modern Western way of life</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 생활 방식에서 정치, 상업, 과학 및 법은</span><span class=\"en\"><b><span class=\"grammar-hl\">in which politics, commerce, science, and law</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모두 뿌리를 두고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are all rooted</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">질서 있는 경쟁에</span><span class=\"en\"><b>in orderly competition.</b></span></div></div><div class=\"lec-sent-ko\">이 접근법이 현대 서양의 생활 방식의 토대인데, 그 생활 방식에서 정치, 상업, 과학 및 법은 모두 질서 있는 경쟁에 뿌리를 두고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 결론 문장입니다. 앞선 예시들을 종합하여 현대 서양 문명이 &#39;질서 있는 경쟁&#39;을 바탕으로 돌아가고 있음을 강조하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the modern Western way of life 5형식(SVOC) 구조: 본문 전체적으로 &#39;make A B&#39;나 &#39;consider A B&#39;와 같은 인과관계가 내포된 문맥을 담고 있으나, 이 문장에서는 &#39;modern Western way of life&#39;가 보어(C) 역할을 하는 명사구로 쓰였다.</div><div class=\"lec-gr-item\">in which politics, commerce, science, and law are all rooted (전치사+관계대명사): 전치사(in)+관계대명사(which) 뒤에 주어(politics, commerce, science, and law)와 동사구(are rooted)가 갖춰진 완전한 절이 오는 구조다.</div><div class=\"lec-gr-item\">are all rooted (수동태): be동사(are)+p.p.(rooted) 구조. root는 타동사인데 목적어가 없어서 수동구조 are rooted 형태로 쓴다. 기본구조: root A in B (A를 B에 뿌리박게 하다/기반을 두게 하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">approach</td><td class=\"m\">접근법</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>현대 서양 문명의 뿌리는 고대 그리스의 합리적이고 대립적인 토론 방식에 있다.</li><li>그리스인들은 아이디어를 검증하기 위해 서로 경쟁시키는 방식을 택했다.</li><li>이러한 &#39;대립적 토론&#39;은 민주주의, 과학적 이론 경쟁, 사법 체계 등 사회 전반의 기반이 되었다.</li><li>오늘날 서양 사회의 정치, 과학, 법 등 모든 영역은 이러한 &#39;질서 있는 경쟁&#39;이라는 전통 위에 서 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Ancient Greek thinkers initiated the method of testing ideas through adversarial debate, and this rational approach became the basis for modern politics, science, and law.</div>\n              <div class=\"lec-final-sum-ko\">고대 그리스 사상가들은 대립적 토론을 통해 아이디어를 검증하는 방식을 시작했으며, 이러한 합리적 접근법은 현대 정치, 과학, 법의 토대가 되었다.</div></div></div>"],"segs":[[{"audio":"./passage4_audio/1.mp3","hl":null}],[{"audio":"./passage4_audio/2.mp3","hl":null}],[{"audio":"./passage4_audio/3.mp3","hl":null},{"audio":"./passage4_audio/4.mp3","hl":"stage-0"},{"audio":"./passage4_audio/5.mp3","hl":"stage-1"},{"audio":"./passage4_audio/6.mp3","hl":"stage-2"},{"audio":"./passage4_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage4_audio/8.mp3","hl":null}],[{"audio":"./passage4_audio/9.mp3","hl":"main"},{"audio":"./passage4_audio/10.mp3","hl":"meaning"},{"audio":"./passage4_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage4_audio/12.mp3","hl":"main"},{"audio":"./passage4_audio/13.mp3","hl":"meaning"},{"audio":"./passage4_audio/14.mp3","hl":"grammar"}],[{"audio":"./passa
