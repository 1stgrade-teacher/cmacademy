</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"구문사고력 v-ing v-ed review reading03","audioDir":"03_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.468em\">v-ing/v-ed\u003cbr>review\u003cbr>reading03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Extreme Makeover: Free Surgery for TV Exposure\u003c/h1>\u003ch2>Extreme Makeover, TV 공개를 조건으로 한 무료 성형수술\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Extreme Makeover는 성형수술비가 없는 사람들이 수술 과정의 \u003cb class=\"key\">TV \u003c/b>\u003cb class=\"key\">방영\u003c/b>을 허락하면 무료로 수술을 받게 해 주는 미국의 리얼리티 프로그램이다. Jennifer의 사례처럼 \u003cb class=\"key\">미운 \u003c/b>\u003cb class=\"key\">오리새끼\u003c/b>가 아름다운 공주로 변하는 과정이 방영되며, 이 프로그램은 \u003cb class=\"key\">엄청난 \u003c/b>\u003cb class=\"key\">성공\u003c/b>을 거두어 해마다 수천 명이 \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">완전 \u003c/b>\u003cb class=\"key\">변신\u003c/b>을 위해 신청한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Extreme Makeover is a successful American TV show that gives people free cosmetic surgery if they allow their operations to be shown on television.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 성형수술 과정을 TV에 공개하는 미국의 리얼리티 프로그램 Extreme Makeover에 관한 지문을 함께 읽어 볼게요. 이 글은 Jennifer가 자신의 성형수술 과정이 방영되는 것을 부끄러워하지 않았던 사례에서 시작해 프로그램의 방식과 성공을 설명하고 있어요. 핵심은 수술비가 없는 사람이 수술 과정의 방영을 허락하면 무료로 성형수술을 받을 수 있다는 점이고, 요지는 Extreme Makeover가 TV 공개를 조건으로 무료 성형수술을 제공하며 큰 성공을 거둔 프로그램이라는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">성형수술\u003c/b>은 cosmetic surgery라고 하며, 외모를 바꾸기 위해 의도적으로 수술을 받는 일을 뜻해요. 이런 수술은 비용이 매우 비싸서 모든 사람이 쉽게 선택하기 어렵고, 그래서 \u003cb class=\"key\">비용 \u003c/b>\u003cb class=\"key\">부담\u003c/b>이 큰 결정이 됩니다. TV가 사람들의 일상을 보여 주는 \u003cb class=\"key\">리얼리티 \u003c/b>\u003cb class=\"key\">프로그램\u003c/b> reality show를 만들면서, 수술 과정 자체가 방송의 흥미로운 소재가 되기도 했어요. Extreme Makeover는 출연자가 수술 과정을 \u003cb class=\"key\">공개\u003c/b>하는 대신 무료 수술을 받는 방식으로 이 두 가지를 결합한 프로그램입니다. 이는 마치 맛집 홍보를 위해 내 요리 과정을 촬영하는 대신 식재료를 지원받는 것과 비슷해요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 성형수술은 영어로 cosmetic surgery라고 하고, 외모를 바꾸기 위해 선택하는 수술을 뜻해요. 이런 수술은 비용이 매우 비싸서 모든 사람이 쉽게 결정하기 어렵고, 그래서 비용 부담이 큰 선택이 됩니다. TV가 사람들의 일상을 보여 주는 리얼리티 프로그램을 만들면서 수술 과정 자체가 방송의 흥미로운 소재가 되기도 했어요. Extreme Makeover는 출연자가 수술 과정을 공개하는 대신 무료 수술을 받는 방식으로 이 두 가지를 결합한 프로그램이에요. 이는 맛집 홍보를 위해 내 요리 과정을 촬영하는 대신 식재료를 지원받는 것과 비슷하다고 생각하면 이해하기 쉬워요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>Jennifer의 선택\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>Jennifer는 자신의 \u003cb class=\"key\">성형수술\u003c/b> 과정이 세상에 방영되는 게 부끄럽지 않았다. 그래서 방송국과의 계약서에 기꺼이 서명했고, \u003cb class=\"key\">의사들\u003c/b>이 시술하는 모든 동작을 카메라가 녹화했다. 그녀는 코와 눈, 뺨, 가슴, 치아 수술을 받았다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>방영과 반응\u003csmall>예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>수술 모습이 마침내 TV에서 방영되었을 때, \u003cb class=\"key\">수백만 \u003c/b>\u003cb class=\"key\">명\u003c/b>이 미운 오리새끼가 아름다운 공주가 되는 것을 보고 흥미를 느꼈다. 이 장면은 모두 Extreme Makeover라는 미국의 새 TV 프로그램의 \u003cb class=\"key\">일부\u003c/b>였다. 즉 Jennifer의 사례는 프로그램의 대표적인 \u003cb class=\"key\">변신\u003c/b> 장면으로 제시된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>프로그램의 방식\u003csmall>설명 · 문장 6\u003c/small>\u003c/h4>\u003cp>Extreme Makeover는 비용이 많이 드는 \u003cb class=\"key\">성형수술\u003c/b>을 할 만한 돈이 없는 사람들에게 기회를 준다. 이들은 수술 모습의 \u003cb class=\"key\">TV \u003c/b>\u003cb class=\"key\">방영\u003c/b>을 허락할 경우 수술을 무료로 받을 수 있다. 즉 시청자에게는 극적인 변신을 보여 주고, 출연자에게는 \u003cb class=\"key\">비용 \u003c/b>\u003cb class=\"key\">부담\u003c/b>을 덜어 주는 방식이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>성공과 신청\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>2002년에 시작된 이후 이 프로그램은 \u003cb class=\"key\">엄청난 \u003c/b>\u003cb class=\"key\">성공\u003c/b>을 거두었다. 해마다 수천 명이 신청을 하고, 자신의 \u003cb class=\"key\">완전 \u003c/b>\u003cb class=\"key\">변신\u003c/b>을 위해 선택받고 싶어 한다. 결국 무료 수술과 방영이라는 조건이 많은 사람의 관심을 끌며 프로그램의 인기를 이어 가고 있다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 Jennifer의 선택, 방영과 반응, 프로그램의 방식, 성공과 신청이라는 네 단계로 나누어 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 Jennifer가 자신의 성형수술 과정이 세상에 방영되는 것을 부끄러워하지 않는 장면이 나와요. 그래서 그녀는 방송국과의 계약서에 기꺼이 서명하고, 의사들이 시술하는 모든 동작을 카메라가 녹화하죠. 이어서 코와 눈, 뺨, 가슴, 치아 수술을 받았다는 내용이 제시됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 수술 모습이 마침내 TV에서 방영되었을 때 수백만 명이 미운 오리새끼가 아름다운 공주가 되는 것을 보고 흥미를 느꼈다는 반응이 나옵니다. 이 장면은 모두 Extreme Makeover라는 미국의 새 TV 프로그램의 일부였다고 설명해요. 즉 Jennifer의 사례는 프로그램의 대표적인 변신 장면으로 제시되는 거죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 프로그램의 구체적인 방식이 설명됩니다. Extreme Makeover는 비용이 많이 드는 성형수술을 할 만한 돈이 없는 사람들에게 기회를 주는데, 이들은 수술 모습의 TV 방영을 허락할 경우 수술을 무료로 받을 수 있어요. 결국 시청자에게는 극적인 변신을 보여 주고 출연자에게는 비용 부담을 덜어 주는 방식인 거죠.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 프로그램의 성과와 인기가 이어집니다. 이천이 년에 시작된 이후 이 프로그램은 엄청난 성공을 거두었고, 해마다 수천 명이 신청을 해요. 많은 사람이 자신의 완전 변신을 위해 선택받고 싶어 한다는 점이 프로그램의 인기를 보여 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 구체적 사례를 먼저 보여 주는 \u003cb class=\"key\">예시\u003c/b> 구조이다. Jennifer의 사례가 앞부분을 차지하고, 다섯 번째 문장에서 프로그램 이름이, 여섯 번째 문장에서 핵심 방식이 제시된다. 그래서 주제문이 후반부에 놓이는 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있다. 사례가 이후 설명을 위한 \u003cb class=\"key\">도입\u003c/b> 역할을 한다는 점이 이 구조의 핵심이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Therefore (2)\u003c/b>\u003cspan>인과·결론\u003c/span>\u003cb>When (4)\u003c/b>\u003cspan>시간·계기\u003c/span>\u003cb>It's all part of (5)\u003c/b>\u003cspan>일반화·전환\u003c/span>\u003cb>if (6)\u003c/b>\u003cspan>조건\u003c/span>\u003cb>Since (7)\u003c/b>\u003cspan>시간·이유\u003c/span>\u003cb>Each year (8)\u003c/b>\u003cspan>빈도·반복\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">shown to the world\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">recorded every move\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">shown on TV\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">shown on television\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>일반 성형수술\u003c/th>\u003cth>Extreme Makeover 출연\u003c/th>\u003c/tr>\u003ctr>\u003ctd>수술비를 직접 부담\u003c/td>\u003ctd>방영을 허락하면 무료\u003c/td>\u003c/tr>\u003ctr>\u003ctd>수술 과정이 비공개\u003c/td>\u003ctd>수술 과정이 TV에 공개\u003c/td>\u003c/tr>\u003ctr>\u003ctd>개인적 선택\u003c/td>\u003ctd>방송 계약과 출연 필요\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 예시를 먼저 보여 준 뒤 일반적인 설명으로 넘어가는 예시 구조예요. Jennifer라는 구체적인 사례가 앞부분을 차지하고, 다섯 번째 문장에서 Extreme Makeover라는 프로그램 이름이 드러나며, 여섯 번째 문장에서 핵심 방식이 정리됩니다. 그래서 주제문은 글의 후반부에 놓이는 미괄식으로 볼 수 있어요. 이 사례는 독자의 흥미를 끄는 도입 역할을 한 뒤 프로그램의 조건과 성공이라는 일반 내용으로 자연스럽게 이어 줍니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 두 번째 문장의 Therefore는 Jennifer의 태도가 계약으로 이어지는 인과와 결론을 보여 줍니다. 네 번째 문장의 When은 방영 시점을, 여섯 번째 문장의 if는 무료 수술의 조건을 분명히 해 주고, 일곱 번째 문장의 Since와 여덟 번째 문장의 Each year는 시작 이후의 시간과 반복되는 신청 흐름을 드러내요. 또 shown to the world, recorded every move, shown on TV, shown on television처럼 수술 장면이 공개된다는 개념이 여러 표현으로 바뀌어 반복됩니다. 이렇게 사례를 일반화하는 전환과 조건의 신호를 잡으면 글의 구조가 또렷해져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>be embarrassed about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 부끄러워하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cosmetic sur /span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">film\u003c/span>\u003cspan class=\"s\">capture\u003c/span>\u003cspan class=\"s\">tape\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">erase\u003c/span>\u003cspan class=\"a\">delete\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">allow\u003c/b>\u003cspan class=\"m\">허락하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">permit\u003c/span>\u003cspan class=\"s\">let\u003c/span>\u003cspan class=\"s\">authorize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forbid\u003c/span>\u003cspan class=\"a\">ban\u003c/span>\u003cspan class=\"a\">prohibit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expensive\u003c/b>\u003cspan class=\"m\">비용이 많이 드는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">costly\u003c/span>\u003cspan class=\"s\">pricey\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cheap\u003c/span>\u003cspan class=\"a\">inexpensive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">finally\u003c/b>\u003cspan class=\"m\">마침내\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eventually\u003c/span>\u003cspan class=\"s\">ultimately\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">initially\u003c/span>\u003cspan class=\"a\">at first\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">successful\u003c/b>\u003cspan class=\"m\">성공적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prosperous\u003c/span>\u003cspan class=\"s\">triumphant\u003c/span>\u003cspan class=\"s\">fruitful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unsuccessful\u003c/span>\u003cspan class=\"a\">failed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">choose\u003c/b>\u003cspan class=\"m\">선택하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">select\u003c/span>\u003cspan class=\"s\">pick\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. show는 broadcast, display와 가깝고 hide, conceal과 반대됩니다. record는 film, capture와 비슷하고 erase, delete와 반대이며, allow는 permit, let과 가깝지만 forbid, ban과는 반대예요. expensive는 costly, pricey와 가깝고 cheap, inexpensive와 반대이고, successful은 prosperous, triumphant와 가까우며 unsuccessful, failed와 반대됩니다. 마지막으로 choose는 select, pick과 비슷하고 reject, exclude와 반대된다는 점을 기억하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jennifer는 부끄럽지 않았다\u003c/span>\u003cspan class=\"en\">Jennifer \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">embarrassed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 성형수술이 …되는 것에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">about\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">cosmetic \u003c/span>\u003cspan class=\"tgt\">surgery \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상에 방영되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">shown \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Jennifer는 자신의 성형수술 과정이 세상에 방영되는 게 부끄럽지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Jennifer가 자기 성형수술 장면이 방송되는 것을 \u003cb class=\"key\">부끄러워하지 \u003c/b>\u003cb class=\"key\">않았다\u003c/b>는 뜻이에요. 그래서 바로 다음 문장에서 방송 계약에 서명하는 행동으로 자연스럽게 이어지죠. 핵심은 \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">형용사 \u003c/b>\u003cb class=\"key\">+ \u003c/b>\u003cb class=\"key\">about \u003c/b>\u003cb class=\"key\">+ \u003c/b>\u003cb class=\"key\">동명사\u003c/b> 구문과 have + 목적어 + 과거분사 구조예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정 형용사 + 전치사 about + 동명사(구)\u003c/span> : be [감정 형용사] + about + [동명사(구)] : \"~에 대해 부끄러워하지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">have + 목적어 + 과거분사(수동 의미)\u003c/span> : have + [목적어] + [과거분사] : \"자신의 성형수술이 세상에 방영되게 하다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Jennifer was not embarrassed, Jennifer는 부끄럽지 않았다. about having her cosmetic surgery, 자신의 성형수술이 …되는 것에 대해. shown to the world, 세상에 방영되는. 이 문장 전체를 해석하면, Jennifer는 자신의 성형수술 과정이 세상에 방영되는 게 부끄럽지 않았다.","hl":"m"},{"n":13,"text":"이 문장은 Jennifer가 자신의 성형수술 장면이 방송되는 것을 부끄러워하지 않았다는 뜻이에요. 그래서 다음 문장에서 방송 계약을 맺는 행동으로 자연스럽게 이어지죠. 핵심은 감정 형용사 뒤에 about과 동명사가 온다는 구조예요.","hl":"mn"},{"n":14,"text":"어법 포인트 두 개만 짚을게요. 먼저 감정 형용사 embarrassed 뒤에는 전치사 about이 오고, 전치사 뒤에는 동명사가 와요. 두 번째로 have 다음에 목적어, 그다음에 과거분사가 오는 구조인데, 수술과 show가 수동 관계라서 과거분사 shown을 쓴 거예요. 현재분사와 헷갈리지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그녀는 기꺼이 방송국과의 계약서에 서명했다,\u003c/span>\u003cspan class=\"en\">Therefore, she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">happily \u003c/span>\u003cspan class=\"tgt\">signed \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">TV \u003c/span>\u003cspan class=\"tgt\">contract\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 카메라가 모든 동작을 녹화했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">cameras \u003c/span>\u003cspan class=\"tgt\">recorded \u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">move\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사들이 그녀를 시술할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">surgeons \u003c/span>\u003cspan class=\"tgt\">operated \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">her\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 방송국과의 계약서에 기꺼이 서명했고, 의사들이 시술하는 모든 동작을 카메라가 녹화했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Jennifer가 계약서에 서명하자 카메라가 수술 장면을 모두 녹화했다는 뜻이에요. \u003cb class=\"key\">Therefore\u003c/b>가 앞 문장의 결과를 이어 주고, \u003cb class=\"key\">as\u003c/b>가 녹화와 시술이 같은 시간에 일어난 일임을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양태 부사의 위치(일반동사 앞)\u003c/span> : [부사] + [동사] + [목적어] : \"기꺼이 계약서에 서명했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and로 두 절 연결\u003c/span> : [절] + , and + [절] : \"그리고 카메라가 모든 동작을 녹화했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 as (시간: ~할 때)\u003c/span> : as + [주어] + [동사] + [전치사 + 목적어] : \"의사들이 그녀를 시술할 때\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Therefore, she happily signed a TV contract, 그래서 그녀는 기꺼이 방송국과의 계약서에 서명했다. and cameras recorded every move, 그리고 카메라가 모든 동작을 녹화했다. as surgeons operated on her, 의사들이 그녀를 시술할 때. 이 문장 전체를 해석하면, 그래서 방송국과의 계약서에 기꺼이 서명했고, 의사들이 시술하는 모든 동작을 카메라가 녹화했다.","hl":"m"},{"n":16,"text":"이 문장은 Jennifer가 계약서에 서명하자 카메라가 수술 장면을 모두 녹화했다는 뜻이에요. Therefore가 앞 문장의 결과를 이어 주고, as가 녹화와 시술이 동시에 일어난 일임을 보여 줘요.","hl":"mn"},{"n":17,"text":"어법은 세 가지예요. 먼저 happily 같은 부사는 일반동사 앞에 놓여서 동작의 태도를 나타내요. 두 번째로 and가 두 절을 병렬로 이어 주고 있죠. 세 번째로 as는 여기서 ~할 때라는 시간의 접속사로 쓰였어요. 그리고 operate는 자동사라서 뒤에 전치사 on을 꼭 붙여서 operated on her라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jennifer는 수술을 받았다\u003c/span>\u003cspan class=\"en\">Jennifer \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">operations \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코와 눈, 뺨, 가슴, 치아에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">nose, \u003c/span>\u003cspan class=\"tgt\">eyes, \u003c/span>\u003cspan class=\"tgt\">cheeks, \u003c/span>\u003cspan class=\"tgt\">breasts \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">teeth\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Jennifer는 코와 눈, 뺨, 가슴, 치아 수술을 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Jennifer가 코, 눈, 뺨, 가슴, 치아까지 여러 부위를 수술받았다는 구체적인 정보를 전해요. had operations on을 '수술을 받다'로 익혀 두면 \u003cb class=\"key\">동작성 \u003c/b>\u003cb class=\"key\">명사\u003c/b> 표현이 자연스러워져요. 앞 문장의 시술 장면이 실제로 어느 부위에서 이루어졌는지 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have + 동작명사 + on (~에 수술을 받다)\u003c/span> : have + [동작명사] + on + [신체 부위] : \"~에 수술을 받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조(명사 열거)\u003c/span> : [명사], [명사], [명사], [명사] and [명사] : \"코와 눈, 뺨, 가슴, 치아\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Jennifer had operations, Jennifer는 수술을 받았다. on her nose, eyes, cheeks, breasts and teeth, 코와 눈, 뺨, 가슴, 치아에. 이 문장 전체를 해석하면, Jennifer는 코와 눈, 뺨, 가슴, 치아 수술을 받았다.","hl":"m"},{"n":19,"text":"이 문장은 Jennifer가 코, 눈, 뺨, 가슴, 치아까지 여러 부위를 수술받았다는 구체적인 정보를 전해요. had operations on을 수술을 받다로 이해하면 동작성 명사 표현이 자연스러워요.","hl":"mn"},{"n":20,"text":"어법 포인트는 두 가지예요. have는 동작명사와 결합해서 그 행동을 한다는 뜻을 만들어요. had operations on이라고 하면 수술을 받았다가 되죠. 그리고 신체 부위를 콤마로 나열하고 마지막에 and로 연결하는 병렬 구조도 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수술 모습이 마침내 TV에서 방영되었을 때,\u003c/span>\u003cspan class=\"en\">When the operation \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">finally \u003c/span>\u003cspan class=\"tgt\">shown\u003c/span> on TV,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수백만 명의 사람들이\u003c/span>\u003cspan class=\"en\">millions of people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흥미를 느꼈다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">excited \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미운 오리새끼가 ...하는 것을 보는 것에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">ugly \u003c/span>\u003cspan class=\"tgt\">duckling \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아름다운 공주가 되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">become \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">beautiful \u003c/span>\u003cspan class=\"tgt\">princess\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수술 모습이 마침내 TV에서 방영되었을 때, 미운 오리새끼가 아름다운 공주가 되는 것을 보고 수백만 명이 흥미를 느꼈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 수술 장면이 TV에 방영된 뒤 대중의 뜨거운 반응을 보여 줍니다. 핵심 비유는 \u003cb class=\"key\">미운 \u003c/b>\u003cb class=\"key\">오리새끼\u003c/b>가 \u003cb class=\"key\">아름다운 \u003c/b>\u003cb class=\"key\">공주\u003c/b>로 변하는 모습이고, 이것이 성형수술 전후의 극적인 변화를 뜻해요. 글 전체에서 이 프로그램이 왜 인기를 끌었는지 알려 주는 \u003cb class=\"key\">근거\u003c/b> 역할을 하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : the operation + [[was]] + [[shown]] (be동사 + 과거분사) : \"마침내 방영되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(감정의 원인)\u003c/span> : be [[excited]] + [[to see]] (~해서 흥미를 느끼다) : \"보고 흥미를 느꼈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지각동사 + 목적어 + 원형부정사\u003c/span> : see + [[목적어]] + [[동사원형]](become) : \"미운 오리새끼가 아름다운 공주가 되는 것을 보다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"When the operation was finally shown on TV, 수술 모습이 마침내 TV에서 방영되었을 때. millions of people, 수백만 명의 사람들이. were excited, 흥미를 느꼈다. to see an ugly duckling, 미운 오리새끼가 ...하는 것을 보는 것에. become a beautiful princess, 아름다운 공주가 되는. 이 문장 전체를 해석하면, 수술 모습이 마침내 TV에서 방영되었을 때, 미운 오리새끼가 아름다운 공주가 되는 것을 보고 수백만 명이 흥미를 느꼈다.","hl":"m"},{"n":22,"text":"이 문장은 수술 장면이 방영된 다음에 사람들이 얼마나 열광했는지를 보여 줘요. 미운 오리새끼가 아름다운 공주로 변한다는 비유는 성형수술 전후의 극적인 변화를 가리키는 거죠. 그래서 이 문장은 이 프로그램이 인기를 끌 수밖에 없는 근거를 대중의 반응으로 보여 주는 역할을 합니다.","hl":"mn"},{"n":23,"text":"먼저 was finally shown을 보세요. 주어인 the operation이 방영되는 대상이니까 수동태로 쓴 거예요. 두 번째로 were excited to see에서 to부정사는 흥미를 느낀 원인을 설명해 줍니다. 세 번째로 see an ugly duckling become a beautiful princess에서 become은 동사원형인데, 지각동사 see 뒤에서 목적격보어로 원형부정사가 온 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 모두 일부이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's\u003c/span> all part\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국의 새 TV 프로그램의\u003c/span>\u003cspan class=\"en\">of a new American television show\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“Extreme Makeover”라고 불리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">Extreme \u003c/span>\u003cspan class=\"tgt\">Makeover\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 모두 “Extreme Makeover”라는 미국의 새 TV 프로그램의 일부이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 제니퍼의 이야기가 사실 한 TV 프로그램의 기획이라는 사실을 밝혀 줍니다. \u003cb class=\"key\">Extreme \u003c/b>\u003cb class=\"key\">Makeover\u003c/b>라는 프로그램 이름을 처음 꺼내면서 글의 \u003cb class=\"key\">화제\u003c/b>를 새로 여는 역할을 하죠. 그래서 앞 문장과 뒤 문장을 이어 주는 연결 지점입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 It\u003c/span> : [[It]] + is + 명사 (~은 ...이다) : \"그것은 (모두) ...이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(후치수식)\u003c/span> : a television show + [[called]] + 이름 (명사 + 과거분사구) : \"“Extreme Makeover”라고 불리는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"It's all part, 그것은 모두 일부이다. of a new American television show, 미국의 새 TV 프로그램의. called Extreme Makeover, “Extreme Makeover”라고 불리는. 이 문장 전체를 해석하면, 이는 모두 “Extreme Makeover”라는 미국의 새 TV 프로그램의 일부이다.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 말한 제니퍼의 이야기가 사실은 한 TV 프로그램의 기획이라는 걸 밝혀 주는 문장이에요. Extreme Makeover라는 프로그램 이름을 처음 꺼내면서 글의 화제를 새로 여는 역할을 하죠. 그래서 앞 내용과 뒤 내용을 이어 주는 연결 지점이라고 보면 됩니다.","hl":"mn"},{"n":26,"text":"먼저 It's의 It은 앞 문장 내용 전체를 가리키는 지시대명사예요. 그래서 '그 모든 것이 ~의 일부다'로 해석합니다. 다음으로 called Extreme Makeover에서 called는 과거분사로, 앞의 a new American television show를 뒤에서 꾸며 주는 후치수식이에요. 'Extreme Makeover라고 불리는'이라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이\u003c/span>\u003cspan class=\"en\">People\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">값비싼 성형수술을 할 만한 충분한 돈이 없는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003cspan class=\"tgt\">money \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">expensive \u003c/span>\u003cspan class=\"tgt\">cosmetic \u003c/span>\u003cspan class=\"tgt\">surgery\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무료로 수술을 받을 수 있다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">done \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">free\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그들이 수술 모습의 TV 방영을 허락할 경우\u003c/span>\u003cspan class=\"en\">if they \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">allow \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">operations \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">shown \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">television\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비용이 많이 드는 성형수술을 할 만한 돈이 없는 사람들이 수술모습의 TV 방영을 허락할 경우 무료로 수술을 받을 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이 프로그램이 어떤 사람들을 대상으로 하는지 알려 줍니다. 돈이 없어 성형수술을 못 하는 사람도 \u003cb class=\"key\">방영\u003c/b>을 허락하면 무료로 수술을 받을 수 있다는 \u003cb class=\"key\">조건\u003c/b>을 제시하고 있어요. 결국 방영권과 수술을 맞바꾸는 프로그램의 \u003cb class=\"key\">거래\u003c/b> 구조를 한 문장으로 보여 주는 부분입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [[선행사]] People + who + [[동사]] don't have : \"값비싼 성형수술을 할 만한 충분한 돈이 없는 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">get + 목적어 + 과거분사(수동의 의미)\u003c/span> : get + [[목적어]] it + [[과거분사]] done : \"무료로 수술을 받을 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">allow + 목적어 + to부정사(수동)\u003c/span> : allow + [[목적어]] + [[to be shown]] : \"수술이 TV에 방영되도록 허락하다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"People, 사람들이. who don't have enough money for expensive cosmetic surgery, 값비싼 성형수술을 할 만한 충분한 돈이 없는. can get it done for free, 무료로 수술을 받을 수 있다. if they allow the operations to be shown on television, 만약 그들이 수술 모습의 TV 방영을 허락할 경우. 이 문장 전체를 해석하면, 비용이 많이 드는 성형수술을 할 만한 돈이 없는 사람들이 수술모습의 TV 방영을 허락할 경우 무료로 수술을 받을 수 있다.","hl":"m"},{"n":28,"text":"이 문장은 이 프로그램이 어떤 사람들을 대상으로 하는지 알려 줘요. 돈이 없어서 성형수술을 못 하는 사람도 방영을 허락하면 무료로 수술을 받을 수 있다는 조건을 제시하고 있죠. 결국 방영권과 수술을 맞바꾸는 프로그램의 거래 구조를 한 문장으로 보여 주는 부분입니다.","hl":"mn"},{"n":29,"text":"먼저 who don't have enough money for expensive cosmetic surgery에서 who는 앞의 People을 받는 주격 관계대명사예요. 관계사절 전체가 선행사 People을 꾸며 준다고 보면 됩니다. 두 번째로 can get it done for free는 get 다음에 목적어와 과거분사가 와서 '수술을 받다'라는 수동의 의미를 만드는 형태예요. 세 번째로 allow the operations to be shown on television에서 allow는 목적어 뒤에 to부정사를 데려오고, 수술은 방영되는 대상이라서 to be shown이라는 수동 부정사가 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2002년에 시작된 이후로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Since \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">2002\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 프로그램은\u003c/span>\u003cspan class=\"en\">the show\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄청난 성공을 거둔 것으로 입증되어 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">proven \u003c/span>\u003cspan class=\"tgt\">hugely \u003c/span>\u003cspan class=\"tgt\">successful\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">2002년에 시작된 이후 이 프로그램은 엄청난 성공을 거두었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 프로그램이 2002년에 시작된 이후 \u003cb class=\"key\">엄청난 \u003c/b>\u003cb class=\"key\">성공\u003c/b>을 거두었다는 점을 말해요. 앞에서 소개한 Extreme Makeover가 시청자에게 \u003cb class=\"key\">호응\u003c/b>을 얻었음을 보여 주고, 뒤에서 수천 명이 지원한다는 내용의 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 since(~이후로)\u003c/span> : [[Since]] + [주어 + 동사] , [주절] : \"2002년에 시작된 이후로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료와 prove의 연결동사 용법\u003c/span> : have/has + [[과거분사]] + [주격보어] : \"엄청난 성공을 거둔 것으로 입증되어 왔다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Since it began in 2002, 2002년에 시작된 이후로. the show, 이 프로그램은. has proven hugely successful, 엄청난 성공을 거둔 것으로 입증되어 왔다. 이 문장 전체를 해석하면, 2002년에 시작된 이후 이 프로그램은 엄청난 성공을 거두었다.","hl":"m"},{"n":31,"text":"이 문장은 프로그램이 시작된 뒤 엄청난 성공을 거두었다는 점을 말해요. 앞에서 소개한 Extreme Makeover가 시청자에게 호응을 얻었음을 보여 주고, 뒤에 수천 명이 지원한다는 내용의 근거가 됩니다.","hl":"mn"},{"n":32,"text":"첫 번째로 Since는 과거의 시작점을 나타내는 접속사예요. 뒤에는 완전한 절이 오고, 주절의 현재완료와 함께 그 시점부터 지금까지의 계속을 보여 줍니다. 두 번째로 has proven은 have나 has에 과거분사가 붙은 현재완료예요. since절이 시작점을 주니까 지금까지 입증되어 왔다는 계속을 나타내고, prove는 여기서 입증되다라는 뜻의 연결동사로 쓰여 hugely successful이 주격보어가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해마다\u003c/span>\u003cspan class=\"en\">Each year\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수천 명이\u003c/span>\u003cspan class=\"en\">thousands of people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신청을 하고,\u003c/span>\u003cspan class=\"en\">write in,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선택받기를 바라면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hoping\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">chosen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 완전 변신을 위해\u003c/span>\u003cspan class=\"en\">for their own extreme makeover.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">해마다 수천 명이 신청을 하고, 자신의 완전 변신을 위해 선택받고 싶어 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 해마다 수천 명이 프로그램에 \u003cb class=\"key\">지원\u003c/b>한다는 사실을 전해요. 앞 문장의 \u003cb class=\"key\">엄청난 \u003c/b>\u003cb class=\"key\">성공\u003c/b>을 구체적인 지원자 수로 뒷받침하며, 사람들이 무료 성형을 위해 \u003cb class=\"key\">선택받기\u003c/b>를 바란다는 흐름을 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사(부대상황)\u003c/span> : [주절], [[현재분사]] ~ : \"바라면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 수동태\u003c/span> : to be + [[과거분사]] : \"선택받기를\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Each year, 해마다. thousands of people, 수천 명이. write in, 신청을 하고. hoping to be chosen, 선택받기를 바라면서. for their own extreme makeover, 자신의 완전 변신을 위해. 이 문장 전체를 해석하면, 해마다 수천 명이 신청을 하고, 자신의 완전 변신을 위해 선택받고 싶어 한다.","hl":"m"},{"n":34,"text":"이 문장은 해마다 수천 명이 프로그램에 지원한다는 사실을 전해요. 앞 문장의 엄청난 성공을 구체적인 지원자 수로 뒷받침하고, 사람들이 무료 성형을 위해 선택받기를 바란다는 흐름을 이어 줘요.","hl":"mn"},{"n":35,"text":"첫 번째로 hoping은 주어 thousands of people과 능동 관계를 이루면서 바라면서라는 부대상황을 나타내는 현재분사예요. 그래서 앞 절의 동작과 함께 일어나는 심리 상태를 덧붙여 줍니다. 두 번째로 to be chosen은 hope의 목적어로 쓰인 to부정사가 수동태가 된 형태예요. people이 선택받는 대상이기 때문에 to be에 과거분사가 붙어 선택받기를 바라다는 목적어의 의미를 전달합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Jennifer는 자신의 성형수술 과정이 세상에 방영되는 것을 \u003cb class=\"key\">부끄러워하지 \u003c/b>\u003cb class=\"key\">않았다\u003c/b>.\u003c/li>\u003cli>방송국 계약 후 카메라가 의사들의 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">동작\u003c/b>을 녹화했고, 방영 때 수백만 명이 \u003cb class=\"key\">미운 \u003c/b>\u003cb class=\"key\">오리새끼\u003c/b>의 변신에 흥미를 느꼈다.\u003c/li>\u003cli>Extreme Makeover는 수술비가 없는 사람이 \u003cb class=\"key\">TV \u003c/b>\u003cb class=\"key\">방영\u003c/b>을 허락하면 무료로 수술을 받게 하는 프로그램이다.\u003c/li>\u003cli>2002년 시작 이후 \u003cb class=\"key\">엄청난 \u003c/b>\u003cb class=\"key\">성공\u003c/b>을 거두어 해마다 수천 명이 \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">완전 \u003c/b>\u003cb class=\"key\">변신\u003c/b>을 위해 신청한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Extreme Makeover is a successful American TV show that gives people free cosmetic surgery if they allow their operations to be shown on television.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Extreme Makeover는 성형수술비가 없는 사람들이 수술 과정의 \u003cb class=\"key\">TV \u003c/b>\u003cb class=\"key\">방영\u003c/b>을 허락하면 무료로 수술을 받게 해 주는 미국의 리얼리티 프로그램이다. Jennifer의 사례처럼 \u003cb class=\"key\">미운 \u003c/b>\u003cb class=\"key\">오리새끼\u003c/b>가 아름다운 공주로 변하는 과정이 방영되며, 이 프로그램은 \u003cb class=\"key\">엄청난 \u003c/b>\u003cb class=\"key\">성공\u003c/b>을 거두어 해마다 수천 명이 \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">완전 \u003c/b>\u003cb class=\"key\">변신\u003c/b>을 위해 신청한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"정리해 볼게요. Extreme Makeover는 수술비가 없는 사람이 수술 과정의 TV 방영을 허락하면 무료로 성형수술을 받게 해 주는 프로그램이에요. Jennifer의 사례는 미운 오리새끼가 아름다운 공주로 변하는 극적인 장면을 보여 주며 시청자의 관심을 끌었고, 프로그램은 엄청난 성공을 거두었습니다. 오늘 배운 사례와 일반화의 흐름, 그리고 조건의 신호어를 다른 지문에도 적용해 보세요. 수고했어요.","hl":null}]}]});</script></body></html>
