<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구문사고력 13강 reading01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"구문사고력 13강 reading01","audioDir":"passage1_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">13강\u003cbr>reading01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>The Vanishing International Museum\u003c/h1>\u003ch2>사라져 가는 국제적 박물관\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>전 세계의 보물을 보여 주며 세계 역사를 접하게 하던 국제적 박물관들이, 문화적으로 풍요로운 나라들의 \u003cb class=\"key\">문화재 \u003c/b>\u003cb class=\"key\">반환 \u003c/b>\u003cb class=\"key\">요구\u003c/b> 때문에 \u003cb class=\"key\">국내적 \u003c/b>\u003cb class=\"key\">범위\u003c/b>로 좁아질 위기에 처해 있다. 그렇게 되면 사람들은 다른 나라의 문화를 배울 좋은 \u003cb class=\"key\">기회\u003c/b>를 빼앗기게 된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>International museums may be forced to return foreign treasures and display only their own national treasures, which will deprive people everywhere of a great opportunity to learn about other countries' cultures.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 박물관, 그중에서도 여러 나라의 보물을 함께 전시하는 국제적 박물관의 미래에 관한 글이에요. 글의 핵심은 간단해요. 전 세계의 문화재를 보여 주며 세계 역사를 가르치던 박물관들이 문화재 반환 요구 때문에 자국 중심으로 바뀌고 있다는 것이죠. 요지는 결국 이런 변화가 다른 나라의 문화를 배울 소중한 기회를 빼앗는다는 거예요. 자, 그럼 한 문장씩 들어가 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">박물관은 원래 여러 나라의 유물을 한자리에 모아 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">역사\u003c/b>를 보여 주는 공간이에요. 런던의 대영 박물관(British Museum)처럼 오래된 박물관에는 다른 나라에서 모아 온 문화재가 아주 많아요. 그런데 최근에는 이집트, 그리스, 한국처럼 문화적으로 풍요로운 나라들이 자국의 문화재를 돌려달라고 요구하고 있어요. 이런 요구를 \u003cb class=\"key\">문화재 \u003c/b>\u003cb class=\"key\">반환\u003c/b>(repatriation)이라고 불러요. 마치 친구가 빌려 간 내 물건을 돌려달라고 말하는 상황과 비슷하죠. 문제는 한 번 돌려주기 시작하면 여러 나라의 유물을 함께 전시하던 박물관이 \u003cb class=\"key\">자국 \u003c/b>\u003cb class=\"key\">중심\u003c/b>으로만 바뀔 수 있다는 점이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 박물관은 원래 여러 나라의 유물을 모아 세계 역사를 보여 주는 공간이에요. 런던의 British Museum 같은 오래된 박물관에는 다른 나라의 문화재가 아주 많이 있죠. 그런데 최근에는 이집트, 그리스, 한국 같은 나라들이 자기 나라의 문화재를 돌려 달라고 요구하고 있어요. 이런 요구를 문화재 반환이라고 하고, 영어로는 repatriation이라고 불러요. 친구가 빌려 간 내 물건을 돌려 달라고 하는 상황을 떠올리면 이해가 쉬울 거예요. 문제는 한 번 돌려주기 시작하면 여러 나라의 유물을 함께 전시하던 박물관이 자국 중심으로만 바뀔 수 있다는 점이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>국제적 박물관의 몰락\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 \u003cb class=\"key\">국제적 \u003c/b>\u003cb class=\"key\">박물관\u003c/b>이 곧 사라질 것이라는 도발적인 선언으로 시작한다. 전 세계의 보물을 보여 줌으로써 학생들을 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">역사\u003c/b>에 접하게 하던 박물관들이 이제 '역사 속으로' 사라진다는 것이다. 대영 박물관 관장 Robert Anderson은 이런 유형의 박물관이 \u003cb class=\"key\">사라지고 \u003c/b>\u003cb class=\"key\">있다\u003c/b>고 말한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>국내화 압력과 원인\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>Anderson은 박물관의 전시 범위가 국제적이기보다 \u003cb class=\"key\">국내적\u003c/b>이 되라는 압력을 받고 있다는 점을 든다. 이어서 원인을 간단히 제시하는데, 이집트나 그리스, 한국처럼 \u003cb class=\"key\">문화적으로 \u003c/b>\u003cb class=\"key\">풍요로운 \u003c/b>\u003cb class=\"key\">나라\u003c/b>들이 다른 나라에 자국의 문화재를 돌려줄 것을 요구해 왔다는 것이다. 즉 외부의 \u003cb class=\"key\">반환 \u003c/b>\u003cb class=\"key\">요구\u003c/b>가 박물관을 안으로 닫히게 만든 핵심 원인이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>도난 주장과 반환 요구\u003csmall>근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>이 나라들은 그 문화재들이 도난당한 것임에 틀림없다고 \u003cb class=\"key\">주장\u003c/b>해 왔다. 그 결과 가까운 장래에 박물관들은 이런 문화재들을 돌려주고 자국의 문화재만 \u003cb class=\"key\">전시\u003c/b>해야 할지도 모른다. 여기서 must have been은 과거 사실에 대한 강한 \u003cb class=\"key\">추측\u003c/b>을 나타내는 표현이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>학습 기회의 상실\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>마지막 문장은 이 모든 변화의 결과를 보여 준다. 그러면 모든 나라의 사람들이 다른 나라의 문화를 배울 아주 좋은 \u003cb class=\"key\">기회\u003c/b>를 \u003cb class=\"key\">빼앗기게\u003c/b> 될 것이다. 결국 문화재 반환이라는 명분이 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">학습\u003c/b>이라는 더 큰 가치를 훼손할 수 있다는 경고로 글은 마무리된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 글은 국제적 박물관이 곧 역사 속으로 사라질 것이라는 선언으로 시작해요. 전 세계의 보물을 보여 주며 학생들을 세계 역사에 접하게 하던 박물관들이 이제는 역사가 된다는 것이죠. 대영 박물관 관장인 Robert Anderson은 이런 유형의 박물관이 사라지고 있다고 말합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 원인 제시예요. Anderson은 박물관의 전시 범위가 국제적이기보다 국내적이 되라는 압력을 받고 있다고 해요. 그리고 원인은 간단하다면서, 이집트나 그리스, 한국처럼 문화적으로 풍요로운 나라들이 다른 나라에 자국의 문화재를 돌려 달라고 요구해 왔다고 설명합니다. 결국 반환 요구가 박물관을 안으로 닫히게 만든 핵심 원인이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 근거를 더하는 부분이에요. 이 나라들은 그 문화재들이 도난당한 것임에 틀림없다고 주장해 왔어요. must have been은 과거 사실에 대한 강한 추측을 나타내는 표현이죠. 그래서 가까운 장래에 박물관들은 그 문화재들을 돌려주고 자국의 문화재만 전시해야 할지도 모릅니다.","hl":"f2"},{"n":7,"text":"네 번째 단계이자 결론이에요. 그러면 모든 나라의 사람들이 다른 나라의 문화를 배울 아주 좋은 기회를 빼앗기게 될 거예요. 문화재를 제자리로 돌려놓는다는 명분이, 세계 문화를 배운다는 더 큰 가치를 훼손할 수 있다는 경고인 셈이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과(현상-원인-결과)\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 '곧 역사 속으로 사라질 것이다'라고 \u003cb class=\"key\">주제\u003c/b>를 먼저 던지고, 뒤에서 그 원인과 결과를 풀어 가는 \u003cb class=\"key\">두괄식\u003c/b> 구성이다. 두 번째와 세 번째 문장은 주제를 뒷받침하는 전문가의 \u003cb class=\"key\">발언\u003c/b>이고, 네 번째 문장의 The cause is simple이 원인 제시의 신호다. 이후 도난 주장과 반환 요구라는 근거를 거쳐 마지막 문장에서 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">기회 \u003c/b>\u003cb class=\"key\">상실\u003c/b>이라는 결과로 마무리되므로, 전체가 현상, 원인, 결과의 \u003cb class=\"key\">인과\u003c/b> 구조로 짜여 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>will soon be history (1)\u003c/b>\u003cspan>주제문 제시(현상)\u003c/span>\u003cb>rather than (3)\u003c/b>\u003cspan>국제적 대 국내적 대조\u003c/span>\u003cb>The cause is simple (4)\u003c/b>\u003cspan>원인 제시 신호\u003c/span>\u003cb>In the near future (6)\u003c/b>\u003cspan>결과 전망\u003c/span>\u003cb>Then (7)\u003c/b>\u003cspan>결과 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">treasures from around the world\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their treasures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these treasures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their own national treasures\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>국제적 박물관(International museum)\u003c/th>\u003cth>국내적 박물관(National museum)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>여러 나라의 보물을 함께 전시\u003c/td>\u003ctd>자국의 보물만 전시\u003c/td>\u003c/tr>\u003ctr>\u003ctd>세계 문화를 배우는 기회 제공\u003c/td>\u003ctd>학습 기회를 빼앗김\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 인과예요. 현상, 원인, 결과가 차례대로 이어지죠. 구조로 보면 첫 문장에서 주제를 먼저 던지는 두괄식이에요. 첫 문장에서 국제적 박물관이 곧 사라진다고 선언하고, 그 뒤에 까닭과 결과를 붙여 나가니까요.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보세요. 첫 문장의 will soon be history가 주제를 던지는 표현이고, 세 번째 문장의 rather than은 국제적과 국내적을 갈라 주는 대조 신호예요. 네 번째 문장의 The cause is simple은 원인을 알리겠다는 신호이고, 여섯 번째 문장의 In the near future와 마지막 문장의 Then은 결과로 넘어가는 표지판이에요. 참고로 treasures from around the world가 their treasures, these treasures, their own national treasures로 이어지며 같은 대상을 다시 가리키고 있다는 점도 챙겨 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>expose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>노출시키다, 접하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>treasure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보물, 문화재\u003c/span>\u003c/div>\u003cdiv>\u003cb>around the world\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전 세계에, 세계 도처에\u003c/span>\u003c/div>\u003cdiv>\u003cb>be history\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>역사 속으로 사라지다, 과거가 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dying\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사라지고 있다, 죽어 가고 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>director\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관장, 책임자, 이사\u003c/span>\u003c/div>\u003cdiv>\u003cb>be pushed to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하도록 밀어붙여지다, 압력을 받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>national\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>국가의, 자국의\u003c/span>\u003c/div>\u003cdiv>\u003cb>international\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>국제적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>scope\u003c/b>\u003cem>명사\u003c/em>\u003cspan>범위, 영역\u003c/span>\u003c/div>\u003cdiv>\u003cb>rather than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다는, ~이 아니라\u003c/span>\u003c/div>\u003cdiv>\u003cb>cause\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원인\u003c/span>\u003c/div>\u003cdiv>\u003cb>culturally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>문화적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>rich\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>풍요로운, 부유한\u003c/span>\u003c/div>\u003cdiv>\u003cb>such as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>demand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>return\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돌려주다, 반환하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>argue\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주장하다, 논하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>must have been\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~였음에 틀림없다\u003c/span>\u003c/div>\u003cdiv>\u003cb>steal\u003c/b>\u003cem>동사\u003c/em>\u003cspan>훔치다 (과거분사 stolen)\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the near future\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가까운 장래에, 머지않아\u003c/span>\u003c/div>\u003cdiv>\u003cb>be forced to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하도록 강요받다, 어쩔 수 없이 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>display\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전시하다, 진열하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>deprive A of B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A에게서 B를 빼앗다\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>culture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문화\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚을게요. expose는 접하게 하다, treasure는 보물이나 문화재, scope는 범위라는 뜻이에요. demand는 요구하다, be forced to는 하도록 강요받는다는 의미이고, deprive A of B는 A에게서 B를 빼앗다는 숙어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">expose\u003c/b>\u003cspan class=\"m\">접하게 하다, 노출시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reveal\u003c/span>\u003cspan class=\"s\">present\u003c/span>\u003cspan class=\"s\">introduce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dying\u003c/b>\u003cspan class=\"m\">사라지고 있다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">declining\u003c/span>\u003cspan class=\"s\">vanishing\u003c/span>\u003cspan class=\"s\">disappearing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">thriving\u003c/span>\u003cspan class=\"a\">flourishing\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">demand\u003c/b>\u003cspan class=\"m\">요구하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">require\u003c/span>\u003cspan class=\"s\">request\u003c/span>\u003cspan class=\"s\">claim\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">offer\u003c/span>\u003cspan class=\"a\">grant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">return\u003c/b>\u003cspan class=\"m\">돌려주다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">give back\u003c/span>\u003cspan class=\"s\">restore\u003c/span>\u003cspan class=\"s\">hand back\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">retain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">display\u003c/b>\u003cspan class=\"m\">전시하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">show\u003c/span>\u003cspan class=\"s\">exhibit\u003c/span>\u003cspan class=\"s\">present\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">argue\u003c/b>\u003cspan class=\"m\">주장하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">claim\u003c/span>\u003cspan class=\"s\">assert\u003c/span>\u003cspan class=\"s\">contend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003cspan class=\"a\">refute\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">deprive A of B\u003c/b>\u003cspan class=\"m\">A에게서 B를 빼앗다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">strip\u003c/span>\u003cspan class=\"s\">rob\u003c/span>\u003cspan class=\"s\">take away\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">provide\u003c/span>\u003cspan class=\"a\">supply\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rich\u003c/b>\u003cspan class=\"m\">풍요로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wealthy\u003c/span>\u003cspan class=\"s\">abundant\u003c/span>\u003cspan class=\"s\">affluent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">poor\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. expose는 reveal, present와 가깝고 conceal, hide와 반대예요. return은 give back, restore와 비슷하고 keep, retain과 반대죠. demand는 require, claim과 가깝고, display는 show, exhibit과 같은 뜻이며 hide와 반대예요. deprive of는 strip, take away와 비슷하고 provide, supply와 반대이고, argue는 claim, assert와 가깝습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들에게 세계 역사를 접하게 하는 박물관들은\u003c/span>\u003cspan class=\"en\">Museums \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">expose \u003c/span>\u003cspan class=\"tgt\">students \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">world \u003c/span>\u003cspan class=\"tgt\">history\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게 전 세계의 보물(문화재)을 보여줌으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">showing \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">treasures \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧 역사 속으로 사라질 것이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">soon \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">history\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학생들에게 전 세계의 보물(문화재)을 보여줌으로써 세계 역사를 접하게 하는 박물관들이 곧 역사 속으로 사라질 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 전 세계의 보물을 보여 주며 학생들에게 세계 역사를 접하게 하는 박물관들이 곧 \u003cb class=\"key\">역사 \u003c/b>\u003cb class=\"key\">속으로 \u003c/b>\u003cb class=\"key\">사라질 \u003c/b>\u003cb class=\"key\">것\u003c/b>이라고 말해요. 글 전체의 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 처음 제시하는 도입 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 Museums] + that + [동사 expose] + [목적어 students] + [전치사 to + 명사 world history] : \"학생들에게 세계 역사를 접하게 하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : by + [동명사 showing] + [목적어 them] + [목적어 treasures] + [수식어 from around the world] : \"그들에게 전 세계의 보물을 보여줌으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be동사 + 명사(주격 보어)\u003c/span> : [주어] + will + be + [명사 history] : \"곧 역사 속으로 사라질 것이다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Museums that expose students to world history, 학생들에게 세계 역사를 접하게 하는 박물관들은. by showing them treasures from around the world, 그들에게 전 세계의 보물(문화재)을 보여줌으로써. will soon be history, 곧 역사 속으로 사라질 것이다.. 이 문장 전체를 해석하면, 학생들에게 전 세계의 보물(문화재)을 보여줌으로써 세계 역사를 접하게 하는 박물관들이 곧 역사 속으로 사라질 것이다.","hl":"m"},{"n":13,"text":"이 문장은 전 세계의 보물을 보여 주며 학생들에게 세계 역사를 접하게 하는 박물관들이 곧 역사 속으로 사라질 것이라고 말해요. 글 전체의 문제 상황을 처음 제시하는 도입 문장이죠.","hl":"mn"},{"n":14,"text":"첫 번째로, that은 앞의 Museums를 꾸며 주는 주격 관계대명사예요. 두 번째로, by showing은 by 뒤에 동명사가 와서 수단을 나타내는 표현이에요. 세 번째로, will soon be history에서 history는 주어의 상태를 설명하는 주격 보어로, '끝나다'라는 뜻으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 종류의 박물관들이 사라지고 있다고\u003c/span>\u003cspan class=\"en\">These types of museums \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">dying\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Robert Anderson은 말한다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">says \u003c/span>\u003cspan class=\"tgt\">Robert \u003c/span>\u003cspan class=\"tgt\">Anderson\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">런던 대영 박물관장인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">director \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">British \u003c/span>\u003cspan class=\"tgt\">Museum \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">London\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 종류의 박물관들이 사라지고 있다고 런던 대영 박물관장인 Robert Anderson은 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 박물관의 미래가 단순한 추측이 아니라 전문가의 발언임을 밝혀 \u003cb class=\"key\">신뢰도\u003c/b>를 높여요. Robert Anderson을 \u003cb class=\"key\">대영 \u003c/b>\u003cb class=\"key\">박물관장\u003c/b>으로 소개해 권위를 더해 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : [주어 These types of museums] + are + [동사-ing dying] : \"사라지고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 도치(인용문 뒤)\u003c/span> : [인용 내용] + says + [주어 Robert Anderson] : \"Robert Anderson은 말한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격의 명사구(부연 설명)\u003c/span> : [고유명사 Robert Anderson] + , + [직위·신분 명사구 a director ...] : \"런던 대영 박물관장인\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"These types of museums are dying, 이런 종류의 박물관들이 사라지고 있다고. says Robert Anderson, Robert Anderson은 말한다. a director of the British Museum in London, 런던 대영 박물관장인. 이 문장 전체를 해석하면, 이런 종류의 박물관들이 사라지고 있다고 런던 대영 박물관장인 Robert Anderson은 말한다.","hl":"m"},{"n":16,"text":"이 문장은 앞에서 말한 박물관의 미래가 단순한 추측이 아니라 전문가의 발언임을 밝혀 신뢰도를 높여요. Robert Anderson을 대영 박물관장으로 소개해 권위를 더해 주죠.","hl":"mn"},{"n":17,"text":"첫 번째로, are dying은 현재 진행 중인 변화를 나타내는 현재진행형이에요. 두 번째로, says Robert Anderson은 인용문 뒤에서 동사가 주어 앞에 오는 도치 구문이죠. 세 번째로, a director of the British Museum in London은 앞의 Robert Anderson을 설명하는 동격 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">박물관들은 압력을 받고 있다\u003c/span>\u003cspan class=\"en\">Museums \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">pushed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국제적이기보다 국내적이 되도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">become \u003c/span>\u003cspan class=\"tgt\">national\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">international\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(전시) 범위에서\u003c/span>\u003cspan class=\"en\">in scope,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Anderson은 말한다.\u003c/span>\u003cspan class=\"en\">says Anderson.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">(전시) 범위를 국제적이기보다 국내적(자국에 국한된)이 되라는 많은 압력이 박물관에 가해지고 있다고 Anderson은 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 박물관이 국제적 전시에서 자국 중심으로 바뀌는 \u003cb class=\"key\">흐름\u003c/b>을 전문가 발언으로 제시해요. national과 international의 \u003cb class=\"key\">대조\u003c/b>가 핵심이며, 다음 문장의 원인 설명으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태의 진행형\u003c/span> : [주어 Museums] + are being + [과거분사 pushed] : \"압력을 받고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사구(방향·결과)\u003c/span> : be pushed + [to become national] : \"국내적이 되도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">rather than 비교 표현\u003c/span> : [A national] rather than [B international] : \"국제적이기보다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Museums are being pushed, 박물관들은 압력을 받고 있다. to become national rather than international, 국제적이기보다 국내적이 되도록. in scope, (전시) 범위에서. says Anderson, Anderson은 말한다.. 이 문장 전체를 해석하면, (전시) 범위를 국제적이기보다 국내적(자국에 국한된)이 되라는 많은 압력이 박물관에 가해지고 있다고 Anderson은 말한다.","hl":"m"},{"n":19,"text":"이 문장은 박물관이 국제적 전시에서 자국 중심으로 바뀌는 흐름을 전문가 발언으로 제시해요. national과 international의 대조가 핵심이며, 다음 문장의 원인 설명으로 자연스럽게 이어집니다.","hl":"mn"},{"n":20,"text":"첫 번째로, are being pushed는 수동태의 진행형이에요. 두 번째로, to become national은 압력을 받아 국내적으로 변하는 방향을 나타내는 to부정사 구문이에요. 세 번째로, rather than international은 international보다 national 쪽을 강조하는 비교 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원인은 간단하다.\u003c/span>\u003cspan class=\"en\">The cause is simple:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이집트나 그리스, 한국처럼 문화적으로 풍요로운 나라들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Culturally \u003c/span>\u003cspan class=\"tgt\">rich \u003c/span>\u003cspan class=\"tgt\">nations\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">Egypt, \u003c/span>\u003cspan class=\"tgt\">Greece, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Korea\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요구해오고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">demanded \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라에 자국의 문화재를 자신들 나라에 돌려줄 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">nations \u003c/span>\u003cspan class=\"tgt\">return\u003c/span> their treasures to them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">원인은 간단하다. 이집트나 그리스, 한국처럼 문화적으로 풍요로운 나라들이 다른 나라에 자국의 문화재를 자신들 나라에 돌려줄 것을 요구해오고 있기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 박물관들의 변화가 왜 일어나는지, 그 \u003cb class=\"key\">원인\u003c/b>을 콜론을 써서 바로 제시하는 문장이에요. 문화적으로 풍요로운 나라들이 자국 문화재의 \u003cb class=\"key\">반환\u003c/b>을 요구해 온 것이 문제의 출발점이라는 뜻이죠. such as는 뒤에 예를 나열하는 표현이라, 이집트와 그리스와 한국이 그 대표적인 사례임을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사가 형용사를 수식하는 구조\u003c/span> : [부사 Culturally] + [형용사 rich] + [명사 nations] : \"문화적으로 풍요로운 나라들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">such as (예시 제시)\u003c/span> : [명사구] + such as + [예시 나열] : \"이집트나 그리스, 한국처럼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">that절 안의 당위성 가정법(should 생략)\u003c/span> : demand + that + [주어] + [(should) + 동사원형] : \"다른 나라가 돌려주기를 요구해왔다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The cause is simple, 원인은 간단하다.. Culturally rich nations such as Egypt, Greece, and Korea, 이집트나 그리스, 한국처럼 문화적으로 풍요로운 나라들이. have demanded, 요구해오고 있다. that other nations return their treasures to them, 다른 나라에 자국의 문화재를 자신들 나라에 돌려줄 것을. 이 문장 전체를 해석하면, 원인은 간단하다. 이집트나 그리스, 한국처럼 문화적으로 풍요로운 나라들이 다른 나라에 자국의 문화재를 자신들 나라에 돌려줄 것을 요구해오고 있기 때문이다.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 말한 박물관들의 변화가 왜 일어나는지 원인을 딱 잘라 제시하고 있어요. 문화적으로 풍요로운 나라들이 자기 문화재의 반환을 요구하는 것이 원인이라는 거죠. such as 뒤에 이집트, 그리스, 한국을 나열해서 그런 요구가 특정 나라만의 일이 아니라는 걸 보여 줍니다.","hl":"mn"},{"n":23,"text":"어법 포인트는 세 가지예요. 첫 번째, Culturally rich nations에서 culturally는 부사인데 형용사 rich를 꾸며 주고 있어요. 부사가 형용사를 꾸미는 겹수식 구조, 꼭 기억해 두세요. 두 번째, such as는 예시를 나열하는 표현이에요. 세 번째, have demanded that other nations return에서 that절 동사가 return, 즉 원형으로 왔다는 점이 중요해요. demand처럼 요구를 나타내는 동사 뒤 that절에서는 should가 생략되고 동사원형이 오는 당위성 가정법, 이것도 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 주장해왔다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">argued \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 문화재들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> the treasures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도난당한 것임에 틀림없다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">stolen\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 그 문화재들이 도난당한 것임에 틀림없다고 주장해왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 문화재 반환을 요구하는 나라들의 \u003cb class=\"key\">근거\u003c/b>를 이어 주는 문장이에요. 그들이 문화재를 원래 자기 것이라고 믿는 까닭이 도난이라는 주장이라는 뜻이죠. must have p.p.는 과거 사실에 대한 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">추측\u003c/b>을 나타내는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 + that절 목적어\u003c/span> : have + p.p. + that + [주어 + 동사 ~] : \"~라고 주장해왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">must + have p.p.의 수동태\u003c/span> : must + have + been + p.p. : \"도난당한 것임에 틀림없다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They have argued, 그들은 주장해왔다. that the treasures, 그 문화재들이. must have been stolen, 도난당한 것임에 틀림없다고. 이 문장 전체를 해석하면, 그들은 그 문화재들이 도난당한 것임에 틀림없다고 주장해왔다.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 나온 문화재 반환 요구의 근거를 설명해요. 요구하는 나라들은 그 문화재가 애초에 도난당한 것이라고 믿는다는 거죠. must have been stolen처럼 쓰면 과거 일에 대한 강한 추측, 즉 틀림없이 그랬다는 확신이 담깁니다.","hl":"mn"},{"n":26,"text":"여기서는 두 가지를 봐야 해요. 첫째, have argued는 현재완료로 과거부터 지금까지 주장이 계속 이어져 왔다는 뜻이고, 뒤의 that절은 argue의 목적어로 쓰인 명사절이에요. 둘째, must have been stolen은 must have p.p.라는 과거 추측 표현에 수동태가 결합된 형태예요. 문화재는 훔치는 대상이니까 수동태 been stolen이 온 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가까운 장래에\u003c/span>\u003cspan class=\"en\">In the near future,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">박물관들은 강요받을지도 모른다\u003c/span>\u003cspan class=\"en\">museums \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">forced \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 문화재들을 돌려주고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">return \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">treasures \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자국의 문화재만 전시하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">display\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">national \u003c/span>\u003cspan class=\"tgt\">treasures\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가까운 장래에 박물관들은 이런 문화재들을 돌려주고 자국의 문화재만 전시해야 할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 요구가 실제로 받아들여졌을 때 벌어질 \u003cb class=\"key\">결과\u003c/b>를 전망하는 문장이에요. might be forced to는 강제로 그렇게 하게 될지도 모른다는 뜻으로, 확정이 아닌 \u003cb class=\"key\">가능성\u003c/b>을 조심스럽게 말하고 있죠. 이 문장은 바로 뒤에서 이어지는 사람들의 학습 기회 상실이라는 우려로 자연스럽게 연결됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 might + 수동태 + to부정사\u003c/span> : might + be + p.p. + to + 동사원형 : \"돌려주도록 강요받을지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 병렬 구조\u003c/span> : be forced to + [동사원형 A] + and + [(to) + 동사원형 B] : \"돌려주고 전시하도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">only의 한정 범위\u003c/span> : only + [한정하는 명사구] : \"자국의 문화재만\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"In the near future, 가까운 장래에. museums might be forced, 박물관들은 강요받을지도 모른다. to return these treasures, 이런 문화재들을 돌려주고. and display only their own national treasures, 자국의 문화재만 전시하도록. 이 문장 전체를 해석하면, 가까운 장래에 박물관들은 이런 문화재들을 돌려주고 자국의 문화재만 전시해야 할지도 모른다.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 말한 요구가 그대로 받아들여졌을 때 생길 결과를 전망하고 있어요. 박물관이 문화재를 돌려주고 자기 나라 것만 전시하게 될지도 모른다는 거죠. might를 써서 단정하지 않고 가능성으로 조심스럽게 말하고 있다는 점이 중요해요.","hl":"mn"},{"n":29,"text":"어법은 세 가지예요. 첫째, might be forced to return에서 might는 가능성을 나타내는 조동사고 be forced는 수동태죠. 강요받는 쪽이 박물관이니까 수동태를 쓴 거예요. 둘째, to return과 display가 and로 묶인 병렬 구조예요. 뒤쪽 to는 반복을 피하려고 생략된 겁니다. 셋째, only their own national treasures에서 only는 바로 뒤 명사구를 한정해서 자국의 문화재만이라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 곳의 사람들이\u003c/span>\u003cspan class=\"en\">people everywhere\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 좋은 기회를 빼앗기게 될 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">deprived \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> a great opportunity\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배울\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">learn \u003c/span>\u003cspan class=\"tgt\">about\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라의 문화를\u003c/span>\u003cspan class=\"en\">other countries' cultures.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 모든 나라의 사람들이 다른 나라의 문화를 배울 아주 좋은 기회를 빼앗기게 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 박물관이 문화재를 반환하면 결국 사람들이 다른 문화를 배울 \u003cb class=\"key\">기회\u003c/b>를 잃는다는 점을 경고합니다. 'be deprived of'는 '~을 빼앗기다'라는 뜻의 \u003cb class=\"key\">수동태\u003c/b>로, 긍정적인 기회가 사라지는 상황을 강조해요. 글의 마지막에서 앞의 문화재 반환 요구가 낳을 부정적 \u003cb class=\"key\">결과\u003c/b>를 정리하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be+과거분사)\u003c/span> : 주어 + will be + p.p. + of + 목적어 : \"~을 빼앗기게 될 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : 명사(opportunity) + to learn about + 목적어 : \"배울\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Then, 그러면. people everywhere, 모든 곳의 사람들이. will be deprived of a great opportunity, 아주 좋은 기회를 빼앗기게 될 것이다. to learn about, 배울. other countries' cultures, 다른 나라의 문화를. 이 문장 전체를 해석하면, 그러면 모든 나라의 사람들이 다른 나라의 문화를 배울 아주 좋은 기회를 빼앗기게 될 것이다.","hl":"m"},{"n":31,"text":"이 문장은 문화재를 돌려주게 되면 사람들이 다른 문화를 배울 기회를 잃는다는 것을 말해요. deprived of는 빼앗기다라는 뜻이고 will be deprived of는 수동태로 표현되어 있어요. 그리고 글의 마지막에서 앞의 내용이 낳을 부정적인 결과를 정리하고 있죠.","hl":"mn"},{"n":32,"text":"첫 번째로 will be deprived of는 수동태예요. deprive A of B가 A에게서 B를 빼앗다라는 뜻이라서, 주어 people이 빼앗기는 대상이 되면 be deprived of B 형태가 돼요. 두 번째로 to learn about은 앞에 있는 명사 opportunity를 뒤에서 꾸며 주는 형용사적 용법이에요. 그래서 a great opportunity to learn about은 다른 나라의 문화를 배울 아주 좋은 기회라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>전 세계의 보물을 보여 주며 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">역사\u003c/b>를 가르치던 국제적 박물관들이 곧 역사 속으로 사라질 위기에 있다.\u003c/li>\u003cli>그 원인은 이집트, 그리스, 한국 같은 \u003cb class=\"key\">문화적으로 \u003c/b>\u003cb class=\"key\">풍요로운 \u003c/b>\u003cb class=\"key\">나라\u003c/b>들이 자국의 문화재를 돌려줄 것을 요구해 온 데 있다.\u003c/li>\u003cli>박물관들은 전시 범위를 \u003cb class=\"key\">국내적\u003c/b>으로 좁히고 자국의 문화재만 전시해야 할지도 모른다.\u003c/li>\u003cli>그렇게 되면 모든 나라의 사람들이 다른 나라의 문화를 배울 좋은 \u003cb class=\"key\">기회\u003c/b>를 빼앗기게 된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>International museums may be forced to return foreign treasures and display only their own national treasures, which will deprive people everywhere of a great opportunity to learn about other countries' cultures.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">전 세계의 보물을 보여 주며 세계 역사를 접하게 하던 국제적 박물관들이, 문화적으로 풍요로운 나라들의 \u003cb class=\"key\">문화재 \u003c/b>\u003cb class=\"key\">반환 \u003c/b>\u003cb class=\"key\">요구\u003c/b> 때문에 \u003cb class=\"key\">국내적 \u003c/b>\u003cb class=\"key\">범위\u003c/b>로 좁아질 위기에 처해 있다. 그렇게 되면 사람들은 다른 나라의 문화를 배울 좋은 \u003cb class=\"key\">기회\u003c/b>를 빼앗기게 된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글을 한 줄로 정리하면 이래요. 문화재 반환 요구로 국제적 박물관이 자국 중심으로 바뀌면, 사람들은 다른 나라의 문화를 배울 기회를 잃게 된다는 것이죠. 주제문이 앞에 나오는 두괄식 글에서는 첫 문장을 잡고 원인과 결과를 따라가는 습관이 중요해요. 오늘도 끝까지 잘 따라와 줘서 고맙습니다. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
