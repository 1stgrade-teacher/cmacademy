  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});

  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"13강 preview","title":"수동태의 주요 패턴 정복하기","audioDir":"문법_13강_수동태의_주요패턴_audio","preview":false,"count":20,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">13강 수동태의 주요패턴\u003c/div>\u003ch1>수동태의 주요 패턴 정복하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>수동태의 주요 패턴인 be v-ed + 준동사와 전치사 수동구를 완벽하게 이해하고 해석한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분 고등학교 영문법 마스터 과정에 오신 것을 환영해요. 오늘 우리는 수동태의 주요 패턴이라는 아주 중요한 단원을 공부할 거예요. 독해와 시험에서 자주 나오는 형태들이니까 선생님과 함께 집중해서 꼼꼼히 살펴봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">be v-ed + to-v\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">허락, 기대, 권유, 요청 등을 나타내는 \u003cb class=\"key\">V + O + to-v\u003c/b> 형태의 수동형은 \u003cb class=\"key\">be v-ed + to-v\u003c/b> 패턴으로 쓰여요. \n[도식: V + O + to-v ➔ 주어 + be v-ed + to-v]\u003cdiv>\u003cspan class=\"g-formula\">V + O + to-v -&gt; be v-ed + to-v\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">was told to go\u003c/span> not by train but by plane by my boss.\u003c/div>\u003cdiv class=\"g-ko\">나는 상사로부터 기차가 아니라 비행기를 타고 가라는 지시를 받았다.\u003c/div>\u003cdiv class=\"g-note\">tell의 수동형 뒤에 to-v가 온 형태\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">In schools, students \u003cspan class=\"fx\">are not allowed to use\u003c/span> their smart phone.\u003c/div>\u003cdiv class=\"g-ko\">학교에서 학생들은 스마트폰을 사용하는 것이 허락되지 않는다.\u003c/div>\u003cdiv class=\"g-note\">allow의 수동형 뒤에 to-v가 온 형태\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Lower oil prices \u003cspan class=\"fx\">are expected to stimulate\u003c/span> demand.\u003c/div>\u003cdiv class=\"g-ko\">유가 하락은 수요를 자극할 것으로 기대된다.\u003c/div>\u003cdiv class=\"g-note\">expect의 수동형 뒤에 to-v가 온 형태\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>be left, be found, be seen, be heard 같은 동사들은 뒤에 \u003cb class=\"key\">v-ing\u003c/b>나 \u003cb class=\"key\">v-ed\u003c/b>를 목적격 보어처럼 취한다는 점을 기억하세요.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념은 be v-ed 플러스 투브이 패턴이에요. 허락이나 기대나 권유나 요청을 받을 때 쓰는 표현으로 원래 목적격 보어로 투부정사를 취하던 동사의 수동태랍니다. 독해에서 정말 자주 나오니까 꼭 기억해 둬야 해요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 함께 볼까요. I was told to go not by train but by plane by my boss. 나는 상사로부터 기차가 아니라 비행기를 타고 가라는 지시를 받았다라는 뜻이에요. be told 뒤에 to go가 와서 하라고 들었다라는 의미를 만들고 있죠.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. In schools, students are not allowed to use their smart phone. 학교에서 학생들은 스마트폰을 사용하는 것이 허락되지 않는다는 뜻이죠. are not allowed 뒤에 to use가 붙어서 허락받지 못한다는 의미를 나타내요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문을 읽어 볼게요. Lower oil prices are expected to stimulate demand. 유가 하락은 수요를 자극할 것으로 기대된다는 의미예요. are expected 뒤에 to stimulate가 와서 ~할 것으로 기대된다고 해석하면 된답니다.","hl":"ex-2"},{"n":6,"text":"여기서 잠깐 주의할 팁을 줄게요. be left나 be found나 be seen이나 be heard 같은 동사들은 뒤에 to부정사가 아니라 ing나 과거분사를 취한다는 것을 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">be v-ed + v-ing / v-ed\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">무엇을 하고 있거나 된 \u003cb class=\"key\">상태에 놓이는 것\u003c/b>이나 \u003cb class=\"key\">감각에 의해 지각되는 것\u003c/b>을 나타낼 때 \u003cb class=\"key\">be v-ed + v-ing / v-ed\u003c/b> 패턴을 사용해요. \n[도식: V + O + v-ing/v-ed ➔ 주어 + be v-ed + v-ing/v-ed]\u003cdiv>\u003cspan class=\"g-formula\">V + O + v-ing / v-ed -&gt; be v-ed + v-ing / v-ed\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Two bodies \u003cspan class=\"fx\">were found floating\u003c/span> on the coast.\u003c/div>\u003cdiv class=\"g-ko\">두 구체가 해안에 떠 있는 채로 발견되었다.\u003c/div>\u003cdiv class=\"g-note\">find의 수동형 뒤에 v-ing가 온 형태\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">was seen running\u003c/span> away from the scene of the crime.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 범죄 현장에서 도망치는 것이 목격되었다.\u003c/div>\u003cdiv class=\"g-note\">see의 수동형 뒤에 v-ing가 온 형태\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The issue \u003cspan class=\"fx\">was left unaddressed\u003c/span> for a long time.\u003c/div>\u003cdiv class=\"g-ko\">그 문제는 오랫동안 다루어지지 않은 채 방치되었다.\u003c/div>\u003cdiv class=\"g-note\">leave의 수동형 뒤에 v-ed가 온 형태\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>v-ing와 v-ed 중 무엇이 오는지는 그것이 능동의 의미인지 수동의 의미인지 \u003cb class=\"key\">상태를 잘 판단\u003c/b>해야 해요.\u003c/div>","segs":[{"n":7,"text":"두 번째 개념은 be v-ed 플러스 ing 또는 과거분사 패턴이에요. 어떤 동작을 하고 있거나 어떤 상태에 놓여 있는 것을 나타낼 때 쓰지요. 감각동사의 수동형에서 아주 많이 쓰이는 형태랍니다.","hl":"rule"},{"n":8,"text":"네 번째 예문이에요. Two bodies were found floating on the coast. 두 구체가 해안에 떠 있는 채로 발견되었다는 뜻이죠. were found 뒤에 floating이 와서 떠 있는 상태를 나타내고 있어요.","hl":"ex-0"},{"n":9,"text":"다섯 번째 예문이에요. She was seen running away from the scene of the crime. 그녀는 범죄 현장에서 도망치는 것이 목격되었다는 의미예요. was seen 뒤에 running이 와서 도망치는 동작을 지각당한 수동의 의미를 보여줘요.","hl":"ex-1"},{"n":10,"text":"여섯 번째 예문입니다. The issue was left unaddressed for a long time. 그 문제는 오랫동안 다루어지지 않은 채 방치되었다는 뜻이에요. was left 뒤에 과거분사 unaddressed가 와서 처리되지 않은 상태를 나타내요.","hl":"ex-2"},{"n":11,"text":"주의할 점은 ing가 올지 과거분사가 올지는 그 뒤의 분사가 능동인지 수동인지를 잘 따져서 판단해야 한다는 거예요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">동사구의 수동태 (be v-ed + 전치사)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">원래 \u003cb class=\"key\">동사 + 전치사\u003c/b> 형태의 덩어리 표현이 수동태가 되면 \u003cb class=\"key\">하나의 표현\u003c/b>으로 보고 의미를 외워야 해요. \n[도식: V + O + 전치사 ➔ 주어 + be v-ed + 전치사 (숙어처럼 암기)]\u003cdiv>\u003cspan class=\"g-formula\">V + O + 전치사 -&gt; be v-ed + 전치사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">was reminded of\u003c/span> the good old days by the picture.\u003c/div>\u003cdiv class=\"g-ko\">나는 그 사진을 보고 옛날 좋은 시절이 생각났다.\u003c/div>\u003cdiv class=\"g-note\">remind A of B의 수동형\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Income taxes \u003cspan class=\"fx\">are based on\u003c/span> one’s earnings.\u003c/div>\u003cdiv class=\"g-ko\">소득세는 개인의 소득을 근거로 한다.\u003c/div>\u003cdiv class=\"g-note\">base A on B의 수동형\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Our success \u003cspan class=\"fx\">can be attributed to\u003c/span> your hard work.\u003c/div>\u003cdiv class=\"g-ko\">우리의 성공은 너의 노력 덕분이다.\u003c/div>\u003cdiv class=\"g-note\">attribute A to B의 수동형\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">Chronic fatigue \u003cspan class=\"fx\">is associated with\u003c/span> a range of sleep problems.\u003c/div>\u003cdiv class=\"g-ko\">만성 피로는 다양한 수면 문제와 관련이 있다.\u003c/div>\u003cdiv class=\"g-note\">associate A with B의 수동형\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">remind of\u003c/b>, \u003cb class=\"key\">base on\u003c/b>, \u003cb class=\"key\">attribute to\u003c/b>, \u003cb class=\"key\">associate with\u003c/b>, \u003cb class=\"key\">view as\u003c/b> 같은 짝꿍 전치사를 정확히 기억하세요.\u003c/div>","segs":[{"n":12,"text":"세 번째 개념은 동사구의 수동태예요. 동사와 전치사가 합쳐져서 자주 쓰이는 표현들이 수동태가 되면 직역하기가 어려워지죠. 그래서 이 패턴들은 하나의 숙어처럼 그 의미를 통째로 기억해 두는 것이 좋답니다.","hl":"rule"},{"n":13,"text":"첫 번째 예문을 봐요. I was reminded of the good old days by the picture. 나는 그 사진을 보고 옛날 좋은 시절이 생각났다는 뜻이에요. was reminded of를 ~가 생각나다라는 하나의 표현으로 기억해 주세요.","hl":"ex-0"},{"n":14,"text":"두 번째 예문이에요. Income taxes are based on one’s earnings. 소득세는 개인의 소득을 근거로 한다는 의미죠. are based on을 ~를 근거로 하다라고 외우면 편해요.","hl":"ex-1"},{"n":15,"text":"세 번째 예문입니다. Our success can be attributed to your hard work. 우리의 성공은 너의 노력 덕분이라는 뜻이에요. can be attributed to가 ~ 때문이라는 의미를 나타낸답니다.","hl":"ex-2"},{"n":16,"text":"네 번째 예문이에요. Chronic fatigue is associated with a range of sleep problems. 만성 피로는 다양한 수면 문제와 관련이 있다는 뜻이죠. is associated with는 ~와 관련되다라는 뜻이에요.","hl":"ex-3"},{"n":17,"text":"팁을 주자면 remind는 of와, base는 on과, attribute는 to와, associate는 with와, view는 as와 짝꿍이라는 것을 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Students are allowed using their smartphones.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Students are allowed to use their smartphones.\u003c/div>\u003cdiv class=\"g-why\">allow의 수동형 뒤에는 목적격 보어로 동명사가 아니라 투부정사가 와야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Our success is attributed for your hard work.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Our success is attributed to your hard work.\u003c/div>\u003cdiv class=\"g-why\">attribute A to B 패턴의 수동형이므로 전치사 for가 아니라 to를 써야 해요.\u003c/div>\u003c/div>","segs":[{"n":18,"text":"학생들이 자주 틀리는 문장을 살펴볼게요. Students are allowed using their smartphones라는 문장은 틀렸어요. allow의 수동형 뒤에는 ing가 아니라 투부정사가 와야 하므로 are allowed to use로 써야 맞아요.","hl":"mk-0"},{"n":19,"text":"두 번째로 자주 틀리는 문장이에요. Our success is attributed for your hard work는 틀린 문장이지요. attribute A to B 패턴의 수동태이므로 전치사는 for가 아니라 to를 써야 올바른 문장이 돼요.","hl":"mk-1"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">13강 수동태의 주요패턴\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>허락, 기대, 권유 등을 나타내는 수동태는 \u003cb class=\"key\">be v-ed + to-v\u003c/b> 형태로 씁니다.\u003c/li>\u003cli>상태나 지각을 나타내는 수동태는 \u003cb class=\"key\">be v-ed + v-ing / v-ed\u003c/b> 형태로 씁니다.\u003c/li>\u003cli>동사구 수동태는 \u003cb class=\"key\">be v-ed + 전치사\u003c/b>를 \u003cb class=\"key\">하나의 표현\u003c/b>으로 외워야 합니다.\u003c/li>\u003c/ul>","segs":[{"n":20,"text":"오늘 우리는 수동태의 다양한 주요 패턴들을 함께 공부했어요. 투부정사를 취하는 수동태와 분사를 취하는 수동태 그리고 전치사와 함께 쓰이는 동사구 수동태까지 정말 수고 많았어요. 복습을 철저히 하고 다음 시간에 만나요.","hl":"sum"}]}]});</script></body></html>
