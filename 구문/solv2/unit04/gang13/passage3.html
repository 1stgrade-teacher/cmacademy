<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구문사고력 13강 reading03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"구문사고력 13강 reading03","audioDir":"passage3_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">13강\u003cbr>reading03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>What, Then, Should We Eat?\u003c/h1>\u003ch2>그렇다면 무엇을 먹어야 하는가?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>영양학자와 음식 전문가들이 고기·생선·유제품·과일·채소까지 모두 건강에 해롭다고 경고하면서, 오랫동안 굳어진 \u003cb class=\"key\">전통적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>은 빠르게 흔들리고 있다. 결국 우리는 \u003cb class=\"key\">무엇을 \u003c/b>\u003cb class=\"key\">먹어야 \u003c/b>\u003cb class=\"key\">하는가\u003c/b>라는 간단하지만 어려운 질문을 안게 된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Food experts' warnings about meat, fish, dairy, and produce are overturning the traditional view of a nutritious diet, leaving us with the simple yet difficult question of what to eat.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 영양학자들과 음식 전문가들이 바라보는 식단에 관한 글이에요. 전통적으로 meat and fish는 영양가 있는 식단의 주식으로 여겨져 왔지만, 이 글은 그 관점이 빠르게 흔들리고 있다는 이야기로 시작하죠. 요지는 결국 전문가들의 경고 때문에 우리가 무엇을 먹어야 할지 모르게 되었다는 것이고, 마지막에는 간단하지만 어려운 질문 하나가 남습니다. 함께 천천히 따라가 봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">영양학(nutrition)에서는 오랫동안 고기와 생선, 유제품을 단백질(protein)과 칼슘(calcium)의 좋은 공급원, 즉 \u003cb class=\"key\">주식\u003c/b>으로 가르쳐 왔어요. 그런데 먹이사슬(food chain) 위쪽에 있는 큰 생선일수록 수은 같은 중금속이 몸에 쌓이는 \u003cb class=\"key\">생물 \u003c/b>\u003cb class=\"key\">농축\u003c/b>(bioaccumulation) 현상이 알려지면서 생선을 보는 눈이 달라졌죠. 목초지나 사료(feed)가 오염되면 유제품의 \u003cb class=\"key\">콜레스테롤\u003c/b>(cholesterol) 수치도 달라지고, 과일과 채소에서는 살충제(pesticide)와 화학 비료(chemical fertilizer)의 잔류(residue) 문제가 계속 보고됩니다. 이건 '몸에 좋은 약도 과하면 독이 된다'는 말과 비슷해요. 좋다고 알려진 음식도 얼마나 먹는지, 어떻게 길렀고 어떻게 가공했는지에 따라 평가가 완전히 달라질 수 있다는 뜻이죠.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚고 갈게요. 영양학에서는 오랫동안 고기와 생선, 유제품을 단백질과 칼슘의 좋은 공급원으로 가르쳐 왔어요. 그런데 먹이사슬 위쪽에 있는 큰 생선일수록 수은 같은 중금속이 몸에 쌓이는 생물 농축 현상이 알려지면서 생선을 보는 눈이 달라졌죠. 목초지나 사료가 오염되면 유제품의 콜레스테롤 수치도 달라지고, 과일과 채소에서는 살충제와 화학 비료의 잔류 문제가 계속 보고됩니다. 이건 몸에 좋은 약도 과하면 독이 된다는 말과 비슷해요. 좋다고 알려진 음식도 얼마나 먹는지, 어떻게 길렀고 어떻게 가공했는지에 따라 평가가 완전히 달라질 수 있다는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>통념과 전환\u003csmall>통념·전환 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>영양학자들의 눈에 고기와 생선이 영양가 있는 식단의 \u003cb class=\"key\">주식\u003c/b>으로 오랫동안 여겨져 왔다고 통념을 제시한다. 이어 however를 사용해 이러한 \u003cb class=\"key\">전통적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>이 빠르게 변하고 있다고 말하며 흐름을 뒤집는다. 오래된 믿음과 그에 대한 \u003cb class=\"key\">반박\u003c/b>을 나란히 놓은 도입부다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>고기·생선·유제품 경고\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>음식 전문가들은 고기를 너무 많이 먹으면 건강이 나빠진다고 경고하고, \u003cb class=\"key\">생선\u003c/b>은 호수와 강과 바다의 오염 때문에 독성 물질로 가득하다고 말한다. 더욱이 치즈와 우유 같은 \u003cb class=\"key\">유제품\u003c/b>은 콜레스테롤이 너무 많다고 전해진다. 앞의 통념과 정반대되는 \u003cb class=\"key\">경고\u003c/b>들이 구체적으로 이어지는 부분이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>영양가 차이와 오염 확대\u003csmall>예시 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>유제품의 \u003cb class=\"key\">영양가\u003c/b>는 소가 어떻게 사육되었고 유제품이 어떻게 가공되었는지에 따라 크게 달라진다고 덧붙인다. 심지어 과일과 채소까지 화학 비료와 \u003cb class=\"key\">살충제\u003c/b>에 의해 완전히 오염되었다고 여겨진다. 경고의 범위가 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">식품\u003c/b>으로 넓어지는 단계다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>질문으로 남는 결론\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>마지막 문장은 이런 경고들이 우리를 위한 \u003cb class=\"key\">진정어린 \u003c/b>\u003cb class=\"key\">관심\u003c/b>에서 나온 것임을 인정하면서도 간단하지만 어려운 질문을 남긴다고 말한다. 그 질문은 바로 그렇다면 도대체 \u003cb class=\"key\">무엇을 \u003c/b>\u003cb class=\"key\">먹어야 \u003c/b>\u003cb class=\"key\">하는가\u003c/b>이다. 글은 답을 주지 않고 \u003cb class=\"key\">질문\u003c/b>으로 끝맺으며 여운을 남긴다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 첫 번째 문장과 두 번째 문장이에요. 영양학자들의 눈에는 고기와 생선이 영양가 있는 식단의 주식으로 오랫동안 여겨져 왔다고 통념을 제시하죠. 그런데 두 번째 문장에서 however가 나오면서 이러한 전통적 관점이 빠르게 변하고 있다고 흐름을 뒤집어요. 오래된 믿음과 그에 대한 반박을 나란히 놓은 아주 중요한 대목입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 세 번째와 네 번째 문장이에요. 음식 전문가들은 고기를 너무 많이 먹으면 건강이 나빠진다고 경고하고, 생선은 호수와 강과 바다의 오염 때문에 독성 물질로 가득하다고 말하죠. 더욱이 치즈와 우유 같은 유제품에는 콜레스테롤이 너무 많다고 전해집니다. 앞의 통념과 정반대되는 경고들이 구체적으로 이어지는 부분이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 다섯 번째와 여섯 번째 문장입니다. 유제품의 영양가는 소가 어떻게 사육되었고 유제품이 어떻게 가공되었는지에 따라 크게 달라진다고 덧붙여요. 심지어 과일과 채소까지 화학 비료와 살충제로 완전히 오염되었다고 여겨지죠. 경고의 범위가 모든 식품으로 넓어지는 단계예요.","hl":"f2"},{"n":7,"text":"마지막 단계는 일곱 번째 문장이에요. 이런 경고들이 우리를 위한 진정어린 관심에서 나온 것임을 인정하면서도, 우리에게 간단하지만 어려운 질문을 남긴다고 말하죠. 그 질문은 바로 그렇다면 도대체 무엇을 먹어야 하는가입니다. 글은 답을 주지 않고 질문으로 끝맺으면서 여운을 남겨요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 고기와 생선이 영양가 있는 식단의 주식으로 여겨져 왔다는 \u003cb class=\"key\">통념\u003c/b>을 제시하고, 두 번째 문장에서 however를 통해 그 관점이 빠르게 변하고 있다고 \u003cb class=\"key\">반박\u003c/b>한다. 주제에 해당하는 문장이 글 앞부분에 놓여 있으므로 \u003cb class=\"key\">두괄식\u003c/b>으로 볼 수 있다. 이어지는 세 번째부터 여섯 번째 문장은 모두 이 변화를 뒷받침하는 \u003cb class=\"key\">근거\u003c/b>이자 예시다. 마지막 문장은 답 대신 질문을 던져 앞의 내용을 \u003cb class=\"key\">압축\u003c/b>하며 글을 닫는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>however (2)\u003c/b>\u003cspan>통념을 뒤집는 전환\u003c/span>\u003cb>due to (3)\u003c/b>\u003cspan>오염이라는 원인 제시\u003c/span>\u003cb>Furthermore (4)\u003c/b>\u003cspan>경고의 추가·나열\u003c/span>\u003cb>depending on (5)\u003c/b>\u003cspan>조건에 따른 차이 제시\u003c/span>\u003cb>Even (6)\u003c/b>\u003cspan>경고 범위의 확대 강조\u003c/span>\u003cb>While (7)\u003c/b>\u003cspan>인정하며 결론으로 넘어가는 양보\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">have long been regarded as the staples\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">traditional point of view\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">is rapidly changing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Food experts are now warning\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these warnings\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>전통적 관점\u003c/th>\u003cth>전문가의 경고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>고기·생선은 영양가 있는 주식\u003c/td>\u003ctd>고기는 건강 악화, 생선은 독성 물질\u003c/td>\u003c/tr>\u003ctr>\u003ctd>유제품은 건강에 좋은 식품\u003c/td>\u003ctd>콜레스테롤 과다, 영양가도 들쭉날쭉\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과일·채소는 안전한 식품\u003c/td>\u003ctd>화학 비료와 살충제로 오염\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 통념 제시와 반박이에요. 첫 문장에서 오랫동안 굳어진 믿음을 보여 주고, 두 번째 문장에서 however로 그 믿음이 흔들린다고 바로 반박하죠. 그래서 주제문은 두 번째 문장이고, 전체 구조는 주제가 앞에 놓이는 두괄식으로 볼 수 있어요. 다만 마지막 문장이 질문 형태로 내용을 다시 압축하고 있어서, 결론까지 읽고 나서야 글의 문제의식이 완성됩니다.","hl":"ty"},{"n":9,"text":"신호어를 하나씩 짚어 볼게요. 두 번째 문장의 however는 통념을 뒤집는 전환 신호이고, 네 번째 문장의 Furthermore는 경고를 하나 더 추가하는 신호예요. 세 번째 문장의 due to는 오염이라는 원인을 제시하고, 여섯 번째 문장의 Even은 경고의 범위가 과일과 채소까지 확대된다는 점을 강조하죠. 마지막 문장의 While은 인정과 반전을 함께 하는 양보 표현이고, 다섯 번째 문장의 depending on은 조건에 따라 달라진다는 뜻을 전해 줍니다. 재진술도 눈여겨보세요. traditional point of view가 두 번째 문장에서 나오고, 마지막에는 these warnings로 다시 묶여 반복되죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>in the eyes of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 눈에는, ~이 보기에\u003c/span>\u003c/div>\u003cdiv>\u003cb>nutritionist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영양학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>regard A as B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B로 여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>staple\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주식, 주요 식품\u003c/span>\u003c/div>\u003cdiv>\u003cb>nutritious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>영양가 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>point of view\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>관점, 견해\u003c/span>\u003c/div>\u003cdiv>\u003cb>rapidly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>급속히, 빠르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>expert\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전문가\u003c/span>\u003c/div>\u003cdiv>\u003cb>warn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경고하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>consumer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소비자\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이어지다, 초래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>toxic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>독성의, 유독한\u003c/span>\u003c/div>\u003cdiv>\u003cb>substance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물질\u003c/span>\u003c/div>\u003cdiv>\u003cb>pollution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오염\u003c/span>\u003c/div>\u003cdiv>\u003cb>dairy product\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>유제품\u003c/span>\u003c/div>\u003cdiv>\u003cb>be reported to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>…라고 전해지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>contain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>함유하다, 포함하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cholesterol\u003c/b>\u003cem>명사\u003c/em>\u003cspan>콜레스테롤\u003c/span>\u003c/div>\u003cdiv>\u003cb>nutritional value\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>영양가\u003c/span>\u003c/div>\u003cdiv>\u003cb>vary\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다르다, 변하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>depend on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 달려 있다, ~에 따라 다르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>raise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기르다, 사육하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>process\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>category\u003c/b>\u003cem>명사\u003c/em>\u003cspan>범주, 부류\u003c/span>\u003c/div>\u003cdiv>\u003cb>thoroughly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히, 철저히\u003c/span>\u003c/div>\u003cdiv>\u003cb>contaminate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>오염시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chemical fertilizer\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>화학 비료\u003c/span>\u003c/div>\u003cdiv>\u003cb>pesticide\u003c/b>\u003cem>명사\u003c/em>\u003cspan>살충제\u003c/span>\u003c/div>\u003cdiv>\u003cb>with ~ at heart\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 진심으로 생각하며\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave A with B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A에게 B를 남기다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚을게요. regard A as B는 A를 B로 여기다라는 뜻이고, staple은 주식, nutritious는 영양가 있는이라는 뜻이에요. lead to는 초래하다, contaminate는 오염시키다, pesticide는 살충제라는 뜻이고, with our best interest at heart는 우리를 진심으로 생각하며라는 표현입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">traditional\u003c/b>\u003cspan class=\"m\">전통적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conventional\u003c/span>\u003cspan class=\"s\">customary\u003c/span>\u003cspan class=\"s\">long-standing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">modern\u003c/span>\u003cspan class=\"a\">novel\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rapidly\u003c/b>\u003cspan class=\"m\">급속히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quickly\u003c/span>\u003cspan class=\"s\">swiftly\u003c/span>\u003cspan class=\"s\">speedily\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003cspan class=\"a\">gradually\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">warn\u003c/b>\u003cspan class=\"m\">경고하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alert\u003c/span>\u003cspan class=\"s\">caution\u003c/span>\u003cspan class=\"s\">notify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reassure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">toxic\u003c/b>\u003cspan class=\"m\">독성의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">poisonous\u003c/span>\u003cspan class=\"s\">harmful\u003c/span>\u003cspan class=\"s\">noxious\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harmless\u003c/span>\u003cspan class=\"a\">safe\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contain\u003c/b>\u003cspan class=\"m\">함유하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">include\u003c/span>\u003cspan class=\"s\">hold\u003c/span>\u003cspan class=\"s\">comprise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003cspan class=\"a\">lack\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">thoroughly\u003c/b>\u003cspan class=\"m\">완전히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">completely\u003c/span>\u003cspan class=\"s\">entirely\u003c/span>\u003cspan class=\"s\">fully\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partially\u003c/span>\u003cspan class=\"a\">slightly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contaminate\u003c/b>\u003cspan class=\"m\">오염시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pollute\u003c/span>\u003cspan class=\"s\">taint\u003c/span>\u003cspan class=\"s\">infect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">purify\u003c/span>\u003cspan class=\"a\">cleanse\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. traditional은 conventional, customary와 가깝고 modern과 반대돼요. rapidly는 quickly, swiftly와 같은 뜻이고 slowly와 반대입니다. toxic은 poisonous, harmful과 비슷하고 harmless, safe와 반대되죠. contaminate는 pollute, taint와 같고 purify, cleanse와 반대되고, thoroughly는 completely, entirely와 같은 뜻으로 partially와 반대됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계의 영양학자들과 다른 과학자들 눈에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">eyes \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> nutritionists and other scientists around the globe,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고기와 생선은\u003c/span>\u003cspan class=\"en\">meat and fish\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오랫동안 여겨져 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">regarded \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영양가 있는 식단의 주식으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as\u003c/span> the staples of a nutritious diet.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전 세계의 영양학자들과 다른 과학자들 눈에는 고기와 생선은 영양가 있는 식단의 주식으로 오랫동안 여겨져 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 출발점으로, 고기와 생선이 좋은 음식이라는 \u003cb class=\"key\">전통적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>을 먼저 깔아 두는 문장이에요. 뒤에서 이 관점이 흔들린다는 것을 보여 주려고 오래된 통념을 일부러 소개하는 거죠. 핵심은 고기와 생선을 \u003cb class=\"key\">영양가 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">식단\u003c/b>의 주식으로 보아 왔다는 점입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현(~의 눈에는)\u003c/span> : In the eyes of + [사람·집단] (= in someone's view) : \"~의 눈에는, ~이 보기에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 수동태 (regard A as B)\u003c/span> : [주어] + have been + [[과거분사]](regarded) + as + [명사] : \"~로 오랫동안 여겨져 왔다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"In the eyes of nutritionists and other scientists around the globe, 전 세계의 영양학자들과 다른 과학자들 눈에는. meat and fish, 고기와 생선은. have long been regarded, 오랫동안 여겨져 왔다. as the staples of a nutritious diet, 영양가 있는 식단의 주식으로. 이 문장 전체를 해석하면, 전 세계의 영양학자들과 다른 과학자들 눈에는 고기와 생선은 영양가 있는 식단의 주식으로 오랫동안 여겨져 왔다.","hl":"m"},{"n":13,"text":"이 문장은 글의 출발점이에요. 고기와 생선이 좋은 음식이라는 전통적 관점을 먼저 깔아 두는 거죠. 뒤에서 이 관점이 흔들린다는 걸 알려 주려고 일부러 오래된 통념을 소개하는 겁니다. 핵심은 전통적 관점과 영양가 있는 식단이라는 표현이에요.","hl":"mn"},{"n":14,"text":"어법 포인트 첫 번째, In the eyes of는 '~의 눈에는'이라는 관용 표현이에요. 뒤에 사람이나 집단이 와서 판단의 주체를 나타내죠. 두 번째, have long been regarded는 현재완료 수동태입니다. 과거부터 지금까지 계속 여겨져 왔음을 보여 주는 형태예요. regard A as B가 수동태가 되면 A is regarded as B가 된다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 전통적인 관점은\u003c/span>\u003cspan class=\"en\">This traditional point of view,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">급속하게 변하고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">rapidly \u003c/span>\u003cspan class=\"tgt\">changing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 이러한 전통적인 관점은 급속하게 변하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 짧지만 글의 방향을 완전히 뒤집는 문장이에요. 앞에서 소개한 \u003cb class=\"key\">전통적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>이 더 이상 유지되지 않는다는 신호죠. however가 들어오면서 \u003cb class=\"key\">관점의 \u003c/b>\u003cb class=\"key\">전환\u003c/b>이 일어난다고 보면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 삽입(전환)\u003c/span> : [주어] + , however, + [동사] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + [[현재분사]](-ing) : \"급속하게 변하고 있다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"This traditional point of view, 이러한 전통적인 관점은. however, 그러나. is rapidly changing, 급속하게 변하고 있다. 이 문장 전체를 해석하면, 그러나 이러한 전통적인 관점은 급속하게 변하고 있다.","hl":"m"},{"n":16,"text":"짧은 문장이지만 글의 방향을 완전히 뒤집는 역할을 해요. 앞에서 소개한 전통적 관점이 더 이상 유지되지 않는다는 신호죠. 그래서 however가 들어오면서 관점의 전환이 일어난다고 보면 됩니다.","hl":"mn"},{"n":17,"text":"어법 포인트 첫 번째, however는 문장 중간에 삽입되어 앞 내용과 반대되는 흐름을 만들어요. 접속사가 아니라 접속부사라는 점도 꼭 챙겨 두세요. 두 번째, is rapidly changing은 현재진행형이에요. be동사에 -ing를 붙여서 변화가 진행 중임을 나타내죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식 전문가들은 이제 소비자들에게 경고한다\u003c/span>\u003cspan class=\"en\">Food experts \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">warning \u003c/span>\u003cspan class=\"tgt\">consumers \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 많은 고기를 먹는 것은 건강을 좋지 않게 한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">eating \u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">meat\u003c/span> leads to poor health\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 생선은 독성 물질로 가득 차 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">fish \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">full \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">toxic \u003c/span>\u003cspan class=\"tgt\">substances\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호수, 강, 바다의 오염 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">due \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">pollution\u003c/span> in our lakes, rivers and oceans.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">음식 전문가들은 소비자들에게 너무 많은 고기를 먹는 것은 건강을 좋지 않게 하고, 생선은 호수, 강, 바다의 오염 때문에 독성 물질로 가득 차있다고 경고한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 전환을 구체적인 내용으로 채워 주는 문장이에요. 고기 과다 섭취와 생선 오염이라는 두 가지 \u003cb class=\"key\">경고\u003c/b>가 나오고, 바다 오염이라는 \u003cb class=\"key\">근거\u003c/b>까지 함께 제시되죠. 전문가들의 경고와 그 이유가 나란히 제시되는 흐름으로 읽으면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">warn + 목적어 + that절\u003c/span> : warn + [목적어(사람)] + that + [완전한 절] : \"소비자들에게 ~라고 경고한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [[동명사]](eating) + [목적어] → 단수 주어 취급 : \"너무 많은 고기를 먹는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">that절의 병렬\u003c/span> : that + [절] + and that + [절] : \"그리고 생선은 독성 물질로 가득 차 있다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사구(이유)\u003c/span> : due to + [명사] (= because of) : \"오염 때문에\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Food experts are now warning consumers, 음식 전문가들은 이제 소비자들에게 경고한다. that eating too much meat leads to poor health, 너무 많은 고기를 먹는 것은 건강을 좋지 않게 한다고. and that fish is full of toxic substances, 그리고 생선은 독성 물질로 가득 차 있다고. due to the pollution in our lakes, rivers and oceans, 호수, 강, 바다의 오염 때문에. 이 문장 전체를 해석하면, 음식 전문가들은 소비자들에게 너무 많은 고기를 먹는 것은 건강을 좋지 않게 하고, 생선은 호수, 강, 바다의 오염 때문에 독성 물질로 가득 차있다고 경고한다.","hl":"m"},{"n":19,"text":"이 문장은 앞의 전환을 구체적인 내용으로 채워 주는 부분이에요. 고기 과다 섭취와 생선 오염이라는 두 가지 경고가 나오죠. 전문가들의 경고와 그 근거가 함께 제시된다는 흐름으로 읽으면 됩니다.","hl":"mn"},{"n":20,"text":"어법 포인트 첫 번째, warn은 목적어 다음에 that절을 데려와서 경고의 내용을 담아요. 두 번째, eating은 동명사 주어라서 단수로 취급하고 그래서 동사가 leads가 됩니다. 세 번째, and that은 앞의 that절과 병렬을 이루는 두 번째 that절이에요. 네 번째, due to는 '~때문에'라는 전치사구로 이유를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더욱이\u003c/span>\u003cspan class=\"en\">Furthermore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전통적인 유제품들은\u003c/span>\u003cspan class=\"en\">traditional dairy products\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치즈와 우유 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">cheese \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">milk\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지고 있다고 전해진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">reported \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">contain\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 많은 콜레스테롤을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">cholesterol\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">더욱이 치즈와 우유 같은 전통적인 유제품은 너무 많은 콜레스테롤을 가지고 있다고 전해진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 고기와 생선이 문제라고 했으니, 이제 경고의 대상이 유제품으로 넓어지는 문장이에요. 'be reported to'는 '~라고 전해진다'는 \u003cb class=\"key\">수동태\u003c/b> 표현으로, 전문가들의 우려가 \u003cb class=\"key\">유제품\u003c/b> 전반에 미치고 있음을 보여 줘요. 콜레스테롤이 많은 \u003cb class=\"key\">dairy \u003c/b>\u003cb class=\"key\">products\u003c/b>조차 안심할 수 없다는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">such as (예시 제시)\u003c/span> : [명사] + such as + [예시 명사] : \"치즈와 우유 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 (be reported to부정사)\u003c/span> : [주어] + be reported + [to contain (to부정사구)] : \"가지고 있다고 전해진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">too much + 불가산명사\u003c/span> : too much + [불가산명사] : \"너무 많은 콜레스테롤\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Furthermore, 더욱이. traditional dairy products, 전통적인 유제품들은. such as cheese and milk, 치즈와 우유 같은. are reported to contain, 가지고 있다고 전해진다. too much cholesterol, 너무 많은 콜레스테롤을. 이 문장 전체를 해석하면, 더욱이 치즈와 우유 같은 전통적인 유제품은 너무 많은 콜레스테롤을 가지고 있다고 전해진다.","hl":"m"},{"n":22,"text":"앞에서 고기와 생선이 문제라고 했죠. 이제는 유제품 차례예요. be reported to는 '~라고 전해진다'는 뜻으로, 전문가들의 경고가 유제품 전반으로 넓어지고 있다는 걸 보여 줘요. 콜레스테롤이 많은 dairy products도 안심할 수 없다는 거예요.","hl":"mn"},{"n":23,"text":"어법은 세 군데만 짚을게요. 첫 번째, such as cheese and milk에서 such as는 앞에 나온 dairy products를 구체적인 예로 풀어 주는 표현이에요. 두 번째, are reported to contain은 '사람들이 ~라고 보도한다'를 수동태로 바꾼 구문이에요. 원래 목적어였던 유제품이 주어 자리로 올라오고 남은 내용은 to부정사로 처리했죠. 세 번째, too much cholesterol에서 cholesterol은 셀 수 없는 불가산명사라서 many가 아니라 much를 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유제품들의 영양가는\u003c/span>\u003cspan class=\"en\">Their nutritional values\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 다르다\u003c/span>\u003cspan class=\"en\">vary greatly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 따라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">depending \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소가 어떻게 사육되었는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cows \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">raised\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 유제품이 어떻게 가공되었는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">dairy \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">processed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">유제품들의 영양가는 소가 어떻게 사육되었는지, 유제품이 어떻게 가공되었는지에 따라 매우 다르다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유제품의 영양가는 제품 자체보다 \u003cb class=\"key\">사육\u003c/b>과 \u003cb class=\"key\">가공\u003c/b> 과정에 달려 있다는 뜻이에요. 'depending on'이 '~에 따라'라는 조건을 붙여 주고, 두 개의 \u003cb class=\"key\">간접의문문\u003c/b>이 그 조건의 내용을 구체화해요. 겉으로 보이는 영양가는 비슷해도 속을 들여다보면 \u003cb class=\"key\">편차\u003c/b>가 크다는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (현재분사)\u003c/span> : [주절] + , depending on + [의문사절] : \"~에 따라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사 + 주어 + 동사)\u003c/span> : how + [주어] + [동사] : \"소가 어떻게 사육되었는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문의 병렬 구조\u003c/span> : how + [주어] + [동사] + and + how + [주어] + [동사] : \"그리고 유제품이 어떻게 가공되었는지\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Their nutritional values, 유제품들의 영양가는. vary greatly, 매우 다르다. depending on, ~에 따라. how the cows were raised, 소가 어떻게 사육되었는지. and how the dairy was processed, 그리고 유제품이 어떻게 가공되었는지. 이 문장 전체를 해석하면, 유제품들의 영양가는 소가 어떻게 사육되었는지, 유제품이 어떻게 가공되었는지에 따라 매우 다르다.","hl":"m"},{"n":25,"text":"영양가는 제품 자체보다 사육과 가공 과정에 달려 있다는 뜻이에요. depending on이 '~에 따라'라는 조건을 붙여 주고, 뒤에 오는 두 개의 간접의문문이 그 조건의 내용을 구체적으로 채워 줘요. 겉으로 보기엔 비슷해도 속을 들여다보면 편차가 크다는 거죠.","hl":"mn"},{"n":26,"text":"첫 번째, depending on은 동사 depend의 현재분사 형태로 주절에 '~에 따라'라는 조건을 붙여 주는 분사구문이에요. 접속사와 주어가 생략되고 분사만 남은 형태죠. 두 번째, how the cows were raised에서 의문사가 문장 속으로 들어간 간접의문문은 의문사 다음에 주어, 그다음 동사 어순을 지켜요. 소는 기르는 대상이니까 were raised라는 수동태를 썼고요. 세 번째, and how the dairy was processed를 보면 두 개의 간접의문문이 and로 병렬을 이루고 있어요. 두 번째 절도 어순을 똑같이 지켰는지 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 과일과 채소류도\u003c/span>\u003cspan class=\"en\">Even the fruit and vegetable category\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제 여겨진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">thought \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 오염되었다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">thoroughly \u003c/span>\u003cspan class=\"tgt\">contaminated\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화학비료와 살충제에 의해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">chemical \u003c/span>\u003cspan class=\"tgt\">fertilizers \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">pesticides\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심지어 과일과 채소류도 화학비료와 살충제에 의해 완전히 오염되었다고 여겨진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 건강식의 대표인 과일과 채소까지 \u003cb class=\"key\">오염\u003c/b>되었다는 경고예요. 'Even'이 '심지어'로 앞의 부정적 흐름을 극대화하고, 'is thought to be'는 '~라고 \u003cb class=\"key\">여겨지다\u003c/b>'라는 수동 표현이에요. 결국 모든 식품군이 의심받는 상황을 보여 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be thought to부정사)\u003c/span> : [주어] + be thought + [to be contaminated (to부정사구)] : \"완전히 오염되었다고 여겨진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태의 행위자 (by + 명사)\u003c/span> : be + [과거분사] + by + [행위자] : \"화학비료와 살충제에 의해\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Even the fruit and vegetable category, 심지어 과일과 채소류도. is now thought, 이제 여겨진다. to be thoroughly contaminated, 완전히 오염되었다고. by chemical fertilizers and pesticides, 화학비료와 살충제에 의해. 이 문장 전체를 해석하면, 심지어 과일과 채소류도 화학비료와 살충제에 의해 완전히 오염되었다고 여겨진다.","hl":"m"},{"n":28,"text":"건강식의 대표인 과일과 채소까지 오염되었다는 경고예요. Even이 '심지어'로 앞의 부정적인 흐름을 극대화하고, is thought to be는 '~라고 여겨지다'라는 수동 표현이에요. 결국 모든 식품군이 의심받는 상황이라는 걸 보여 주죠.","hl":"mn"},{"n":29,"text":"첫 번째, is now thought to be thoroughly contaminated는 '사람들이 ~라고 생각한다'를 수동태로 바꾼 구문이에요. think의 목적어였던 과일과 채소류가 주어로 올라오고 나머지는 to부정사로 남았죠. 두 번째, by chemical fertilizers and pesticides에서 수동태의 행위자는 전치사 by로 나타내요. 오염을 일으키는 주체가 화학비료와 살충제라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 경고들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While\u003c/span> these warnings\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분명히 만들어지고(전해지고) 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">clearly \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">made\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 최선을 염두에 두고, 진정어린 관심에서\u003c/span>\u003cspan class=\"en\">with our best interest at heart,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 우리에게 남겨 놓는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">leave \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">간단하지만 어려운 질문을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">simple \u003c/span>\u003cspan class=\"tgt\">yet \u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003cspan class=\"tgt\">question\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇다면 도대체 무엇을 먹어야 하는가?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">What, \u003c/span>\u003cspan class=\"tgt\">then, \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">eat?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 경고들은 진정어린 관심에서 만들어지고(전해지고) 있기는 하지만, 우리에게 간단하지만 어려운 질문을 남겨 놓는다. 그렇다면 도대체 무엇을 먹어야 하는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞의 경고들을 인정하면서도 결국 ‘무엇을 먹어야 하는가’라는 \u003cb class=\"key\">본질적 \u003c/b>\u003cb class=\"key\">질문\u003c/b>을 던지며 글의 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">제기\u003c/b>를 마무리한다. ‘with our best interest at heart’는 ‘우리의 최선을 염두에 두고’, 즉 \u003cb class=\"key\">진정어린 \u003c/b>\u003cb class=\"key\">관심\u003c/b>에서라는 뜻이다. 콜론 뒤의 의문문은 앞의 내용을 바탕으로 한 \u003cb class=\"key\">질문\u003c/b>을 구체적으로 제시한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사 while\u003c/span> : While + [주어] + [동사] ~, [주절] : \"~이기는 하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행 수동태\u003c/span> : [be동사] + being + [과거분사] : \"분명히 만들어지고(전해지고) 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">leave + 목적어 + with + 명사\u003c/span> : leave + [목적어] + with + [명사] : \"우리에게 간단하지만 어려운 질문을 남겨 놓는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">의문사 + 조동사 도치\u003c/span> : [의문사] + [조동사] + [주어] + [동사]? : \"그렇다면 도대체 무엇을 먹어야 하는가?\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"While these warnings, 이러한 경고들이. are clearly being made, 분명히 만들어지고(전해지고) 있다. with our best interest at heart, 우리의 최선을 염두에 두고, 진정어린 관심에서. they leave us with, 그것들은 우리에게 남겨 놓는다. a simple yet difficult question, 간단하지만 어려운 질문을. What, then, should we eat?, 그렇다면 도대체 무엇을 먹어야 하는가?. 이 문장 전체를 해석하면, 이러한 경고들은 진정어린 관심에서 만들어지고(전해지고) 있기는 하지만, 우리에게 간단하지만 어려운 질문을 남겨 놓는다. 그렇다면 도대체 무엇을 먹어야 하는가?","hl":"m"},{"n":31,"text":"이 문장은 앞에서 나온 여러 경고를 인정하면서도 결국 무엇을 먹어야 하는가라는 본질적 질문을 던져요. 다시 말해 글의 문제 제기를 마무리하는 문장이죠. with our best interest at heart는 우리의 최선을 염두에 두고, 즉 진정어린 관심에서라는 뜻이고, 콜론 뒤의 의문문은 그런 질문을 구체적으로 보여 줍니다.","hl":"mn"},{"n":32,"text":"어법 포인트를 짚어 볼게요. 첫 번째, while은 여기서 ‘~동안에’가 아니라 ‘~이지만’이라는 양보의 뜻으로 쓰였어요. 두 번째, are clearly being made는 경고가 만들어지는 대상이어서 수동이고 지금 계속되는 상황이라 진행형이 함께 쓰인 현재진행 수동태예요. 세 번째, they leave us with a simple yet difficult question에서 leave는 ‘남기다’라는 뜻으로 목적어 us 뒤에 with와 함께 남겨지는 대상이 오는 구조입니다. 네 번째, What then should we eat는 의문사가 앞에 나오고 조동사 should가 주어 앞으로 이동하는 도치가 일어난 직접의문문이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>영양학자들은 오랫동안 고기와 생선을 영양가 있는 식단의 \u003cb class=\"key\">주식\u003c/b>으로 여겨 왔다.\u003c/li>\u003cli>그러나 이러한 \u003cb class=\"key\">전통적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>은 빠르게 바뀌고 있으며, 전문가들은 고기·생선·유제품이 건강에 해롭다고 \u003cb class=\"key\">경고\u003c/b>한다.\u003c/li>\u003cli>유제품의 영양가는 \u003cb class=\"key\">사육과 \u003c/b>\u003cb class=\"key\">가공 \u003c/b>\u003cb class=\"key\">방식\u003c/b>에 따라 다르고, 과일과 채소도 화학 비료와 살충제로 \u003cb class=\"key\">오염\u003c/b>되었다고 여겨진다.\u003c/li>\u003cli>이 경고들은 우리를 위한 진정어린 관심에서 나왔지만, 결국 \u003cb class=\"key\">무엇을 \u003c/b>\u003cb class=\"key\">먹어야 \u003c/b>\u003cb class=\"key\">하는가\u003c/b>라는 어려운 질문을 남긴다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Food experts' warnings about meat, fish, dairy, and produce are overturning the traditional view of a nutritious diet, leaving us with the simple yet difficult question of what to eat.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">영양학자와 음식 전문가들이 고기·생선·유제품·과일·채소까지 모두 건강에 해롭다고 경고하면서, 오랫동안 굳어진 \u003cb class=\"key\">전통적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>은 빠르게 흔들리고 있다. 결국 우리는 \u003cb class=\"key\">무엇을 \u003c/b>\u003cb class=\"key\">먹어야 \u003c/b>\u003cb class=\"key\">하는가\u003c/b>라는 간단하지만 어려운 질문을 안게 된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글은 좋다고 알려진 음식들이 오히려 경고의 대상이 되면서 우리가 무엇을 먹어야 하는지 묻게 되는 상황을 보여 줬어요. 통념과 반박, 그리고 구체적인 근거가 어떻게 이어지는지 구조로 정리해 두면 시험장에서 훨씬 빠르게 읽힙니다. 마지막 질문 문장은 새로운 내용이 아니라 앞의 경고들을 압축한 결론이라는 점도 꼭 기억해 두세요. 오늘도 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
