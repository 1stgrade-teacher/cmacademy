<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구문사고력 13강 reading02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"구문사고력 13강 reading02","audioDir":"passage2_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">13강\u003cbr>reading02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>How People Changed Their Behavior and Buildings to Avoid Taxes\u003c/h1>\u003ch2>사람들이 세금을 피하려고 행동과 건축을 바꾼 방식\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>역사적으로 사람들은 세금을 피하기 위해 자신의 행동을 바꾸어 왔다. 투스카니의 무염 빵, 암스테르담의 좁고 높은 집, 프랑스의 \u003cb class=\"key\">망사르드 \u003c/b>\u003cb class=\"key\">지붕\u003c/b>은 모두 세금의 \u003cb class=\"key\">과세 \u003c/b>\u003cb class=\"key\">기준\u003c/b>을 피하려는 시도가 낳은 결과이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Throughout history, people have changed their behavior and even their buildings in order to avoid taxes.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 세금을 피하려는 사람들의 행동이 빵과 집의 모양까지 바꾼 흥미로운 지문을 함께 읽어 볼 거예요. 이 글은 역사적으로 사람들이 세금을 피하기 위해 행동을 바꾸어 왔다는 주장으로 시작합니다. 투스카니의 빵, 암스테르담의 집, 프랑스의 망사르드 지붕, 이 세 가지 사례가 하나의 주장을 어떻게 받쳐 주는지 보시면 돼요. 요지는 결국 사람들이 세금을 피하려고 행동과 건축 방식을 바꾸었다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">세금(tax)은 정부가 공공서비스를 제공하기 위해 걷는 돈이에요. 그런데 세금은 부과되는 방식에 따라 사람들의 행동을 바꿔 놓죠. 합법적으로 세금 부담을 피하는 것을 \u003cb class=\"key\">조세 \u003c/b>\u003cb class=\"key\">회피\u003c/b>(tax avoidance)라고 하고, 기준 자체를 속이면 탈세(tax evasion)가 돼요. \u003cb class=\"key\">재산세\u003c/b>(property tax)는 집의 가치나 면적, 폭, 방의 개수처럼 눈에 보이는 기준으로 매겨지기 때문에, 사람들은 그 기준을 줄이는 쪽으로 집을 짓거나 고쳤어요. 마치 뷔페에서 접시 크기로 가격을 매기면 손님들이 작은 접시를 고르는 것과 같은 이치죠. \u003cb class=\"key\">망사르드 \u003c/b>\u003cb class=\"key\">지붕\u003c/b>(mansard roof)은 경사가 두 번 꺾인 프랑스식 지붕으로, 지붕 아래 공간을 다락방(attic)으로 활용할 수 있는 구조예요.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 조금만 짚어 볼게요. 세금은 정부가 공공서비스를 위해 걷는 돈인데, 부과되는 방식에 따라 사람들의 행동이 달라져요. 합법적으로 세금 부담을 피하는 것을 조세 회피라고 부르고, 기준 자체를 속이면 탈세가 되죠. 재산세는 집의 가치나 면적, 폭, 방의 개수처럼 눈에 보이는 기준으로 매겨지기 때문에 사람들은 그 기준을 줄이는 쪽으로 집을 지었어요. 뷔페에서 접시 크기로 가격을 매기면 손님들이 작은 접시를 고르는 것과 똑같은 이치예요. 그리고 망사르드 지붕은 경사가 두 번 꺾인 프랑스식 지붕으로, 지붕 아래 공간을 다락방으로 쓸 수 있는 구조랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>주제 제시\u003csmall>도입·주장 · 문장 1\u003c/small>\u003c/h4>\u003cp>글은 '역사적으로 사람들은 세금을 피하기 위해 \u003cb class=\"key\">행동을 \u003c/b>\u003cb class=\"key\">바꾸어\u003c/b> 왔다'는 한 문장으로 시작해요. 이 문장이 글 전체를 이끄는 \u003cb class=\"key\">주제문\u003c/b> 역할을 하죠. 뒤에 이어질 이야기가 모두 이 주장을 뒷받침하는 사례라는 점을 미리 알려 주는 거예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>소금세와 빵\u003csmall>예시 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>몇 세기 전 투스카니의 공작이 소금에 세금을 \u003cb class=\"key\">부과\u003c/b>했어요. 그러자 제빵업자들은 반발 대신 조리법에서 \u003cb class=\"key\">소금을 \u003c/b>\u003cb class=\"key\">없애는\u003c/b> 방식으로 응수했죠. 그 결과 오늘날 우리가 즐겨 먹는 토스카나의 맛있는 빵이 탄생했고, 이것이 첫 번째 사례예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>암스테르담의 집\u003csmall>예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>두 번째 사례는 암스테르담의 오래된 집들이에요. 직접 방문해 보면 그 집들이 거의 다 \u003cb class=\"key\">좁고 \u003c/b>\u003cb class=\"key\">높다\u003c/b>는 것을 알 수 있죠. 이유는 집의 \u003cb class=\"key\">폭\u003c/b>을 기준으로 매긴 재산세를 최소화하기 위해서였어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>망사르드 지붕\u003csmall>예시 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>세 번째 사례는 프랑스의 \u003cb class=\"key\">망사르드 \u003c/b>\u003cb class=\"key\">지붕\u003c/b> 발명이에요. 재산세가 흔히 방의 개수에 부과되었기 때문에 2층이나 3층의 방도 1층 방처럼 \u003cb class=\"key\">과세 \u003c/b>\u003cb class=\"key\">대상\u003c/b>으로 여겨졌죠. 그러나 3층에 망사르드 지붕을 만들어 방을 두면 그 방들은 다락방의 일부로 간주되어 세금이 \u003cb class=\"key\">부과되지 \u003c/b>\u003cb class=\"key\">않았\u003c/b>어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문이 어떤 순서로 흘러가는지, 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 문장을 봐요. 역사적으로 사람들이 세금을 피하려고 행동을 바꾸어 왔다는 주장이 아주 앞자리에 나옵니다. 이 문장이 글 전체를 이끄는 주제문이에요. 뒤에 나오는 사례들은 모두 이 주장을 받쳐 주는 재료라는 점을 꼭 기억해 두세요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 투스카니의 소금세 이야기예요. 공작이 소금에 세금을 부과하자, 제빵업자들은 싸우지 않고 조리법에서 소금을 없애는 쪽으로 응수했어요. 그 결과 오늘날 우리가 즐겨 먹는 맛있는 토스카나 빵이 탄생했죠. 세금 하나가 빵의 맛을 바꾼 셈이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 암스테르담의 집들이에요. 여러분이 암스테르담을 방문하면 오래된 집들이 거의 다 좁고 높다는 것을 금방 알아챌 거예요. 집의 폭을 기준으로 매긴 재산세를 최소화하려고 일부러 그렇게 지은 거죠. 세금 기준이 건물의 모양을 결정한 아주 좋은 사례입니다.","hl":"f2"},{"n":7,"text":"마지막 단계는 프랑스의 망사르드 지붕이에요. 재산세가 흔히 방의 개수에 부과되었기 때문에 second floor나 third floor의 방도 ground floor의 방처럼 과세 대상으로 여겨졌어요. 그런데 third floor에 망사르드 지붕을 얹어 방을 만들면, 그 방들은 다락방의 일부로 간주되어 세금이 부과되지 않았어요. 같은 방이라도 지붕 설계 하나로 과세 대상이 아니게 된 거죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 글 전체를 관통하는 \u003cb class=\"key\">주제문\u003c/b>이 먼저 나오고, 이후 세 개의 사례가 차례로 이어지는 \u003cb class=\"key\">두괄식\u003c/b> 구조예요. 사례마다 '어떤 세금이 어떤 \u003cb class=\"key\">과세 \u003c/b>\u003cb class=\"key\">기준\u003c/b>으로 매겨졌는지, 그리고 사람들이 그 기준을 어떻게 피했는지'가 반복되죠. 소금세, 주택 폭 세금, 방 개수 세금이라는 서로 다른 사례가 모두 같은 주장을 뒷받침하는 \u003cb class=\"key\">예시\u003c/b>로 쓰였어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Throughout history (1)\u003c/b>\u003cspan>시간 범위를 넓혀 도입을 여는 신호\u003c/span>\u003cb>responded by (3)\u003c/b>\u003cspan>세금에 대한 반응과 결과를 연결\u003c/span>\u003cb>If you visit (4)\u003c/b>\u003cspan>독자를 끌어들여 예시를 도입\u003c/span>\u003cb>Consider (6)\u003c/b>\u003cspan>새로운 사례 추가를 요청\u003c/span>\u003cb>therefore (7)\u003c/b>\u003cspan>인과 관계를 이끄는 신호\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>앞의 내용을 뒤집는 전환 신호\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">changed their behavior\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">responded by eliminating salt in their recipes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">were constructed that way\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">were considered to be part of an attic and not taxed\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"전개 방식을 보면, 이 글은 하나의 주장을 세 개의 사례로 뒷받침하는 예시 구조예요. 주제문이 맨 앞에 나오고 사례가 뒤따르니까 두괄식이라고 부릅니다. 그래서 첫 문장만 정확히 잡아도 글의 절반은 이해한 셈이에요. 사례가 세 개나 나오니까 각 사례의 기준과 결과를 짝지어 정리해 두면 좋아요.","hl":"ty"},{"n":9,"text":"신호어도 꼭 확인해 볼게요. 첫 번째 문장의 Throughout history는 시간 범위를 넓게 제시하면서 도입을 열고, 세 번째 문장의 responded by는 세금에 대한 반응과 결과를 연결해 줍니다. 여섯 번째 문장의 Consider는 새로운 사례를 추가하라는 신호이고, 일곱 번째 문장의 therefore는 인과를, 여덟 번째 문장의 But은 앞의 내용을 뒤집는 전환을 알려 줘요. 그리고 changed their behavior, were constructed that way, were considered to be part of an attic처럼 같은 개념을 바꿔 말하는 표현이 반복되는 것도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>throughout\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 통틀어, ~동안 내내\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다, 회피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tax\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세금\u003c/span>\u003c/div>\u003cdiv>\u003cb>century\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세기\u003c/span>\u003c/div>\u003cdiv>\u003cb>Duke\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공작\u003c/span>\u003c/div>\u003cdiv>\u003cb>impose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부과하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>baker\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제빵업자\u003c/span>\u003c/div>\u003cdiv>\u003cb>respond\u003c/b>\u003cem>동사\u003c/em>\u003cspan>응수하다, 반응하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>eliminate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>없애다, 제거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recipe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조리법\u003c/span>\u003c/div>\u003cdiv>\u003cb>delicious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>맛있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>notice\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아채다, 주목하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>almost\u003c/b>\u003cem>부사\u003c/em>\u003cspan>거의\u003c/span>\u003c/div>\u003cdiv>\u003cb>narrow\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>좁은\u003c/span>\u003c/div>\u003cdiv>\u003cb>construct\u003c/b>\u003cem>동사\u003c/em>\u003cspan>건축하다, 짓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>minimize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>최소화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>property\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재산, 부동산\u003c/span>\u003c/div>\u003cdiv>\u003cb>be based on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 근거하다, ~을 기준으로 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>width\u003c/b>\u003cem>명사\u003c/em>\u003cspan>폭, 너비\u003c/span>\u003c/div>\u003cdiv>\u003cb>architectural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>건축의\u003c/span>\u003c/div>\u003cdiv>\u003cb>invention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발명\u003c/span>\u003c/div>\u003cdiv>\u003cb>mansard roof\u003c/b>\u003cem>명사\u003c/em>\u003cspan>망사르드 지붕\u003c/span>\u003c/div>\u003cdiv>\u003cb>often\u003c/b>\u003cem>부사\u003c/em>\u003cspan>흔히, 자주\u003c/span>\u003c/div>\u003cdiv>\u003cb>therefore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>따라서, 그러므로\u003c/span>\u003c/div>\u003cdiv>\u003cb>ratable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>과세할 수 있는, 평가 대상이 되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>ground floor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>1층\u003c/span>\u003c/div>\u003cdiv>\u003cb>be considered to be\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 여겨지다, 간주되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>attic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다락방\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚고 갈게요. impose는 세금을 부과하다, eliminate는 없애다, minimize는 최소화하다는 뜻이에요. ratable은 세금을 매길 수 있는 대상이라는 뜻이고, attic은 다락방을 가리킵니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">avoid\u003c/b>\u003cspan class=\"m\">피하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">evade\u003c/span>\u003cspan class=\"s\">escape\u003c/span>\u003cspan class=\"s\">dodge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">face\u003c/span>\u003cspan class=\"a\">confront\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">impose\u003c/b>\u003cspan class=\"m\">부과하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">levy\u003c/span>\u003cspan class=\"s\">charge\u003c/span>\u003cspan class=\"s\">enforce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lift\u003c/span>\u003cspan class=\"a\">abolish\u003c/span>\u003cspan class=\"a\">remove\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">eliminate\u003c/b>\u003cspan class=\"m\">없애다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">remove\u003c/span>\u003cspan class=\"s\">eradicate\u003c/span>\u003cspan class=\"s\">get rid of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">add\u003c/span>\u003cspan class=\"a\">include\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">minimize\u003c/b>\u003cspan class=\"m\">최소화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reduce\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">maximize\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">expand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">respond\u003c/b>\u003cspan class=\"m\">응수하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">react\u003c/span>\u003cspan class=\"s\">reply\u003c/span>\u003cspan class=\"s\">answer\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">disregard\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">consider\u003c/b>\u003cspan class=\"m\">여기다, 간주하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">regard\u003c/span>\u003cspan class=\"s\">deem\u003c/span>\u003cspan class=\"s\">view\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">narrow\u003c/b>\u003cspan class=\"m\">좁은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tight\u003c/span>\u003cspan class=\"s\">slender\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wide\u003c/span>\u003cspan class=\"a\">broad\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">construct\u003c/b>\u003cspan class=\"m\">건축하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">build\u003c/span>\u003cspan class=\"s\">erect\u003c/span>\u003cspan class=\"s\">raise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">demolish\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘는 동의어와 반의어로 함께 외워 두세요. avoid는 evade, escape와 가깝고 face, confront와 반대돼요. impose는 levy, charge와 비슷하고 lift, abolish와 반대입니다. eliminate는 remove, eradicate와 가깝고 add, include와 반대되고, minimize는 reduce, lessen과 가깝고 maximize와 반대예요. narrow는 wide, broad의 반대말이고, respond는 react, reply와 비슷하다는 점도 함께 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역사 전반에 걸쳐\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Throughout \u003c/span>\u003cspan class=\"tgt\">history,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 바꾸어왔다\u003c/span>\u003cspan class=\"en\">people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">changed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 행동을\u003c/span>\u003cspan class=\"en\">their behavior\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세금을 피하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">avoid \u003c/span>\u003cspan class=\"tgt\">taxes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">역사적으로 사람들은 세금을 피하기 위해 그들의 행동을 바꾸어왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 \u003cb class=\"key\">주제문\u003c/b>으로, 세금을 피하려는 \u003cb class=\"key\">목적\u003c/b> 때문에 사람들이 행동을 바꾸어 왔다는 큰 흐름을 먼저 제시해요. 뒤에 이어지는 투스카니 빵과 암스테르담 집, 맨사드 지붕 사례를 모두 끌어안는 \u003cb class=\"key\">총론\u003c/b> 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시간)\u003c/span> : [전치사 + 명사]로 문장 전체를 수식하는 부사구 : \"역사 전반에 걸쳐\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료(have + p.p.)\u003c/span> : [have/has + 과거분사]로 과거부터 현재까지의 변화나 지속을 나타냄 : \"바꾸어왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to + 동사원형]으로 목적을 나타내는 부사구 : \"세금을 피하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Throughout history, 역사 전반에 걸쳐. people have changed, 사람들은 바꾸어왔다. their behavior, 그들의 행동을. to avoid taxes, 세금을 피하기 위해. 이 문장 전체를 해석하면, 역사적으로 사람들은 세금을 피하기 위해 그들의 행동을 바꾸어왔다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 주제문이에요. 세금을 피하려는 목적 때문에 사람들이 행동을 바꾸어 왔다는 큰 흐름을 먼저 제시하는 총론이죠. 그래서 뒤에 나오는 투스카니 빵과 암스테르담 집, 맨사드 지붕 사례가 모두 이 주제를 뒷받침합니다.","hl":"mn"},{"n":14,"text":"첫 번째로 Throughout history는 시간을 나타내는 전치사구이고, 문장 앞에서 배경을 알려 주는 부사어로 쓰였어요. 두 번째로 have changed는 현재완료로, 과거의 변화가 현재까지 이어지거나 현재와 관련됨을 보여 주죠. 세 번째로 to avoid taxes는 행동을 바꾼 목적을 설명하는 부사적 용법의 to부정사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 세기 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Centuries \u003c/span>\u003cspan class=\"tgt\">ago,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">투스카니의 공작은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Duke \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Tuscany\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세금을 부과했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">imposed \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">tax \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소금에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">salt\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇 세기 전에, 투스카니의 공작은 소금에 세금을 부과했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 첫 번째 역사적 사례의 배경이에요. 투스카니 공작이 소금에 세금을 매겼다는 사실이 뒤에 나오는 제빵업자들의 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 일으키는 원인이 됩니다. impose a tax on은 에 세금을 부과하다라는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로 익혀야 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사구\u003c/span> : [명사구 + ago]로 과거의 특정 시점을 나타내는 부사구 : \"몇 세기 전에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">of 전치사구(소속)\u003c/span> : [명사 + of + 명사]로 소속이나 관계를 나타냄 : \"투스카니의 공작\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">impose A on B 구문\u003c/span> : [impose + 목적어 + on + 대상]으로 A를 B에 부과하다를 나타냄 : \"소금에 세금을 부과했다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Centuries ago, 몇 세기 전에. the Duke of Tuscany, 투스카니의 공작은. imposed a tax, 세금을 부과했다. on salt, 소금에. 이 문장 전체를 해석하면, 몇 세기 전에, 투스카니의 공작은 소금에 세금을 부과했다.","hl":"m"},{"n":16,"text":"이 문장은 첫 번째 역사적 사례의 배경이에요. 투스카니 공작이 소금에 세금을 매겼다는 사실이 뒤에 나오는 제빵업자들의 행동 변화를 일으키는 원인이 되죠. impose a tax on은 에 세금을 부과하다라는 관용 표현으로 익혀 두세요.","hl":"mn"},{"n":17,"text":"첫 번째로 Centuries ago는 과거의 특정 시점을 알려 주는 시간 부사구로, 사건의 배경을 제시합니다. 두 번째로 the Duke of Tuscany에서 of Tuscany는 공작이 투스카니에 속한 사람임을 보여 주는 소속 표현이에요. 세 번째로 imposed a tax on salt는 impose A on B, 즉 A를 B에 부과하다라는 3형식 어구이며, 통째로 익혀야 하는 관용 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">투스카니의 제빵업자들은\u003c/span>\u003cspan class=\"en\">Tuscan bakers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소금을 없앰으로써 응수했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">responded \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">eliminating \u003c/span>\u003cspan class=\"tgt\">salt \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 조리법에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">recipes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 우리에게 선사했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">giving \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛있는 토스카나의 빵을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">delicious \u003c/span>\u003cspan class=\"tgt\">Tuscan \u003c/span>\u003cspan class=\"tgt\">bread \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 오늘날 즐겨 먹는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">enjoy \u003c/span>\u003cspan class=\"tgt\">today\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">투스카니의 제빵업자들은 그들의 조리법에서 소금을 없애고 우리가 오늘날 즐겨 먹는 토스카나의 맛있는 빵을 우리에게 선사하는 것으로 응수했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 첫 번째 사례의 결과이자 주제를 뒷받침하는 핵심 예시예요. 세금 때문에 소금을 빼는 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 오늘날 토스카나 빵의 특징으로 이어졌다는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 보여 주죠. responded by eliminating은 소금을 없앰으로써 응수했다라는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">by + 동명사(수단·방법)\u003c/span> : [by + 동명사]로 함으로써라는 수단을 나타냄 : \"소금을 없앰으로써 응수했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 병렬 구조\u003c/span> : [동명사 A + and + 동명사 B]로 같은 역할의 동명사를 연결 : \"소금을 없애고 우리에게 주는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사 + (which/that) + 주어 + 동사]에서 목적격 관계대명사가 생략된 구조 : \"우리가 오늘날 즐기는 맛있는 토스카나의 빵\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Tuscan bakers, 투스카니의 제빵업자들은. responded by eliminating salt, 소금을 없앰으로써 응수했다. in their recipes, 그들의 조리법에서. and giving us, 그리고 우리에게 선사했다. the delicious Tuscan bread, 맛있는 토스카나의 빵을. we enjoy today, 우리가 오늘날 즐겨 먹는. 이 문장 전체를 해석하면, 투스카니의 제빵업자들은 그들의 조리법에서 소금을 없애고 우리가 오늘날 즐겨 먹는 토스카나의 맛있는 빵을 우리에게 선사하는 것으로 응수했다.","hl":"m"},{"n":19,"text":"이 문장은 첫 번째 사례의 결과이자 주제를 뒷받침하는 핵심 예시예요. 세금 때문에 소금을 빼는 행동 변화가 오늘날 토스카나 빵의 특징으로 이어졌다는 인과 관계를 보여 주죠. responded by eliminating은 소금을 없앰으로써 응수했다는 뜻의 관용 표현으로 기억해 두세요.","hl":"mn"},{"n":20,"text":"첫 번째로 responded by eliminating salt에서 by 뒤에는 동명사가 와서 수단을 나타내요. 두 번째로 eliminating과 giving은 and로 연결된 병렬 구조이고, 두 행동 모두 제빵업자들이 응수한 방법을 설명합니다. 세 번째로 the delicious Tuscan bread we enjoy today에는 목적격 관계대명사가 생략된 관계사절이 붙어 있어서 우리가 오늘날 즐기는 빵이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 암스테르담을 방문한다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">visit \u003c/span>\u003cspan class=\"tgt\">Amsterdam,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 알아챌 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">notice \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래된 집들이 모두 거의 다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">almost \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">old \u003c/span>\u003cspan class=\"tgt\">houses\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좁고 높다는 것을\u003c/span>\u003cspan class=\"en\">are narrow and tall.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분이 암스테르담을 방문한다면, 여러분은 오래된 집들이 모두 거의 다 좁고 높다는 것을 알아챌 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 암스테르담의 오래된 집들이 모두 좁고 높다는 \u003cb class=\"key\">관찰\u003c/b>을 먼저 던지는 문장이에요. 왜 그렇게 지었는지는 바로 다음 문장에서 밝혀지므로, 독자의 \u003cb class=\"key\">궁금증\u003c/b>을 만드는 도입 역할을 합니다. 뒤에 나올 재산세 이야기와 자연스럽게 연결되는 사례 제시예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 접속사 if (조건 부사절)\u003c/span> : If + [주어] + [동사] , [주어] + [조동사] + [동사] : \"여러분이 암스테르담을 방문한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사 notice + that절(목적어)\u003c/span> : notice + [that + 주어 + 동사] (명사절/목적어) : \"~라는 것을 알아챌 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">한정사 almost all + 복수명사\u003c/span> : almost all + [복수명사] + [복수동사] : \"오래된 집들이 모두 거의 다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"If you visit Amsterdam, 여러분이 암스테르담을 방문한다면. you will notice, 여러분은 알아챌 것이다. that almost all the old houses, 오래된 집들이 모두 거의 다. are narrow and tall, 좁고 높다는 것을. 이 문장 전체를 해석하면, 여러분이 암스테르담을 방문한다면, 여러분은 오래된 집들이 모두 거의 다 좁고 높다는 것을 알아챌 것이다.","hl":"m"},{"n":22,"text":"이 문장은 암스테르담에 가면 오래된 집들이 거의 다 좁고 높다는 사실을 알려 주고 있어요. 왜 그런지 궁금증을 만들면서 다음 문장으로 자연스럽게 이어지는 도입 역할을 합니다.","hl":"mn"},{"n":23,"text":"먼저 If you visit Amsterdam에서 if가 조건을 이끌고 있어요. 만약 방문한다면이라는 조건을 만들어 주죠. 두 번째로 you will notice that에서 notice가 that절을 목적어로 받아 무엇을 알아챈다는 뜻이 됩니다. 그 that절 안에 almost all the old houses are narrow and tall이 들어가서 알아챈 내용을 자세히 설명해 주고 있어요. 여기서 almost all이 거의 다라는 비율을 나타내고, 주어가 복수라서 동사가 are인 점도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 그런 식으로 건축되었는데,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u0 v>\u003c/div>","segs":[{"n":24,"text":"They were constructed that way, 그것들은 그런 식으로 건축되었는데. to minimize property taxes, 재산세를 최소화하기 위해서. which were based on, 이(재산세)는 ~을 근거로 한 것이었다. the width of a house, 집의 폭을. 이 문장 전체를 해석하면, 그것들은 재산세를 최소화하기 위해서 그런 식으로 건축되었는데, 이(재산세)는 집의 폭을 근거로 한 것이었다.","hl":"m"},{"n":25,"text":"이 문장은 집을 좁고 높게 지은 이유를 정확히 밝혀 줍니다. 바로 재산세를 줄이기 위해서였고, 그 세금은 집의 폭을 기준으로 매겨졌다는 거예요. 결국 세금을 피하려는 사람들의 선택이 건축 모습까지 바꾼 거죠.","hl":"mn"},{"n":26,"text":"먼저 They were constructed는 수동태예요. 집들이 스스로 지어지는 게 아니라 사람들에 의해 지어졌으니 be동사에 과거분사를 쓴 겁니다. 두 번째로 to minimize property taxes에서 to부정사가 목적을 나타내서 재산세를 최소화하기 위해서라고 해석해요. 세 번째로 which were based on은 계속적 관계대명사 which가 앞의 재산세를 받아서 추가 설명을 덧붙이는 구조예요. 그래서 이 재산세는 집의 폭을 근거로 한 것이었다고 이어서 읽으면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각해보자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Consider\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 건축 사례인,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"tgt\">architectural \u003c/span>\u003cspan class=\"tgt\">example, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">망사르드 지붕의 발명을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">invention \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mansard \u003c/span>\u003cspan class=\"tgt\">roof\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스의\u003c/span>\u003cspan class=\"en\">in France.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또 다른 건축 사례인, 프랑스의 망사르드 지붕의 발명을 생각해보자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 암스테르담 집 이야기에 이어 또 다른 \u003cb class=\"key\">건축\u003c/b> 사례를 꺼내는 문장이에요. 프랑스의 망사르드 지붕이 바로 그 예인데, 이는 세금을 피하려는 사람들의 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 건축 양식까지 바꿨다는 흐름을 이어 줍니다. 다음 문장의 세금 설명을 예고하는 \u003cb class=\"key\">도입\u003c/b> 역할도 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 (동사원형으로 시작)\u003c/span> : [동사원형] + [목적어] (명령문) : \"생각해보자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격 (콤마로 이어지는 명사구)\u003c/span> : [명사], [명사구] (동격) : \"또 다른 건축 사례인, 망사르드 지붕의 발명\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 of의 형용사적 용법\u003c/span> : [명사] + of + [명사] (앞 명사를 뒤에서 수식) : \"망사르드 지붕의 발명\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Consider, 생각해보자. another architectural example, 또 다른 건축 사례인. the invention of the mansard roof, 망사르드 지붕의 발명을. in France, 프랑스의. 이 문장 전체를 해석하면, 또 다른 건축 사례인, 프랑스의 망사르드 지붕의 발명을 생각해보자.","hl":"m"},{"n":28,"text":"앞에서 암스테르담 집 이야기를 했으니 이제 또 다른 건축 사례를 꺼내는 문장이에요. 프랑스의 망사르드 지붕 발명이 그 예라는 거죠. 세금을 피하려는 행동이 건축 양식까지 바꿨다는 흐름을 이어 주고 있습니다.","hl":"mn"},{"n":29,"text":"먼저 Consider는 주어가 생략된 명령문이에요. 동사원형으로 시작해서 생각해보자라고 제안하는 겁니다. 두 번째로 another architectural example과 the invention of the mansard roof가 동격 관계예요. 콤마 뒤가 앞의 사례를 구체적으로 설명해 주니까 그것인, 즉 또 다른 건축 사례인 망사르드 지붕의 발명이라고 해석하면 됩니다. 마지막으로 the invention of the mansard roof에서 of 뒤 명사가 앞 명사를 꾸며 주니 망사르드 지붕의 발명이라고 역순으로 읽어 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재산세는 흔히 부과되었다\u003c/span>\u003cspan class=\"en\">Property taxes \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">imposed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집에 있는 방의 개수에\u003c/span>\u003cspan class=\"en\">on the number of rooms in a house\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 따라서\u003c/span>\u003cspan class=\"en\">and, therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2층이나 3층에 있는 방들은\u003c/span>\u003cspan class=\"en\">rooms on the second or third floor\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">똑같이 과세할 수 있는 것으로 여겨졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">considered\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">ratable \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1층에 있는 방들처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ground \u003c/span>\u003cspan class=\"tgt\">floor\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">재산세는 흔히 집에 있는 방의 개수에 부과되었고, 따라서 2층이나 3층에 있는 방들도 1층에 있는 방들처럼 과세할 수 있는 것으로 여겨졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 망사르드 지붕이 세금을 피하는 데 왜 효과가 있었는지 설명하기 위한 배경 문장이에요. 당시 재산세는 집의 \u003cb class=\"key\">방 \u003c/b>\u003cb class=\"key\">개수\u003c/b>를 기준으로 매겨졌기 때문에, 위층 방도 아래층 방과 똑같이 \u003cb class=\"key\">과세 \u003c/b>\u003cb class=\"key\">대상\u003c/b>이 되었다는 점을 깔아 주고 있어요. 이 기준이 있어야 다음 문장에서 '다락방으로 처리하면 세금이 사라진다'는 반전이 자연스럽게 이해돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be + 과거분사)\u003c/span> : [주어 Property taxes] + [be동사 were] + [과거분사 imposed] + [전치사 on + 부과 기준] : \"흔히 부과되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(consider의 수동형)\u003c/span> : [주어 rooms] + [be동사 were] + [과거분사 considered] + [보어 as ratable] : \"여겨졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">원급 비교(as ~ as)와 대명사 those\u003c/span> : [as + 형용사 ratable + as + 비교 대상] / those = the rooms : \"1층에 있는 방들처럼 똑같이 과세할 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Property taxes were often imposed, 재산세는 흔히 부과되었다. on the number of rooms in a house, 집에 있는 방의 개수에. and, therefore, 그리고 따라서. rooms on the second or third floor, 2층이나 3층에 있는 방들은. were considered just as ratable, 똑같이 과세할 수 있는 것으로 여겨졌다. as those on the ground floor, 1층에 있는 방들처럼. 이 문장 전체를 해석하면, 재산세는 흔히 집에 있는 방의 개수에 부과되었고, 따라서 2층이나 3층에 있는 방들도 1층에 있는 방들처럼 과세할 수 있는 것으로 여겨졌다.","hl":"m"},{"n":31,"text":"이 문장은 앞으로 나올 망사르드 지붕 이야기의 배경을 깔아 주는 문장이에요. 당시 재산세는 집의 방 개수를 기준으로 매겨졌기 때문에 위층 방도 아래층 방과 똑같이 과세 대상이었다는 걸 먼저 알려 주죠. 이 기준을 기억해야 다음 문장에서 다락방으로 처리하면 세금이 사라진다는 반전이 이해가 됩니다.","hl":"mn"},{"n":32,"text":"첫 번째로 were often imposed를 보세요. 재산세는 스스로 부과하는 게 아니라 부과되는 대상이라서 수동태가 되었고, 세금 기준은 on 뒤에 붙습니다. 두 번째로 were considered인데, 사람들이 방들을 여기는 것이니 방들이 여겨지는 수동태예요. 세 번째로 just as ratable as those on the ground floor를 보면 as 형용사 as로 원급 비교를 하고 있고, just가 똑같이라는 뜻을 강조해요. 그리고 those는 앞에 나온 rooms를 대신 받는 대명사라는 점도 꼭 챙기세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 만약 망사르드 지붕이 만들어지면\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">mansard \u003c/span>\u003cspan class=\"tgt\">roof \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">constructed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3층에\u003c/span>\u003cspan class=\"en\">on the third floor,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 방들은 여겨졌다\u003c/span>\u003cspan class=\"en\">those rooms \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">considered \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다락방의 일부인 것으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">part \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">attic\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 세금이 부과되지 않았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">taxed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 3층에 망사르드 지붕이 만들어지면, 그 방들은 다락방의 일부로 간주되었고 세금이 부과되지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 '방 개수 과세' 규정을 이용해 사람들이 세금을 피한 방식을 보여 주는 핵심 문장이에요. 지붕을 3층에 얹는 순간 그 아래 방들은 세는 대상인 '방'이 아니라 \u003cb class=\"key\">다락방의 \u003c/b>\u003cb class=\"key\">일부\u003c/b>로 분류되어 과세에서 빠졌다는 거죠. 결국 세금을 피하려는 인간의 행동이 \u003cb class=\"key\">건축 \u003c/b>\u003cb class=\"key\">양식\u003c/b>까지 바꾸었다는 글 전체의 주제를 완성해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절(if) + 수동태\u003c/span> : [if + 주어 + be동사 + 과거분사], [주절] : \"만약 망사르드 지붕이 만들어지면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">consider A to be B의 수동태\u003c/span> : [A were considered] + [to be B] : \"다락방의 일부로 여겨졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사구(수동의 분사구 = and were not taxed)\u003c/span> : [and + (being) + 과거분사] = and it was not taxed : \"그리고 세금이 부과되지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"But if a mansard roof was constructed, 그러나 만약 망사르드 지붕이 만들어지면. on the third floor, 3층에. those rooms were considered, 그 방들은 여겨졌다. to be part of an attic, 다락방의 일부인 것으로. and not taxed, 그리고 세금이 부과되지 않았다. 이 문장 전체를 해석하면, 그러나 3층에 망사르드 지붕이 만들어지면, 그 방들은 다락방의 일부로 간주되었고 세금이 부과되지 않았다.","hl":"m"},{"n":34,"text":"이 문장은 앞 문장에서 말한 방 개수 과세 규정을 사람들이 어떻게 이용했는지 보여 주는 핵심 문장이에요. 지붕을 3층에 얹으면 그 아래 방들은 세는 대상인 방이 아니라 다락방의 일부로 분류되어 과세에서 빠졌다는 거죠. 결국 세금을 피하려는 행동이 건축 양식까지 바꾸었다는 이 글 전체의 주제를 완성해 줍니다.","hl":"mn"},{"n":35,"text":"첫 번째로 if a mansard roof was constructed를 보세요. if는 만약이라는 조건을 이끄는 부사절이고, 지붕은 사람들에 의해 지어지는 것이니 was constructed라는 수동태가 쓰였어요. 두 번째로 were considered to be part of an attic인데, 이건 consider A to be B가 수동태가 된 형태로 A는 B라고 여겨지다라는 뜻이 됩니다. 세 번째로 and not taxed는 and 뒤에서 주어와 be동사가 생략되고 과거분사만 남은 수동의 분사구예요. 방들은 세금이 부과되는 대상이니까 현재분사가 아니라 과거분사를 써야 한다는 점, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>역사적으로 사람들은 세금을 피하기 위해 \u003cb class=\"key\">행동을 \u003c/b>\u003cb class=\"key\">바꾸어\u003c/b> 왔다.\u003c/li>\u003cli>투스카니의 제빵업자들은 소금세를 피하려고 조리법에서 \u003cb class=\"key\">소금을 \u003c/b>\u003cb class=\"key\">없애\u003c/b> 오늘날의 토스카나 빵을 만들었다.\u003c/li>\u003cli>암스테르담의 집들은 폭을 기준으로 한 \u003cb class=\"key\">재산세\u003c/b>를 최소화하기 위해 좁고 높게 지어졌다.\u003c/li>\u003cli>프랑스에서는 방의 개수에 부과되는 세금을 피하려고 3층에 \u003cb class=\"key\">망사르드 \u003c/b>\u003cb class=\"key\">지붕\u003c/b>을 만들어 그 방들을 다락방으로 간주되게 했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Throughout history, people have changed their behavior and even their buildings in order to avoid taxes.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">역사적으로 사람들은 세금을 피하기 위해 자신의 행동을 바꾸어 왔다. 투스카니의 무염 빵, 암스테르담의 좁고 높은 집, 프랑스의 \u003cb class=\"key\">망사르드 \u003c/b>\u003cb class=\"key\">지붕\u003c/b>은 모두 세금의 \u003cb class=\"key\">과세 \u003c/b>\u003cb class=\"key\">기준\u003c/b>을 피하려는 시도가 낳은 결과이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 읽은 글은 세금이라는 아주 현실적인 이유가 사람들의 행동과 건축까지 바꾸었다는 이야기였어요. 소금을 뺀 빵, 좁고 높은 집, 다락방으로 둔갑한 방, 이 세 장면만 기억해도 주제는 저절로 떠오를 거예요. 앞으로 글을 읽을 때는 첫 문장에서 주제를 잡고, 사례마다 무엇이 기준이고 무엇이 달라졌는지 표시하면서 읽어 보세요. 오늘도 수고 많았습니다, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
