<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구문사고력 14강 reading02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"구문사고력 14강 reading02","audioDir":"passage2_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">14강\u003cbr>reading02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Technology Is Not to Blame\u003c/h1>\u003ch2>기술은 비난의 대상이 아니다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>글쓴이는 환경 문제를 기술 탓으로 돌리고 경제 성장을 막아 기술 진보를 늦추자는 \u003cb class=\"key\">통념\u003c/b>이 완전히 잘못되었다고 본다. 오염 자동차는 오염이 \u003cb class=\"key\">설계\u003c/b>에서 고려되지 않았기 때문에 만들어진 것이며, 기술은 사람들의 의지에 반응하지만 즉각적이지도 무료이지도 않다는 것이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Technology is not the true culprit, for it responds to people's will, though never instantaneously and never free.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 환경 문제와 기술의 관계를 다룬 지문을 함께 읽어 볼 거예요. 이 글은 기술을 무조건 비난하는 대중의 태도에 정면으로 반대하는 짧지만 단단한 글입니다. 핵심은 기술이 사람들의 의지에 반응하긴 하지만 즉각적이지도, 무료이지도 않다는 점이에요. 그럼 지문을 한 문장씩 따라가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">환경 문제가 생기면 우리는 흔히 \u003cb class=\"key\">기술\u003c/b>을 원인으로 지목하기 쉽습니다. 하지만 기술은 사회가 요구하는 것을 반영하는 도구에 가깝습니다. 공학자 engineers가 설계 design 단계에서 무엇을 중요한 문제로 인식하느냐에 따라 결과물이 달라지기 때문입니다. 예를 들어 스마트폰 배터리처럼, 우리가 오래 가는 배터리를 원한다고 해서 바로 다음 날 완성품이 나오지는 않습니다. \u003cb class=\"key\">연구\u003c/b>와 투자 investment, 그리고 시간이 필요하기 때문입니다. 이처럼 기술은 사람들의 \u003cb class=\"key\">의지\u003c/b> will에 반응 responsive하지만, 즉각적으로 instantaneously 움직이지도 않고 공짜 free가 아니라는 점을 기억해야 합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경을 짚어 볼게요. 우리는 환경 문제가 생기면 습관처럼 technology를 탓하죠. 그런데 technology는 사회가 요구하는 것을 반영하는 도구에 가까워요. engineers가 design 단계에서 무엇을 중요한 문제로 인식하느냐에 따라 결과물이 달라지거든요. 스마트폰 배터리도 오래 가는 걸 원한다고 바로 다음 날 완성되지 않죠. 연구와 investment, 그리고 시간이 필요하니까요. 이 점을 기억하면 이 글의 주장이 훨씬 쉽게 들어옵니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>대중의 통념\u003csmall>통념 · 문장 1\u003c/small>\u003c/h4>\u003cp>현재 대중의 태도는 두 갈래로 요약된다. 하나는 환경 문제를 초래한 것에 대해 \u003cb class=\"key\">기술\u003c/b>이나 기술자들을 비난하는 것이고, 다른 하나는 \u003cb class=\"key\">경제 \u003c/b>\u003cb class=\"key\">성장\u003c/b>을 막아 기술적 진보를 늦추자는 제안이다. 즉 원인도 기술, 해결책도 기술 억제로 보는 셈이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>정면 반박\u003csmall>주장 · 문장 2\u003c/small>\u003c/h4>\u003cp>글쓴이는 이러한 관점에 정면으로 반대한다. 이 관점을 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">잘못된\u003c/b> 것으로 규정하며 자신들의 입장을 분명히 밝힌다. 짧은 문장이지만 글 전체의 방향을 결정하는 \u003cb class=\"key\">주제문\u003c/b> 역할을 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>이유와 가능성\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>글쓴이는 기술이 오염을 낳은 이유를 \u003cb class=\"key\">인식\u003c/b>의 부재에서 찾는다. 공학자들이 설계할 때 오염을 고려해야 할 문제로 여기지 않았기 때문에 오염 자동차가 만들어졌다는 것이다. 이어서 오염을 일으키는 기술이 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">저렴\u003c/b>하다는 점을 인정하면서도, 이제 오염을 덜 시키는 차를 원한다는 결정이 내려졌으므로 \u003cb class=\"key\">청정 \u003c/b>\u003cb class=\"key\">자동차\u003c/b> 생산이 가능하다고 말한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>한계와 결론\u003csmall>결론 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>그러나 오염을 거의 일으키지 않는 차는 수년의 시간과 많은 \u003cb class=\"key\">투자\u003c/b>를 필요로 한다. 여기서 글쓴이는 기술이 사람들의 \u003cb class=\"key\">의지\u003c/b>에 반응하긴 하지만 즉각적으로 반응하지도, \u003cb class=\"key\">무료\u003c/b>이지도 않다는 결론을 내린다. 결국 문제는 기술 자체가 아니라 기술이 반응하는 속도와 비용이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 통념 제시예요. 현재 대중의 태도는 두 갈래로 나타납니다. 하나는 환경 문제를 초래한 것에 대해 technology나 technologists를 비난하는 것이고, 다른 하나는 economic growth를 막아 technological advancement를 늦추자는 제안이에요. 원인도 기술, 해결책도 기술 억제로 보는 셈이죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서 글쓴이는 이 통념에 정면으로 반대합니다. 이 관점을 thoroughly misguided, 즉 완전히 잘못된 것이라고 단호하게 말하죠. 짧은 문장이지만 글 전체의 방향을 정하는 주제문 역할을 해요. 여기서 글의 태도가 확 뒤집힌다고 보면 됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 근거를 대는 부분이에요. 기술이 오염 자동차를 만든 건 공학자들이 설계할 때 오염을 고려해야 할 문제로 recognize하지 못했기 때문이라고 설명합니다. 오염을 일으키는 기술이 더 저렴하다는 점도 인정하죠. 그러나 이제 오염을 덜 시키는 차를 원한다는 결정이 내려졌으니, 오염을 거의 일으키지 않는 차까지 만들 수 있다고 말합니다.","hl":"f2"},{"n":7,"text":"마지막 단계는 한계와 결론이에요. 오염을 거의 일으키지 않는 차는 수년의 시간과 많은 investment를 require한다고 짚습니다. 그래서 technology는 사람들의 will에 responsive하긴 하지만 instantaneously 반응하지도, 결코 free하지도 않다는 결론으로 이어지죠. 결국 문제는 기술 자체가 아니라 기술이 반응하는 속도와 비용이라는 겁니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 대중이 흔히 믿는 \u003cb class=\"key\">통념\u003c/b>을 먼저 제시한 뒤 곧바로 그것이 잘못되었다고 \u003cb class=\"key\">반박\u003c/b>하는 방식으로 전개된다. 주제문이 두 번째 문장에 놓여 있으므로 \u003cb class=\"key\">두괄식\u003c/b>으로 볼 수 있다. 이후 문장들은 자동차 오염이라는 구체적 \u003cb class=\"key\">사례\u003c/b>를 통해 왜 그 통념이 그릇된지 뒷받침한다. 따라서 전개방식은 \u003cb class=\"key\">통념-반박\u003c/b>이고, 주장이 앞에 오는 두괄식 구조다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>A currently popular attitude is (1)\u003c/b>\u003cspan>통념 제시\u003c/span>\u003cb>We believe this view to be thoroughly misguided (2)\u003c/b>\u003cspan>반박·주제문\u003c/span>\u003cb>Obviously (4)\u003c/b>\u003cspan>양보하며 근거 제시\u003c/span>\u003cb>however (5)\u003c/b>\u003cspan>전환·한계 제시\u003c/span>\u003cb>Although (6)\u003c/b>\u003cspan>양보 후 결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the environmental problems we face today\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pollution\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pollute the air\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">less polluting cars\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cars which scarcely pollute at all\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>오염을 발생시키는 기술\u003c/th>\u003cth>오염을 덜 시키는 기술\u003c/th>\u003c/tr>\u003ctr>\u003ctd>비용이 저렴함\u003c/td>\u003ctd>많은 투자 필요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>즉시 생산 가능\u003c/td>\u003ctd>수년의 시간 필요\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 통념을 먼저 던지고 곧바로 반박하는 통념-반박 전개 방식이에요. 주제문이 두 번째 문장에 있으니 두괄식 구조로 보면 됩니다. 뒤에 나오는 자동차 오염 이야기는 그 주장을 뒷받침하는 근거와 사례로 쓰였어요. 그래서 결론부터 찾기보다 앞쪽 주제문을 잡고 뒤를 따라가는 방식으로 읽으면 좋습니다.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 첫 번째 문장의 A currently popular attitude는 대중의 통념을 소개하는 표지예요. 두 번째 문장의 We believe this view to be thoroughly misguided는 반박이자 주제문이고요. 네 번째 문장의 Obviously는 상대 논리를 인정하는 양보 신호, 다섯 번째 문장의 however는 한계 쪽으로 방향을 트는 전환 신호예요. 마지막 문장의 Although도 양보 뒤에 결론을 붙이는 신호로 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>currently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>현재\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대중적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>attitude\u003c/b>\u003cem>명사\u003c/em>\u003cspan>태도\u003c/span>\u003c/div>\u003cdiv>\u003cb>blame A for B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B에 대해 비난하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>technologist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술자\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>초래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environmental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>환경의\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제안하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>slow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>늦추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>technological advancement\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기술적 진보\u003c/span>\u003c/div>\u003cdiv>\u003cb>block\u003c/b>\u003cem>동사\u003c/em>\u003cspan>막다, 차단하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>economic growth\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>경제 성장\u003c/span>\u003c/div>\u003cdiv>\u003cb>thoroughly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>misguided\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잘못된\u003c/span>\u003c/div>\u003cdiv>\u003cb>produce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>automobile\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자동차\u003c/span>\u003c/div>\u003cdiv>\u003cb>pollute\u003c/b>\u003cem>동사\u003c/em>\u003cspan>오염시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recognize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>engineer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고려하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>design\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설계\u003c/span>\u003c/div>\u003cdiv>\u003cb>obviously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>분명히\u003c/span>\u003c/div>\u003cdiv>\u003cb>scarcely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>거의 ~않다\u003c/span>\u003c/div>\u003cdiv>\u003cb>option\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선택(지)\u003c/span>\u003c/div>\u003cdiv>\u003cb>require\u003c/b>\u003cem>동사\u003c/em>\u003cspan>필요로 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>investment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>투자\u003c/span>\u003c/div>\u003cdiv>\u003cb>responsive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>반응하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>will\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의지\u003c/span>\u003c/div>\u003cdiv>\u003cb>instantaneously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>즉각적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>free\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무료의\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚을게요. blame A for B는 A를 B에 대해 비난하다는 숙어예요. misguided는 잘못된, scarcely는 거의 않다, responsive는 반응하는이라는 뜻이고요. instantaneously는 즉각적으로, require는 필요로 하다는 의미로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">blame\u003c/b>\u003cspan class=\"m\">비난하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">criticize\u003c/span>\u003cspan class=\"s\">condemn\u003c/span>\u003cspan class=\"s\">accuse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">praise\u003c/span>\u003cspan class=\"a\">defend\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suggest\u003c/b>\u003cspan class=\"m\">제안하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">propose\u003c/span>\u003cspan class=\"s\">recommend\u003c/span>\u003cspan class=\"s\">advise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">slow\u003c/b>\u003cspan class=\"m\">늦추다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">delay\u003c/span>\u003cspan class=\"s\">hinder\u003c/span>\u003cspan class=\"s\">retard\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accelerate\u003c/span>\u003cspan class=\"a\">hasten\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">misguided\u003c/b>\u003cspan class=\"m\">잘못된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wrong\u003c/span>\u003cspan class=\"s\">mistaken\u003c/span>\u003cspan class=\"s\">erroneous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">correct\u003c/span>\u003cspan class=\"a\">right\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">recognize\u003c/b>\u003cspan class=\"m\">인식하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">acknowledge\u003c/span>\u003cspan class=\"s\">perceive\u003c/span>\u003cspan class=\"s\">identify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">scarcely\u003c/b>\u003cspan class=\"m\">거의 ~않다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hardly\u003c/span>\u003cspan class=\"s\">barely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fully\u003c/span>\u003cspan class=\"a\">completely\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">responsive\u003c/b>\u003cspan class=\"m\">반응하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reactive\u003c/span>\u003cspan class=\"s\">sensitive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unresponsive\u003c/span>\u003cspan class=\"a\">indifferent\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘를 동의어와 반의어로 묶어 볼게요. blame은 criticize, condemn과 가깝고 praise와 반대돼요. slow는 delay, hinder의 뜻이고 accelerate와는 반대죠. misguided는 wrong, mistaken과 같고 correct와 반대입니다. recognize는 acknowledge, perceive로 바꿀 수 있고 ignore와 반대예요. scarcely는 hardly, barely와 같고, responsive는 reactive, sensitive와 가깝고 unresponsive와 반대됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현재 대중의 태도는\u003c/span>\u003cspan class=\"en\">A currently popular attitude\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기술 혹은 기술자들을 비난하는 것이고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">blame \u003c/span>\u003cspan class=\"tgt\">technology \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">technologists\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경 문제들을 초래한 것에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">brought \u003c/span>\u003cspan class=\"tgt\">on\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">environmental \u003c/span>\u003cspan class=\"tgt\">problems \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날 우리가 직면하고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">face \u003c/span>\u003cspan class=\"tgt\">today\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 기술적인 진보를 늦추자고 제안하는 것이다\u003c/span>\u003cspan class=\"en\">and to suggest that we should try to slow technological advancement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경제 성장을 멈춤으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">blocking \u003c/span>\u003cspan class=\"tgt\">economic \u003c/span>\u003cspan class=\"tgt\">growth\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">현재 대중의 태도는 오늘날 우리가 직면하고 있는 환경 문제들을 초래한 것에 대해 기술 혹은 기술자들을 비난하고, 경제 성장을 멈춤으로써 기술적인 진보를 늦추자고 제안하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 요즘 사람들이 흔히 갖는 태도를 소개하는 문장이에요. 환경 문제의 책임을 \u003cb class=\"key\">기술\u003c/b> 쪽으로 돌리면서, 성장을 막아 발전 속도를 늦추자는 주장이죠. 글쓴이는 이 주장을 다음 문장에서 바로 반박하기 위해 일부러 먼저 제시하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + to부정사(주격 보어)\u003c/span> : [주어 attitude] + is + [to blame A for B (to부정사구/보어)] : \"기술 혹은 기술자들을 비난하는 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 완료동명사(having p.p.)\u003c/span> : blame A + for + [having brought on (완료동명사구)] : \"초래한 것에 대해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사 the environmental problems] + [관계대명사 which/that 생략] + we face today : \"오늘날 우리가 직면하고 있는 환경 문제들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : slow A + [by + blocking (by+동명사)] : \"경제 성장을 멈춤으로써\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"A currently popular attitude, 현재 대중의 태도는. is to blame technology or technologists, 기술 혹은 기술자들을 비난하는 것이고. for having brought on the environmental problems, 환경 문제들을 초래한 것에 대해. we face today, 오늘날 우리가 직면하고 있는. and to suggest that we should try to slow technological advancement, 그리고 기술적인 진보를 늦추자고 제안하는 것이다. by blocking economic growth, 경제 성장을 멈춤으로써. 이 문장 전체를 해석하면, 현재 대중의 태도는 오늘날 우리가 직면하고 있는 환경 문제들을 초래한 것에 대해 기술 혹은 기술자들을 비난하고, 경제 성장을 멈춤으로써 기술적인 진보를 늦추자고 제안하는 것이다.","hl":"m"},{"n":13,"text":"이 문장은 요즘 사람들이 흔히 갖는 태도를 소개하는 부분이에요. 기술이나 기술자에게 책임을 돌리면서, 경제 성장을 막아 기술 발전을 늦추자는 시각이죠. 글쓴이는 이 관점을 곧바로 반박할 준비를 하면서 일단 제시하는 거예요.","hl":"mn"},{"n":14,"text":"첫 번째로 is to blame, 여기서 to blame은 주어인 attitude를 설명하는 주격 보어 역할을 해요. 그래서 현재 대중의 태도는 비난하는 것이다로 읽으면 됩니다. 두 번째로 for having brought on, 전치사 for 뒤에 완료동명사가 와서 이미 일어난 일을 가리키고, 해석은 초래한 것에 대해가 돼요. 세 번째로 the environmental problems we face today, 선행사 뒤에 목적격 관계대명사가 생략되어 우리가 바로 이어지는 구조를 확인하세요. 네 번째로 by blocking, 전치사 by 뒤에 동명사가 와서 수단과 방법을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 믿는다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 관점이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">view \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 잘못된 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">thoroughly \u003c/span>\u003cspan class=\"tgt\">misguided\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 이러한 관점이 완전히 잘못된 것으로 믿는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 소개한 대중의 태도를 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">잘못된 \u003c/b>\u003cb class=\"key\">것\u003c/b>으로 규정하는 문장이에요. this view가 가리키는 대상은 바로 앞 문장의 주장 전체입니다. 글쓴이의 \u003cb class=\"key\">필자의 \u003c/b>\u003cb class=\"key\">주장\u003c/b>이 여기서 처음 분명하게 드러나요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 동사 + 목적어 + to부정사(목적격 보어)\u003c/span> : believe [목적어 this view] + [to be 형용사 (목적격 보어)] : \"이러한 관점이 ~라고 믿다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사 + be 과거분사(수동의 의미)\u003c/span> : to be + [thoroughly misguided (과거분사)] : \"완전히 잘못된 것이라고\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"We believe, 우리는 믿는다. this view, 이러한 관점이. to be thoroughly misguided, 완전히 잘못된 것이라고. 이 문장 전체를 해석하면, 우리는 이러한 관점이 완전히 잘못된 것으로 믿는다.","hl":"m"},{"n":16,"text":"앞에서 소개한 대중의 태도를 완전히 잘못된 것이라고 딱 잘라 말하는 문장이에요. this view는 바로 앞 문장의 주장 전체를 가리키죠. 여기서 글쓴이의 입장이 처음으로 분명하게 드러납니다.","hl":"mn"},{"n":17,"text":"첫 번째로 believe this view to be, believe가 목적어와 to부정사 보어를 데리고 와서 오 형식이 된 구조예요. 목적어가 ~라고 믿다로 해석하면 됩니다. 두 번째로 to be thoroughly misguided, to부정사 뒤에 be 과거분사가 와서 수동의 의미를 담고 있어요. 그래서 완전히 잘못된 것이라고라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 기술이 자동차를 생산했다면\u003c/span>\u003cspan class=\"en\">If technology produced \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">automobiles \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공기를 오염시키는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">pollute \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">air\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~ 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">because\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오염이 문제로서 인식되지 않았기\u003c/span>\u003cspan class=\"en\">pollution \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">recognized \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">problem \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공학자들이 고려해야 했던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">engineers \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">consider\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 설계에서\u003c/span>\u003cspan class=\"en\">in their designs.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기술이 공기를 오염시키는 자동차를 생산했다면, 그것은 공학자들이 설계할 때 오염이 고려해야 했던 문제로서 인식되지 않았기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오염 자동차가 만들어진 책임은 기술 자체가 아니라 \u003cb class=\"key\">인식의 \u003c/b>\u003cb class=\"key\">부재\u003c/b>에 있다고 말하는 문장이에요. 설계 단계에서 오염이 문제로 여겨지지 않았기 때문에 그런 차가 나왔다는 뜻이죠. 즉 잘못은 기술이 아니라 \u003cb class=\"key\">설계 \u003c/b>\u003cb class=\"key\">기준\u003c/b>과 판단에 있었어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 automobiles] + [that + 동사 pollute] : \"공기를 오염시키는 자동차\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">It is because ~ 구문(이유 제시)\u003c/span> : [If 절] + it is because + [이유 절] : \"그것은 ~ 때문이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태(recognize A as B → A is recognized as B)\u003c/span> : [주어 pollution] + was not recognized + [as a problem] : \"문제로서 인식되지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 which\u003c/span> : [선행사 a problem] + [which + engineers had to consider] : \"공학자들이 고려해야 했던 문제\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"If technology produced automobiles, 만약 기술이 자동차를 생산했다면. that pollute the air, 공기를 오염시키는. it is because, 그것은 ~ 때문이다. pollution was not recognized as a problem, 오염이 문제로서 인식되지 않았기. which engineers had to consider, 공학자들이 고려해야 했던. in their designs, 그들의 설계에서. 이 문장 전체를 해석하면, 기술이 공기를 오염시키는 자동차를 생산했다면, 그것은 공학자들이 설계할 때 오염이 고려해야 했던 문제로서 인식되지 않았기 때문이다.","hl":"m"},{"n":19,"text":"오염 자동차가 나온 책임은 기술 자체가 아니라 인식의 부재에 있다는 문장이에요. 설계할 때 오염이 문제로 여겨지지 않았기 때문에 그런 차가 만들어졌다는 거죠. 그래서 잘못은 기술이 아니라 설계 기준과 판단에 있었던 겁니다.","hl":"mn"},{"n":20,"text":"첫 번째로 automobiles that pollute the air, that이 관계사절에서 주어 역할을 하는 주격 관계대명사예요. 동사가 복수 pollute인 것도 선행사가 복수이기 때문입니다. 두 번째로 it is because, it은 앞 내용 전체를 받는 지시대명사이고 because절이 그 이유를 설명해요. 세 번째로 was not recognized as a problem, recognize A as B를 수동으로 바꾼 형태로 as는 로서라는 자격을 나타냅니다. 네 번째로 a problem which engineers had to consider, which가 consider의 목적어 역할을 하는 목적격 관계대명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분명히,\u003c/span>\u003cspan class=\"en\">Obviously,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오염을 발생시키는 기술은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">technology \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">produces \u003c/span>\u003cspan class=\"tgt\">pollution\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반적으로 더 저렴하지만,\u003c/span>\u003cspan class=\"en\">is generally cheaper,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 이제 ~라는 결정이 내려졌으므로\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">decided\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 깨끗한 자동차가 원해진다는\u003c/span>\u003cspan class=\"en\">that cleaner cars are wanted,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오염을 덜 시키는 차들이 생산될 것이며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">polluting \u003c/span>\u003cspan class=\"tgt\">cars \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">produced\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오염을 거의 일으키지 않는 차들이 심지어 만들어질 수도 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">cars \u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">scarcely \u003c/span>\u003cspan class=\"tgt\">pollute \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">all\u003c/span> could even be made.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">분명히 오염을 발생시키는 기술은 일반적으로 더 저렴하지만, 이제 오염을 덜 시키는 자동차를 원한다는 결정이 내려졌으므로 오염을 덜 시키는 차들이 생산될 것이며, 심지어 오염을 거의 일으키지 않는 차들이 만들어질 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기술이 오염을 만드는 것은 기술 자체의 잘못이 아니라 \u003cb class=\"key\">고려\u003c/b>되지 않았던 문제였을 뿐이고, 이제는 \u003cb class=\"key\">선택\u003c/b>의 문제라는 흐름을 잇는 문장이에요. 오염을 덜 만드는 기술은 \u003cb class=\"key\">비용\u003c/b>이 더 들지만, 사람들이 깨끗한 차를 원한다고 결정하면 기술은 그 요구에 맞춰 제품을 바꾼다는 뜻이죠. 뒤에 나오는 '몇 년과 많은 투자'라는 조건을 미리 깔아 주는 역할도 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 technology] + [that + 동사 produces + 목적어 pollution] : \"오염을 발생시키는 기술\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">now that(이유 접속사) + 가주어 it / 진주어 that절\u003c/span> : now that + [it + be동사 + p.p. + that절(진주어)] : \"이제 ~라는 결정이 내려졌으므로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 + be + 과거분사(수동태)\u003c/span> : [목적어 less polluting cars] + [will be + produced(과거분사)] : \"오염을 덜 시키는 차들이 생산될 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 which\u003c/span> : [선행사 cars] + [which + 동사 scarcely pollute] : \"오염을 거의 일으키지 않는 차들\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Obviously, 분명히. technology that produces pollution, 오염을 발생시키는 기술은. is generally cheaper, 일반적으로 더 저렴하지만. but now that it has been decided, 그런데 이제 ~라는 결정이 내려졌으므로. that cleaner cars are wanted, 더 깨끗한 자동차가 원해진다는. less polluting cars will be produced, 오염을 덜 시키는 차들이 생산될 것이며. cars which scarcely pollute at all could even be made, 오염을 거의 일으키지 않는 차들이 심지어 만들어질 수도 있다.. 이 문장 전체를 해석하면, 분명히 오염을 발생시키는 기술은 일반적으로 더 저렴하지만, 이제 오염을 덜 시키는 자동차를 원한다는 결정이 내려졌으므로 오염을 덜 시키는 차들이 생산될 것이며, 심지어 오염을 거의 일으키지 않는 차들이 만들어질 수도 있다.","hl":"m"},{"n":22,"text":"이 문장은 기술을 탓하기보다 우리의 선택 문제라고 말하고 있어요. 오염을 만드는 기술이 더 싼 건 사실이지만, 사람들이 깨끗한 차를 원한다고 결정하면 기술은 오염을 덜 만드는 차를 내놓는다는 거죠. 결국 문제는 기술이 아니라 우리가 무엇을 원하고 얼마를 감수하느냐예요.","hl":"mn"},{"n":23,"text":"첫 번째로 technology that produces pollution에서 that은 주격 관계대명사예요. 뒤에 동사가 바로 오고 목적어가 있으니 주격이고, 선행사 technology를 꾸며 줍니다. 두 번째로 now that은 이유를 나타내는 접속사로 since처럼 쓰였고, it has been decided that에서 it은 가주어, 뒤의 that절이 진주어인 수동태 구조예요. 세 번째로 less polluting cars will be produced는 생산되는 대상이 주어라서 조동사 will 뒤에 be와 과거분사가 온 수동태죠. 네 번째로 cars which scarcely pollute at all에서 which는 주격 관계대명사이고, 앞의 오염을 덜 시키는 차들을 명사 cars로 한 번 더 받아 부연 설명하는 동격적인 쓰임이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 마지막 선택지는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">last \u003c/span>\u003cspan class=\"tgt\">option\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">however,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">필요로 할 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">require\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수년의 시간과 많은 투자를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">several \u003c/span>\u003cspan class=\"tgt\">years \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">investment\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 이 마지막 선택은 수년간의 시간과 많은 투자를 필요로 할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 '오염을 거의 일으키지 않는 차'를 만드는 일은 공짜가 아니라는 뜻이에요. 시간과 돈이 \u003cb class=\"key\">투자\u003c/b>되어야 한다는 것이죠. 그래서 기술은 사람의 요구에 반응하지만 \u003cb class=\"key\">즉각적\u003c/b>이지도 \u003cb class=\"key\">무료\u003c/b>도 아니라는 다음 문장으로 자연스럽게 이어지는 다리 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시어(this + 명사)를 통한 앞 내용 지칭\u003c/span> : This + [last option] → 앞 문장의 마지막 대안을 지칭 : \"이 마지막 선택지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 would의 완곡한 추측·가능성\u003c/span> : [주어 This last option] + [would + require(동사원형) + 목적어] : \"필요로 할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">and로 연결된 병렬 목적어\u003c/span> : require + [several years] + and + [much investment] : \"수년의 시간과 많은 투자\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"This last option, 이 마지막 선택지는. however, 그러나. would require, 필요로 할 것이다. several years and much investment, 수년의 시간과 많은 투자를. 이 문장 전체를 해석하면, 그러나 이 마지막 선택은 수년간의 시간과 많은 투자를 필요로 할 것이다.","hl":"m"},{"n":25,"text":"앞에서 말한 오염을 거의 만들지 않는 차를 만드는 일은 공짜가 아니라는 뜻이에요. 시간과 돈이 투자되어야 한다는 것이죠. 그래서 기술은 사람의 요구에 반응하지만 즉각적이지도 무료도 아니라는 다음 문장으로 자연스럽게 이어집니다.","hl":"mn"},{"n":26,"text":"첫 번째로 This last option에서 this는 지시어로, 앞 문장의 마지막 대안을 가리켜요. 두 번째로 would require에서 would는 단정하지 않는 완곡한 추측과 가능성을 나타내고, 조동사 뒤에는 동사원형 require가 옵니다. 세 번째로 several years and much investment는 and로 연결된 병렬 목적어 구조예요. several years는 셀 수 있는 복수 명사, much investment는 셀 수 없는 명사라서 수량 표현이 각각 다르게 붙었습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기술이 사람들의 의지에 반응하긴 하지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although \u003c/span>\u003cspan class=\"tgt\">technology \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">responsive \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 거의 즉각적으로 반응할 수 없고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">seldom \u003c/span>\u003cspan class=\"tgt\">respond \u003c/span>\u003cspan class=\"tgt\">instantaneously\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결코 무료가 아니다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">free\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기술이 사람들의 의지에 반응하긴 하지만, 거의 즉각적으로 반응할 수 없고 결코 무료가 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기술은 사람들이 원하는 방향으로 움직이지만, 마법처럼 당장 해결해 주지는 못한다는 뜻이에요. 그래서 필요한 것은 \u003cb class=\"key\">시간\u003c/b>과 \u003cb class=\"key\">비용\u003c/b>이며, 이것이 이 글 전체의 \u003cb class=\"key\">요지\u003c/b>입니다. 결국 기술을 탓하기보다 우리가 무엇을 원하고 얼마를 감수할지를 결정하는 것이 중요하다는 메시지예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사 Although\u003c/span> : Although + [주어 + 동사], + [주절] : \"기술이 사람들의 의지에 반응하긴 하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사 it + 준부정어 seldom\u003c/span> : [it(대명사) + can + seldom(부정 부사) + respond(동사원형)] : \"그것은 거의 즉각적으로 반응할 수 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be동사 + 부정 부사 never\u003c/span> : [주어 it] + [is + never + free(주격보어)] : \"결코 무료가 아니다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Although technology is responsive to the will of the people, 기술이 사람들의 의지에 반응하긴 하지만. it can seldom respond instantaneously, 그것은 거의 즉각적으로 반응할 수 없고. and is never free, 결코 무료가 아니다. 이 문장 전체를 해석하면, 기술이 사람들의 의지에 반응하긴 하지만, 거의 즉각적으로 반응할 수 없고 결코 무료가 아니다.","hl":"m"},{"n":28,"text":"기술은 사람들이 원하는 방향으로 움직이지만, 마법처럼 당장 해결해 주지는 못한다는 뜻이에요. 그래서 필요한 것은 시간과 비용이고, 이것이 이 글 전체의 요지입니다. 결국 기술을 탓하기보다 우리가 무엇을 원하고 얼마를 감수할지를 정하는 게 중요하다는 메시지예요.","hl":"mn"},{"n":29,"text":"첫 번째로 Although는 양보의 접속사예요. 기술이 반응하긴 한다는 점을 먼저 인정하고, 뒤 주절에서 한계를 말하도록 대조를 만들어 줍니다. 두 번째로 it은 앞에 나온 technology를 받는 대명사이고, seldom은 거의 그렇지 않다는 뜻의 부정어라서 can 뒤에 와서 부정의 의미를 만들어요. 세 번째로 is never free에서 never는 be동사 뒤에서 강한 부정을 만들고, free는 자유롭다가 아니라 비용이 들지 않는다는 뜻의 형용사로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>현재 대중은 환경 문제를 초래한 것에 대해 \u003cb class=\"key\">기술\u003c/b>을 비난하고, 경제 성장을 막아 기술 진보를 늦추자고 제안한다.\u003c/li>\u003cli>글쓴이는 이러한 관점이 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">잘못된\u003c/b> 것이라고 단호히 반박한다.\u003c/li>\u003cli>오염 자동차는 공학자들이 설계에서 오염을 \u003cb class=\"key\">고려\u003c/b>해야 할 문제로 인식하지 못했기 때문에 생산된 것이며, 이제 원한다면 오염을 덜 시키는 차도 만들 수 있다.\u003c/li>\u003cli>그러나 기술은 사람들의 \u003cb class=\"key\">의지\u003c/b>에 반응할 뿐 즉각적으로 움직이지 않고 \u003cb class=\"key\">무료\u003c/b>도 아니며, 더 깨끗한 기술에는 시간과 투자가 필요하다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Technology is not the true culprit, for it responds to people's will, though never instantaneously and never free.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">글쓴이는 환경 문제를 기술 탓으로 돌리고 경제 성장을 막아 기술 진보를 늦추자는 \u003cb class=\"key\">통념\u003c/b>이 완전히 잘못되었다고 본다. 오염 자동차는 오염이 \u003cb class=\"key\">설계\u003c/b>에서 고려되지 않았기 때문에 만들어진 것이며, 기술은 사람들의 의지에 반응하지만 즉각적이지도 무료이지도 않다는 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 글의 핵심을 다시 정리해 볼게요. 환경 문제를 기술 탓으로 돌리고 성장을 막자는 태도는 완전히 잘못된 관점이에요. 기술은 사람들의 의지에 반응하지만 즉각적이지도 무료이지도 않다는 것, 그리고 더 깨끗한 기술에는 시간과 투자가 필요하다는 점을 꼭 기억하세요. 오늘도 수고 많았습니다, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
