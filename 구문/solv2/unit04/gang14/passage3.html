<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구문사고력 14강 reading03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"구문사고력 14강 reading03","audioDir":"passage3_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">14강\u003cbr>reading03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Saying Becomes Believing: Why We Come to Believe What We Say\u003c/h1>\u003ch2>말하는 것이 믿는 것이 된다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사람들은 자신이 의심하는 것이라도 말이나 글로 증언하도록 유도되면 그 \u003cb class=\"key\">허위\u003c/b>에 대해 기분 나쁘게 느끼지만, 곧 자신이 말하고 있는 것을 \u003cb class=\"key\">믿기 \u003c/b>\u003cb class=\"key\">시작\u003c/b>한다. 설득력 있는 외부의 설명이 없을 때 말하는 것이 곧 믿는 것이 되며, 우리는 듣는 사람에게 맞춰 \u003cb class=\"key\">메시지를 \u003c/b>\u003cb class=\"key\">조정\u003c/b>하고 그렇게 변경된 메시지를 믿는 경향이 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>When people are led to say something without a compelling external explanation, saying becomes believing, and they end up believing the altered message they have delivered to their listeners.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 말하는 것이 믿는 것이 된다는 흥미로운 심리 현상에 관한 지문을 함께 읽어 보겠습니다. 이 글은 우리가 의심하는 것이라도 말이나 글로 증언하게 되면 곧 그것을 믿게 된다는 사실을 다루고 있어요. 핵심은 설득력 있는 외부의 설명이 없을 때 말과 믿음이 하나가 된다는 점입니다. 그럼 지문 속으로 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">심리학에서는 사람이 자기 행동과 생각이 어긋날 때 불편함을 느끼는 상태를 \u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">부조화\u003c/b>(cognitive dissonance)라고 부릅니다. 이 불편함을 줄이려고 사람은 자기 행동에 맞춰 생각을 바꾸는 쪽을 택하곤 하죠. 또 자기지각 이론(self-perception theory)은 우리가 자기 말과 행동을 관찰해 자신이 어떤 사람인지 판단한다고 설명합니다. 예를 들어 친구에게 어떤 영화가 정말 재미있다고 추천하고 나면, 추천한 사람인 나 자신도 그 영화를 더 재미있게 느끼게 됩니다. 이렇게 말과 행동이 \u003cb class=\"key\">태도 \u003c/b>\u003cb class=\"key\">변화\u003c/b>(attitude change)를 이끄는 현상은 설득이나 광고, 일상 대화에서도 자주 나타납니다.\u003c/div>","segs":[{"n":2,"text":"심리학에서는 사람이 자기 행동과 생각이 어긋날 때 불편함을 느끼는 상태를 인지 부조화, 영어로 cognitive dissonance라고 부릅니다. 이 불편함을 줄이려고 사람은 자기 행동에 맞춰 생각을 바꾸는 쪽을 택하곤 하죠. 또 자기지각 이론, self-perception theory는 우리가 자기 말과 행동을 관찰해서 자신이 어떤 사람인지 판단한다고 설명합니다. 예를 들어 친구에게 어떤 영화가 정말 재미있다고 추천하고 나면, 추천한 사람인 나 자신도 그 영화를 더 재미있게 느끼게 됩니다. 이렇게 말과 행동이 태도 변화, attitude change를 이끄는 현상은 설득이나 광고, 일상 대화에서도 자주 나타나요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>증언하라는 요구\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>사람들은 자신이 의심하는 것에 대해 말이나 글로 증언하도록 유도되면, 자기 말이 \u003cb class=\"key\">허위\u003c/b>라는 사실에 기분이 나빠진다. 그런데 흥미롭게도 그다음에는 자신이 말하고 있는 것을 \u003cb class=\"key\">믿기 \u003c/b>\u003cb class=\"key\">시작\u003c/b>한다. 불편한 마음이 그대로 남는 것이 아니라, 신념이 자기가 말한 내용 쪽으로 움직이는 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>말이 믿음이 되는 조건\u003csmall>주장 · 문장 3\u003c/small>\u003c/h4>\u003cp>한 사람이 한 말에 대해 \u003cb class=\"key\">설득력 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">외부의 \u003c/b>\u003cb class=\"key\">설명\u003c/b>이 없을 때, 말하는 것이 곧 믿는 것이 된다. 자기 말을 설명해 줄 다른 이유가 없으니, 사람은 그 말을 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">생각\u003c/b>으로 받아들인다. 이 문장이 글 전체를 이끄는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">원리\u003c/b>에 해당한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>Higgins의 실험\u003csmall>근거·예시 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>Tory Higgins와 동료들은 대학생들에게 어떤 사람의 성격 기술을 읽게 하고, 그 사람을 좋아하거나 싫어한다고 믿어지는 다른 사람에게 요약해 주게 했다. 요약문을 받을 사람이 그 사람을 좋아할 때 학생들은 더 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 했다. 그리고 긍정적인 것을 말하고 난 다음에는 그들 자신도 그 사람을 더 좋아하게 되었고, 읽은 것을 회상할 때도 원래보다 더 \u003cb class=\"key\">긍정적으로 \u003c/b>\u003cb class=\"key\">기억\u003c/b>했다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>결국 우리는 듣는 사람에게 맞춰 \u003cb class=\"key\">메시지를 \u003c/b>\u003cb class=\"key\">조정\u003c/b>하는 경향이 있다. 그리고 그렇게 하고 난 다음에는 \u003cb class=\"key\">변경된 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>를 믿는다. 말한 내용이 신념으로 굳어지는 이 흐름이 글의 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">주장\u003c/b>이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"지문은 증언을 요구받은 사람의 심리에서 출발해서, 그 원리와 실험 근거를 거쳐 결론으로 나아갑니다.","hl":null},{"n":4,"text":"먼저 사람들은 자기가 의심하는 것에 대해 말이나 글로 증언하도록 유도되면, 자기 말이 허위라는 사실에 기분이 나빠집니다. 그런데 그 불편함에서 끝나지 않고, 곧 자신이 말하고 있는 것을 믿기 시작해요. 여기서 주목할 점은 태도가 자기가 말한 내용 쪽으로 움직인다는 거예요.","hl":"f0"},{"n":5,"text":"세 번째 문장은 이 현상의 원리를 설명합니다. 한 사람이 한 말에 대해 설득력 있는 외부의 설명이 없으면, 말하는 것이 곧 믿는 것이 된다는 거죠. 자기 말을 설명해 줄 다른 이유가 없으니, 그 말을 자기 생각으로 받아들이게 되는 겁니다. 이 문장이 글 전체의 핵심 원리예요.","hl":"f1"},{"n":6,"text":"이제 Higgins와 동료들의 실험이 근거로 나옵니다. 대학생들은 어떤 사람의 성격 기술을 읽고, 그 사람을 좋아하거나 싫어한다고 믿어지는 다른 사람에게 그것을 요약해 주었어요. 요약문을 받을 사람이 그 사람을 좋아할 때 학생들은 더 긍정적인 기술을 했습니다. 그리고 긍정적인 것을 말하고 난 다음에는 그들 자신도 그 사람을 더 좋아하게 되었고, 회상할 때도 원래보다 더 긍정적으로 기억했어요.","hl":"f2"},{"n":7,"text":"마지막 문장에서 글은 결론을 맺습니다. 우리는 듣는 사람에게 맞춰 메시지를 조정하는 경향이 있고, 그렇게 하고 난 다음에는 변경된 메시지를 믿는다는 것이죠. 말한 내용이 신념으로 굳어지는 이 흐름이 글의 최종 주장입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거(예시)\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 부분에서 증언을 요구받은 사람이 곧 자기 말을 믿게 된다는 \u003cb class=\"key\">현상\u003c/b>을 제시하고, 세 번째 문장에서 설득력 있는 외부의 설명이 없으면 말이 믿음이 된다는 \u003cb class=\"key\">원리\u003c/b>를 밝힌다. 이어서 Higgins의 실험을 \u003cb class=\"key\">근거\u003c/b>로 제시한 뒤, 마지막 문장에서 메시지 조정과 변경된 메시지에 대한 믿음으로 \u003cb class=\"key\">결론\u003c/b>을 맺는다. 주장이 앞과 뒤에 모두 놓여 있으므로 \u003cb class=\"key\">양괄식\u003c/b>으로 읽는 것이 자연스럽다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Nevertheless (2)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>When there is no compelling external explanation (3)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>Having said positive things (6)\u003c/b>\u003cspan>결과·인과\u003c/span>\u003cb>In short (8)\u003c/b>\u003cspan>결론·요약\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">something they doubt\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">deceit\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">what they are saying\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">saying becomes believing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">adjust our messages\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the altered message\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">believe the altered message\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"전개 방식을 보면, 먼저 현상을 제시하고 원리를 밝힌 뒤 실험을 근거로 제시하고 마지막에 결론을 정리하는 주장과 근거의 구조예요. 주장이 앞부분의 세 번째 문장과 마지막 문장에 모두 놓여 있으니 양괄식으로 읽으면 됩니다. 그래서 마지막 문장을 읽을 때 앞의 주장이 어떻게 완성되는지 확인하는 게 중요해요.","hl":"ty"},{"n":9,"text":"신호어를 보면 두 번째 문장의 Nevertheless가 앞의 부정적인 감정에도 불구하고 태도가 바뀐다는 전환을 알려 줍니다. 세 번째 문장의 When there is no compelling external explanation은 원리가 적용되는 조건을 제시하고, 여섯 번째 문장의 Having said positive things는 말한 뒤에 생긴 결과를 이어 줘요. 마지막 문장의 In short은 지금까지의 내용을 요약하며 결론으로 묶는 신호입니다. 이렇게 전환과 조건, 결과, 결론의 신호를 따라가면 글의 뼈대가 또렷하게 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>induce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>유도하다, 권유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>spoken\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>말로 하는, 구두의\u003c/span>\u003c/div>\u003cdiv>\u003cb>written\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>서면의, 글로 쓰는\u003c/span>\u003c/div>\u003cdiv>\u003cb>witness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>증언\u003c/span>\u003c/div>\u003cdiv>\u003cb>doubt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의심하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel bad about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 기분 나쁘게 느끼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>deceit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>속임, 허위\u003c/span>\u003c/div>\u003cdiv>\u003cb>nevertheless\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그럼에도 불구하고\u003c/span>\u003c/div>\u003cdiv>\u003cb>begin to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하기 시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>compelling\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>설득력 있는, 강력한\u003c/span>\u003c/div>\u003cdiv>\u003cb>external\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>외부의\u003c/span>\u003c/div>\u003cdiv>\u003cb>explanation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설명\u003c/span>\u003c/div>\u003cdiv>\u003cb>saying\u003c/b>\u003cem>명사\u003c/em>\u003cspan>말하기, 발언\u003c/span>\u003c/div>\u003cdiv>\u003cb>colleague\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동료\u003c/span>\u003c/div>\u003cdiv>\u003cb>personality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성격\u003c/span>\u003c/div>\u003cdiv>\u003cb>description\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술, 묘사\u003c/span>\u003c/div>\u003cdiv>\u003cb>summarize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요약하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be believed to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~라고 믿어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>positive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긍정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>recall\u003c/b>\u003cem>동사\u003c/em>\u003cspan>회상하다, 기억해 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>remember\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기억하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in short\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>요약하자면\u003c/span>\u003c/div>\u003cdiv>\u003cb>be prone to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 경향이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>adjust\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조정하다, 맞추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>message\u003c/b>\u003cem>명사\u003c/em>\u003cspan>메시지, 전달 내용\u003c/span>\u003c/div>\u003cdiv>\u003cb>altered\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>변경된, 바뀐\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어는 몇 개만 짚어 볼게요. induce는 유도하다, 권유하다는 뜻이고, deceit는 속임이나 허위를 말합니다. compelling은 설득력 있는, altered는 변경된이라는 뜻이니 꼭 기억해 두세요. adjust는 조정하다, 맞추다는 의미로 마지막 문장의 핵심이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">doubt\u003c/b>\u003cspan class=\"m\">의심하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">question\u003c/span>\u003cspan class=\"s\">disbelieve\u003c/span>\u003cspan class=\"s\">suspect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">believe\u003c/span>\u003cspan class=\"a\">trust\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">deceit\u003c/b>\u003cspan class=\"m\">속임, 허위\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deception\u003c/span>\u003cspan class=\"s\">dishonesty\u003c/span>\u003cspan class=\"s\">falsehood\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">honesty\u003c/span>\u003cspan class=\"a\">truthfulness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">compelling\u003c/b>\u003cspan class=\"m\">설득력 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">convincing\u003c/span>\u003cspan class=\"s\">persuasive\u003c/span>\u003cspan class=\"s\">forceful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weak\u003c/span>\u003cspan class=\"a\">unconvincing\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">adjust\u003c/b>\u003cspan class=\"m\">조정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">modify\u003c/span>\u003cspan class=\"s\">alter\u003c/span>\u003cspan class=\"s\">adapt\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fix\u003c/span>\u003cspan class=\"a\">maintain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">be prone to\u003c/b>\u003cspan class=\"m\">~하는 경향이 있다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be inclined to\u003c/span>\u003cspan class=\"s\">be liable to\u003c/span>\u003cspan class=\"s\">be apt to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">be unwilling to\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">altered\u003c/b>\u003cspan class=\"m\">변경된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">changed\u003c/span>\u003cspan class=\"s\">modified\u003c/span>\u003cspan class=\"s\">revised\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unchanged\u003c/span>\u003cspan class=\"a\">original\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">recall\u003c/b>\u003cspan class=\"m\">회상하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">remember\u003c/span>\u003cspan class=\"s\">recollect\u003c/span>\u003cspan class=\"s\">retrieve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. doubt는 의심하다로, question이나 disbelieve가 동의어이고 believe나 trust가 반의어예요. deceit는 deception, dishonesty와 가깝고 honesty, truthfulness와는 반대됩니다. compelling은 convincing, persuasive와 같은 뜻이고 weak나 unconvincing은 반대말이에요. adjust는 modify, alter와 바꿔 쓸 수 있고, altered는 changed, modified와 가깝습니다. prone to는 be inclined to, be liable to와 같은 표현으로 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말이나 서면으로 증언을 해달라고 유도될 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">induced\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">give\u003c/span> spoken or written witness\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 의심스러워하는 무엇인가에 대해\u003c/span>\u003cspan class=\"en\">to \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">doubt\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 종종 기분 나쁘게 느낄 것이다\u003c/span>\u003cspan class=\"en\">people will often feel bad\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 허위에 대해\u003c/span>\u003cspan class=\"en\">about their deceit.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 그들이 의심스러워하는 무엇인가에 대해 말이나 서면으로 증언을 해달라고 유도될 때(권유를 받을 때), 종종 그들의 (확신하지 않은 것을 증언한) 허위에 대해 기분 나쁘게 느낄 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들은 자신이 의심하는 내용을 말이나 글로 증언하도록 \u003cb class=\"key\">유도\u003c/b>되면, 그 \u003cb class=\"key\">허위\u003c/b>에 대해 양심의 가책을 느낀다는 뜻이에요. 하지만 이 문장은 뒤에서 말이 믿음으로 바뀌는 현상을 소개하기 위한 \u003cb class=\"key\">도입\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">when + 과거분사(수동태 분사구문)\u003c/span> : When + [induced (과거분사)] : \"유도될 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사(유도된 행동)\u003c/span> : induced + [to give (to부정사)] : \"증언하도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : something + [(that/which) they doubt (목적격 관계대명사 생략)] : \"그들이 의심하는 무엇인가\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"When induced to give spoken or written witness, 말이나 서면으로 증언을 해달라고 유도될 때. to something they doubt, 그들이 의심스러워하는 무엇인가에 대해. people will often feel bad, 사람들은 종종 기분 나쁘게 느낄 것이다. about their deceit, 그들의 허위에 대해. 이 문장 전체를 해석하면, 사람들은 그들이 의심스러워하는 무엇인가에 대해 말이나 서면으로 증언을 해달라고 유도될 때(권유를 받을 때), 종종 그들의 (확신하지 않은 것을 증언한) 허위에 대해 기분 나쁘게 느낄 것이다.","hl":"m"},{"n":13,"text":"여기서는 people이 유도되는 대상이라서 수동태 induced가 쓰였고, when절에서 주어와 be동사가 줄어든 분사구문으로 이해해요. 이 문장은 허위에 대한 양심의 가책을 말하면서 뒤에 나올 말과 믿음의 변화를 소개하는 도입 역할을 해요.","hl":"mn"},{"n":14,"text":"첫 번째로 When induced는 주어 people이 유도되는 대상이라서 수동태인 induced가 쓰였고, when절에서 주어와 be동사가 줄어든 분사구문으로 이해해요. 두 번째로 induced 뒤의 to give는 to부정사로 유도된 행동을 나타내요. 세 번째로 something they doubt에서는 목적격 관계대명사가 생략된 관계사절이 something을 꾸며 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그럼에도 불구하고,\u003c/span>\u003cspan class=\"en\">Nevertheless,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 믿기 시작한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">begin \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">believe\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 말하고 있는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what\u003c/span> that \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">saying\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그럼에도 불구하고, 그들은 그들이 말하고 있는 것을 믿기 시작한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 허위에 대해 불편해하면서도, 사람들은 결국 자신이 말하는 내용을 \u003cb class=\"key\">믿기 \u003c/b>\u003cb class=\"key\">시작\u003c/b>한다는 뜻이에요. 이는 말과 믿음이 분리되지 않고 발화가 신념으로 이어지는 \u003cb class=\"key\">역설\u003c/b>을 보여 주며 뒤 문장의 \u003cb class=\"key\">주제\u003c/b>를 예고해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사 목적어(begin to do)\u003c/span> : begin + [to believe (to부정사/목적어)] : \"믿기 시작한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what(선행사 포함)\u003c/span> : believe + [what (명사절/목적어)] : \"~하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : are + [saying (현재분사)] : \"그들이 말하고 있는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Nevertheless, 그럼에도 불구하고. they begin to believe, 그들은 믿기 시작한다. what that they are saying, 그들이 말하고 있는 것을. 이 문장 전체를 해석하면, 그럼에도 불구하고, 그들은 그들이 말하고 있는 것을 믿기 시작한다.","hl":"m"},{"n":16,"text":"허위에 대한 불편함에도 불구하고 사람들이 자신이 말하는 내용을 믿기 시작한다는 역설을 보여 주고, 뒤에 나올 주제를 예고해요.","hl":"mn"},{"n":17,"text":"첫 번째로 begin은 to부정사를 목적어로 데려와서 믿기 시작한다는 의미를 만들어요. 두 번째로 what은 선행사를 포함한 관계대명사로 명사절을 이끌어 believe의 목적어가 됩니다. what 뒤에 that이 함께 보이지만 해석은 말하고 있는 것 전체로 잡고, they are saying은 현재진행으로 그들이 말하고 있는 행동을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">설득력 있는 외부의 설명이 없을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> no compelling external explanation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 사람의 말에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">one's \u003c/span>\u003cspan class=\"tgt\">words\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말하는 것이 믿는 것이 된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">saying \u003c/span>\u003cspan class=\"tgt\">becomes \u003c/span>\u003cspan class=\"tgt\">believing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 사람이 한 말에 대해 설득력 있는 외부의 설명이 없을 때, 말하는 것이 곧 믿는 것이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자신의 말에 대해 외부에서 \u003cb class=\"key\">설득력\u003c/b> 있는 설명을 찾을 수 없으면, 사람은 자신이 한 말을 곧 \u003cb class=\"key\">믿음\u003c/b>으로 받아들인다는 뜻이에요. 이 문장은 지문의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">명제\u003c/b>인 말하는 것이 곧 믿는 것이 된다를 압축적으로 제시해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">when 접속사 + there is 구문\u003c/span> : When + there is + [명사] : \"~이 없을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 소유격\u003c/span> : explanation + [for one's words (전치사구)] : \"한 사람의 말에 대한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사 주어와 주격보어\u003c/span> : [Saying (동명사/주어)] + becomes + [believing (동명사/보어)] : \"말하는 것이 믿는 것이 된다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"When there is no compelling external explanation, 설득력 있는 외부의 설명이 없을 때. for one's words, 한 사람의 말에 대해. saying becomes believing, 말하는 것이 믿는 것이 된다. 이 문장 전체를 해석하면, 한 사람이 한 말에 대해 설득력 있는 외부의 설명이 없을 때, 말하는 것이 곧 믿는 것이 된다.","hl":"m"},{"n":19,"text":"자신의 말에 대해 외부에서 설득력 있는 설명을 찾을 수 없으면 말하는 것이 곧 믿음이 된다는 핵심 명제를 압축해서 보여 줘요.","hl":"mn"},{"n":20,"text":"첫 번째로 when은 접속사이고 there is는 유도부 구조라서 뒤에 명사가 와요. 두 번째로 for one's words는 explanation을 꾸미는 전치사구이고 one's는 소유격이에요. 세 번째로 saying은 동명사 주어이고 believing은 보어 역할을 하며, 동명사가 주어와 보어에 나란히 쓰인 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토리 히긴스와 그의 동료들은\u003c/span>\u003cspan class=\"en\">Tory Higgins and his colleagues\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대학생들에게 어떤 사람의 성격을 기술한 것을 읽게 했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">university \u003c/span>\u003cspan class=\"tgt\">students \u003c/span>\u003cspan class=\"tgt\">read\u003c/span> a personality description of someone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나서 그것을 어떤 다른 사람에게 요약해 주라고 시켰다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">then \u003c/span>\u003cspan class=\"tgt\">summarize \u003c/span>\u003cspan class=\"tgt\">it\u003c/span> for someone else\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 다른 사람은 이 사람을 좋아하거나 싫어한다고 믿어지는 사람이었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">believed\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">either \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">dislike \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">person\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Tory Higgins와 그의 동료들은 대학생들에게 어떤 사람의 성격을 기술한 것은 읽게 한 다음, 이 사람을 좋아하거나 싫어한다고 믿어지는 어떤 다른 사람에게 그것을 요약해주라고 시켰다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Higgins 연구팀이 어떤 실험을 했는지 그 방법을 소개하는 대목이에요. 핵심은 \u003cb class=\"key\">사역동사\u003c/b> had로 '학생들에게 읽고 요약하게 시켰다'는 틀을 잡고, 읽기와 요약하기를 \u003cb class=\"key\">병렬\u003c/b>로 묶어 놓은 구조예요. 요약을 들을 상대는 그 인물을 \u003cb class=\"key\">좋아하거나 \u003c/b>\u003cb class=\"key\">싫어한다\u003c/b>고 믿어지는 사람으로 설정해서, 뒤에 나올 결과를 갈라 보기 위한 장치를 만들어 둔 거죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 have + 목적어 + 동사원형(능동)\u003c/span> : have + [목적어(university students)] + [동사원형(read)] : \"대학생들에게 ~을 읽게 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬(사역동사의 목적격보어)\u003c/span> : have + [목적어] + [read] and then [summarize] : \"그리고 나서 그것을 요약하게 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who + 수동태\u003c/span> : [선행사 someone else] + who + be동사 + [과거분사(believed)] : \"그런데 그 사람은 ~라고 믿어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">상관접속사 either A or B + to부정사 병렬\u003c/span> : either + [to like] or + [to dislike] + [목적어] : \"이 사람을 좋아하거나 아니면 싫어한다고\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Tory Higgins and his colleagues, 토리 히긴스와 그의 동료들은. had university students read a personality description of someone, 대학생들에게 어떤 사람의 성격을 기술한 것을 읽게 했다. and then summarize it for someone else, 그리고 나서 그것을 어떤 다른 사람에게 요약해 주라고 시켰다. who was believed either to like or to dislike this person, 그 다른 사람은 이 사람을 좋아하거나 싫어한다고 믿어지는 사람이었다.. 이 문장 전체를 해석하면, Tory Higgins와 그의 동료들은 대학생들에게 어떤 사람의 성격을 기술한 것은 읽게 한 다음, 이 사람을 좋아하거나 싫어한다고 믿어지는 어떤 다른 사람에게 그것을 요약해주라고 시켰다.","hl":"m"},{"n":22,"text":"이 문장은 히긴스 연구팀이 어떤 실험을 했는지 그 방법을 소개하는 대목이에요. 사역동사 had로 학생들에게 읽기와 요약하기를 시켰고, 요약을 들을 상대는 그 인물을 좋아하거나 싫어한다고 믿어지는 사람으로 설정했죠. 바로 이 설정 덕분에 다음 문장에서 결과가 갈라지는 거예요.","hl":"mn"},{"n":23,"text":"여기서 첫 번째로 볼 것은 had university students read예요. have는 목적어 뒤에 동사원형이 오면 사역동사가 되어서 '목적어가 ~하게 하다'라는 뜻이 되죠. 학생들이 직접 읽는 능동 관계라서 과거분사가 아니라 동사원형 read를 쓴 거예요. 두 번째는 and then summarize it인데요, summarize도 앞의 read와 똑같이 have의 목적격보어 자리를 이어받아서 동사원형으로 병렬을 맞춰 준 거예요. 세 번째는 who was believed로, 앞의 someone else를 받는 주격 관계대명사 who 뒤에 수동태 was believed가 이어진 구조죠. 마지막으로 either to like or to dislike this person은 either A or B 상관접속사가 to부정사 두 개를 나란히 연결해서 '좋아한다고 아니면 싫어한다고 믿어지는'이라는 내용을 채워 주는 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들은 썼다\u003c/span>\u003cspan class=\"en\">The students wrote\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 긍정적인 기술을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">positive \u003c/span>\u003cspan class=\"tgt\">description\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요약문을 받을 사람이 그 사람을 좋아할 때.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">recipient \u003c/span>\u003cspan class=\"tgt\">liked \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">person\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학생들은 요약문을 받을 사람이 (요약된) 사람을 좋아할 때 더 긍정적인 기술을 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 실험 결과의 첫 장면이에요. 요약문을 받을 \u003cb class=\"key\">수신자\u003c/b>가 그 인물을 \u003cb class=\"key\">좋아할 \u003c/b>\u003cb class=\"key\">때\u003c/b> 학생들이 더 \u003cb class=\"key\">긍정적\u003c/b>인 기술을 썼다는 것을 보여 주죠. 즉 듣는 사람의 성향에 맞춰 메시지를 바꾼다는 이 글 전체의 흐름이 여기서 출발하는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급(more + 형용사)\u003c/span> : more + [형용사(positive)] + [명사(description)] : \"더 긍정적인 기술\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [주절] + when + [주어(the recipient) + 동사(liked)] : \"요약문을 받을 사람이 그 사람을 좋아할 때\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The students wrote, 학생들은 썼다. a more positive description, 더 긍정적인 기술을. when the recipient liked the person, 요약문을 받을 사람이 그 사람을 좋아할 때.. 이 문장 전체를 해석하면, 학생들은 요약문을 받을 사람이 (요약된) 사람을 좋아할 때 더 긍정적인 기술을 했다.","hl":"m"},{"n":25,"text":"이 문장은 실험 결과의 첫 장면이에요. 요약문을 받을 수신자가 그 인물을 좋아할 때 학생들이 더 긍정적인 기술을 썼다는 거죠. 듣는 사람의 성향에 맞춰 메시지를 바꾼다는 이 글의 흐름이 바로 여기서 시작되는 거예요.","hl":"mn"},{"n":26,"text":"먼저 a more positive description을 보세요. positive처럼 긴 형용사는 er을 붙이지 않고 앞에 more를 붙여서 비교급을 만들어요. 그래서 '더 긍정적인 기술'이라는 뜻이 되죠. 그리고 when the recipient liked the person에서 when은 '~할 때'라는 시간을 나타내는 종속접속사예요. 실험 자체가 과거에 일어난 일이니까 부사절 동사도 liked로 시제를 맞춰 준 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긍정적인 것들을 말하고 난 다음에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Having \u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">positive \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들도 그때 그 사람을 더 좋아하게 되었다\u003c/span>\u003cspan class=\"en\">they also then liked the person more\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신도.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">themselves\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">긍정적인 것을 말하고 난 다음, 그들 자신도 그 사람을 좋아하게 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이 실험이 밝혀낸 핵심 결과예요. '긍정적으로 말한 뒤에는 말한 사람 자신도 그 인물을 더 좋아하게 된다'는 뜻이죠. \u003cb class=\"key\">완료 \u003c/b>\u003cb class=\"key\">분사구문\u003c/b> Having said가 '말한 것이 먼저'라는 \u003cb class=\"key\">시간\u003c/b> 순서를 만들고, \u003cb class=\"key\">강조\u003c/b>의 재귀대명사 themselves가 '다른 누가 아니라 바로 그들 자신도'라는 점을 콕 집어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">완료 분사구문(Having + 과거분사)\u003c/span> : Having + [과거분사(said)] , [주절] : \"긍정적인 것을 말하고 난 다음에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사의 강조 용법\u003c/span> : [주어 they] + [동사 liked] + [목적어] + themselves : \"그들 자신도\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Having said positive things, 긍정적인 것들을 말하고 난 다음에. they also then liked the person more, 그들도 그때 그 사람을 더 좋아하게 되었다. themselves, 그들 자신도.. 이 문장 전체를 해석하면, 긍정적인 것을 말하고 난 다음, 그들 자신도 그 사람을 좋아하게 되었다.","hl":"m"},{"n":28,"text":"이 문장이 이 실험이 밝혀낸 핵심 결과예요. 긍정적으로 말하고 나면 말한 사람 자신도 그 인물을 더 좋아하게 된다는 거죠. 완료 분사구문이 '말한 뒤에'라는 시간 관계를 만들어 주고, 강조의 재귀대명사 themselves가 '바로 그들 자신도'라는 점을 짚어 주고 있어요.","hl":"mn"},{"n":29,"text":"먼저 Having said positive things를 보세요. 분사구문에서 주절보다 앞선 시점을 분명히 하고 싶을 때 Having 뒤에 과거분사를 쓰는 완료 분사구문을 써요. '긍정적으로 말한 것이 먼저, 좋아하게 된 것이 나중'이라는 시간 순서를 보여 주는 거죠. 그리고 문장 끝의 themselves는 재귀대명사의 강조 용법이에요. '다른 사람이 아니라 바로 말한 사람 자신도 그렇게 되었다'는 점을 콕 집어 주는 표현이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">회상해 보라는 요청을 받았을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Asked \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">recall\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 읽었던 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">read\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 그 성격 기술을 기억했다\u003c/span>\u003cspan class=\"en\">they remembered the description\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원래보다 더 긍정적인 것으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">positive\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들이 읽은 것을 회상해 보라는 요청을 받았을 때, 그들은 성격 기술을 원래보다 더 긍정적인 것으로 기억했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실험의 결과를 구체적으로 보여 주는 문장이에요. 긍정적인 내용을 말했던 학생들이 나중에 읽은 글 자체를 실제보다 더 긍정적으로 \u003cb class=\"key\">기억\u003c/b>했다는 점을 밝히죠. 즉 말하기가 \u003cb class=\"key\">기억\u003c/b>까지 바꾼다는 것을 뒷받침하는 근거 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 부사적 용법(수동 분사구문)\u003c/span> : [When they were] [[asked]] + [to recall ...] → 과거분사구로 시작하는 분사구문 : \"회상해 보라는 요청을 받았을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what + 과거완료\u003c/span> : [[what]] + [불완전한 절] = '~하는 것' : \"그들이 읽었던 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">remember A as B (as + 현재분사)\u003c/span> : [[remember]] + [A] + as + [B(being + 형용사)] : \"더 긍정적인 것으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">비교급 than 절\u003c/span> : [more + 형용사] + [[than]] + [주어 + 동사] : \"원래보다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Asked to recall, 회상해 보라는 요청을 받았을 때. what they had read, 그들이 읽었던 것을. they remembered the description, 그들은 그 성격 기술을 기억했다. as being more positive than it was, 원래보다 더 긍정적인 것으로. 이 문장 전체를 해석하면, 그들이 읽은 것을 회상해 보라는 요청을 받았을 때, 그들은 성격 기술을 원래보다 더 긍정적인 것으로 기억했다.","hl":"m"},{"n":31,"text":"이 문장은 실험 결과를 보여 주는 대목이에요. 긍정적으로 말했던 학생들이 나중에 자신이 읽은 글을 떠올릴 때 그 글을 실제보다 더 긍정적으로 기억했다는 거죠. 다시 말해 말하기가 기억까지 바꾼다는 걸 보여 주는 근거 문장이에요.","hl":"mn"},{"n":32,"text":"첫 번째로 Asked to recall은 주어 they가 요청을 받는 쪽이니까 수동 의미의 과거분사로 시작하는 분사구문이에요. 두 번째로 what they had read에서 what은 선행사를 포함하는 관계대명사이고, 읽은 일이 회상보다 먼저라서 과거완료를 썼어요. 세 번째로 remember the description as being은 remember가 as와 함께 쓰여 인식 구문을 만드는 형태예요. 네 번째로 than it was는 비교급 뒤에 오는 비교 절입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요약하자면,\u003c/span>\u003cspan class=\"en\">In short,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~인 것 같다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">seems \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 듣는 사람에게 맞춰 메시지를 조정하고\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">prone \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">adjust\u003c/span> our messages to our listeners,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇게 하고 난 다음에는\u003c/span>\u003cspan class=\"en\">and, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">done \u003c/span>\u003cspan class=\"tgt\">so\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 변경된 메시지를 믿는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">altered \u003c/span>\u003cspan class=\"tgt\">message\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">요약하자면, 우리는 듣는 사람에게 맞춰 메시지를 조정하고, 그렇게 하고 난 다음에는 그 변경된 메시지를 믿는 경향이 있는 것 같다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 맺는 \u003cb class=\"key\">요약\u003c/b> 문장이자 주제문이에요. 우리가 청자에 맞게 메시지를 \u003cb class=\"key\">조정\u003c/b>하고, 그러고 나면 바뀐 메시지를 스스로 \u003cb class=\"key\">믿게\u003c/b> 된다는 결론을 제시하죠. 앞의 'saying becomes believing'이라는 주장을 실험으로 확인한 뒤 던지는 최종 정리라고 보면 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it + that절(진주어)\u003c/span> : [[It]] seems + [that + 완전한 절] : \"~인 것 같다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be prone to + 동사원형(형용사구)\u003c/span> : [[be prone to]] + [동사원형] = '~하는 경향이 있다' : \"조정하는 경향이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">완료 분사구문(having p.p.)\u003c/span> : [[having]] + [과거분사] = '~하고 나서, ~한 후에' : \"그렇게 하고 난 다음에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사의 병렬 구조\u003c/span> : be prone [to adjust ...] and [to believe ...] : \"변경된 메시지를 믿는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"In short, 요약하자면. it seems that, ~인 것 같다. we are prone to adjust our messages to our listeners, 우리는 듣는 사람에게 맞춰 메시지를 조정하고. and, having done so, 그렇게 하고 난 다음에는. to believe the altered message, 그 변경된 메시지를 믿는. 이 문장 전체를 해석하면, 요약하자면, 우리는 듣는 사람에게 맞춰 메시지를 조정하고, 그렇게 하고 난 다음에는 그 변경된 메시지를 믿는 경향이 있는 것 같다.","hl":"m"},{"n":34,"text":"이 문장은 글 전체를 맺는 요약 문장이자 주제문이에요. 우리는 듣는 사람에 맞춰 메시지를 조정하고, 그러고 나면 자기가 바꾼 메시지를 스스로 믿게 된다는 결론이죠. 앞에서 본 실험을 한 줄로 정리하면서 saying becomes believing을 확인해 주는 문장입니다.","hl":"mn"},{"n":35,"text":"첫 번째로 it seems that은 that절을 뒤로 보내고 그 자리에 가주어 it을 세운 구문이에요. 두 번째로 are prone to adjust는 prone에 to와 동사원형이 붙어 경향을 나타내는 형태죠. 세 번째로 having done so는 앞선 동작이 먼저 끝났음을 보여 주는 완료형 분사구문이고요. 네 번째로 to believe는 앞의 to adjust와 병렬로 연결되어 조정하고 믿는다는 두 행동을 나란히 이어 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사람들은 자신이 의심하는 것에 대해 말이나 글로 증언하도록 유도되면, 자기 말이 \u003cb class=\"key\">허위\u003c/b>라는 데 대해 기분 나쁘게 느낀다.\u003c/li>\u003cli>그러나 곧 자신이 말하고 있는 것을 \u003cb class=\"key\">믿기 \u003c/b>\u003cb class=\"key\">시작\u003c/b>하며, 설득력 있는 외부의 설명이 없을 때 \u003cb class=\"key\">말하는 \u003c/b>\u003cb class=\"key\">것이 \u003c/b>\u003cb class=\"key\">곧 \u003c/b>\u003cb class=\"key\">믿는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 된다.\u003c/li>\u003cli>Higgins의 실험에서 학생들은 받는 사람이 좋아하는 사람을 더 \u003cb class=\"key\">긍정적으로 \u003c/b>\u003cb class=\"key\">기술\u003c/b>했고, 그 뒤 자신도 그 사람을 더 좋아하게 되었으며 읽은 내용도 더 긍정적으로 \u003cb class=\"key\">기억\u003c/b>했다.\u003c/li>\u003cli>결국 우리는 듣는 사람에게 맞춰 \u003cb class=\"key\">메시지를 \u003c/b>\u003cb class=\"key\">조정\u003c/b>하고, 그렇게 변경된 메시지를 \u003cb class=\"key\">믿는 \u003c/b>\u003cb class=\"key\">경향\u003c/b>이 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>When people are led to say something without a compelling external explanation, saying becomes believing, and they end up believing the altered message they have delivered to their listeners.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사람들은 자신이 의심하는 것이라도 말이나 글로 증언하도록 유도되면 그 \u003cb class=\"key\">허위\u003c/b>에 대해 기분 나쁘게 느끼지만, 곧 자신이 말하고 있는 것을 \u003cb class=\"key\">믿기 \u003c/b>\u003cb class=\"key\">시작\u003c/b>한다. 설득력 있는 외부의 설명이 없을 때 말하는 것이 곧 믿는 것이 되며, 우리는 듣는 사람에게 맞춰 \u003cb class=\"key\">메시지를 \u003c/b>\u003cb class=\"key\">조정\u003c/b>하고 그렇게 변경된 메시지를 믿는 경향이 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"정리해 볼게요. 우리는 의심스러운 것도 말하게 되면 곧 그것을 믿게 되고, 듣는 사람에게 맞춘 메시지가 결국 자기 신념이 됩니다. 이 흐름을 기억해 두면 비슷한 글에서 주장과 근거를 빠르게 잡아낼 수 있어요. 오늘 수업은 여기까지입니다, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
