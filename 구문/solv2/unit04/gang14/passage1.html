  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"구문사고력 14강 reading01","audioDir":"passage1_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">14강\u003cbr>reading01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>The Human Desire to Be Heard, Not Corrected\u003c/h1>\u003ch2>사람은 고쳐 주기보다 들어주기를 원한다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사람들은 누군가에게 \u003cb class=\"key\">잘못을 \u003c/b>\u003cb class=\"key\">지적받는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 싫어하며, 자신의 \u003cb class=\"key\">입장이 \u003c/b>\u003cb class=\"key\">존중받고 \u003c/b>\u003cb class=\"key\">이해되기\u003c/b>를 원한다. 특히 \u003cb class=\"key\">귀 \u003c/b>\u003cb class=\"key\">기울여 \u003c/b>\u003cb class=\"key\">들어주는 \u003c/b>\u003cb class=\"key\">것\u003c/b>은 인간 마음의 가장 큰 소망 중 하나이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>People hate being corrected and want their positions to be respected and understood, because being listened to and heard is one of the greatest desires of the human heart.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 사람들이 왜 잘못을 지적받는 것을 싫어하면서도 자신의 이야기를 들어주기를 바라는지 다뤄 볼 거예요. 이 글은 누군가에게 잘못을 지적받았을 때 정말 고맙다고 말할 수 있는지 묻고, 결국 사람은 고쳐 주기보다 들어주기를 원한다는 점을 보여 줍니다. 핵심은 모든 사람이 잘못을 지적받는 것을 싫어하고, 자신의 입장이 존중받고 이해되기를 바라며, 귀 기울여 들어주는 것이 인간 마음의 가장 큰 소망 중 하나라는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인간은 사회적 존재라서 다른 사람에게 \u003cb class=\"key\">인정받고 \u003c/b>\u003cb class=\"key\">싶은 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>가 매우 강합니다. 심리학에서는 이 욕구를 소속감(belonging)과 자기 존중감(self-esteem)에 연결해 설명합니다. 잘못을 지적하는 말은 내용이 맞더라도 상대에게는 \u003cb class=\"key\">비판\u003c/b>으로 들리기 쉽습니다. 그래서 사람들은 고쳐 주기(correction)보다 들어주기(listening)에서 안정감을 느낍니다. 친구가 내 고민을 해결해 주지 않아도 끝까지 들어 주기만 하면 마음이 풀리는 일상의 장면과 비슷합니다. 결국 \u003cb class=\"key\">경청\u003c/b>은 정보 전달을 넘어 관계를 지켜 주는 힘이 됩니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경을 볼게요. 인간은 사회적 존재라서 다른 사람에게 인정받고 싶은 욕구가 매우 강해요. 심리학에서는 이 욕구를 소속감과 자기 존중감에 연결해 설명하죠. 잘못을 지적하는 말은 내용이 맞더라도 상대에게는 비판으로 들리기 쉽습니다. 그래서 사람들은 고쳐 주기보다 들어주기에서 안정감을 느껴요. 친구가 내 고민을 해결해 주지 않아도 끝까지 들어 주기만 하면 마음이 풀리는 일상의 장면과 비슷하죠. 결국 경청은 정보 전달을 넘어 관계를 지켜 주는 힘이 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문 던지기\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글은 누군가에게 \u003cb class=\"key\">잘못을 \u003c/b>\u003cb class=\"key\">지적받았을 \u003c/b>\u003cb class=\"key\">때\u003c/b> 그 사람에게 고맙다고 말한 적이 있는지 묻습니다. 이어서 이제야 깨닫겠다며 상대가 훌륭하다고 인정하는 상황을 상상하게 하죠. 이런 \u003cb class=\"key\">수사적 \u003c/b>\u003cb class=\"key\">질문\u003c/b>은 독자의 경험을 떠올리게 하며 글의 문제를 자연스럽게 열어 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>반대 상황 확인\u003csmall>질문-답변 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>이번에는 반대로 누군가의 잘못을 지적했을 때 상대가 고마워하며 자신을 희생해 \u003cb class=\"key\">당신이 \u003c/b>\u003cb class=\"key\">옳다\u003c/b>고 인정한 적이 있는지 묻습니다. 그리고 바로 \u003cb class=\"key\">물론 \u003c/b>\u003cb class=\"key\">아니다\u003c/b>라고 답하며 그런 반응은 현실에서 거의 없음을 못 박습니다. 독자는 이 부정적 답을 통해 \u003cb class=\"key\">지적받는 \u003c/b>\u003cb class=\"key\">것\u003c/b>에 대한 보편적 거부감을 예감하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>진실 제시\u003csmall>전환 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>그다음 \u003cb class=\"key\">진실\u003c/b>은이라는 표현으로 화제를 돌려 모든 사람이 \u003cb class=\"key\">지적받는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 싫어한다고 말합니다. 그 이유로 우리 모두는 자신의 \u003cb class=\"key\">입장\u003c/b>이 다른 사람에게 존중받고 이해되기를 바란다고 설명하죠. 앞선 질문의 답이 인간의 보편적 욕구와 연결되는 순간입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>핵심 소망\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>마지막 문장은 \u003cb class=\"key\">귀 \u003c/b>\u003cb class=\"key\">기울여 \u003c/b>\u003cb class=\"key\">들어주는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 인간 마음의 가장 큰 소망 중 하나라고 강조합니다. 즉 이 글은 잘못을 고쳐 주는 일보다 상대의 말을 \u003cb class=\"key\">경청\u003c/b>해 주는 일이 더 중요하다는 깨달음으로 마무리됩니다. 독자는 이 문장에서 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 확인하게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 누군가에게 잘못을 지적받았을 때 그 사람에게 정말 고맙다고 말한 적이 있는지 묻습니다. 이어서 이제야 깨닫겠다며 상대가 훌륭하다고 인정하는 상황을 상상하게 하죠. 이런 수사적 질문은 독자의 경험을 떠올리게 하면서 글의 문제를 자연스럽게 열어 줍니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 반대로 누군가의 잘못을 지적했을 때 상대가 고마워하며 자신을 희생해 당신이 옳다고 인정한 적이 있는지 묻습니다. 그리고 바로 물론 아니다라고 답하면서 그런 반응은 현실에서 거의 없음을 못 박죠. 독자는 이 부정적 답을 통해 지적받는 것에 대한 보편적 거부감을 예감하게 됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 진실은이라는 표현으로 화제를 돌려 모든 사람이 지적받는 것을 싫어한다고 말합니다. 그 이유로 우리 모두는 자신의 입장이 다른 사람에게 존중받고 이해되기를 바란다고 설명하죠. 앞선 질문의 답이 인간의 보편적 욕구와 연결되는 순간입니다.","hl":"f2"},{"n":7,"text":"네 번째 단계인 마지막 문장은 귀 기울여 들어주는 것이 인간 마음의 가장 큰 소망 중 하나라고 강조합니다. 즉 이 글은 잘못을 고쳐 주는 일보다 상대의 말을 경청해 주는 일이 더 중요하다는 깨달음으로 마무리되죠. 독자는 이 문장에서 글 전체의 주제를 확인하게 됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 첫 문장부터 Have you ever라는 \u003cb class=\"key\">수사적 \u003c/b>\u003cb class=\"key\">질문\u003c/b>으로 시작해 독자의 경험을 끌어냅니다. 이어 Of course not으로 답을 제시한 뒤, The truth is로 \u003cb class=\"key\">화제 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 하며 모든 사람이 지적받기 싫어한다는 사실을 밝힙니다. 마지막 문장에서 귀 기울여 들어주기가 인간의 가장 큰 소망이라는 결론을 제시하므로 핵심 주장이 뒤에 오는 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Have you ever (1)\u003c/b>\u003cspan>수사적 질문으로 도입\u003c/span>\u003cb>Or (4)\u003c/b>\u003cspan>대안 질문 제시\u003c/span>\u003cb>Of course not (5)\u003c/b>\u003cspan>부정적 답변 제시\u003c/span>\u003cb>The truth is (6)\u003c/b>\u003cspan>진실 제시로 전환\u003c/span>\u003cb>all of us (6)\u003c/b>\u003cspan>보편성 강조\u003c/span>\u003cb>Being listened to and heard (8)\u003c/b>\u003cspan>결론 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">be corrected\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">showing me that I'm wrong\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">correcting them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">hate to be corrected\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">positions to be respected and understood\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Being listened to and heard\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>잘못 지적받기\u003c/th>\u003cth>존중·경청받기\u003c/th>\u003c/tr>\u003ctr>\u003ctd>불편하고 싫은 경험\u003c/td>\u003ctd>안정감과 만족을 주는 경험\u003c/td>\u003c/tr>\u003ctr>\u003ctd>당신이 옳다는 인정을 기대하기 어려움\u003c/td>\u003ctd>인간 마음의 가장 큰 소망 중 하나\u003c/td>\u003c/tr>\u003ctr>\u003ctd>모든 사람이 싫어함\u003c/td>\u003ctd>모든 사람이 원함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"전개 방식을 보면 이 글은 질문과 답변의 흐름을 활용합니다. 첫 문장부터 Have you ever라는 수사적 질문으로 시작해 독자의 경험을 끌어내죠. 이어 Of course not으로 답을 제시한 뒤 The truth is로 화제 전환을 하며 모든 사람이 지적받기 싫어한다는 사실을 밝힙니다. 마지막 문장에서 결론을 제시하므로 핵심 주장이 뒤에 오는 미괄식 구조라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 첫 문장의 Have you ever는 수사적 질문으로 도입하는 표지이고, Or는 대안 질문을 이어 주는 표지예요. Of course not은 앞선 질문에 대한 부정적 답변을 분명히 하고, The truth is는 진실을 제시하면서 화제를 전환하는 신호입니다. 또 be corrected와 correcting, hate to be corrected 같은 표현이 반복되며 지적받는 상황을 재진술하고, positions to be respected and understood와 Being listened to and heard가 서로 이어지죠. 이렇게 부정적 반응과 인간의 소망을 대조하면서 읽으면 글의 중심이 더 선명해집니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>correct\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바로잡다, 지적하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be corrected by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게 지적받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>say to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게 말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>person\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>try to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하려고 애쓰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thank\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다, 알려 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wrong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>틀린\u003c/span>\u003c/div>\u003cdiv>\u003cb>right\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>옳은\u003c/span>\u003c/div>\u003cdiv>\u003cb>see\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨닫다, 알다\u003c/span>\u003c/div>\u003cdiv>\u003cb>great\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>훌륭한\u003c/span>\u003c/div>\u003cdiv>\u003cb>state\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다, 진술하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at one's expense\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~를 희생시키면서, ~에게 불리하게 하면서\u003c/span>\u003c/div>\u003cdiv>\u003cb>of course not\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>물론 아니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>truth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진실, 사실\u003c/span>\u003c/div>\u003cdiv>\u003cb>hate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>싫어하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>all of us\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우리 모두\u003c/span>\u003c/div>\u003cdiv>\u003cb>position\u003c/b>\u003cem>명사\u003c/em>\u003cspan>입장, 견해\u003c/span>\u003c/div>\u003cdiv>\u003cb>respect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>존중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>listen to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게 귀 기울이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>듣다, 들어주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>desire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소망, 욕구\u003c/span>\u003c/div>\u003cdiv>\u003cb>human heart\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인간의 마음\u003c/span>\u003c/div>\u003cdiv>\u003cb>greatest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 큰\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚어 볼게요. be corrected by는 누군가에게 지적받는다는 뜻이고, at one's expense는 상대를 희생시키면서 또는 상대에게 불리하게 하면서라는 의미예요. 또 position은 입장이나 견해, desire는 소망이나 욕구로 기억해 두면 좋습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">wrong\u003c/b>\u003cspan class=\"m\">틀린\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">incorrect\u003c/span>\u003cspan class=\"s\">mistaken\u003c/span>\u003cspan class=\"s\">false\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">right\u003c/span>\u003cspan class=\"a\">correct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">right\u003c/b>\u003cspan class=\"m\">옳은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">correct\u003c/span>\u003cspan class=\"s\">accurate\u003c/span>\u003cspan class=\"s\">true\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wrong\u003c/span>\u003cspan class=\"a\">incorrect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hate\u003c/b>\u003cspan class=\"m\">싫어하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">detest\u003c/span>\u003cspan class=\"s\">loathe\u003c/span>\u003cspan class=\"s\">dislike\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">love\u003c/span>\u003cspan class=\"a\">like\u003c/span>\u003cspan class=\"a\">adore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">respect\u003c/b>\u003cspan class=\"m\">존중하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">admire\u003c/span>\u003cspan class=\"s\">esteem\u003c/span>\u003cspan class=\"s\">honor\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disrespect\u003c/span>\u003cspan class=\"a\">scorn\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">understand\u003c/b>\u003cspan class=\"m\">이해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comprehend\u003c/span>\u003cspan class=\"s\">grasp\u003c/span>\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003cspan class=\"a\">confuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">listen to\u003c/b>\u003cspan class=\"m\">~에게 귀 기울이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pay attention to\u003c/span>\u003cspan class=\"s\">heed\u003c/span>\u003cspan class=\"s\">attend to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">disregard\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">desire\u003c/b>\u003cspan class=\"m\">소망, 욕구\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wish\u003c/span>\u003cspan class=\"s\">longing\u003c/span>\u003cspan class=\"s\">craving\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">aversion\u003c/span>\u003cspan class=\"a\">indifference\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘도 동의어와 반의어로 정리해 볼게요. hate는 detest나 loathe처럼 싫어하다는 뜻의 단어들과 연결되고, 반대말은 love나 like가 됩니다. respect는 admire나 honor로 바꿔 쓸 수 있고, 반대말은 disrespect나 scorn이에요. understand는 comprehend나 grasp로, listen to는 pay attention to나 heed로 바꿔 볼 수 있습니다. desire는 wish나 longing으로 표현할 수 있고, 반대 방향의 느낌은 aversion이나 indifference로 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 ~해 본 적이 있습니까 / 누군가에게 지적을 받은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Have \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">ever \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">corrected\u003c/span> by someone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 말했습니까 / 당신을 고쳐 주려고 하는 그 사람에게\u003c/span>\u003cspan class=\"en\">and said to the person \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">trying \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">correct \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“정말 고맙습니다 / 나에게 보여 주셔서\u003c/span>\u003cspan class=\"en\">&quot;Thank you so much \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">showing \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 틀렸고 당신이 옳다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">wrong \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">you're \u003c/span>\u003cspan class=\"tgt\">right\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">누군가가 당신의 잘못을 지적했을 때, 올바르게 고쳐 주려고 애썼던 그 사람에게 “제가 틀렸고, 당신이 옳다는 사실을 알려 주셔서 매우 고맙습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상대에게 잘못을 지적받고도 기꺼이 고맙다고 말하는 \u003cb class=\"key\">상황\u003c/b>을 일부러 던져 독자의 \u003cb class=\"key\">공감\u003c/b>을 끌어내는 문장이에요. 실제로는 그런 사람이 없다는 점을 강조하려고 \u003cb class=\"key\">극단적\u003c/b>인 예를 든 거죠. 뒤에 나오는 of course not과 짝을 이루며 '누구도 지적받기를 좋아하지 않는다'는 \u003cb class=\"key\">주제\u003c/b>로 넘어가는 발판이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 수동태(경험)\u003c/span> : have/has + p.p. (수동: have/has + been + p.p.) : \"지적을 받아 본 적이 있습니까\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사(형용사적 용법)\u003c/span> : 명사 + [현재분사(~ing) + 목적어] : \"당신을 고쳐 주려고 하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for + 동명사\u003c/span> : Thank you for + [동명사(~ing)] : \"나에게 보여 주셔서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">접속사 that(명사절) + 병렬\u003c/span> : show + 목적어 + [that + 주어 + 동사] : \"내가 틀렸고 당신이 옳다는 것을\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Have you ever been corrected by someone, 당신은 ~해 본 적이 있습니까 / 누군가에게 지적을 받은. and said to the person trying to correct you, 그리고 말했습니까 / 당신을 고쳐 주려고 하는 그 사람에게. \"Thank you so much for showing me, “정말 고맙습니다 / 나에게 보여 주셔서. that I'm wrong and you're right, 내가 틀렸고 당신이 옳다는 것을. 이 문장 전체를 해석하면, 누군가가 당신의 잘못을 지적했을 때, 올바르게 고쳐 주려고 애썼던 그 사람에게 “제가 틀렸고, 당신이 옳다는 사실을 알려 주셔서 매우 고맙습니다.","hl":"m"},{"n":13,"text":"이 문장은 잘못을 지적받고도 기꺼이 고맙다고 말하는 상황을 일부러 던져서 독자의 공감을 끌어내요. 그런데 실제로 그런 사람은 없다는 걸 강조하려고 극단적인 예를 든 거죠. 그래서 뒤에 나오는 of course not과 짝을 이루면서 글의 주제로 넘어가는 발판이 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째로 Have you ever been corrected는 현재완료 수동태예요. 경험을 묻는 have you ever에 수동태가 붙어서 '지적을 받아 본 적이 있나요'가 되는 거죠. 두 번째로 the person trying to correct you에서 trying은 앞의 the person을 꾸미는 현재분사예요. 명사 뒤에서 '고쳐 주려고 하는 사람'처럼 능동으로 해석해 주면 됩니다. 세 번째로 for showing me는 전치사 for 뒤에 동명사가 와서 '보여 주셔서'라는 감사의 대상을 만드는 관용 표현이에요. 마지막으로 that I'm wrong and you're right에서 that은 showing의 목적어 역할을 하는 명사절을 이끄는 접속사이고, 그 안에서 두 절이 and로 병렬을 이루고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제야\u003c/span>\u003cspan class=\"en\">Now\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그것을 알겠습니다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">see\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제야 깨닫겠군요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> '바로 이제야 알겠다'는 뜻으로, 앞에서 말한 \u003cb class=\"key\">상황\u003c/b>을 스스로 인정하는 반응이에요. 앞 문장의 인용문 안에서 이어지는 말이라 지적을 받아들이는 사람의 \u003cb class=\"key\">태도\u003c/b>를 흉내 내 보여 주는 역할을 하죠. 짧은 문장이지만 앞 문장과 함께 하나의 \u003cb class=\"key\">인용\u003c/b> 덩어리를 이룹니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상태동사 see(인지)\u003c/span> : see = '알다, 깨닫다' (진행형 불가) : \"알겠습니다, 깨닫겠습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시대명사 it(앞 내용 전체 지칭)\u003c/span> : it = 앞 문장·앞 절의 내용 : \"그것을, 그 사실을\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Now, 이제야. I see it, 나는 그것을 알겠습니다. 이 문장 전체를 해석하면, 이제야 깨닫겠군요.","hl":"m"},{"n":16,"text":"이 문장은 '바로 이제야 알겠다'는 뜻으로, 앞에서 말한 상황을 스스로 인정하는 반응이에요. 앞 문장의 인용문 안에서 이어지는 말이라 지적을 받아들이는 사람의 태도를 흉내 내 보여 주는 역할을 하죠. 짧은 문장이지만 앞 문장과 함께 하나의 인용 덩어리를 이룹니다.","hl":"mn"},{"n":17,"text":"첫 번째로 동사 see는 여기서 '보다'가 아니라 '알다, 깨닫다'라는 뜻으로 쓰였어요. 이런 상태동사는 진행형으로 쓰지 않는다는 점도 같이 기억해 두세요. 두 번째로 it은 앞에서 언급된 내용 전체를 받는 지시대명사예요. 그래서 '그것'이 아니라 '그 사실' 정도로 풀어 주면 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런, 아이 참\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Boy\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 참 훌륭하십니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you're \u003c/span>\u003cspan class=\"tgt\">great\u003c/span>!&quot;?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 참 훌륭하십니다.”라고 말해 본 적이 있습니까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상대를 \u003cb class=\"key\">칭찬\u003c/b>하는 듯한 감탄 표현으로, 앞의 감사 인사와 묶여 지나치게 \u003cb class=\"key\">과장\u003c/b>된 반응을 만들어요. 이런 말을 실제로 하는 사람은 없다는 사실을 드러내기 위한 \u003cb class=\"key\">반어\u003c/b>적 장치죠. 그래서 다음 문장의 of course not이 아주 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄사\u003c/span> : 감탄사 + , + 문장 : \"이런, 아이 참\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : 주어 + be동사 + [주격보어(형용사)] : \"당신은 참 훌륭하십니다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Boy, 이런, 아이 참. you're great!\"?, 당신은 참 훌륭하십니다. 이 문장 전체를 해석하면, 당신은 참 훌륭하십니다.”라고 말해 본 적이 있습니까?","hl":"m"},{"n":19,"text":"이 문장은 상대를 칭찬하는 듯한 감탄 표현이에요. 앞의 감사 인사와 묶여서 지나치게 과장된 반응을 만들어 내죠. 이런 말을 실제로 하는 사람은 없다는 걸 드러내기 위한 반어적 장치라서, 다음에 나오는 of course not이 아주 자연스럽게 이어집니다.","hl":"mn"},{"n":20,"text":"첫 번째로 Boy는 '소년'이라는 명사가 아니라 놀람과 감탄을 나타내는 감탄사로 쓰였어요. 그래서 '이런, 아이 참'이라는 느낌을 더해 줍니다. 두 번째로 you're great은 주어 you와 be동사, 그리고 주격보어 great으로 이루어진 문장이에요. be동사는 주어의 상태를 설명하는 불완전자동사라서 뒤에 주격보어가 꼭 필요하고, 그래서 '당신은 훌륭합니다'라는 뜻이 만들어집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은,\u003c/span>\u003cspan class=\"en\">Or,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가 당신에게 고마움을 표시한 적이 있습니까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">anyone \u003c/span>\u003cspan class=\"tgt\">thanked \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 잘못을 지적해 주었을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">correcting \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">stating \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 옳다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">&quot;right&quot;\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신을 희생시키면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">expense\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">혹은, 당신이 누군가의 잘못을 지적해 주었을 때 상대방이 고마움을 표시하거나 그들 자신을 희생시키면서 (불쾌한 것을 참고) 당신이 옳다고 인정했던 적이 있습니까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 상황이 실제로 일어날 수 있는지 되묻는 \u003cb class=\"key\">수사 \u003c/b>\u003cb class=\"key\">의문문\u003c/b>으로, 답은 이미 정해져 있어요. 핵심은 \u003cb class=\"key\">at \u003c/b>\u003cb class=\"key\">their \u003c/b>\u003cb class=\"key\">expense\u003c/b>, 즉 '그들 자신을 희생시키면서'인데, 자기 잘못이 드러나는 손해를 감수하고서라도 상대가 옳다고 인정하는 사람은 없다는 뜻이죠. thank A for B 구조로 'B한 것에 대해 A에게 감사하다'를 표현한 점도 눈여겨보세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 의문문(경험)\u003c/span> : has/have + [주어] + [과거분사] ~? (경험: ~한 적이 있습니까) : \"누군가 당신에게 그들의 잘못을 지적해 준 것에 대해 고마움을 표시한 적이 있습니까\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 동명사(전치사의 목적어)\u003c/span> : thank [목적어] + for + [동명사(-ing)] : \"그들의 잘못을 지적해 준 것에 대해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사, 동시 상황)\u003c/span> : [주어] + [동사] ..., ~ing + [목적어/보어] (접속사+주어 생략) : \"당신이 옳다고 말하면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">관용표현(at one's expense)\u003c/span> : at + [소유격] + expense (남을 희생시켜, ~의 비용으로) : \"그들 자신을 희생시키면서\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Or, 혹은. has anyone thanked you, 누군가 당신에게 고마움을 표시한 적이 있습니까. for correcting them, 그들의 잘못을 지적해 주었을 때. stating that, 말하면서. you are \"right\", 당신이 옳다고. at their expense?, 그들 자신을 희생시키면서. 이 문장 전체를 해석하면, 혹은, 당신이 누군가의 잘못을 지적해 주었을 때 상대방이 고마움을 표시하거나 그들 자신을 희생시키면서 (불쾌한 것을 참고) 당신이 옳다고 인정했던 적이 있습니까?","hl":"m"},{"n":22,"text":"이 문장은 앞에서 말한 상황을 되묻는 수사 의문문이에요. 자기 잘못을 지적받고도 기꺼이 고맙다고 말하는 사람이 있느냐고 묻지만, 사실상 답은 이미 정해져 있죠. 핵심은 at their expense인데, 상대가 옳아지기 위해 자기 자신이 손해를 감수하는 경우는 없다는 뜻이에요.","hl":"mn"},{"n":23,"text":"첫 번째, has anyone thanked you에서는 현재완료를 써서 지금까지의 경험을 묻고 있어요. have와 과거분사 thanked가 결합한 형태이고, 주어 anyone이 단수라서 has를 썼다는 점도 챙겨 주세요. 두 번째, for correcting them에서 전치사 for 뒤에는 절이 올 수 없으니 동사 correct를 동명사 correcting으로 바꿔 목적어 자리에 넣었어요. thank A for B, B한 것에 대해 A에게 감사하다는 관용 표현이죠. 세 번째, stating that you are right는 접속사와 주어를 지운 분사구문이에요. 주절 주어 anyone이 stating의 의미상 주어로 이어지고, stating 뒤에는 that절이 와서 말한 내용을 담습니다. 네 번째, at their expense는 누군가를 희생시켜라는 뜻의 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물론\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Of \u003c/span>\u003cspan class=\"tgt\">course \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아닙니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">not.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">물론 없을 겁니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 두 질문에 대해 독자 모두가 같은 답을 갖도록 단호하게 \u003cb class=\"key\">부정\u003c/b>하는 문장이에요. '물론 없을 겁니다'라고 못 박아 \u003cb class=\"key\">공감대\u003c/b>를 형성하고, 이어질 '우리 모두는 지적받는 것을 싫어한다'는 결론을 자연스럽게 준비하죠. Of course not은 앞 문장 전체를 받아 '그럴 리가 없다'고 강조하는 \u003cb class=\"key\">생략 \u003c/b>\u003cb class=\"key\">표현\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 대답의 생략 표현\u003c/span> : Of course + not (= Of course + [주어] + [동사] + not) : \"물론 아닙니다 / 물론 그럴 리 없습니다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Of course, 물론. not, 아닙니다. 이 문장 전체를 해석하면, 물론 없을 겁니다.","hl":"m"},{"n":25,"text":"이 문장은 앞의 두 질문에 대해 단호하게 부정하면서 독자 모두의 공감대를 만드는 역할을 해요. 짧지만 글의 흐름에서는 다음 결론으로 넘어가는 중요한 신호탄이죠.","hl":"mn"},{"n":26,"text":"Of course not. 은 앞 문장 전체를 받아 동사 이하를 다 지운 생략 구문이에요. not 하나로 아니죠를 표현하는 생략 표현인 셈이죠. of course가 당연히라는 강한 긍정을 더해서 상대의 질문을 힘있게 부정하고, 이어지는 결론을 자연스럽게 준비합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진실은\u003c/span>\u003cspan class=\"en\">The truth is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 모두가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘못을 지적받는 것을 싫어한다는 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">hate \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">corrected\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 모두는 잘못을 지적받는 것을 싫어합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 '물론 아니다'라고 부정한 뒤 그 이유를 밝히는 \u003cb class=\"key\">결론 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 모든 사람이 \u003cb class=\"key\">지적받는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 싫어한다는 보편적 심리를 제시하며, 다음 문장의 '존중받고 이해받고 싶은 욕구'로 이어지는 흐름의 출발점이 됩니다. hate to be corrected는 '틀렸다고 지적받는 상황 자체를 혐오한다'는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that절(명사절, 주격 보어)\u003c/span> : The truth is + that + [주어] + [동사] ... : \"우리 모두가 지적받는 것을 싫어한다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부분 표현 all of + 대명사(수의 일치)\u003c/span> : all of + [복수대명사] + [복수동사] : \"우리 모두\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 수동태(목적어)\u003c/span> : hate + [to be + 과거분사] : \"지적받는 것을 싫어하다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The truth is, 진실은. that all of us, 우리 모두가. hate to be corrected, 잘못을 지적받는 것을 싫어한다는 것입니다. 이 문장 전체를 해석하면, 우리 모두는 잘못을 지적받는 것을 싫어합니다.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 부정한 내용의 이유를 밝히는 결론 문장이에요. 모든 사람이 지적받는 것을 싫어한다는 보편적인 심리를 전달하고, 이어서 우리가 정말 원하는 것이 무엇인지로 글을 넘겨 주는 역할을 합니다.","hl":"mn"},{"n":29,"text":"첫 번째, that all of us hate to be corrected는 be동사 뒤에서 주어 The truth의 내용을 채우는 명사절이에요. that은 ~라는 것이라는 뜻의 접속사이고, 이 절 전체가 주격 보어 역할을 하죠. 두 번째, hate to be corrected에서 hate의 목적어로 to부정사가 왔고 지적받는다는 수동의 의미라서 to be corrected 형태를 썼어요. 목적어인 we가 지적을 받는 쪽이기 때문이에요. 세 번째, all of us는 all of 뒤에 목적격 대명사가 와서 우리 모두를 뜻하고, 주어일 때는 복수로 보아 동사 hate와 수의 일치를 이룹니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 모두는\u003c/span>\u003cspan class=\"en\">We all\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 입장이 ~하기를 원한다\u003c/span>\u003cspan class=\"en\">want our positions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">존중받기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">respected \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이해되기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">understood\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들에 의해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">others\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 모두는 우리의 입장이 다른 사람들에 의해서 존중받고 이해되기를 원합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리 모두는 자기 입장이 다른 사람에게 \u003cb class=\"key\">존중받고\u003c/b> \u003cb class=\"key\">이해받기\u003c/b>를 바란다는 뜻이에요. 앞 문장에서 모두가 교정받기 싫어한다고 했는데, 그 이유가 바로 이 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">욕구\u003c/b> 때문이라는 흐름을 만들어 줘요. 우리 입장이 '존중하는' 주체가 아니라 '존중받는' 대상이라는 점이 이 문장의 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 수동태와 병렬 구조\u003c/span> : want + [목적어 our positions] + [to be p.p. and (to be) p.p.] : \"존중받고 이해되기를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태의 행위자(by + 명사)\u003c/span> : be + p.p. + [by + 행위자] : \"다른 사람들에 의해서\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"We all, 우리 모두는. want our positions, 우리의 입장이 ~하기를 원한다. to be respected, 존중받기를. and understood, 그리고 이해되기를. by others, 다른 사람들에 의해서. 이 문장 전체를 해석하면, 우리 모두는 우리의 입장이 다른 사람들에 의해서 존중받고 이해되기를 원합니다.","hl":"m"},{"n":31,"text":"이 문장은 우리 모두가 자기 입장을 존중받고 이해받기 원한다는 걸 말하고 있어요. 왜 우리가 교정을 그렇게 싫어할까요. 이해받는 게 인간의 기본 욕구이기 때문이에요.","hl":"mn"},{"n":32,"text":"먼저 to be respected를 보세요. 우리 입장은 존중하는 주체가 아니라 존중받는 대상이니까 수동태로 써야 해요. 그리고 respected and understood는 and로 이어진 병렬 구조예요. 뒤에 to be가 또 나오면 반복이라서 깔끔하게 생략한 거죠. 마지막으로 by others는 수동태에서 행위자를 밝히는 표현이에요. 그래서 다른 사람들에 의해서 존중받고 이해되기를 이렇게 해석하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(자신이 하는 말을) 다른 사람들이 귀 기울여 들어주는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Being \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">listened \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 들어주는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">heard\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 큰 소망들 중의 하나입니다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">greatest \u003c/span>\u003cspan class=\"tgt\">desires\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간이 마음속에 품고 있는\u003c/span>\u003cspan class=\"en\">of the human heart.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">(자신이 하는 말을) 다른 사람들이 귀 기울여 들어주는 것이야말로 인간이 마음속에 품고 있는 가장 큰 소망들 중의 하나입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 듣기, 즉 다른 사람이 내 말에 \u003cb class=\"key\">귀 \u003c/b>\u003cb class=\"key\">기울여\u003c/b> 주는 것이 인간 마음의 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">소망\u003c/b> 가운데 하나라고 강조하는 문장이에요. 앞 문장의 '이해받고 싶은 마음'을 \u003cb class=\"key\">들어주기\u003c/b>라는 구체적인 행동으로 한 단계 깊게 풀어 줘요. 문장 앞부분 전체가 \u003cb class=\"key\">동명사구 \u003c/b>\u003cb class=\"key\">주어\u003c/b>로 쓰여 '~하는 것이야말로'라는 강조의 느낌을 살려요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구의 주어(수동형 동명사 + 병렬)\u003c/span> : [Being + p.p. + and + p.p.] + [단수동사 is] : \"(자신이 하는 말을) 다른 사람들이 귀 기울여 들어주는 것이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 listen의 수동태(전치사 to 유지)\u003c/span> : listen to + 목적어 → be listened to (by ~) : \"귀 기울여 들어주다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">one of the + 최상급 + 복수명사\u003c/span> : one of the + [최상급 형용사] + [복수명사] : \"가장 큰 소망들 중의 하나\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Being listened to, (자신이 하는 말을) 다른 사람들이 귀 기울여 들어주는 것이. and heard, 그리고 들어주는 것이. is one of the greatest desires, 가장 큰 소망들 중의 하나입니다. of the human heart, 인간이 마음속에 품고 있는. 이 문장 전체를 해석하면, (자신이 하는 말을) 다른 사람들이 귀 기울여 들어주는 것이야말로 인간이 마음속에 품고 있는 가장 큰 소망들 중의 하나입니다.","hl":"m"},{"n":34,"text":"이 문장은 다른 사람이 내 말에 귀 기울여 주는 것, 즉 들어주기가 인간 마음이 품은 가장 큰 소망 가운데 하나라고 말해요. 앞에서 이해받고 싶은 마음이 우리 모두에게 있다고 했죠. 그 마음을 들어주기라는 구체적인 행동으로 풀어 준 문장이에요.","hl":"mn"},{"n":35,"text":"먼저 문장 맨 앞의 Being listened to and heard를 보세요. 이건 동명사구 주어예요. '~받는 것, ~들리는 것'이라는 명사 덩어리가 통째로 주어가 된 거죠. being listened to와 heard는 and로 묶인 병렬이에요. 다음으로 listened to에서 to를 꼭 챙기세요. listen은 자동사라서 전치사 to가 필요하고, 수동태가 되어도 이 전치사 to는 사라지지 않아요. 마지막으로 one of the greatest desires에서 최상급 뒤에는 복수명사가 와요. 주어가 one이라서 동사는 is로 맞춘다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사람들은 누군가에게 \u003cb class=\"key\">잘못을 \u003c/b>\u003cb class=\"key\">지적받았을 \u003c/b>\u003cb class=\"key\">때\u003c/b> 그 사실을 반갑게 인정하며 고마워하지 않는다.\u003c/li>\u003cli>누군가의 잘못을 지적해도 상대가 자신을 희생하며 \u003cb class=\"key\">당신이 \u003c/b>\u003cb class=\"key\">옳다\u003c/b>고 말하는 경우는 거의 없다.\u003c/li>\u003cli>그 이유는 모든 사람이 \u003cb class=\"key\">지적받는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 싫어하고 자신의 입장이 존중받고 이해되기를 원하기 때문이다.\u003c/li>\u003cli>결국 \u003cb class=\"key\">귀 \u003c/b>\u003cb class=\"key\">기울여 \u003c/b>\u003cb class=\"key\">들어주는 \u003c/b>\u003cb class=\"key\">것\u003c/b>은 인간 마음의 가장 큰 소망 중 하나이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>People hate being corrected and want their positions to be respected and understood, because being listened to and heard is one of the greatest desires of the human heart.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사람들은 누군가에게 \u003cb class=\"key\">잘못을 \u003c/b>\u003cb class=\"key\">지적받는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 싫어하며, 자신의 \u003cb class=\"key\">입장이 \u003c/b>\u003cb class=\"key\">존중받고 \u003c/b>\u003cb class=\"key\">이해되기\u003c/b>를 원한다. 특히 \u003cb class=\"key\">귀 \u003c/b>\u003cb class=\"key\">기울여 \u003c/b>\u003cb class=\"key\">들어주는 \u003c/b>\u003cb class=\"key\">것\u003c/b>은 인간 마음의 가장 큰 소망 중 하나이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"정리해 볼게요. 사람들은 잘못을 지적받았을 때 반갑게 인정하며 고마워하지 않고, 누군가의 잘못을 지적해도 상대가 자신을 희생하며 당신이 옳다고 말하는 경우는 거의 없어요. 그 이유는 모든 사람이 지적받는 것을 싫어하고 자신의 입장이 존중받고 이해되기를 원하기 때문입니다. 결국 귀 기울여 들어주는 것이 인간 마음의 가장 큰 소망 중 하나라는 점을 꼭 기억하고, 오늘 수업은 여기서 마무리할게요.","hl":null}]}]});</script></body></html>
