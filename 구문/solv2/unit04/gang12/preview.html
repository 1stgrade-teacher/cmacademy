  if(D.preview){cc.classList.add("on");}

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;

  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};

lecturePlayer(document.getElementById("app"),{"brand":"12강","title":"형태가 복잡한 수동태 완전 정복하기","audioDir":"preview_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">12강 형태가 복잡한 수동태\u003c/div>\u003ch1>형태가 복잡한 수동태 완전 정복하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>조동사와 복합형 수동태, 그리고 군동사의 수동태 형태와 해석을 정확히 이해한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘은 열두 번째 시간으로 형태가 복잡한 수동태에 대해 공부해 볼 거예요. 수동태는 주어가 동작을 당하는 의미를 나타내는 문법이죠. 오늘은 조동사가 붙거나 완료형 및 진행형과 결합한 복잡한 수동태, 그리고 헷갈리기 쉬운 군동사의 수동태까지 확실하게 정리해 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">조동사가 있는 수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">조동사가 있는 문장을 수동태로 바꿀 때는 \u003cb class=\"key\">조동사\u003c/b> 뒤에 \u003cb class=\"key\">be동사의 원형\u003c/b>인 be를 쓰고 그 뒤에 과거분사를 연결해요.\u003cdiv>\u003cspan class=\"g-formula\">조동사 + be + 과거분사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Flights from Boston \u003cspan class=\"fx\">were canceled\u003c/span> because of bad weather.\u003c/div>\u003cdiv class=\"g-ko\">악천후 때문에 보스턴발 항공편이 취소되었다.\u003c/div>\u003cdiv class=\"g-note\">기본 수동태 be + p.p. 형태\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Your young son \u003cspan class=\"fx\">should not be left\u003c/span> alone at home.\u003c/div>\u003cdiv class=\"g-ko\">너의 어린 아들을 집에 혼자 두어서는 안 된다.\u003c/div>\u003cdiv class=\"g-note\">조동사 should가 포함된 수동태\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The soldiers’ sacrifice \u003cspan class=\"fx\">will never be forgotten\u003c/span> by anyone.\u003c/div>\u003cdiv class=\"g-ko\">군인들의 희생은 그 누구에게도 결코 잊혀지지 않을 것이다.\u003c/div>\u003cdiv class=\"g-note\">조동사 will이 포함된 수동태\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>조동사 수동태를 만들 때 \u003cb class=\"key\">조동사 뒤의 be\u003c/b>를 빼먹지 않도록 주의해요.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념은 조동사가 있는 수동태예요. 조동사 뒤에는 반드시 동사원형이 와야 하니까 조동사 뒤에 am이나 is 대신 be동사 원형인 be를 쓰고 그 뒤에 과거분사를 붙여서 조동사 플러스 비 플러스 과거분사 형태로 만들어요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 볼게요. Flights from Boston were canceled because of bad weather라고 했어요. 보스턴에서 출발하는 항공편들이 나쁜 날씨 때문에 취소되었다는 뜻으로 기본 수동태 형태예요.","hl":"ex-0"},{"n":4,"text":"다음 예문은 Your young son should not be left alone at home이에요. 조동사 should 뒤에 not be left가 와서 어린 아들이 혼자 남겨져서는 안 된다는 조동사 수동태를 만들었어요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문도 볼까요. The soldiers’ sacrifice will never be forgotten by anyone이라고 했어요. 조동사 will 뒤에 be forgotten이 와서 군인들의 희생이 잊혀지지 않을 것이라는 의미를 나타내요.","hl":"ex-2"},{"n":6,"text":"조동사 뒤에 동사원형을 써야 한다는 규칙 때문에 꼭 be를 넣어야 한다는 점을 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">진행형과 완료형 수동태 복합형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">진행형은 \u003cb class=\"key\">being\u003c/b>을, 완료형은 \u003cb class=\"key\">been\u003c/b>을 수동태인 be + p.p.와 결합하여 사용해요.\u003cdiv>\u003cspan class=\"g-formula\">be + being + p.p. / have[has/had] + been + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Those men \u003cspan class=\"fx\">are being watched\u003c/span> by the police.\u003c/div>\u003cdiv class=\"g-ko\">저 남자들은 경찰의 감시를 받고 있다.\u003c/div>\u003cdiv class=\"g-note\">현재진행 수동태\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The price of gas \u003cspan class=\"fx\">has been raised\u003c/span> over 200% since last year.\u003c/div>\u003cdiv class=\"g-ko\">가스 가격이 작년 이후로 200퍼센트 이상 올랐다.\u003c/div>\u003cdiv class=\"g-note\">현재완료 수동태\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The dog \u003cspan class=\"fx\">had been kicked\u003c/span> so much that it was afraid of people.\u003c/div>\u003cdiv class=\"g-ko\">그 개는 너무 많이 발길질을 당해서 사람을 무서워했다.\u003c/div>\u003cdiv class=\"g-note\">과거완료 수동태\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>시제와 수동태를 나타내는 표현들이 합쳐질 때 \u003cb class=\"key\">순서와 형태\u003c/b>가 헷갈리지 않게 조심하세요.\u003c/div>","segs":[{"n":7,"text":"두 번째 개념은 수동태 동사 복합형이에요. 진행형의 be plus ing와 수동태의 be plus p.p.를 합치면 be plus being plus p.p.가 되고 완료형의 have plus p.p.와 합치면 have plus been plus p.p. 형태가 돼요.","hl":"rule"},{"n":8,"text":"첫 번째 예문은 Those men are being watched by the police예요. are being watched 형태를 써서 저 남자들이 지금 경찰에게 감시를 당하고 있는 진행 중인 수동태를 나타내고 있어요.","hl":"ex-0"},{"n":9,"text":"두 번째 예문은 The price of gas has been raised over 200% since last year예요. has been raised를 사용해서 작년부터 지금까지 가스 가격이 인상되었다는 현재완료 수동태를 보여주고 있어요.","hl":"ex-1"},{"n":10,"text":"세 번째 예문은 The dog had been kicked so much that it was afraid of people이에요. had been kicked는 과거완료 수동태로 과거의 특정 시점 이전에 개가 학대를 당해왔음을 나타내요.","hl":"ex-2"},{"n":11,"text":"진행형에는 being, 완료형에는 been이 들어간다는 위치를 정확하게 기억해 두는 것이 좋아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">군동사의 수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사에 부사나 전치사가 결합한 \u003cb class=\"key\">군동사\u003c/b>는 수동태가 되어도 전체가 \u003cb class=\"key\">하나의 덩어리\u003c/b>로 움직여요.\u003cdiv>\u003cspan class=\"g-formula\">군동사 (동사 + 부사/전치사) + 수동태\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">A change in the law \u003cspan class=\"fx\">was finally brought about\u003c/span> by years of protest.\u003c/div>\u003cdiv class=\"g-ko\">법의 변화는 수년간의 항의 덕분에 마침내 초래되었다.\u003c/div>\u003cdiv class=\"g-note\">bring about의 수동태\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Your elderly parents \u003cspan class=\"fx\">will be taken care of\u003c/span> by Ann while you are away.\u003c/div>\u003cdiv class=\"g-ko\">네가 없는 동안 연세가 있으신 부모님은 앤이 보살펴 드릴 것이다.\u003c/div>\u003cdiv class=\"g-note\">take care of의 수동태\u003c/div>\u003c/div>\u00 iv>\u003cdiv class=\"g-qs\">군인들의 희생은 결코 잊혀지지 않을 것이다. (forget 이용)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The soldiers’ sacrifice will never be forgotten\u003c/span>\u003cdiv class=\"g-exp\">조동사 will과 수동태 be forgotten을 결합하여 영작한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"마지막 여섯 번째 문제는 영작 문제예요. 주어진 우리말 뜻에 맞게 조동사 수동태를 활용하여 영작해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 The soldiers’ sacrifice will never be forgotten이에요. 조동사 will 뒤에 not이 아니라 never를 쓰고 be forgotten을 연결해 주면 완성돼요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">12강 형태가 복잡한 수동태\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>조동사가 있는 수동태는 \u003cb class=\"key\">조동사 + be + p.p.\u003c/b> 형태로 쓴다.\u003c/li>\u003cli>진행형과 완료형은 \u003cb class=\"key\">being\u003c/b>과 \u003cb class=\"key\">been\u003c/b>을 수동태와 결합하여 복합형으로 만든다.\u003c/li>\u003cli>군동사는 수동태가 되어도 전체가 \u003cb class=\"key\">하나의 덩어리\u003c/b>로 움직여서 뒤에 부사나 전치사가 남는다.\u003c/li>\u003c/ul>","segs":[{"n":36,"text":"오늘 우리는 조동사가 있는 수동태와 진행형 및 완료형 복합 수동태, 그리고 헷갈리기 쉬운 군동사의 수동태까지 형태가 복잡한 수동태들을 모두 정리해 보았어요. 다양한 형태가 나와도 기본 구조인 be plus p.p.를 바탕으로 차근차근 적용하면 쉽게 해결할 수 있으니 복습을 꼭 철저히 해 주세요. 오늘 강의는 여기서 마칠게요. 수고하셨어요.","hl":"sum"}]}]});</script></body></html>
