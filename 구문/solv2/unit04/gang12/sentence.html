    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

lecturePlayer(document.getElementById("app"),{"brand":"12강","title":"12강 noticing sentences 고난도 수동태 구문 분석 특강","audioDir":"구문_12강_noticing_sentences_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">12강 noticing sentences\u003c/div>\u003ch1>12강 noticing sentences 고난도 수동태 구문 분석 특강\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>복잡한 수동태 동사 모양과 분사 구문을 정확하게 파악하고 해석한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 여러분과 함께 공부할 내용은 열두 번째 유닛인 noticing sentences예요. 문장 속에 숨어 있는 복잡한 수동태 모양들을 꼼꼼하게 짚어보면서 독해 실력을 확실히 높여볼게요. 집중해서 선생님을 잘 따라오세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">12강 noticing sentences\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">이 유닛의 핵심은 \u003cb class=\"key\">비동사 더하기 과거분사\u003c/b>로 이루어진 수동태 표현과 \u003cb class=\"key\">명사를 뒤에서 수식하는 분사\u003c/b>를 정확하게 알아보는 것이에요. 문장의 주어가 동작을 직접 하는지 아니면 당하는지를 따져보는 게 핵심 포인트랍니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>ex. Although coffee is considered one of the tastiest beverages, it is still avoided by many people because of the groundless fear that it can damage human health.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>01 Australia \u003cspan class=\"fx\">was colonized\u003c/span> 45,000 years ago by pioneers spreading east from Africa along the shore of Asia.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>02 We push down our feelings because most of us \u003cspan class=\"fx\">have been brought up\u003c/span> to believe that there are feelings which are unacceptable.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>03 The City Animal Shelter is displaying 'cool city pets' for adoption every Saturday. Available small animals include hamsters, rabbits, guinea pigs, rats and mice. Children must be accompanied by an adult.\u003c/ ,"segs":[{"n":3,"text":"Although coffee is considered, 비록 커피가 여겨지지만. one of the tastiest beverages, 가장 맛있는 음료 중의 하나로. it is still avoided by many people, 그것은 여전히 많은 사람들에 의해서 기피된다. because of the groundless fear, 근거 없는 두려움 때문에. that it can damage human health, 그것이 인간의 건강에 해를 끼칠 수 있다는","hl":"ch"},{"n":4,"text":"첫 번째 문장에서는 is considered와 is avoided라는 수동태 표현이 쓰였어요. 커피가 스스로 생각하는 게 아니라 여겨지고 피해지는 대상이라서 수동태가 쓰인 것이죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 6\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">ex. Although coffee is considered one of the tastiest beverages, it is still avoided by many people because of the groundless fear that it can damage human health.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>커피가 대중적인 음료임에도 불구하고 건강에 나쁠 것이라는 과학적 근거 없는 불안감 때문에 여전히 멀리해지는 상황을 뜻해요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is considered one of the tastiest beverages\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is regarded as one of the most delicious drinks\u003c/span>\u003cdiv class=\"w\">considered를 regarded as로 바꾸어 '~로 여겨지다'라는 의미를 동의어로 표현했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">groundless\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">unfounded\u003c/span>\u003cspan class=\"y-eq\">groundless = unfounded\u003c/span>\u003cdiv class=\"w\">기초나 근거가 없다는 뜻의 형용사로 바꾸어 썼어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">damage\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">harm\u003c/span>\u003cspan class=\"y-eq\">damage = harm\u003c/span>\u003cdiv class=\"w\">건강이나 물건 등에 해를 끼친다는 동사의 유의어로 교체했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Though coffee is viewed as one of the most delicious drinks, a lot of people still stay away from it due to the baseless worry that it might hurt human health.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 커피가 인기가 많아도 건강을 해칠지 모른다는 근거 없는 걱정 때문에 피하는 사람이 있다는 뜻이에요.","hl":"mn"},{"n":6,"text":"여기서 is considered를 is regarded as로 바꾸어 쓸 수 있다는 점도 꼭 기억해 두세요.","hl":"rw"},{"n":7,"text":"근거가 없다는 뜻의 groundless는 unfounded로 바꿀 수 있고, 해를 끼치다라는 damage는 harm으로 바꿀 수 있어요.","hl":"ph"},{"n":8,"text":"이 문장은 Though coffee is viewed as one of the most delicious drinks, a lot of people still stay away from it due to the baseless worry that it might hurt human health로 바꿔서 표현할 수도 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 6\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 Australia \u003cspan class=\"fx\">was colonized\u003c/span> 45,000 years ago by pioneers spreading east from Africa along the shore of Asia.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Australia was colonized\u003c/div>\u003cdiv class=\"k\">호주는 거주지가 되었다\u003c/div>\u003cdiv class=\"e\">45,000 years ago\u003c/div>\u003cdiv class=\"k\">45,000년 전에\u003c/div>\u003cdiv class=\"e\">by pioneers\u003c/div>\u003cdiv class=\"k\">개척자들에 의해서\u003c/div>\u003cdiv class=\"e\">spreading east\u003c/div>\u003cdiv class=\"k\">동쪽으로 퍼져나간\u003c/div>\u003cdiv class=\"e\">from Africa\u003c/div>\u003cdiv class=\"k\">아프리카에서\u003c/div>\u003cdiv class=\"e\">along the shore of Asia.\u003c/div>\u003cdiv class=\"k\">아시아 해변을 따라\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>과거에 이루어진 행위를 나타내는 \u003cb class=\"key\">수동태\u003c/b>인 was colonized와 뒤에서 명사를 꾸미는 현재분사 spreading이 결합된 구조예요.\u003c/div>","segs":[{"n":9,"text":"Australia was colonized, 호주는 거주지가 되었다. 45,000 years ago, 45,000년 전에. by pioneers, 개척자들에 의해서. spreading east, 동쪽으로 퍼져나간. from Africa, 아프리카에서. along the shore of Asia, 아시아 해변을 따라","hl":"ch"},{"n":10,"text":"두 번째 문장의 was colonized 역시 호주가 스스로 개척한 게 아니라 개척된 것이므로 수동태로 쓰였다는 점을 눈여겨봐야 해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 6\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 Australia \u003cspan class=\"fx\">was colonized\u003c/span> 45,000 years ago by pioneers spreading east from Africa along the shore of Asia.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인류의 대이동 역사 속에서 아프리카를 떠난 개척자들이 아시아 해안을 거쳐 아주 오랜 옛날에 호주에 정착했음을 설명하는 내용이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">was colonized\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">was settled\u003c/span>\u003cdiv class=\"w\">식민지가 되었다는 뜻을 정착지가 되었다는 settled로 자연스럽게 바꾸어 표현했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">pioneers\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">settlers\u003c/span>\u003cspan class=\"y-eq\">pioneers = settlers\u003c/span>\u003cdiv class=\"w\">새로운 지역을 개척하는 사람들을 정착민이라는 단어로 유의어 처리했어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">along\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">beside\u003c/span>\u003cspan class=\"y-eq\">along = beside\u003c/span>\u003cdiv class=\"w\">길이나 해변을 따라 나아가는 전치사의 의미를 맞추었어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Settlers who migrated eastward from Africa along Asian shores established settlements in Australia forty-five thousand years ago.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"아프리카에서 출발한 사람들이 아주 먼 옛날 아시아 해안을 따라 이동해서 호주에 자리를 잡았다는 역사적 사실을 말하고 있죠.","hl":"mn"},{"n":12,"text":"여기서 was colonized를 was settled로 바꾸면 정착지가 되었다는 의미가 더 직관적으로 살아나요.","hl":"rw"},{"n":13,"text":"개척자들을 뜻하는 pioneers는 settlers로 바꿀 수 있고, 전치사 along은 beside와 비슷한 맥락으로 쓸 수 있어요.","hl":"ph"},{"n":14,"text":"이 문장은 Settlers who migrated eastward from Africa along Asian shores established settlements in Australia forty-five thousand years ago처럼 다르게 나타낼 수도 있답니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 6\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 We push down our feelings because most of us \u003cspan class=\"fx\">have been brought up\u003c/span> to believe that there are feelings which are unacceptable.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">We push down our feelings\u003c/div>\u003cdiv class=\"k\">우리는 감정을 억제한다\u003c/div>\u003cdiv class=\"e\">because most of us\u003c/div>\u003cdiv class=\"k\">우리 대부분은\u003c/div>\u003cdiv class=\"e\">have been brought up\u003c/div>\u003cdiv class=\"k\">자라왔기 때문에\u003c/div>\u003cdiv class=\"e\">to believe\u003c/div>\u003cdiv class=\"k\">믿도록\u003c/div>\u003cdiv class=\"e\">that there are feelings\u003c/div>\u003cdiv class=\"k\">감정이 존재한다고\u003c/div>\u003cdiv class=\"e\">which are unacceptable.\u003c/div>\u003cdiv class=\"k\">받아들여질 수 없는\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>과거부터 현재까지의 영향을 나타내는 \u003cb class=\"key\">현재완료 수동태\u003c/b>인 have been brought up이 쓰여 양육되어 온 과정을 보여줘요.\u003c/div>","segs":[{"n":15,"text":"We push down our feelings, 우리는 감정을 억제한다. because most of us, 우리 대부분은. have been brought up, 자라왔기 때문에. to believe, 믿도록. that there are feelings, 감정이 존재한다고. which are unacceptable, 받아들여질 수 없는","hl":"ch"},{"n":16,"text":"세 번째 문장에서는 have been brought up이라는 현재완료 수동태가 등장해요. 우리가 어른들에게 그렇게 키워져 온 수동의 입장이기 때문에 수동태로 표현된 것이랍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 6\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 We push down our feelings because most of us \u003cspan class=\"fx\">have been brought up\u003c/span> to believe that there are feelings which are unacceptable.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사회적 분위기나 교육 때문에 특정 감정은 나쁘거나 틀렸다고 배워서, 우리 마음속의 진짜 감정을 억누르며 살고 있다는 의미예요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have been brought up\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have been raised\u003c/span>\u003cdiv class=\"w\">아이를 양육하고 키워내다 라는 의미의 수동태 표현을 동의어로 바꾸었어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">push down\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">suppress\u003c/span>\u003cspan class=\"y-eq\">push down = suppress\u003c/span>\u003cdiv class=\"w\">감정을 누르다 라는 구동사를 한 단어인 억누르다 라는 동사로 바꾸었어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">unacceptable\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">improper\u003c/span>\u003cspan class=\"y-eq\">unacceptable = improper\u003c/span>\u003cdiv class=\"w\">받아들여질 수 없다는 의미를 부적절하다는 뜻의 단어로 유의어 처리했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">We suppress our emotions because many of us were raised to think certain feelings are not allowed.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"우리가 슬프거나 화나는 감정을 애써 참는 이유는 나쁜 감정은 느끼면 안 된다고 배우며 자랐기 때문이에요.","hl":"mn"},{"n":18,"text":"여기서 have been brought up은 have been raised로 바꾸어 쓸 수 있어요.","hl":"rw"},{"n":19,"text":"감정을 억누른다는 push down은 suppress로 바꿀 수 있고, unacceptable은 improper라는 단어로 바꿔 쓸 수 있죠.","hl":"ph"},{"n":20,"text":"이 문장은 We suppress our emotions because many of us were raised to think certain feelings are not allowed으로 패러프레이징할 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 6\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 The City Animal Shelter is displaying 'cool city pets' for adoption every Saturday. Available small animals include hamsters, rabbits, guinea pigs, rats and mice. Children must be accompanied by an adult.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">As humans,\u003c/div>\u003cdiv class=\"k\">인간으로서\u003c/div>\u003cdiv class=\"e\">we do &quot;eat with our eyes,&quot;\u003c/div>\u003cdiv class=\"k\">우리는 정말로 &quot;눈으로 먹는다&quot;\u003c/div>\u003cdiv class=\"e\">because our sense of sight\u003c/div>\u003cdiv class=\"k\">우리의 시각이\u003c/div>\u003cdiv class=\"e\">is more highly developed\u003c/div>\u003cdiv class=\"k\">더 고도로 발달되어 있기 때문에\u003c/div>\u003cdiv class=\"e\">than the other senses.\u003c/div>\u003cdiv class=\"k\">다른 감각들보다\u003c/div>\u003cdiv class=\"e\">The sense of sight\u003c/div>\u003cdiv class=\"k\">시각은\u003c/div>\u003cdiv class=\"e\">is so highly developed in humans\u003c/div>\u003cdiv class=\"k\">인간에게 너무나 고도로 발달되어 있어서\u003c/div>\u003cdiv class=\"e\">that messages received from other senses\u003c/div>\u003cdiv class=\"k\">다른 감각들로부터 받아들여지는 메시지들은\u003c/div>\u003cdiv class=\"e\">are often ignored\u003c/div>\u003cdiv class=\"k\">종종 무시된다\u003c/div>\u003cdiv class=\"e\">if they conflict\u003c/div>\u003cdiv class=\"k\">만약 그것들이 충돌한다면\u003c/div>\u003cdiv class=\"e\">with what is seen.\u003c/div>\u003cdiv class=\"k\">보이는 것과\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>상태를 나타내는 수동태 표현인 is developed와 행동의 수동을 나타내는 are often ignored가 쓰였고, so 구문이 함께 쓰였어요.\u003c/div>","segs":[{"n":21,"text":"As humans, 인간으로서. we do \"eat with our eyes,\", 우리는 정말로 \"눈으로 먹는다\". because our sense of sight, 우리의 시각이. is more highly developed, 더 고도로 발달되어 있기 때문에. than the other senses, 다른 감각들보다. The sense of sight, 시각은. is so highly developed in humans, 인간에게 너무나 고도로 발달되어 있어서. that messages received from other senses, 다른 감각들로부터 받아들여지는 메시지들은. are often ignored, 종종 무시된다. if they conflict, 만약 그것들이 충돌한다면. with what is seen, 보이는 것과","hl":"ch"},{"n":22,"text":"네 번째 문장들에는 is developed와 are often ignored라는 수동태가 거듭 나와요. 시각이 발달되어 있는 상태이고 다른 감각의 메시지가 무시당하는 것이기 때문에 전부 수동태가 어울리는 자리죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 6\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 The City Animal Shelter is displaying 'cool city pets' for adoption every Saturday. Available small animals include hamsters, rabbits, guinea pigs, rats and mice. Children must be accompanied by an adult.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>시각 정보가 다른 오감의 정보보다 압도적으로 우세하기 때문에, 눈으로 보는 것과 다른 감각이 서로 충돌할 때는 시각적인 판단이 우선시된다는 뜻이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">are often ignored\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">are frequently disregarded\u003c/span>\u003cdiv class=\"w\">무시된다는 의미의 수동태를 동의어인 disregarded를 써서 표현했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">conflict\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">clash\u003c/span>\u003cspan class=\"y-eq\">conflict = clash\u003c/span>\u003cdiv class=\"w\">서로 충돌하고 부딪힌다는 뜻의 동사를 유의어로 바꾸었어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">sense of sight\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">visual sense\u003c/span>\u003cspan class=\"y-eq\">sense of sight = visual sense\u003c/span>\u003cdiv class=\"w\">시각이라는 명사구를 한 단어 형태의 형용사 명사구로 바꾸었어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Since human vision is superior to other senses, we eat with our eyes, and visual input overrides conflicting signals from other senses.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"우리는 맛이나 냄새보다 눈에 보이는 비주얼을 먼저 믿기 때문에 음식을 먹을 때도 시각적인 요소를 엄청 크게 신경 쓴다는 이야기예요.","hl":"mn"},{"n":24,"text":"여기서 are often ignored는 are frequently disregarded라는 표현으로 바꿔 쓸 수 있어요.","hl":"rw"},{"n":25,"text":"충돌한다는 의미의 conflict는 clash로 바꿀 수 있고, sense of sight는 visual sense로 간단하게 나타낼 수 있죠.","hl":"ph"},{"n":26,"text":"이 문장은 Since human vision is superior to other senses, we eat with our eyes, and visual input overrides conflicting signals from other senses로 패러프레이징할 수 있답니다.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 6\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 As humans, we do &quot;eat with our eyes,&quot; because our sense of sight is more highly developed than the other senses. The sense of sight is so highly developed in humans that messages received from other senses are often ignored if they conflict with what is seen.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Wood is a material\u003c/div>\u003cdiv class=\"k\">목재는 자재이다\u003c/div>\u003cdiv class=\"e\">that is widely acknowledged\u003c/div>\u003cdiv class=\"k\">널리 인정받는\u003c/div>\u003cdiv class=\"e\">to be environmentally friendly.\u003c/div>\u003cdiv class=\"k\">친환경적이라고\u003c/div>\u003cdiv class=\"e\">For a long time\u003c/div>\u003cdiv class=\"k\">오랫동안\u003c/div>\u003cdiv class=\"e\">it has been welcomed\u003c/div>\u003cdiv class=\"k\">환영을 받아왔다\u003c/div>\u003cdiv class=\"e\">by home builders\u003c/div>\u003cdiv class=\"k\">주택 건설업자들로부터\u003c/div>\u003cdiv class=\"e\">as an alternative\u003c/div>\u003cdiv class=\"k\">대안으로\u003c/div>\u003cdiv class=\"e\">to cement or bricks.\u003c/div>\u003cdiv class=\"k\">시멘트나 벽돌의\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>주어가 인정받고 환영받는 대상이므로 \u003cb class=\"key\">수동태\u003c/b>인 is acknowledged와 현재완료 수동태인 has been welcomed가 정확하게 쓰였어요.\u003c/div>","segs":[{"n":27,"text":"Wood is a material, 목재는 자재이다. that is widely acknowledged, 널리 인정받는. to be environmentally friendly, 친환경적이라고. For a long time, 오랫동안. it has been welcomed, 환영을 받아왔다. by home builders, 주택 건설업자들로부터. as an alternative, 대안으로. to cement or bricks, 시멘트나 벽돌의","hl":"ch"},{"n":28,"text":"다섯 번째 문장에서도 is acknowledged와 has been welcomed라는 수동태가 쓰였어요. 목재가 스스로를 인정하는 게 아니라 사람들에게 인정받고 환영받는 것이기 때문에 수동태 모양이 필수적이죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 5 / 6\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">04 As humans, we do &quot;eat with our eyes,&quot; because our sense of sight is more highly developed than the other senses. The sense of sight is so highly developed in humans that messages received from other senses are often ignored if they conflict with what is seen.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>나무는 환경에 해를 끼치지 않는 착한 자재로 전 세계적으로 인정받고 있어서, 집을 지을 때 전통적인 건축 자재를 대신하는 훌륭한 재료로 꾸준히 사랑받고 있다는 뜻이에요.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is widely acknowledged\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is broadly recognized\u003c/span>\u003cdiv class=\"w\">널리 인정받는다는 의미를 recognized라는 동의어를 써서 매끄럽게 바꾸었어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">environmentally friendly\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">eco-friendly\u003c/span>\u003cspan class=\"y-eq\">environmentally friendly = eco-friendly\u003c/span>\u003cdiv class=\"w\">친환경적이라는 긴 표현을 짧은 복합 형용사로 바꾸었어요.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">alternative\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">replacement\u003c/span>\u003cspan class=\"y-eq\">alternative = replacement\u003c/span>\u003cdiv class=\"w\">대안이나 대체재라는 명사를 유의어로 교체했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Timber is a substance generally known to be eco-friendly, and builders have long favored it instead of bricks or cement.\u003c/div>\u003c/div>","segs":[{"n":29,"text":"나무는 자연을 파괴하지 않는 친환경 자재라서 옛날부터 지금까지 건축가들에게 시멘트 대신 아주 인기가 많은 재료라는 의미예요.","hl":"mn"},{"n":30,"text":"여기서 is widely acknowledged는 is broadly recognized로 바꾸어 표현할 수 있어요.","hl":"rw"},{"n":31,"text":"친환경적이라는 environmentally friendly는 eco-friendly로 줄여 쓸 수 있고, 대안이라는 alternative는 replacement로 바꿀 수 있답니다.","hl":"ph"},{"n":32,"text":"이 문장은 Timber is a substance generally known to be eco-friendly, and builders have long favored it instead of bricks or cement처럼 멋지게 바꿀 수 있어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 6\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">05 Wood is a material that is widely acknowledged to be environmentally friendly. For a long time it has been welcomed by home builders as an alternative to cement or bricks.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">05 Wood is a material that is widely acknowledged to be environmentally friendly. For a long time it has been welcomed by home builders as an alternative to cement or bricks.\u003c/div>\u003cdiv class=\"k\">\u003c/div>\u003c/div>","segs":[{"n":33,"text":"05 Wood is a material that is widely acknowledged to be environmentally friendly. For a long time it has been welcomed by home builders as an alternative to cement or bricks","hl":"ch"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 6 / 6\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">05 Wood is a material that is widely acknowledged to be environmentally friendly. For a long time it has been welcomed by home builders as an alternative to cement or bricks.\u003c/div>","segs":[]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">12강 noticing sentences\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>오늘 우리는 다양한 문장 속에서 주어가 행동을 당하거나 받아들여질 때 쓰는 \u003cb class=\"key\">수동태 구문\u003c/b>의 형태를 완벽하게 정복했어요.\u003c/li>\u003c/ul>","segs":[{"n":34,"text":"오늘 이렇게 해서 열두 번째 유닛의 예문들을 전부 분석해 보았어요. 수동태 동사의 모양을 정확하게 찾아내는 눈이 이제 조금 생겼죠. 복습 열심히 하고 우리는 다음 유닛에서 또 만나요.","hl":"sum"}]}]});</script></body></html>
