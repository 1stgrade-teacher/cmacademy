<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구문사고력 12강 reading03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"구문사고력 12강 reading03","audioDir":"passage3_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">12강\u003cbr>reading03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>From Carpet Beater to Ultrasonic Cleaner: One Principle of Vibration\u003c/h1>\u003ch2>양탄자 두드리는 도구에서 초음파 세탁까지: 진동이라는 하나의 원리\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 과거 양탄자를 두드려 털어내던 \u003cb class=\"key\">진동\u003c/b> 청소의 원리가 오늘날 \u003cb class=\"key\">초음파 \u003c/b>\u003cb class=\"key\">세탁\u003c/b>에 그대로 적용되어, 초음파 전도체가 액체에 진동을 일으켜 세탁물의 먼지를 털어낸다는 설명이다. 결국 도구만 바뀌었을 뿐 초음파 전도체는 양탄자를 두드리는 도구와 똑같은 작용을 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The ultrasonic transmitter in ultrasonic cleaning works on the same vibration principle as a traditional carpet beater.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 구문사고력 열두 번째 강의에서 만나는 지문을 함께 읽어 볼 거예요. 이 글은 진공청소기가 대중화되기 전에 양탄자를 어떻게 청소했는지에서 시작해서, 오늘날의 초음파 세탁으로 이야기를 옮겨 갑니다. 핵심은 아주 단순해요. 도구는 바뀌었지만 진동이라는 원리는 그대로이고, 초음파 전도체가 양탄자를 두드리는 도구와 똑같은 작용을 한다는 겁니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">진동은 물체가 빠르게 떨리는 현상으로, 영어로 \u003cb class=\"key\">vibration\u003c/b>이라고 합니다. 먼지는 표면에 달라붙어 있지만 물체가 빠르게 떨리면 붙잡고 있던 힘이 약해져 쉽게 떨어져 나가죠. 초음파(ultrasonic)는 사람이 들을 수 없을 만큼 진동수가 높은 음파로, 안경 세척기나 의료 기기, 세탁기 등 여러 곳에 쓰입니다. 초음파 세척은 액체 속에 강한 진동을 만들어 물품 표면의 오염 물질을 떼어 내는 방식입니다. 일상 비유를 들면, 이불을 툭툭 털어 먼지를 날리는 장면과 같은 원리예요. 결국 도구가 무엇이든 \u003cb class=\"key\">진동\u003c/b>이라는 \u003cb class=\"key\">원리\u003c/b>는 변하지 않는다는 점이 이 글의 핵심입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경부터 짚어 볼게요. 진동, 영어로 vibration은 물체가 빠르게 떨리는 현상이에요. 먼지는 표면에 달라붙어 있지만 물체가 빠르게 떨리면 붙잡고 있던 힘이 약해져서 쉽게 떨어져 나가죠. 초음파, 즉 ultrasonic은 사람이 들을 수 없을 만큼 진동수가 높은 음파를 말하고, 요즘은 안경 세척기나 의료 기기, 세탁기까지 여러 곳에 쓰여요. 초음파 세척은 액체 속에 강한 진동을 만들어 물품 표면의 오염 물질을 떼어 내는 방식이에요. 이불을 툭툭 털어서 먼지를 날리는 장면을 떠올리면 이해가 훨씬 쉬울 거예요. 결국 도구가 무엇이든 진동이라는 원리는 변하지 않는다는 게 이 글의 메시지예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>과거의 카펫 청소\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>진공청소기가 대중화되기 전에는 작은 양탄자를 줄에 걸어 \u003cb class=\"key\">카펫 \u003c/b>\u003cb class=\"key\">두드리는 \u003c/b>\u003cb class=\"key\">도구\u003c/b>로 두드려 청소했어요. 이 방법은 두드림으로 생긴 \u003cb class=\"key\">진동\u003c/b>이 먼지를 제거한다는 사실에 근거했죠. 그러니까 청소를 해내는 것은 도구 자체가 아니라 진동이라는 점이 먼저 깔립니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>원리의 재등장\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>그런데 똑같은 원리가 오늘날 \u003cb class=\"key\">초음파 \u003c/b>\u003cb class=\"key\">세탁\u003c/b>에 사용된다고 말합니다. 과거의 방식이 사라진 것이 아니라 다른 기술 속에 다시 등장한 거예요. 여기서 글의 무대가 과거에서 현재로 옮겨 갑니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>초음파실의 구성\u003csmall>예시 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>세탁되어야 할 물품은 \u003cb class=\"key\">초음파실\u003c/b>이라 불리는 세탁 용기 안에 놓입니다. 그 안에는 초음파 전도체와 적합한 \u003cb class=\"key\">용매\u003c/b>가 함께 들어 있죠. 이때 쓰이는 액체는 물이 아니라 세탁소에서 사용되는 세탁 용액과 유사한 액체예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>진동의 전달과 세척\u003csmall>근거 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>초음파 전도체가 액체 안에서 \u003cb class=\"key\">진동\u003c/b>을 일으키면 그 진동이 세탁되고 있는 물품으로 전해집니다. 물품이 진동하기 시작하면 먼지와 원치 않는 물질이 \u003cb class=\"key\">털어져\u003c/b> 나가죠. 결국 실제로 때를 떼어 내는 힘은 진동이라는 사실이 여기서 분명해집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>비유의 완성\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>그래서 초음파 전도체는 양탄자를 두드리는 도구와 똑같은 \u003cb class=\"key\">작용\u003c/b>을 한다고 정리합니다. 도구의 모양은 달라도 \u003cb class=\"key\">원리\u003c/b>는 하나라는 선언이죠. 글 전체가 이 한 문장으로 수렴합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문이 어떤 순서로 흘러가는지, 다섯 단계로 나눠서 짚어 볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 문장과 두 번째 문장이에요. 진공청소기가 대중화되기 전에는 작은 양탄자를 줄에 걸어서 카펫 두드리는 도구로 두드려 청소했다고 하죠. 이 방법이 통한 이유는 두드림으로 생긴 진동이 먼지를 제거했기 때문이에요. 그러니까 중요한 건 도구 자체가 아니라 진동이라는 점을 기억해 두세요.","hl":"f0"},{"n":5,"text":"세 번째 문장에서 글이 한 번 전환됩니다. 똑같은 원리가 오늘날 초음파 세탁에 사용된다고 말하죠. 여기서 the same principle이라는 표현이 과거와 현재를 딱 이어 줍니다. 과거의 방식이 사라진 것이 아니라 다른 기술 속에 다시 등장한 거예요.","hl":"f1"},{"n":6,"text":"네 번째부터 여섯 번째 문장은 구체적인 장면을 보여 줍니다. 세탁되어야 할 물품이 초음파실이라는 세탁 용기 안에 놓이고, 그 안에 초음파 전도체와 적합한 용매가 함께 들어 있다고 하죠. 이때 쓰이는 액체는 물이 아니라 세탁소에서 사용되는 세탁 용액과 유사한 액체예요. not water but이라는 대조 표현이 헷갈리지 않게 잡아 줍니다.","hl":"f2"},{"n":7,"text":"일곱 번째부터 아홉 번째 문장은 인과 관계예요. 초음파 전도체가 액체 안에서 진동을 일으키면 그 진동이 세탁되고 있는 물품으로 전해집니다. 물품이 진동하기 시작하면 먼지와 원치 않는 물질이 털어져 나가죠. 결국 실제로 때를 떼어 내는 힘은 도구가 아니라 진동이라는 사실이 여기서 분명해집니다.","hl":"f3"},{"n":8,"text":"마지막 열 번째 문장에서 글 전체가 하나로 모입니다. Thus, the ultrasonic transmitter acts just like a carpet beater, 즉 초음파 전도체는 양탄자를 두드리는 도구와 똑같은 작용을 한다는 거죠. 도구의 모양은 달라도 원리는 하나라는 선언이고, 바로 이 문장이 글의 주제문이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비유(유추)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 과거의 \u003cb class=\"key\">카펫 \u003c/b>\u003cb class=\"key\">두드리기\u003c/b>라는 익숙한 사례에서 출발해 오늘날의 \u003cb class=\"key\">초음파 \u003c/b>\u003cb class=\"key\">세탁\u003c/b>으로 넘어갑니다. 그리고 두 방식이 같은 \u003cb class=\"key\">진동\u003c/b> 원리를 쓴다는 점을 확인시켜 주죠. 주제를 밝히는 결정적 문장인 열 번째 문장이 맨 끝에 놓여 있으므로 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>The same principle (3)\u003c/b>\u003cspan>앞 내용과의 동일성 제시\u003c/span>\u003cb>not water but (6)\u003c/b>\u003cspan>대조를 통한 개념 규정\u003c/span>\u003cb>When (9)\u003c/b>\u003cspan>조건에 따른 인과 제시\u003c/span>\u003cb>Thus (10)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003cb>just like (10)\u003c/b>\u003cspan>비유·유추 표지\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">carpet beater\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the same principle\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ultrasonic transmitter\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">acts just like a carpet beater\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 비유, 그중에서도 유추라고 볼 수 있어요. 익숙한 과거의 카펫 두드리기를 먼저 보여 주고, 낯선 초음파 세탁을 그 위에 겹쳐 놓는 방식이죠. 주제를 밝히는 결정적 문장이 맨 마지막에 오기 때문에 미괄식 구조예요. 그래서 읽을 때는 마지막 문장을 먼저 확인하고 앞으로 거슬러 올라가면 이해가 훨씬 빨라집니다.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. 세 번째 문장의 The same principle은 앞 내용과 같은 원리라는 표지이고, 여섯 번째 문장의 not water but은 대조를 통해 개념을 정확히 규정하는 표현이에요. 아홉 번째 문장의 When은 조건과 결과를 이어 주고, 열 번째 문장의 Thus는 결론을 꺼내는 신호어죠. 마지막의 just like는 비유를 완성하는 표현이니, 이 신호들을 따라가면 글의 뼈대가 그대로 보입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>vacuum cleaner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진공청소기\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대중적인, 인기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>hang\u003c/b>\u003cem>동사\u003c/em>\u003cspan>걸다, 매달다\u003c/span>\u003c/div>\u003cdiv>\u003cb>beater\u003c/b>\u003cem>명사\u003c/em>\u003cspan>두드리는 도구\u003c/span>\u003c/div>\u003cdiv>\u003cb>technique\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기법, 기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>rely on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 근거하다, 의존하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>vibration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진동\u003c/span>\u003c/div>\u003cdiv>\u003cb>cause\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일으키다, 야기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>beat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>두드리다, 치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>remove\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dirt\u003c/b>\u003cem>명사\u003c/em>\u003cspan>먼지, 때\u003c/span>\u003c/div>\u003cdiv>\u003cb>dust\u003c/b>\u003cem>명사\u003c/em>\u003cspan>먼지\u003c/span>\u003c/div>\u003cdiv>\u003cb>principle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원리\u003c/span>\u003c/div>\u003cdiv>\u003cb>ultrasonic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>초음파의\u003c/span>\u003c/div>\u003cdiv>\u003cb>article\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물품, 세탁물\u003c/span>\u003c/div>\u003cdiv>\u003cb>vessel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>용기\u003c/span>\u003c/div>\u003cdiv>\u003cb>chamber\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실, 챔버\u003c/span>\u003c/div>\u003cdiv>\u003cb>contain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다, 들어 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>transmitter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전도체, 송신기\u003c/span>\u003c/div>\u003cdiv>\u003cb>suitable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>적합한, 알맞은\u003c/span>\u003c/div>\u003cdiv>\u003cb>solvent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>용매\u003c/span>\u003c/div>\u003cdiv>\u003cb>similar to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 유사한\u003c/span>\u003c/div>\u003cdiv>\u003cb>fluid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>액체, 유체\u003c/span>\u003c/div>\u003cdiv>\u003cb>dry cleaner's\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세탁소\u003c/span>\u003c/div>\u003cdiv>\u003cb>produce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일으키다, 생산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>liquid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>액체\u003c/span>\u003c/div>\u003cdiv>\u003cb>pass on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전달하다, 전하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unwanted\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>원치 않는\u003c/span>\u003c/div>\u003cdiv>\u003cb>shake off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>털어내다, 떨쳐내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thus\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러므로, 따라서\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어는 몇 개만 짚어 볼게요. vacuum cleaner는 진공청소기, beater는 두드리는 도구, vibration은 진동이에요. transmitter는 전도체, solvent는 용매, fluid는 액체라는 뜻이니까 서로 구분해서 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">popular\u003c/b>\u003cspan class=\"m\">대중적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">widespread\u003c/span>\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpopular\u003c/span>\u003cspan class=\"a\">rare\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rely on\u003c/b>\u003cspan class=\"m\">~에 근거하다, 의존하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">depend on\u003c/span>\u003cspan class=\"s\">count on\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remove\u003c/b>\u003cspan class=\"m\">제거하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eliminate\u003c/span>\u003cspan class=\"s\">get rid of\u003c/span>\u003cspan class=\"s\">clear\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">add\u003c/span>\u003cspan class=\"a\">insert\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">principle\u003c/b>\u003cspan class=\"m\">원리\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rule\u003c/span>\u003cspan class=\"s\">law\u003c/span>\u003cspan class=\"s\">theory\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contain\u003c/b>\u003cspan class=\"m\">포함하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">include\u003c/span>\u003cspan class=\"s\">hold\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suitable\u003c/b>\u003cspan class=\"m\">적합한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appropriate\u003c/span>\u003cspan class=\"s\">proper\u003c/span>\u003cspan class=\"s\">fitting\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unsuitable\u003c/span>\u003cspan class=\"a\">inappropriate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">similar\u003c/b>\u003cspan class=\"m\">유사한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alike\u003c/span>\u003cspan class=\"s\">comparable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003cspan class=\"a\">dissimilar\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">produce\u003c/b>\u003cspan class=\"m\">일으키다, 생산하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">generate\u003c/span>\u003cspan class=\"s\">create\u003c/span>\u003cspan class=\"s\">yield\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. rely on은 depend on이나 count on으로 바꿔 쓸 수 있어요. remove는 eliminate나 get rid of로 바꿀 수 있고, 넣는다는 뜻의 add와는 반대말이 되죠. suitable은 appropriate, proper와 가깝고 unsuitable은 반의어예요. similar는 alike, comparable로 바꿀 수 있고 different는 반대말이며, produce는 generate나 create로 바꿔 쓸 수 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진공청소기가 대중화되기 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Before \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">vacuum \u003c/span>\u003cspan class=\"tgt\">cleaner \u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">popular\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 양탄자는\u003c/span>\u003cspan class=\"en\">small carpets\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흔히 청소되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">cleaned\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 줄에 걸어서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">hanging \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">line \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 양탄자를 두드리는 도구를 이용해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">carpet \u003c/span>\u003cspan class=\"tgt\">beater\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">진공청소기가 대중화되기 전에 작은 양탄자는 흔히 줄에 걸어 양탄자를 두드리는 도구를 이용해서 청소되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 진공청소기가 없던 시절 양탄자를 어떻게 청소했는지 알려 주는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 핵심은 \u003cb class=\"key\">수동태\u003c/b> were cleaned로, 청소의 주체보다 방법이 중요하기 때문이죠. by 이하의 \u003cb class=\"key\">동명사\u003c/b> 두 개가 실제 방법을 병렬로 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사절 접속사 before(시간)\u003c/span> : [Before + 주어 + 동사], [주절] : \"진공청소기가 대중화되기 전에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : 주어 + be동사 + 과거분사 (+ by 행위자) : \"흔히 청소되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단)와 병렬\u003c/span> : by + [동명사구 A] and [동명사구 B] : \"줄에 걸고 양탄자를 두드리는 도구를 이용함으로써\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Before the vacuum cleaner became popular, 진공청소기가 대중화되기 전에. small carpets, 작은 양탄자는. were often cleaned, 흔히 청소되었다. by hanging them on a line, 그것들을 줄에 걸어서. and using a carpet beater, 그리고 양탄자를 두드리는 도구를 이용해서. 이 문장 전체를 해석하면, 진공청소기가 대중화되기 전에 작은 양탄자는 흔히 줄에 걸어 양탄자를 두드리는 도구를 이용해서 청소되었다.","hl":"m"},{"n":14,"text":"이 문장은 옛날 이야기로 시작해요. 진공청소기가 없던 시절에는 작은 양탄자를 줄에 걸고 두드려서 털었답니다. 여기서 중요한 건 누가 청소했는지가 아니라 어떤 방식으로 청소했는지라서, 수동태를 써서 청소 방식에 초점을 맞춘 거예요.","hl":"mn"},{"n":15,"text":"어법 포인트 첫 번째, Before the vacuum cleaner became popular는 시간을 나타내는 부사절이에요. 두 번째, were often cleaned는 be동사에 과거분사가 붙은 수동태로, 주어인 양탄자가 청소를 당한다는 뜻이죠. 세 번째, by 뒤에 hanging과 using이라는 동명사가 and로 병렬 연결되어 방법을 두 가지로 제시하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 기법은\u003c/span>\u003cspan class=\"en\">This technique\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사실에 근거했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">relied \u003c/span>\u003cspan class=\"tgt\">on\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fact \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카펫을 두드림으로써 발생하는 진동이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">vibration \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">caused \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">beating \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">carpet \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먼지를 대부분 제거했다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">removed \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">dirt \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">dust\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 기법은 카펫을 두드림으로써 발생하는 진동이 먼지를 대부분 제거했다는 사실에 근거했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 청소법이 왜 효과가 있었는지 \u003cb class=\"key\">원리\u003c/b>를 밝히는 문장이에요. the fact와 that절이 \u003cb class=\"key\">동격\u003c/b> 관계로 이어져 '진동이 먼지를 제거한다'는 내용이 곧 그 사실임을 보여 주죠. caused by는 앞의 vibration을 뒤에서 꾸미는 \u003cb class=\"key\">과거분사구\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사(rely on)\u003c/span> : rely on + [명사] : \"~에 근거했다, ~에 의존했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격의 that절\u003c/span> : [추상명사 the fact] + that + [주어 + 동사 ~ 완전한 절] : \"진동이 먼지를 대부분 제거했다는 사실\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치 수식\u003c/span> : [명사 vibration] + [과거분사구 caused by ~] : \"카펫을 두드림으로써 발생하는\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"This technique, 이 기법은. relied on the fact, 그 사실에 근거했다. that vibration caused by beating the carpet, 카펫을 두드림으로써 발생하는 진동이. removed most of the dirt and dust, 먼지를 대부분 제거했다는. 이 문장 전체를 해석하면, 이 기법은 카펫을 두드림으로써 발생하는 진동이 먼지를 대부분 제거했다는 사실에 근거했다.","hl":"m"},{"n":17,"text":"앞에서 말한 두드리는 방법이 왜 통했는지 원리를 설명하는 문장이에요. 카펫을 때리면 생기는 진동이 먼지를 털어낸다는 것, 바로 그게 이 기법의 근거라는 거죠.","hl":"mn"},{"n":18,"text":"어법 포인트 첫 번째, relied on은 전치사 on이 붙어서 '근거하다, 의존하다'로 해석하는 표현이에요. 두 번째, the fact 뒤의 that은 동격의 that이에요. 뒤에 주어 vibration과 동사 removed가 있는 완전한 절이 와서 그 사실의 내용을 알려 주죠. 세 번째, caused by beating the carpet은 앞의 vibration을 뒤에서 꾸며 주는 과거분사구로 수동의 의미를 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">똑같은 원리가\u003c/span>\u003cspan class=\"en\">The same principle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날\u003c/span>\u003cspan class=\"en\">today\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초음파 세탁에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">ultrasonic \u003c/span>\u003cspan class=\"tgt\">cleaning\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">(C) 똑같은 원리가 오늘날 초음파 세탁에 사용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 설명한 원리가 오늘날의 \u003cb class=\"key\">초음파 \u003c/b>\u003cb class=\"key\">세탁\u003c/b>에도 그대로 적용된다는 것을 알려 주는 문장이에요. 짧은 \u003cb class=\"key\">수동태\u003c/b> 문장으로 화제를 과거에서 현재로 자연스럽게 넘겨 주죠. 이 문장이 뒤에 이어질 초음파 세탁 설명의 \u003cb class=\"key\">주제문\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(현재시제)\u003c/span> : 주어 + be동사 + 과거분사 : \"사용된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(분야·범위)\u003c/span> : be used + in + [명사] : \"초음파 세탁에서\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"The same principle, 똑같은 원리가. is used, 사용된다. today, 오늘날. in ultrasonic cleaning, 초음파 세탁에서. 이 문장 전체를 해석하면, (C) 똑같은 원리가 오늘날 초음파 세탁에 사용된다.","hl":"m"},{"n":20,"text":"과거의 방법과 현재의 기술이 같은 원리로 이어진다는 걸 보여 주는 문장이에요. 짧은 수동태 문장 하나로 이야기의 무대를 과거에서 현재로 옮겨 주죠. 그래서 이 문장은 뒤에 나올 초음파 세탁 설명의 주제문 역할을 해요.","hl":"mn"},{"n":21,"text":"어법 포인트 첫 번째, is used는 현재시제 수동태예요. 주어인 원리가 사용되는 쪽이니까 수동태로 쓴 거죠. 두 번째, in ultrasonic cleaning에서 전치사 in은 분야를 나타내서 초음파 세탁이라는 영역 안에서 쓰인다는 뜻을 만들어요. be used in으로 묶어서 기억해 두면 해석이 아주 쉬워집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세탁되어야 할 물품이\u003c/span>\u003cspan class=\"en\">The article \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">cleaned\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놓인다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">placed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세탁 용기 안에\u003c/span>\u003cspan class=\"en\">in a cleaning vessel\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초음파실이라 불리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">ultrasonic \u003c/span>\u003cspan class=\"tgt\">chamber\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">세탁되어야 할 물품이 초음파실이라 불리는 세탁 용기 안에 놓인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 초음파 세척의 첫 단계, 즉 세척할 물품을 초음파실이라는 용기 안에 넣는 과정을 설명하는 문장이에요. \u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">cleaned\u003c/b>가 앞의 \u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">article\u003c/b>을 꾸며 '세탁되어야 할 물품'이라는 대상을 먼저 제시하고, 뒤에서 \u003cb class=\"key\">수동태\u003c/b> is placed로 '놓인다'고 마무리하죠. 앞 문장에서 언급한 초음파 세척 원리가 실제로 어떻게 시작되는지를 구체적으로 보여 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 수동형(형용사적 용법)\u003c/span> : [명사] + to be + [과거분사] → '~되어야 할 명사' : \"세탁되어야 할\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(현재시제)\u003c/span> : [주어] + is/are + [과거분사] + [장소] : \"놓인다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 수식\u003c/span> : [명사] + called + [명사] = which is called + [명사] : \"초음파실이라 불리는\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"The article to be cleaned, 세탁되어야 할 물품이. is placed, 놓인다. in a cleaning vessel, 세탁 용기 안에. called an ultrasonic chamber, 초음파실이라 불리는. 이 문장 전체를 해석하면, 세탁되어야 할 물품이 초음파실이라 불리는 세탁 용기 안에 놓인다.","hl":"m"},{"n":23,"text":"이 문장은 초음파 세척 과정의 첫 단계를 알려 줘요. 세척할 물품을 초음파실이라는 용기 안에 넣는다는 거죠. 여기서 to be cleaned는 '세탁되어야 할'이라는 뜻으로 the article을 꾸며 주고, is placed는 수동태라서 '놓인다'로 해석해요.","hl":"mn"},{"n":24,"text":"어법 포인트는 세 가지예요. 첫 번째, to be cleaned는 to부정사의 형용사적 용법으로 앞의 the article을 꾸며 주고, 물품은 세탁되는 대상이라 수동형을 썼어요. 두 번째, is placed는 수동태로 '놓인다'라는 뜻이에요. 세 번째, called an ultrasonic chamber는 과거분사구로 앞의 a cleaning vessel을 뒤에서 꾸며 주고, which is called에서 관계대명사와 be동사가 생략된 형태로 보면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 실에는\u003c/span>\u003cspan class=\"en\">This chamber\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 들어있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">contains\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초음파 전도체와\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">ultrasonic \u003c/span>\u003cspan class=\"tgt\">transmitter \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적합한 용매가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">suitable \u003c/span>\u003cspan class=\"tgt\">solvent\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">(A) 또한 이 (초음파)실에는 초음파 전도체와 적합한 용매가 들어있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 나온 초음파실 안에 어떤 장치와 재료가 들어 있는지 알려 주는 문장이에요. \u003cb class=\"key\">contains\u003c/b>의 목적어로 \u003cb class=\"key\">초음파 \u003c/b>\u003cb class=\"key\">전도체\u003c/b>와 \u003cb class=\"key\">용매\u003c/b>가 and로 나란히 연결되어 있죠. 이 두 가지가 있어야 다음 문장에서 액체 속에 진동이 생기는 과정이 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수일치와 부사 위치\u003c/span> : [단수 주어] + also + [동사원형-s] : \"또한 ~이 들어있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조(and)\u003c/span> : [명사구 A] + and + [명사구 B] → 동사의 목적어 두 개 : \"초음파 전도체와 적합한 용매\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"This chamber, 이 실에는. also contains, 또한 들어있어요. an ultrasonic transmitter, 초음파 전도체와. and a suitable solvent, 적합한 용매가. 이 문장 전체를 해석하면, (A) 또한 이 (초음파)실에는 초음파 전도체와 적합한 용매가 들어있다.","hl":"m"},{"n":26,"text":"앞에서 나온 초음파실 안에 무엇이 들어 있는지 알려 주는 문장이에요. 초음파를 만들어 내는 장치와 세척에 알맞은 용매가 함께 들어 있다는 거죠. 이렇게 두 가지를 먼저 깔아 두어야 다음 문장에서 진동이 어떻게 생기는지 자연스럽게 이어집니다.","hl":"mn"},{"n":27,"text":"첫 번째, 주어 This chamber가 단수니까 동사에 -s를 붙여 contains로 써요. also는 일반동사 앞에서 '또한'이라는 뜻을 더해 줍니다. 두 번째, contains 뒤에 목적어가 an ultrasonic transmitter와 a suitable solvent 두 개가 and로 병렬 연결되어 있어요. 관사도 transmitter 앞에는 an, solvent 앞에는 a를 쓴 점을 같이 봐 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 물이 아니고\u003c/span>\u003cspan class=\"en\">This is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">액체이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">liquid\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세탁 용액과 유사한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">similar \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cleaning \u003c/span>\u003cspan class=\"tgt\">fluid\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세탁소에서 사용되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">dry \u003c/span>\u003cspan class=\"tgt\">cleaner's\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 물이 아니고 세탁소에서 사용되는 세탁 용액과 유사한 액체이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 solvent, 즉 \u003cb class=\"key\">용매\u003c/b>의 정체를 구체적으로 밝히는 문장이에요. \u003cb class=\"key\">not \u003c/b>\u003cb class=\"key\">A \u003c/b>\u003cb class=\"key\">but \u003c/b>\u003cb class=\"key\">B\u003c/b> 구문으로 '물이 아니라 액체'라고 바로잡은 뒤, 그 액체가 세탁소 용액과 비슷하다고 덧붙이죠. 물을 쓰지 않는다는 점을 강조해 초음파 세척의 특성을 분명히 해 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사 not A but B\u003c/span> : not + [A] + but + [B] → 'A가 아니라 B' : \"물이 아니라 액체\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사구의 후치 수식\u003c/span> : [명사] + similar to + [명사] → '~와 유사한 명사' : \"세탁 용액과 유사한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 수식\u003c/span> : [명사] + [과거분사구] = which is used ~ : \"세탁소에서 사용되는\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"This is not water, 이것은 물이 아니고. but a liquid, 액체이다. similar to the cleaning fluid, 세탁 용액과 유사한. used at the dry cleaner's, 세탁소에서 사용되는. 이 문장 전체를 해석하면, 이것은 물이 아니고 세탁소에서 사용되는 세탁 용액과 유사한 액체이다.","hl":"m"},{"n":29,"text":"여기서 This는 앞에 나온 solvent, 즉 용매를 가리켜요. 그 용매가 물이 아니라 세탁소에서 쓰는 세탁 용액과 비슷한 액체라고 설명하는 문장이에요. 왜 굳이 물이 아니라고 했는지 생각하면서 읽으면 지문의 흐름이 훨씬 잘 보입니다.","hl":"mn"},{"n":30,"text":"첫 번째, not water but a liquid는 not A but B 구문으로 'A가 아니라 B'라는 뜻이에요. 해석은 뒤에 오는 B에 초점을 맞춥니다. 두 번째, similar to the cleaning fluid는 '~와 유사한'이라는 형용사구로 앞의 a liquid를 뒤에서 꾸며 줘요. 세 번째, used at the dry cleaner's는 과거분사구로 앞의 the cleaning fluid를 꾸며 주고, which is used에서 관계대명사와 be동사가 생략된 형태예요. dry cleaner's는 '세탁소'라는 뜻의 소유격 표현이고요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 초음파 전도체는\u003c/span>\u003cspan class=\"en\">The ultrasonic transmitter\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진동을 일으킨다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">produces\u003c/span> vibrations\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 액체 안에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">liquid\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 초음파 전도체는 그 액체 안에서 진동을 일으킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 초음파 세척 장치가 어떻게 작동하는지 설명하는 대목이에요. \u003cb class=\"key\">초음파 \u003c/b>\u003cb class=\"key\">전도체\u003c/b>가 액체 속에서 \u003cb class=\"key\">진동\u003c/b>을 만들어 낸다는 뜻이죠. 바로 앞 문장에서 액체가 물이 아니라 세탁소 세제 같은 \u003cb class=\"key\">용매\u003c/b>라고 했으니, 그 용매 안에서 진동이 생긴다고 이해하면 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치(3인칭 단수 현재)\u003c/span> : [단수 주어 The ultrasonic transmitter] + [produces (동사원형 + s)] : \"일으킨다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : [produces + 목적어 vibrations] + [in + 명사 the liquid] : \"그 액체 안에서\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"The ultrasonic transmitter, 그 초음파 전도체는. produces vibrations, 진동을 일으킨다. in the liquid, 그 액체 안에서. 이 문장 전체를 해석하면, 그 초음파 전도체는 그 액체 안에서 진동을 일으킨다.","hl":"m"},{"n":32,"text":"이 문장은 초음파 세척 장치가 어떻게 돌아가는지 알려 주는 대목이에요. 초음파 전도체가 액체 속에서 진동을 만들어 낸다는 뜻이죠. 바로 앞에서 액체가 물이 아니라 세탁소 세제 같은 용매라고 했으니까, 그 용매 안에서 진동이 생긴다고 잡아 주시면 돼요.","hl":"mn"},{"n":33,"text":"첫 번째 어법 포인트는 수 일치예요. 주어인 The ultrasonic transmitter가 단수니까 동사에 s가 붙어서 produces가 된 거예요. 두 번째는 전치사구인데요, in the liquid는 그 액체 안에서라는 뜻으로 진동을 일으키는 장소를 알려 주는 전치사구랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 진동은\u003c/span>\u003cspan class=\"en\">These vibrations\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전해진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">passed \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물품으로\u003c/span>\u003cspan class=\"en\">to the article\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세탁되고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">cleaned\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">(B) 이 진동은 세탁되고 있는 물품으로 전해진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 만들어진 진동이 실제로 청소할 \u003cb class=\"key\">물품\u003c/b> 쪽으로 옮겨 간다는 내용이에요. 여기서 \u003cb class=\"key\">being \u003c/b>\u003cb class=\"key\">cleaned\u003c/b>는 '세탁되고 있는'이라는 뜻으로, 물품이 진동을 받는 \u003cb class=\"key\">대상\u003c/b>임을 보여 주죠. 결국 전도체의 진동이 물품에 전달되는 과정을 설명하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : [주어 These vibrations] + [are passed on (be동사 + 과거분사)] + [to + 목적어] : \"전해진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사 수동형의 후치 수식(being + 과거분사)\u003c/span> : [the article] + [being cleaned (being + 과거분사)] : \"세탁되고 있는\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"These vibrations, 이 진동은. are passed on, 전해진다. to the article, 물품으로. being cleaned, 세탁되고 있는. 이 문장 전체를 해석하면, (B) 이 진동은 세탁되고 있는 물품으로 전해진다.","hl":"m"},{"n":35,"text":"만들어진 진동이 실제로 청소할 물품 쪽으로 옮겨 간다는 내용이에요. 여기서 being cleaned는 세탁되고 있는이라는 뜻으로, 물품이 진동을 받는 대상이라는 걸 보여 주죠. 결국 전도체의 진동이 물품에 전달되는 과정을 설명하는 문장이에요.","hl":"mn"},{"n":36,"text":"첫 번째 포인트는 수동태예요. 주어 These vibrations가 전해지는 대상이니까 are passed on처럼 be동사에 과거분사를 붙였어요. pass on이 전하다라는 구동사라서 수동태에서도 on이 그대로 남는다는 것도 꼭 챙기세요. 두 번째는 being cleaned인데요, the article은 clean하는 쪽이 아니라 clean되는 쪽이라서 현재분사 수동형으로 뒤에서 명사를 꾸며 줘요. 진행의 느낌까지 같이 담고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 세탁물이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">article \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진동하기 시작하면\u003c/span>\u003cspan class=\"en\">\u00 는 거죠. 앞에서 카펫 두드리개로 먼지를 털어 내던 장면과 정확히 같은 원리예요.","hl":"mn"},{"n":39,"text":"첫 번째는 시간 부사절이에요. When이 이끄는 절은 미래의 일이라도 현재 시제 begins로 쓴다는 점, 그리고 콤마로 주절과 나눠 준다는 점을 기억하세요. 두 번째는 begins to vibrate인데요, begin 뒤에 to부정사를 목적어로 데려와서 진동하기 시작하다라는 뜻을 만들어요. 세 번째는 are shaken off, 수동태예요. 먼지와 물체들은 스스로 털리는 게 아니라 털리는 대상이라서 수동태를 쓴 거고, 주어가 복수라 are가 온 것도 놓치지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Thus,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초음파 전도체는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ultrasonic \u003c/span>\u003cspan class=\"tgt\">transmitter \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작용한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">acts\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">양탄자를 두드리는 도구와 꼭 마찬가지로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">carpet \u003c/span>\u003cspan class=\"tgt\">beater\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 초음파 전도체는 양탄자를 두드리는 도구와 똑같은 작용을 하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장들에서 설명한 초음파 세척의 원리를 맨 처음 도입부의 \u003cb class=\"key\">양탄자 \u003c/b>\u003cb class=\"key\">두드리기\u003c/b> 사례로 되돌려 연결 짓는 마무리 문장이에요. 진동으로 때가 떨어진다는 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">원리\u003c/b>를 초음파 전도체가 그대로 실현한다는 점을 \u003cb class=\"key\">just \u003c/b>\u003cb class=\"key\">like\u003c/b>라는 표현으로 못 박아 강조하고 있죠. 즉 이 문장은 글 전체를 하나의 \u003cb class=\"key\">비유\u003c/b>로 묶어 주는 결론 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사의 결과 표현\u003c/span> : [접속부사 Thus] + [주어] + [동사] — 앞 내용 전체를 받아 결과를 이끄는 부사 : \"그러므로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수의 일치\u003c/span> : [단수 주어 the ultrasonic transmitter] + [단수 동사 acts] : \"초음파 전도체는 작용한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 like를 이용한 비교 표현\u003c/span> : just like + [명사] = exactly like + [명사] (~와 꼭 마찬가지로) : \"양탄자를 두드리는 도구와 꼭 마찬가지로\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Thus, 그러므로. the ultrasonic transmitter, 초음파 전도체는. acts, 작용한다. just like a carpet beater, 양탄자를 두드리는 도구와 꼭 마찬가지로. 이 문장 전체를 해석하면, 그러므로 초음파 전도체는 양탄자를 두드리는 도구와 똑같은 작용을 하는 것이다.","hl":"m"},{"n":41,"text":"이 문장은 글의 마지막에서 앞부분에 나왔던 양탄자 두드리기 이야기를 다시 끌어오는 결론 문장이에요. 두드려서 생긴 진동으로 때가 떨어진다는 원리가 초음파 전도체에도 그대로 적용된다는 걸 just like로 딱 연결해 주고 있죠. 그래서 이 문장 하나가 글 전체를 하나의 비유로 묶어 주는 열쇠 역할을 합니다.","hl":"mn"},{"n":42,"text":"첫 번째, 문장 맨 앞의 Thus는 '그러므로'라는 뜻의 접속부사예요. 앞 내용 전체를 근거로 결론을 이끌어 내는 결과의 표시라고 보시면 됩니다. 두 번째, 주어 the ultrasonic transmitter가 단수이기 때문에 동사도 acts로 수의 일치를 맞춰 줬어요. 주어와 동사 사이에 다른 말이 끼어 있어도 기준은 어디까지나 주어라는 점, 꼭 기억하세요. 세 번째, just like a carpet beater에서 like는 '좋아하다'가 아니라 '~와 같은'이라는 전치사로 쓰였어요. 앞에 just를 붙여서 '꼭 마찬가지로'라는 강조를 만들어 냈고, 뒤에는 명사구 a carpet beater가 와서 비유의 대상을 완성한 구조입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>진공청소기가 대중화되기 전에는 작은 양탄자를 줄에 걸어 \u003cb class=\"key\">카펫 \u003c/b>\u003cb class=\"key\">두드리는 \u003c/b>\u003cb class=\"key\">도구\u003c/b>로 쳐서 청소했다.\u003c/li>\u003cli>그 청소가 통한 이유는 두드림으로 생긴 \u003cb class=\"key\">진동\u003c/b>이 먼지와 때를 제거했기 때문이다.\u003c/li>\u003cli>오늘날 \u003cb class=\"key\">초음파 \u003c/b>\u003cb class=\"key\">세탁\u003c/b>도 같은 원리를 써서, 초음파실 안의 전도체가 용매에 진동을 일으켜 물품의 오염 물질을 털어낸다.\u003c/li>\u003cli>결국 \u003cb class=\"key\">초음파 \u003c/b>\u003cb class=\"key\">전도체\u003c/b>는 양탄자를 두드리는 도구와 똑같은 작용을 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The ultrasonic transmitter in ultrasonic cleaning works on the same vibration principle as a traditional carpet beater.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 과거 양탄자를 두드려 털어내던 \u003cb class=\"key\">진동\u003c/b> 청소의 원리가 오늘날 \u003cb class=\"key\">초음파 \u003c/b>\u003cb class=\"key\">세탁\u003c/b>에 그대로 적용되어, 초음파 전도체가 액체에 진동을 일으켜 세탁물의 먼지를 털어낸다는 설명이다. 결국 도구만 바뀌었을 뿐 초음파 전도체는 양탄자를 두드리는 도구와 똑같은 작용을 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":43,"text":"오늘 글은 결국 하나예요. 도구가 양탄자를 두드리는 도구에서 초음파 전도체로 바뀌었을 뿐, 때를 떼어 내는 힘은 진동이라는 겁니다. 여기서 그치지 말고 여러분도 실생활에서 같은 원리가 다른 모습으로 등장하는 사례를 찾아보세요. 그 습관이 독해력을 훨씬 단단하게 만들어 줄 거예요. 오늘 수업 끝까지 따라온 여러분, 정말 수고 많았습니다.","hl":null}]}]});</script></body></html>
