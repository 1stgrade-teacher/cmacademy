<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구문사고력 12강 reading02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"구문사고력 12강 reading02","audioDir":"passage2_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">12강\u003cbr>reading02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Neanderthals Cooked and Ate Grains, Challenging an Old Belief\u003c/h1>\u003ch2>네안데르탈인은 곡물을 조리해 먹었다: 오래된 통념에 도전\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>새로운 연구는 네안데르탈인이 곡물과 채소를 조리해서 먹었다는 사실을 밝혀냈고, 이는 그들이 \u003cb class=\"key\">육식\u003c/b>에 의존했다는 기존 통념에 \u003cb class=\"key\">이의를 \u003c/b>\u003cb class=\"key\">제기\u003c/b>한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>New research shows that Neanderthals cooked and ate grains and plants, challenging the belief that they relied mainly on meat.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘 함께 읽을 지문은 네안데르탈인의 식생활에 관한 새로운 연구 이야기예요. 우리가 흔히 알고 있던 상식이 어떻게 뒤집히는지 그 과정을 차근차근 따라가 볼게요. 이 글은 새로운 연구 결과를 먼저 던지고, 근거와 기존 통념, 그리고 반박의 순서로 전개됩니다. 요지는 네안데르탈인이 곡물과 채소를 조리해 먹었다는 새 증거가 육식 위주라는 옛 믿음에 도전한다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">네안데르탈인\u003c/b>은 아주 오래전 유럽과 서아시아에 살다가 사라진 인류의 친척입니다. 오랫동안 학계는 이들이 추운 환경에서 살아남으려고 \u003cb class=\"key\">고기\u003c/b>에 크게 의존한 육식가라고 여겼습니다. 그래서 빙하기(Ice Age)가 시작되자 사냥감이 줄어 \u003cb class=\"key\">멸종\u003c/b>했다는 설명이 힘을 얻었습니다. 여기에 이빨에 붙은 치석 같은 표본(specimen)을 정밀하게 분석하는 기술이 발달하면서, 조리된 곡물과 식물의 흔적이 새로 드러났습니다. 냉장고에 고기만 가득한 줄 알았는데 사실은 채소와 곡물도 함께 있었다는 걸 뒤늦게 발견한 셈입니다. 즉 이들의 식생활(diet)이 훨씬 \u003cb class=\"key\">다양\u003c/b>했다는 뜻입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경부터 짚어 볼게요. 네안데르탈인은 아주 오래전 유럽과 서아시아에 살다가 사라진 인류의 친척이에요. 오랫동안 학계는 이들이 추운 환경에서 살아남으려고 고기에 크게 의존한 육식가라고 여겼죠. 그래서 빙하기, 즉 Ice Age가 시작되자 사냥감이 줄어 멸종했다는 설명이 힘을 얻었어요. 그런데 이빨에 붙은 치석 같은 표본, 영어로 specimen을 정밀하게 분석하는 기술이 발달하면서 조리된 곡물과 식물의 흔적이 새로 드러났답니다. 냉장고에 고기만 가득한 줄 알았는데 사실은 채소와 곡물도 함께 있었다는 걸 뒤늦게 발견한 셈이에요. 즉 이들의 식생활, diet가 훨씬 다양했다는 뜻이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>새로운 연구 결과\u003csmall>주장 · 문장 1\u003c/small>\u003c/h4>\u003cp>새 연구가 \u003cb class=\"key\">네안데르탈인\u003c/b>이 곡물과 채소를 조리해서 먹었다는 사실을 밝혀냈습니다. 이 문장이 글 전체를 이끄는 \u003cb class=\"key\">주제문\u003c/b>입니다. 결론을 먼저 던지는 \u003cb class=\"key\">두괄식\u003c/b>으로 시작하는 셈이지요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>이빨 속 증거\u003csmall>근거 · 문장 2\u003c/small>\u003c/h4>\u003cp>미국 연구자들은 보존된 \u003cb class=\"key\">네안데르탈인 \u003c/b>\u003cb class=\"key\">표본\u003c/b>의 이빨에서 조리된 곡물과 채소를 발견한 뒤 그러한 \u003cb class=\"key\">결론\u003c/b>에 도달했습니다. 이빨에 남아 있었다는 건 주변에 굴러다닌 것이 아니라 실제로 먹은 흔적이라는 뜻입니다. 그래서 그들의 음식이 이전에 생각한 것보다 훨씬 \u003cb class=\"key\">다양\u003c/b>했다는 점이 드러납니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기존 통념\u003csmall>통념 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>전에는 네안데르탈인이 육식을 아주 좋아한다고 \u003cb class=\"key\">널리 \u003c/b>\u003cb class=\"key\">믿어졌습니다\u003c/b>. 어떤 이들은 그들이 \u003cb class=\"key\">고기에 \u003c/b>\u003cb class=\"key\">의존\u003c/b>했기 때문에 빙하기가 시작되자 멸종했다고 믿기도 했었습니다. 여기까지는 아직 옛 주장이 힘을 가진 것처럼 보입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>통념의 반박\u003csmall>전환 · 문장 5\u003c/small>\u003c/h4>\u003cp>이제 새로운 \u003cb class=\"key\">증거\u003c/b>가 이 이론에 \u003cb class=\"key\">이의를 \u003c/b>\u003cb class=\"key\">제기\u003c/b>하였습니다. 앞에서 소개한 믿음과 정면으로 부딪히는 지점입니다. 그래서 여기서 글의 논조가 분명하게 바뀝니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>섭취의 확인\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>전에도 네안데르탈인 거주 지역에서 곡물이 발견되었지만, 식량을 얻기 위해 \u003cb class=\"key\">경작\u003c/b>된 것인지 혹은 다른 이유인지는 밝혀지지 않았습니다. 그런데 이번에는 음식이 \u003cb class=\"key\">입 \u003c/b>\u003cb class=\"key\">안\u003c/b>에서 발견되었습니다. 그래서 곡물이 실제로 \u003cb class=\"key\">섭취\u003c/b>되고 있었다는 결정적 근거가 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문의 흐름을 다섯 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 새로운 연구 결과를 던지는 부분이에요. 새 연구가 네안데르탈인이 곡물과 채소를 조리해서 먹었다는 사실을 밝혀냈다고 말합니다. 이 문장이 글 전체를 이끄는 주제문이에요. 결론을 먼저 제시하는 두괄식 구조라서 첫 문장만 제대로 잡아도 글의 절반은 이해한 셈이죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 그 결론을 뒷받침하는 근거예요. 미국 연구자들이 보존된 네안데르탈인 표본의 이빨에서 조리된 곡물과 채소를 발견한 뒤 그러한 결론에 도달했다고 합니다. 이빨에 남아 있었다는 건 주변에 굴러다닌 게 아니라 실제로 먹은 흔적이라는 뜻이에요. 그래서 이들의 음식이 이전에 생각한 것보다 훨씬 다양했다는 점이 드러납니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 기존 통념을 소개하는 부분이에요. 전에는 네안데르탈인이 육식을 아주 좋아한다고 널리 믿어졌습니다. 어떤 이들은 그들이 고기에 의존했기 때문에 빙하기가 시작되자 멸종했다고 믿기도 했었죠. 여기까지 읽으면 아직은 옛 주장이 힘을 가진 것처럼 보여요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 통념을 뒤집는 전환이에요. 이제 새로운 증거가 이 이론에 이의를 제기하였다고 합니다. 앞에서 소개한 믿음과 정면으로 부딪히는 지점이죠. 그래서 여기서 글의 논조가 확실히 바뀝니다.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 실제 섭취를 확인하는 결론이에요. 전에도 네안데르탈인 거주 지역에서 곡물이 발견되었지만, 식량을 얻기 위해 경작된 것인지 아니면 다른 이유인지는 밝혀지지 않았어요. 그런데 이번에는 음식이 네안데르탈인의 입 안에서 발견되었습니다. 그래서 곡물이 실제로 섭취되고 있었다는 것을 보여 주는 결정적 근거가 되죠.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 첫 문장에서 새로운 연구 결과를 먼저 제시하는 \u003cb class=\"key\">두괄식\u003c/b> 구조입니다. 이어서 이빨에서 발견된 \u003cb class=\"key\">증거\u003c/b>로 그 결론을 뒷받침하고, 전에는 육식을 아주 좋아한다고 널리 믿어졌다는 \u003cb class=\"key\">통념\u003c/b>을 소개합니다. 마지막에 새 증거가 이 이론에 이의를 제기하였다며 통념을 \u003cb class=\"key\">반박\u003c/b>하는 통념-반박 전개방식입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>New research has shown that (1)\u003c/b>\u003cspan>주제 제시\u003c/span>\u003cb>Before (3)\u003c/b>\u003cspan>통념 도입\u003c/span>\u003cb>Now (5)\u003c/b>\u003cspan>전환·반박\u003c/span>\u003cb>Although (6)\u003c/b>\u003cspan>양보\u003c/span>\u003cb>The new findings show (7)\u003c/b>\u003cspan>근거·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">cooked and ate grains and plants\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cooked grains and plants\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cultivated for food\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the food was actually being consumed\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>기존 통념\u003c/th>\u003cth>새로운 증거\u003c/th>\u003c/tr>\u003ctr>\u003ctd>육식 위주, 고기에 의존\u003c/td>\u003ctd>곡물과 채소를 조리해 섭취\u003c/td>\u003c/tr>\u003ctr>\u003ctd>빙하기 시작과 함께 멸종\u003c/td>\u003ctd>멸종 이유에 대한 재검토\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 통념과 반박으로 짜인 구조예요. 옛 믿음을 먼저 세워 두고 새 증거로 그것을 흔드는 방식이죠. 그리고 결론을 맨 앞에 두는 두괄식이라서 첫 번째 문장이 곧 주제문이 됩니다. 그래서 첫 문장을 읽을 때 글 전체의 방향을 미리 잡아 두는 게 중요해요.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. 첫 문장의 New research has shown that은 새로운 주제를 던지는 신호예요. 세 번째 문장의 Before는 옛 통념을 여는 표지이고, 다섯 번째 문장의 Now는 반박으로 넘어가는 전환이죠. 여섯 번째 문장의 Although는 양보를 나타내고, 일곱 번째 문장의 The new findings show는 근거를 정리하는 신호입니다. 또 cooked and ate grains and plants가 cooked grains and plants, 그리고 the food was actually being consumed로 이어지며 같은 개념을 바꿔 말하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>research\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여주다, 밝혀내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>곡물\u003c/span>\u003c/div>\u003cdiv>\u003cb>conclusion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결론\u003c/span>\u003c/div>\u003cdiv>\u003cb>come to a conclusion\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결론에 도달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>preserved\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>보존된\u003c/span>\u003c/div>\u003cdiv>\u003cb>specimen\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표본\u003c/span>\u003c/div>\u003cdiv>\u003cb>diet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음식, 식단\u003c/span>\u003c/div>\u003cdiv>\u003cb>diverse\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>previously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>이전에\u003c/span>\u003c/div>\u003cdiv>\u003cb>widely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>널리\u003c/span>\u003c/div>\u003cdiv>\u003cb>be believed to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~라고 믿어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meat eater\u003c/b>\u003cem>명사\u003c/em>\u003cspan>육식가, 육식 동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>extinct\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>멸종한\u003c/span>\u003c/div>\u003cdiv>\u003cb>go extinct\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>멸종하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rely on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 의존하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>evidence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>증거\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이의를 제기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>theory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이론\u003c/span>\u003c/div>\u003cdiv>\u003cb>site\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유적지, 장소\u003c/span>\u003c/div>\u003cdiv>\u003cb>cultivate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경작하다, 재배하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>whether\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~인지 아닌지\u003c/span>\u003c/div>\u003cdiv>\u003cb>finding\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발견, 연구 결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>consume\u003c/b>\u003cem>동사\u003c/em>\u003cspan>섭취하다, 소비하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reason\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이유\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 챙겨 볼게요. diverse는 다양한이라는 뜻이고, previously는 이전에, extinct는 멸종한이라는 의미예요. rely on은 의존하다, challenge는 이의를 제기하다로 기억해 두세요. cultivate는 경작하다, consume은 섭취하다라는 뜻으로 시험에 자주 나옵니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">diverse\u003c/b>\u003cspan class=\"m\">다양한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">various\u003c/span>\u003cspan class=\"s\">varied\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uniform\u003c/span>\u003cspan class=\"a\">limited\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">extinct\u003c/b>\u003cspan class=\"m\">멸종한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">died out\u003c/span>\u003cspan class=\"s\">vanished\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">existing\u003c/span>\u003cspan class=\"a\">surviving\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">challenge\u003c/b>\u003cspan class=\"m\">이의를 제기하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">question\u003c/span>\u003cspan class=\"s\">dispute\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accept\u003c/span>\u003cspan class=\"a\">support\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rely on\u003c/b>\u003cspan class=\"m\">의존하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">depend on\u003c/span>\u003cspan class=\"s\">count on\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">previously\u003c/b>\u003cspan class=\"m\">이전에\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">formerly\u003c/span>\u003cspan class=\"s\">earlier\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">currently\u003c/span>\u003cspan class=\"a\">now\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">consume\u003c/b>\u003cspan class=\"m\">섭취하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eat\u003c/span>\u003cspan class=\"s\">ingest\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">evidence\u003c/b>\u003cspan class=\"m\">증거\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">proof\u003c/span>\u003cspan class=\"s\">clue\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어로 정리해 볼게요. diverse는 various, varied와 가깝고 반대말은 uniform이에요. extinct는 died out, vanished와 비슷하고 반대는 existing이죠. challenge는 question, dispute와 통하고 반대는 accept입니다. rely on은 depend on, count on과 같은 말이고, previously는 formerly, earlier의 동의어예요. consume은 eat, ingest와 가깝답니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 연구가\u003c/span>\u003cspan class=\"en\">New research\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밝혀냈다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">shown\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네안데르탈인들이 조리해서 먹었다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">Neanderthals \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">cooked \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">ate \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곡물과 채소를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">grains \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">plants\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">새로운 연구 결과가 네안데르탈인들이 곡물과 채소를 조리해서 먹었다는 사실을 밝혀냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 \u003cb class=\"key\">도입부\u003c/b>에서 새로운 연구 결과를 제시하며, 네안데르탈인의 식생활에 대한 기존 통념을 뒤집는 \u003cb class=\"key\">근거\u003c/b>를 깔아 주는 역할을 해요. 'has shown'은 현재완료로, 과거의 발견이 지금까지 \u003cb class=\"key\">영향\u003c/b>을 주고 있음을 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(have/has + p.p.)\u003c/span> : have/has + 과거분사 (완료·결과) : \"밝혀냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절(목적어)\u003c/span> : show + that + 주어 + 동사 ~ : \"네안데르탈인들이 곡물과 채소를 조리해서 먹었다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사 병렬(and)\u003c/span> : 동사 + and + 동사 (같은 형태로 병렬) : \"조리해서 먹었다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"New research, 새로운 연구가. has shown, 밝혀냈다. that Neanderthals cooked and ate, 네안데르탈인들이 조리해서 먹었다는 것을. grains and plants, 곡물과 채소를. 이 문장 전체를 해석하면, 새로운 연구 결과가 네안데르탈인들이 곡물과 채소를 조리해서 먹었다는 사실을 밝혀냈다.","hl":"m"},{"n":14,"text":"이 문장은 글의 도입부에서 새로운 연구 결과를 던지면서 시작해요. 현재완료 has shown을 써서 과거의 발견이 지금까지 영향을 준다는 점을 살짝 깔아 주고 있죠. 네안데르탈인의 식생활에 대한 기존 통념을 뒤집는 근거가 여기서 제시됩니다.","hl":"mn"},{"n":15,"text":"어법 포인트 첫 번째, has shown은 현재완료예요. 주어가 단수라서 has를 쓰고 과거분사 shown이 온 거죠. 두 번째, that절이 show의 목적어로 온 명사절이에요. that절 안에는 주어와 동사가 다 갖춰진 완전한 문장이 와요. 세 번째, cooked and ate는 과거형 동사 두 개가 and로 병렬을 이룬 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 연구자들은\u003c/span>\u003cspan class=\"en\">American researchers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 결론에 도달했는데\u003c/span>\u003cspan class=\"en\">came to that conclusion\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조리된 곡물과 채소를 발견한 후에\u003c/span>\u003cspan class=\"en\">after they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">found\u003c/span> cooked grains and plants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보존된 네안데르탈인 표본의 이빨에서\u003c/span>\u003cspan class=\"en\">in the teeth of preserved Neanderthal specimens,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 음식이 더 다양했다는 것을 보여주면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">showing \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">diet \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">diverse\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이전에 생각했던 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">previously \u003c/span>\u003cspan class=\"tgt\">thought\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미국 연구자들은 보존된 네안데르탈인 표본의 이빨에서 조리된 곡물과 채소를 발견한 후 그러한 결론에 도달했는데, 이는 그들의 음식이 이전에 생각한 것보다 훨씬 다양했음을 보여준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 연구자들이 결론에 이르게 된 \u003cb class=\"key\">과정\u003c/b>과 그 \u003cb class=\"key\">근거\u003c/b>를 설명해요. 이빨에서 조리된 곡물이 발견된 사실이 '음식이 더 다양했다'는 결론의 \u003cb class=\"key\">증거\u003c/b>가 된다는 흐름이죠. 앞 문장의 결론을 뒷받침하는 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료(대과거)\u003c/span> : had + 과거분사 : \"발견했었던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사)\u003c/span> : , + 현재분사 ~ (부대상황·결과) : \"그들의 음식이 더 다양했다는 것을 보여주면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교구문의 생략\u003c/span> : than + (it) + be동사 + p.p. : \"이전에 생각되었던 것보다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"American researchers, 미국 연구자들은. came to that conclusion, 그러한 결론에 도달했는데. after they had found cooked grains and plants, 조리된 곡물과 채소를 발견한 후에. in the teeth of preserved Neanderthal specimens, 보존된 네안데르탈인 표본의 이빨에서. showing that their diet was more diverse, 그들의 음식이 더 다양했다는 것을 보여주면서. than was previously thought, 이전에 생각했던 것보다. 이 문장 전체를 해석하면, 미국 연구자들은 보존된 네안데르탈인 표본의 이빨에서 조리된 곡물과 채소를 발견한 후 그러한 결론에 도달했는데, 이는 그들의 음식이 이전에 생각한 것보다 훨씬 다양했음을 보여준다.","hl":"m"},{"n":17,"text":"이 문장은 결론에 이르게 된 과정과 근거를 설명해요. 이빨에서 조리된 곡물이 나왔다는 사실이 음식이 더 다양했다는 결론의 증거가 된다는 흐름이죠. 지문 전체에서 앞 문장의 결론을 뒷받침하는 핵심 역할을 합니다.","hl":"mn"},{"n":18,"text":"어법 포인트 첫 번째, had found는 과거완료예요. 주절의 과거 시점보다 먼저 일어난 일이라 대과거로 표현한 거죠. 두 번째, showing은 분사구문이에요. 앞 절 전체를 받아서 그 결과를 보여준다는 뜻을 이어 줍니다. 세 번째, than was previously thought는 비교절에서 주어가 생략된 형태예요. than it was previously thought에서 it was가 줄어든 걸로 보면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전에는\u003c/span>\u003cspan class=\"en\">Before,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네안데르탈인들이 널리 믿어졌다\u003c/span>\u003cspan class=\"en\">Neanderthals \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">widely \u003c/span>\u003cspan class=\"tgt\">believed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위대한 육식 동물이었다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">meat \u003c/span>\u003cspan class=\"tgt\">eaters\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전에는 그들이 육식을 아주 좋아한다고 널리 믿어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새로운 증거가 나오기 전의 \u003cb class=\"key\">기존 \u003c/b>\u003cb class=\"key\">통념\u003c/b>을 소개하는 문장이에요. 'were believed to be'는 누가 믿었는지 밝히지 않고 일반적인 믿음을 나타내는 \u003cb class=\"key\">수동태\u003c/b> 표현이죠. 이 통념이 바로 다음에 나오는 반전을 위한 발판이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be + p.p.)\u003c/span> : be동사 + 과거분사 (+ by 행위자) : \"널리 믿어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사(believe A to be B의 수동태)\u003c/span> : believe + A + to be + B → A is believed to be B : \"위대한 육식 동물이었다고\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Before, 전에는. Neanderthals were widely believed, 네안데르탈인들이 널리 믿어졌다. to be great meat eaters, 위대한 육식 동물이었다고. 이 문장 전체를 해석하면, 전에는 그들이 육식을 아주 좋아한다고 널리 믿어졌다.","hl":"m"},{"n":20,"text":"새로운 증거가 나오기 전의 기존 통념을 소개하는 문장이에요. were believed to be는 누가 믿었는지 밝히지 않고 일반적인 믿음을 나타내는 수동태 표현이죠. 이 통념이 다음 문장의 반전을 위한 발판이 됩니다.","hl":"mn"},{"n":21,"text":"어법 포인트 첫 번째, were widely believed는 수동태예요. 네안데르탈인은 믿는 사람이 아니라 믿어지는 대상이라서 수동으로 쓴 겁니다. 두 번째, to be great meat eaters는 believe A to be B 구문이 수동태가 되면서 남은 형태예요. 이 to부정사가 주어의 상태를 설명해 주고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 이들은 믿기도 했었다\u003c/span>\u003cspan class=\"en\">Some \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">believed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 멸종했다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">gone \u003c/span>\u003cspan class=\"tgt\">extinct\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빙하기가 시작하자\u003c/span>\u003cspan class=\"en\">when the Ice Age began\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그들이 고기에 의존했기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">relied \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">meat\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 이들은 그들이 고기에 의존했기 때문에 빙하기가 시작되자 멸종했다고 믿기도 했었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새로운 증거가 나오기 전에 사람들이 품었던 \u003cb class=\"key\">옛 \u003c/b>\u003cb class=\"key\">믿음\u003c/b>을 보여 주는 문장이에요. 네안데르탈인이 \u003cb class=\"key\">고기에 \u003c/b>\u003cb class=\"key\">의존\u003c/b>했기 때문에 빙하기에 멸종했다는 생각이었다는 거죠. 바로 뒤에 나오는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">증거\u003c/b>와 정반대되는 배경 지식 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료(대과거)\u003c/span> : had + [과거분사] : \"믿고 있었었다 / 믿기도 했었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절(목적어)\u003c/span> : believe + that + [주어 + 동사] : \"그들이 멸종했다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 부사절\u003c/span> : because + [주어 + 동사] : \"그들이 고기에 의존했기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Some had believed, 어떤 이들은 믿기도 했었다. that they had gone extinct, 그들이 멸종했다고. when the Ice Age began, 빙하기가 시작하자. because they relied on meat, 왜냐하면 그들이 고기에 의존했기 때문에. 이 문장 전체를 해석하면, 어떤 이들은 그들이 고기에 의존했기 때문에 빙하기가 시작되자 멸종했다고 믿기도 했었다.","hl":"m"},{"n":23,"text":"이 문장은 예전 사람들이 네안데르탈인에 대해 품었던 옛 믿음을 보여 줘요. 네안데르탈인이 고기에 의존했기 때문에 빙하기가 시작되자 멸종했다는 생각이었던 거죠. 뒤에 나올 새로운 증거와 정반대되는 배경이라서 흐름을 잡아 두면 좋아요.","hl":"mn"},{"n":24,"text":"첫 번째로 had believed는 과거완료예요. 과거의 어떤 사건보다 더 앞선 시점의 일을 나타내서, 새로운 증거가 나오기 전부터 있던 믿음이라는 걸 보여 주죠. 두 번째로 that they had gone extinct에서 that은 believed의 목적어 자리를 채우는 명사절을 이끌어요. 세 번째로 because they relied on meat는 이유를 나타내는 부사절이고, relied on은 '고기에 의존했다'로 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제\u003c/span>\u003cspan class=\"en\">Now,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 새로운 증거가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">evidence\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 이론에 이의를 제기하였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">challenged\u003c/span> this theory.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제 이 새로운 증거가 이 이론에 이의를 제기하였다(←지지했다).\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 소개한 옛 이론의 흐름을 정면으로 뒤집는 문장이에요. 현재완료를 써서 새로운 증거가 지금까지도 그 이론에 \u003cb class=\"key\">이의를 \u003c/b>\u003cb class=\"key\">제기\u003c/b>하고 있는 상태임을 보여 주죠. 그래서 해석도 '지지했다'가 아니라 \u003cb class=\"key\">반박\u003c/b>의 의미로 잡아야 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : [단수 주어] + has + [과거분사] : \"이 새로운 증거가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료\u003c/span> : have/has + [과거분사] : \"이의를 제기해 왔다 / 이의를 제기하였다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Now, 이제. the new evidence, 이 새로운 증거가. has challenged this theory, 이 이론에 이의를 제기하였다. 이 문장 전체를 해석하면, 이제 이 새로운 증거가 이 이론에 이의를 제기하였다(←지지했다).","hl":"m"},{"n":26,"text":"앞에서 나온 옛 학설의 흐름을 정면으로 뒤집는 문장이에요. 새로운 증거가 그 이론에 이의를 제기했다는 거죠. 여기서 challenge는 지지했다가 아니라 반박하고 흔들었다는 뜻으로 꼭 잡아 주세요.","hl":"mn"},{"n":27,"text":"첫 번째로 has challenged는 현재완료예요. have나 has 뒤에 과거분사가 오는 형태죠. 그래서 과거의 발견이 지금 이론에 영향을 주고 있다는 느낌을 살려 줍니다. 두 번째로 주어 the new evidence는 셀 수 없는 명사라서 단수로 보고 has를 쓴 거예요. 수 일치 문제로도 자주 나오니까 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 곡물이 발견되었지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although \u003c/span>\u003cspan class=\"tgt\">grains \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">found\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전에 네안데르탈인 거주 지역에서\u003c/span>\u003cspan class=\"en\">at Neanderthal sites before,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 알려지지 않았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">wasn't \u003c/span>\u003cspan class=\"tgt\">known\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 경작되었는지 아닌지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">whether \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">cultivated \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식량을 위해서인지 혹은 아마도 다른 어떤 이유를 위해서인지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">perhaps \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">reason\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전에도 네안데르탈인 거주 지역에서 곡물이 발견되었지만, 식량을 얻기 위해 경작된 것인지 혹은 다른 어떤 이유에서 재배한 것인지는 밝혀지지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 예전에도 곡물은 나왔지만 그 용도를 몰랐다는 \u003cb class=\"key\">한계\u003c/b>를 짚는 문장이에요. 그래서 새 연구가 왜 필요한지 배경을 만들어 주죠. although로 양보를 먼저 깔고, 정작 중요한 '알려지지 않았다'를 뒤에 놓아 \u003cb class=\"key\">강조\u003c/b> 효과를 냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보를 나타내는 부사절\u003c/span> : Although + [주어 + 동사] : \"비록 곡물이 발견되었지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료 수동태\u003c/span> : had been + [과거분사] : \"발견되어 있었다 / 발견되었었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">가주어 it\u003c/span> : It + [be동사] + [보어] + whether + [주어 + 동사] : \"그것은 알려지지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">whether A or B 구문(진주어 명사절)\u003c/span> : whether + [A] + or + [B] : \"식량을 위해 경작된 것인지 혹은 다른 어떤 이유 때문인지\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Although grains had been found, 비록 곡물이 발견되었지만. at Neanderthal sites before, 전에 네안데르탈인 거주 지역에서. it wasn't known, 그것은 알려지지 않았다. whether they were cultivated, 그것들이 경작되었는지 아닌지. for food or perhaps for some other reason, 식량을 위해서인지 혹은 아마도 다른 어떤 이유를 위해서인지. 이 문장 전체를 해석하면, 전에도 네안데르탈인 거주 지역에서 곡물이 발견되었지만, 식량을 얻기 위해 경작된 것인지 혹은 다른 어떤 이유에서 재배한 것인지는 밝혀지지 않았다.","hl":"m"},{"n":29,"text":"이 문장은 예전에도 곡물이 나왔지만 용도는 몰랐다는 한계를 짚어 줘요. 그래서 새 연구가 왜 필요한지 배경을 만들어 주죠. although로 양보를 먼저 깔고, 정작 중요한 알려지지 않았다를 뒤에 놓아 강조하고 있습니다.","hl":"mn"},{"n":30,"text":"첫 번째로 Although grains had been found는 양보를 나타내는 부사절이에요. 비록 곡물이 발견되었지만, 하고 뒤 내용과 대조시키는 거죠. 두 번째로 had been found는 과거완료 수동태예요. 과거의 기준보다 더 이전에 이미 발견되어 있었고, 곡물은 발견하는 대상이니까 수동태를 쓴 겁니다. 세 번째로 it wasn't known에서 it은 해석하지 않는 가주어이고, 진짜 주어는 뒤에 오는 whether절이에요. 네 번째로 whether they were cultivated for food or perhaps for some other reason은 whether A or B 구문으로, 식량을 위한 것인지 다른 이유인지를 나란히 묶어 주는 형태입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 새로운 발견은\u003c/span>\u003cspan class=\"en\">The new findings\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보여준다\u003c/span>\u003cspan class=\"en\">show\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식이 실제로 섭취되고 있었다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">actually \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">consumed\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 발견되었으므로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">found\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네안데르탈인의 입 안에서\u003c/span>\u003cspan class=\"en\">in the mouth of a Neanderthal.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 새로운 발견은 네안데르탈인의 입 안에서 음식이 발견되었으므로 곡식을 실제로 섭취되고 있었다는 것을 보여준다\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급된 곡물이 단순히 어떤 다른 목적을 위해 쓰였는지에 대한 의문을 정리하는 문장이에요. \u003cb class=\"key\">입 \u003c/b>\u003cb class=\"key\">안\u003c/b>에서 음식물이 나왔다는 직접적인 증거를 통해 곡물이 실제로 \u003cb class=\"key\">섭취\u003c/b>되었다는 결론을 제시하죠. 즉 이 문장은 지문 전체의 \u003cb class=\"key\">결론\u003c/b> 역할을 하며, 새로운 발견의 의미를 확정해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that (목적어절)\u003c/span> : show + [that + 주어 + 동사 ~ (동사 show의 목적어 역할을 하는 that절)] : \"음식이 실제로 섭취되고 있었다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태의 과거진행형\u003c/span> : [주어] + was + being + [p.p. (과거분사)] : \"실제로 섭취되고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 as (이유)\u003c/span> : [주어 + 동사] + as + [주어 + 동사] (이유를 나타내는 부사절) : \"그것이 발견되었으므로\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"The new findings, 이 새로운 발견은. show, 보여준다. that the food was actually being consumed, 음식이 실제로 섭취되고 있었다는 것을. as it was found, 그것이 발견되었으므로. in the mouth of a Neanderthal, 네안데르탈인의 입 안에서. 이 문장 전체를 해석하면, 이 새로운 발견은 네안데르탈인의 입 안에서 음식이 발견되었으므로 곡식을 실제로 섭취되고 있었다는 것을 보여준다","hl":"m"},{"n":32,"text":"이 문장은 지문의 결론을 딱 정리해 주는 문장이에요. 곡물이 단순히 다른 이유로 쓰인 게 아니라 네안데르탈인의 입 안에서 실제로 발견되었다, 그래서 진짜로 섭취되고 있었다는 걸 보여 준다는 거죠. 앞에서 계속 의문으로 남아 있던 부분을 새로운 발견이 확실하게 정리해 주는 흐름이라고 보시면 됩니다.","hl":"mn"},{"n":33,"text":"첫 번째로 볼 것은 show 뒤에 나오는 that절이에요. show는 목적어가 필요한 동사라서, 무엇을 보여주는지에 해당하는 완전한 문장이 that절로 들어온 겁니다. 두 번째는 was being consumed인데요, 음식은 먹는 주체가 아니라 먹히는 대상이니까 수동태를 쓴 것이고, being을 넣어서 과거에 진행 중이던 상황, 즉 과거진행 수동태로 만든 거예요. 세 번째는 as인데 여기서는 시간이 아니라 이유를 나타내는 접속사로 쓰였어요. 입 안에서 발견되었으므로, 라는 근거를 뒤에서 붙여 주고 있는 구조입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>새로운 연구는 네안데르탈인이 곡물과 채소를 \u003cb class=\"key\">조리\u003c/b>해 먹었다는 사실을 밝혀냈습니다.\u003c/li>\u003cli>연구자들은 보존된 \u003cb class=\"key\">표본\u003c/b>의 이빨에서 조리된 곡물과 채소를 발견해 이 결론에 도달했습니다.\u003c/li>\u003cli>전에는 이들이 육식을 즐기고 \u003cb class=\"key\">고기에 \u003c/b>\u003cb class=\"key\">의존\u003c/b>해 멸종했다고 널리 믿어졌습니다.\u003c/li>\u003cli>새로운 \u003cb class=\"key\">증거\u003c/b>가 이 이론에 이의를 제기하며, 곡물이 실제로 섭취되고 있었음을 보여줍니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>New research shows that Neanderthals cooked and ate grains and plants, challenging the belief that they relied mainly on meat.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">새로운 연구는 네안데르탈인이 곡물과 채소를 조리해서 먹었다는 사실을 밝혀냈고, 이는 그들이 \u003cb class=\"key\">육식\u003c/b>에 의존했다는 기존 통념에 \u003cb class=\"key\">이의를 \u003c/b>\u003cb class=\"key\">제기\u003c/b>한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"오늘 글의 핵심을 다시 정리해 볼게요. 새 연구가 네안데르탈인의 이빨에서 조리된 곡물과 채소를 찾아냈고, 그것이 실제 섭취의 증거가 되었어요. 이 발견은 육식에 의존해 멸종했다는 옛 이론에 이의를 제기합니다. 통념을 먼저 세우고 새 증거로 뒤집는 이 흐름, 꼭 기억해 두세요. 오늘도 수고 많았습니다.","hl":null}]}]});</script></body></html>
