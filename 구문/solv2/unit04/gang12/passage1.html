<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구문사고력 12강 reading01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"구문사고력 12강 reading01","audioDir":"passage1_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">12강\u003cbr>reading01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">구문사고력\u003c/div>\u003ch1>Why Does Public Speaking Dry Your Mouth?\u003c/h1>\u003ch2>대중 연설은 왜 입을 마르게 할까?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>대중 연설 때 입이 마르는 것은 긴장하면 신체가 \u003cb class=\"key\">투쟁 \u003c/b>\u003cb class=\"key\">도피 \u003c/b>\u003cb class=\"key\">반응\u003c/b> 상태가 되어 \u003cb class=\"key\">자율 \u003c/b>\u003cb class=\"key\">신경계\u003c/b>가 작동하기 때문이다. 이 반응은 위험한 상황에 대처하도록 진화한 것으로, 반응에 중요하지 않은 \u003cb class=\"key\">침샘\u003c/b> 신경이 억제되면서 입이 마르고 대신 동공과 혈관이 확장된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A dry mouth during public speaking is a result of the autonomic nervous system's fight-or-flight response, which selectively suppresses the nerves that are not important for dealing with danger.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 대중 연설을 할 때 왜 입이 마르는지 그 이유를 설명하는 지문을 함께 읽어 볼 거예요. 짧은 글 같지만 투쟁 도피 반응이라는 아주 중요한 개념이 들어 있어요. 요점은 긴장으로 자율 신경계가 작동하면서 침샘 신경이 억제된다는 것이죠. 그럼 차근차근 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 긴장하면 심장이 빨리 뛰고 손에 땀이 나는 것은 \u003cb class=\"key\">자율 \u003c/b>\u003cb class=\"key\">신경계\u003c/b>(autonomic nervous system)가 몸을 위험에 대비시키기 때문이다. 이 체계는 의식적으로 조절되지 않고 자동으로 작동하며, 위급한 순간에 \u003cb class=\"key\">투쟁 \u003c/b>\u003cb class=\"key\">도피 \u003c/b>\u003cb class=\"key\">반응\u003c/b>(fight or flight response)을 일으킨다. 이 반응은 포식자를 만났을 때처럼 위험한 상황에서 싸우거나 도망치는 데 필요한 기능을 최대한 켜 준다. 예를 들어 시험을 보기 직전에 갑자기 화장실이 급해지거나 목이 바짝 마르는 것도 같은 원리이다. 반대로 소화나 침 분비처럼 당장 급하지 않은 기능은 잠시 \u003cb class=\"key\">억제\u003c/b>된다. 이렇게 보면 입이 마르는 것은 몸이 나를 지키기 위해 벌이는 정상적인 \u003cb class=\"key\">생리 \u003c/b>\u003cb class=\"key\">반응\u003c/b>이라고 할 수 있다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 우리 몸에는 자율 신경계라는 자동 조절 장치가 있어서 긴장하거나 위험을 느끼면 몸을 방어 태세로 바꿔 줘요. 이때 나타나는 것이 바로 투쟁 도피 반응인데, 싸울 것인가 도망갈 것인가를 빠르게 결정하도록 심장과 근육을 준비시키는 거죠. 시험을 보기 직전에 갑자기 화장실이 급해지거나 목이 바짝 마르는 것도 같은 원리예요. 반대로 소화나 침 분비처럼 당장 급하지 않은 일은 잠시 억제되고요. 결국 입이 마르는 것은 몸이 나를 지키려고 벌이는 정상적인 생리 반응이라고 할 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>문제 상황\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>대중 연설이 종종 입을 마르게 한다는 \u003cb class=\"key\">현상\u003c/b>에서 글이 시작된다. 그 이유는 긴장하면 신체가 \u003cb class=\"key\">투쟁 \u003c/b>\u003cb class=\"key\">도피 \u003c/b>\u003cb class=\"key\">반응\u003c/b> 상태가 되기 때문이다. 첫 문장이 현상과 원인을 한꺼번에 제시하며 글의 \u003cb class=\"key\">주제\u003c/b>를 이끌고 있다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>진화적 배경\u003csmall>근거 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>이 상태는 \u003cb class=\"key\">자율 \u003c/b>\u003cb class=\"key\">신경계\u003c/b>의 작동에 의해 일어난다. 이 반응은 \u003cb class=\"key\">동물 \u003c/b>\u003cb class=\"key\">세계\u003c/b> 전반에서 볼 수 있고, 포식자로부터 벗어나는 것과 같은 \u003cb class=\"key\">위험한 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에 대처하도록 진화되었다. 즉 입 마름이 몸을 지키기 위한 정상적인 \u003cb class=\"key\">생리 \u003c/b>\u003cb class=\"key\">반응\u003c/b>이라는 근거가 제시되는 단계이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>핵심 원리\u003csmall>전환 · 문장 4\u003c/small>\u003c/h4>\u003cp>신경은 아무렇게나 움직이지 않고, 반응에 얼마나 \u003cb class=\"key\">중요한지\u003c/b>에 따라 \u003cb class=\"key\">선택적\u003c/b>으로 활성화된다. 다시 말해 지금 필요한 신경만 켜지고 그렇지 않은 신경은 꺼진다는 뜻이다. 이 원리가 다음 문장의 구체적인 사례를 이해하는 \u003cb class=\"key\">열쇠\u003c/b>가 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>신체 변화\u003csmall>결론 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>연설 상황에서는 먹는 것이 중요하지 않다고 \u003cb class=\"key\">간주\u003c/b>되므로 침샘을 통제하는 신경이 \u003cb class=\"key\">억제\u003c/b>되어 입이 마른다. 게다가 \u003cb class=\"key\">동공\u003c/b>이 더 커지고 근육과 심장으로 가는 \u003cb class=\"key\">혈관\u003c/b>이 확장된다. 결국 입 마름은 위험에 대비한 신체 변화의 한 \u003cb class=\"key\">증상\u003c/b>으로 정리된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가면서 문장 하나하나 짚어 볼게요.","hl":null},{"n":4,"text":"첫 번째 문장은 대중 연설이 종종 입을 마르게 한다는 현상에서 시작해요. 그 이유는 긴장하면 신체가 투쟁 도피 반응 상태가 되기 때문이라는 것이죠. 현상과 원인을 한 문장에 같이 놓아서 주제를 바로 던져 주고 있어요.","hl":"f0"},{"n":5,"text":"두 번째와 세 번째 문장은 그 반응의 작동 원리와 배경을 설명해요. 이런 상태는 자율 신경계의 작동에 의해 일어나고, 동물 세계 전반에서 볼 수 있으며 위험한 상황에 대처하도록 진화했다고 해요. 그러니까 입 마름이 몸을 지키기 위한 정상적인 생리 반응이라는 근거를 대는 셈이죠.","hl":"f1"},{"n":6,"text":"네 번째 문장은 아주 중요한 원리를 말해요. 신경은 반응에 얼마나 중요한지에 따라 선택적으로 활성화된다는 거예요. 다시 말해 지금 필요한 신경만 켜지고 그렇지 않은 신경은 꺼진다는 뜻이에요.","hl":"f2"},{"n":7,"text":"다섯 번째와 여섯 번째 문장에서 그 원리가 구체적인 결과로 나타나요. 연설 상황에서는 먹는 것이 중요하지 않다고 간주되니 침샘을 통제하는 신경이 억제되고 입이 마르는 거죠. 게다가 동공은 더 커지고 근육과 심장으로 가는 혈관은 확장돼요. 결국 입 마름은 위험에 대비한 신체 변화의 한 증상이라고 정리할 수 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장이 \u003cb class=\"key\">현상\u003c/b>과 \u003cb class=\"key\">원인\u003c/b>을 동시에 제시하므로 \u003cb class=\"key\">두괄식\u003c/b>으로 볼 수 있다. 이어지는 문장들은 \u003cb class=\"key\">자율 \u003c/b>\u003cb class=\"key\">신경계\u003c/b>라는 기제와 \u003cb class=\"key\">진화\u003c/b>적 배경을 근거로 삼아 원인을 심화한다. 네 번째 문장의 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">활성화\u003c/b> 원리가 다섯 번째 문장의 침샘 \u003cb class=\"key\">억제\u003c/b>라는 결과로 이어지고, 마지막 문장에서 동공과 혈관이라는 추가 결과가 제시된다. 즉 원인에서 결과로 곧장 나아가는 전형적인 \u003cb class=\"key\">인과\u003c/b> 구조이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>because (1)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>This is caused by (2)\u003c/b>\u003cspan>원인 연결\u003c/span>\u003cb>depending on (4)\u003c/b>\u003cspan>판단 기준 제시\u003c/span>\u003cb>Because (5)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>so (5)\u003c/b>\u003cspan>결과 도출\u003c/span>\u003cb>In addition (6)\u003c/b>\u003cspan>내용 추가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">'fight or flight' state\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an activation of the autonomic nervous system\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">deal with dangerous situations\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">how important they are for the response\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">selectively activated\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">suppressed\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">dries up\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>억제되는 것\u003c/th>\u003cth>확장되는 것\u003c/th>\u003c/tr>\u003ctr>\u003ctd>먹기 — 지금 중요하지 않다고 간주됨\u003c/td>\u003ctd>위험 대처 — 지금 반드시 필요함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>침샘 신경 억제 → 입이 마름\u003c/td>\u003ctd>동공 확대, 근육·심장 혈관 확장\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 인과예요. 첫 번째 문장에서 현상을 제시하고 그 원인을 바로 붙여 놓았으니 두괄식 구조라고 볼 수 있어요. 주제문은 첫 번째 문장이고, 뒤에는 왜 그런지 이유와 결과가 차례로 이어지죠.","hl":"ty"},{"n":9,"text":"신호어를 보면 연결이 아주 분명해요. 첫 번째 문장의 because가 원인을 붙여 주고, 두 번째 문장의 This is caused by가 다시 원인을 이어받아요. 다섯 번째 문장에서는 because와 so가 원인과 결과를 한 문장 안에서 연결하고, 마지막 문장의 In addition이 신체 변화를 하나 더 추가하죠. fight or flight state, activation of the autonomic nervous system, response처럼 같은 개념을 계속 바꿔 말하고 있다는 점도 꼭 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>public speaking\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대중 연설\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이어지다, 초래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nervous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긴장한, 불안한\u003c/span>\u003c/div>\u003cdiv>\u003cb>state\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상태\u003c/span>\u003c/div>\u003cdiv>\u003cb>be set into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~(상태)에 들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>activation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>활성화, 작동\u003c/span>\u003c/div>\u003cdiv>\u003cb>autonomic nervous system\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자율 신경계\u003c/span>\u003c/div>\u003cdiv>\u003cb>throughout\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~전반에 걸쳐\u003c/span>\u003c/div>\u003cdiv>\u003cb>animal kingdom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동물계\u003c/span>\u003c/div>\u003cdiv>\u003cb>evolve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>진화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>deal with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>대처하다, 다루다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dangerous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위험한\u003c/span>\u003c/div>\u003cdiv>\u003cb>escape from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로부터 벗어나다, 탈출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>predator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포식자\u003c/span>\u003c/div>\u003cdiv>\u003cb>nerve\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신경\u003c/span>\u003c/div>\u003cdiv>\u003cb>selectively\u003c/b>\u003cem>부사\u003c/em>\u003cspan>선택적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>activate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>활성화하다, 작동시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>depending on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 따라\u003c/span>\u003c/div>\u003cdiv>\u003cb>response\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반응\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>간주하다, 여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>simply\u003c/b>\u003cem>부사\u003c/em>\u003cspan>단순히, 그저\u003c/span>\u003c/div>\u003cdiv>\u003cb>get out of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 벗어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>control\u003c/b>\u003cem>동사\u003c/em>\u003cspan>통제하다, 조절하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>salivary gland\u003c/b>\u003cem>명사\u003c/em>\u003cspan>침샘\u003c/span>\u003c/div>\u003cdiv>\u003cb>suppress\u003c/b>\u003cem>동사\u003c/em>\u003cspan>억제하다, 진압하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dry up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(입이) 마르다, 말라붙다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in addition\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>게다가, 또한\u003c/span>\u003c/div>\u003cdiv>\u003cb>pupil\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(눈의) 동공\u003c/span>\u003c/div>\u003cdiv>\u003cb>blood vessel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>혈관\u003c/span>\u003c/div>\u003cdiv>\u003cb>enlarge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확장되다, 커지다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어는 지문에 나온 순서대로 정리해 볼게요. lead to는 이어지다, be set into는 어떤 상태에 들어가다는 뜻이고, deal with는 대처하다, escape from과 get out of는 벗어나다라는 뜻으로 쓰였어요. suppress는 억제하다, dry up은 마르다, enlarge는 확장되거나 커지다는 뜻이니 꼭 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">nervous\u003c/b>\u003cspan class=\"m\">긴장한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">anxious\u003c/span>\u003cspan class=\"s\">tense\u003c/span>\u003cspan class=\"s\">uneasy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">relaxed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dangerous\u003c/b>\u003cspan class=\"m\">위험한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">risky\u003c/span>\u003cspan class=\"s\">hazardous\u003c/span>\u003cspan class=\"s\">perilous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safe\u003c/span>\u003cspan class=\"a\">secure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">activate\u003c/b>\u003cspan class=\"m\">활성화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stimulate\u003c/span>\u003cspan class=\"s\">trigger\u003c/span>\u003cspan class=\"s\">arouse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">suppress\u003c/span>\u003cspan class=\"a\">inhibit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suppress\u003c/b>\u003cspan class=\"m\">억제하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inhibit\u003c/span>\u003cspan class=\"s\">restrain\u003c/span>\u003cspan class=\"s\">hold back\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">activate\u003c/span>\u003cspan class=\"a\">stimulate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enlarge\u003c/b>\u003cspan class=\"m\">확장되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">expand\u003c/span>\u003cspan class=\"s\">widen\u003c/span>\u003cspan class=\"s\">increase\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">shrink\u003c/span>\u003cspan class=\"a\">reduce\u003c/span>\u003cspan class=\"a\">contract\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">deal with\u003c/b>\u003cspan class=\"m\">대처하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">handle\u003c/span>\u003cspan class=\"s\">cope with\u003c/span>\u003cspan class=\"s\">manage\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">avoid\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">evolve\u003c/b>\u003cspan class=\"m\">진화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">develop\u003c/span>\u003cspan class=\"s\">progress\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">regress\u003c/span>\u003cspan class=\"a\">deteriorate\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘도 동의어와 반의어로 묶어 볼게요. suppress는 inhibit, restrain과 뜻이 가깝고 반대말은 activate나 stimulate예요. activate는 trigger, arouse와 비슷하고 반대는 suppress죠. dangerous는 risky, hazardous와 통하고 반대는 safe이고요. enlarge는 expand, widen과 같고 반대는 shrink나 reduce예요. deal with는 cope with, handle로 바꿔 쓸 수 있고 반대는 avoid라고 기억하면 좋아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대중 연설은 종종 ~로 이어진다(초래한다)\u003c/span>\u003cspan class=\"en\">Public speaking often \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">leads \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">입이 마르는 것(마른 입)으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">dry \u003c/span>\u003cspan class=\"tgt\">mouth\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긴장하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">nervous\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신체가 놓인다(설정된다)\u003c/span>\u003cspan class=\"en\">the body \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">set\u003c/span> into\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘투쟁 도피 반응’ 상태로\u003c/span>\u003cspan class=\"en\">a 'fight or flight' state.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대중 연설은 종종 입을 마르게 하는데, 이것은 긴장하면 신체가 ‘투쟁 도피 반응(자극에 대하여 맞서 싸울 것인가, 도망갈 것인가)’ 상태가 되기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대중 연설에서 입이 마르는 현상의 \u003cb class=\"key\">원인\u003c/b>을 제시하는 첫 문장이에요. 긴장하면 신체가 \u003cb class=\"key\">투쟁 \u003c/b>\u003cb class=\"key\">도피 \u003c/b>\u003cb class=\"key\">반응\u003c/b> 상태로 바뀌고 그 결과 입이 마르게 된다는 흐름을 because 하나로 묶었죠. 글 전체가 이 \u003cb class=\"key\">원인과 \u003c/b>\u003cb class=\"key\">결과\u003c/b> 구도로 전개된다는 틀을 잡아 주면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 to를 취하는 자동사 lead\u003c/span> : lead [자동사] + to + [명사(결과)] : \"입이 마르는 것으로 이어진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 because + 시간 부사절 when\u003c/span> : because + [when + 주어 + 동사, 주어 + 동사] : \"왜냐하면 긴장할 때 ~이기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태(be + 과거분사)\u003c/span> : 주어 + be + [과거분사] + into + 명사 : \"놓인다, 설정된다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Public speaking often leads to, 대중 연설은 종종 ~로 이어진다(초래한다). a dry mouth, 입이 마르는 것(마른 입)으로. because, 왜냐하면. when you are nervous, 긴장하면. the body is set into, 신체가 놓인다(설정된다). a 'fight or flight' state, ‘투쟁 도피 반응’ 상태로. 이 문장 전체를 해석하면, 대중 연설은 종종 입을 마르게 하는데, 이것은 긴장하면 신체가 ‘투쟁 도피 반응(자극에 대하여 맞서 싸울 것인가, 도망갈 것인가)’ 상태가 되기 때문이다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 대중 연설에서 입이 마르는 현상을 먼저 던지고, 그 원인을 긴장할 때 나타나는 투쟁 도피 반응으로 제시해요. 현상과 원인을 because 하나로 묶어서 글의 방향을 잡아 주는 문장이죠. 이 문장 하나로 원인과 결과 구도가 전체 글의 뼈대가 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째로 leads to를 보세요. lead라는 동사가 전치사 to와 함께 쓰이면 결과로 이어진다는 뜻이 되고, to 뒤에는 결과를 나타내는 명사가 와요. 두 번째로 because 뒤에 when you are nervous라는 시간 부사절이 또 들어가 있죠. 원인 절 안에 상황을 알려 주는 절이 겹쳐 있는 구조예요. 세 번째로 the body is set은 신체가 어떤 상태로 놓인다는 수동태 표현이에요. 스스로 만드는 게 아니라 상황에 의해 놓인다는 느낌을 살펴 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 ~에 의해 일어난다(야기된다)\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span> s=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이때는 먹는 것이 중요하다고 간주되지 않기 때문에\u003c/span>\u003cspan class=\"en\">Because eating \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">considered \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">important\u003c/span> at this time\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">—당신은 그저 그 상황에서 벗어나기만 하면 되므로—\u003c/span>\u003cspan class=\"en\">— you simply need \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">situation\u003c/span> —\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">입 안의 신경들은\u003c/span>\u003cspan class=\"en\">the nerves in your mouth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">침샘을 통제하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">control \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">salivary \u003c/span>\u003cspan class=\"tgt\">glands\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">억제되고\u003c/span>\u003cspan class=\"en\">are suppressed,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 입이 마른다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">mouth \u003c/span>\u003cspan class=\"tgt\">dries \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이때(연설할 때)에는 먹는 것이 중요하지 않다고 간주되기 때문에—이 상황에서 벗어나기만 하면 되므로—침샘을 통제하는 입 안의 신경들이 억제돼서 입이 마른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 몸이 위험에서 벗어나는 데 집중하느라 먹는 일은 뒷전이 된다는 뜻이에요. 그래서 침샘을 통제하는 신경이 \u003cb class=\"key\">억제\u003c/b>되고, 그 결과 입이 마르죠. 입 마름이 단순한 증상이 아니라 상황에 맞는 \u003cb class=\"key\">침샘\u003c/b> 조절의 결과임을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(consider A to be B의 수동태)\u003c/span> : consider A (to be) B → A is considered to be B : \"중요한 것으로 간주되지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(need의 목적어)\u003c/span> : need + [to get out of the situation (to부정사구/목적어)] : \"그 상황에서 벗어나는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 the nerves] + that + [동사 control] + 목적어 : \"침샘을 통제하는 (신경들)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">so(결과) 접속사\u003c/span> : [원인 절] + so + [결과 절] : \"그래서 입이 마른다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Because eating is not considered to be important at this time, 이때는 먹는 것이 중요하다고 간주되지 않기 때문에. — you simply need to get out of the situation —, —당신은 그저 그 상황에서 벗어나기만 하면 되므로—. the nerves in your mouth, 입 안의 신경들은. that control the salivary glands, 침샘을 통제하는. are suppressed, 억제되고. so your mouth dries up, 그래서 입이 마른다. 이 문장 전체를 해석하면, 이때(연설할 때)에는 먹는 것이 중요하지 않다고 간주되기 때문에—이 상황에서 벗어나기만 하면 되므로—침샘을 통제하는 입 안의 신경들이 억제돼서 입이 마른다.","hl":"m"},{"n":25,"text":"이 문장은 연설할 때 입이 마르는 이유를 몸의 입장에서 설명해요. 위험에서 벗어나기만 하면 되는 상황이라 먹는 일은 중요하지 않다고 판단하고, 그래서 침샘을 통제하는 신경이 억제된다는 거죠. 결국 입이 마르는 건 몸이 상황에 맞게 반응한 결과라는 흐름이에요.","hl":"mn"},{"n":26,"text":"첫 번째, is not considered to be important는 consider가 수동태가 된 형태예요. 중요하다고 여겨지지 않는다는 뜻이죠. 두 번째, to get out of the situation에서 to부정사는 need의 목적어로 쓰였어요. 세 번째, that control the salivary glands는 주격 관계대명사 that으로 바로 앞의 the nerves를 꾸며 줘요. 네 번째, so your mouth dries up에서 so는 그래서라는 결과를 이끄는 접속사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가\u003c/span>\u003cspan class=\"en\">In addition,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 동공은 더 커지고\u003c/span>\u003cspan class=\"en\">your pupils \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">become \u003c/span>\u003cspan class=\"tgt\">larger\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 혈관들은\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">blood \u003c/span>\u003cspan class=\"tgt\">vessels \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근육과 심장으로 가는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">muscles \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">heart\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">확장된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">enlarged\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가, 당신의 동공은 더 커지고 근육과 심장으로 가는 혈관들이 확장된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 싸움 혹은 도피 상태에서 몸에 나타나는 변화를 하나 더 보여 줘요. \u003cb class=\"key\">동공\u003c/b>이 커지고 근육과 심장으로 가는 \u003cb class=\"key\">혈관\u003c/b>이 확장된다는 거죠. 위험에 맞서거나 도망가기 좋게 몸을 미리 준비시키는 반응이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 become + 형용사 보어(비교급)\u003c/span> : become + [larger (형용사/주격보어)] : \"더 커지다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식(후치 수식)\u003c/span> : [명사 the blood vessels] + [전치사구 to your muscles and heart] : \"근육과 심장으로 가는 혈관들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + 과거분사(enlarged) : \"확장된다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"In addition, 게다가. your pupils become larger, 당신의 동공은 더 커지고. and the blood vessels, 그리고 혈관들은. to your muscles and heart, 근육과 심장으로 가는. are enlarged, 확장된다. 이 문장 전체를 해석하면, 게다가, 당신의 동공은 더 커지고 근육과 심장으로 가는 혈관들이 확장된다.","hl":"m"},{"n":28,"text":"이 문장은 자율신경계가 활성화됐을 때 몸에서 일어나는 변화를 하나 더 보여 줘요. 동공이 커지고 근육과 심장으로 가는 혈관이 확장된다는 거죠. 위험에 맞서 싸우거나 도망가기 좋게 몸을 미리 준비시키는 반응이에요.","hl":"mn"},{"n":29,"text":"첫 번째, become larger는 become이 형용사 larger를 보어로 데려서 더 커지다는 뜻을 만드는 구조예요. 두 번째, the blood vessels to your muscles and heart에서 to는 방향을 나타내는 전치사로, 혈관을 근육과 심장으로 가는이라고 뒤에서 꾸며 줘요. 세 번째, are enlarged는 수동태로 확장된다는 뜻이죠. 그리고 and가 두 절을 나란히 연결하고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>대중 연설에서 입이 마르는 것은 긴장으로 신체가 \u003cb class=\"key\">투쟁 \u003c/b>\u003cb class=\"key\">도피 \u003c/b>\u003cb class=\"key\">반응\u003c/b> 상태가 되기 때문이다.\u003c/li>\u003cli>이 반응은 \u003cb class=\"key\">자율 \u003c/b>\u003cb class=\"key\">신경계\u003c/b>의 작동으로 일어나며, 위험한 상황에 대처하도록 \u003cb class=\"key\">진화\u003c/b>된 것이다.\u003c/li>\u003cli>신경은 반응에 얼마나 \u003cb class=\"key\">중요한지\u003c/b>에 따라 \u003cb class=\"key\">선택적\u003c/b>으로 활성화된다.\u003c/li>\u003cli>연설 상황에서는 먹는 것이 중요하지 않다고 \u003cb class=\"key\">간주\u003c/b>되어 침샘 신경이 \u003cb class=\"key\">억제\u003c/b>되므로 입이 마르고, 대신 동공과 혈관이 확장된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A dry mouth during public speaking is a result of the autonomic nervous system's fight-or-flight response, which selectively suppresses the nerves that are not important for dealing with danger.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">대중 연설 때 입이 마르는 것은 긴장하면 신체가 \u003cb class=\"key\">투쟁 \u003c/b>\u003cb class=\"key\">도피 \u003c/b>\u003cb class=\"key\">반응\u003c/b> 상태가 되어 \u003cb class=\"key\">자율 \u003c/b>\u003cb class=\"key\">신경계\u003c/b>가 작동하기 때문이다. 이 반응은 위험한 상황에 대처하도록 진화한 것으로, 반응에 중요하지 않은 \u003cb class=\"key\">침샘\u003c/b> 신경이 억제되면서 입이 마르고 대신 동공과 혈관이 확장된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"정리해 볼게요. 대중 연설에서 입이 마르는 것은 긴장으로 투쟁 도피 반응이 켜지고 자율 신경계가 작동한 결과예요. 당장 필요 없는 침샘 신경이 선택적으로 억제되면서 입이 마르고, 대신 동공과 혈관이 확장되는 거죠. 오늘 배운 인과 구조와 신호어를 다른 지문에서도 꼭 활용해 보세요. 수고했어요, 여러분.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
