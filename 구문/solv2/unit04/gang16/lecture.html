  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}

    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"조동사 have v-ed","title":"과거를 돌아보는 마법의 조동사 have v-ed","audioDir":"lecture_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">16강 조동사 have v-ed\u003c/div>\u003ch1>과거를 돌아보는 마법의 조동사 have v-ed\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>조동사와 have v-ed가 만나 과거에 대한 추측, 아쉬움, 유감을 나타내는 방법을 정확히 이해한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 조동사와 완료형이 함께 쓰여 과거의 일을 나타내는 표현을 배워 볼 거예요. 과거에 어떤 일이 일어났을지 추측하거나 그때 그랬어야 했는데 하고 후회할 때 아주 유용하게 쓰이는 문법이랍니다. 선생님과 함께 차근차근 공부해 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">과거의 일에 대한 추측: must[could, may, might] have v-ed\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">조동사 뒤에 \u003cb class=\"key\">have v-ed\u003c/b>가 오면 과거의 일에 대한 \u003cb class=\"key\">추측\u003c/b>을 나타내요. must have v-ed는 틀림없이 ~했을 것이고 may나 might, could have v-ed는 ~했을지도 모른다는 뜻이에요.\u003cdiv>\u003cspan class=\"g-formula\">조동사(must, may, might, could) + have v-ed\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">George didn’t come to the party. He \u003cspan class=\"fx\">may not have known\u003c/span> about it.\u003c/div>\u003cdiv class=\"g-ko\">George는 파티에 오지 않았다. 그는 파티에 대해서 몰랐을 수도 있다.\u003c/div>\u003cdiv class=\"g-note\">과거에 알지 못했을지도 모른다는 추측을 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The bomb \u003cspan class=\"fx\">may have been triggered\u003c/span> by a cell phone.\u003c/div>\u003cdiv class=\"g-ko\">그 폭탄은 휴대폰에 의해서 터트려졌을 수 있다.\u003c/div>\u003cdiv class=\"g-note\">과거에 수동태의 행동이 일어났을지도 모른다는 추측입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Something good \u003cspan class=\"fx\">must have happened\u003c/span> to my father.\u003c/div>\u003cdiv class=\"g-ko\">어떤 좋은 일이 나의 아버지에게 일어났었음에 틀림없다.\u003c/div>\u003cdiv class=\"g-note\">과거에 틀림없이 일어났던 일에 대한 강한 추측입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">My car is missing. It \u003cspan class=\"fx\">must have been taken away\u003c/span> by a tow truck.\u003c/div>\u003cdiv class=\"g-ko\">내 차가 사라졌다. 틀림없이 견인차에 의해 끌려갔을 거야.\u003c/div>\u003cdiv class=\"g-note\">현재 상황을 보고 과거의 일을 강하게 추측합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>must have v-ed는 \u003cb class=\"key\">강한 추측\u003c/b>을 나타내므로 ~했음에 틀림없다고 해석해요.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념은 과거의 일에 대한 추측을 나타내는 표현이에요. 조동사 뒤에 have v-ed를 붙이면 과거에 일어난 일에 대해 짐작해 볼 수 있답니다. must have v-ed는 틀림없이 그랬을 것이라고 확신할 때 쓰고 may나 might 혹은 could have v-ed는 그럴지도 모른다고 추측할 때 써요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 읽어 볼게요. George didn’t come to the party. He may not have known about it.라는 문장이에요. George가 파티에 오지 않은 걸 보니 파티에 대해서 몰랐을 수도 있다는 추측이 되는 거죠.","hl":"ex-0"},{"n":4,"text":"두 번째 예문을 볼까요. The bomb may have been triggered by a cell phone.이에요. 그 폭탄은 휴대폰에 의해서 터트려졌을 수 있다는 뜻으로 may have been p.p. 형태의 수동태 추측 표현이에요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문을 함께 읽어 봐요. Something good must have happened to my father.인데요. 어떤 좋은 일이 아버에게 일어났었음에 틀림없다는 강한 확신의 추측을 나타내고 있어요.","hl":"ex-2"},{"n":6,"text":"네 번째 예문이에요. My car is missing. It must have been taken away by a tow truck.이라고 했어요. 차가 사라진 현재 상황을 바탕으로 틀림없이 견인차에 의해 끌려갔을 거라고 과거를 강하게 추측하는 문장이에요.","hl":"ex-3"},{"n":7,"text":"여기서 잠깐 주의할 점이 있어요. must have v-ed는 단순한 짐작이 아니라 틀림없이 그랬을 것이라는 강한 확신을 담고 있다는 걸 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">과거의 일에 대한 아쉬움과 유감: should[shouldn’t] have v-ed\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">should have v-ed는 과거에 ~했어야 했다는 \u003cb class=\"key\">아쉬움\u003c/b>이나 \u003cb class=\"key\">유감\u003c/b>을 나타내고 shouldn’t have v-ed는 ~하지 말았어야 했다는 뜻이에요.\u003cdiv>\u003cspan class=\"g-formula\">should[shouldn't] + have v-ed\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I think you \u003cspan class=\"fx\">should have told\u003c/span> her you were sorry.\u003c/div>\u003cdiv class=\"g-ko\">나는 당신이 미안하다고 그녀에게 말했어야 한다고 생각한다.\u003c/div>\u003cdiv class=\"g-note\">과거에 사과를 했어야 했다는 아쉬움을 표현합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The document \u003cspan class=\"fx\">should have been examined\u003c/span> more closely.\u003c/div>\u003cdiv class=\"g-ko\">그 서류는 더 면밀하게 검토가 되었어야 했다.\u003c/div>\u003cdiv class=\"g-note\">과거에 수동태로 이루어졌어야 했던 일에 대한 아쉬움입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">You \u003cspan class=\"fx\">should not have spoken\u003c/span> to her that way. She may have been angry.\u003c/div>\u003cdiv class=\"g-ko\">당신은 그녀에게 그런 식으로 말을 하지 말았어야 했다. 그녀는 화가 났었을 것이다.\u003c/div>\u003cdiv class=\"g-note\">하지 말았어야 했던 행동과 그에 대한 추측이 함께 쓰였습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>should have v-ed는 시험에 자주 나오니 \u003cb class=\"key\">해석\u003c/b>을 정확히 기억해 두세요.\u003c/div>","segs":[{"n":8,"text":"두 번째 개념은 과거에 대한 아쉬움과 후회를 나타내는 표현이에요. should have v-ed는 과거에 그 일을 했어야 했는데 하지 못한 것에 대한 아쉬움을 뜻하고요. shouldn’t have v-ed는 하지 말았어야 했는데 해 버린 것에 대한 후회를 나타내요.","hl":"rule"},{"n":9,"text":"다섯 번째 예문을 봐요. I think you should have told her you were sorry.라는 문장인데요. 미안하다고 그녀에게 말했어야 했다는 아쉬움을 나타내고 있어요.","hl":"ex-0"},{"n":10,"text":"여섯 번째 예문이에요. The document should have been examined more closely.라고 했죠. 그 서류는 더 면밀하게 검토가 되었어야 했다는 뜻으로 should have been p.p. 형태의 아쉬움을 나타내요.","hl":"ex-1"},{"n":11,"text":"일곱 번째 예문도 읽어 볼게요. You should not have spoken to her that way. She may have been angry예요. 그런 식으로 말을 하지 말았어야 했다는 후회와 그녀가 화가 났었을 것이라는 추측이 함께 쓰인 문장이랍니다.","hl":"ex-2"},{"n":12,"text":"이 표현들은 독해 지문이나 시험 문제에 정말 자주 등장해요. 그러니 우리말 해석을 정확하게 연결할 수 있도록 연습해 두어야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">과거의 일에 대한 강한 부정적 추측: can’t have v-ed\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">can’t have v-ed는 과거에 ~했을 \u003cb class=\"key\">리 없다\u003c/b>는 강한 부정의 추측을 나타내요.\u003cdiv>\u003cspan class=\"g-formula\">can't + have v-ed\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">can’t have slept\u003c/span> through all that noise.\u003c/div>\u003cdiv class=\"g-ko\">그는 그런 소음으로 인해 잠을 잤을 리가 없다.\u003c/div>\u003cdiv class=\"g-note\">과거에 그런 일이 있었을 리 없다는 강한 부정의 추측입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>must have v-ed의 반대 의미는 \u003cb class=\"key\">can’t have v-ed\u003c/b>라는 점을 잊지 마세요.\u003c/div>","segs":[{"n":13,"text":"세 번째 개념은 과거에 그런 일이 일어났을 리가 없다고 강하게 부정하는 표현이에요. can’t have v-ed를 쓰면 상식적으로 절대 그럴 수 없었다는 의미를 전달할 수 있어요.","hl":"rule"},{"n":14,"text":"여덟 번째 예문을 함께 읽어 볼까요. He can’t have slept through all that noise.라는 문장이에요. 그렇게 시끄러운 소리 속에서 그가 잠을 잤을 리가 없다고 강하게 부정하고 있죠.","hl":"ex-0"},{"n":15,"text":"여기서 중요한 팁 하나 나갈게요. 틀림없이 ~했을 것이라는 must have v-ed의 반대말은 ~했을 리가 없다는 can’t have v-ed가 된다는 걸 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He must not have done it.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He can't have done it.\u003c/div>\u003cdiv class=\"g-why\">과거에 ~했을 리가 없다는 강한 부정 추측을 할 때는 must not이 아니라 can't를 사용해야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>You should told her the truth.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ You should have told her the truth.\u003c/div>\u003cdiv class=\"g-why\">조동사 should 뒤에는 동사원형이 아니라 완료형인 have v-ed가 와야 과거의 아쉬움을 나타낼 수 있어요.\u003c/div>\u003c/div>","segs":[{"n":16,"text":"학생들이 자주 하는 실수예요. 과거에 절대 그런 일을 했을 리가 없다고 부정할 때 must not have를 쓰면 안 되고 can’t have를 써야 맞는 표현이 된답니다.","hl":"mk-0"},{"n":17,"text":"두 번째 실수도 살펴볼게요. 과거에 ~했어야 했다고 말할 때는 should 뒤에 바로 동사원형을 쓰면 안 되고 반드시 have told처럼 have v-ed 형태로 써야 한다는 점 잊지 마세요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">She ____ have known the secret. She wasn't even there.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>must\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>can't\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>should\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>may not\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">can't\u003c/span>\u003cdiv class=\"g-exp\">그녀가 거기에 없었으므로 비밀을 알았을 리가 없다는 강한 부정의 추측이므로 can't have v-ed가 알맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"첫 번째 문제입니다. She 빈칸 have known the secret. She wasn't even there라는 문장의 빈칸에 들어갈 알맞은 조동사를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":6},{"n":20,"text":"정답은 두 번째 보기인 can't예요. 그녀가 거기에 없었기 때문에 비밀을 알았을 리가 없다는 강한 부정 추측이 되어야 하니까요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 밑줄 친 부분의 의미가 바르게 연결된 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">I must have left my umbrella on the bus.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>나는 버스에 우산을 두고 갔음에 틀림없다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>나는 버스에 우산을 두고 갔어야 했다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u00
