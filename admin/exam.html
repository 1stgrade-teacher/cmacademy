<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>시험 점수 입력 · 일등급샘</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#F0F8F8;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:#1B2733;padding:14px 12px 90px}
.wrap{max-width:1180px;margin:0 auto}h1{font-size:20px;color:#0A5F61;margin:4px 0 12px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(10,60,62,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:12.5px;color:#5F6E7C;margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid #CFE5E4;border-radius:9px;padding:9px 10px;font-size:15px;background:#fff;color:#1B2733;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0E8A8C;box-shadow:0 0 0 3px #DDF2F1}
button{border:0;border-radius:10px;background:#0E8A8C;color:#fff;font-size:15px;font-weight:700;padding:11px 16px;cursor:pointer;font-family:inherit}
button.sub{background:#EAF3F3;color:#0A5F61}button:disabled{background:#B9CDD0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:980px}
.res{font-size:13.5px;color:#5F6E7C;white-space:nowrap;min-width:150px}.res b{color:#1B2733}.res.bad{color:#C0392B}
.qk{padding:6px 12px;font-size:14px}.qk.on{background:#0E8A8C;color:#fff}.nt{min-width:170px}.ctabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.ctabs button{padding:7px 12px;font-size:14px;background:#EEF6F6;color:#0E5F61;border:1.5px solid transparent}.ctabs button.on{background:#0E8A8C;color:#fff}.editbar{background:#FFF7E6;border:1.5px solid #F0C36A;border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14.5px}.editbar b{color:#7A4B00}.ow{display:flex;gap:4px;align-items:center}.ow .mx{width:58px}.ow .rg{width:120px}tr.diff td.ow2{background:#FFF7E6}
th{font-size:12px;color:#5F6E7C;text-align:left;padding:6px 4px;white-space:nowrap}td{padding:4px;vertical-align:middle}
td.nm{font-weight:700;white-space:nowrap;padding-right:10px}tr.skip td{opacity:.35}
td input,td select{padding:8px 6px;font-size:15px}td input[type=checkbox]{width:20px;height:20px}
.n{width:78px}.cm{min-width:160px}.msg{margin-top:10px;font-size:14px;line-height:1.5}.ok{color:#1F6E40}.er{color:#C0392B}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #DCE7E7;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:center}
.bar .info{font-size:13.5px;color:#5F6E7C}.hint{font-size:12.5px;color:#7A8896;margin-top:6px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row label{margin:0;display:flex;align-items:center;gap:6px;font-size:13.5px;color:#1B2733}.row input[type=checkbox]{width:18px;height:18px}
</style></head><body><div class="wrap">
<h1>📝 시험 결과 입력</h1>

<div class="card" id="login">
  <label>선생님 코드</label>
  <div class="row"><input id="tcode" type="password" autocomplete="off" placeholder="선생님 전용 코드" style="max-width:260px"><button id="loginBtn">확인</button></div>
  <div class="hint">이 코드는 이 기기에 저장돼서 다음부터는 묻지 않아요. (공용 컴퓨터에서는 쓰지 마세요)</div>
  <div class="msg er" id="loginMsg"></div>
</div>

<div id="main" style="display:none">
  <div class="card">
    <div class="ctabs" id="ctabs" title="반을 누르면 그 반 명단이 바로 열려요"></div>
    <div class="grid">
      <div><label>반</label><select id="cls"></select></div>
      <div><label>종류</label><select id="kind"><option>단어시험</option><option>듣기시험</option><option>주간평가</option><option>월간평가</option><option>분기평가</option></select></div>
      <div><label>시험일</label><input id="date" type="date"></div>
      <div><label>기록 방식</label><select id="unit"><option value="right">맞은 개수</option><option value="wrong">틀린 개수</option><option value="score">점수</option></select></div>
      <div><label id="maxLbl">전체 문항 수</label><input id="max" type="number" inputmode="decimal" value="40"></div>
      <div><label>응시 방식</label><select id="mode"><option>종이</option><option>온라인</option></select></div>
    </div>
    <div class="grid" style="margin-top:10px;grid-template-columns:1fr 2fr">
      <div><label>시험 범위</label><input id="range" placeholder="예: Unit 4~5 / 고등베이직 7~8"></div>
      <div><label>시험명 (비워 두면 자동)</label><input id="title" placeholder="자동: 10/29 단어시험 · 범위"></div>
    </div>
    <div class="row" id="qkRow" style="margin-top:10px"><span class="hint" style="margin:0">문항 수 빠르게 고르기</span><button type="button" class="sub qk" data-n="20">20</button><button type="button" class="sub qk" data-n="25">25</button><button type="button" class="sub qk" data-n="30">30</button><button type="button" class="sub qk" data-n="40">40</button><button type="button" class="sub qk" data-n="50">50</button></div>
    <div class="row" style="margin-top:10px">
      <label id="autoWrongL"><input type="checkbox" id="autoWrong" checked> 오답 수를 '만점 − 점수'로 자동 계산 (1문항 1점일 때)</label>
      <label><input type="checkbox" id="autoGrade" checked> 종합 평가를 점수로 자동 추천</label>
    </div>
    <div class="row" style="margin-top:10px"><button class="sub" id="loadBtn">명단 불러오기</button><span class="hint" id="rcount"></span></div>
    <div class="row" id="pastRow" style="margin-top:10px;display:none"><span class="hint" style="margin:0">📂 저장한 기록 고치기</span><select id="pastSel" style="max-width:460px"></select><button class="sub" id="pastBtn">불러오기</button></div>
  </div>
  <div class="editbar" id="editBar" style="display:none"></div>

  <div class="card" id="listCard" style="display:none">
    <div class="tw"><table><thead><tr><th>이름</th><th>결시</th><th>다른 시험지 <span style="font-weight:400">(다를 때만: 문항 수·범위)</span></th><th id="hIn">맞은 개수</th><th id="hRes">결과</th><th>재시험</th><th id="hRt">재시험 맞은 개수</th><th>종합 평가</th><th>코멘트 <span style="font-weight:400">(학부모 앱에 보여요)</span></th><th>특이사항 <span style="font-weight:400">(선생님만 봐요)</span></th></tr></thead><tbody id="tb"></tbody></table></div>
    <div class="hint" id="tbHint"></div>
  </div>

  <div class="card">
    <label>명단에 없는 학생 추가 (한 줄에 한 명)</label>
    <textarea id="newNames" rows="3" placeholder="김일등&#10;이지우"></textarea>
    <div class="row" style="margin-top:8px"><button class="sub" id="addBtn">선택한 반에 추가</button></div>
  </div>
  <div class="card">
    <label>학생 본인번호 초기화 (학생이 번호를 잊었을 때)</label>
    <div class="row"><select id="pinStu" style="max-width:240px"></select><button class="sub" id="pinBtn">번호 초기화</button></div>
    <div class="hint">위에서 '명단 불러오기'를 한 반의 학생이 목록에 나와요. 초기화하면 그 학생이 다음 접속 때 번호를 새로 정해요.</div>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div class="bar" id="bar" style="display:none"><span class="info" id="info"></span><button id="saveBtn">저장하기</button></div>
</div>
<script>
var $=function(i){return document.getElementById(i)},KEY="cm-teacher-code",students=[];
var EDIT=null;   // 불러온(또는 방금 저장한) 기록을 고치는 중: {title,date,kind,pids:{학생id:페이지id}}
var dirty=false; // 저장하지 않은 입력이 있는지
var curCls="", PAST=[];
function nid(x){return String(x||"").replace(/-/g,"").toLowerCase()}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";if(v==="")localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return""}}
function api(body){body.code=ls(KEY);return fetch("/api/exam",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){j._s=r.status;return j})})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date(Date.now()+9*3600*1000);return d.toISOString().slice(0,10)}
$("date").value=today();

function enter(){
  api({action:"classes"}).then(function(j){
    if(j._s===401){ls(KEY,"");$("login").style.display="";$("main").style.display="none";$("loginMsg").textContent=j.msg||"코드가 맞지 않아요.";return}
    if(!j.ok){$("loginMsg").textContent=j.msg||"서버가 아직 준비되지 않았어요.";$("login").style.display="";return}
    $("login").style.display="none";$("main").style.display="";
    var last=ls("cm-teacher-cls");
    $("cls").innerHTML=(j.classes||[]).map(function(c){return"<option"+(c===last?" selected":"")+">"+esc(c)+"</option>"}).join("");
    curCls=$("cls").value;
    $("ctabs").innerHTML=(j.classes||[]).map(function(c){return'<button type="button" class="sub" data-c="'+esc(c)+'">'+esc(c)+"</button>"}).join("");
    $("ctabs").querySelectorAll("button").forEach(function(b){b.onclick=function(){goClass(b.dataset.c)}});
    paintTabs();
    if(!j.classes||!j.classes.length)$("msg").innerHTML='<span class="er">반 목록을 불러오지 못했어요. 노션 연결을 확인해 주세요.</span>';
  });
}
$("loginBtn").onclick=function(){var v=$("tcode").value.trim();if(!v){$("loginMsg").textContent="코드를 입력해 주세요.";return}ls(KEY,v);$("loginMsg").textContent="";enter()};
$("tcode").onkeydown=function(e){if(e.key==="Enter")$("loginBtn").click()};
if(ls(KEY))enter();

function suggest(score,max){var p=max>0?score/max*100:0;return p>=90?"우수":p>=80?"양호":p>=60?"보통":"노력 필요"}
function maxv(){return parseFloat($("max").value)||0}
// 학생별 문항 수(만점): 그 줄의 '다른 시험지' 칸에 적었으면 그 값, 비었으면 위의 공통 값
function rowMax(tr){var x=tr&&tr.querySelector(".mx"),v=x?parseFloat(x.value):NaN;return v>0?v:maxv()}
function unit(){return $("unit").value}
var prevUnit=null; // 기록 방식을 바꾸면 이미 적은 개수를 바꿔 줌 (맞은 ↔ 틀린)
var UL={right:"맞은 개수",wrong:"틀린 개수",score:"점수"};
// 입력한 값 → {score(맞은 수 또는 점수), wrong(틀린 수)}
function calc(v,m){
  if(m==null)m=maxv();var u=unit();if(v===""||isNaN(parseFloat(v)))return null;v=parseFloat(v);
  if(u==="right")return{score:v,wrong:Math.max(0,m-v),bad:v>m||v<0||v%1!==0};
  if(u==="wrong")return{score:Math.max(0,m-v),wrong:v,bad:v>m||v<0||v%1!==0};
  return{score:v,wrong:null,bad:v>m||v<0};
}
function setUnit(){
  var u=unit(),cnt=u!=="score";ls("cm-exam-unit",u);
  $("maxLbl").textContent=cnt?"전체 문항 수":"만점";
  $("qkRow").style.display=cnt?"":"none";$("autoWrongL").style.display=cnt?"none":"";
  if($("hIn")){$("hIn").textContent=UL[u];$("hRes").textContent=cnt?"결과":"오답 수";$("hRt").textContent="재시험 "+UL[u]}
  $("tbHint").textContent=(cnt?UL[u]+"를 입력하고":"점수를 입력하고")+" Enter를 누르면 다음 학생으로 넘어가요. 결시에 체크하거나 칸을 비워 두면 그 학생은 저장하지 않아요."+(cnt?" 점수는 '맞은 개수/전체 문항 수'로 기록돼요.":"")+" 문항 수·범위가 다른 학생은 '다른 시험지' 칸에 적으면 그 학생만 따로 기록돼요(비우면 위의 값).";
  document.querySelectorAll(".qk").forEach(function(b){b.className="sub qk"+(String(maxv())===b.dataset.n?" on":"")});
  if(students.length)render();
}
function resCell(tr){
  var m=rowMax(tr),r=calc(tr.querySelector(".sc").value,m),c=tr.querySelector(".res");
  tr.classList.toggle("diff",m!==maxv()||!!tr.querySelector(".rg").value.trim());
  if(!c)return;
  if(unit()==="score")return;
  if(!r){c.className="res";c.textContent="";return}
  if(r.bad){c.className="res bad";c.textContent="0~"+m+" 사이 숫자로 적어 주세요";return}
  c.className="res";c.innerHTML="<b>"+r.score+"/"+m+"</b> · "+r.wrong+"개 틀림 · "+(m?Math.round(r.score/m*1000)/10:0)+"%";
}

function render(){
  var cnt=unit()!=="score",keep={},flip=prevUnit&&prevUnit!==unit()&&prevUnit!=="score"&&cnt;prevUnit=unit();
  function fl(v,m){return flip&&v!==""&&!isNaN(parseFloat(v))?String(m-parseFloat(v)):v}
  $("tb").querySelectorAll("tr").forEach(function(tr){var m=rowMax(tr);keep[tr.dataset.i]={mx:tr.querySelector(".mx").value,rg:tr.querySelector(".rg").value,sc:fl(tr.querySelector(".sc").value,m),ab:tr.querySelector(".ab").checked,rt:tr.querySelector(".rt").checked,rs:fl(tr.querySelector(".rs").value,m),gr:tr.querySelector(".gr").value,grm:tr.querySelector(".gr").dataset.m,cm:tr.querySelector(".cmt").value,nt:tr.querySelector(".nt").value}});
  $("tb").innerHTML=students.map(function(s,i){
    return'<tr data-i="'+i+'"><td class="nm">'+esc(s.name)+'</td><td><input type="checkbox" class="ab" title="결시"></td>'+
    '<td class="ow2"><div class="ow"><input class="n mx" type="number" inputmode="numeric" min="1" placeholder="'+(maxv()||"")+'" title="이 학생만 '+(cnt?"문항 수":"만점")+'이 다를 때"><input class="rg" maxlength="100" placeholder="범위 (다를 때)" title="이 학생만 시험 범위·단어장이 다를 때"></div></td>'+
    '<td><input class="n sc" type="number" inputmode="'+(cnt?"numeric":"decimal")+'" min="0" step="'+(cnt?"1":"any")+'"></td>'+
    (cnt?'<td class="res"></td>':'<td><input class="n wr" type="number" inputmode="numeric" min="0"></td>')+
    '<td><input type="checkbox" class="rt"></td><td><input class="n rs" type="number" inputmode="decimal" min="0"></td>'+
    '<td><select class="gr"><option value=""></option><option>우수</option><option>양호</option><option>보통</option><option>노력 필요</option></select></td>'+
    '<td><input class="cm cmt" maxlength="200" placeholder="예: 철자 실수가 줄었어요"></td>'+
    '<td><input class="nt" maxlength="300" placeholder="예: 지각 10분, 병결 후 재응시"></td></tr>'}).join("");
  $("listCard").style.display=students.length?"":"none";$("bar").style.display=students.length?"":"none";
  var rows=$("tb").querySelectorAll("tr");
  rows.forEach(function(tr,i){
    var sc=tr.querySelector(".sc"),wr=tr.querySelector(".wr"),gr=tr.querySelector(".gr"),ab=tr.querySelector(".ab"),k=keep[i];
    var mx=tr.querySelector(".mx"),rg=tr.querySelector(".rg");
    if(k){mx.value=k.mx||"";rg.value=k.rg||"";sc.value=k.sc;ab.checked=k.ab;tr.querySelector(".rt").checked=k.rt;tr.querySelector(".rs").value=k.rs;gr.value=k.gr;if(k.grm)gr.dataset.m=1;tr.querySelector(".cmt").value=k.cm;tr.querySelector(".nt").value=k.nt;tr.className=k.ab?"skip":""}
    sc.oninput=function(){
      var m=rowMax(tr),r=calc(sc.value,m);
      if(r&&!r.bad){
        if(wr&&$("autoWrong").checked&&!wr.dataset.m)wr.value=Math.max(0,Math.round((m-r.score)*100)/100);
        if($("autoGrade").checked&&!gr.dataset.m)gr.value=suggest(r.score,m);
      }else{if(wr&&!wr.dataset.m)wr.value="";if(!gr.dataset.m)gr.value=""}
      resCell(tr);count();
    };
    mx.oninput=function(){if(sc.value!=="")sc.oninput();else resCell(tr)};rg.oninput=function(){resCell(tr)};
    if(wr)wr.oninput=function(){wr.dataset.m=1};gr.onchange=function(){gr.dataset.m=1};
    ab.onchange=function(){tr.className=ab.checked?"skip":"";count()};
    sc.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();var n=rows[i+1];if(n)n.querySelector(".sc").focus()}};
    resCell(tr);
    if(k&&sc.value!=="")sc.oninput();
  });
  count();
}
function collect(){
  var out=[],cnt=unit()!=="score";
  $("tb").querySelectorAll("tr").forEach(function(tr,i){
    if(tr.querySelector(".ab").checked)return;
    var m=rowMax(tr),r=calc(tr.querySelector(".sc").value,m);if(!r)return;
    var rs=calc(tr.querySelector(".rs").value,m);
    out.push({studentId:students[i].id,pageId:EDIT&&EDIT.pids[nid(students[i].id)]||"",name:students[i].name,max:m,range:tr.querySelector(".rg").value.trim(),score:r.score,bad:r.bad,wrong:cnt?r.wrong:tr.querySelector(".wr").value,retest:tr.querySelector(".rt").checked,
      retestScore:rs?rs.score:"",grade:tr.querySelector(".gr").value,comment:tr.querySelector(".cmt").value,note:tr.querySelector(".nt").value});
  });
  return out;
}
function count(){var n=collect().length;$("info").textContent="입력된 학생 "+n+"명 / 전체 "+students.length+"명"}
$("unit").value=ls("cm-exam-unit")||"right";if(!$("unit").value)$("unit").value="right";
if($("unit").value==="score")$("max").value="100";
$("unit").onchange=function(){var cnt=unit()!=="score";if(!cnt&&maxv()<=50)$("max").value="100";if(cnt&&maxv()===100)$("max").value="40";setUnit()};
$("max").oninput=function(){setUnit()};
document.querySelectorAll(".qk").forEach(function(b){b.onclick=function(){$("max").value=b.dataset.n;setUnit()}});
setUnit();

function paintTabs(){$("ctabs").querySelectorAll("button").forEach(function(b){b.className="sub"+(b.dataset.c===$("cls").value?" on":"")})}
// 다른 반으로 이동: 저장 안 한 입력이 있으면 한 번 물어봐요
function goClass(c){
  if(c===curCls&&students.length)return;
  if(dirty&&!confirm("저장하지 않은 입력이 있어요. 저장하지 않고 "+c+"으로 이동할까요?")){$("cls").value=curCls;paintTabs();return}
  $("cls").value=c;paintTabs();loadRoster();
}
$("cls").onchange=function(){goClass(this.value)};
function clearTable(){$("tb").innerHTML="";prevUnit=unit()}
function loadRoster(){
  var cls=$("cls").value;if(!cls)return Promise.resolve(false);ls("cm-teacher-cls",cls);
  curCls=cls;setEdit(null);clearTable();dirty=false;paintTabs();
  $("rcount").textContent="불러오는 중…";$("pastRow").style.display="none";
  return api({action:"roster",cls:cls}).then(function(j){
    if(cls!==$("cls").value)return false;
    if(!j.ok){$("rcount").textContent="";$("msg").innerHTML='<span class="er">'+esc(j.msg||"명단을 불러오지 못했어요.")+"</span>";return false}
    students=j.students||[];$("rcount").textContent=students.length?students.length+"명":"이 반에 등록된 학생이 없어요. 아래에서 추가해 주세요.";
    $("msg").textContent="";render();
    $("pinStu").innerHTML=students.map(function(s,i){return'<option value="'+i+'">'+esc(s.name)+'</option>'}).join("");
    loadPast();return true;
  });
}
$("loadBtn").onclick=function(){if(dirty&&!confirm("저장하지 않은 입력을 지우고 명단을 다시 불러올까요?"))return;loadRoster()};

// ---------- 📂 저장한 기록 다시 불러와 고치기 ----------
function md(d){var p=String(d).split("-");return p.length===3?parseInt(p[1])+"/"+parseInt(p[2]):d}
function loadPast(){
  var cls=$("cls").value;
  return api({action:"list",cls:cls}).then(function(j){
    if(cls!==$("cls").value)return;
    PAST=(j.ok&&j.exams)||[];
    if(!PAST.length){$("pastRow").style.display="none";return}
    $("pastSel").innerHTML='<option value="">— 이 반에서 저장한 시험 '+PAST.length+'개 —</option>'+PAST.map(function(e,i){return'<option value="'+i+'">'+esc(md(e.date)+" · "+e.kind+" · "+e.title)+" ("+e.n+"명"+(e.max?" · "+(e.mixed?"문항 수 여러 개":e.max+"문항"):"")+")</option>"}).join("");
    if(EDIT)PAST.forEach(function(e,i){if(e.title===EDIT.title&&e.date===EDIT.date&&e.kind===EDIT.kind)$("pastSel").value=String(i)});
    $("pastRow").style.display="";
  });
}
$("pastBtn").onclick=function(){
  var e=PAST[parseInt($("pastSel").value)];if(!e){$("msg").innerHTML='<span class="er">불러올 시험을 골라 주세요.</span>';return}
  if(dirty&&!confirm("저장하지 않은 입력이 있어요. 지우고 이 기록을 불러올까요?"))return;
  var b=$("pastBtn");b.disabled=true;b.textContent="불러오는 중…";
  api({action:"load",cls:$("cls").value,title:e.title,date:e.date,kind:e.kind}).then(function(j){
    b.disabled=false;b.textContent="불러오기";
    if(!j.ok){$("msg").innerHTML='<span class="er">'+esc(j.msg||"기록을 불러오지 못했어요.")+"</span>";return}
    fillFrom(e,j.rows||[]);
  });
};
// 불러온 기록을 화면에 채우기
function fillFrom(e,rows){
  $("kind").value=e.kind||$("kind").value;$("date").value=e.date;$("title").value=e.title;$("range").value=e.range||"";
  if(rows[0]&&rows[0].mode)$("mode").value=rows[0].mode==="온라인"?"온라인":"종이";
  if(unit()==="score"&&e.max&&e.max<=60){$("unit").value="right"}       // 개수로 기록했던 시험은 개수 방식으로
  if(e.max)$("max").value=e.max;
  var by={};rows.forEach(function(r){if(r.studentId)by[nid(r.studentId)]=r});
  rows.forEach(function(r){if(r.studentId&&!students.some(function(s){return nid(s.id)===nid(r.studentId)}))students.push({id:r.studentId,name:"(지금 명단에 없음)"})});
  clearTable();setUnit();render();
  var u=unit(),pids={};
  $("tb").querySelectorAll("tr").forEach(function(tr,i){
    var r=by[nid(students[i].id)];if(!r)return;pids[nid(students[i].id)]=r.pageId;
    var m=r.max||maxv(),cv=function(v){return v==null?"":String(u==="wrong"?Math.max(0,m-v):v)};
    if(r.max&&r.max!==maxv())tr.querySelector(".mx").value=r.max;
    if(r.range&&r.range!==(e.range||""))tr.querySelector(".rg").value=r.range;
    tr.querySelector(".sc").value=cv(r.score);
    tr.querySelector(".rt").checked=!!r.retest;tr.querySelector(".rs").value=cv(r.retestScore);
    var gr=tr.querySelector(".gr");gr.value=r.grade||"";gr.dataset.m=1;
    var wr=tr.querySelector(".wr");if(wr){wr.value=r.wrong==null?"":r.wrong;wr.dataset.m=1}
    tr.querySelector(".cmt").value=r.comment||"";tr.querySelector(".nt").value=r.note||"";
    if(tr.querySelector(".sc").value!=="")tr.querySelector(".sc").oninput();else resCell(tr);
  });
  setEdit({title:e.title,date:e.date,kind:e.kind,pids:pids});dirty=false;count();
  $("msg").innerHTML='<span class="ok">📂 '+esc(md(e.date)+" "+e.title)+" 기록 "+rows.length+"명을 불러왔어요. 고친 뒤 저장하면 그 기록이 바뀌어요.</span>";
}
function setEdit(ed){
  EDIT=ed;var bar=$("editBar");
  if(!ed){bar.style.display="none";return}
  bar.style.display="";bar.innerHTML='✏️ <span><b>'+esc(md(ed.date)+" · "+ed.title)+'</b> 기록을 고치는 중이에요. 저장하면 새로 만들지 않고 <b>이 기록이 바뀌어요</b>. 칸을 비우거나 결시로 바꾼 학생의 기록은 지워져요.</span><button type="button" class="sub" id="newExam">＋ 새 시험 입력으로</button>';
  $("newExam").onclick=function(){if(dirty&&!confirm("저장하지 않은 고친 내용이 있어요. 버리고 새 시험을 입력할까요?"))return;setEdit(null);$("title").value="";clearTable();render();dirty=false;$("pastSel").value="";$("msg").textContent=""};
}
document.addEventListener("input",function(ev){if(ev.target.closest&&ev.target.closest("#tb"))dirty=true});
document.addEventListener("change",function(ev){if(ev.target.closest&&ev.target.closest("#tb"))dirty=true});
$("addBtn").onclick=function(){
  var cls=$("cls").value,names=$("newNames").value.split(/\n|,/).map(function(x){return x.trim()}).filter(Boolean);
  if(!cls||!names.length){$("msg").innerHTML='<span class="er">반을 고르고 이름을 적어 주세요.</span>';return}
  $("addBtn").disabled=true;
  api({action:"addStudents",cls:cls,names:names}).then(function(j){
    $("addBtn").disabled=false;
    if(!j.ok){$("msg").innerHTML='<span class="er">'+esc(j.msg||"추가하지 못했어요.")+"</span>";return}
    $("msg").innerHTML='<span class="ok">'+j.added+"명 추가, "+j.skipped+"명은 이미 있어서 건너뛰었어요.</span>";
    $("newNames").value="";$("loadBtn").click();
  });
};
$("pinBtn").onclick=function(){
  var s=students[parseInt($("pinStu").value)];if(!s){$("msg").innerHTML='<span class="er">먼저 명단을 불러와 주세요.</span>';return}
  if(!confirm(s.name+" 학생의 본인번호를 초기화할까요?"))return;
  api({action:"resetPin",studentId:s.id}).then(function(j){$("msg").innerHTML=j.ok?'<span class="ok">'+esc(s.name)+" 학생 번호를 초기화했어요.</span>":'<span class="er">'+esc(j.msg||"초기화하지 못했어요.")+"</span>"});
};
function titleVal(){
  var t=$("title").value.trim();if(t)return t;
  var d=$("date").value.split("-"),rg=$("range").value.trim();
  return(d.length===3?parseInt(d[1])+"/"+parseInt(d[2])+" ":"")+$("kind").value+(rg?" · "+rg:"");
}
function save(force){
  var rows=collect(),remove=[],rmNames=[];
  if(EDIT){ // 불러온 기록 중 이번에 비었거나 결시인 학생 → 지우기
    var has={};rows.forEach(function(r){has[nid(r.studentId)]=1});
    students.forEach(function(s){var pid=EDIT.pids[nid(s.id)];if(pid&&!has[nid(s.id)]){remove.push(pid);rmNames.push(s.name)}});
  }
  if(!rows.length&&!remove.length){$("msg").innerHTML='<span class="er">입력한 학생이 없어요.</span>';return}
  if(remove.length&&!confirm(rmNames.join(", ")+" 학생은 칸이 비었거나 결시예요. 저장했던 기록을 지울까요?"))return;
  if(rows.length&&!maxv()){$("msg").innerHTML='<span class="er">'+(unit()==="score"?"만점":"전체 문항 수")+'을 숫자로 적어 주세요.</span>';return}
  var bad=rows.filter(function(r){return r.bad});
  if(bad.length&&unit()!=="score"){$("msg").innerHTML='<span class="er">'+esc(bad.map(function(r){return r.name+"(0~"+r.max+")"}).join(", "))+" — "+UL[unit()]+"가 전체 문항 수보다 크거나 0보다 작아요. 고친 뒤 저장해 주세요.</span>";return}
  if(bad.length&&!confirm(bad.map(function(r){return r.name}).join(", ")+" 의 점수가 만점보다 커요. 그래도 저장할까요?"))return;
  $("saveBtn").disabled=true;$("saveBtn").textContent="저장 중…";$("msg").textContent="";
  api({action:"save",force:!!force,cls:$("cls").value,kind:$("kind").value,date:$("date").value,title:titleVal(),range:$("range").value,maxScore:maxv()||1,mode:$("mode").value,edit:EDIT?{title:EDIT.title,date:EDIT.date}:undefined,remove:remove,rows:rows.map(function(r){var o=Object.assign({},r);delete o.bad;o.maxScore=r.max;delete o.max;return o})}).then(function(j){
    $("saveBtn").disabled=false;$("saveBtn").textContent="저장하기";
    if(j.dup){if(confirm(j.msg))save(true);return}
    if(!j.ok){$("msg").innerHTML='<span class="er">'+esc(j.msg||"저장하지 못했어요. 잠시 뒤 다시 해 주세요.")+"</span>";return}
    var m=EDIT?'<span class="ok">✅ 고친 내용을 저장했어요 — 바꿈 '+(j.updated||0)+"명"+(j.created?" · 새로 "+j.created+"명":"")+(j.removed?" · 지움 "+j.removed+"명":"")+"</span>"
      :'<span class="ok">✅ '+j.saved+"명 저장 완료! 학생별 페이지에 쌓였어요. 고칠 게 있으면 그대로 고친 뒤 다시 저장하세요.</span>";
    // 저장한 뒤에는 '이 기록을 고치는 중'으로: 다시 저장해도 중복으로 쌓이지 않아요
    var pids={};Object.keys(j.ids||{}).forEach(function(k){pids[nid(k)]=j.ids[k]});
    if(EDIT)Object.keys(EDIT.pids).forEach(function(k){if(!pids[k]&&remove.indexOf(EDIT.pids[k])<0)pids[k]=EDIT.pids[k]}); // 저장에 실패한 학생의 원래 기록도 계속 고칠 수 있게
    setEdit({title:titleVal(),date:$("date").value,kind:$("kind").value,pids:pids});dirty=false;loadPast();
    if(j.failed&&j.failed.length)m+='<br><span class="er">저장 못 한 학생: '+esc(j.failed.join(", "))+" — 다시 저장하면 이 학생들은 중복될 수 있으니, 노션에서 직접 확인해 주세요.</span>";
    $("msg").innerHTML=m;window.scrollTo(0,document.body.scrollHeight);
  }).catch(function(){$("saveBtn").disabled=false;$("saveBtn").textContent="저장하기";$("msg").innerHTML='<span class="er">인터넷 연결을 확인해 주세요.</span>'});
}
$("saveBtn").onclick=function(){save(false)};
</script></body></html>
